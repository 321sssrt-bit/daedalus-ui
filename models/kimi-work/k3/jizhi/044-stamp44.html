<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>方寸集 STAMP-44 · 集邮同好社区</title>
<style>
:root{
  --ivory:#F4EEE0;
  --red:#B03A2E;
  --blue:#2A4D8F;
  --ink:#2C2820;
  --sand:#D9CFB8;
  --card:#FCF8EE;
  --bezel:#211D16;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:#1B1811;
  display:flex;align-items:center;justify-content:center;
  padding:24px;
  font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--ink);
}
.phone{
  width:390px;min-height:844px;height:844px;
  border-radius:46px;border:10px solid var(--bezel);
  background:var(--ivory);
  overflow:hidden;display:flex;flex-direction:column;position:relative;
  box-shadow:0 30px 80px rgba(0,0,0,.5);
}
.app{flex:1;display:flex;flex-direction:column;min-height:0;background:
  repeating-linear-gradient(90deg,rgba(42,77,143,.025) 0 1px,transparent 1px 24px),
  var(--ivory)}
/* ---------- 顶部 ---------- */
.topbar{
  display:flex;align-items:center;gap:10px;padding:14px 18px 12px;
  border-bottom:2px solid var(--red);background:var(--ivory);
}
.postmark{
  width:34px;height:34px;border-radius:50%;border:2px solid var(--red);
  display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:800;color:var(--red);letter-spacing:.05em;
  transform:rotate(-8deg);
}
.topbar .brand{font-size:17px;font-weight:800;color:var(--red);letter-spacing:.1em}
.topbar .sub{margin-left:auto;font-size:11px;color:var(--blue);letter-spacing:.08em}
/* ---------- 视图 ---------- */
.view{flex:1;display:flex;flex-direction:column;min-height:0}
.view[hidden]{display:none}
/* ---------- 动态流 ---------- */
.feedHead{padding:16px 18px 6px;display:flex;align-items:baseline;gap:10px}
.feedHead h1{font-size:21px;font-weight:800;color:var(--ink)}
.feedHead .tag{font-size:11px;color:var(--blue);border:1px solid var(--blue);
  border-radius:999px;padding:3px 10px}
.feed{flex:1;overflow-y:auto;padding:10px 16px 18px;display:flex;flex-direction:column;gap:16px}
/* 邮票齿孔卡 */
.perf{
  padding:9px;border-radius:8px;
  background-color:var(--sand);
  background-image:radial-gradient(circle at 7px 7px, var(--ivory) 3.4px, rgba(0,0,0,0) 4.1px);
  background-size:16px 16px;
}
.stamp{
  background:var(--card);border:1.5px solid var(--red);border-radius:3px;
  padding:12px;display:flex;flex-direction:column;gap:9px;
}
.stamp .art{
  border:1px solid var(--sand);border-radius:2px;background:var(--ivory);
  display:flex;align-items:center;justify-content:center;padding:6px 0;
}
.stamp .ttl{font-size:15px;font-weight:800;color:var(--ink)}
.stamp .txt{font-size:13px;line-height:1.65;color:#4A4438}
.stamp .row{display:flex;align-items:center;gap:8px;font-size:11px;color:#7A7261}
.stamp .row .who{color:var(--blue);font-weight:700}
.stamp .vis{
  margin-left:auto;font-size:10px;letter-spacing:.06em;padding:2px 8px;border-radius:999px;
  border:1px solid var(--blue);color:var(--blue);
}
.stamp .vis.self{border-color:var(--red);color:var(--red)}
.stamp .acts{display:flex;gap:16px;font-size:12px;color:#7A7261;border-top:1px dashed var(--sand);padding-top:8px}
.stamp .acts b{color:var(--red);font-weight:700}
.corner{
  position:absolute;top:22px;right:22px;width:44px;height:44px;border-radius:50%;
  border:1.5px solid rgba(176,58,46,.55);color:rgba(176,58,46,.75);
  display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;
  transform:rotate(12deg);pointer-events:none;letter-spacing:.04em;
}
.post{position:relative}
/* ---------- 底部入口 ---------- */
.bottomBar{
  padding:12px 16px 16px;border-top:2px solid var(--red);background:var(--ivory);
}
.composeBtn{
  width:100%;border:none;border-radius:12px;background:var(--red);color:var(--ivory);
  font-size:15px;font-weight:800;letter-spacing:.2em;padding:13px 0;cursor:pointer;
  transition:filter .18s,transform .12s;
}
.composeBtn:hover{filter:brightness(1.08)}
.composeBtn:active{transform:scale(.98)}
/* ---------- 编辑页 ---------- */
.composeHead{
  display:flex;align-items:center;gap:12px;padding:14px 16px;
  border-bottom:2px solid var(--red);background:var(--ivory);
}
.cancelBtn{
  border:1px solid var(--blue);background:transparent;color:var(--blue);
  border-radius:10px;padding:7px 12px;font-size:13px;cursor:pointer;transition:background .18s;
}
.cancelBtn:hover{background:rgba(42,77,143,.1)}
.composeHead .t{font-size:16px;font-weight:800;letter-spacing:.12em;color:var(--ink)}
.composeBody{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:16px}
.field label.lab{display:block;font-size:12px;font-weight:700;color:var(--blue);letter-spacing:.1em;margin-bottom:8px}
.draftArea{
  width:100%;min-height:150px;resize:vertical;background:var(--card);
  border:1.5px solid var(--sand);border-radius:10px;padding:12px 14px;
  font-size:14px;line-height:1.7;color:var(--ink);outline:none;
  font-family:inherit;transition:border-color .18s;
}
.draftArea:focus{border-color:var(--blue)}
.draftArea::placeholder{color:#A79C85}
.visGroup{display:flex;gap:10px}
.visOpt{flex:1;position:relative}
.visOpt input{position:absolute;inset:0;opacity:0;cursor:pointer;z-index:2}
.visOpt .card{
  border:1.5px dashed var(--sand);border-radius:10px;background:var(--card);
  padding:10px 8px;text-align:center;transition:border-color .18s,background .18s;
}
.visOpt .card .n{font-size:13px;font-weight:800;color:var(--ink)}
.visOpt .card .d{font-size:10px;color:#7A7261;margin-top:3px}
.visOpt input:checked + .card{border:2px solid var(--red);background:#FBF3E2;border-style:solid}
.visOpt input:checked + .card .n{color:var(--red)}
.visOpt input:focus-visible + .card{outline:2px solid var(--blue);outline-offset:2px}
.faultRow{
  display:flex;align-items:center;gap:10px;padding:11px 14px;
  border:1.5px dashed var(--sand);border-radius:10px;background:var(--card);
}
.faultRow .lab{font-size:13px;font-weight:700;color:var(--ink)}
.faultRow .hint{font-size:11px;color:#7A7261;margin-top:2px}
.switch{position:relative;width:46px;height:26px;flex:0 0 auto;margin-left:auto}
.switch input{position:absolute;inset:0;opacity:0;cursor:pointer;z-index:2}
.switch .track{
  position:absolute;inset:0;border-radius:13px;background:var(--sand);transition:background .2s;
}
.switch .knob{
  position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;
  background:var(--card);border:1px solid var(--sand);transition:left .2s,background .2s;
}
.switch input:checked + .track{background:var(--red)}
.switch input:checked + .track + .knob{left:23px;background:var(--ivory);border-color:var(--red)}
.switch input:focus-visible + .track{outline:2px solid var(--blue);outline-offset:2px}
.banner{
  display:none;border:1.5px solid var(--red);border-radius:10px;background:#F9E9E4;
  padding:12px 14px;font-size:13px;line-height:1.6;color:var(--red);
}
.banner.show{display:block}
.banner b{font-weight:800}
.composeFoot{padding:12px 16px 16px;border-top:2px solid var(--red);background:var(--ivory)}
.publishBtn{
  width:100%;border:none;border-radius:12px;background:var(--blue);color:var(--ivory);
  font-size:15px;font-weight:800;letter-spacing:.2em;padding:13px 0;cursor:pointer;
  transition:filter .18s,transform .12s;
}
.publishBtn:hover{filter:brightness(1.12)}
.publishBtn:active{transform:scale(.98)}
.publishBtn:disabled{background:#9AA6BC;cursor:not-allowed;filter:none}
.publishBtn.err{background:var(--red)}
/* ---------- 提示 ---------- */
.toast{
  position:absolute;left:50%;bottom:96px;transform:translateX(-50%) translateY(8px);
  background:var(--ink);color:var(--ivory);border:1px solid var(--sand);
  font-size:12px;padding:9px 16px;border-radius:999px;letter-spacing:.05em;
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:9;white-space:nowrap;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion: reduce){
  *{transition-duration:.01ms !important;animation-duration:.01ms !important;animation-iteration-count:1 !important}
}
</style>
</head>
<body>
<div class="phone">
  <div class="app" id="app">
    <div class="topbar">
      <span class="postmark">邮</span>
      <span class="brand">方寸集</span>
      <span class="sub">STAMP-44 · 集邮同好社区</span>
    </div>

    <!-- 动态流视图 -->
    <section class="view" id="viewFeed">
      <div class="feedHead">
        <h1>同好动态</h1>
        <span class="tag">今日新邮 3 枚</span>
      </div>
      <div class="feed" id="feed"></div>
      <div class="bottomBar">
        <button class="composeBtn" id="composeBtn" type="button">＋ 晒一枚新邮</button>
      </div>
    </section>

    <!-- 编辑发布视图 -->
    <section class="view" id="viewCompose" hidden>
      <div class="composeHead">
        <button class="cancelBtn" id="cancelBtn" type="button">‹ 返回</button>
        <span class="t">寄出新动态</span>
      </div>
      <div class="composeBody">
        <div class="field">
          <label class="lab" for="draftArea">邮品描述</label>
          <textarea class="draftArea" id="draftArea" placeholder="写下这枚邮票的来历、品相与故事…"></textarea>
        </div>
        <div class="field">
          <label class="lab">可见范围</label>
          <div class="visGroup">
            <label class="visOpt">
              <input type="radio" name="vis" value="公开" id="visPub" checked>
              <span class="card"><span class="n">公开</span><span class="d" style="display:block">所有同好可见</span></span>
            </label>
            <label class="visOpt">
              <input type="radio" name="vis" value="仅同好" id="visFriend">
              <span class="card"><span class="n">仅同好</span><span class="d" style="display:block">互相关注可见</span></span>
            </label>
            <label class="visOpt">
              <input type="radio" name="vis" value="仅自己" id="visSelf">
              <span class="card"><span class="n">仅自己</span><span class="d" style="display:block">私密存档</span></span>
            </label>
          </div>
        </div>
        <div class="faultRow">
          <div>
            <div class="lab">模拟网络故障</div>
            <div class="hint">开启后，下一次发布将失败</div>
          </div>
          <label class="switch">
            <input type="checkbox" id="faultSwitch">
            <span class="track"></span>
            <span class="knob"></span>
          </label>
        </div>
        <div class="banner" id="banner">
          <b>发布未完成：</b>检测到网络故障，本条动态未能寄出。草稿与可见范围已完整保留，恢复网络后点击「重新盖戳发布」即可。
        </div>
      </div>
      <div class="composeFoot">
        <button class="publishBtn" id="publishBtn" type="button" disabled>盖戳发布</button>
      </div>
    </section>

    <div class="toast" id="toast"></div>
  </div>
</div>

<script>
/* ============ 数据 ============ */
var POSTS = [
  {
    title: "庚申年金猴整版，终于圆梦",
    txt: "跑了三年邮市，今天收下整版 80 枚金猴，齿孔完整、原胶未贴。灯下看金粉还亮，发出来与同好共赏。",
    who: "北平邮痴", time: "今天 09:20", vis: "公开", likes: 46, comments: 12,
    art: "monkey"
  },
  {
    title: "蓝军邮实寄封，品相九品",
    txt: "1953 年蓝军邮实寄封一枚，邮戳清晰可辨，封背有收件人落款。仅与同好交流，暂不出让。",
    who: "岭南小邮差", time: "昨天 21:05", vis: "仅同好", likes: 18, comments: 6,
    art: "envelope"
  },
  {
    title: "黄山云海纪念张首日封",
    txt: "首发日排队三小时盖到的原地戳，云海图案印刷层次分明，齿孔无一残损。",
    who: "江南集邮客", time: "周三 15:40", vis: "公开", likes: 27, comments: 9,
    art: "mountain"
  }
];

/* ============ 元素 ============ */
var viewFeed = document.getElementById("viewFeed");
var viewCompose = document.getElementById("viewCompose");
var feed = document.getElementById("feed");
var composeBtn = document.getElementById("composeBtn");
var cancelBtn = document.getElementById("cancelBtn");
var draftArea = document.getElementById("draftArea");
var faultSwitch = document.getElementById("faultSwitch");
var publishBtn = document.getElementById("publishBtn");
var banner = document.getElementById("banner");
var toast = document.getElementById("toast");
var toastTimer = null;
var failedOnce = false;

/* ============ 工具 ============ */
function showToast(text){
  toast.textContent = text;
  toast.classList.add("show");
  if(toastTimer){ clearTimeout(toastTimer); }
  toastTimer = setTimeout(function(){ toast.classList.remove("show"); }, 2200);
}
function nowLabel(){
  var d = new Date();
  var h = ("0" + d.getHours()).slice(-2);
  var m = ("0" + d.getMinutes()).slice(-2);
  return "今天 " + h + ":" + m;
}
function currentVis(){
  var opts = document.getElementsByName("vis");
  for(var i = 0; i < opts.length; i++){
    if(opts[i].checked){ return opts[i].value; }
  }
  return "公开";
}

/* ============ 邮票图案 ============ */
function artSVG(kind){
  if(kind === "monkey"){
    return "<svg viewBox='0 0 220 90' width='200' height='82' aria-hidden='true'>" +
      "<rect x='6' y='6' width='208' height='78' fill='#FCF8EE' stroke='#B03A2E'/>" +
      "<circle cx='110' cy='40' r='24' fill='#E8B54A'/>" +
      "<circle cx='101' cy='36' r='3' fill='#2C2820'/><circle cx='119' cy='36' r='3' fill='#2C2820'/>" +
      "<path d='M100 50 Q110 58 120 50' stroke='#2C2820' stroke-width='2' fill='none'/>" +
      "<text x='20' y='24' font-size='12' fill='#B03A2E' font-weight='bold'>庚申年</text>" +
      "<text x='168' y='76' font-size='12' fill='#B03A2E' font-weight='bold'>8分</text></svg>";
  }
  if(kind === "envelope"){
    return "<svg viewBox='0 0 220 90' width='200' height='82' aria-hidden='true'>" +
      "<rect x='20' y='14' width='180' height='62' fill='#FCF8EE' stroke='#2A4D8F'/>" +
      "<path d='M20 14 L110 52 L200 14' stroke='#2A4D8F' fill='none'/>" +
      "<circle cx='178' cy='30' r='12' fill='none' stroke='#B03A2E' stroke-width='2'/>" +
      "<path d='M166 30 L190 30 M172 24 L184 36 M172 36 L184 24' stroke='#B03A2E' stroke-width='1'/>" +
      "<text x='30' y='66' font-size='11' fill='#2A4D8F'>军邮 · 1953</text></svg>";
  }
  return "<svg viewBox='0 0 220 90' width='200' height='82' aria-hidden='true'>" +
    "<rect x='6' y='6' width='208' height='78' fill='#FCF8EE' stroke='#2A4D8F'/>" +
    "<path d='M20 76 L70 30 L100 58 L140 22 L200 76 Z' fill='#2A4D8F' opacity='0.85'/>" +
    "<circle cx='168' cy='26' r='10' fill='#B03A2E'/>" +
    "<path d='M30 44 Q50 36 70 44 M120 40 Q145 32 170 40' stroke='#D9CFB8' stroke-width='3' fill='none'/>" +
    "<text x='16' y='24' font-size='11' fill='#2C2820'>黄山云海</text></svg>";
}

/* ============ 动态流渲染 ============ */
function renderFeed(){
  feed.innerHTML = "";
  POSTS.forEach(function(p){
    var node = document.createElement("article");
    node.className = "post";
    var visCls = p.vis === "仅自己" ? "vis self" : "vis";
    node.innerHTML =
      "<div class='perf'><div class='stamp'>" +
        "<div class='art'>" + artSVG(p.art) + "</div>" +
        "<div class='ttl'>" + p.title + "</div>" +
        "<div class='txt'>" + p.txt + "</div>" +
        "<div class='row'><span class='who'>" + p.who + "</span><span>" + p.time + "</span>" +
          "<span class='" + visCls + "'>" + p.vis + "</span></div>" +
        "<div class='acts'><span>赞 <b>" + p.likes + "</b></span><span>评论 <b>" + p.comments + "</b></span></div>" +
      "</div></div>" +
      (p.mine ? "<span class='corner'>已盖戳</span>" : "");
    feed.appendChild(node);
  });
}

/* ============ 视图切换 ============ */
composeBtn.addEventListener("click", function(){
  viewFeed.hidden = true;
  viewCompose.hidden = false;
  draftArea.focus();
});
cancelBtn.addEventListener("click", function(){
  viewCompose.hidden = true;
  viewFeed.hidden = false;
  renderFeed();
});

/* ============ 输入与发布 ============ */
draftArea.addEventListener("input", function(){
  publishBtn.disabled = draftArea.value.trim().length === 0;
});
faultSwitch.addEventListener("change", function(){
  if(faultSwitch.checked){
    showToast("已开启模拟网络故障：本次发布将失败");
  }else{
    showToast("网络已恢复，可以重新发布");
  }
});
publishBtn.addEventListener("click", function(){
  var text = draftArea.value.trim();
  if(!text){ return; }
  var vis = currentVis();
  if(faultSwitch.checked){
    /* 发布失败：保留草稿与可见范围 */
    failedOnce = true;
    banner.classList.add("show");
    publishBtn.textContent = "重新盖戳发布";
    publishBtn.classList.add("err");
    showToast("发布未完成：草稿已保留");
    return;
  }
  /* 发布成功：写入动态流顶部 */
  var firstLine = text.split("\n")[0];
  var title = firstLine.length > 14 ? firstLine.slice(0, 14) + "…" : firstLine;
  POSTS.unshift({
    title: title,
    txt: text,
    who: "我",
    time: nowLabel(),
    vis: vis,
    likes: 0,
    comments: 0,
    art: "mountain",
    mine: true
  });
  draftArea.value = "";
  publishBtn.disabled = true;
  publishBtn.textContent = "盖戳发布";
  publishBtn.classList.remove("err");
  banner.classList.remove("show");
  failedOnce = false;
  var pub = document.getElementById("visPub");
  if(pub){ pub.checked = true; }
  viewCompose.hidden = true;
  viewFeed.hidden = false;
  renderFeed();
  showToast("已盖戳，动态发布成功");
});

/* ============ 初始化 ============ */
renderFeed();
</script>
</body>
</html>
