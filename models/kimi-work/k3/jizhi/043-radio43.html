<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>电波 RADIO-43 · 野战即时通讯</title>
<style>
:root{
  --olive:#262B21;
  --sage:#9DB17C;
  --amber:#E8B54A;
  --paper:#E8EBDD;
  --coal:#15180F;
  --bezel:#0B0D08;
  --panel:#1D2119;
  --line:rgba(157,177,124,.28);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--coal);
  display:flex;align-items:center;justify-content:center;
  padding:24px;
  font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--paper);
}
.mono{font-family:"SF Mono",Consolas,"Courier New",monospace}
.phone{
  width:390px;min-height:844px;height:844px;
  border-radius:46px;border:10px solid var(--bezel);
  background:var(--olive);
  overflow:hidden;display:flex;flex-direction:column;
  box-shadow:0 30px 80px rgba(0,0,0,.55);
}
.app{flex:1;display:flex;flex-direction:column;min-height:0;background:
  repeating-linear-gradient(0deg,rgba(232,235,221,.018) 0 2px,transparent 2px 4px),
  var(--olive)}
/* ---------- 顶部电台条 ---------- */
.topbar{
  display:flex;align-items:center;gap:10px;
  padding:14px 18px 10px;border-bottom:1px solid var(--line);
  background:rgba(21,24,15,.5);
}
.topbar .brand{font-size:13px;letter-spacing:.18em;color:var(--amber);font-weight:700}
.topbar .freq{margin-left:auto;font-size:11px;color:var(--sage);letter-spacing:.08em}
.wave{flex:0 0 auto}
.wave path{stroke:var(--amber);stroke-width:2;fill:none;
  stroke-dasharray:6 4;animation:waveMove 1.6s linear infinite}
.app.off .wave path{stroke:#8a5a3a;animation:none}
@keyframes waveMove{to{stroke-dashoffset:-20}}
/* ---------- 视图通用 ---------- */
.view{flex:1;display:flex;flex-direction:column;min-height:0}
.view[hidden]{display:none}
/* ---------- 频道列表 ---------- */
.listHead{padding:18px 18px 8px;display:flex;align-items:baseline;gap:10px}
.listHead h1{font-size:22px;font-weight:800;letter-spacing:.06em}
.listHead .count{font-size:12px;color:var(--sage)}
.chanList{flex:1;overflow-y:auto;padding:6px 12px 16px;display:flex;flex-direction:column;gap:10px}
.chan{
  display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;
  padding:12px 14px;border:1px solid var(--line);border-radius:14px;
  background:var(--panel);cursor:pointer;transition:border-color .18s,transform .18s;
}
.chan:hover{border-color:var(--amber)}
.chan:active{transform:scale(.985)}
.chan .sig{
  width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  background:var(--coal);border:1px solid var(--line);color:var(--sage);font-size:11px;font-weight:700;
}
.chan .name{font-size:15px;font-weight:700}
.chan .call{font-size:11px;color:var(--amber);letter-spacing:.14em;margin-top:2px}
.chan .last{font-size:12px;color:rgba(232,235,221,.62);margin-top:4px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:180px}
.chan .side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.chan .time{font-size:11px;color:var(--sage)}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--amber);
  color:var(--coal);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
.badge.zero{display:none}
/* ---------- 会话页 ---------- */
.chatHead{
  display:flex;align-items:center;gap:10px;padding:12px 14px;
  border-bottom:1px solid var(--line);background:rgba(21,24,15,.5);
}
.backBtn{
  border:1px solid var(--line);background:var(--coal);color:var(--paper);
  border-radius:10px;padding:7px 12px;font-size:13px;cursor:pointer;transition:border-color .18s;
}
.backBtn:hover{border-color:var(--amber)}
.chatMeta{min-width:0}
.chatMeta .call{font-size:15px;font-weight:800;color:var(--amber);letter-spacing:.14em}
.chatMeta .name{font-size:11px;color:rgba(232,235,221,.62);margin-top:1px}
.netBox{margin-left:auto;display:flex;align-items:center;gap:8px}
.netBox .lbl{font-size:11px;color:var(--sage)}
.switch{position:relative;width:46px;height:26px;flex:0 0 auto}
.switch input{position:absolute;inset:0;opacity:0;cursor:pointer;z-index:2}
.switch .track{
  position:absolute;inset:0;border-radius:13px;background:var(--coal);
  border:1px solid var(--line);transition:background .2s,border-color .2s;
}
.switch .knob{
  position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;
  background:var(--sage);transition:left .2s,background .2s;
}
.switch input:checked + .track{background:#3A2416;border-color:var(--amber)}
.switch input:checked + .track + .knob{left:23px;background:var(--amber)}
.switch input:focus-visible + .track{outline:2px solid var(--amber);outline-offset:2px}
.netState{padding:8px 14px;font-size:12px;letter-spacing:.05em;border-bottom:1px solid var(--line);
  color:var(--sage);background:rgba(21,24,15,.3)}
.app.off .netState{color:var(--amber)}
.msgScroll{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:78%;display:flex;flex-direction:column;gap:4px}
.msg .bubble{
  padding:10px 13px;border-radius:4px 14px 14px 14px;font-size:14px;line-height:1.55;
  background:#313828;border:1px solid var(--line);word-break:break-word;
}
.msg .meta{font-size:10px;color:rgba(232,235,221,.5);letter-spacing:.06em}
.msg.me{align-self:flex-end;align-items:flex-end}
.msg.me .bubble{
  border-radius:14px 4px 14px 14px;background:#3A4128;border-color:var(--sage);color:var(--paper);
}
.msg.me .meta{color:var(--sage)}
.msg.fail .bubble{border-color:var(--amber);background:#3D2F16}
.msg.fail .meta{color:var(--amber)}
.retryBtn{
  align-self:flex-end;border:1px dashed var(--amber);background:transparent;color:var(--amber);
  font-size:12px;padding:5px 12px;border-radius:8px;cursor:pointer;transition:background .18s;
}
.retryBtn:hover{background:rgba(232,181,74,.14)}
.sysLine{align-self:center;font-size:11px;color:var(--sage);letter-spacing:.1em;
  border:1px dashed var(--line);border-radius:999px;padding:4px 14px}
/* ---------- 输入条 ---------- */
.inputBar{
  display:flex;gap:10px;padding:12px 14px 16px;border-top:1px solid var(--line);
  background:rgba(21,24,15,.6);
}
.inputBar input{
  flex:1;min-width:0;background:var(--coal);border:1px solid var(--line);border-radius:12px;
  color:var(--paper);font-size:14px;padding:11px 14px;outline:none;transition:border-color .18s;
}
.inputBar input::placeholder{color:rgba(232,235,221,.35)}
.inputBar input:focus{border-color:var(--amber)}
.sendBtn{
  border:none;border-radius:12px;background:var(--amber);color:var(--coal);
  font-size:14px;font-weight:800;padding:0 20px;cursor:pointer;letter-spacing:.08em;
  transition:filter .18s,transform .12s;
}
.sendBtn:hover{filter:brightness(1.1)}
.sendBtn:active{transform:scale(.96)}
.sendBtn:disabled{background:#5a5136;color:rgba(232,235,221,.4);cursor:not-allowed;filter:none}
/* ---------- 提示 ---------- */
.toast{
  position:absolute;left:50%;bottom:96px;transform:translateX(-50%) translateY(8px);
  background:var(--coal);border:1px solid var(--amber);color:var(--amber);
  font-size:12px;padding:9px 16px;border-radius:999px;letter-spacing:.05em;
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:9;white-space:nowrap;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.phone{position:relative}
@media (prefers-reduced-motion: reduce){
  .wave path{animation:none}
  *{transition-duration:.01ms !important;animation-duration:.01ms !important;animation-iteration-count:1 !important}
}
</style>
</head>
<body>
<div class="phone">
  <div class="app" id="app">
    <div class="topbar">
      <svg class="wave" viewBox="0 0 64 20" width="52" height="18" aria-hidden="true">
        <path d="M2 10 H10 V4 H18 V16 H26 V4 H34 V16 H42 V10 H50 V6 H62"></path>
      </svg>
      <span class="brand mono">电波 RADIO-43</span>
      <span class="freq mono">UHF 446.2 · 加密信道</span>
    </div>

    <!-- 频道列表视图 -->
    <section class="view" id="viewList">
      <div class="listHead">
        <h1>通讯频道</h1>
        <span class="count mono" id="chanCount">3 个在线频道</span>
      </div>
      <div class="chanList" id="chanList"></div>
    </section>

    <!-- 会话视图 -->
    <section class="view" id="viewChat" hidden>
      <div class="chatHead">
        <button class="backBtn" id="backBtn" type="button">◀ 频道</button>
        <div class="chatMeta">
          <div class="call mono" id="chatCall">LYNX-02</div>
          <div class="name" id="chatName">山猫哨所</div>
        </div>
        <div class="netBox">
          <span class="lbl">模拟断网</span>
          <label class="switch">
            <input type="checkbox" id="netSwitch">
            <span class="track"></span>
            <span class="knob"></span>
          </label>
        </div>
      </div>
      <div class="netState mono" id="netState">LINK OK · 信号强度 86%</div>
      <div class="msgScroll" id="msgScroll"></div>
      <div class="inputBar">
        <input id="msgInput" type="text" placeholder="输入电文，回车发送" autocomplete="off">
        <button class="sendBtn" id="sendBtn" type="button" disabled>发送</button>
      </div>
    </section>

    <div class="toast" id="toast"></div>
  </div>
</div>

<script>
/* ============ 数据 ============ */
var CHANNELS = {
  lynx: {
    call: "LYNX-02", name: "山猫哨所", unread: 2,
    msgs: [
      {from: "them", text: "山猫呼叫电波，03 号点位风速 6 级，能见度下降，请求确认值守状态。", time: "14:28", status: "done"},
      {from: "me",   text: "电波收到，03 点位风速已记录，保持每 15 分钟一次回报。", time: "14:29", status: "done"},
      {from: "them", text: "收到，03 号点位风速降至 4 级。", time: "14:32", status: "done"}
    ]
  },
  rock: {
    call: "ROCK-00", name: "磐石指挥所", unread: 0,
    msgs: [
      {from: "them", text: "各单位注意，今晚 22:00 例行频道切换至 B 组，切换前完成电文清零。", time: "13:05", status: "done"},
      {from: "me",   text: "电波明白，22:00 前完成清零并回报。", time: "13:07", status: "done"}
    ]
  },
  nite: {
    call: "NITE-07", name: "夜莺侦察组", unread: 5,
    msgs: [
      {from: "them", text: "热信号确认，坐标已同步至图台。", time: "11:48", status: "done"},
      {from: "them", text: "请求电波在整点时复核一次北向通道静默。", time: "11:49", status: "done"}
    ]
  }
};
var currentChan = null;
var seq = 0;

/* ============ 元素 ============ */
var app = document.getElementById("app");
var viewList = document.getElementById("viewList");
var viewChat = document.getElementById("viewChat");
var chanList = document.getElementById("chanList");
var chatCall = document.getElementById("chatCall");
var chatName = document.getElementById("chatName");
var netSwitch = document.getElementById("netSwitch");
var netState = document.getElementById("netState");
var msgScroll = document.getElementById("msgScroll");
var msgInput = document.getElementById("msgInput");
var sendBtn = document.getElementById("sendBtn");
var backBtn = document.getElementById("backBtn");
var toast = document.getElementById("toast");
var toastTimer = null;

/* ============ 工具 ============ */
function nowTime(){
  var d = new Date();
  var h = ("0" + d.getHours()).slice(-2);
  var m = ("0" + d.getMinutes()).slice(-2);
  return h + ":" + m;
}
function showToast(text){
  toast.textContent = text;
  toast.classList.add("show");
  if(toastTimer){ clearTimeout(toastTimer); }
  toastTimer = setTimeout(function(){ toast.classList.remove("show"); }, 2200);
}
function lastOf(ch){
  var m = ch.msgs[ch.msgs.length - 1];
  if(m.status === "fail"){ return "[发送失败] " + m.text; }
  if(m.status === "sending"){ return "[发送中…] " + m.text; }
  return m.text;
}

/* ============ 频道列表渲染 ============ */
function renderList(){
  chanList.innerHTML = "";
  Object.keys(CHANNELS).forEach(function(key){
    var ch = CHANNELS[key];
    var last = ch.msgs[ch.msgs.length - 1];
    var item = document.createElement("div");
    item.className = "chan";
    item.setAttribute("role", "button");
    item.innerHTML =
      "<div class='sig mono'>" + ch.call.slice(0, 4) + "</div>" +
      "<div>" +
        "<div class='name'>" + ch.name + "</div>" +
        "<div class='call mono'>" + ch.call + "</div>" +
        "<div class='last'>" + lastOf(ch) + "</div>" +
      "</div>" +
      "<div class='side'>" +
        "<span class='time mono'>" + last.time + "</span>" +
        "<span class='badge" + (ch.unread ? "" : " zero") + "'>" + ch.unread + "</span>" +
      "</div>";
    item.addEventListener("click", function(){ openChat(key); });
    chanList.appendChild(item);
  });
}

/* ============ 会话渲染 ============ */
function statusText(st){
  if(st === "sending"){ return "发送中…"; }
  if(st === "fail"){ return "发送失败"; }
  return "已送达 ✓";
}
function renderMsgs(){
  var ch = CHANNELS[currentChan];
  msgScroll.innerHTML = "";
  var line = document.createElement("div");
  line.className = "sysLine mono";
  line.textContent = "已接入 " + ch.call + " 加密链路";
  msgScroll.appendChild(line);
  ch.msgs.forEach(function(m, idx){
    msgScroll.appendChild(buildMsgNode(m, idx));
  });
  msgScroll.scrollTop = msgScroll.scrollHeight;
}
function buildMsgNode(m, idx){
  var wrap = document.createElement("div");
  wrap.className = "msg" + (m.from === "me" ? " me" : "") + (m.status === "fail" ? " fail" : "");
  var metaRight = "";
  if(m.from === "me"){
    metaRight = " · " + statusText(m.status);
  }
  wrap.innerHTML =
    "<div class='bubble'>" + m.text + "</div>" +
    "<div class='meta mono'>" + m.time + metaRight + "</div>";
  if(m.from === "me" && m.status === "fail"){
    var btn = document.createElement("button");
    btn.className = "retryBtn";
    btn.type = "button";
    btn.textContent = "↻ 重试发送";
    btn.addEventListener("click", function(){ retryMsg(idx); });
    wrap.appendChild(btn);
  }
  return wrap;
}

/* ============ 视图切换 ============ */
function openChat(key){
  currentChan = key;
  var ch = CHANNELS[key];
  ch.unread = 0;
  chatCall.textContent = ch.call;
  chatName.textContent = ch.name;
  renderMsgs();
  renderList();
  viewList.hidden = true;
  viewChat.hidden = false;
  msgInput.focus();
}
function backToList(){
  viewChat.hidden = true;
  viewList.hidden = false;
  renderList();
}
backBtn.addEventListener("click", backToList);

/* ============ 断网开关 ============ */
netSwitch.addEventListener("change", function(){
  if(netSwitch.checked){
    app.classList.add("off");
    netState.textContent = "LINK LOST · 信号中断 · 消息将发送失败";
    showToast("已开启模拟断网：下一条消息将发送失败");
  }else{
    app.classList.remove("off");
    netState.textContent = "LINK OK · 信号强度 86%";
    showToast("已恢复网络，可正常发送");
  }
});

/* ============ 发送与重试 ============ */
function pushMsg(m){
  var ch = CHANNELS[currentChan];
  ch.msgs.push(m);
  renderMsgs();
  renderList();
  return ch.msgs.length - 1;
}
function settleMsg(idx){
  var ch = CHANNELS[currentChan];
  var m = ch.msgs[idx];
  if(!m){ return; }
  if(netSwitch.checked){
    m.status = "fail";
    showToast("发送失败：信号中断，电文已保留");
  }else{
    m.status = "done";
  }
  renderMsgs();
  renderList();
}
function sendMsg(){
  var text = msgInput.value.trim();
  if(!text){ return; }
  var m = {from: "me", text: text, time: nowTime(), status: "sending"};
  msgInput.value = "";
  sendBtn.disabled = true;
  var idx = pushMsg(m);
  setTimeout(function(){ settleMsg(idx); }, 800);
}
function retryMsg(idx){
  var ch = CHANNELS[currentChan];
  var m = ch.msgs[idx];
  if(!m || m.status !== "fail"){ return; }
  m.status = "sending";
  m.time = nowTime();
  renderMsgs();
  setTimeout(function(){
    if(netSwitch.checked){
      m.status = "fail";
      showToast("重试仍失败：信号中断中");
    }else{
      m.status = "done";
      showToast("重发成功，电文已送达");
    }
    renderMsgs();
    renderList();
  }, 800);
}
sendBtn.addEventListener("click", sendMsg);
msgInput.addEventListener("input", function(){
  sendBtn.disabled = msgInput.value.trim().length === 0;
});
msgInput.addEventListener("keydown", function(e){
  if(e.key === "Enter" && !sendBtn.disabled){ sendMsg(); }
});

/* ============ 初始化 ============ */
renderList();
</script>
</body>
</html>
