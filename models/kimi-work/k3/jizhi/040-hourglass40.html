<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>候茶工坊 · 订单处理中</title>
<style>
:root{
  --cream:#F2EDE4;
  --wood:#8A6B4A;
  --ink:#3A3128;
  --muted:#8B8073;
  --kaki:#A8502E;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:#26201A;padding:24px 12px;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  color:var(--ink);
}
.phone{
  width:390px;min-height:844px;flex:none;position:relative;overflow:hidden;
  border-radius:44px;border:10px solid #171310;background:var(--cream);
  box-shadow:0 40px 90px rgba(0,0,0,.6);
  display:flex;flex-direction:column;
}
.head{
  flex:none;padding:24px 24px 14px;display:flex;justify-content:space-between;align-items:flex-start;
  border-bottom:1px solid #E0D7C6;
}
.head h1{font-size:19px;letter-spacing:2px}
.head .no{font-size:11px;color:var(--muted);margin-top:5px;letter-spacing:1px}
.steam{font-size:22px;animation:breath 4s ease-in-out infinite}
@keyframes breath{0%,100%{opacity:.45;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
.main{flex:1;overflow-y:auto;padding:22px 24px 20px;display:flex;flex-direction:column}
.bigState{text-align:center;margin:6px 0 4px}
.bigState h2{font-size:26px;font-weight:800;letter-spacing:3px}
.bigState p{font-size:13px;color:var(--muted);margin-top:8px;letter-spacing:1px}
.eta{
  margin:16px auto 4px;background:#FFFDF8;
  border:1px solid #E0D7C6;border-radius:999px;padding:9px 20px;
  font-size:13px;color:var(--ink);letter-spacing:1px;text-align:center;
}
.eta b{color:var(--kaki);font-family:ui-monospace,"Courier New",Menlo,Consolas,monospace}
.steps{margin:26px 0 10px}
.stepLine{
  display:flex;justify-content:space-between;position:relative;margin-bottom:6px;
}
.stepLine::before{
  content:"";position:absolute;left:20px;right:20px;top:11px;height:2px;background:#DDD3BF;z-index:0;
}
.step{
  position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:8px;flex:1;
}
.step .dot{
  width:22px;height:22px;border-radius:50%;background:var(--cream);
  border:2px solid #C9BCA4;display:flex;align-items:center;justify-content:center;
  font-size:11px;color:var(--muted);
}
.step.done .dot{background:var(--wood);border-color:var(--wood);color:var(--cream)}
.step.now .dot{background:var(--kaki);border-color:var(--kaki);color:var(--cream);animation:breath 3s ease-in-out infinite}
.step .nm{font-size:11px;color:var(--muted);letter-spacing:1px}
.step.done .nm{color:var(--wood)}
.step.now .nm{color:var(--kaki);font-weight:700}
.barWrap{margin:18px 0 6px}
.barTrack{height:8px;border-radius:999px;background:#E4DAC8;overflow:hidden}
.barFill{
  height:100%;width:42%;border-radius:999px;
  background:linear-gradient(90deg,var(--wood),var(--kaki));
  transition:width 1.2s ease;animation:breath 4.5s ease-in-out infinite;
}
.barMeta{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:8px}
.sandNote{
  display:flex;justify-content:center;gap:6px;margin:14px 0 4px;
}
.sandNote i{
  width:6px;height:6px;border-radius:50%;background:var(--wood);
  animation:drop 2.1s ease-in infinite;
}
.sandNote i:nth-child(2){animation-delay:.35s}
.sandNote i:nth-child(3){animation-delay:.7s}
@keyframes drop{0%,100%{transform:translateY(-4px);opacity:.3}50%{transform:translateY(4px);opacity:1}}
.sideActs{display:flex;gap:12px;margin-top:auto;padding-top:20px}
.btnAside{
  flex:1;font:inherit;font-size:14px;letter-spacing:2px;cursor:pointer;
  background:transparent;color:var(--ink);border:1.5px solid var(--wood);border-radius:10px;padding:13px 0;
  transition:background .15s ease;
}
.btnAside:hover{background:#E9E1D2}
.btnAside:focus-visible{outline:2px solid var(--kaki);outline-offset:2px}
.btnCancel{
  flex:1;font:inherit;font-size:14px;letter-spacing:2px;cursor:pointer;
  background:transparent;color:var(--kaki);border:1.5px solid var(--kaki);border-radius:10px;padding:13px 0;
  transition:background .15s ease;
}
.btnCancel:hover{background:rgba(168,80,46,.08)}
.btnCancel:focus-visible{outline:2px solid var(--kaki);outline-offset:2px}
.confirmBar{
  display:none;margin-top:14px;background:#FFFDF8;border:1.5px solid var(--kaki);
  border-radius:12px;padding:14px 16px;
}
.confirmBar.on{display:block}
.confirmBar p{font-size:13px;line-height:1.8}
.confirmBar .row{display:flex;gap:10px;margin-top:10px}
.confirmBar button{
  flex:1;font:inherit;font-size:13px;padding:9px 0;border-radius:8px;cursor:pointer;letter-spacing:1px;
}
.cfYes{background:var(--kaki);color:var(--cream);border:none}
.cfYes:hover{background:#8F4325}
.cfNo{background:transparent;color:var(--ink);border:1px solid #C9BCA4}
.miniCard{
  display:none;margin-top:14px;background:#FFFDF8;border:1px solid #E0D7C6;border-radius:12px;
  padding:14px 16px;font-size:13px;line-height:1.8;
}
.miniCard.on{display:block}
.miniCard b{color:var(--wood)}
.miniCard button{
  margin-top:8px;font:inherit;font-size:12px;color:var(--kaki);background:none;
  border:none;cursor:pointer;letter-spacing:1px;padding:2px 0;
}
.miniCard button:hover{text-decoration:underline}
.cancelView{
  display:none;flex:1;overflow-y:auto;padding:40px 24px;text-align:center;
}
.cancelView.on{display:block}
.cancelView .mark{
  width:64px;height:64px;border-radius:50%;border:2px solid var(--muted);color:var(--muted);
  display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 16px;
}
.cancelView h2{font-size:20px;letter-spacing:2px}
.cancelView p{font-size:13px;line-height:2;color:var(--muted);margin:12px 0 22px}
.btnRe{
  font:inherit;font-size:14px;letter-spacing:2px;cursor:pointer;
  background:var(--kaki);color:var(--cream);border:none;border-radius:999px;padding:13px 30px;
}
.btnRe:hover{background:#8F4325}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div class="phone">
  <header class="head">
    <div>
      <h1>候茶工坊</h1>
      <p class="no">订单 CT-2026-0518-063 · 白桃乌龙拼配</p>
    </div>
    <span class="steam">🍵</span>
  </header>
  <main class="main" id="mainView">
    <div class="bigState">
      <h2 id="stepNow">第 2 步 · 拼配茶叶</h2>
      <p>订单已提交，师傅正在后厨处理，不催不慢</p>
    </div>
    <div class="eta">预计还要 <b id="etaTime">4 分 30 秒</b>，好了会叫你</div>
    <div class="steps">
      <div class="stepLine">
        <div class="step done" data-step="1"><span class="dot">✓</span><span class="nm">接单</span></div>
        <div class="step now" data-step="2"><span class="dot">2</span><span class="nm">拼配</span></div>
        <div class="step" data-step="3"><span class="dot">3</span><span class="nm">烘焙</span></div>
        <div class="step" data-step="4"><span class="dot">4</span><span class="nm">封装</span></div>
      </div>
      <div class="barWrap">
        <div class="barTrack"><div class="barFill" id="barFill"></div></div>
        <div class="barMeta"><span>已提交 1 分 10 秒</span><span id="barPct">42%</span></div>
      </div>
    </div>
    <div class="sandNote"><i></i><i></i><i></i></div>
    <div class="confirmBar" id="confirmBar">
      <p>确定取消吗？这单已经付了 ¥96，取消后 1–3 个工作日原路退回，茶叶还没下锅。</p>
      <div class="row">
        <button class="cfNo" id="cfNo" type="button">我再等等</button>
        <button class="cfYes" id="cfYes" type="button">确定取消</button>
      </div>
    </div>
    <div class="miniCard" id="miniCard">
      已放到一边。这单还在后厨做着，好了会推一条消息叫你。<b>当前：第 2 步 · 拼配茶叶</b>
      <br><button id="btnPeek" type="button">回来看看进度 →</button>
    </div>
    <div class="sideActs" id="sideActs">
      <button class="btnAside" id="btnAside" type="button">放到一边</button>
      <button class="btnCancel" id="btnCancel" type="button">取消订单</button>
    </div>
  </main>
  <main class="cancelView" id="cancelView">
    <div class="mark">✕</div>
    <h2>已取消</h2>
    <p>订单 CT-2026-0518-063 已撤销。<br>¥96 将在 1–3 个工作日原路退回。</p>
    <button class="btnRe" id="btnRe" type="button">再点一杯</button>
  </main>
</div>
<script>
(function(){
  var stepNow=document.getElementById('stepNow');
  var etaTime=document.getElementById('etaTime');
  var barFill=document.getElementById('barFill');
  var barPct=document.getElementById('barPct');
  var steps=document.querySelectorAll('.step');
  var names=['接单','拼配','烘焙','封装'];
  var cur=2;
  var leftSec=270;
  function renderSteps(){
    steps.forEach(function(s){
      var n=parseInt(s.getAttribute('data-step'),10);
      s.classList.toggle('done',n<cur);
      s.classList.toggle('now',n===cur);
      var d=s.querySelector('.dot');
      d.textContent=n<cur?'✓':String(n);
    });
    stepNow.textContent='第 '+cur+' 步 · '+names[cur-1]+(cur===2?'茶叶':'');
    var pct=Math.min(96,18+cur*20);
    barFill.style.width=pct+'%';
    barPct.textContent=pct+'%';
  }
  function renderEta(){
    var m=Math.floor(leftSec/60);
    var s=leftSec%60;
    etaTime.textContent=m+' 分 '+s+' 秒';
  }
  var stepTimer=setInterval(function(){
    cur=cur>=4?1:cur+1;
    renderSteps();
  },6000);
  var etaTimer=setInterval(function(){
    leftSec=leftSec>0?leftSec-1:0;
    renderEta();
  },1000);
  renderSteps();
  renderEta();
  var confirmBar=document.getElementById('confirmBar');
  var miniCard=document.getElementById('miniCard');
  var sideActs=document.getElementById('sideActs');
  var mainView=document.getElementById('mainView');
  var cancelView=document.getElementById('cancelView');
  document.getElementById('btnAside').addEventListener('click',function(){
    confirmBar.classList.remove('on');
    miniCard.classList.add('on');
    sideActs.style.display='none';
  });
  document.getElementById('btnPeek').addEventListener('click',function(){
    miniCard.classList.remove('on');
    sideActs.style.display='flex';
  });
  document.getElementById('btnCancel').addEventListener('click',function(){
    miniCard.classList.remove('on');
    confirmBar.classList.add('on');
  });
  document.getElementById('cfNo').addEventListener('click',function(){
    confirmBar.classList.remove('on');
  });
  document.getElementById('cfYes').addEventListener('click',function(){
    clearInterval(stepTimer);
    clearInterval(etaTimer);
    mainView.style.display='none';
    cancelView.classList.add('on');
  });
  document.getElementById('btnRe').addEventListener('click',function(){
    cancelView.classList.remove('on');
    mainView.style.display='flex';
    confirmBar.classList.remove('on');
    miniCard.classList.remove('on');
    sideActs.style.display='flex';
    cur=2;leftSec=270;
    renderSteps();renderEta();
    stepTimer=setInterval(function(){cur=cur>=4?1:cur+1;renderSteps();},6000);
    etaTimer=setInterval(function(){leftSec=leftSec>0?leftSec-1:0;renderEta();},1000);
  });
})();
</script>
</body>
</html>
