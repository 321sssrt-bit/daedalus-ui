<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>雾厅 MistLobby · 登录</title>
<style>
:root{
  --page:#EEF2F5;
  --surface:#FFFFFF;
  --text:#1F2A37;
  --muted:#6B7A8D;
  --accent:#3E6E8E;
  --accent-deep:#2F5670;
  --line:#D5DEE6;
  --ring:rgba(62,110,142,.16);
  --danger:#B4453A;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  min-height:100vh;
  font-family:"PingFang SC","Microsoft YaHei","Segoe UI","Helvetica Neue",Arial,sans-serif;
  color:var(--text);
  background:
    radial-gradient(1100px 520px at 18% -12%, #FFFFFF 0%, rgba(255,255,255,0) 62%),
    radial-gradient(860px 480px at 88% 112%, #D5DEE6 0%, rgba(213,222,230,0) 58%),
    var(--page);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:48px 24px;
}
.card{
  width:400px;
  max-width:100%;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:14px;
  box-shadow:0 24px 60px rgba(31,42,55,.08);
  padding:44px 40px 36px;
  animation:rise .24s ease-out both;
}
@keyframes rise{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:translateY(0)}
}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.brand-name{font-size:22px;font-weight:600;letter-spacing:2px}
.brand-sub{font-size:11px;letter-spacing:3px;color:var(--muted);text-transform:uppercase;margin-bottom:28px}
.tabs{position:relative;display:flex;gap:24px;border-bottom:1px solid var(--line);margin-bottom:24px}
.tab{
  appearance:none;background:none;border:none;cursor:pointer;
  font-size:15px;color:var(--muted);padding:0 2px 12px;
  transition:color .15s ease;
}
.tab:hover{color:var(--text)}
.tab.active{color:var(--text);font-weight:600}
.tab-ink{
  position:absolute;left:0;bottom:-1px;height:2px;width:64px;
  background:var(--accent);
  transition:transform .2s ease,width .2s ease;
}
.field{display:block;margin-bottom:18px}
.field-label{display:block;font-size:13px;color:var(--muted);margin-bottom:8px}
.field input{
  width:100%;height:48px;padding:0 14px;
  font-size:15px;color:var(--text);
  background:var(--surface);
  border:1px solid var(--line);border-radius:10px;
  outline:none;
  transition:border-color .15s ease,box-shadow .15s ease;
}
.field input::placeholder{color:#9AA7B4}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--ring)}
.pw-wrap{position:relative;display:block}
.pw-wrap input{padding-right:76px}
.pw-toggle,.code-btn{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);
  height:32px;padding:0 10px;
  background:none;border:none;border-radius:8px;cursor:pointer;
  font-size:13px;color:var(--accent);white-space:nowrap;
  transition:background .15s ease,color .15s ease;
}
.pw-toggle:hover,.code-btn:hover:not(:disabled){background:var(--page)}
.code-btn:disabled{color:var(--muted);cursor:not-allowed}
.row-between{display:flex;align-items:center;justify-content:space-between;margin:-6px 0 18px}
.check{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer}
.check input{accent-color:var(--accent)}
.link{
  appearance:none;background:none;border:none;cursor:pointer;
  font-size:13px;color:var(--accent);padding:0;
  transition:color .15s ease;
}
.link:hover{color:var(--accent-deep);text-decoration:underline}
.forgot-panel{
  border:1px dashed var(--line);border-radius:10px;
  background:var(--page);
  padding:12px 14px;margin-bottom:18px;
  font-size:13px;line-height:1.6;color:var(--muted);
}
.panel{animation:fade .18s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.hint{font-size:12px;color:var(--muted);margin:-6px 0 18px;line-height:1.6}
.primary{
  width:100%;height:48px;border:none;border-radius:10px;cursor:pointer;
  background:var(--accent);color:#FFFFFF;font-size:15px;font-weight:600;letter-spacing:4px;
  transition:background .15s ease,transform .1s ease,opacity .15s ease;
}
.primary:hover:not(:disabled){background:var(--accent-deep)}
.primary:active:not(:disabled){transform:translateY(1px)}
.primary:disabled{opacity:.45;cursor:not-allowed}
.msg{min-height:20px;font-size:13px;line-height:1.6;margin-top:12px;text-align:center}
.msg.error{color:var(--danger)}
.msg.ok{color:var(--accent)}
.foot{margin-top:20px;padding-top:20px;border-top:1px solid var(--line);text-align:center;font-size:13px;color:var(--muted)}
@media (max-width:900px){
  body{padding:24px 16px}
  .card{padding:32px 24px 28px}
  .brand-sub{margin-bottom:22px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
  }
}
</style>
</head>
<body>
<main class="card">
  <div class="brand">
    <svg viewBox="0 0 40 40" width="38" height="38" aria-hidden="true">
      <path d="M7 17 Q20 4 33 17" fill="none" stroke="#3E6E8E" stroke-width="2" stroke-linecap="round"/>
      <rect x="7" y="17" width="26" height="17" rx="3" fill="none" stroke="#3E6E8E" stroke-width="2"/>
      <line x1="13" y1="23" x2="27" y2="23" stroke="#6B7A8D" stroke-width="2" stroke-linecap="round"/>
      <line x1="13" y1="28" x2="22" y2="28" stroke="#D5DEE6" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <div class="brand-name">雾厅</div>
  </div>
  <p class="brand-sub">MistLobby · 云协作平台</p>

  <div class="tabs" role="tablist" aria-label="登录方式">
    <button class="tab active" id="tabPw" role="tab" aria-selected="true" type="button">密码登录</button>
    <button class="tab" id="tabCode" role="tab" aria-selected="false" type="button">验证码登录</button>
    <span class="tab-ink" id="tabInk"></span>
  </div>

  <form id="loginForm" novalidate>
    <label class="field">
      <span class="field-label">账号</span>
      <input id="acctInput" type="text" placeholder="邮箱或手机号" autocomplete="username">
    </label>

    <div class="panel" id="panelPw">
      <label class="field">
        <span class="field-label">密码</span>
        <span class="pw-wrap">
          <input id="pwInput" type="password" placeholder="输入登录密码" autocomplete="current-password">
          <button class="pw-toggle" id="pwToggle" type="button">显示</button>
        </span>
      </label>
      <div class="row-between">
        <label class="check"><input type="checkbox" id="keepLogin" checked> 保持登录 7 天</label>
        <button class="link" id="forgotLink" type="button">忘记密码？</button>
      </div>
      <div class="forgot-panel" id="forgotPanel" hidden>
        确认账号后，我们会把重置指引发送至账号绑定的邮箱，通常 1 分钟内送达。你也可以直接前往「找回密码」页自助重置。
      </div>
    </div>

    <div class="panel" id="panelCode" hidden>
      <label class="field">
        <span class="field-label">短信验证码</span>
        <span class="pw-wrap">
          <input id="codeInput" type="text" inputmode="numeric" maxlength="6" placeholder="6 位数字验证码" autocomplete="one-time-code">
          <button class="code-btn" id="sendCodeBtn" type="button">获取验证码</button>
        </span>
      </label>
      <p class="hint" id="codeHint">验证码将发送至账号绑定的手机号，10 分钟内有效。</p>
    </div>

    <button class="primary" id="loginBtn" type="submit" disabled>进入雾厅</button>
    <p class="msg" id="formMsg" aria-live="polite"></p>
  </form>

  <div class="foot">
    还没有账号？<button class="link" id="signupLink" type="button">创建新账号</button>
  </div>
</main>

<script>
(function(){
  var tabPw=document.getElementById('tabPw');
  var tabCode=document.getElementById('tabCode');
  var tabInk=document.getElementById('tabInk');
  var panelPw=document.getElementById('panelPw');
  var panelCode=document.getElementById('panelCode');
  var acct=document.getElementById('acctInput');
  var pw=document.getElementById('pwInput');
  var code=document.getElementById('codeInput');
  var pwToggle=document.getElementById('pwToggle');
  var sendBtn=document.getElementById('sendCodeBtn');
  var codeHint=document.getElementById('codeHint');
  var loginBtn=document.getElementById('loginBtn');
  var msg=document.getElementById('formMsg');
  var forgotLink=document.getElementById('forgotLink');
  var forgotPanel=document.getElementById('forgotPanel');
  var signupLink=document.getElementById('signupLink');
  var form=document.getElementById('loginForm');
  var mode='pw';
  var timer=null;
  var left=0;

  function placeInk(){
    var t=(mode==='pw')?tabPw:tabCode;
    tabInk.style.width=t.offsetWidth+'px';
    tabInk.style.transform='translateX('+t.offsetLeft+'px)';
  }
  function setMode(m){
    mode=m;
    tabPw.classList.toggle('active',m==='pw');
    tabCode.classList.toggle('active',m==='code');
    tabPw.setAttribute('aria-selected',m==='pw'?'true':'false');
    tabCode.setAttribute('aria-selected',m==='code'?'true':'false');
    panelPw.hidden=(m!=='pw');
    panelCode.hidden=(m!=='code');
    msg.textContent='';
    msg.className='msg';
    placeInk();
    refresh();
  }
  function acctOk(){
    return acct.value.trim().length>=5;
  }
  function refresh(){
    var ok=acctOk()&&((mode==='pw')?(pw.value.length>=6):(code.value.length===6));
    loginBtn.disabled=!ok;
  }
  function say(text,kind){
    msg.textContent=text;
    msg.className='msg'+((kind)?(' '+kind):'');
  }
  tabPw.addEventListener('click',function(){setMode('pw');});
  tabCode.addEventListener('click',function(){setMode('code');});
  pwToggle.addEventListener('click',function(){
    var show=(pw.type==='password');
    pw.type=show?'text':'password';
    pwToggle.textContent=show?'隐藏':'显示';
  });
  forgotLink.addEventListener('click',function(){
    forgotPanel.hidden=!forgotPanel.hidden;
  });
  signupLink.addEventListener('click',function(){
    say('雾厅面向受邀团队开放，请联系你的团队管理员开通账号。','');
  });
  sendBtn.addEventListener('click',function(){
    if(!acctOk()){
      say('请先填写账号，再获取验证码。','error');
      acct.focus();
      return;
    }
    left=60;
    sendBtn.disabled=true;
    codeHint.textContent='验证码已发出，请注意查收短信。';
    sendBtn.textContent=left+'s 后可重发';
    if(timer){clearInterval(timer);}
    timer=setInterval(function(){
      left-=1;
      if(left<=0){
        clearInterval(timer);
        timer=null;
        sendBtn.disabled=false;
        sendBtn.textContent='重新获取';
      }else{
        sendBtn.textContent=left+'s 后可重发';
      }
    },1000);
  });
  [acct,pw,code].forEach(function(el){
    el.addEventListener('input',refresh);
  });
  form.addEventListener('submit',function(e){
    e.preventDefault();
    loginBtn.disabled=true;
    loginBtn.textContent='正在进入…';
    say('','');
    setTimeout(function(){
      loginBtn.textContent='进入雾厅';
      loginBtn.disabled=false;
      say('验证通过，欢迎回来，林雾。正在同步你的工作台。','ok');
    },700);
  });
  window.addEventListener('resize',placeInk);
  placeInk();
  refresh();
})();
</script>
</body>
</html>
