<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>纸鸢剧场 · 取票回执</title>
<style>
:root{
  --sky:#EAF4FB;
  --red:#D93A2B;
  --gold:#F2B33D;
  --ink:#23303A;
  --white:#FFFFFF;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:#16242E;padding:24px 12px;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  color:var(--ink);
}
.phone{
  width:390px;min-height:844px;flex:none;position:relative;overflow:hidden;
  border-radius:44px;border:10px solid #0B151C;
  background:linear-gradient(180deg,var(--sky) 0%,#D6EAF6 100%);
  box-shadow:0 40px 90px rgba(0,0,0,.6);
  display:flex;flex-direction:column;
}
.skyTop{
  flex:none;position:relative;height:150px;overflow:hidden;
}
.cloud{
  position:absolute;background:var(--white);border-radius:999px;opacity:.85;
}
.cloud.c1{width:120px;height:34px;left:-30px;top:36px}
.cloud.c1::after{content:"";position:absolute;width:56px;height:56px;border-radius:50%;background:var(--white);left:30px;top:-26px}
.cloud.c2{width:90px;height:26px;right:-16px;top:74px;opacity:.7}
.kite{
  position:absolute;right:44px;top:22px;animation:sway 4.5s ease-in-out infinite;transform-origin:50% 0;
}
@keyframes sway{
  0%,100%{transform:rotate(-6deg) translateY(0)}
  50%{transform:rotate(7deg) translateY(8px)}
}
.skyTop .cap{
  position:absolute;left:24px;top:26px;font-size:12px;letter-spacing:3px;color:var(--ink);
  background:rgba(255,255,255,.7);padding:6px 12px;border-radius:999px;
}
.body2{
  flex:1;overflow-y:auto;padding:8px 22px 26px;display:flex;flex-direction:column;
}
.receipt{
  background:var(--white);border-radius:16px 16px 0 0;padding:26px 24px 0;
  box-shadow:0 10px 26px rgba(35,48,58,.12);position:relative;
}
.checkSeal{
  width:64px;height:64px;border-radius:50%;background:var(--red);margin:0 auto 14px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 0 6px rgba(217,58,43,.14);
  animation:pop .4s cubic-bezier(.2,1.5,.4,1);
}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.succTitle{text-align:center;font-size:22px;font-weight:800;letter-spacing:2px}
.succSub{text-align:center;font-size:13px;color:#5B6B76;margin-top:6px}
.codeBox{
  margin:20px 0 6px;text-align:center;background:var(--sky);border-radius:12px;padding:16px 12px;
}
.codeBox .label{font-size:11px;letter-spacing:3px;color:#5B6B76}
.codeBox .code{
  font-family:ui-monospace,"Courier New",Menlo,Consolas,monospace;
  font-size:26px;font-weight:700;letter-spacing:3px;color:var(--red);margin-top:6px;
}
.metaRow{
  display:flex;justify-content:space-between;font-size:14px;padding:12px 2px;
  border-bottom:1px dashed #D7E3EB;
}
.metaRow .k{color:#5B6B76}
.metaRow .v{font-weight:700}
.metaRow .v.gold{color:#B07C1B}
.punch{
  position:relative;margin:0 -24px;height:26px;
  background-image:radial-gradient(circle at 12px 13px,#D6EAF6 0 7px,transparent 7.5px),radial-gradient(circle at calc(100% - 12px) 13px,#D6EAF6 0 7px,transparent 7.5px);
  border-bottom:2px dashed #C3D6E2;
}
.stub{
  background:var(--white);border-radius:0 0 16px 16px;padding:16px 24px 22px;
  box-shadow:0 10px 26px rgba(35,48,58,.12);
}
.btnDetail{
  width:100%;font:inherit;font-size:13px;letter-spacing:1px;cursor:pointer;
  background:transparent;color:var(--ink);border:1.5px dashed #B9CBD8;border-radius:10px;
  padding:11px 0;transition:background .15s ease;
}
.btnDetail:hover{background:var(--sky)}
.btnDetail:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.detail{
  display:none;margin-top:14px;border-top:1px dashed #D7E3EB;padding-top:14px;
}
.detail.on{display:block}
.detail h3{font-size:13px;letter-spacing:2px;color:#5B6B76;margin-bottom:8px}
.detail .row{display:flex;justify-content:space-between;font-size:13px;padding:5px 0}
.detail .row .amt{font-family:ui-monospace,"Courier New",Menlo,Consolas,monospace}
.detail .note{font-size:12px;line-height:1.9;color:#5B6B76;margin-top:10px}
.foot{padding:18px 0 4px}
.btnDone{
  width:100%;font:inherit;font-size:16px;font-weight:700;letter-spacing:3px;cursor:pointer;
  background:var(--red);color:var(--white);border:none;border-radius:999px;
  padding:16px 0;box-shadow:0 6px 0 #A82A1D;transition:transform .15s ease,box-shadow .15s ease;
}
.btnDone:hover{transform:translateY(-2px);box-shadow:0 8px 0 #A82A1D}
.btnDone:active{transform:translateY(3px);box-shadow:0 1px 0 #A82A1D}
.btnDone:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.btnDone:disabled{background:var(--gold);box-shadow:0 3px 0 #C08F1F;cursor:default}
.tipLine{text-align:center;font-size:11px;color:#7A8B96;margin-top:12px}
.toast{
  position:absolute;left:50%;bottom:80px;transform:translateX(-50%) translateY(14px);
  background:var(--ink);color:var(--white);font-size:13px;padding:10px 18px;border-radius:999px;
  opacity:0;pointer-events:none;z-index:30;white-space:nowrap;
  transition:opacity .25s ease,transform .25s ease;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div class="phone">
  <div class="skyTop">
    <span class="cloud c1"></span>
    <span class="cloud c2"></span>
    <span class="cap">纸鸢剧场 · 取票回执</span>
    <svg class="kite" viewBox="0 0 90 110" width="74" height="90" role="img" aria-label="一只红金风筝">
      <path d="M45 4 L78 34 L45 64 L12 34 Z" fill="#D93A2B"/>
      <path d="M45 4 L78 34 L45 34 Z" fill="#F2B33D"/>
      <path d="M45 64 L78 34 L45 34 Z" fill="#B02C20" opacity=".5"/>
      <path d="M45 64 Q40 84 48 96 Q52 102 47 108" fill="none" stroke="#23303A" stroke-width="2"/>
      <path d="M43 78 l8 3 M44 90 l8 3" stroke="#F2B33D" stroke-width="3" stroke-linecap="round"/>
    </svg>
  </div>
  <main class="body2">
    <section class="receipt">
      <div class="checkSeal">
        <svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true">
          <path d="M5 12.5 L10 17.5 L19 7" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h1 class="succTitle">订票成功</h1>
      <p class="succSub">这张回执请收好，入场时出示取票码</p>
      <div class="codeBox">
        <div class="label">取 票 码</div>
        <div class="code">ZY-8842-6671</div>
      </div>
      <div class="metaRow"><span class="k">剧目</span><span class="v">纸鸢夜场 《风孩子》</span></div>
      <div class="metaRow"><span class="k">场次</span><span class="v">5月18日（周一）19:30</span></div>
      <div class="metaRow" style="border-bottom:none"><span class="k">席位</span><span class="v gold">3 排 7 座 · 池座</span></div>
      <div class="punch"></div>
    </section>
    <section class="stub">
      <button class="btnDetail" id="btnDetail" type="button" aria-expanded="false">展开明细与观演须知 ▾</button>
      <div class="detail" id="detail">
        <h3>票价明细</h3>
        <div class="row"><span>池座票档 × 2</span><span class="amt">¥ 560.00</span></div>
        <div class="row"><span>服务费</span><span class="amt">¥ 12.00</span></div>
        <div class="row"><span>实付</span><span class="amt" style="color:#D93A2B;font-weight:700">¥ 572.00</span></div>
        <h3 style="margin-top:14px">观演须知</h3>
        <p class="note">开场前 40 分钟开始入场；池座区禁止饮食；演出中请收起发光物。取票码一次有效，截图无效。</p>
      </div>
    </section>
    <div class="foot">
      <button class="btnDone" id="btnDone" type="button">完成</button>
      <p class="tipLine">回执编号与订单 NO.88231470 绑定</p>
    </div>
  </main>
  <div class="toast" id="toast"></div>
</div>
<script>
(function(){
  var btnDetail=document.getElementById('btnDetail');
  var detail=document.getElementById('detail');
  var btnDone=document.getElementById('btnDone');
  var toastBox=document.getElementById('toast');
  var toastTimer=null;
  function toast(msg){
    toastBox.textContent=msg;
    toastBox.classList.add('show');
    if(toastTimer){clearTimeout(toastTimer);}
    toastTimer=setTimeout(function(){toastBox.classList.remove('show');},2200);
  }
  btnDetail.addEventListener('click',function(){
    var open=detail.classList.toggle('on');
    btnDetail.setAttribute('aria-expanded',open?'true':'false');
    btnDetail.textContent=open?'收起明细与观演须知 ▴':'展开明细与观演须知 ▾';
  });
  btnDone.addEventListener('click',function(){
    btnDone.disabled=true;
    btnDone.textContent='已收进票夹';
    toast('回执已存进票夹，开场前 40 分钟提醒你');
  });
})();
</script>
</body>
</html>
