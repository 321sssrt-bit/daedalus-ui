<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>唱机 · 正在播放</title>
<style>
:root{
  --page:#121212;
  --wood:#2A211C;
  --wood-hi:#7A5230;
  --cream:#F0E3D0;
  --amber:#D98E4A;
  --disc:#1A1512;
  --muted:#A68B6F;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100%}
body{
  background:radial-gradient(1000px 700px at 50% 10%,#1E1B19,var(--page) 65%);
  display:flex;align-items:center;justify-content:center;
  padding:32px 12px;
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
}
.phone{
  width:390px;height:844px;flex:none;
  border-radius:44px;border:10px solid #0B0908;
  background:
    repeating-linear-gradient(95deg,#2A211C 0 16px,#2E241E 16px 31px,#282019 31px 48px),
    var(--wood);
  overflow:hidden;position:relative;
  box-shadow:0 40px 90px rgba(0,0,0,.6);
}
.notch{
  position:absolute;top:12px;left:50%;transform:translateX(-50%);
  width:112px;height:24px;border-radius:12px;background:#0B0908;z-index:30;
}
.screen{height:100%;display:flex;flex-direction:column;color:var(--cream)}
.statusbar{
  flex:none;display:flex;justify-content:space-between;align-items:center;
  padding:14px 26px 6px;font-size:13px;font-weight:600;
}
.statusbar .icons{display:flex;gap:6px}
.statusbar svg{width:16px;height:12px}
.apphead{
  flex:none;display:flex;justify-content:space-between;align-items:center;
  padding:10px 22px 4px;
}
.apphead .brand{display:flex;align-items:center;gap:9px}
.apphead .brand svg{width:24px;height:24px}
.apphead .brand .t{font-size:16px;font-weight:800;letter-spacing:3px}
.apphead .brand .s{font-size:10px;color:var(--muted);letter-spacing:3px;margin-top:2px}
.apphead .eq{display:flex;gap:3px;align-items:flex-end;height:16px}
.apphead .eq i{width:3px;background:var(--amber);border-radius:1.5px}
.apphead .eq i:nth-child(1){height:6px}
.apphead .eq i:nth-child(2){height:13px}
.apphead .eq i:nth-child(3){height:9px}
.apphead .eq.play i{animation:bob .9s ease-in-out infinite alternate}
.apphead .eq.play i:nth-child(2){animation-delay:.18s}
.apphead .eq.play i:nth-child(3){animation-delay:.36s}
@keyframes bob{from{transform:scaleY(.35)}to{transform:scaleY(1)}}
.deck{
  flex:none;position:relative;height:330px;margin:8px 0 0;
  display:flex;align-items:center;justify-content:center;
}
.platter{
  width:296px;height:296px;border-radius:50%;
  background:#211912;
  border:1px solid #3A2C20;
  box-shadow:0 18px 44px rgba(0,0,0,.55),inset 0 0 0 8px #171310;
  display:flex;align-items:center;justify-content:center;
}
.disc{
  width:264px;height:264px;border-radius:50%;position:relative;
  background:repeating-radial-gradient(circle at 50% 50%,#221A14 0 2px,#16100C 2px 5px);
  box-shadow:0 0 0 1px #0E0A07,inset 0 0 30px rgba(0,0,0,.6);
  animation:spin 5.2s linear infinite;
}
.disc.paused{animation-play-state:paused}
@keyframes spin{to{transform:rotate(360deg)}}
.disc .label{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:96px;height:96px;border-radius:50%;
  background:radial-gradient(circle at 38% 32%,#E8A05E,var(--amber) 60%,#B96F30);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:#3A2410;text-align:center;
  box-shadow:0 0 0 3px #171310,0 0 0 4px rgba(217,142,74,.4);
}
.disc .label .a{font-size:11px;font-weight:800;letter-spacing:1px}
.disc .label .b{font-size:8px;letter-spacing:1px;margin-top:3px;opacity:.8}
.disc .label::after{
  content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:10px;height:10px;border-radius:50%;background:#171310;
}
.arm{
  position:absolute;top:14px;right:30px;width:130px;height:190px;z-index:5;
  transform-origin:118px 22px;
  transform:rotate(-14deg);
  transition:transform .9s cubic-bezier(.5,0,.2,1);
  pointer-events:none;
}
.arm.on{transform:rotate(9deg)}
.arm svg{width:100%;height:100%;overflow:visible}
.meta{flex:none;text-align:center;padding:4px 24px 0}
.meta .song{font-size:21px;font-weight:800;letter-spacing:2px}
.meta .artist{font-size:13px;color:var(--muted);margin-top:7px;letter-spacing:2px}
.meta .album{
  display:inline-block;font-size:11px;color:var(--amber);letter-spacing:2px;margin-top:9px;
  border:1px solid rgba(217,142,74,.45);border-radius:999px;padding:3px 12px;
}
.progress{flex:none;padding:16px 28px 0}
.progress .bar{
  height:22px;display:flex;align-items:center;cursor:pointer;
}
.progress .bar .rail{
  width:100%;height:4px;border-radius:2px;background:#453626;overflow:hidden;
}
.progress .bar .fill{
  height:100%;width:0%;border-radius:2px;
  background:linear-gradient(90deg,var(--wood-hi),var(--amber));
}
.progress .times{
  display:flex;justify-content:space-between;font-size:11px;color:var(--muted);
  margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:1px;
}
.controls{
  flex:none;display:flex;align-items:center;justify-content:center;gap:34px;
  padding:16px 0 6px;
}
.controls button{
  background:none;border:none;cursor:pointer;color:var(--cream);
  display:flex;align-items:center;justify-content:center;
  transition:transform .15s ease,color .15s ease;
}
.controls button:active{transform:scale(.92)}
.controls button:focus-visible{outline:2px solid var(--amber);border-radius:50%;outline-offset:4px}
.controls .side svg{width:30px;height:30px}
.controls .side:hover{color:var(--amber)}
.controls .play{
  width:66px;height:66px;border-radius:50%;
  background:radial-gradient(circle at 36% 30%,#E8A05E,var(--amber) 62%,#B96F30);
  color:#3A2410;box-shadow:0 10px 26px rgba(217,142,74,.4);
}
.controls .play:hover{box-shadow:0 14px 32px rgba(217,142,74,.55)}
.controls .play svg{width:26px;height:26px}
.trackpos{
  flex:none;text-align:center;font-size:11px;color:var(--muted);letter-spacing:2px;margin-top:4px;
}
.list{
  flex:1;overflow-y:auto;margin:10px 18px 0;padding:0 4px 12px;scrollbar-width:none;
}
.list::-webkit-scrollbar{display:none}
.list .trk{
  display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;
  cursor:pointer;transition:background .15s ease;
}
.list .trk:hover{background:rgba(240,227,208,.06)}
.list .trk .no{
  width:26px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:center;flex:none;
}
.list .trk .nm{flex:1;min-width:0}
.list .trk .nm .t{font-size:14px;font-weight:700}
.list .trk .nm .d{font-size:11px;color:var(--muted);margin-top:2px;letter-spacing:1px}
.list .trk .len{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.list .trk.on{background:rgba(217,142,74,.12)}
.list .trk.on .nm .t{color:var(--amber)}
.list .trk.on .no{color:var(--amber)}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
  .disc{animation:none}
  .apphead .eq.play i{animation:none}
}
@media (max-width: 480px){
  body{padding:0}
  .phone{border:none;border-radius:0;width:100%;height:100vh}
  .notch{display:none}
}
</style>
</head>
<body>
<div class="phone">
  <div class="notch"></div>
  <div class="screen">
    <div class="statusbar">
      <span>21:07</span>
      <span class="icons">
        <svg viewBox="0 0 20 12"><rect x="0" y="7" width="3" height="5" fill="#F0E3D0"/><rect x="5" y="5" width="3" height="7" fill="#F0E3D0"/><rect x="10" y="2.5" width="3" height="9.5" fill="#F0E3D0"/><rect x="15" y="0" width="3" height="12" fill="#F0E3D0" opacity=".35"/></svg>
        <svg viewBox="0 0 20 12"><rect x="1" y="1" width="16" height="10" rx="2.5" fill="none" stroke="#F0E3D0" stroke-width="1.4"/><rect x="3" y="3" width="11" height="6" rx="1" fill="#D98E4A"/><rect x="18.5" y="4" width="1.8" height="4" rx=".9" fill="#F0E3D0"/></svg>
      </span>
    </div>
    <header class="apphead">
      <div class="brand">
        <svg viewBox="0 0 28 28"><circle cx="14" cy="14" r="11" fill="none" stroke="#D98E4A" stroke-width="2"/><circle cx="14" cy="14" r="3.4" fill="#D98E4A"/><path d="M14 3a11 11 0 0 1 8 4" fill="none" stroke="#7A5230" stroke-width="2" stroke-linecap="round"/></svg>
        <div>
          <div class="t">唱机</div>
          <div class="s">VINYL ROOM · 正在播放</div>
        </div>
      </div>
      <div class="eq" id="eqBars"><i></i><i></i><i></i></div>
    </header>

    <div class="deck">
      <div class="platter">
        <div class="disc paused" id="disc">
          <div class="label">
            <span class="a" id="labelSong">渡口钟声</span>
            <span class="b">33⅓ RPM · SIDE A</span>
          </div>
        </div>
      </div>
      <div class="arm" id="arm">
        <svg viewBox="0 0 130 190">
          <circle cx="118" cy="22" r="14" fill="#3A2C20" stroke="#7A5230" stroke-width="2"/>
          <circle cx="118" cy="22" r="5" fill="#D98E4A"/>
          <path d="M118 22 L46 152" stroke="#7A5230" stroke-width="5" stroke-linecap="round"/>
          <rect x="34" y="146" width="22" height="13" rx="3" transform="rotate(-32 45 152)" fill="#D98E4A"/>
        </svg>
      </div>
    </div>

    <div class="meta">
      <div class="song" id="songName">渡口钟声</div>
      <div class="artist" id="artistName">苏晚舟 · 现场原声</div>
      <div class="album" id="albumName">专辑《江南备忘录》</div>
    </div>

    <div class="progress">
      <div class="bar" id="bar"><div class="rail"><div class="fill" id="fill"></div></div></div>
      <div class="times"><span id="tNow">0:00</span><span id="tAll">4:12</span></div>
    </div>

    <div class="controls">
      <button class="side" id="btnPrev" type="button" aria-label="上一首">
        <svg viewBox="0 0 30 30"><path d="M8 7v16" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><path d="M23 8l-11 7 11 7V8z" fill="currentColor"/></svg>
      </button>
      <button class="play" id="btnPlay" type="button" aria-label="播放或暂停">
        <svg viewBox="0 0 26 26" id="iconPlay"><path d="M9 6l11 7-11 7V6z" fill="currentColor"/></svg>
        <svg viewBox="0 0 26 26" id="iconPause" style="display:none"><rect x="7" y="5.5" width="4" height="15" rx="1.4" fill="currentColor"/><rect x="15" y="5.5" width="4" height="15" rx="1.4" fill="currentColor"/></svg>
      </button>
      <button class="side" id="btnNext" type="button" aria-label="下一首">
        <svg viewBox="0 0 30 30"><path d="M22 7v16" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><path d="M7 8l11 7-11 7V8z" fill="currentColor"/></svg>
      </button>
    </div>

    <div class="trackpos" id="trackPos">第 1 / 4 首 · 唱针温度正好</div>

    <div class="list" id="list">
      <div class="trk on" data-i="0">
        <span class="no">01</span>
        <div class="nm"><div class="t">渡口钟声</div><div class="d">苏晚舟 · 现场原声</div></div>
        <span class="len">4:12</span>
      </div>
      <div class="trk" data-i="1">
        <span class="no">02</span>
        <div class="nm"><div class="t">夜航西飞</div><div class="d">苏晚舟 · 钢琴独奏</div></div>
        <span class="len">3:48</span>
      </div>
      <div class="trk" data-i="2">
        <span class="no">03</span>
        <div class="nm"><div class="t">梧桐雨</div><div class="d">苏晚舟 · 弦乐版</div></div>
        <span class="len">5:06</span>
      </div>
      <div class="trk" data-i="3">
        <span class="no">04</span>
        <div class="nm"><div class="t">城南旧信</div><div class="d">苏晚舟 · 人声清唱</div></div>
        <span class="len">3:33</span>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  var TRACKS = [
    {name:'渡口钟声', artist:'苏晚舟 · 现场原声', album:'专辑《江南备忘录》', len:252, lenText:'4:12'},
    {name:'夜航西飞', artist:'苏晚舟 · 钢琴独奏', album:'专辑《江南备忘录》', len:228, lenText:'3:48'},
    {name:'梧桐雨',   artist:'苏晚舟 · 弦乐版',   album:'专辑《江南备忘录》', len:306, lenText:'5:06'},
    {name:'城南旧信', artist:'苏晚舟 · 人声清唱', album:'专辑《江南备忘录》', len:213, lenText:'3:33'}
  ];
  var idx = 0, elapsed = 0, playing = false, timer = null;

  var disc = document.getElementById('disc');
  var arm = document.getElementById('arm');
  var eq = document.getElementById('eqBars');
  var iconPlay = document.getElementById('iconPlay');
  var iconPause = document.getElementById('iconPause');
  var songName = document.getElementById('songName');
  var artistName = document.getElementById('artistName');
  var albumName = document.getElementById('albumName');
  var labelSong = document.getElementById('labelSong');
  var tNow = document.getElementById('tNow');
  var tAll = document.getElementById('tAll');
  var fill = document.getElementById('fill');
  var trackPos = document.getElementById('trackPos');
  var rows = document.querySelectorAll('#list .trk');

  function fmt(s){
    s = Math.max(0, Math.floor(s));
    return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2);
  }

  function paint(){
    var t = TRACKS[idx];
    songName.textContent = t.name;
    labelSong.textContent = t.name;
    artistName.textContent = t.artist;
    albumName.textContent = t.album;
    tAll.textContent = t.lenText;
    tNow.textContent = fmt(elapsed);
    fill.style.width = Math.min(100, elapsed / t.len * 100) + '%';
    trackPos.textContent = '第 ' + (idx + 1) + ' / ' + TRACKS.length + ' 首 · 唱针温度正好';
    rows.forEach(function(r, i){ r.classList.toggle('on', i === idx); });
  }

  function setPlaying(on){
    playing = on;
    disc.classList.toggle('paused', !on);
    arm.classList.toggle('on', on);
    eq.classList.toggle('play', on);
    iconPlay.style.display = on ? 'none' : '';
    iconPause.style.display = on ? '' : 'none';
    if (timer) { clearInterval(timer); timer = null; }
    if (on){
      timer = setInterval(function(){
        elapsed += 1;
        if (elapsed >= TRACKS[idx].len){ goTo(idx + 1); }
        else { paint(); }
      }, 1000);
    }
  }

  function goTo(n){
    idx = ((n % TRACKS.length) + TRACKS.length) % TRACKS.length;
    elapsed = 0;
    paint();
  }

  document.getElementById('btnPlay').addEventListener('click', function(){ setPlaying(!playing); });
  document.getElementById('btnNext').addEventListener('click', function(){ goTo(idx + 1); });
  document.getElementById('btnPrev').addEventListener('click', function(){ goTo(idx - 1); });

  document.getElementById('bar').addEventListener('click', function(e){
    var r = this.getBoundingClientRect();
    var ratio = (e.clientX - r.left) / r.width;
    elapsed = Math.round(TRACKS[idx].len * Math.min(1, Math.max(0, ratio)));
    paint();
  });

  rows.forEach(function(r){
    r.addEventListener('click', function(){
      goTo(parseInt(r.getAttribute('data-i'), 10));
    });
  });

  paint();
})();
</script>
</body>
</html>
