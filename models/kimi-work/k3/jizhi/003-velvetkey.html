<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>绒钥 VelvetKey · 邀请核验</title>
<style>
:root{
  --page:#101014;
  --deep:#1A1A20;
  --surface:#3A3A42;
  --cream:#F2E9D8;
  --gold:#C9A227;
  --gold-deep:#8E7226;
  --danger:#C05746;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  min-height:100vh;
  background:radial-gradient(900px 500px at 50% -10%, #1A1A20 0%, rgba(26,26,32,0) 60%), var(--page);
  color:var(--cream);
  font-family:Georgia,"Times New Roman","Songti SC","STSong","SimSun",serif;
  display:flex;align-items:center;justify-content:center;
  padding:48px 24px;
}
.frame{
  width:460px;max-width:100%;
  border:1px solid var(--gold);
  padding:10px;
  position:relative;
  background:rgba(26,26,32,.6);
  animation:glow .3s ease both;
}
@keyframes glow{from{opacity:0}to{opacity:1}}
.corner{
  position:absolute;width:14px;height:14px;
  background:var(--gold);transform:rotate(45deg);
}
.c-tl{top:-7px;left:-7px}
.c-tr{top:-7px;right:-7px}
.c-bl{bottom:-7px;left:-7px}
.c-br{bottom:-7px;right:-7px}
.frame-inner{
  border:1px solid rgba(201,162,39,.45);
  padding:44px 40px 36px;
  text-align:center;
}
.ornament{margin-bottom:18px}
.club-en{font-size:10px;letter-spacing:5px;color:var(--gold);margin-bottom:14px}
h1{font-size:34px;font-weight:400;letter-spacing:14px;text-indent:14px;color:var(--cream);margin-bottom:8px}
.club-cn{font-size:12px;letter-spacing:4px;color:rgba(242,233,216,.6);margin-bottom:24px}
.divider{display:flex;align-items:center;gap:12px;margin-bottom:26px}
.divider i{flex:1;height:1px;background:rgba(201,162,39,.5)}
.lead{font-size:13px;line-height:1.9;color:rgba(242,233,216,.75);margin-bottom:22px;text-align:left}
.code-label{display:block;font-size:11px;letter-spacing:6px;color:var(--gold);margin-bottom:10px}
.code-input{
  width:100%;height:54px;text-align:center;
  font-family:inherit;font-size:20px;letter-spacing:6px;text-transform:uppercase;
  color:var(--cream);background:var(--page);
  border:1px solid var(--gold);outline:none;border-radius:0;
  transition:box-shadow .2s ease,border-color .2s ease;
}
.code-input::placeholder{color:rgba(242,233,216,.25)}
.code-input:focus{box-shadow:0 0 0 3px rgba(201,162,39,.25)}
.code-input.shake{animation:shake .3s ease}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  25%{transform:translateX(-6px)}
  50%{transform:translateX(6px)}
  75%{transform:translateX(-4px)}
}
.primary{
  width:100%;height:50px;margin-top:18px;cursor:pointer;
  background:var(--gold);color:var(--page);
  border:none;border-radius:0;
  font-family:inherit;font-size:14px;font-weight:700;letter-spacing:8px;text-indent:8px;
  transition:background .2s ease,color .2s ease;
}
.primary:hover{background:var(--gold-deep);color:var(--cream)}
.primary:active{background:var(--gold-deep)}
.error-box{
  margin-top:16px;border:1px solid var(--danger);
  padding:12px 14px;font-size:12px;line-height:1.8;color:#E8B9AE;text-align:left;
}
.attempts{color:rgba(242,233,216,.55);margin-top:4px}
.howto{
  margin-top:20px;appearance:none;background:none;border:none;cursor:pointer;
  color:var(--gold);font-family:inherit;font-size:12px;letter-spacing:3px;
  border-bottom:1px solid rgba(201,162,39,.5);padding-bottom:2px;
  transition:color .2s ease;
}
.howto:hover{color:var(--cream)}
.howto-panel{
  margin-top:14px;font-size:12px;line-height:2;color:rgba(242,233,216,.7);
  border:1px solid rgba(201,162,39,.35);padding:14px 16px;text-align:left;
  background:rgba(58,58,66,.35);
}
.pass-icon{margin-top:4px}
h2{font-size:22px;letter-spacing:8px;text-indent:8px;font-weight:400;margin:18px 0 8px}
.seat{font-size:12px;letter-spacing:3px;color:var(--gold);margin-bottom:16px}
.greet{font-size:13px;line-height:2;color:rgba(242,233,216,.8);margin-bottom:6px}
.enter-msg{min-height:20px;font-size:12px;color:var(--gold);margin-top:12px;letter-spacing:2px}
.service{margin-top:18px;text-align:center;font-size:11px;letter-spacing:3px;color:rgba(242,233,216,.4)}
@media (max-width:900px){
  body{padding:24px 14px}
  .frame-inner{padding:32px 20px 26px}
  h1{letter-spacing:10px;text-indent:10px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
  }
}
</style>
</head>
<body>
<main class="frame">
  <span class="corner c-tl" aria-hidden="true"></span>
  <span class="corner c-tr" aria-hidden="true"></span>
  <span class="corner c-bl" aria-hidden="true"></span>
  <span class="corner c-br" aria-hidden="true"></span>
  <div class="frame-inner">
    <svg class="ornament" viewBox="0 0 200 12" width="200" height="12" aria-hidden="true">
      <line x1="0" y1="6" x2="80" y2="6" stroke="#C9A227" stroke-width="1"/>
      <rect x="94" y="0.6" width="10.8" height="10.8" transform="rotate(45 100 6)" fill="none" stroke="#C9A227" stroke-width="1"/>
      <line x1="120" y1="6" x2="200" y2="6" stroke="#C9A227" stroke-width="1"/>
    </svg>
    <p class="club-en">VELVETKEY PRIVATE CLUB</p>
    <h1>绒钥</h1>
    <p class="club-cn">私享俱乐部 · 凭邀请核验进入</p>
    <div class="divider" aria-hidden="true">
      <i></i>
      <svg viewBox="0 0 12 12" width="10" height="12"><rect x="2" y="2" width="8" height="8" transform="rotate(45 6 6)" fill="#C9A227"/></svg>
      <i></i>
    </div>

    <div id="checkView">
      <p class="lead">本会所实行邀请制。请输入请柬上的邀请码，核验通过后方可入内。</p>
      <label class="code-label" for="codeInput">邀请码</label>
      <input id="codeInput" class="code-input" type="text" maxlength="7" placeholder="XXXX-00" autocomplete="off" spellcheck="false">
      <button class="primary" id="checkBtn" type="button">核验邀请</button>
      <div class="error-box" id="errorBox" hidden>
        <p id="errorText">邀请码无效或已被使用，请逐位核对后重试。</p>
        <p class="attempts" id="attemptText">已连续失败 1 次，连续 5 次将临时锁定。</p>
      </div>
      <button class="howto" id="howtoBtn" type="button">如何获得邀请？</button>
      <div class="howto-panel" id="howtoPanel" hidden>
        邀请码由在册会员每季度限量发出两枚，每枚仅限一位宾客使用。若你尚未获得邀请，可致电会员服务 021-6208-7716 登记候补席位，核验通过后请柬将以专人送达。
      </div>
    </div>

    <div id="passView" hidden>
      <svg class="pass-icon" viewBox="0 0 64 64" width="56" height="56" aria-hidden="true">
        <rect x="14" y="14" width="36" height="36" transform="rotate(45 32 32)" fill="none" stroke="#C9A227" stroke-width="2"/>
        <path d="M22 33 L29 40 L43 25" fill="none" stroke="#C9A227" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <h2>核验通过</h2>
      <p class="seat" id="seatText">LUNE-88 · 白金席位</p>
      <p class="greet">晚上好，沈兰舟先生。绒厅已为你留位，今晚的演奏 21:30 开始。</p>
      <button class="primary" id="enterBtn" type="button">进入绒厅</button>
      <p class="enter-msg" id="enterMsg" aria-live="polite"></p>
    </div>
  </div>
  <p class="service">绒钥会员服务 · 每日 10:00 – 24:00</p>
</main>

<script>
(function(){
  var input=document.getElementById('codeInput');
  var btn=document.getElementById('checkBtn');
  var errBox=document.getElementById('errorBox');
  var errText=document.getElementById('errorText');
  var att=document.getElementById('attemptText');
  var howtoBtn=document.getElementById('howtoBtn');
  var howtoPanel=document.getElementById('howtoPanel');
  var checkView=document.getElementById('checkView');
  var passView=document.getElementById('passView');
  var seat=document.getElementById('seatText');
  var enterBtn=document.getElementById('enterBtn');
  var enterMsg=document.getElementById('enterMsg');
  var fails=0;
  var VALID='LUNE-88';

  btn.addEventListener('click',function(){
    var v=input.value.trim().toUpperCase();
    if(v===VALID){
      checkView.hidden=true;
      passView.hidden=false;
      seat.textContent=v+' · 白金席位';
      return;
    }
    fails+=1;
    errBox.hidden=false;
    if(v.length===0){
      errText.textContent='请先输入请柬上的邀请码。';
    }else{
      errText.textContent='邀请码「'+v+'」无效或已被使用，请逐位核对后重试。';
    }
    att.textContent='已连续失败 '+fails+' 次，连续 5 次将临时锁定。';
    input.classList.remove('shake');
    void input.offsetWidth;
    input.classList.add('shake');
    input.focus();
    input.select();
  });
  input.addEventListener('input',function(){
    errBox.hidden=true;
  });
  input.addEventListener('keydown',function(e){
    if(e.key==='Enter'){btn.click();}
  });
  howtoBtn.addEventListener('click',function(){
    howtoPanel.hidden=!howtoPanel.hidden;
    howtoBtn.textContent=howtoPanel.hidden?'如何获得邀请？':'收起邀请说明';
  });
  enterBtn.addEventListener('click',function(){
    enterMsg.textContent='门僮已为你开门，今夜好梦。';
  });
})();
</script>
</body>
</html>
