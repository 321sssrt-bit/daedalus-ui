<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>桃弹 PeachPop · 注册</title>
<style>
:root{
  --page:#FFF3E4;
  --surface:#FFFFFF;
  --ink:#22223B;
  --muted:#8A7B68;
  --pink:#FF5D8F;
  --orange:#FF9E00;
  --teal:#00C2A8;
  --yellow:#FFD23F;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  min-height:100vh;
  font-family:"PingFang SC","Microsoft YaHei","Segoe UI","Helvetica Neue",Arial,sans-serif;
  background:var(--page);
  color:var(--ink);
  display:flex;align-items:center;justify-content:center;
  padding:48px 24px;
  overflow-x:hidden;
}
.deco{position:fixed;inset:0;pointer-events:none;z-index:0}
.deco i,.deco svg{position:absolute;display:block}
.d-circle{width:86px;height:86px;border-radius:50%;background:var(--yellow);border:3px solid var(--ink);left:8%;top:13%}
.d-ring{width:64px;height:64px;border-radius:50%;border:8px solid var(--pink);right:9%;top:11%}
.d-square{width:56px;height:56px;background:var(--teal);border:3px solid var(--ink);left:13%;bottom:15%;transform:rotate(16deg)}
.d-bar{width:120px;height:22px;background:var(--orange);border:3px solid var(--ink);border-radius:999px;right:7%;bottom:19%;transform:rotate(-14deg)}
.d-zig{left:45%;top:5%}
.d-plus{right:25%;bottom:7%}
.card{
  position:relative;z-index:1;
  width:460px;max-width:100%;
  background:var(--surface);
  border:3px solid var(--ink);
  border-radius:28px;
  box-shadow:10px 10px 0 var(--ink);
  transform:rotate(-1.2deg);
  padding:36px 36px 30px;
  animation:pop .28s ease-out both;
}
@keyframes pop{
  from{opacity:0;transform:rotate(-1.2deg) scale(.96)}
  to{opacity:1;transform:rotate(-1.2deg) scale(1)}
}
.sticker{
  position:absolute;top:-26px;right:-18px;
  width:72px;height:72px;border-radius:50%;
  background:var(--pink);border:3px solid var(--ink);
  box-shadow:4px 4px 0 var(--ink);
  color:#FFFFFF;font-weight:800;font-size:14px;line-height:1.2;text-align:center;
  display:flex;align-items:center;justify-content:center;
  transform:rotate(12deg);
}
.title-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
h1{font-size:34px;font-weight:900;letter-spacing:2px}
.badge{
  display:inline-block;background:var(--yellow);
  border:2px solid var(--ink);border-radius:999px;
  padding:2px 12px;font-size:12px;font-weight:700;letter-spacing:2px;
  transform:rotate(-2deg);
}
.intro{font-size:14px;color:var(--muted);line-height:1.7;margin-bottom:20px}
.field{display:block;margin-bottom:16px}
.field-label{
  display:inline-block;font-size:13px;font-weight:700;margin-bottom:8px;
  background:var(--page);border:2px solid var(--ink);border-radius:8px;
  padding:2px 10px;transform:rotate(-1deg);
}
.field input{
  width:100%;height:52px;padding:0 16px;
  font-size:15px;color:var(--ink);
  background:var(--surface);
  border:3px solid var(--ink);border-radius:16px;
  outline:none;
  transition:box-shadow .15s ease,transform .15s ease;
}
.field input::placeholder{color:#B9AC99}
.field input:focus{box-shadow:4px 4px 0 var(--teal);transform:translate(-1px,-1px)}
.tags{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:6px}
.chip{
  appearance:none;cursor:pointer;
  border:2px solid var(--ink);border-radius:999px;
  background:var(--surface);color:var(--ink);
  font-size:13px;font-weight:700;padding:8px 14px;
  transition:transform .12s ease,box-shadow .12s ease,background .12s ease,color .12s ease;
}
.chip:hover{transform:translateY(-2px);box-shadow:3px 3px 0 var(--ink)}
.chip.on{background:var(--pink);color:#FFFFFF;box-shadow:3px 3px 0 var(--ink);transform:rotate(-2deg)}
.mini{font-size:12px;color:var(--muted);margin:2px 0 18px;line-height:1.6}
.primary{
  width:100%;height:56px;cursor:pointer;
  background:var(--pink);color:#FFFFFF;
  border:3px solid var(--ink);border-radius:18px;
  font-size:17px;font-weight:800;letter-spacing:3px;
  box-shadow:6px 6px 0 var(--ink);
  transition:transform .12s ease,box-shadow .12s ease,opacity .15s ease;
}
.primary:hover:not(:disabled){transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--ink)}
.primary:active:not(:disabled){transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.primary:disabled{opacity:.45;cursor:not-allowed;box-shadow:3px 3px 0 var(--ink)}
.alt{margin-top:18px;text-align:center;font-size:13px;color:var(--muted)}
.linkbtn{
  appearance:none;background:none;border:none;cursor:pointer;
  color:var(--orange);font-size:13px;font-weight:700;
  text-decoration:underline;text-underline-offset:3px;
  transition:color .15s ease;
}
.linkbtn:hover{color:var(--pink)}
.msg{min-height:22px;font-size:13px;font-weight:700;margin-top:12px;text-align:center;line-height:1.6}
.msg.error{color:#D64545}
.msg.ok{color:var(--teal)}
.success{text-align:center;padding:8px 0}
.big-check{
  width:88px;height:88px;margin:0 auto 18px;border-radius:50%;
  background:var(--teal);border:3px solid var(--ink);
  box-shadow:5px 5px 0 var(--ink);
  display:flex;align-items:center;justify-content:center;
}
.success h2{font-size:24px;font-weight:900;margin-bottom:10px}
.success p{font-size:14px;color:var(--muted);line-height:1.8;margin-bottom:16px}
.tag-summary{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:22px}
.tag-summary span{
  border:2px solid var(--ink);border-radius:999px;
  background:var(--yellow);font-size:12px;font-weight:700;padding:4px 12px;
}
.secondary{
  width:100%;height:52px;cursor:pointer;
  background:var(--teal);color:#FFFFFF;
  border:3px solid var(--ink);border-radius:18px;
  font-size:15px;font-weight:800;letter-spacing:2px;
  box-shadow:6px 6px 0 var(--ink);
  transition:transform .12s ease,box-shadow .12s ease;
}
.secondary:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--ink)}
.secondary:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
@media (max-width:900px){
  body{padding:24px 14px}
  .card{transform:none;box-shadow:6px 6px 0 var(--ink);padding:28px 20px 24px}
  .sticker{right:-8px;top:-22px}
  .d-zig,.d-plus{display:none}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
  }
}
</style>
</head>
<body>
<div class="deco" aria-hidden="true">
  <i class="d-circle"></i>
  <i class="d-ring"></i>
  <i class="d-square"></i>
  <i class="d-bar"></i>
  <svg class="d-zig" viewBox="0 0 120 24" width="120" height="24"><polyline points="0,18 15,6 30,18 45,6 60,18 75,6 90,18 105,6 120,18" fill="none" stroke="#FF9E00" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <svg class="d-plus" viewBox="0 0 40 40" width="40" height="40"><path d="M20 4 V36 M4 20 H36" stroke="#22223B" stroke-width="6" stroke-linecap="round"/></svg>
</div>

<main class="card">
  <div class="sticker">新用户<br>报到</div>

  <div id="formView">
    <div class="title-row">
      <h1>桃弹</h1>
      <span class="badge">PEACHPOP · 手账社区</span>
    </div>
    <p class="intro">3 分钟开个号，把手账、胶带和灵感统统装进来。已有 42 万贴纸党在这里安家。</p>

    <form id="regForm" novalidate>
      <label class="field">
        <span class="field-label">昵称</span>
        <input id="nickInput" type="text" maxlength="12" placeholder="比如：桃桃乌龙" autocomplete="nickname">
      </label>
      <label class="field">
        <span class="field-label">手机号</span>
        <input id="phoneInput" type="tel" inputmode="numeric" maxlength="11" placeholder="用于登录和找回账号" autocomplete="tel">
      </label>
      <label class="field">
        <span class="field-label">设置密码</span>
        <input id="passInput" type="password" placeholder="至少 6 位，建议字母加数字" autocomplete="new-password">
      </label>

      <span class="field-label">兴趣标签 · 至少选 1 个</span>
      <div class="tags" id="tagBox">
        <button type="button" class="chip" data-tag="手账排版">手账排版</button>
        <button type="button" class="chip" data-tag="胶带收藏">胶带收藏</button>
        <button type="button" class="chip" data-tag="拼贴灵感">拼贴灵感</button>
        <button type="button" class="chip" data-tag="手绘涂鸦">手绘涂鸦</button>
        <button type="button" class="chip" data-tag="日程打卡">日程打卡</button>
        <button type="button" class="chip" data-tag="探店地图">探店地图</button>
      </div>
      <p class="mini">选好后，首页会先推你感兴趣的内容。</p>

      <button class="primary" id="regBtn" type="submit" disabled>注册并弹进来</button>
      <p class="msg" id="formMsg" aria-live="polite"></p>
    </form>

    <p class="alt">已有账号？<button class="linkbtn" id="toLogin" type="button">去登录</button></p>
  </div>

  <div class="success" id="successView" hidden>
    <div class="big-check">
      <svg viewBox="0 0 40 40" width="44" height="44" aria-hidden="true"><path d="M9 21 L17 29 L31 12" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <h2 id="welcomeTitle">欢迎入坑！</h2>
    <p id="welcomeText">确认短信已发出，手账本已为你备好。</p>
    <div class="tag-summary" id="tagSummary"></div>
    <button class="secondary" id="startBtn" type="button">开始装修我的手账</button>
    <p class="msg ok" id="startMsg" aria-live="polite"></p>
  </div>
</main>

<script>
(function(){
  var chips=Array.prototype.slice.call(document.querySelectorAll('.chip'));
  var nick=document.getElementById('nickInput');
  var phone=document.getElementById('phoneInput');
  var pass=document.getElementById('passInput');
  var regBtn=document.getElementById('regBtn');
  var msg=document.getElementById('formMsg');
  var form=document.getElementById('regForm');
  var toLogin=document.getElementById('toLogin');
  var formView=document.getElementById('formView');
  var successView=document.getElementById('successView');
  var welcomeTitle=document.getElementById('welcomeTitle');
  var welcomeText=document.getElementById('welcomeText');
  var tagSummary=document.getElementById('tagSummary');
  var startBtn=document.getElementById('startBtn');
  var startMsg=document.getElementById('startMsg');
  var picked=[];

  function refresh(){
    var ok=nick.value.trim().length>=2 && /^1\d{10}$/.test(phone.value.trim()) && pass.value.length>=6 && picked.length>0;
    regBtn.disabled=!ok;
    if(!regBtn.disabled){msg.textContent='';msg.className='msg';}
  }
  chips.forEach(function(c){
    c.addEventListener('click',function(){
      var t=c.getAttribute('data-tag');
      var i=picked.indexOf(t);
      if(i>=0){picked.splice(i,1);c.classList.remove('on');}
      else{picked.push(t);c.classList.add('on');}
      refresh();
    });
  });
  [nick,phone,pass].forEach(function(el){
    el.addEventListener('input',refresh);
  });
  toLogin.addEventListener('click',function(){
    msg.className='msg ok';
    msg.textContent='收到！登录入口在首页右上角，先去逛逛也可以。';
  });
  form.addEventListener('submit',function(e){
    e.preventDefault();
    regBtn.textContent='装弹中…';
    regBtn.disabled=true;
    setTimeout(function(){
      var p=phone.value.trim();
      formView.hidden=true;
      successView.hidden=false;
      welcomeTitle.textContent='欢迎入坑，'+nick.value.trim()+'！';
      welcomeText.textContent='确认短信已发往 '+p.slice(0,3)+'****'+p.slice(7)+'，手账本已为你备好。';
      tagSummary.innerHTML='';
      picked.forEach(function(t){
        var s=document.createElement('span');
        s.textContent=t;
        tagSummary.appendChild(s);
      });
    },600);
  });
  startBtn.addEventListener('click',function(){
    startMsg.textContent='第一页空白手账已铺开，去贴第一张胶带吧！';
  });
  refresh();
})();
</script>
</body>
</html>
