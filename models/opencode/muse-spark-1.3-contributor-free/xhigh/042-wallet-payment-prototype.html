<!doctype html><html lang='zh-CN'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>042 钱包支付产品 · 转账机</title><style>:root{--page:#18181B;--surface:#27272A;--text:#F4F4F5;--muted:#A1A1AA;--accent:#FA4D6D;--accent2:#22D3EE;--line:#3F3F46;--r:24px;--pad:56px;--f:"Songti SC","SimSun",serif,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--text);font:15px/1.6 var(--f)}.top{display:flex;align-items:center;gap:16px;padding:14px 28px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:10px;font-weight:800}.nav{display:flex;gap:14px;color:var(--muted)}.navitem{padding:6px 12px;border-radius:999px}.navitem:first-child{background:var(--text);color:var(--surface)}.userdot{margin-left:auto;width:36px;height:36px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center}.wrap{max-width:1180px;margin:0 auto;padding:36px 28px 80px;display:grid;gap:24px}.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:32px}.card.wide{padding:36px}.cols{display:grid;grid-template-columns:220px 1fr;gap:20px}.cols2{display:grid;grid-template-columns:1fr 1fr;gap:22px}.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:14px 0}.nums div{background:var(--page);border:1px solid var(--line);border-radius:var(--r);padding:16px}.nums b{font-size:28px;display:block}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.col{background:var(--page);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-height:180px}.kc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.good,.tier,.mini{background:var(--page);border:1px solid var(--line);border-radius:var(--r);padding:14px}.tier.hot{outline:3px solid var(--accent)}h1{font-size:30px;margin:0 0 8px}.sub,.hint{color:var(--muted)}.fld{display:grid;gap:8px;margin:12px 0}.fld input,.fld textarea{padding:12px 14px;border-radius:10px;border:1px solid var(--line);font:inherit;background:#fff;color:#111}.primary{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:12px 20px;font-weight:700;cursor:pointer;min-height:44px}.ghost{background:transparent;border:1px solid var(--line);border-radius:10px;padding:10px 16px;cursor:pointer;min-height:44px;color:var(--text)}.quiet,.ghostdanger{background:transparent;border:1px dashed var(--line);border-radius:10px;padding:10px 16px;cursor:pointer}.danger{background:#B91C1C;color:#fff;border:0;border-radius:10px;padding:12px 20px;min-height:44px}.danger:disabled,.primary:disabled{opacity:.45}.rowlinks,.cta,.mcta,.pctl{display:flex;gap:12px;align-items:center;margin-top:14px;flex-wrap:wrap}.err,.warn{color:#B91C1C;background:#FEF2F2;border:1px solid #FECACA;padding:10px 12px;border-radius:10px}.steps{display:flex;gap:10px;list-style:none;padding:0}.steps li{padding:8px 14px;border-radius:999px;background:var(--page);border:1px solid var(--line)}.steps li.on{background:var(--accent);color:#fff}.steps li.done{background:var(--accent2);color:#fff}.otp{display:flex;gap:8px}.otp input{width:48px;height:56px;text-align:center;font-size:22px;border-radius:10px;border:1px solid var(--line)}.meter{height:10px;background:var(--page);border-radius:99px;overflow:hidden;border:1px solid var(--line)}.meter i{display:block;height:100%;background:var(--accent2);width:10%}.seg{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;cursor:pointer;min-height:40px}.seg button.on{background:var(--text);color:var(--surface)}.chart{width:100%;height:140px;background:var(--page);border:1px solid var(--line);border-radius:var(--r)}.chart polyline{stroke:var(--accent)}.cal .days{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.cal button{padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer}.cal button.has{border-color:var(--accent)}.cal button.sel{background:var(--accent);color:#fff}.detail,.emptybox,.previewbox{background:var(--page);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-top:14px}.maillist,.notifs,.saves,.idx,.cart,.bills,.files,.flows,.msgs,.chats,.feedm{list-style:none;padding:0;display:grid;gap:10px}.maillist li,.notifs li,.saves li,.idx li,.cart li,.bills li,.files li{background:var(--page);border:1px solid var(--line);border-radius:10px;padding:12px}.maillist li.unread,.notifs li.un{border-left:6px solid var(--accent)}.price,.total{font-size:24px}.drop{display:block;border:2px dashed var(--line);border-radius:var(--r);padding:26px;text-align:center;background:var(--page)}.filters{display:flex;gap:12px;flex-wrap:wrap}.chips{display:flex;gap:8px}.chips button{border:1px solid var(--line);border-radius:999px;padding:8px 12px;background:var(--surface)}.foot{text-align:center;color:var(--muted);padding:30px}.phonestage{min-height:100vh;display:grid;place-items:center;padding:28px;background:var(--page)}.phone{width:390px;max-width:100%;min-height:700px;background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:22px;display:grid;gap:12px;align-content:start}.mtop{text-align:center;color:var(--muted)}.mhead b{font-size:34px;display:block}.tabbar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.tabbar button{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--page)}.tabbar button.on{background:var(--text);color:var(--surface)}.cover{height:180px;border-radius:18px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:22px}.prog{height:10px;background:var(--page);border:1px solid var(--line);border-radius:99px;overflow:hidden}.prog i{display:block;height:100%;background:var(--accent)}.bodycopy{font-size:16px}.okbig{width:64px;height:64px;border-radius:50%;background:var(--accent2);color:#fff;display:grid;place-items:center;font-size:30px}.trains button.on{outline:3px solid var(--accent)}.sendrow{display:grid;grid-template-columns:1fr auto auto;gap:8px}.sendrow input{padding:10px;border-radius:10px;border:1px solid var(--line)}@media(max-width:820px){.wrap{padding:20px 14px}.cols,.cols2,.board{grid-template-columns:1fr}.top{flex-wrap:wrap}}@media(prefers-reduced-motion:reduce){*{animation:none;transition:none;scroll-behavior:auto}}</style></head><body><main class='mwrap'><div class='mtop'>转账机 · 钱包支付产品</div><div class='phonestage'><div class='phone' role='main'><div class='mhead'><span>余额</span><b id='t042-bal'>¥1,200.00</b></div><label>收款人<select id='t042-to'><option>林晚</option><option>房东</option><option>咖啡馆</option></select></label><label>金额<input id='t042-amt' placeholder='输入金额' inputmode='decimal' value='900'></label><button class='primary' id='t042-go'>确认转账</button><p class='hint' id='t042-m'>输超过 1200 并确认，可触发余额不足。</p><div id='t042-ok' hidden>转账凭证 <b>TX-882131</b> · 已到账</div><div class='mcta'><button class='ghost' id='t042-fix'>改成 ¥200 重试</button><button class='ghost' id='t042-src'>切换零钱通</button></div><script>/* 支付 */(function(){document.getElementById('t042-go').addEventListener('click',function(){var a=parseFloat(document.getElementById('t042-amt').value||'0');if(a>1200){document.getElementById('t042-m').textContent='余额不足：可用 1200，转账已阻止。请降金额或换资金来源。';document.getElementById('t042-ok').hidden=true;}else{document.getElementById('t042-ok').hidden=false;document.getElementById('t042-m').textContent='转账成功。';}});document.getElementById('t042-fix').addEventListener('click',function(){document.getElementById('t042-amt').value='200';document.getElementById('t042-go').click();});})();</script></div></div></main></body></html>
