<!doctype html><html lang='zh-CN'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>043 即时通讯产品 · 对讲机</title><style>:root{--page:#F7FEE7;--surface:#FFFFFF;--text:#3F6212;--muted:#8A9A5B;--accent:#65A30D;--accent2:#0E7490;--line:#D9F99D;--r:2px;--pad:72px;--f:"Yuanti SC","PingFang SC",system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--text);font:15px/1.6 var(--f)}.top{display:flex;align-items:center;gap:16px;padding:14px 28px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:10px;font-weight:800}.nav{display:flex;gap:14px;color:var(--muted)}.navitem{padding:6px 12px;border-radius:999px}.navitem:first-child{background:var(--text);color:var(--surface)}.userdot{margin-left:auto;width:36px;height:36px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center}.wrap{max-width:1180px;margin:0 auto;padding:36px 28px 80px;display:grid;gap:24px}.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:32px}.card.wide{padding:36px}.cols{display:grid;grid-template-columns:220px 1fr;gap:20px}.cols2{display:grid;grid-template-columns:1fr 1fr;gap:22px}.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:14px 0}.nums div{background:var(--page);border:1px solid var(--line);border-radius:var(--r);padding:16px}.nums b{font-size:28px;display:block}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.col{background:var(--page);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-height:180px}.kc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.good,.tier,.mini{background:var(--page);border:1px solid var(--line);border-radius:var(--r);padding:14px}.tier.hot{outline:3px solid var(--accent)} umns:repeat(7,1fr);gap:8px}.cal button{padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer}.cal button.has{border-color:var(--accent)}.cal button.sel{background:var(--accent);color:#fff}.detail,.emptybox,.previewbox{background:var(--page);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-top:14px}.maillist,.notifs,.saves,.idx,.cart,.bills,.files,.flows,.msgs,.chats,.feedm{list-style:none;padding:0;display:grid;gap:10px}.maillist li,.notifs li,.saves li,.idx li,.cart li,.bills li,.files li{background:var(--page);border:1px solid var(--line);border-radius:10px;padding:12px}.maillist li.unread,.notifs li.un{border-left:6px solid var(--accent)}.price,.total{font-size:24px}.drop{display:block;border:2px dashed var(--line);border-radius:var(--r);padding:26px;text-align:center;background:var(--page)}.filters{display:flex;gap:12px;flex-wrap:wrap}.chips{display:flex;gap:8px}.chips button{border:1px solid var(--line);border-radius:999px;padding:8px 12px;background:var(--surface)}.foot{text-align:center;color:var(--muted);padding:30px}.phonestage{min-height:100vh;display:grid;place-items:center;padding:28px;background:var(--page)}.phone{width:390px;max-width:100%;min-height:700px;background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:22px;display:grid;gap:12px;align-content:start}.mtop{text-align:center;color:var(--muted)}.mhead b{font-size:34px;display:block}.tabbar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.tabbar button{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--page)}.tabbar button.on{background:var(--text);color:var(--surface)}.cover{height:180px;border-radius:18px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:22px}.prog{height:10px;background:var(--page);border:1px solid var(--line);border-radius:99px;overflow:hidden}.prog i{display:block;height:100%;background:var(--accent)}.bodycopy{font-size:16px}.okbig{width:64px;height:64px;border-radius:50%;background:var(--accent2);color:#fff;display:grid;place-items:center;font-size:30px}.trains button.on{outline:3px solid var(--accent)}.sendrow{display:grid;grid-template-columns:1fr auto auto;gap:8px}.sendrow input{padding:10px;border-radius:10px;border:1px solid var(--line)}@media(max-width:820px){.wrap{padding:20px 14px}.cols,.cols2,.board{grid-template-columns:1fr}.top{flex-wrap:wrap}}@media(prefers-reduced-motion:reduce){*{animation:none;transition:none;scroll-behavior:auto}}</style></head><body><main class='mwrap'><div class='mtop'>对讲机 · 即时通讯产品</div><div class='phonestage'><div class='phone' role='main'><ul class='chats'><li><b>林晚</b><span>在吗</span></li><li class='on'><b>协作群</b><span>周五评审</span></li></ul><ul class='msgs' id='t043-ms'><li>周舟：原型发我 <span>已送达</span></li></ul><div class='sendrow'><input id='t043-in' placeholder='输入消息'><button id='t043-fail'>下一条失败</button><button class='primary' id='t043-go'>发送</button></div><p class='hint'>点“下一条失败”再发送，可触发发送失败并重试。</p><script>/* 通讯 */(function(){var fail=false;var ms=document.getElementById('t043-ms');document.getElementById('t043-fail').addEventListener('click',function(){fail=true;});document.getElementById('t043-go').addEventListener('click',function(){var v=document.getElementById('t043-in').value||'你好';var li=document.createElement('li');if(fail){li.innerHTML='我：'+v+' <b>发送失败</b> <button>重试</button>';li.querySelector('button').addEventListener('click',function(){li.innerHTML='我：'+v+' <span>已送达</span>';fail=false;});fail=false;}else{li.innerHTML='我：'+v+' <span>已送达</span>';}ms.appendChild(li);});})();</script></div></div></main></body></html>
