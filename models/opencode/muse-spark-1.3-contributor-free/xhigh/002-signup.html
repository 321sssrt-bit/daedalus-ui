<!doctype html><html lang='zh-CN'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>002 注册 · 山外山</title><style>:root{--page:#0E1420;--surface:#182031;--text:#F2F5FA;--muted:#93A0B8;--accent:#5BC8E8;--accent2:#F5B942;--line:#26314A;--r:6px;--pad:56px;--f:"Songti SC","SimSun",serif,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--text);font:15px/1.6 var(--f)}.top{display:flex;align-items:center;gap:16px;padding:14px 28px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:10px;font-weight:800}.nav{display:flex;gap:14px;color:var(--muted)}.navitem{padding:6px 12px;border-radius:999px}.navitem:first-child{background:var(--text);color:var(--surface)}.userdot{margin-left:auto;width:36px;height:36px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center}.wrap{max-width:1180px;margin:0 auto;padding:36px 28px 80px;display:grid;gap:24px}.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:32px}.card.wide{padding:36px}.cols{display:grid;grid-template-columns:220px 1fr;gap:20px}.cols2{display:grid;grid-template-columns:1fr 1fr;gap:22px}.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:14px 0}.nums div{background:var(--page);border:1px solid var(--line);border-radius:var(--r);padding:16px}.nums b{font-size:28px;display:block}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.col{background:var(--page);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-height:180px}.kc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.good,.tier,.mini{background:var(--page);border:1px solid var(--line);border-radius:var(--r);padding:14px}.tier.hot{outline:3px solid var(--accent)}h1{font-size:30px;margin:0 0 8px}.sub,.hint{color:var(--muted)}.fld{display:grid;gap:8px;margin:12px 0}.fld input,.fld textarea{padding:12px 14px;border-radius:10px;border:1px solid var(--line);font:inherit;background:#fff;color:#111}.primary{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:12px 20px;font-weight:700;cursor:pointer;min-height:44px}.ghost{background:transparent;border:1px solid var(--line);border-radius:10px;padding:10px 16px;cursor:pointer;min-height:44px;color:var(--text)}.quiet,.ghostdanger{background:transparent;border:1px dashed var(--line);border-radius:10px;padding:10px 16px;cursor:pointer}.danger{background:#B91C1C;color:#fff;border:0;border-radius:10px;padding:12px 20px;min-height:44px}.danger:disabled,.primary:disabled{opacity:.45}.rowlinks,.cta,.mcta,.pctl{display:flex;gap:12px;align-items:center;margin-top:14px;flex-wrap:wrap}.err,.warn{color:#B91C1C;background:#FEF2F2;border:1px solid #FECACA;padding:10px 12px;border-radius:10px}.steps{display:flex;gap:10px;list-style:none;padding:0}.steps li{padding:8px 14px;border-radius:999px;background:var(--page);border:1px solid var(--line)}.steps li.on{background:var(--accent);color:#fff}.steps li.done{background:var(--accent2);color:#fff}.otp{display:flex;gap:8px}.otp input{width:48px;height:56px;text-align:center;font-size:22px;border-radius:10px;border:1px solid var(--line)}.meter{height:10px;background:var(--page);border-radius:99px;overflow:hidden;border:1px solid var(--line)}.meter i{display:block;height:100%;background:var(--accent2);width:10%}.seg{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;cursor:pointer;min-height:40px}.seg button.on{background:var(--text);color:var(--surface)}.chart{width:100%;height:140px;background:var(--page);border:1px solid var(--line);border-radius:var(--r)}.chart polyline{stroke:var(--accent)}.cal .days{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.cal button{padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer}.cal button.has{border-color:var(--accent)}.cal button.sel{background:var(--accent);color:#fff}.detail,.emptybox,.previewbox{background:var(--page);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-top:14px}.maillist,.notifs,.saves,.idx,.cart,.bills,.files,.flows,.msgs,.chats,.feedm{list-style:none;padding:0;display:grid;gap:10px}.maillist li,.notifs li,.saves li,.idx li,.cart li,.bills li,.files li{background:var(--page);border:1px solid var(--line);border-radius:10px;padding:12px}.maillist li.unread,.notifs li.un{border-left:6px solid var(--accent)}.price,.total{font-size:24px}.drop{display:block;border:2px dashed var(--line);border-radius:var(--r);padding:26px;text-align:center;background:var(--page)}.filters{display:flex;gap:12px;flex-wrap:wrap}.chips{display:flex;gap:8px}.chips button{border:1px solid var(--line);border-radius:999px;padding:8px 12px;background:var(--surface)}.foot{text-align:center;color:var(--muted);padding:30px}.phonestage{min-height:100vh;display:grid;place-items:center;padding:28px;background:var(--page)}.phone{width:390px;max-width:100%;min-height:700px;background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:22px;display:grid;gap:12px;align-content:start}.mtop{text-align:center;color:var(--muted)}.mhead b{font-size:34px;display:block}.tabbar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.tabbar button{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--page)}.tabbar button.on{background:var(--text);color:var(--surface)}.cover{height:180px;border-radius:18px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:22px}.prog{height:10px;background:var(--page);border:1px solid var(--line);border-radius:99px;overflow:hidden}.prog i{display:block;height:100%;background:var(--accent)}.bodycopy{font-size:16px}.okbig{width:64px;height:64px;border-radius:50%;background:var(--accent2);color:#fff;display:grid;place-items:center;font-size:30px}.trains button.on{outline:3px solid var(--accent)}.sendrow{display:grid;grid-template-columns:1fr auto auto;gap:8px}.sendrow input{padding:10px;border-radius:10px;border:1px solid var(--line)}@media(max-width:820px){.wrap{padding:20px 14px}.cols,.cols2,.board{grid-template-columns:1fr}.top{flex-wrap:wrap}}@media(prefers-reduced-motion:reduce){*{animation:none;transition:none;scroll-behavior:auto}}</style></head><body><header class='top' id='t002-top'><div class='brand'><svg viewBox='0 0 48 48' width='30' height='30' aria-hidden='true'><rect x='4' y='4' width='40' height='40' rx='12' fill='#5BC8E8'></rect><circle cx='19' cy='20' r='7' fill='#F5B942'></circle><rect x='27' y='26' width='12' height='6' rx='3' fill='#FFFFFF' opacity='.9'></rect></svg><b>山外山</b></div><nav class='nav' aria-label='主导航'><span class='navitem'>工作台</span><span class='navitem'>项目</span><span class='navitem'>消息</span><span class='navitem'>我的</span></nav><div class='userdot' id='t002-userdot' tabindex='0' role='button' aria-label='账号'>陈</div></header><main class='wrap'><section class='card'><h1>创建你的账号</h1><p class='sub'>两步就好，注册后直接开始用。</p><label class='fld'>昵称<input id='t002-nick' placeholder='给大家看的名字'></label><label class='fld'>邮箱<input id='t002-mail' placeholder='name@example.com'></label><label class='fld'>密码<input id='t002-pwd' type='password' placeholder='至少 8 位，含数字'></label><div class='meter' aria-live='polite'><i id='t002-bar'></i><span id='t002-tip'>密码强度：弱</span></div><button class='primary' id='t002-go'>注册并进入</button><p class='alt'>已有账号？<a href='#login'>去登录</a></p></section><aside class='side'><h2>注册后你会得到</h2><ol><li>免费工作区</li><li>10 个模板</li><li>7 天进阶试用</li></ol></aside><script>/* 注册 */(function(){var pwd=document.getElementById('t002-pwd');var bar=document.getElementById('t002-bar');var tip=document.getElementById('t002-tip');pwd.addEventListener('input',function(){var v=pwd.value;var s=v.length>10?2:(v.length>6?1:0);bar.style.width=(30+s*35)+'%';tip.textContent='密码强度：'+['弱','中','强'][s];});document.getElementById('t002-go').addEventListener('click',function(e){var b=e.target;b.textContent='正在创建…';setTimeout(function(){b.textContent='注册成功，去看看工作台';},500);});})();</script></main><footer class='foot'>© 2026 山外山 · 离线演示</footer></body></html>
