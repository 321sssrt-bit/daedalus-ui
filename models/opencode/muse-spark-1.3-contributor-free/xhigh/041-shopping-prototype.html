-sum');var list=document.getElementById('t041-cart');var msg=document.getElementById('t041-msg');var bad=false;function render(){var s=0;list.innerHTML='';cart.forEach(function(c){var li=document.createElement('li');li.textContent=c.n+' ×'+c.q+' ¥'+(c.p*c.q);list.appendChild(li);s+=c.p*c.q;});sum.textContent='¥'+s;}document.querySelectorAll('[data-id]').forEach(function(b){b.addEventListener('click',function(){var q=parseInt(document.getElementById('t041-qty').value||'1',10);cart.push({n:b.getAttribute('data-id'),p:b.getAttribute('data-id')==='bag'?129:89,q:q});render();msg.textContent='已加入购物车，请核对合计。';});});document.querySelector('[data-bad]').addEventListener('click',function(){bad=true;msg.textContent='已模拟：陶土包只剩 0 件，提交时会触发缺货。';});document.getElementById('t041-sub').addEventListener('click',function(){if(bad){msg.textContent='缺货：陶土包 标准款 已售罄，请改选保温杯或减少数量后再提交。提交已阻止。';return;}if(!cart.length){msg.textContent='购物车是空的，先加一件吧。';return;}document.getElementById('t041-ok').hidden=false;msg.textContent='订单成功，这就是恢复后的样子。';bad=false;});})();</script></main><footer class='foot'>© 2026 杂货铺 · 离线演示</footer></body></html>
