cent)}h1{font-size:30px;margin:0 0 8px}.sub,.hint{color:var(--muted)}.fld{display:grid;gap:8px;margin:12px 0}.fld input,.fld textarea{padding:12px 14px;border-radius:10px;border:1px solid var(--line);font:inherit;background:#fff;color:#111}.primary{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:12px 20px;font-weight:700;cursor:pointer;min-height:44px}.ghost{background:transparent;border:1px solid var(--line);border-radius:10px;padding:10px 16px;cursor:pointer;min-height:44px;color:var(--text)}.quiet,.ghostdanger{background:transparent;border:1px dashed var(--line);border-radius:10px;padding:10px 16px;cursor:pointer}.danger{background:#B91C1C;color:#fff;border:0;border-radius:10px;padding:12px 20px;min-height:44px}.danger:disabled,.primary:disabled{opacity:.45}.rowlinks,.cta,.mcta,.pctl{display:flex;gap:12px;align-items:center;margin-top:14px;flex-wrap:wrap}.err,.warn{color:#B91C1C;background:#FEF2F2;border:1px solid #FECACA;padding:10px 12px;border-radius:10px}.steps{display:flex;gap:10px;list-style:none;padding:0}.steps li{padding:8px 14px;border-radius:999px;background:var(--page);border:1px solid var(--line)}.steps li.on{background:var(--accent);color:#fff}.steps li.done{background:var(--accent2);color:#fff}.otp{display:flex;gap:8px}.otp input{width:48px;height:56px;text-align:center;font-size:22px;border-radius:10px;border:1px solid var(--line)}.meter{height:10px;background:var(--page);border-radius:99px;overflow:hidden;border:1px solid var(--line)}.meter i{display:block;height:100%;background:var(--accent2);width:10%}.seg{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;cursor:pointer;min-height:40px}.seg button.on{background:var(--text);color:var(--surface)}.chart{width:100%;height:140px;background:var(--page);border:1px solid var(--line);border-radius:var(--r)}.chart polyline{stroke:var(--accent)}.cal .days{display:grid;grid-templa
