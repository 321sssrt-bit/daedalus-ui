uerySelector('span').textContent,10);var p=parseInt(lis[i].querySelector('b').getAttribute('data-p'),10);s+=n*p;}t.textContent='¥'+s;}c.addEventListener('click',function(e){if(e.target.tagName!=='BUTTON')return;var li=e.target.closest('li');var n=li.querySelector('span');if(e.target.getAttribute('data-a')==='+')n.textContent=parseInt(n.textContent,10)+1;if(e.target.getAttribute('data-a')==='-')n.textContent=Math.max(1,parseInt(n.textContent,10)-1);if(e.target.getAttribute('data-a')==='x')li.remove();sum();});document.getElementById('t019-go').addEventListener('click',function(){this.textContent='正在前往结算…';});})();</script></main><footer class='foot'>© 2026 篮子 · 离线演示</footer></body></html>
