<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>径山户外 · 装备商店</title>
<style>
:root{
  --sand:#f3efe3;--card:#fffdf7;--ink:#22251c;--muted:#6f7263;--line:#ddd6c1;--olive:#3f4a2a;--olive-2:#59663c;--khaki:#d8cfb2;--orange:#e4572e;--orange-dk:#c2441f;--ok:#3b7d4f;--bad:#c23b2b;--warn:#b7791f;--bad-bg:#fbe9e5;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Avenir Next",sans-serif;
  --head:"Avenir Next","Helvetica Neue","PingFang SC",sans-serif;
  --mono:"SF Mono","Menlo","Consolas",monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--sand);color:var(--ink);font:14px/1.55 var(--sans)}
[hidden]{display:none!important}
button{font-family:inherit}
.top{position:sticky;top:0;z-index:20;height:64px;display:flex;align-items:center;gap:24px;padding:0 36px;background:var(--olive);color:#f3efe3}
.logo{display:flex;align-items:center;gap:10px;font:800 19px var(--head);letter-spacing:.04em;cursor:pointer;border:0;background:none;color:inherit}
.logo svg{width:30px;height:30px}
.cats{display:flex;gap:4px}
.cats button{border:0;background:none;color:#d6d9c6;font:14px var(--sans);padding:8px 12px;border-radius:999px;cursor:pointer}
.cats button:hover{color:#fff;background:#ffffff14}
.cats button[aria-pressed="true"]{background:#f3efe3;color:var(--olive);font-weight:600}
.search{margin-left:auto;width:240px;height:38px;border-radius:999px;border:0;background:#ffffff1f;color:#fff;padding:0 16px;font:13px var(--sans);outline:none}
.search::placeholder{color:#c9ccb8}
.search:focus{background:#ffffff33}
.cartbtn{height:40px;padding:0 16px;border-radius:999px;border:1.5px solid #f3efe3;background:transparent;color:#f3efe3;font:600 14px var(--sans);cursor:pointer;display:flex;align-items:center;gap:8px}
.cartbtn b{min-width:22px;height:22px;border-radius:11px;background:var(--orange);color:#fff;display:grid;place-items:center;font:700 12px var(--head);transition:transform .2s}
.cartbtn b.bump{transform:scale(1.35)}
main{max-width:1240px;margin:0 auto;padding:24px 36px 64px}
.crumb{font-size:12px;color:var(--muted);margin-bottom:14px;display:flex;gap:6px;align-items:center}
.crumb button{border:0;background:none;color:var(--muted);cursor:pointer;padding:0;font-size:12px;text-decoration:underline;text-underline-offset:3px}
.btn{height:46px;padding:0 22px;border-radius:12px;font:700 15px var(--sans);cursor:pointer;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background .15s,transform .1s}
.btn:hover{background:#f1ecdc}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.pri:hover{background:var(--orange-dk)}
.btn.dark{background:var(--olive);border-color:var(--olive);color:#fff}
.btn.dark:hover{background:var(--olive-2)}
.btn:disabled{background:#cfc9b6;border-color:#cfc9b6;color:#8a8574;cursor:not-allowed;transform:none}
.btn.sm{height:34px;padding:0 12px;font-size:13px;border-radius:9px}
.btn:focus-visible,.cats button:focus-visible,.cartbtn:focus-visible,.card:focus-visible,.sw:focus-visible,.sz:focus-visible,.step button:focus-visible,.link:focus-visible,.opt:focus-within,.crumb button:focus-visible,.logo:focus-visible{outline:3px solid #f2b84b;outline-offset:2px}
.link{border:0;background:none;color:var(--olive);font:600 13px var(--sans);cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px}
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;margin-bottom:22px}
.banner{border-radius:20px;background:linear-gradient(120deg,#3f4a2a,#6b7a45);color:#f3efe3;padding:26px 28px;position:relative;overflow:hidden;min-height:170px}
.banner small{font:700 11px var(--mono);letter-spacing:.2em;color:#e9d9a6}
.banner h1{margin:8px 0 6px;font:800 32px/1.15 var(--head)}
.banner p{margin:0;color:#d6d9c6;max-width:380px}
.banner svg{position:absolute;right:-10px;bottom:-6px;width:300px;opacity:.9}
.perks{display:grid;grid-template-rows:repeat(3,1fr);gap:10px}
.perks div{border-radius:14px;background:var(--card);border:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:12px}
.perks i{width:34px;height:34px;border-radius:10px;background:var(--khaki);display:grid;place-items:center;font-style:normal}
.perks b{display:block;font-size:14px}
.perks small{color:var(--muted);font-size:12px}
.listhead{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.listhead h2{margin:0;font:800 22px var(--head)}
.listhead span{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;cursor:pointer;text-align:left;padding:0;color:var(--ink);transition:transform .2s,box-shadow .2s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-3px);box-shadow:0 12px 26px #3f4a2a1f}
.card .pic{height:190px;background:#ece5d1;display:grid;place-items:center;position:relative}
.card .pic svg{width:150px;height:150px}
.card .tag{position:absolute;left:10px;top:10px;font:700 11px var(--sans);padding:3px 8px;border-radius:999px;background:var(--ink);color:#fff}
.card .tag.low{background:var(--orange)}
.card .body{padding:12px 14px 14px}
.card b{display:block;font-size:15px;line-height:1.35}
.card .dots{display:flex;gap:5px;margin:8px 0}
.card .dots i{width:12px;height:12px;border-radius:50%;border:1px solid #0002}
.card .price{font:800 18px var(--head)}
.card .price small{font:12px var(--sans);color:var(--muted);font-weight:400;margin-left:6px}
.pd{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:40px;align-items:start}
.gallery .big{height:480px;border-radius:24px;background:#ece5d1;display:grid;place-items:center;position:relative}
.gallery .big svg{width:340px;height:340px}
.gallery .thumbs{display:flex;gap:10px;margin-top:12px}
.gallery .thumbs button{width:76px;height:76px;border-radius:14px;border:2px solid transparent;background:#ece5d1;cursor:pointer;display:grid;place-items:center}
.gallery .thumbs button svg{width:56px;height:56px}
.gallery .thumbs button[aria-pressed="true"]{border-color:var(--olive)}
.info h1{margin:0 0 6px;font:800 30px/1.2 var(--head)}
.info .rate{color:var(--muted);font-size:13px;margin-bottom:14px}
.info .rate b{color:var(--warn)}
.info .price{font:800 32px var(--head);margin-bottom:18px}
.info .price small{font:14px var(--sans);color:var(--muted);text-decoration:line-through;margin-left:8px;font-weight:400}
.opt{margin-bottom:18px}
.opt h3{margin:0 0 8px;font:600 13px var(--sans);display:flex;justify-content:space-between}
.opt h3 span{font-weight:400;color:var(--muted)}
.sws{display:flex;gap:10px}
.sw{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);padding:4px;background:var(--card);cursor:pointer}
.sw i{display:block;width:100%;height:100%;border-radius:50%}
.sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--ink)}
.szs{display:flex;gap:8px;flex-wrap:wrap}
.sz{min-width:56px;height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font:600 14px var(--head);cursor:pointer;position:relative;padding:0 10px;color:var(--ink)}
.sz:hover:not(:disabled){border-color:var(--ink)}
.sz[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.sz:disabled{color:#b3ad99;background:repeating-linear-gradient(135deg,#f3efe3 0 6px,#ebe5d2 6px 12px);cursor:not-allowed}
.sz small{position:absolute;top:-8px;right:-6px;background:var(--orange);color:#fff;font:700 10px var(--sans);padding:1px 5px;border-radius:999px}
.step{display:inline-flex;align-items:center;border:1.5px solid var(--ink);border-radius:12px;overflow:hidden;background:var(--card)}
.step button{width:42px;height:42px;border:0;background:none;font:700 18px var(--sans);cursor:pointer;color:var(--ink)}
.step button:disabled{color:#c4bea9;cursor:not-allowed}
.step output{min-width:44px;text-align:center;font:700 16px var(--head)}
.step.sm button{width:32px;height:32px;font-size:15px}
.step.sm output{min-width:32px;font-size:14px}
.stock{font-size:13px;margin:10px 0 20px;display:flex;align-items:center;gap:8px}
.stock i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.stock.low i{background:var(--orange)}
.stock.out i{background:var(--bad)}
.buy{display:grid;grid-template-columns:1fr auto;gap:10px;margin-bottom:22px}
.specs{border-top:1px solid var(--line);padding-top:14px;display:grid;grid-template-columns:auto 1fr;gap:6px 18px;font-size:13px}
.specs dt{color:var(--muted)}
.specs dd{margin:0}
.cartwrap,.co{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:28px;align-items:start}
h1.pt{margin:0 0 16px;font:800 28px var(--head)}
.line{display:grid;grid-template-columns:96px minmax(0,1fr) auto auto 36px;gap:16px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:12px;transition:border-color .2s,background .2s}
.line .pic{width:96px;height:96px;border-radius:12px;background:#ece5d1;display:grid;place-items:center}
.line .pic svg{width:76px;height:76px}
.line b{display:block;font-size:15px}
.line .var{color:var(--muted);font-size:13px}
.line .unit{font:600 13px var(--head);color:var(--muted)}
.line .tot{font:800 17px var(--head);min-width:90px;text-align:right}
.line .rm{width:34px;height:34px;border-radius:50%;border:0;background:none;color:var(--muted);cursor:pointer;font-size:15px}
.line .rm:hover{background:var(--bad-bg);color:var(--bad)}
.line .sim{display:inline-flex;align-items:center;gap:6px;margin-top:6px;border:1px dashed var(--warn);background:#fbf3e3;color:#8a5a12;border-radius:999px;padding:3px 10px;font:600 12px var(--sans);cursor:pointer}
.line .sim:hover{background:#f6e7c8}
.line .sim:disabled{opacity:.6;cursor:default}
.line.bad{border-color:var(--bad);background:var(--bad-bg)}
.line .fix{grid-column:2/-1;display:none;border-top:1px dashed #e3b3aa;padding-top:10px;margin-top:2px;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.line.bad .fix{display:flex}
.line .fix strong{color:var(--bad)}
.line .fix select{height:34px;border-radius:9px;border:1.5px solid var(--line);background:var(--card);padding:0 8px;font:13px var(--sans)}
.empty{background:var(--card);border:1.5px dashed var(--line);border-radius:18px;padding:40px 20px;text-align:center;color:var(--muted)}
.summary{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;position:sticky;top:84px}
.summary h2{margin:0 0 12px;font:800 18px var(--head)}
.summary .row{display:flex;justify-content:space-between;font-size:14px;padding:5px 0}
.summary .row span:first-child{color:var(--muted)}
.summary .free{font-size:12px;color:var(--ok);margin:2px 0 8px}
.summary .total{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);margin-top:8px;padding-top:12px}
.summary .total b{font:800 28px var(--head);color:var(--orange-dk)}
.summary .btn{width:100%;margin-top:14px}
.summary .note{font-size:12px;color:var(--muted);margin-top:10px;text-align:center}
.summary .mini{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px}
.summary .mini .pic{width:48px;height:48px;border-radius:10px;background:#ece5d1;display:grid;place-items:center}
.summary .mini .pic svg{width:38px;height:38px}
.summary .mini small{display:block;color:var(--muted);font-size:12px}
.summary .mini.bad{background:var(--bad-bg);margin:0 -10px;padding:8px 10px;border-radius:10px;border-bottom-color:transparent}
.summary .mini.bad small{color:var(--bad);font-weight:600}
.steps{display:flex;gap:8px;margin-bottom:18px;list-style:none;padding:0}
.steps li{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.steps li i{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font:700 12px var(--head);font-style:normal}
.steps li.on{color:var(--ink);font-weight:600}
.steps li.on i{background:var(--ink);color:#fff;border-color:var(--ink)}
.steps li.done i{background:var(--ok);color:#fff;border-color:var(--ok)}
.steps li+li::before{content:'';width:28px;height:1.5px;background:var(--line);margin-right:8px}
.alert{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:start;background:var(--bad-bg);border:1.5px solid var(--bad);border-radius:16px;padding:14px 16px;margin-bottom:16px;animation:shake .35s}
.alert i{width:28px;height:28px;border-radius:50%;background:var(--bad);color:#fff;display:grid;place-items:center;font-style:normal;font-weight:800}
.alert b{display:block;color:var(--bad);font-size:15px}
.alert ul{margin:6px 0 0;padding-left:18px;font-size:13px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 20px;margin-bottom:14px}
.panel h3{margin:0 0 12px;font:700 15px var(--sans);display:flex;justify-content:space-between}
.addr b{font-size:15px}
.addr p{margin:4px 0 0;color:var(--muted);font-size:13px}
.opts{display:grid;gap:8px}
.optrow{display:grid;grid-template-columns:20px 1fr auto;gap:12px;align-items:center;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.optrow:has(input:checked){border-color:var(--ink);background:#f7f3e6}
.optrow input{accent-color:var(--olive);width:16px;height:16px;margin:0}
.optrow small{display:block;color:var(--muted);font-size:12px}
.done{max-width:760px;margin:10px auto 0;text-align:center}
.done .tick{width:76px;height:76px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;margin:0 auto 14px;font-size:36px;animation:pop .45s cubic-bezier(.2,1.5,.4,1)}
.done h1{margin:0 0 4px;font:800 30px var(--head)}
.done .sub{color:var(--muted);margin:0 0 22px}
.receipt{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px 24px;margin-bottom:18px;position:relative}
.receipt::before{content:'';position:absolute;left:24px;right:24px;top:0;height:5px;background:repeating-linear-gradient(90deg,var(--olive) 0 14px,var(--khaki) 14px 28px);border-radius:0 0 4px 4px}
.receipt .meta{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding-bottom:14px;border-bottom:1px dashed var(--line);margin-bottom:10px}
.receipt .meta small{display:block;color:var(--muted);font-size:12px}
.receipt .meta b{font:700 15px var(--head)}
.receipt .meta .no{font-family:var(--mono);font-size:14px}
.receipt .r{display:flex;justify-content:space-between;padding:6px 0;font-size:14px}
.receipt .r.t{border-top:1px solid var(--line);margin-top:6px;padding-top:12px;font-size:16px}
.receipt .r.t b{font:800 22px var(--head);color:var(--orange-dk)}
.toast{position:fixed;right:28px;bottom:28px;z-index:40;background:var(--ink);color:#fff;border-radius:14px;padding:12px 16px;display:flex;align-items:center;gap:14px;font-size:13px;box-shadow:0 12px 30px #0005;transform:translateY(20px);opacity:0;pointer-events:none;transition:all .25s}
.toast.show{transform:none;opacity:1;pointer-events:auto}
.toast .btn{height:32px;font-size:13px;padding:0 12px;white-space:nowrap;flex:none;border-color:#fff;background:transparent;color:#fff}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes pop{from{transform:scale(.3)}to{transform:scale(1)}}
@media (max-width:1100px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.cats{display:none}.hero{grid-template-columns:1fr}.perks{grid-template-rows:none;grid-template-columns:repeat(3,1fr)}}
@media (max-width:860px){.pd,.cartwrap,.co{grid-template-columns:1fr}.summary{position:static}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.search{display:none}main{padding:18px 16px 48px}.top{padding:0 16px}.gallery .big{height:340px}.gallery .big svg{width:240px;height:240px}.line{grid-template-columns:72px 1fr auto;grid-template-areas:none}.line .pic{width:72px;height:72px}.line .unit,.line .tot{grid-column:2}.perks{grid-template-columns:1fr}.receipt .meta{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

  <nav class="cats" id="cats" aria-label="商品分类"></nav>

function totals(){const sub=S.cart.reduce((a,l)=>a+prod(l.pid).price*l.qty,0);const ship=sub>=599||!sub?0:15;const exp=S.view==='checkout'||S.view==='done'?S.ship:0;return{sub,ship,exp,total:sub+ship+exp}}
function lineHtml(l,i,withFix){
  const p=prod(l.pid),st=stockOf(p,l.color,l.size),bad=S.err&&S.err.includes(i);
  const alts=[];p.colors.forEach(c=>p.sizes.forEach(s=>{const n=stockOf(p,c[0],s);if(n>=1&&!(c[0]===l.color&&s===l.size))alts.push([c[0],s,n])}));
  return '<div class="line'+(bad?' bad':'')+'" data-i="'+i+'"><div class="pic">'+ART[p.art](colorHex(p,l.color))+'</div><div><b>'+p.n+'</b><span class="var">'+l.color+' · '+l.size+'</span><br>'+
   (withFix?'<button class="sim" type="button" data-sim="'+i+'" '+(S.simmed[i]?'disabled':'')+'>⚡ '+(S.simmed[i]?'已模拟：他人刚抢购了该规格':'演示：模拟此规格被他人抢购')+'</button>':'')+'</div>'+
   '<span class="unit">'+fmt(p.price)+'</span><div class="step sm"><button type="button" data-lq="-1" data-i="'+i+'" aria-label="减少 '+p.n+'" '+(l.qty<=1?'disabled':'')+'>−</button><output>'+l.qty+'</output><button type="button" data-lq="1" data-i="'+i+'" aria-label="增加 '+p.n+'" '+(l.qty>=5?'disabled':'')+'>＋</button></div>'+
   '<span class="tot">'+fmt(p.price*l.qty)+'</span><button class="rm" type="button" data-rm="'+i+'" aria-label="移除 '+p.n+'">✕</button>'+
   '<div class="fix"><strong>'+(st===0?'该规格已售罄':'库存仅剩 '+st+' 件，你选了 '+l.qty+' 件')+'</strong>'+(st>0?'<button class="btn sm dark" type="button" data-reduce="'+i+'">减到 '+st+' 件</button>':'')+
   (alts.length?'<label>改选 <select data-alt="'+i+'" aria-label="改选有货规格"><option value="">选择有货规格…</option>'+alts.map(a=>'<option value="'+a[0]+'|'+a[1]+'">'+a[0]+' · '+a[1]+'（有货 '+a[2]+'）</option>').join('')+'</select></label>':'')+'<button class="link" type="button" data-rm="'+i+'">移除这件</button></div></div>';
}

  return '<div class="alert" role="alert"><i>!</i><div><b>库存不足，订单未提交</b>以下规格库存不够，请减少数量或改选有货规格后再提交：<ul>'+items+'</ul></div><button class="link" type="button" data-go="cart">在装备袋中修改</button></div>'}
function vCheckout(){
  const t=totals();
  return '<ol class="steps"><li class="done"><i>✓</i>装备袋</li><li class="on"><i>2</i>确认订单</li><li><i>3</i>完成</li></ol>'+
  '<section class="co"><div>'+(S.err?errBox()+S.cart.map((l,i)=>S.err.includes(i)?lineHtml(l,i,false):'').join(''):'')+
  '<div class="panel"><h3>收货信息 <button class="link" type="button">修改</button></h3><div class="addr"><b>林野 · 139 **** 0526</b><p>浙江省杭州市西湖区 留下街道 西溪路 525 号 · 工作日可收</p></div></div>'+
  '<div class="panel"><h3>配送方式</h3><div class="opts"><label class="optrow"><input type="radio" name="ship" value="0" '+(S.ship===0?'checked':'')+'><span>标准快递<small>预计 10 月 25 日送达</small></span><span>'+(t.ship?fmt(t.ship):'免费')+'</span></label><label class="optrow"><input type="radio" name="ship" value="25" '+(S.ship===25?'checked':'')+'><span>次日达加急<small>明天 18:00 前送达</small></span><span>+¥25</span></label></div></div>'+
  '<div class="panel"><h3>支付方式</h3><div class="opts"><label class="optrow"><input type="radio" name="pay" value="wx" '+(S.pay==='wx'?'checked':'')+'><span>微信支付<small>提交后跳转支付</small></span><span></span></label><label class="optrow"><input type="radio" name="pay" value="ali" '+(S.pay==='ali'?'checked':'')+'><span>支付宝<small>支持花呗分期</small></span><span></span></label></div></div></div>'+
  '<aside class="summary"><h2>订单摘要</h2>'+S.cart.map((l,i)=>{const p=prod(l.pid),bad=S.err&&S.err.includes(i);return '<div class="mini'+(bad?' bad':'')+'"><div class="pic">'+ART[p.art](colorHex(p,l.color))+'</div><div>'+p.n+'<small>'+l.color+' · '+l.size+' × '+l.qty+(bad?' · 库存不足':'')+'</small></div><span>'+fmt(p.price*l.qty)+'</span></div>'}).join('')+
  '<div class="row" style="margin-top:8px"><span>商品小计</span><span>'+fmt(t.sub)+'</span></div><div class="row"><span>运费</span><span>'+(t.ship?fmt(t.ship):'免运费')+'</span></div>'+(t.exp?'<div class="row"><span>次日达</span><span>'+fmt(t.exp)+'</span></div>':'')+

  return '<section class="done"><div class="tick">✓</div><h1>订单已提交</h1><p class="sub">我们已为你锁定库存，仓库会在今天 16:00 前发货。</p>'+

   o.lines.map(l=>'<div class="r"><span>'+l.n+' · '+l.v+' × '+l.q+'</span><span>'+fmt(l.t)+'</span></div>').join('')+
   '<div class="r"><span>运费'+(o.exp?' + 次日达':'')+'</span><span>'+fmt(o.ship+o.exp)+'</span></div><div class="r t"><span>实付（'+(o.pay==='wx'?'微信支付':'支付宝')+'）</span><b>'+fmt(o.total)+'</b></div></div>'+

function render(){
  $('cats').innerHTML=cats.map(c=>'<button type="button" data-cat="'+c+'" aria-pressed="'+(S.view==='browse'&&S.cat===c)+'">'+c+'</button>').join('');
  $('cartN').textContent=S.cart.reduce((a,l)=>a+l.qty,0);
  app.innerHTML=S.view==='browse'?vBrowse():S.view==='product'?vProduct():S.view==='cart'?vCart():S.view==='checkout'?vCheckout():vDone();
  bind();
}
function toast(t){$('toastT').textContent=t;$('toast').classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>$('toast').classList.remove('show'),3200)}
function bump(){const b=$('cartN');b.classList.add('bump');setTimeout(()=>b.classList.remove('bump'),200)}
/* 库存校验：返回超量行索引 */
function check(){const bad=[];S.cart.forEach((l,i)=>{if(l.qty>stockOf(prod(l.pid),l.color,l.size))bad.push(i)});return bad}
function addToCart(){const p=prod(S.pid);const ex=S.cart.find(l=>l.pid===p.id&&l.color===S.color&&l.size===S.size);
  if(ex)ex.qty=Math.min(5,ex.qty+S.qty);else S.cart.push({pid:p.id,color:S.color,size:S.size,qty:S.qty});bump();}
function bind(){
  app.querySelectorAll('[data-pid]').forEach(b=>b.onclick=()=>{const p=prod(b.dataset.pid);go('product',{pid:p.id,color:p.colors[0][0],size:p.sizes.length===1?p.sizes[0]:null,qty:1})});
  document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>go('browse',{cat:b.dataset.cat}));
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
  app.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{S.color=b.dataset.color;const p=prod(S.pid);if(S.size&&stockOf(p,S.color,S.size)===0)S.size=p.sizes.length===1?p.sizes[0]:null;render()});
  app.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{S.size=b.dataset.size;render()});
  app.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{S.qty+=+b.dataset.q;render()});
  const add=$('add');if(add)add.onclick=()=>{addToCart();toast('已加入装备袋：'+prod(S.pid).n+' · '+S.color+' · '+S.size+' × '+S.qty);render()};
  const bn=$('buyNow');if(bn)bn.onclick=()=>{addToCart();S.err=null;go('cart')};
  app.querySelectorAll('[data-lq]').forEach(b=>b.onclick=()=>{const l=S.cart[+b.dataset.i];l.qty=Math.max(1,Math.min(5,l.qty+ +b.dataset.lq));if(S.err){S.err=check();if(!S.err.length)S.err=null}render()});
  app.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{S.cart.splice(+b.dataset.rm,1);S.simmed={};S.err=S.err?check():null;if(S.err&&!S.err.length)S.err=null;render()});
  app.querySelectorAll('[data-sim]').forEach(b=>b.onclick=()=>{const i=+b.dataset.sim,l=S.cart[i],p=prod(l.pid);p.stock[l.color+'|'+l.size]=l.qty>1?1:0;S.simmed[i]=1;render();toast('演示：'+l.color+' · '+l.size+' 的库存刚被他人买走，结算时将无法通过校验')});
  app.querySelectorAll('[data-reduce]').forEach(b=>b.onclick=()=>{const l=S.cart[+b.dataset.reduce];l.qty=stockOf(prod(l.pid),l.color,l.size);S.err=check();if(!S.err.length)S.err=null;render()});
  app.querySelectorAll('[data-alt]').forEach(s=>s.onchange=()=>{if(!s.value)return;const l=S.cart[+s.dataset.alt],[c,z]=s.value.split('|');l.color=c;l.size=z;l.qty=Math.min(l.qty,stockOf(prod(l.pid),c,z));S.err=check();if(!S.err.length)S.err=null;render()});
  const toCo=$('toCo');if(toCo)toCo.onclick=()=>{S.err=null;go('checkout')};
  app.querySelectorAll('[name=ship]').forEach(r=>r.onchange=()=>{S.ship=+r.value;render()});
  app.querySelectorAll('[name=pay]').forEach(r=>r.onchange=()=>{S.pay=r.value});
  const sub=$('submit');if(sub)sub.onclick=()=>{
    sub.disabled=true;sub.textContent='正在核对库存…';
    setTimeout(()=>{const bad=check();if(bad.length){S.err=bad;render();return}
      const t=totals();S.order={no:'JS20261023-'+String(4100+Math.floor(Math.random()*900)),lines:S.cart.map(l=>{const p=prod(l.pid);return{n:p.n,v:l.color+' · '+l.size,q:l.qty,t:p.price*l.qty}}),ship:t.ship,exp:t.exp,total:t.total,pay:S.pay};
      S.cart.forEach(l=>{const p=prod(l.pid);p.stock[l.color+'|'+l.size]-=l.qty});S.cart=[];S.simmed={};S.err=null;go('done')},700)};
  const vo=$('viewOrder');if(vo)vo.onclick=()=>{vo.textContent='订单详情已在「我的订单」中'};
}
$('cartBtn').onclick=()=>go('cart');
$('toastGo').onclick=()=>{$('toast').classList.remove('show');go('cart')};
$('q').oninput=e=>{S.q=e.target.value.trim();if(S.view!=='browse')S.view='browse';render()};
render();
</script>
</body>
</html>
