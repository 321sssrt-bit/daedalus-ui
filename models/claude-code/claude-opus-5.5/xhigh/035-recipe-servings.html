<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>灶边 · 番茄炖牛腩</title>
<style>
:root{
  --room:#f3e9c8;--paper:#ffffff;--ink:#161616;--muted:#6b6b6b;--line:#ececec;--saffron:#f2b705;--saffron-dk:#c99400;--tomato:#d8442f;--herb:#3f7d3a;--wash:#fbf6e6;
  --display:"Avenir Next Condensed","Avenir Next","PingFang SC",sans-serif;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --num:"Avenir Next","Helvetica Neue",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--room);display:grid;place-items:center;font:15px/1.6 var(--sans);color:var(--ink)}
.phone{width:390px;height:min(844px,calc(100vh - 32px));border-radius:50px;border:10px solid #1b1b1b;background:var(--paper);position:relative;overflow:hidden;box-shadow:0 28px 60px #5a4a1a40}
.notch{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:118px;height:32px;border-radius:20px;background:#1b1b1b;z-index:20}
.scroll{position:absolute;inset:0 0 88px;overflow-y:auto;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.hero{height:310px;background:var(--saffron);position:relative;overflow:hidden}
.hero svg{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);width:330px}
.hero .sb{position:absolute;top:16px;left:30px;right:26px;display:flex;justify-content:space-between;font:600 15px var(--num);z-index:2}
.hero .tb{position:absolute;top:52px;left:16px;right:16px;display:flex;justify-content:space-between;z-index:2}
.round{width:40px;height:40px;border-radius:50%;border:0;background:#ffffffd9;font-size:17px;cursor:pointer;display:grid;place-items:center;color:var(--ink)}
.round[aria-pressed="true"]{background:var(--tomato);color:#fff}
.tag{position:absolute;left:18px;bottom:18px;background:var(--ink);color:var(--saffron);font:700 12px var(--display);letter-spacing:.14em;padding:5px 10px}
.body{padding:20px 20px 28px}
h1{margin:0;font:800 34px/1.1 var(--display);letter-spacing:-.01em}
.by{display:flex;align-items:center;gap:8px;margin:8px 0 16px;font-size:13px;color:var(--muted)}
.by i{width:24px;height:24px;border-radius:50%;background:var(--herb);color:#fff;display:grid;place-items:center;font-size:11px;font-style:normal;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:2px solid var(--ink);border-bottom:1px solid var(--line);margin-bottom:20px}
.stats div{padding:10px 0;text-align:center;border-right:1px solid var(--line)}
.stats div:last-child{border-right:0}
.stats b{display:block;font:700 20px var(--num)}
.stats span{font-size:11px;color:var(--muted)}
.serv{display:flex;align-items:center;justify-content:space-between;background:var(--wash);border-radius:16px;padding:12px 14px;margin-bottom:16px}
.serv b{font-size:15px}
.serv small{display:block;color:var(--muted);font-size:12px}
.step{display:flex;align-items:center;gap:0;background:var(--paper);border-radius:999px;border:1.5px solid var(--ink)}
.step button{width:38px;height:38px;border:0;background:none;font:700 20px var(--sans);cursor:pointer;color:var(--ink)}
.step button:disabled{color:#c4c4c4;cursor:not-allowed}
.step output{min-width:46px;text-align:center;font:700 17px var(--num)}
.units{display:flex;gap:6px;margin-bottom:10px}
.units button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:3px 12px;font:12px var(--sans);cursor:pointer;color:var(--muted)}
.units button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);font-weight:600}
h2{font:800 20px var(--display);margin:22px 0 10px;display:flex;align-items:baseline;justify-content:space-between}
h2 small{font:12px var(--sans);color:var(--muted)}
.ing{list-style:none;margin:0;padding:0}
.ing li{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px dashed var(--line);font-size:15px}
.ing li b{font:600 15px var(--num);transition:color .3s}
.ing li b.bump{color:var(--tomato)}
.ing li small{color:var(--muted);font-size:12px;margin-left:6px}
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{display:grid;grid-template-columns:34px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.steps li::before{counter-increment:s;content:counter(s,decimal-leading-zero);font:800 22px/1 var(--display);color:var(--saffron-dk)}
.steps li.done{color:#9a9a9a}
.steps li.done::before{content:'✓';color:var(--herb)}
.steps li b{font-weight:600}
.steps li:focus-visible{outline:2px solid var(--saffron);outline-offset:2px}
.tip{margin-top:16px;padding:12px 14px;border-left:4px solid var(--herb);background:#eef5ec;font-size:13px}
.cta{position:absolute;left:0;right:0;bottom:0;height:88px;background:var(--paper);border-top:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;gap:10px;padding:12px 16px 24px;z-index:5}
.cta .fav{width:52px;height:52px;border-radius:16px;border:1.5px solid var(--ink);background:var(--paper);font-size:20px;cursor:pointer}
.cta .fav[aria-pressed="true"]{background:var(--tomato);border-color:var(--tomato);color:#fff}
.cta .go{height:52px;border-radius:16px;border:0;background:var(--ink);color:var(--saffron);font:800 17px var(--sans);cursor:pointer;letter-spacing:.04em}
.cta .go:active{transform:scale(.98)}
.round:focus-visible,.step button:focus-visible,.units button:focus-visible,.fav:focus-visible,.go:focus-visible,.cook button:focus-visible{outline:2px solid var(--saffron-dk);outline-offset:2px}
.cook{position:absolute;inset:0;background:var(--ink);color:#fff;z-index:15;display:none;flex-direction:column;padding:60px 24px 30px}
.cook.on{display:flex}
.cook .top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#bdbdbd}
.cook .top button{border:0;background:#ffffff1a;color:#fff;border-radius:999px;padding:6px 14px;font:13px var(--sans);cursor:pointer}
.cook .num{font:800 96px/1 var(--display);color:var(--saffron);margin:30px 0 10px}
.cook p{font-size:22px;line-height:1.5;margin:0;flex:1}
.cook .dots{display:flex;gap:6px;margin-bottom:20px}
.cook .dots i{flex:1;height:4px;border-radius:2px;background:#ffffff33}
.cook .dots i.on{background:var(--saffron)}
.cook .nav{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cook .nav button{height:56px;border-radius:16px;border:0;font:700 16px var(--sans);cursor:pointer}
.cook .nav .p{background:#ffffff1a;color:#fff}
.cook .nav .n{background:var(--saffron);color:var(--ink)}
.cook .nav button:disabled{opacity:.35;cursor:not-allowed}
@media (max-width:500px){body{display:block;background:var(--paper)}.phone{width:100%;height:100vh;height:100dvh;border:0;border-radius:0;box-shadow:none}.notch{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="phone">
  <div class="notch" aria-hidden="true"></div>
  <div class="scroll">
    <header class="hero">
      <div class="sb" aria-hidden="true"><span>9:41</span><span>▂▄▆ ▮▮▮</span></div>
      <div class="tb"><button class="round" type="button" aria-label="返回">←</button><button class="round" type="button" aria-label="分享">⇪</button></div>
      <svg viewBox="0 0 330 230" aria-hidden="true"><ellipse cx="165" cy="200" rx="150" ry="22" fill="#00000022"/><ellipse cx="165" cy="120" rx="150" ry="80" fill="#ffffff"/><ellipse cx="165" cy="118" rx="128" ry="64" fill="#b8361f"/><g fill="#7a2a16"><rect x="96" y="92" width="44" height="34" rx="9" transform="rotate(-12 118 109)"/><rect x="160" y="80" width="48" height="36" rx="10" transform="rotate(8 184 98)"/><rect x="200" y="118" width="42" height="32" rx="9" transform="rotate(-6 221 134)"/><rect x="120" y="132" width="46" height="30" rx="9" transform="rotate(10 143 147)"/></g><g fill="#e2573c"><circle cx="150" cy="104" r="12"/><circle cx="236" cy="100" r="10"/><circle cx="196" cy="150" r="11"/><circle cx="92" cy="138" r="9"/></g><g fill="#3f7d3a"><circle cx="170" cy="122" r="4"/><circle cx="130" cy="120" r="3"/><circle cx="214" cy="124" r="3.5"/><circle cx="180" cy="142" r="3"/></g><path d="M262 40c20 10 30 40 12 70" stroke="#ffffff99" stroke-width="5" fill="none" stroke-linecap="round"/></svg>
      <span class="tag">本周家常 · NO.42</span>
    </header>
    <article class="body">
      <h1>番茄炖牛腩</h1>
      <div class="by"><i>周</i>周阿姨的厨房 · 3.2 万人做过 · ★ 4.9</div>
      <div class="stats"><div><b>90<small style="font-size:12px"> 分钟</small></b><span>总用时</span></div><div><b>简单</b><span>难度</span></div><div><b id="kcal">412</b><span>千卡 / 份</span></div></div>
      <div class="serv"><div><b>做几人份？</b><small id="servNote">食材用量会自动换算</small></div><div class="step"><button type="button" id="minus" aria-label="减少一份">−</button><output id="n" aria-live="polite">3</output><button type="button" id="plus" aria-label="增加一份">＋</button></div></div>
      <h2>食材 <small id="ingSum">共 9 样</small></h2>
      <div class="units" role="group" aria-label="单位"><button type="button" aria-pressed="true" data-u="g">克</button><button type="button" aria-pressed="false" data-u="jin">斤 / 两</button></div>
      <ul class="ing" id="ing"></ul>
      <h2>做法 <small>点一步标记完成</small></h2>
      <ol class="steps" id="steps"></ol>
      <div class="tip">💡 牛腩先冷水下锅焯，水开后再煮 3 分钟撇沫，肉才不腥。番茄分两次下：一半炒出沙，一半最后放保留口感。</div>
    </article>
  </div>
  <div class="cta"><button class="fav" type="button" id="fav" aria-pressed="false" aria-label="收藏">♡</button><button class="go" type="button" id="go">开始烹饪 · 6 步</button></div>
  <section class="cook" id="cook" aria-live="polite">
    <div class="top"><span id="cookN">3 人份</span><button type="button" id="exit">退出烹饪模式</button></div>
    <div class="num" id="cNum">01</div>
    <p id="cText"></p>
    <div class="dots" id="dots"></div>
    <div class="nav"><button class="p" type="button" id="cPrev">上一步</button><button class="n" type="button" id="cNext">下一步</button></div>
  </section>
</div>
<script>
const base=3;
const ing=[['牛腩',600,'g','切 3 厘米方块'],['番茄',450,'g','约 3 个'],['洋葱',150,'g',''],['姜',15,'g','切片'],['番茄膏',30,'g',''],['生抽',30,'ml',''],['冰糖',12,'g',''],['八角',2,'个',''],['小葱',10,'g','装饰']];
const steps=[['焯水','牛腩冷水下锅，加 3 片姜，水开后煮 3 分钟撇去浮沫，捞出洗净。'],['炒番茄','热锅少油，下一半番茄块和番茄膏，中小火炒 5 分钟至出沙。'],['煸香','加入洋葱、姜片和八角炒香，倒入牛腩翻炒 2 分钟。'],['炖煮','加生抽、冰糖和没过牛腩的热水，大火烧开转小火炖 60 分钟。'],['收汁','加入剩下的番茄块再煮 10 分钟，开大火收汁到浓稠。'],['出锅','撒上葱花，配米饭或面条。']];
let n=3,unit='g',done=new Set(),ci=0;
const $=s=>document.getElementById(s);
function q(v,u){if(u==='个')return Math.max(1,Math.round(v))+' 个';if(u==='ml')return Math.round(v)+' 毫升';
  if(unit==='jin'){if(v>=250)return (v/500).toFixed(1).replace(/\.0$/,'')+' 斤';return (v/50).toFixed(1).replace(/\.0$/,'')+' 两'}return Math.round(v)+' 克'}
function render(bump){
  $('n').textContent=n;$('minus').disabled=n<=1;$('plus').disabled=n>=8;
  $('servNote').textContent=n===base?'食材用量会自动换算':'已按 '+n+' 人份换算（原为 '+base+' 人份）';
  $('ing').innerHTML=ing.map(x=>'<li><span>'+x[0]+(x[3]?'<small>'+x[3]+'</small>':'')+'</span><b class="'+(bump?'bump':'')+'">'+q(x[1]*n/base,x[2])+'</b></li>').join('');
  if(bump)setTimeout(()=>document.querySelectorAll('.ing b').forEach(b=>b.classList.remove('bump')),400);
  $('steps').innerHTML=steps.map((s,k)=>'<li tabindex="0" class="'+(done.has(k)?'done':'')+'" data-k="'+k+'"><span><b>'+s[0]+'</b> · '+s[1].replace('没过牛腩的热水','约 '+Math.round(400*n/base)+' 毫升热水')+'</span></li>').join('');
  document.querySelectorAll('.steps li').forEach(li=>{const t=()=>{const k=+li.dataset.k;done.has(k)?done.delete(k):done.add(k);render()};li.onclick=t;li.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();t()}}});
  $('go').textContent=done.size===steps.length?'全部完成 · 开饭啦':done.size?'继续烹饪 · 第 '+(Math.min(...[0,1,2,3,4,5].filter(k=>!done.has(k))) +1)+' 步':'开始烹饪 · 6 步';
}
$('minus').onclick=()=>{n=Math.max(1,n-1);render(true)};
$('plus').onclick=()=>{n=Math.min(8,n+1);render(true)};
document.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{unit=b.dataset.u;document.querySelectorAll('[data-u]').forEach(x=>x.setAttribute('aria-pressed',x===b));render()});
$('fav').onclick=e=>{const on=e.currentTarget.getAttribute('aria-pressed')!=='true';e.currentTarget.setAttribute('aria-pressed',on);e.currentTarget.textContent=on?'♥':'♡'};
function cook(){const s=steps[ci];$('cNum').textContent=String(ci+1).padStart(2,'0');$('cText').textContent=s[0]+'：'+s[1].replace('没过牛腩的热水','约 '+Math.round(400*n/base)+' 毫升热水');
  $('dots').innerHTML=steps.map((x,k)=>'<i class="'+(k<=ci?'on':'')+'"></i>').join('');$('cPrev').disabled=ci===0;$('cNext').textContent=ci===steps.length-1?'完成':'下一步';$('cookN').textContent=n+' 人份 · 第 '+(ci+1)+' / '+steps.length+' 步'}
$('go').onclick=()=>{ci=[0,1,2,3,4,5].find(k=>!done.has(k));if(ci===undefined)ci=0;$('cook').classList.add('on');cook();$('cNext').focus()};
$('cPrev').onclick=()=>{ci--;cook()};
$('cNext').onclick=()=>{done.add(ci);if(ci===steps.length-1){$('cook').classList.remove('on');render();return}ci++;cook()};
$('exit').onclick=()=>{$('cook').classList.remove('on');render()};
render();
</script>
</body>
</html>
