<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>恒誉私人银行 · 账户设置</title>
<style>
:root{
  --navy:#13233f;--navy-2:#1c3053;--ivory:#f7f4ec;--paper:#fffdf8;--ink:#1d2433;--muted:#6f7480;--line:#e4dfd2;--gold:#b8975a;--gold-dk:#97773e;--ok:#3d7a5c;--warn:#b5613b;
  --serif:"Palatino","Palatino Linotype","Songti SC","STSong",serif;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--ivory);color:var(--ink);font:14px/1.6 var(--sans)}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{background:var(--navy);color:#d8dbe2;padding:30px 0;display:flex;flex-direction:column}
.crest{padding:0 28px 28px;border-bottom:1px solid #ffffff14;margin-bottom:16px}
.crest b{display:block;font:600 21px var(--serif);color:#fff;letter-spacing:.1em}
.crest small{font:11px var(--sans);letter-spacing:.3em;color:var(--gold)}
.side a{display:block;padding:11px 28px;color:#b9bfcc;text-decoration:none;font-size:14px;border-left:3px solid transparent}
.side a:hover{color:#fff;background:#ffffff08}
.side a.on{color:#fff;border-left-color:var(--gold);background:var(--navy-2)}
.side .rm{margin-top:auto;padding:20px 28px 0;border-top:1px solid #ffffff14;font-size:12px;color:#9aa1b0}
.side .rm b{display:block;color:#fff;font-size:14px;font-weight:600;margin:2px 0}
.side .rm span{color:var(--gold)}
.main{padding:36px 56px 64px;max-width:980px}
.crumb{font-size:12px;color:var(--muted);letter-spacing:.1em}
h1{font:400 34px var(--serif);margin:6px 0 24px;letter-spacing:.02em}
.id{display:grid;grid-template-columns:72px 1fr auto;gap:20px;align-items:center;background:var(--paper);border:1px solid var(--line);padding:22px 26px;margin-bottom:30px;position:relative}
.id::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--gold)}
.mono{width:72px;height:72px;border-radius:50%;background:var(--navy);color:var(--gold);display:grid;place-items:center;font:400 30px var(--serif);border:2px solid var(--gold)}
.id h2{margin:0;font:600 20px var(--sans)}
.id p{margin:2px 0 0;color:var(--muted);font-size:13px}
.tier{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-size:12px;color:var(--gold-dk);border:1px solid var(--gold);padding:1px 10px;letter-spacing:.1em}
.id .acct{text-align:right;font-size:12px;color:var(--muted)}
.id .acct b{display:block;font:400 18px var(--serif);color:var(--ink);letter-spacing:.06em}
.grp{margin-bottom:28px}
.grp h3{font:600 12px var(--sans);letter-spacing:.24em;color:var(--gold-dk);margin:0 0 10px;display:flex;align-items:center;gap:12px}
.grp h3::after{content:'';flex:1;height:1px;background:var(--line)}
.rows{background:var(--paper);border:1px solid var(--line)}
.row{border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.rh{display:grid;grid-template-columns:180px 1fr auto 20px;gap:16px;align-items:center;width:100%;padding:16px 22px;border:0;background:none;text-align:left;cursor:pointer;font:14px var(--sans);color:var(--ink)}
.rh:hover{background:#faf6ec}
.rh:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
.rh .k{color:var(--muted)}
.rh .v{font-weight:500}
.rh .s{font-size:12px}
.rh .s.ok{color:var(--ok)}.rh .s.warn{color:var(--warn)}
.rh .chev{width:10px;height:10px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(45deg);transition:transform .2s;justify-self:center;margin-top:-4px}
.row.open .chev{transform:rotate(-135deg);margin-top:4px}
.row.open .rh{background:#faf6ec}
.rd{display:none;padding:4px 22px 22px 218px;background:#faf6ec}
.row.open .rd{display:block;animation:open .22s ease-out}
.rd p{margin:0 0 12px;color:var(--muted);font-size:13px}
.f{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:520px}
.f label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.f input,.f select{height:40px;border:1px solid #d6d0c0;background:#fff;padding:0 12px;font:14px var(--sans);color:var(--ink);outline:none;border-radius:0}
.f input:focus,.f select:focus{border-color:var(--navy);box-shadow:0 0 0 3px #13233f1a}
.f .full{grid-column:1/-1}
.f .bad input{border-color:var(--warn)}
.f .err{font-size:12px;color:var(--warn);min-height:18px;grid-column:1/-1}
.btns{display:flex;gap:10px;margin-top:14px}
.btn{height:38px;padding:0 20px;border-radius:0;font:600 13px var(--sans);letter-spacing:.06em;cursor:pointer}
.btn.pri{background:var(--navy);color:#fff;border:1px solid var(--navy)}
.btn.pri:hover{background:var(--navy-2)}
.btn.sec{background:transparent;color:var(--ink);border:1px solid #c8c1af}
.btn.sec:hover{border-color:var(--ink)}
.btn.dng{background:transparent;color:var(--warn);border:1px solid #e3c2b2}
.btn.dng:hover{background:#fbefe9}
.btn:focus-visible,.tg:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.tgrow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px dashed #e0d9c8;max-width:560px}
.tgrow:last-of-type{border-bottom:0}
.tgrow small{display:block;color:var(--muted);font-size:12px}
.tg{width:44px;height:24px;border-radius:12px;border:1px solid #c8c1af;background:#ece7da;position:relative;cursor:pointer;flex:none;transition:background .2s}
.tg::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px #0003;transition:transform .2s}
.tg[aria-checked="true"]{background:var(--navy);border-color:var(--navy)}
.tg[aria-checked="true"]::after{transform:translateX(20px);background:var(--gold)}
.tg:disabled{opacity:.5;cursor:not-allowed}
.dev{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px dashed #e0d9c8;max-width:560px}
.dev b{font-weight:600}
.dev small{display:block;color:var(--muted);font-size:12px}
.saved{font-size:12px;color:var(--ok);margin-left:8px;opacity:0;transition:opacity .2s}
.saved.show{opacity:1}
@keyframes open{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@media (max-width:1000px){.app{grid-template-columns:1fr}.side{display:none}.main{padding:28px 24px}.rh{grid-template-columns:120px 1fr 20px}.rh .s{display:none}.rd{padding:4px 22px 22px}}
@media (max-width:600px){.id{grid-template-columns:56px 1fr}.id .acct{grid-column:1/-1;text-align:left}.mono{width:56px;height:56px;font-size:24px}.f{grid-template-columns:1fr}.rh{grid-template-columns:1fr 20px}.rh .k{grid-column:1/-1;font-size:12px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <nav class="side" aria-label="主导航">
    <div class="crest"><b>恒誉私人银行</b><small>HENGYU PRIVATE</small></div>
    <a href="#overview">资产总览</a><a href="#invest">投资组合</a><a href="#trust">家族信托</a><a href="#transfer">转账汇款</a><a href="#docs">文件与报告</a><a class="on" href="#settings" aria-current="page">账户设置</a>
    <div class="rm">您的客户经理<b>沈清和</b><span>工作日 9:00–21:00 · 专线 8820</span></div>
  </nav>
  <main class="main">
    <div class="crumb">账户设置</div>
    <h1>账户设置</h1>
    <section class="id">
      <div class="mono">陆</div>
      <div><h2>陆景行 先生</h2><p>客户编号 HY-00 2187 · 开户于 2016 年 3 月</p><span class="tier">◆ 鉴藏级客户</span></div>
      <div class="acct">管理资产<b>¥ 86,420,000</b>截至 10 月 22 日</div>
    </section>
    <div id="groups"></div>
  </main>
</div>
<script>
const groups=[
 {t:'个人资料',rows:[
  {k:'称谓与姓名',v:'陆景行 先生',s:['已核实','ok'],d:'<p>姓名与身份证件一致，如需变更请携带证件至网点办理。</p><div class="f"><label>称谓<select><option>先生</option><option>女士</option><option>博士</option></select></label><label>英文名<input value="Jinghang Lu"></label></div>',save:1},
  {k:'联系电话',v:'138 **** 6620',s:['已验证','ok'],d:'<p>用于交易验证与紧急联络。修改后会向新号码发送验证码。</p><div class="f"><label class="full">新手机号<input inputmode="numeric" placeholder="请输入 11 位手机号" data-rule="phone"></label><span class="err"></span></div>',save:1},
  {k:'通讯地址',v:'上海市 徐汇区 武康路 ×× 号',s:['',''],d:'<p>纸质对账单、年度报告与礼宾物品将寄往此地址。</p><div class="f"><label class="full">详细地址<input value="上海市徐汇区武康路 ×× 号"></label><label>邮编<input value="200031"></label><label>收件人<input value="陆景行"></label></div>',save:1}
 ]},
 {t:'登录与安全',rows:[
  {k:'登录密码',v:'上次修改于 94 天前',s:['建议更新','warn'],d:'<p>为保障资金安全，建议每 90 天更新一次登录密码。</p><div class="f"><label class="full">当前密码<input type="password" data-rule="cur"></label><label>新密码<input type="password" data-rule="new" placeholder="至少 10 位"></label><label>确认新密码<input type="password" data-rule="confirm"></label><span class="err"></span></div>',save:1,btn:'更新密码'},
  {k:'双重验证',v:'硬件令牌 + 短信',s:['已开启','ok'],d:'<div class="tgrow"><span>硬件令牌<small>序列号 HY-TK-4471，每 60 秒刷新</small></span><button class="tg" type="button" role="switch" aria-checked="true" aria-label="硬件令牌" disabled></button></div><div class="tgrow"><span>短信验证码<small>大额交易时额外确认</small></span><button class="tg" type="button" role="switch" aria-checked="true" aria-label="短信验证码"></button></div><p style="margin-top:10px">硬件令牌为必选项，如遗失请立即致电客户经理挂失。</p>'},
  {k:'受信任设备',v:'2 台',s:['',''],d:'<div class="dev"><span><b>iPhone 16 Pro</b><small>上海 · 本机 · 最近使用 刚刚</small></span><span style="font-size:12px;color:#3d7a5c">当前设备</span></div><div class="dev" data-dev><span><b>MacBook Air</b><small>上海 · 最近使用 3 天前</small></span><button class="btn dng" type="button" data-rmdev>移除</button></div>'}
 ]},
 {t:'通知偏好',rows:[
  {k:'交易提醒',v:'单笔 ≥ ¥50,000',s:['',''],d:'<div class="tgrow"><span>大额转出提醒<small>单笔达到阈值时短信 + App 推送</small></span><button class="tg" type="button" role="switch" aria-checked="true" aria-label="大额转出提醒"></button></div><div class="f" style="margin-top:8px"><label>提醒阈值<select><option>¥10,000</option><option selected>¥50,000</option><option>¥200,000</option></select></label></div>',save:1},
  {k:'投资与市场简报',v:'每周一 · 邮件',s:['',''],d:'<div class="tgrow"><span>每周市场简报<small>首席投资官撰写，周一早 8 点送达</small></span><button class="tg" type="button" role="switch" aria-checked="true" aria-label="每周市场简报"></button></div><div class="tgrow"><span>持仓异动提醒<small>单一持仓日内波动超过 5% 时</small></span><button class="tg" type="button" role="switch" aria-checked="false" aria-label="持仓异动提醒"></button></div><div class="tgrow"><span>私享活动邀请<small>艺术品预展、品鉴会等</small></span><button class="tg" type="button" role="switch" aria-checked="true" aria-label="私享活动邀请"></button></div>'}
 ]}
];
let open='0-0';
const G=document.getElementById('groups');
function render(){
  G.innerHTML=groups.map((g,gi)=>'<section class="grp"><h3>'+g.t+'</h3><div class="rows">'+g.rows.map((r,ri)=>{const id=gi+'-'+ri;
    return '<div class="row'+(open===id?' open':'')+'" data-id="'+id+'"><button class="rh" type="button" aria-expanded="'+(open===id)+'"><span class="k">'+r.k+'</span><span class="v">'+r.v+'</span><span class="s '+r.s[1]+'">'+r.s[0]+'</span><i class="chev"></i></button><div class="rd">'+r.d+(r.save?'<div class="btns"><button class="btn pri" type="button" data-save>'+(r.btn||'保存修改')+'</button><button class="btn sec" type="button" data-cancel>取消</button><span class="saved">✓ 已保存</span></div>':'')+'</div></div>'}).join('')+'</div></section>').join('');
  G.querySelectorAll('.row').forEach(row=>{
    row.querySelector('.rh').onclick=()=>{open=open===row.dataset.id?'':row.dataset.id;render();const r=G.querySelector('.row[data-id="'+row.dataset.id+'"] .rh');r&&r.focus()};
    row.querySelectorAll('.tg').forEach(t=>t.onclick=()=>{t.setAttribute('aria-checked',t.getAttribute('aria-checked')!=='true')});
    const rm=row.querySelector('[data-rmdev]');if(rm)rm.onclick=()=>{rm.closest('[data-dev]').remove();groups[1].rows[2].v='1 台';groups[1].rows[2].d=groups[1].rows[2].d.replace(/<div class="dev" data-dev>.*<\/div>$/,'');row.querySelector('.v').textContent='1 台'};
    const c=row.querySelector('[data-cancel]');if(c)c.onclick=()=>{open='';render()};
    const s=row.querySelector('[data-save]');if(s)s.onclick=()=>save(row);
  });
}
function save(row){
  const err=row.querySelector('.err');row.querySelectorAll('label').forEach(l=>l.classList.remove('bad'));if(err)err.textContent='';
  const phone=row.querySelector('[data-rule="phone"]');
  if(phone&&!/^1\d{10}$/.test(phone.value.replace(/\s/g,''))){phone.parentElement.classList.add('bad');err.textContent='请输入有效的 11 位手机号';return}
  const nw=row.querySelector('[data-rule="new"]');
  if(nw){const cur=row.querySelector('[data-rule="cur"]'),cf=row.querySelector('[data-rule="confirm"]');
    if(!cur.value){cur.parentElement.classList.add('bad');err.textContent='请先输入当前密码';return}
    if(nw.value.length<10){nw.parentElement.classList.add('bad');err.textContent='新密码至少 10 位';return}
    if(nw.value!==cf.value){cf.parentElement.classList.add('bad');err.textContent='两次输入的新密码不一致';return}
    const [gi,ri]=row.dataset.id.split('-').map(Number);groups[gi].rows[ri].v='刚刚修改';groups[gi].rows[ri].s=['已更新','ok'];row.querySelector('.v').textContent='刚刚修改';const st=row.querySelector('.s');st.textContent='已更新';st.className='s ok'}
  if(phone){const v=phone.value.replace(/\s/g,''),[gi,ri]=row.dataset.id.split('-').map(Number);groups[gi].rows[ri].v=v.slice(0,3)+' **** '+v.slice(7);groups[gi].rows[ri].s=['待验证','warn'];row.querySelector('.v').textContent=groups[gi].rows[ri].v;row.querySelector('.s').textContent='待验证';row.querySelector('.s').className='s warn'}
  const ok=row.querySelector('.saved');ok.classList.add('show');setTimeout(()=>ok.classList.remove('show'),1800);
}
render();
</script>
</body>
</html>
