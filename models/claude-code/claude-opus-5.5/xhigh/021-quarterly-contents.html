<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>回声 · 2026 秋季号 · 目录</title>
<style>
:root{
  --paper:#fafaf7;--ink:#111111;--grey:#6b6b6b;--rule:#d8d8d2;--red:#d7261e;--wash:#f0efe9;
  --didot:"Didot","Bodoni 72","Bodoni MT","Songti SC",serif;
  --song:"Songti SC","STSong","SimSun",serif;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.6 var(--sans)}
.wrap{display:grid;grid-template-columns:400px minmax(0,1fr);min-height:100vh}
.cover{position:sticky;top:0;height:100vh;padding:40px 44px;border-right:1px solid var(--ink);display:flex;flex-direction:column;background:var(--paper)}
.mast{font:700 96px/0.9 var(--didot);margin:0;letter-spacing:-.03em}
.mast span{color:var(--red)}
.issue{display:flex;justify-content:space-between;border-top:3px solid var(--ink);border-bottom:1px solid var(--ink);padding:8px 0;margin:18px 0 26px;font:600 12px var(--sans);letter-spacing:.12em}
.theme{font:700 34px/1.3 var(--song);margin:0 0 12px}
.theme em{font-style:normal;color:var(--red)}
.ed{font:15px/1.9 var(--song);color:#333333;margin:0}
.ed::first-letter{font-size:44px;float:left;line-height:1;margin:6px 8px 0 0;font-weight:700}
.coverfoot{margin-top:auto;display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:12px;color:var(--grey)}
.coverfoot b{display:block;color:var(--ink);font:700 22px var(--didot)}
.sub{grid-column:1/-1;height:46px;border:2px solid var(--ink);background:var(--ink);color:var(--paper);font:600 14px var(--sans);letter-spacing:.2em;cursor:pointer;margin-top:12px}
.sub:hover{background:var(--red);border-color:var(--red)}
.list{padding:40px 56px 64px}
.lhead{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--ink);padding-bottom:10px;margin-bottom:6px}
.lhead h2{margin:0;font:700 14px var(--sans);letter-spacing:.4em}
.filters{display:flex;gap:18px;font-size:13px}
.filters button{border:0;background:none;padding:2px 0;font:13px var(--sans);color:var(--grey);cursor:pointer;border-bottom:2px solid transparent}
.filters button:hover{color:var(--ink)}
.filters button[aria-pressed="true"]{color:var(--ink);border-color:var(--red);font-weight:600}
.entry{border-bottom:1px solid var(--rule)}
.row{display:grid;grid-template-columns:84px minmax(0,1fr) 160px 56px;align-items:baseline;gap:20px;width:100%;padding:18px 0;border:0;background:none;text-align:left;cursor:pointer;color:var(--ink);font-family:var(--sans)}
.row .n{font:400 46px/1 var(--didot);color:var(--ink);transition:color .15s}
.row .t{display:block;margin:0;font:700 23px/1.35 var(--song)}
.row .kind{display:inline-block;font:600 11px var(--sans);letter-spacing:.2em;color:var(--red);margin-bottom:4px}
.row .by{font-size:14px;color:var(--grey)}
.row .by b{color:var(--ink);font-weight:600}
.row .pg{font:400 20px var(--didot);text-align:right;color:var(--grey)}
.row:hover .n,.row[aria-expanded="true"] .n{color:var(--red)}
.row:hover .t{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:5px}
.row:focus-visible{outline:2px solid var(--red);outline-offset:4px}
.sum{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.entry.open .sum{grid-template-rows:1fr}
.sum>div{overflow:hidden}
.sum .in{display:grid;grid-template-columns:84px minmax(0,1fr) 216px;gap:20px;padding:0 0 22px}
.sum blockquote{grid-column:2;margin:0;font:17px/1.9 var(--song);color:#2a2a2a;border-left:3px solid var(--red);padding:2px 0 2px 18px}
.sum .meta{font-size:12px;color:var(--grey);display:flex;flex-direction:column;gap:8px}
.sum .meta b{color:var(--ink);font-weight:600}
.read{height:38px;border:1.5px solid var(--ink);background:var(--paper);font:600 13px var(--sans);cursor:pointer;margin-top:4px}
.read:hover{background:var(--ink);color:var(--paper)}
.read:focus-visible,.sub:focus-visible,.filters button:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.count{font-size:12px;color:var(--grey);margin:14px 0 0}
@media (max-width:1100px){.wrap{grid-template-columns:320px minmax(0,1fr)}.mast{font-size:72px}.cover{padding:32px}.list{padding:32px 36px}.row{grid-template-columns:64px minmax(0,1fr) 120px 44px}.sum .in{grid-template-columns:64px minmax(0,1fr)}.sum .meta{grid-column:2}}
@media (max-width:820px){.wrap{grid-template-columns:1fr}.cover{position:static;height:auto;border-right:0;border-bottom:1px solid var(--ink)}.coverfoot{margin-top:24px}.row{grid-template-columns:52px minmax(0,1fr) 40px}.row .by{grid-column:2;grid-row:2}.row .n{font-size:34px}.lhead{flex-direction:column;gap:10px}.filters{flex-wrap:wrap}.list{padding:24px 20px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <aside class="cover">
    <h1 class="mast">回声<span>.</span></h1>
    <div class="issue"><span>第 37 期</span><span>2026 · 秋</span><span>¥58</span></div>
    <p class="theme">本期主题：<br><em>迁徙</em>与留下</p>
    <p class="ed">这一期我们收到了四百多份来稿，写的都是离开：离开县城、离开母语、离开一段婚姻。但最后选进来的十篇，作者都在写那个没有走的人——留在原地的人，也在迁徙。</p>
    <div class="coverfoot">
      <div><b>10</b>篇作品</div><div><b>212</b>页</div>
      <div><b>6</b>位新作者</div><div><b>11.08</b>上市</div>
      <button class="sub" type="button" id="sub">订阅全年四期 · ¥198</button>
    </div>
  </aside>
  <main class="list">
    <div class="lhead"><h2>目 录</h2><div class="filters" role="group" aria-label="体裁"></div></div>
    <div id="entries"></div>
    <p class="count" id="count"></p>
  </main>
</div>
<script>
const works=[
 ['小说','候鸟站','林知夏','中篇 · 首发','8','这是一个关于县城火车站的故事。父亲在站台卖了三十年茶叶蛋，看着每一趟车把儿女带走。直到有一天，一个从南方回来的年轻人在他的摊位前坐了一整夜。','约 48 分钟'],
 ['散文','母语的边界','阿依古丽','长散文','34','在乌鲁木齐长大、在柏林工作的作者，记录女儿第一次用德语说"奶奶"时，她在厨房里愣住的那几秒。','约 22 分钟'],
 ['诗歌','留下的人（组诗）','杜衡','七首','48','"你们都走了 / 屋檐下的燕子还认得我 / 它们每年回来一次 / 比你们勤快。"','约 8 分钟'],
 ['访谈','"我写的是没有被拍下来的那一半"','韩东 × 编辑部','对谈','56','与纪录片导演韩东谈他跟拍十年的移民家庭，以及剪辑台上那些最终没有用的镜头。','约 30 分钟'],
 ['小说','二十三楼的窗','苏迟','短篇','78','一个独居老人每天在二十三楼的窗口数对面楼的灯。某天少了一盏，她决定下楼去敲门。','约 25 分钟'],
 ['散文','在海边城市学游泳','陈默','随笔','96','三十五岁，从内陆搬到海边的第一个夏天，作者终于报名了成人游泳班。','约 14 分钟'],
 ['评论','迁徙叙事的十年','周以宁','评论','108','梳理近十年中文文学里的"离乡"书写：从逃离到回望，再到"在路上"本身成为一种居所。','约 35 分钟'],
 ['小说','渡口','祁朗','短篇 · 新作者','130','黄河边最后一个摆渡人，和他那个想把渡口改成网红打卡点的孙子。','约 28 分钟'],
 ['诗歌','行李箱里的植物','温予','五首','158','"我带走了一盆薄荷 / 它在高铁上晕车 / 到站时 / 叶子都朝着来的方向。"','约 6 分钟'],
 ['访谈','书店不走','乔木 × 编辑部','对谈','172','开了二十年的社区书店老板，讲他如何在拆迁、疫情和电商之间留下来。','约 26 分钟']
];
const kinds=['全部','小说','散文','诗歌','访谈','评论'];
let kind='全部',open=0;
const F=document.querySelector('.filters');
F.innerHTML=kinds.map(k=>'<button type="button" aria-pressed="'+(k===kind)+'">'+k+'</button>').join('');
F.querySelectorAll('button').forEach(b=>b.onclick=()=>{kind=b.textContent;F.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));render()});
function render(){
  const v=works.map((w,i)=>[w,i]).filter(([w])=>kind==='全部'||w[0]===kind);
  document.getElementById('entries').innerHTML=v.map(([w,i])=>'<article class="entry'+(open===i?' open':'')+'"><button class="row" type="button" data-i="'+i+'" aria-expanded="'+(open===i)+'"><span class="n">'+String(i+1).padStart(2,'0')+'</span><span><span class="kind">'+w[0]+' · '+w[3]+'</span><span class="t">'+w[1]+'</span></span><span class="by">文 / <b>'+w[2]+'</b></span><span class="pg">'+w[4]+'</span></button>'+
   '<div class="sum"><div><div class="in"><span></span><blockquote>'+w[5]+'</blockquote><div class="meta"><span>阅读时长 <b>'+w[6]+'</b></span><span>起始页 <b>P.'+w[4]+'</b></span><button class="read" type="button" data-i="'+i+'">在线试读 →</button></div></div></div></div></article>').join('');
  document.querySelectorAll('.row').forEach(r=>r.onclick=()=>{const i=+r.dataset.i;open=open===i?-1:i;render();document.querySelector('.row[data-i="'+i+'"]').focus()});
  document.querySelectorAll('.read').forEach(b=>b.onclick=()=>{b.textContent='已加入书架 ✓'});
  document.getElementById('count').textContent='共 '+v.length+' 篇'+(kind==='全部'?'':' · '+kind)+' · 点击标题展开摘要';
}
document.getElementById('sub').onclick=e=>{e.target.textContent='已加入订阅 · 首期 11 月寄出'};
render();
</script>
</body>
</html>
