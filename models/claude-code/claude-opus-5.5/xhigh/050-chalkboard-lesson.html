<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>粉笔课堂 · 光的折射</title>
<style>
:root{
  --wall:#e9e1cf;--paper:#fbf6ea;--ink:#2f2a22;--muted:#7a7062;--line:#ddd2bc;--wood:#8a5a34;--wood-dk:#6b4325;--board:#2c4a3e;--board-2:#335446;--chalk:#f3f1e8;--chalk-dim:#b9c4bc;--yellow:#f4d35e;--pink:#f28b82;--blue:#8ecae6;--ok:#7bd389;--bad:#ff8a80;
  --chalkf:"Hannotate SC","Chalkboard SE","Kaiti SC","STKaiti","KaiTi",cursive;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --num:"Chalkboard SE","Avenir Next","PingFang SC",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--wall);color:var(--ink);font:14px/1.6 var(--sans);background-image:repeating-linear-gradient(0deg,transparent 0 46px,#ddd3bf 46px 47px)}
[hidden]{display:none!important}
button,input{font-family:inherit}
.top{height:60px;display:flex;align-items:center;gap:18px;padding:0 32px;background:var(--paper);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;font:700 18px var(--sans)}
.logo i{width:30px;height:22px;border-radius:4px;background:var(--board);border:3px solid var(--wood);position:relative}
.logo i::after{content:'';position:absolute;left:4px;top:7px;width:12px;height:2px;background:var(--chalk);transform:rotate(-12deg)}
.top .crumb{color:var(--muted);font-size:13px}
.top .crumb b{color:var(--ink)}
.top .xp{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px}
.top .xp b{background:var(--yellow);border-radius:999px;padding:2px 10px;font-weight:700}
.wrap{display:grid;grid-template-columns:270px minmax(0,1fr);gap:24px;max-width:1240px;margin:0 auto;padding:22px 32px 40px}
.outline{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px;align-self:start;position:sticky;top:20px;box-shadow:2px 3px 0 #d7cbb2}
.outline .cv{height:96px;border-radius:10px;background:var(--board);border:4px solid var(--wood);margin-bottom:12px;position:relative;overflow:hidden}
.outline .cv svg{width:100%;height:100%;display:block}
.outline h2{margin:0;font:700 17px var(--sans)}
.outline .sub{color:var(--muted);font-size:12px;margin:2px 0 12px}
.prog{height:8px;border-radius:4px;background:#ece3cf;overflow:hidden;margin-bottom:6px}
.prog i{display:block;height:100%;background:var(--board);transition:width .4s}
.outline .pt{font-size:12px;color:var(--muted);margin-bottom:12px}
.ls{display:grid;gap:4px}
.l{display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:center;padding:8px;border-radius:9px;border:0;background:none;text-align:left;font:13px var(--sans);color:var(--ink);cursor:pointer}
.l:hover:not(:disabled){background:#f1e9d6}
.l[aria-current="step"]{background:#e3ecdf;font-weight:600}
.l i{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font:700 11px var(--sans);font-style:normal;color:var(--muted)}
.l.done i{background:var(--board);border-color:var(--board);color:var(--chalk)}
.l small{color:var(--muted);font-size:11px}
.l:disabled{opacity:.5;cursor:not-allowed}
.frame{background:var(--wood);border-radius:16px;padding:16px;box-shadow:inset 0 2px 0 #a8744a,0 14px 30px #6b432540;position:relative}
.frame::after{content:'';position:absolute;left:60px;right:60px;bottom:-10px;height:14px;border-radius:0 0 8px 8px;background:var(--wood-dk)}
.board{min-height:560px;border-radius:8px;background:radial-gradient(ellipse at 40% 30%,var(--board-2),var(--board) 70%);color:var(--chalk);padding:28px 36px 30px;position:relative;overflow:hidden}
.board::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(115deg,#ffffff05 0 2px,transparent 2px 9px);pointer-events:none}
.board>*{position:relative}
.ck{font-family:var(--chalkf)}
.board h1{margin:0 0 6px;font:400 34px/1.3 var(--chalkf);letter-spacing:.02em}
.board h1 u{text-decoration:none;border-bottom:3px solid var(--yellow)}
.board .meta{color:var(--chalk-dim);font-size:13px;margin-bottom:18px}
.lesson{display:grid;grid-template-columns:1fr 340px;gap:26px;align-items:start}
.lesson p{font:400 18px/1.9 var(--chalkf);margin:0 0 12px}
.lesson p em{font-style:normal;color:var(--yellow)}
.lesson .law{border:2px dashed var(--chalk-dim);border-radius:12px;padding:12px 16px;font:400 20px/1.6 var(--chalkf);color:var(--yellow);margin:14px 0}
.diagram svg{width:100%;display:block}
.cta{height:50px;padding:0 24px;border-radius:10px;border:2px solid var(--chalk);background:var(--chalk);color:var(--board);font:700 16px var(--sans);cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:transform .1s}
.cta:hover:not(:disabled){background:#fff}
.cta:active{transform:translateY(1px)}
.cta:disabled{opacity:.4;cursor:not-allowed}
.cta.ghost{background:transparent;color:var(--chalk)}
.cta.ghost:hover{background:#ffffff14}
.cta.yel{background:var(--yellow);border-color:var(--yellow);color:var(--board)}
.qhead{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.qhead .n{font:400 18px var(--chalkf);color:var(--yellow)}
.dots{display:flex;gap:6px;margin-left:auto}
.dots i{width:28px;height:6px;border-radius:3px;background:#ffffff26}
.dots i.on{background:var(--yellow)}
.dots i.ok{background:var(--ok)}
.dots i.fix{background:var(--blue)}
.q{font:400 26px/1.55 var(--chalkf);margin:4px 0 20px;max-width:820px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:820px;margin-bottom:20px}
.opt{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:center;text-align:left;padding:14px 16px;border-radius:12px;border:2px solid #ffffff40;background:#ffffff08;color:var(--chalk);font:400 19px/1.45 var(--chalkf);cursor:pointer;transition:border-color .15s,background .15s}
.opt b{width:36px;height:36px;border-radius:50%;border:2px solid currentColor;display:grid;place-items:center;font:400 18px var(--num)}
.opt:hover:not(:disabled){border-color:var(--chalk)}
.opt[aria-pressed="true"]{border-color:var(--yellow);background:#f4d35e1a;color:var(--yellow)}
.opt.wrong{border-color:var(--bad);background:#ff8a801a;color:var(--bad)}
.opt.tried{opacity:.55;border-style:dashed}
.opt.right{border-color:var(--ok);background:#7bd3891f;color:var(--ok)}
.opt:disabled{cursor:default}
.fill{display:flex;align-items:center;gap:12px;margin-bottom:20px;font:400 22px var(--chalkf)}
.fill input{width:120px;height:52px;border-radius:10px;border:2px solid #ffffff60;background:#ffffff0d;color:var(--yellow);font:400 26px var(--num);text-align:center;outline:none}
.fill input:focus{border-color:var(--yellow)}
.fill input.wrong{border-color:var(--bad);color:var(--bad)}
.fill input.right{border-color:var(--ok);color:var(--ok)}
.fb{max-width:820px;border-radius:14px;padding:16px 18px;margin-bottom:18px;display:grid;grid-template-columns:44px 1fr;gap:14px;animation:wipe .35s ease-out}
.fb.bad{background:#ff8a8014;border:2px solid var(--bad)}
.fb.good{background:#7bd3891a;border:2px solid var(--ok)}
.fb.fixd{background:#8ecae61a;border:2px solid var(--blue)}
.fb .ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:400 24px var(--num)}
.fb.bad .ic{background:var(--bad);color:var(--board)}
.fb.good .ic{background:var(--ok);color:var(--board)}
.fb.fixd .ic{background:var(--blue);color:var(--board)}
.fb h3{margin:0 0 4px;font:400 22px var(--chalkf)}
.fb.bad h3{color:var(--bad)}.fb.good h3{color:var(--ok)}.fb.fixd h3{color:var(--blue)}
.fb p{margin:0 0 6px;font:400 17px/1.75 var(--chalkf)}
.fb p em{font-style:normal;color:var(--yellow)}
.acts{display:flex;gap:10px;align-items:center}
.acts .tip{font-size:12px;color:var(--chalk-dim)}
.sum{text-align:center;padding-top:20px}
.sum .score{font:400 96px/1 var(--num);color:var(--yellow)}
.sum .score small{font-size:34px;color:var(--chalk-dim)}
.sum h2{margin:8px 0 6px;font:400 30px var(--chalkf)}
.sum p{font:400 18px var(--chalkf);color:var(--chalk-dim);margin:0 0 18px}
.rows{max-width:560px;margin:0 auto 22px;text-align:left;display:grid;gap:8px}
.rows div{display:grid;grid-template-columns:32px 1fr auto;gap:10px;align-items:center;border-bottom:1px dashed #ffffff30;padding:6px 0;font:400 17px var(--chalkf)}
.rows span.tag{font:600 12px var(--sans);padding:2px 8px;border-radius:999px}
.tag.ok{background:var(--ok);color:var(--board)}.tag.fx{background:var(--blue);color:var(--board)}
.stamp{display:inline-block;border:3px solid var(--pink);color:var(--pink);border-radius:10px;padding:4px 14px;font:400 22px var(--chalkf);transform:rotate(-6deg);margin-bottom:6px}
.eraser{position:absolute;right:30px;bottom:-4px;width:90px;height:22px;border-radius:4px;background:linear-gradient(180deg,#d9c7a8 0 50%,#4a4a4a 50%);box-shadow:0 2px 0 #0003;z-index:2}
.chalks{position:absolute;right:140px;bottom:0;display:flex;gap:8px;z-index:2}
.chalks i{width:34px;height:8px;border-radius:3px}
.l:focus-visible,.cta:focus-visible,.opt:focus-visible,.fill input:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}
@keyframes wipe{from{opacity:0;clip-path:inset(0 100% 0 0)}to{opacity:1;clip-path:inset(0 0 0 0)}}
@media (max-width:1060px){.wrap{grid-template-columns:1fr}.outline{position:static}.lesson{grid-template-columns:1fr}}
@media (max-width:720px){.wrap{padding:16px}.board{padding:20px 18px}.opts{grid-template-columns:1fr}.q{font-size:22px}.top .crumb{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top"><span class="logo"><i></i>粉笔课堂</span><span class="crumb">初中物理 / 第四章 光现象 / <b>光的折射</b></span><span class="xp">本周学习 <b id="xp">120 分</b></span></header>
<div class="wrap">
  <aside class="outline" aria-label="课程目录">
    <div class="cv" aria-hidden="true"><svg viewBox="0 0 230 88"><path d="M0 50h230" stroke="#b9c4bc" stroke-width="1.5" stroke-dasharray="4 4"/><path d="M40 8L115 50" stroke="#f4d35e" stroke-width="3"/><path d="M115 50L160 86" stroke="#f4d35e" stroke-width="3"/><rect x="0" y="50" width="230" height="38" fill="#8ecae6" opacity=".18"/><text x="10" y="44" font-size="11" fill="#f3f1e8" font-family="Kaiti SC, KaiTi, serif">空气</text><text x="10" y="80" font-size="11" fill="#f3f1e8" font-family="Kaiti SC, KaiTi, serif">水</text></svg></div>
    <h2>光的折射</h2><div class="sub">初中物理 · 八年级上 · 讲师 许老师</div>
    <div class="prog"><i id="progBar" style="width:40%"></i></div><div class="pt" id="progTxt">已完成 2 / 5 节</div>
    <div class="ls" id="ls"></div>
  </aside>
  <main class="frame"><section class="board" id="board" aria-live="polite"></section><span class="chalks" aria-hidden="true"><i style="background:#f3f1e8"></i><i style="background:#f4d35e"></i><i style="background:#f28b82"></i></span><span class="eraser" aria-hidden="true"></span></main>
</div>
<script>
const LESSONS=[['光的直线传播','8 分钟',true],['光的反射','10 分钟',true],['光的折射','12 分钟 · 讲解 + 3 道练习',false],['平面镜成像','11 分钟',false],['透镜初识','14 分钟',false]];
const QS=[
 {t:'choice',q:'光从空气<u>斜射</u>入水中时，折射角和入射角相比——',opts:['折射角大于入射角','折射角小于入射角','折射角等于入射角','折射角始终为 0°'],ans:1,
  why:{0:'光进入<em>更"密"的介质（水）</em>时会向法线方向偏折，所以折射角会<em>变小</em>，不是变大。想想筷子插进水里为什么看起来"折"向上方。',2:'只有光<em>垂直</em>入射时方向才不改变；斜射时一定会偏折。',3:'折射角为 0° 只在光<em>垂直于界面</em>入射时出现。'},
  ok:'空气 → 水，光偏向法线，<em>折射角 &lt; 入射角</em>。'},
 {t:'choice',q:'站在岸边看清澈的池底，看到的池底比实际位置——',opts:['更深','一样深','更浅','时深时浅'],ans:2,
  why:{0:'从水中射向空气的光<em>远离法线</em>偏折，人眼沿折射光的反向延长线看过去，像会被"抬高"，所以是<em>变浅</em>。',1:'光从水进入空气时发生了折射，像的位置会改变，并不一样深。',3:'只要你站的位置不变，像的位置是稳定的，不会时深时浅。'},
  ok:'像在实际位置的<em>上方</em>，所以"池水看起来比实际浅"，下水前要格外小心。'},
 {t:'fill',q:'一束光以 30° 入射角射到平静的水面，<u>反射角</u>是多少度？',ans:30,unit:'°',
  why:{_:'这题问的是<em>反射角</em>，不是折射角。反射定律：反射角<em>等于</em>入射角。'},
  ok:'反射角 = 入射角 = <em>30°</em>。折射角才会小于 30°。'}
];
const S={v:'lesson',qi:0,pick:null,state:'ask',tried:{},res:[],fixed:{},xp:120};
const $=s=>document.getElementById(s);
function outline(){
  const doneN=LESSONS.filter(l=>l[2]).length+(S.v==='done'?1:0);
  $('ls').innerHTML=LESSONS.map((l,i)=>{const d=l[2]||(i===2&&S.v==='done');return '<button class="l'+(d?' done':'')+'" type="button" '+(i===2?'aria-current="step"':'')+' '+(i>2&&S.v!=='done'?'disabled':'')+' data-l="'+i+'"><i>'+(d?'✓':i+1)+'</i><span>'+l[0]+'<br><small>'+l[1]+'</small></span><span>'+(i===2?'▶':'')+'</span></button>'}).join('');
  $('progBar').style.width=(doneN/5*100)+'%';$('progTxt').textContent='已完成 '+doneN+' / 5 节';
  $('ls').querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{if(+b.dataset.l===2){S.v='lesson';render()}else if(+b.dataset.l===3){b.querySelector('small').textContent='下一节 · 即将上线'}});
  $('xp').textContent=S.xp+' 分';
}
function vLesson(){return '<h1 class="ck">第 3 节 · <u>光的折射</u></h1><div class="meta">讲解约 4 分钟 · 之后有 3 道小练习，答错可以看解释再改</div>'+
 '<div class="lesson"><div><p>把一根筷子斜插进水里，筷子在水面处好像<em>"折断"</em>了。这不是筷子变了，是<em>光在两种介质的交界处改变了方向</em>。</p><p>光从空气斜射入水（或玻璃）时，会<em>向法线偏折</em>；反过来，从水射入空气时，会<em>远离法线</em>。</p>'+
 '<div class="law">光的折射规律：入射光线、折射光线、法线在同一平面；<br>空气 → 水：折射角 &lt; 入射角</div><p style="font-size:16px;color:#b9c4bc">小提示：垂直入射时，光的传播方向不变。</p>'+
 '<button class="cta yel" type="button" id="start">开始练习 · 3 题 →</button></div>'+
 '<div class="diagram"><svg viewBox="0 0 340 300" aria-label="光从空气斜射入水中的折射示意图"><rect x="0" y="150" width="340" height="150" fill="#8ecae6" opacity=".14"/><path d="M0 150h340" stroke="#f3f1e8" stroke-width="2"/><path d="M170 20v260" stroke="#b9c4bc" stroke-width="1.5" stroke-dasharray="6 6"/><path d="M60 40L170 150" stroke="#f4d35e" stroke-width="4" stroke-linecap="round"/><path d="M170 150L228 270" stroke="#f4d35e" stroke-width="4" stroke-linecap="round"/><path d="M104 84l8-12 4 14z" fill="#f4d35e"/><path d="M200 210l12 6-12 6z" fill="#f4d35e" transform="rotate(64 206 216)"/><path d="M170 100 A50 50 0 0 0 135 115" stroke="#f28b82" stroke-width="2.5" fill="none"/><path d="M170 200 A50 50 0 0 0 192 195" stroke="#8ecae6" stroke-width="2.5" fill="none"/>'+
 '<g font-family="Kaiti SC, KaiTi, serif" font-size="16" fill="#f3f1e8"><text x="14" y="140">空气</text><text x="14" y="176">水</text><text x="176" y="34">法线</text><text x="126" y="96" fill="#f28b82">入射角</text><text x="196" y="232" fill="#8ecae6">折射角</text></g></svg></div></div>'}
function vQ(){
  const q=QS[S.qi],tried=S.tried[S.qi]||[],st=S.state;
  let h='<div class="qhead"><span class="n">练习 '+(S.qi+1)+' / '+QS.length+'</span><span class="dots" aria-hidden="true">'+QS.map((x,i)=>'<i class="'+(S.res[i]==='ok'?'ok':S.res[i]==='fix'?'fix':i===S.qi?'on':'')+'"></i>').join('')+'</span></div><div class="q ck">'+q.q.replace(/<u>(.*?)<\/u>/,'<span style="border-bottom:3px solid #f4d35e">$1</span>')+'</div>';
  if(q.t==='choice'){h+='<div class="opts" role="group" aria-label="选项">'+q.opts.map((o,i)=>{let c='';
     if(st==='wrong'&&i===S.pick)c=' wrong';else if(st==='right'&&i===q.ans)c=' right';else if(tried.includes(i))c=' tried';
     return '<button class="opt'+c+'" type="button" data-o="'+i+'" aria-pressed="'+(S.pick===i&&st==='ask')+'" '+(st!=='ask'||tried.includes(i)?'disabled':'')+'><b>'+'ABCD'[i]+'</b><span>'+o+(tried.includes(i)&&st==='ask'?'（已试过）':'')+'</span></button>'}).join('')+'</div>'}
  else h+='<div class="fill"><span>答：</span><input id="fillIn" inputmode="numeric" maxlength="3" aria-label="填写度数" class="'+(st==='wrong'?'wrong':st==='right'?'right':'')+'" value="'+(S.pick??'')+'" '+(st!=='ask'?'disabled':'')+'><span>'+q.unit+'</span>'+(tried.length&&st==='ask'?'<span style="font-size:15px;color:#b9c4bc">（上次填了 '+tried[tried.length-1]+'°）</span>':'')+'</div>';
  if(st==='wrong'){const why=q.t==='choice'?q.why[S.pick]:q.why._;
    h+='<div class="fb bad" role="alert"><span class="ic">✗</span><div><h3>答错了，先别急</h3><p>'+why+'</p><p style="color:#b9c4bc;font-size:15px">看完解释，回到题目再选一次。答对后会记为「订正成功」。</p></div></div><div class="acts"><button class="cta" type="button" id="retry">↺ 再试一次</button><span class="tip">已用掉 '+tried.length+' 次机会 · 不扣分</span></div>'}
  else if(st==='right'){const fixed=tried.length>0;
    h+='<div class="fb '+(fixed?'fixd':'good')+'" role="status"><span class="ic">'+(fixed?'↻':'✓')+'</span><div><h3>'+(fixed?'订正成功！':'答对了！')+'</h3><p>'+q.ok+'</p>'+(fixed?'<p style="color:#b9c4bc;font-size:15px">这道题已从错题本移到「已订正」，+5 分。</p>':'<p style="color:#b9c4bc;font-size:15px">+10 分</p>')+'</div></div><div class="acts"><button class="cta yel" type="button" id="next">'+(S.qi<QS.length-1?'下一题 →':'查看本节结果 →')+'</button></div>'}
  else h+='<div class="acts"><button class="cta" type="button" id="submit" '+(S.pick===null||S.pick===''?'disabled':'')+'>提交答案</button><span class="tip">'+(tried.length?'再想想刚才的解释':'选好后提交，答错会给出解释')+'</span></div>';
  return h}
function vDone(){const ok=S.res.filter(r=>r==='ok').length,fx=S.res.filter(r=>r==='fix').length;
  return '<div class="sum"><span class="stamp">本节完成</span><div class="score">'+(ok*10+fx*5)+'<small> / 30</small></div><h2>光的折射 · 练习结果</h2><p>一次答对 '+ok+' 题，订正成功 '+fx+' 题'+(fx?'，错题已全部订正':'')+'</p>'+
  '<div class="rows">'+QS.map((q,i)=>'<div><span>'+(i+1)+'.</span><span>'+q.q.replace(/<\/?u>/g,'').replace(/<[^>]+>/g,'').slice(0,22)+'…</span><span class="tag '+(S.res[i]==='ok'?'ok">一次答对':'fx">订正成功')+'</span></div>').join('')+'</div>'+
  '<button class="cta yel" type="button" id="nextLesson">下一节：平面镜成像 →</button> <button class="cta ghost" type="button" id="redo">重新练习</button></div>'}
function render(){
  $('board').innerHTML=S.v==='lesson'?vLesson():S.v==='quiz'?vQ():vDone();outline();bind()}
function bind(){
  const st=$('start');if(st)st.onclick=()=>{S.v='quiz';S.qi=0;S.pick=null;S.state='ask';S.tried={};S.res=[];render()};
  document.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{S.pick=+b.dataset.o;render()});
  const fi=$('fillIn');if(fi){fi.oninput=()=>{fi.value=fi.value.replace(/\D/g,'');S.pick=fi.value;$('submit').disabled=!fi.value};fi.onkeydown=e=>{if(e.key==='Enter'&&fi.value)$('submit').click()};if(S.state==='ask')fi.focus()}
  const sb=$('submit');if(sb)sb.onclick=()=>{const q=QS[S.qi],v=q.t==='fill'?+S.pick:S.pick;
    if(v===q.ans){S.state='right';S.res[S.qi]=(S.tried[S.qi]||[]).length?'fix':'ok';S.xp+=S.res[S.qi]==='ok'?10:5}
    else{S.state='wrong';(S.tried[S.qi]=S.tried[S.qi]||[]).push(q.t==='fill'?S.pick:v)}
    render();const f=$('retry')||$('next');f&&f.focus()};
  const rt=$('retry');if(rt)rt.onclick=()=>{S.state='ask';S.pick=null;render();const first=document.querySelector('.opt:not(:disabled)');first&&first.focus()};
  const nx=$('next');if(nx)nx.onclick=()=>{if(S.qi<QS.length-1){S.qi++;S.pick=null;S.state='ask';render()}else{S.v='done';render()}};
  const nl=$('nextLesson');if(nl)nl.onclick=()=>{nl.textContent='下一节即将上线，已为你加入提醒'};
  const rd=$('redo');if(rd)rd.onclick=()=>{S.v='quiz';S.qi=0;S.pick=null;S.state='ask';S.tried={};S.res=[];render()};
}
render();
</script>
