<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>一日 · 今天</title>
<style>
:root{
  --room:#dcd5f5;--bg:#f1edff;--card:#ffffff;--ink:#2b2540;--muted:#7d7696;--faint:#b4adc9;--lilac:#8b7cf6;--lilac-dk:#6d5ee0;--lilac-soft:#e4ddff;--peach:#ffb8a6;--mint:#9be3c7;--butter:#ffe29a;
  --round:"Avenir Next","Arial Rounded MT Bold","PingFang SC",sans-serif;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:linear-gradient(160deg,#ece7ff,var(--room));display:grid;place-items:center;font:15px/1.55 var(--sans);color:var(--ink)}
.phone{width:390px;height:min(844px,calc(100vh - 32px));border-radius:54px;border:10px solid #2b2540;background:var(--bg);position:relative;overflow:hidden;box-shadow:0 30px 70px #6d5ee040}
.notch{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:118px;height:32px;border-radius:20px;background:#2b2540;z-index:20}
.sb{position:absolute;top:16px;left:30px;right:26px;display:flex;justify-content:space-between;font:600 15px var(--round);z-index:3}
.sb span:last-child{font-size:12px;letter-spacing:2px}
.scroll{position:absolute;inset:0 0 92px;overflow-y:auto;padding:58px 20px 20px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.head h1{margin:0;font:800 32px/1.1 var(--round)}
.head small{display:block;font:13px var(--sans);color:var(--muted);margin-top:4px}
.head .me{width:42px;height:42px;border-radius:50%;background:var(--peach);display:grid;place-items:center;font-weight:700}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:18px}
.week button{border:0;background:var(--card);border-radius:16px;padding:8px 0;font:12px var(--sans);color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.week button b{font:700 16px var(--round);color:var(--ink)}
.week button[aria-current="date"]{background:var(--lilac);color:#fff}
.week button[aria-current="date"] b{color:#fff}
.week button i{width:5px;height:5px;border-radius:50%;background:transparent}
.week button.has i{background:var(--peach)}
.tabs{display:flex;gap:8px;margin-bottom:10px}
.tabs button{border:0;background:none;font:600 14px var(--sans);color:var(--faint);padding:4px 2px;cursor:pointer;border-bottom:3px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--lilac)}
.empty{text-align:center;padding:6px 6px 0}
.clay{position:relative;width:220px;height:190px;margin:0 auto 6px}
.clay .cloud{position:absolute;left:24px;top:60px;width:170px;height:96px;border-radius:60px;background:radial-gradient(circle at 35% 30%,#ffffff,#e9e3ff 60%,#d3c9ff);box-shadow:0 18px 30px #8b7cf633,inset -8px -10px 20px #b9acff66}
.clay .cloud::before{content:'';position:absolute;left:30px;top:-38px;width:80px;height:80px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffffff,#e9e3ff 60%,#d3c9ff)}
.clay .cloud::after{content:'';position:absolute;left:86px;top:-24px;width:62px;height:62px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffffff,#e9e3ff 60%,#d3c9ff)}
.clay .face{position:absolute;left:86px;top:98px;width:46px;height:18px;z-index:2}
.clay .face::before,.clay .face::after{content:'';position:absolute;top:0;width:8px;height:8px;border-radius:50%;background:var(--ink)}
.clay .face::before{left:4px}.clay .face::after{right:4px}
.clay .smile{position:absolute;left:100px;top:110px;width:18px;height:9px;border-radius:0 0 18px 18px;border:3px solid var(--ink);border-top:0;z-index:2}
.clay .blush{position:absolute;top:108px;width:12px;height:7px;border-radius:50%;background:#ffb8a6aa;z-index:2}
.clay .z{position:absolute;font:800 18px var(--round);color:var(--lilac);animation:float 3s ease-in-out infinite}
.clay .ball{position:absolute;border-radius:50%;box-shadow:inset -4px -5px 8px #0000001a}
.empty h2{margin:6px 0 6px;font:800 22px var(--round)}
.empty p{margin:0 auto 18px;color:var(--muted);max-width:280px;font-size:14px}
.create{width:100%;height:56px;border:0;border-radius:20px;background:var(--lilac);color:#fff;font:800 17px var(--round);cursor:pointer;box-shadow:0 10px 20px #8b7cf655,inset 0 -4px 0 #6d5ee0;transition:transform .12s}
.create:active{transform:translateY(2px);box-shadow:0 4px 10px #8b7cf655,inset 0 -2px 0 #6d5ee0}
.or{font-size:12px;color:var(--faint);margin:16px 0 8px}
.tpl{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.tpl button{flex:none;border:0;background:var(--card);border-radius:16px;padding:10px 12px;font:600 13px var(--sans);color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:8px;box-shadow:0 2px 6px #8b7cf614}
.tpl button i{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;font-style:normal}
.list{display:grid;gap:8px}
.task{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;background:var(--card);border-radius:18px;padding:12px 14px;box-shadow:0 2px 8px #8b7cf614;animation:pop .3s ease-out}
.task button.ck{width:24px;height:24px;border-radius:8px;border:2px solid var(--faint);background:none;cursor:pointer;display:grid;place-items:center;color:#fff;font-size:13px}
.task.done button.ck{background:var(--mint);border-color:var(--mint)}
.task.done span{color:var(--faint);text-decoration:line-through}
.task small{font-size:11px;color:var(--muted);background:var(--lilac-soft);padding:2px 8px;border-radius:999px}
.nav{position:absolute;left:12px;right:12px;bottom:12px;height:72px;background:var(--card);border-radius:28px;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;box-shadow:0 10px 30px #6d5ee026;z-index:5}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font:11px var(--sans);color:var(--faint);cursor:pointer}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--lilac-dk);font-weight:600}
.nav .fab{width:54px;height:54px;border-radius:20px;background:var(--ink);color:#fff;font:400 28px var(--round);margin:0 auto;transform:translateY(-14px);box-shadow:0 10px 20px #2b254055;justify-content:center}
.create:focus-visible,.nav button:focus-visible,.week button:focus-visible,.tabs button:focus-visible,.tpl button:focus-visible,.ck:focus-visible,.sheet button:focus-visible{outline:3px solid var(--butter);outline-offset:2px}
.scrim{position:absolute;inset:0;background:#2b254066;opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:30px 30px 0 0;padding:12px 20px 28px;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);z-index:11}
.sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--lilac-soft);margin:0 auto 14px}
.sheet h3{margin:0 0 10px;font:800 18px var(--round)}
.sheet input{width:100%;height:50px;border-radius:16px;border:2px solid var(--lilac-soft);background:var(--bg);padding:0 14px;font:16px var(--sans);outline:none;color:var(--ink)}
.sheet input:focus{border-color:var(--lilac)}
.when{display:flex;gap:6px;margin:12px 0 16px}
.when button{border:0;background:var(--bg);border-radius:999px;padding:6px 12px;font:13px var(--sans);color:var(--muted);cursor:pointer}
.when button[aria-pressed="true"]{background:var(--lilac-soft);color:var(--lilac-dk);font-weight:600}
.sheet .err{font-size:12px;color:#d9534f;min-height:16px;margin-top:6px}
@keyframes float{50%{transform:translateY(-6px)}}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@media (max-width:500px){body{display:block;background:var(--bg)}.phone{width:100%;height:100vh;height:100dvh;border:0;border-radius:0}.notch{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="phone">
  <div class="notch" aria-hidden="true"></div>
  <div class="sb" aria-hidden="true"><span>9:41</span><span>▂▄▆ ▮▮▮</span></div>
  <main class="scroll">
    <div class="head"><div><h1>今天</h1><small>10 月 23 日 · 周五 · 霜降</small></div><span class="me">糖</span></div>
    <div class="week" id="week"></div>
    <div class="tabs" role="tablist"><button type="button" role="tab" aria-selected="true">待办</button><button type="button" role="tab" aria-selected="false">已完成</button></div>
    <section id="emptyBox" class="empty" aria-live="polite">
      <div class="clay" aria-hidden="true">
        <div class="cloud"></div><div class="face"></div><div class="smile"></div><span class="blush" style="left:80px"></span><span class="blush" style="left:128px"></span>
        <span class="z" style="left:176px;top:30px">z</span><span class="z" style="left:192px;top:8px;font-size:13px;animation-delay:.6s">z</span>
        <span class="ball" style="left:10px;top:40px;width:22px;height:22px;background:#ffe29a"></span><span class="ball" style="left:186px;top:140px;width:16px;height:16px;background:#9be3c7"></span><span class="ball" style="left:40px;top:156px;width:12px;height:12px;background:#ffb8a6"></span>
      </div>
      <h2>今天还没有待办</h2>
      <p>清单空空，云朵在打盹。写下第一件想完成的小事，哪怕只是“喝一杯水”。</p>
      <button class="create" type="button" id="create">＋ 新建第一条待办</button>
      <div class="or">或者，从一个习惯模板开始</div>
      <div class="tpl" id="tpl">
        <button type="button" data-t="晨间例行"><i style="background:#ffe29a">☀</i>晨间例行</button>
        <button type="button" data-t="专注工作"><i style="background:#e4ddff">◎</i>专注工作</button>
        <button type="button" data-t="睡前放松"><i style="background:#9be3c7">☾</i>睡前放松</button>
      </div>
    </section>
    <section id="listBox" hidden><div class="list" id="list"></div></section>
  </main>
  <nav class="nav" aria-label="底部导航">
    <button type="button" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="5"/><path d="M8 12l3 3 5-6"/></svg>今天</button>
    <button type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="5" width="16" height="15" rx="4"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>日历</button>
    <button type="button" class="fab" id="fab" aria-label="新建待办">＋</button>
    <button type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V11M10 19V5M16 19v-6M22 19H2"/></svg>回顾</button>
    <button type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>我的</button>
  </nav>
  <div class="scrim" id="scrim"></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shT">
    <div class="grab"></div><h3 id="shT">新建待办</h3>
    <input id="taskIn" placeholder="想做点什么？" maxlength="30" aria-label="待办内容">
    <div class="err" id="err"></div>
    <div class="when" role="group" aria-label="时间"><button type="button" aria-pressed="true">今天</button><button type="button" aria-pressed="false">今晚</button><button type="button" aria-pressed="false">明天</button><button type="button" aria-pressed="false">无日期</button></div>
    <button class="create" type="button" id="add">添加</button>
  </section>
</div>
<script>
const $=s=>document.getElementById(s);
const days=['一','二','三','四','五','六','日'];
$('week').innerHTML=days.map((d,k)=>'<button type="button" '+(k===4?'aria-current="date"':'')+' class="'+([1,2].includes(k)?'has':'')+'">'+d+'<b>'+(19+k)+'</b><i></i></button>').join('');
const tpls={'晨间例行':['起床后喝一杯温水','拉伸 10 分钟','吃早餐不看手机'],'专注工作':['列出今天最重要的 3 件事','番茄钟 25 分钟 × 4','下班前整理桌面'],'睡前放松':['22:30 放下手机','读 20 页书','写三件今天的小确幸']};
let tasks=[],when='今天';
function render(){
  const has=tasks.length>0;$('emptyBox').hidden=has;$('listBox').hidden=!has;
  $('list').innerHTML=tasks.map((t,k)=>'<div class="task'+(t.d?' done':'')+'"><button class="ck" type="button" data-k="'+k+'" aria-label="完成 '+t.n+'" aria-pressed="'+t.d+'">'+(t.d?'✓':'')+'</button><span>'+t.n+'</span><small>'+t.w+'</small></div>').join('')+'<button class="create" type="button" id="more" style="margin-top:6px;background:#e4ddff;color:#6d5ee0;box-shadow:none">＋ 再加一条</button>';
  document.querySelectorAll('.ck').forEach(b=>b.onclick=()=>{const t=tasks[+b.dataset.k];t.d=!t.d;render()});
  const m=$('more');if(m)m.onclick=open;
}
function open(){$('taskIn').value='';$('err').textContent='';$('sheet').classList.add('on');$('scrim').classList.add('on');setTimeout(()=>$('taskIn').focus(),50)}
function close(){$('sheet').classList.remove('on');$('scrim').classList.remove('on')}
$('create').onclick=open;$('fab').onclick=open;$('scrim').onclick=close;
document.querySelectorAll('.when button').forEach(b=>b.onclick=()=>{when=b.textContent;document.querySelectorAll('.when button').forEach(x=>x.setAttribute('aria-pressed',x===b))});
function add(){const v=$('taskIn').value.trim();if(!v){$('err').textContent='写点什么吧，一个字也行';$('taskIn').focus();return}tasks.push({n:v,w:when,d:false});close();render()}
$('add').onclick=add;$('taskIn').onkeydown=e=>{if(e.key==='Enter')add()};
document.querySelectorAll('#tpl button').forEach(b=>b.onclick=()=>{tasks=tpls[b.dataset.t].map(n=>({n,w:b.dataset.t,d:false}));render()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
document.querySelectorAll('.nav button:not(.fab)').forEach(b=>b.onclick=()=>document.querySelectorAll('.nav button:not(.fab)').forEach(x=>x===b?x.setAttribute('aria-current','page'):x.removeAttribute('aria-current')));
render();
</script>
</body>
</html>
