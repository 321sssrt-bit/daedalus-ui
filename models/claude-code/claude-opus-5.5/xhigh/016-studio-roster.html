<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>垣筑建筑事务所 · 成员</title>
<style>
:root{
  --concrete:#e4e2dd;--panel:#f2f1ee;--card:#fbfbfa;--ink:#1a1a1a;--muted:#6f6d68;--line:#c9c6bf;--orange:#ff5b14;--orange-dk:#d94400;--away:#8a8780;
  --cond:"DIN Condensed","Avenir Next Condensed","Arial Narrow","PingFang SC",sans-serif;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--concrete);color:var(--ink);font:14px/1.5 var(--sans)}
.top{display:flex;align-items:flex-end;gap:32px;padding:28px 40px 18px;border-bottom:2px solid var(--ink)}
.top h1{margin:0;font:700 64px/0.85 var(--cond);letter-spacing:-.01em;text-transform:uppercase}
.top h1 span{color:var(--orange)}
.top .sub{font-size:13px;color:var(--muted);padding-bottom:4px}
.top .sub b{color:var(--ink)}
.search{margin-left:auto;position:relative;width:320px}
.search input{width:100%;height:42px;border:2px solid var(--ink);background:var(--card);padding:0 14px 0 40px;font:14px var(--sans);outline:none;color:var(--ink)}
.search input:focus{border-color:var(--orange)}
.search svg{position:absolute;left:12px;top:11px;width:18px;height:18px}
.layout{display:grid;grid-template-columns:240px minmax(0,1fr)}
.rail{padding:24px 24px 40px 40px;border-right:1px solid var(--line)}
.grp{margin-bottom:26px}
.grp h3{font:700 15px/1 var(--cond);letter-spacing:.08em;margin:0 0 10px;text-transform:uppercase;display:flex;justify-content:space-between}
.grp h3 button{border:0;background:none;font:12px var(--sans);color:var(--muted);cursor:pointer;text-transform:none;letter-spacing:0;padding:0}
.grp h3 button:hover{color:var(--orange)}
.opt{display:flex;align-items:center;gap:10px;padding:6px 0;cursor:pointer;font-size:14px}
.opt input{appearance:none;width:16px;height:16px;border:2px solid var(--ink);margin:0;display:grid;place-items:center;cursor:pointer;background:var(--card)}
.opt input:checked{background:var(--ink)}
.opt input:checked::after{content:'';width:6px;height:6px;background:var(--orange)}
.opt input:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.opt .n{margin-left:auto;font:600 13px var(--cond);color:var(--muted)}
.main{padding:24px 40px 48px}
.bar{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.bar .count{font:700 28px/1 var(--cond)}
.bar .count small{font:13px var(--sans);color:var(--muted);margin-left:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--ink);background:var(--ink);color:var(--card);font:12px var(--sans);padding:3px 8px;cursor:pointer}
.chips button:hover{background:var(--orange);border-color:var(--orange)}
.view{margin-left:auto;display:flex;border:2px solid var(--ink)}
.view button{border:0;background:var(--card);padding:6px 12px;font:600 12px var(--sans);cursor:pointer}
.view button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2px;background:var(--line);border:2px solid var(--line)}
.grid.list{grid-template-columns:1fr}
.p{background:var(--card);border:0;padding:0;text-align:left;cursor:pointer;font-family:var(--sans);color:var(--ink);display:flex;flex-direction:column;position:relative;transition:background .15s}
.p:hover{background:#ffffff}
.p:hover .ph{filter:grayscale(0)}
.p:focus-visible{outline:3px solid var(--orange);outline-offset:-3px;z-index:2}
.p[aria-pressed="true"]{box-shadow:inset 0 -5px 0 var(--orange)}
.ph{aspect-ratio:4/3;position:relative;overflow:hidden;filter:grayscale(1);transition:filter .25s}
.ph b{position:absolute;right:10px;bottom:4px;font:700 54px/1 var(--cond);color:#ffffffd9}
.ph i{position:absolute;left:50%;bottom:-18%;width:46%;aspect-ratio:1;border-radius:50% 50% 0 0;transform:translateX(-50%);background:#00000033}
.ph i::before{content:'';position:absolute;left:50%;top:-48%;width:56%;aspect-ratio:1;border-radius:50%;transform:translateX(-50%);background:#00000033}
.info{padding:12px 14px 14px}
.info h4{margin:0;font-size:16px;display:flex;align-items:center;gap:8px}
.info .role{font-size:12px;color:var(--muted)}
.info .meta{display:flex;justify-content:space-between;margin-top:8px;font:600 13px var(--cond);letter-spacing:.04em;text-transform:uppercase}
.st{width:8px;height:8px;border-radius:50%;background:#2f9e5b;flex:none}
.st.away{background:var(--away)}.st.trip{background:var(--orange)}
.grid.list .p{flex-direction:row;align-items:center}
.grid.list .ph{width:96px;aspect-ratio:1;flex:none}
.grid.list .ph b{font-size:30px}
.grid.list .info{flex:1;display:grid;grid-template-columns:1.2fr 1.5fr 1fr;align-items:center;gap:16px}
.grid.list .info .meta{margin:0}
.none{grid-column:1/-1;background:var(--card);padding:60px 20px;text-align:center;color:var(--muted)}
.none button{margin-top:12px;border:2px solid var(--ink);background:var(--orange);color:var(--ink);font:700 13px var(--sans);padding:8px 16px;cursor:pointer}
.panel{position:fixed;top:0;right:0;bottom:0;width:440px;max-width:100%;background:var(--card);border-left:2px solid var(--ink);transform:translateX(102%);transition:transform .28s cubic-bezier(.2,.7,.2,1);z-index:10;overflow:auto}
.panel.open{transform:none}
.panel .hero{height:220px;position:relative;filter:grayscale(.2)}
.panel .hero b{position:absolute;left:24px;bottom:12px;font:700 120px/0.8 var(--cond);color:#ffffffe6}
.panel .x{position:absolute;top:14px;right:14px;width:40px;height:40px;border:2px solid var(--ink);background:var(--card);font:700 16px var(--sans);cursor:pointer;z-index:1}
.panel .x:hover{background:var(--orange)}
.pbody{padding:22px 24px 32px}
.pbody h2{margin:0;font:700 34px/1 var(--cond);letter-spacing:.01em}
.pbody .r{color:var(--muted);margin:6px 0 16px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);border-top:2px solid var(--ink);border-bottom:1px solid var(--line);margin-bottom:18px}
.facts div{padding:10px 0}
.facts small{display:block;font-size:11px;color:var(--muted)}
.facts b{font:700 20px var(--cond)}
.pbody h5{font:700 14px var(--cond);letter-spacing:.1em;margin:18px 0 8px;text-transform:uppercase}
.pbody p{margin:0;font-size:14px;line-height:1.75}
.proj{display:grid;gap:6px}
.proj div{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.proj span{font:600 13px var(--cond);color:var(--muted)}
.contact{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:22px}
.contact button{height:46px;border:2px solid var(--ink);font:700 14px var(--sans);cursor:pointer;background:var(--card)}
.contact button.pri{background:var(--orange)}
.contact button:hover{background:var(--ink);color:var(--card)}
.scrim{position:fixed;inset:0;background:#1a1a1a40;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
.scrim.on{opacity:1;pointer-events:auto}
@media (max-width:1180px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.top h1{font-size:48px}}
@media (max-width:900px){.layout{grid-template-columns:1fr}.rail{display:flex;gap:24px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:16px 24px}.grp{margin:0;min-width:160px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.top{flex-wrap:wrap;padding:20px 24px 14px}.search{width:100%;margin-left:0}.main{padding:20px 24px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <h1>垣筑<span>·</span>成员</h1>
  <div class="sub"><b>12</b> 位核心成员 · 3 个工作室 · 5 个专业组</div>
  <label class="search"><svg viewBox="0 0 20 20" fill="none" stroke="#1a1a1a" stroke-width="2.2"><circle cx="9" cy="9" r="6"/><path d="M14 14l4 4"/></svg><input id="q" type="search" placeholder="搜姓名、职位或项目" aria-label="搜索成员"></label>
</header>
<div class="layout">
  <aside class="rail" id="rail" aria-label="筛选"></aside>
  <main class="main">
    <div class="bar"><span class="count" id="count"></span><div class="chips" id="chips"></div>
      <div class="view" role="group" aria-label="视图"><button type="button" aria-pressed="true" data-v="grid">网格</button><button type="button" aria-pressed="false" data-v="list">列表</button></div></div>
    <div class="grid" id="grid"></div>
  </main>
</div>
<div class="scrim" id="scrim"></div>
<aside class="panel" id="panel" aria-hidden="true" aria-labelledby="pName"></aside>
<script>
const people=[
 ['邵既明','创始合伙人 · 主持建筑师','上海','建筑','在岗',19,'#7b6a58',['滨江艺术码头','2025'],'同济建筑学学士、代尔夫特硕士。长期关注工业遗存改造，作品两次入围阿迦汗建筑奖短名单。'],
 ['廖青','合伙人 · 景观总监','成都','景观','出差',14,'#5e7a63',['青城山游客中心','2024'],'擅长在山地与水岸做低干预景观，主张"让雨水自己找路"。'],
 ['Anne de Vries','计算设计负责人','鹿特丹','计算设计','在岗',9,'#4f5d78',['参数化立面工具链','2026'],'从造船业转行，用算法优化幕墙单元，减少 18% 的板材损耗。'],
 ['覃野','项目建筑师','上海','建筑','在岗',7,'#8a6f5a',['松江社区图书馆','2025'],'负责从方案到施工图的全流程，喜欢在工地待着。'],
 ['陆知遥','室内设计主管','上海','室内','休假',8,'#9a7e86',['长乐路精品酒店','2024'],'把老洋房的木地板一块块编号拆下再装回去的那个人。'],
 ['蒋屹','结构工程师','成都','结构','在岗',11,'#6d6d6d',['竹构展亭','2023'],'竹与胶合木结构专家，参与编写地方竹结构技术规程。'],
 ['Mia Chen','可持续顾问','鹿特丹','建筑','出差',5,'#5f7d84',['零碳校园总图','2026'],'负责全生命周期碳排计算与认证申报。'],
 ['祁朗','建筑师','成都','建筑','在岗',4,'#7d725e',['宽窄巷子更新','2025'],'手绘很好，每个项目的第一张草图都出自他。'],
 ['舒畅','景观设计师','上海','景观','在岗',3,'#6a8a6a',['屋顶菜园计划','2026'],'把办公楼屋顶变成了能收菜的花园。'],
 ['温予','室内设计师','成都','室内','在岗',2,'#a08572',['社区食堂改造','2026'],'关注无障碍与适老化细节。'],
 ['樊卓','BIM 经理','上海','计算设计','在岗',10,'#555f6b',['全专业 BIM 协同标准','2024'],'让 40 人在同一个模型里不打架。'],
 ['阮青禾','结构工程师','上海','结构','休假',6,'#7a7a72',['钢木混合办公楼','2025'],'正在休产假，11 月底回来。']
];
const groups=[['studio','工作室',2],['dept','专业',3],['status','状态',4]];
let sel={studio:new Set(),dept:new Set(),status:new Set()},q='',view='grid',cur=-1;
const rail=document.getElementById('rail');
function counts(k,idx){return people.filter(p=>p[idx]===k).length}
function renderRail(){
  rail.innerHTML=groups.map(([g,label,idx])=>{const vals=[...new Set(people.map(p=>p[idx]))];
    return '<div class="grp"><h3>'+label+(sel[g].size?'<button type="button" data-clear="'+g+'">清除</button>':'')+'</h3>'+vals.map(v=>'<label class="opt"><input type="checkbox" data-g="'+g+'" value="'+v+'" '+(sel[g].has(v)?'checked':'')+'>'+v+'<span class="n">'+counts(v,idx)+'</span></label>').join('')+'</div>'}).join('');
  rail.querySelectorAll('input').forEach(i=>i.onchange=()=>{i.checked?sel[i.dataset.g].add(i.value):sel[i.dataset.g].delete(i.value);renderRail();renderGrid()});
  rail.querySelectorAll('[data-clear]').forEach(b=>b.onclick=()=>{sel[b.dataset.clear].clear();renderRail();renderGrid()});
}
function match(p){return(!sel.studio.size||sel.studio.has(p[2]))&&(!sel.dept.size||sel.dept.has(p[3]))&&(!sel.status.size||sel.status.has(p[4]))&&(!q||(p[0]+p[1]+p[7][0]).toLowerCase().includes(q.toLowerCase()))}
function stCls(s){return s==='在岗'?'':s==='出差'?' trip':' away'}
function renderGrid(){
  const v=people.map((p,i)=>[p,i]).filter(([p])=>match(p)),g=document.getElementById('grid');
  document.getElementById('count').innerHTML=v.length+'<small>/ '+people.length+' 位成员</small>';
  const active=[...sel.studio,...sel.dept,...sel.status];
  document.getElementById('chips').innerHTML=active.map(a=>'<button type="button" data-rm="'+a+'">'+a+' ✕</button>').join('');
  document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{Object.values(sel).forEach(s=>s.delete(b.dataset.rm));renderRail();renderGrid()});
  g.className='grid'+(view==='list'?' list':'');
  g.innerHTML=v.length?v.map(([p,i])=>'<button type="button" class="p" data-i="'+i+'" aria-pressed="'+(i===cur)+'"><div class="ph" style="background:linear-gradient(160deg,'+p[6]+',#2b2b2b)"><i></i><b>'+p[0][0]+'</b></div><div class="info"><h4><span class="st'+stCls(p[4])+'"></span>'+p[0]+'</h4><span class="role">'+p[1]+'</span><div class="meta"><span>'+p[2]+' · '+p[3]+'</span><span>'+p[4]+'</span></div></div></button>').join(''):'<div class="none">没有符合条件的成员。<br><button type="button" id="reset">清除全部筛选</button></div>';
  g.querySelectorAll('.p').forEach(b=>b.onclick=()=>openP(+b.dataset.i));
  const r=document.getElementById('reset');if(r)r.onclick=()=>{Object.values(sel).forEach(s=>s.clear());q='';document.getElementById('q').value='';renderRail();renderGrid()};
}
function openP(i){
  cur=i;const p=people[i],P=document.getElementById('panel');
  P.innerHTML='<button class="x" type="button" aria-label="关闭">✕</button><div class="hero" style="background:linear-gradient(160deg,'+p[6]+',#2b2b2b)"><b>'+p[0][0]+'</b></div><div class="pbody"><h2 id="pName">'+p[0]+'</h2><div class="r">'+p[1]+'</div>'+
  '<div class="facts"><div><small>工作室</small><b>'+p[2]+'</b></div><div><small>在所年限</small><b>'+p[5]+' 年</b></div><div><small>当前状态</small><b>'+p[4]+'</b></div></div>'+
  '<h5>简介</h5><p>'+p[8]+'</p><h5>代表项目</h5><div class="proj"><div>'+p[7][0]+'<span>'+p[7][1]+'</span></div><div>内部研究：材料库更新<span>进行中</span></div></div>'+
  '<div class="contact"><button type="button" class="pri" data-act="msg">发消息</button><button type="button" data-act="mail">复制邮箱</button></div></div>';
  P.classList.add('open');P.setAttribute('aria-hidden','false');document.getElementById('scrim').classList.add('on');P.querySelector('.x').focus();
  P.querySelector('.x').onclick=closeP;
  P.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{b.textContent=b.dataset.act==='msg'?'已打开会话':'已复制';});
  renderGrid();
}
function closeP(){const P=document.getElementById('panel');P.classList.remove('open');P.setAttribute('aria-hidden','true');document.getElementById('scrim').classList.remove('on');const b=document.querySelector('.p[data-i="'+cur+'"]');cur=-1;renderGrid();if(b){const nb=document.querySelector('.p[data-i="'+b.dataset.i+'"]');nb&&nb.focus()}}
document.getElementById('scrim').onclick=closeP;
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&cur>=0)closeP()});
document.getElementById('q').oninput=e=>{q=e.target.value.trim();renderGrid()};
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{view=b.dataset.v;document.querySelectorAll('[data-v]').forEach(x=>x.setAttribute('aria-pressed',x===b));renderGrid()});
renderRail();renderGrid();
</script>
</body>
</html>
