<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>青玉钱包</title>
<style>
:root{
  --room:#cfd6d1;--jade:#0f3d33;--jade-2:#155244;--jade-3:#1d6b58;--cream:#f4eee2;--card:#fffaf0;--gold:#d9b46a;--ink:#14211d;--muted:#6f7c75;--line:#e4dccb;--out:#c2553f;--in:#2f8a5f;
  --num:"Avenir Next","SF Pro Display","Helvetica Neue","PingFang SC",sans-serif;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:radial-gradient(circle at 30% 20%,#e3e8e4,var(--room));display:grid;place-items:center;font:14px/1.5 var(--sans);color:var(--ink)}
.phone{width:390px;height:min(844px,calc(100vh - 32px));border-radius:52px;border:11px solid #0b0f0d;background:var(--cream);position:relative;overflow:hidden;box-shadow:0 30px 70px #0f3d3359,inset 0 0 0 1px #2a302d}
.notch{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:118px;height:32px;border-radius:20px;background:#0b0f0d;z-index:20}
.scroll{position:absolute;inset:0 0 84px;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.hero{background:var(--jade);color:var(--cream);padding:54px 22px 70px;border-radius:0 0 32px 32px;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;right:-60px;top:-40px;width:220px;height:220px;border-radius:50%;border:30px solid #ffffff0a}
.sb{position:absolute;top:16px;left:30px;right:26px;display:flex;justify-content:space-between;font:600 15px var(--num);color:var(--cream)}
.sb span:last-child{letter-spacing:2px;font-size:12px}
.hi{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.hi .who{display:flex;align-items:center;gap:10px}
.hi .av{width:38px;height:38px;border-radius:50%;background:var(--gold);color:var(--jade);display:grid;place-items:center;font-weight:700}
.hi small{display:block;font-size:12px;color:#b9cbc3}
.hi b{font-weight:600}
.bell{width:38px;height:38px;border-radius:50%;border:1px solid #ffffff26;background:transparent;color:var(--cream);font-size:16px;cursor:pointer;position:relative}
.bell::after{content:'';position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--gold)}
.lbl{display:flex;align-items:center;gap:8px;font-size:13px;color:#b9cbc3}
.eye{border:0;background:none;color:#b9cbc3;cursor:pointer;font-size:15px;padding:2px}
.bal{font:600 42px/1.1 var(--num);letter-spacing:-.01em;margin:6px 0 4px}
.bal small{font-size:22px;margin-right:4px}
.bal .dec{font-size:22px;color:#b9cbc3}
.sub{font-size:12px;color:#b9cbc3}
.sub b{color:var(--gold);font-weight:600}
.acts{margin:-46px 18px 0;background:var(--card);border-radius:24px;padding:16px 10px;display:grid;grid-template-columns:repeat(4,1fr);box-shadow:0 12px 30px #0f3d3322;position:relative;z-index:2}
.act{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;font:500 12px var(--sans);color:var(--ink);padding:4px 0}
.act i{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;font-style:normal;font-size:20px;background:#eef3ee;color:var(--jade)}
.act.pri i{background:var(--jade);color:var(--gold)}
.act:active i{transform:scale(.94)}
.card2{margin:16px 18px 0;padding:14px 16px;border-radius:20px;background:linear-gradient(120deg,#1d6b58,#0f3d33);color:var(--cream);display:flex;justify-content:space-between;align-items:center}
.card2 small{display:block;color:#b9cbc3;font-size:11px}
.card2 b{font:600 16px var(--num)}
.card2 .pill{font-size:11px;background:var(--gold);color:var(--jade);padding:3px 10px;border-radius:999px;font-weight:600}
.tx{margin:20px 18px 24px}
.txh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.txh h2{margin:0;font:700 17px var(--sans)}
.seg{display:flex;background:#e9e2d2;border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:4px 12px;border-radius:999px;font:12px var(--sans);color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 3px #0001}
.day{font-size:12px;color:var(--muted);margin:12px 0 6px}
.row{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;width:100%;padding:10px 12px;border:0;border-radius:16px;background:var(--card);margin-bottom:8px;cursor:pointer;text-align:left;font:14px var(--sans);color:var(--ink)}
.row:active{transform:scale(.99)}
.row i{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-style:normal;font-size:18px}
.row b{display:block;font-weight:600;font-size:14px}
.row small{color:var(--muted);font-size:12px}
.row .amt{font:600 16px var(--num);text-align:right}
.row .amt.out{color:var(--ink)}.row .amt.in{color:var(--in)}
.row .amt small{display:block;font:11px var(--sans);color:var(--muted);font-weight:400}
.nav{position:absolute;left:0;right:0;bottom:0;height:84px;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:8px 8px 22px;z-index:5}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font:11px var(--sans);color:var(--muted);cursor:pointer}
.nav button svg{width:24px;height:24px}
.nav button[aria-current="page"]{color:var(--jade);font-weight:600}
.nav button[aria-current="page"] svg{stroke:var(--jade)}
.act:focus-visible,.row:focus-visible,.nav button:focus-visible,.seg button:focus-visible,.eye:focus-visible,.bell:focus-visible,.sheet button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.scrim{position:absolute;inset:0;background:#0b0f0d66;opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:28px 28px 0 0;padding:10px 22px 30px;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);z-index:11}
.sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sheet h3{margin:0 0 4px;font:700 18px var(--sans)}
.sheet .big{font:600 34px var(--num);margin:8px 0}
.sheet dl{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:13px;margin:14px 0 18px}
.sheet dt{color:var(--muted)}
.sheet dd{margin:0;text-align:right}
.sheet .btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet button{height:48px;border-radius:14px;border:1px solid var(--line);background:var(--card);font:600 15px var(--sans);cursor:pointer;color:var(--ink)}
.sheet button.pri{background:var(--jade);color:var(--cream);border-color:var(--jade)}
.qr{width:170px;height:170px;margin:12px auto;background:#fff;border-radius:16px;padding:12px;display:grid;grid-template-columns:repeat(9,1fr);gap:2px;border:1px solid var(--line)}
.qr i{background:var(--jade);border-radius:2px}
.qr i.w{background:transparent}
@media (max-width:500px){body{display:block;background:var(--cream)}.phone{width:100%;height:100vh;height:100dvh;border:0;border-radius:0;box-shadow:none}.notch{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="phone">
  <div class="notch" aria-hidden="true"></div>
  <div class="scroll">
    <section class="hero">
      <div class="sb" aria-hidden="true"><span>9:41</span><span>▂▄▆ 5G ▮▮▮</span></div>
      <div class="hi"><div class="who"><span class="av">宁</span><div><small>下午好</small><b>沈宁</b></div></div><button class="bell" type="button" aria-label="消息">🔔</button></div>
      <div class="lbl">总资产（元）<button class="eye" type="button" id="eye" aria-label="隐藏金额" aria-pressed="false">◉</button></div>
      <div class="bal" id="bal"><small>¥</small>48,260<span class="dec">.35</span></div>
      <div class="sub">昨日收益 <b>+¥6.82</b> · 零钱理财 年化 1.86%</div>
    </section>
    <nav class="acts" aria-label="快捷操作">
      <button class="act pri" type="button" data-s="send"><i>↗</i>转账</button>
      <button class="act" type="button" data-s="recv"><i>↙</i>收款</button>
      <button class="act" type="button" data-s="scan"><i>⌗</i>扫一扫</button>
      <button class="act" type="button" data-s="card"><i>▭</i>卡包</button>
    </nav>
    <div class="card2"><div><small>本月支出 · 预算 ¥6,000</small><b id="spent">¥3,284.60</b></div><span class="pill">剩 ¥2,715</span></div>
    <section class="tx">
      <div class="txh"><h2>最近流水</h2><div class="seg" role="group" aria-label="流水筛选"><button type="button" aria-pressed="true" data-f="all">全部</button><button type="button" aria-pressed="false" data-f="out">支出</button><button type="button" aria-pressed="false" data-f="in">收入</button></div></div>
      <div id="list"></div>
    </section>
  </div>
  <nav class="nav" aria-label="底部导航">
    <button type="button" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 10l9-7 9 7v10a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>首页</button>
    <button type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg>账单</button>
    <button type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M8 12h8M12 8v8"/></svg>理财</button>
    <button type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>我的</button>
  </nav>
  <div class="scrim" id="scrim"></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shT"><div class="grab"></div><h3 id="shT"></h3><div id="shBody"></div></section>
</div>
<script>
const tx=[
 {d:'今天',n:'山野咖啡',c:'餐饮 · 微信',a:-32,ic:'☕',bg:'#f6e7d2',t:'09:12',no:'2610230912448'},
 {d:'今天',n:'工资 · 杭州远帆科技',c:'收入 · 代发',a:18600,ic:'💼',bg:'#dcefe4',t:'08:00',no:'2610230800071'},
 {d:'今天',n:'地铁 1 号线',c:'交通',a:-4,ic:'🚇',bg:'#e3e9f3',t:'07:48',no:'2610230748203'},
 {d:'昨天',n:'盒马鲜生',c:'日用 · 买菜',a:-186.4,ic:'🥬',bg:'#e6f1dd',t:'19:36',no:'2610221936512'},
 {d:'昨天',n:'林小满 转入',c:'转账 · 聚餐 AA',a:128,ic:'👤',bg:'#efe4f3',t:'21:05',no:'2610222105339'},
 {d:'10 月 21 日',n:'国家电网',c:'生活缴费 · 电费',a:-215.3,ic:'⚡',bg:'#f6f0d4',t:'10:20',no:'2610211020884'},
 {d:'10 月 21 日',n:'零钱理财收益',c:'理财',a:6.82,ic:'🌱',bg:'#dcefe4',t:'05:00',no:'2610210500012'}
];
let f='all',hide=false;
const fmt=(n,showSign)=>(showSign?(n<0?'−':'+'):'')+'¥'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
function list(){
  const v=tx.map((t,i)=>[t,i]).filter(([t])=>f==='all'||(f==='in'?t.a>0:t.a<0));let day='',h='';
  v.forEach(([t,i])=>{if(t.d!==day){day=t.d;h+='<div class="day">'+day+'</div>'}
    h+='<button class="row" type="button" data-i="'+i+'"><i style="background:'+t.bg+'">'+t.ic+'</i><span><b>'+t.n+'</b><small>'+t.c+' · '+t.t+'</small></span><span class="amt '+(t.a<0?'out':'in')+'">'+(hide?'****':fmt(t.a,true))+'<small>'+(t.a<0?'余额支付':'已入账')+'</small></span></button>'});
  document.getElementById('list').innerHTML=h;
  document.querySelectorAll('.row').forEach(r=>r.onclick=()=>detail(tx[+r.dataset.i]));
}
function open(title,html){document.getElementById('shT').textContent=title;document.getElementById('shBody').innerHTML=html;document.getElementById('sheet').classList.add('on');document.getElementById('scrim').classList.add('on');const b=document.querySelector('#shBody button');b&&b.focus();document.querySelectorAll('#shBody [data-x]').forEach(b=>b.onclick=close)}
function close(){document.getElementById('sheet').classList.remove('on');document.getElementById('scrim').classList.remove('on')}
function detail(t){open(t.n,'<div style="color:#6f7c75;font-size:13px">'+t.c+'</div><div class="big" style="color:'+(t.a<0?'#14211d':'#2f8a5f')+'">'+fmt(t.a,true)+'</div><dl><dt>交易时间</dt><dd>2026-10-'+(t.d==='今天'?'23':t.d==='昨天'?'22':'21')+' '+t.t+'</dd><dt>支付方式</dt><dd>青玉钱包余额</dd><dt>交易单号</dt><dd style="font-family:var(--num)">'+t.no+'</dd><dt>状态</dt><dd style="color:#2f8a5f">交易成功</dd></dl><div class="btns"><button type="button" data-x>关闭</button><button type="button" class="pri" data-x>'+(t.a<0?'对此账单有疑问':'查看凭证')+'</button></div>')}
const sheets={
 send:['转账','<div style="color:#6f7c75;font-size:13px">最近联系人</div><div style="display:flex;gap:14px;margin:14px 0 18px">'+['林小满','沈母','陈越','房东王'].map(n=>'<div style="text-align:center;font-size:12px"><div style="width:52px;height:52px;border-radius:50%;background:#eef3ee;display:grid;place-items:center;font-weight:700;color:#0f3d33;margin-bottom:4px">'+n[0]+'</div>'+n+'</div>').join('')+'</div><div class="btns"><button type="button" data-x>取消</button><button type="button" class="pri" data-x>转到银行卡</button></div>'],
 recv:['向我付款','<div style="color:#6f7c75;font-size:13px">对方扫码即可转账给沈宁（**宁）</div><div class="qr">'+Array.from({length:81},(_,i)=>'<i class="'+(((i*7+i%9*3)%5<2)&&![0,1,2,9,11,18,19,20,6,7,8,15,17,24,25,26,54,55,56,63,65,72,73,74].includes(i)?'w':'')+'"></i>').join('')+'</div><div class="btns"><button type="button" data-x>保存图片</button><button type="button" class="pri" data-x>设置金额</button></div>'],
 scan:['扫一扫','<div style="height:220px;border-radius:18px;background:#0b0f0d;margin:12px 0 18px;display:grid;place-items:center;color:#d9b46a;font-size:13px;position:relative"><span style="position:absolute;inset:40px;border:2px solid #d9b46a;border-radius:12px"></span>将二维码放入框内</div><div class="btns"><button type="button" data-x>相册</button><button type="button" class="pri" data-x>关闭</button></div>'],
 card:['卡包','<dl><dt>招商银行 储蓄卡</dt><dd>•••• 6620</dd><dt>交通银行 信用卡</dt><dd>•••• 3108 · 账单日 5 日</dd><dt>杭州地铁 乘车码</dt><dd>已开通</dd></dl><div class="btns"><button type="button" data-x>关闭</button><button type="button" class="pri" data-x>添加卡片</button></div>']
};
document.querySelectorAll('.act').forEach(b=>b.onclick=()=>open(...sheets[b.dataset.s]));
document.getElementById('scrim').onclick=close;
document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{f=b.dataset.f;document.querySelectorAll('[data-f]').forEach(x=>x.setAttribute('aria-pressed',x===b));list()});
document.getElementById('eye').onclick=e=>{hide=!hide;e.currentTarget.setAttribute('aria-pressed',hide);e.currentTarget.textContent=hide?'◎':'◉';e.currentTarget.setAttribute('aria-label',hide?'显示金额':'隐藏金额');
  document.getElementById('bal').innerHTML=hide?'<small>¥</small>******':'<small>¥</small>48,260<span class="dec">.35</span>';document.getElementById('spent').textContent=hide?'****':'¥3,284.60';list()};
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>document.querySelectorAll('.nav button').forEach(x=>x===b?x.setAttribute('aria-current','page'):x.removeAttribute('aria-current')));
list();
</script>
</body>
</html>
