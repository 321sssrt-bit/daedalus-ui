<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>山间茶事 · 茶叶与茶器</title>
<style>
:root{
  --roast:#2b1d16;--roast-2:#3a281e;--clay:#efe6da;--clay-2:#e3d5c3;--leaf:#f6f0e6;--ink:#2b1d16;--muted:#8a7464;--gold:#c99a4f;--gold-hi:#dcb26a;--jade:#7c9a7e;--line:#4a372b;
  --fang:"STFangsong","FangSong","Songti SC",serif;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--roast);color:var(--leaf);font:14px/1.6 var(--sans)}
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:20px 48px;border-bottom:1px solid var(--line)}
.top nav{display:flex;gap:26px;font-size:13px}
.top nav a{color:#cdbba8;text-decoration:none}
.top nav a:hover{color:var(--gold-hi)}
.brand{text-align:center;font:700 26px/1 var(--fang);letter-spacing:.3em;color:var(--leaf)}
.brand small{display:block;font:11px var(--sans);letter-spacing:.4em;color:var(--muted);margin-top:6px}
.tools{justify-self:end;display:flex;gap:10px}
.tools button{height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--leaf);font:13px var(--sans);cursor:pointer;display:flex;align-items:center;gap:8px}
.tools button:hover{border-color:var(--gold)}
.tools .n{min-width:20px;height:20px;border-radius:10px;background:var(--gold);color:var(--roast);font:700 12px/20px var(--sans);text-align:center;transition:transform .2s}
.tools .n.bump{transform:scale(1.35)}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;padding:48px 48px 40px;align-items:center}
.hero .eyebrow{font-size:12px;letter-spacing:.3em;color:var(--gold)}
.hero h1{font:700 64px/1.15 var(--fang);margin:12px 0 16px;letter-spacing:.06em}
.hero p{color:#cdbba8;max-width:440px;margin:0 0 24px}
.hero .cta{display:flex;gap:12px}
.btn{height:46px;padding:0 24px;border-radius:999px;font:600 14px var(--sans);cursor:pointer;border:1px solid var(--gold);transition:background .15s,color .15s}
.btn.pri{background:var(--gold);color:var(--roast)}
.btn.pri:hover{background:var(--gold-hi)}
.btn.sec{background:transparent;color:var(--leaf)}
.btn.sec:hover{background:#c99a4f22}
.btn:focus-visible,.tab:focus-visible,.add:focus-visible,.fav:focus-visible,.tools button:focus-visible{outline:2px solid var(--gold-hi);outline-offset:3px}
.feature{position:relative;height:300px;border-radius:200px 200px 16px 16px;background:radial-gradient(circle at 50% 30%,#5a3d2c,var(--roast-2) 70%);display:grid;place-items:center;overflow:hidden}
.feature svg{width:260px;height:260px}
.feature .tag{position:absolute;left:24px;bottom:22px;background:var(--leaf);color:var(--ink);padding:10px 14px;border-radius:10px;font-size:12px}
.feature .tag b{display:block;font:700 16px var(--fang)}
.shelf{padding:8px 48px 56px}
.shelf-head{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:24px}
.shelf-head h2{font:700 28px var(--fang);margin:0;letter-spacing:.1em}
.tabs{display:flex;gap:6px}
.tab{height:34px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:transparent;color:#cdbba8;font:13px var(--sans);cursor:pointer}
.tab:hover{color:var(--leaf);border-color:var(--muted)}
.tab[aria-pressed="true"]{background:var(--leaf);color:var(--ink);border-color:var(--leaf)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.item{background:var(--clay);color:var(--ink);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:transform .2s}
.item:hover{transform:translateY(-4px)}
.pic{height:180px;display:grid;place-items:center;position:relative;background:var(--clay-2)}
.pic svg{width:120px;height:140px}
.fav{position:absolute;right:12px;top:12px;width:34px;height:34px;border-radius:50%;border:0;background:#ffffffcc;cursor:pointer;display:grid;place-items:center;color:var(--muted);font-size:16px}
.fav[aria-pressed="true"]{color:#b8432f}
.badge{position:absolute;left:12px;top:12px;font-size:11px;padding:2px 8px;border-radius:999px;background:var(--jade);color:#fff}
.badge.low{background:#b8432f}
.body{padding:14px 16px 16px;display:flex;flex-direction:column;flex:1}
.body h3{margin:0;font:700 18px/1.3 var(--fang)}
.body .origin{font-size:12px;color:var(--muted);margin:2px 0 10px}
.notes{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.notes span{font-size:11px;padding:1px 8px;border-radius:999px;border:1px solid #cbb8a2;color:#6d5848}
.buy{margin-top:auto;display:flex;align-items:center;justify-content:space-between}
.price{font:700 20px var(--sans)}
.price small{font-size:12px;font-weight:400;color:var(--muted);margin-left:4px}
.add{height:34px;padding:0 14px;border-radius:999px;border:0;background:var(--ink);color:var(--leaf);font:600 13px var(--sans);cursor:pointer;transition:background .15s}
.add:hover{background:#4a372b}
.add.done{background:var(--jade)}
.toast{position:fixed;right:24px;bottom:24px;background:var(--leaf);color:var(--ink);padding:12px 16px;border-radius:12px;box-shadow:0 12px 30px #0008;font-size:13px;transform:translateY(20px);opacity:0;transition:all .25s;display:flex;gap:14px;align-items:center}
.toast.show{transform:none;opacity:1}
.toast b{font-family:var(--fang);font-size:15px}
.foot{padding:28px 48px;border-top:1px solid var(--line);display:flex;justify-content:space-between;color:var(--muted);font-size:12px}
@media (max-width:1100px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.hero h1{font-size:48px}}
@media (max-width:860px){.top{grid-template-columns:1fr auto;padding:16px 24px}.top nav{display:none}.brand{text-align:left}.hero{grid-template-columns:1fr;padding:32px 24px}.feature{height:240px}.shelf{padding:8px 24px 40px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.shelf-head{flex-direction:column;align-items:flex-start;gap:12px}.tabs{flex-wrap:wrap}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <nav><a href="#tea">茶叶</a><a href="#ware">茶器</a><a href="#gift">礼盒</a><a href="#story">茶山手记</a></nav>
  <div class="brand">山间茶事<small>武夷 · 凤凰 · 福鼎</small></div>
  <div class="tools"><button type="button" id="favBtn">♡ 收藏 <span class="n" id="favN">0</span></button><button type="button" id="cartBtn">茶篮 <span class="n" id="cartN">0</span></button></div>
</header>
<section class="hero">
  <div>
    <span class="eyebrow">秋茶上新 · 十月</span>
    <h1>一片岩茶，<br>三分火功。</h1>
    <p>今年的武夷肉桂在 10 月初完成第三道焙火，桂皮香里透出一点焦糖甜。茶农陈师傅说，这是近五年最稳的一季。</p>
    <div class="cta"><button class="btn pri" type="button" data-jump="乌龙">看秋季岩茶</button><button class="btn sec" type="button" data-jump="茶器">挑一只盖碗</button></div>
  </div>
  <div class="feature">
    <svg viewBox="0 0 260 260" aria-hidden="true"><ellipse cx="130" cy="210" rx="90" ry="14" fill="#1f1510"/><path d="M60 120h140c0 50-30 88-70 88s-70-38-70-88z" fill="#efe6da"/><path d="M60 120h140" stroke="#c99a4f" stroke-width="3"/><ellipse cx="130" cy="120" rx="70" ry="12" fill="#8a5a2b"/><path d="M110 70c-6-14 10-20 4-36M136 78c-6-16 12-22 4-40M160 70c-6-12 8-18 4-30" stroke="#efe6da" stroke-width="2.5" fill="none" stroke-linecap="round" opacity=".55"/><path d="M84 150c14 10 30 14 46 14" stroke="#e3d5c3" stroke-width="2" fill="none"/></svg>
    <div class="tag"><b>武夷肉桂 · 2026 秋</b>传统炭焙 · 50g ¥168</div>
  </div>
</section>
<section class="shelf" id="tea">
  <div class="shelf-head"><h2>茶架</h2><div class="tabs" role="group" aria-label="分类"></div></div>
  <div class="grid" id="grid"></div>
</section>
<footer class="foot"><span>山间茶事 · 产地直采，每周二、五发货</span><span>满 ¥299 包邮 · 未拆封 7 天可退</span></footer>
<div class="toast" id="toast" role="status"><span id="tt"></span><button class="add" type="button" id="goCart">去结算</button></div>
<script>
const cats=['全部','乌龙','红茶','白茶','绿茶','茶器'];
const tin=(c1,c2,label)=>'<svg viewBox="0 0 120 140"><ellipse cx="60" cy="130" rx="42" ry="6" fill="#00000018"/><rect x="22" y="30" width="76" height="98" rx="8" fill="'+c1+'"/><rect x="18" y="20" width="84" height="18" rx="6" fill="'+c2+'"/><rect x="34" y="58" width="52" height="44" rx="4" fill="#f6f0e6"/><text x="60" y="86" font-size="16" text-anchor="middle" font-family="STFangsong,FangSong,serif" fill="#2b1d16">'+label+'</text></svg>';
const cup=(c)=>'<svg viewBox="0 0 120 140"><ellipse cx="60" cy="122" rx="40" ry="6" fill="#00000018"/><path d="M24 60h72c0 34-16 56-36 56S24 94 24 60z" fill="'+c+'"/><ellipse cx="60" cy="60" rx="36" ry="7" fill="#f6f0e6"/><path d="M30 48c10-10 50-10 60 0" stroke="'+c+'" stroke-width="6" fill="none" stroke-linecap="round"/><circle cx="60" cy="40" r="5" fill="'+c+'"/></svg>';
const goods=[
 ['武夷肉桂','乌龙','福建 · 武夷山 · 正岩','168','50g',['桂皮香','焦糖','中火'],tin('#5a3d2c','#c99a4f','肉桂'),'新'],
 ['凤凰单丛 · 鸭屎香','乌龙','广东 · 潮州 · 乌岽山','128','50g',['银花香','回甘'],tin('#7c9a7e','#3a281e','单丛'),''],
 ['正山小种','红茶','福建 · 桐木关','98','100g',['松烟','桂圆'],tin('#8a3b2a','#2b1d16','小种'),''],
 ['金骏眉','红茶','福建 · 桐木关','268','50g',['蜜香','薯香'],tin('#b8732f','#2b1d16','金骏眉'),'仅剩 6'],
 ['白毫银针 · 2023','白茶','福建 · 福鼎','218','100g',['毫香','清甜'],tin('#d9cbb4','#7c9a7e','银针'),''],
 ['老白茶饼 · 寿眉','白茶','福建 · 福鼎 · 2018','188','300g',['枣香','药香'],tin('#a68b6a','#3a281e','寿眉'),''],
 ['明前龙井','绿茶','浙江 · 杭州 · 梅家坞','238','50g',['豆香','鲜爽'],tin('#9ab38a','#2b1d16','龙井'),'新'],
 ['柴烧盖碗','茶器','景德镇 · 手作 · 120ml','186','1 只',['柴烧','落灰釉'],cup('#8a6a52'),''],
 ['青瓷公道杯','茶器','龙泉 · 梅子青 · 200ml','142','1 只',['开片'],cup('#7c9a7e'),'']
];
let cat='全部',cart=0,favs=new Set();
const tabs=document.querySelector('.tabs');
tabs.innerHTML=cats.map(c=>'<button class="tab" type="button" aria-pressed="'+(c===cat)+'">'+c+'</button>').join('');
tabs.querySelectorAll('.tab').forEach(t=>t.onclick=()=>setCat(t.textContent));
function setCat(c){cat=c;tabs.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-pressed',t.textContent===c));render()}
function render(){
  document.getElementById('grid').innerHTML=goods.map((g,i)=>[g,i]).filter(([g])=>cat==='全部'||g[1]===cat).map(([g,i])=>
    '<article class="item"><div class="pic">'+g[6]+(g[7]?'<span class="badge'+(g[7].startsWith('仅')?' low':'')+'">'+g[7]+'</span>':'')+'<button class="fav" type="button" data-i="'+i+'" aria-pressed="'+favs.has(i)+'" aria-label="收藏 '+g[0]+'">'+(favs.has(i)?'♥':'♡')+'</button></div>'+
    '<div class="body"><h3>'+g[0]+'</h3><div class="origin">'+g[2]+'</div><div class="notes">'+g[5].map(n=>'<span>'+n+'</span>').join('')+'</div><div class="buy"><span class="price">¥'+g[3]+'<small>/ '+g[4]+'</small></span><button class="add" type="button" data-i="'+i+'">加入茶篮</button></div></div></article>').join('');
  document.querySelectorAll('.fav').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;favs.has(i)?favs.delete(i):favs.add(i);bump('favN',favs.size);render()});
  document.querySelectorAll('.item .add').forEach(b=>b.onclick=()=>{cart++;bump('cartN',cart);b.classList.add('done');b.textContent='已加入 ✓';setTimeout(()=>{b.classList.remove('done');b.textContent='加入茶篮'},1400);toast(goods[+b.dataset.i])});
}
function bump(id,v){const e=document.getElementById(id);e.textContent=v;e.classList.add('bump');setTimeout(()=>e.classList.remove('bump'),200)}
function toast(g){document.getElementById('tt').innerHTML='已放进茶篮：<b>'+g[0]+'</b> · 共 '+cart+' 件';const t=document.getElementById('toast');t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),3000)}
document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{setCat(b.dataset.jump);document.getElementById('tea').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'})});
document.getElementById('goCart').onclick=e=>{e.target.textContent='正在前往…'};
render();
</script>
</body>
</html>
