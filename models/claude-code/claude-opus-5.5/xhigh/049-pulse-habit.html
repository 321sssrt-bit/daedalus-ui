<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>步履 · 今天</title>
<style>
:root{
  --room:#ececea;--bg:#f6f6f4;--card:#ffffff;--ink:#14151a;--muted:#73757e;--faint:#b8bac1;--line:#e9e9e6;
  --g1:#ff5f6d;--g2:#ffc371;--plum:#5b4bdb;--plum-soft:#ecebfd;--mint:#2bb673;--bad:#e5383b;--bad-bg:#fdecec;
  --num:"Avenir Next","SF Pro Display","Helvetica Neue","PingFang SC",sans-serif;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:linear-gradient(160deg,#f2f2ef,var(--room));display:grid;place-items:center;font:15px/1.5 var(--sans);color:var(--ink)}
[hidden]{display:none!important}
button,input,select{font-family:inherit}
.phone{width:390px;height:min(844px,calc(100vh - 32px));border-radius:54px;border:11px solid var(--ink);background:var(--bg);position:relative;overflow:hidden;box-shadow:0 30px 70px #14151a33}
.notch{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:118px;height:32px;border-radius:20px;background:var(--ink);z-index:30}
.sb{position:absolute;top:16px;left:30px;right:26px;display:flex;justify-content:space-between;font:600 15px var(--num);z-index:25}
.sb span:last-child{font-size:12px;letter-spacing:2px}
.scroll{position:absolute;inset:0 0 86px;overflow-y:auto;padding:56px 18px 20px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.hd{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:14px}
.hd small{display:block;color:var(--muted);font-size:13px}
.hd h1{margin:0;font:800 30px/1.1 var(--sans)}
.streak{display:flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:6px 12px;font:700 13px var(--num);box-shadow:0 2px 8px #14151a0d}
.streak i{font-style:normal}
.goal{background:var(--card);border-radius:30px;padding:18px;display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center;box-shadow:0 2px 12px #14151a0a;margin-bottom:12px}
.ring{position:relative;width:150px;height:150px}
.ring svg{width:150px;height:150px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-linecap:round}
.ring .track{stroke:#f1f0ee;stroke-width:16}
.ring .bar{stroke:url(#grad);stroke-width:16;transition:stroke-dashoffset .9s cubic-bezier(.3,.7,.2,1)}
.ring .inner .track{stroke-width:10}
.ring .inner .bar{stroke:var(--plum);stroke-width:10}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .c b{display:block;font:800 32px/1 var(--num)}
.ring .c small{font-size:11px;color:var(--muted)}
.stat{display:grid;gap:10px}
.stat div{display:flex;align-items:center;gap:10px}
.stat i{width:10px;height:10px;border-radius:50%;flex:none}
.stat b{font:800 19px var(--num)}
.stat small{display:block;color:var(--muted);font-size:12px}
.stat .done{font:700 12px var(--sans);color:var(--mint)}
.trend{background:var(--card);border-radius:26px;padding:16px;box-shadow:0 2px 12px #14151a0a;margin-bottom:12px}
.trend h2{margin:0 0 2px;font:700 15px var(--sans);display:flex;justify-content:space-between}
.trend h2 span{font:600 12px var(--num);color:var(--muted)}
.trend p{margin:0 0 10px;font-size:12px;color:var(--muted)}
.trend p b{color:var(--mint)}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:120px;position:relative}
.bars .goalline{position:absolute;left:0;right:0;border-top:1.5px dashed var(--g1);opacity:.85;z-index:1;pointer-events:none}
.bars .goalline span{position:absolute;right:0;top:-16px;font:600 10px var(--num);color:var(--g1)}
.col{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.col i{width:100%;max-width:26px;border-radius:9px;background:#e7e5f8;transition:height .9s cubic-bezier(.3,.7,.2,1),background .3s}
.col.hit i{background:linear-gradient(180deg,var(--g1),var(--g2))}
.col.today i{outline:2px solid var(--ink);outline-offset:2px}
.col small{font:600 11px var(--num);color:var(--muted)}
.col.today small{color:var(--ink)}
.logs{background:var(--card);border-radius:26px;padding:8px 16px;box-shadow:0 2px 12px #14151a0a}
.logs h2{margin:8px 0 4px;font:700 15px var(--sans)}
.lg{display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.lg:last-child{border-bottom:0}
.lg i{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-style:normal;font-size:17px;background:var(--plum-soft)}
.lg small{display:block;color:var(--muted);font-size:12px}
.lg b{font:700 15px var(--num)}
.lg.new{animation:hl 1.4s ease-out}
.add{position:absolute;left:18px;right:18px;bottom:98px;height:56px;border:0;border-radius:20px;background:var(--ink);color:#fff;font:800 17px var(--sans);cursor:pointer;z-index:6;box-shadow:0 12px 26px #14151a40;display:flex;align-items:center;justify-content:center;gap:8px}
.add i{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--g1),var(--g2));display:grid;place-items:center;font-style:normal}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:86px;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:10px 8px 24px;z-index:5}
.tabbar button{border:0;background:none;color:var(--faint);font:11px var(--sans);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.tabbar button svg{width:24px;height:24px}
.tabbar button[aria-current="page"]{color:var(--ink);font-weight:700}
.scrim{position:absolute;inset:0;background:#14151a66;z-index:20;animation:fade .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow-y:auto;background:var(--card);border-radius:30px 30px 0 0;padding:12px 18px 26px;z-index:21;animation:up .28s cubic-bezier(.2,.8,.2,1);scrollbar-width:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet h3{margin:0 0 12px;font:800 19px var(--sans);display:flex;justify-content:space-between;align-items:center}
.sheet h3 button{border:0;background:var(--bg);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:14px;color:var(--muted)}
.types{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:12px}
.ty{border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:8px 0;display:flex;flex-direction:column;align-items:center;gap:2px;font:12px var(--sans);cursor:pointer;color:var(--ink)}
.ty i{font-style:normal;font-size:20px}
.ty[aria-pressed="true"]{border-color:var(--ink);background:var(--bg);font-weight:700}
.fld{margin-bottom:12px}
.fld label{display:flex;justify-content:space-between;font:600 13px var(--sans);margin-bottom:6px}
.fld label span{font:400 12px var(--sans);color:var(--muted)}
.inp{display:flex;align-items:center;height:50px;border-radius:16px;background:var(--bg);border:2px solid transparent;padding:0 14px;transition:border-color .15s}
.inp:focus-within{border-color:var(--plum);background:#fff}
.inp input{flex:1;min-width:0;border:0;background:none;font:700 20px var(--num);color:var(--ink);outline:none}
.inp em{font-style:normal;color:var(--muted);font-size:13px}
.fld.bad .inp{border-color:var(--bad);background:var(--bad-bg)}
.fld .msg{display:none;font-size:12px;color:var(--bad);margin-top:5px}
.fld.bad .msg{display:block}
.feel{display:flex;gap:6px}
.feel button{flex:1;height:40px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-size:18px;cursor:pointer}
.feel button[aria-pressed="true"]{border-color:var(--ink);background:var(--bg)}
.errbox{display:grid;grid-template-columns:28px 1fr;gap:10px;background:var(--bad-bg);border:1.5px solid var(--bad);border-radius:16px;padding:10px 12px;margin-bottom:12px;font-size:13px;animation:shake .35s}
.errbox i{width:28px;height:28px;border-radius:50%;background:var(--bad);color:#fff;display:grid;place-items:center;font-style:normal;font-weight:800}
.errbox b{display:block;color:var(--bad)}
.save{width:100%;height:54px;border:0;border-radius:18px;background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;font:800 17px var(--sans);cursor:pointer;margin-top:4px;box-shadow:0 10px 22px #ff5f6d40}
.save:active{transform:translateY(1px)}
.preview{font-size:12px;color:var(--muted);text-align:center;margin-top:8px}
.preview b{color:var(--ink)}
.toast{position:absolute;left:16px;right:16px;top:58px;z-index:40;background:var(--ink);color:#fff;border-radius:18px;padding:12px 14px;font-size:13px;display:flex;align-items:center;gap:10px;animation:drop .3s cubic-bezier(.2,.8,.2,1)}
.toast i{width:24px;height:24px;border-radius:50%;background:var(--mint);display:grid;place-items:center;font-style:normal;flex:none}
.add:focus-visible,.tabbar button:focus-visible,.ty:focus-visible,.feel button:focus-visible,.save:focus-visible,.sheet h3 button:focus-visible,.streak:focus-visible{outline:3px solid var(--plum);outline-offset:2px}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}}
@keyframes drop{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes hl{0%{background:#fff3e6}100%{background:transparent}}
@media (max-width:500px){body{display:block;background:var(--bg)}.phone{width:100%;height:100vh;height:100dvh;border:0;border-radius:0;box-shadow:none}.notch{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="phone">
  <div class="notch" aria-hidden="true"></div>
  <div class="sb" aria-hidden="true"><span>9:41</span><span>▂▄▆ ▮▮▮</span></div>
  <main class="scroll" id="home" aria-live="polite"></main>
  <button class="add" type="button" id="addBtn"><i>＋</i>记录一次活动</button>
  <nav class="tabbar" aria-label="底部导航"><button type="button" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/></svg>今天</button><button type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V11M10 19V5M16 19v-8M22 19H2"/></svg>趋势</button><button type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.5 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/></svg>挑战</button><button type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>我的</button></nav>
  <div id="layer"></div>
</div>
<script>
const GOAL=45,KCAL_GOAL=500;
const TYPES=[['run','🏃','跑步',9.8],['ride','🚴','骑行',6.5],['swim','🏊','游泳',8.2],['yoga','🧘','瑜伽',3.2],['walk','🚶','步行',4.1]];
const LIMIT={min:[1,300],km:[0,100],hr:[40,220]};
const S={week:[52,38,61,24,47,58,30],logs:[{ty:'walk',min:30,km:2.4,hr:96,t:'07:40',feel:'🙂'}],sheet:false,form:{ty:'run',min:'',km:'',hr:'',feel:'🙂'},err:null,toast:'',newIdx:-1};
const DAYS=['五','六','日','一','二','三','今天'];
const $=s=>document.getElementById(s);
function today(){return S.week[6]}
function kcal(){return S.logs.reduce((a,l)=>a+Math.round(l.min*TYPES.find(t=>t[0]===l.ty)[3]*(l.hr>140?1.15:1)),0)}
function streak(){let n=0;for(let i=6;i>=0;i--){if(S.week[i]>=GOAL)n++;else if(i<6)break}return n}
function home(){
  const m=today(),k=kcal(),C1=2*Math.PI*62,C2=2*Math.PI*46,p1=Math.min(1,m/GOAL),p2=Math.min(1,k/KCAL_GOAL);
  const avg=Math.round(S.week.reduce((a,b)=>a+b,0)/7),hit=S.week.filter(v=>v>=GOAL).length,max=Math.max(GOAL*1.6,...S.week);
  return '<div class="hd"><div><small>10 月 24 日 · 周六</small><h1>今天</h1></div><span class="streak"><i>🔥</i>连续达标 '+streak()+' 天</span></div>'+
  '<section class="goal" aria-label="今日目标"><div class="ring"><svg viewBox="0 0 150 150" aria-hidden="true"><defs><linearGradient id="grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff5f6d"/><stop offset="1" stop-color="#ffc371"/></linearGradient></defs><circle class="track" cx="75" cy="75" r="62"/><circle class="bar" id="r1" cx="75" cy="75" r="62" stroke-dasharray="'+C1.toFixed(1)+'" stroke-dashoffset="'+(C1*(1-p1)).toFixed(1)+'"/><g class="inner"><circle class="track" cx="75" cy="75" r="46"/><circle class="bar" id="r2" cx="75" cy="75" r="46" stroke-dasharray="'+C2.toFixed(1)+'" stroke-dashoffset="'+(C2*(1-p2)).toFixed(1)+'"/></g></svg><div class="c"><span><b id="mNum">'+m+'</b><small>/ '+GOAL+' 分钟</small></span></div></div>'+
  '<div class="stat"><div><i style="background:linear-gradient(135deg,#ff5f6d,#ffc371)"></i><span><b>'+Math.round(p1*100)+'%</b><small>活动时长目标</small></span></div><div><i style="background:#5b4bdb"></i><span><b>'+k+'</b><small>千卡 / 目标 '+KCAL_GOAL+'</small></span></div>'+(m>=GOAL?'<span class="done">✓ 今日目标已完成</span>':'<span style="font-size:12px;color:#73757e">还差 <b style="color:#14151a">'+(GOAL-m)+'</b> 分钟达标</span>')+'</div></section>'+
  '<section class="trend" aria-label="近 7 天趋势"><h2>近 7 天活动 <span>日均 '+avg+' 分钟</span></h2><p>本周 <b>'+hit+' 天</b>达到 45 分钟目标'+(avg>=GOAL?' · 比上周多 12%':'')+'</p><div class="bars"><span class="goalline" style="bottom:calc('+(GOAL/max*100)+'% * .84 + 18px)"><span>目标 45</span></span>'+
  S.week.map((v,i)=>'<div class="col'+(v>=GOAL?' hit':'')+(i===6?' today':'')+'"><i style="height:'+Math.max(4,v/max*84)+'%"></i><small>'+DAYS[i]+'</small></div>').join('')+'</div></section>'+
  '<section class="logs"><h2>今日记录</h2>'+S.logs.map((l,i)=>{const ty=TYPES.find(t=>t[0]===l.ty);return '<div class="lg'+(i===S.newIdx?' new':'')+'"><i>'+ty[1]+'</i><span>'+ty[2]+' '+l.feel+'<small>'+l.t+(l.km?' · '+l.km+' 公里':'')+(l.hr?' · 平均心率 '+l.hr:'')+'</small></span><b>'+l.min+' 分钟</b></div>'}).join('')+'</section><div style="height:70px"></div>'+
  (S.toast?'<div class="toast" role="status"><i>✓</i>'+S.toast+'</div>':'');
}
function sheet(){const f=S.form,e=S.err||{};
  return '<div class="scrim" id="scrim"></div><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="shT"><div class="grab"></div><h3><span id="shT">记录一次活动</span><button type="button" id="close" aria-label="关闭">✕</button></h3>'+
  (S.err?'<div class="errbox" role="alert"><i>!</i><span><b>有 '+Object.keys(e).length+' 项数据超出合理范围，未保存</b>今日进度保持 '+today()+' 分钟不变，请修正标红的字段。</span></div>':'')+
  '<div class="types" role="group" aria-label="活动类型">'+TYPES.map(t=>'<button class="ty" type="button" data-ty="'+t[0]+'" aria-pressed="'+(f.ty===t[0])+'"><i>'+t[1]+'</i>'+t[2]+'</button>').join('')+'</div>'+
  fld('min','时长','合理范围 1–300 分钟','分钟',f.min,e.min,'例如 40')+fld('km','距离（选填）','合理范围 0–100 公里','公里',f.km,e.km,'例如 6.2')+fld('hr','平均心率（选填）','合理范围 40–220 次/分','次/分',f.hr,e.hr,'例如 138')+
  '<div class="fld"><label>感受</label><div class="feel" role="group" aria-label="运动感受">'+['😮‍💨','🙂','😄','💪'].map(x=>'<button type="button" data-feel="'+x+'" aria-pressed="'+(f.feel===x)+'">'+x+'</button>').join('')+'</div></div>'+
  '<button class="save" type="button" id="save">保存记录</button><div class="preview" id="pv">'+pv()+'</div></section>'}
function fld(k,lab,hint,unit,val,err,ph){return '<div class="fld'+(err?' bad':'')+'" data-fld="'+k+'"><label for="f_'+k+'">'+lab+'<span>'+hint+'</span></label><div class="inp"><input id="f_'+k+'" inputmode="decimal" value="'+val+'" placeholder="'+ph+'" aria-invalid="'+!!err+'"><em>'+unit+'</em></div><div class="msg">'+(err||'')+'</div></div>'}
function pv(){const n=+S.form.min;if(!n||n<LIMIT.min[0]||n>LIMIT.min[1])return '保存后今日进度将更新';return '保存后今日活动 <b>'+today()+' → '+(today()+n)+'</b> 分钟'+(today()<GOAL&&today()+n>=GOAL?' · 将完成今日目标 🎉':'')}
function render(){$('home').innerHTML=home();$('layer').innerHTML=S.sheet?sheet():'';bind()}
function validate(){const f=S.form,e={};const num=v=>v===''?null:+v;
  const m=num(f.min);if(m===null||isNaN(m))e.min='请填写时长';else if(m<1||m>300)e.min='时长 '+f.min+' 分钟超出范围，请填写 1–300 之间的数';
  const km=num(f.km);if(km!==null&&(isNaN(km)||km<0||km>100))e.km='距离 '+f.km+' 公里不合理，请填写 0–100';
  if(km!==null&&!e.km&&!e.min&&f.ty==='run'&&km/(m/60)>25)e.km='配速超过 25 公里/小时，请检查距离或时长';
  const hr=num(f.hr);if(hr!==null&&(isNaN(hr)||hr<40||hr>220))e.hr='心率 '+f.hr+' 不在 40–220 次/分范围内';
  return Object.keys(e).length?e:null}
function bind(){
  const sc=$('scrim');if(sc)sc.onclick=close;const cl=$('close');if(cl)cl.onclick=close;
  document.querySelectorAll('[data-ty]').forEach(b=>b.onclick=()=>{S.form.ty=b.dataset.ty;document.querySelectorAll('[data-ty]').forEach(x=>x.setAttribute('aria-pressed',x===b))});
  document.querySelectorAll('[data-feel]').forEach(b=>b.onclick=()=>{S.form.feel=b.dataset.feel;document.querySelectorAll('[data-feel]').forEach(x=>x.setAttribute('aria-pressed',x===b))});
  ['min','km','hr'].forEach(k=>{const i=$('f_'+k);if(!i)return;i.oninput=()=>{S.form[k]=i.value.trim();const f=i.closest('.fld');if(f.classList.contains('bad')){f.classList.remove('bad');i.setAttribute('aria-invalid','false')}$('pv').innerHTML=pv()}});
  const sv=$('save');if(sv)sv.onclick=()=>{const e=validate();if(e){S.err=e;render();const first=document.querySelector('.fld.bad input');first&&first.focus();return}
    const f=S.form,n=+f.min;S.logs.push({ty:f.ty,min:n,km:f.km?+f.km:0,hr:f.hr?+f.hr:0,t:'10:'+String(10+S.logs.length*7).padStart(2,'0'),feel:f.feel});S.newIdx=S.logs.length-1;
    const before=S.week[6];S.week[6]+=n;S.sheet=false;S.err=null;S.form={ty:'run',min:'',km:'',hr:'',feel:'🙂'};
    S.toast='已记录 '+TYPES.find(t=>t[0]===f.ty)[2]+' '+n+' 分钟 · 今日 '+before+' → '+S.week[6]+' 分钟';
    renderRings(before);
    clearTimeout(S.th);S.th=setTimeout(()=>{S.toast='';const t=document.querySelector('.toast');t&&t.remove()},3000)};
}
function renderRings(before){
  /* 先画旧进度再过渡到新进度，让圆环与柱子有可见的重算动画 */
  const C1=2*Math.PI*62;
  render();const r=$('r1');if(!r)return;const target=r.getAttribute('stroke-dashoffset');r.setAttribute('stroke-dashoffset',(C1*(1-Math.min(1,before/GOAL))).toFixed(1));
  const b=document.querySelector('.col.today i'),h=b.style.height,max=Math.max(GOAL*1.6,...S.week);b.style.height=Math.max(4,before/max*84)+'%';
  requestAnimationFrame(()=>requestAnimationFrame(()=>{r.setAttribute('stroke-dashoffset',target);b.style.height=h}));
}
function open(){S.sheet=true;S.err=null;S.toast='';render();const i=$('f_min');i&&i.focus()}
function close(){S.sheet=false;S.err=null;render()}
$('addBtn').onclick=open;
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.sheet)close()});

render();
