<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>旧时光 · 正在修复</title>
<style>
:root{
  --room:#b9d6e4;--sky:#eaf6fa;--sea:#bfe0ee;--deep:#5d9fc2;--navy:#0d2b45;--muted:#4f6b80;--white:#ffffff;--foam:#f7fcfe;--sun:#ffcf87;--ok:#2b9c7a;
  --serif:"Songti SC","STSong","Georgia",serif;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --num:"Avenir Next","Helvetica Neue",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:linear-gradient(180deg,#d7eaf2,var(--room));display:grid;place-items:center;font:15px/1.55 var(--sans);color:var(--navy)}
.phone{width:390px;height:min(844px,calc(100vh - 32px));border-radius:52px;border:11px solid var(--navy);background:linear-gradient(180deg,var(--sky) 0%,var(--sea) 60%,var(--deep) 100%);position:relative;overflow:hidden;box-shadow:0 30px 70px #0d2b4540}
.notch{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:118px;height:32px;border-radius:20px;background:var(--navy);z-index:20}
.sb{position:absolute;top:16px;left:30px;right:26px;display:flex;justify-content:space-between;font:600 15px var(--num);z-index:3}
.sb span:last-child{font-size:12px;letter-spacing:2px}
.screen{position:absolute;inset:0;padding:56px 24px 22px;display:flex;flex-direction:column;z-index:2;overflow-y:auto;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.screen>*{flex-shrink:0}
.top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
.top button{border:0;background:#ffffff99;border-radius:999px;padding:6px 12px;font:13px var(--sans);color:var(--navy);cursor:pointer}
.photo{position:relative;width:188px;height:188px;margin:14px auto 12px;flex:none;border-radius:50%;padding:10px;background:conic-gradient(var(--navy) var(--pct,0%),#ffffff80 var(--pct,0%));transition:--pct .6s}
.photo .in{width:100%;height:100%;border-radius:50%;overflow:hidden;position:relative;background:#c9c2b4;animation:breathe 4s ease-in-out infinite}
.photo svg{width:100%;height:100%;display:block}
.photo .old{filter:grayscale(1) contrast(.8) sepia(.35) blur(.6px);transition:clip-path .8s ease}
.photo .newer{position:absolute;inset:0}
.photo .newer svg{transition:clip-path .8s ease}
.photo .pctlabel{position:absolute;right:-4px;bottom:10px;z-index:2;background:var(--navy);color:var(--white);font:700 13px var(--num);padding:4px 10px;border-radius:999px}
h1{margin:0;text-align:center;font:700 20px/1.3 var(--serif)}
.cur{text-align:center;margin:4px 0 2px;font-size:14px;color:var(--muted)}
.cur b{color:var(--navy)}
.eta{text-align:center;font:600 13px var(--num);color:var(--navy);margin:0 0 12px}
.steps{list-style:none;margin:0;padding:12px 14px;background:#ffffffb3;border-radius:20px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.steps li{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:center;padding:5px 0;font-size:14px;color:var(--muted)}
.steps li i{width:22px;height:22px;border-radius:50%;border:2px solid #9cc3d6;display:grid;place-items:center;font:700 11px var(--num);font-style:normal;color:transparent}
.steps li.done{color:var(--navy)}
.steps li.done i{background:var(--ok);border-color:var(--ok);color:var(--white)}
.steps li.now{color:var(--navy);font-weight:600}
.steps li.now i{border-color:var(--navy);position:relative}
.steps li.now i::after{content:'';position:absolute;inset:3px;border-radius:50%;background:var(--navy);animation:pulse 1.2s ease-in-out infinite}
.steps li small{font:12px var(--num);color:var(--muted);font-weight:400}
.acts{margin-top:auto;padding-top:12px;display:grid;gap:4px}
.bg{height:54px;border:0;border-radius:18px;background:var(--navy);color:var(--white);font:700 16px var(--sans);cursor:pointer}
.bg:active{transform:scale(.98)}
.cancel{height:44px;border:0;background:none;color:var(--navy);font:600 14px var(--sans);text-decoration:underline;text-underline-offset:4px;cursor:pointer}
.top button:focus-visible,.bg:focus-visible,.cancel:focus-visible,.sheet button:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.waves{position:absolute;left:0;right:0;bottom:0;height:180px;z-index:1;pointer-events:none}
.waves svg{position:absolute;bottom:0;width:200%;height:100%}
.w1{animation:drift 9s linear infinite}
.w2{animation:drift 14s linear infinite reverse;opacity:.6}
.scrim{position:absolute;inset:0;background:#0d2b4566;opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:12px;right:12px;bottom:12px;background:var(--white);border-radius:26px;padding:20px;transform:translateY(120%);transition:transform .28s cubic-bezier(.2,.8,.2,1);z-index:11}
.sheet.on{transform:none}
.sheet h3{margin:0 0 6px;font:700 18px var(--serif)}
.sheet p{margin:0 0 16px;color:var(--muted);font-size:14px}
.sheet .btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet button{height:48px;border-radius:14px;font:700 15px var(--sans);cursor:pointer}
.sheet .keep{border:0;background:var(--navy);color:var(--white)}
.sheet .stop{border:1.5px solid #e2b4a8;background:none;color:#b5503b}
.toast{position:absolute;left:24px;right:24px;top:60px;background:var(--navy);color:var(--white);border-radius:16px;padding:12px 14px;font-size:13px;z-index:12;transform:translateY(-140%);transition:transform .3s}
.toast.on{transform:none}
.done{display:none}
.done.on{display:block}
@property --pct{syntax:'<percentage>';inherits:false;initial-value:0%}
@keyframes breathe{50%{transform:scale(1.025)}}
@keyframes pulse{50%{transform:scale(.55);opacity:.5}}
@keyframes drift{to{transform:translateX(-50%)}}
@media (max-width:500px){body{display:block}.phone{width:100%;height:100vh;height:100dvh;border:0;border-radius:0}.notch{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="phone">
  <div class="notch" aria-hidden="true"></div>
  <div class="sb" aria-hidden="true"><span>9:41</span><span>▂▄▆ ▮▮▮</span></div>
  <div class="waves" aria-hidden="true">
    <svg class="w2" viewBox="0 0 800 180" preserveAspectRatio="none"><path d="M0 90 Q100 60 200 90 T400 90 T600 90 T800 90 V180 H0Z" fill="#ffffff55"/></svg>
    <svg class="w1" viewBox="0 0 800 180" preserveAspectRatio="none"><path d="M0 120 Q100 95 200 120 T400 120 T600 120 T800 120 V180 H0Z" fill="#ffffff80"/></svg>
  </div>
  <main class="screen" aria-live="polite">
    <div class="top"><span>订单 RP-1023-0386 · 1 张</span><button type="button" id="bgTop">收起</button></div>
    <div class="photo" id="ring" aria-label="修复进度">
      <div class="in">
        <svg class="old" viewBox="0 0 210 210" aria-hidden="true"><rect width="210" height="210" fill="#d8cdb8"/><rect x="0" y="140" width="210" height="70" fill="#a89c84"/><circle cx="80" cy="96" r="22" fill="#6d6250"/><path d="M50 170c4-34 18-50 30-50s26 16 30 50z" fill="#5d5242"/><circle cx="140" cy="100" r="18" fill="#7a6e5b"/><path d="M116 170c3-28 14-42 24-42s21 14 24 42z" fill="#6b604e"/><path d="M20 30l40 60M150 20l30 50M30 180l170-20" stroke="#ffffff88" stroke-width="2"/></svg>
        <div class="newer"><svg id="newer" viewBox="0 0 210 210" aria-hidden="true" style="clip-path:inset(0 100% 0 0)"><rect width="210" height="210" fill="#bfe0ee"/><rect x="0" y="140" width="210" height="70" fill="#8fbf7a"/><circle cx="80" cy="96" r="22" fill="#f1c7a3"/><path d="M50 170c4-34 18-50 30-50s26 16 30 50z" fill="#c8553d"/><circle cx="140" cy="100" r="18" fill="#efc09a"/><path d="M116 170c3-28 14-42 24-42s21 14 24 42z" fill="#2f5b8a"/><circle cx="80" cy="84" r="16" fill="#3a2a22" opacity=".85"/><circle cx="140" cy="90" r="13" fill="#2a2420" opacity=".85"/><circle cx="182" cy="34" r="14" fill="#ffcf87"/></svg></div>
      </div>
      <span class="pctlabel" id="pct">0%</span>
    </div>
    <h1 id="title">正在修复「外公外婆·1978」</h1>
    <p class="cur">当前步骤：<b id="curStep">去除划痕与折痕</b></p>
    <p class="eta" id="eta">预计还需 约 2 分 40 秒</p>
    <ol class="steps" id="steps"></ol>
    <div class="acts">
      <button class="bg" type="button" id="bg">放到后台，修好了通知我</button>
      <button class="cancel" type="button" id="cancel">取消修复</button>
    </div>
  </main>
  <div class="toast" id="toast" role="status"></div>
  <div class="scrim" id="scrim"></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sT"><h3 id="sT">要取消这次修复吗？</h3><p>已完成的去划痕结果不会保存，次数会退回你的账户（剩余 4 次）。</p><div class="btns"><button class="keep" type="button" id="keep">继续修复</button><button class="stop" type="button" id="stop">确认取消</button></div></section>
</div>
<script>
const steps=[['上传原图','12.4 MB · 扫描件'],['去除划痕与折痕','约 50 秒'],['人脸细节重建','约 40 秒'],['智能上色','约 60 秒'],['放大到 4K','约 30 秒']];
const total=180;let t=10,timer=null,state='run';
const $=s=>document.getElementById(s);
function stepAt(s){return s<12?0:s<62?1:s<102?2:s<162?3:4}
function render(){
  const p=Math.min(100,Math.round(t/total*100)),k=stepAt(t),left=Math.max(0,total-t);
  $('ring').style.setProperty('--pct',p+'%');$('pct').textContent=p+'%';
  $('newer').style.clipPath='inset(0 '+(100-Math.max(0,(t-60)/(total-60)*100))+'% 0 0)';
  $('steps').innerHTML=steps.map((s,i)=>'<li class="'+(i<k||p===100?'done':i===k?'now':'')+'"><i>'+(i<k||p===100?'✓':'')+'</i><span>'+s[0]+'</span><small>'+(i<k||p===100?'完成':i===k?'进行中':s[1])+'</small></li>').join('');
  if(p===100){finish();return}
  $('curStep').textContent=steps[k][0]+'（'+(k+1)+'/5）';
  $('eta').textContent='预计还需 约 '+(left>=60?Math.floor(left/60)+' 分 ':'')+(left%60)+' 秒';
}
function run(){clearInterval(timer);timer=setInterval(()=>{if(state!=='run')return;t+=3;render()},600)}
function finish(){clearInterval(timer);state='done';$('title').textContent='修好了！「外公外婆·1978」';$('curStep').textContent='全部 5 步已完成';$('eta').textContent='用时 3 分 02 秒 · 已保存到「修复相册」';
  $('bg').textContent='查看修复结果';$('cancel').textContent='再修一张';$('newer').style.clipPath='inset(0 0 0 0)';toast('照片修复完成，点击查看')}
function toast(m){$('toast').textContent=m;$('toast').classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>$('toast').classList.remove('on'),2600)}
function toBg(){if(state==='done'){$('bg').textContent='正在打开…';return}toast('已放到后台继续修复，完成后会推送通知');$('bg').textContent='已放到后台 · 可随时回来查看'}
$('bg').onclick=toBg;$('bgTop').onclick=toBg;
$('cancel').onclick=()=>{if(state==='done'){t=10;state='run';$('title').textContent='正在修复「外公外婆·1978」';$('bg').textContent='放到后台，修好了通知我';$('cancel').textContent='取消修复';render();run();return}
  state='paused';$('sheet').classList.add('on');$('scrim').classList.add('on');$('keep').focus()};
function closeSheet(){$('sheet').classList.remove('on');$('scrim').classList.remove('on')}
$('keep').onclick=()=>{closeSheet();state='run'};$('scrim').onclick=$('keep').onclick;
$('stop').onclick=()=>{closeSheet();state='cancelled';clearInterval(timer);$('title').textContent='已取消修复';$('curStep').textContent='次数已退回 · 剩余 4 次';$('eta').textContent='原图仍保留在「待修复」中';$('bg').textContent='重新开始修复';$('cancel').textContent='';
  $('bg').onclick=()=>{t=10;state='run';$('title').textContent='正在修复「外公外婆·1978」';$('bg').textContent='放到后台，修好了通知我';$('bg').onclick=toBg;$('cancel').textContent='取消修复';render();run()}};
render();run();
</script>
</body>
</html>
