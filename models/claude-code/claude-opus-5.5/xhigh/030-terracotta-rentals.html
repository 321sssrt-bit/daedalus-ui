<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>栖岸租房 · 找房</title>
<style>
:root{
  --sand:#f5efe6;--card:#fffdf9;--ink:#2e2a24;--muted:#7d7366;--line:#e6dccd;--terra:#c8553d;--terra-dk:#a4412c;--olive:#3d4a2f;--olive-2:#6b7a4f;--sky:#9cc5d4;--sun:#f2c879;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Avenir Next",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--sand);color:var(--ink);font:14px/1.55 var(--sans)}
.top{display:flex;align-items:center;gap:20px;padding:14px 32px;background:var(--card);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;font:800 19px var(--sans);color:var(--olive)}
.logo i{width:30px;height:30px;border-radius:50% 50% 6px 6px;background:var(--terra);position:relative}
.logo i::after{content:'';position:absolute;left:10px;bottom:0;width:10px;height:12px;border-radius:5px 5px 0 0;background:var(--card)}
.city{height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--sand);font:600 13px var(--sans);color:var(--ink)}
.q{flex:1;max-width:520px;height:40px;border-radius:999px;border:1.5px solid var(--line);background:var(--sand);padding:0 18px;font:14px var(--sans);outline:none;color:var(--ink)}
.q:focus{border-color:var(--terra);background:#fff}
.top .r{margin-left:auto;font-size:13px;color:var(--muted)}
.wrap{display:grid;grid-template-columns:300px minmax(0,1fr);gap:24px;padding:22px 32px 48px;max-width:1360px;margin:0 auto}
.filters{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 18px 8px;position:sticky;top:16px;align-self:start}
.fh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.fh h2{margin:0;font:700 16px var(--sans)}
.clear{border:0;background:none;color:var(--terra);font:600 13px var(--sans);cursor:pointer;padding:4px 0}
.clear:disabled{color:#cbbfae;cursor:default}
.grp{padding:14px 0;border-bottom:1px dashed var(--line)}
.grp:last-child{border-bottom:0}
.grp h3{margin:0 0 10px;font:600 13px var(--sans);display:flex;justify-content:space-between}
.grp h3 span{font-weight:400;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--sand);font:13px var(--sans);color:var(--ink);cursor:pointer}
.chip:hover{border-color:var(--terra)}
.chip[aria-pressed="true"]{background:var(--terra);border-color:var(--terra);color:#fff}
.range{position:relative;height:28px}
.range input{position:absolute;inset:0;width:100%;appearance:none;-webkit-appearance:none;background:none;pointer-events:none;margin:0}
.range input::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid var(--terra);cursor:pointer;margin-top:-8px}
.range input::-moz-range-thumb{pointer-events:auto;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--terra);cursor:pointer}
.range input::-webkit-slider-runnable-track{height:4px;background:transparent}
.range .track{position:absolute;left:0;right:0;top:12px;height:4px;border-radius:2px;background:var(--line)}
.range .fill{position:absolute;top:12px;height:4px;border-radius:2px;background:var(--terra)}
.tg{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:13px}
.sw{width:42px;height:24px;border-radius:12px;border:0;background:#d9cdbb;position:relative;cursor:pointer;transition:background .2s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s}
.sw[aria-checked="true"]{background:var(--olive-2)}
.sw[aria-checked="true"]::after{transform:translateX(18px)}
.chip:focus-visible,.sw:focus-visible,.clear:focus-visible,.res:focus-visible,.fav:focus-visible,select:focus-visible,.range input:focus-visible{outline:2px solid var(--olive);outline-offset:2px}
.head{display:flex;align-items:center;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.count{font:800 26px var(--sans)}
.count b{color:var(--terra)}
.count small{font:14px var(--sans);color:var(--muted);margin-left:6px}
.active{display:flex;gap:6px;flex-wrap:wrap}
.active button{border:0;background:var(--olive);color:#fff;border-radius:999px;padding:4px 10px;font:12px var(--sans);cursor:pointer}
.active button:hover{background:var(--terra)}
.head select{margin-left:auto;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);padding:0 10px;font:13px var(--sans);color:var(--ink)}
.list{display:grid;gap:14px}
.res{display:grid;grid-template-columns:240px minmax(0,1fr) 170px;gap:20px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;transition:box-shadow .2s,transform .2s;cursor:pointer}
.res:hover{box-shadow:0 10px 24px #7d736626;transform:translateY(-2px)}
.pic{height:150px;border-radius:12px;overflow:hidden;position:relative}
.pic svg{width:100%;height:100%;display:block}
.pic .badge{position:absolute;left:10px;top:10px;background:#fffdf9e6;color:var(--olive);font:600 11px var(--sans);padding:3px 8px;border-radius:999px}
.info h3{margin:2px 0 6px;font:700 17px/1.35 var(--sans)}
.info .meta{color:var(--muted);font-size:13px;margin-bottom:10px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tags span{font-size:12px;padding:2px 9px;border-radius:6px;background:#f0e8db;color:#6b5d4b}
.tags span.g{background:#e6ecdc;color:var(--olive)}
.price{text-align:right;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end}
.price b{font:800 26px var(--sans);color:var(--terra)}
.price b small{font-size:13px;font-weight:400;color:var(--muted)}
.price .pay{font-size:12px;color:var(--muted)}
.fav{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--sand);cursor:pointer;color:var(--terra);font-size:16px}
.fav[aria-pressed="true"]{background:var(--terra);color:#fff;border-color:var(--terra)}
.empty{background:var(--card);border:1.5px dashed var(--line);border-radius:18px;padding:48px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;font:700 18px var(--sans);color:var(--ink);margin-bottom:6px}
.empty button{margin-top:14px;height:40px;padding:0 20px;border-radius:999px;border:0;background:var(--terra);color:#fff;font:600 14px var(--sans);cursor:pointer}
@media (max-width:1100px){.res{grid-template-columns:200px 1fr}.price{grid-column:1/-1;flex-direction:row;align-items:center}}
@media (max-width:820px){.wrap{grid-template-columns:1fr;padding:16px}.filters{position:static}.top{flex-wrap:wrap;padding:12px 16px}.top .r{display:none}.q{max-width:none;order:3;flex-basis:100%}.res{grid-template-columns:1fr}.pic{height:180px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top"><div class="logo"><i></i>栖岸租房</div><select class="city" aria-label="城市"><option>厦门</option><option>泉州</option><option>福州</option></select><input class="q" id="q" placeholder="搜小区、地铁站或商圈，例如「中山路」" aria-label="搜索"><span class="r">个人房东直租 · 0 中介费</span></header>
<main class="wrap">
  <aside class="filters" aria-label="筛选条件">
    <div class="fh"><h2>筛选</h2><button class="clear" type="button" id="clear">清除全部</button></div>
    <div class="grp"><h3>区域 <span>可多选</span></h3><div class="chips" data-f="area"></div></div>
    <div class="grp"><h3>月租金 <span id="rv"></span></h3><div class="range"><span class="track"></span><span class="fill" id="fill"></span><input type="range" id="min" min="1000" max="10000" step="500" value="1000" aria-label="最低租金"><input type="range" id="max" min="1000" max="10000" step="500" value="10000" aria-label="最高租金"></div></div>
    <div class="grp"><h3>户型</h3><div class="chips" data-f="room"></div></div>
    <div class="grp"><h3>朝向</h3><div class="chips" data-f="face"></div></div>
    <div class="grp"><div class="tg"><span>步行 10 分钟内有地铁</span><button class="sw" type="button" role="switch" aria-checked="false" data-t="metro" aria-label="近地铁"></button></div><div class="tg"><span>可养宠物</span><button class="sw" type="button" role="switch" aria-checked="false" data-t="pet" aria-label="可养宠物"></button></div><div class="tg"><span>可月付</span><button class="sw" type="button" role="switch" aria-checked="false" data-t="month" aria-label="可月付"></button></div></div>
  </aside>
  <section aria-live="polite">
    <div class="head"><span class="count" id="count"></span><div class="active" id="active"></div>
      <select id="sort" aria-label="排序"><option value="new">最新发布</option><option value="low">租金从低到高</option><option value="high">租金从高到低</option><option value="big">面积从大到小</option></select></div>
    <div class="list" id="list"></div>
  </section>
</main>
<script>
const opts={area:['思明','湖里','集美','海沧'],room:['一室','两室','三室+'],face:['朝南','南北通透','朝东','朝西']};
const sel={area:new Set(),room:new Set(),face:new Set()},tog={metro:false,pet:false,month:false};
let min=1000,max=10000,q='';
const pal=[['#9cc5d4','#f2c879','#c8553d'],['#e8d5b9','#6b7a4f','#c8553d'],['#f2c879','#9cc5d4','#3d4a2f'],['#d9cdbb','#c8553d','#9cc5d4']];
const room=(i)=>{const p=pal[i%4];return '<svg viewBox="0 0 240 150" preserveAspectRatio="xMidYMid slice"><rect width="240" height="150" fill="'+p[0]+'"/><rect x="0" y="104" width="240" height="46" fill="#e6dccd"/><rect x="'+(30+i*7%40)+'" y="26" width="64" height="62" rx="32" fill="#fffdf9"/><path d="M'+(62+i*7%40)+' 26v62M'+(30+i*7%40)+' 57h64" stroke="'+p[0]+'" stroke-width="3"/><rect x="128" y="72" width="86" height="34" rx="10" fill="'+p[2]+'"/><rect x="134" y="62" width="74" height="16" rx="8" fill="'+p[1]+'"/><circle cx="210" cy="38" r="10" fill="'+p[1]+'"/><path d="M20 104c4-24 16-24 20 0" fill="#6b7a4f"/></svg>'};
const homes=[
 {t:'中山路 · 骑楼改造一室 带小露台',a:'思明',r:'一室',f:'朝南',s:38,p:3200,metro:1,pet:1,month:1,d:'今天',fl:'4/5 层',tags:['近地铁','可养宠物','可月付'],sub:'镇海路站 · 步行 6 分钟'},
 {t:'软件园二期 · 精装两室 采光好',a:'思明',r:'两室',f:'南北通透',s:72,p:5600,metro:1,pet:0,month:0,d:'昨天',fl:'12/26 层',tags:['近地铁','电梯','拎包入住'],sub:'观日路站 · 步行 9 分钟'},
 {t:'五缘湾 · 海景三室 主卧带阳台',a:'湖里',r:'三室+',f:'朝南',s:118,p:9800,metro:0,pet:1,month:0,d:'2 天前',fl:'21/32 层',tags:['海景','可养宠物','车位可租'],sub:'五缘湾 · 公交 3 站'},
 {t:'湖里万达旁 · 一室一厅 安静小区',a:'湖里',r:'一室',f:'朝东',s:45,p:2600,metro:1,pet:0,month:1,d:'3 天前',fl:'6/18 层',tags:['近地铁','可月付'],sub:'湖里公园站 · 步行 8 分钟'},
 {t:'集美学村 · 两室 近嘉庚公园',a:'集美',r:'两室',f:'南北通透',s:68,p:3400,metro:1,pet:1,month:0,d:'4 天前',fl:'3/7 层',tags:['近地铁','可养宠物','近学校'],sub:'集美学村站 · 步行 5 分钟'},
 {t:'海沧湾公园 · 三室 适合家庭',a:'海沧',r:'三室+',f:'朝南',s:96,p:4800,metro:0,pet:1,month:0,d:'5 天前',fl:'9/24 层',tags:['可养宠物','近公园'],sub:'海沧湾 · 步行 4 分钟到海边'},
 {t:'曾厝垵 · 文艺一室 民宿改长租',a:'思明',r:'一室',f:'朝西',s:30,p:2400,metro:0,pet:0,month:1,d:'1 周前',fl:'2/4 层',tags:['可月付','近海'],sub:'环岛路 · 步行 3 分钟'}
];
const favs=new Set();
function chips(){document.querySelectorAll('[data-f]').forEach(el=>{const f=el.dataset.f;el.innerHTML=opts[f].map(o=>'<button class="chip" type="button" aria-pressed="'+sel[f].has(o)+'">'+o+'</button>').join('');
  el.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{sel[f].has(b.textContent)?sel[f].delete(b.textContent):sel[f].add(b.textContent);render()})})}
function match(h){return(!sel.area.size||sel.area.has(h.a))&&(!sel.room.size||sel.room.has(h.r))&&(!sel.face.size||sel.face.has(h.f))&&h.p>=min&&h.p<=max&&(!tog.metro||h.metro)&&(!tog.pet||h.pet)&&(!tog.month||h.month)&&(!q||(h.t+h.sub+h.a).includes(q))}
function render(){
  chips();
  const fill=document.getElementById('fill');fill.style.left=((min-1000)/9000*100)+'%';fill.style.right=(100-(max-1000)/9000*100)+'%';
  document.getElementById('rv').textContent='¥'+min.toLocaleString()+' – ¥'+max.toLocaleString()+(max===10000?'+':'');
  let v=homes.map((h,i)=>[h,i]).filter(([h])=>match(h));
  const s=document.getElementById('sort').value;
  if(s==='low')v.sort((a,b)=>a[0].p-b[0].p);if(s==='high')v.sort((a,b)=>b[0].p-a[0].p);if(s==='big')v.sort((a,b)=>b[0].s-a[0].s);
  document.getElementById('count').innerHTML='<b>'+v.length+'</b> 套房源<small>共 '+homes.length+' 套在租</small>';
  const act=[...sel.area,...sel.room,...sel.face].map(x=>['x',x]).concat(min>1000||max<10000?[['price','¥'+min+'–'+max]]:[]).concat(Object.keys(tog).filter(k=>tog[k]).map(k=>['t',{metro:'近地铁',pet:'可养宠物',month:'可月付'}[k],k]));
  document.getElementById('active').innerHTML=act.map((a,i)=>'<button type="button" data-a="'+i+'">'+a[1]+' ✕</button>').join('');
  document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const a=act[+b.dataset.a];if(a[0]==='x')Object.values(sel).forEach(s=>s.delete(a[1]));if(a[0]==='price'){min=1000;max=10000;document.getElementById('min').value=min;document.getElementById('max').value=max}if(a[0]==='t'){tog[a[2]]=false;document.querySelector('[data-t="'+a[2]+'"]').setAttribute('aria-checked','false')}render()});
  document.getElementById('clear').disabled=!act.length&&!q;
  document.getElementById('list').innerHTML=v.length?v.map(([h,i])=>'<article class="res" tabindex="0"><div class="pic">'+room(i)+'<span class="badge">'+h.d+'发布</span></div><div class="info"><h3>'+h.t+'</h3><div class="meta">'+h.a+' · '+h.r+' · '+h.s+'㎡ · '+h.f+' · '+h.fl+'<br>'+h.sub+'</div><div class="tags">'+h.tags.map((t,k)=>'<span class="'+(k===0?'g':'')+'">'+t+'</span>').join('')+'</div></div><div class="price"><button class="fav" type="button" data-i="'+i+'" aria-pressed="'+favs.has(i)+'" aria-label="收藏">'+(favs.has(i)?'♥':'♡')+'</button><div><b>¥'+h.p.toLocaleString()+'<small> /月</small></b><div class="pay">'+(h.month?'押一付一':'押一付三')+' · 约 ¥'+Math.round(h.p/h.s)+'/㎡</div></div></div></article>').join(''):
    '<div class="empty"><b>没有完全符合的房子</b>试试放宽租金上限，或去掉一两个条件。<br><button type="button" id="reset">清除全部条件</button></div>';
  document.querySelectorAll('.fav').forEach(b=>b.onclick=e=>{e.stopPropagation();const i=+b.dataset.i;favs.has(i)?favs.delete(i):favs.add(i);render()});
  const r=document.getElementById('reset');if(r)r.onclick=clearAll;
}
function clearAll(){Object.values(sel).forEach(s=>s.clear());Object.keys(tog).forEach(k=>tog[k]=false);document.querySelectorAll('.sw').forEach(s=>s.setAttribute('aria-checked','false'));min=1000;max=10000;document.getElementById('min').value=min;document.getElementById('max').value=max;q='';document.getElementById('q').value='';render()}
document.getElementById('clear').onclick=clearAll;
document.getElementById('min').oninput=e=>{min=Math.min(+e.target.value,max-500);e.target.value=min;render()};
document.getElementById('max').oninput=e=>{max=Math.max(+e.target.value,min+500);e.target.value=max;render()};
document.querySelectorAll('.sw').forEach(s=>s.onclick=()=>{const k=s.dataset.t;tog[k]=!tog[k];s.setAttribute('aria-checked',tog[k]);render()});
document.getElementById('sort').onchange=render;
document.getElementById('q').oninput=e=>{q=e.target.value.trim();render()};
render();
</script>
</body>
</html>
