<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>铜钱巷 · 转账</title>
<style>
:root{
  --bg:#0f2b26; --panel:#16382f; --panel-line:#235046; --text:#eef5f0;
  --muted:#8fae9f; --gold:#e3b45a; --gold-deep:#c79a3e; --bad:#ff7d6e; --ok:#63d394;
  --sans:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:#081815;font:14px/1.6 var(--sans);display:grid;place-items:center;min-height:100vh;padding:20px 10px}
.phone{width:390px;max-width:100%;height:844px;border:10px solid #040d0b;border-radius:44px;overflow:hidden;box-shadow:0 30px 80px #00000088;background:var(--bg);position:relative}
.scr{height:100%;display:flex;flex-direction:column;padding:56px 20px 24px;color:var(--text)}
.view{display:none;flex-direction:column;flex:1;min-height:0}
.view.show{display:flex}
h1{font-size:19px;margin:0 0 4px}
.sub{color:var(--muted);font-size:12px;margin:0 0 14px}
.fund{background:var(--panel);border:1px solid var(--panel-line);border-radius:14px;padding:13px 15px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.fund.on{border-color:var(--gold)}
.fund b{font-size:14px}
.fund span{display:block;font-size:11px;color:var(--muted)}
.fund .amt{font:700 15px var(--mono);color:var(--gold)}
.fund .pick{font-size:11px;color:var(--gold);border:1px solid #e3b45a55;border-radius:999px;padding:2px 10px;display:none}
.fund.on .pick{display:inline-block}
.people{display:grid;gap:9px;overflow-y:auto;flex:1}
.people::-webkit-scrollbar{width:0}
.who{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--panel-line);border-radius:13px;padding:11px 13px;cursor:pointer}
.who:hover{border-color:#3a6b5e}
.who.on{border-color:var(--gold);background:#1c4237}
.ava{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:15px;color:#10281f;font-weight:700}
.who b{font-size:14px;display:block}
.who span{font-size:11px;color:var(--muted)}
.big{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center}
.sym{color:var(--gold);font-size:16px}
.amt-in{background:transparent;border:0;border-bottom:2px solid var(--panel-line);color:var(--text);font:700 44px var(--mono);width:240px;text-align:center;padding:6px 0}
.amt-in:focus{outline:none;border-color:var(--gold)}
.amt-note{font-size:12px;color:var(--muted);margin-top:12px}
.err{font-size:13px;color:var(--bad);min-height:20px;margin-top:12px;text-align:center}
.quick{display:flex;gap:8px;margin-top:14px}
.quick button{border:1px solid var(--panel-line);background:transparent;color:var(--muted);border-radius:999px;padding:6px 14px;font:12px var(--sans);cursor:pointer}
.quick button:hover{color:var(--gold);border-color:#e3b45a55}
.cfm{background:var(--panel);border:1px solid var(--panel-line);border-radius:14px;padding:16px;margin-bottom:14px}
.cfm .r{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px solid #1d463b}
.cfm .r:last-child{border-bottom:0}
.cfm .r span{color:var(--muted)}
.cfm .r b{font-size:13px}
.bigamt{text-align:center;margin:18px 0 6px}
.bigamt b{font:700 40px var(--mono);color:var(--gold)}
.next{height:48px;border:0;border-radius:12px;background:var(--gold);color:#241a05;font:700 15px var(--sans);cursor:pointer;transition:background .15s}
.next:hover{background:var(--gold-deep)}
.next:focus-visible{outline:3px solid #e3b45a44;outline-offset:2px}
.ghost{height:44px;border:1px solid var(--panel-line);background:transparent;color:var(--muted);border-radius:12px;font:600 14px var(--sans);cursor:pointer;margin-top:9px}
.ghost:hover{color:var(--text);border-color:#3a6b5e}
.fixbtn{height:44px;border:1px solid var(--bad);background:transparent;color:var(--bad);border-radius:12px;font:600 13px var(--sans);cursor:pointer;margin-top:9px}
.fixbtn:hover{background:var(--bad);color:#2b0f0b}
.okmark{width:72px;height:72px;border-radius:50%;background:var(--ok);color:#06281a;display:grid;place-items:center;font-size:32px;margin:0 auto 14px}
.rcpt{background:var(--panel);border:1px solid var(--panel-line);border-radius:14px;padding:14px 16px;margin-top:14px}
.rcpt .r{display:flex;justify-content:space-between;font-size:12px;padding:5px 0;color:var(--muted)}
.rcpt .r b{color:var(--text);font:600 12px var(--mono)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="phone">
  <div class="scr">
    <section class="view show" id="v-payee">
      <h1>转账</h1>
      <p class="sub">第一步 · 选择收款人和出资账户</p>
      <div id="fundBox"></div>
      <div class="people" id="peopleBox"></div>
      <button class="next" id="toAmt" type="button" style="margin-top:12px">下一步 · 输入金额</button>
    </section>
    <section class="view" id="v-amount">
      <h1>转给 <span id="payeeName"></span></h1>
      <p class="sub" id="fundHint"></p>
      <div class="big">
        <span class="sym">¥</span>
        <input class="amt-in" id="amtIn" inputmode="decimal" value="0" aria-label="转账金额">
        <div class="quick">
          <button type="button" data-q="50">50</button>
          <button type="button" data-q="200">200</button>
          <button type="button" data-q="1500">1500</button>
          <button type="button" data-q="max">全部</button>
        </div>
        <p class="amt-note" id="amtNote"></p>
        <p class="err" id="amtErr" role="alert"></p>
      </div>
      <button class="next" id="toCfm" type="button">下一步 · 核对</button>
      <button class="ghost" id="back1" type="button">重选收款人</button>
    </section>
    <section class="view" id="v-confirm">
      <h1>确认转账</h1>
      <p class="sub">请核对以下信息，确认后即刻到账</p>
      <div class="bigamt"><b id="cfmAmt"></b></div>
      <div class="cfm">
        <div class="r"><span>收款人</span><b id="cfmWho"></b></div>
        <div class="r"><span>出资账户</span><b id="cfmFund"></b></div>
        <div class="r"><span>手续费</span><b>¥ 0.00</b></div>
        <div class="r"><span>到账时间</span><b>实时</b></div>
      </div>
      <p class="err" id="cfmErr" role="alert"></p>
      <button class="next" id="doPay" type="button">确认支付</button>
      <button class="fixbtn" id="fixLower" type="button" style="display:none">把金额降到可用余额内</button>
      <button class="fixbtn" id="fixSwitch" type="button" style="display:none">改用零钱账户支付</button>
      <button class="ghost" id="back2" type="button">返回修改金额</button>
    </section>
    <section class="view" id="v-done">
      <div class="big" style="justify-content:flex-start;padding-top:30px">
        <div class="okmark">✓</div>
        <h1 style="text-align:center">转账成功</h1>
        <p class="sub" style="text-align:center" id="doneLine"></p>
        <div class="rcpt" id="rcpt"></div>
      </div>
      <button class="next" id="again" type="button" style="margin-top:auto">再转一笔</button>
    </section>
  </div>
</div>
<script>
(function(){
  "use strict";
  var FUNDS=[
    {key:"wallet",name:"零钱账户",sub:"日常收支",bal:320.50},
    {key:"card",name:"储蓄卡 6021",sub:"招商银行",bal:8326.45}
  ];
  var PEOPLE=[
    {name:"沈一帆",tag:"上次转账 08-12",c:"#e3b45a"},
    {name:"何苗",tag:"同事 · 质量组",c:"#7fc9a5"},
    {name:"苏杭",tag:"设计师 · 常联系",c:"#c9a1e0"}
  ];
  var fundIdx=0,payeeIdx=-1,amount=0;
  var views=["v-payee","v-amount","v-confirm","v-done"];
  function go(id){views.forEach(function(v){document.getElementById(v).classList.toggle("show",v===id)})}
  function fmt(n){return n.toFixed(2)}
  function renderFunds(){
    var box=document.getElementById("fundBox");
    box.innerHTML="";
    FUNDS.forEach(function(f,i){
      var d=document.createElement("div");
      d.className="fund"+(i===fundIdx?" on":"");
      d.innerHTML='<div><b>'+f.name+'</b><span>'+f.sub+' · 可用 ¥ '+fmt(f.bal)+'</span></div><span style="text-align:right"><span class="amt"></span><span class="pick">使用中</span></span>';
      d.querySelector(".amt").textContent="¥ "+fmt(f.bal);
      d.addEventListener("click",function(){fundIdx=i;renderFunds()});
      box.appendChild(d);
    });
  }
  function renderPeople(){
    var box=document.getElementById("peopleBox");
    box.innerHTML="";
    PEOPLE.forEach(function(p,i){
      var d=document.createElement("div");
      d.className="who"+(i===payeeIdx?" on":"");
      d.innerHTML='<span class="ava" style="background:'+p.c+'">'+p.name.charAt(0)+'</span><div><b>'+p.name+'</b><span>'+p.tag+'</span></div>';
      d.addEventListener("click",function(){payeeIdx=i;renderPeople()});
      box.appendChild(d);
    });
  }
  document.getElementById("toAmt").addEventListener("click",function(){
    if(payeeIdx<0){alert("请先选择一位收款人");return}
    document.getElementById("payeeName").textContent=PEOPLE[payeeIdx].name;
    var f=FUNDS[fundIdx];
    document.getElementById("fundHint").textContent="第二步 · 从 "+f.name+"（可用 ¥ "+fmt(f.bal)+"）支出";
    document.getElementById("amtNote").textContent="可用余额 ¥ "+fmt(f.bal);
    document.getElementById("amtErr").textContent="";
    go("v-amount");
  });
  document.getElementById("amtIn").addEventListener("input",function(ev){
    ev.target.value=ev.target.value.replace(/[^\d.]/g,"");
  });
  document.querySelector(".quick").addEventListener("click",function(ev){
    var b=ev.target.closest("button");
    if(!b)return;
    var f=FUNDS[fundIdx];
    var q=b.getAttribute("data-q");
    document.getElementById("amtIn").value=q==="max"?String(f.bal):q;
  });
  document.getElementById("toCfm").addEventListener("click",function(){
    var v=parseFloat(document.getElementById("amtIn").value);
    var err=document.getElementById("amtErr");
    if(!v||v<=0){err.textContent="请输入大于 0 的金额。";return}
    amount=v;
    err.textContent="";
    var f=FUNDS[fundIdx];
    document.getElementById("cfmAmt").textContent="¥ "+fmt(amount);
    document.getElementById("cfmWho").textContent=PEOPLE[payeeIdx].name;
    document.getElementById("cfmFund").textContent=f.name+" · 可用 ¥ "+fmt(f.bal);
    document.getElementById("cfmErr").textContent="";
    document.getElementById("fixLower").style.display="none";
    document.getElementById("fixSwitch").style.display="none";
    go("v-confirm");
  });
  document.getElementById("doPay").addEventListener("click",function(){
    var f=FUNDS[fundIdx];
    var err=document.getElementById("cfmErr");
    if(amount>f.bal){
      err.textContent="余额不足："+f.name+" 可用 ¥ "+fmt(f.bal)+"，本次需要 ¥ "+fmt(amount)+"。转账已被阻止。";
      document.getElementById("fixLower").style.display="block";
      var other=FUNDS.filter(function(x,i){return i!==fundIdx&&x.bal>=amount})[0];
      document.getElementById("fixSwitch").style.display=other?"block":"none";
      return;
    }
    f.bal-=amount;
    var no="TR-"+String(Math.floor(Math.random()*9000)+1000);
    document.getElementById("doneLine").textContent="已向 "+PEOPLE[payeeIdx].name+" 转出 ¥ "+fmt(amount);
    var rc=document.getElementById("rcpt");
    rc.innerHTML='<div class="r"><span>转账单号</span><b>'+no+'</b></div><div class="r"><span>付款账户</span><b>'+f.name+'</b></div><div class="r"><span>剩余可用</span><b>¥ '+fmt(f.bal)+'</b></div><div class="r"><span>状态</span><b style="color:#63d394">已到账</b></div>';
    go("v-done");
  });
  document.getElementById("fixLower").addEventListener("click",function(){
    amount=FUNDS[fundIdx].bal;
    document.getElementById("amtIn").value=String(amount);
    document.getElementById("cfmAmt").textContent="¥ "+fmt(amount);
    document.getElementById("cfmErr").textContent="";
    document.getElementById("fixLower").style.display="none";
    document.getElementById("fixSwitch").style.display="none";
  });
  document.getElementById("fixSwitch").addEventListener("click",function(){
    fundIdx=FUNDS.findIndex(function(x){return x.bal>=amount&&FUNDS.indexOf(x)!==fundIdx});
    var f=FUNDS[fundIdx];
    document.getElementById("cfmFund").textContent=f.name+" · 可用 ¥ "+fmt(f.bal);
    document.getElementById("cfmErr").textContent="";
    document.getElementById("fixLower").style.display="none";
    document.getElementById("fixSwitch").style.display="none";
    renderFunds();
  });
  document.getElementById("back1").addEventListener("click",function(){go("v-payee")});
  document.getElementById("back2").addEventListener("click",function(){go("v-amount")});
  document.getElementById("again").addEventListener("click",function(){payeeIdx=-1;renderPeople();renderFunds();go("v-payee")});
  renderFunds();
  renderPeople();
})();
</script>
</body>
</html>
