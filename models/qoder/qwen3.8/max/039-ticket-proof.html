<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>山行报名 · 成功回执</title>
<style>
:root{
  --bg:#edf2ec; --paper:#fffdf6; --ink:#22302a; --muted:#7f8d84;
  --line:#e0e6dd; --pine:#20664a; --pine-deep:#174f39; --stamp:#c0392b;
  --sans:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:#1d2b24;font:14px/1.65 var(--sans);display:grid;place-items:center;min-height:100vh;padding:20px 10px}
.phone{width:390px;max-width:100%;height:844px;border:10px solid #101812;border-radius:44px;overflow:hidden;box-shadow:0 30px 80px #00000088;background:var(--bg);position:relative}
.scr{height:100%;display:flex;flex-direction:column;padding:58px 20px 28px;overflow-y:auto}
.scr::-webkit-scrollbar{width:0}
.ok-badge{width:66px;height:66px;border-radius:50%;background:var(--pine);display:grid;place-items:center;margin:0 auto 14px;color:#fff;font-size:30px}
h1{text-align:center;font-size:22px;margin:0 0 4px;color:var(--ink)}
.sub{text-align:center;color:var(--muted);font-size:13px;margin:0 0 20px}
.ticket{background:var(--paper);border-radius:16px;box-shadow:0 12px 30px #22302a14;position:relative}
.t-head{padding:18px 20px 14px;display:flex;justify-content:space-between;align-items:center}
.t-head b{font-size:15px;color:var(--ink)}
.stamp{border:2px solid var(--stamp);color:var(--stamp);border-radius:8px;padding:3px 10px;font-size:12px;font-weight:700;transform:rotate(-6deg)}
.perf{border-top:2px dashed var(--line);margin:0 14px;position:relative}
.perf:before,.perf:after{content:"";position:absolute;top:-9px;width:18px;height:18px;border-radius:50%;background:var(--bg)}
.perf:before{left:-23px}
.perf:after{right:-23px}
.t-main{padding:16px 20px}
.code{font:700 26px var(--mono);color:var(--pine);letter-spacing:.06em}
.code-note{font-size:12px;color:var(--muted);margin-top:2px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.kv div{background:#f4f7f2;border-radius:10px;padding:10px 12px}
.kv span{display:block;font-size:11px;color:var(--muted)}
.kv b{font-size:14px;color:var(--ink)}
.detail{display:none;padding:0 20px 16px}
.detail.show{display:block}
.detail .row{display:flex;justify-content:space-between;font-size:13px;padding:7px 0;border-bottom:1px solid #eef1ea}
.detail .row:last-child{border-bottom:0}
.detail .row span{color:var(--muted)}
.expand{width:100%;border:0;background:none;color:var(--pine);font:600 13px var(--sans);padding:10px;cursor:pointer;border-top:1px solid #eef1ea}
.expand:hover{background:#f4f7f2}
.expand:focus-visible{outline:2px solid var(--pine);outline-offset:-2px}
.done{margin-top:18px;height:48px;border:0;border-radius:11px;background:var(--pine);color:#fff;font:700 15px var(--sans);cursor:pointer;transition:background .15s}
.done:hover{background:var(--pine-deep)}
.done:focus-visible{outline:3px solid #20664a44;outline-offset:2px}
.final{display:none;text-align:center;color:var(--pine);font-size:13px;margin-top:12px}
.final.show{display:block}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="phone">
  <div class="scr">
    <div class="ok-badge" aria-hidden="true">✓</div>
    <h1>报名成功</h1>
    <p class="sub">名额已为你锁定，出发前 24 小时可无损取消</p>
    <section class="ticket">
      <div class="t-head"><b>午山环线 · 秋季首登</b><span class="stamp">已确认</span></div>
      <div class="perf" aria-hidden="true"></div>
      <div class="t-main">
        <div class="code">SX-0815-2027</div>
        <div class="code-note">集合时请出示此回执编号</div>
        <div class="kv">
          <div><span>集合时间</span><b>8 月 24 日 07:30</b></div>
          <div><span>集合地点</span><b>午山北门驿站</b></div>
          <div><span>席位</span><b>B 组 · 第 6 位</b></div>
          <div><span>缴费</span><b>¥ 68 · 已支付</b></div>
        </div>
      </div>
      <div class="detail" id="detail">
        <div class="row"><span>路线</span><b>午山环线 14.2km · 爬升 620m</b></div>
        <div class="row"><span>领队</span><b>老柏 · 持证高山领队</b></div>
        <div class="row"><span>保险</span><b>户外意外险已生效</b></div>
        <div class="row"><span>装备提醒</span><b>登山杖、1.5L 饮水、雨衣</b></div>
        <div class="row"><span>紧急联系</span><b>400-663-0727</b></div>
      </div>
      <button class="expand" id="expandBtn" type="button">展开行程细节 ▾</button>
    </section>
    <button class="done" id="doneBtn" type="button">完 成</button>
    <p class="final" id="final" role="status">回执已存入「我的行程」，8 月 22 日会推送行前提醒。</p>
  </div>
</div>
<script>
(function(){
  "use strict";
  var detail=document.getElementById("detail");
  var expand=document.getElementById("expandBtn");
  var done=document.getElementById("doneBtn");
  var final=document.getElementById("final");
  expand.addEventListener("click",function(){
    var open=detail.classList.toggle("show");
    expand.textContent=open?"收起行程细节 ▴":"展开行程细节 ▾";
  });
  done.addEventListener("click",function(){
    done.textContent="已收入我的行程";
    done.disabled=true;
    done.style.background="#174f39";
    final.classList.add("show");
  });
})();
</script>
</body>
</html>
