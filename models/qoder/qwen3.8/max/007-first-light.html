<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>破晓清单 · 欢迎</title>
<style>
:root{
  --dawn:#fff3e4; --dawn2:#ffe2c8; --sun:#f59e42; --sun-deep:#d97a1e;
  --plum:#4a2c3a; --muted:#8f6a5f; --card:#fffaf2; --line:#f0dcc4;
  --sans:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font:15px/1.7 var(--sans);color:var(--plum);background:linear-gradient(175deg,var(--dawn) 0%,var(--dawn2) 58%,#ffd9b0 100%);display:flex;flex-direction:column}
.bar{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 40px}
.bar b{font-size:17px;letter-spacing:.05em}
.bar .who{font-size:13px;color:var(--muted)}
.hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px 24px 60px}
.rise{width:110px;height:110px;margin-bottom:26px}
h1{font-size:40px;line-height:1.3;margin:0 0 14px;font-weight:800}
.hero .sub{max-width:460px;color:var(--muted);margin:0 0 34px;font-size:16px}
.actions{display:flex;gap:14px;align-items:center}
.start{border:0;background:var(--sun);color:#40240a;height:52px;padding:0 34px;border-radius:999px;font:700 16px var(--sans);cursor:pointer;box-shadow:0 12px 26px #f59e4255;transition:background .18s,transform .14s,box-shadow .18s}
.start:hover{background:var(--sun-deep);color:#fff5e8;transform:translateY(-2px);box-shadow:0 16px 30px #d97a1e55}
.start:active{transform:translateY(0)}
.start:focus-visible{outline:3px solid #d97a1e55;outline-offset:3px}
.tour{border:1px solid #d9b48b;background:transparent;color:var(--plum);height:52px;padding:0 26px;border-radius:999px;font:600 15px var(--sans);cursor:pointer;transition:background .18s}
.tour:hover{background:#ffe9d2}
.tour:focus-visible{outline:2px solid var(--sun-deep);outline-offset:2px}
.preview{margin-top:38px;width:520px;max-width:100%;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 22px;text-align:left;box-shadow:0 18px 40px #4a2c3a12;display:none}
.preview.show{display:block}
.preview h2{margin:0 0 4px;font-size:16px}
.preview p{margin:0 0 12px;color:var(--muted);font-size:13px}
.preview li{padding:9px 2px;border-top:1px dashed var(--line);list-style:none;display:flex;gap:10px;align-items:center;font-size:14px}
.preview ul{margin:0;padding:0}
.tick{width:18px;height:18px;border-radius:50%;border:2px solid var(--sun);flex:none;cursor:pointer;background:#fff;padding:0}
.tick.on{background:var(--sun);box-shadow:inset 0 0 0 3px #fffaf2}
.tick:focus-visible{outline:2px solid var(--sun-deep);outline-offset:2px}
@media (max-width:640px){h1{font-size:30px}.bar{padding:0 20px}.actions{flex-direction:column}.preview{margin-top:28px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="bar"><b>破晓清单</b><span class="who">早安，今天还没有任何清单</span></header>
<main class="hero">
  <svg class="rise" viewBox="0 0 110 110" aria-hidden="true">
    <circle cx="55" cy="58" r="30" fill="#f59e42"/>
    <rect x="8" y="58" width="94" height="44" fill="#ffe2c8"/>
    <path d="M55 12 L55 24 M22 26 L30 34 M88 26 L80 34" stroke="#d97a1e" stroke-width="6" stroke-linecap="round"/>
  </svg>
  <h1>新的一天，还是一张白纸</h1>
  <p class="sub">破晓清单把你今天要做的事排在日出的顺序里。还没有任何清单，从第一件小事开始吧。</p>
  <div class="actions">
    <button class="start" id="startBtn" type="button">创建今天的第一张清单</button>
    <button class="tour" id="tourBtn" type="button">先看看别人怎么用</button>
  </div>
  <section class="preview" id="preview">
    <h2>「晨间十件事」示例清单</h2>
    <p>点一点圆圈试试打勾的感觉，这是演示，不会保存。</p>
    <ul id="demoList">
      <li><button class="tick" type="button" aria-label="切换完成"></button>拉开窗帘，让光进来</li>
      <li><button class="tick" type="button" aria-label="切换完成"></button>喝一杯温水</li>
      <li><button class="tick" type="button" aria-label="切换完成"></button>写下今天最重要的三件事</li>
    </ul>
  </section>
</main>
<script>
(function(){
  "use strict";
  var startBtn=document.getElementById("startBtn");
  var tourBtn=document.getElementById("tourBtn");
  var preview=document.getElementById("preview");
  startBtn.addEventListener("click",function(){
    startBtn.textContent="好，已为你铺开新清单";
    startBtn.disabled=true;
    startBtn.style.background="#d97a1e";
    startBtn.style.color="#fff5e8";
  });
  tourBtn.addEventListener("click",function(){
    preview.classList.toggle("show");
    tourBtn.textContent=preview.classList.contains("show")?"收起示例":"先看看别人怎么用";
  });
  preview.addEventListener("click",function(ev){
    if(ev.target.classList&&ev.target.classList.contains("tick")){
      ev.target.classList.toggle("on");
    }
  });
})();
</script>
</body>
</html>
