<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>星栈 · 提交处理中</title>
<style>
:root{
  --night:#141824; --panel:#1d2333; --panel-line:#2b3348; --text:#eceaf2;
  --muted:#8d93a8; --gold:#e6b455; --gold-deep:#c9973a; --done:#5fae7f;
  --sans:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:#0b0d14;font:14px/1.65 var(--sans);display:grid;place-items:center;min-height:100vh;padding:20px 10px}
.phone{width:390px;max-width:100%;height:844px;border:10px solid #05060a;border-radius:44px;overflow:hidden;box-shadow:0 30px 80px #00000088;background:var(--night);position:relative}
.scr{height:100%;display:flex;flex-direction:column;padding:60px 24px 28px;color:var(--text)}
.hourglass{align-self:center;width:74px;height:74px;border-radius:50%;border:2px solid var(--gold);display:grid;place-items:center;font-size:30px;color:var(--gold);animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 #e6b45533}50%{box-shadow:0 0 0 14px #e6b45500}}
h1{text-align:center;font-size:21px;margin:16px 0 4px}
.eta{text-align:center;color:var(--muted);font-size:13px;margin:0 0 22px}
.eta b{color:var(--gold);font:700 15px var(--mono)}
.steps{background:var(--panel);border:1px solid var(--panel-line);border-radius:16px;padding:18px 18px 8px;margin-bottom:16px}
.step{display:grid;grid-template-columns:22px 1fr auto;gap:12px;align-items:start;padding:9px 0;position:relative}
.step:not(:last-child):before{content:"";position:absolute;left:10px;top:32px;bottom:-6px;width:2px;background:var(--panel-line)}
.step.done:not(:last-child):before{background:var(--done)}
.dot{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;z-index:1}
.step.done .dot{background:var(--done);color:#0f1a13}
.step.now .dot{background:var(--gold);color:#241a05;animation:pulse 2.2s ease-in-out infinite}
.step.wait .dot{background:var(--panel);border:2px solid var(--panel-line);color:var(--muted)}
.step b{font-size:14px}
.step.wait b{color:var(--muted);font-weight:400}
.step span{font-size:12px;color:var(--muted);display:block}
.step .tag{font-size:11px;color:var(--gold);border:1px solid #e6b45544;border-radius:999px;padding:2px 10px;white-space:nowrap}
.note{background:#242b3e;border-radius:12px;padding:11px 14px;font-size:12px;color:var(--muted);margin-bottom:16px}
.btns{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.aside{height:48px;border:0;border-radius:11px;background:var(--gold);color:#241a05;font:700 15px var(--sans);cursor:pointer;transition:background .15s}
.aside:hover{background:var(--gold-deep)}
.aside:focus-visible{outline:3px solid #e6b45544;outline-offset:2px}
.cancel{height:46px;border:1px solid var(--panel-line);background:transparent;color:var(--muted);border-radius:11px;font:600 14px var(--sans);cursor:pointer}
.cancel:hover{color:var(--text);border-color:#454e68}
.cancel:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.msg{text-align:center;font-size:12px;min-height:18px;margin:10px 0 0;color:var(--muted)}
.msg.gold{color:var(--gold)}
.msg.dim{color:#b8766d}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="phone">
  <div class="scr">
    <div class="hourglass" aria-hidden="true">⏳</div>
    <h1>观测记录正在归档</h1>
    <p class="eta">预计还需 <b id="etaVal">02:10</b> · 请勿关闭应用</p>
    <section class="steps">
      <div class="step done"><span class="dot">✓</span><div><b>上传原始影像</b><span>128 张 · 1.2 GB 已完成</span></div><span class="tag" style="border-color:#5fae7f44;color:#5fae7f">完成</span></div>
      <div class="step now"><span class="dot">2</span><div><b>校准星点坐标</b><span>正在比对 4,096 个参考点</span></div><span class="tag">进行中</span></div>
      <div class="step wait"><span class="dot">3</span><div><b>生成观测报告</b><span>含光变曲线与对比图</span></div></div>
      <div class="step wait"><span class="dot">4</span><div><b>同步到你的星册</b><span>完成后推送通知</span></div></div>
    </section>
    <div class="note">归档在后台进行，放到一边不影响你继续观测。中断网络会导致本次归档失败。</div>
    <div class="btns">
      <button class="aside" id="asideBtn" type="button">放到一边，先去观测</button>
      <button class="cancel" id="cancelBtn" type="button">取消本次归档</button>
    </div>
    <p class="msg" id="msg" role="status"></p>
  </div>
</div>
<script>
(function(){
  "use strict";
  var left=130;
  var eta=document.getElementById("etaVal");
  var msg=document.getElementById("msg");
  var aside=document.getElementById("asideBtn");
  var cancel=document.getElementById("cancelBtn");
  var timer=setInterval(function(){
    left=Math.max(0,left-1);
    eta.textContent=String(Math.floor(left/60)).padStart(2,"0")+":"+String(left%60).padStart(2,"0");
    if(left===0){
      clearInterval(timer);
      msg.className="msg gold";
      msg.textContent="归档完成，报告已进你的星册。";
    }
  },1000);
  aside.addEventListener("click",function(){
    msg.className="msg gold";
    msg.textContent="已切到后台，完成后会推送通知。";
  });
  cancel.addEventListener("click",function(){
    clearInterval(timer);
    msg.className="msg dim";
    msg.textContent="已取消归档，原始影像仍安全保存在本机。";
  });
})();
</script>
</body>
</html>
