<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>植记 · 创建账号</title>
<style>
:root{
  --mist:#eef4f1; --card:#ffffff; --deep:#0e3f38; --leaf:#128268;
  --leaf-dark:#0b5c4a; --muted:#63736d; --line:#d5e2dc; --warn:#c2620a;
  --sans:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--mist);color:var(--deep);font:15px/1.65 var(--sans)}
.bar{height:60px;display:flex;align-items:center;gap:10px;padding:0 32px;background:#ffffffcc;backdrop-filter:blur(6px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.logo{width:30px;height:30px;border-radius:9px;background:var(--leaf);display:grid;place-items:center;color:#fff;font-weight:700}
.bar b{font-size:17px;letter-spacing:.04em}
.bar span{color:var(--muted);font-size:13px;margin-left:6px}
.wrap{width:min(920px,calc(100% - 48px));margin:44px auto 72px;display:grid;grid-template-columns:1fr 400px;gap:28px;align-items:start}
.pitch{padding:12px 8px}
.pitch h1{font-size:34px;line-height:1.3;margin:8px 0 14px}
.pitch p{color:var(--muted);margin:0 0 26px}
.perk{display:flex;gap:14px;padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:12px}
.perk .dot{flex:none;width:38px;height:38px;border-radius:50%;background:#e2f1ea;color:var(--leaf-dark);display:grid;place-items:center;font-size:18px}
.perk b{display:block;font-size:15px}
.perk small{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:30px 28px;box-shadow:0 14px 36px #0e3f380f}
.card h2{margin:0;font-size:21px}
.card .why{color:var(--muted);font-size:13px;margin:6px 0 20px}
label{display:block;font-size:13px;font-weight:600;margin:16px 0 6px}
input[type=text],input[type=tel],input[type=password]{width:100%;height:44px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font:inherit;background:#fbfdfc;transition:border-color .15s,box-shadow .15s}
input:focus{outline:none;border-color:var(--leaf);box-shadow:0 0 0 3px #12826822;background:#fff}
.meter{display:flex;gap:6px;margin-top:8px}
.meter i{height:5px;flex:1;border-radius:3px;background:#e3ece7;transition:background .2s}
.meter i.on1{background:var(--warn)}
.meter i.on2{background:#3f8f2f}
.meter i.on3{background:var(--leaf)}
.meter-label{font-size:12px;color:var(--muted);margin-top:4px}
.agree{display:flex;gap:8px;margin:18px 0 6px;font-size:13px;color:var(--muted);align-items:flex-start}
.agree input{margin-top:3px;accent-color:var(--leaf);width:15px;height:15px}
.agree a{color:var(--leaf-dark)}
.create{width:100%;height:46px;margin-top:12px;border:0;border-radius:10px;background:var(--leaf);color:#fff;font:600 15px var(--sans);cursor:pointer;transition:background .15s,opacity .15s}
.create:hover{background:var(--leaf-dark)}
.create:disabled{background:#b8cec5;cursor:not-allowed}
.create:focus-visible{outline:3px solid #12826844;outline-offset:2px}
.result{margin-top:12px;font-size:13px;padding:9px 12px;border-radius:8px;display:none}
.result.good{display:block;background:#e2f1ea;color:var(--leaf-dark)}
.result.bad{display:block;background:#f8ecdc;color:var(--warn)}
.goto{margin-top:18px;text-align:center;font-size:13px;color:var(--muted)}
.goto a{color:var(--deep);font-weight:600;text-decoration:none;border-bottom:1px solid var(--line)}
@media (max-width:860px){.wrap{grid-template-columns:1fr}.pitch h1{font-size:27px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="bar"><span class="logo">植</span><b>植记</b><span>把每一盆植物的日子记下来</span></header>
<main class="wrap">
  <section class="pitch">
    <h1>给家里的绿植<br>建一本生长日记</h1>
    <p>三步注册，马上开始记录浇水、换盆与新芽。</p>
    <div class="perk"><span class="dot">浇</span><div><b>浇水提醒</b><small>按植物习性自动排期，不再浇多浇少</small></div></div>
    <div class="perk"><span class="dot">记</span><div><b>生长时间线</b><small>照片与笔记按月归档，一眼看完一年</small></div></div>
    <div class="perk"><span class="dot">问</span><div><b>问诊花友圈</b><small>黄叶烂根拍一张，花友帮你看看</small></div></div>
  </section>
  <form class="card" id="signupForm" novalidate>
    <h2>创建账号</h2>
    <p class="why">注册即开通免费的基础记录空间。</p>
    <label for="nick">昵称</label>
    <input type="text" id="nick" placeholder="花友怎么称呼你" autocomplete="nickname">
    <label for="phone">手机号</label>
    <input type="tel" id="phone" placeholder="用于接收浇水提醒" autocomplete="tel">
    <label for="pass">设置密码</label>
    <input type="password" id="pass" placeholder="8 位以上，含字母更稳妥" autocomplete="new-password">
    <div class="meter" aria-hidden="true"><i id="m1"></i><i id="m2"></i><i id="m3"></i></div>
    <p class="meter-label" id="meterLabel">还没输入</p>
    <label class="agree"><input type="checkbox" id="agree">我已阅读并同意<a href="#terms">服务协议</a>与<a href="#privacy">隐私政策</a></label>
    <button type="submit" class="create" id="createBtn" disabled>创建账号</button>
    <div class="result" id="resultBox" role="status"></div>
    <p class="goto">已有账号？<a href="#login">直接登录</a></p>
  </form>
</main>
<script>
(function(){
  "use strict";
  var pass=document.getElementById("pass");
  var nick=document.getElementById("nick");
  var phone=document.getElementById("phone");
  var agree=document.getElementById("agree");
  var btn=document.getElementById("createBtn");
  var box=document.getElementById("resultBox");
  var bars=[document.getElementById("m1"),document.getElementById("m2"),document.getElementById("m3")];
  var meterLabel=document.getElementById("meterLabel");
  function strength(v){
    if(!v)return 0;
    var score=0;
    if(v.length>=8)score++;
    if(/[a-zA-Z]/.test(v)&&/\d/.test(v))score++;
    if(v.length>=12||/[^a-zA-Z0-9]/.test(v))score++;
    return score;
  }
  pass.addEventListener("input",function(){
    var s=strength(pass.value);
    var names=["还没输入","偏弱，建议加长","不错，再加点变化","很稳妥"];
    bars.forEach(function(bar,i){bar.className=s>i? "on"+s : "";});
    meterLabel.textContent=names[s];
  });
  agree.addEventListener("change",function(){btn.disabled=!agree.checked});
  document.getElementById("signupForm").addEventListener("submit",function(ev){
    ev.preventDefault();
    if(nick.value.trim().length<2){box.className="result bad";box.textContent="昵称至少要 2 个字，方便花友称呼你。";return}
    if(!/^1\d{10}$/.test(phone.value.trim())){box.className="result bad";box.textContent="手机号看起来不对，请填 11 位号码。";return}
    if(strength(pass.value)<1){box.className="result bad";box.textContent="密码太短，请至少写 8 位。";return}
    btn.disabled=true;btn.textContent="正在为你开园…";
    setTimeout(function(){
      btn.textContent="创建账号";btn.disabled=false;
      box.className="result good";
      box.textContent="注册成功！欢迎「"+nick.value.trim()+"」，你的植物日记已开好第一页。";
    },900);
  });
})();
</script>
</body>
</html>
