<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>拾陶 · 确认订单</title>
<style>
:root{
  --linen:#faf4ee; --card:#ffffff; --ink:#33261f; --muted:#9a8577;
  --line:#ecdfd2; --wine:#8c2f3f; --wine-deep:#6e2231; --gold:#b98a2f;
  --sans:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--linen);color:var(--ink);font:14px/1.65 var(--sans)}
.bar{height:54px;display:flex;align-items:center;gap:12px;padding:0 30px;background:var(--wine);color:#f6e8dd}
.bar b{font-size:16px;letter-spacing:.05em}
.bar span{font-size:12px;opacity:.8}
.wrap{display:grid;grid-template-columns:1fr 360px;gap:18px;max-width:1080px;margin:24px auto 70px;padding:0 22px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 24px}
.card h2{font-size:16px;margin:0 0 16px}
.o{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px dashed var(--line)}
.o:last-child{border-bottom:0}
.o .l b{display:block}
.o .l span{color:var(--muted);font-size:12px}
.o .r{font-weight:700}
.addr{background:#fdf8f2;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:18px;font-size:13px;color:#5c4a3c}
.addr b{color:var(--ink)}
.pay{display:grid;gap:10px}
.method{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:11px;padding:13px 15px;cursor:pointer;transition:border-color .15s,background .15s}
.method:hover{border-color:#d8bfa8}
.method.on{border-color:var(--wine);background:#fdf4f2}
.method input{accent-color:var(--wine);width:16px;height:16px}
.method .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:14px;color:#fff}
.i-wx{background:#3ba158}
.i-ali{background:#1677ff}
.i-card{background:#8c2f3f}
.method b{font-size:14px}
.method small{display:block;color:var(--muted);font-size:12px}
.sum .row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:9px}
.sum .big{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);margin-top:8px;padding-top:14px}
.sum .big b{font-size:28px;color:var(--wine)}
.sum .big small{color:var(--gold);font-size:12px;margin-left:6px}
.confirm{width:100%;height:50px;margin-top:18px;border:0;border-radius:11px;background:var(--wine);color:#fff;font:700 16px var(--sans);cursor:pointer;transition:background .16s}
.confirm:hover{background:var(--wine-deep)}
.confirm:disabled{background:#cfa9b0;cursor:wait}
.confirm:focus-visible{outline:3px solid #8c2f3f44;outline-offset:2px}
.note{margin-top:10px;text-align:center;font-size:12px;color:var(--muted);min-height:18px}
.note.good{color:#3f7d4f;font-weight:600}
@media (max-width:880px){.wrap{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="bar"><b>拾陶 · 结账</b><span>第 2 步 / 共 2 步 · 确认后不可修改釉色</span></header>
<main class="wrap">
  <section class="card">
    <h2>订单摘要</h2>
    <div class="addr"><b>收货</b>：林晚 · 137****6021 · 杭州市西湖区青芝坞 27 号窑旁小楼（放门卫处即可）</div>
    <div class="o"><div class="l"><b>山月杯 · 落灰釉 · 260ml</b><span>手作粗陶 × 2</span></div><span class="r">¥ 256</span></div>
    <div class="o"><div class="l"><b>山月杯 · 铁锈红 · 380ml</b><span>手作粗陶 × 1</span></div><span class="r">¥ 158</span></div>
    <div class="o"><div class="l"><b>运费</b><span>顺丰 · 预计 8 月 17 日送达</span></div><span class="r">免运费</span></div>
  </section>
  <aside class="card sum">
    <h2>支付方式</h2>
    <div class="pay" id="payZone">
      <label class="method on"><input type="radio" name="pay" value="微信支付" checked><span class="ic i-wx">微</span><span><b>微信支付</b><small>推荐 · 支持零钱与储蓄卡</small></span></label>
      <label class="method"><input type="radio" name="pay" value="支付宝"><span class="ic i-ali">支</span><span><b>支付宝</b><small>支持花呗分期</small></span></label>
      <label class="method"><input type="radio" name="pay" value="银行卡"><span class="ic i-card">卡</span><span><b>银行卡</b><small>尾号 6021 · 借记卡</small></span></label>
    </div>
    <div style="margin-top:20px">
      <div class="row"><span>商品合计</span><span>¥ 414</span></div>
      <div class="row"><span>运费</span><span>¥ 0</span></div>
      <div class="row"><span>老客立减</span><span>- ¥ 20</span></div>
      <div class="big"><span>应付</span><span><b id="payAmt">¥ 394</b><small>已含包装加固费</small></span></div>
    </div>
    <button class="confirm" id="confirmBtn" type="button">确认支付 ¥ 394</button>
    <p class="note" id="note"></p>
  </aside>
</main>
<script>
(function(){
  "use strict";
  var zone=document.getElementById("payZone");
  var btn=document.getElementById("confirmBtn");
  var note=document.getElementById("note");
  zone.addEventListener("change",function(){
    zone.querySelectorAll(".method").forEach(function(m){
      m.classList.toggle("on",m.querySelector("input").checked);
    });
  });
  btn.addEventListener("click",function(){
    var checked=zone.querySelector("input:checked");
    btn.disabled=true;
    btn.textContent="正在发起支付…";
    note.className="note";
    note.textContent="";
    setTimeout(function(){
      btn.disabled=false;
      btn.textContent="确认支付 ¥ 394";
      note.className="note good";
      note.textContent="支付成功！订单号 ST-20260815-042，已用 "+checked.value+" 支付 ¥394。";
    },1100);
  });
})();
</script>
</body>
</html>
