<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>青崖信箱 · 登录</title>
<style>
:root{
  --paper:#f5f1e6; --card:#fffdf6; --ink:#1c2b27; --ink-soft:#2c3f39;
  --muted:#77806f; --line:#ddd4c0; --accent:#c73e2e; --accent-deep:#9e2f22;
  --ok:#3e6b4f; --err:#b23425;
  --serif:"Songti SC","STSong","SimSun",serif;
  --sans:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 var(--sans);min-height:100vh;display:flex}
.brand{width:46%;min-width:420px;background:var(--ink);color:#efe9d8;display:flex;flex-direction:column;justify-content:space-between;padding:56px 60px;position:relative;overflow:hidden}
.brand svg{position:absolute;right:-60px;bottom:-40px;opacity:.9;pointer-events:none}
.mark{display:flex;align-items:center;gap:12px;font-family:var(--serif);font-size:20px;letter-spacing:.12em}
.seal{width:34px;height:34px;background:var(--accent);color:#fff;display:grid;place-items:center;border-radius:6px;font-size:17px;font-family:var(--serif)}
.brand h1{font-family:var(--serif);font-size:44px;line-height:1.3;margin:0;font-weight:600;letter-spacing:.06em}
.brand p{color:#b9c2ae;max-width:380px;margin:18px 0 0}
.foot{color:#8b967f;font-size:13px;letter-spacing:.08em}
.stage{flex:1;display:grid;place-items:center;padding:40px 24px}
.card{width:420px;max-width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:44px 42px 38px;box-shadow:0 18px 44px #1c2b2714}
.card h2{font-family:var(--serif);font-size:26px;margin:0 0 6px}
.sub{color:var(--muted);margin:0 0 26px;font-size:14px}
.field{margin-bottom:18px}
label{display:block;font-size:13px;color:var(--ink-soft);margin-bottom:7px;font-weight:600}
.inp{position:relative}
input[type=text],input[type=password]{width:100%;height:46px;border:1px solid var(--line);border-radius:9px;background:#fff;padding:0 42px 0 14px;font:inherit;color:var(--ink);transition:border-color .18s,box-shadow .18s}
input:hover{border-color:#c6bba0}
input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px #c73e2e22}
input.bad{border-color:var(--err);box-shadow:0 0 0 3px #b2342522}
.eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:13px;padding:6px;border-radius:6px}
.eye:hover{color:var(--ink);background:#f1ecdd}
.eye:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tip{min-height:18px;font-size:12px;color:var(--err);margin:4px 0 0}
.row{display:flex;justify-content:space-between;align-items:center;margin:4px 0 22px;font-size:13px}
.remember{display:flex;gap:8px;align-items:center;color:var(--ink-soft);cursor:pointer}
.remember input{accent-color:var(--accent);width:15px;height:15px}
a.lost{color:var(--accent);text-decoration:none;border-bottom:1px dashed #c73e2e66}
a.lost:hover{color:var(--accent-deep)}
.go{width:100%;height:48px;border:0;border-radius:9px;background:var(--accent);color:#fff;font:600 16px var(--sans);letter-spacing:.2em;cursor:pointer;transition:background .18s,transform .12s}
.go:hover{background:var(--accent-deep)}
.go:active{transform:scale(.985)}
.go:focus-visible{outline:3px solid #c73e2e55;outline-offset:2px}
.go:disabled{background:#d8b7ae;cursor:not-allowed}
.alt{margin-top:22px;text-align:center;color:var(--muted);font-size:13px}
.alt a{color:var(--ink);font-weight:600;text-decoration:none;border-bottom:1px solid var(--line)}
.status{margin-top:16px;padding:10px 12px;border-radius:8px;font-size:13px;display:none}
.status.ok{display:block;background:#e8efe6;color:var(--ok);border:1px solid #c3d5c2}
.status.err{display:block;background:#f7e7e3;color:var(--err);border:1px solid #ecc9c1}
@media (max-width:900px){body{flex-direction:column}.brand{width:100%;min-width:0;padding:32px 28px}.brand h1{font-size:30px}.brand svg{display:none}.stage{padding:28px 16px}.card{padding:30px 24px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<aside class="brand">
  <div class="mark"><span class="seal">青</span>青崖信箱</div>
  <div>
    <h1>山中有信，<br>见字如面。</h1>
    <p>写给远方的人、未来的自己。慢一点的通信，从登录开始。</p>
  </div>
  <div class="foot">青崖信箱 · 第 2260 天为你传递心意</div>
  <svg width="380" height="260" viewBox="0 0 380 260" aria-hidden="true">
    <path d="M0 220 L90 110 L150 180 L230 60 L320 190 L380 140 L380 260 L0 260 Z" fill="#2c3f39"/>
    <path d="M0 236 L70 160 L140 214 L250 120 L380 224 L380 260 L0 260 Z" fill="#3a524a"/>
    <circle cx="300" cy="52" r="26" fill="#c73e2e" opacity="0.85"/>
  </svg>
</aside>
<main class="stage">
  <form class="card" id="loginForm" novalidate>
    <h2>回来啦</h2>
    <p class="sub">登录后继续收发你的山中信。</p>
    <div class="field">
      <label for="account">账号</label>
      <div class="inp"><input type="text" id="account" placeholder="邮箱或手机号" autocomplete="username"></div>
      <p class="tip" id="accountTip"></p>
    </div>
    <div class="field">
      <label for="secret">密码</label>
      <div class="inp">
        <input type="password" id="secret" placeholder="至少 8 位" autocomplete="current-password">
        <button type="button" class="eye" id="eyeBtn" aria-label="显示密码">显示</button>
      </div>
      <p class="tip" id="secretTip"></p>
    </div>
    <div class="row">
      <label class="remember"><input type="checkbox" id="remember" checked>记住我 30 天</label>
      <a class="lost" href="#reset">忘记密码？</a>
    </div>
    <button type="submit" class="go" id="goBtn">进 入 信 箱</button>
    <div class="status" id="statusBox" role="status"></div>
    <p class="alt">还没有账号？<a href="#signup">领一个信封注册</a></p>
  </form>
</main>
<script>
(function(){
  "use strict";
  var form=document.getElementById("loginForm");
  var account=document.getElementById("account");
  var secret=document.getElementById("secret");
  var eye=document.getElementById("eyeBtn");
  var statusBox=document.getElementById("statusBox");
  var goBtn=document.getElementById("goBtn");
  eye.addEventListener("click",function(){
    var hidden=secret.type==="password";
    secret.type=hidden?"text":"password";
    eye.textContent=hidden?"隐藏":"显示";
    eye.setAttribute("aria-label",hidden?"隐藏密码":"显示密码");
  });
  function mark(input,tip,msg){
    var el=document.getElementById(tip);
    el.textContent=msg||"";
    input.classList.toggle("bad",!!msg);
  }
  form.addEventListener("submit",function(ev){
    ev.preventDefault();
    var ok=true;
    if(!account.value.trim()){mark(account,"accountTip","请先填写账号");ok=false}else{mark(account,"accountTip","")}
    if(secret.value.length<8){mark(secret,"secretTip","密码至少需要 8 位");ok=false}else{mark(secret,"secretTip","")}
    statusBox.className="status";
    if(!ok){statusBox.className="status err";statusBox.textContent="登录失败，请检查上面两处输入。";return}
    goBtn.disabled=true;goBtn.textContent="正在开门…";
    setTimeout(function(){
      goBtn.disabled=false;goBtn.textContent="进 入 信 箱";
      statusBox.className="status ok";
      statusBox.textContent="验证通过，正在进入信箱，今天有 3 封新信等你。";
    },900);
  });
})();
</script>
</body>
</html>
