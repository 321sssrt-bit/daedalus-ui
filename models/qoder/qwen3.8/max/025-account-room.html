<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>栖巢 · 账号设置</title>
<style>
:root{
  --bg:#f5f3ef; --card:#ffffff; --ink:#2b2926; --muted:#8f897e;
  --line:#e7e2d8; --indigo:#424874; --indigo-soft:#ebedf5; --ok:#3f7d4f;
  --sans:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.65 var(--sans)}
.wrap{max-width:760px;margin:0 auto;padding:38px 22px 80px}
h1{font-size:24px;margin:0 0 18px}
.idrow{display:flex;gap:18px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:26px}
.ava{width:58px;height:58px;border-radius:50%;background:var(--indigo);color:#fff;display:grid;place-items:center;font-size:22px}
.idrow b{font-size:16px;display:block}
.idrow span{color:var(--muted);font-size:13px}
.idrow a{margin-left:auto;border:1px solid var(--line);border-radius:9px;padding:8px 18px;font:600 13px var(--sans);color:var(--ink);text-decoration:none;background:#fff}
.idrow a:hover{border-color:var(--indigo);color:var(--indigo)}
.group{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:16px;overflow:hidden}
.group h2{font-size:13px;color:var(--muted);margin:0;padding:12px 20px;border-bottom:1px solid var(--line);background:#fbfaf7;letter-spacing:.1em}
.set{border-bottom:1px solid #efece4}
.set:last-child{border-bottom:0}
.set .row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 20px;cursor:pointer;transition:background .13s}
.set .row:hover{background:#faf8f4}
.set .row b{font-size:14px;font-weight:600}
.set .row .val{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:8px}
.chev{color:#b6b0a4;font-size:12px;transition:transform .18s}
.set.open .chev{transform:rotate(90deg);color:var(--indigo)}
.detail{display:none;padding:0 20px 18px;background:#fbfaf7}
.set.open .detail{display:block}
.detail label{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px}
.detail input[type=text],.detail select{width:100%;height:40px;border:1px solid var(--line);border-radius:9px;padding:0 12px;font:inherit;background:#fff}
.detail input:focus,.detail select:focus{outline:none;border-color:var(--indigo);box-shadow:0 0 0 3px #42487422}
.switch{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:13px}
.tgl{width:42px;height:24px;border-radius:999px;background:#d8d3c8;border:0;position:relative;cursor:pointer;transition:background .18s}
.tgl:after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .18s}
.tgl.on{background:var(--indigo)}
.tgl.on:after{left:21px}
.tgl:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}
.save{margin-top:14px;border:0;background:var(--indigo);color:#fff;border-radius:9px;padding:9px 22px;font:600 13px var(--sans);cursor:pointer}
.save:hover{background:#333a61}
.saved{color:var(--ok);font-size:12px;margin-left:10px}
@media (max-width:560px){.idrow{flex-wrap:wrap}.idrow a{margin-left:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main class="wrap">
  <h1>账号设置</h1>
  <section class="idrow">
    <span class="ava">林</span>
    <div><b>林晚</b><span>lin.wan@qichao.app · 注册于 2023 年 4 月</span></div>
    <a href="#avatar">更换头像</a>
  </section>
  <section class="group">
    <h2>资 料</h2>
    <div class="set">
      <div class="row"><b>昵称与头衔</b><span class="val">林晚 · 产品负责人 <span class="chev">▸</span></span></div>
      <div class="detail">
        <label>昵称</label><input type="text" value="林晚">
        <label>头衔</label><input type="text" value="产品负责人">
        <button class="save" type="button">保存资料</button><span class="saved" role="status"></span>
      </div>
    </div>
    <div class="set">
      <div class="row"><b>所在地区与时区</b><span class="val">杭州 · UTC+8 <span class="chev">▸</span></span></div>
      <div class="detail">
        <label>地区</label><select><option>杭州</option><option>上海</option><option>北京</option><option>成都</option></select>
        <label>时区</label><select><option>UTC+8 北京时间</option><option>UTC+9 东京时间</option></select>
        <button class="save" type="button">保存资料</button><span class="saved" role="status"></span>
      </div>
    </div>
  </section>
  <section class="group">
    <h2>安 全</h2>
    <div class="set">
      <div class="row"><b>登录密码</b><span class="val">上次修改 42 天前 <span class="chev">▸</span></span></div>
      <div class="detail">
        <label>新密码</label><input type="text" placeholder="至少 8 位，含字母与数字">
        <label>确认新密码</label><input type="text" placeholder="再输入一次">
        <button class="save" type="button">更新密码</button><span class="saved" role="status"></span>
      </div>
    </div>
    <div class="set">
      <div class="row"><b>两步验证</b><span class="val">已开启 · 短信 <span class="chev">▸</span></span></div>
      <div class="detail">
        <div class="switch"><span>登录时需要短信验证码</span><button class="tgl on" type="button" aria-label="切换两步验证"></button></div>
        <button class="save" type="button">保存设置</button><span class="saved" role="status"></span>
      </div>
    </div>
    <div class="set">
      <div class="row"><b>登录设备</b><span class="val">3 台在线 <span class="chev">▸</span></span></div>
      <div class="detail">
        <div class="switch"><span>MacBook Pro · 杭州 · 当前设备</span><span style="color:var(--ok);font-size:12px">本机</span></div>
        <div class="switch"><span>iPhone 15 · 杭州 · 2 小时前</span><button class="tgl on" type="button" aria-label="保持信任"></button></div>
        <div class="switch"><span>Windows 台式机 · 上海 · 6 天前</span><button class="tgl" type="button" aria-label="保持信任"></button></div>
        <button class="save" type="button">保存设备信任</button><span class="saved" role="status"></span>
      </div>
    </div>
  </section>
  <section class="group">
    <h2>通 知</h2>
    <div class="set">
      <div class="row"><b>邮件提醒</b><span class="val">仅重要事项 <span class="chev">▸</span></span></div>
      <div class="detail">
        <div class="switch"><span>任务到期与 @ 提及</span><button class="tgl on" type="button" aria-label="任务提醒"></button></div>
        <div class="switch"><span>产品公告与周报</span><button class="tgl" type="button" aria-label="产品公告"></button></div>
        <button class="save" type="button">保存通知</button><span class="saved" role="status"></span>
      </div>
    </div>
    <div class="set">
      <div class="row"><b>免打扰时段</b><span class="val">22:00 – 08:00 <span class="chev">▸</span></span></div>
      <div class="detail">
        <label>开始时间</label><select><option>21:00</option><option selected>22:00</option><option>23:00</option></select>
        <label>结束时间</label><select><option>07:00</option><option selected>08:00</option><option>09:00</option></select>
        <button class="save" type="button">保存时段</button><span class="saved" role="status"></span>
      </div>
    </div>
  </section>
</main>
<script>
(function(){
  "use strict";
  document.querySelectorAll(".set .row").forEach(function(row){
    row.addEventListener("click",function(){
      var set=row.closest(".set");
      var wasOpen=set.classList.contains("open");
      document.querySelectorAll(".set.open").forEach(function(s){s.classList.remove("open")});
      if(!wasOpen)set.classList.add("open");
    });
  });
  document.querySelectorAll(".tgl").forEach(function(btn){
    btn.addEventListener("click",function(){btn.classList.toggle("on")});
  });
  document.querySelectorAll(".save").forEach(function(btn){
    btn.addEventListener("click",function(){
      var saved=btn.nextElementSibling;
      saved.textContent="已保存 ✓";
      setTimeout(function(){saved.textContent=""},1800);
    });
  });
})();
</script>
</body>
</html>
