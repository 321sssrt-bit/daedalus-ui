<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>山路 · 出了点状况</title>
<style>
:root{
  --bg:#f6f2ea; --card:#fffdf8; --ink:#3a3128; --muted:#98897a;
  --line:#e9e0d2; --amber:#d97f1e; --amber-soft:#fbeeda; --ok:#3e6b4f;
  --sans:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:#2c2620;font:14px/1.7 var(--sans);display:grid;place-items:center;min-height:100vh;padding:20px 10px}
.phone{width:390px;max-width:100%;height:844px;border:10px solid #171310;border-radius:44px;overflow:hidden;box-shadow:0 30px 80px #00000088;background:var(--bg);position:relative}
.scr{height:100%;display:flex;flex-direction:column;padding:64px 26px 30px}
.flag{align-self:center;width:150px;height:120px}
h1{font-size:23px;text-align:center;margin:18px 0 8px;color:var(--ink)}
.say{text-align:center;color:var(--muted);margin:0 auto 22px;max-width:280px;font-size:14px}
.ticket{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px}
.ticket .row{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);padding:4px 0}
.ticket .row b{font:600 13px var(--mono);color:var(--ink)}
.ticket .row.copy b{color:var(--amber);cursor:pointer}
.status{background:var(--amber-soft);border:1px solid #f0d9b4;border-radius:14px;padding:12px 16px;font-size:13px;color:#8a5410;margin-bottom:20px}
.status.ok{background:#e7efe4;border-color:#cfe0c8;color:var(--ok)}
.btns{display:flex;flex-direction:column;gap:10px;margin-top:auto}
.retry{height:48px;border:0;border-radius:11px;background:var(--amber);color:#fff;font:700 15px var(--sans);cursor:pointer;transition:background .15s}
.retry:hover{background:#bd6b13}
.retry:disabled{background:#dfc09a;cursor:wait}
.retry:focus-visible{outline:3px solid #d97f1e44;outline-offset:2px}
.home{height:48px;border:1px solid var(--line);background:var(--card);border-radius:11px;font:600 15px var(--sans);color:var(--ink);cursor:pointer}
.home:hover{background:#f6efe2}
.home:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.homeview{flex:1;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.homeview.show{display:flex}
.homeview h2{font-size:20px;color:var(--ink);margin:12px 0 6px}
.homeview p{color:var(--muted);margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="phone">
  <div class="scr">
    <div id="errView" style="display:flex;flex-direction:column;flex:1">
      <svg class="flag" viewBox="0 0 150 120" aria-hidden="true">
        <path d="M20 105 L75 18 L130 105 Z" fill="none" stroke="#3a3128" stroke-width="7" stroke-linejoin="round"/>
        <path d="M42 70 L108 70" stroke="#d97f1e" stroke-width="12" stroke-linecap="round"/>
        <path d="M34 88 L116 88" stroke="#3a3128" stroke-width="7" stroke-linecap="round"/>
        <circle cx="75" cy="42" r="7" fill="#d97f1e"/>
      </svg>
      <h1>前面的路暂时不通</h1>
      <p class="say">路线数据没能加载出来。不是你的问题，我们的服务器正在抢修，预计 10 分钟内恢复。</p>
      <div class="ticket">
        <div class="row"><span>故障编号</span><b>SRV-2026-0815-117</b></div>
        <div class="row"><span>影响范围</span><b>路线详情 · 轨迹同步</b></div>
        <div class="row copy"><span>报障时请带上编号</span><b id="copyRow">点我复制编号</b></div>
      </div>
      <div class="status" id="statusBox">正在等待恢复 · 已自动重试 2 次，均失败</div>
      <div class="btns">
        <button class="retry" id="retryBtn" type="button">重试一下</button>
        <button class="home" id="homeBtn" type="button">先回首页</button>
      </div>
    </div>
    <div class="homeview" id="homeView">
      <svg width="90" height="90" viewBox="0 0 90 90" aria-hidden="true"><path d="M15 78 L45 22 L75 78 Z" fill="none" stroke="#3e6b4f" stroke-width="7" stroke-linejoin="round"/><circle cx="45" cy="22" r="7" fill="#d97f1e"/></svg>
      <h2>已回到山路首页</h2>
      <p>离线缓存的路线仍可浏览，恢复后会第一时间同步。</p>
    </div>
  </div>
</div>
<script>
(function(){
  "use strict";
  var retry=document.getElementById("retryBtn");
  var home=document.getElementById("homeBtn");
  var statusBox=document.getElementById("statusBox");
  var errView=document.getElementById("errView");
  var homeView=document.getElementById("homeView");
  var copyRow=document.getElementById("copyRow");
  var tries=2;
  copyRow.addEventListener("click",function(){
    copyRow.textContent="已复制 SRV-2026-0815-117";
    setTimeout(function(){copyRow.textContent="点我复制编号"},1600);
  });
  retry.addEventListener("click",function(){
    retry.disabled=true;
    retry.textContent="正在重试…";
    statusBox.className="status";
    statusBox.textContent="正在重新连接路线服务…";
    setTimeout(function(){
      tries+=1;
      retry.disabled=false;
      retry.textContent="重试一下";
      statusBox.textContent="这次还是没通 · 已自动重试 "+tries+" 次。服务恢复后无需操作，页面会自己回来。";
    },1200);
  });
  home.addEventListener("click",function(){
    errView.style.display="none";
    homeView.classList.add("show");
  });
})();
</script>
</body>
</html>
