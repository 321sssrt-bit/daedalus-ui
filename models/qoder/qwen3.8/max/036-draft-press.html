<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>便签坞 · 写一条动态</title>
<style>
:root{
  --ink:#191a1e; --panel:#22242a; --panel-line:#33363e; --text:#eef0f4;
  --muted:#8e93a0; --lime:#c8f04c; --lime-deep:#a8cf2f; --bad:#ff7268;
  --sans:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:#0d0e11;font:14px/1.7 var(--sans);display:grid;place-items:center;min-height:100vh;padding:20px 10px}
.phone{width:390px;max-width:100%;height:844px;border:10px solid #050507;border-radius:44px;overflow:hidden;box-shadow:0 30px 80px #00000088;background:var(--ink);position:relative}
.scr{height:100%;display:flex;flex-direction:column;color:var(--text)}
.bar{display:flex;justify-content:space-between;align-items:center;padding:52px 20px 12px}
.bar .x{border:0;background:var(--panel);color:var(--muted);width:34px;height:34px;border-radius:50%;font-size:15px;cursor:pointer}
.bar .x:hover{color:var(--text)}
.bar .x:focus-visible{outline:2px solid var(--lime)}
.bar .st{font-size:12px;color:var(--muted)}
.edit{flex:1;overflow-y:auto;padding:8px 22px}
.edit::-webkit-scrollbar{width:0}
.title{width:100%;border:0;background:transparent;color:var(--text);font:700 22px/1.4 var(--sans);padding:6px 0}
.title::placeholder{color:#565b68}
.title:focus{outline:none}
.content{width:100%;min-height:300px;border:0;background:transparent;color:#cdd2dc;font:15px/1.9 var(--sans);resize:none;padding:4px 0}
.content::placeholder{color:#565b68}
.content:focus{outline:none}
.foot{border-top:1px solid var(--panel-line);background:var(--panel);padding:12px 20px 20px}
.count{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:10px}
.count .num{font-variant-numeric:tabular-nums}
.count .num.warn{color:var(--bad)}
.btns{display:flex;gap:10px}
.draft{flex:1;height:46px;border:1px solid var(--panel-line);background:transparent;color:var(--text);border-radius:11px;font:600 14px var(--sans);cursor:pointer}
.draft:hover{border-color:#4a4e59;background:#272932}
.draft:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
.pub{flex:1.5;height:46px;border:0;background:var(--lime);color:#171a08;border-radius:11px;font:700 14px var(--sans);cursor:pointer;transition:background .15s}
.pub:hover{background:var(--lime-deep)}
.pub:disabled{background:#4c5340;color:#9aa287;cursor:not-allowed}
.pub:focus-visible{outline:3px solid #c8f04c44;outline-offset:2px}
.note{margin-top:10px;font-size:12px;text-align:center;min-height:18px;color:var(--muted)}
.note.ok{color:var(--lime)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="phone">
  <div class="scr">
    <header class="bar">
      <button class="x" type="button" aria-label="关闭">✕</button>
      <span class="st">公开发布 · 所有人可见</span>
      <button class="x" type="button" aria-label="更多">···</button>
    </header>
    <main class="edit">
      <input class="title" id="title" type="text" placeholder="标题（选填）" maxlength="30">
      <textarea class="content" id="content" placeholder="此刻想说点什么？支持换行，最多 280 字。"></textarea>
    </main>
    <footer class="foot">
      <div class="count"><span id="statusLine">未保存</span><span class="num" id="num">0 / 280</span></div>
      <div class="btns">
        <button class="draft" id="draftBtn" type="button">存草稿</button>
        <button class="pub" id="pubBtn" type="button" disabled>发布</button>
      </div>
      <p class="note" id="note" role="status"></p>
    </footer>
  </div>
</div>
<script>
(function(){
  "use strict";
  var MAX=280;
  var content=document.getElementById("content");
  var num=document.getElementById("num");
  var pub=document.getElementById("pubBtn");
  var draft=document.getElementById("draftBtn");
  var note=document.getElementById("note");
  var statusLine=document.getElementById("statusLine");
  function refresh(){
    var n=content.value.length;
    num.textContent=n+" / "+MAX;
    num.classList.toggle("warn",n>MAX-20);
    pub.disabled=n===0;
  }
  content.addEventListener("input",function(){
    if(content.value.length>MAX)content.value=content.value.slice(0,MAX);
    refresh();
  });
  function now(){
    var d=new Date();
    return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
  }
  draft.addEventListener("click",function(){
    if(!content.value){note.className="note";note.textContent="空白内容没有可保存的草稿。";return}
    statusLine.textContent="草稿已保存 "+now();
    note.className="note ok";
    note.textContent="草稿已存到便签坞，随时回来继续写。";
  });
  pub.addEventListener("click",function(){
    pub.disabled=true;
    pub.textContent="发布中…";
    setTimeout(function(){
      pub.textContent="已发布";
      statusLine.textContent="已发布 "+now();
      note.className="note ok";
      note.textContent="动态已发布，朋友现在就能看见。";
    },900);
  });
  refresh();
})();
</script>
</body>
</html>
