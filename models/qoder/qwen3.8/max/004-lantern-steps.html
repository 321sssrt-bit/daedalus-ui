<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>山径 · 新手引导</title>
<style>
:root{
  --cream:#faf6ef; --card:#ffffff; --ink:#33291d; --muted:#8a7c68;
  --line:#e8ddca; --flame:#e0662b; --flame-deep:#b84e1c; --sky:#3f5d78;
  --sans:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font:15px/1.6 var(--sans);min-height:100vh;display:flex;flex-direction:column}
.top{height:64px;display:flex;justify-content:space-between;align-items:center;padding:0 40px}
.brand{display:flex;gap:10px;align-items:center;font-weight:700;font-size:17px}
.brand i{width:28px;height:28px;border-radius:8px;background:var(--flame);display:grid;place-items:center;color:#fff;font-style:normal;font-size:15px}
.skip{border:0;background:none;color:var(--muted);font:inherit;font-size:14px;cursor:pointer;padding:8px 12px;border-radius:8px}
.skip:hover{color:var(--ink);background:#f1e8d8}
.skip:focus-visible{outline:2px solid var(--flame);outline-offset:2px}
.wizard{flex:1;display:grid;place-items:center;padding:12px 24px 40px}
.frame{width:880px;max-width:100%;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:46px 52px 34px;display:grid;grid-template-columns:340px 1fr;gap:44px;box-shadow:0 22px 50px #33291d10}
.art{border-radius:14px;background:#f3ead9;display:grid;place-items:center;min-height:320px}
.steps{display:flex;gap:8px;margin-bottom:26px}
.pip{height:6px;border-radius:3px;background:var(--line);flex:1;transition:background .25s}
.pip.done{background:var(--flame)}
.count{font-size:13px;color:var(--flame);font-weight:700;letter-spacing:.14em;margin:0 0 8px}
.panel h2{font-size:27px;margin:0 0 12px;line-height:1.35}
.panel p{color:var(--muted);margin:0 0 14px}
.panel ul{margin:0;padding:0;list-style:none;color:var(--ink)}
.panel li{padding:7px 0 7px 24px;position:relative;font-size:14px}
.panel li:before{content:"";position:absolute;left:2px;top:13px;width:9px;height:9px;border-radius:50%;background:#f4cfb4;border:2px solid var(--flame)}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:30px}
.back{border:1px solid var(--line);background:#fff;color:var(--ink);height:44px;padding:0 22px;border-radius:10px;font:inherit;cursor:pointer;transition:background .15s}
.back:hover{background:#f6efe2}
.back:disabled{color:#c9bda6;cursor:not-allowed;background:#fff}
.next{border:0;background:var(--flame);color:#fff;height:44px;padding:0 30px;border-radius:10px;font:600 15px var(--sans);cursor:pointer;transition:background .15s,transform .12s}
.next:hover{background:var(--flame-deep)}
.next:active{transform:translateY(1px)}
.next:focus-visible{outline:3px solid #e0662b44;outline-offset:2px}
.finish{background:#3e6b4f}
.finish:hover{background:#31573f}
.done-view{text-align:center;padding:30px 10px}
.done-view .badge{width:66px;height:66px;border-radius:50%;background:#e8f0e4;color:#3e6b4f;display:grid;place-items:center;font-size:30px;margin:0 auto 18px}
.done-view h2{margin:0 0 10px}
.done-view p{color:var(--muted)}
@media (max-width:860px){.frame{grid-template-columns:1fr;padding:30px 24px}.art{min-height:180px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><i>山</i>山径 · 徒步伴侣</div>
  <button class="skip" id="skipBtn" type="button">跳过引导</button>
</header>
<main class="wizard">
  <section class="frame" id="wizardFrame">
    <div class="art" id="artBox" aria-hidden="true"></div>
    <div class="panel" id="panelBox" aria-live="polite"></div>
  </section>
</main>
<script>
(function(){
  "use strict";
  var STEPS=[
    {
      title:"把走过的路变成轨迹",
      lead:"出发前点开记录，山径会在后台描绘你的路线。",
      points:["自动记录里程、爬升与用时","轨迹按山系归档，随时回看","离线也能完整记录"],
      art:'<svg width="240" height="240" viewBox="0 0 240 240"><path d="M20 200 L80 90 L120 150 L170 60 L225 190" fill="none" stroke="#3f5d78" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 200 L80 90 L120 150 L170 60 L225 190" fill="none" stroke="#e0662b" stroke-width="4" stroke-dasharray="2 14" stroke-linecap="round"/><circle cx="170" cy="60" r="12" fill="#e0662b"/></svg>'
    },
    {
      title:"出发前看清山里的情绪",
      lead:"海拔逐点预报与日落倒计时，帮你决定走多远。",
      points:["逐小时山间天气","日落前 90 分钟提醒折返","等高线地图可提前缓存"],
      art:'<svg width="240" height="240" viewBox="0 0 240 240"><circle cx="120" cy="110" r="52" fill="#e0662b" opacity="0.9"/><path d="M30 180 Q80 150 120 178 T215 172" fill="none" stroke="#3f5d78" stroke-width="9" stroke-linecap="round"/><path d="M45 205 Q95 182 130 202 T205 200" fill="none" stroke="#8a7c68" stroke-width="6" stroke-linecap="round"/></svg>'
    },
    {
      title:"关键时刻喊得应",
      lead:"一键把位置发给紧急联系人，山中信号弱也能排队发出。",
      points:["长按侧键即可呼救","离线短信自动补发","同行人实时共享位置"],
      art:'<svg width="240" height="240" viewBox="0 0 240 240"><path d="M120 40 L120 128" stroke="#3f5d78" stroke-width="12" stroke-linecap="round"/><circle cx="120" cy="160" r="34" fill="none" stroke="#e0662b" stroke-width="9"/><circle cx="120" cy="160" r="58" fill="none" stroke="#e0662b" stroke-width="4" opacity="0.45"/></svg>'
    }
  ];
  var step=0;
  var artBox=document.getElementById("artBox");
  var panelBox=document.getElementById("panelBox");
  function render(){
    var data=STEPS[step];
    artBox.innerHTML=data.art;
    var pips=STEPS.map(function(_,i){
      return '<span class="pip'+(i<=step?" done":"")+'"></span>';
    }).join("");
    var list=data.points.map(function(t){return "<li>"+t+"</li>"}).join("");
    var backDisabled=step===0?" disabled":"";
    var nextLabel=step===STEPS.length-1
      ?'<button class="next finish" type="button" data-act="start">开始徒步</button>'
      :'<button class="next" type="button" data-act="next">下一步</button>';
    panelBox.innerHTML=
      '<div class="steps">'+pips+'</div>'+
      '<p class="count">第 '+(step+1)+" / "+STEPS.length+' 步</p>'+
      '<h2>'+data.title+'</h2><p>'+data.lead+'</p><ul>'+list+'</ul>'+
      '<div class="nav"><button class="back" type="button" data-act="back"'+backDisabled+'>上一步</button>'+nextLabel+'</div>';
  }
  function renderDone(){
    artBox.innerHTML='<svg width="240" height="240" viewBox="0 0 240 240"><path d="M40 190 L110 70 L150 130 L205 55" fill="none" stroke="#3e6b4f" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/><circle cx="205" cy="55" r="14" fill="#e0662b"/></svg>';
    panelBox.innerHTML='<div class="done-view"><div class="badge">登</div><h2>山径已备好</h2><p>引导完成。第一条轨迹，就从你家门口那座小山开始吧。</p><div class="nav" style="justify-content:center"><button class="next" type="button" data-act="enter">进入山径</button></div></div>';
  }
  document.getElementById("wizardFrame").addEventListener("click",function(ev){
    var act=ev.target.getAttribute&&ev.target.getAttribute("data-act");
    if(!act)return;
    if(act==="next"&&step<STEPS.length-1){step+=1;render()}
    else if(act==="back"&&step>0){step-=1;render()}
    else if(act==="start"){renderDone()}
    else if(act==="enter"){panelBox.innerHTML='<div class="done-view"><div class="badge">山</div><h2>欢迎进山</h2><p>演示到此结束，真实产品会进入首页轨迹列表。</p></div>'}
  });
  document.getElementById("skipBtn").addEventListener("click",renderDone);
  render();
})();
</script>
</body>
</html>
