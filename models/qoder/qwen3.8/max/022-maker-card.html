<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>阿茶 A-CHA · 个人主页</title>
<style>
:root{
  --slate:#23262b; --panel:#2c3037; --cream:#f2ecdf; --muted:#9aa0a8;
  --line:#3a3f47; --amber:#e0a13e; --amber-deep:#c4872a;
  --sans:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--slate);color:var(--cream);font:14px/1.7 var(--sans)}
.wrap{max-width:1000px;margin:0 auto;padding:54px 26px 80px}
.head{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.ava{width:92px;height:92px;border-radius:24px;background:linear-gradient(135deg,#e0a13e,#8a5a1c);display:grid;place-items:center;font-size:38px;color:#23262b;font-weight:800}
.head h1{font-size:30px;margin:0}
.head .one{color:var(--amber);margin:4px 0 6px;font-size:14px}
.head .bio{color:var(--muted);font-size:13px;max-width:480px}
.acts{margin-left:auto;display:flex;flex-direction:column;gap:10px;min-width:150px}
.follow{height:44px;border:0;border-radius:10px;background:var(--amber);color:#241a08;font:700 14px var(--sans);cursor:pointer;transition:background .15s}
.follow:hover{background:var(--amber-deep)}
.follow.on{background:transparent;color:var(--amber);border:1px solid var(--amber)}
.follow:focus-visible{outline:3px solid #e0a13e44;outline-offset:2px}
.mail{height:44px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--cream);font:600 14px var(--sans);cursor:pointer;text-decoration:none;display:grid;place-items:center}
.mail:hover{border-color:var(--cream)}
.stats{display:flex;gap:34px;margin:26px 0 34px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 4px}
.stat b{font-size:20px;display:block}
.stat span{color:var(--muted);font-size:12px}
.works h2{font-size:16px;margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.w{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--panel)}
.w .ph{height:130px;display:grid;place-items:center;font-size:15px;font-weight:700;color:#23262b}
.w .cap{padding:10px 12px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between}
.w .cap b{color:var(--cream);font-weight:600}
@media (max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}.acts{margin-left:0;flex-direction:row;width:100%}.acts>*{flex:1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main class="wrap">
  <header class="head">
    <div class="ava" aria-hidden="true">茶</div>
    <div>
      <h1>阿茶 A-CHA</h1>
      <p class="one">城市夜拍摄影师 · 只拍亮着灯的窗口</p>
      <p class="bio">常驻杭州，接城市纪实与小店空间拍摄。作品登过《纸间》第 39 期封面，正在做「一千扇亮灯的窗」长期项目。</p>
    </div>
    <div class="acts">
      <button class="follow" id="followBtn" type="button">关注 <span id="fans">12,480</span></button>
      <a class="mail" href="#contact">约拍 / 联系</a>
    </div>
  </header>
  <section class="stats">
    <div class="stat"><b>214</b><span>作品</span></div>
    <div class="stat"><b id="fansStat">12,480</b><span>关注者</span></div>
    <div class="stat"><b>36</b><span>长期项目</span></div>
    <div class="stat"><b>7 年</b><span>拍摄经验</span></div>
  </section>
  <section class="works">
    <h2>近期作品</h2>
    <div class="grid">
      <article class="w"><div class="ph" style="background:#e0a13e">窗 0947</div><div class="cap"><b>凌晨两点的包子铺</b><span>杭州 · 07 月</span></div></article>
      <article class="w"><div class="ph" style="background:#7a8ca3">窗 0932</div><div class="cap"><b>雨夜公交末班车</b><span>杭州 · 06 月</span></div></article>
      <article class="w"><div class="ph" style="background:#a3b18a">窗 0919</div><div class="cap"><b>修伞师傅的灯箱</b><span>绍兴 · 06 月</span></div></article>
      <article class="w"><div class="ph" style="background:#c98f76">窗 0904</div><div class="cap"><b>晚自习的教室</b><span>杭州 · 05 月</span></div></article>
      <article class="w"><div class="ph" style="background:#8d7ab5">窗 0891</div><div class="cap"><b>24 小时书店一角</b><span>上海 · 04 月</span></div></article>
      <article class="w"><div class="ph" style="background:#5f8575">窗 0880</div><div class="cap"><b>江边夜钓人</b><span>富阳 · 04 月</span></div></article>
    </div>
  </section>
</main>
<script>
(function(){
  "use strict";
  var btn=document.getElementById("followBtn");
  var fans=document.getElementById("fans");
  var fansStat=document.getElementById("fansStat");
  var following=false;
  btn.addEventListener("click",function(){
    following=!following;
    btn.classList.toggle("on",following);
    btn.innerHTML=following?"已关注 <span>12,481</span>":"关注 <span>12,480</span>";
    fansStat.textContent=following?"12,481":"12,480";
  });
})();
</script>
</body>
</html>
