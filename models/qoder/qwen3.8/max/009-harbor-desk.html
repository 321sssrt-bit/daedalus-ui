<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>港湾工作台 · 今日总览</title>
<style>
:root{
  --bg:#f1f3f8; --surface:#ffffff; --side:#1f2430; --side-text:#aab3c5;
  --ink:#20242e; --muted:#7a8296; --line:#e3e7ef; --signal:#2b59ff;
  --signal-soft:#e8eeff; --amber:#e8a13c; --ok:#2e9e6b;
  --sans:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 var(--sans);display:grid;grid-template-columns:228px 1fr;min-height:100vh}
nav{background:var(--side);color:var(--side-text);padding:26px 16px;display:flex;flex-direction:column;gap:4px}
.brand{color:#fff;font-weight:700;font-size:17px;display:flex;gap:9px;align-items:center;padding:0 10px;margin-bottom:26px}
.brand i{width:26px;height:26px;border-radius:7px;background:var(--signal);display:grid;place-items:center;font-style:normal;font-size:13px}
nav button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:transparent;color:var(--side-text);font:inherit;text-align:left;padding:10px 12px;border-radius:9px;cursor:pointer;transition:background .15s,color .15s}
nav button:hover{background:#2a3140;color:#fff}
nav button.on{background:var(--signal);color:#fff}
nav button:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.nav-note{margin-top:auto;font-size:12px;color:#6d7688;padding:0 10px}
main{padding:26px 34px;max-width:1120px}
header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px}
h1{font-size:24px;margin:0}
.date{color:var(--muted);font-size:13px;margin-top:3px}
.me{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--signal-soft);color:var(--signal);display:grid;place-items:center;font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.kpi .name{color:var(--muted);font-size:12px}
.kpi .num{font-size:28px;font-weight:700;margin:4px 0 2px}
.kpi .trend{font-size:12px;color:var(--ok)}
.kpi .trend.down{color:var(--amber)}
.bar{height:6px;border-radius:3px;background:var(--line);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;width:68%;background:var(--signal);border-radius:3px}
.queue{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.queue-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.queue-head h2{font-size:16px;margin:0}
.queue-head span{color:var(--muted);font-size:12px}
.item{display:grid;grid-template-columns:22px 1fr 110px 90px;gap:12px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line);transition:background .15s}
.item:last-child{border-bottom:0}
.item:hover{background:#f7f9fd}
.check{width:18px;height:18px;border-radius:6px;border:2px solid #c6cddd;background:#fff;cursor:pointer;padding:0}
.check.done{background:var(--ok);border-color:var(--ok)}
.check:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.item.done .title{text-decoration:line-through;color:var(--muted)}
.title{font-weight:600}
.tag{font-size:12px;padding:3px 10px;border-radius:999px;text-align:center}
.tag.review{background:#fdf3e2;color:#b06f14}
.tag.dev{background:var(--signal-soft);color:#2447c9}
.tag.ops{background:#e6f4ee;color:#1f7a52}
.when{color:var(--muted);font-size:12px;text-align:right}
@media (max-width:960px){body{grid-template-columns:1fr}nav{flex-direction:row;flex-wrap:wrap;padding:12px}.nav-note{display:none}.kpis{grid-template-columns:repeat(2,1fr)}.item{grid-template-columns:22px 1fr 90px}.when{display:none}main{padding:18px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<nav aria-label="主导航">
  <div class="brand"><i>港</i>港湾工作台</div>
  <button class="on" type="button">总览</button>
  <button type="button">项目</button>
  <button type="button">任务</button>
  <button type="button">报表</button>
  <button type="button">团队</button>
  <p class="nav-note">港湾 v4.2 · 数据每 5 分钟同步</p>
</nav>
<main>
  <header>
    <div><h1>今天的全局</h1><p class="date">8 月 15 日 星期六 · 第 33 周</p></div>
    <div class="me"><span class="avatar">林</span>林晚 · 产品组</div>
  </header>
  <section class="kpis">
    <div class="kpi"><div class="name">今日待办</div><div class="num">12</div><div class="trend">比昨天少 3 件</div></div>
    <div class="kpi"><div class="name">待评审</div><div class="num">5</div><div class="trend down">2 件已等 3 天</div></div>
    <div class="kpi"><div class="name">会议时长</div><div class="num">3.5<span style="font-size:14px;color:var(--muted)"> h</span></div><div class="trend down">下午连续两场</div></div>
    <div class="kpi"><div class="name">本周完成率</div><div class="num">68%</div><div class="bar"><i></i></div></div>
  </section>
  <section class="queue">
    <div class="queue-head"><h2>今日队列</h2><span>点左侧方块可标记完成</span></div>
    <div class="item"><button class="check" type="button" aria-label="标记完成"></button><span class="title">核对首页改版埋点口径</span><span class="tag review">评审</span><span class="when">09:30</span></div>
    <div class="item"><button class="check" type="button" aria-label="标记完成"></button><span class="title">合并结算流程的分支代码</span><span class="tag dev">开发</span><span class="when">11:00</span></div>
    <div class="item"><button class="check done" type="button" aria-label="标记完成"></button><span class="title">回复渠道方的接入邮件</span><span class="tag ops">运营</span><span class="when">已完成</span></div>
    <div class="item"><button class="check" type="button" aria-label="标记完成"></button><span class="title">准备周一立项会的材料</span><span class="tag review">评审</span><span class="when">16:00</span></div>
    <div class="item"><button class="check" type="button" aria-label="标记完成"></button><span class="title">巡检夜间任务的失败日志</span><span class="tag ops">运营</span><span class="when">18:30</span></div>
  </section>
</main>
<script>
(function(){
  "use strict";
  var nav=document.querySelectorAll("nav button");
  nav.forEach(function(btn){
    btn.addEventListener("click",function(){
      nav.forEach(function(b){b.classList.remove("on")});
      btn.classList.add("on");
    });
  });
  document.querySelectorAll(".item").forEach(function(item){
    var check=item.querySelector(".check");
    var when=item.querySelector(".when");
    var original=when.textContent;
    check.addEventListener("click",function(){
      var done=check.classList.toggle("done");
      item.classList.toggle("done",done);
      when.textContent=done?"已完成":original;
    });
  });
})();
</script>
</body>
</html>
