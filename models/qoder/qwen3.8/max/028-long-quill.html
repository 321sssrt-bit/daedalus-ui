<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>山径 · 新路线立项申请</title>
<style>
:root{
  --paper:#f8f4ec; --card:#ffffff; --ink:#3b3128; --muted:#93877a;
  --line:#e9e0d2; --clay:#c25e33; --clay-deep:#a04a25; --ok:#3e6b4f;
  --sans:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.7 var(--sans)}
.layout{display:grid;grid-template-columns:210px 1fr;gap:22px;max-width:1060px;margin:0 auto;padding:34px 22px 110px}
.rail{position:sticky;top:24px;height:fit-content}
.rail h1{font-size:19px;margin:0 0 4px}
.rail .sub{color:var(--muted);font-size:12px;margin:0 0 18px}
.jump{display:flex;flex-direction:column;gap:6px}
.jump button{border:0;background:transparent;text-align:left;font:inherit;font-size:13px;color:var(--muted);padding:8px 12px;border-radius:8px;cursor:pointer;border-left:3px solid transparent}
.jump button:hover{background:#f1e9db;color:var(--ink)}
.jump button.on{background:#f6e8de;color:var(--clay);border-left-color:var(--clay);font-weight:600}
.jump button:focus-visible{outline:2px solid var(--clay)}
.sec{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px 26px;margin-bottom:18px;scroll-margin-top:20px}
.sec h2{font-size:17px;margin:0 0 4px}
.sec .why{color:var(--muted);font-size:12px;margin:0 0 18px}
label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
.req:after{content:" *";color:var(--clay)}
input[type=text],select,textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 12px;font:inherit;background:#fdfcf9;transition:border-color .15s,box-shadow .15s}
textarea{min-height:88px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--clay);box-shadow:0 0 0 3px #c25e3322;background:#fff}
input.bad,textarea.bad{border-color:#b3372f;box-shadow:0 0 0 3px #b3372f1c}
.hint{font-size:12px;color:var(--muted);margin:4px 0 0}
.err{font-size:12px;color:#b3372f;margin:4px 0 0;display:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.actionbar{position:fixed;left:0;right:0;bottom:0;background:#ffffffee;backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:12px 22px;z-index:8}
.actionbar .in{max-width:1060px;margin:0 auto;display:flex;align-items:center;gap:12px}
.status{font-size:12px;color:var(--muted);flex:1}
.status.ok{color:var(--ok)}
.status.bad{color:#b3372f}
.draft{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 22px;font:600 14px var(--sans);cursor:pointer}
.draft:hover{background:#f6f0e4}
.submit{border:0;background:var(--clay);color:#fff;border-radius:10px;padding:10px 30px;font:700 14px var(--sans);cursor:pointer;transition:background .15s}
.submit:hover{background:var(--clay-deep)}
.submit:focus-visible{outline:3px solid #c25e3344;outline-offset:2px}
@media (max-width:820px){.layout{grid-template-columns:1fr}.rail{position:static}.grid2{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<main class="layout">
  <aside class="rail">
    <h1>新路线立项</h1>
    <p class="sub">三节内容，带 * 为必填。随时可存草稿。</p>
    <div class="jump" id="jump">
      <button class="on" type="button" data-to="s1">一 · 基本信息</button>
      <button type="button" data-to="s2">二 · 路线说明</button>
      <button type="button" data-to="s3">三 · 协作安排</button>
    </div>
  </aside>
  <form id="form" novalidate>
    <section class="sec" id="s1">
      <h2>一 · 基本信息</h2>
      <p class="why">告诉评审这是哪条路线、归谁负责。</p>
      <div class="grid2">
        <div><label class="req" for="name">路线名称</label><input type="text" id="name" placeholder="例如：午山北坡环线"><p class="err" id="nameErr">请填写路线名称</p></div>
        <div><label class="req" for="owner">负责人</label><input type="text" id="owner" value="林晚"><p class="err" id="ownerErr">请填写负责人</p></div>
      </div>
      <div class="grid2">
        <div><label for="level">难度分级</label><select id="level"><option>入门 · 10km 以内</option><option selected>进阶 · 10–20km</option><option>挑战 · 20km 以上</option></select></div>
        <div><label for="season">适合季节</label><select id="season"><option selected>四季</option><option>春秋冬</option><option>夏</option></select></div>
      </div>
    </section>
    <section class="sec" id="s2">
      <h2>二 · 路线说明</h2>
      <p class="why">写清走法与风险，评审重点看这一节。</p>
      <label class="req" for="desc">路线描述</label>
      <textarea id="desc" placeholder="起点终点、爬升、水源与下撤点…"></textarea>
      <p class="err" id="descErr">路线描述至少 20 字</p>
      <label for="risk">已知风险</label>
      <textarea id="risk" placeholder="落石、涉水、无信号路段…没有就写暂无"></textarea>
      <p class="hint">风险会出现在用户端的路线卡片上，请如实填写。</p>
    </section>
    <section class="sec" id="s3">
      <h2>三 · 协作安排</h2>
      <p class="why">立项后谁来踩线、谁来画图。</p>
      <div class="grid2">
        <div><label for="survey">踩线日期</label><input type="text" id="survey" placeholder="例如：8 月 24 日"></div>
        <div><label for="team">踩线同伴</label><input type="text" id="team" placeholder="最多 4 人，逗号分隔"></div>
      </div>
      <label for="remark">给评审的一句话</label>
      <input type="text" id="remark" placeholder="为什么值得开这条线">
    </section>
  </form>
</main>
<div class="actionbar">
  <div class="in">
    <span class="status" id="status">尚未保存</span>
    <button class="draft" id="draftBtn" type="button">保存草稿</button>
    <button class="submit" id="submitBtn" type="button">提交评审</button>
  </div>
</div>
<script>
(function(){
  "use strict";
  var jump=document.getElementById("jump");
  var status=document.getElementById("status");
  jump.addEventListener("click",function(ev){
    var btn=ev.target.closest("button");
    if(!btn)return;
    jump.querySelectorAll("button").forEach(function(b){b.classList.remove("on")});
    btn.classList.add("on");
    document.getElementById(btn.getAttribute("data-to")).scrollIntoView({behavior:"smooth",block:"start"});
  });
  function stamp(){
    var d=new Date();
    return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
  }
  document.getElementById("draftBtn").addEventListener("click",function(){
    status.className="status ok";
    status.textContent="草稿已保存于 "+stamp()+"，随时回来继续。";
  });
  document.getElementById("submitBtn").addEventListener("click",function(){
    var ok=true;
    var checks=[
      ["name",function(v){return v.trim().length>0},"nameErr"],
      ["owner",function(v){return v.trim().length>0},"ownerErr"],
      ["desc",function(v){return v.trim().length>=20},"descErr"]
    ];
    checks.forEach(function(c){
      var input=document.getElementById(c[0]);
      var pass=c[1](input.value);
      input.classList.toggle("bad",!pass);
      document.getElementById(c[2]).style.display=pass?"none":"block";
      if(!pass)ok=false;
    });
    if(!ok){
      status.className="status bad";
      status.textContent="还有必填项没完成，已在上方标红。";
      return;
    }
    status.className="status ok";
    status.textContent="已提交评审，编号 LX-2026-033，结果会在 3 个工作日内通知。";
  });
})();
</script>
</body>
</html>
