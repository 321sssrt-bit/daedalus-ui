<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>窝记 · 心愿清单</title>
<style>
:root{
  --sky:#eaf3fb; --card:#ffffff; --ink:#27364a; --muted:#8394a8;
  --line:#dfe9f3; --azure:#3f8fe0; --azure-deep:#2f74bd; --sun:#f5c34d;
  --sans:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:#d3e2ef;font:14px/1.65 var(--sans);display:grid;place-items:center;min-height:100vh;padding:20px 10px}
.phone{width:390px;max-width:100%;height:844px;border:10px solid #b9cbdc;border-radius:44px;overflow:hidden;box-shadow:0 30px 80px #27364a33;background:var(--sky);position:relative}
.scr{height:100%;display:flex;flex-direction:column}
.bar{display:flex;justify-content:space-between;align-items:center;padding:52px 22px 8px}
.bar b{font-size:18px;color:var(--ink)}
.bar .me{width:32px;height:32px;border-radius:50%;background:var(--azure);color:#fff;display:grid;place-items:center;font-size:14px}
.main{flex:1;overflow-y:auto;padding:10px 22px 16px;display:flex;flex-direction:column}
.main::-webkit-scrollbar{width:0}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.empty h1{font-size:21px;color:var(--ink);margin:20px 0 8px}
.empty p{color:var(--muted);margin:0 0 26px;max-width:250px;font-size:13px}
.create{border:0;background:var(--azure);color:#fff;border-radius:999px;padding:13px 34px;font:700 15px var(--sans);cursor:pointer;box-shadow:0 10px 24px #3f8fe055;transition:background .15s,transform .12s}
.create:hover{background:var(--azure-deep)}
.create:active{transform:scale(.97)}
.create:focus-visible{outline:3px solid #3f8fe044;outline-offset:2px}
.alt{margin-top:14px;border:0;background:none;color:var(--muted);font:13px var(--sans);cursor:pointer}
.alt:hover{color:var(--azure)}
.list{display:grid;gap:10px}
.wish{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px}
.wish .dot{width:12px;height:12px;border-radius:50%;background:var(--sun);flex:none}
.wish b{font-size:14px;color:var(--ink)}
.wish span{display:block;font-size:12px;color:var(--muted)}
.tabbar{border-top:1px solid var(--line);background:var(--card);display:grid;grid-template-columns:repeat(3,1fr);padding:8px 6px 16px}
.tabbar button{border:0;background:none;color:var(--muted);font:11px var(--sans);cursor:pointer;display:grid;justify-items:center;gap:3px;padding:4px}
.tabbar button.on{color:var(--azure)}
.tabbar .ti{font-size:17px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="phone">
  <div class="scr">
    <header class="bar"><b>我的心愿窝</b><span class="me">林</span></header>
    <main class="main" id="main">
      <div class="empty" id="empty">
        <svg width="170" height="140" viewBox="0 0 170 140" aria-hidden="true">
          <ellipse cx="85" cy="122" rx="58" ry="9" fill="#d6e5f2"/>
          <path d="M30 92 Q30 122 85 122 Q140 122 140 92 L133 92 Q128 112 85 112 Q42 112 37 92 Z" fill="#b98d5a"/>
          <path d="M30 88 Q85 106 140 88 Q140 98 85 102 Q30 98 30 88Z" fill="#a37a4c"/>
          <ellipse cx="85" cy="66" rx="26" ry="24" fill="#ffffff"/>
          <ellipse cx="85" cy="60" rx="19" ry="16" fill="#f5c34d"/>
          <circle cx="78" cy="57" r="2.6" fill="#27364a"/>
          <circle cx="92" cy="57" r="2.6" fill="#27364a"/>
          <path d="M81 64 L89 64 L85 70 Z" fill="#e07b39"/>
          <circle cx="38" cy="34" r="5" fill="#3f8fe0" opacity="0.5"/>
          <circle cx="132" cy="26" r="7" fill="#3f8fe0" opacity="0.35"/>
          <circle cx="146" cy="52" r="4" fill="#f5c34d" opacity="0.8"/>
        </svg>
        <h1>窝里还空着</h1>
        <p>把想去的地方、想买的书、想试的菜先收进来，周末不再对着天花板发呆。</p>
        <button class="create" id="createBtn" type="button">＋ 许下第一个愿望</button>
        <button class="alt" type="button" id="demoBtn">先看看别人怎么收藏</button>
      </div>
      <div class="list" id="list" hidden></div>
    </main>
    <nav class="tabbar" aria-label="底部导航">
      <button class="on" type="button"><span class="ti">◉</span>心愿</button>
      <button type="button"><span class="ti">◷</span>回忆</button>
      <button type="button"><span class="ti">☺</span>我的</button>
    </nav>
  </div>
</div>
<script>
(function(){
  "use strict";
  var empty=document.getElementById("empty");
  var list=document.getElementById("list");
  var count=0;
  var SAMPLES=[
    {t:"去一趟南极岛灯塔",s:"心愿 · 刚许下"},
    {t:"读完《海边的房间》",s:"心愿 · 刚许下"},
    {t:"学会做一锅冬阴功",s:"心愿 · 刚许下"}
  ];
  function addWish(text){
    var row=document.createElement("div");
    row.className="wish";
    row.innerHTML='<span class="dot"></span><div><b></b><span>心愿 · 刚许下</span></div>';
    row.querySelector("b").textContent=text;
    list.appendChild(row);
  }
  function showList(){
    if(list.hidden){
      empty.hidden=true;
      list.hidden=false;
    }
  }
  document.getElementById("createBtn").addEventListener("click",function(){
    count+=1;
    showList();
    addWish("我的第 "+count+" 个愿望");
  });
  document.getElementById("demoBtn").addEventListener("click",function(){
    showList();
    SAMPLES.forEach(function(s){addWish(s.t)});
  });
  document.querySelectorAll(".tabbar button").forEach(function(btn){
    btn.addEventListener("click",function(){
      document.querySelectorAll(".tabbar button").forEach(function(b){b.classList.remove("on")});
      btn.classList.add("on");
    });
  });
})();
</script>
</body>
</html>
