<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>街角广场 · 动态</title>
<style>
:root{
  --bg:#fdf2ee; --card:#ffffff; --ink:#3a2b2e; --muted:#a1868b;
  --line:#f3e0da; --rose:#d64f7f; --rose-deep:#b83c68; --rose-soft:#fbe6ee; --bad:#c23a2e;
  --sans:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:#3a2b2e;font:14px/1.6 var(--sans);display:grid;place-items:center;min-height:100vh;padding:20px 10px}
.phone{width:390px;max-width:100%;height:844px;border:10px solid #241a1c;border-radius:44px;overflow:hidden;box-shadow:0 30px 80px #00000088;background:var(--bg);position:relative}
.scr{height:100%;display:flex;flex-direction:column}
.hd{padding:52px 18px 10px;display:flex;justify-content:space-between;align-items:center}
.hd b{font-size:18px;color:var(--ink)}
.hd button{border:0;background:var(--rose);color:#fff;border-radius:999px;padding:8px 18px;font:700 13px var(--sans);cursor:pointer}
.hd button:hover{background:var(--rose-deep)}
.hd button:focus-visible{outline:3px solid #d64f7f44;outline-offset:2px}
.feed{flex:1;overflow-y:auto;padding:6px 16px 20px;display:grid;gap:12px}
.feed::-webkit-scrollbar{width:0}
.post{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:13px 15px}
.post .ph{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.post .ava{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700}
.post b{font-size:13px;display:block;color:var(--ink)}
.post span{font-size:11px;color:var(--muted)}
.post .body{font-size:13.5px;color:#54434a}
.post .scope{display:inline-block;margin-top:8px;font-size:10px;color:var(--rose);background:var(--rose-soft);border-radius:999px;padding:2px 10px}
.composer{position:absolute;inset:0;background:#3a2b2e99;backdrop-filter:blur(3px);display:none;align-items:flex-end;z-index:5}
.composer.show{display:flex}
.cbox{width:100%;background:var(--card);border-radius:22px 22px 0 0;padding:18px 18px 24px;max-height:86%;overflow-y:auto}
.cbox h2{font-size:16px;margin:0 0 10px;color:var(--ink)}
.cbox textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:12px;padding:11px 13px;font:13.5px/1.8 var(--sans);resize:none;background:#fffafa;color:var(--ink)}
.cbox textarea:focus{outline:none;border-color:var(--rose)}
.scopes{display:flex;gap:8px;margin:12px 0 4px}
.sc{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 4px;text-align:center;font:12px var(--sans);cursor:pointer;color:var(--muted)}
.sc.on{border-color:var(--rose);color:var(--rose);background:var(--rose-soft);font-weight:700}
.sc:focus-visible{outline:2px solid var(--rose)}
.sim{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);margin:10px 0 2px;cursor:pointer}
.sim input{accent-color:var(--bad)}
.cfail{display:none;background:#fbe9e7;border:1px solid #efc8c2;color:#8f2c24;border-radius:10px;padding:10px 12px;font-size:12px;margin-top:10px}
.cfail.show{display:block}
.cfail button{border:1px solid #8f2c24;background:#fff;color:#8f2c24;border-radius:8px;padding:5px 14px;font:600 12px var(--sans);cursor:pointer;margin-top:8px}
.cfail button:hover{background:#8f2c24;color:#fff}
.cacts{display:flex;gap:10px;margin-top:14px}
.close{flex:1;height:44px;border:1px solid var(--line);background:#fff;border-radius:11px;font:600 14px var(--sans);color:var(--ink);cursor:pointer}
.pub{flex:1.6;height:44px;border:0;background:var(--rose);color:#fff;border-radius:11px;font:700 14px var(--sans);cursor:pointer}
.pub:hover{background:var(--rose-deep)}
.pub:disabled{background:#e4b3c4;cursor:not-allowed}
.pub:focus-visible{outline:3px solid #d64f7f44;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="phone">
  <div class="scr">
    <header class="hd"><b>街角广场</b><button id="newBtn" type="button">＋ 发一条</button></header>
    <main class="feed" id="feed"></main>
  </div>
  <div class="composer" id="composer">
    <div class="cbox">
      <h2>发布新动态</h2>
      <textarea id="cText" placeholder="说说今天巷口发生了什么…"></textarea>
      <div class="scopes" id="scopes">
        <button class="sc on" type="button" data-s="公开">公开</button>
        <button class="sc" type="button" data-s="仅街坊">仅街坊</button>
        <button class="sc" type="button" data-s="仅自己">仅自己</button>
      </div>
      <label class="sim"><input type="checkbox" id="simFail">演示：让这次发布失败</label>
      <div class="cfail" id="cfail"></div>
      <div class="cacts">
        <button class="close" id="closeBtn" type="button">取消</button>
        <button class="pub" id="pubBtn" type="button">发布</button>
      </div>
    </div>
  </div>
</div>
<script>
(function(){
  "use strict";
  var POSTS=[
    {n:"老周面包房",c:"#d9973c",t:"今早的碱水结烤多了一炉，九点后来买半价。",s:"公开",w:"10 分钟前"},
    {n:"阿茶",c:"#7d9d6a",t:"拍到了巷口第一盏亮起来的灯，秋天真的来了。",s:"公开",w:"1 小时前"},
    {n:"沈一帆",c:"#5a7d9e",t:"谁家的猫又在快递柜上睡觉，我先rua为敬。",s:"仅街坊",w:"3 小时前"}
  ];
  var scope="公开";
  var feed=document.getElementById("feed");
  var composer=document.getElementById("composer");
  var cText=document.getElementById("cText");
  var simFail=document.getElementById("simFail");
  var cfail=document.getElementById("cfail");
  var pubBtn=document.getElementById("pubBtn");
  function render(){
    feed.innerHTML="";
    POSTS.forEach(function(p){
      var d=document.createElement("article");
      d.className="post";
      d.innerHTML='<div class="ph"><span class="ava" style="background:'+p.c+'">'+p.n.charAt(0)+'</span><div><b>'+p.n+'</b><span>'+p.w+'</span></div></div><div class="body"></div><span class="scope">'+p.s+'可见</span>';
      d.querySelector(".body").textContent=p.t;
      feed.appendChild(d);
    });
  }
  document.getElementById("newBtn").addEventListener("click",function(){
    composer.classList.add("show");
    cfail.classList.remove("show");
  });
  document.getElementById("closeBtn").addEventListener("click",function(){
    composer.classList.remove("show");
  });
  document.getElementById("scopes").addEventListener("click",function(ev){
    var b=ev.target.closest(".sc");
    if(!b)return;
    document.querySelectorAll(".sc").forEach(function(x){x.classList.remove("on")});
    b.classList.add("on");
    scope=b.getAttribute("data-s");
  });
  function publish(){
    var text=cText.value.trim();
    if(!text){cfail.classList.add("show");cfail.innerHTML="先写点什么再发布，草稿不会保存空内容。";return}
    pubBtn.disabled=true;
    pubBtn.textContent="发布中…";
    setTimeout(function(){
      pubBtn.disabled=false;
      pubBtn.textContent="发布";
      if(simFail.checked){
        cfail.classList.add("show");
        cfail.innerHTML='发布未完成：网络中断，内容没有丢。<b>草稿与可见范围都已保留。</b><br><button class="cfretry" type="button">重试发布</button>';
        cfail.querySelector(".cfretry").addEventListener("click",function(){
          simFail.checked=false;
          cfail.classList.remove("show");
          publish();
        });
        return;
      }
      POSTS.unshift({n:"林晚",c:"#d64f7f",t:text,s:scope,w:"刚刚"});
      cText.value="";
      composer.classList.remove("show");
      render();
    },800);
  }
  pubBtn.addEventListener("click",publish);
  render();
})();
</script>
</body>
</html>
