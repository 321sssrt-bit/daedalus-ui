<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>寻集 · 搜索无结果</title>
<style>
:root{
  --paper:#fffdf2; --ink:#22221e; --muted:#83816f; --line:#e6e2c8;
  --lemon:#f5d521; --lemon-deep:#d9b90e; --card:#ffffff;
  --sans:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.65 var(--sans)}
.bar{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 34px;border-bottom:2px solid var(--ink);background:var(--lemon)}
.bar b{font-size:18px;letter-spacing:.04em}
.bar span{font-size:13px}
.stage{max-width:760px;margin:0 auto;padding:54px 24px 70px;text-align:center}
.art{margin:0 auto 26px}
h1{font-size:26px;margin:0 0 10px}
.keyword{background:var(--lemon);padding:1px 10px;border-radius:6px}
.lead{color:var(--muted);margin:0 auto 30px;max-width:520px}
.search{display:flex;gap:10px;max-width:520px;margin:0 auto 14px}
.search input{flex:1;height:48px;border:2px solid var(--ink);border-radius:11px;padding:0 16px;font:inherit;background:var(--card)}
.search input:focus{outline:none;box-shadow:4px 4px 0 var(--lemon)}
.search button{height:48px;border:2px solid var(--ink);background:var(--ink);color:#fff;border-radius:11px;padding:0 26px;font:700 15px var(--sans);cursor:pointer}
.search button:hover{background:#000;box-shadow:4px 4px 0 var(--lemon)}
.search button:focus-visible{outline:3px solid var(--lemon-deep);outline-offset:2px}
.again{display:none;color:#b3372f;font-size:13px}
.again.show{display:block}
.tips{margin-top:38px;border-top:2px dashed var(--line);padding-top:26px}
.tips h2{font-size:15px;margin:0 0 14px}
.tip-list{max-width:560px;margin:0 auto;text-align:left;display:grid;gap:10px}
.tip{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 14px;font-size:14px}
.tip span{color:var(--muted);font-size:13px}
.chip{border:1px solid var(--ink);background:var(--paper);border-radius:999px;padding:5px 14px;font:600 13px var(--sans);cursor:pointer;white-space:nowrap}
.chip:hover{background:var(--lemon)}
.chip:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
@media (max-width:560px){.bar{padding:0 16px}.stage{padding:36px 16px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="bar"><b>寻集 · 二手好物市集</b><span>为你找到 4,382 件好物</span></header>
<main class="stage">
  <svg class="art" width="150" height="150" viewBox="0 0 150 150" aria-hidden="true">
    <circle cx="62" cy="62" r="38" fill="none" stroke="#22221e" stroke-width="7"/>
    <line x1="92" y1="92" x2="126" y2="126" stroke="#22221e" stroke-width="9" stroke-linecap="round"/>
    <path d="M48 70 Q62 58 76 70" fill="none" stroke="#22221e" stroke-width="5" stroke-linecap="round"/>
    <circle cx="50" cy="52" r="4.5" fill="#22221e"/>
    <circle cx="74" cy="52" r="4.5" fill="#22221e"/>
    <circle cx="112" cy="40" r="9" fill="#f5d521"/>
  </svg>
  <h1>没有找到和 <span class="keyword" id="kw">复古机械键盘 青轴</span> 相关的好物</h1>
  <p class="lead">这个词太具体了，摊主们还没来得及上架。换个说法，或者从下面的方向找找看。</p>
  <form class="search" id="searchForm">
    <input type="text" id="searchInput" value="复古机械键盘 青轴" aria-label="搜索词">
    <button type="submit">再搜一次</button>
  </form>
  <p class="again" id="againNote">「<span id="againKw"></span>」也暂时没有结果，试试下面的建议。</p>
  <section class="tips">
    <h2>四条改搜建议</h2>
    <div class="tip-list">
      <div class="tip"><div>减掉修饰词，只搜主体<b>「机械键盘」</b></div><button class="chip" type="button" data-q="机械键盘">搜这个</button></div>
      <div class="tip"><div>换成相近轴体<b>「机械键盘 茶轴」</b></div><button class="chip" type="button" data-q="机械键盘 茶轴">搜这个</button></div>
      <div class="tip"><div>用风格词代替型号<b>「复古键盘」</b></div><button class="chip" type="button" data-q="复古键盘">搜这个</button></div>
      <div class="tip"><div>检查是不是打错了字<span>比如「机械建盘」就搜不到</span></div><button class="chip" type="button" data-q="机械键盘 二手">搜二手专区</button></div>
    </div>
  </section>
</main>
<script>
(function(){
  "use strict";
  var form=document.getElementById("searchForm");
  var input=document.getElementById("searchInput");
  var kw=document.getElementById("kw");
  var againNote=document.getElementById("againNote");
  var againKw=document.getElementById("againKw");
  form.addEventListener("submit",function(ev){
    ev.preventDefault();
    var q=input.value.trim();
    if(!q)return;
    kw.textContent=q;
    againKw.textContent=q;
    againNote.classList.add("show");
  });
  document.querySelectorAll(".chip").forEach(function(chip){
    chip.addEventListener("click",function(){
      var q=chip.getAttribute("data-q");
      input.value=q;
      kw.textContent=q;
      againNote.classList.remove("show");
    });
  });
})();
</script>
</body>
</html>
