<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>织板 · 团队看板</title>
<style>
:root{
  --bg:#eef1f0; --ink:#25302b; --muted:#7d8781; --line:#dbe2de;
  --todo:#5a7bd8; --doing:#e08c2f; --done:#3f9e6e; --card:#ffffff;
  --sans:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 var(--sans)}
.top{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:1px solid var(--line);background:#f6f8f7}
.top b{font-size:16px}
.top .hint{color:var(--muted);font-size:12px}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;padding:22px 28px;max-width:1180px;margin:0 auto}
.col{background:#f6f8f7;border:1px solid var(--line);border-radius:13px;display:flex;flex-direction:column;min-height:440px}
.col[data-col=todo]{border-top:4px solid var(--todo)}
.col[data-col=doing]{border-top:4px solid var(--doing)}
.col[data-col=done]{border-top:4px solid var(--done)}
.col-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px}
.col-head h2{font-size:14px;margin:0}
.count{font-size:12px;background:#e7ecea;border-radius:999px;padding:2px 10px;color:var(--muted)}
.cards{flex:1;padding:2px 12px 8px;display:flex;flex-direction:column;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 12px;box-shadow:0 2px 6px #25302b08}
.card p{margin:0 0 9px;font-weight:600}
.card .row{display:flex;justify-content:space-between;align-items:center}
.who{font-size:12px;color:var(--muted)}
.move{display:flex;gap:6px}
.move button{width:24px;height:24px;border-radius:7px;border:1px solid var(--line);background:#fff;color:var(--muted);cursor:pointer;font-size:13px;line-height:1}
.move button:hover{background:#eef2f0;color:var(--ink)}
.move button:disabled{opacity:.35;cursor:not-allowed}
.move button:focus-visible{outline:2px solid var(--todo);outline-offset:1px}
.add{padding:10px 12px 14px;border-top:1px dashed var(--line);display:flex;gap:8px}
.add input{flex:1;height:34px;border:1px solid var(--line);border-radius:8px;padding:0 10px;font:inherit;background:#fff}
.add input:focus{outline:none;border-color:var(--todo);box-shadow:0 0 0 3px #5a7bd822}
.add button{border:0;background:var(--todo);color:#fff;border-radius:8px;padding:0 14px;font:600 13px var(--sans);cursor:pointer}
.add button:hover{background:#4867bd}
.add button:disabled{background:#b9c4d9;cursor:not-allowed}
@media (max-width:860px){.board{grid-template-columns:1fr;max-width:560px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top"><b>织板 · 八月冲刺看板</b><span class="hint">用箭头把卡片推到相邻一列；在「未开始」底部新增一条</span></header>
<main class="board" id="board">
  <section class="col" data-col="todo">
    <div class="col-head"><h2>未开始</h2><span class="count"></span></div>
    <div class="cards">
      <article class="card"><p>整理竞品定价对比</p><div class="row"><span class="who">陈默</span><span class="move"><button type="button" data-dir="-1" aria-label="左移">←</button><button type="button" data-dir="1" aria-label="右移">→</button></span></div></article>
      <article class="card"><p>撰写版本更新公告</p><div class="row"><span class="who">林晚</span><span class="move"><button type="button" data-dir="-1" aria-label="左移">←</button><button type="button" data-dir="1" aria-label="右移">→</button></span></div></article>
    </div>
    <form class="add" data-add="todo"><input type="text" placeholder="新任务，回车添加" aria-label="新任务标题"><button type="submit">添加</button></form>
  </section>
  <section class="col" data-col="doing">
    <div class="col-head"><h2>进行中</h2><span class="count"></span></div>
    <div class="cards">
      <article class="card"><p>重构账单导出接口</p><div class="row"><span class="who">赵屿</span><span class="move"><button type="button" data-dir="-1" aria-label="左移">←</button><button type="button" data-dir="1" aria-label="右移">→</button></span></div></article>
      <article class="card"><p>首页空态插画三稿</p><div class="row"><span class="who">苏杭</span><span class="move"><button type="button" data-dir="-1" aria-label="左移">←</button><button type="button" data-dir="1" aria-label="右移">→</button></span></div></article>
      <article class="card"><p>回归测试登录链路</p><div class="row"><span class="who">何苗</span><span class="move"><button type="button" data-dir="-1" aria-label="左移">←</button><button type="button" data-dir="1" aria-label="右移">→</button></span></div></article>
    </div>
  </section>
  <section class="col" data-col="done">
    <div class="col-head"><h2>已完成</h2><span class="count"></span></div>
    <div class="cards">
      <article class="card"><p>上线短信登录</p><div class="row"><span class="who">赵屿</span><span class="move"><button type="button" data-dir="-1" aria-label="左移">←</button><button type="button" data-dir="1" aria-label="右移">→</button></span></div></article>
    </div>
  </section>
</main>
<script>
(function(){
  "use strict";
  var board=document.getElementById("board");
  var ORDER=["todo","doing","done"];
  function refresh(){
    document.querySelectorAll(".col").forEach(function(col){
      var cards=col.querySelectorAll(".card");
      col.querySelector(".count").textContent=cards.length+" 条";
      cards.forEach(function(card){
        var colName=card.closest(".col").getAttribute("data-col");
        var idx=ORDER.indexOf(colName);
        card.querySelector('[data-dir="-1"]').disabled=idx===0;
        card.querySelector('[data-dir="1"]').disabled=idx===ORDER.length-1;
      });
    });
  }
  board.addEventListener("click",function(ev){
    var btn=ev.target.closest(".move button");
    if(!btn||btn.disabled)return;
    var card=btn.closest(".card");
    var col=card.closest(".col");
    var idx=ORDER.indexOf(col.getAttribute("data-col"));
    var target=board.querySelector('.col[data-col="'+ORDER[idx+Number(btn.getAttribute("data-dir"))]+'"] .cards');
    target.appendChild(card);
    refresh();
  });
  document.querySelectorAll(".add").forEach(function(form){
    form.addEventListener("submit",function(ev){
      ev.preventDefault();
      var input=form.querySelector("input");
      var title=input.value.trim();
      if(!title)return;
      var card=document.createElement("article");
      card.className="card";
      card.innerHTML='<p></p><div class="row"><span class="who">林晚</span><span class="move"><button type="button" data-dir="-1" aria-label="左移">←</button><button type="button" data-dir="1" aria-label="右移">→</button></span></div>';
      card.querySelector("p").textContent=title;
      form.closest(".col").querySelector(".cards").appendChild(card);
      input.value="";
      refresh();
    });
  });
  refresh();
})();
</script>
</body>
</html>
