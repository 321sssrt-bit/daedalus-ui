<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>线语 · 消息</title>
<style>
:root{
  --bg:#f2f3f5; --card:#ffffff; --ink:#22262b; --muted:#8b9096;
  --line:#e4e6e9; --sky:#2e7cd6; --sky-soft:#e3eefb; --bad:#d5453c; --ok:#3f9e6e;
  --sans:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:#2a2e33;font:14px/1.6 var(--sans);display:grid;place-items:center;min-height:100vh;padding:20px 10px}
.phone{width:390px;max-width:100%;height:844px;border:10px solid #17191c;border-radius:44px;overflow:hidden;box-shadow:0 30px 80px #00000088;background:var(--bg);position:relative}
.scr{height:100%;display:flex;flex-direction:column}
.view{display:none;flex-direction:column;flex:1;min-height:0}
.view.show{display:flex}
.hd{display:flex;align-items:center;gap:10px;padding:52px 16px 10px;background:var(--card);border-bottom:1px solid var(--line)}
.hd b{font-size:16px}
.hd .back{border:0;background:none;font-size:18px;cursor:pointer;color:var(--ink);padding:4px 8px;border-radius:8px}
.hd .back:hover{background:#f0f1f3}
.hd .back:focus-visible{outline:2px solid var(--sky)}
.weak{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);cursor:pointer;user-select:none}
.weak .sw{width:34px;height:20px;border-radius:999px;background:#d7dade;position:relative;transition:background .15s}
.weak .sw:after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.weak.on .sw{background:var(--bad)}
.weak.on .sw:after{left:16px}
.conv{display:flex;gap:12px;align-items:center;background:var(--card);padding:13px 16px;border-bottom:1px solid #eef0f2;cursor:pointer}
.conv:hover{background:#f8f9fa}
.conv .ava{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:17px;flex:none}
.conv .mid{flex:1;min-width:0}
.conv b{font-size:14px}
.conv .last{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv .when{font-size:11px;color:var(--muted)}
.unread{background:var(--sky);color:#fff;border-radius:999px;font-size:10px;padding:1px 7px;margin-left:6px}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msgs::-webkit-scrollbar{width:0}
.m{max-width:76%;padding:9px 12px;border-radius:14px;font-size:13.5px;position:relative}
.m.in{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-top-left-radius:4px}
.m.out{align-self:flex-end;background:var(--sky);color:#fff;border-top-right-radius:4px}
.m.out.failed{background:#f6d9d6;color:#7c2620;border:1px solid #ecc4c0}
.m .meta{display:flex;gap:6px;align-items:center;font-size:10px;margin-top:4px;opacity:.8;justify-content:flex-end}
.m.in .meta{color:var(--muted);justify-content:flex-start}
.retry{border:0;background:var(--bad);color:#fff;border-radius:999px;font:600 11px var(--sans);padding:3px 12px;cursor:pointer;margin-top:5px}
.retry:hover{background:#b93830}
.retry:focus-visible{outline:2px solid var(--bad);outline-offset:2px}
.fnote{align-self:center;font-size:11px;color:var(--bad);background:#fbeae8;border-radius:999px;padding:3px 12px}
.composer{display:flex;gap:9px;padding:10px 12px 18px;background:var(--card);border-top:1px solid var(--line)}
.composer input{flex:1;height:40px;border:1px solid var(--line);border-radius:999px;padding:0 16px;font:inherit;background:#f7f8f9}
.composer input:focus{outline:none;border-color:var(--sky);background:#fff}
.send{width:64px;height:40px;border:0;border-radius:999px;background:var(--sky);color:#fff;font:600 13px var(--sans);cursor:pointer}
.send:hover{background:#2768b4}
.send:focus-visible{outline:3px solid #2e7cd644;outline-offset:2px}
.tip{padding:8px 16px 0;font-size:11px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="phone">
  <div class="scr">
    <section class="view show" id="v-list">
      <div class="hd"><b>线语</b><span style="margin-left:auto;font-size:12px;color:var(--muted)">4 个会话</span></div>
      <div id="convBox" style="overflow-y:auto;flex:1"></div>
      <p class="tip">点进会话发消息；在会话顶部可打开「弱网模拟」。</p>
    </section>
    <section class="view" id="v-chat">
      <div class="hd">
        <button class="back" id="backBtn" type="button" aria-label="返回">◂</button>
        <b id="chatName"></b>
        <span class="weak" id="weakBox" role="switch" aria-checked="false" tabindex="0"><span class="sw"></span>弱网模拟</span>
      </div>
      <div class="msgs" id="msgBox"></div>
      <div class="composer">
        <input type="text" id="input" placeholder="输入消息…" aria-label="消息输入">
        <button class="send" id="sendBtn" type="button">发送</button>
      </div>
    </section>
  </div>
</div>
<script>
(function(){
  "use strict";
  var CONV=[
    {id:"miao",name:"何苗",color:"#9a8c98",last:"验证码回跳那个缺陷单我建好了",when:"14:20",unread:2,msgs:[
      {d:"in",t:"回归跑完了，短信和密码都没问题"},
      {d:"in",t:"验证码回跳那个缺陷单我建好了"}
    ]},
    {id:"fan",name:"沈一帆",color:"#e0a13c",last:"拼单的咖啡钱转你了",when:"12:05",unread:0,msgs:[
      {d:"in",t:"下午帮我带杯美式"},
      {d:"out",t:"好，老样子少冰"},
      {d:"in",t:"拼单的咖啡钱转你了"}
    ]},
    {id:"hang",name:"苏杭",color:"#7d9d6a",last:"空态插画第三稿发你邮箱了",when:"昨天",unread:0,msgs:[
      {d:"in",t:"空态插画第三稿发你邮箱了"}
    ]},
    {id:"boss",name:"产品小组",color:"#5a7d9e",last:"周一立项会材料中午前给我",when:"昨天",unread:0,msgs:[
      {d:"in",t:"周一立项会材料中午前给我"}
    ]}
  ];
  var cur=null;
  var weak=false;
  var list=document.getElementById("v-list");
  var chat=document.getElementById("v-chat");
  function renderConv(){
    var box=document.getElementById("convBox");
    box.innerHTML="";
    CONV.forEach(function(c){
      var row=document.createElement("div");
      row.className="conv";
      row.innerHTML='<span class="ava" style="background:'+c.color+'">'+c.name.charAt(0)+'</span><div class="mid"><b>'+c.name+(c.unread?'<span class="unread">'+c.unread+"</span>":"")+'</b><div class="last">'+c.last+'</div></div><span class="when">'+c.when+'</span>';
      row.addEventListener("click",function(){openChat(c)});
      box.appendChild(row);
    });
  }
  function openChat(c){
    cur=c;
    c.unread=0;
    document.getElementById("chatName").textContent=c.name;
    list.classList.remove("show");
    chat.classList.add("show");
    renderMsgs();
    renderConv();
  }
  function statusHtml(m){
    if(m.st==="sending")return '<div class="meta"><span>发送中…</span></div>';
    if(m.st==="failed")return '<div class="meta"><span>发送失败，内容已保留</span></div><button class="retry" type="button">重试</button>';
    if(m.st==="delivered")return '<div class="meta"><span>已送达 ✓✓</span></div>';
    return "";
  }
  function renderMsgs(){
    var box=document.getElementById("msgBox");
    box.innerHTML="";
    if(weak){
      var n=document.createElement("div");
      n.className="fnote";
      n.textContent="弱网模拟已开启：下一条消息将发送失败";
      box.appendChild(n);
    }
    cur.msgs.forEach(function(m,i){
      var b=document.createElement("div");
      b.className="m "+(m.d==="in"?"in":"out")+(m.st==="failed"?" failed":"");
      b.innerHTML="<div>"+m.t+"</div>"+statusHtml(m);
      var r=b.querySelector(".retry");
      if(r)r.addEventListener("click",function(){retry(i)});
      box.appendChild(b);
    });
    box.scrollTop=box.scrollHeight;
  }
  function retry(i){
    var m=cur.msgs[i];
    m.st="sending";
    renderMsgs();
    setTimeout(function(){m.st="delivered";renderMsgs()},700);
  }
  function send(){
    var input=document.getElementById("input");
    var text=input.value.trim();
    if(!text)return;
    input.value="";
    var m={d:"out",t:text,st:"sending"};
    cur.msgs.push(m);
    cur.last=text;
    renderMsgs();
    setTimeout(function(){
      if(weak){m.st="failed"}else{m.st="delivered"}
      renderMsgs();
      renderConv();
    },700);
  }
  document.getElementById("sendBtn").addEventListener("click",send);
  document.getElementById("input").addEventListener("keydown",function(ev){if(ev.key==="Enter")send()});
  document.getElementById("backBtn").addEventListener("click",function(){
    chat.classList.remove("show");
    list.classList.add("show");
  });
  var weakBox=document.getElementById("weakBox");
  function toggleWeak(){
    weak=!weak;
    weakBox.classList.toggle("on",weak);
    weakBox.setAttribute("aria-checked",String(weak));
    renderMsgs();
  }
  weakBox.addEventListener("click",toggleWeak);
  weakBox.addEventListener("keydown",function(ev){if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();toggleWeak()}});
  renderConv();
})();
</script>
</body>
</html>
