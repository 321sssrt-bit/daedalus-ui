<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>拾陶 · 商品详情</title>
<style>
:root{
  --coal:#201d1a; --panel:#2b2723; --text:#efe8dc; --muted:#9a9084;
  --line:#3d372f; --copper:#c98f4e; --copper-deep:#a9742f;
  --serif:"Songti SC","STSong","SimSun",serif;
  --sans:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--coal);color:var(--text);font:15px/1.7 var(--sans)}
.wrap{max-width:1120px;margin:0 auto;padding:34px 28px 70px;display:grid;grid-template-columns:1fr 420px;gap:40px}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:18px;display:grid;place-items:center;min-height:520px}
.crumb{grid-column:1/-1;color:var(--muted);font-size:13px}
.crumb b{color:var(--text);font-weight:600}
.info h1{font-family:var(--serif);font-size:32px;margin:4px 0 8px;font-weight:600}
.tagline{color:var(--muted);margin:0 0 18px;font-size:14px}
.price{font-size:30px;font-weight:800;color:var(--copper)}
.price small{font-size:14px;color:var(--muted);font-weight:400;margin-left:8px}
.group{margin-top:22px}
.group .gname{font-size:13px;color:var(--muted);margin-bottom:9px}
.chips{display:flex;gap:9px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;color:var(--text);border-radius:9px;padding:8px 16px;font:inherit;font-size:13px;cursor:pointer;transition:border-color .15s,background .15s}
.chip:hover{border-color:var(--copper)}
.chip.on{border-color:var(--copper);background:#c98f4e1f;color:var(--copper)}
.chip:focus-visible{outline:2px solid var(--copper);outline-offset:2px}
.qty{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.qty button{width:38px;height:38px;border:0;background:transparent;color:var(--text);font-size:17px;cursor:pointer}
.qty button:hover{background:var(--panel)}
.qty button:disabled{color:#5c554b;cursor:not-allowed}
.qty span{width:44px;display:grid;place-items:center;font-weight:700;border-left:1px solid var(--line);border-right:1px solid var(--line)}
.buy{display:flex;gap:12px;margin-top:30px}
.primary{flex:1;height:50px;border:0;border-radius:10px;background:var(--copper);color:#241708;font:700 16px var(--sans);cursor:pointer;transition:background .16s}
.primary:hover{background:var(--copper-deep);color:#f7ead8}
.primary:focus-visible{outline:3px solid #c98f4e55;outline-offset:2px}
.second{height:50px;padding:0 22px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--text);font:600 14px var(--sans);cursor:pointer}
.second:hover{border-color:var(--copper);color:var(--copper)}
.msg{margin-top:14px;font-size:13px;min-height:20px;color:var(--copper)}
.service{margin-top:20px;border-top:1px solid var(--line);padding-top:14px;color:var(--muted);font-size:12px;display:flex;gap:18px;flex-wrap:wrap}
@media (max-width:940px){.wrap{grid-template-columns:1fr}.stage{min-height:320px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main class="wrap">
  <p class="crumb">拾陶 / 饮器 / <b>山月杯</b></p>
  <section class="stage" aria-label="商品主视觉">
    <svg width="300" height="300" viewBox="0 0 300 300" aria-hidden="true">
      <ellipse cx="150" cy="250" rx="92" ry="14" fill="#000000" opacity="0.35"/>
      <path d="M85 92 C85 78 215 78 215 92 L206 226 C204 244 96 244 94 226 Z" fill="#c98f4e"/>
      <path d="M97 100 L102 216 C104 228 196 228 198 216 L203 100 Z" fill="#b0793c" opacity="0.55"/>
      <ellipse cx="150" cy="92" rx="65" ry="12" fill="#e8cfab"/>
      <path d="M215 120 C245 122 245 172 213 176" fill="none" stroke="#c98f4e" stroke-width="12" stroke-linecap="round"/>
      <circle cx="150" cy="170" r="26" fill="none" stroke="#8f5f28" stroke-width="5" opacity="0.7"/>
      <path d="M138 170 Q150 154 162 170" fill="none" stroke="#8f5f28" stroke-width="5" opacity="0.7"/>
    </svg>
  </section>
  <section class="info">
    <h1>山月杯 · 手作粗陶</h1>
    <p class="tagline">柴窑烧成，釉面留火痕。每一只的纹路都不同，装茶装酒都稳当。</p>
    <div class="price" id="priceBox">¥ 128<small id="priceNote">260ml · 单只装</small></div>
    <div class="group">
      <div class="gname">釉色 · 三选一</div>
      <div class="chips" id="glaze">
        <button class="chip on" type="button" data-v="落灰釉">落灰釉</button>
        <button class="chip" type="button" data-v="铁锈红">铁锈红</button>
        <button class="chip" type="button" data-v="米白">米白</button>
      </div>
    </div>
    <div class="group">
      <div class="gname">容量 · 二选一</div>
      <div class="chips" id="size">
        <button class="chip on" type="button" data-v="260" data-price="128">260ml · ¥128</button>
        <button class="chip" type="button" data-v="380" data-price="158">380ml · ¥158</button>
      </div>
    </div>
    <div class="group">
      <div class="gname">数量</div>
      <div class="qty">
        <button type="button" id="minus" aria-label="减少">−</button>
        <span id="qtyVal">1</span>
        <button type="button" id="plus" aria-label="增加">＋</button>
      </div>
    </div>
    <div class="buy">
      <button class="primary" id="buyBtn" type="button">立即购买</button>
      <button class="second" id="bagBtn" type="button">先放入袋</button>
    </div>
    <p class="msg" id="msg" role="status"></p>
    <div class="service"><span>顺丰包邮</span><span>7 天无理由</span><span>破损包赔</span></div>
  </section>
</main>
<script>
(function(){
  "use strict";
  var glaze="落灰釉";
  var size="260";
  var price=128;
  var qty=1;
  var qtyVal=document.getElementById("qtyVal");
  var minus=document.getElementById("minus");
  var plus=document.getElementById("plus");
  var priceBox=document.getElementById("priceBox");
  var priceNote=document.getElementById("priceNote");
  var msg=document.getElementById("msg");
  function pick(group,cb){
    group.addEventListener("click",function(ev){
      var chip=ev.target.closest(".chip");
      if(!chip)return;
      group.querySelectorAll(".chip").forEach(function(c){c.classList.remove("on")});
      chip.classList.add("on");
      cb(chip);
    });
  }
  pick(document.getElementById("glaze"),function(chip){glaze=chip.getAttribute("data-v")});
  pick(document.getElementById("size"),function(chip){
    size=chip.getAttribute("data-v");
    price=Number(chip.getAttribute("data-price"));
    priceBox.firstChild.nodeValue="¥ "+price;
    priceNote.textContent=size+"ml · 单只装";
  });
  function step(n){
    qty=Math.min(9,Math.max(1,qty+n));
    qtyVal.textContent=qty;
    minus.disabled=qty<=1;
    plus.disabled=qty>=9;
  }
  minus.addEventListener("click",function(){step(-1)});
  plus.addEventListener("click",function(){step(1)});
  step(0);
  document.getElementById("buyBtn").addEventListener("click",function(){
    msg.textContent="已为你备好 "+qty+" 只 "+glaze+" "+size+"ml，合计 ¥"+price*qty+"，正在去结算…";
  });
  document.getElementById("bagBtn").addEventListener("click",function(){
    msg.textContent=qty+" 只 "+glaze+" "+size+"ml 已放入袋，随时回来结算。";
  });
})();
</script>
</body>
</html>
