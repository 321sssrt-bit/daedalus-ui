<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>钱袋 · 钱包首页</title>
<style>
:root{
  --stage:#101c2c; --panel:#182738; --panel-line:#24374c; --text:#e9eef5;
  --muted:#8ba0b5; --jade:#2fae8c; --jade-deep:#1f8a6d; --amber:#e8b34b;
  --sans:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:#0a121e;font:14px/1.6 var(--sans);display:grid;place-items:center;min-height:100vh;padding:20px 10px}
.phone{width:390px;max-width:100%;height:844px;background:var(--stage);border:10px solid #05080d;border-radius:44px;overflow:hidden;position:relative;box-shadow:0 30px 80px #00000088}
.notch{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:120px;height:26px;background:#05080d;border-radius:999px;z-index:9}
.scr{height:100%;display:flex;flex-direction:column;overflow-y:auto;padding:56px 18px 0}
.scr::-webkit-scrollbar{width:0}
.hi{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px}
.hi b{color:var(--text);font-size:15px}
.balance{margin-top:16px;background:linear-gradient(135deg,var(--jade) 0%,var(--jade-deep) 100%);border-radius:20px;padding:20px;color:#fff;position:relative;overflow:hidden}
.balance:after{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:#ffffff14}
.balance .k{font-size:12px;opacity:.85}
.balance .v{font:700 34px/1.3 var(--mono);margin:4px 0 10px}
.balance .row{display:flex;justify-content:space-between;font-size:12px;opacity:.9}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0 6px}
.act{border:0;background:var(--panel);border-radius:14px;padding:12px 4px;color:var(--text);cursor:pointer;display:grid;justify-items:center;gap:6px;font:12px var(--sans)}
.act i{width:34px;height:34px;border-radius:50%;background:#20344a;display:grid;place-items:center;font-style:normal;font-size:15px;color:var(--amber)}
.act:hover{background:#1d3048}
.act:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
.sec{display:flex;justify-content:space-between;align-items:center;margin:16px 2px 8px}
.sec h2{font-size:15px;margin:0;color:var(--text)}
.sec a{color:var(--jade);font-size:12px;text-decoration:none}
.flow{background:var(--panel);border:1px solid var(--panel-line);border-radius:16px;overflow:hidden;margin-bottom:14px}
.f{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid #1e2f42}
.f:last-child{border-bottom:0}
.f .l{display:flex;gap:11px;align-items:center}
.f .ic{width:34px;height:34px;border-radius:10px;background:#20344a;display:grid;place-items:center;font-size:14px}
.f b{display:block;font-size:13px;font-weight:600;color:var(--text)}
.f span{font-size:11px;color:var(--muted)}
.amt{font:600 14px var(--mono)}
.amt.plus{color:var(--jade)}
.amt.minus{color:var(--text)}
.tabbar{position:sticky;bottom:0;margin:0 -18px;background:#0e1927ee;backdrop-filter:blur(6px);border-top:1px solid var(--panel-line);display:grid;grid-template-columns:repeat(4,1fr);padding:8px 6px 14px}
.tabbar button{border:0;background:none;color:var(--muted);font:11px var(--sans);cursor:pointer;display:grid;justify-items:center;gap:3px;padding:4px}
.tabbar button.on{color:var(--jade)}
.tabbar .ti{font-size:17px}
.toast{position:absolute;left:50%;bottom:86px;transform:translateX(-50%);background:#e9eef5;color:#101c2c;border-radius:999px;padding:9px 18px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="phone">
  <div class="notch" aria-hidden="true"></div>
  <div class="scr">
    <div class="hi"><span>早上好，</span><b>林晚</b><span>☀</span></div>
    <section class="balance">
      <div class="k">总余额（元）</div>
      <div class="v">¥ 8,326.45</div>
      <div class="row"><span>活期 6,102.10</span><span>零钱通 2,224.35</span></div>
    </section>
    <section class="acts">
      <button class="act" type="button" data-say="已发起转账，选择收款人即可继续"><i>转</i>转账</button>
      <button class="act" type="button" data-say="收款码已生成，可分享给对方"><i>收</i>收款</button>
      <button class="act" type="button" data-say="扫码支付已就绪"><i>扫</i>扫一扫</button>
      <button class="act" type="button" data-say="生活缴费：水电燃气话费"><i>缴</i>缴费</button>
    </section>
    <div class="sec"><h2>最近进出</h2><a href="#all">全部流水</a></div>
    <section class="flow">
      <div class="f"><div class="l"><span class="ic">☕</span><div><b>山脚咖啡</b><span>今天 08:12 · 扫码支付</span></div></div><span class="amt minus">- 26.00</span></div>
      <div class="f"><div class="l"><span class="ic">薪</span><div><b>工资入账</b><span>昨天 10:00 · 青禾网络</span></div></div><span class="amt plus">+ 12,400.00</span></div>
      <div class="f"><div class="l"><span class="ic">超</span><div><b>巷口超市</b><span>08-13 19:40 · 扫码支付</span></div></div><span class="amt minus">- 83.50</span></div>
      <div class="f"><div class="l"><span class="ic">转</span><div><b>转给 沈一帆</b><span>08-12 21:05 · 拼单餐费</span></div></div><span class="amt minus">- 66.00</span></div>
    </section>
    <nav class="tabbar" aria-label="底部导航">
      <button class="on" type="button"><span class="ti">◉</span>钱包</button>
      <button type="button"><span class="ti">▤</span>账单</button>
      <button type="button"><span class="ti">✦</span>理财</button>
      <button type="button"><span class="ti">☺</span>我的</button>
    </nav>
  </div>
  <div class="toast" id="toast" role="status"></div>
</div>
<script>
(function(){
  "use strict";
  var toast=document.getElementById("toast");
  var timer=null;
  document.querySelectorAll(".act").forEach(function(btn){
    btn.addEventListener("click",function(){
      toast.textContent=btn.getAttribute("data-say");
      toast.classList.add("show");
      if(timer)clearTimeout(timer);
      timer=setTimeout(function(){toast.classList.remove("show")},1800);
    });
  });
  document.querySelectorAll(".tabbar button").forEach(function(btn){
    btn.addEventListener("click",function(){
      document.querySelectorAll(".tabbar button").forEach(function(b){b.classList.remove("on")});
      btn.classList.add("on");
    });
  });
})();
</script>
</body>
</html>
