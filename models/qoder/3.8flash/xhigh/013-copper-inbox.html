<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>站务信箱 · 收件</title>
<style>
:root{
  --paper:#f6f4f2;--pane:#fffdfa;--ink:#221f1c;--muted:#7d766e;--line:#e6e0d8;
  --copper:#a2603f;--copper-2:#8a4f33;--sage:#5f7d63;--star:#c9a227;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:13.5px/1.65 system-ui,"Microsoft YaHei",sans-serif}
.app{max-width:1300px;margin:0 auto;padding:20px 24px 40px}
.top{display:flex;align-items:center;gap:14px;padding-bottom:14px;border-bottom:2px solid var(--ink);margin-bottom:0}
.top h1{margin:0;font:800 20px/1.3 system-ui;letter-spacing:.02em}
.top .badge{font:600 11px/1 ui-monospace,Consolas,monospace;letter-spacing:.1em;color:#fff;background:var(--copper);padding:5px 8px;border-radius:3px}
.top .me{margin-left:auto;font-size:12.5px;color:var(--muted)}
.shell{display:grid;grid-template-columns:158px 330px 1fr;min-height:560px}
aside{border-right:1px solid var(--line);padding:16px 10px 18px 0}
.folders{display:grid;gap:2px}
.folders button{
  display:flex;align-items:center;gap:8px;width:100%;appearance:none;cursor:pointer;font:inherit;font-size:13px;
  background:transparent;border:0;border-radius:5px;padding:9px 10px;color:var(--muted);text-align:left;
}
.folders button svg{width:14px;height:14px;flex:none}
.folders button .n{margin-left:auto;font:600 11px/1 ui-monospace,Consolas,monospace;color:var(--ink)}
.folders button:hover{background:#efe9e2;color:var(--ink)}
.folders button[aria-current="true"]{background:var(--ink);color:#fff;font-weight:600}
.folders button[aria-current="true"] .n{color:#fff}
.folders button:focus-visible{outline:2px solid var(--copper);outline-offset:1px}
aside .tagline{margin:20px 0 0;padding:12px 10px 0;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);line-height:1.7}
.list-col{border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.filters{padding:14px 14px 10px;display:grid;gap:10px;border-bottom:1px solid var(--line)}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--pane);border-radius:6px;padding:0 10px}
.search svg{width:14px;height:14px;color:var(--muted);flex:none}
.search input{flex:1;min-width:0;border:0;background:transparent;font:inherit;padding:10px 0;color:var(--ink)}
.search input:focus{outline:0}
.search:focus-within{border-color:var(--copper);box-shadow:0 0 0 3px #a2603f24}
.chips{display:flex;gap:6px}
.chips button{appearance:none;cursor:pointer;font:inherit;font-size:12px;border:1px solid var(--line);background:var(--pane);border-radius:999px;padding:6px 11px;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--copper);border-color:var(--copper);color:#fff;font-weight:600}
.chips button:focus-visible{outline:2px solid var(--copper);outline-offset:2px}
.list{overflow-y:auto;max-height:520px}
.mail{
  display:grid;grid-template-columns:auto 1fr auto;gap:10px;width:100%;text-align:left;appearance:none;
  border:0;border-bottom:1px solid var(--line);background:transparent;padding:12px 14px;cursor:pointer;font:inherit;color:inherit;
  border-left:4px solid transparent;
}
.mail:hover{background:#f2ece5}
.mail[aria-selected="true"]{background:var(--pane);border-left-color:var(--copper)}
.mail.unread{border-left-color:var(--ink)}
.mail .dot{width:7px;height:7px;border-radius:50%;background:var(--copper);margin-top:7px;opacity:0}
.mail.unread .dot{opacity:1}
.mail .from{font-size:12.5px;color:var(--muted)}
.mail.unread .from{color:var(--ink);font-weight:700}
.mail .subj{font-size:13.5px;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mail.unread .subj{font-weight:700}
.mail .prev{margin:3px 0 0;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mail .right{display:grid;justify-items:end;gap:7px;align-content:start}
.mail time{font:500 10.5px/1.4 ui-monospace,Consolas,monospace;color:var(--muted);white-space:nowrap}
.star{appearance:none;border:0;background:transparent;cursor:pointer;padding:2px;color:#c8c0b6}
.star svg{width:15px;height:15px;display:block}
.star[aria-pressed="true"]{color:var(--star)}
.star[aria-pressed="true"] svg path{fill:currentColor}
.star:focus-visible{outline:2px solid var(--copper);outline-offset:1px;border-radius:4px}
.empty-list{padding:40px 18px;text-align:center;color:var(--muted);font-size:13px}
.read{padding:22px 28px 26px;min-width:0;display:flex;flex-direction:column}
.read-head h2{margin:0;font:800 21px/1.4 system-ui;letter-spacing:.01em}
.read-head .meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0 0;font-size:12.5px;color:var(--muted)}
.read-head .ava{width:30px;height:30px;border-radius:50%;background:var(--copper);color:#fff;display:grid;place-items:center;font:700 12px/1 system-ui;flex:none}
.read-head .meta b{color:var(--ink);font-weight:600}
.read-head .tags{display:flex;gap:6px;margin-left:auto}
.read-head .tags i{font-style:normal;font:600 10.5px/1 ui-monospace,Consolas,monospace;letter-spacing:.06em;border:1px solid var(--line);border-radius:3px;padding:5px 7px;color:var(--muted)}
.body-text{margin:20px 0 0;font-size:14px;line-height:1.85;max-width:66ch}
.body-text p{margin:0 0 14px}
.quote{margin:18px 0;padding:12px 16px;border-left:3px solid var(--line);background:#f4efe9;color:#544d46;font-size:13px}
.quote span{display:block;font:500 11px/1.6 ui-monospace,Consolas,monospace;color:var(--muted);margin-bottom:5px}
.kv{margin:18px 0 0;display:grid;grid-template-columns:repeat(3,auto);gap:8px 26px;justify-content:start;font-size:12.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:700;font-family:ui-monospace,Consolas,monospace}
.acts{margin-top:auto;padding-top:22px;display:flex;gap:8px;flex-wrap:wrap}
.acts button{appearance:none;cursor:pointer;font:inherit;font-size:13px;border-radius:6px;padding:11px 17px;border:1px solid var(--line);background:var(--pane);color:var(--ink)}
.acts button.pri{background:var(--copper);border-color:var(--copper);color:#fff;font-weight:600}
.acts button.pri:hover{background:var(--copper-2);border-color:var(--copper-2)}
.acts button:hover{border-color:var(--copper);color:var(--copper)}
.acts button.pri:hover{color:#fff}
.acts button:focus-visible{outline:2px solid var(--copper);outline-offset:2px}
.status{margin-left:auto;font-size:12.5px;color:var(--sage);align-self:center}
[hidden]{display:none!important}
@media (max-width:1080px){
  .shell{grid-template-columns:140px 1fr}
  aside{padding-right:8px}
  .read{grid-column:1 / -1;border-top:1px solid var(--line)}
  .kv{grid-template-columns:repeat(2,auto)}
}
@media (max-width:768px){
  .app{padding:14px 14px 30px}
  .shell{grid-template-columns:1fr}
  aside{border-right:0;border-bottom:1px solid var(--line);padding:10px 0}
  .folders{grid-auto-flow:column;overflow-x:auto}
  aside .tagline{display:none}
  .list-col{border-right:0}
  .list{max-height:280px}
  .read{padding:18px 4px 20px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>站务信箱</h1><span class="badge" id="unreadBadge">2 未读</span>
    <span class="me">收件人 沈砚舟 · D-04 席位 · 每 2 分钟同步</span>
  </header>

  <div class="shell">
    <aside>
      <div class="folders" id="folders" role="group" aria-label="文件夹"></div>
      <p class="tagline">站务信箱只受理与本班相关的事项。<br>急事请走内线 8120，不要等回信。</p>
    </aside>

    <section class="list-col">
      <div class="filters">
        <div class="search">
          <svg viewBox="0 0 14 14" aria-hidden="true"><circle cx="6" cy="6" r="4.4" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M9.4 9.4 13 13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <input id="q" type="search" placeholder="搜发信人、事由或工单号" aria-label="搜索信件">
        </div>
        <div class="chips" role="group" aria-label="快速过滤">
          <button type="button" data-c="all" aria-pressed="true">全部</button>
          <button type="button" data-c="unread" aria-pressed="false">未读</button>
          <button type="button" data-c="star" aria-pressed="false">已星标</button>
        </div>
      </div>
      <div class="list" id="list" role="listbox" aria-label="信件列表"></div>
    </section>

    <article class="read" id="read"></article>
  </div>
</div>

<script>
(function(){
  'use strict';
  var MAIL = [
    {id:'M-8841',folder:'inbox',from:'调度中心 · 郑明轩',t:'21:38',subj:'N-23:00 机场直达延误 6 分钟，请回一下站台情况',prev:'郑调度：受东门道口影响，预计 23:06 到岗，请在站台先放客…',body:['受东门道口临时管制影响，本班预计 23:06 到站，比表定晚 6 分钟。','请先安排站台放客顺序，若届时仍未到岗，按预案改由区间车接管，并把乘客引导至 2 站台。','回信请附实际到站时间与上客人数，用于今晚正点率口径。'],quote:{who:'郑明轩 · 21:20',text:'补充：如果 23:10 还没到，直接启动 B 预案，不必再等我确认。'},kv:[['关联班次','N-23:00'],['需要回复','是 · 今晚'],['工单','无']]},
    {id:'M-8840',folder:'inbox',from:'设备科 · 梁若谷',t:'20:52',subj:'3 号车胎压告警已解除，附上更换记录',prev:'左前轮胎压传感器已换新，连续两次巡检正常，先恢复可派。',body:['左前轮胎压传感器已更换为同型号新件，20:20 与 20:45 两次巡检读数一致。','3 号车恢复可派状态，请在今晚排班中重新纳入。','附件记录已同步到检修看板 W-313。'],kv:[['关联车辆','3 号车'],['需要回复','否'],['工单','W-313']]},
    {id:'M-8839',folder:'inbox',from:'人事 · 柯志明',t:'19:14',subj:'下月起夜班津贴口径调整，先看这一页',prev:'调整只影响跨 00:00 的班次，请在本周内确认席位名单。',body:['自 9 月 1 日起，跨零点班次的津贴按 1.5 个班次计算，不跨零点的维持原口径。','请在本周内核对你名下 D 系列席位名单，逾期视为无异议。'],kv:[['生效','09-01'],['需要回复','是 · 本周'],['工单','无']]},
    {id:'M-8836',folder:'inbox',from:'乘客事务 · 周允',t:'17:40',subj:'遗失物品一件：深灰帆布包（环湖线内圈）',prev:'乘客 20:55 在环湖内圈落下一只帆布包，已在失物柜 12 号。',body:['乘客来电称 20:55 左右在环湖线内圈落下一只深灰帆布包，内有笔记本与一张就诊卡。','包已在失物柜 12 号，请当班同事核对领取人身份后放行。'],quote:{who:'乘客 王女士 · 17:22',text:'里面有一张下周三的复查单，其他都不重要，能找回来就太好了。'},kv:[['存放','失物柜 12 号'],['需要回复','否'],['工单','L-2207']]},
    {id:'M-8830',folder:'star',from:'值班经理 · 马文柏',t:'昨天',subj:'交接遗留 3 条，明天上午想跟你对一条',prev:'第二条涉及夜间照明延时，需要你和设备科一起定。',body:['交接清单里第三条（照明回路延时）需要你和设备科一起定参数，明天上午十点我有空。','其余两条我已处理完毕。'],kv:[['需要回复','是 · 明早'],['地点','三号会议室']]},
    {id:'M-8826',folder:'archive',from:'安全科',t:'08-25',subj:'月度安全培训签到表已归档',prev:'本期应到 42 人、实到 40 人，缺席 2 人已安排补训。',body:['本期应到 42 人、实到 40 人，缺席 2 人已安排在 08-29 补训。','签到表与影像资料已归档，无需回复。'],kv:[['状态','已归档']]},
    {id:'M-8819',folder:'archive',from:'财务 · 报销组',t:'08-24',subj:'7 月夜班加班费已入账',prev:'金额与明细见附件，7 个工作日内可提出异议。',body:['7 月夜班加班费已按班次口径入账，明细见附件。','如有异议请在 7 个工作日内提出。'],kv:[['状态','已归档']]},
    {id:'M-8810',folder:'draft',from:'我自己（草稿）',t:'草稿',subj:'关于夜区间发车间隔的建议',prev:'建议把 23:40 之后的间隔从 25 分钟放宽到 35 分钟…',body:['建议把 23:40 之后的间隔从 25 分钟放宽到 35 分钟，同时保留一趟备车。','（未发送）'],kv:[['状态','草稿']]}
  ];
  var FOLDERS = [
    {id:'inbox',label:'收件箱',icon:'<path d="M2 3h10v8H2z" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M2 7.5h3l1 1.5h2l1-1.5h3" fill="none" stroke="currentColor" stroke-width="1.5"/>'},
    {id:'star',label:'星标',icon:'<path d="M7 1.5l1.7 3.4 3.8.5-2.8 2.6.7 3.7L7 10.1 3.6 11.7l.7-3.7L1.5 5.4l3.8-.5z" fill="none" stroke="currentColor" stroke-width="1.4"/>'},
    {id:'archive',label:'已归档',icon:'<path d="M1.5 3h11v2.5h-11z" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M3 5.5v6.5h8V5.5" fill="none" stroke="currentColor" stroke-width="1.4"/>'},
    {id:'draft',label:'草稿',icon:'<path d="M3 11.5h8M2.5 2.5h9l-1 9H3.5z" fill="none" stroke="currentColor" stroke-width="1.4"/>'}
  ];
  var READ = ['M-8840','M-8836','M-8830','M-8826','M-8819','M-8810'];
  var STARR = ['M-8841','M-8830','M-8836'];
  var folder = 'inbox', chip = 'all', query = '', current = 'M-8841';
  var folders = document.getElementById('folders');
  var list = document.getElementById('list');
  var read = document.getElementById('read');

  FOLDERS.forEach(function(f){
    var b = document.createElement('button');
    b.type = 'button';
    b.innerHTML = '<svg viewBox="0 0 14 14" aria-hidden="true">' + f.icon + '</svg>' + f.label + '<span class="n">' + MAIL.filter(function(m){ return m.folder === f.id; }).length + '</span>';
    b.addEventListener('click', function(){
      folder = f.id;
      Array.prototype.forEach.call(folders.children, function(x){ x.setAttribute('aria-current','false'); });
      b.setAttribute('aria-current','true');
      paintList();
    });
    if (f.id === 'inbox'){ b.setAttribute('aria-current','true'); } else { b.setAttribute('aria-current','false'); }
    folders.appendChild(b);
  });

  function matches(m){
    if (m.folder !== folder){ return false; }
    if (chip === 'unread' && READ.indexOf(m.id) >= 0){ return false; }
    if (chip === 'star' && STARR.indexOf(m.id) < 0){ return false; }
    if (query && (m.subj + m.from + m.prev + m.id).toLowerCase().indexOf(query.toLowerCase()) < 0){ return false; }
    return true;
  }
  function paintList(){
    var rows = MAIL.filter(matches);
    list.innerHTML = '';
    if (!rows.length){
      list.innerHTML = '<div class="empty-list">这里没有符合条件的信。<br>换个关键词，或点回「全部」。</div>';
      return;
    }
    rows.forEach(function(m){
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'mail' + (READ.indexOf(m.id) < 0 ? ' unread' : '') + (m.id === current ? '' : '');
      if (m.id === current){ b.setAttribute('aria-selected','true'); }
      b.innerHTML = '<span class="dot" aria-hidden="true"></span>' +
        '<span><span class="from">' + m.from + '</span><span class="subj">' + m.subj + '</span><p class="prev">' + m.prev + '</p></span>' +
        '<span class="right"><time>' + m.t + '</time><span class="star" role="button" tabindex="0" aria-label="星标" aria-pressed="' + (STARR.indexOf(m.id) >= 0) + '"></span></span>';
      b.querySelector('.star').innerHTML = starSvg();
      b.addEventListener('click', function(){ current = m.id; paintList(); paintRead(); });
      var star = b.querySelector('.star');
      function toggle(event){
        event.stopPropagation();
        var i = STARR.indexOf(m.id);
        if (i >= 0){ STARR.splice(i, 1); } else { STARR.push(m.id); }
        paintList();
        if (folder === 'star'){ paintList(); }
      }
      star.addEventListener('click', toggle);
      star.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); toggle(e); } });
      list.appendChild(b);
    });
    document.getElementById('unreadBadge').textContent = MAIL.filter(function(m){ return READ.indexOf(m.id) < 0 && m.folder === 'inbox'; }).length + ' 未读';
  }
  function starSvg(){
    return '<svg viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1.6l1.7 3.5 3.8.5-2.8 2.7.7 3.8L7 10.5 3.6 12.1l.7-3.8L1.5 5.6l3.8-.5z" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>';
  }
  function paintRead(){
    var m = MAIL.filter(function(x){ return x.id === current; })[0];
    if (!m){ read.innerHTML = '<p style="color:var(--muted)">左侧选一封，这里读全文。</p>'; return; }
    var body = m.body.map(function(p){ return '<p>' + p + '</p>'; }).join('');
    var quote = m.quote ? '<div class="quote"><span>' + m.quote.who + ' 写道</span>' + m.quote.text + '</div>' : '';
    var kv = m.kv ? '<dl class="kv">' + m.kv.map(function(p){ return '<dt>' + p[0] + '</dt><dd>' + p[1] + '</dd>'; }).join('') + '</dl>' : '';
    read.innerHTML =
      '<div class="read-head"><h2>' + m.subj + '</h2>' +
      '<div class="meta"><span class="ava" aria-hidden="true">' + m.from.charAt(0) + '</span><b>' + m.from + '</b><span>发于 ' + m.t + '</span><span>编号 ' + m.id + '</span>' +
      '<span class="tags"><i>' + folderName(m.folder) + '</i>' + (STARR.indexOf(m.id) >= 0 ? '<i style="color:#c9a227;border-color:#c9a227">已星标</i>' : '') + '</span></div></div>' +
      '<div class="body-text">' + body + quote + kv + '</div>' +
      '<div class="acts"><button class="pri" type="button" id="a-reply">回复</button><button type="button" id="a-star">' + (STARR.indexOf(m.id) >= 0 ? '取消星标' : '加星标') + '</button>' +
      '<button type="button" id="a-arch">归档</button><button type="button" id="a-unread">标为未读</button><span class="status" id="a-status"></span></div>';
    document.getElementById('a-reply').addEventListener('click', function(){
      document.getElementById('a-status').textContent = '草稿已在本机保存，可在「草稿」夹继续写';
      if (READ.indexOf(m.id) < 0){ READ.push(m.id); }
      paintList();
    });
    document.getElementById('a-star').addEventListener('click', function(){
      var i = STARR.indexOf(m.id);
      if (i >= 0){ STARR.splice(i, 1); } else { STARR.push(m.id); }
      paintList(); paintRead();
    });
    document.getElementById('a-arch').addEventListener('click', function(){
      m.folder = 'archive';
      if (READ.indexOf(m.id) < 0){ READ.push(m.id); }
      document.getElementById('a-status').textContent = '已归档到「已归档」';
      paintList();
    });
    document.getElementById('a-unread').addEventListener('click', function(){
      var i = READ.indexOf(m.id);
      if (i >= 0){ READ.splice(i, 1); }
      document.getElementById('a-status').textContent = i >= 0 ? '已标为未读' : '这封已经是未读';
      paintList();
    });
  }
  function folderName(id){
    var f = FOLDERS.filter(function(x){ return x.id === id; })[0];
    return f ? f.label : id;
  }

  Array.prototype.forEach.call(document.querySelectorAll('.chips button'), function(b){
    b.addEventListener('click', function(){
      chip = b.dataset.c;
      Array.prototype.forEach.call(document.querySelectorAll('.chips button'), function(x){ x.setAttribute('aria-pressed', String(x === b)); });
      paintList();
    });
  });
  document.getElementById('q').addEventListener('input', function(){
    query = this.value.trim();
    paintList();
  });

  paintList();
  paintRead();
})();
</script>
</body>
</html>
