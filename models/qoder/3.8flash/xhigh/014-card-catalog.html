<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>城南馆 · 卡片目录检索</title>
<style>
:root{
  --page:#e9edf1;--card:#f7fafc;--rule:#bcd3e6;--ink:#1c2a33;--muted:#677884;
  --blue:#1c5d8a;--red:#a5443a;--line:#d3dde5;--tab:#e2ebf2;
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:14px/1.65 system-ui,"Microsoft YaHei",sans-serif}
.desk{max-width:1080px;margin:0 auto;padding:26px 30px 54px}
.head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:14px}
.head h1{margin:0;font:800 22px/1.3 system-ui;letter-spacing:.1em}
.head .sub{font:500 11px/1 ui-monospace,Consolas,monospace;letter-spacing:.14em;color:var(--muted);margin-bottom:3px}
.head .cnt{margin-left:auto;font:600 12px/1 ui-monospace,Consolas,monospace;color:var(--blue);letter-spacing:.08em;margin-bottom:3px}
.search{margin:18px 0 0;display:grid;grid-template-columns:1fr auto;gap:10px}
.box{display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--ink);padding:0 14px}
.box svg{width:16px;height:16px;color:var(--muted);flex:none}
.box input{flex:1;min-width:0;border:0;background:transparent;font:600 16px/1 ui-monospace,Consolas,monospace;padding:16px 0;color:var(--ink);letter-spacing:.04em}
.box input:focus{outline:0}
.box button{appearance:none;cursor:pointer;border:0;background:var(--ink);color:#fff;font:inherit;font-size:12.5px;font-weight:600;padding:14px 22px;letter-spacing:.1em}
.box button:hover{background:var(--blue)}
.box button:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.clear{appearance:none;cursor:pointer;border:1.5px solid var(--line);background:var(--card);color:var(--muted);font:inherit;font-size:13px;padding:0 18px}
.clear:hover{border-color:var(--red);color:var(--red)}
.clear:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.tabs{display:flex;gap:6px;margin:16px 0 0;flex-wrap:wrap}
.tabs button{
  appearance:none;cursor:pointer;font:inherit;font-size:12.5px;border:1px solid var(--line);border-bottom:0;
  background:var(--tab);color:var(--muted);padding:8px 16px 10px;border-radius:6px 6px 0 0;position:relative;top:2px;
}
.tabs button[aria-pressed="true"]{background:var(--card);border-color:var(--ink);color:var(--ink);font-weight:700;top:0;padding-bottom:12px}
.tabs button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.pane{background:var(--card);border:1.5px solid var(--ink);padding:0}
.hold{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 20px;border-bottom:1px dashed var(--rule);font-size:12.5px;color:var(--muted);background:#eef4f9}
.hold .chip{border:1px solid var(--blue);color:var(--blue);background:#fff;border-radius:999px;padding:4px 11px;font:600 11.5px/1 ui-monospace,Consolas,monospace;letter-spacing:.04em}
.hold .x{cursor:pointer;appearance:none;border:0;background:transparent;color:inherit;font:inherit;text-decoration:underline dotted;padding:0}
.empty{display:grid;grid-template-columns:230px 1fr;gap:28px;padding:34px 30px 32px;align-items:center}
.empty svg{width:230px;height:170px}
.empty h2{margin:0;font:800 24px/1.4 system-ui;letter-spacing:.01em}
.empty h2 b{color:var(--red)}
.empty p{margin:10px 0 0;color:var(--muted);max-width:52ch;font-size:13.5px}
.sugs{margin:22px 0 0;display:grid;gap:10px}
.sug{
  display:grid;grid-template-columns:24px 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;
  appearance:none;cursor:pointer;font:inherit;background:#fff;border:1px solid var(--line);border-left:4px solid var(--blue);
  padding:12px 14px;color:var(--ink);
}
.sug:hover{border-color:var(--blue);background:#f2f7fb}
.sug:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.sug .n{font:700 12px/1 ui-monospace,Consolas,monospace;color:var(--blue)}
.sug b{font-size:13.5px;font-weight:700}
.sug span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.sug .go{font:600 11px/1 ui-monospace,Consolas,monospace;color:var(--muted);letter-spacing:.1em}
.results{padding:8px 0}
.cat{
  display:grid;grid-template-columns:92px 1fr auto;gap:16px;align-items:baseline;padding:14px 22px;
  border-bottom:1px dashed var(--rule);
}
.cat:last-child{border-bottom:0}
.cat .no{font:700 12px/1.5 ui-monospace,Consolas,monospace;color:var(--blue)}
.cat b{font-size:14.5px;display:block}
.cat span{font-size:12.5px;color:var(--muted)}
.cat .tag{font:600 10.5px/1 ui-monospace,Consolas,monospace;border:1px solid var(--rule);color:var(--muted);padding:5px 8px;border-radius:3px}
.foot{margin-top:16px;display:flex;gap:20px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.foot b{color:var(--ink)}
[hidden]{display:none!important}
@media (max-width:820px){
  .desk{padding:18px 16px 40px}
  .empty{grid-template-columns:1fr;gap:16px;padding:24px 18px}
  .empty svg{width:180px;height:133px}
  .cat{grid-template-columns:80px 1fr}
  .cat .tag{grid-column:2}
  .search{grid-template-columns:1fr}
  .clear{padding:12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="desk">
  <header class="head">
    <div>
      <h1>城南馆 · 卡片目录</h1>
      <div class="sub">CATALOG DESK · 12 条在架</div>
    </div>
    <div class="cnt" id="cnt">检索中…</div>
  </header>

  <form class="search" id="form">
    <div class="box">
      <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="6.8" cy="6.8" r="5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M10.6 10.6 15 15" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      <input id="q" type="search" value="夜航" placeholder="输入书名、作者或索书号" aria-label="检索词" spellcheck="false">
      <button type="submit">检 索</button>
    </div>
    <button class="clear" type="button" id="clear">清空条件</button>
  </form>

  <div class="tabs" role="group" aria-label="门类抽屉">
    <button type="button" data-cat="all" aria-pressed="true">全部门类</button>
    <button type="button" data-cat="交通" aria-pressed="false">交通</button>
    <button type="button" data-cat="城市" aria-pressed="false">城市</button>
    <button type="button" data-cat="人物" aria-pressed="false">人物</button>
    <button type="button" data-cat="自然" aria-pressed="false">自然</button>
  </div>

  <section class="pane">
    <div class="hold" id="hold"></div>
    <div id="output"></div>
  </section>

  <p class="foot">
    <span>在架 <b>12</b> 条</span>
    <span>已借出 <b>4</b> 条</span>
    <span>检索口径 <b>书名 + 作者 + 索书号</b></span>
    <span>闭馆 <b>21:00</b>，还书口 24 小时</span>
  </p>
</div>

<script>
(function(){
  'use strict';
  var BOOKS = [
    {no:'U491.4/27',t:'夜航·城市航班史',a:'沈砚舟 著',cat:'交通',note:'1920—2020 夜间航班运行记录'},
    {no:'U491.2/08',t:'有轨电车的百年',a:'梁若谷 著',cat:'交通',note:'含 12 条线路走向图'},
    {no:'C912.8/15',t:'街道的眼睛',a:'简宁 著',cat:'城市',note:'人行道与安全感田野调查'},
    {no:'TU984.1/03',t:'围城墙与环湖路',a:'柯志明 著',cat:'城市',note:'老城交通改造案例三则'},
    {no:'K825.4/11',t:'调度员手记',a:'郑明轩 口述',cat:'人物',note:'夜班三十年，附交接单影印'},
    {no:'TB6-49/02',t:'如何读一张运行图',a:'马文柏 编',cat:'交通',note:'入门册，含 40 张图例'},
    {no:'P941.2/06',t:'湖风与雾',a:'雁回山房 编',cat:'自然',note:'环湖气候观察十四年'},
    {no:'TU991/21',t:'水塔下的社区',a:'简宁 著',cat:'城市',note:'供水设施与邻里关系'},
    {no:'F532.3/09',t:'票价的一百年',a:'周允 著',cat:'交通',note:'价格表与补贴口径变迁'},
    {no:'K826.1/04',t:'修桥的人',a:'汪德海 著',cat:'人物',note:'三代桥梁工人的家书'},
    {no:'Q948.5/12',t:'芦苇荡回归记',a:'雁回山房 编',cat:'自然',note:'湿地修复十年影像'},
    {no:'TU984.8/19',t:'夜间城市',a:'多人 合著',cat:'城市',note:'照明、噪音与 24 小时街区'}
  ];
  var q = '夜航', cat = 'all';
  var out = document.getElementById('output');
  var hold = document.getElementById('hold');
  var cnt = document.getElementById('cnt');
  var input = document.getElementById('q');

  function results(){
    return BOOKS.filter(function(b){
      var hay = (b.t + b.a + b.no + b.cat).toLowerCase();
      var hit = !q || hay.indexOf(q.toLowerCase()) >= 0;
      return hit && (cat === 'all' || b.cat === cat);
    });
  }
  function paintHold(){
    var bits = [];
    if (q){ bits.push('<span class="chip">检索词：' + q + '</span><button class="x" type="button" id="drop-q">去掉这个词</button>'); }
    if (cat !== 'all'){ bits.push('<span class="chip">门类：' + cat + '</span>'); }
    hold.innerHTML = '<span>当前条件</span>' + (bits.length ? bits.join('') : '<span>无（等于浏览全馆）</span>');
    var drop = document.getElementById('drop-q');
    if (drop){ drop.addEventListener('click', function(){ q = ''; input.value = ''; paint(); }); }
  }
  function suggest(){
    var words = ['夜','航班','城市'];
    var next = words.filter(function(w){ return w !== q; })[0] || '夜';
    var sameCatOnly = BOOKS.filter(function(b){ return b.cat === (cat === 'all' ? '交通' : cat); }).length;
    return '' +
      '<div class="empty">' +
        '<svg viewBox="0 0 230 170" role="img" aria-label="被拉空的目录抽屉">' +
          '<rect x="18" y="40" width="194" height="96" fill="#e2ebf2" stroke="#1c2a33" stroke-width="2"/>' +
          '<rect x="34" y="52" width="162" height="72" fill="#f7fafc" stroke="#1c2a33" stroke-width="1.4"/>' +
          '<path d="M46 60h58M46 72h72M46 84h44" stroke="#bcd3e6" stroke-width="2"/>' +
          '<rect x="6" y="132" width="218" height="14" fill="#1c2a33"/>' +
          '<rect x="86" y="18" width="58" height="26" fill="#fff" stroke="#1c2a33" stroke-width="2"/>' +
          '<path d="M96 30h38" stroke="#1c5d8a" stroke-width="3"/>' +
          '<path d="M150 96l34 34M184 96l-34 34" stroke="#a5443a" stroke-width="3"/>' +
        '</svg>' +
        '<div>' +
          '<h2>目录里没有叫「<b>' + (q || cat) + '</b>」的卡片</h2>' +
          '<p>已按原条件保留抽屉位置。共 12 条在架卡片中有 ' + sameCatOnly + ' 条属于' + (cat === 'all' ? '当前门类（全部）' : '「' + cat + '」') + '，可能是索书号写法或用词与卡片不同。</p>' +
          '<div class="sugs">' +
            '<button class="sug" type="button" data-act="word"><span class="n">01</span><span><b>只搜一个字「' + next + '」</b><span>把「' + q + '」拆短，命中 ' + BOOKS.filter(function(b){ return (b.t + b.a).indexOf(next) >= 0; }).length + ' 条</span></span><span class="go">换词 →</span></button>' +
            '<button class="sug" type="button" data-act="cat"><span class="n">02</span><span><b>放开门类，回到「全部」</b><span>当前限定在「' + (cat === 'all' ? '全部' : cat) + '」，放开后再搜一次</span></span><span class="go">放开 →</span></button>' +
            '<button class="sug" type="button" data-act="all"><span class="n">03</span><span><b>直接浏览 12 条在架卡片</b><span>清空检索词与门类，按索书号顺序看一遍</span></span><span class="go">浏览 →</span></button>' +
            '<button class="sug" type="button" data-act="ask"><span class="n">04</span><span><b>让馆员帮你找</b><span>开架以外的 3 个书库需要到柜台，内线 8120</span></span><span class="go">登记 →</span></button>' +
          '</div>' +
        '</div>' +
      '</div>';
  }
  function paint(){
    var rows = results();
    cnt.textContent = rows.length + ' / 12 条';
    paintHold();
    if (!rows.length){
      out.innerHTML = suggest();
      Array.prototype.forEach.call(out.querySelectorAll('.sug'), function(b){
        b.addEventListener('click', function(){
          var act = b.dataset.act;
          if (act === 'word'){
            var words = ['夜','航班','城市'];
            var next = words.filter(function(w){ return w !== q; })[0] || '夜';
            q = next; input.value = next; paint();
          } else if (act === 'cat'){
            cat = 'all';
            Array.prototype.forEach.call(document.querySelectorAll('.tabs button'), function(x){ x.setAttribute('aria-pressed', String(x.dataset.cat === 'all')); });
            paint();
          } else if (act === 'all'){
            q = ''; cat = 'all'; input.value = '';
            Array.prototype.forEach.call(document.querySelectorAll('.tabs button'), function(x){ x.setAttribute('aria-pressed', String(x.dataset.cat === 'all')); });
            paint();
          } else {
            out.innerHTML = '<div class="results"><div class="cat"><span class="no">已登记</span><div><b>柜台会在闭馆前答复你</b><span>需求单号 ASK-0827-14，可在原窗口查询进度</span></div><span class="tag">内线 8120</span></div></div>';
            cnt.textContent = '已转人工';
            return;
          }
        });
      });
      return;
    }
    out.innerHTML = '<div class="results">' + rows.map(function(b){
      return '<div class="cat"><span class="no">' + b.no + '</span><div><b>' + b.t + '</b><span>' + b.a + ' · ' + b.note + '</span></div><span class="tag">' + b.cat + '</span></div>';
    }).join('') + '</div>';
  }

  document.getElementById('form').addEventListener('submit', function(e){
    e.preventDefault();
    q = input.value.trim();
    paint();
  });
  input.addEventListener('input', function(){ q = input.value.trim(); paint(); });
  document.getElementById('clear').addEventListener('click', function(){
    q = ''; cat = 'all'; input.value = '';
    Array.prototype.forEach.call(document.querySelectorAll('.tabs button'), function(x){ x.setAttribute('aria-pressed', String(x.dataset.cat === 'all')); });
    paint();
    input.focus();
  });
  Array.prototype.forEach.call(document.querySelectorAll('.tabs button'), function(b){
    b.addEventListener('click', function(){
      cat = b.dataset.cat;
      Array.prototype.forEach.call(document.querySelectorAll('.tabs button'), function(x){ x.setAttribute('aria-pressed', String(x === b)); });
      paint();
    });
  });

  paint();
})();
</script>
</body>
</html>
