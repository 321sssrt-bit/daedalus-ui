<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>席单 · 凭柬入内</title>
<style>
:root{
  --wine:#2a1319;--wine-2:#3c1c24;--ivory:#f4ece0;--ink:#3a2a22;--muted:#7a6a5e;
  --gold:#b28a3f;--gold-2:#e3c98d;--cinnabar:#a63b2e;--jade:#5d7f63;--rule:#d9cbb4;
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:grid;place-items:center;padding:44px 22px;
  background:var(--wine);color:var(--ink);
  font:15px/1.8 Georgia,"Songti SC","SimSun",serif;
  background-image:radial-gradient(120% 90% at 50% -10%,#3c1c2488,transparent 60%),repeating-linear-gradient(135deg,#0000000a 0 2px,transparent 2px 6px);
}
.hall{width:100%;max-width:520px}
.frame{border:1px solid #b28a3f55;padding:9px}
.card{
  background:var(--ivory);padding:42px 40px 36px;position:relative;
  box-shadow:0 18px 46px #00000059;
}
.card::before{content:"";position:absolute;inset:10px;border:1px solid var(--rule);pointer-events:none}
.kicker{
  margin:0 0 6px;text-align:center;font:italic 400 12px/1.4 Georgia,serif;
  letter-spacing:.34em;color:var(--gold);text-transform:uppercase;
}
h1{margin:0;text-align:center;font:700 33px/1.3 "Songti SC","SimSun",serif;letter-spacing:.2em;color:var(--wine)}
.host{margin:14px 0 0;text-align:center;font-size:14px;color:var(--muted)}
.host b{color:var(--ink);font-weight:700}
.seal{position:absolute;right:26px;top:-26px;width:74px;height:74px;filter:drop-shadow(0 4px 8px #00000040)}
.ornament{display:flex;align-items:center;gap:12px;margin:26px 0 22px;color:var(--gold)}
.ornament span{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.ornament svg{width:14px;height:14px}
.terms{margin:0 0 26px;padding:0;list-style:none;display:grid;gap:10px}
.terms li{display:grid;grid-template-columns:5em 1fr;gap:10px;font-size:14px;align-items:baseline}
.terms dt,.terms li b{font:700 12px/1.8 "Songti SC",serif;letter-spacing:.18em;color:var(--gold)}
.terms li em{font-style:normal;color:var(--ink)}
.terms li span{color:var(--muted);font-size:13px}
label.code{display:block;font:700 12px/1.6 "Songti SC",serif;letter-spacing:.2em;color:var(--wine);margin-bottom:9px}
.codebox{
  display:flex;align-items:center;border:1px solid var(--rule);background:#fffdf8;
  transition:border-color .2s ease,box-shadow .2s ease;
}
.codebox:hover{border-color:#c9b694}
.codebox input{
  flex:1;min-width:0;border:0;background:transparent;padding:15px 16px;
  font:600 19px/1.2 ui-monospace,Consolas,monospace;letter-spacing:.16em;color:var(--wine);
}
.codebox input:focus{outline:0}
.codebox:focus-within{border-color:var(--gold);box-shadow:0 0 0 3px #b28a3f2e}
.codebox .tag{padding:0 14px;font:400 11px/1 ui-monospace,Consolas,monospace;letter-spacing:.1em;color:var(--muted);border-left:1px solid var(--rule);align-self:stretch;display:flex;align-items:center}
.state{min-height:26px;margin:10px 0 0;font-size:13px;display:flex;align-items:center;gap:8px;color:var(--muted)}
.state.bad{color:var(--cinnabar)}
.state.ok{color:var(--jade)}
.state svg{width:14px;height:14px;flex:none}
.soon{display:flex;gap:5px;margin-left:auto;font:600 12px/1 ui-monospace,Consolas,monospace;color:var(--wine)}
.soon b{border:1px solid var(--rule);background:#fffdf8;padding:4px 6px;min-width:26px;text-align:center}
.check{
  appearance:none;cursor:pointer;width:100%;margin-top:20px;border:1px solid var(--wine);
  background:var(--wine);color:var(--ivory);padding:16px;
  font:700 17px/1 "Songti SC","SimSun",serif;letter-spacing:.4em;text-indent:.4em;
  transition:background .2s ease,letter-spacing .2s ease;
}
.check:hover{background:var(--wine-2);letter-spacing:.46em}
.check:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
.check[disabled]{background:#8f8578;border-color:#8f8578;cursor:progress;letter-spacing:.28em}
.out{margin:22px 0 0;padding-top:18px;border-top:1px dashed var(--rule);font-size:13px;color:var(--muted);text-align:center}
.out a{color:var(--wine);text-decoration:none;border-bottom:1px solid #b28a3f8c;padding-bottom:1px}
.out a:hover{color:var(--cinnabar);border-bottom-color:var(--cinnabar)}
.out .sep{color:var(--rule);margin:0 9px}
.receipt{margin:0 0 22px;padding:14px 16px;border:1px solid var(--jade);background:#5d7f6314;font-size:13.5px;display:none}
.receipt.show{display:block}
.receipt b{display:block;font:700 14px/1.6 "Songti SC",serif;letter-spacing:.1em;color:var(--jade)}
.receipt span{display:block;font:12px/1.7 ui-monospace,Consolas,monospace;color:var(--muted)}
[hidden]{display:none!important}
@media (max-width:520px){
  .card{padding:34px 22px 28px}
  h1{font-size:27px;letter-spacing:.14em}
  .seal{width:58px;height:58px;right:14px;top:-18px}
  .terms li{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;scroll-behavior:auto!important}
  .check:hover{letter-spacing:.4em}
}
</style>
</head>
<body>
<div class="hall">
  <div class="frame">
    <section class="card">
      <svg class="seal" viewBox="0 0 74 74" aria-hidden="true">
        <path d="M37 3l8 6 10-2 3 10 9 5-5 8 2 10-10 2-5 9-8-4-8 4-5-9-10-2 2-10-5-8 9-5 3-10 10 2z" fill="#a63b2e"/>
        <circle cx="37" cy="37" r="20" fill="none" stroke="#f4ece0" stroke-width="1.2" opacity=".8"/>
        <text x="37" y="43" text-anchor="middle" font-family="Songti SC,SimSun,serif" font-size="17" font-weight="700" fill="#f4ece0">席</text>
      </svg>

      <p class="kicker">By Invitation Only</p>
      <h1>凭柬入席</h1>
      <p class="host">受 <b>雁回山房 · 第四席</b> 之邀，凭柬核验后可入内</p>

      <div class="ornament" aria-hidden="true"><span></span><svg viewBox="0 0 14 14"><path d="M7 0l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="currentColor"/></svg><span></span></div>

      <div class="receipt" id="receipt">
        <b>柬已核验，第四席为你留着</b>
        <span>核验时间 8 月 27 日 20:14 · 回执 HC-4F-0827</span>
      </div>

      <dl class="terms">
        <li><b>柬主</b><em>沈砚舟</em><span>与席者本人，姓名须与柬上一致</span></li>
        <li><b>有效</b><em>八月廿九日 廿四时前</em><span>逾时此柬自动作废，不补发</span></li>
        <li><b>席位</b><em>一柬一席</em><span>携伴请在入席后另行加席</span></li>
      </dl>

      <form id="invite" novalidate>
        <label class="code" for="code">请柬号码</label>
        <div class="codebox">
          <input id="code" type="text" inputmode="text" autocomplete="one-time-code" placeholder="YYSH 0000 0000" maxlength="11" spellcheck="false">
          <span class="tag">四字两枚</span>
        </div>
        <p class="state" id="state">柬号不足 8 位数字时不作核验。</p>
        <button class="check" type="submit" id="go" disabled>核 对 入 席</button>
      </form>

      <p class="out">
        没有收到柬？<a href="#wait">候一席</a><span class="sep">|</span><a href="#lost">柬号遗失</a><span class="sep">|</span><a href="#host">替别人问一声</a>
      </p>
    </section>
  </div>
</div>

<script>
(function(){
  'use strict';
  var input = document.getElementById('code');
  var state = document.getElementById('state');
  var go = document.getElementById('go');
  var form = document.getElementById('invite');
  var receipt = document.getElementById('receipt');
  var DEFAULT = '柬号不足 8 位数字时不作核验。';
  var USED = '80210004';
  var icon = {
    bad:'<svg viewBox="0 0 14 14"><circle cx="7" cy="7" r="6.4" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M7 3.6v4.2M7 9.8v.9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>',
    ok:'<svg viewBox="0 0 14 14"><path d="M1.6 7.6 5 11l7.4-8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>'
  };
  function digits(v){ return v.replace(/[^0-9A-Z]/g,''); }
  function pretty(v){
    var d = digits(v).replace(/[^0-9]/g,'').slice(0,8);
    var pre = digits(v).replace(/[^A-Z]/g,'').slice(0,4);
    var out = pre + (d.length ? ' ' + d.slice(0,4) : '');
    if (d.length > 4) out += ' ' + d.slice(4,8);
    return out.trim();
  }
  function set(kind, msg){
    state.className = 'state' + (kind ? ' ' + kind : '');
    state.innerHTML = (kind ? icon[kind] : '') + '<span>' + msg + '</span>';
  }
  function complete(){ return digits(input.value).replace(/[^0-9]/g,'').length === 8; }
  function ready(){ go.disabled = !complete(); }

  input.addEventListener('input', function(){
    var caretAtEnd = input.selectionStart === input.value.length;
    input.value = pretty(input.value);
    if (caretAtEnd){ input.setSelectionRange(input.value.length, input.value.length); }
    receipt.classList.remove('show');
    if (!input.value){ set('', DEFAULT); }
    else if (!complete()){ set('', '还差 ' + (8 - digits(input.value).replace(/[^0-9]/g,'').length) + ' 位数字。'); }
    else { set('', '柬号完整，可核对。'); }
    ready();
  });

  form.addEventListener('submit', function(e){
    e.preventDefault();
    if (!complete()){ set('bad', '柬号不完整，无法核对。'); return; }
    go.disabled = true;
    go.textContent = '核 对 中';
    var value = digits(input.value).replace(/[^0-9]/g,'');
    setTimeout(function(){
      go.textContent = '核 对 入 席';
      if (value === USED){
        set('bad', '此柬已于八月廿一日核销，同一柬号只能用一次。');
        go.disabled = false;
        return;
      }
      if (value.charAt(7) === '0'){
        set('bad', '山房没有这一席的记录，请向柬主再要一次。');
        go.disabled = false;
        return;
      }
      set('ok', '核验通过。');
      go.disabled = true;
      go.textContent = '已 入 席';
      receipt.classList.add('show');
    }, 900);
  });
})();
</script>
</body>
</html>
