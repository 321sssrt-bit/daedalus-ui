<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>拾光集 · 还没有一张照片</title>
<style>
:root{
  --cream:#fffcf5;--sand:#f6efe1;--tomato:#e8503a;--tomato-2:#c93c28;--leaf:#2f7a56;
  --ink:#231f1a;--muted:#7b7267;--line:#ece2d0;--shadow:0 10px 30px #e3d5bd73;
}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font:15px/1.7 system-ui,"Microsoft YaHei",sans-serif}
.shell{max-width:1180px;margin:0 auto;padding:30px 40px 60px}
.top{display:flex;align-items:center;gap:12px}
.top .dot{width:28px;height:28px;border-radius:50%;background:var(--tomato);display:grid;place-items:center;color:#fff;font:700 13px/1 system-ui}
.top b{font:700 17px/1 system-ui;letter-spacing:.02em}
.top .who{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted)}
.top .ava{width:30px;height:30px;border-radius:50%;background:var(--sand);border:1px solid var(--line);display:grid;place-items:center;font-size:12px;color:var(--leaf)}
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center;margin-top:52px}
.hi{font:600 13px/1 ui-monospace,Consolas,monospace;letter-spacing:.2em;color:var(--tomato);margin:0}
h1{margin:16px 0 0;font:800 clamp(34px,4.6vw,54px)/1.16 system-ui;letter-spacing:-.02em}
.h1sub{margin:18px 0 0;color:var(--muted);font-size:16px;max-width:44ch}
.ctas{display:flex;gap:14px;flex-wrap:wrap;margin-top:34px}
.primary{
  appearance:none;cursor:pointer;border:0;border-radius:999px;background:var(--tomato);color:#fff;
  font:inherit;font-weight:700;font-size:15px;padding:16px 30px;display:inline-flex;align-items:center;gap:10px;
  box-shadow:0 8px 20px #e8503a4d;transition:background .18s ease,transform .18s ease;
}
.primary:hover{background:var(--tomato-2);transform:translateY(-2px)}
.primary:focus-visible{outline:3px solid var(--leaf);outline-offset:3px}
.primary svg{width:16px;height:16px}
.secondary{
  appearance:none;cursor:pointer;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--ink);
  font:inherit;font-size:15px;padding:16px 26px;display:inline-flex;align-items:center;gap:10px;transition:border-color .18s ease,background .18s ease;
}
.secondary:hover{border-color:var(--tomato);background:#fdf6f4}
.secondary:focus-visible{outline:3px solid var(--tomato);outline-offset:2px}
.checklist{margin:38px 0 0;padding:0;list-style:none;display:grid;gap:12px;max-width:460px}
.checklist li{display:grid;grid-template-columns:24px 1fr auto;gap:12px;align-items:center;font-size:14px;color:var(--muted)}
.checklist .tick{width:24px;height:24px;border-radius:50%;border:1px solid var(--line);background:#fff;display:grid;place-items:center;font:700 12px/1 ui-monospace,Consolas,monospace;color:var(--muted)}
.checklist li[data-done="1"]{color:var(--ink)}
.checklist li[data-done="1"] .tick{background:var(--leaf);border-color:var(--leaf);color:#fff}
.checklist em{font-style:normal;font:600 11px/1 ui-monospace,Consolas,monospace;letter-spacing:.1em;color:var(--muted);white-space:nowrap}
.art{position:relative;background:var(--sand);border-radius:28px;padding:30px;min-height:400px;display:grid;place-items:center;overflow:hidden}
.art svg{width:100%;height:auto;max-width:420px}
.board{margin-top:64px}
.board-head{display:flex;align-items:baseline;gap:14px;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:22px}
.board-head h2{margin:0;font:700 20px/1.3 system-ui}
.board-head span{font-size:13px;color:var(--muted)}
.board-head .sync{margin-left:auto;font:600 11px/1 ui-monospace,Consolas,monospace;letter-spacing:.1em;color:var(--leaf);border:1px solid #2f7a5640;border-radius:999px;padding:6px 12px;background:#fff}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.void{
  grid-column:1 / -1;border:1.5px dashed #ded2bd;border-radius:22px;background:#fffdf8;padding:42px 26px;text-align:center;color:var(--muted);
  display:grid;gap:6px;justify-items:center;
}
.void b{color:var(--ink);font-size:16px;font-weight:700}
.void svg{width:54px;height:54px;opacity:.6}
.void.gone{display:none}
.polar{background:#fff;border-radius:12px;box-shadow:var(--shadow);padding:10px 10px 14px;opacity:0;transform:translateY(14px) scale(.96);transition:opacity .4s ease,transform .4s ease}
.polar.in{opacity:1;transform:none}
.polar .ph{border-radius:7px;height:118px;display:grid;place-items:center;color:#fff2}
.polar figcaption{margin-top:10px;font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.polar figcaption b{display:block;color:var(--ink);font-size:13.5px;font-weight:600}
.toasts{position:fixed;right:24px;bottom:24px;display:grid;gap:10px;z-index:5}
.toast{background:var(--ink);color:#fff;border-radius:14px;padding:13px 18px;font-size:13.5px;box-shadow:0 12px 28px #231f1a40;animation:rise .32s ease}
.toast b{color:var(--tomato);font-weight:700}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
[hidden]{display:none!important}
@media (max-width:980px){
  .shell{padding:22px 22px 44px}
  .hero{grid-template-columns:1fr;gap:30px;margin-top:34px}
  .art{min-height:300px;order:-1}
  .cards{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:560px){.cards{grid-template-columns:1fr}.ctas .primary,.ctas .secondary{width:100%;justify-content:center}}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important;scroll-behavior:auto!important}
  .polar{opacity:1;transform:none}
  .primary:hover{transform:none}
}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <span class="dot" aria-hidden="true">拾</span><b>拾光集</b>
    <div class="who"><span>胶片与快照的收纳盒</span><span class="ava">砚</span></div>
  </header>

  <section class="hero">
    <div>
      <p class="hi">HELLO · 这里还是空的</p>
      <h1>你的第一卷胶片，<br>还没有放进盒子</h1>
      <p class="h1sub">拾光集不替你整理，只把每张照片的拍摄信息、胶卷批次和去过的地方留在同一页上。放一张进来，就能看到它长什么样。</p>
      <div class="ctas">
        <button class="primary" id="start" type="button">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          放入第一张照片
        </button>
        <button class="secondary" id="import" type="button">从旧相册导入一批 <span style="color:var(--muted)">（12 张）</span></button>
      </div>
      <ul class="checklist" id="checklist">
        <li data-done="0"><span class="tick">1</span><span>放入一张照片，看看页面长什么样</span><em>必做</em></li>
        <li data-done="0"><span class="tick">2</span><span>补一句当时的备注，只给自己看</span><em>可选</em></li>
        <li data-done="0"><span class="tick">3</span><span>开启本地备份，换设备也不丢</span><em>建议</em></li>
      </ul>
    </div>

    <div class="art" aria-hidden="true">
      <svg viewBox="0 0 420 340">
        <rect x="26" y="40" width="150" height="190" rx="10" fill="#fff"/>
        <rect x="40" y="54" width="122" height="122" rx="6" fill="#e8e0d0"/>
        <circle cx="101" cy="115" r="30" fill="#f0b429"/>
        <path d="M40 176l38-40 30 30 22-20 32 30z" fill="#2f7a56"/>
        <rect x="196" y="86" width="196" height="150" rx="10" fill="#fff"/>
        <rect x="210" y="100" width="168" height="96" rx="6" fill="#e8e0d0"/>
        <circle cx="250" cy="132" r="16" fill="#e8503a"/>
        <path d="M210 196l46-46 34 34 26-22 62 34z" fill="#1f4d6b"/>
        <rect x="210" y="246" width="86" height="8" rx="4" fill="#ded2bd"/>
        <rect x="312" y="246" width="66" height="8" rx="4" fill="#ded2bd"/>
        <rect x="70" y="236" width="96" height="10" rx="5" fill="#ded2bd"/>
        <rect x="120" y="256" width="60" height="8" rx="4" fill="#ece2d0"/>
        <path d="M330 40c26 10 38 34 34 60" fill="none" stroke="#e8503a" stroke-width="3" stroke-linecap="round"/>
        <circle cx="330" cy="34" r="7" fill="#e8503a"/>
      </svg>
    </div>
  </section>

  <section class="board">
    <div class="board-head">
      <h2>我的盒子</h2>
      <span id="counter">0 张 · 0 卷</span>
      <span class="sync" id="sync">尚未同步</span>
    </div>
    <div class="cards" id="cards">
      <div class="void" id="void">
        <svg viewBox="0 0 54 54" aria-hidden="true"><rect x="4" y="10" width="46" height="34" rx="4" fill="none" stroke="#7b7267" stroke-width="2"/><path d="M4 32l14-11 10 8 8-6 14 11" fill="none" stroke="#7b7267" stroke-width="2"/><circle cx="20" cy="21" r="3.4" fill="#7b7267"/></svg>
        <b>盒子里空空如也</b>
        <span>放入一张后，这里会变成可以翻页的卡片墙。</span>
      </div>
    </div>
  </section>
</div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<script>
(function(){
  'use strict';
  var SAMPLE = [
    {t:'昆仑路 3 号的窗',f:'Portra 400',h:'14:22',c:'#c98b5a'},
    {t:'雨后的有轨电车',f:'UltraMax 400',h:'17:05',c:'#5b7f9c'},
    {t:'外婆家的藤椅',f:'Gold 200',h:'09:40',c:'#8fae74'},
    {t:'夜航的最后一班',f:'Cinestill 800T',h:'23:12',c:'#4a4f7a'}
  ];
  var cards = document.getElementById('cards');
  var voidBox = document.getElementById('void');
  var counter = document.getElementById('counter');
  var sync = document.getElementById('sync');
  var toastBox = document.getElementById('toasts');
  var items = Array.prototype.slice.call(document.querySelectorAll('#checklist li'));
  var shots = 0, rolls = {};

  function toast(html){
    var el = document.createElement('div');
    el.className = 'toast';
    el.innerHTML = html;
    toastBox.appendChild(el);
    setTimeout(function(){ el.remove(); }, 2600);
  }
  function setStep(n){
    items.forEach(function(li, i){
      li.setAttribute('data-done', i < n ? '1' : '0');
      li.querySelector('.tick').textContent = i < n ? '✓' : String(i + 1);
    });
  }
  function refresh(){
    counter.textContent = shots + ' 张 · ' + Object.keys(rolls).length + ' 卷';
    sync.textContent = shots ? '本机已保存 · 待同步' : '尚未同步';
    sync.style.color = shots ? 'var(--leaf)' : 'var(--muted)';
    voidBox.classList.toggle('gone', shots > 0);
  }
  function add(sample){
    var fig = document.createElement('figure');
    fig.className = 'polar';
    fig.innerHTML = '<div class="ph" style="background:' + sample.c + '"></div>' +
      '<figcaption><span><b>' + sample.t + '</b>' + sample.f + ' · ' + sample.h + '</span><span aria-hidden="true">···</span></figcaption>';
    cards.appendChild(fig);
    fig.getBoundingClientRect();
    fig.classList.add('in');
    shots += 1; rolls[sample.f] = 1;
    refresh();
    setStep(shots >= 1 ? Math.min(2, shots) : 0);
    return fig;
  }

  document.getElementById('start').addEventListener('click', function(){
    var sample = SAMPLE[shots % SAMPLE.length];
    add(sample);
    setStep(2);
    toast('已放入 <b>' + sample.t + '</b>，可以继续放第二张。');
    this.lastChild.nodeValue = '再放一张';
  });

  document.getElementById('import').addEventListener('click', function(){
    if (shots >= SAMPLE.length){ toast('示例批次已全部导入，共 <b>' + shots + '</b> 张。'); return; }
    var batch = SAMPLE.slice(shots);
    this.disabled = true;
    var self = this;
    batch.forEach(function(s, i){ setTimeout(function(){ add(s); }, 180 * i); });
    setTimeout(function(){
      setStep(3);
      sync.textContent = '已同步到 2 台设备';
      toast('导入完成，共 <b>' + batch.length + '</b> 张，备份已开启。');
      self.disabled = false;
    }, 180 * batch.length + 200);
  });

  refresh();
})();
</script>
</body>
</html>
