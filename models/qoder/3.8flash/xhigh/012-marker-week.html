<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>本周安排 · 白板周历</title>
<style>
:root{
  --board:#f4f6f7;--white:#ffffff;--ink:#1b2126;--gray:#78838b;--line:#e2e7ea;--violet:#4b3a8f;
  --mk-yellow:#ffe66d;--mk-pink:#ff8fa3;--mk-cyan:#7fd8d1;--mk-green:#9fd9a8;
}
*{box-sizing:border-box}
body{margin:0;background:var(--board);color:var(--ink);font:13.5px/1.6 system-ui,"Microsoft YaHei",sans-serif}
.desk{max-width:1280px;margin:0 auto;padding:22px 26px 46px}
.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.bar h1{margin:0;font:800 22px/1.3 system-ui;letter-spacing:.01em}
.bar .week{font:600 11px/1 ui-monospace,Consolas,monospace;letter-spacing:.12em;color:var(--gray)}
.nav{margin-left:auto;display:flex;gap:6px;align-items:center}
.nav button{appearance:none;cursor:pointer;font:inherit;font-size:12.5px;border:1px solid var(--line);background:var(--white);padding:8px 13px;border-radius:6px;color:var(--ink)}
.nav button:hover{border-color:var(--violet);color:var(--violet)}
.nav button.today{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600}
.nav button.today:hover{background:var(--violet);border-color:var(--violet)}
.nav button:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
.who{display:flex;gap:6px}
.who button{appearance:none;cursor:pointer;font:inherit;font-size:12px;border:1px dashed #cfd6da;background:transparent;padding:6px 11px;border-radius:999px;color:var(--gray)}
.who button[aria-pressed="true"]{border-style:solid;border-color:var(--ink);background:var(--white);color:var(--ink);font-weight:600}
.who button:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
.week-grid{background:var(--white);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:grid;grid-template-columns:52px repeat(7,minmax(0,1fr))}
.corner{border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:#fafbfc}
.dayname{padding:10px 8px;text-align:center;border-bottom:1px solid var(--line);border-right:1px solid var(--line);background:#fafbfc}
.dayname:last-child{border-right:0}
.dayname b{display:block;font:700 13px/1.3 system-ui}
.dayname span{font:500 10.5px/1.4 ui-monospace,Consolas,monospace;color:var(--gray)}
.dayname.today{background:#f0edfa}
.dayname.today b{color:var(--violet)}
.hours{border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.hours i{display:block;height:56px;font:500 10px/56px ui-monospace,Consolas,monospace;color:var(--gray);text-align:right;padding-right:7px;font-style:normal}
.col{position:relative;border-right:1px solid var(--line);min-height:336px}
.col:last-child{border-right:0}
.col.today{background:#faf9fe}
.col::after{content:"";position:absolute;left:0;right:0;top:0;bottom:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 55px,var(--line) 55px 56px)}
.ev{
  position:absolute;left:3px;right:3px;border-radius:5px;padding:5px 7px 6px;font-size:11.5px;line-height:1.35;
  cursor:pointer;border:1px solid #00000012;overflow:hidden;z-index:2;
}
.ev b{display:block;font-weight:700;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev span{font:500 10px/1.4 ui-monospace,Consolas,monospace;color:#43505a;display:block}
.ev.y{background:var(--mk-yellow)}
.ev.p{background:var(--mk-pink)}
.ev.c{background:var(--mk-cyan)}
.ev.g{background:var(--mk-green)}
.ev.off{opacity:.34;filter:grayscale(1)}
.ev[aria-pressed="true"]{outline:2px solid var(--violet);outline-offset:1px;z-index:3}
.ev::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:#0000001f}
.nowline{position:absolute;left:0;right:0;height:2px;background:var(--violet);z-index:4}
.nowline::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--violet)}
.detail{margin-top:18px;background:var(--white);border:1px solid var(--line);border-radius:10px;padding:16px 20px;display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center}
.detail .tag{width:11px;height:44px;border-radius:4px;background:var(--mk-yellow)}
.detail h2{margin:0;font:700 16px/1.4 system-ui}
.detail p{margin:3px 0 0;color:var(--gray);font-size:12.5px}
.detail .act{display:flex;gap:8px}
.detail button{appearance:none;cursor:pointer;font:inherit;font-size:12.5px;border:1px solid var(--line);background:var(--white);padding:9px 14px;border-radius:6px}
.detail button.pri{background:var(--violet);border-color:var(--violet);color:#fff;font-weight:600}
.detail button:hover{border-color:var(--violet);color:var(--violet)}
.detail button.pri:hover{color:#fff;background:#3c2e75}
.detail button:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
.hints{margin-top:14px;display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--gray)}
.hints i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-2px}
[hidden]{display:none!important}
@media (max-width:900px){
  .scroller{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
  .week-grid{min-width:880px;border-radius:0}
  .col{min-height:300px}
}
@media (max-width:768px){
  .desk{padding:16px 14px 34px}
  .detail{grid-template-columns:1fr;gap:10px}
  .bar h1{font-size:19px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="desk">
  <header class="bar">
    <h1>本周安排</h1>
    <span class="week" id="range">08-24 至 08-30 · 周视图 09:00–15:00</span>
    <div class="who" role="group" aria-label="只看某人的安排">
      <button type="button" data-f="all" aria-pressed="true">全部</button>
      <button type="button" data-f="me" aria-pressed="false">只看我</button>
      <button type="button" data-f="team" aria-pressed="false">只看小车组</button>
    </div>
    <div class="nav">
      <button type="button" id="prev">← 上周</button>
      <button type="button" class="today" id="today">回到本周</button>
      <button type="button" id="next">下周 →</button>
    </div>
  </header>

  <div class="scroller"><div class="week-grid" id="grid"></div></div>

  <section class="detail" id="detail">
    <span class="tag" id="dtag" aria-hidden="true"></span>
    <div><h2 id="dtitle">点一格日程看详情</h2><p id="dsub">左侧筛选只影响显示，不会删除任何安排。当前时间线画在 11:20。</p></div>
    <div class="act"><button type="button" class="pri" id="djoin">加入我的</button><button type="button" id="dsnooze">改期到下周</button></div>
  </section>

  <p class="hints">
    <span><i style="background:var(--mk-yellow)"></i>调度与例会</span>
    <span><i style="background:var(--mk-pink)"></i>检修占用</span>
    <span><i style="background:var(--mk-cyan)"></i>对外与来访</span>
    <span><i style="background:var(--mk-green)"></i>值班与待命</span>
    <span>灰掉的是被筛选隐藏的事项，仍占位以免后面的日程跳位</span>
  </p>
</div>

<script>
(function(){
  'use strict';
  var DAYS = ['周一','周二','周三','周四','周五','周六','周日'];
  var WEEKS = [
    {range:'08-24 至 08-30',dates:['24','25','26','27','28','29','30'],today:3,
      items:[
        {d:0,s:9,e:10.5,t:'早高峰运力复盘',w:'调度 · 6 人',c:'y',who:'all'},
        {d:0,s:11,e:12,t:'3 号车保养接车',w:'车库 · 与厂家',c:'p',who:'team'},
        {d:1,s:9.5,e:10.5,t:'周中排班确认',w:'线上 · 15 分钟',c:'y',who:'all'},
        {d:1,s:13,e:14.5,t:'新驾驶带教',w:'环湖外圈',c:'g',who:'me'},
        {d:2,s:9,e:9.5,t:'区交通科来电',w:'待回复',c:'c',who:'me'},
        {d:2,s:10.5,e:12,t:'石门线客流踏勘',w:'现场 · 4 人',c:'c',who:'team'},
        {d:3,s:9,e:10,t:'本周调度例会',w:'三号会议室',c:'y',who:'all'},
        {d:3,s:11,e:11.5,t:'当前时刻 · 交接班',w:'正在发生',c:'g',who:'me'},
        {d:3,s:13.5,e:15,t:'设备年检陪同',w:'特检院 2 人',c:'p',who:'team'},
        {d:4,s:9.5,e:11,t:'月度安全培训',w:'全员 · 报告厅',c:'c',who:'all'},
        {d:4,s:12,e:13,t:'排班表提交',w:'系统截止 13:00',c:'y',who:'me'},
        {d:5,s:10,e:11.5,t:'周末加班运力',w:'待安排驾驶 2 人',c:'g',who:'team'},
        {d:6,s:14,e:15,t:'下周预案草拟',w:'桌面工作',c:'y',who:'me'}
      ]},
    {range:'08-17 至 08-23',dates:['17','18','19','20','21','22','23'],today:-1,
      items:[
        {d:0,s:9,e:10,t:'上周复盘',w:'调度',c:'y',who:'all'},
        {d:1,s:10,e:12,t:'2 号车定损',w:'保险公司到场',c:'p',who:'team'},
        {d:2,s:9,e:9.5,t:'驾龄统计上报',w:'已提交',c:'c',who:'me'},
        {d:3,s:9,e:10,t:'周调度例会',w:'已开完',c:'y',who:'all'},
        {d:4,s:13,e:14.5,t:'夜间照明验收',w:'已通过',c:'g',who:'team'},
        {d:5,s:10,e:11,t:'临时加班运力',w:'已完成',c:'g',who:'all'}
      ]},
    {range:'08-31 至 09-06',dates:['31','01','02','03','04','05','06'],today:-1,
      items:[
        {d:0,s:9,e:10,t:'开学季运力增援',w:'与教育部门对接',c:'c',who:'all'},
        {d:1,s:9.5,e:11,t:'秋检启动会',w:'全员',c:'y',who:'all'},
        {d:2,s:13,e:15,t:'4 号车进场保养',w:'车库占用两格',c:'p',who:'team'},
        {d:3,s:10,e:11,t:'同行参观接待',w:'12 人 · 需报备',c:'c',who:'me'},
        {d:4,s:14,e:15,t:'国庆预案第一轮',w:'调度 + 安全',c:'y',who:'team'}
      ]}
  ];
  var START = 9, END = 15, SLOT = 56;
  var grid = document.getElementById('grid');
  var detail = document.getElementById('detail');
  var wi = 0, filter = 'all', picked = null;

  function head(){
    var week = WEEKS[wi];
    var html = '<div class="corner"></div>';
    DAYS.forEach(function(d, i){
      html += '<div class="dayname' + (i === week.today ? ' today' : '') + '"><b>' + d + '</b><span>' + week.dates[i] + '</span></div>';
    });
    html += '<div class="hours">';
    for (var h = START; h < END; h++){ html += '<i>' + (h < 10 ? '0' + h : h) + ':00</i>'; }
    html += '</div>';
    DAYS.forEach(function(d, di){
      html += '<div class="col' + (di === week.today ? ' today' : '') + '" data-d="' + di + '"></div>';
    });
    grid.innerHTML = html;
  }
  function fill(){
    var week = WEEKS[wi];
    week.items.forEach(function(item, ii){
      var col = grid.querySelector('.col[data-d="' + item.d + '"]');
      if (!col){ return; }
      var top = (item.s - START) * SLOT;
      var h = (item.e - item.s) * SLOT - 3;
      var el = document.createElement('button');
      el.type = 'button';
      el.className = 'ev ' + item.c + (item.who !== 'me' && filter === 'me' ? ' off' : '') + (item.who !== 'team' && filter === 'team' ? ' off' : '');
      el.style.top = top + 'px';
      el.style.height = Math.max(28, h) + 'px';
      el.setAttribute('aria-pressed', String(picked === ii));
      el.innerHTML = '<b>' + item.t + '</b><span>' + fmt(item.s) + '–' + fmt(item.e) + ' · ' + item.w + '</span>';
      el.addEventListener('click', function(){ picked = ii; show(item); paintPressed(); });
      col.appendChild(el);
    });
    if (week.today >= 0){
      var tc = grid.querySelector('.col[data-d="' + week.today + '"]');
      var line = document.createElement('div');
      line.className = 'nowline';
      line.style.top = (11.33 - START) * SLOT + 'px';
      tc.appendChild(line);
    }
  }
  function paintPressed(){
    Array.prototype.forEach.call(grid.querySelectorAll('.ev'), function(el, i){
      el.setAttribute('aria-pressed', String(i === picked));
    });
  }
  function fmt(t){
    var h = Math.floor(t), m = Math.round((t - h) * 60);
    return (h < 10 ? '0' + h : h) + ':' + (m < 10 ? '0' + m : m);
  }
  function show(item){
    var week = WEEKS[wi];
    document.getElementById('dtag').style.background = getComputedStyle(document.documentElement).getPropertyValue('--mk-' + ({y:'yellow',p:'pink',c:'cyan',g:'green'})[item.c]);
    document.getElementById('dtitle').textContent = DAYS[item.d] + ' ' + week.dates[item.d] + ' 日 · ' + item.t;
    document.getElementById('dsub').textContent = fmt(item.s) + '–' + fmt(item.e) + ' · ' + item.w + ' · 归属：' + (item.who === 'me' ? '我个人' : (item.who === 'team' ? '小车组' : '全组'));
  }
  function paint(){
    var week = WEEKS[wi];
    document.getElementById('range').textContent = week.range + ' · 周视图 09:00–15:00';
    picked = null;
    head();
    fill();
    detail.querySelector('#dtitle').textContent = '点一格日程看详情';
    detail.querySelector('#dsub').textContent = week.today >= 0 ? '左侧筛选只影响显示，不会删除任何安排。当前时间线画在 11:20。' : '这一周没有你的日程，仍可查看全组安排。';
  }
  function visible(item){
    if (filter === 'me'){ return item.who === 'me'; }
    if (filter === 'team'){ return item.who === 'team'; }
    return true;
  }

  Array.prototype.forEach.call(document.querySelectorAll('.who button'), function(b){
    b.addEventListener('click', function(){
      filter = b.dataset.f;
      Array.prototype.forEach.call(document.querySelectorAll('.who button'), function(x){ x.setAttribute('aria-pressed', String(x === b)); });
      Array.prototype.forEach.call(grid.querySelectorAll('.ev'), function(el){
        var item = WEEKS[wi].items[Array.prototype.indexOf.call(grid.querySelectorAll('.ev'), el)];
        el.classList.toggle('off', !visible(item));
      });
    });
  });
  document.getElementById('prev').addEventListener('click', function(){ wi = Math.max(0, wi - 1); paint(); });
  document.getElementById('next').addEventListener('click', function(){ wi = Math.min(WEEKS.length - 1, wi + 1); paint(); });
  document.getElementById('today').addEventListener('click', function(){ wi = 0; paint(); });
  document.getElementById('djoin').addEventListener('click', function(){
    this.textContent = '已加入';
    this.disabled = true;
  });
  document.getElementById('dsnooze').addEventListener('click', function(){
    this.textContent = '已改到下周';
    this.disabled = true;
  });

  paint();
})();
</script>
</body>
</html>
