<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>商品详情 · SKU 聚焦</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--page:#0a0a0a;--surface:#141414;--text:#fafafa;--muted:#a3a3a3;--accent:#fff;--border:#262626;--select:#404040}
html,body{height:100%;font-family:"Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;background:var(--page);color:var(--text)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
body{min-width:768px}
.shell{max-width:1280px;min-height:800px;margin:0 auto;padding:40px 56px;display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:start}
.gallery{background:var(--surface);border:1px solid var(--border);border-radius:4px;aspect-ratio:1;display:flex;align-items:center;justify-content:center;position:relative}
.gallery svg{width:70%;max-width:320px;opacity:.9}
.badge{position:absolute;top:16px;left:16px;background:#fff;color:#000;font-size:11px;font-weight:700;padding:4px 10px;letter-spacing:.1em}
.info{padding-top:12px}
.brand{font-size:12px;color:var(--muted);letter-spacing:.15em;text-transform:uppercase;margin-bottom:8px}
.info h1{font-size:32px;font-weight:300;letter-spacing:-.02em;line-height:1.2;margin-bottom:16px}
.price-row{margin-bottom:32px}
.price{font-size:36px;font-weight:600}
.price-note{font-size:13px;color:var(--muted);margin-top:4px}
.spec{margin-bottom:28px}
.spec label{display:block;font-size:12px;color:var(--muted);margin-bottom:10px;letter-spacing:.05em}
.options{display:flex;gap:8px;flex-wrap:wrap}
.opt{border:1px solid var(--border);background:transparent;color:var(--text);padding:10px 18px;font-size:13px;cursor:pointer;font-family:inherit;border-radius:2px}
.opt:hover{border-color:var(--muted)}
.opt.selected{border-color:var(--accent);background:var(--accent);color:#000;font-weight:600}
.opt.disabled{opacity:.35;cursor:not-allowed;text-decoration:line-through}
.buy{margin-top:36px;width:100%;border:none;background:#fff;color:#000;padding:18px;font-size:14px;font-weight:700;letter-spacing:.12em;cursor:pointer;font-family:inherit;text-transform:uppercase}
.buy:hover{background:#e5e5e5}
.buy:focus-visible{outline:2px solid #fff;outline-offset:4px}
.stock{font-size:12px;color:var(--muted);margin-top:12px;text-align:center}
</style>
</head>
<body>
<div class="shell">
  <div class="gallery">
    <span class="badge">LIMITED</span>
    <svg viewBox="0 0 200 240" fill="none" aria-hidden="true">
      <rect x="40" y="20" width="120" height="200" rx="8" stroke="#525252" stroke-width="2"/>
      <rect x="55" y="50" width="90" height="140" rx="4" fill="#262626"/>
      <circle cx="100" cy="210" r="6" fill="#525252"/>
    </svg>
  </div>
  <div class="info">
    <div class="brand">MONO / AUDIO</div>
    <h1 id="name">Focus One 无线降噪耳机</h1>
    <div class="price-row">
      <div class="price" id="price">¥1,899</div>
      <div class="price-note">含充电盒 · 24 期免息可选</div>
    </div>
    <div class="spec">
      <label>颜色</label>
      <div class="options" id="colors">
        <button type="button" class="opt selected" data-color="石墨黑" data-price="1899">石墨黑</button>
        <button type="button" class="opt" data-color="钛空灰" data-price="1899">钛空灰</button>
        <button type="button" class="opt" data-color="雾白" data-price="1999">雾白</button>
      </div>
    </div>
    <div class="spec">
      <label>版本</label>
      <div class="options" id="sizes">
        <button type="button" class="opt selected" data-size="标准版">标准版</button>
        <button type="button" class="opt" data-size="Pro 版" data-price="2299">Pro 版</button>
      </div>
    </div>
    <button class="buy" type="button" id="buy">立即购买</button>
    <p class="stock" id="stock">石墨黑 · 标准版 · 现货</p>
  </div>
</div>
<script>
let color="石墨黑",size="标准版",price=1899;
function update(){
  document.getElementById("price").textContent="¥"+price.toLocaleString();
  document.getElementById("stock").textContent=`${color} · ${size} · 现货`;
}
document.getElementById("colors").onclick=e=>{
  const b=e.target.closest(".opt");if(!b||b.classList.contains("disabled"))return;
  document.querySelectorAll("#colors .opt").forEach(x=>x.classList.remove("selected"));
  b.classList.add("selected");color=b.dataset.color;
  if(size==="标准版")price=+b.dataset.price;update();
};
document.getElementById("sizes").onclick=e=>{
  const b=e.target.closest(".opt");if(!b)return;
  document.querySelectorAll("#sizes .opt").forEach(x=>x.classList.remove("selected"));
  b.classList.add("selected");size=b.dataset.size;
  price=size==="Pro 版"?2299:+(document.querySelector("#colors .selected").dataset.price);update();
};
document.getElementById("buy").onclick=()=>{
  const btn=document.getElementById("buy");btn.textContent="已加入订单";btn.disabled=true;
};
</script>
</body>
</html>
