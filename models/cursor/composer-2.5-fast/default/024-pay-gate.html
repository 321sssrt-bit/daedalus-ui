<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>确认订单 · 隅咖啡</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
:root{--page:#0f172a;--surface:#fff;--text:#0f172a;--muted:#64748b;--accent:#c9a227;--accent-dark:#9a7b1a;--line:#e2e8f0;--success:#059669}
html,body{height:100%;background:var(--page);font-family:system-ui,-apple-system,sans-serif;color:var(--text)}
body{display:flex;justify-content:center;align-items:center;padding:24px}
.frame{width:1280px;height:800px;display:grid;grid-template-columns:1fr 420px;background:var(--surface);border-radius:12px;overflow:hidden;box-shadow:0 24px 64px rgba(0,0,0,.35)}
.summary{background:var(--page);color:#f1f5f9;padding:40px 36px;display:flex;flex-direction:column}
.summary h1{font-size:22px;font-weight:600;margin-bottom:8px;color:#fff}
.summary .sub{font-size:14px;color:#94a3b8;margin-bottom:32px}
.order-items{flex:1;overflow-y:auto}
.item{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid #1e293b;font-size:14px}
.item-name{color:#e2e8f0}
.item-qty{color:#64748b;margin-left:8px}
.item-price{color:#f1f5f9;font-weight:500}
.row{display:flex;justify-content:space-between;padding:8px 0;font-size:14px;color:#94a3b8}
.row.total{font-size:28px;font-weight:800;color:var(--accent);padding-top:16px;margin-top:8px;border-top:1px solid #334155}
.row.total span:last-child{font-size:32px;letter-spacing:-.02em}
.checkout{padding:40px 36px;display:flex;flex-direction:column}
.checkout h2{font-size:20px;font-weight:700;margin-bottom:24px}
.pay-methods{display:flex;flex-direction:column;gap:12px;margin-bottom:28px}
.pay-opt{display:flex;align-items:center;gap:14px;padding:16px 18px;border:2px solid var(--line);border-radius:10px;cursor:pointer;transition:border-color .15s,background .15s}
.pay-opt:hover{border-color:#cbd5e1;background:#f8fafc}
.pay-opt.selected{border-color:var(--accent);background:#fffbeb}
.pay-opt:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.pay-opt input{accent-color:var(--accent);width:18px;height:18px}
.pay-icon{width:40px;height:40px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#fff}
.pay-icon.wx{background:#07c160}
.pay-icon.ali{background:#1677ff}
.pay-label{font-weight:600;font-size:15px}
.pay-desc{font-size:12px;color:var(--muted);margin-top:2px}
.amount-box{background:#fefce8;border:1px solid #fde68a;border-radius:10px;padding:20px;margin-bottom:24px;text-align:center}
.amount-label{font-size:13px;color:var(--muted)}
.amount-value{font-size:36px;font-weight:800;color:var(--accent-dark);margin-top:4px}
.btn-pay{width:100%;padding:16px;background:var(--accent);color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;transition:background .15s}
.btn-pay:hover{background:var(--accent-dark)}
.btn-pay:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn-pay:disabled{background:#cbd5e1;cursor:not-allowed}
.success{text-align:center;padding:40px;display:none}
.success.show{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1}
.success svg{margin-bottom:16px}
.success h3{font-size:20px;color:var(--success)}
@media(max-width:768px){.frame{width:100%;height:auto;grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="frame">
<aside class="summary">
<h1>隅咖啡 · 订单摘要</h1>
<p class="sub">订单号 YK-20260907-8842</p>
<div class="order-items">
<div class="item"><span><span class="item-name">埃塞俄比亚 耶加雪菲</span><span class="item-qty">× 2</span></span><span class="item-price">¥ 128</span></div>
<div class="item"><span><span class="item-name">手冲壶 600ml</span><span class="item-qty">× 1</span></span><span class="item-price">¥ 198</span></div>
<div class="item"><span><span class="item-name">滤纸 100 枚装</span><span class="item-qty">× 1</span></span><span class="item-price">¥ 32</span></div>
</div>
<div class="row"><span>小计</span><span>¥ 358</span></div>
<div class="row"><span>运费</span><span>¥ 0</span></div>
<div class="row"><span>优惠</span><span>- ¥ 20</span></div>
<div class="row total"><span>应付金额</span><span id="sideTotal">¥ 338</span></div>
</aside>
<section class="checkout" id="checkoutPanel">
<h2>选择支付方式</h2>
<div class="pay-methods">
<label class="pay-opt selected"><input type="radio" name="pay" value="wx" checked><div class="pay-icon wx">微</div><div><div class="pay-label">微信支付</div><div class="pay-desc">推荐使用，秒级到账</div></div></label>
<label class="pay-opt"><input type="radio" name="pay" value="ali"><div class="pay-icon ali">支</div><div><div class="pay-label">支付宝</div><div class="pay-desc">花呗、余额均可</div></div></label>
</div>
<div class="amount-box"><div class="amount-label">确认支付金额</div><div class="amount-value" id="mainAmount">¥ 338.00</div></div>
<button class="btn-pay" id="btnPay">确认支付 ¥ 338.00</button>
</section>
<section class="success" id="successPanel">
<svg width="64" height="64" viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="30" stroke="#059669" stroke-width="3"/><path d="M18 32l10 10 18-18" stroke="#059669" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
<h3>支付成功</h3><p style="color:var(--muted);margin-top:8px;font-size:14px">订单 YK-20260907-8842 已确认，预计 2 日内发货</p>
</section>
</div>
<script>
const opts=document.querySelectorAll('.pay-opt');
const btn=document.getElementById('btnPay');
opts.forEach(o=>{
o.onclick=()=>{opts.forEach(x=>x.classList.remove('selected'));o.classList.add('selected');o.querySelector('input').checked=true};
});
btn.onclick=()=>{
btn.disabled=true;btn.textContent='处理中…';
setTimeout(()=>{document.getElementById('checkoutPanel').style.display='none';document.getElementById('successPanel').classList.add('show')},800);
};
</script>
</body>
</html>
