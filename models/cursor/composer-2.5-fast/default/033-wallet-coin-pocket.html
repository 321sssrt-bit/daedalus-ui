<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>钱包 · 小袋</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --page:#e8f5f0;--surface:#fff;--text:#0d3b2e;--muted:#5a8a7a;
  --accent:#00a878;--accent2:#007a5a;--in:#2ecc71;--out:#e67e22;
  --nav-bg:#fff;--border:#c8e6d8;--radius:16px;
  --font:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
}
html{font-family:var(--font);background:#b8d4c8;min-height:100vh}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.phone{width:390px;height:844px;background:var(--page);border-radius:44px;border:8px solid #1a1a1a;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 32px 64px rgba(0,0,0,.25);position:relative}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:120px;height:28px;background:#1a1a1a;border-radius:0 0 18px 18px;z-index:10}
.status{height:44px;padding:12px 24px 0;display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:var(--text)}
.scroll{flex:1;overflow-y:auto;padding:8px 20px 100px}
.balance-card{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-radius:var(--radius);padding:24px;margin-bottom:20px}
.balance-card p{font-size:13px;opacity:.85;margin-bottom:4px}
.balance-card .amt{font-size:36px;font-weight:700;letter-spacing:-.02em}
.balance-card .sub{font-size:12px;opacity:.7;margin-top:8px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px}
.quick-btn{padding:16px;border-radius:var(--radius);border:none;background:var(--surface);color:var(--text);font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 2px 8px rgba(0,0,0,.06);transition:transform .2s,box-shadow .2s}
.quick-btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.1)}
.quick-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.quick-btn svg{width:20px;height:20px}
.section-title{font-size:13px;color:var(--muted);margin-bottom:12px;font-weight:500}
.tx{background:var(--surface);border-radius:12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.tx-item{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border);gap:12px}
.tx-item:last-child{border-bottom:none}
.tx-icon{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.tx-icon.in{background:#d5f5e3;color:var(--in)}
.tx-icon.out{background:#fdebd0;color:var(--out)}
.tx-info{flex:1;min-width:0}
.tx-info .name{font-size:14px;font-weight:500;color:var(--text)}
.tx-info .time{font-size:12px;color:var(--muted);margin-top:2px}
.tx-amt{font-size:15px;font-weight:600;white-space:nowrap}
.tx-amt.in{color:var(--in)}.tx-amt.out{color:var(--out)}
.nav{position:absolute;bottom:0;left:0;right:0;height:80px;background:var(--nav-bg);border-top:1px solid var(--border);display:flex;justify-content:space-around;align-items:flex-start;padding-top:10px;padding-bottom:20px}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:var(--muted);background:none;border:none;cursor:pointer;padding:4px 12px}
.nav-item.active{color:var(--accent);font-weight:600}
.nav-item svg{width:24px;height:24px}
.toast{position:absolute;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(prefers-reduced-motion:reduce){.quick-btn,.toast{transition:none}}
</style>
</head>
<body>
<div class="phone">
  <div class="notch"></div>
  <div class="status"><span>9:41</span><span>100%</span></div>
  <div class="scroll">
    <div class="balance-card">
      <p>可用余额（元）</p>
      <div class="amt">12,846.50</div>
      <div class="sub">昨日 +128.00 · 本月支出 3,420</div>
    </div>
    <div class="quick">
      <button class="quick-btn" id="outBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17L17 7M17 7H7M17 7V17"/></svg>转出</button>
      <button class="quick-btn" id="inBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 7L7 17M7 17H17M7 17V7"/></svg>收款</button>
    </div>
    <div class="section-title">近几笔流水</div>
    <div class="tx">
      <div class="tx-item"><div class="tx-icon in">↓</div><div class="tx-info"><div class="name">工资入账</div><div class="time">今天 09:15</div></div><div class="tx-amt in">+8,500.00</div></div>
      <div class="tx-item"><div class="tx-icon out">↑</div><div class="tx-info"><div class="name">美团外卖</div><div class="time">昨天 19:32</div></div><div class="tx-amt out">-42.80</div></div>
      <div class="tx-item"><div class="tx-icon out">↑</div><div class="tx-info"><div class="name">地铁出行</div><div class="time">昨天 08:10</div></div><div class="tx-amt out">-6.00</div></div>
      <div class="tx-item"><div class="tx-icon in">↓</div><div class="tx-info"><div class="name">好友转账 · 阿杰</div><div class="time">3月5日</div></div><div class="tx-amt in">+200.00</div></div>
    </div>
  </div>
  <nav class="nav">
    <button class="nav-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M12 12h.01"/></svg>钱包</button>
    <button class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>理财</button>
    <button class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>账单</button>
    <button class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M6 20v-2a6 6 0 0 1 12 0v2"/></svg>我的</button>
  </nav>
  <div class="toast" id="toast"></div>
</div>
<script>
const toast=document.getElementById('toast');
document.getElementById('outBtn').addEventListener('click',()=>show('打开转出页面'));
document.getElementById('inBtn').addEventListener('click',()=>show('展示收款码'));
document.querySelectorAll('.nav-item').forEach((b,i)=>b.addEventListener('click',()=>{document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));b.classList.add('active');show(['钱包','理财','账单','我的'][i]);}));
function show(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1500);}
</script>
</body>
</html>
