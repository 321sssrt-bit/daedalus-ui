<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>墨门 · 登录</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --page:#0a0e14;--surface:#141b24;--text:#e8e4dc;--muted:#7a8494;
  --accent:#c9a227;--ink:#1a2332;--error:#d44a4a;
  --radius:6px;--gap:16px;
}
html{font-family:"Songti SC","SimSun",serif;background:var(--page);color:var(--text);min-height:100vh}
body{min-height:100vh;display:flex}
.layout{display:grid;grid-template-columns:1fr 480px;width:100%;max-width:1280px;margin:0 auto;min-height:100vh}
.hero{background:var(--ink);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:48px}
.hero svg{width:320px;height:320px;opacity:.85}
.panel{display:flex;flex-direction:column;justify-content:center;padding:64px 56px;background:var(--surface);border-left:1px solid #2a3544}
.brand{font-size:13px;letter-spacing:.35em;color:var(--accent);text-transform:uppercase;margin-bottom:8px}
h1{font-size:28px;font-weight:600;margin-bottom:6px;line-height:1.3}
.sub{font-size:14px;color:var(--muted);margin-bottom:36px;line-height:1.6}
.field{margin-bottom:20px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:8px}
.field input{width:100%;height:44px;padding:0 14px;background:var(--page);border:1px solid #2a3544;border-radius:var(--radius);color:var(--text);font-size:15px;font-family:inherit;transition:border-color .2s}
.field input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(201,162,39,.2)}
.field input.error{border-color:var(--error)}
.row-between{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;font-size:13px}
.toggle-mode{background:none;border:none;color:var(--accent);cursor:pointer;font-family:inherit;font-size:13px;text-decoration:underline}
.toggle-mode:hover{color:#e0c04a}
.forgot{color:var(--muted);text-decoration:none;font-size:13px}
.forgot:hover{color:var(--text)}
.btn-primary{width:100%;height:48px;background:var(--accent);color:var(--page);border:none;border-radius:var(--radius);font-size:16px;font-weight:600;cursor:pointer;font-family:inherit;letter-spacing:.08em;transition:background .2s,transform .15s}
.btn-primary:hover{background:#e0c04a}
.btn-primary:active{transform:scale(.98)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.msg{font-size:13px;margin-top:12px;min-height:20px}
.msg.error{color:var(--error)}
.msg.ok{color:#6ab87a}
.footer-note{margin-top:32px;font-size:12px;color:var(--muted);line-height:1.5}
@media(max-width:768px){
  .layout{grid-template-columns:1fr}
  .hero{display:none}
  .panel{padding:40px 24px;border-left:none}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="layout">
  <aside class="hero" aria-hidden="true">
    <svg viewBox="0 0 200 200" fill="none">
      <circle cx="100" cy="100" r="90" stroke="#c9a227" stroke-width=".5" opacity=".3"/>
      <path d="M40 140 Q100 60 160 140" stroke="#c9a227" stroke-width="2" fill="none" opacity=".6"/>
      <path d="M60 120 Q100 80 140 120" stroke="#7a8494" stroke-width="1.5" fill="none"/>
      <text x="100" y="108" text-anchor="middle" fill="#c9a227" font-size="28" font-family="serif">墨</text>
    </svg>
  </aside>
  <main class="panel">
    <div class="brand">墨门档案</div>
    <h1>欢迎回来</h1>
    <p class="sub">登录您的账号，继续管理文献与笔记。</p>
    <form id="loginForm" novalidate>
      <div class="field">
        <label for="account">邮箱或手机号</label>
        <input id="account" type="text" placeholder="name@example.com" autocomplete="username">
      </div>
      <div class="field" id="pwdField">
        <label for="secret">密码</label>
        <input id="secret" type="password" placeholder="请输入密码" autocomplete="current-password">
      </div>
      <div class="field hidden" id="codeField" style="display:none">
        <label for="code">验证码</label>
        <input id="code" type="text" placeholder="6 位数字验证码" maxlength="6" inputmode="numeric">
      </div>
      <div class="row-between">
        <button type="button" class="toggle-mode" id="modeToggle">改用验证码登录</button>
        <a href="#" class="forgot" id="forgotLink">忘记密码？</a>
      </div>
      <button type="submit" class="btn-primary" id="submitBtn">进入墨门</button>
      <p class="msg" id="msg" role="alert"></p>
    </form>
    <p class="footer-note">首次使用？请联系管理员获取邀请码开通账号。</p>
  </main>
</div>
<script>
(function(){
  var useCode=false,form=document.getElementById('loginForm');
  var pwdField=document.getElementById('pwdField'),codeField=document.getElementById('codeField');
  var modeToggle=document.getElementById('modeToggle'),msg=document.getElementById('msg');
  modeToggle.addEventListener('click',function(){
    useCode=!useCode;
    pwdField.style.display=useCode?'none':'block';
    codeField.style.display=useCode?'block':'none';
    modeToggle.textContent=useCode?'改用密码登录':'改用验证码登录';
    msg.textContent='';
  });
  document.getElementById('forgotLink').addEventListener('click',function(e){
    e.preventDefault();
    msg.className='msg';
    msg.textContent='已跳转至找回密码流程（演示：请使用「改用验证码登录」或联系管理员）';
  });
  form.addEventListener('submit',function(e){
    e.preventDefault();
    var ac=document.getElementById('account'),secret=document.getElementById('secret');
    msg.className='msg';
    if(!ac.value.trim()){ac.classList.add('error');msg.className='msg error';msg.textContent='请输入账号';return;}
    ac.classList.remove('error');
    if(!useCode&&!secret.value){secret.classList.add('error');msg.className='msg error';msg.textContent='请输入密码';return;}
    secret.classList.remove('error');
    msg.className='msg ok';msg.textContent='验证通过，正在进入工作台…';
    document.getElementById('submitBtn').disabled=true;
  });
})();
</script>
</body>
</html>
