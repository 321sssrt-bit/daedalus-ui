<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>项目入驻申请</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
:root{--page:#fffbeb;--surface:#fff;--text:#451a03;--muted:#92400e;--accent:#d97706;--line:#fde68a;--required:#dc2626;--done:#059669}
html,body{height:100%;background:var(--page);color:var(--text);font-family:Georgia,"Songti SC",serif}
body{display:flex;justify-content:center;padding:24px}
.frame{width:1280px;height:800px;background:var(--surface);border:1px solid var(--line);border-radius:8px;display:grid;grid-template-columns:220px 1fr;overflow:hidden;box-shadow:0 8px 32px rgba(217,119,6,.1)}
.nav{padding:28px 0;border-right:1px solid var(--line);background:#fffbeb}
.nav h1{font-size:15px;font-weight:700;padding:0 20px 24px;font-family:system-ui,sans-serif}
.sec-link{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:none;background:transparent;padding:12px 20px;font-size:14px;color:var(--muted);cursor:pointer;font-family:system-ui,sans-serif;transition:background .12s}
.sec-link:hover{background:#fef3c7}
.sec-link.active{background:#fef3c7;color:var(--text);font-weight:600;border-right:3px solid var(--accent)}
.sec-link:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.sec-num{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;font-family:system-ui,sans-serif}
.sec-link.active .sec-num,.sec-link.done .sec-num{background:var(--accent);border-color:var(--accent);color:#fff}
.sec-link.done .sec-num{background:var(--done);border-color:var(--done)}
.form-area{display:flex;flex-direction:column;overflow:hidden}
.form-scroll{flex:1;overflow-y:auto;padding:32px 48px}
.form-scroll h2{font-size:24px;font-weight:700;margin-bottom:6px}
.form-scroll .sub{font-size:14px;color:var(--muted);margin-bottom:28px;font-family:system-ui,sans-serif}
.section{display:none}
.section.active{display:block}
.field{margin-bottom:20px;font-family:system-ui,sans-serif}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.req{color:var(--required);margin-left:2px}
.field input,.field textarea,.field select{width:100%;max-width:520px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;font-size:14px;font-family:inherit;background:#fff}
.field input:focus,.field textarea:focus,.field select:focus{outline:2px solid var(--accent);border-color:var(--accent)}
.field textarea{min-height:80px;resize:vertical}
.form-foot{padding:16px 48px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;background:#fffbeb;font-family:system-ui,sans-serif}
.btn{padding:10px 20px;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;border:none}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
.btn-ghost:hover{background:#fef3c7}
.btn-draft{background:#fff;border:1px solid var(--accent);color:var(--accent)}
.btn-draft:hover{background:#fef3c7}
.btn-submit{background:var(--accent);color:#fff}
.btn-submit:hover{background:#b45309}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.draft-msg{font-size:13px;color:var(--done);opacity:0;transition:opacity .2s}
.draft-msg.show{opacity:1}
@media(max-width:768px){.frame{width:100%;grid-template-columns:1fr}.nav{display:flex;overflow-x:auto;padding:12px}}
</style>
</head>
<body>
<div class="frame">
<nav class="nav"><h1>项目入驻申请</h1>
<button class="sec-link active" data-sec="0"><span class="sec-num">1</span>基本信息</button>
<button class="sec-link" data-sec="1"><span class="sec-num">2</span>团队与联系</button>
<button class="sec-link" data-sec="2"><span class="sec-num">3</span>项目详情</button>
</nav>
<div class="form-area">
<div class="form-scroll">
<section class="section active" id="sec0"><h2>基本信息</h2><p class="sub">填写项目的基础识别信息</p>
<div class="field"><label>项目名称<span class="req">*</span></label><input type="text" placeholder="例：隅咖啡品牌升级" required></div>
<div class="field"><label>所属行业<span class="req">*</span></label><select><option value="">请选择</option><option>餐饮</option><option>零售</option><option>文化</option></select></div>
<div class="field"><label>项目简介</label><textarea placeholder="一句话描述项目目标"></textarea></div>
</section>
<section class="section" id="sec1"><h2>团队与联系</h2><p class="sub">便于我们与你取得联系</p>
<div class="field"><label>负责人姓名<span class="req">*</span></label><input type="text" placeholder="真实姓名"></div>
<div class="field"><label>联系邮箱<span class="req">*</span></label><input type="email" placeholder="name@company.com"></div>
<div class="field"><label>团队规模</label><select><option>1–5 人</option><option>6–20 人</option><option>20 人以上</option></select></div>
</section>
<section class="section" id="sec2"><h2>项目详情</h2><p class="sub">补充说明与期望</p>
<div class="field"><label>预期上线时间<span class="req">*</span></label><input type="text" placeholder="例：2026 年 Q4"></div>
<div class="field"><label>项目需求描述<span class="req">*</span></label><textarea placeholder="描述核心功能、目标用户与参考案例" style="min-height:120px"></textarea></div>
<div class="field"><label>预算区间</label><select><option>5 万以下</option><option>5–20 万</option><option>20 万以上</option></select></div>
</section>
</div>
<div class="form-foot">
<span class="draft-msg" id="draftMsg">草稿已于刚刚保存</span>
<div style="display:flex;gap:10px">
<button class="btn btn-draft" id="btnDraft">保存草稿</button>
<button class="btn btn-submit" id="btnSubmit">提交申请</button>
</div>
</div>
</div>
</div>
<script>
let cur=0;
const links=document.querySelectorAll('.sec-link');
const sections=document.querySelectorAll('.section');
function go(n){
cur=n;links.forEach((l,i)=>{l.classList.toggle('active',i===n);if(i<n)l.classList.add('done');else l.classList.remove('done')});
sections.forEach((s,i)=>s.classList.toggle('active',i===n));
document.querySelector('.form-scroll').scrollTop=0;
}
links.forEach(l=>l.onclick=()=>go(+l.dataset.sec));
document.getElementById('btnDraft').onclick=()=>{const m=document.getElementById('draftMsg');m.classList.add('show');setTimeout(()=>m.classList.remove('show'),2500)};
document.getElementById('btnSubmit').onclick=()=>{if(cur<2)go(cur+1);else{document.getElementById('btnSubmit').textContent='已提交';document.getElementById('btnSubmit').disabled=true}};
</script>
</body>
</html>
