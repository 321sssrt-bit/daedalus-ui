<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>故障 · 断线</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --page:#1a1a1a;--surface:#262626;--text:#f5f5f5;--muted:#a3a3a3;
  --accent:#f97316;--accent2:#ea580c;--border:#404040;
  --font:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
}
html{font-family:var(--font);background:#0a0a0a;min-height:100vh}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.phone{width:390px;height:844px;background:var(--page);border-radius:44px;border:8px solid #000;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 32px 64px rgba(0,0,0,.5);position:relative}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:120px;height:28px;background:#000;border-radius:0 0 18px 18px;z-index:10}
.content{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 28px;text-align:center}
.fault-icon{width:80px;height:80px;margin-bottom:28px;position:relative}
.fault-icon svg{width:100%;height:100%}
.fault-line{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);width:60px;height:3px;background:var(--accent);border-radius:2px}
h1{font-size:22px;font-weight:700;margin-bottom:12px;color:var(--text)}
.desc{font-size:15px;color:var(--muted);line-height:1.65;margin-bottom:24px;max-width:300px}
.ticket{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 20px;margin-bottom:36px;width:100%;max-width:320px}
.ticket span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.ticket code{font-family:"Cascadia Code",Consolas,monospace;font-size:16px;color:var(--accent);font-weight:600}
.actions{display:flex;flex-direction:column;gap:12px;width:100%;max-width:280px}
.btn{padding:15px;border-radius:12px;font-size:15px;font-weight:600;border:none;cursor:pointer;transition:background .2s,opacity .2s}
.btn-retry{background:var(--accent);color:#1a1a1a}
.btn-retry:hover{background:var(--accent2)}
.btn-retry:disabled{opacity:.6;cursor:wait}
.btn-retry:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.btn-home{background:transparent;color:var(--muted);border:1px solid var(--border)}
.btn-home:hover{background:var(--surface);color:var(--text)}
@media(prefers-reduced-motion:reduce){.btn{transition:none}}
</style>
</head>
<body>
<div class="phone">
  <div class="notch"></div>
  <div class="content">
    <div class="fault-icon">
      <svg viewBox="0 0 80 80" fill="none"><circle cx="40" cy="40" r="36" stroke="#404040" stroke-width="2"/><path d="M40 24v20M40 52h.01" stroke="#f97316" stroke-width="4" stroke-linecap="round"/></svg>
      <div class="fault-line"></div>
    </div>
    <h1>暂时连不上服务器</h1>
    <p class="desc">不是您的问题，是我们这边出了点状况。您可以稍后再试，或把下面的编号发给客服。</p>
    <div class="ticket">
      <span>故障编号</span>
      <code id="ticketId">FLT-20260307-8842</code>
    </div>
    <div class="actions">
      <button class="btn btn-retry" id="retryBtn">重试</button>
      <button class="btn btn-home" id="homeBtn">回首页</button>
    </div>
  </div>
</div>
<script>
const retryBtn=document.getElementById('retryBtn');
retryBtn.addEventListener('click',()=>{
  retryBtn.disabled=true;retryBtn.textContent='正在重试…';
  setTimeout(()=>{retryBtn.disabled=false;retryBtn.textContent='仍然失败，请稍后再试';},1500);
});
document.getElementById('homeBtn').addEventListener('click',()=>{document.querySelector('.content').innerHTML='<h1 style="font-size:20px;color:#a3a3a3">已返回首页</h1><p style="color:#737373;margin-top:12px;font-size:14px">主页加载中…</p>';});
</script>
</body>
</html>
