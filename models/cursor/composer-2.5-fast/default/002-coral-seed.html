<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>珊瑚种 · 注册</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --page:#fff5f0;--surface:#ffffff;--text:#3d2c29;--muted:#9a7b73;
  --accent:#ff6b5b;--coral:#ffa08a;--seed:#2d8f6f;--border:#f0ddd6;
}
html{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:var(--page);color:var(--text);min-height:100vh}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px}
.card{width:100%;max-width:520px;background:var(--surface);border-radius:24px;padding:48px 40px;box-shadow:0 12px 40px rgba(255,107,91,.12);position:relative;overflow:hidden}
.card::before{content:"";position:absolute;top:-60px;right:-60px;width:180px;height:180px;background:radial-gradient(circle,var(--coral) 0%,transparent 70%);opacity:.35;border-radius:50%}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:28px}
.logo svg{width:36px;height:36px}
.logo span{font-size:18px;font-weight:700;color:var(--accent)}
h1{font-size:26px;margin-bottom:6px}
.sub{font-size:14px;color:var(--muted);margin-bottom:32px}
.field{margin-bottom:18px}
.field label{display:block;font-size:13px;font-weight:500;margin-bottom:6px;color:var(--text)}
.field input{width:100%;height:46px;padding:0 16px;border:2px solid var(--border);border-radius:14px;font-size:15px;font-family:inherit;background:#fffcfa;transition:border-color .2s,box-shadow .2s}
.field input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px rgba(255,107,91,.15)}
.field input.valid{border-color:var(--seed)}
.check{display:flex;align-items:flex-start;gap:10px;margin:20px 0;font-size:13px;color:var(--muted);line-height:1.5}
.check input{margin-top:3px;accent-color:var(--accent);width:16px;height:16px}
.btn{width:100%;height:50px;background:linear-gradient(135deg,var(--accent),#ff8566);color:#fff;border:none;border-radius:14px;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit;transition:transform .15s,opacity .2s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.login-link{text-align:center;margin-top:24px;font-size:14px;color:var(--muted)}
.login-link a{color:var(--accent);font-weight:600;text-decoration:none}
.login-link a:hover{text-decoration:underline}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:12px 24px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .3s}
.toast.show{opacity:1}
@media(max-width:768px){.card{padding:32px 24px;border-radius:18px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <svg viewBox="0 0 36 36" fill="none"><circle cx="18" cy="18" r="16" fill="#ffa08a"/><path d="M18 8c-4 6-8 10-8 14a8 8 0 1016 0c0-4-4-8-8-14z" fill="#ff6b5b"/></svg>
    <span>珊瑚种</span>
  </div>
  <h1>种下你的账号</h1>
  <p class="sub">三步之内完成注册，开始记录成长轨迹。</p>
  <form id="regForm">
    <div class="field"><label for="name">昵称</label><input id="name" type="text" placeholder="怎么称呼你"></div>
    <div class="field"><label for="email">邮箱</label><input id="email" type="email" placeholder="you@mail.com"></div>
    <div class="field"><label for="pwd">密码</label><input id="pwd" type="password" placeholder="至少 8 位"></div>
    <label class="check"><input type="checkbox" id="agree"><span>我已阅读并同意《用户协议》与《隐私政策》</span></label>
    <button type="submit" class="btn" id="regBtn" disabled>注册并进入</button>
  </form>
  <p class="login-link">已有账号？<a href="#" id="goLogin">去登录</a></p>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
(function(){
  var agree=document.getElementById('agree'),btn=document.getElementById('regBtn');
  var inputs=[].slice.call(document.querySelectorAll('#regForm input[type=text],#regForm input[type=email],#regForm input[type=password]'));
  function validate(){
    var ok=agree.checked&&inputs.every(function(i){return i.value.trim().length>0});
    btn.disabled=!ok;
    inputs.forEach(function(i){i.classList.toggle('valid',i.value.trim().length>0);});
  }
  agree.addEventListener('change',validate);
  inputs.forEach(function(i){i.addEventListener('input',validate);});
  document.getElementById('regForm').addEventListener('submit',function(e){
    e.preventDefault();
    var t=document.getElementById('toast');t.textContent='注册成功！欢迎加入珊瑚种 🌱';t.classList.add('show');
    setTimeout(function(){t.classList.remove('show');},2800);
  });
  document.getElementById('goLogin').addEventListener('click',function(e){
    e.preventDefault();
    var t=document.getElementById('toast');t.textContent='跳转至登录页（演示）';t.classList.add('show');
    setTimeout(function(){t.classList.remove('show');},2000);
  });
})();
</script>
</body>
</html>
