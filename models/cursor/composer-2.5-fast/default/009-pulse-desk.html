<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>脉动台 · 工作台总览</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --page:#111827;--surface:#1f2937;--text:#f9fafb;--muted:#9ca3af;
  --accent:#10b981;--pulse:#34d399;--warn:#fbbf24;--border:#374151;
}
html{font-family:"Inter","PingFang SC",sans-serif;background:var(--page);color:var(--text);min-height:100vh}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh;max-width:1280px;margin:0 auto}
.sidebar{background:#0d1117;border-right:1px solid var(--border);padding:24px 16px}
.sidebar .logo{font-size:15px;font-weight:700;color:var(--accent);margin-bottom:32px;display:flex;align-items:center;gap:8px}
.sidebar nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:var(--muted);text-decoration:none;font-size:14px;margin-bottom:4px}
.sidebar nav a.active{background:rgba(16,185,129,.15);color:var(--pulse)}
.sidebar nav a:hover:not(.active){background:var(--surface);color:var(--text)}
.main{padding:28px 32px;overflow-y:auto}
.top-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}
.top-row h1{font-size:22px;font-weight:600}
.date-badge{font-size:13px;color:var(--muted);background:var(--surface);padding:6px 12px;border-radius:6px;border:1px solid var(--border)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:28px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px;position:relative;overflow:hidden}
.stat::after{content:"";position:absolute;top:0;left:0;width:4px;height:100%;background:var(--accent)}
.stat:nth-child(2)::after{background:var(--warn)}
.stat:nth-child(3)::after{background:var(--pulse)}
.stat-label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.stat-value{font-size:32px;font-weight:700;font-variant-numeric:tabular-nums}
.stat-delta{font-size:12px;color:var(--pulse);margin-top:6px}
.stat-delta.down{color:#f87171}
.grid-bottom{display:grid;grid-template-columns:1fr 340px;gap:20px}
.queue{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px}
.queue h2{font-size:15px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.queue h2 span{font-size:12px;color:var(--muted);font-weight:400}
.queue-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s}
.queue-item:last-child{border-bottom:none}
.queue-item:hover{background:rgba(16,185,129,.06);margin:0 -12px;padding-left:12px;padding-right:12px;border-radius:6px}
.queue-item.selected{background:rgba(16,185,129,.12);border-left:3px solid var(--accent);margin:0 -12px;padding-left:9px;padding-right:12px;border-radius:0 6px 6px 0}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot.green{background:var(--accent)}.dot.yellow{background:var(--warn)}.dot.gray{background:var(--muted)}
.q-title{font-size:14px;font-weight:500;flex:1}
.q-time{font-size:12px;color:var(--muted)}
.activity{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px}
.activity h2{font-size:15px;margin-bottom:12px}
.activity p{font-size:13px;color:var(--muted);line-height:1.6}
@media(max-width:768px){
  .app{grid-template-columns:1fr}
  .sidebar{display:none}
  .stats{grid-template-columns:1fr}
  .grid-bottom{grid-template-columns:1fr}
  .main{padding:20px 16px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="logo"><svg width="18" height="18" viewBox="0 0 18 18"><circle cx="9" cy="9" r="7" stroke="#10b981" fill="none" stroke-width="2"/><circle cx="9" cy="9" r="2" fill="#34d399"/></svg>脉动台</div>
    <nav>
      <a href="#" class="active">总览</a>
      <a href="#">任务</a>
      <a href="#">团队</a>
      <a href="#">报表</a>
      <a href="#">设置</a>
    </nav>
  </aside>
  <main class="main">
    <div class="top-row">
      <h1>今日总览</h1>
      <span class="date-badge">2026年9月7日 · 周一</span>
    </div>
    <div class="stats">
      <div class="stat"><div class="stat-label">待处理</div><div class="stat-value">12</div><div class="stat-delta">↑ 3 较昨日</div></div>
      <div class="stat"><div class="stat-label">进行中</div><div class="stat-value">7</div><div class="stat-delta">→ 持平</div></div>
      <div class="stat"><div class="stat-label">已完成</div><div class="stat-value">24</div><div class="stat-delta">↑ 8 较昨日</div></div>
    </div>
    <div class="grid-bottom">
      <section class="queue">
        <h2>优先队列 <span>5 项待办</span></h2>
        <div class="queue-item selected" data-id="1"><span class="dot green"></span><span class="q-title">审核 Q3 营销方案</span><span class="q-time">10:30</span></div>
        <div class="queue-item" data-id="2"><span class="dot yellow"></span><span class="q-title">回复客户工单 #8821</span><span class="q-time">11:00</span></div>
        <div class="queue-item" data-id="3"><span class="dot green"></span><span class="q-title">周会材料整理</span><span class="q-time">14:00</span></div>
        <div class="queue-item" data-id="4"><span class="dot gray"></span><span class="q-title">更新产品路线图</span><span class="q-time">明日</span></div>
        <div class="queue-item" data-id="5"><span class="dot yellow"></span><span class="q-title">新员工 onboarding 跟进</span><span class="q-time">16:30</span></div>
      </section>
      <aside class="activity">
        <h2>选中项详情</h2>
        <p id="detail">审核 Q3 营销方案 — 市场组提交，需在今日 12:00 前给出审批意见。关联文档 3 份。</p>
      </aside>
    </div>
  </main>
</div>
<script>
(function(){
  var details={'1':'审核 Q3 营销方案 — 市场组提交，需在今日 12:00 前给出审批意见。关联文档 3 份。','2':'回复客户工单 #8821 — 客户反馈导出功能异常，优先级 P1。','3':'周会材料整理 — 汇总本周各组进度与风险项。','4':'更新产品路线图 — 下季度功能优先级排期。','5':'新员工 onboarding 跟进 — 确认设备与权限已就绪。'};
  document.querySelectorAll('.queue-item').forEach(function(item){
    item.addEventListener('click',function(){
      document.querySelectorAll('.queue-item').forEach(function(x){x.classList.remove('selected');});
      item.classList.add('selected');
      document.getElementById('detail').textContent=details[item.dataset.id];
    });
  });
})();
</script>
</body>
</html>
