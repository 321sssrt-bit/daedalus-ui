<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>列表空态 · 零清单</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --page:#f3f0fa;--surface:#fff;--text:#3d3560;--muted:#8b83a8;
  --accent:#7c5cbf;--accent-light:#ebe4f8;--border:#ddd6ee;
  --font:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
}
html{font-family:var(--font);background:#c4b8d8;min-height:100vh}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.phone{width:390px;height:844px;background:var(--page);border-radius:44px;border:8px solid #1a1a1a;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 32px 64px rgba(0,0,0,.2);position:relative}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:120px;height:28px;background:#1a1a1a;border-radius:0 0 18px 18px;z-index:10}
.header{padding:52px 20px 16px;background:var(--surface);border-bottom:1px solid var(--border)}
.header h1{font-size:22px;font-weight:700;color:var(--text)}
.header p{font-size:13px;color:var(--muted);margin-top:4px}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 32px;text-align:center}
.illus{width:160px;height:160px;margin-bottom:28px}
.illus svg{width:100%;height:100%}
.empty h2{font-size:18px;font-weight:600;color:var(--text);margin-bottom:10px;line-height:1.4}
.empty p{font-size:14px;color:var(--muted);line-height:1.65;margin-bottom:32px;max-width:280px}
.create-btn{padding:16px 40px;background:var(--accent);color:#fff;border:none;border-radius:28px;font-size:16px;font-weight:600;cursor:pointer;box-shadow:0 8px 24px rgba(124,92,191,.35);transition:transform .2s,box-shadow .2s}
.create-btn:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(124,92,191,.4)}
.create-btn:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.nav{height:80px;background:var(--surface);border-top:1px solid var(--border);display:flex;justify-content:space-around;align-items:flex-start;padding-top:10px;padding-bottom:20px}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:var(--muted);background:none;border:none;cursor:pointer;padding:4px 16px}
.nav-item.active{color:var(--accent);font-weight:600}
.nav-item svg{width:24px;height:24px}
@media(prefers-reduced-motion:reduce){.create-btn{transition:none}}
</style>
</head>
<body>
<div class="phone">
  <div class="notch"></div>
  <header class="header">
    <h1>我的清单</h1>
    <p>共 0 项 · 按创建时间排序</p>
  </header>
  <div class="empty">
    <div class="illus">
      <svg viewBox="0 0 160 160" fill="none">
        <rect x="30" y="40" width="100" height="80" rx="8" fill="#ebe4f8" stroke="#7c5cbf" stroke-width="2" stroke-dasharray="6 4"/>
        <line x1="50" y1="65" x2="110" y2="65" stroke="#c4b8d8" stroke-width="3" stroke-linecap="round"/>
        <line x1="50" y1="80" x2="95" y2="80" stroke="#c4b8d8" stroke-width="3" stroke-linecap="round"/>
        <line x1="50" y1="95" x2="85" y2="95" stroke="#c4b8d8" stroke-width="3" stroke-linecap="round"/>
        <circle cx="120" cy="45" r="18" fill="#7c5cbf" opacity=".2"/>
        <text x="120" y="50" text-anchor="middle" fill="#7c5cbf" font-size="20" font-weight="bold">0</text>
      </svg>
    </div>
    <h2>这里还是空的</h2>
    <p>创建第一条清单，把待办、购物或旅行计划都收进来。支持分组与提醒。</p>
    <button class="create-btn" id="createBtn">去创建清单</button>
  </div>
  <nav class="nav">
    <button class="nav-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>清单</button>
    <button class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>日历</button>
    <button class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2"/></svg>发现</button>
  </nav>
</div>
<script>
document.getElementById('createBtn').addEventListener('click',function(){this.textContent='打开创建向导…';this.disabled=true;setTimeout(()=>{this.textContent='去创建清单';this.disabled=false;},1200);});
document.querySelectorAll('.nav-item').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));b.classList.add('active');}));
</script>
</body>
</html>
