<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>搜索 · 无结果</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--page:#fafafa;--surface:#fff;--text:#111;--muted:#737373;--accent:#171717;--border:#e5e5e5;--ghost:#d4d4d4}
html,body{height:100%;font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--page);color:var(--text)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
body{min-width:768px}
.shell{max-width:1280px;min-height:800px;margin:0 auto;padding:48px 80px;display:flex;flex-direction:column;align-items:center}
.search-bar{width:100%;max-width:640px;display:flex;border:2px solid var(--text);border-radius:999px;overflow:hidden;background:var(--surface)}
.search-bar input{flex:1;border:none;padding:16px 24px;font-size:16px;font-family:inherit;outline:none}
.search-bar button{border:none;background:var(--accent);color:#fff;padding:0 28px;font-size:15px;cursor:pointer;font-family:inherit;font-weight:600}
.search-bar button:hover{background:#404040}
.query-display{margin-top:32px;font-size:14px;color:var(--muted)}
.query-display strong{color:var(--text);font-weight:600}
.empty-state{margin-top:48px;text-align:center;max-width:480px}
.empty-icon{width:120px;height:120px;margin:0 auto 28px;border:3px dashed var(--ghost);border-radius:50%;display:flex;align-items:center;justify-content:center}
.empty-icon svg{width:48px;height:48px;stroke:var(--ghost)}
.empty-state h1{font-size:22px;font-weight:600;margin-bottom:12px}
.empty-state p{font-size:15px;color:var(--muted);line-height:1.6;margin-bottom:32px}
.suggestions{text-align:left;width:100%}
.suggestions h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:12px}
.suggestions button{display:block;width:100%;text-align:left;border:1px solid var(--border);background:var(--surface);padding:14px 18px;border-radius:8px;margin-bottom:8px;font-size:14px;cursor:pointer;font-family:inherit;color:var(--text)}
.suggestions button:hover{border-color:var(--text);background:#f5f5f5}
.suggestions button span{color:var(--muted);font-size:12px;display:block;margin-top:2px}
</style>
</head>
<body>
<div class="shell">
  <form class="search-bar" id="search-form" role="search">
    <input type="search" id="q" value="量子纠缠实验报告" aria-label="搜索关键词" readonly>
    <button type="submit">搜索</button>
  </form>
  <p class="query-display">当前搜索：<strong id="shown-query">量子纠缠实验报告</strong></p>
  <section class="empty-state" aria-label="无结果">
    <div class="empty-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/><path d="M8 11h6M11 8v6"/></svg>
    </div>
    <h1>没有找到匹配「量子纠缠实验报告」的内容</h1>
    <p>知识库中暂无该关键词的文档、实验记录或附件。请尝试缩短关键词、更换术语，或浏览下方推荐。</p>
    <div class="suggestions">
      <h2>改搜建议</h2>
      <button type="button" data-q="量子通信 实验"><strong>量子通信 实验</strong><span>相关实验记录 12 篇</span></button>
      <button type="button" data-q="纠缠态 测量方法"><strong>纠缠态 测量方法</strong><span>方法论与设备说明 8 篇</span></button>
      <button type="button" data-q="2025 物理实验报告"><strong>2025 物理实验报告</strong><span>按年份浏览全部报告</span></button>
    </div>
  </section>
</div>
<script>
const qInput=document.getElementById("q"),shown=document.getElementById("shown-query");
document.querySelectorAll(".suggestions button").forEach(btn=>{
  btn.onclick=()=>{qInput.value=btn.dataset.q;shown.textContent=btn.dataset.q;qInput.focus();};
});
document.getElementById("search-form").onsubmit=e=>e.preventDefault();
</script>
</body>
</html>
