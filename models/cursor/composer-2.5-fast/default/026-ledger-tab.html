<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>账单与发票</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
:root{--page:#ecfdf5;--surface:#fff;--text:#064e3b;--muted:#6b7280;--accent:#059669;--accent-light:#d1fae5;--line:#d1fae5;--gold:#b45309}
html,body{height:100%;background:var(--page);color:var(--text);font-family:"Segoe UI",system-ui,sans-serif}
body{display:flex;justify-content:center;padding:24px}
.frame{width:1280px;height:800px;background:var(--surface);border-radius:12px;border:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 4px 24px rgba(5,150,105,.08)}
.top{padding:28px 40px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start}
.top h1{font-size:24px;font-weight:700}
.tabs{display:flex;gap:4px;margin-top:20px}
.tab{padding:8px 16px;border:none;background:transparent;font-size:14px;color:var(--muted);cursor:pointer;border-radius:6px;font-weight:500}
.tab.active{background:var(--accent-light);color:var(--accent)}
.tab:hover:not(.active){background:#f0fdf4}
.plan-card{margin:24px 40px;padding:24px;background:linear-gradient(135deg,#ecfdf5,#d1fae5);border:1px solid var(--accent);border-radius:12px;display:flex;justify-content:space-between;align-items:center}
.plan-card h2{font-size:18px;font-weight:700}
.plan-card .price{font-size:14px;color:var(--muted);margin-top:4px}
.plan-badge{background:var(--accent);color:#fff;font-size:12px;padding:4px 10px;border-radius:999px;font-weight:600}
.btn-outline{padding:8px 16px;border:1px solid var(--accent);background:#fff;color:var(--accent);border-radius:8px;font-size:13px;font-weight:600;cursor:pointer}
.btn-outline:hover{background:var(--accent-light)}
.btn-outline:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ledger{flex:1;overflow-y:auto;padding:0 40px 32px}
.ledger h3{font-size:14px;font-weight:600;color:var(--muted);margin-bottom:12px;text-transform:uppercase;letter-spacing:.06em}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;padding:10px 12px;border-bottom:2px solid var(--line);color:var(--muted);font-weight:600;font-size:12px}
td{padding:14px 12px;border-bottom:1px solid #f0fdf4}
tr:hover td{background:#f0fdf4}
.amount{font-weight:600;font-variant-numeric:tabular-nums}
.status-paid{color:var(--accent);font-size:12px;font-weight:600}
.btn-link{background:none;border:none;color:var(--accent);cursor:pointer;font-size:13px;font-weight:500;text-decoration:underline}
.btn-link:hover{color:#047857}
.btn-link:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.payment-bar{padding:16px 40px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;background:#fafafa;font-size:14px}
@media(max-width:768px){.frame{width:100%}table{font-size:12px}}
</style>
</head>
<body>
<div class="frame">
<div class="top">
<div><h1>账单与发票</h1>
<nav class="tabs"><button class="tab active">账单记录</button><button class="tab">发票管理</button></nav></div>
</div>
<div class="plan-card">
<div><span class="plan-badge">当前方案</span><h2 style="margin-top:10px">专业版 · 年付</h2><p class="price">¥ 680/年 · 下次续费 2027-03-15</p></div>
<button class="btn-outline" id="btnChangePay">更换支付方式</button>
</div>
<div class="ledger">
<h3>交易记录</h3>
<table>
<thead><tr><th>日期</th><th>描述</th><th>金额</th><th>状态</th><th>操作</th></tr></thead>
<tbody id="tbody"></tbody>
</table>
</div>
<div class="payment-bar"><span id="payInfo">默认支付：招商银行尾号 4826</span><span style="color:var(--muted)">共 5 笔记录</span></div>
</div>
<script>
const rows=[
{date:'2026-03-15',desc:'专业版 · 年付续费',amount:'- ¥ 680.00',status:'已支付'},
{date:'2026-02-08',desc:'额外存储 50GB',amount:'- ¥ 29.00',status:'已支付'},
{date:'2025-12-20',desc:'团队席位 × 2',amount:'- ¥ 136.00',status:'已支付'},
{date:'2025-09-01',desc:'专业版升级补差',amount:'- ¥ 120.00',status:'已支付'},
{date:'2025-03-15',desc:'专业版 · 年付',amount:'- ¥ 680.00',status:'已支付'}
];
const tbody=document.getElementById('tbody');
rows.forEach((r,i)=>{
const tr=document.createElement('tr');
tr.innerHTML=`<td>${r.date}</td><td>${r.desc}</td><td class="amount">${r.amount}</td><td><span class="status-paid">${r.status}</span></td><td><button class="btn-link" data-i="${i}">下载发票</button></td>`;
tbody.appendChild(tr);
});
tbody.querySelectorAll('.btn-link').forEach(b=>{
b.onclick=()=>{b.textContent='已下载';b.disabled=true};
});
document.getElementById('btnChangePay').onclick=function(){
const opts=['招商银行尾号 4826','支付宝','微信支付'];
const cur=opts.indexOf(document.getElementById('payInfo').textContent.replace('默认支付：',''));
document.getElementById('payInfo').textContent='默认支付：'+opts[(cur+1)%opts.length];
this.textContent='已更新';
};
</script>
</body>
</html>
