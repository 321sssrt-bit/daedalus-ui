<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>丝绒密钥 · 邀请进入</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --page:#1a0f2e;--surface:#2a1a45;--text:#f0e6ff;--muted:#a894c8;
  --accent:#b57edc;--velvet:#6b2d8b;--error:#ff5c7a;--gold:#e8c547;
}
html{font-family:Georgia,"Times New Roman",serif;background:var(--page);color:var(--text);min-height:100vh}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px;background:radial-gradient(ellipse at 50% 0%,#3d2060 0%,var(--page) 60%)}
.wrap{width:100%;max-width:560px;text-align:center}
.emblem{width:72px;height:72px;margin:0 auto 24px}
.emblem svg{width:100%;height:100%}
h1{font-size:32px;font-weight:400;letter-spacing:.06em;margin-bottom:12px}
.desc{font-size:15px;color:var(--muted);line-height:1.7;margin-bottom:36px;max-width:420px;margin-left:auto;margin-right:auto}
.invite-box{background:var(--surface);border:1px solid #4a3568;border-radius:4px;padding:36px 32px;text-align:left;box-shadow:0 8px 32px rgba(0,0,0,.4)}
.invite-box p{font-size:13px;color:var(--muted);margin-bottom:16px;line-height:1.6}
.code-row{display:flex;gap:12px}
.code-row input{flex:1;height:52px;background:#150d22;border:1px solid #4a3568;border-radius:2px;color:var(--text);font-size:20px;letter-spacing:.25em;text-align:center;font-family:"Courier New",monospace;padding:0 12px}
.code-row input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(181,126,220,.3)}
.code-row input.error{border-color:var(--error);animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.btn-verify{height:52px;padding:0 28px;background:var(--velvet);color:var(--text);border:1px solid var(--accent);border-radius:2px;font-size:15px;cursor:pointer;font-family:inherit;letter-spacing:.1em;transition:background .2s}
.btn-verify:hover{background:#7d3aa8}
.feedback{margin-top:16px;padding:12px 16px;border-radius:2px;font-size:14px;display:none;line-height:1.5}
.feedback.err{display:block;background:rgba(255,92,122,.12);border:1px solid var(--error);color:#ffb3c1}
.feedback.ok{display:block;background:rgba(181,126,220,.12);border:1px solid var(--accent);color:var(--text)}
.hint{margin-top:24px;font-size:12px;color:var(--muted)}
.hint em{color:var(--gold);font-style:normal}
@media(max-width:768px){.code-row{flex-direction:column}.btn-verify{width:100%}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="emblem">
    <svg viewBox="0 0 72 72" fill="none"><rect x="8" y="20" width="56" height="40" rx="2" stroke="#b57edc" stroke-width="1.5" fill="#2a1a45"/><circle cx="36" cy="40" r="8" stroke="#e8c547" stroke-width="2" fill="none"/><path d="M36 28v-6M36 52v6" stroke="#b57edc" stroke-width="1.5"/></svg>
  </div>
  <h1>丝绒俱乐部</h1>
  <p class="desc">本空间仅向持有邀请的成员开放。请输入邀请人发给您的密钥，核对通过后方可进入。</p>
  <div class="invite-box">
    <p>邀请码为 8 位字母数字组合，区分大小写。若无邀请，请联系现有成员索取。</p>
    <div class="code-row">
      <input id="code" type="text" placeholder="XXXXXXXX" maxlength="8" autocomplete="off" aria-label="邀请码">
      <button type="button" class="btn-verify" id="verifyBtn">核对密钥</button>
    </div>
    <div class="feedback" id="feedback" role="alert"></div>
  </div>
  <p class="hint">演示可用邀请码：<em>Velvet42</em></p>
</div>
<script>
(function(){
  var VALID='Velvet42',code=document.getElementById('code'),fb=document.getElementById('feedback');
  document.getElementById('verifyBtn').addEventListener('click',function(){
    var v=code.value.trim();
    fb.className='feedback';
    if(!v){fb.className='feedback err';fb.textContent='请输入邀请码后再核对。';code.classList.add('error');return;}
    code.classList.remove('error');
    if(v===VALID){fb.className='feedback ok';fb.textContent='密钥有效，正在为您开门…';}
    else{code.classList.add('error');fb.className='feedback err';fb.textContent='密钥无效或已过期。请确认大小写，或向邀请人重新索取。';}
  });
  code.addEventListener('input',function(){code.classList.remove('error');fb.className='feedback';});
})();
</script>
</body>
</html>
