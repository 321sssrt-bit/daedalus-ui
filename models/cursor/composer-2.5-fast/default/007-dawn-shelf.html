<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>晨光架 · 欢迎空态</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --page:#faf5ff;--surface:#ffffff;--text:#4c1d6e;--muted:#9b7bb8;
  --accent:#9333ea;--dawn:#f0abfc;--soft:#ede9fe;--secondary:#7c3aed;
}
html{font-family:"PingFang SC","Helvetica Neue",sans-serif;background:var(--page);color:var(--text);min-height:100vh}
body{min-height:100vh;display:flex;flex-direction:column}
.nav{height:56px;padding:0 40px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e9d5ff;background:rgba(255,255,255,.7)}
.nav-brand{font-weight:700;font-size:16px;color:var(--accent)}
.nav-user{font-size:13px;color:var(--muted)}
.empty{flex:1;display:flex;align-items:center;justify-content:center;padding:48px 32px}
.empty-inner{text-align:center;max-width:520px}
.shelf{margin:0 auto 32px;width:280px;height:160px;position:relative}
.shelf svg{width:100%;height:100%}
.empty h1{font-size:28px;font-weight:600;margin-bottom:12px;background:linear-gradient(135deg,var(--accent),var(--dawn));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.empty p{font-size:15px;color:var(--muted);line-height:1.75;margin-bottom:36px}
.actions{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.btn{padding:0 28px;height:48px;border-radius:24px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;border:none;transition:transform .15s,box-shadow .2s}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 4px 16px rgba(147,51,234,.3)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(147,51,234,.35)}
.btn-secondary{background:var(--soft);color:var(--secondary);border:1px solid #ddd6fe}
.btn-secondary:hover{background:#e9d5ff}
.tip{margin-top:32px;font-size:13px;color:var(--muted)}
@media(max-width:768px){.nav{padding:0 24px}.actions{flex-direction:column;align-items:stretch}.btn{width:100%}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="nav">
  <span class="nav-brand">晨光架</span>
  <span class="nav-user">你好，晓晨</span>
</header>
<main class="empty">
  <div class="empty-inner">
    <div class="shelf">
      <svg viewBox="0 0 280 160" fill="none">
        <rect x="20" y="100" width="240" height="8" rx="2" fill="#ddd6fe"/>
        <rect x="20" y="130" width="240" height="8" rx="2" fill="#e9d5ff"/>
        <rect x="40" y="60" width="200" height="40" rx="4" fill="#faf5ff" stroke="#e9d5ff" stroke-width="2" stroke-dasharray="6 4"/>
        <circle cx="140" cy="50" r="24" fill="#f0abfc" opacity=".5"/>
        <path d="M130 50h20M140 40v20" stroke="#9333ea" stroke-width="2" stroke-linecap="round" opacity=".6"/>
      </svg>
    </div>
    <h1>架子还是空的</h1>
    <p>欢迎加入晨光架！这里会存放你的阅读清单与收藏。现在还没有任何条目，从第一本书或第一篇文章开始吧。</p>
    <div class="actions">
      <button type="button" class="btn btn-primary" id="startBtn">添加第一条收藏</button>
      <button type="button" class="btn btn-secondary" id="importBtn">从浏览器导入</button>
    </div>
    <p class="tip" id="tip"></p>
  </div>
</main>
<script>
document.getElementById('startBtn').addEventListener('click',function(){
  document.getElementById('tip').textContent='已打开「添加收藏」对话框（演示）。';
});
document.getElementById('importBtn').addEventListener('click',function(){
  document.getElementById('tip').textContent='正在准备导入向导，请稍候…（演示）';
});
</script>
</body>
</html>
