<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>深读目录 · 卷十二</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
:root{--page:#f5efe4;--surface:#fffcf7;--text:#2c2416;--muted:#7a6f5e;--accent:#8b4513;--line:#e0d5c4;--active:#fff8ee}
html,body{height:100%;background:var(--page);color:var(--text);font-family:"Songti SC","SimSun",serif;line-height:1.6}
body{display:flex;justify-content:center;align-items:flex-start;min-height:800px;padding:24px}
.frame{width:1280px;height:800px;background:var(--surface);border:1px solid var(--line);display:grid;grid-template-columns:320px 1fr;overflow:hidden;box-shadow:0 12px 40px rgba(44,36,22,.08)}
aside{border-right:1px solid var(--line);display:flex;flex-direction:column;background:linear-gradient(180deg,#faf6f0 0%,var(--surface) 100%)}
.brand{padding:28px 24px 16px;border-bottom:1px solid var(--line)}
.brand h1{font-size:22px;font-weight:700;letter-spacing:.12em}
.brand p{font-size:13px;color:var(--muted);margin-top:6px;font-family:system-ui,sans-serif}
.index-list{flex:1;overflow-y:auto;padding:12px 8px}
.index-item{width:100%;text-align:left;border:none;background:transparent;padding:14px 16px;border-radius:6px;cursor:pointer;font-family:inherit;transition:background .2s}
.index-item:hover{background:var(--active)}
.index-item:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.index-item.active{background:var(--active);border-left:3px solid var(--accent);padding-left:13px}
.index-item .num{font-size:11px;color:var(--accent);font-family:system-ui,sans-serif;letter-spacing:.08em}
.index-item .title{display:block;font-size:15px;margin:4px 0 2px;font-weight:600}
.index-item .author{font-size:12px;color:var(--muted);font-family:system-ui,sans-serif}
main{display:flex;flex-direction:column;overflow:hidden}
.main-head{padding:28px 40px 20px;border-bottom:1px solid var(--line)}
.main-head h2{font-size:28px;font-weight:700;line-height:1.35}
.main-head .meta{margin-top:10px;font-size:14px;color:var(--muted);font-family:system-ui,sans-serif}
.main-head .meta span{margin-right:16px}
.abstract{flex:1;padding:32px 40px;overflow-y:auto}
.abstract p{font-size:17px;line-height:1.85;color:#3d3428;margin-bottom:16px}
.abstract .tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:24px}
.tag{font-size:12px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-family:system-ui,sans-serif}
.empty-hint{color:var(--muted);font-size:15px;font-family:system-ui,sans-serif}
footer.main-foot{padding:16px 40px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);font-family:system-ui,sans-serif;display:flex;justify-content:space-between}
.btn-read{background:var(--accent);color:#fff;border:none;padding:8px 18px;border-radius:4px;font-size:13px;cursor:pointer;font-family:system-ui,sans-serif}
.btn-read:hover{background:#6d3610}
.btn-read:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media(max-width:768px){.frame{width:100%;height:auto;min-height:600px;grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="frame">
<aside>
<div class="brand"><h1>深读目录</h1><p>卷十二 · 2026 春刊</p></div>
<nav class="index-list" id="indexList"></nav>
</aside>
<main>
<div class="main-head" id="mainHead"><h2>选择一篇开始阅读</h2><div class="meta"><span class="empty-hint">点击左侧目录查看摘要</span></div></div>
<div class="abstract" id="abstract"><p class="empty-hint">本辑收录六篇长文，涵盖城市、工艺与数字记忆。请从目录中选择条目。</p></div>
<footer class="main-foot"><span id="footInfo">共 6 篇 · 预计阅读 2 小时</span><button class="btn-read" id="btnRead" disabled>阅读全文</button></footer>
</main>
</div>
<script>
const articles=[
{num:"01",title:"河埠头的早市与记忆",author:"林晚舟 · 城市观察",source:"《城迹》",read:"18 分钟",tags:["城市","口述史"],abstract:"作者回到故乡河埠，记录清晨六点起陆续开张的小摊：豆浆、捆粄、修鞋匠。文章以气味与声音串联三代人的迁徙故事，追问「故乡」在高铁时代是否仍具坐标意义。"},
{num:"02",title:"手工纸坊的最后冬天",author:"周墨白 · 工艺纪实",source:"《匠录》",read:"22 分钟",tags:["非遗","手工"],abstract:"浙江一处即将停产的手工纸坊，师傅们仍在寒夜里抄纸、晒纸。摄影与访谈交织，呈现技艺传承中的沉默妥协，以及年轻人离开与留下的两种选择。"},
{num:"03",title:"算法推荐下的阅读窄门",author:"陈知微 · 文化评论",source:"《思辨》",read:"15 分钟",tags:["媒介","阅读"],abstract:"当首页无限刷新成为日常，深度阅读是否正在变成少数人的特权？本文梳理推荐系统的设计逻辑，并引用三项独立研究，讨论「信息茧房」之外更隐蔽的注意力分配机制。"},
{num:"04",title:"阳台上的微型菜圃实验",author:"何清和 · 生活笔记",source:"《慢活》",read:"12 分钟",tags:["生活","实验"],abstract:"在二十平米出租屋里，作者用三个月记录九种蔬菜的发芽、虫害与收获。失败与成功同样被写入日志，构成一份可复制的城市种植备忘。"},
{num:"05",title:"旧相册里的家族语法",author:"苏念安 · 家族史",source:"《档案》",read:"25 分钟",tags:["家庭","摄影"],abstract:"一盒泛黄相片，背面潦草的字迹是唯一的说明。作者尝试用口述与旁证还原四位长辈的青年时代，发现家族叙事中那些被省略的章节。"},
{num:"06",title:"夜行巴士与边缘城镇",author:"顾远 · 旅行随笔",source:"《途》",read:"20 分钟",tags:["旅行","城镇"],abstract:"搭乘末班夜行巴士穿越三省交界的小城，车窗外的霓虹与空荡站台交替出现。文章以路线为骨，写边缘城镇在物流与直播经济中的缓慢变形。"}
];
const list=document.getElementById('indexList');
const head=document.getElementById('mainHead');
const abs=document.getElementById('abstract');
const btn=document.getElementById('btnRead');
let active=0;
articles.forEach((a,i)=>{
const b=document.createElement('button');
b.className='index-item'+(i===0?' active':'');
b.innerHTML=`<span class="num">${a.num}</span><span class="title">${a.title}</span><span class="author">${a.author}</span>`;
b.onclick=()=>select(i);
list.appendChild(b);
});
function select(i){
active=i;const a=articles[i];
document.querySelectorAll('.index-item').forEach((el,j)=>el.classList.toggle('active',j===i));
head.innerHTML=`<h2>${a.title}</h2><div class="meta"><span>${a.author}</span><span>来源：${a.source}</span><span>${a.read}</span></div>`;
abs.innerHTML=`<p>${a.abstract}</p><div class="tags">${a.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>`;
btn.disabled=false;btn.textContent='阅读全文';
document.getElementById('footInfo').textContent=`第 ${a.num} 篇 · 预计 ${a.read}`;
}
select(0);
btn.onclick=()=>{btn.textContent='已加入阅读队列';btn.disabled=true;};
</script>
</body>
</html>
