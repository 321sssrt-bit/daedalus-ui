<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>轨协 · 团队协作</title>
<style>
:root{--page:#f0f4f8;--surface:#ffffff;--text:#1e293b;--muted:#64748b;--accent:#2563eb;--accent-light:#dbeafe;--border:#e2e8f0;--warning:#d97706;--success:#059669;--error:#dc2626}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:var(--page);color:var(--text);min-height:100vh}
.app{max-width:1280px;margin:0 auto;padding:24px 32px;display:grid;grid-template-columns:280px 1fr 300px;gap:24px;min-height:calc(100vh - 48px)}
.sidebar{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px}
.sidebar h2{font-size:16px;margin-bottom:16px}
.task-list{display:flex;flex-direction:column;gap:8px}
.task-item{padding:12px;border:1px solid var(--border);border-radius:10px;cursor:pointer;font-size:14px}
.task-item:hover,.task-item.active{border-color:var(--accent);background:var(--accent-light)}
.task-item.locked{border-color:var(--warning);opacity:.85}
.main{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px}
.main h1{font-size:22px;margin-bottom:8px}
.status-pills{display:flex;gap:8px;margin:16px 0}
.pill{padding:6px 14px;border:1px solid var(--border);border-radius:20px;font-size:13px;cursor:pointer;background:#fff}
.pill.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.form-group{margin:16px 0}
.form-group label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.form-group input,.form-group select{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px}
.btn{padding:10px 20px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:none;margin-right:8px;margin-top:8px}
.btn-primary{background:var(--accent);color:#fff}
.btn-secondary{background:#fff;border:1px solid var(--border);color:var(--text)}
.btn:hover{filter:brightness(.97)}
.activity{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px}
.activity h3{font-size:14px;color:var(--muted);margin-bottom:12px}
.log-entry{font-size:13px;padding:10px 0;border-bottom:1px solid var(--border);line-height:1.5}
.log-entry:last-child{border:none}
.log-time{color:var(--muted);font-size:11px}
.alert{padding:12px 16px;border-radius:10px;margin:12px 0;font-size:14px}
.alert-error{background:#fef2f2;color:var(--error);border:1px solid #fecaca}
.alert-info{background:#fffbeb;color:var(--warning);border:1px solid #fde68a}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);align-items:center;justify-content:center;z-index:100}
.modal-overlay.show{display:flex}
.modal{background:var(--surface);border-radius:12px;padding:24px;max-width:400px;width:90%}
.badge{font-size:11px;padding:2px 8px;border-radius:6px;background:var(--warning);color:#fff;margin-left:8px}
@media(max-width:768px){.app{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
<h2>任务列表</h2>
<div class="task-list" id="taskList"></div>
<button class="btn btn-primary" style="width:100%;margin-top:12px" id="newTaskBtn">+ 新建任务</button>
</aside>
<main class="main" id="mainPanel">
<h1 id="taskTitle">选择或创建任务</h1>
<p id="taskDesc" style="color:var(--muted);font-size:14px"></p>
<div id="permAlert"></div>
<div id="taskDetail" style="display:none">
<div class="status-pills" id="statusPills"></div>
<div class="form-group"><label>负责人</label><select id="assignee"><option value="">未分派</option><option value="Alice">Alice · 设计</option><option value="Bob">Bob · 开发</option><option value="Carol">Carol · 产品</option></select></div>
<button class="btn btn-primary" id="saveTask">保存变更</button>
<button class="btn btn-secondary" id="applyAccess" style="display:none">申请编辑权限</button>
</div>
<div id="createForm" style="display:none">
<div class="form-group"><label>任务标题</label><input id="newTitle" placeholder="输入任务名称"></div>
<div class="form-group"><label>描述</label><input id="newDesc" placeholder="简要描述"></div>
<button class="btn btn-primary" id="createTask">创建</button>
<button class="btn btn-secondary" id="cancelCreate">取消</button>
</div>
</main>
<aside class="activity">
<h3>活动记录</h3>
<div id="activityLog"><p style="color:var(--muted);font-size:13px">暂无活动</p></div>
</aside>
</div>
<div class="modal-overlay" id="permModal">
<div class="modal">
<h3 style="margin-bottom:12px">权限申请已提交</h3>
<p style="font-size:14px;color:var(--muted);margin-bottom:16px">管理员将在 24 小时内处理。您可先处理有权限的任务。</p>
<button class="btn btn-primary" id="closeModal">知道了</button>
</div>
</div>
<script>
const statuses=['待办','进行中','已完成'];
let tasks=[{id:1,title:'首页改版方案',desc:'输出新版首页信息架构',status:'待办',assignee:'',locked:false},{id:2,title:'Q3 财务报告',desc:'仅限财务组编辑',status:'进行中',assignee:'Carol',locked:true}];
let logs=[],cur=null,accessGranted=false;
const $=id=>document.getElementById(id);
function addLog(text){logs.unshift({text,time:new Date().toLocaleTimeString('zh-CN')});renderLog();}
function renderLog(){$('activityLog').innerHTML=logs.length?logs.map(l=>`<div class="log-entry">${l.text}<div class="log-time">${l.time}</div></div>`).join(''):'<p style="color:var(--muted);font-size:13px">暂无活动</p>';}
function renderList(){$('taskList').innerHTML=tasks.map(t=>`<div class="task-item${cur&&cur.id===t.id?' active':''}${t.locked?' locked':''}" data-id="${t.id}">${t.title}${t.locked?' <span class="badge">受限</span>':''}</div>`).join('');
document.querySelectorAll('.task-item').forEach(el=>el.onclick=()=>selectTask(+el.dataset.id));}
function selectTask(id){cur=tasks.find(t=>t.id===id);$('taskTitle').textContent=cur.title;$('taskDesc').textContent=cur.desc;$('createForm').style.display='none';$('taskDetail').style.display='block';$('permAlert').innerHTML='';
if(cur.locked&&!accessGranted){$('permAlert').innerHTML='<div class="alert alert-info">此任务需要「财务编辑」权限，当前为只读。</div>';$('applyAccess').style.display='inline-block';}else $('applyAccess').style.display='none';
$('statusPills').innerHTML=statuses.map(s=>`<button class="pill${s===cur.status?' active':''}" data-s="${s}">${s}</button>`).join('');
document.querySelectorAll('.pill').forEach(p=>p.onclick=()=>tryStatus(p.dataset.s));
$('assignee').value=cur.assignee;renderList();}
function tryStatus(s){if(cur.locked&&!accessGranted){$('permAlert').innerHTML='<div class="alert alert-error"><strong>权限不足</strong>：您无权修改此任务状态，变更未保存。</div>';return;}
const old=cur.status;cur.status=s;addLog(`「${cur.title}」状态从 ${old} 变更为 ${s}`);$('permAlert').innerHTML='';renderList();selectTask(cur.id);}
$('saveTask').onclick=()=>{if(cur.locked&&!accessGranted){$('permAlert').innerHTML='<div class="alert alert-error"><strong>权限不足</strong>：您无权修改负责人，变更未写入。</div>';return;}
const a=$('assignee').value;if(a!==cur.assignee){addLog(`「${cur.title}」分派给 ${a||'未分派'}`);cur.assignee=a;}};
$('applyAccess').onclick=()=>{$('permModal').classList.add('show');accessGranted=true;addLog('已提交「Q3 财务报告」编辑权限申请');};
$('closeModal').onclick=()=>{$('permModal').classList.remove('show');$('permAlert').innerHTML='<div class="alert alert-info">权限已通过（演示），现在可以编辑受限任务。</div>';$('applyAccess').style.display='none';selectTask(cur.id);};
$('newTaskBtn').onclick=()=>{cur=null;$('taskTitle').textContent='新建任务';$('taskDesc').textContent='';$('taskDetail').style.display='none';$('createForm').style.display='block';$('permAlert').innerHTML='';renderList();};
$('cancelCreate').onclick=()=>{$('createForm').style.display='none';};
$('createTask').onclick=()=>{const t=$('newTitle').value.trim();if(!t)return;const n={id:Date.now(),title:t,desc:$('newDesc').value,status:'待办',assignee:'',locked:false};tasks.push(n);addLog(`创建任务「${t}」`);selectTask(n.id);};
renderList();
</script>
</body>
</html>
