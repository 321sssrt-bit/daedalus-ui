<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>黄铜栓 · 二次验证</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --page:#1c1f24;--surface:#262b33;--text:#e2e0dc;--muted:#8a9099;
  --accent:#c9952a;--brass:#ddb855;--error:#e05252;--lock:#6b7280;
}
html{font-family:"Consolas","Courier New",monospace;background:var(--page);color:var(--text);min-height:100vh}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px}
.card{width:100%;max-width:440px;background:var(--surface);border:1px solid #3a4049;border-radius:2px;padding:40px 36px;box-shadow:inset 0 1px 0 rgba(221,184,85,.15)}
.header{display:flex;align-items:center;gap:12px;margin-bottom:28px;padding-bottom:20px;border-bottom:1px solid #3a4049}
.header svg{width:32px;height:32px}
.header h1{font-size:16px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--brass)}
.sub{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:28px;font-family:"PingFang SC",sans-serif}
.otp-row{display:flex;gap:10px;justify-content:center;margin-bottom:20px}
.otp-row input{width:52px;height:60px;text-align:center;font-size:24px;font-family:inherit;background:#15181d;border:2px solid #3a4049;border-radius:2px;color:var(--brass);caret-color:var(--accent)}
.otp-row input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.otp-row input.filled{border-color:var(--brass)}
.otp-row input.error{border-color:var(--error);animation:blink .5s 2}
@keyframes blink{50%{background:rgba(224,82,82,.15)}}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-family:"PingFang SC",sans-serif;margin-bottom:24px}
.countdown{color:var(--muted)}
.resend{background:none;border:none;color:var(--accent);cursor:pointer;font-family:inherit;font-size:12px;text-decoration:underline}
.resend:disabled{color:var(--lock);cursor:not-allowed;text-decoration:none}
.btn-verify{width:100%;height:46px;background:linear-gradient(180deg,var(--brass),var(--accent));color:#1c1f24;border:none;border-radius:2px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;letter-spacing:.08em}
.btn-verify:hover{filter:brightness(1.08)}
.btn-verify:disabled{opacity:.4;cursor:not-allowed;filter:none}
.alert{padding:12px 14px;border-radius:2px;font-size:13px;font-family:"PingFang SC",sans-serif;margin-top:16px;display:none;line-height:1.5}
.alert.err{display:block;background:rgba(224,82,82,.12);border:1px solid var(--error);color:#f5a5a5}
.alert.lock{display:block;background:rgba(107,114,128,.2);border:1px solid var(--lock);color:var(--muted)}
@media(max-width:768px){.otp-row input{width:44px;height:52px;font-size:20px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <svg viewBox="0 0 32 32"><rect x="6" y="14" width="20" height="14" rx="1" stroke="#ddb855" stroke-width="1.5" fill="none"/><path d="M10 14v-4a6 6 0 1112 0v4" stroke="#c9952a" stroke-width="1.5" fill="none"/></svg>
    <h1>二次验证</h1>
  </div>
  <p class="sub">已向尾号 8826 的手机发送 6 位验证码。请输入以确认是您本人操作。</p>
  <div class="otp-row" id="otpRow">
    <input maxlength="1" inputmode="numeric" aria-label="第1位">
    <input maxlength="1" inputmode="numeric" aria-label="第2位">
    <input maxlength="1" inputmode="numeric" aria-label="第3位">
    <input maxlength="1" inputmode="numeric" aria-label="第4位">
    <input maxlength="1" inputmode="numeric" aria-label="第5位">
    <input maxlength="1" inputmode="numeric" aria-label="第6位">
  </div>
  <div class="meta">
    <span class="countdown" id="countdown">59 秒后失效</span>
    <button type="button" class="resend" id="resendBtn" disabled>重发验证码</button>
  </div>
  <button type="button" class="btn-verify" id="verifyBtn" disabled>验证并进入</button>
  <div class="alert" id="alert" role="alert"></div>
</div>
<script>
(function(){
  var inputs=[].slice.call(document.querySelectorAll('.otp-row input')),failCount=0,locked=false;
  var verifyBtn=document.getElementById('verifyBtn'),alertEl=document.getElementById('alert');
  var sec=59,cd=document.getElementById('countdown'),resend=document.getElementById('resendBtn');
  setInterval(function(){if(sec>0&&!locked){sec--;cd.textContent=sec+' 秒后失效';if(sec===0){resend.disabled=false;cd.textContent='验证码已过期';}}},1000);
  resend.addEventListener('click',function(){if(resend.disabled)return;sec=59;resend.disabled=true;alertEl.className='alert';cd.textContent=sec+' 秒后失效';});
  inputs.forEach(function(inp,i){
    inp.addEventListener('input',function(){
      if(locked)return;
      inp.value=inp.value.replace(/\D/g,'').slice(0,1);
      inp.classList.toggle('filled',!!inp.value);
      if(inp.value&&i<inputs.length-1)inputs[i+1].focus();
      verifyBtn.disabled=inputs.some(function(x){return!x.value;});
      alertEl.className='alert';
    });
    inp.addEventListener('keydown',function(e){if(e.key==='Backspace'&&!inp.value&&i>0)inputs[i-1].focus();});
  });
  verifyBtn.addEventListener('click',function(){
    if(locked)return;
    var code=inputs.map(function(x){return x.value;}).join('');
    alertEl.className='alert';
    if(code==='123456'){alertEl.style.display='none';verifyBtn.textContent='验证成功';verifyBtn.disabled=true;return;}
    failCount++;
    inputs.forEach(function(x){x.classList.add('error');});
    if(failCount>=3){
      locked=true;verifyBtn.disabled=true;inputs.forEach(function(x){x.disabled=true;});
      alertEl.className='alert lock';alertEl.textContent='已连续失败 3 次，账户验证已锁定 15 分钟。请稍后重试或联系管理员。';
    }else{
      alertEl.className='alert err';alertEl.textContent='验证码错误，还可尝试 '+(3-failCount)+' 次。';
    }
    setTimeout(function(){inputs.forEach(function(x){x.classList.remove('error');});},600);
  });
})();
</script>
</body>
</html>
