<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>成员目录 · 人物图集</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--page:#e8f0e4;--surface:#f7faf5;--text:#1a2e1a;--muted:#5c735c;--accent:#2d6a4f;--accent-soft:#b7e4c7;--border:#c5d4c0;--avatar:#40916c}
html,body{height:100%;font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--page);color:var(--text)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
body{min-width:768px}
.shell{max-width:1280px;min-height:800px;margin:0 auto;padding:28px 40px;display:grid;grid-template-columns:1fr 340px;gap:28px}
.main{display:flex;flex-direction:column;gap:20px}
header h1{font-size:26px;font-weight:700;margin-bottom:4px}
header p{color:var(--muted);font-size:14px}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters button{border:1px solid var(--border);background:var(--surface);padding:8px 16px;border-radius:6px;font-size:13px;cursor:pointer;font-family:inherit;color:var(--muted)}
.filters button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.person{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;text-align:center;cursor:pointer;transition:box-shadow .2s,transform .2s}
@media (prefers-reduced-motion:reduce){.person{transition:none}}
.person:hover{box-shadow:0 8px 24px rgba(45,106,79,.12);transform:translateY(-2px)}
.avatar{width:64px;height:64px;border-radius:50%;background:var(--avatar);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:600;margin:0 auto 12px}
.person h3{font-size:15px;font-weight:600;margin-bottom:4px}
.person .role{font-size:12px;color:var(--muted)}
.profile{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:24px;align-self:start;position:sticky;top:28px}
.profile.empty{display:flex;align-items:center;justify-content:center;min-height:320px;color:var(--muted);font-size:14px;text-align:center;line-height:1.6}
.profile .avatar{width:80px;height:80px;font-size:28px;margin:0 0 16px}
.profile h2{font-size:20px;margin-bottom:4px}
.profile .role{font-size:14px;color:var(--accent);margin-bottom:16px;font-weight:600}
.profile .bio{font-size:14px;line-height:1.7;color:var(--muted);margin-bottom:16px}
.profile .meta{font-size:12px;color:var(--muted);line-height:1.8}
.profile .close{margin-top:16px;border:none;background:var(--accent-soft);color:var(--accent);padding:8px 16px;border-radius:6px;cursor:pointer;font-family:inherit;font-size:13px}
</style>
</head>
<body>
<div class="shell">
  <div class="main">
    <header><h1>人物图集</h1><p>Atlas 实验室 · 共 12 人</p></header>
    <div class="filters" id="filters">
      <button type="button" class="active" data-dept="all">全部</button>
      <button type="button" data-dept="research">研究</button>
      <button type="button" data-dept="eng">工程</button>
      <button type="button" data-dept="ops">运营</button>
    </div>
    <div class="grid" id="grid"></div>
  </div>
  <aside class="profile empty" id="profile">点击任意成员<br>查看简介</aside>
</div>
<script>
const PEOPLE=[
  {id:1,name:"周远",role:"首席研究员",dept:"research",initial:"周",bio:"专注分布式系统与边缘计算，主导 Atlas 核心架构。",meta:"上海 · 加入 2019 · zhou@atlas.lab"},
  {id:2,name:"韩露",role:"算法工程师",dept:"research",initial:"韩",bio:"机器学习与推荐系统，负责实验平台模型管线。",meta:"北京 · 加入 2021 · han@atlas.lab"},
  {id:3,name:"吴铮",role:"前端 Tech Lead",dept:"eng",initial:"吴",bio:"设计系统与性能优化，维护内部组件库。",meta:"杭州 · 加入 2020 · wu@atlas.lab"},
  {id:4,name:"孙悦",role:"后端工程师",dept:"eng",initial:"孙",bio:"API 网关与消息队列，保障 99.95% SLA。",meta:"深圳 · 加入 2022 · sun@atlas.lab"},
  {id:5,name:"赵琳",role:"产品经理",dept:"ops",initial:"赵",bio:"B 端协作工具产品线，对接 40+ 企业客户。",meta:"上海 · 加入 2018 · zhao@atlas.lab"},
  {id:6,name:"钱程",role:"DevOps",dept:"eng",initial:"钱",bio:"K8s 集群与 CI/CD，推动 GitOps 落地。",meta:"成都 · 加入 2021 · qian@atlas.lab"},
  {id:7,name:"郑雅",role:"UX 设计师",dept:"ops",initial:"郑",bio:"信息架构与可用性测试，定义 Atlas 视觉语言。",meta:"广州 · 加入 2020 · zheng@atlas.lab"},
  {id:8,name:"冯博",role:"研究助理",dept:"research",initial:"冯",bio:"文献调研与实验复现，协助论文与专利撰写。",meta:"武汉 · 加入 2023 · feng@atlas.lab"}
];
let dept="all";
const grid=document.getElementById("grid"),profile=document.getElementById("profile");
function renderGrid(){
  grid.innerHTML=PEOPLE.filter(p=>dept==="all"||p.dept===dept).map(p=>`
    <article class="person" data-id="${p.id}"><div class="avatar">${p.initial}</div><h3>${p.name}</h3><div class="role">${p.role}</div></article>`).join("");
}
function showProfile(p){
  profile.classList.remove("empty");
  profile.innerHTML=`<div class="avatar">${p.initial}</div><h2>${p.name}</h2><div class="role">${p.role}</div><p class="bio">${p.bio}</p><p class="meta">${p.meta}</p><button class="close" type="button">关闭</button>`;
  profile.querySelector(".close").onclick=()=>{profile.classList.add("empty");profile.innerHTML="点击任意成员<br>查看简介";};
}
grid.onclick=e=>{const el=e.target.closest(".person");if(!el)return;showProfile(PEOPLE.find(p=>p.id===+el.dataset.id));};
document.getElementById("filters").onclick=e=>{const b=e.target.closest("button");if(!b)return;document.querySelectorAll(".filters button").forEach(x=>x.classList.remove("active"));b.classList.add("active");dept=b.dataset.dept;renderGrid();};
renderGrid();
</script>
</body>
</html>
