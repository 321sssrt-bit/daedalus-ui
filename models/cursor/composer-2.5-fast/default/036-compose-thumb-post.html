<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>编辑发布 · 拇指帖</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --page:#fff5f2;--surface:#fff;--text:#2d1a14;--muted:#9a7b72;
  --accent:#ff6b4a;--accent2:#e85a3a;--draft:#6b8cce;--border:#f0ddd6;
  --warn:#e6a817;--font:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
}
html{font-family:var(--font);background:#e8c4b8;min-height:100vh}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.phone{width:390px;height:844px;background:var(--page);border-radius:44px;border:8px solid #1a1a1a;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 32px 64px rgba(0,0,0,.2);position:relative}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:120px;height:28px;background:#1a1a1a;border-radius:0 0 18px 18px;z-index:10}
.toolbar{padding:48px 16px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);background:var(--surface)}
.toolbar button{background:none;border:none;font-size:15px;cursor:pointer;padding:8px 12px;border-radius:8px}
.toolbar .cancel{color:var(--muted)}
.toolbar .cancel:hover{background:var(--page)}
.toolbar .publish{background:var(--accent);color:#fff;font-weight:600;border-radius:20px;padding:8px 20px}
.toolbar .publish:disabled{opacity:.4;cursor:not-allowed}
.toolbar .publish:not(:disabled):hover{background:var(--accent2)}
.form{flex:1;padding:20px;display:flex;flex-direction:column;gap:16px;overflow-y:auto}
.form input,.form textarea{width:100%;border:none;background:transparent;font-family:inherit;color:var(--text);resize:none}
.form input{font-size:20px;font-weight:600;padding:4px 0;border-bottom:1px solid var(--border)}
.form input::placeholder{color:var(--muted);font-weight:400}
.form input:focus{outline:none;border-bottom-color:var(--accent)}
.form textarea{flex:1;font-size:16px;line-height:1.65;padding:8px 0;min-height:200px}
.form textarea::placeholder{color:var(--muted)}
.form textarea:focus{outline:none}
.status-bar{display:flex;justify-content:space-between;align-items:center;padding:12px 20px 28px;background:var(--surface);border-top:1px solid var(--border)}
.counter{font-size:13px;color:var(--muted)}
.counter.warn{color:var(--warn);font-weight:600}
.draft-btn{background:none;border:1px solid var(--draft);color:var(--draft);padding:10px 18px;border-radius:20px;font-size:14px;cursor:pointer;font-weight:500}
.draft-btn:hover{background:rgba(107,140,206,.08)}
.draft-btn:focus-visible{outline:2px solid var(--draft);outline-offset:2px}
.toast{position:absolute;top:100px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="phone">
  <div class="notch"></div>
  <div class="toolbar">
    <button class="cancel" id="cancelBtn">取消</button>
    <button class="publish" id="publishBtn" disabled>发布</button>
  </div>
  <div class="form">
    <input type="text" id="title" placeholder="写个标题（可选）" maxlength="60">
    <textarea id="body" placeholder="分享此刻的想法…" maxlength="500"></textarea>
  </div>
  <div class="status-bar">
    <span class="counter" id="counter">0 / 500 字 · 草稿未保存</span>
    <button class="draft-btn" id="draftBtn">存草稿</button>
  </div>
  <div class="toast" id="toast"></div>
</div>
<script>
const title=document.getElementById('title'),body=document.getElementById('body'),counter=document.getElementById('counter'),publishBtn=document.getElementById('publishBtn'),draftBtn=document.getElementById('draftBtn'),toast=document.getElementById('toast');
function update(){
  const n=body.value.length;
  counter.textContent=n+' / 500 字 · '+(draftBtn.dataset.saved==='1'?'草稿已保存':'草稿未保存');
  counter.classList.toggle('warn',n>450);
  publishBtn.disabled=n<10;
}
body.addEventListener('input',update);
title.addEventListener('input',update);
draftBtn.addEventListener('click',()=>{draftBtn.dataset.saved='1';update();show('草稿已保存');});
publishBtn.addEventListener('click',()=>{if(publishBtn.disabled)return;show('发布成功');publishBtn.textContent='已发布';publishBtn.disabled=true;});
document.getElementById('cancelBtn').addEventListener('click',()=>show('已放弃编辑'));
function show(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1500);}
</script>
</body>
</html>
