<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>途座 · 出行订票</title>
<style>
:root{--page:#ecfdf5;--surface:#ffffff;--text:#14532d;--muted:#6b7280;--accent:#059669;--accent-light:#d1fae5;--border:#d1d5db;--error:#dc2626;--warn:#d97706}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:var(--page);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.phone{width:390px;height:844px;background:var(--surface);border-radius:40px;border:3px solid var(--border);overflow:hidden;display:flex;flex-direction:column}
.header{padding:16px 20px;border-bottom:1px solid var(--border);font-size:18px;font-weight:700;color:var(--accent)}
.screen{display:none;flex:1;flex-direction:column;overflow:hidden}.screen.active{display:flex}
.content{flex:1;overflow-y:auto;padding:16px 20px}
.search-row{display:flex;gap:8px;margin-bottom:16px}
.search-row input{flex:1;padding:12px;border:1px solid var(--border);border-radius:10px;font-size:14px}
.btn{padding:12px 20px;background:var(--accent);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer}
.btn:disabled{background:#9ca3af}
.btn-outline{background:#fff;color:var(--accent);border:1px solid var(--accent)}
.card{border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;cursor:pointer}
.card:hover,.card.selected{border-color:var(--accent);background:var(--accent-light)}
.card.soldout{opacity:.6;border-color:var(--warn)}
.card.soldout .tag{display:inline-block;background:#fef3c7;color:var(--warn);font-size:11px;padding:2px 8px;border-radius:6px;margin-left:8px}
.seats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0}
.seat{padding:12px 4px;text-align:center;border:1px solid var(--border);border-radius:8px;font-size:13px;cursor:pointer}
.seat:hover,.seat.selected{background:var(--accent);color:#fff;border-color:var(--accent)}
.seat.sold{background:#f3f4f6;color:#9ca3af;cursor:not-allowed;text-decoration:line-through}
.alert{padding:12px;border-radius:10px;font-size:13px;margin:12px 0}
.alert-error{background:#fef2f2;color:var(--error)}
.back{color:var(--accent);background:none;border:none;font-size:14px;cursor:pointer;padding:8px 0}
.ticket{text-align:center;padding:30px 20px}
.ticket-qr{width:120px;height:120px;margin:16px auto;background:var(--accent-light);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:48px}
.row{display:flex;justify-content:space-between;padding:8px 0;font-size:14px;border-bottom:1px solid var(--border)}
</style>
</head>
<body>
<div class="phone">
<div id="s1" class="screen active">
<div class="header">途座 · 搜索路线</div>
<div class="content">
<div class="search-row"><input id="fromIn" value="北京南" placeholder="出发"><input id="toIn" value="上海虹桥" placeholder="到达"></div>
<button class="btn" style="width:100%" id="searchBtn">搜索班次</button>
</div>
</div>
<div id="s2" class="screen">
<div class="header">选择班次</div>
<div class="content">
<button class="back" data-back="s1">← 修改路线</button>
<p style="font-size:13px;color:var(--muted);margin-bottom:12px" id="routeLabel">北京南 → 上海虹桥</p>
<div id="scheduleList"></div>
</div>
</div>
<div id="s3" class="screen">
<div class="header">选择座位</div>
<div class="content">
<button class="back" data-back="s2">← 换班次</button>
<p style="font-size:14px;margin-bottom:8px" id="selSchedule">—</p>
<div class="seats" id="seatGrid"></div>
<button class="btn" style="width:100%" id="toConfirm">确认选座</button>
</div>
</div>
<div id="s4" class="screen">
<div class="header">确认订单</div>
<div class="content">
<div id="confirmAlert"></div>
<div class="row"><span>路线</span><span id="cfRoute">—</span></div>
<div class="row"><span>班次</span><span id="cfSched">—</span></div>
<div class="row"><span>座位</span><span id="cfSeat">—</span></div>
<div class="row"><span>票价</span><span id="cfPrice">—</span></div>
<button class="btn" style="width:100%;margin-top:16px" id="submitOrder">提交订单</button>
</div>
</div>
<div id="s5" class="screen">
<div class="content ticket">
<h2 style="color:var(--accent)">行程凭证</h2>
<div class="ticket-qr">🎫</div>
<p id="tkRoute" style="font-weight:600;margin-top:12px">—</p>
<p id="tkDetail" style="font-size:14px;color:var(--muted);margin-top:8px">—</p>
<button class="btn btn-outline" style="width:100%;margin-top:20px" id="restart">完成</button>
</div>
</div>
</div>
<script>
const schedules=[
{id:1,time:'08:00',dur:'4h28m',price:553,soldout:false,seats:['1A','1B','1C','1D','2A','2B','2C','2D']},
{id:2,time:'12:30',dur:'4h35m',price:553,soldout:true,seats:[]},
{id:3,time:'18:15',dur:'4h30m',price:498,soldout:false,seats:['3A','3B','3C','3D','4A','4B']}
];
const soldSeats=['2C'];
let route={from:'北京南',to:'上海虹桥'},selSched=null,selSeat=null;
const $=id=>document.getElementById(id);
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$(id).classList.add('active');}
document.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>show(b.dataset.back));
$('searchBtn').onclick=()=>{route={from:$('fromIn').value,to:$('toIn').value};$('routeLabel').textContent=route.from+' → '+route.to;
$('scheduleList').innerHTML=schedules.map(s=>`<div class="card${s.soldout?' soldout':''}" data-id="${s.id}"><strong>${s.time}</strong> · ${s.dur} · ¥${s.price}${s.soldout?' <span class="tag">售罄</span>':''}</div>`).join('');
document.querySelectorAll('.card').forEach(c=>c.onclick=()=>{selSched=schedules.find(x=>x.id==+c.dataset.id);if(selSched.soldout)return;showSeats();});show('s2');};
function showSeats(){$('selSchedule').textContent=selSched.time+' · ¥'+selSched.price;
const all=[...selSched.seats,...soldSeats.filter(s=>selSched.seats.includes(s))].sort();
$('seatGrid').innerHTML=all.map(s=>`<div class="seat${soldSeats.includes(s)?' sold':''}" data-s="${s}">${s}</div>`).join('');
document.querySelectorAll('.seat:not(.sold)').forEach(el=>el.onclick=()=>{document.querySelectorAll('.seat').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');selSeat=el.dataset.s;});show('s3');}
$('toConfirm').onclick=()=>{if(!selSeat)return;$('cfRoute').textContent=route.from+' → '+route.to;$('cfSched').textContent=selSched.time;$('cfSeat').textContent=selSeat;$('cfPrice').textContent='¥'+selSched.price;$('confirmAlert').innerHTML='';show('s4');};
$('submitOrder').onclick=()=>{if(selSched.soldout){$('confirmAlert').innerHTML='<div class="alert alert-error"><strong>售罄</strong>：该班次已无票，请改选其他班次。</div>';return;}
if(soldSeats.includes(selSeat)){$('confirmAlert').innerHTML='<div class="alert alert-error"><strong>售罄</strong>：座位 '+selSeat+' 已被占用，请重新选择。</div>';return;}
$('tkRoute').textContent=route.from+' → '+route.to;$('tkDetail').textContent=selSched.time+' · 座位 '+selSeat+' · ¥'+selSched.price;show('s5');};
$('restart').onclick=()=>{selSched=null;selSeat=null;show('s1');};
document.querySelectorAll('.card.soldout').forEach(()=>{});
</script>
</body>
</html>
