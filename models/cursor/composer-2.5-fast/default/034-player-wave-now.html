<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>正在播放 · 浪声</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --page:#1a0a2e;--surface:#2d1b4e;--text:#f0e6ff;--muted:#a78bca;
  --accent:#b44dff;--wave:#7c3aed;--radius:20px;
  --font:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
}
html{font-family:var(--font);background:#0d0518;min-height:100vh}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.phone{width:390px;height:844px;background:linear-gradient(180deg,var(--page) 0%,#120820 100%);border-radius:44px;border:8px solid #1a1a1a;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 32px 64px rgba(0,0,0,.4);position:relative}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:120px;height:28px;background:#1a1a1a;border-radius:0 0 18px 18px;z-index:10}
.top{padding:52px 24px 16px;display:flex;align-items:center;justify-content:space-between}
.top button{background:none;border:none;color:var(--muted);cursor:pointer;padding:8px}
.top button svg{width:24px;height:24px}
.top span{font-size:13px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.art-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:0 32px}
.art{width:280px;height:280px;border-radius:var(--radius);background:linear-gradient(145deg,var(--wave),var(--accent));position:relative;overflow:hidden;box-shadow:0 20px 60px rgba(180,77,255,.3)}
.art svg{position:absolute;inset:0;width:100%;height:100%;opacity:.4}
.wave-bar{position:absolute;bottom:0;left:0;right:0;height:60px;display:flex;align-items:flex-end;justify-content:center;gap:3px;padding:0 20px 16px}
.wave-bar span{display:block;width:4px;background:rgba(255,255,255,.6);border-radius:2px;animation:wave 1.2s ease-in-out infinite}
.wave-bar span:nth-child(1){height:20px;animation-delay:0s}
.wave-bar span:nth-child(2){height:35px;animation-delay:.1s}
.wave-bar span:nth-child(3){height:28px;animation-delay:.2s}
.wave-bar span:nth-child(4){height:42px;animation-delay:.3s}
.wave-bar span:nth-child(5){height:24px;animation-delay:.4s}
.wave-bar span:nth-child(6){height:38px;animation-delay:.5s}
.wave-bar span:nth-child(7){height:30px;animation-delay:.6s}
@keyframes wave{0%,100%{transform:scaleY(.5)}50%{transform:scaleY(1)}}
.info{padding:24px 28px 0;text-align:center}
.info h1{font-size:22px;font-weight:700;margin-bottom:6px;line-height:1.3}
.info p{font-size:14px;color:var(--muted)}
.progress-wrap{padding:28px 28px 0}
.progress{height:4px;background:rgba(255,255,255,.15);border-radius:2px;position:relative;cursor:pointer}
.progress-fill{height:100%;width:38%;background:var(--accent);border-radius:2px;position:relative}
.progress-fill::after{content:"";position:absolute;right:-6px;top:-4px;width:12px;height:12px;background:#fff;border-radius:50%;box-shadow:0 0 8px rgba(180,77,255,.6)}
.times{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:8px}
.controls{display:flex;align-items:center;justify-content:center;gap:32px;padding:32px 28px 48px}
.ctrl{background:none;border:none;color:var(--text);cursor:pointer;padding:12px;display:flex;align-items:center;justify-content:center;transition:opacity .2s}
.ctrl:hover{opacity:.8}
.ctrl:focus-visible{outline:2px solid var(--accent);border-radius:50%}
.ctrl svg{width:28px;height:28px}
.ctrl.play{width:64px;height:64px;background:var(--accent);border-radius:50%;box-shadow:0 8px 24px rgba(180,77,255,.4)}
.ctrl.play svg{width:32px;height:32px}
.ctrl.play.paused{background:var(--surface)}
@media(prefers-reduced-motion:reduce){
  .wave-bar span{animation:none;height:30px!important}
  .ctrl{transition:none}
}
</style>
</head>
<body>
<div class="phone">
  <div class="notch"></div>
  <div class="top">
    <button aria-label="收起"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 15l-6-6-6 6"/></svg></button>
    <span>正在播放</span>
    <button aria-label="更多"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg></button>
  </div>
  <div class="art-wrap">
    <div class="art">
      <svg viewBox="0 0 280 280"><circle cx="140" cy="140" r="80" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="2"/><circle cx="140" cy="140" r="50" fill="rgba(255,255,255,.1)"/></svg>
      <div class="wave-bar" id="waveBar"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
    </div>
  </div>
  <div class="info">
    <h1 id="title">夜航 · 第 3 集</h1>
    <p id="artist">声浪播客 · 42 分钟</p>
  </div>
  <div class="progress-wrap">
    <div class="progress" id="progress"><div class="progress-fill" id="progressFill"></div></div>
    <div class="times"><span id="cur">15:48</span><span>41:20</span></div>
  </div>
  <div class="controls">
    <button class="ctrl" id="prevBtn" aria-label="上一首"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
    <button class="ctrl play" id="playBtn" aria-label="暂停"><svg viewBox="0 0 24 24" fill="currentColor" id="playIcon"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg></button>
    <button class="ctrl" id="nextBtn" aria-label="下一首"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 18h2V6h-2zM6 18l8.5-6L6 6v12z"/></svg></button>
  </div>
</div>
<script>
const playBtn=document.getElementById('playBtn'),playIcon=document.getElementById('playIcon'),waveBar=document.getElementById('waveBar'),progressFill=document.getElementById('progressFill'),title=document.getElementById('title'),artist=document.getElementById('artist'),cur=document.getElementById('cur');
let playing=true,pct=38;
const tracks=[{t:'夜航 · 第 3 集',a:'声浪播客 · 42 分钟'},{t:'晨雾电台',a:'独立音乐 · 4:02'},{t:'城市白噪音',a:'专注系列 · 无限循环'}];
let idx=0;
playBtn.addEventListener('click',()=>{
  playing=!playing;
  playBtn.classList.toggle('paused',!playing);
  playIcon.innerHTML=playing?'<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>':'<polygon points="5,3 19,12 5,21"/>';
  waveBar.style.opacity=playing?'1':'.3';
  playBtn.setAttribute('aria-label',playing?'暂停':'播放');
});
document.getElementById('nextBtn').addEventListener('click',()=>{idx=(idx+1)%tracks.length;title.textContent=tracks[idx].t;artist.textContent=tracks[idx].a;pct=0;progressFill.style.width='0%';cur.textContent='0:00';});
document.getElementById('prevBtn').addEventListener('click',()=>{idx=(idx+tracks.length-1)%tracks.length;title.textContent=tracks[idx].t;artist.textContent=tracks[idx].a;});
document.getElementById('progress').addEventListener('click',e=>{const r=e.currentTarget.getBoundingClientRect();pct=Math.round((e.clientX-r.left)/r.width*100);progressFill.style.width=pct+'%';cur.textContent=Math.floor(pct*.412)+':'+String(Math.floor(pct*41.2%60)).padStart(2,'0');});
</script>
</body>
</html>
