<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>步灯引导 · 新手引导</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --page:#fef8ee;--surface:#fffdf8;--text:#4a3728;--muted:#8c7359;
  --accent:#e8872a;--lantern:#f4c56a;--step-active:#d4651a;--skip:#b8a088;
}
html{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:var(--page);color:var(--text);min-height:100vh}
body{min-height:100vh;display:flex;flex-direction:column}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:20px 48px}
.skip-btn{background:none;border:none;color:var(--skip);font-size:14px;cursor:pointer;font-family:inherit;text-decoration:underline}
.skip-btn:hover{color:var(--text)}
.main{flex:1;display:flex;align-items:center;justify-content:center;padding:24px 48px 48px}
.panel{width:100%;max-width:720px;background:var(--surface);border-radius:20px;border:2px solid #f0dfc8;padding:48px;box-shadow:0 16px 48px rgba(232,135,42,.1)}
.steps{display:flex;gap:8px;margin-bottom:40px;justify-content:center}
.step-dot{width:12px;height:12px;border-radius:50%;background:#e8dcc8;transition:background .3s,transform .3s}
.step-dot.active{background:var(--accent);transform:scale(1.2)}
.step-dot.done{background:var(--lantern)}
.illus{text-align:center;margin-bottom:32px}
.illus svg{width:200px;height:140px}
.slide{display:none}
.slide.active{display:block;animation:fadeIn .35s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.slide h2{font-size:24px;margin-bottom:12px;text-align:center}
.slide p{font-size:15px;color:var(--muted);line-height:1.75;text-align:center;max-width:480px;margin:0 auto 32px}
.nav{display:flex;justify-content:space-between;align-items:center;gap:16px}
.btn{padding:0 24px;height:44px;border-radius:22px;font-size:15px;font-family:inherit;cursor:pointer;border:2px solid transparent;transition:background .2s}
.btn-ghost{background:transparent;border-color:#e0cfc0;color:var(--muted)}
.btn-ghost:hover{border-color:var(--accent);color:var(--text)}
.btn-ghost:disabled{opacity:.35;cursor:not-allowed}
.btn-primary{background:var(--accent);color:#fff;font-weight:600}
.btn-primary:hover{background:var(--step-active)}
.progress-text{font-size:13px;color:var(--muted)}
@media(max-width:768px){.topbar,.main{padding-left:24px;padding-right:24px}.panel{padding:32px 24px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="topbar">
  <span style="font-weight:700;color:var(--accent)">步灯</span>
  <button type="button" class="skip-btn" id="skipBtn">跳过引导</button>
</header>
<main class="main">
  <div class="panel">
    <div class="steps" id="steps"><span class="step-dot active"></span><span class="step-dot"></span><span class="step-dot"></span></div>
    <div class="illus" id="illus"></div>
    <div class="slide active" data-step="0">
      <h2>欢迎来到步灯</h2>
      <p>步灯帮你把复杂项目拆成可执行的小步。每天点亮一盏，进度看得见。</p>
    </div>
    <div class="slide" data-step="1">
      <h2>创建你的第一个计划</h2>
      <p>给计划起个名字，设定截止日期。我们会自动建议合理的里程碑。</p>
    </div>
    <div class="slide" data-step="2">
      <h2>与团队同步进度</h2>
      <p>邀请同事加入，每完成一步都会更新共享看板。现在开始吧！</p>
    </div>
    <nav class="nav">
      <button type="button" class="btn btn-ghost" id="prevBtn" disabled>上一步</button>
      <span class="progress-text" id="progText">第 1 步，共 3 步</span>
      <button type="button" class="btn btn-primary" id="nextBtn">下一步</button>
    </nav>
  </div>
</main>
<script>
(function(){
  var cur=0,total=3,slides=document.querySelectorAll('.slide'),dots=document.querySelectorAll('.step-dot');
  var svgs=[
    '<svg viewBox="0 0 200 140"><rect x="70" y="30" width="60" height="80" rx="8" fill="#f4c56a" stroke="#e8872a" stroke-width="2"/><ellipse cx="100" cy="25" rx="20" ry="8" fill="#e8872a" opacity=".5"/><circle cx="100" cy="70" r="12" fill="#fff" opacity=".8"/></svg>',
    '<svg viewBox="0 0 200 140"><rect x="40" y="50" width="120" height="60" rx="6" fill="#fff" stroke="#e8872a" stroke-width="2"/><line x1="60" y1="70" x2="140" y2="70" stroke="#f0dfc8" stroke-width="8" stroke-linecap="round"/><line x1="60" y1="90" x2="110" y2="90" stroke="#f0dfc8" stroke-width="8" stroke-linecap="round"/></svg>',
    '<svg viewBox="0 0 200 140"><circle cx="70" cy="70" r="24" fill="#f4c56a"/><circle cx="100" cy="70" r="24" fill="#e8872a"/><circle cx="130" cy="70" r="24" fill="#d4651a"/><path d="M82 70h16M112 70h16" stroke="#fff" stroke-width="2"/></svg>'
  ];
  function render(){
    slides.forEach(function(s,i){s.classList.toggle('active',i===cur);});
    dots.forEach(function(d,i){d.classList.toggle('active',i===cur);d.classList.toggle('done',i<cur);});
    document.getElementById('illus').innerHTML=svgs[cur];
    document.getElementById('prevBtn').disabled=cur===0;
    document.getElementById('nextBtn').textContent=cur===total-1?'开始用':'下一步';
    document.getElementById('progText').textContent='第 '+(cur+1)+' 步，共 '+total+' 步';
  }
  document.getElementById('nextBtn').addEventListener('click',function(){
    if(cur<total-1){cur++;render();}
    else{document.querySelector('.panel').innerHTML='<div style="text-align:center;padding:48px"><h2 style="margin-bottom:12px">准备就绪</h2><p style="color:#8c7359">你已跳过或完成引导，进入主界面（演示）。</p></div>';}
  });
  document.getElementById('prevBtn').addEventListener('click',function(){if(cur>0){cur--;render();}});
  document.getElementById('skipBtn').addEventListener('click',function(){
    document.querySelector('.panel').innerHTML='<div style="text-align:center;padding:48px"><h2 style="margin-bottom:12px">已跳过引导</h2><p style="color:#8c7359">你可以随时在设置中重新查看新手说明。</p></div>';
  });
  render();
})();
</script>
</body>
</html>
