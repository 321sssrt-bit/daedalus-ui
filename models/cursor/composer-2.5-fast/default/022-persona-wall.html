<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>陆野 · 独立视觉设计师</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
:root{--page:#0a0a0a;--surface:#141414;--text:#f5f5f5;--muted:#888;--accent:#ff4d6d;--card:#1e1e1e;--line:#2a2a2a}
html,body{height:100%;background:var(--page);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body{display:flex;justify-content:center;padding:0}
.frame{width:1280px;height:800px;overflow-y:auto;background:var(--page)}
.hero{padding:48px 56px 32px;display:grid;grid-template-columns:120px 1fr auto;gap:28px;align-items:center;border-bottom:1px solid var(--line)}
.avatar{width:120px;height:120px;border-radius:4px;background:linear-gradient(135deg,var(--accent),#ff8fa3);display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:800;color:#fff}
.hero-text h1{font-size:36px;font-weight:800;letter-spacing:-.02em}
.hero-text .tagline{font-size:16px;color:var(--muted);margin-top:8px;max-width:480px;line-height:1.5}
.hero-actions{display:flex;gap:12px}
.btn{padding:12px 24px;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:transform .15s,background .15s}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:#e63956}
.btn-secondary{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn-secondary:hover{border-color:var(--muted);background:var(--surface)}
.stats{display:flex;gap:32px;padding:20px 56px;border-bottom:1px solid var(--line)}
.stat-num{font-size:22px;font-weight:700}
.stat-label{font-size:12px;color:var(--muted);margin-top:2px}
.wall{padding:32px 56px 48px}
.wall h2{font-size:13px;text-transform:uppercase;letter-spacing:.15em;color:var(--muted);margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:pointer;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card-thumb{height:140px;display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:800;color:rgba(255,255,255,.15)}
.card-body{padding:16px}
.card-body h3{font-size:15px;font-weight:600;margin-bottom:6px}
.card-body p{font-size:13px;color:var(--muted);line-height:1.45}
.card-body .date{font-size:11px;color:#555;margin-top:10px}
.feed{margin-top:32px}
.feed-item{display:flex;gap:16px;padding:16px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.feed-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:6px;flex-shrink:0}
.feed-item p{font-size:14px;line-height:1.5;color:#ccc}
.feed-item time{font-size:12px;color:var(--muted);display:block;margin-top:4px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;padding:12px 24px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media(max-width:768px){.frame{width:100%}.hero,.wall{padding-left:24px;padding-right:24px}.grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="frame">
<header class="hero">
<div class="avatar">陆</div>
<div class="hero-text"><h1>陆野</h1><p class="tagline">独立视觉设计师 · 专注品牌识别与编辑设计，现居上海</p></div>
<div class="hero-actions">
<button class="btn btn-primary" id="btnFollow">关注</button>
<button class="btn btn-secondary" id="btnContact">联系</button>
</div>
</header>
<div class="stats">
<div><div class="stat-num">47</div><div class="stat-label">作品</div></div>
<div><div class="stat-num">2.3k</div><div class="stat-label">关注者</div></div>
<div><div class="stat-num">186</div><div class="stat-label">正在关注</div></div>
</div>
<section class="wall">
<h2>精选作品</h2>
<div class="grid" id="works"></div>
<h2 style="margin-top:36px">近期动态</h2>
<div class="feed">
<div class="feed-item"><div class="feed-dot"></div><div><p>为独立出版社「纸间」完成年度视觉系统升级，包含书脊规范与活动主视觉。</p><time>3 天前</time></div></div>
<div class="feed-item"><div class="feed-dot"></div><div><p>在 AIGA 上海站分享「小团队如何做品牌一致性」。</p><time>1 周前</time></div></div>
<div class="feed-item"><div class="feed-dot"></div><div><p>开放 2026 第三季度品牌项目预约，名额 2 个。</p><time>2 周前</time></div></div>
</div>
</section>
</div>
<div class="toast" id="toast"></div>
<script>
const works=[
{title:"纸间出版社",desc:"年度视觉识别与书系规范",date:"2026.01",bg:"#ff4d6d"},
{title:"隅咖啡",desc:"从 Logo 到门店导视的全案",date:"2025.11",bg:"#3a86ff"},
{title:"慢播播",desc:"播客品牌与封面模板系统",date:"2025.09",bg:"#06d6a0"},
{title:"城迹杂志",desc:"封面与内页版式 redesign",date:"2025.07",bg:"#8338ec"},
{title:"未命名工作室",desc:"工作室网站与名片",date:"2025.05",bg:"#fb5607"},
{title:"光隙展览",desc:"空间导视与展览主视觉",date:"2025.03",bg:"#ffbe0b"}
];
const grid=document.getElementById('works');
works.forEach(w=>{
const c=document.createElement('article');
c.className='card';c.tabIndex=0;
c.innerHTML=`<div class="card-thumb" style="background:${w.bg}22;color:${w.bg}">${w.title[0]}</div><div class="card-body"><h3>${w.title}</h3><p>${w.desc}</p><div class="date">${w.date}</div></div>`;
c.onclick=()=>showToast('已打开「'+w.title+'」');
c.onkeydown=e=>{if(e.key==='Enter')c.click()};
grid.appendChild(c);
});
const toast=document.getElementById('toast');
function showToast(msg){toast.textContent=msg;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2200)}
let following=false;
document.getElementById('btnFollow').onclick=function(){following=!following;this.textContent=following?'已关注':'关注';this.classList.toggle('btn-secondary',following);this.classList.toggle('btn-primary',!following);showToast(following?'感谢关注陆野':'已取消关注')};
document.getElementById('btnContact').onclick=()=>showToast('邮件已复制：luye@studio.example');
</script>
</body>
</html>
