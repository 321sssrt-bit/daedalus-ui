<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>纸条 · 即时通讯</title>
<style>
:root{
  --paper:#f4f2ed;--card:#fffdf8;--ink:#1c2430;--blue:#3b6ea5;--own:#d9e6f2;
  --line:#dcd8cf;--muted:#7e8490;--red:#c4533f;--good:#5b8f72;--deep:#2b3a4d;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(700px 500px at 50% 0%,#e9e6de 0%,transparent 60%),#c9c5bb;display:grid;place-items:center;padding:26px;font:14px/1.5 "Avenir Next","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink)}
.phone{width:390px;height:844px;background:#20262e;border-radius:48px;padding:10px;box-shadow:0 40px 90px #20262e55;position:relative;flex:none}
.screen{width:100%;height:100%;background:var(--paper);border-radius:39px;overflow:hidden;position:relative;display:flex;flex-direction:column}
.notch{position:absolute;left:50%;top:8px;transform:translateX(-50%);width:110px;height:24px;background:#20262e;border-radius:14px;z-index:9}
.statusbar{height:42px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 22px 5px;font:600 10px/1 ui-monospace,Consolas,monospace;color:#8a8f98}
.view{flex:1;display:flex;flex-direction:column;min-height:0}
.view[hidden]{display:none}
.top{display:flex;align-items:center;gap:10px;padding:4px 18px 10px}
.top h1{margin:0;font:400 22px/1.3 "Songti SC","Noto Serif SC",Georgia,serif}
.top .new{margin-left:auto;width:30px;height:30px;border:1px solid var(--line);border-radius:50%;background:var(--card);color:var(--blue);font-size:15px;cursor:pointer;line-height:1}
.search{margin:0 18px 8px;display:flex;align-items:center;gap:7px;height:32px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--muted);font-size:10px}
.search i{font-style:normal;color:#a3a8b0}
.convs{flex:1;overflow-y:auto;padding:0 10px 20px}
.conv{display:flex;gap:11px;align-items:center;width:100%;padding:11px 8px;border:0;border-bottom:1px solid #e7e2d7;background:transparent;text-align:left;color:inherit;font:inherit;cursor:pointer}
.conv:hover{background:#faf7ef}
.conv .ava{width:42px;height:42px;border-radius:50%;background:#d8e4ef;color:#2f5a7a;display:grid;place-items:center;font:400 16px/1 "Songti SC",Georgia,serif;flex:none}
.conv:nth-child(2) .ava{background:#efdcd6;color:#8a4a3a}
.conv:nth-child(3) .ava{background:#dfe8d9;color:#4a6340}
.conv .txt{min-width:0;flex:1}
.conv b{display:block;font-size:12px;font-weight:600}
.conv span{display:block;font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.conv .meta{margin-left:auto;text-align:right;flex:none}
.conv .meta em{display:block;font:8px/1.4 ui-monospace,Consolas,monospace;color:#a3a8b0;font-style:normal}
.conv .meta i{display:inline-grid;place-items:center;min-width:16px;height:16px;border-radius:999px;background:var(--blue);color:#fff;font:8px/1 ui-monospace,Consolas,monospace;font-style:normal;margin-top:4px}
.chat{flex:1;display:flex;flex-direction:column;min-height:0}
.chat .top{border-bottom:1px solid var(--line);padding-bottom:9px}
.chat .back{width:28px;height:28px;border:0;background:none;color:var(--blue);font-size:16px;cursor:pointer;line-height:1}
.chat .who b{display:block;font-size:12px}
.chat .who span{display:block;font:8px/1.5 ui-monospace,Consolas,monospace;color:var(--good)}
.chat .net{margin-left:auto;height:26px;padding:0 9px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--muted);font:8.5px/1 ui-monospace,Consolas,monospace;letter-spacing:.04em;cursor:pointer}
.chat .net.on{border-color:var(--red);color:var(--red);background:#f8e4df}
.banner{display:none;margin:0 14px 6px;padding:6px 9px;background:#f8e4df;border-left:2px solid var(--red);font:8.5px/1.6 ui-monospace,Consolas,monospace;color:#8a3a2c}
.banner.on{display:block}
.msgs{flex:1;overflow-y:auto;padding:10px 16px 12px;display:flex;flex-direction:column;gap:8px;scrollbar-width:none}
.msgs::-webkit-scrollbar{display:none}
.msg{max-width:78%;padding:8px 11px;border-radius:12px;font-size:12px;line-height:1.65;position:relative}
.msg.them{align-self:flex-start;background:var(--card);border:1px solid #e7e2d7;border-bottom-left-radius:3px}
.msg.me{align-self:flex-end;background:var(--own);border:1px solid #cbdceb;border-bottom-right-radius:3px}
.msg .st{display:block;margin-top:3px;font:8px/1.5 ui-monospace,Consolas,monospace;color:#8b96a3;text-align:right;letter-spacing:.02em}
.msg.failed{background:#f8e4df;border-color:#e5b7a9}
.msg.failed .st{color:var(--red);cursor:pointer;text-decoration:underline}
.msg.pending{opacity:.7}
.msg time{display:block;text-align:center;font:8px/1.6 ui-monospace,Consolas,monospace;color:#a3a8b0;margin:6px 0 0}
.composer{display:flex;align-items:center;gap:8px;padding:8px 12px 18px;border-top:1px solid var(--line);background:var(--card)}
.composer input{flex:1;height:38px;border:1px solid var(--line);border-radius:999px;background:var(--paper);color:var(--ink);font:12px/1 "Avenir Next","PingFang SC",sans-serif;padding:0 14px;outline:none}
.composer input:focus{border-color:var(--blue)}
.composer button{width:38px;height:38px;border:0;border-radius:50%;background:var(--blue);color:#fff;font-size:14px;cursor:pointer}
.composer button:disabled{background:#b9c2cc;cursor:default}
@media(min-width:441px) and (max-height:900px){.phone{zoom:.86}}
@media(max-width:440px){
  body{padding:0;display:block;background:var(--paper)}
  .phone{width:100%;height:100svh;border-radius:0;padding:0;box-shadow:none;background:var(--paper)}
  .screen{border-radius:0;height:100svh}
  .notch{display:none}
  .statusbar{height:20px;padding:8px 18px 0}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="phone">
  <div class="notch" aria-hidden="true"></div>
  <div class="screen">
    <div class="statusbar"><span>21:02</span><span>——</span></div>

    <section class="view" id="list">
      <div class="top"><h1>纸条</h1><button class="new" type="button" aria-label="新对话">＋</button></div>
      <div class="search"><i>⌕</i>搜索对话或联系人</div>
      <div class="convs">
        <button class="conv" type="button" data-chat="chen"><span class="ava">陈</span><span class="txt"><b>陈默</b><span>稿子我看了，第二段再收一点</span></span><span class="meta"><em>20:58</em><i>2</i></span></button>
        <button class="conv" type="button" data-chat="lan"><span class="ava">岚</span><span class="txt"><b>阿岚</b><span>[图片] 杯贴打样放桌上了</span></span><span class="meta"><em>18:20</em></span></button>
        <button class="conv" type="button" data-chat="he"><span class="ava">何</span><span class="txt"><b>老何</b><span>月底关店，来坐坐</span></span><span class="meta"><em>昨天</em></span></button>
      </div>
    </section>

    <section class="view chat" id="chat" hidden>
      <div class="top"><button class="back" id="back" type="button" aria-label="返回">←</button><div class="who"><b id="chat-name">陈默</b><span id="chat-state">在线 · 正在输入</span></div><button class="net" id="net" type="button" aria-pressed="false">弱网模拟</button></div>
      <p class="banner" id="banner">弱网模拟已开启 · 下一条消息会发送失败</p>
      <div class="msgs" id="msgs">
        <div class="msg them">稿子我看了。第二段那个「凌晨四点」的细节很好，但后面接得太快。<span class="st">20:54 已读</span></div>
        <div class="msg me">我把包子铺那段往后挪，留两行给环卫工。<span class="st">20:56 已读</span></div>
        <div class="msg them">可以。结尾别总结，停在掀蒸笼那里。<span class="st">20:58 已读</span></div>
      </div>
      <div class="composer"><input id="input" type="text" placeholder="输入消息…" autocomplete="off" aria-label="消息"><button id="send" type="button" aria-label="发送">↑</button></div>
    </section>
  </div>
</div>

<script>
let weak = false;
let failedNode = null;
let currentChat = 'chen';
const names = { chen: '陈默', lan: '阿岚', he: '老何' };
const histories = {
  chen: [
    ['them', '稿子我看了。第二段那个「凌晨四点」的细节很好，但后面接得太快。', '20:54 已读'],
    ['me', '我把包子铺那段往后挪，留两行给环卫工。', '20:56 已读'],
    ['them', '可以。结尾别总结，停在掀蒸笼那里。', '20:58 已读']
  ],
  lan: [
    ['them', '杯贴打样放你桌上了，暖橙那版比屏幕上脏一点。', '18:18 已读'],
    ['me', '我明早看，周五前定。', '18:20 已读']
  ],
  he: [
    ['them', '月底关店，来坐坐。书给你留着。', '昨天 16:02'],
    ['me', '周六下午到。', '昨天 16:10 已读']
  ]
};

function renderChat() {
  document.getElementById('msgs').innerHTML = histories[currentChat].map(function (row) {
    return '<div class="msg ' + row[0] + '"><span class="body"></span><span class="st">' + row[2] + '</span></div>';
  }).join('');
  const nodes = document.querySelectorAll('#msgs .msg .body');
  histories[currentChat].forEach(function (row, index) {
    if (nodes[index]) nodes[index].textContent = row[1];
  });
}

document.querySelectorAll('.conv').forEach(function (button) {
  button.addEventListener('click', function () {
    currentChat = button.dataset.chat;
    document.getElementById('chat-name').textContent = names[currentChat];
    document.getElementById('list').hidden = true;
    document.getElementById('chat').hidden = false;
    renderChat();
    document.getElementById('chat-state').textContent = '在线';
  });
});

document.getElementById('back').addEventListener('click', function () {
  document.getElementById('chat').hidden = true;
  document.getElementById('list').hidden = false;
  document.getElementById('banner').classList.remove('on');
  weak = false;
  document.getElementById('net').classList.remove('on');
  document.getElementById('net').setAttribute('aria-pressed', 'false');
});

document.getElementById('net').addEventListener('click', function () {
  weak = !weak;
  this.classList.toggle('on', weak);
  this.setAttribute('aria-pressed', String(weak));
  document.getElementById('banner').classList.toggle('on', weak);
});

function now() {
  const d = new Date();
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}

function addMessage(text) {
  const msgs = document.getElementById('msgs');
  const node = document.createElement('div');
  node.className = 'msg me pending';
  node.innerHTML = '<span class="body"></span><span class="st">发送中…</span>';
  node.querySelector('.body').textContent = text;
  msgs.appendChild(node);
  msgs.scrollTop = msgs.scrollHeight;
  setTimeout(function () {
    node.classList.remove('pending');
    if (weak) {
      node.classList.add('failed');
      node.querySelector('.st').textContent = '发送失败 · 点击重试';
      failedNode = node;
      node.querySelector('.st').addEventListener('click', function () { retry(node); });
    } else {
      node.querySelector('.st').textContent = now() + ' 已送达';
    }
  }, 700);
}

function retry(node) {
  if (!node.classList.contains('failed')) return;
  node.classList.remove('failed');
  node.classList.add('pending');
  node.querySelector('.st').textContent = '正在重试…';
  setTimeout(function () {
    node.classList.remove('pending');
    node.querySelector('.st').textContent = now() + ' 已送达';
    if (weak) {
      weak = false;
      document.getElementById('net').classList.remove('on');
      document.getElementById('net').setAttribute('aria-pressed', 'false');
      document.getElementById('banner').classList.remove('on');
    }
  }, 800);
}

document.getElementById('send').addEventListener('click', function () {
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text) return;
  addMessage(text);
  input.value = '';
});

document.getElementById('input').addEventListener('keydown', function (event) {
  if (event.key === 'Enter') document.getElementById('send').click();
});
</script>
</body>
</html>
