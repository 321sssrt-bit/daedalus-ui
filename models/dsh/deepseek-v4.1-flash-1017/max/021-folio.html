<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>册页 · 本期目录</title>
<style>
:root{
  --paper:#f7f2e7;--ink:#1d1c19;--rust:#8c3b2a;--muted:#8a8474;--line:#d9d0bd;--green:#33453b;
}
*{box-sizing:border-box}
body{margin:0;background:
  radial-gradient(900px 400px at 50% 0%,#fbf7ee 0%,transparent 60%),var(--paper);
  color:var(--ink);font:15px/1.7 "Avenir Next","PingFang SC","Microsoft YaHei",sans-serif}
.masthead{max-width:1160px;margin:0 auto;padding:26px 34px 0;text-align:center;position:relative}
.issue-line{display:flex;justify-content:space-between;align-items:center;font:9px/1.6 ui-monospace,Consolas,monospace;color:var(--muted);letter-spacing:.18em;padding-bottom:14px;border-bottom:1px solid var(--ink)}
.masthead h1{margin:18px 0 4px;font:400 92px/1 "Songti SC","Noto Serif SC",Georgia,serif;letter-spacing:.16em;text-indent:.16em}
.masthead .sub{font:9px/1 ui-monospace,Consolas,monospace;letter-spacing:.42em;color:var(--rust);text-transform:uppercase}
.masthead nav{display:flex;justify-content:center;gap:26px;margin:20px 0 0;padding:10px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--ink)}
.masthead nav a{color:var(--ink);text-decoration:none;font-size:11px;letter-spacing:.1em}
.masthead nav a.on{color:var(--rust)}
main{max-width:1160px;margin:0 auto;padding:26px 34px 70px;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:48px;align-items:start}
.kicker{margin:0 0 8px;font:600 9px/1 ui-monospace,Consolas,monospace;letter-spacing:.26em;color:var(--rust)}
.head{display:flex;align-items:baseline;gap:16px;margin-bottom:14px}
.head h2{margin:0;font:400 26px/1.2 "Songti SC",Georgia,serif}
.filters{display:flex;gap:12px;margin-left:auto}
.filters button{border:0;background:none;color:var(--muted);font:11px/1 "Avenir Next","PingFang SC",sans-serif;cursor:pointer;padding:0 0 3px;border-bottom:1px solid transparent}
.filters button:hover{color:var(--ink)}
.filters button[aria-pressed="true"]{color:var(--rust);border-bottom-color:var(--rust)}
.toc{list-style:none;margin:0;padding:0;border-top:1px solid var(--ink)}
.toc li{border-bottom:1px solid var(--line)}
.toc button{display:grid;grid-template-columns:34px minmax(0,1fr) 120px 40px;gap:12px;width:100%;align-items:baseline;padding:15px 10px 14px 14px;border:0;border-left:3px solid transparent;background:transparent;color:inherit;text-align:left;font:inherit;cursor:pointer}
.toc button:hover{background:#f1eadb}
.toc button.on{border-left-color:var(--rust);background:#f4ede0}
.toc .num{font:10px/1.8 ui-monospace,Consolas,monospace;color:#a69d8a;letter-spacing:.04em}
.toc .t{font:400 24px/1.35 "Songti SC","Noto Serif SC",Georgia,serif;letter-spacing:.01em}
.toc .t em{font-style:normal;font-size:11px;color:var(--rust);margin-left:8px;letter-spacing:.06em;font-family:"Avenir Next","PingFang SC",sans-serif;vertical-align:3px}
.toc .by{font:9px/1.7 ui-monospace,Consolas,monospace;color:var(--muted);letter-spacing:.05em}
.toc .by b{display:block;color:#5c574c;font-weight:400}
.toc .pg{font:11px/1.8 ui-monospace,Consolas,monospace;color:#a69d8a;text-align:right}
.preview{position:sticky;top:20px}
.cover{height:330px;background:var(--green);position:relative;overflow:hidden;border:1px solid var(--ink)}
.cover::before{content:"";position:absolute;left:50%;top:56px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle at 42% 38%,#f1d9a8,#c9834f 60%,#8c3b2a);transform:translateX(-50%)}
.cover::after{content:"";position:absolute;left:-30px;right:-30px;bottom:76px;height:1px;background:#f7f2e766;box-shadow:0 20px 0 #f7f2e744,0 40px 0 #f7f2e722}
.cover .label{position:absolute;left:14px;top:12px;font:9px/1 ui-monospace,Consolas,monospace;color:#f7f2e7cc;letter-spacing:.24em}
.cover .issue{position:absolute;right:14px;bottom:12px;font:400 28px/1 "Songti SC",Georgia,serif;color:#f7f2e7;letter-spacing:.1em}
.preview-body{padding:18px 0 0}
.preview-body h3{margin:0 0 4px;font:400 26px/1.35 "Songti SC","Noto Serif SC",Georgia,serif}
.preview-body .by{margin:0 0 12px;font:9px/1.7 ui-monospace,Consolas,monospace;color:var(--muted);letter-spacing:.08em}
.preview-body p.sum{margin:0 0 16px;font-size:12px;line-height:1.95;color:#5f5a4f}
.preview-body .read{height:36px;padding:0 16px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);font:11px/1 "Avenir Next","PingFang SC",sans-serif;letter-spacing:.08em;cursor:pointer}
.preview-body .read:hover{background:var(--rust);border-color:var(--rust)}
.note{margin-top:20px;padding-top:14px;border-top:1px solid var(--line);font:9px/1.8 ui-monospace,Consolas,monospace;color:#a69d8a;letter-spacing:.04em}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;font-size:11px;opacity:0;pointer-events:none;transition:opacity .18s}
.toast.show{opacity:1}
:focus-visible{outline:2px solid var(--rust);outline-offset:2px}
@media(max-width:960px){
  .masthead h1{font-size:64px}
  main{grid-template-columns:1fr;gap:30px}
  .preview{position:static}
  .cover{height:260px}
  .toc button{grid-template-columns:28px minmax(0,1fr) 40px}
  .toc .by{grid-column:2;grid-row:2}
  .toc .pg{grid-column:3;grid-row:1/3}
}
@media(max-width:560px){
  .masthead{padding:20px 16px 0}
  .masthead h1{font-size:48px}
  .issue-line{font-size:8px}
  .masthead nav{gap:14px;flex-wrap:wrap}
  main{padding:20px 16px 50px}
  .head{flex-wrap:wrap}
  .filters{margin-left:0;width:100%}
  .toc .t{font-size:19px}
  .toc button{padding:12px 6px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="masthead">
  <div class="issue-line"><span>第 12 期 · 2026 秋</span><span>慢杂志 / 双月刊</span><span>上海 · 第 9 年</span></div>
  <h1>册页</h1>
  <div class="sub">FOLIO / 一本慢杂志</div>
  <nav aria-label="杂志导航"><a href="#toc" class="on">本期目录</a><a href="#column">专栏</a><a href="#about">关于</a><a href="#subscribe">订阅</a></nav>
</header>

<main>
  <section>
    <p class="kicker">CONTENTS / 12</p>
    <div class="head">
      <h2>本期目录</h2>
      <div class="filters" role="group" aria-label="按栏目筛选">
        <button type="button" data-section="all" aria-pressed="true">全部</button>
        <button type="button" data-section="散文" aria-pressed="false">散文</button>
        <button type="button" data-section="小说" aria-pressed="false">小说</button>
        <button type="button" data-section="诗" aria-pressed="false">诗</button>
        <button type="button" data-section="访谈" aria-pressed="false">访谈</button>
      </div>
    </div>

    <ol class="toc" id="toc">
      <li data-section="散文"><button type="button" class="on" data-id="0">
        <span class="num">01</span><span class="t">城市在凌晨四点醒来<em>散文</em></span>
        <span class="by"><b>林见鹿</b>特稿 · 第 6 页</span><span class="pg">06</span></button></li>
      <li data-section="小说"><button type="button" data-id="1">
        <span class="num">02</span><span class="t">雾中列车<em>小说</em></span>
        <span class="by"><b>陈默</b>短篇 · 第 18 页</span><span class="pg">18</span></button></li>
      <li data-section="散文"><button type="button" data-id="2">
        <span class="num">03</span><span class="t">一条河的第二次呼吸<em>散文</em></span>
        <span class="by"><b>沈一</b>田野笔记 · 第 27 页</span><span class="pg">27</span></button></li>
      <li data-section="诗"><button type="button" data-id="3">
        <span class="num">04</span><span class="t">给一盆薄荷找新家<em>诗</em></span>
        <span class="by"><b>顾青</b>三首 · 第 34 页</span><span class="pg">34</span></button></li>
      <li data-section="访谈"><button type="button" data-id="4">
        <span class="num">05</span><span class="t">旧书店的最后一周<em>访谈</em></span>
        <span class="by"><b>何岸</b>对谈 · 第 41 页</span><span class="pg">41</span></button></li>
      <li data-section="小说"><button type="button" data-id="5">
        <span class="num">06</span><span class="t">地铁末班车上的十二种睡姿<em>小说</em></span>
        <span class="by"><b>苏禾</b>短篇 · 第 52 页</span><span class="pg">52</span></button></li>
      <li data-section="散文"><button type="button" data-id="6">
        <span class="num">07</span><span class="t">把日子过成一张收据<em>散文</em></span>
        <span class="by"><b>周予安</b>编后记 · 第 63 页</span><span class="pg">63</span></button></li>
    </ol>
  </section>

  <aside class="preview" aria-live="polite">
    <div class="cover" aria-hidden="true"><span class="label">FOLIO / 12</span><span class="issue">秋</span></div>
    <div class="preview-body">
      <p class="kicker" id="pv-kicker">本期选读 / 01</p>
      <h3 id="pv-title">城市在凌晨四点醒来</h3>
      <p class="by" id="pv-by">林见鹿 · 散文 · 第 6 页</p>
      <p class="sum" id="pv-sum">环卫车经过安福路时，第一笼包子刚好上汽。我们跟了三条街，记录这座城市最安静的两个小时——以及那些在别人睡着时工作的人。</p>
      <button class="read" id="pv-read" type="button">读这一篇</button>
      <p class="note">本期共 7 篇 · 约 48,000 字<br>封面：秋日海平线 / 苏禾 摄<br>印刷：米色轻型纸 · 120 g</p>
    </div>
  </aside>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const entries = [
  { title: '城市在凌晨四点醒来', by: '林见鹿', sec: '散文', page: 6, sum: '环卫车经过安福路时，第一笼包子刚好上汽。我们跟了三条街，记录这座城市最安静的两个小时——以及那些在别人睡着时工作的人。' },
  { title: '雾中列车', by: '陈默', sec: '小说', page: 18, sum: '一列只在雾里停靠的火车，载着七个不愿到站的人。列车员说，只要有人愿意讲完自己的故事，车就会再开。' },
  { title: '一条河的第二次呼吸', by: '沈一', sec: '散文', page: 27, sum: '治理第六年，水质数据第一次连续三个月达标。但沿岸还有 11 个排口没有完成改造，雨天仍会溢流。' },
  { title: '给一盆薄荷找新家', by: '顾青', sec: '诗', page: 34, sum: '搬家那天，她把养了三年的薄荷分了七盆，送给楼道里七户不熟的邻居。三首关于移植、气味与邻里的短诗。' },
  { title: '旧书店的最后一周', by: '何岸', sec: '访谈', page: 41, sum: '老何把最后一箱书搬上车，门口的黑板还写着「全场五折，欢迎来坐」。我们聊了三个小时，关于书、租金和体面。' },
  { title: '地铁末班车上的十二种睡姿', by: '苏禾', sec: '小说', page: 52, sum: '末班车是一天里最柔软的时段。十二个困倦但放松的人，十二段没有说完的独白，在同一节车厢里短暂交叠。' },
  { title: '把日子过成一张收据', by: '周予安', sec: '散文', page: 63, sum: '编后记。我们这个季度花了多少钱、退了多少稿、为什么还是决定把纸刊做下去。' }
];
let section = 'all';
let current = 0;

function select(index) {
  current = index;
  const entry = entries[index];
  document.getElementById('pv-kicker').textContent = '本期选读 / ' + String(index + 1).padStart(2, '0');
  document.getElementById('pv-title').textContent = entry.title;
  document.getElementById('pv-by').textContent = entry.by + ' · ' + entry.sec + ' · 第 ' + entry.page + ' 页';
  document.getElementById('pv-sum').textContent = entry.sum;
  document.querySelectorAll('#toc button').forEach(function (button) {
    button.classList.toggle('on', Number(button.dataset.id) === index);
  });
}

document.querySelectorAll('#toc button').forEach(function (button) {
  button.addEventListener('click', function () { select(Number(button.dataset.id)); });
});

document.querySelectorAll('.filters button').forEach(function (button) {
  button.addEventListener('click', function () {
    section = button.dataset.section;
    document.querySelectorAll('.filters button').forEach(function (item) { item.setAttribute('aria-pressed', String(item === button)); });
    document.querySelectorAll('#toc li').forEach(function (item) {
      item.style.display = section === 'all' || item.dataset.section === section ? '' : 'none';
    });
  });
});

document.getElementById('pv-read').addEventListener('click', function () {
  const toast = document.getElementById('toast');
  toast.textContent = '正在展开《' + entries[current].title + '》第 ' + entries[current].page + ' 页。';
  toast.classList.add('show');
  setTimeout(function () { toast.classList.remove('show'); }, 2200);
});

select(0);
</script>
</body>
</html>
