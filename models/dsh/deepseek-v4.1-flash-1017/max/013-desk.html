<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>案头 · 收件箱</title>
<style>
:root{
  --cream:#f1e9d9;--rail:#e9dfcc;--list:#faf4e7;--reader:#fffdf7;--ink:#2a241c;
  --ox:#7a2f2a;--olive:#68705a;--line:#ded1ba;--muted:#8a7f6d;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--cream);color:var(--ink);font:14px/1.6 "Avenir Next","PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden}
.top{height:58px;display:flex;align-items:center;gap:16px;padding:0 20px;border-bottom:1px solid var(--line);background:var(--cream)}
.brand{display:flex;align-items:baseline;gap:8px;font:600 19px/1 "Songti SC","Noto Serif SC",Georgia,serif;letter-spacing:.18em}
.brand small{font:9px/1 ui-monospace,Consolas,monospace;letter-spacing:.3em;color:var(--muted)}
.search{flex:1;max-width:420px;display:flex;align-items:center;gap:8px;height:32px;padding:0 11px;border:1px solid var(--line);border-radius:3px;background:var(--list);color:var(--muted);font-size:12px}
.search i{font-style:normal;color:var(--ox)}
.top .right{margin-left:auto;display:flex;align-items:center;gap:12px}
.sync{font:9px/1 ui-monospace,Consolas,monospace;color:var(--muted);letter-spacing:.1em}
.compose{height:32px;padding:0 13px;border:1px solid var(--ink);border-radius:3px;background:var(--ink);color:var(--cream);font:11px/1 "Avenir Next","PingFang SC",sans-serif;letter-spacing:.08em;cursor:pointer}
.compose:hover{background:var(--ox);border-color:var(--ox)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--olive);color:#f7f1e4;display:grid;place-items:center;font:600 10px/1 ui-monospace,Consolas,monospace}
.app{display:grid;grid-template-columns:172px 330px minmax(0,1fr);height:calc(100vh - 58px)}
.rail{background:var(--rail);border-right:1px solid var(--line);padding:16px 10px;display:flex;flex-direction:column}
.folder{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;border:0;border-radius:3px;background:transparent;color:#5e5445;font:12px/1.2 "Avenir Next","PingFang SC",sans-serif;text-align:left;cursor:pointer}
.folder:hover{background:#ffffff55}
.folder.on{background:var(--reader);color:var(--ink);font-weight:600;box-shadow:0 1px 0 #ffffff}
.folder i{width:6px;height:6px;border-radius:50%;font-style:normal;flex:none}
.folder span{margin-left:auto;font:9px/1 ui-monospace,Consolas,monospace;color:var(--muted)}
.folder.on span{color:var(--ox)}
.rail h2{margin:20px 10px 6px;font:9px/1 ui-monospace,Consolas,monospace;letter-spacing:.22em;color:#9b8e7a}
.label{display:flex;align-items:center;gap:8px;padding:5px 10px;border:0;background:transparent;color:#6d6252;font-size:11px;text-align:left;cursor:pointer;width:100%}
.label:hover{color:var(--ink)}
.label i{width:7px;height:7px;border-radius:2px;flex:none}
.rail .foot{margin-top:auto;padding:12px 10px 0;border-top:1px solid #d3c5ac;font:9px/1.7 ui-monospace,Consolas,monospace;color:#9b8e7a;letter-spacing:.06em}
.list{border-right:1px solid var(--line);background:var(--list);display:flex;flex-direction:column;min-width:0}
.list-head{padding:12px 14px 10px;border-bottom:1px solid var(--line)}
.list-head .title{display:flex;align-items:baseline;justify-content:space-between}
.list-head h1{margin:0;font:400 22px/1.2 "Songti SC",Georgia,serif}
.list-head h1 span{font:10px/1 ui-monospace,Consolas,monospace;color:var(--ox);margin-left:6px;letter-spacing:.06em}
.tabs{display:flex;gap:4px;margin-top:10px}
.tabs button{height:24px;padding:0 9px;border:1px solid transparent;border-radius:999px;background:transparent;color:var(--muted);font:10px/1 "Avenir Next","PingFang SC",sans-serif;cursor:pointer}
.tabs button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--cream)}
.msgs{overflow-y:auto;flex:1;scrollbar-width:thin}
.msg{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #e8dcc7;background:transparent;padding:12px 14px;cursor:pointer;position:relative;font:inherit;color:inherit}
.msg:hover{background:#f4ecdc}
.msg.on{background:var(--reader);box-shadow:inset 3px 0 0 var(--ox)}
.msg .row1{display:flex;align-items:center;gap:6px}
.msg .from{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg .time{margin-left:auto;font:9px/1 ui-monospace,Consolas,monospace;color:#a2957f;flex:none}
.msg .dot{width:6px;height:6px;border-radius:50%;background:var(--ox);flex:none}
.msg.read .dot{visibility:hidden}
.msg .subject{margin:3px 0 2px;font:400 14px/1.45 "Songti SC",Georgia,serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg.read .subject{font-weight:400;color:#4c4336}
.msg .preview{margin:0;font-size:11px;line-height:1.6;color:#8f8471;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg .star{position:absolute;right:12px;bottom:9px;border:0;background:none;color:#c2b49a;font-size:13px;cursor:pointer;padding:2px}
.msg .star.on{color:var(--ox)}
.reader{background:var(--reader);display:flex;flex-direction:column;min-width:0}
.reader-bar{display:flex;align-items:center;gap:6px;padding:10px 18px;border-bottom:1px solid #ece2cf}
.rbtn{height:28px;padding:0 10px;border:1px solid var(--line);border-radius:3px;background:transparent;color:var(--muted);font:10px/1 "Avenir Next","PingFang SC",sans-serif;cursor:pointer}
.rbtn:hover{border-color:var(--ox);color:var(--ox)}
.rbtn.on{color:var(--ox);border-color:var(--ox);background:#fbf2e7}
.reader-bar .spacer{flex:1}
.reader-bar .pos{font:9px/1 ui-monospace,Consolas,monospace;color:#a2957f;letter-spacing:.08em}
.article{overflow-y:auto;padding:26px 40px 40px;max-width:820px}
.article .head{display:flex;gap:12px;align-items:center;margin-bottom:20px}
.article .ava{width:38px;height:38px;border-radius:50%;background:#e2d6c1;color:#6b5c46;display:grid;place-items:center;font:600 12px/1 "Songti SC",Georgia,serif;flex:none}
.article .who b{display:block;font-size:12px}
.article .who span{font:9px/1.5 ui-monospace,Consolas,monospace;color:var(--muted);letter-spacing:.03em}
.article h2{margin:0 0 8px;font:400 32px/1.35 "Songti SC","Noto Serif SC",Georgia,serif;letter-spacing:.01em}
.article .meta{display:flex;gap:12px;font:9px/1.6 ui-monospace,Consolas,monospace;color:#a2957f;letter-spacing:.05em;padding-bottom:18px;border-bottom:1px solid #ece2cf;margin-bottom:22px}
.article p{margin:0 0 15px;font:15px/1.95 "Songti SC","Noto Serif SC",Georgia,serif;color:#3f382d}
.article .sign{margin-top:24px;font:14px/1.8 "Songti SC",Georgia,serif;color:#6b6253}
.article .attach{display:flex;gap:10px;align-items:center;margin-top:24px;padding:10px 12px;border:1px dashed #d8cab2;background:#fbf6ea;font:11px/1.5 "Avenir Next","PingFang SC",sans-serif;color:#6d6252}
.article .attach b{font-weight:600}
.article .attach span{color:#a2957f;font-size:10px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--cream);padding:9px 16px;border-radius:3px;font-size:11px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-3px)}
:focus-visible{outline:2px solid var(--ox);outline-offset:2px}
@media(max-width:1080px){
  .app{grid-template-columns:72px 300px minmax(0,1fr)}
  .folder{justify-content:center;padding:8px 4px}
  .folder b,.folder span,.rail h2,.label,.rail .foot{display:none}
}
@media(max-width:860px){
  .app{grid-template-columns:1fr}
  .rail,.list{display:none}
  .reader{height:100%}
  .article{padding:20px 22px 30px}
  .article h2{font-size:26px}
  .top .search{display:none}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">案头<small>DESK</small></div>
  <div class="search"><i>⌕</i>搜索邮件、联系人或附件</div>
  <div class="right">
    <span class="sync">最后同步 · 21:03</span>
    <button class="compose" id="compose" type="button">写邮件</button>
    <span class="avatar">周</span>
  </div>
</header>

<div class="app">
  <nav class="rail" aria-label="邮件文件夹">
    <button class="folder on" type="button"><i style="background:#7a2f2a"></i><b>收件箱</b><span id="inbox-count">4</span></button>
    <button class="folder" type="button"><i style="background:#c49a4a"></i><b>星标</b><span id="star-count">2</span></button>
    <button class="folder" type="button"><i style="background:#68705a"></i><b>已发送</b><span>18</span></button>
    <button class="folder" type="button"><i style="background:#9b8e7a"></i><b>草稿</b><span>3</span></button>
    <button class="folder" type="button"><i style="background:#b8a98f"></i><b>归档</b><span>126</span></button>
    <h2>标签</h2>
    <button class="label" type="button"><i style="background:#a63a2a"></i>待回复</button>
    <button class="label" type="button"><i style="background:#5e6b4f"></i>长稿</button>
    <button class="label" type="button"><i style="background:#c49a4a"></i>账单</button>
    <div class="foot">存储 2.4 GB / 15 GB<br>键盘：J / K 切换</div>
  </nav>

  <section class="list" aria-label="邮件列表">
    <div class="list-head">
      <div class="title"><h1>收件箱 <span id="unread-label">4 封未读</span></h1></div>
      <div class="tabs" role="group" aria-label="邮件筛选">
        <button type="button" data-filter="all" aria-pressed="true">全部</button>
        <button type="button" data-filter="unread" aria-pressed="false">未读</button>
        <button type="button" data-filter="star" aria-pressed="false">星标</button>
      </div>
    </div>
    <div class="msgs" id="msgs"></div>
  </section>

  <section class="reader" aria-label="邮件正文">
    <div class="reader-bar">
      <button class="rbtn" id="reply" type="button">回复</button>
      <button class="rbtn" id="star" type="button">☆ 星标</button>
      <button class="rbtn" id="archive" type="button">归档</button>
      <span class="spacer"></span>
      <span class="pos" id="pos">1 / 7</span>
    </div>
    <div class="article" id="article"></div>
  </section>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const messages = [
  {
    id: 1, from: '林见鹿', mail: 'jianlu@frontpage.cn', time: '09:42', unread: true, starred: true,
    subject: '凌晨四点的稿子，改好了',
    preview: '第二段重写了，把环卫工的班次细节提前，结尾也收了一版更短的。',
    body: [
      '周老师，稿子改好了。第二段整个重写，把环卫工的班次细节提到前面，读者会更快明白「凌晨四点」不是修辞。',
      '结尾原来那版太像总结陈词，我删了两百字，停在包子铺老板把第一屉蒸笼掀开的那一刻。您看看要不要再压。',
      '另外，图片说明我补了拍摄时间。苏禾说有一张可以换到开头，我附在下面了。'
    ],
    sign: '见鹿', attach: '凌晨四点_终稿_v3.docx · 48 KB'
  },
  {
    id: 2, from: '陈默', mail: 'chenmo@frontpage.cn', time: '08:15', unread: true, starred: false,
    subject: '河道的第三组数据',
    preview: '连续三个月达标了。但 11 个排口里还有 4 个没有完成改造，稿子里要写清楚。',
    body: [
      '第三组水质数据出来了，连续三个月达标，这是治理六年来的第一次。数据表在附件里，口径和上个月一致。',
      '但别急着写「治好」。沿岸 11 个排口还有 4 个没完成改造，雨天仍有溢流。我把环保局的原始回函也附上了。',
      '如果今晚要上版，标题建议避开「重生」这种词，容易过头。'
    ],
    sign: '陈默', attach: '水质监测_Q3.xlsx · 212 KB'
  },
  {
    id: 3, from: '苏禾', mail: 'suhe@frontpage.cn', time: '昨天', unread: false, starred: false,
    subject: '末班车照片选片',
    preview: '十二张里我留了七张。第三张的构图最好，但人脸要再确认一次授权。',
    body: [
      '十二张里我先留了七张，按「困倦但不狼狈」的标准。第三张构图最好，人物也放松，但授权书还没签，先别上。',
      '封面我倾向第五张：车窗反光里有一半的城市，人只占很小一块。和「十二种睡姿」的题眼更贴。',
      '原图在共享盘，文件名是 last-train-select。'
    ],
    sign: '苏禾', attach: 'last-train-select.zip · 1.4 GB'
  },
  {
    id: 4, from: '老何', mail: 'he@oldbookstore.cn', time: '昨天', unread: true, starred: true,
    subject: '最后一周，来看看吧',
    preview: '月底就关了。门口黑板还留着，你要的那本《夜航西飞》我放在柜台下面。',
    body: [
      '小周，月底就关了。房东要涨租，我算了一下，再撑下去也是给银行打工。',
      '门口那块黑板我不擦，留着「全场五折，欢迎来坐」。你上次说想要的那本《夜航西飞》，我放在柜台下面，给你留着。',
      '有空来坐坐，不买书也行。'
    ],
    sign: '老何', attach: ''
  },
  {
    id: 5, from: '订阅组', mail: 'members@frontpage.cn', time: '周二', unread: false, starred: false,
    subject: '十月读者来信摘要',
    preview: '这周收到 46 封来信，聊得最多的是「城市在凌晨四点醒来」那篇。',
    body: [
      '本周收到 46 封来信，其中 19 封提到「城市在凌晨四点醒来」。有读者说，看完之后第一次在凌晨四点出门买了早饭。',
      '也有读者问，为什么我们总写消失的东西。这个问题我贴在编辑部的白板上了，下周选题会聊。',
      '退订 96 人，净增 1,188。数据详情在后台。'
    ],
    sign: '订阅组', attach: ''
  },
  {
    id: 6, from: '阿岚', mail: 'lan@studio.cn', time: '周一', unread: true, starred: false,
    subject: '杯贴打样出来了',
    preview: '暖橙那版印出来比屏幕上脏一点，墨绿烫金反而稳。你什么时候来看看？',
    body: [
      '杯贴打样出来了。暖橙那版印在牛皮纸上比屏幕上脏一点，字有点糊；墨绿烫金反而稳，远看也清楚。',
      '我先把两版都放在工作室，你路过的时候来看看。周五之前要定，工厂那边排期紧。',
      '对了，袋型刀版也重新出了，旧的那版不能用。'
    ],
    sign: '阿岚', attach: 'cup-sticker-proof.jpg · 3.2 MB'
  },
  {
    id: 7, from: '房东', mail: 'li@landlord.cn', time: '上周', unread: false, starred: false,
    subject: '关于下季度的租金',
    preview: '合同下月到期。周边同户型已经涨到 8,200，我这边可以先按 7,800 续。',
    body: [
      '小周，合同下个月到期。周边同户型已经涨到 8,200 了，我这边可以先按 7,800 给你续一个季度。',
      '如果长租，我们可以签两年，每年递增 3%。你考虑一下，月底前给我答复就行。',
      '另外，阳台那扇窗的胶条我找人换过了，下雨不会再渗。'
    ],
    sign: '李女士', attach: ''
  }
];

let filter = 'all';
let currentId = messages[0].id;
const msgs = document.getElementById('msgs');

function visibleMessages() {
  if (filter === 'unread') return messages.filter(function (m) { return m.unread; });
  if (filter === 'star') return messages.filter(function (m) { return m.starred; });
  return messages;
}

function renderList() {
  msgs.innerHTML = '';
  const list = visibleMessages();
  list.forEach(function (m) {
    const item = document.createElement('div');
    item.className = 'msg' + (!m.unread ? ' read' : '') + (m.id === currentId ? ' on' : '');
    item.tabIndex = 0;
    item.setAttribute('role', 'button');
    item.setAttribute('aria-label', m.from + '：' + m.subject);
    item.innerHTML = '<div class="row1"><span class="dot"></span><span class="from"></span><span class="time"></span></div>' +
      '<p class="subject"></p><p class="preview"></p><button class="star" type="button" aria-label="星标">' + (m.starred ? '★' : '☆') + '</button>';
    item.querySelector('.from').textContent = m.from;
    item.querySelector('.time').textContent = m.time;
    item.querySelector('.subject').textContent = m.subject;
    item.querySelector('.preview').textContent = m.preview;
    if (m.starred) item.querySelector('.star').classList.add('on');
    item.addEventListener('click', function (event) {
      if (event.target.closest('.star')) {
        event.stopPropagation();
        toggleStar(m.id);
        return;
      }
      openMessage(m.id);
    });
    item.addEventListener('keydown', function (event) {
      if (event.target !== item) return;
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        openMessage(m.id);
      }
    });
    msgs.appendChild(item);
  });
  if (!list.length) {
    msgs.innerHTML = '<p style="padding:24px 14px;font-size:12px;color:#8f8471">这里暂时没有邮件。换个筛选看看。</p>';
  }
}

function openMessage(id, markRead) {
  const m = messages.find(function (item) { return item.id === id; });
  if (!m) return;
  currentId = id;
  if (markRead !== false) {
    m.unread = false;
    m.read = true;
  }
  renderList();
  renderCounts();
  renderArticle(m);
}

function renderArticle(m) {
  const article = document.getElementById('article');
  const initial = m.from.slice(0, 1);
  article.innerHTML = '<div class="head"><span class="ava"></span><div class="who"><b></b><span></span></div></div>' +
    '<h2></h2><div class="meta"><span></span><span>发给：周予安</span></div><div class="body"></div>' +
    (m.attach ? '<div class="attach"><b>附件</b><span></span></div>' : '');
  article.querySelector('.ava').textContent = initial;
  article.querySelector('.who b').textContent = m.from;
  article.querySelector('.who span').textContent = m.mail;
  article.querySelector('h2').textContent = m.subject;
  article.querySelector('.meta span').textContent = m.time + ' · 收件箱';
  const body = article.querySelector('.body');
  m.body.forEach(function (paragraph) {
    const p = document.createElement('p');
    p.textContent = paragraph;
    body.appendChild(p);
  });
  const sign = document.createElement('p');
  sign.className = 'sign';
  sign.textContent = m.sign;
  body.appendChild(sign);
  if (m.attach) article.querySelector('.attach span').textContent = m.attach;
  document.getElementById('star').textContent = m.starred ? '★ 已星标' : '☆ 星标';
  document.getElementById('star').classList.toggle('on', m.starred);
  const list = visibleMessages();
  const index = list.findIndex(function (item) { return item.id === m.id; });
  document.getElementById('pos').textContent = (index < 0 ? 1 : index + 1) + ' / ' + Math.max(list.length, 1);
  article.scrollTop = 0;
}

function renderCounts() {
  const unread = messages.filter(function (m) { return m.unread; }).length;
  const starred = messages.filter(function (m) { return m.starred; }).length;
  document.getElementById('inbox-count').textContent = String(unread);
  document.getElementById('star-count').textContent = String(starred);
  document.getElementById('unread-label').textContent = unread + ' 封未读';
}

function toggleStar(id) {
  const m = messages.find(function (item) { return item.id === id; });
  m.starred = !m.starred;
  renderList();
  renderCounts();
  if (m.id === currentId) renderArticle(m);
  showToast(m.starred ? '已加星标' : '已取消星标');
}

document.getElementById('star').addEventListener('click', function () {
  toggleStar(currentId);
});

document.getElementById('archive').addEventListener('click', function () {
  const index = messages.findIndex(function (m) { return m.id === currentId; });
  if (index < 0) return;
  const [removed] = messages.splice(index, 1);
  showToast('已归档「' + removed.subject + '」');
  const next = visibleMessages()[0] || messages[0];
  if (next) {
    currentId = next.id;
    openMessage(next.id);
  } else {
    renderList();
  }
  renderCounts();
});

document.getElementById('reply').addEventListener('click', function () {
  showToast('回复草稿已打开，收件人是 ' + messages.find(function (m) { return m.id === currentId; }).from + '。');
});

document.getElementById('compose').addEventListener('click', function () {
  showToast('新邮件已打开。今天适合先写给老何。');
});

document.querySelectorAll('.tabs button').forEach(function (button) {
  button.addEventListener('click', function () {
    filter = button.dataset.filter;
    document.querySelectorAll('.tabs button').forEach(function (item) { item.setAttribute('aria-pressed', String(item === button)); });
    renderList();
    const list = visibleMessages();
    if (list.length && !list.some(function (m) { return m.id === currentId; })) {
      openMessage(list[0].id);
    }
  });
});

let toastTimer = null;
function showToast(text) {
  const toast = document.getElementById('toast');
  toast.textContent = text;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { toast.classList.remove('show'); }, 2200);
}

renderList();
renderCounts();
openMessage(currentId, false);
</script>
</body>
</html>
