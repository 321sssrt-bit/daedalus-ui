<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>汇 · 转账</title>
<style>
:root{
  --navy:#101a2b;--panel:#18263c;--ink:#f2e9da;--copper:#d08a4e;--mint:#9fc4bb;
  --muted:#8a94a8;--line:#2a3a54;--good:#7fae95;--red:#e07a5f;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(700px 500px at 50% 0%,#1b2b45 0%,transparent 60%),#070d17;display:grid;place-items:center;padding:26px;font:14px/1.5 "Avenir Next","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink)}
.phone{width:390px;height:844px;background:#050a12;border-radius:48px;padding:10px;box-shadow:0 40px 90px #000000cc;position:relative;flex:none}
.screen{width:100%;height:100%;background:var(--navy);border-radius:39px;overflow:hidden;position:relative;display:flex;flex-direction:column}
.notch{position:absolute;left:50%;top:8px;transform:translateX(-50%);width:110px;height:24px;background:#050a12;border-radius:14px;z-index:8}
.statusbar{height:42px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 22px 5px;font:600 10px/1 ui-monospace,Consolas,monospace;color:var(--muted)}
.top{display:flex;align-items:center;gap:10px;padding:4px 18px 6px}
.top h1{margin:0;font:400 19px/1.3 "Songti SC","Noto Serif SC",Georgia,serif}
.top .back,.top .help{width:30px;height:30px;border:1px solid var(--line);border-radius:50%;background:transparent;color:var(--muted);font-size:13px;cursor:pointer;line-height:1}
.top .help{margin-left:auto}
.view{flex:1;overflow-y:auto;padding:6px 20px 96px;scrollbar-width:none}
.view::-webkit-scrollbar{display:none}
.view[hidden]{display:none}
.balance{background:linear-gradient(150deg,#1e3350,#15263f);border:1px solid var(--line);border-radius:16px;padding:14px 16px;position:relative;overflow:hidden}
.balance::after{content:"";position:absolute;right:-40px;top:-50px;width:140px;height:140px;border:1px solid #9fc4bb22;border-radius:50%;box-shadow:0 0 0 20px #9fc4bb12}
.balance span{font:8.5px/1.6 ui-monospace,Consolas,monospace;color:var(--muted);letter-spacing:.14em}
.balance b{display:block;font:400 30px/1.2 "Songti SC",Georgia,serif;margin-top:3px}
.balance em{font:8px/1.6 ui-monospace,Consolas,monospace;color:var(--mint);font-style:normal;letter-spacing:.06em}
.label{display:block;margin:18px 0 8px;font:8.5px/1 ui-monospace,Consolas,monospace;color:#9aa6b9;letter-spacing:.16em}
.people{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.person{padding:10px 6px 9px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);text-align:center;cursor:pointer;font:inherit}
.person:hover{border-color:#4b6180}
.person.on{border-color:var(--copper);background:#22304a;box-shadow:0 0 0 1px var(--copper) inset}
.person .ava{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;margin:0 auto 5px;font:400 14px/1 "Songti SC",Georgia,serif;background:#2e405c;color:#e7dcc8}
.person:nth-child(2) .ava{background:#5b3a44}
.person:nth-child(3) .ava{background:#3d4d3d}
.person b{display:block;font-size:11px;font-weight:600}
.person span{display:block;font:7.5px/1.5 ui-monospace,Consolas,monospace;color:#7f8ba0}
.amount-card{margin-top:4px;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:14px 16px}
.amount-card .cur{font:400 26px/1 "Songti SC",Georgia,serif;color:var(--copper);margin-right:4px}
.amount-card input{border:0;background:transparent;color:var(--ink);font:400 34px/1.2 "Songti SC",Georgia,serif;width:calc(100% - 30px);outline:none}
.amount-card input::placeholder{color:#4d5b73}
.chips{display:flex;gap:6px;margin-top:10px}
.chips button{height:26px;padding:0 10px;border:1px solid var(--line);border-radius:999px;background:transparent;color:#9aa6b9;font:9px/1 ui-monospace,Consolas,monospace;cursor:pointer}
.chips button:hover{border-color:var(--copper);color:var(--copper)}
.error{margin:9px 0 0;padding:8px 10px;border-left:3px solid var(--red);background:#2c1e24;font-size:10px;line-height:1.7;color:#f0b6a5;display:none}
.error.on{display:block}
.sources{display:grid;gap:6px}
.source{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);cursor:pointer}
.source.on{border-color:var(--mint)}
.source .dot{width:16px;height:16px;border:1px solid #55647c;border-radius:50%;display:grid;place-items:center;flex:none}
.source.on .dot{border-color:var(--mint)}
.source.on .dot::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--mint)}
.source b{font-size:11px}
.source span{display:block;font:8px/1.5 ui-monospace,Consolas,monospace;color:#7f8ba0}
.source em{margin-left:auto;font:9px/1 ui-monospace,Consolas,monospace;color:#9aa6b9;font-style:normal}
.fee{margin-top:12px;display:flex;justify-content:space-between;font:8.5px/1.7 ui-monospace,Consolas,monospace;color:#7f8ba0;letter-spacing:.03em}
.next{position:absolute;left:20px;right:20px;bottom:22px;height:46px;border:0;border-radius:999px;background:var(--copper);color:#1b1208;font:600 12px/1 "Avenir Next","PingFang SC",sans-serif;letter-spacing:.12em;cursor:pointer}
.next:hover{background:#e09a5c}
.confirm{padding-top:14px}
.confirm .big{text-align:center;padding:18px 0 20px}
.confirm .big span{font:8.5px/1 ui-monospace,Consolas,monospace;color:var(--muted);letter-spacing:.18em}
.confirm .big b{display:block;font:400 46px/1.2 "Songti SC",Georgia,serif;margin-top:6px}
.confirm .big em{display:block;font:9px/1.7 ui-monospace,Consolas,monospace;color:var(--mint);font-style:normal;margin-top:4px}
.rows{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 0;margin:8px 0 14px}
.rows div{display:flex;justify-content:space-between;padding:7px 0;font-size:11px;color:#b9c2d2}
.rows b{font:10px/1.6 ui-monospace,Consolas,monospace;color:var(--ink);font-weight:400}
.confirm-note{font:8px/1.8 ui-monospace,Consolas,monospace;color:#7f8ba0;text-align:center;letter-spacing:.02em}
.receipt{padding:20px 20px 24px;text-align:center}
.receipt .mark{width:56px;height:56px;border-radius:50%;border:1px solid var(--good);color:var(--good);display:grid;place-items:center;font-size:22px;margin:26px auto 16px;background:#1a2b2a}
.receipt h2{margin:0 0 6px;font:400 28px/1.3 "Songti SC",Georgia,serif}
.receipt .amt{font:400 40px/1.2 "Songti SC",Georgia,serif;margin:4px 0 2px}
.receipt p{margin:0 0 16px;font-size:10px;line-height:1.8;color:var(--muted)}
.rcp{text-align:left;border-top:1px dashed #3a4a63;border-bottom:1px dashed #3a4a63;padding:10px 0;margin-bottom:16px}
.rcp div{display:flex;justify-content:space-between;padding:4px 0;font-size:10px;color:#b9c2d2}
.rcp b{font:9px/1.6 ui-monospace,Consolas,monospace;color:var(--ink);font-weight:400}
.receipt .done{height:40px;padding:0 18px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--muted);font-size:10px;cursor:pointer}
.receipt .done:hover{border-color:var(--copper);color:var(--copper)}
.toast{position:absolute;left:50%;bottom:88px;transform:translateX(-50%) translateY(8px);background:var(--ink);color:#14213d;padding:8px 14px;border-radius:999px;font-size:10px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;white-space:nowrap;z-index:9}
.toast.show{opacity:1;transform:translateX(-50%)}
@media(min-width:441px) and (max-height:900px){.phone{zoom:.86}}
@media(max-width:440px){
  body{padding:0;display:block;background:var(--navy)}
  .phone{width:100%;height:100svh;border-radius:0;padding:0;box-shadow:none;background:var(--navy)}
  .screen{border-radius:0;height:100svh}
  .notch{display:none}
  .statusbar{height:20px;padding:8px 18px 0}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="phone">
  <div class="notch" aria-hidden="true"></div>
  <div class="screen">
    <div class="statusbar"><span>21:06</span><span>——</span></div>
    <div class="top"><button class="back" type="button" aria-label="返回">←</button><h1>转账</h1><button class="help" type="button" aria-label="帮助">?</button></div>

    <section class="view" id="transfer">
      <div class="balance"><span>可用余额 · 人民币</span><b id="available">¥ 12,480.00</b><em>今日已转出 ¥0.00</em></div>

      <span class="label">转给谁</span>
      <div class="people" id="people">
        <button class="person on" type="button" data-name="陈默" data-bank="招商银行 · 6688"><span class="ava">陈</span><b>陈默</b><span>招商 · 6688</span></button>
        <button class="person" type="button" data-name="阿岚" data-bank="工商银行 · 3021"><span class="ava">岚</span><b>阿岚</b><span>工商 · 3021</span></button>
        <button class="person" type="button" data-name="老何" data-bank="建设银行 · 7710"><span class="ava">何</span><b>老何</b><span>建设 · 7710</span></button>
      </div>

      <span class="label">转多少</span>
      <div class="amount-card"><span class="cur">¥</span><input id="amount" type="text" inputmode="decimal" placeholder="0.00" aria-label="转账金额"><div class="chips"><button type="button" data-quick="100">100</button><button type="button" data-quick="500">500</button><button type="button" data-quick="1000">1,000</button></div><p class="error" id="error" role="alert"></p></div>

      <span class="label">从哪里出</span>
      <div class="sources" id="sources">
        <label class="source on"><input type="radio" name="src" value="balance" hidden checked><span class="dot"></span><div><b>账户余额</b><span>实时到账 · 免手续费</span></div><em>¥12,480.00</em></label>
        <label class="source"><input type="radio" name="src" value="card" hidden><span class="dot"></span><div><b>招商银行 储蓄卡</b><span>尾号 8891 · 单笔上限 ¥3,200</span></div><em>¥3,200.00</em></label>
      </div>

      <div class="fee"><span>手续费 ¥0.00</span><span>预计 2 秒内到账</span></div>
      <button class="next" id="to-confirm" type="button">下一步</button>
    </section>

    <section class="view confirm" id="confirm" hidden>
      <div class="big"><span>你正在转出</span><b id="c-amount">¥0.00</b><em id="c-to">给 陈默 · 招商银行 6688</em></div>
      <div class="rows"><div><span>转出账户</span><b id="c-source">账户余额</b></div><div><span>手续费</span><b>¥0.00</b></div><div><span>到账时间</span><b>实时</b></div><div><span>备注</span><b>九月稿费</b></div></div>
      <p class="confirm-note">确认后不可撤回。请核对收款人与金额。</p>
      <button class="next" id="do-transfer" type="button">确认转账</button>
      <button class="next" id="back-edit" type="button" style="background:transparent;border:1px solid var(--line);color:var(--muted);bottom:76px">返回修改</button>
    </section>

    <section class="view receipt" id="receipt" hidden>
      <div class="mark" aria-hidden="true">✓</div>
      <h2>转账成功。</h2>
      <div class="amt" id="r-amount">¥0.00</div>
      <p id="r-to">给 陈默 · 招商银行 6688</p>
      <div class="rcp"><div><span>转账编号</span><b id="r-no">TRF-20261017-042</b></div><div><span>转出账户</span><b id="r-source">账户余额</b></div><div><span>时间</span><b>10.17 21:06</b></div><div><span>手续费</span><b>¥0.00</b></div></div>
      <button class="done" id="done" type="button">完成</button>
    </section>
  </div>
</div>

<script>
let recipient = { name: '陈默', bank: '招商银行 · 6688' };
let source = 'balance';
let available = 12480;
let amountValue = 0;

const sources = { balance: { name: '账户余额', limit: 12480 }, card: { name: '招商银行 储蓄卡', limit: 3200 } };

function money(value) {
  return '¥' + value.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

document.querySelectorAll('.person').forEach(function (button) {
  button.addEventListener('click', function () {
    recipient = { name: button.dataset.name, bank: button.dataset.bank };
    document.querySelectorAll('.person').forEach(function (item) { item.classList.toggle('on', item === button); });
  });
});

document.querySelectorAll('.chips [data-quick]').forEach(function (button) {
  button.addEventListener('click', function () {
    document.getElementById('amount').value = button.dataset.quick;
    document.getElementById('error').classList.remove('on');
  });
});

document.querySelectorAll('.source').forEach(function (label) {
  label.addEventListener('click', function () {
    source = label.querySelector('input').value;
    available = sources[source].limit;
    document.querySelectorAll('.source').forEach(function (item) { item.classList.toggle('on', item === label); });
    document.getElementById('available').textContent = money(available);
    document.getElementById('error').classList.remove('on');
  });
});

function readAmount() {
  const raw = document.getElementById('amount').value.replace(/[^0-9.]/g, '');
  const parsed = parseFloat(raw);
  return Number.isFinite(parsed) ? parsed : 0;
}

document.getElementById('to-confirm').addEventListener('click', goConfirm);

document.getElementById('amount').addEventListener('input', function () {
  document.getElementById('error').classList.remove('on');
});

function goConfirm() {
  const amount = readAmount();
  const error = document.getElementById('error');
  if (amount <= 0) {
    error.textContent = '请先填写转账金额。';
    error.classList.add('on');
    return;
  }
  if (amount > available) {
    error.textContent = '余额不足：当前可用 ' + money(available) + '，本次需要 ' + money(amount) + '。请降低金额，或切换其他资金来源。';
    error.classList.add('on');
    return;
  }
  amountValue = amount;
  document.getElementById('c-amount').textContent = money(amount);
  document.getElementById('c-to').textContent = '给 ' + recipient.name + ' · ' + recipient.bank;
  document.getElementById('c-source').textContent = sources[source].name;
  document.getElementById('transfer').hidden = true;
  document.getElementById('confirm').hidden = false;
}


document.getElementById('back-edit').addEventListener('click', function () {
  document.getElementById('confirm').hidden = true;
  document.getElementById('transfer').hidden = false;
});

document.getElementById('do-transfer').addEventListener('click', function () {
  const button = document.getElementById('do-transfer');
  button.disabled = true;
  button.textContent = '正在转账…';
  setTimeout(function () {
    document.getElementById('confirm').hidden = true;
    document.getElementById('receipt').hidden = false;
    document.getElementById('r-amount').textContent = money(amountValue);
    document.getElementById('r-to').textContent = '给 ' + recipient.name + ' · ' + recipient.bank;
    document.getElementById('r-source').textContent = sources[source].name;
    button.disabled = false;
    button.textContent = '确认转账';
    if (source === 'balance') {
      sources.balance.limit -= amountValue;
    }
  }, 900);
});

document.getElementById('done').addEventListener('click', function () {
  document.getElementById('receipt').hidden = true;
  document.getElementById('transfer').hidden = false;
  document.getElementById('amount').value = '';
  available = sources[source].limit;
  document.getElementById('available').textContent = money(available);
  document.getElementById('error').classList.remove('on');
});

document.querySelector('.help').addEventListener('click', function () {
  const error = document.getElementById('error');
  error.textContent = '转账遇到问题？可以联系人工客服，或把转账编号发给对方核对。';
  error.classList.add('on');
});
</script>
</body>
</html>
