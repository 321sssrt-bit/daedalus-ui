<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>星图 · 登录</title>
<style>
:root{
  --sky:#070b18;--panel:#0b1226;--ink:#e9e2cf;--muted:#9298b5;
  --gold:#d8b26a;--line:#26304f;--error:#ff7a6b;--field:#101a33;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--sky);color:var(--ink);font:15px/1.6 "Avenir Next","PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--gold);text-decoration:none;border-bottom:1px solid #d8b26a55}
a:hover{border-bottom-color:var(--gold)}
.stage{display:grid;grid-template-columns:minmax(0,1.32fr) minmax(440px,.88fr);width:100%;min-height:100vh}
.sky{position:relative;overflow:hidden;padding:52px 64px;display:flex;flex-direction:column;background:
  radial-gradient(1.4px 1.4px at 11% 19%,#fff9 50%,transparent 51%),
  radial-gradient(1.2px 1.2px at 22% 41%,#fff7 50%,transparent 51%),
  radial-gradient(1.7px 1.7px at 38% 12%,#fff8 50%,transparent 51%),
  radial-gradient(1.1px 1.1px at 49% 33%,#fff6 50%,transparent 51%),
  radial-gradient(1.5px 1.5px at 63% 22%,#fff8 50%,transparent 51%),
  radial-gradient(1.2px 1.2px at 76% 47%,#fff7 50%,transparent 51%),
  radial-gradient(1.8px 1.8px at 88% 15%,#fff9 50%,transparent 51%),
  radial-gradient(1.1px 1.1px at 17% 66%,#fff6 50%,transparent 51%),
  radial-gradient(1.6px 1.6px at 31% 81%,#fff7 50%,transparent 51%),
  radial-gradient(1.2px 1.2px at 58% 72%,#fff6 50%,transparent 51%),
  radial-gradient(1.5px 1.5px at 72% 88%,#fff7 50%,transparent 51%),
  radial-gradient(1.3px 1.3px at 91% 76%,#fff6 50%,transparent 51%),
  radial-gradient(900px 600px at 82% 18%,#16234a 0%,transparent 70%),
  var(--sky)}
.brand{display:flex;align-items:center;gap:14px;font:600 13px/1 ui-monospace,Consolas,monospace;letter-spacing:.28em;color:#cfc7ae}
.brand .mark{width:34px;height:34px;border:1px solid #d8b26a88;border-radius:50%;display:grid;place-items:center;color:var(--gold);font-size:15px}
.sky-copy{margin-top:auto;max-width:520px;padding-bottom:40px;position:relative;z-index:2}
.sky-copy .index{font:600 12px/1 ui-monospace,Consolas,monospace;letter-spacing:.22em;color:var(--gold)}
.sky-copy h1{margin:18px 0 12px;font:400 62px/1.12 "Songti SC","Noto Serif SC",Georgia,serif;letter-spacing:.02em}
.sky-copy h1 em{font-style:italic;color:var(--gold)}
.sky-copy p{margin:0;max-width:420px;color:var(--muted);font-size:15px;line-height:1.9}
.sky-foot{display:flex;gap:28px;font:12px/1.6 ui-monospace,Consolas,monospace;color:#6f7798;letter-spacing:.08em;position:relative;z-index:2}
.star-map{position:absolute;right:-40px;top:96px;width:520px;height:420px;opacity:.9;pointer-events:none}
.panel{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;padding:48px 58px 30px;position:relative}
.panel::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#ffffff05,transparent 30%);pointer-events:none}
.form-wrap{width:min(384px,100%);margin:auto}
.eyebrow{margin:0 0 14px;font:600 11px/1 ui-monospace,Consolas,monospace;letter-spacing:.26em;color:var(--gold)}
h2{margin:0;font:400 36px/1.2 "Songti SC","Noto Serif SC",Georgia,serif}
.lede{margin:10px 0 34px;color:var(--muted);font-size:14px;line-height:1.8}
.field{display:block;margin-bottom:18px}
.field .lab{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;font-size:12px;letter-spacing:.08em;color:#b9bfd6}
.field .lab a{font-size:12px;border:0}
input{width:100%;height:50px;padding:0 16px;border:1px solid var(--line);border-radius:6px;background:var(--field);color:var(--ink);font:15px/1 "Avenir Next","PingFang SC",sans-serif;outline:none;transition:border-color .18s,box-shadow .18s}
input::placeholder{color:#58628a}
input:hover{border-color:#3a4670}
input:focus{border-color:var(--gold);box-shadow:0 0 0 3px #d8b26a22}
.pw{position:relative;display:block}
.pw input{padding-right:70px}
.pw button{position:absolute;right:8px;top:8px;height:34px;padding:0 12px;border:0;border-radius:4px;background:transparent;color:var(--muted);font:12px/1 ui-monospace,Consolas,monospace;letter-spacing:.1em;cursor:pointer}
.pw button:hover{color:var(--gold);background:#d8b26a14}
.error{margin:-4px 0 16px;color:var(--error);font-size:13px;display:flex;gap:8px;align-items:center}
.primary{width:100%;height:52px;border:1px solid var(--gold);border-radius:6px;background:var(--gold);color:#151004;font:600 15px/1 "Avenir Next","PingFang SC",sans-serif;letter-spacing:.12em;cursor:pointer;transition:transform .16s,background .16s}
.primary:hover{background:#e6c27c}
.primary:active{transform:translateY(1px)}
.primary:disabled{opacity:.72;cursor:wait}
.or{display:flex;align-items:center;gap:14px;margin:22px 0;color:#5f6889;font:11px/1 ui-monospace,Consolas,monospace;letter-spacing:.2em}
.or::before,.or::after{content:"";height:1px;flex:1;background:var(--line)}
.ghost{width:100%;height:48px;border:1px solid var(--line);border-radius:6px;background:transparent;color:#cfd5ea;font:14px/1 "Avenir Next","PingFang SC",sans-serif;cursor:pointer}
.ghost:hover{border-color:#4a5680;background:#ffffff06}
.fine{margin:26px 0 0;color:#6f7798;font-size:12px;text-align:center;line-height:1.8}
.success{border:1px solid #d8b26a55;border-radius:10px;padding:28px 26px;background:#0f1a33}
.success .seal{width:46px;height:46px;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center;color:var(--gold);font-size:20px;margin-bottom:18px}
.success h3{margin:0 0 8px;font:400 26px/1.3 "Songti SC",Georgia,serif}
.success p{margin:0 0 18px;color:var(--muted);font-size:13px;line-height:1.8;word-break:break-all}
.panel-foot{margin-top:auto;display:flex;justify-content:space-between;gap:20px;font:11px/1.6 ui-monospace,Consolas,monospace;color:#5f6889;letter-spacing:.08em;border-top:1px solid #1a2340;padding-top:16px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#e9e2cf;color:#131a2e;padding:10px 18px;border-radius:999px;font-size:13px;box-shadow:0 12px 30px #0006;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
@media(max-width:1020px){
  .stage{grid-template-columns:1fr;min-height:100svh}
  .sky{min-height:340px;padding:36px 32px}
  .sky-copy{padding-bottom:0;margin-top:64px}
  .sky-copy h1{font-size:42px}
  .star-map{width:380px;height:300px;top:40px;right:-70px;opacity:.55}
  .panel{border-left:0;border-top:1px solid var(--line);padding:38px 28px}
}
@media(max-width:560px){
  .sky-copy h1{font-size:34px}
  .sky-foot{flex-direction:column;gap:8px}
  .panel{padding:30px 20px}
  .form-wrap{width:100%}
}
@media(prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<main class="stage">
  <section class="sky" aria-label="星图品牌">
    <div class="brand"><span class="mark">✦</span><span>NIGHTNAV · 星图</span></div>
    <svg class="star-map" viewBox="0 0 520 420" aria-hidden="true">
      <g fill="none" stroke="#d8b26a" stroke-opacity=".38" stroke-width="1">
        <path d="M92 286 L168 214 L246 238 L310 168 L392 190 L446 122"/>
        <path d="M168 214 L186 130 L262 92"/>
        <path d="M310 168 L340 260 L286 318"/>
      </g>
      <g fill="#e9e2cf">
        <circle cx="92" cy="286" r="3"/><circle cx="168" cy="214" r="2.4"/>
        <circle cx="246" cy="238" r="2.8"/><circle cx="310" cy="168" r="3.2"/>
        <circle cx="392" cy="190" r="2.2"/><circle cx="446" cy="122" r="3"/>
        <circle cx="186" cy="130" r="2.2"/><circle cx="262" cy="92" r="2.6"/>
        <circle cx="340" cy="260" r="2.2"/><circle cx="286" cy="318" r="2.8"/>
      </g>
      <g fill="#d8b26a">
        <circle cx="168" cy="214" r="7" fill-opacity=".14"/>
        <circle cx="310" cy="168" r="9" fill-opacity=".16"/>
      </g>
      <text x="330" y="150" fill="#9298b5" font-size="10" font-family="Consolas,monospace" letter-spacing="2">LYRA · 01</text>
    </svg>
    <div class="sky-copy">
      <p class="index">OBSERVATORY / 北纬 31°14′</p>
      <h1>把今晚的<br>天空<em>收进</em>账号。</h1>
      <p>星图记录你的观测、坐标与深夜灵感。回来时，昨夜的那片天仍然挂在原来的位置。</p>
    </div>
    <div class="sky-foot"><span>2019 — 2026</span><span>12,480 位观测员</span><span>实时星历已同步</span></div>
  </section>

  <section class="panel">
    <div class="form-wrap">
      <p class="eyebrow">MEMBER ACCESS</p>
      <h2>回到你的星图</h2>
      <p class="lede">用注册邮箱或六位观测号进入。今晚的云量：少云，适合久留。</p>

      <form id="login-form" novalidate>
        <label class="field" for="account">
          <span class="lab"><span>邮箱或观测号</span><span>必填</span></span>
          <input id="account" name="account" type="text" autocomplete="username" placeholder="you@example.com 或 004217">
        </label>
        <label class="field" for="password">
          <span class="lab"><span>密码</span><a href="#reset" id="forgot">忘记密码？</a></span>
          <span class="pw">
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="至少 6 位">
            <button type="button" id="toggle-pw" aria-label="显示密码" aria-pressed="false">显示</button>
          </span>
        </label>
        <p class="error" id="form-error" role="alert" hidden></p>
        <button class="primary" id="submit" type="submit">进入星图</button>
      </form>

      <div id="success" class="success" hidden>
        <div class="seal" aria-hidden="true">✓</div>
        <h3>通行证已确认</h3>
        <p>观测员 <strong id="who">—</strong>，欢迎回来。正在为你展开上次停留的星区。</p>
        <button class="ghost" id="again" type="button">切换账号</button>
      </div>

      <div class="or">OR</div>
      <button class="ghost" id="passkey" type="button">使用设备通行密钥</button>
      <p class="fine">第一次来？<a href="#join">申请一枚观测席位</a><br>登录即表示同意《观测守则》与《夜间数据条款》</p>
    </div>
    <footer class="panel-foot"><span>© 星图 NIGHTNAV</span><span>服务状态 · 正常</span></footer>
  </section>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const form = document.getElementById('login-form');
const accountEl = document.getElementById('account');
const passEl = document.getElementById('password');
const errorEl = document.getElementById('form-error');
const submitBtn = document.getElementById('submit');
const success = document.getElementById('success');
const who = document.getElementById('who');
const toast = document.getElementById('toast');
const toggle = document.getElementById('toggle-pw');
let toastTimer = null;

function showToast(message) {
  toast.textContent = message;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { toast.classList.remove('show'); }, 2400);
}
function showError(message) {
  errorEl.textContent = message;
  errorEl.hidden = false;
}
function clearError() {
  errorEl.hidden = true;
  errorEl.textContent = '';
}

toggle.addEventListener('click', function () {
  const shown = passEl.type === 'text';
  passEl.type = shown ? 'password' : 'text';
  toggle.textContent = shown ? '显示' : '隐藏';
  toggle.setAttribute('aria-label', shown ? '显示密码' : '隐藏密码');
  toggle.setAttribute('aria-pressed', String(!shown));
  passEl.focus();
});

form.addEventListener('submit', function (event) {
  event.preventDefault();
  const account = accountEl.value.trim();
  const pass = passEl.value;
  if (!account) {
    showError('请先填写邮箱或六位观测号。');
    accountEl.focus();
    return;
  }
  if (pass.length < 6) {
    showError('密码至少 6 位。想不起来可以从「忘记密码」取回。');
    passEl.focus();
    return;
  }
  clearError();
  submitBtn.disabled = true;
  submitBtn.textContent = '正在校准星轨…';
  setTimeout(function () {
    who.textContent = account;
    form.hidden = true;
    success.hidden = false;
    document.getElementById('again').focus();
  }, 950);
});

document.getElementById('again').addEventListener('click', function () {
  success.hidden = true;
  form.hidden = false;
  submitBtn.disabled = false;
  submitBtn.textContent = '进入星图';
  passEl.value = '';
  accountEl.focus();
});

document.getElementById('forgot').addEventListener('click', function (event) {
  event.preventDefault();
  showToast('已为你准备好取回入口：请查收注册邮箱的重置信。');
});

document.getElementById('passkey').addEventListener('click', function () {
  showToast('这台设备还没有登记通行密钥。');
});
</script>
</body>
</html>
