<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>口袋 · 钱包</title>
<style>
:root{
  --bg:#e9eee7;--screen:#f7f8f3;--ink:#16241c;--green:#2f6b4f;--mint:#bfe3d0;
  --coral:#d97757;--gray:#77837b;--line:#e2e7df;--white:#ffffff;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:
  radial-gradient(700px 500px at 50% 0%,#f2f6ee 0%,transparent 60%),var(--bg);
  display:grid;place-items:center;padding:26px;font:14px/1.5 "Avenir Next","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink)}
.phone{width:390px;height:844px;background:#1b1f1d;border-radius:48px;padding:10px;box-shadow:0 40px 90px #16241c33;position:relative;flex:none}
.screen{width:100%;height:100%;background:var(--screen);border-radius:39px;overflow:hidden;position:relative;display:flex;flex-direction:column}
.notch{position:absolute;left:50%;top:8px;transform:translateX(-50%);width:110px;height:24px;background:#1b1f1d;border-radius:14px;z-index:6}
.statusbar{height:44px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 22px 6px;font:600 10px/1 ui-monospace,Consolas,monospace;color:#3c4a41}
.statusbar .icons{display:flex;gap:4px}
.statusbar i{display:block;width:13px;height:8px;border:1px solid #3c4a41;border-radius:2px}
.content{flex:1;overflow-y:auto;padding:6px 18px 92px;scrollbar-width:none}
.content::-webkit-scrollbar{display:none}
.hello{display:flex;align-items:center;gap:10px;padding:6px 2px 14px}
.hello .ava{width:36px;height:36px;border-radius:50%;background:radial-gradient(circle at 38% 32%,#8fae9c,#2f6b4f);color:#f4f7f0;display:grid;place-items:center;font:400 15px/1 "Songti SC",Georgia,serif}
.hello b{display:block;font:400 17px/1.3 "Songti SC",Georgia,serif}
.hello span{display:block;font:8.5px/1.5 ui-monospace,Consolas,monospace;color:var(--gray);letter-spacing:.04em}
.hello .bell{margin-left:auto;width:32px;height:32px;border:1px solid var(--line);border-radius:50%;background:#fff;color:var(--gray);font-size:13px;cursor:pointer}
.balance{background:linear-gradient(150deg,#d3ecdd,#a9d6bd);border-radius:22px;padding:16px 18px 15px;position:relative;overflow:hidden;box-shadow:0 14px 30px #2f6b4f1f}
.balance::after{content:"";position:absolute;right:-40px;top:-50px;width:150px;height:150px;border:1px solid #ffffff66;border-radius:50%;box-shadow:0 0 0 20px #ffffff1f,0 0 0 40px #ffffff12}
.balance .lab{font:9px/1 ui-monospace,Consolas,monospace;color:#3f6b54;letter-spacing:.16em}
.amount{display:flex;align-items:center;gap:8px;margin:6px 0 2px;position:relative;z-index:2}
.amount b{font:400 34px/1.1 "Songti SC","Noto Serif SC",Georgia,serif;letter-spacing:.01em}
.eye{width:26px;height:26px;border:0;border-radius:50%;background:#ffffff55;color:#2f6b4f;font-size:12px;cursor:pointer;line-height:1}
.sub{font:8.5px/1.6 ui-monospace,Consolas,monospace;color:#3f6b54;letter-spacing:.02em}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;position:relative;z-index:2}
.quick button{height:34px;border:1px solid #ffffff88;border-radius:999px;background:#ffffff5c;color:#244b39;font:10px/1 "Avenir Next","PingFang SC",sans-serif;letter-spacing:.06em;cursor:pointer}
.quick button:hover{background:#ffffff8c}
.recent{margin-top:18px}
.section-head{display:flex;align-items:baseline;gap:8px;margin-bottom:8px;padding:0 2px}
.section-head h2{margin:0;font:400 17px/1.3 "Songti SC",Georgia,serif}
.section-head button{margin-left:auto;border:0;background:none;color:var(--gray);font:9px/1 ui-monospace,Consolas,monospace;letter-spacing:.04em;cursor:pointer}
.tx{display:flex;align-items:center;gap:11px;padding:9px 2px;border-bottom:1px solid var(--line)}
.tx:last-child{border-bottom:0}
.tx .ico{width:36px;height:36px;border-radius:12px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;font:600 12px/1 ui-monospace,Consolas,monospace;color:#4a5a50;flex:none}
.tx .who b{display:block;font-size:12px;font-weight:600}
.tx .who span{display:block;font:8.5px/1.5 ui-monospace,Consolas,monospace;color:#9aa59d;letter-spacing:.02em}
.tx .amt{margin-left:auto;font:600 12px/1 ui-monospace,Consolas,monospace;letter-spacing:.02em}
.tx .amt.in{color:var(--green)}
.tx .amt.out{color:var(--coral)}
.bottom{position:absolute;left:0;right:0;bottom:0;height:76px;background:#fffffff2;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-around;padding:0 12px 8px;backdrop-filter:blur(8px)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;color:#9aa59d;font:8px/1 "Avenir Next","PingFang SC",sans-serif;cursor:pointer;padding:6px 8px}
.tab i{font-style:normal;font-size:16px;line-height:1}
.tab.on{color:var(--green)}
.tab.on i{color:var(--green)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:24px 24px 0 0;padding:18px 20px 24px;transform:translateY(110%);transition:transform .24s ease;z-index:10;box-shadow:0 -20px 50px #16241c1f}
.sheet.on{transform:translateY(0)}
.scrim{position:absolute;inset:0;background:#16241c55;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
.scrim.on{opacity:1;pointer-events:auto}
.sheet h3{margin:0 0 2px;font:400 22px/1.3 "Songti SC",Georgia,serif}
.sheet p{margin:0 0 14px;font-size:10px;color:var(--gray);line-height:1.7}
.sheet label{display:block;font:8.5px/1.6 ui-monospace,Consolas,monospace;color:var(--gray);letter-spacing:.1em;margin-bottom:4px}
.sheet input{width:100%;height:42px;border:1px solid var(--line);border-radius:8px;background:#f8faf6;color:var(--ink);font:14px/1 "Avenir Next","PingFang SC",sans-serif;padding:0 12px;outline:none;margin-bottom:10px}
.sheet input:focus{border-color:var(--green)}
.sheet .go{width:100%;height:44px;border:0;border-radius:999px;background:var(--green);color:#f4f7f0;font:600 12px/1 "Avenir Next","PingFang SC",sans-serif;letter-spacing:.08em;cursor:pointer}
.sheet .close{position:absolute;right:16px;top:14px;width:26px;height:26px;border:1px solid var(--line);border-radius:50%;background:#fff;color:var(--gray);cursor:pointer;line-height:1}
.toast{position:absolute;left:50%;bottom:88px;transform:translateX(-50%) translateY(8px);background:#16241c;color:#f7f8f3;padding:8px 14px;border-radius:999px;font-size:10px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;white-space:nowrap;z-index:12}
.toast.show{opacity:1;transform:translateX(-50%)}
@media(min-width:441px) and (max-height:900px){.phone{zoom:.86}}
@media(max-width:440px){
  body{padding:0;display:block;background:#f7f8f3}
  .phone{width:100%;height:100svh;border-radius:0;padding:0;box-shadow:none;background:#f7f8f3}
  .screen{border-radius:0;height:100svh}
  .notch{display:none}
  .statusbar{height:20px;padding:8px 18px 0}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="phone">
  <div class="notch" aria-hidden="true"></div>
  <div class="screen">
    <div class="statusbar"><span>9:41</span><span class="icons"><i></i><i></i><i></i></span></div>
    <div class="content">
      <div class="hello"><span class="ava">林</span><div><b>早上好，林岸</b><span>10 月 17 日 · 周五</span></div><button class="bell" type="button" aria-label="通知">◦</button></div>

      <section class="balance">
        <span class="lab">可用余额 · CNY</span>
        <div class="amount"><b id="balance">¥ 12,480.00</b><button class="eye" id="eye" type="button" aria-label="隐藏余额" aria-pressed="false">◉</button></div>
        <span class="sub">本月支出 ¥3,240 · 收入 ¥8,600</span>
        <div class="quick"><button type="button" data-open="转出">转出</button><button type="button" id="receive">收款</button><button type="button" id="topup">充值</button></div>
      </section>

      <section class="recent">
        <div class="section-head"><h2>最近</h2><button type="button" id="all">全部流水</button></div>
        <div class="tx"><span class="ico">咖</span><div class="who"><b>山货咖啡</b><span>今天 08:12 · 餐饮</span></div><span class="amt out">−¥32.00</span></div>
        <div class="tx"><span class="ico">稿</span><div class="who"><b>册页 · 稿费</b><span>昨天 16:40 · 收入</span></div><span class="amt in">+¥2,400.00</span></div>
        <div class="tx"><span class="ico">地</span><div class="who"><b>地铁 2 号线</b><span>昨天 09:02 · 交通</span></div><span class="amt out">−¥4.00</span></div>
        <div class="tx"><span class="ico">房</span><div class="who"><b>十月房租</b><span>10 月 15 日 · 居住</span></div><span class="amt out">−¥4,200.00</span></div>
      </section>
    </div>

    <nav class="bottom" aria-label="底部导航">
      <button class="tab on" type="button"><i>●</i>钱包</button>
      <button class="tab" type="button"><i>▭</i>卡片</button>
      <button class="tab" type="button"><i>≡</i>记账</button>
      <button class="tab" type="button"><i>○</i>我的</button>
    </nav>

    <div class="scrim" id="scrim"></div>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="转出">
      <button class="close" id="close" type="button" aria-label="关闭">✕</button>
      <h3 id="sheet-title">转出</h3>
      <p id="sheet-note">到账时间取决于收款银行，通常即时。</p>
      <label for="to">收款人</label>
      <input id="to" type="text" value="陈默" autocomplete="off">
      <label for="money">金额</label>
      <input id="money" type="text" inputmode="decimal" placeholder="0.00">
      <button class="go" id="go" type="button">下一步</button>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>
</div>

<script>
let hidden = false;
const balance = document.getElementById('balance');
const toast = document.getElementById('toast');
const sheet = document.getElementById('sheet');
const scrim = document.getElementById('scrim');
let mode = '转出';

document.getElementById('eye').addEventListener('click', function () {
  hidden = !hidden;
  balance.textContent = hidden ? '¥ ••••••' : '¥ 12,480.00';
  this.setAttribute('aria-pressed', String(hidden));
  this.setAttribute('aria-label', hidden ? '显示余额' : '隐藏余额');
});

document.querySelectorAll('[data-open]').forEach(function (button) {
  button.addEventListener('click', function () { openSheet('转出'); });
});
document.getElementById('receive').addEventListener('click', function () { openSheet('收款'); });
document.getElementById('topup').addEventListener('click', function () { openSheet('充值'); });
document.getElementById('close').addEventListener('click', closeSheet);
scrim.addEventListener('click', closeSheet);

function openSheet(next) {
  mode = next;
  document.getElementById('sheet-title').textContent = next;
  document.getElementById('sheet-note').textContent = next === '收款'
    ? '生成一张收款码，对方扫码后即时到账。'
    : next === '充值'
      ? '从绑定的银行卡转入，单笔上限 ¥50,000。'
      : '到账时间取决于收款银行，通常即时。';
  document.getElementById('go').textContent = next === '收款' ? '生成收款码' : next === '充值' ? '确认充值' : '下一步';
  sheet.classList.add('on');
  scrim.classList.add('on');
  document.getElementById('money').focus();
}

function closeSheet() {
  sheet.classList.remove('on');
  scrim.classList.remove('on');
  document.getElementById('money').value = '';
}

document.getElementById('go').addEventListener('click', function () {
  const amount = document.getElementById('money').value.trim();
  if (!amount) {
    document.getElementById('money').focus();
    showToast('先填一个金额。');
    return;
  }
  closeSheet();
  showToast(mode === '收款' ? '收款码已生成，可以保存或分享。' : mode + ' ¥' + amount + ' 已提交。');
});

document.getElementById('all').addEventListener('click', function () { showToast('完整流水在「记账」里，共 128 笔。'); });
document.querySelectorAll('.tab').forEach(function (tab) {
  tab.addEventListener('click', function () {
    document.querySelectorAll('.tab').forEach(function (item) { item.classList.toggle('on', item === tab); });
  });
});

function showToast(text) {
  toast.textContent = text;
  toast.classList.add('show');
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(function () { toast.classList.remove('show'); }, 2200);
}
</script>
</body>
</html>
