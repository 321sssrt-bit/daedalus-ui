<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>显影 · 苏禾</title>
<style>
:root{
  --rose:#e9d9d1;--paper:#f4ece4;--ink:#211f22;--accent:#9e4b3b;--muted:#7c6d68;
  --line:#d3c0b6;--night:#2b272b;
}
*{box-sizing:border-box}
body{margin:0;background:
  radial-gradient(800px 500px at 0% 0%,#f3e6df 0%,transparent 55%),var(--rose);
  color:var(--ink);font:14px/1.65 "Avenir Next","PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh}
.top{display:flex;align-items:center;gap:22px;padding:16px 34px;border-bottom:1px solid var(--line)}
.brand{font:600 18px/1 "Songti SC","Noto Serif SC",Georgia,serif;letter-spacing:.28em}
.top nav{display:flex;gap:18px;margin-left:14px}
.top nav a{color:var(--muted);text-decoration:none;font-size:12px}
.top nav a.on{color:var(--ink);border-bottom:1px solid var(--accent);padding-bottom:4px}
.top .right{margin-left:auto;display:flex;align-items:center;gap:12px}
.contact{height:32px;padding:0 13px;border:1px solid var(--ink);border-radius:999px;background:transparent;color:var(--ink);font:11px/1 "Avenir Next","PingFang SC",sans-serif;letter-spacing:.06em;cursor:pointer}
.contact:hover{background:var(--ink);color:var(--paper)}
.avail{font:9px/1.5 ui-monospace,Consolas,monospace;color:var(--muted);letter-spacing:.06em;display:flex;align-items:center;gap:6px}
.avail i{width:6px;height:6px;border-radius:50%;background:#5f7f5a;font-style:normal}
main{max-width:1220px;margin:0 auto;padding:36px 34px 70px;display:grid;grid-template-columns:340px minmax(0,1fr);gap:44px;align-items:start}
.profile{position:sticky;top:24px}
.portrait{width:132px;height:132px;border-radius:50%;position:relative;overflow:hidden;background:
  radial-gradient(circle at 42% 36%,#e7c3b4 0%,#b56b58 45%,#4a3030 100%);border:1px solid #b9907f;box-shadow:0 20px 40px #4a30301f}
.portrait::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,#ffffff08 0 2px,transparent 2px 5px)}
.portrait::after{content:"";position:absolute;left:34px;top:30px;width:64px;height:58px;border-radius:46% 54% 52% 48%;background:#2b2325;opacity:.78}
h1{margin:18px 0 2px;font:400 44px/1.1 "Songti SC","Noto Serif SC",Georgia,serif;letter-spacing:.04em}
.tagline{margin:0 0 14px;font-size:13px;color:var(--accent);letter-spacing:.02em}
.bio{margin:0 0 18px;font-size:12px;line-height:1.95;color:#5e524f}
.stats{display:flex;gap:20px;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stats div{font:9px/1.5 ui-monospace,Consolas,monospace;color:var(--muted);letter-spacing:.06em}
.stats b{display:block;font:400 22px/1.2 "Songti SC",Georgia,serif;color:var(--ink);letter-spacing:0}
.actions{display:flex;gap:8px;margin:16px 0 0}
.follow{height:38px;padding:0 18px;border:1px solid var(--ink);border-radius:999px;background:var(--ink);color:var(--paper);font:11px/1 "Avenir Next","PingFang SC",sans-serif;letter-spacing:.08em;cursor:pointer;flex:1}
.follow:hover{background:var(--accent);border-color:var(--accent)}
.follow.on{background:transparent;color:var(--ink)}
.msg{height:38px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--muted);font-size:11px;cursor:pointer}
.msg:hover{border-color:var(--ink);color:var(--ink)}
.now{margin-top:16px;font:9px/1.8 ui-monospace,Consolas,monospace;color:#968681;letter-spacing:.03em}
.work-head{display:flex;align-items:baseline;gap:12px;margin-bottom:14px}
.work-head h2{margin:0;font:400 24px/1.2 "Songti SC",Georgia,serif}
.filters{display:flex;gap:5px;margin-left:auto}
.filters button{height:26px;padding:0 10px;border:1px solid transparent;border-radius:999px;background:transparent;color:var(--muted);font:11px/1 "Avenir Next","PingFang SC",sans-serif;cursor:pointer}
.filters button:hover{color:var(--ink)}
.filters button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.work{border:0;padding:0;background:transparent;cursor:pointer;text-align:left;color:inherit;font:inherit}
.shot{aspect-ratio:4/3;position:relative;overflow:hidden;background:#2b272b}
.shot::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,#ffffff05 0 1px,transparent 1px 4px)}
.work:hover .shot{filter:brightness(1.08)}
.work:hover .cap b{color:var(--accent)}
.s1{background:linear-gradient(160deg,#6b4a44,#1d191c 65%)}
.s1::before{content:"";position:absolute;left:22%;top:18%;width:46%;height:46%;border-radius:50%;background:radial-gradient(circle at 40% 38%,#e6b48f,#8d4f3d 65%,#3a2424);opacity:.9}
.s2{background:linear-gradient(200deg,#8c9a92,#2d3434 70%)}
.s2::before{content:"";position:absolute;left:8%;right:8%;bottom:18%;height:1px;background:#e9d9d188;box-shadow:0 10px 0 #e9d9d144,0 20px 0 #e9d9d422}
.s3{background:linear-gradient(180deg,#d9b397,#7a4a3f 70%,#2b1f20)}
.s3::before{content:"";position:absolute;left:18%;top:14%;width:64%;height:1px;background:#f4ece4aa;transform:rotate(-12deg)}
.s4{background:linear-gradient(140deg,#3b3f45,#15171a 70%)}
.s4::before{content:"";position:absolute;right:12%;top:20%;width:38%;height:60%;background:#d8c5b1;opacity:.75;clip-path:polygon(0 16%,100% 0,100% 100%,0 84%)}
.s5{background:linear-gradient(180deg,#c9a26f,#6e4a34 60%,#241b18)}
.s5::before{content:"";position:absolute;left:30%;top:26%;width:40%;height:40%;border-radius:50%;border:1px solid #f4ece488}
.s6{background:linear-gradient(200deg,#4f5d58,#202625 70%)}
.s6::before{content:"";position:absolute;left:0;right:0;top:44%;height:12%;background:#e9d9d1;opacity:.16;transform:rotate(-6deg)}
.cap{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:8px 1px 12px}
.cap b{font:400 14px/1.4 "Songti SC",Georgia,serif;font-weight:400}
.cap span{font:9px/1.5 ui-monospace,Consolas,monospace;color:#94837d;letter-spacing:.04em;white-space:nowrap}
.empty{display:none;padding:50px 0;text-align:center;color:var(--muted);font-size:12px}
.empty.on{display:block}
.light{position:fixed;inset:0;background:#17161ad9;z-index:20;display:none;align-items:center;justify-content:center;padding:24px}
.light.on{display:flex}
.light .frame{width:min(780px,100%);background:var(--paper);padding:14px 14px 18px}
.light .big{aspect-ratio:4/3;background:#2b272b;position:relative;overflow:hidden}
.light .big .inner{position:absolute;inset:0}
.light h3{margin:12px 4px 2px;font:400 22px/1.3 "Songti SC",Georgia,serif}
.light p{margin:0 4px;font:9px/1.7 ui-monospace,Consolas,monospace;color:var(--muted);letter-spacing:.06em}
.light .close{position:absolute;right:18px;top:18px;width:34px;height:34px;border:1px solid #ffffff55;border-radius:50%;background:transparent;color:#fff;font-size:14px;cursor:pointer}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;font-size:11px;opacity:0;pointer-events:none;transition:opacity .18s}
.toast.show{opacity:1}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
@media(max-width:980px){
  main{grid-template-columns:1fr;gap:30px}
  .profile{position:static;display:grid;grid-template-columns:132px 1fr;gap:20px;align-items:start}
  .portrait{grid-row:1/4}
  .profile h1{margin-top:0}
  .profile .bio,.profile .stats,.profile .actions,.profile .now{grid-column:1/-1}
  .grid{grid-template-columns:1fr 1fr}
}
@media(max-width:620px){
  .top{padding:14px 16px}
  .top nav{display:none}
  main{padding:24px 16px 50px}
  .profile{grid-template-columns:96px 1fr}
  .portrait{width:96px;height:96px}
  h1{font-size:34px}
  .grid{grid-template-columns:1fr}
  .work-head{flex-wrap:wrap}
  .filters{margin-left:0;width:100%}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">显影</div>
  <nav aria-label="个人主页导航"><a href="#work" class="on">作品</a><a href="#notes">手记</a><a href="#about">关于</a></nav>
  <div class="right"><span class="avail"><i></i>10 月可约拍</span><button class="contact" id="contact" type="button">联系我</button></div>
</header>

<main>
  <aside class="profile">
    <div class="portrait" aria-hidden="true"></div>
    <h1>苏禾</h1>
    <p class="tagline">在上海拍夜晚和白天的人。</p>
    <p class="bio">纪实与编辑摄影。常在末班车、菜场和旧书店之间来回。相信照片应该先让人停下来，再让人想起什么。</p>
    <div class="stats"><div><b>9</b>年拍摄</div><div><b>48</b>组作品</div><div><b>12</b>次展览</div></div>
    <div class="actions"><button class="follow" id="follow" type="button">关注</button><button class="msg" id="msg" type="button">私信</button></div>
    <p class="now">最近：为《册页》第 12 期拍摄封面<br>器材：Pentax 67 / Portra 400</p>
  </aside>

  <section>
    <div class="work-head">
      <h2>选作</h2>
      <div class="filters" role="group" aria-label="作品分类">
        <button type="button" data-kind="all" aria-pressed="true">全部</button>
        <button type="button" data-kind="portrait" aria-pressed="false">人像</button>
        <button type="button" data-kind="city" aria-pressed="false">城市</button>
        <button type="button" data-kind="still" aria-pressed="false">静物</button>
      </div>
    </div>

    <div class="grid" id="grid">
      <button class="work" type="button" data-kind="city" data-art="s1" data-title="凌晨四点的包子铺" data-meta="2026 · 上海 · 中画幅胶片">
        <span class="shot s1" aria-hidden="true"></span><span class="cap"><b>凌晨四点的包子铺</b><span>2026</span></span>
      </button>
      <button class="work" type="button" data-kind="portrait" data-art="s2" data-title="末班车上的第七个人" data-meta="2026 · 上海 · 地铁 2 号线">
        <span class="shot s2" aria-hidden="true"></span><span class="cap"><b>末班车上的第七个人</b><span>2026</span></span>
      </button>
      <button class="work" type="button" data-kind="still" data-art="s3" data-title="旧书店的最后一周" data-meta="2026 · 上海 · 安福路">
        <span class="shot s3" aria-hidden="true"></span><span class="cap"><b>旧书店的最后一周</b><span>2026</span></span>
      </button>
      <button class="work" type="button" data-kind="portrait" data-art="s4" data-title="阿岚与她的窗" data-meta="2025 · 杭州 · 室内自然光">
        <span class="shot s4" aria-hidden="true"></span><span class="cap"><b>阿岚与她的窗</b><span>2025</span></span>
      </button>
      <button class="work" type="button" data-kind="still" data-art="s5" data-title="一盆薄荷的第七次分株" data-meta="2025 · 上海 · 翻拍">
        <span class="shot s5" aria-hidden="true"></span><span class="cap"><b>一盆薄荷的第七次分株</b><span>2025</span></span>
      </button>
      <button class="work" type="button" data-kind="city" data-art="s6" data-title="河岸，治理第六年" data-meta="2025 · 苏州河 · 阴天">
        <span class="shot s6" aria-hidden="true"></span><span class="cap"><b>河岸，治理第六年</b><span>2025</span></span>
      </button>
    </div>
    <p class="empty" id="empty">这个分类还没有公开的选作。等下一组冲洗出来。</p>
  </section>
</main>

<div class="light" id="light" role="dialog" aria-modal="true" aria-label="作品大图">
  <div class="frame"><button class="close" id="close" type="button" aria-label="关闭">✕</button><div class="big"><div class="inner" id="big-art"></div></div><h3 id="light-title">—</h3><p id="light-meta">—</p></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
let kind = 'all';
let following = false;
let followers = 2841;

function applyFilter() {
  let shown = 0;
  document.querySelectorAll('.work').forEach(function (work) {
    const visible = kind === 'all' || work.dataset.kind === kind;
    work.style.display = visible ? '' : 'none';
    if (visible) shown += 1;
  });
  document.getElementById('empty').classList.toggle('on', shown === 0);
}

document.querySelectorAll('.filters button').forEach(function (button) {
  button.addEventListener('click', function () {
    kind = button.dataset.kind;
    document.querySelectorAll('.filters button').forEach(function (item) { item.setAttribute('aria-pressed', String(item === button)); });
    applyFilter();
  });
});

const light = document.getElementById('light');
document.querySelectorAll('.work').forEach(function (work) {
  work.addEventListener('click', function () {
    document.getElementById('big-art').className = 'inner ' + work.dataset.art;
    document.getElementById('light-title').textContent = work.dataset.title;
    document.getElementById('light-meta').textContent = work.dataset.meta;
    light.classList.add('on');
    document.getElementById('close').focus();
  });
});
document.getElementById('close').addEventListener('click', function () { light.classList.remove('on'); });
light.addEventListener('click', function (event) { if (event.target === light) light.classList.remove('on'); });
document.addEventListener('keydown', function (event) { if (event.key === 'Escape') light.classList.remove('on'); });

document.getElementById('follow').addEventListener('click', function () {
  following = !following;
  followers += following ? 1 : -1;
  this.textContent = following ? '已关注 · ' + followers : '关注';
  this.classList.toggle('on', following);
});

document.getElementById('msg').addEventListener('click', function () {
  toast('私信窗口已打开。苏禾通常在两三天内回复。');
});
document.getElementById('contact').addEventListener('click', function () {
  toast('拍摄咨询已记录，苏禾会回复档期。');
});

function toast(text) {
  const el = document.getElementById('toast');
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(function () { el.classList.remove('show'); }, 2200);
}

applyFilter();
</script>
</body>
</html>
