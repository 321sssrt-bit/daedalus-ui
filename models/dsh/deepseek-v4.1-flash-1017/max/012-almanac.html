<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>历 · 十月</title>
<style>
:root{
  --paper:#efe8d8;--card:#f7f1e2;--ink:#232019;--red:#a63a2a;--olive:#5e6b4f;
  --line:#cfc5b0;--muted:#857b68;--gold:#c49a4a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 "Avenir Next","PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh}
.top{display:flex;align-items:center;gap:20px;padding:14px 28px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:9px;font:600 20px/1 "Songti SC","Noto Serif SC",Georgia,serif;letter-spacing:.2em}
.brand small{font:9px/1 ui-monospace,Consolas,monospace;letter-spacing:.3em;color:var(--muted)}
.top nav{display:flex;gap:14px;margin-left:10px}
.top nav a{color:var(--muted);text-decoration:none;font-size:12px}
.top nav a.on{color:var(--ink);border-bottom:2px solid var(--red);padding-bottom:3px}
.top .right{margin-left:auto;display:flex;align-items:center;gap:10px}
.search{display:flex;align-items:center;gap:6px;height:30px;padding:0 10px;border:1px solid var(--line);border-radius:2px;background:#f7f1e2;color:var(--muted);font-size:11px}
.search i{font-style:normal;color:var(--red)}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--olive);color:var(--paper);display:grid;place-items:center;font:600 9px/1 ui-monospace,Consolas,monospace}
.main{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:0;min-height:calc(100vh - 59px)}
.left{padding:20px 24px 30px;border-right:1px solid var(--line)}
.head{display:flex;align-items:flex-end;gap:16px;margin-bottom:12px}
.head h1{margin:0;font:400 46px/1 "Songti SC","Noto Serif SC",Georgia,serif;letter-spacing:.02em}
.head .year{font:400 14px/1.2 ui-monospace,Consolas,monospace;color:var(--muted);letter-spacing:.16em;padding-bottom:5px}
.head .stats{margin-left:auto;display:flex;align-items:center;gap:12px;font:10px/1.4 ui-monospace,Consolas,monospace;color:var(--muted);letter-spacing:.06em}
.head .stats b{color:var(--red);font-weight:600}
.nav-arrows{display:flex;gap:4px}
.nav-arrows button{width:30px;height:30px;border:1px solid var(--line);border-radius:2px;background:transparent;color:var(--ink);cursor:pointer;font-size:14px;line-height:1}
.nav-arrows button:hover{border-color:var(--red);color:var(--red)}
.today-btn{height:30px;padding:0 12px;border:1px solid var(--ink);border-radius:2px;background:var(--ink);color:var(--paper);font:11px/1 "Avenir Next","PingFang SC",sans-serif;letter-spacing:.08em;cursor:pointer}
.today-btn:hover{background:var(--red);border-color:var(--red)}
.filters{display:flex;gap:6px;margin-bottom:14px}
.filters button{height:26px;padding:0 10px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--muted);font:11px/1 "Avenir Next","PingFang SC",sans-serif;cursor:pointer}
.filters button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.weekdays{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--ink);border-bottom:1px solid var(--line)}
.weekdays span{padding:7px 8px;font:10px/1 ui-monospace,Consolas,monospace;letter-spacing:.14em;color:var(--muted)}
.weekdays span:nth-child(6),.weekdays span:nth-child(7){color:var(--red)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:minmax(88px,1fr);border-left:1px solid var(--line)}
.cell{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 7px;display:flex;flex-direction:column;gap:4px;min-width:0;background:transparent;text-align:left;font:inherit;color:inherit;cursor:pointer}
.cell:hover{background:#f6efdf}
.cell.out{color:#a9a08f;background:#ece4d3}
.cell.today{background:#f5ead2;box-shadow:inset 0 0 0 2px var(--red)}
.cell .d{display:flex;align-items:center;justify-content:space-between;font:600 13px/1.2 ui-monospace,Consolas,monospace}
.cell .d em{font-style:normal;font-size:9px;color:var(--red);letter-spacing:.06em}
.cell .lunar{font:9px/1.2 ui-monospace,Consolas,monospace;color:#a39a88;margin-top:-2px}
.ev{display:block;width:100%;padding:2px 5px;border:0;border-left:2px solid var(--olive);border-radius:1px;background:#e7e5d2;color:#3d4434;font:10px/1.45 "Avenir Next","PingFang SC",sans-serif;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.ev.work{border-left-color:var(--red);background:#f0ddd2;color:#6e2b20}
.ev.personal{border-left-color:var(--olive);background:#e5e8d7;color:#43503a}
.ev.solar{border-left-color:var(--gold);background:#f2e8ce;color:#6d5620}
.ev:hover{filter:brightness(.97)}
.more{font:9px/1.4 ui-monospace,Consolas,monospace;color:var(--muted);padding-left:2px}
.detail{background:var(--card);padding:22px 22px 26px;display:flex;flex-direction:column}
.detail .kicker{font:10px/1 ui-monospace,Consolas,monospace;letter-spacing:.2em;color:var(--red);margin:0 0 12px}
.detail .date{font:400 30px/1.1 "Songti SC",Georgia,serif;margin:0 0 2px}
.detail .week{font:10px/1.6 ui-monospace,Consolas,monospace;color:var(--muted);letter-spacing:.08em}
.detail .rule{height:1px;background:var(--line);margin:16px 0}
.detail h2{margin:0 0 6px;font:400 24px/1.35 "Songti SC","Noto Serif SC",Georgia,serif}
.detail .meta{font:10px/1.8 ui-monospace,Consolas,monospace;color:var(--muted);letter-spacing:.04em}
.detail .meta b{color:var(--ink);font-weight:600}
.detail p.note{font-size:12px;line-height:1.9;color:#5b5548;margin:14px 0 18px}
.detail .actions{display:flex;gap:7px;margin-top:auto}
.detail .primary{flex:1;height:36px;border:0;border-radius:2px;background:var(--ink);color:var(--paper);font:11px/1 "Avenir Next","PingFang SC",sans-serif;letter-spacing:.08em;cursor:pointer}
.detail .primary:hover{background:var(--red)}
.detail .ghost{height:36px;padding:0 12px;border:1px solid var(--line);border-radius:2px;background:transparent;color:var(--muted);font-size:11px;cursor:pointer}
.detail .ghost:hover{border-color:var(--ink);color:var(--ink)}
.detail .empty{padding-top:26px;color:var(--muted);font-size:12px;line-height:1.9}
.detail .add{margin-top:12px;width:100%;height:36px;border:1px dashed #bcb29d;background:transparent;color:var(--muted);font-size:11px;cursor:pointer}
.detail .add:hover{border-color:var(--red);color:var(--red)}
.upnext{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.upnext h3{margin:0 0 8px;font:10px/1 ui-monospace,Consolas,monospace;letter-spacing:.18em;color:var(--muted)}
.upnext button{display:flex;width:100%;gap:8px;align-items:baseline;padding:5px 0;border:0;background:transparent;text-align:left;color:inherit;font-size:11px;cursor:pointer}
.upnext button:hover{color:var(--red)}
.upnext b{font:10px/1 ui-monospace,Consolas,monospace;color:var(--red);flex:none}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
@media(max-width:980px){
  .main{grid-template-columns:1fr}
  .detail{border-top:1px solid var(--line)}
  .left{border-right:0}
}
@media(max-width:700px){
  .top{padding:12px 16px;flex-wrap:wrap}
  .top nav,.search{display:none}
  .left{padding:16px}
  .head{flex-wrap:wrap}
  .head h1{font-size:38px}
  .grid{grid-auto-rows:minmax(74px,1fr)}
  .ev{font-size:9px}
  .detail{padding:18px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">历<small>ALMANAC</small></div>
  <nav aria-label="日历视图"><a href="#month" class="on">月</a><a href="#week">周</a><a href="#agenda">议程</a></nav>
  <div class="right"><span class="search"><i>⌕</i>搜索日程</span><span class="avatar">岸</span></div>
</header>

<main class="main">
  <section class="left">
    <div class="head">
      <h1 id="month-title">十月</h1><span class="year" id="year-label">2026</span>
      <div class="nav-arrows"><button type="button" id="prev" aria-label="上个月">←</button><button type="button" id="next" aria-label="下个月">→</button></div>
      <button class="today-btn" id="today" type="button">今天</button>
      <div class="stats"><span>本月 <b id="month-count">9</b> 场</span><span>·</span><span>3 个截止</span></div>
    </div>

    <div class="filters" role="group" aria-label="日程类型">
      <button type="button" data-type="all" aria-pressed="true">全部</button>
      <button type="button" data-type="work" aria-pressed="false">工作</button>
      <button type="button" data-type="personal" aria-pressed="false">个人</button>
      <button type="button" data-type="solar" aria-pressed="false">节气</button>
    </div>

    <div class="weekdays" aria-hidden="true"><span>周一</span><span>周二</span><span>周三</span><span>周四</span><span>周五</span><span>周六</span><span>周日</span></div>
    <div class="grid" id="grid" role="grid" aria-label="月历"></div>
  </section>

  <aside class="detail" aria-live="polite">
    <p class="kicker" id="detail-kicker">SELECTED / 10.17</p>
    <p class="date" id="detail-date">10 月 17 日</p>
    <p class="week" id="detail-week">周六 · 农历九月初七</p>
    <div class="rule"></div>
    <div id="detail-body"></div>
    <div class="upnext" id="upnext"><h3>接下来</h3></div>
  </aside>
</main>

<script>
const events = [
  { date: '2026-10-01', time: '09:30', title: '季度选题会', place: '三楼白板间', type: 'work', note: '带上 Q4 的六个候选题，控制在每人五分钟。' },
  { date: '2026-10-08', time: '14:00', title: '寒露 · 编辑部茶会', place: '天台', type: 'solar', note: '今年第一壶桂花乌龙。带一只自己的杯子来。' },
  { date: '2026-10-12', time: '10:00', title: '封面拍摄 · 雾中列车', place: '安福路 322 号', type: 'work', note: '摄影师阿岚，模特两人，备用胶片三卷。' },
  { date: '2026-10-15', time: '19:30', title: '和母亲通电话', place: '家', type: 'personal', note: '上次她说腰疼，记得问复查结果。' },
  { date: '2026-10-17', time: '21:00', title: '《雾中列车》试映', place: '暗房放映厅', type: 'personal', note: 'F 排 07 号。开场后不再放行，提前十五分钟到。' },
  { date: '2026-10-20', time: '11:00', title: '长稿二审', place: '线上', type: 'work', note: '重点看第二段的数据出处，别再用去年的口径。' },
  { date: '2026-10-23', time: '08:40', title: '霜降 · 去菜场', place: '乌鲁木齐中路', type: 'solar', note: '买白萝卜和柿子。摊主说今年柿子甜得早。' },
  { date: '2026-10-27', time: '15:00', title: '交年度订阅方案', place: '线上', type: 'work', note: '三档价格，附一页老读者访谈。' },
  { date: '2026-10-31', time: '20:00', title: '万圣夜 · 不开门', place: '家', type: 'personal', note: '煮一锅热红酒，把阳台的灯关掉。' }
];
const monthNames = ['一月', '二月', '三月', '四月', '五月', '六月', '七月', '八月', '九月', '十月', '十一月', '十二月'];
const weekNames = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
let view = new Date(2026, 9, 1);
let type = 'all';
let selectedDate = '2026-10-17';

function keyOf(date) {
  return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0') + '-' + String(date.getDate()).padStart(2, '0');
}
function eventsFor(key) {
  return events.filter(function (event) { return event.date === key && (type === 'all' || event.type === type); });
}

function renderCalendar() {
  const year = view.getFullYear();
  const month = view.getMonth();
  document.getElementById('month-title').textContent = monthNames[month];
  document.getElementById('year-label').textContent = String(year);
  const first = new Date(year, month, 1);
  const offset = (first.getDay() + 6) % 7;
  const start = new Date(year, month, 1 - offset);
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  let monthTotal = 0;
  for (let i = 0; i < 42; i += 1) {
    const date = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
    const key = keyOf(date);
    const isOut = date.getMonth() !== month;
    const cell = document.createElement('div');
    cell.className = 'cell' + (isOut ? ' out' : '') + (key === '2026-10-17' ? ' today' : '');
    cell.setAttribute('role', 'gridcell');
    cell.setAttribute('aria-label', key);
    cell.tabIndex = 0;
    const day = document.createElement('span');
    day.className = 'd';
    day.innerHTML = '<span>' + date.getDate() + '</span>' + (key === '2026-10-17' ? '<em>今天</em>' : '');
    cell.appendChild(day);
    const lunar = document.createElement('span');
    lunar.className = 'lunar';
    lunar.textContent = isOut ? '' : lunarLabel(date.getDate());
    cell.appendChild(lunar);
    const list = eventsFor(key);
    if (!isOut) monthTotal += list.length;
    list.slice(0, 2).forEach(function (event) {
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'ev ' + event.type;
      chip.textContent = event.time + ' ' + event.title;
      chip.addEventListener('click', function (clickEvent) {
        clickEvent.stopPropagation();
        selectDate(key);
        showEvent(event);
      });
      cell.appendChild(chip);
    });
    if (list.length > 2) {
      const more = document.createElement('span');
      more.className = 'more';
      more.textContent = '还有 ' + (list.length - 2) + ' 项';
      cell.appendChild(more);
    }
    cell.addEventListener('click', function () { selectDate(key); });
    cell.addEventListener('keydown', function (keyEvent) {
      if (keyEvent.key === 'Enter' || keyEvent.key === ' ') {
        keyEvent.preventDefault();
        selectDate(key);
      }
    });
    grid.appendChild(cell);
  }
  document.getElementById('month-count').textContent = String(monthTotal);
}

function lunarLabel(day) {
  const labels = { 1: '九月初一', 8: '寒露', 17: '九月初七', 23: '霜降', 31: '九月廿一' };
  return labels[day] || '';
}

function selectDate(key) {
  selectedDate = key;
  const parts = key.split('-');
  const date = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
  document.getElementById('detail-kicker').textContent = 'SELECTED / ' + parts[1] + '.' + parts[2];
  document.getElementById('detail-date').textContent = Number(parts[1]) + ' 月 ' + Number(parts[2]) + ' 日';
  document.getElementById('detail-week').textContent = weekNames[date.getDay()] + ' · ' + (lunarLabel(Number(parts[2])) || '宜读书');
  const list = events.filter(function (event) { return event.date === key; });
  const body = document.getElementById('detail-body');
  if (!list.length) {
    body.innerHTML = '<div class="empty">这天没有安排。适合把上周欠下的长稿读完，或者什么都不做。</div>' +
      '<button class="add" type="button" id="add-here">＋ 在这天加一件事</button>';
    document.getElementById('upnext').style.display = 'none';
    const add = document.getElementById('add-here');
    if (add) add.addEventListener('click', function () { add.textContent = '已打开新建日程（示意）'; });
    return;
  }
  document.getElementById('upnext').style.display = 'block';
  showEvent(list[0]);
}

function showEvent(event) {
  const body = document.getElementById('detail-body');
  const typeName = { work: '工作', personal: '个人', solar: '节气' }[event.type];
  body.innerHTML = '<h2></h2><p class="meta"><b>' + event.time + '</b> · ' + typeName + ' · ' + event.place + '</p>' +
    '<p class="note"></p><div class="actions"><button class="primary" type="button" id="join">加入我的日历</button>' +
    '<button class="ghost" type="button" id="close-detail">收起</button></div>';
  body.querySelector('h2').textContent = event.title;
  body.querySelector('.note').textContent = event.note;
  document.getElementById('join').addEventListener('click', function () {
    this.textContent = '已加入 · 提前 30 分钟提醒';
    this.disabled = true;
    this.style.opacity = '.65';
  });
  document.getElementById('close-detail').addEventListener('click', function () {
    body.innerHTML = '<div class="empty">从左侧挑一天，或点开一枚日程，看看那天的安排。</div>';
  });
  const upcoming = events.filter(function (item) { return item.date >= selectedDate && item.date !== event.date; }).slice(0, 3);
  const upnext = document.getElementById('upnext');
  upnext.style.display = 'block';
  upnext.innerHTML = '<h3>接下来</h3>' + upcoming.map(function (item) {
    return '<button type="button" data-key="' + item.date + '"><b>' + item.date.slice(5) + '</b><span>' + item.title + '</span></button>';
  }).join('');
  upnext.querySelectorAll('button').forEach(function (button) {
    button.addEventListener('click', function () {
      selectDate(button.dataset.key);
      const found = events.filter(function (item) { return item.date === button.dataset.key; });
      if (found.length) showEvent(found[0]);
    });
  });
}

document.querySelectorAll('.filters button').forEach(function (button) {
  button.addEventListener('click', function () {
    type = button.dataset.type;
    document.querySelectorAll('.filters button').forEach(function (item) { item.setAttribute('aria-pressed', String(item === button)); });
    renderCalendar();
    selectDate(selectedDate);
  });
});

document.getElementById('prev').addEventListener('click', function () {
  view = new Date(view.getFullYear(), view.getMonth() - 1, 1);
  renderCalendar();
  selectDate(keyOf(new Date(view.getFullYear(), view.getMonth(), 1)));
});
document.getElementById('next').addEventListener('click', function () {
  view = new Date(view.getFullYear(), view.getMonth() + 1, 1);
  renderCalendar();
  selectDate(keyOf(new Date(view.getFullYear(), view.getMonth(), 1)));
});
document.getElementById('today').addEventListener('click', function () {
  view = new Date(2026, 9, 1);
  renderCalendar();
  selectDate('2026-10-17');
});

renderCalendar();
selectDate('2026-10-17');
</script>
</body>
</html>
