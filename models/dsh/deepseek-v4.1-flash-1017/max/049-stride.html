<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>步 · 今日活动</title>
<style>
:root{
  --cream:#f4f1e8;--paper:#fffdf6;--ink:#1e2b26;--teal:#1f4d43;--lime:#b7d36b;
  --coral:#e07a5f;--line:#ddd8ca;--muted:#7f8a80;--red:#b4503c;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(700px 500px at 50% 0%,#e9e5d7 0%,transparent 60%),#cfcaba;display:grid;place-items:center;padding:26px;font:14px/1.5 "Avenir Next","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink)}
.phone{width:390px;height:844px;background:#26332d;border-radius:48px;padding:10px;box-shadow:0 40px 90px #26332d55;position:relative;flex:none}
.screen{width:100%;height:100%;background:var(--cream);border-radius:39px;overflow:hidden;position:relative;display:flex;flex-direction:column}
.notch{position:absolute;left:50%;top:8px;transform:translateX(-50%);width:110px;height:24px;background:#26332d;border-radius:14px;z-index:9}
.statusbar{height:42px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 22px 5px;font:600 10px/1 ui-monospace,Consolas,monospace;color:#8f958a}
.scroll{flex:1;overflow-y:auto;padding:4px 18px 40px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.top{display:flex;align-items:center;gap:10px;padding:4px 2px 12px}
.top h1{margin:0;font:400 24px/1.3 "Songti SC","Noto Serif SC",Georgia,serif}
.top .date{margin-left:auto;font:8.5px/1.5 ui-monospace,Consolas,monospace;color:var(--muted);letter-spacing:.06em}
.ring-card{display:flex;align-items:center;gap:18px;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px}
.ring{width:132px;height:132px;border-radius:50%;background:conic-gradient(var(--teal) 0 40%,#e7e2d5 40% 100%);display:grid;place-items:center;position:relative;flex:none}
.ring::before{content:"";position:absolute;inset:10px;border-radius:50%;background:var(--paper)}
.ring .inner{position:relative;text-align:center}
.ring .inner b{display:block;font:400 30px/1 "Songti SC",Georgia,serif}
.ring .inner span{display:block;font:8px/1.6 ui-monospace,Consolas,monospace;color:var(--muted);letter-spacing:.06em}
.ring-card .txt{flex:1}
.ring-card .txt p{margin:0 0 3px;font:8.5px/1.5 ui-monospace,Consolas,monospace;color:var(--muted);letter-spacing:.08em}
.ring-card .txt b{display:block;font:400 22px/1.3 "Songti SC",Georgia,serif}
.ring-card .txt span{display:block;margin-top:6px;font-size:10px;line-height:1.7;color:#6b736c}
.badges{display:flex;gap:8px;margin:10px 0 14px}
.badge{flex:1;background:var(--paper);border:1px solid var(--line);padding:9px 10px;border-radius:10px}
.badge span{font:7.5px/1.5 ui-monospace,Consolas,monospace;color:var(--muted);letter-spacing:.08em}
.badge b{display:block;font:400 18px/1.3 "Songti SC",Georgia,serif;margin-top:2px}
.badge em{font:7.5px/1.4 ui-monospace,Consolas,monospace;color:var(--teal);font-style:normal}
.form{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:13px 14px 14px}
.form h2{margin:0 0 9px;font:400 18px/1.3 "Songti SC",Georgia,serif;display:flex;align-items:baseline;gap:8px}
.form h2 span{font:8px/1 ui-monospace,Consolas,monospace;color:#a3a696;letter-spacing:.12em}
.types{display:flex;gap:6px;margin-bottom:10px}
.types button{height:30px;padding:0 10px;border:1px solid var(--line);border-radius:999px;background:transparent;color:#6b736c;font:9.5px/1 "Avenir Next","PingFang SC",sans-serif;cursor:pointer}
.types button[aria-pressed="true"]{border-color:var(--teal);background:var(--teal);color:var(--cream)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:9px}
.field label{font:8px/1 ui-monospace,Consolas,monospace;color:#95998c;letter-spacing:.1em}
.field input,.field select{height:34px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);font:11px/1 "Avenir Next","PingFang SC",sans-serif;padding:0 8px;outline:none}
.field input:focus,.field select:focus{border-color:var(--teal)}
.hint{font:7.5px/1.6 ui-monospace,Consolas,monospace;color:#a3a696;letter-spacing:.02em}
.save{width:100%;height:38px;border:0;border-radius:999px;background:var(--teal);color:var(--cream);font:600 11px/1 "Avenir Next","PingFang SC",sans-serif;letter-spacing:.1em;cursor:pointer;margin-top:4px}
.save:hover{background:#2b685a}
.error{margin:8px 0 0;padding:8px 10px;border-left:3px solid var(--red);background:#f8e6df;font-size:10px;line-height:1.7;color:#7d3a2a;display:none}
.error.on{display:block}
.trend{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:13px 14px 12px;margin-top:12px}
.trend .head{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.trend h2{margin:0;font:400 17px/1.3 "Songti SC",Georgia,serif}
.trend span{margin-left:auto;font:8px/1.5 ui-monospace,Consolas,monospace;color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:6px;height:96px;padding-top:8px;border-top:1px dashed #ddd6c5}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:100%}
.bar i{display:block;width:100%;background:#d8d3c4;border-radius:2px 2px 0 0;min-height:4px;transition:height .2s}
.bar.today i{background:var(--teal)}
.bar b{font:7px/1.2 ui-monospace,Consolas,monospace;color:#a3a696;font-weight:400}
.toast{position:absolute;left:50%;bottom:24px;transform:translateX(-50%) translateY(8px);background:var(--ink);color:var(--cream);padding:8px 14px;border-radius:999px;font-size:10px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;white-space:nowrap;z-index:8}
.toast.show{opacity:1;transform:translateX(-50%)}
@media(min-width:441px) and (max-height:900px){.phone{zoom:.86}}
@media(max-width:440px){
  body{padding:0;display:block;background:var(--cream)}
  .phone{width:100%;height:100svh;border-radius:0;padding:0;box-shadow:none;background:var(--cream)}
  .screen{border-radius:0;height:100svh}
  .notch{display:none}
  .statusbar{height:20px;padding:8px 18px 0}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="phone">
  <div class="notch" aria-hidden="true"></div>
  <div class="screen">
    <div class="statusbar"><span>18:40</span><span>——</span></div>
    <div class="scroll">
      <div class="top"><h1>今天动了多少</h1><span class="date">10 月 17 日 · 周五</span></div>

      <div class="ring-card"><div class="ring" id="ring"><div class="inner"><b id="done">60</b><span>/ 300 分钟</span></div></div><div class="txt"><p>WEEKLY GOAL / 150 MIN</p><b id="ring-copy">还差 90 分钟</b><span>本周已活动 6 天。今晚走一段，或者做一组拉伸都算。</span></div></div>
      <div class="badges"><div class="badge"><span>今日步数</span><b id="steps">6,240</b><em id="steps-note">比昨天多 820</em></div><div class="badge"><span>消耗</span><b id="kcal">248</b><em>千卡 · 估算</em></div></div>

      <section class="form">
        <h2>记录一次活动 <span>LOG ACTIVITY</span></h2>
        <div class="types" role="group" aria-label="活动类型"><button type="button" aria-pressed="true" data-type="快走">快走</button><button type="button" aria-pressed="false" data-type="跑步">跑步</button><button type="button" aria-pressed="false" data-type="骑行">骑行</button><button type="button" aria-pressed="false" data-type="拉伸">拉伸</button></div>
        <div class="row"><div class="field"><label for="minutes">时长（分钟）</label><input id="minutes" type="number" min="1" max="300" placeholder="例如：30"></div><div class="field"><label for="intensity">强度</label><select id="intensity"><option>轻松</option><option selected>适中</option><option>偏高</option></select></div></div>
        <p class="hint">单次时长需在 1–300 分钟之间。超过 300 分钟请拆成两次记录。</p>
        <p class="error" id="error" role="alert"></p>
        <button class="save" id="save" type="button">保存这次活动</button>
      </section>

      <section class="trend"><div class="head"><h2>最近七天</h2><span>MINUTES / DAY</span></div><div class="bars" id="bars"></div></section>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>
</div>

<script>
const goal = 300;
let total = 150;
let today = 45;
let steps = 6240;
let kcal = 248;
let type = '快走';
const week = [20, 0, 15, 25, 30, 15, today];

function render() {
  const percent = Math.min(100, Math.round(total / goal * 100));
  document.getElementById('ring').style.background = 'conic-gradient(var(--teal) 0 ' + percent + '%, #e7e2d5 ' + percent + '% 100%)';
  document.getElementById('done').textContent = String(total);
  document.getElementById('ring-copy').textContent = total >= goal ? '本周目标已完成' : '还差 ' + (goal - total) + ' 分钟';
  document.getElementById('steps').textContent = steps.toLocaleString('en-US');
  document.getElementById('kcal').textContent = String(kcal);
  document.getElementById('steps-note').textContent = '比昨天多 820';
  const bars = document.getElementById('bars');
  const max = Math.max.apply(null, week.concat([60]));
  bars.innerHTML = week.map(function (value, index) {
    const height = Math.max(4, Math.round(value / max * 100));
    return '<div class="bar' + (index === 6 ? ' today' : '') + '"><i style="height:' + height + '%"></i><b>' + ['六', '日', '一', '二', '三', '四', '五'][index] + '</b></div>';
  }).join('');
}

document.querySelectorAll('.types button').forEach(function (button) {
  button.addEventListener('click', function () {
    type = button.dataset.type;
    document.querySelectorAll('.types button').forEach(function (item) { item.setAttribute('aria-pressed', String(item === button)); });
  });
});

document.getElementById('save').addEventListener('click', function () {
  const input = document.getElementById('minutes');
  const error = document.getElementById('error');
  const value = Number(input.value);
  if (!input.value.trim() || !Number.isFinite(value) || value < 1 || value > 300) {
    error.textContent = '这个时长不在合理范围内：单次活动应在 1–300 分钟之间。目标进度没有任何变化，请修改后再保存。';
    error.classList.add('on');
    input.focus();
    return;
  }
  error.classList.remove('on');
  total += value;
  today += value;
  week[6] = today;
  steps += Math.round(value * 95);
  kcal += Math.round(value * (type === '跑步' ? 9 : type === '骑行' ? 7 : type === '拉伸' ? 2 : 5));
  render();
  const button = document.getElementById('save');
  button.textContent = '已记录 · +' + value + ' 分钟';
  button.disabled = true;
  showToast('已保存。目标进度与趋势都更新了。');
  setTimeout(function () {
    button.textContent = '保存这次活动';
    button.disabled = false;
  }, 1400);
  input.value = '';
});

function showToast(text) {
  const el = document.getElementById('toast');
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(function () { el.classList.remove('show'); }, 2200);
}

render();
</script>
</body>
</html>
