<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>晴窗 · 注册</title>
<style>
:root{
  --cream:#f6efe3;--paper:#fffaf1;--ink:#2a2119;--clay:#c4552d;--clay-deep:#a33f1e;
  --olive:#6b7a4f;--sand:#e8dcc8;--muted:#7d6f5f;--good:#3f6b4a;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:32px;background:
  radial-gradient(900px 500px at 12% 0%,#fbf5e9 0%,transparent 60%),
  radial-gradient(700px 500px at 100% 100%,#efe2cd 0%,transparent 55%),var(--cream);
  color:var(--ink);font:15px/1.65 "Avenir Next","PingFang SC","Microsoft YaHei",sans-serif}
.room{display:grid;grid-template-columns:1.04fr .96fr;width:min(1180px,100%);min-height:min(760px,calc(100vh - 64px));background:var(--paper);border:1px solid #e0d3bf;border-radius:28px;overflow:hidden;box-shadow:0 30px 80px #6b4a2f1f}
.art{position:relative;padding:42px 48px;background:var(--clay);color:#fff6e8;overflow:hidden;display:flex;flex-direction:column}
.brand{display:flex;align-items:baseline;gap:10px;font:600 15px/1 "Songti SC","Noto Serif SC",Georgia,serif;letter-spacing:.14em;position:relative;z-index:3}
.brand span{font:600 10px/1 ui-monospace,Consolas,monospace;letter-spacing:.3em;opacity:.72}
.sun{position:absolute;right:-90px;top:-110px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle at 42% 42%,#ffd9a0 0%,#f2a65a 38%,#e07b3c 66%,#c4552d 100%);box-shadow:0 0 0 26px #ffffff0d,0 0 0 54px #ffffff08;z-index:1}
.window{position:absolute;right:-24px;bottom:92px;width:330px;height:300px;border:10px solid #8f3a1d;border-radius:8px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:10px;transform:rotate(-3deg);box-shadow:20px 24px 60px #6d2a1255;z-index:2}
.window i{border:2px solid #8f3a1d;background:linear-gradient(160deg,#ffd39b,#f19d56 55%,#d86a35);opacity:.9}
.window i:nth-child(2){background:linear-gradient(200deg,#ffe3b8,#f6b06a)}
.window i:nth-child(3){background:linear-gradient(20deg,#f3a25b,#b9471f)}
.window i:nth-child(4){background:linear-gradient(140deg,#ffcf8f,#e88a45)}
.art-copy{position:relative;z-index:3;margin-top:auto;max-width:420px}
.art-copy .kicker{font:600 11px/1 ui-monospace,Consolas,monospace;letter-spacing:.26em;opacity:.72}
.art-copy h1{margin:18px 0 16px;font:400 48px/1.22 "Songti SC","Noto Serif SC",Georgia,serif;letter-spacing:.01em}
.art-copy h1 em{font-style:normal;color:#ffd9a0;border-bottom:2px solid #ffd9a0aa;padding-bottom:2px}
.art-copy p{margin:0;max-width:330px;font-size:14px;line-height:1.9;color:#ffe9d6cc}
.art-stats{display:flex;gap:30px;margin-top:34px;padding-top:18px;border-top:1px solid #ffffff33;font:12px/1.5 ui-monospace,Consolas,monospace;letter-spacing:.06em;color:#ffe9d6b3}
.art-stats b{display:block;font:400 22px/1.2 "Songti SC",Georgia,serif;color:#fff6e8;letter-spacing:0}

.form-side{display:flex;flex-direction:column;padding:44px 54px 32px;background:var(--paper)}
.form-inner{width:min(380px,100%);margin:auto}
.kicker{margin:0 0 12px;font:600 10px/1 ui-monospace,Consolas,monospace;letter-spacing:.28em;color:var(--clay)}
h2{margin:0;font:400 34px/1.25 "Songti SC","Noto Serif SC",Georgia,serif}
.lede{margin:9px 0 26px;color:var(--muted);font-size:13px;line-height:1.8}
.field{margin-bottom:15px}
.field label{display:block;margin-bottom:7px;font-size:12px;font-weight:600;letter-spacing:.04em;color:#5c4f42}
.field label i{font-style:normal;color:var(--clay)}
input{width:100%;height:46px;padding:0 14px;border:1px solid #d9c8b0;border-radius:10px;background:#fffdf8;color:var(--ink);font:15px/1 "Avenir Next","PingFang SC",sans-serif;outline:none;transition:border-color .16s,box-shadow .16s}
input:hover{border-color:#c2a98b}
input:focus{border-color:var(--clay);box-shadow:0 0 0 3px #c4552d1f}
input::placeholder{color:#a99884}
.strength{display:flex;align-items:center;gap:10px;margin:8px 0 2px;color:#9a8a77;font:11px/1 ui-monospace,Consolas,monospace;letter-spacing:.05em}
.bars{display:flex;gap:4px;flex:1}
.bars i{height:4px;flex:1;border-radius:2px;background:#e7d9c5;transition:background .2s}
.strength[data-level="1"] .bars i:nth-child(1){background:#c4552d}
.strength[data-level="2"] .bars i:nth-child(-n+2){background:#d08b3e}
.strength[data-level="3"] .bars i{background:var(--good)}
.strength[data-level="1"] .word{color:#a33f1e}
.strength[data-level="3"] .word{color:var(--good)}
.agree{display:flex;gap:10px;align-items:flex-start;margin:16px 0 18px;font-size:12px;line-height:1.7;color:var(--muted)}
.agree input{width:17px;height:17px;margin-top:3px;accent-color:var(--clay);flex:none}
.agree a{color:var(--clay);text-decoration:none;border-bottom:1px solid #c4552d66}
.error{margin:0 0 12px;color:#a33f1e;font-size:12px}
.primary{width:100%;height:50px;border:0;border-radius:999px;background:var(--clay);color:#fff8ee;font:600 15px/1 "Avenir Next","PingFang SC",sans-serif;letter-spacing:.08em;cursor:pointer;transition:background .16s,transform .16s}
.primary:hover{background:var(--clay-deep)}
.primary:active{transform:translateY(1px)}
.primary:disabled{opacity:.65;cursor:wait}
.switch{margin:22px 0 0;text-align:center;font-size:13px;color:var(--muted)}
.switch a{color:var(--ink);font-weight:600;text-decoration:none;border-bottom:1px solid #2a211955}
.done{padding:28px;border:1px solid #d9c8b0;border-radius:18px;background:#fffdf8;text-align:left}
.done .tick{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:#e7efdf;color:var(--good);font-size:20px;margin-bottom:16px}
.done h3{margin:0 0 8px;font:400 26px/1.3 "Songti SC",Georgia,serif}
.done p{margin:0 0 18px;color:var(--muted);font-size:13px;line-height:1.8;word-break:break-all}
.ghost{height:44px;padding:0 18px;border:1px solid #cdb99f;border-radius:999px;background:transparent;color:var(--ink);font:14px/1 "Avenir Next","PingFang SC",sans-serif;cursor:pointer}
.ghost:hover{background:#f3e8d8}
.legal{margin-top:auto;padding-top:18px;font-size:10px;line-height:1.7;color:#a99884;letter-spacing:.02em}
@media(max-width:980px){
  body{padding:18px}
  .room{grid-template-columns:1fr;min-height:0}
  .art{min-height:330px;padding:32px}
  .sun{width:280px;height:280px;right:-80px;top:-90px}
  .window{width:230px;height:210px;right:-40px;bottom:20px;opacity:.7}
  .art-copy h1{font-size:36px;margin-top:60px}
  .art-copy p{max-width:280px}
  .form-side{padding:32px 24px 24px}
}
@media(max-width:520px){
  .art{padding:24px;min-height:300px}
  .art-copy h1{font-size:30px}
  .art-stats{gap:18px}
  .form-side{padding:26px 18px 18px}
}
:focus-visible{outline:2px solid var(--clay);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main class="room">
  <section class="art" aria-label="晴窗品牌">
    <div class="brand">晴窗 <span>SUNROOM</span></div>
    <div class="sun" aria-hidden="true"></div>
    <div class="window" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <div class="art-copy">
      <p class="kicker">SLOW LIVING / SINCE 2021</p>
      <h1>让日子<br>搬到<em>有光</em>的地方。</h1>
      <p>记录窗台的日照、植物的新叶和一顿慢早餐。晴窗不催你，只替你把好天气留下来。</p>
      <div class="art-stats">
        <div><b>68,204</b>扇窗在记录</div>
        <div><b>1.7M</b>个有光瞬间</div>
      </div>
    </div>
  </section>

  <section class="form-side">
    <div class="form-inner">
      <p class="kicker">NEW ACCOUNT · 01</p>
      <h2>开一扇自己的窗</h2>
      <p class="lede">不到一分钟。先留一个名字，剩下的等阳光好的时候再慢慢填。</p>

      <form id="signup-form" novalidate>
        <div class="field">
          <label for="name">怎么称呼你 <i>*</i></label>
          <input id="name" name="name" type="text" autocomplete="nickname" placeholder="例如：阿岚">
        </div>
        <div class="field">
          <label for="email">邮箱 <i>*</i></label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com">
        </div>
        <div class="field">
          <label for="password">密码 <i>*</i></label>
          <input id="password" name="password" type="password" autocomplete="new-password" placeholder="至少 8 位，建议带数字">
          <div class="strength" id="strength" data-level="0" aria-live="polite">
            <span class="bars" aria-hidden="true"><i></i><i></i><i></i></span>
            <span class="word" id="strength-word">还没开始</span>
          </div>
        </div>
        <label class="agree" for="agree">
          <input id="agree" type="checkbox">
          <span>我愿意收到每季一封《晴窗来信》，并已读过 <a href="#terms">使用约定</a> 与 <a href="#privacy">隐私说明</a>。</span>
        </label>
        <p class="error" id="error" role="alert" hidden></p>
        <button class="primary" id="submit" type="submit">建好这扇窗</button>
      </form>

      <div class="done" id="done" hidden>
        <div class="tick" aria-hidden="true">✓</div>
        <h3>窗已经开好了</h3>
        <p>欢迎你，<strong id="who">—</strong>。确认信已发往你的邮箱，点开就能开始布置第一扇窗。</p>
        <button class="ghost" id="restart" type="button">再建一扇</button>
      </div>

      <p class="switch">已经有窗了？<a href="#signin">直接去登录</a></p>
    </div>
    <p class="legal">晴窗工作室 · 杭州 / 不使用你的照片训练模型 / 随时可导出或删除全部记录</p>
  </section>
</main>

<script>
const form = document.getElementById('signup-form');
const nameEl = document.getElementById('name');
const emailEl = document.getElementById('email');
const passEl = document.getElementById('password');
const agreeEl = document.getElementById('agree');
const errorEl = document.getElementById('error');
const strength = document.getElementById('strength');
const strengthWord = document.getElementById('strength-word');
const done = document.getElementById('done');
const button = document.getElementById('submit');

function score(value) {
  let points = 0;
  if (value.length >= 8) points += 1;
  if (/[0-9]/.test(value)) points += 1;
  if (/[^A-Za-z0-9]/.test(value) || value.length >= 12) points += 1;
  if (value.length === 0) return 0;
  return Math.max(1, points);
}

passEl.addEventListener('input', function () {
  const level = score(passEl.value);
  strength.dataset.level = String(level);
  strengthWord.textContent = ['还没开始', '偏弱', '够用了', '很稳'][level];
});

form.addEventListener('submit', function (event) {
  event.preventDefault();
  errorEl.hidden = true;
  if (!nameEl.value.trim()) {
    errorEl.textContent = '先留一个称呼吧，哪怕只是昵称。';
    errorEl.hidden = false;
    nameEl.focus();
    return;
  }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailEl.value.trim())) {
    errorEl.textContent = '这个邮箱看起来还差一点，请检查 @ 和域名。';
    errorEl.hidden = false;
    emailEl.focus();
    return;
  }
  if (passEl.value.length < 8) {
    errorEl.textContent = '密码至少 8 位，太短容易被风吹开。';
    errorEl.hidden = false;
    passEl.focus();
    return;
  }
  if (!agreeEl.checked) {
    errorEl.textContent = '请先勾选同意使用约定与隐私说明。';
    errorEl.hidden = false;
    agreeEl.focus();
    return;
  }
  button.disabled = true;
  button.textContent = '正在擦亮窗玻璃…';
  setTimeout(function () {
    document.getElementById('who').textContent = nameEl.value.trim();
    form.hidden = true;
    done.hidden = false;
    document.getElementById('restart').focus();
  }, 850);
});

document.getElementById('restart').addEventListener('click', function () {
  form.reset();
  form.hidden = false;
  done.hidden = true;
  button.disabled = false;
  button.textContent = '建好这扇窗';
  strength.dataset.level = '0';
  strengthWord.textContent = '还没开始';
  nameEl.focus();
});
</script>
</body>
</html>
