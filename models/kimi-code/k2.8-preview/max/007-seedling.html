<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>青芽空间 · 欢迎</title>
<style>
  :root{
    --page:#f5faf2;
    --surface:#ffffff;
    --text:#1e3d2a;
    --muted:#5f7d68;
    --accent:#3c9a4e;
    --accent-dark:#2b7a3c;
    --soft:#d9eed6;
    --line:#e2eee0;
    --warn:#b5791f;
    --radius-ctl:10px;
    --radius-card:20px;
    --shadow-card:0 8px 32px rgba(46,90,58,.10);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:var(--page);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    width:1120px;
    max-width:calc(100% - 96px);
    display:grid;
    grid-template-columns:520px 1fr;
    gap:96px;
    align-items:center;
  }
  /* —— 左侧文字区 —— */
  .intro{animation:rise .6s ease-out both;}
  .eyebrow{
    font-size:13px;
    letter-spacing:.18em;
    color:var(--accent-dark);
    font-weight:600;
    margin-bottom:20px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .eyebrow::before{
    content:"";
    width:26px;height:2px;
    background:var(--accent);
    display:inline-block;
  }
  h1{
    font-size:40px;
    line-height:1.25;
    font-weight:700;
    letter-spacing:.01em;
    margin-bottom:18px;
  }
  .desc{
    font-size:16px;
    line-height:1.9;
    color:var(--muted);
    max-width:46ch;
    margin-bottom:40px;
  }
  .actions{display:flex;align-items:center;gap:20px;flex-wrap:wrap;}
  .btn-primary{
    appearance:none;
    border:none;
    cursor:pointer;
    background:var(--accent);
    color:#fff;
    font-size:16px;
    font-weight:600;
    padding:14px 32px;
    border-radius:var(--radius-ctl);
    letter-spacing:.02em;
    transition:background .18s ease,transform .18s ease,box-shadow .18s ease;
    box-shadow:0 4px 14px rgba(60,154,78,.28);
  }
  .btn-primary:hover{background:var(--accent-dark);transform:translateY(-1px);box-shadow:0 6px 18px rgba(60,154,78,.34);}
  .btn-primary:active{transform:translateY(0);}
  .btn-primary:focus-visible{outline:3px solid var(--soft);outline-offset:2px;}
  .btn-primary.done{background:var(--accent-dark);}
  .btn-ghost{
    appearance:none;
    background:transparent;
    border:1px solid var(--line);
    cursor:pointer;
    color:var(--text);
    font-size:15px;
    padding:13px 24px;
    border-radius:var(--radius-ctl);
    transition:border-color .18s ease,background .18s ease;
  }
  .btn-ghost:hover{border-color:var(--accent);background:rgba(60,154,78,.06);}
  .btn-ghost:focus-visible{outline:3px solid var(--soft);outline-offset:2px;}
  .btn-ghost[aria-expanded="true"]{border-color:var(--accent);background:rgba(60,154,78,.08);}
  /* —— 成长进度 —— */
  .growth{
    margin-top:44px;
    display:flex;
    align-items:center;
    gap:14px;
    font-size:14px;
    color:var(--muted);
    opacity:.55;
    transition:opacity .3s ease;
  }
  .growth.on{opacity:1;}
  .growth-track{
    width:160px;height:6px;
    background:var(--soft);
    border-radius:999px;
    overflow:hidden;
  }
  .growth-bar{
    width:0;height:100%;
    background:var(--accent);
    border-radius:999px;
    transition:width .8s cubic-bezier(.22,.9,.3,1);
  }
  /* —— 导入面板 —— */
  .import-panel{
    margin-top:20px;
    max-height:0;
    overflow:hidden;
    transition:max-height .35s ease;
  }
  .import-panel.open{max-height:220px;}
  .import-inner{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius-card);
    padding:20px 22px;
    box-shadow:var(--shadow-card);
  }
  .import-inner p{font-size:13px;color:var(--muted);margin-bottom:12px;}
  .import-opts{display:flex;flex-direction:column;gap:8px;}
  .import-opt{
    text-align:left;
    background:transparent;
    border:1px solid var(--line);
    border-radius:var(--radius-ctl);
    padding:10px 14px;
    font-size:14px;
    color:var(--text);
    cursor:pointer;
    display:flex;
    justify-content:space-between;
    align-items:center;
    transition:border-color .15s ease,background .15s ease;
  }
  .import-opt small{color:var(--muted);font-size:12px;}
  .import-opt:hover{border-color:var(--accent);}
  .import-opt:focus-visible{outline:3px solid var(--soft);outline-offset:2px;}
  .import-opt.selected{border-color:var(--accent);background:rgba(60,154,78,.08);}
  .import-opt.selected::after{
    content:"✓";
    color:var(--accent-dark);
    font-weight:700;
  }
  /* —— 右侧插画卡片 —— */
  .art{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius-card);
    box-shadow:var(--shadow-card);
    padding:64px 48px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:28px;
    animation:rise .6s .12s ease-out both;
  }
  .sprout-box{width:220px;height:220px;}
  .sprout-box svg{width:100%;height:100%;display:block;}
  .leaf-extra{opacity:0;transform-origin:110px 150px;transition:opacity .5s ease .3s,transform .6s cubic-bezier(.22,.9,.3,1) .3s;transform:scale(.4);}
  .grown .leaf-extra{opacity:1;transform:scale(1);}
  .soil{transition:fill .5s ease;}
  .grown .soil{fill:var(--accent-dark);}
  .art-cap{font-size:14px;color:var(--muted);line-height:1.8;text-align:center;max-width:30ch;}
  .art-cap strong{color:var(--text);font-weight:600;}
  @keyframes rise{
    from{opacity:0;transform:translateY(16px);}
    to{opacity:1;transform:translateY(0);}
  }
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation:none !important;transition-duration:.01ms !important;}
    .growth-bar{transition:none;}
  }
  @media (max-width: 768px){
    .wrap{grid-template-columns:1fr;gap:44px;max-width:calc(100% - 48px);}
    h1{font-size:30px;}
    .art{padding:40px 28px;}
    .sprout-box{width:160px;height:160px;}
    .import-panel.open{max-height:320px;}
  }
</style>
</head>
<body>
  <main class="wrap">
    <section class="intro" aria-labelledby="page-title">
      <div class="eyebrow">青芽空间 · 新起点</div>
      <h1 id="page-title">欢迎，这里还空空如也</h1>
      <p class="desc">你刚刚来到青芽空间，还没有属于自己的作品。别紧张——每个充实的主页都始于一次点击。先种下第一颗种子，它会替你记住成长的过程。</p>
      <div class="actions">
        <button class="btn-primary" id="seedBtn" type="button">种下第一颗种子</button>
        <button class="btn-ghost" id="importBtn" type="button" aria-expanded="false" aria-controls="importPanel">导入已有作品</button>
      </div>
      <div class="growth" id="growthRow" aria-live="polite">
        <span class="growth-track"><span class="growth-bar" id="growthBar"></span></span>
        <span id="growthText">成长值 0 / 3</span>
      </div>
      <div class="import-panel" id="importPanel">
        <div class="import-inner">
          <p>选择一个来源，我们会把内容整理成你的第一批作品：</p>
          <div class="import-opts" role="group" aria-label="导入选项">
            <button class="import-opt" type="button">从本地文档导入 <small>.md / .docx</small></button>
            <button class="import-opt" type="button">从剪贴板粘贴 <small>自动识别结构</small></button>
          </div>
        </div>
      </div>
    </section>
    <aside class="art" id="artCard" aria-label="小苗插画">
      <div class="sprout-box">
        <svg viewBox="0 0 220 220" role="img" aria-label="一株嫩绿的小苗从土壤中长出">
          <ellipse cx="110" cy="196" rx="70" ry="10" fill="#eef7ea"/>
          <path class="soil" d="M60 196 q50 -14 100 0 l0 10 l-100 0 z" fill="#6b4f3a"/>
          <path d="M110 196 C110 168 108 150 110 132" stroke="#3c9a4e" stroke-width="5" fill="none" stroke-linecap="round"/>
          <path d="M110 150 C92 146 78 132 76 112 C96 114 110 128 110 150 Z" fill="#5cb86c"/>
          <path d="M110 132 C128 128 142 114 144 94 C124 96 110 110 110 132 Z" fill="#3c9a4e"/>
          <g class="leaf-extra">
            <path d="M110 118 C98 112 90 100 90 84 C104 88 112 100 110 118 Z" fill="#7cc98a"/>
            <circle cx="150" cy="70" r="3" fill="#b9dfc0"/>
            <circle cx="66" cy="60" r="2.4" fill="#b9dfc0"/>
          </g>
          <circle cx="110" cy="132" r="4" fill="#2b7a3c"/>
        </svg>
      </div>
      <p class="art-cap"><strong>小苗刚刚破土</strong><br>每完成一次记录，它就长高一点。</p>
    </aside>
  </main>
  <script>
    (function(){
      var step = 0, max = 3;
      var seedBtn = document.getElementById('seedBtn');
      var growthRow = document.getElementById('growthRow');
      var growthBar = document.getElementById('growthBar');
      var growthText = document.getElementById('growthText');
      var artCard = document.getElementById('artCard');
      var importBtn = document.getElementById('importBtn');
      var importPanel = document.getElementById('importPanel');
      var opts = importPanel.querySelectorAll('.import-opt');

      seedBtn.addEventListener('click', function(){
        if (step >= max) { step = 0; seedBtn.classList.remove('done'); artCard.classList.remove('grown'); }
        else { step += 1; if (step === max) seedBtn.classList.add('done'); if (step >= 2) artCard.classList.add('grown'); }
        growthRow.classList.add('on');
        growthBar.style.width = (step / max * 100) + '%';
        growthText.textContent = step >= max ? '成长值 3 / 3 · 种子发芽了' : '成长值 ' + step + ' / ' + max;
        seedBtn.textContent = step >= max ? '重新开始' : (step === 0 ? '种下第一颗种子' : '继续浇水');
      });

      importBtn.addEventListener('click', function(){
        var open = importPanel.classList.toggle('open');
        importBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
      });

      opts.forEach(function(o){
        o.addEventListener('click', function(){
          opts.forEach(function(x){ x.classList.remove('selected'); });
          o.classList.add('selected');
        });
      });
    })();
  </script>
</body>
</html>
