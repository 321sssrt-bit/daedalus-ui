<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>麦屿烘焙屋 · 购物篮</title>
<style>
:root {
  --cream: #FAF1E0;
  --cream-deep: #F3E4C8;
  --card: #FFFDF8;
  --crust: #B45A1B;
  --toast: #E8893B;
  --toast-deep: #D2712A;
  --jam: #C13A24;
  --cocoa: #4A2E1A;
  --latte: #96755A;
  --line: #EBD9BC;
  --shadow-soft: 0 6px 18px rgba(180, 90, 27, .10);
  --shadow-lift: 0 12px 28px rgba(180, 90, 27, .18);
  --radius-card: 18px;
  --radius-panel: 22px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
  background: var(--cream);
  color: var(--cocoa);
  min-height: 100vh;
  line-height: 1.5;
}

.bg-glow {
  position: fixed;
  top: -160px;
  right: -120px;
  width: 480px;
  height: 480px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(232, 137, 59, .16), rgba(232, 137, 59, 0) 68%);
  pointer-events: none;
  z-index: 0;
}

.bakery-header {
  position: relative;
  z-index: 1;
  background: var(--cream);
  border-bottom: 1px solid var(--line);
}

.header-inner {
  max-width: 1120px;
  margin: 0 auto;
  padding: 20px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  flex-wrap: wrap;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand-mark {
  width: 44px;
  height: 44px;
  border-radius: 14px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: var(--shadow-soft);
}

.brand-text { display: flex; flex-direction: column; gap: 1px; }

.brand-text strong {
  font-size: 21px;
  font-weight: 800;
  letter-spacing: .04em;
}

.brand-text span {
  font-size: 12px;
  color: var(--latte);
  letter-spacing: .12em;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 18px;
}

.ghost-link {
  font-size: 14px;
  color: var(--crust);
  text-decoration: none;
  border-bottom: 1px dashed var(--toast);
  padding-bottom: 1px;
  cursor: pointer;
}

.ghost-link:hover { color: var(--toast-deep); border-bottom-style: solid; }

.basket-badge {
  font-size: 13px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 7px 14px;
  color: var(--latte);
  box-shadow: var(--shadow-soft);
}

.basket-badge b { color: var(--crust); font-weight: 800; }

.cart-main {
  position: relative;
  z-index: 1;
  max-width: 1120px;
  margin: 0 auto;
  padding: 32px 24px 64px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 340px;
  gap: 32px;
  align-items: start;
}

.list-head { margin-bottom: 18px; }

.list-head h1 {
  font-size: 26px;
  font-weight: 800;
  letter-spacing: .02em;
  display: flex;
  align-items: center;
  gap: 12px;
}

.count-pill {
  font-size: 13px;
  font-weight: 700;
  color: var(--crust);
  background: var(--cream-deep);
  border-radius: 999px;
  padding: 4px 12px;
  letter-spacing: .06em;
}

.list-hint {
  margin-top: 6px;
  font-size: 13px;
  color: var(--latte);
}

.cart-items {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.item {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius-card);
  box-shadow: var(--shadow-soft);
  padding: 18px 20px;
  animation: itemIn .4s ease both;
  transition: box-shadow .2s ease, transform .2s ease;
}

.item:hover { box-shadow: var(--shadow-lift); transform: translateY(-2px); }

.item-grid {
  display: grid;
  grid-template-columns: 88px minmax(0, 1fr) auto;
  gap: 18px;
  align-items: center;
}

.item-art {
  width: 88px;
  height: 88px;
  border-radius: 16px;
  background: var(--cream-deep);
  display: flex;
  align-items: center;
  justify-content: center;
}

.item-info { min-width: 0; }

.item-name-row {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.item-name {
  font-size: 17px;
  font-weight: 700;
}

.item-tag {
  font-size: 11px;
  font-weight: 700;
  color: var(--card);
  background: var(--toast);
  border-radius: 999px;
  padding: 2px 8px;
  letter-spacing: .05em;
}

.item-spec {
  font-size: 13px;
  color: var(--latte);
  margin-top: 3px;
}

.item-unit {
  font-size: 13px;
  color: var(--cocoa);
  margin-top: 8px;
}

.item-side {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 10px;
}

.item-total {
  font-size: 20px;
  font-weight: 800;
  color: var(--crust);
}

.stepper {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: var(--cream-deep);
  border-radius: 999px;
  padding: 4px;
}

.stepper button {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: none;
  background: var(--card);
  color: var(--crust);
  font-size: 17px;
  font-weight: 700;
  line-height: 1;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 1px 3px rgba(180, 90, 27, .18);
  transition: background .15s ease, color .15s ease, transform .1s ease;
}

.stepper button:hover:not(:disabled) { background: var(--toast); color: #FFFDF8; }

.stepper button:active:not(:disabled) { transform: scale(.92); }

.stepper button:disabled {
  background: var(--cream-deep);
  color: #C9AE8D;
  box-shadow: none;
  cursor: not-allowed;
}

.qty {
  min-width: 30px;
  text-align: center;
  font-size: 15px;
  font-weight: 800;
  color: var(--cocoa);
}

.qty.bump { animation: bump .25s ease; }

.remove-link {
  font-size: 13px;
  color: var(--jam);
  background: none;
  border: none;
  border-bottom: 1px dashed rgba(193, 58, 36, .5);
  padding: 0 0 1px;
  cursor: pointer;
}

.remove-link:hover { border-bottom-style: solid; }

.item-confirm {
  display: none;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
}

.item.is-confirming .item-grid { display: none; }

.item.is-confirming .item-confirm { display: flex; }

.item-confirm p { font-size: 14px; font-weight: 600; }

.confirm-actions { display: flex; gap: 10px; }

.btn {
  font-size: 14px;
  font-weight: 700;
  border-radius: 12px;
  padding: 9px 18px;
  cursor: pointer;
  border: none;
  transition: filter .15s ease, transform .1s ease, background .15s ease;
}

.btn:active { transform: scale(.97); }

.btn-ghost {
  background: var(--cream-deep);
  color: var(--cocoa);
}

.btn-ghost:hover { background: var(--line); }

.btn-jam {
  background: var(--jam);
  color: #FFFDF8;
}

.btn-jam:hover { filter: brightness(1.08); }

.cart-empty {
  background: var(--card);
  border: 1px dashed var(--line);
  border-radius: var(--radius-card);
  padding: 48px 24px;
  text-align: center;
}

.cart-empty h2 { font-size: 19px; font-weight: 800; margin-top: 14px; }

.cart-empty p { font-size: 13px; color: var(--latte); margin-top: 6px; }

.btn-primary {
  margin-top: 18px;
  background: linear-gradient(135deg, var(--toast), var(--crust));
  color: #FFFDF8;
  font-size: 15px;
  padding: 12px 26px;
  border-radius: 14px;
}

.btn-primary:hover { filter: brightness(1.06); }

.cart-summary {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius-panel);
  box-shadow: var(--shadow-soft);
  padding: 24px;
  position: sticky;
  top: 24px;
}

.cart-summary h2 {
  font-size: 17px;
  font-weight: 800;
  margin-bottom: 14px;
}

.sum-rows { display: flex; flex-direction: column; gap: 10px; }

.sum-row {
  display: flex;
  justify-content: space-between;
  font-size: 14px;
}

.sum-row dt { color: var(--latte); }

.sum-row dd { font-weight: 700; }

.sum-row dd.free { color: var(--crust); font-weight: 800; }

.delivery-progress {
  margin: 16px 0;
  background: var(--cream-deep);
  border-radius: 12px;
  padding: 12px 14px;
}

.delivery-progress p { font-size: 12px; font-weight: 700; color: var(--crust); }

.progress-track {
  margin-top: 8px;
  height: 8px;
  border-radius: 999px;
  background: var(--line);
  overflow: hidden;
}

.progress-bar {
  height: 100%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--toast), var(--crust));
  transition: width .35s ease;
}

.sum-total {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  border-top: 1px dashed var(--line);
  padding-top: 14px;
  margin-top: 4px;
}

.sum-total span { font-size: 14px; font-weight: 700; }

.sum-total strong { font-size: 28px; font-weight: 800; color: var(--crust); }

.checkout-btn {
  margin-top: 16px;
  width: 100%;
  height: 52px;
  border: none;
  border-radius: 16px;
  background: linear-gradient(135deg, var(--toast), var(--crust));
  color: #FFFDF8;
  font-size: 17px;
  font-weight: 800;
  letter-spacing: .06em;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  box-shadow: 0 8px 20px rgba(180, 90, 27, .30);
  transition: filter .15s ease, transform .1s ease;
}

.checkout-btn span { font-weight: 800; opacity: .92; }

.checkout-btn:hover:not(:disabled) { filter: brightness(1.07); }

.checkout-btn:active:not(:disabled) { transform: scale(.98); }

.checkout-btn:disabled {
  background: var(--line);
  color: var(--latte);
  box-shadow: none;
  cursor: not-allowed;
}

.summary-note {
  margin-top: 12px;
  font-size: 12px;
  color: var(--latte);
  text-align: center;
}

.bakery-footer {
  position: relative;
  z-index: 1;
  border-top: 1px solid var(--line);
  padding: 18px 24px 28px;
  text-align: center;
  font-size: 12px;
  color: var(--latte);
  letter-spacing: .08em;
}

.toast {
  position: fixed;
  left: 50%;
  bottom: 32px;
  transform: translateX(-50%) translateY(20px);
  background: var(--cocoa);
  color: var(--cream);
  font-size: 14px;
  font-weight: 600;
  border-radius: 14px;
  padding: 12px 22px;
  box-shadow: 0 10px 26px rgba(74, 46, 26, .35);
  opacity: 0;
  pointer-events: none;
  transition: opacity .25s ease, transform .25s ease;
  z-index: 50;
  max-width: calc(100vw - 48px);
  text-align: center;
}

.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.modal {
  position: fixed;
  inset: 0;
  background: rgba(74, 46, 26, .5);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  z-index: 60;
  animation: fadeIn .2s ease;
}

.modal[hidden] { display: none; }

.modal-panel {
  background: var(--card);
  border-radius: 24px;
  width: min(480px, 100%);
  padding: 28px;
  box-shadow: 0 24px 60px rgba(74, 46, 26, .4);
  animation: popIn .25s ease;
}

.modal-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}

.modal-head h2 { font-size: 20px; font-weight: 800; }

.modal-close {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: none;
  background: var(--cream-deep);
  color: var(--cocoa);
  font-size: 16px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.modal-close:hover { background: var(--line); }

.modal-body { font-size: 14px; }

.modal-lines { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }

.modal-line {
  display: flex;
  justify-content: space-between;
  color: var(--cocoa);
}

.modal-line span:last-child { font-weight: 700; }

.modal-total {
  display: flex;
  justify-content: space-between;
  border-top: 1px dashed var(--line);
  padding-top: 12px;
  margin-top: 4px;
  font-weight: 800;
  font-size: 15px;
}

.modal-total strong { color: var(--crust); font-size: 20px; }

.modal-note {
  margin-top: 12px;
  font-size: 12px;
  color: var(--latte);
}

.modal-actions {
  display: flex;
  gap: 12px;
  margin-top: 20px;
}

.modal-actions .btn { flex: 1; padding: 13px 18px; font-size: 15px; }

.success-box { text-align: center; padding: 8px 0 4px; }

.success-box h3 { font-size: 19px; font-weight: 800; margin-top: 12px; }

.success-box p { font-size: 13px; color: var(--latte); margin-top: 6px; }

@keyframes itemIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes bump {
  0% { transform: scale(1); }
  50% { transform: scale(1.25); }
  100% { transform: scale(1); }
}

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

@keyframes popIn {
  from { opacity: 0; transform: scale(.96) translateY(8px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}

button:focus-visible,
a:focus-visible {
  outline: 3px solid rgba(232, 137, 59, .5);
  outline-offset: 2px;
}

@media (max-width: 1020px) {
  .cart-main { grid-template-columns: 1fr; gap: 24px; }
  .cart-summary { position: static; }
}

@media (max-width: 768px) {
  .header-inner { padding: 16px; }
  .cart-main { padding: 20px 16px 48px; }
  .item-grid { grid-template-columns: 72px minmax(0, 1fr); }
  .item-art { width: 72px; height: 72px; }
  .item-side {
    grid-column: 1 / -1;
    flex-direction: row;
    justify-content: space-between;
    align-items: center;
  }
  .brand-text span { display: none; }
  .list-head h1 { font-size: 22px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
    scroll-behavior: auto !important;
  }
}
</style>
</head>
<body>
<div class="bg-glow" aria-hidden="true"></div>

<header class="bakery-header">
  <div class="header-inner">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 40 40" width="44" height="44">
          <circle cx="20" cy="20" r="19" fill="#B45A1B"></circle>
          <path d="M20 32V13" stroke="#FAF1E0" stroke-width="2.4" stroke-linecap="round" fill="none"></path>
          <path d="M20 17c-4-1-6-4-6-8 4 0 6 2 6 8zM20 17c4-1 6-4 6-8-4 0-6 2-6 8z" fill="#FAF1E0"></path>
          <path d="M20 25c-4-1-6-4-6-8 4 0 6 2 6 8zM20 25c4-1 6-4 6-8-4 0-6 2-6 8z" fill="#FAF1E0"></path>
        </svg>
      </span>
      <div class="brand-text">
        <strong>麦屿烘焙屋</strong>
        <span>社区现烤 · 出炉即送</span>
      </div>
    </div>
    <div class="header-actions">
      <a class="ghost-link" href="#" id="back-to-shop">继续选购 →</a>
      <span class="basket-badge">购物篮 · <b id="header-count">5</b> 件</span>
    </div>
  </div>
</header>

<main class="cart-main">
  <section class="cart-list" aria-labelledby="cart-title">
    <div class="list-head">
      <h1 id="cart-title">购物篮 <span class="count-pill" id="cart-count">5 件</span></h1>
      <p class="list-hint">现烤糕点出炉 2 小时内口感最佳，建议趁热享用。</p>
    </div>
    <div class="cart-items" id="cart-items"></div>
    <div class="cart-empty" id="cart-empty" hidden>
      <svg viewBox="0 0 120 96" width="120" height="96" aria-hidden="true">
        <path d="M42 34a18 18 0 0 1 36 0" stroke="#C9A96F" stroke-width="5" fill="none" stroke-linecap="round"></path>
        <path d="M22 40h76l-9 40a9 9 0 0 1-9 7H40a9 9 0 0 1-9-7l-9-40z" fill="#F3E4C8"></path>
        <path d="M22 40h76" stroke="#C9A96F" stroke-width="4" stroke-linecap="round"></path>
        <circle cx="46" cy="56" r="3" fill="#C9A96F"></circle>
        <circle cx="60" cy="62" r="3" fill="#C9A96F"></circle>
        <circle cx="74" cy="56" r="3" fill="#C9A96F"></circle>
      </svg>
      <h2>购物篮空了</h2>
      <p>柜台里的糕点还热着，去挑几件喜欢的吧。</p>
      <button type="button" class="btn btn-primary" id="restore-demo">恢复示例购物篮</button>
    </div>
  </section>

  <aside class="cart-summary" id="cart-summary" aria-labelledby="sum-title">
    <h2 id="sum-title">订单摘要</h2>
    <dl class="sum-rows">
      <div class="sum-row"><dt>商品件数</dt><dd id="sum-items">5 件</dd></div>
      <div class="sum-row"><dt>小计</dt><dd id="sum-subtotal">¥100</dd></div>
      <div class="sum-row"><dt>配送费</dt><dd id="sum-delivery">¥6</dd></div>
    </dl>
    <div class="delivery-progress">
      <p id="delivery-note">再买 ¥28 免配送费</p>
      <div class="progress-track"><div class="progress-bar" id="delivery-bar" style="width: 78%"></div></div>
    </div>
    <div class="sum-total"><span>合计</span><strong id="sum-total">¥106</strong></div>
    <button type="button" class="checkout-btn" id="checkout-btn">去结算 <span id="checkout-total">¥106</span></button>
    <p class="summary-note">满 ¥128 免配送费 · 支持到店自提 · 出炉后 40 分钟内送达</p>
  </aside>
</main>

<footer class="bakery-footer">麦屿烘焙屋 · 每日 06:30 开炉 · 本页面为界面演示，支付与配送环节不在范围内</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="modal" id="checkout-modal" hidden>
  <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-head">
      <h2 id="modal-title">确认订单</h2>
      <button type="button" class="modal-close" id="modal-close" aria-label="关闭">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-actions" id="modal-actions"></div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var FREE_LIMIT = 128;
  var DELIVERY_FEE = 6;
  var MAX_QTY = 9;

  var SVG_LOAF = '<svg viewBox="0 0 80 80" width="64" height="64" aria-hidden="true"><path d="M18 40c0-11 9-20 22-20s22 9 22 20v16c0 4-3 7-7 7H25c-4 0-7-3-7-7V40z" fill="#E8B36B"></path><path d="M29 33l6 8M40 31l6 8M51 33l6 8" stroke="#C68A3F" stroke-width="3" stroke-linecap="round" fill="none"></path></svg>';

  var SVG_ROLL = '<svg viewBox="0 0 80 80" width="64" height="64" aria-hidden="true"><circle cx="40" cy="42" r="24" fill="#D9A05B"></circle><path d="M40 42m0-15a15 15 0 1 1-15 15 11 11 0 1 0 11-11 7 7 0 1 1-7 7" stroke="#A56A2F" stroke-width="4" stroke-linecap="round" fill="none"></path><path d="M24 25l4 4M56 25l-4 4" stroke="#F3E4C8" stroke-width="4" stroke-linecap="round"></path></svg>';
  var SVG_BUN = '<svg viewBox="0 0 80 80" width="64" height="64" aria-hidden="true"><path d="M40 21v-6" stroke="#7A5A2E" stroke-width="5" stroke-linecap="round"></path><circle cx="40" cy="46" r="23" fill="#E0A54F"></circle><path d="M28 29q-9 17 0 34M52 29q9 17 0 34" stroke="#C08340" stroke-width="3.5" fill="none" stroke-linecap="round"></path></svg>';

  var DEFAULT_ITEMS = [
    { id: 'p-loaf', name: '日式生吐司', spec: '半条装 · 约 320g，奶香绵软', price: 32, qty: 1, tag: '今日现烤', svg: SVG_LOAF },
    { id: 'p-croissant', name: '杏仁可颂', spec: '单只 · 表面撒糖粉与杏仁片', price: 16, qty: 2, tag: '', svg: SVG_CROISSANT },
    { id: 'p-roll', name: '红糖肉桂卷', spec: '单只 · 黑糖肉桂馅，加热更香', price: 14, qty: 1, tag: '热门口味', svg: SVG_ROLL },
    { id: 'p-bun', name: '南瓜软欧包', spec: '单只 · 老南瓜泥揉面，低糖', price: 22, qty: 1, tag: '秋季限定', svg: SVG_BUN }
  ];

  var cart = [];
  var confirmingId = null;
  var toastTimer = null;

  var els = {
    items: document.getElementById('cart-items'),
    empty: document.getElementById('cart-empty'),
    summary: document.getElementById('cart-summary'),
    count: document.getElementById('cart-count'),
    headerCount: document.getElementById('header-count'),
    sumItems: document.getElementById('sum-items'),
    sumSubtotal: document.getElementById('sum-subtotal'),
    sumDelivery: document.getElementById('sum-delivery'),
    deliveryNote: document.getElementById('delivery-note'),
    deliveryBar: document.getElementById('delivery-bar'),
    sumTotal: document.getElementById('sum-total'),
    checkoutBtn: document.getElementById('checkout-btn'),
    checkoutTotal: document.getElementById('checkout-total'),
    restoreBtn: document.getElementById('restore-demo'),
    toast: document.getElementById('toast'),
    modal: document.getElementById('checkout-modal'),
    modalTitle: document.getElementById('modal-title'),
    modalBody: document.getElementById('modal-body'),
    modalActions: document.getElementById('modal-actions'),
    modalClose: document.getElementById('modal-close'),
    backToShop: document.getElementById('back-to-shop')
  };

  function money(n) { return '¥' + n; }

  function getTotals() {
    var subtotal = 0;
    var count = 0;
    cart.forEach(function (item) {
      subtotal += item.price * item.qty;
      count += item.qty;
    });
    var delivery = (subtotal === 0 || subtotal >= FREE_LIMIT) ? 0 : DELIVERY_FEE;
    return { subtotal: subtotal, count: count, delivery: delivery, total: subtotal + delivery };
  }

  function render() {
    els.items.innerHTML = cart.map(function (item) {
      var confirming = item.id === confirmingId;
      var tag = item.tag ? '<span class="item-tag">' + item.tag + '</span>' : '';
      return '<article class="item' + (confirming ? ' is-confirming' : '') + '" data-id="' + item.id + '">' +
        '<div class="item-grid">' +
          '<div class="item-art">' + item.svg + '</div>' +
          '<div class="item-info">' +
            '<div class="item-name-row"><h3 class="item-name">' + item.name + '</h3>' + tag + '</div>' +
            '<p class="item-spec">' + item.spec + '</p>' +
            '<p class="item-unit">单价 ' + money(item.price) + '</p>' +
          '</div>' +
          '<div class="item-side">' +
            '<p class="item-total">' + money(item.price * item.qty) + '</p>' +
            '<div class="stepper">' +
              '<button type="button" data-act="minus" aria-label="减少一份' + item.name + '"' + (item.qty <= 1 ? ' disabled' : '') + '>−</button>' +
              '<span class="qty" id="qty-' + item.id + '">' + item.qty + '</span>' +
              '<button type="button" data-act="plus" aria-label="增加一份' + item.name + '"' + (item.qty >= MAX_QTY ? ' disabled' : '') + '>+</button>' +
            '</div>' +
            '<button type="button" class="remove-link" data-act="remove">移回柜台</button>' +
          '</div>' +
        '</div>' +
        '<div class="item-confirm">' +
          '<p>确定把「' + item.name + '」放回柜台吗？</p>' +
          '<div class="confirm-actions">' +
            '<button type="button" class="btn btn-ghost" data-act="cancel">先留着</button>' +
            '<button type="button" class="btn btn-jam" data-act="takeaway">确认拿走</button>' +
          '</div>' +
        '</div>' +
      '</article>';
    }).join('');

    var t = getTotals();
    var empty = cart.length === 0;
    els.empty.hidden = !empty;
    els.summary.style.display = empty ? 'none' : '';
    els.count.textContent = t.count + ' 件';
    els.headerCount.textContent = t.count;
    els.sumItems.textContent = t.count + ' 件';
    els.sumSubtotal.textContent = money(t.subtotal);
    els.sumDelivery.textContent = t.delivery === 0 ? '免配送费' : money(t.delivery);
    els.sumDelivery.className = t.delivery === 0 ? 'free' : '';
    els.sumTotal.textContent = money(t.total);
    els.checkoutTotal.textContent = money(t.total);
    els.checkoutBtn.disabled = empty;

    var pct = Math.min(t.subtotal / FREE_LIMIT, 1) * 100;
    els.deliveryBar.style.width = pct + '%';
    if (t.subtotal >= FREE_LIMIT) {
      els.deliveryNote.textContent = '已享免配送费';
    } else {
      els.deliveryNote.textContent = '再买 ' + money(FREE_LIMIT - t.subtotal) + ' 免配送费';
    }
  }

  function showToast(text) {
    els.toast.textContent = text;
    els.toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      els.toast.classList.remove('show');
    }, 2400);
  }

  els.items.addEventListener('click', function (ev) {
    var btn = ev.target.closest('button');
    if (!btn) return;
    var card = ev.target.closest('.item');
    if (!card) return;
    var id = card.getAttribute('data-id');
    var item = null;
    cart.forEach(function (it) { if (it.id === id) item = it; });
    if (!item) return;
    var act = btn.getAttribute('data-act');

    if (act === 'plus') {
      if (item.qty >= MAX_QTY) {
        showToast('单款糕点一次最多订 ' + MAX_QTY + ' 份');
        return;
      }
      item.qty += 1;
      confirmingId = null;
      render();
      var qtyEl = document.getElementById('qty-' + id);
      if (qtyEl) qtyEl.classList.add('bump');
    } else if (act === 'minus') {
      if (item.qty > 1) {
        item.qty -= 1;
        confirmingId = null;
        render();
      }
    } else if (act === 'remove') {
      confirmingId = id;
      render();
    } else if (act === 'cancel') {
      confirmingId = null;
      render();
    } else if (act === 'takeaway') {
      cart = cart.filter(function (it) { return it.id !== id; });
      confirmingId = null;
      render();
      showToast('已把「' + item.name + '」放回柜台');
    }
  });

  els.restoreBtn.addEventListener('click', function () {
    cart = DEFAULT_ITEMS.map(function (it) { return Object.assign({}, it); });
    confirmingId = null;
    render();
    showToast('示例购物篮已恢复，共 ' + getTotals().count + ' 件糕点');
  });

  els.backToShop.addEventListener('click', function (ev) {
    ev.preventDefault();
    showToast('这是演示页面：柜台选购环节不在范围内');
  });

  function openModal() {
    var t = getTotals();
    els.modalTitle.textContent = '确认订单';
    var lines = cart.map(function (item) {
      return '<div class="modal-line"><span>' + item.name + ' × ' + item.qty + '</span><span>' + money(item.price * item.qty) + '</span></div>';
    }).join('');
    els.modalBody.innerHTML =
      '<div class="modal-lines">' + lines + '</div>' +
      '<div class="modal-line"><span>配送费</span><span>' + (t.delivery === 0 ? '免配送费' : money(t.delivery)) + '</span></div>' +
      '<div class="modal-total"><span>合计</span><strong>' + money(t.total) + '</strong></div>' +
      '<p class="modal-note">预计 40 分钟出炉，出炉后由店员打包装盒配送。本页面为界面演示，支付环节不展开。</p>';
    els.modalActions.innerHTML =
      '<button type="button" class="btn btn-ghost" data-m="close">再想想</button>' +
      '<button type="button" class="btn btn-primary" data-m="submit" style="margin-top:0">模拟提交订单</button>';
    els.modal.hidden = false;
  }

  function closeModal() {
    els.modal.hidden = true;
  }

  function showSuccess() {
    var t = getTotals();
    els.modalTitle.textContent = '提交成功';
    els.modalBody.innerHTML =
      '<div class="success-box">' +
        '<svg viewBox="0 0 64 64" width="56" height="56" aria-hidden="true"><circle cx="32" cy="32" r="30" fill="#F3E4C8"></circle><path d="M20 33l8 8 16-18" stroke="#B45A1B" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></svg>' +
        '<h3>订单已收到！</h3>' +
        '<p>共 ' + t.count + ' 件糕点，合计 ' + money(t.total) + '。烘焙师已经开始备料，这是界面演示，不会真实扣款。</p>' +
      '</div>';
    els.modalActions.innerHTML =
      '<button type="button" class="btn btn-primary" data-m="close" style="margin-top:0">回到购物车</button>';
  }

  els.checkoutBtn.addEventListener('click', function () {
    if (cart.length === 0) return;
    openModal();
  });

  els.modalActions.addEventListener('click', function (ev) {
    var btn = ev.target.closest('button');
    if (!btn) return;
    var act = btn.getAttribute('data-m');
    if (act === 'close') closeModal();
    else if (act === 'submit') showSuccess();
  });

  els.modalClose.addEventListener('click', closeModal);

  els.modal.addEventListener('click', function (ev) {
    if (ev.target === els.modal) closeModal();
  });

  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape' && !els.modal.hidden) closeModal();
  });

  cart = DEFAULT_ITEMS.map(function (it) { return Object.assign({}, it); });
  render();
})();
</script>
</body>
</html>
