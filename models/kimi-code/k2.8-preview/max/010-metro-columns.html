<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>南巷周刊 · 选题流转看板</title>
<style>
  :root{
    --paper:#F5F1E8;
    --card:#FFFFFF;
    --ink:#1B1813;
    --muted:#6E675A;
    --line:#CFC7B8;
    --c-backlog:#E8442E;
    --c-writing:#2456D6;
    --c-proof:#F2A900;
    --c-pub:#0E8A6D;
    --gap:16px;
    --radius:2px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:14px;line-height:1.6;
    display:flex;flex-direction:column;overflow:hidden;
  }
  /* ── 刊头 ─────────────────────────────── */
  #masthead{
    flex:0 0 auto;
    border-bottom:2px solid var(--ink);
    padding:14px 32px 12px;
    display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:16px;
  }
  #masthead .issue{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:11px;letter-spacing:.14em;color:var(--muted)}
  #masthead h1{
    font-family:Georgia,"Times New Roman","Songti SC","STSong","SimSun",serif;
    font-size:30px;line-height:1.15;font-weight:700;letter-spacing:.04em;text-align:center;white-space:nowrap;
  }
  #masthead .meta{text-align:right;font-size:12px;color:var(--muted)}
  #masthead .meta b{color:var(--ink);font-weight:600}
  #masthead .strip{
    grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;
    border-top:1px solid var(--ink);margin-top:10px;padding-top:6px;
    font-size:11px;letter-spacing:.22em;color:var(--muted);
  }
  #masthead .strip strong{color:var(--ink);letter-spacing:.3em;font-weight:600}
  /* ── 看板栅格 ─────────────────────────── */
  #board{
    flex:1 1 auto;min-height:0;
    display:grid;grid-template-columns:repeat(4,1fr);gap:var(--gap);
    padding:20px 32px 24px;
  }
  .col{
    display:flex;flex-direction:column;min-height:0;min-width:0;
    background:var(--card);border:1px solid var(--ink);border-radius:var(--radius);
  }
  .col-head{
    flex:0 0 auto;height:76px;padding:10px 12px;
    background:var(--c);color:var(--on-c,#fff);
    display:flex;align-items:center;gap:10px;
    border-bottom:1px solid var(--ink);
  }
  .col-index{
    font-family:Georgia,"Songti SC","SimSun",serif;font-size:30px;line-height:1;font-weight:700;
    border-right:1px solid currentColor;padding-right:10px;opacity:.92;
  }
  .col-titles{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
  .col-titles strong{font-size:17px;font-weight:700;letter-spacing:.12em;line-height:1.2}
  .col-titles span{font-size:10px;letter-spacing:.24em;opacity:.78}
  .col-count{
    min-width:26px;height:26px;padding:0 6px;border-radius:13px;
    background:var(--card);color:var(--ink);border:1px solid var(--ink);
    font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:13px;font-weight:700;
    display:inline-flex;align-items:center;justify-content:center;
  }
  .col-body{flex:1 1 auto;min-height:120px;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
  .col-empty{
    border:1px dashed var(--line);color:var(--muted);font-size:12px;text-align:center;
    padding:18px 8px;letter-spacing:.05em;
  }
  /* ── 卡片 ─────────────────────────────── */
  button.card{
    appearance:none;text-align:left;font:inherit;color:inherit;cursor:pointer;width:100%;
    background:var(--card);border:1px solid var(--ink);border-left:4px solid var(--c);
    border-radius:var(--radius);padding:10px 12px 8px;
    display:flex;flex-direction:column;gap:6px;
    transition:box-shadow .16s ease-out,transform .16s ease-out;
  }
  button.card:hover{box-shadow:3px 3px 0 var(--ink);transform:translate(-1px,-1px)}
  button.card:focus-visible{outline:2px solid var(--c-writing);outline-offset:2px}
  button.card.flash{animation:flash .9s ease-out}
  @keyframes flash{
    0%{box-shadow:0 0 0 3px var(--c)}
    100%{box-shadow:0 0 0 0 transparent}
  }
  .card-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .card-tag{
    font-size:10px;letter-spacing:.12em;border:1px solid var(--ink);border-radius:999px;
    padding:1px 8px;line-height:1.5;white-space:nowrap;
  }
  .card-no{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:10px;color:var(--muted)}
  .card-title{font-size:15px;font-weight:700;line-height:1.45;letter-spacing:.01em}
  .card-meta{font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
  .card-more{font-size:11px;color:var(--muted);border-top:1px solid var(--line);padding-top:5px;letter-spacing:.08em}
  button.card:hover .card-more{color:var(--ink)}
  /* ── 新建 ─────────────────────────────── */
  .col-foot{flex:0 0 auto;border-top:1px solid var(--ink);padding:10px 12px}
  .add-btn{
    width:100%;appearance:none;font:inherit;cursor:pointer;
    background:var(--ink);color:var(--paper);border:1px solid var(--ink);border-radius:var(--radius);
    padding:8px 0;font-size:13px;letter-spacing:.18em;font-weight:600;
    transition:background .15s ease-out,color .15s ease-out;
  }
  .add-btn:hover{background:var(--c);border-color:var(--c);color:var(--on-c,#fff)}
  .add-form{display:none;flex-direction:column;gap:8px}
  .add-form.open{display:flex}
  .add-form input{
    font:inherit;font-size:14px;color:var(--ink);
    border:1px solid var(--ink);border-radius:var(--radius);background:var(--paper);
    padding:8px 10px;width:100%;
  }
  .add-form input:focus-visible{outline:2px solid var(--c-writing);outline-offset:1px}
  .add-form input.err{border-color:var(--c-backlog);outline:2px solid var(--c-backlog)}
  .add-form .hint{display:none;font-size:11px;color:var(--c-backlog)}
  .add-form .hint.show{display:block}
  .add-form .row{display:flex;gap:8px}
  .add-form .row button{
    flex:1;appearance:none;font:inherit;font-size:13px;cursor:pointer;
    border:1px solid var(--ink);border-radius:var(--radius);padding:7px 0;letter-spacing:.1em;
  }
  .add-ok{background:var(--ink);color:var(--paper)}
  .add-ok:hover{background:var(--c);border-color:var(--c);color:var(--on-c,#fff)}
  .add-cancel{background:var(--card);color:var(--ink)}
  .add-cancel:hover{background:var(--paper)}
  /* ── 详情抽屉 ─────────────────────────── */
  #scrim{
    position:fixed;inset:0;background:rgba(27,24,19,.42);z-index:40;
    opacity:0;pointer-events:none;transition:opacity .22s ease-out;
  }
  #scrim.on{opacity:1;pointer-events:auto}
  #drawer{
    position:fixed;top:0;right:0;bottom:0;width:380px;max-width:92vw;z-index:50;
    background:var(--paper);border-left:1px solid var(--ink);
    transform:translateX(102%);transition:transform .26s ease-out;
    display:flex;flex-direction:column;
  }
  #drawer.on{transform:translateX(0)}
  .drawer-strip{flex:0 0 auto;height:10px;background:var(--c,var(--ink))}
  .drawer-head{flex:0 0 auto;padding:20px 24px 14px;border-bottom:1px solid var(--ink);position:relative}
  #drawerKicker{font-size:11px;letter-spacing:.24em;color:var(--muted);display:block;margin-bottom:8px}
  #drawerTitle{font-family:Georgia,"Songti SC","SimSun",serif;font-size:24px;line-height:1.3;font-weight:700}
  #drawerClose{
    position:absolute;top:14px;right:14px;width:32px;height:32px;
    appearance:none;font:inherit;font-size:16px;line-height:1;cursor:pointer;
    background:var(--card);color:var(--ink);border:1px solid var(--ink);border-radius:var(--radius);
  }
  #drawerClose:hover{background:var(--ink);color:var(--paper)}
  .drawer-body{flex:1 1 auto;overflow-y:auto;padding:18px 24px;display:flex;flex-direction:column;gap:16px}
  #drawerMeta{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13px}
  #drawerMeta dt{color:var(--muted);letter-spacing:.1em}
  #drawerMeta dd{font-weight:600}
  #drawerDesc{font-size:14px;line-height:1.85;border-top:1px solid var(--line);padding-top:14px}
  .drawer-note{font-size:12px;color:var(--muted);letter-spacing:.06em}
  .drawer-foot{
    flex:0 0 auto;border-top:1px solid var(--ink);padding:14px 24px 18px;
    display:flex;gap:10px;
  }
  .move-btn{
    flex:1;appearance:none;font:inherit;font-size:13px;font-weight:600;letter-spacing:.1em;cursor:pointer;
    border:1px solid var(--ink);border-radius:var(--radius);padding:10px 0;background:var(--card);color:var(--ink);
    transition:background .15s ease-out,color .15s ease-out;
  }
  .move-btn:hover:not(:disabled){background:var(--ink);color:var(--paper)}
  .move-btn:disabled{opacity:.35;cursor:not-allowed;border-style:dashed}
  /* ── 提示条 ───────────────────────────── */
  #toast{
    position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(12px);z-index:60;
    background:var(--ink);color:var(--paper);font-size:13px;letter-spacing:.08em;
    padding:9px 20px;border-radius:var(--radius);opacity:0;pointer-events:none;
    transition:opacity .2s ease-out,transform .2s ease-out;
  }
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  /* ── 滚动条 ───────────────────────────── */
  .col-body::-webkit-scrollbar{width:8px}
  .col-body::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
  /* ── 响应式 ───────────────────────────── */
  @media (max-width:900px){
    body{overflow:auto}
    #masthead{padding:12px 20px 10px}
    #masthead h1{font-size:22px;white-space:normal}
    #masthead .meta{font-size:11px}
    #board{grid-template-columns:repeat(2,1fr);padding:16px 20px 24px;height:auto;overflow:visible}
    .col{min-height:0}
    .col-body{max-height:46vh}
    #drawer{width:min(380px,100vw)}
  }
  /* ── 减少动态 ─────────────────────────── */
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none !important;transition:none !important}
    button.card:hover{transform:none;box-shadow:3px 3px 0 var(--ink)}
    #drawer,#toast{transition:none}
  }
</style>
</head>
<body>

<header id="masthead">
  <div class="issue">第 214 期 · 逢周四出版</div>
  <h1>南巷周刊 · 选题看板</h1>
  <div class="meta"><b>2026-06-11</b> 星期四 · 在办 <b id="statDoing">0</b> · 已刊 <b id="statDone">0</b></div>
  <div class="strip"><strong>选题流转看板</strong><span>点击卡片查看详情与流转 · 各栏底部可登记新选题</span></div>
</header>

<main id="board" aria-label="选题看板"></main>

<div id="scrim"></div>

<aside id="drawer" role="dialog" aria-modal="true" aria-label="选题详情">
  <div class="drawer-strip" id="drawerStrip"></div>
  <div class="drawer-head">
    <span id="drawerKicker"></span>
    <h2 id="drawerTitle"></h2>
    <button id="drawerClose" type="button" aria-label="关闭详情">×</button>
  </div>
  <div class="drawer-body">
    <dl id="drawerMeta"></dl>
    <p id="drawerDesc"></p>
    <p class="drawer-note">流转后卡片即时归入目标栏目，栏目计数与刊头统计同步更新。</p>
  </div>
  <div class="drawer-foot">
    <button class="move-btn" id="drawerPrev" type="button">← 退回上一栏</button>
    <button class="move-btn" id="drawerNext" type="button">推进到下一栏 →</button>
  </div>
</aside>

<div id="toast" role="status"></div>

<script>
(function(){
  "use strict";
  var COLS=[
    {name:"待采",en:"BACKLOG", c:"var(--c-backlog)",hex:"#E8442E",on:"#fff"},
    {name:"撰写",en:"WRITING", c:"var(--c-writing)",hex:"#2456D6",on:"#fff"},
    {name:"校对",en:"PROOFING",c:"var(--c-proof)", hex:"#F2A900",on:"#1B1813"},
    {name:"已刊",en:"PUBLISHED",c:"var(--c-pub)",  hex:"#0E8A6D",on:"#fff"}
  ];
  var DESCS={
    "214-01":"骑楼廊下的修表摊开了四十三年，摊主老周的手艺据传能修好任何一块停走的表。本期想跟拍他的一天，顺带聊聊老城更新里小摊档的去留。",
    "214-02":"文昌巷口的糖水摊从母亲的扁担做到女儿的档口，三十年来价格只涨过四次。拟做成图文专题，配摊主手写的老账本照片。",
    "214-03":"三个月前报道过的黑臭河涌如今水清见底，想回访沿岸三个社区，核对治理承诺的落实情况，并补一组今昔对比图。",
    "214-04":"十二号线首班车六点半从南站发出，记者已跟车两趟，素材里有首班车乘客的口述。成稿需补线路图与换乘票价表。",
    "214-05":"织染厂旧厂房改成的社区书房开业满一年，借阅量超过预期三倍。稿子在撰写中，待补充运营方的收支明细与读者访谈。",
    "214-06":"连雨三周，叶菜批发价抬了三成。数据已核到批发市场每日挂牌价，稿子等校对复核报价口径与农户采访引语。",
    "214-07":"广绣世家第五代传人把绣坊开进了直播间，订单翻了两番。事实核查基本完成，剩两处绣品年代需向博物馆方面再确认。",
    "214-08":"人民天桥底下的滑板少年自成社群，白天送外卖晚上练招。报道已于上周四见刊，社媒转载破十万，留档备查。",
    "214-09":"跟拍老字号早茶店收银台十二小时，从开档到收市。读者来信反响热烈，编辑部决定加做一期店主访谈，此卡归档。"
  };
  var seed=[
    {no:"214-01",col:0,tag:"人物",who:"陈默",  due:"06-18",title:"骑楼下的修表匠"},
    {no:"214-02",col:0,tag:"城市",who:"林小满",due:"06-19",title:"夜市糖水摊的第三十年"},
    {no:"214-03",col:0,tag:"环境",who:"赵蔚",  due:"06-21",title:"河涌治理三月回访"},
    {no:"214-04",col:1,tag:"交通",who:"何舟",  due:"06-16",title:"地铁十二号线开通首日"},
    {no:"214-05",col:1,tag:"城市",who:"陈默",  due:"06-17",title:"旧厂房改造的社区书房"},
    {no:"214-06",col:2,tag:"民生",who:"苏青",  due:"06-15",title:"雨季菜价观察"},
    {no:"214-07",col:2,tag:"文化",who:"林小满",due:"06-14",title:"非遗广绣新传人"},
    {no:"214-08",col:3,tag:"人物",who:"何舟",  due:"06-12",title:"天桥滑板少年"},
    {no:"214-09",col:3,tag:"民生",who:"苏青",  due:"06-11",title:"早茶店收银台的一天"}
  ];
  var cards=seed.map(function(s,i){return {uid:i,no:s.no,col:s.col,tag:s.tag,who:s.who,due:s.due,title:s.title};});
  var nextUid=cards.length;
  var serial=10;
  var openUid=null, toastTimer=null;

  var board=document.getElementById("board");
  var drawer=document.getElementById("drawer");
  var scrim=document.getElementById("scrim");
  var toast=document.getElementById("toast");

  function pad(n){return (n<10?"0":"")+n;}
  function esc(s){return String(s).replace(/[&<>"']/g,function(m){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m];});}

  function render(flashUid){
    board.innerHTML="";
    COLS.forEach(function(col,ci){
      var list=cards.filter(function(c){return c.col===ci;});
      var sec=document.createElement("section");
      sec.className="col";
      sec.style.setProperty("--c",col.c);
      var head=document.createElement("header");
      head.className="col-head";
      head.style.setProperty("--c",col.c);
      head.style.setProperty("--on-c",col.on);
      head.innerHTML='<span class="col-index">'+pad(ci+1)+'</span>'+
        '<div class="col-titles"><strong>'+col.name+'</strong><span>'+col.en+'</span></div>'+
        '<span class="col-count" data-count="'+ci+'">'+list.length+'</span>';
      var body=document.createElement("div");
      body.className="col-body";
      if(list.length===0){
        body.innerHTML='<div class="col-empty">本栏暂无选题<br>可在下方登记新选题</div>';
      }else{
        list.forEach(function(card){
          var b=document.createElement("button");
          b.type="button";b.className="card";b.dataset.uid=card.uid;
          b.style.setProperty("--c",col.c);
          b.setAttribute("aria-label","查看选题详情："+card.title);
          if(card.uid===flashUid)b.classList.add("flash");
          b.innerHTML=
            '<div class="card-top"><span class="card-tag">'+esc(card.tag)+'</span>'+
            '<span class="card-no">No.'+esc(card.no)+'</span></div>'+
            '<div class="card-title">'+esc(card.title)+'</div>'+
            '<div class="card-meta"><span>'+esc(card.who)+'</span><span>截稿 '+esc(card.due)+'</span></div>'+
            '<div class="card-more">查看详情与流转 ›</div>';
          body.appendChild(b);
        });
      }
      var foot=document.createElement("div");
      foot.className="col-foot";
      foot.innerHTML=
        '<button type="button" class="add-btn" data-add="'+ci+'">＋ 登记新选题</button>'+
        '<form class="add-form" data-form="'+ci+'" novalidate>'+
          '<input type="text" maxlength="30" placeholder="输入选题名称，回车或点确定" aria-label="新选题名称">'+
          '<span class="hint">请先填写选题名称（不超过 30 字）</span>'+
          '<div class="row"><button type="submit" class="add-ok">确定登记</button>'+
          '<button type="button" class="add-cancel">取消</button></div>'+
        '</form>';
      sec.appendChild(head);sec.appendChild(body);sec.appendChild(foot);
      board.appendChild(sec);
    });
    document.getElementById("statDoing").textContent=
      cards.filter(function(c){return c.col<3;}).length;
    document.getElementById("statDone").textContent=
      cards.filter(function(c){return c.col===3;}).length;
  }

  function showToast(msg){
    toast.textContent=msg;
    toast.classList.add("on");
    clearTimeout(toastTimer);
    toastTimer=setTimeout(function(){toast.classList.remove("on");},1800);
  }

  function findCard(uid){return cards.filter(function(c){return c.uid===uid;})[0];}

  function openDrawer(uid){
    var card=findCard(uid);if(!card)return;
    openUid=uid;
    var col=COLS[card.col];
    document.getElementById("drawerStrip").style.setProperty("--c",col.hex);
    document.getElementById("drawerKicker").textContent=
      "第 "+pad(card.col+1)+" 栏 · "+col.name+" "+col.en+" · No."+card.no;
    document.getElementById("drawerTitle").textContent=card.title;
    document.getElementById("drawerMeta").innerHTML=
      "<dt>负责记者</dt><dd>"+esc(card.who)+"</dd>"+
      "<dt>截稿日期</dt><dd>2026-"+esc(card.due)+"</dd>"+
      "<dt>栏目标签</dt><dd>"+esc(card.tag)+"</dd>";
    document.getElementById("drawerDesc").textContent=DESCS[card.no]||"新登记的选题，待补充采访要点与背景资料。";
    document.getElementById("drawerPrev").disabled=(card.col===0);
    document.getElementById("drawerNext").disabled=(card.col===COLS.length-1);
    drawer.classList.add("on");
    scrim.classList.add("on");
  }
  function closeDrawer(){
    openUid=null;
    drawer.classList.remove("on");
    scrim.classList.remove("on");
  }
  function move(uid,dir){
    var card=findCard(uid);if(!card)return;
    var ni=card.col+dir;
    if(ni<0||ni>=COLS.length)return;
    card.col=ni;
    render(uid);
    openDrawer(uid);
    showToast("「"+card.title+"」已"+(dir>0?"推进到":"退回")+"「"+COLS[ni].name+"」");
  }

  board.addEventListener("click",function(e){
    var cardBtn=e.target.closest("button.card");
    if(cardBtn){openDrawer(Number(cardBtn.dataset.uid));return;}
    var addBtn=e.target.closest("[data-add]");
    if(addBtn){
      var ci=addBtn.dataset.add;
      var form=board.querySelector('[data-form="'+ci+'"]');
      addBtn.style.display="none";
      form.classList.add("open");
      var input=form.querySelector("input");
      input.focus();
      return;
    }
    if(e.target.closest(".add-cancel")){
      var f=e.target.closest(".add-form");
      f.classList.remove("open");
      f.querySelector("input").value="";
      f.querySelector("input").classList.remove("err");
      f.querySelector(".hint").classList.remove("show");
      var ci2=f.dataset.form;
      board.querySelector('[data-add="'+ci2+'"]').style.display="";
      return;
    }
  });
  board.addEventListener("submit",function(e){
    e.preventDefault();
    var form=e.target.closest(".add-form");if(!form)return;
    var input=form.querySelector("input");
    var title=input.value.trim();
    if(!title){
      input.classList.add("err");
      form.querySelector(".hint").classList.add("show");
      input.focus();
      return;
    }
    var ci=Number(form.dataset.form);
    var no="214-"+pad(serial++);
    cards.unshift({uid:nextUid++,no:no,col:ci,tag:"新题",who:"待分配",due:"06-25",title:title});
    render(nextUid-1);
    showToast("新选题「"+title+"」已登记到「"+COLS[ci].name+"」");
  });
  board.addEventListener("input",function(e){
    if(e.target.matches(".add-form input")){
      e.target.classList.remove("err");
      var h=e.target.closest(".add-form").querySelector(".hint");
      if(h)h.classList.remove("show");
    }
  });

  document.getElementById("drawerClose").addEventListener("click",closeDrawer);
  scrim.addEventListener("click",closeDrawer);
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"&&openUid!==null)closeDrawer();
  });
  document.getElementById("drawerPrev").addEventListener("click",function(){
    if(openUid!==null)move(openUid,-1);
  });
  document.getElementById("drawerNext").addEventListener("click",function(){
    if(openUid!==null)move(openUid,1);
  });

  render();
})();
</script>
</body>
</html>
