<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>等候 · 慢冲台</title>
<style>
  :root{
    --stage-a:#e9dcc6; --stage-b:#cbb494;
    --frame:#241a12; --screen:#f7f1e6; --surface:#fffaf0; --surface-2:#efe4cf;
    --ink:#2e2118; --muted:#8a7357; --line:#dcc9a8;
    --coffee:#6f4e2e; --coffee-deep:#4a3320; --crema:#c98f5a;
    --good:#4f7d5d; --danger:#b4552d; --shadow:0 24px 60px rgba(36,26,18,.35);
    --radius-ctl:16px; --radius-card:24px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:radial-gradient(900px 600px at 50% 0%,#f3e8d2 0%,var(--stage-a) 48%,var(--stage-b) 100%);
    color:var(--ink); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:44px 16px;
  }
  .phone{width:390px;height:844px;flex:0 0 auto;background:var(--frame);border-radius:44px;padding:12px;box-shadow:var(--shadow);position:relative}
  @media (max-width:480px){
    body{padding:0}
    .phone{width:100vw;height:100dvh;border-radius:0;padding:0;box-shadow:none}
    .notch,.homebar{display:none}
  }
  .notch{position:absolute;top:22px;left:50%;transform:translateX(-50%);width:118px;height:26px;border-radius:999px;background:var(--frame);z-index:40}
  .screen{width:100%;height:100%;background:linear-gradient(180deg,var(--screen),#f1e7d4);border-radius:34px;overflow:hidden;display:flex;flex-direction:column;position:relative}
  @media (max-width:480px){.screen{border-radius:0}}
  .statusbar{height:46px;flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px 6px;font-size:13px;font-weight:600}
  .appbar{height:52px;flex:none;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--line)}
  .appbar .ttl{font-size:14px;letter-spacing:3px;color:var(--muted)}
  .scroll{flex:1;overflow-y:auto;padding:18px 22px 30px}
  .brewcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-card);padding:18px 18px 16px;text-align:center}
  .brewcard .bean{width:44px;height:44px;margin:0 auto 8px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#9c6f42,#5c3d22 70%);position:relative}
  .brewcard .bean::after{content:"";position:absolute;left:50%;top:6px;bottom:6px;width:2px;background:#3c2716;transform:rotate(12deg);border-radius:2px}
  .brewcard h1{font-size:17px;font-weight:700}
  .brewcard .meta{margin-top:4px;font-size:12px;color:var(--muted)}
  .vessel{margin:20px auto 0;width:180px;position:relative}
  .vessel .cup{width:180px;height:190px;border:4px solid var(--coffee-deep);border-top-width:5px;border-radius:14px 14px 46px 46px;position:relative;overflow:hidden;background:linear-gradient(180deg,#fdf8ee,#f3e6cd)}
  .vessel .cup::after{content:"";position:absolute;right:-24px;top:26px;width:30px;height:56px;border:4px solid var(--coffee-deep);border-left:0;border-radius:0 20px 20px 0}
  .liquid{position:absolute;left:0;right:0;bottom:0;height:0%;background:linear-gradient(180deg,var(--crema),var(--coffee) 34%,var(--coffee-deep));transition:height 1s linear}
  .liquid::before{content:"";position:absolute;top:0;left:0;right:0;height:7px;background:rgba(255,235,200,.5);border-radius:50%/100% 100% 0 0}
  .pourist{position:absolute;top:-16px;left:50%;transform:translateX(-50%);width:64px;height:26px;display:none}
  .pouring .pourist{display:block}
  .pourist .stream{width:4px;height:22px;margin:0 auto;background:linear-gradient(180deg,#bfe0ea,#7fb6c6);border-radius:2px;animation:drop 0.7s ease-in infinite}
  @keyframes drop{0%{transform:scaleY(.4);opacity:.4}60%{transform:scaleY(1);opacity:1}100%{transform:scaleY(.4);opacity:.4}}
  .bigclock{margin-top:18px;font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:1px}
  .phase{margin-top:2px;font-size:13px;color:var(--muted);min-height:20px}
  .phase b{color:var(--coffee)}
  .steps{margin-top:18px;text-align:left}
  .step{display:flex;gap:12px;align-items:flex-start;padding:11px 6px;border-radius:14px;opacity:.5;transition:opacity .3s,background .3s}
  .step.active{opacity:1;background:var(--surface-2)}
  .step.done{opacity:.85}
  .step .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--coffee);flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--coffee);font-weight:700;margin-top:1px}
  .step.done .dot{background:var(--good);border-color:var(--good);color:#fff}
  .step.active .dot{background:var(--coffee);color:#fff}
  .step .st{flex:1}
  .step .st b{font-size:13px;display:block}
  .step .st span{font-size:11px;color:var(--muted)}
  .step .sd{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
  .actions{display:flex;gap:12px;margin-top:20px}
  .btn{flex:1;height:50px;border-radius:var(--radius-ctl);border:0;font-size:14px;font-weight:600;cursor:pointer}
  .btn.primary{background:var(--coffee);color:#fff}
  .btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--muted)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .donepanel{display:none;text-align:center;padding:8px 0 4px}
  .donepanel .seal{width:72px;height:72px;margin:6px auto 10px;border-radius:50%;background:var(--good);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(79,125,93,.4)}
  .donepanel .seal svg{width:34px;height:34px;fill:#fff}
  .donepanel h2{font-size:20px;font-weight:700}
  .donepanel p{margin-top:6px;font-size:13px;color:var(--muted)}
  .minibar{display:none;position:absolute;left:14px;right:14px;bottom:22px;background:var(--coffee-deep);color:#fff;border-radius:18px;padding:12px 16px;align-items:center;gap:12px;box-shadow:0 10px 28px rgba(36,26,18,.4);z-index:30}
  .minibar.show{display:flex}
  .minibar .mb{flex:1}
  .minibar .mb b{display:block;font-size:12px}
  .minibar .mb span{font-size:11px;opacity:.75;font-variant-numeric:tabular-nums}
  .minibar .track{height:4px;border-radius:2px;background:rgba(255,255,255,.25);margin-top:6px;overflow:hidden}
  .minibar .tfill{height:100%;background:var(--crema);width:0%}
  .minibar button{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:10px;padding:8px 12px;font-size:12px;cursor:pointer}
  .mask{position:absolute;inset:0;background:rgba(36,26,18,.45);display:none;align-items:center;justify-content:center;z-index:50;border-radius:34px}
  .mask.show{display:flex}
  @media (max-width:480px){.mask{border-radius:0}}
  .dialog{background:var(--surface);border-radius:20px;padding:22px 20px;width:78%;text-align:center}
  .dialog h3{font-size:16px;font-weight:700}
  .dialog p{margin-top:8px;font-size:13px;color:var(--muted);line-height:1.6}
  .dialog .dact{display:flex;gap:10px;margin-top:18px}
  .dialog .dact .btn{height:44px}
  .dialog .dangerbtn{flex:1;height:44px;border-radius:14px;border:0;background:var(--danger);color:#fff;font-weight:600;cursor:pointer}
  .homebar{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:rgba(46,32,24,.4);z-index:40}
  @media (prefers-reduced-motion: reduce){
    .pourist .stream{animation:none;opacity:.85}
    .step,.liquid{transition:none}
    .donepanel .seal{box-shadow:none}
  }
</style>
</head>
<body>
<div class="phone">
  <div class="notch"></div>
  <div class="screen" id="screen">
    <div class="statusbar"><span>08:12</span><span>▮▮▮ 5G</span></div>
    <div class="appbar"><span class="ttl">慢 冲 台</span></div>
    <div class="scroll">
      <div class="brewcard" id="brewCard">
        <div class="bean"></div>
        <h1>耶加雪菲 · 冰手冲</h1>
        <p class="meta">15g 粉 · 注水 135g · 三段式 · 约 2 分 15 秒</p>
        <div class="vessel" id="vessel">
          <div class="pourist"><div class="stream"></div></div>
          <div class="cup"><div class="liquid" id="liquid"></div></div>
        </div>
        <div class="bigclock" id="clock">2:15</div>
        <div class="phase" id="phaseLine">准备就绪，点击下方「开始冲煮」</div>
      </div>
      <div class="steps" id="steps">
        <div class="step" data-p="0"><div class="dot">1</div><div class="st"><b>闷蒸</b><span>小水流打湿粉床，排出气体</span></div><div class="sd">0:30</div></div>
        <div class="step" data-p="1"><div class="dot">2</div><div class="st"><b>第一段注水</b><span>中心画圈至 90g</span></div><div class="sd">0:45</div></div>
        <div class="step" data-p="2"><div class="dot">3</div><div class="st"><b>第二段注水</b><span>慢速补至 135g</span></div><div class="sd">1:00</div></div>
      </div>
      <div class="actions" id="actions">
        <button class="btn ghost" id="parkBtn" type="button" disabled>放到一边</button>
        <button class="btn primary" id="startBtn" type="button">开始冲煮</button>
        <button class="btn ghost" id="cancelBtn" type="button" disabled>取消</button>
      </div>
      <div class="donepanel" id="donePanel">
        <div class="seal"><svg viewBox="0 0 24 24"><path d="M9.5 16.2 5.3 12l-1.4 1.4 5.6 5.6 12-12-1.4-1.4z"/></svg></div>
        <h2>冲煮完成</h2>
        <p id="doneText">实际用时 2:15 · 移开冰杯，开始享用</p>
        <div class="actions"><button class="btn primary" id="againBtn" type="button">再来一壶</button></div>
      </div>
    </div>
    <div class="minibar" id="minibar">
      <div class="mb"><b>后台冲煮中</b><span id="mbText">剩余 2:15</span>
        <div class="track"><div class="tfill" id="tfill"></div></div>
      </div>
      <button id="backBtn" type="button">回到前台</button>
    </div>
    <div class="mask" id="mask">
      <div class="dialog">
        <h3>取消这次冲煮？</h3>
        <p>计时与进度会被清空，<br>需要重新开始三段注水。</p>
        <div class="dact">
          <button class="btn ghost" id="keepBtn" type="button">再想想</button>
          <button class="dangerbtn" id="sureBtn" type="button">确认取消</button>
        </div>
      </div>
    </div>
    <div class="homebar"></div>
  </div>
</div>
<script>
(function(){
  var TOTAL=135,PHASES=[{name:"闷蒸",to:30},{name:"第一段注水",to:75},{name:"第二段注水",to:135}];
  var elapsed=0,timer=null,parked=false;
  function $(id){return document.getElementById(id)}
  function fmt(s){var m=Math.floor(s/60),ss=Math.floor(s%60);return m+":"+(ss<10?"0":"")+ss}
  function phaseOf(t){for(var i=0;i<PHASES.length;i++){if(t<PHASES[i].to)return i}return PHASES.length}
  function render(){
    var left=TOTAL-elapsed;
    $("clock").textContent=fmt(Math.max(0,left));
    $("mbText").textContent="剩余 "+fmt(Math.max(0,left));
    $("tfill").style.width=(elapsed/TOTAL*100)+"%";
    $("liquid").style.height=(elapsed/TOTAL*88)+"%";
    var steps=document.querySelectorAll(".step");
    var p=phaseOf(elapsed);
    for(var i=0;i<steps.length;i++){
      var el=steps[i];
      el.className="step"+(i<p?" done":(i===p?" active":""));
      if(i<p)el.querySelector(".dot").textContent="✓";else el.querySelector(".dot").textContent=i+1;
    }
    if(elapsed>=TOTAL){
      $("phaseLine").innerHTML="正在完成，可以移开分享壶";
      $("vessel").className="vessel";
    }else if(p<PHASES.length){
      var segStart=p===0?0:PHASES[p-1].to;
      $("phaseLine").innerHTML="当前步骤 <b>"+PHASES[p].name+"</b> · 本段还剩 "+fmt(PHASES[p].to-elapsed);
      $("vessel").className="vessel pouring";
    }
  }
  function finish(){
    clearInterval(timer);timer=null;
    $("brewCard").style.display="none";
    $("steps").style.display="none";
    $("actions").style.display="none";
    $("doneText").textContent="实际用时 "+fmt(elapsed)+" · 移开冰杯，开始享用";
    $("donePanel").style.display="block";
    $("minibar").className="minibar";
  }
  function tick(){
    elapsed+=1;
    if(elapsed>=TOTAL){elapsed=TOTAL;render();finish();return}
    render();
  }
  function start(){
    if(timer)return;
    timer=setInterval(tick,1000);
    $("startBtn").textContent="冲煮中…";
    $("startBtn").disabled=true;
    $("parkBtn").disabled=false;
    $("cancelBtn").disabled=false;
    render();
  }
  function reset(){
    clearInterval(timer);timer=null;elapsed=0;parked=false;
    $("brewCard").style.display="block";
    $("steps").style.display="block";
    $("actions").style.display="flex";
    $("donePanel").style.display="none";
    $("minibar").className="minibar";
    $("startBtn").textContent="开始冲煮";
    $("startBtn").disabled=false;
    $("parkBtn").disabled=true;
    $("cancelBtn").disabled=true;
    $("phaseLine").textContent="准备就绪，点击下方「开始冲煮」";
    render();
  }
  $("startBtn").addEventListener("click",start);
  $("againBtn").addEventListener("click",reset);
  $("parkBtn").addEventListener("click",function(){
    if(!timer)return;
    parked=true;
    $("minibar").className="minibar show";
    document.querySelector(".scroll").style.opacity=".35";
  });
  $("backBtn").addEventListener("click",function(){
    parked=false;
    $("minibar").className="minibar";
    document.querySelector(".scroll").style.opacity="1";
  });
  $("cancelBtn").addEventListener("click",function(){$("mask").className="mask show"});
  $("keepBtn").addEventListener("click",function(){$("mask").className="mask"});
  $("sureBtn").addEventListener("click",function(){$("mask").className="mask";reset()});
  render();
})();
</script>
</body>
</html>
