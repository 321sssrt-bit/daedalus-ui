<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>抱朴堂文库 · 馆藏目录 — 内容目录</title>
<style>
  :root {
    --page: #241B12;
    --surface: #33261A;
    --spine: #3F2F1F;
    --spine-hover: #4B3825;
    --paper: #F4EAD3;
    --ink: #2B2118;
    --text: #EDE3CE;
    --muted: #A99070;
    --accent: #C99345;
    --line: #5C452E;
    --ok: #9DB489;
    --out: #C4683F;
    --lip: #191009;
    --serif: Georgia, "Songti SC", "STSong", "SimSun", serif;
    --sans: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--page);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.7;
  }

  .wrap {
    max-width: 1160px;
    margin: 0 auto;
    padding: 40px 32px 56px;
  }

  /* ---------- 顶栏 ---------- */
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 24px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 26px;
  }

  .brand { display: flex; align-items: center; gap: 14px; }

  .brand .mark {
    width: 36px;
    height: 36px;
    color: var(--accent);
    flex: none;
  }

  .brand h1 {
    font-family: var(--serif);
    font-size: 24px;
    font-weight: 600;
    letter-spacing: 2px;
    margin: 0;
    line-height: 1.3;
  }

  .brand p {
    margin: 3px 0 0;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 1px;
  }

  .tools { display: flex; align-items: center; gap: 14px; }

  .count {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
  }

  .search-wrap { position: relative; }

  .search-wrap svg {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    width: 14px;
    height: 14px;
    color: var(--muted);
    pointer-events: none;
  }

  .search {
    width: 260px;
    height: 38px;
    padding: 0 12px 0 34px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--text);
    font-size: 13px;
    font-family: var(--sans);
    transition: border-color 160ms ease, box-shadow 160ms ease;
  }

  .search::placeholder { color: var(--muted); }

  .search:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(201, 147, 69, 0.25);
  }

  /* ---------- 主体两栏 ---------- */
  .layout {
    display: grid;
    grid-template-columns: 216px minmax(0, 1fr);
    gap: 28px;
    align-items: start;
  }

  .rail { position: sticky; top: 32px; }

  .rail h2 {
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 3px;
    margin: 0 0 10px;
    font-weight: 500;
  }

  .cat-btn {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    height: 40px;
    padding: 0 12px;
    margin-bottom: 4px;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 6px;
    color: var(--text);
    font-size: 14px;
    font-family: var(--sans);
    cursor: pointer;
    transition: background 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
  }

  .cat-btn:hover { background: var(--surface); }

  .cat-btn:focus-visible {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(201, 147, 69, 0.25);
  }

  .cat-btn.active {
    background: var(--surface);
    border-color: var(--line);
    box-shadow: inset 3px 0 0 var(--accent);
  }

  .cat-btn .n {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
  }

  .rail-note {
    margin-top: 22px;
    padding: 14px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
  }

  .rail-note h3 {
    margin: 0 0 6px;
    font-size: 13px;
    color: var(--accent);
    font-weight: 600;
  }

  .rail-note p {
    margin: 0;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.8;
  }

  /* ---------- 书架板 ---------- */
  .shelf-head {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
  }

  .shelf-head h2 {
    font-family: var(--serif);
    font-size: 16px;
    font-weight: 600;
    margin: 0;
    white-space: nowrap;
  }

  .shelf-rule { flex: 1; height: 1px; background: var(--line); }

  .shelf-hint { font-size: 12px; color: var(--muted); white-space: nowrap; }

  .shelf-list {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px;
    box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.35);
  }

  /* ---------- 书脊条目 ---------- */
  .spine {
    position: relative;
    margin-bottom: 10px;
    background: var(--spine);
    border-radius: 6px;
    box-shadow: 0 3px 0 var(--lip);
    cursor: pointer;
    transition: transform 160ms ease, background 160ms ease, box-shadow 160ms ease;
    animation: rowIn 260ms ease-out both;
  }

  .spine:last-child { margin-bottom: 0; }

  .spine:hover {
    transform: translateY(-2px);
    background: var(--spine-hover);
    box-shadow: 0 5px 0 var(--lip), 0 10px 18px rgba(0, 0, 0, 0.35);
  }

  .spine-row {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto 20px;
    gap: 14px;
    align-items: center;
    min-height: 74px;
    padding: 12px 16px 12px 22px;
  }

  .band {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 6px;
    background: var(--band);
    border-radius: 6px 0 0 6px;
    transition: width 160ms ease;
  }

  .spine:hover .band { width: 8px; }

  .callno {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    border: 1px dashed var(--line);
    border-radius: 4px;
    padding: 4px 8px;
    white-space: nowrap;
  }

  .spine-title {
    font-family: var(--serif);
    font-size: 17px;
    font-weight: 600;
    margin: 0 0 4px;
    line-height: 1.4;
  }

  .flag {
    display: inline-block;
    font-family: var(--sans);
    font-size: 11px;
    font-weight: 400;
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 3px;
    padding: 0 6px;
    margin-left: 8px;
    vertical-align: 2px;
    letter-spacing: 1px;
  }

  .spine-meta {
    margin: 0;
    font-size: 13px;
    color: var(--muted);
  }

  .status {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
  }

  .status i {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    flex: none;
  }

  .st-on i { background: var(--ok); }
  .st-off i { background: var(--out); }

  .chev {
    width: 14px;
    height: 14px;
    color: var(--muted);
    transition: transform 200ms ease;
  }

  .spine.open .chev { transform: rotate(90deg); }

  .spine:focus-visible {
    outline: none;
    box-shadow: 0 0 0 3px rgba(201, 147, 69, 0.4), 0 3px 0 var(--lip);
  }

  /* ---------- 抽出式摘要卡 ---------- */
  .leaf {
    display: none;
    margin: 2px 4px 4px 12px;
    background: var(--paper);
    color: var(--ink);
    border-radius: 6px;
    border-left: 4px solid var(--accent);
    padding: 18px 20px 16px;
  }

  .spine.open .leaf {
    display: block;
    animation: leafIn 220ms ease-out;
  }

  .abs {
    margin: 0;
    font-size: 14px;
    line-height: 1.9;
  }

  .kw-row {
    margin-top: 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .kw {
    font-size: 12px;
    border: 1px solid rgba(43, 33, 24, 0.35);
    border-radius: 999px;
    padding: 2px 10px;
    opacity: 0.85;
  }

  .leaf-foot {
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px dashed rgba(43, 33, 24, 0.3);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .loc { font-size: 12px; color: rgba(43, 33, 24, 0.75); }

  .reserve {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 34px;
    padding: 0 16px;
    background: transparent;
    border: 1px solid var(--ink);
    border-radius: 6px;
    color: var(--ink);
    font-size: 13px;
    font-family: var(--sans);
    cursor: pointer;
    transition: background 140ms ease, color 140ms ease;
  }

  .reserve:hover { background: var(--ink); color: var(--paper); }

  .reserve:focus-visible {
    outline: none;
    box-shadow: 0 0 0 3px rgba(43, 33, 24, 0.3);
  }

  .reserve svg { width: 13px; height: 13px; display: none; }
  .reserve.reserved { background: var(--ink); color: var(--paper); }
  .reserve.reserved svg { display: block; }

  /* ---------- 空态 ---------- */
  .empty {
    padding: 44px 20px;
    text-align: center;
    color: var(--muted);
    border: 1px dashed var(--line);
    border-radius: 8px;
  }

  .empty h3 {
    font-family: var(--serif);
    font-size: 16px;
    margin: 0 0 6px;
    color: var(--text);
  }

  .empty p { margin: 0; font-size: 13px; }

  /* ---------- 页脚 ---------- */
  .colophon {
    margin-top: 32px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    font-size: 12px;
    color: var(--muted);
  }

  @keyframes rowIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: none; }
  }

  @keyframes leafIn {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: none; }
  }

  /* ---------- 响应式 ---------- */
  @media (max-width: 900px) {
    .wrap { padding: 24px 16px 40px; }

    .topbar {
      flex-direction: column;
      align-items: stretch;
      gap: 14px;
    }

    .tools { width: 100%; }
    .search { width: 100%; }
    .count { margin-left: auto; }

    .layout { grid-template-columns: 1fr; gap: 18px; }
    .rail { position: static; }

    .cats { display: flex; flex-wrap: wrap; gap: 8px; }

    .cat-btn {
      width: auto;
      height: 36px;
      margin-bottom: 0;
      padding: 0 12px;
    }

    .cat-btn.active { box-shadow: inset 0 -2px 0 var(--accent); }

    .rail-note { margin-top: 14px; }

    .spine-row {
      grid-template-columns: auto minmax(0, 1fr) 16px;
      gap: 10px;
      padding: 12px 14px 12px 18px;
    }

    .status { display: none; }
    .leaf { margin: 2px 2px 4px 8px; }
  }

  /* ---------- 减少动态 ---------- */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation: none !important;
      transition: none !important;
    }

    .spine:hover { transform: none; }
    .spine.open .chev { transform: rotate(90deg); }
  }
</style>
</head>
<body>
<div class="wrap" id="app">
  <header class="topbar">
    <div class="brand">
      <svg class="mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M4 3h13a3 3 0 0 1 3 3v15H7a3 3 0 0 1-3-3V3z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M8 7.5h8M8 11h8M8 14.5h5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <div>
        <h1>抱朴堂文库</h1>
        <p>馆藏目录 · 第二编 · 纸本文献</p>
      </div>
    </div>
    <div class="tools">
      <span class="count" id="result-count">共 8 条</span>
      <div class="search-wrap">
        <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <circle cx="7" cy="7" r="4.4" stroke="currentColor" stroke-width="1.5"/>
          <path d="M10.4 10.4 14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <input class="search" id="search-input" type="search" placeholder="检索书名、作者或来源" aria-label="检索书名、作者或来源">
      </div>
    </div>
  </header>

  <main class="layout">
    <aside class="rail">
      <h2>分类</h2>
      <div class="cats" id="cat-list" role="group" aria-label="按分类筛选"></div>
      <div class="rail-note">
        <h3>索书号说明</h3>
        <p>首字母为分类号，斜线后为种次号；标注「新入藏」者为近一年到馆文献，优先陈列于一层新书架。</p>
      </div>
    </aside>

    <section class="shelf">
      <div class="shelf-head">
        <h2 id="shelf-title">全部在架条目</h2>
        <span class="shelf-rule"></span>
        <span class="shelf-hint">点击书脊展开摘要</span>
      </div>
      <div class="shelf-list" id="shelf-list"></div>
      <div class="empty" id="empty-state" hidden>
        <h3>未检到条目</h3>
        <p>当前分类与检索词下没有文献，请换个关键词或切回「全部」。</p>
      </div>
    </section>
  </main>

  <footer class="colophon">
    <span>抱朴堂文库藏书索引 · 丙午年仲秋重订</span>
    <span>开馆 9:00 – 21:00 · 周一闭馆整架</span>
  </footer>
</div>

<script>
(function () {
  var CATS = [
    { key: 'all', name: '全部' },
    { key: 'suibi', name: '随笔' },
    { key: 'xiaoshuo', name: '小说' },
    { key: 'pinglun', name: '评论' },
    { key: 'fangtan', name: '访谈' },
    { key: 'yizhu', name: '译注' }
  ];

  var BAND = {
    suibi: '#B98A44',
    xiaoshuo: '#9C4A32',
    pinglun: '#71603C',
    fangtan: '#96684B',
    yizhu: '#54604F'
  };

  var ITEMS = [
    {
      id: 'a01', call: 'I267/1145', title: '夜班地铁与手抄本', author: '沈其南',
      src: '《书城》2024 年第 7 期', cat: 'suibi', loc: '二层东架 07 格', state: 'on', fresh: false,
      abs: '四十二天夜班地铁上的连续观察：抄写生僻字的乘客、用包装袋练书法的退休教师、把账本写成小说的会计。作者主张把通勤还给缓慢的阅读，文末附七幅手绘车厢图。',
      kw: ['城市观察', '夜间书写', '通勤人类学']
    },
    {
      id: 'a02', call: 'I247.7/908', title: '纸鹞断线那天', author: '陆未眠',
      src: '《收获》2023 年第 5 期', cat: 'xiaoshuo', loc: '三层南架 02 格', state: 'off', fresh: false,
      abs: '南方县城，风筝匠人周晚秋在儿子离家当日扎完最后一只双鹞。小说以四种视角回溯一家人三十年的亏欠与和解，结尾处断线的鹞子落在旧戏台上。',
      kw: ['县城叙事', '家庭', '风筝']
    },
    {
      id: 'a03', call: 'G206/233', title: '算法里的乡愁', author: '纪逢春',
      src: '《读书》2024 年第 2 期', cat: 'pinglun', loc: '一层北架 11 格', state: 'on', fresh: false,
      abs: '从外卖骑手的轨迹回放讲到古镇游客的滤镜打卡，本文追问：当记忆被推荐系统预先塑形，「回不去的故乡」究竟是经验还是模板。末节给出三种抵抗式记录法。',
      kw: ['媒介批评', '记忆', '算法']
    },
    {
      id: 'a04', call: 'I267/1102', title: '修表铺的最后一年', author: '苏半夏',
      src: '《散文》2023 年第 11 期', cat: 'suibi', loc: '二层东架 09 格', state: 'on', fresh: false,
      abs: '老街修表铺拆迁前十二个月的日记体散文。瑞士机芯、上海牌老表与铺主的口头禅交错出现，修理时间与时间被修理互为隐喻，收束于最后一块慢五分钟的海鸥表。',
      kw: ['旧城', '手艺人', '时间']
    },
    {
      id: 'a05', call: 'K825.6/517', title: '在噪声中写作', author: '受访：祁山；整理：贺临',
      src: '《单读》第 36 辑', cat: 'fangtan', loc: '四层西架 05 格', state: 'on', fresh: false,
      abs: '作家祁山谈菜市场楼上的写作间、每天三小时的断网时段与「先用耳朵改稿」的习惯。访谈涉及其新长篇的结构试验，以及他对 AI 续写工具的一票否决。',
      kw: ['写作习惯', '访谈', '长篇']
    },
    {
      id: 'a06', call: 'I552.65/44', title: '缓慢读者的信', author: '[葡] 费尔南多·佩索阿 著；范湉 译',
      src: '译林出版社 2022 年版', cat: 'yizhu', loc: '一层西架 03 格', state: 'off', fresh: true,
      abs: '书信体随笔选译，附译者六千字长注，考证佩索阿虚构异名者之间的「通信规约」。译文保留原信的破折号癖与大小写癖，注释单列一栏以便中英对照。',
      kw: ['佩索阿', '书信', '翻译']
    },
    {
      id: 'a07', call: 'I247.5/661', title: '台风假', author: '郑弛',
      src: '《人民文学》2024 年第 8 期', cat: 'xiaoshuo', loc: '三层南架 06 格', state: 'on', fresh: true,
      abs: '台风过境的三十六小时里，一栋老楼内五户人家各自失守：漏水的书房、被困的快递员、临产的猫。风停之后，所有人都得重新决定留下还是搬走。',
      kw: ['城市灾害', '群像', '中篇']
    },
    {
      id: 'a08', call: 'G239/76', title: '旧书店的定价学', author: '顾一帆',
      src: '澎湃新闻 · 文化课，2024-05-18', cat: 'pinglun', loc: '一层北架 02 格', state: 'on', fresh: false,
      abs: '以三家旧书店为样本，拆解「成色—稀缺—故事」三元定价模型，并讨论网店标价与店谈价之间的信息差。文末附给入门淘书者的十二条还价话术。',
      kw: ['旧书', '定价', '市井经济']
    }
  ];

  var CATNAME = {};
  CATS.forEach(function (c) { CATNAME[c.key] = c.name; });

  var state = { cat: 'all', q: '', open: null, reserved: {} };

  var listEl = document.getElementById('shelf-list');
  var catEl = document.getElementById('cat-list');
  var countEl = document.getElementById('result-count');
  var titleEl = document.getElementById('shelf-title');
  var emptyEl = document.getElementById('empty-state');
  var searchEl = document.getElementById('search-input');

  function match(item) {
    if (state.cat !== 'all' && item.cat !== state.cat) return false;
    if (!state.q) return true;
    var hay = (item.title + ' ' + item.author + ' ' + item.src + ' ' + item.call).toLowerCase();
    return hay.indexOf(state.q) !== -1;
  }

  function renderCats() {
    catEl.innerHTML = CATS.map(function (c) {
      var n = c.key === 'all' ? ITEMS.length : ITEMS.filter(function (i) { return i.cat === c.key; }).length;
      var cls = 'cat-btn' + (state.cat === c.key ? ' active' : '');
      return '<button type="button" class="' + cls + '" data-cat="' + c.key + '" aria-pressed="' + (state.cat === c.key) + '">' +
        '<span>' + c.name + '</span><span class="n">' + n + '</span></button>';
    }).join('');
  }

  function renderList() {
    var rows = ITEMS.filter(match);
    var filtered = state.cat !== 'all' || state.q !== '';
    countEl.textContent = filtered ? ('检到 ' + rows.length + ' 条') : ('共 ' + rows.length + ' 条');
    titleEl.textContent = state.cat === 'all' ? '全部在架条目' : ('「' + CATNAME[state.cat] + '」条目');

    emptyEl.hidden = rows.length !== 0;
    listEl.style.display = rows.length ? '' : 'none';

    listEl.innerHTML = rows.map(function (item, idx) {
      var open = state.open === item.id;
      var reserved = !!state.reserved[item.id];
      var st = item.state === 'on'
        ? '<span class="status st-on"><i></i>在架</span>'
        : '<span class="status st-off"><i></i>借出</span>';
      var flag = item.fresh ? '<span class="flag">新入藏</span>' : '';
      var kw = item.kw.map(function (k) { return '<span class="kw">' + k + '</span>'; }).join('');
      var btn = reserved
        ? '<button type="button" class="reserve reserved" data-reserve="' + item.id + '">' +
          '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8.5l3.2 3L13 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>已入预约单</button>'
        : '<button type="button" class="reserve" data-reserve="' + item.id + '">预约借阅</button>';

      return '<article class="spine' + (open ? ' open' : '') + '" data-id="' + item.id + '" style="--band:' + BAND[item.cat] + ';animation-delay:' + (idx * 30) + 'ms" tabindex="0" aria-expanded="' + open + '">' +
        '<div class="spine-row">' +
          '<span class="band" aria-hidden="true"></span>' +
          '<span class="callno">' + item.call + '</span>' +
          '<div><h3 class="spine-title">' + item.title + flag + '</h3>' +
          '<p class="spine-meta">' + item.author + ' · ' + item.src + ' · ' + CATNAME[item.cat] + '</p></div>' +
          st +
          '<svg class="chev" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M6 4l4 4-4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
        '</div>' +
        '<div class="leaf">' +
          '<p class="abs">' + item.abs + '</p>' +
          '<div class="kw-row">' + kw + '</div>' +
          '<div class="leaf-foot"><span class="loc">馆藏位置：' + item.loc + '</span>' + btn + '</div>' +
        '</div>' +
      '</article>';
    }).join('');
  }

  catEl.addEventListener('click', function (e) {
    var btn = e.target.closest('.cat-btn');
    if (!btn) return;
    state.cat = btn.getAttribute('data-cat');
    renderCats();
    renderList();
  });

  listEl.addEventListener('click', function (e) {
    var res = e.target.closest('.reserve');
    if (res) {
      var rid = res.getAttribute('data-reserve');
      if (state.reserved[rid]) { delete state.reserved[rid]; } else { state.reserved[rid] = true; }
      renderList();
      return;
    }
    var row = e.target.closest('.spine');
    if (!row) return;
    var id = row.getAttribute('data-id');
    state.open = state.open === id ? null : id;
    renderList();
  });

  listEl.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    var row = e.target.closest('.spine');
    if (!row || e.target.closest('.reserve')) return;
    e.preventDefault();
    var id = row.getAttribute('data-id');
    state.open = state.open === id ? null : id;
    renderList();
  });

  searchEl.addEventListener('input', function () {
    state.q = searchEl.value.trim().toLowerCase();
    renderList();
  });

  renderCats();
  renderList();
})();
</script>
</body>
</html>
