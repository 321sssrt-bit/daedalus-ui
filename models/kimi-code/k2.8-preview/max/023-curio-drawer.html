<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>珍玩柜 · 我的收藏</title>
<style>
:root{
  --page:#1d140d;
  --panel:#2a1d12;
  --drawer:#35261a;
  --drawer-2:#2f2216;
  --edge:#4a3623;
  --brass:#c39a55;
  --brass-hi:#e6c887;
  --ink:#ecdfc4;
  --ink-dim:#a58d68;
  --felt:#3f4a33;
  --oxide:#b0462f;
  --gap:14px;
  --radius-card:6px;
  --radius-ctl:3px;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{
  min-height:100vh;
  background-color:var(--page);
  background-image:
    repeating-linear-gradient(90deg, rgba(236,223,196,0.018) 0 2px, transparent 2px 118px),
    repeating-linear-gradient(0deg, rgba(0,0,0,0.16) 0 1px, transparent 1px 3px);
  color:var(--ink);
  font:13px/1.6 system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  padding:24px 16px 40px;
}
.serif{font-family:Georgia,"Times New Roman","Songti SC","STSong","SimSun",serif}
:focus-visible{outline:2px solid var(--brass-hi);outline-offset:2px}
.cabinet{
  max-width:1200px;margin:0 auto;
  background:var(--panel);
  border:1px solid var(--edge);
  border-radius:8px;
  box-shadow:inset 0 0 0 6px #241a10, inset 0 0 0 7px var(--edge), 0 18px 48px rgba(0,0,0,0.5);
  padding:34px 34px 28px;
}
.masthead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;border-bottom:1px solid var(--edge);padding-bottom:16px}
.brand{font-size:28px;letter-spacing:8px;color:var(--brass-hi);font-weight:700}
.brand small{font-size:12px;letter-spacing:2px;color:var(--ink-dim);font-weight:400;margin-left:12px}
.masthead p{color:var(--ink-dim);font-size:12px;margin-top:6px}
.count{font-size:13px;color:var(--brass);text-align:right;line-height:1.7;white-space:nowrap}
.count b{font-family:Georgia,"Times New Roman","Songti SC","SimSun",serif;font-size:22px;color:var(--brass-hi);font-weight:700}
.tabs{display:flex;flex-wrap:wrap;gap:10px;padding:16px 0 18px;border-bottom:1px solid var(--edge)}
.tab{
  display:inline-flex;align-items:center;gap:8px;
  font:inherit;font-size:13px;color:var(--ink-dim);
  background:linear-gradient(180deg,#3a2a1c,#31241a);
  border:1px solid var(--edge);border-radius:var(--radius-ctl);
  box-shadow:inset 0 2px 5px rgba(0,0,0,0.55);
  padding:8px 14px;cursor:pointer;
  transition:color .18s ease, box-shadow .18s ease, transform .18s ease;
}
.tab:hover{color:var(--ink)}
.tab.active{
  color:#241a10;font-weight:600;
  background:linear-gradient(180deg,var(--brass-hi),var(--brass));
  border-color:#8a6a33;
  box-shadow:0 2px 0 #17100a, inset 0 1px 0 rgba(255,255,255,0.25);
}
.tab:active{transform:translateY(1px)}
.tab .cnt{font-size:11px;opacity:.78;font-variant-numeric:tabular-nums}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;box-shadow:0 0 0 2px rgba(0,0,0,0.35);flex:none}
.dot-all{background:#c9b489}
.dot-tool{background:#c39a55}
.dot-article{background:#a8b07f}
.dot-inspiration{background:#c07a52}
.dot-media{background:#7f97a3}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(216px,1fr));gap:var(--gap);padding-top:20px}
.card{
  background:linear-gradient(180deg,var(--drawer),var(--drawer-2));
  border:1px solid var(--edge);
  border-radius:var(--radius-card);
  box-shadow:inset 0 1px 0 rgba(236,223,196,0.05), inset 0 -6px 12px rgba(0,0,0,0.28), 0 3px 8px rgba(0,0,0,0.35);
  padding:14px;display:flex;flex-direction:column;gap:10px;min-height:158px;
  animation:cardIn .34s ease both;animation-delay:var(--d,0ms);
  transition:border-color .18s ease, transform .18s ease;
}
.card:hover{border-color:#6b5138;transform:translateY(-2px)}
.card.leaving{transition:transform .3s ease-in, opacity .3s ease-in, filter .3s ease-in;transform:scale(.84) translateY(12px);opacity:0;filter:brightness(.55)}
.card-top{display:flex;align-items:center;justify-content:space-between}
.tag{display:inline-flex;align-items:center;gap:6px;background:var(--felt);border:1px solid #54614a;color:var(--brass-hi);font-size:11px;letter-spacing:2px;padding:3px 8px;border-radius:2px}
.take{background:none;border:none;color:var(--ink-dim);font:inherit;font-size:12px;cursor:pointer;padding:2px 6px;border-radius:var(--radius-ctl)}
.take:hover{color:var(--oxide)}
.card h3{font-family:Georgia,"Times New Roman","Songti SC","SimSun",serif;font-size:16.5px;line-height:1.35;color:var(--ink);font-weight:700}
.card p{font-size:12.5px;color:var(--ink-dim);line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;border-top:1px dashed var(--edge);padding-top:8px;font-size:11px;color:#8a7355}
.card-foot .no{font-variant-numeric:tabular-nums;letter-spacing:1px}
.empty{border:1px dashed var(--brass);border-radius:var(--radius-card);margin-top:20px;padding:44px 24px;text-align:center;color:var(--ink-dim)}
.empty .big{font-size:19px;letter-spacing:4px;color:var(--brass-hi);margin-bottom:8px}
.empty p{max-width:34em;margin:0 auto 18px}
.btn-brass{
  font:inherit;font-size:13px;font-weight:600;color:#241a10;
  background:linear-gradient(180deg,var(--brass-hi),var(--brass));
  border:1px solid #8a6a33;border-radius:var(--radius-ctl);
  padding:8px 18px;cursor:pointer;box-shadow:0 2px 0 #17100a;
}
.btn-brass:hover{filter:brightness(1.06)}
.btn-brass:active{transform:translateY(1px);box-shadow:0 1px 0 #17100a}
.foot{margin-top:22px;border-top:1px solid var(--edge);padding-top:12px;font-size:11.5px;color:#8a7355;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:30;
  display:flex;align-items:center;gap:14px;
  background:#241a10;border:1px solid var(--brass);border-radius:6px;padding:10px 16px;
  box-shadow:0 10px 28px rgba(0,0,0,0.55);
  animation:toastIn .25s ease both;
}
.toast span{font-size:13px;color:var(--ink)}
.toast button{background:none;border:none;color:var(--brass-hi);font:inherit;font-size:13px;cursor:pointer;border-bottom:1px solid var(--brass);padding:0 1px}
.toast button:hover{color:#fff}
@keyframes cardIn{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
@media (max-width:900px){
  body{padding:14px 10px 28px}
  .cabinet{padding:22px 18px 20px}
  .masthead{flex-direction:column;align-items:flex-start;gap:8px}
  .brand{font-size:24px;letter-spacing:6px}
  .count{text-align:left}
  .grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
}
@media (max-width:560px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(158px,1fr))}
  .tabs{gap:8px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div class="cabinet">
  <header class="masthead">
    <div>
      <div class="brand serif">珍玩柜<small>CURIO DRAWER</small></div>
      <p>自己攒下来的东西，一格一件，按进柜的先后排号。</p>
    </div>
    <div class="count">现存 <b id="totalCount">12</b> 件 · 柜额 12 格</div>
  </header>

  <div class="tabs" role="group" aria-label="收藏分类">
    <button type="button" class="tab active" data-cat="all"><i class="dot dot-all" aria-hidden="true"></i>全部<span class="cnt">12</span></button>
    <button type="button" class="tab" data-cat="tool"><i class="dot dot-tool" aria-hidden="true"></i>工具<span class="cnt">3</span></button>
    <button type="button" class="tab" data-cat="article"><i class="dot dot-article" aria-hidden="true"></i>文章<span class="cnt">3</span></button>
    <button type="button" class="tab" data-cat="inspiration"><i class="dot dot-inspiration" aria-hidden="true"></i>灵感<span class="cnt">3</span></button>
    <button type="button" class="tab" data-cat="media"><i class="dot dot-media" aria-hidden="true"></i>影音<span class="cnt">3</span></button>
  </div>

  <main>
    <div class="grid" id="grid"></div>
    <section class="empty" id="emptyPanel" hidden>
      <div class="big serif">这格抽屉已经腾空</div>
      <p>取出的物件没有丢，去别的分类转转，或者把它们原样放回柜子。</p>
      <button type="button" class="btn-brass" id="emptyReset">放回全部 12 件</button>
    </section>
  </main>

  <footer class="foot">
    <span>格号按收进柜子的先后编排，取出后 4.5 秒内可放回一件。</span>
    <span>本柜只存在当前页面，刷新即复原。</span>
  </footer>
</div>

<div class="toast" id="toast" role="status" hidden>
  <span id="toastMsg"></span>
  <button type="button" id="toastUndo">放回一件</button>
</div>

<script>
(function(){
  "use strict";
  var CATS={
    tool:{name:"工具"},
    article:{name:"文章"},
    inspiration:{name:"灵感"},
    media:{name:"影音"}
  };
  var SEED=[
    {no:1, cat:"tool", title:"正则速查表", note:"分组、断言、量词一页收齐，随查随用，附常见坑位批注。", date:"2025-11-02"},
    {no:2, cat:"article", title:"中文排版五律", note:"标点挤压、行长与避头尾的实际测量案例，每条都有对照图。", date:"2025-10-14"},
    {no:3, cat:"inspiration", title:"瑞士铁路时刻表", note:"网格严丝合缝，时刻本身就是图形，版式取样的范本。", date:"2025-09-27"},
    {no:4, cat:"media", title:"合成器入门课", note:"十二集短视频，从振荡器原理一路讲到音色设计实操。", date:"2025-12-30"},
    {no:5, cat:"tool", title:"SVG 路径工坊", note:"贝塞尔控制点可视化微调，导出前自动精简 path 节点。", date:"2025-12-18"},
    {no:6, cat:"article", title:"暗色界面十二则", note:"对比度分级与提亮顺序的实验笔记，含失败反例截图。", date:"2025-12-03"},
    {no:7, cat:"inspiration", title:"老式收银机面板", note:"铜键排布与拟物纹理的取材地，按键阻尼都值得抄。", date:"2025-11-25"},
    {no:8, cat:"media", title:"雨声白噪轨", note:"四十分钟无缝循环的雨声，写作时垫在底下正好。", date:"2026-01-15"},
    {no:9, cat:"tool", title:"图压小闸", note:"本地批量转 WebP，画质滑杆即时预览，不往外网传图。", date:"2026-01-09"},
    {no:10, cat:"article", title:"费茨定律实例集", note:"边缘目标与大按钮的实测数据整理，附实验脚本。", date:"2026-01-21"},
    {no:11, cat:"inspiration", title:"植物图鉴版画", note:"铜版插画的线条密度参考，叶脉排线尤其耐看。", date:"2026-02-06"},
    {no:12, cat:"media", title:"字体排印纪录片", note:"铸字车间与数字字体交接的那段历史，值得二刷。", date:"2026-02-18"}
  ];
  var items=SEED.slice();
  var currentCat="all";
  var lastRemoved=null;
  var toastTimer=null;
  var REDUCED=window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var grid=document.getElementById("grid");
  var emptyPanel=document.getElementById("emptyPanel");
  var totalCount=document.getElementById("totalCount");
  var toast=document.getElementById("toast");
  var toastMsg=document.getElementById("toastMsg");
  var toastUndo=document.getElementById("toastUndo");
  var tabs=Array.prototype.slice.call(document.querySelectorAll(".tab"));

  function pad2(n){return (n<10?"0":"")+n;}
  function catCount(cat){
    if(cat==="all"){return items.length;}
    var c=0;
    for(var i=0;i<items.length;i++){if(items[i].cat===cat){c++;}}
    return c;
  }
  function updateTabs(){
    for(var i=0;i<tabs.length;i++){
      var btn=tabs[i];
      var cat=btn.getAttribute("data-cat");
      btn.querySelector(".cnt").textContent=catCount(cat);
      btn.classList.toggle("active",cat===currentCat);
    }
  }
  function makeCard(item,i){
    var card=document.createElement("article");
    card.className="card";
    card.style.setProperty("--d",(REDUCED?0:i*28)+"ms");

    var top=document.createElement("div");
    top.className="card-top";
    var tag=document.createElement("span");
    tag.className="tag";
    var dot=document.createElement("i");
    dot.className="dot dot-"+item.cat;
    dot.setAttribute("aria-hidden","true");
    tag.appendChild(dot);
    tag.appendChild(document.createTextNode(CATS[item.cat].name));
    var take=document.createElement("button");
    take.className="take";
    take.type="button";
    take.textContent="× 取出";
    take.setAttribute("aria-label","取出《"+item.title+"》");
    take.setAttribute("data-id",item.no);
    top.appendChild(tag);
    top.appendChild(take);

    var h=document.createElement("h3");
    h.textContent=item.title;
    var p=document.createElement("p");
    p.textContent=item.note;

    var foot=document.createElement("div");
    foot.className="card-foot";
    var no=document.createElement("span");
    no.className="no";
    no.textContent="格号 "+pad2(item.no);
    var time=document.createElement("time");
    time.textContent=item.date;
    time.setAttribute("datetime",item.date);
    foot.appendChild(no);
    foot.appendChild(time);

    card.appendChild(top);
    card.appendChild(h);
    card.appendChild(p);
    card.appendChild(foot);
    return card;
  }
  function render(){
    totalCount.textContent=items.length;
    updateTabs();
    var list=currentCat==="all"?items:items.filter(function(it){return it.cat===currentCat;});
    grid.textContent="";
    for(var i=0;i<list.length;i++){grid.appendChild(makeCard(list[i],i));}
    var isEmpty=list.length===0;
    emptyPanel.hidden=!isEmpty;
    grid.hidden=isEmpty;
  }
  function hideToast(){
    toast.hidden=true;
    if(toastTimer){clearTimeout(toastTimer);toastTimer=null;}
  }
  function showToast(item){
    toastMsg.textContent="已取出《"+item.title+"》，格号 "+pad2(item.no)+" 空了出来";
    toast.hidden=false;
    if(toastTimer){clearTimeout(toastTimer);}
    toastTimer=setTimeout(hideToast,4500);
  }
  grid.addEventListener("click",function(e){
    var btn=e.target.closest?e.target.closest(".take"):null;
    if(!btn){return;}
    var id=Number(btn.getAttribute("data-id"));
    var idx=-1;
    for(var i=0;i<items.length;i++){if(items[i].no===id){idx=i;break;}}
    if(idx<0){return;}
    var item=items[idx];
    var card=btn.closest?btn.closest(".card"):null;
    lastRemoved={item:item,index:idx};
    if(card&&!REDUCED){
      card.classList.add("leaving");
      setTimeout(function(){
        items.splice(idx,1);
        render();
        showToast(item);
      },300);
    }else{
      items.splice(idx,1);
      render();
      showToast(item);
    }
  });
  for(var t=0;t<tabs.length;t++){
    tabs[t].addEventListener("click",function(){
      currentCat=this.getAttribute("data-cat");
      render();
    });
  }
  toastUndo.addEventListener("click",function(){
    if(!lastRemoved){return;}
    var idx=Math.min(lastRemoved.index,items.length);
    items.splice(idx,0,lastRemoved.item);
    lastRemoved=null;
    hideToast();
    render();
  });
  document.getElementById("emptyReset").addEventListener("click",function(){
    items=SEED.slice();
    lastRemoved=null;
    hideToast();
    render();
  });
  render();
})();
</script>
</body>
</html>
