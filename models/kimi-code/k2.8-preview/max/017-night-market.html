<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>灯河夜市 · 今晚的摊位都亮着</title>
<style>
  :root {
    --night: #0b0714;
    --stall: #17102a;
    --stall-deep: #120b21;
    --stall-edge: #2c1f4a;
    --neon-pink: #ff2d9a;
    --neon-cyan: #22e6ff;
    --neon-amber: #ffc24b;
    --neon-mint: #2affc4;
    --text: #f5f0ff;
    --muted: #9a8fc0;
    --radius-card: 14px;
    --radius-btn: 999px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { background: var(--night); }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
    color: var(--text);
    min-height: 100vh;
    background:
      radial-gradient(900px 480px at 12% -8%, rgba(255, 45, 154, .16), transparent 62%),
      radial-gradient(820px 460px at 88% 4%, rgba(34, 230, 255, .13), transparent 60%),
      radial-gradient(760px 520px at 50% 108%, rgba(255, 194, 75, .10), transparent 64%),
      var(--night);
    line-height: 1.5;
  }

  button { font: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible {
    outline: 2px solid var(--neon-cyan);
    outline-offset: 2px;
  }

  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 24px; }

  /* ===== 页眉 ===== */
  .site-header {
    border-bottom: 1px solid var(--stall-edge);
    background: rgba(11, 7, 20, .82);
    position: sticky;
    top: 0;
    z-index: 30;
    backdrop-filter: blur(6px);
  }
  .header-inner {
    display: flex;
    align-items: center;
    gap: 20px;
    height: 72px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
  }
  .brand-mark {
    width: 34px;
    height: 34px;
    flex: none;
    filter: drop-shadow(0 0 6px rgba(255, 194, 75, .8));
  }
  .brand-name {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: .14em;
    color: var(--neon-amber);
    text-shadow: 0 0 10px rgba(255, 194, 75, .75), 0 0 26px rgba(255, 45, 154, .45);
    white-space: nowrap;
    animation: signFlicker 5.2s infinite;
  }
  .brand-sub {
    font-size: 12px;
    color: var(--muted);
    letter-spacing: .3em;
    white-space: nowrap;
  }
  .header-search {
    flex: 1;
    max-width: 380px;
    margin-left: auto;
  }
  .header-search input {
    width: 100%;
    height: 40px;
    border-radius: var(--radius-btn);
    border: 1px solid var(--stall-edge);
    background: var(--stall-deep);
    color: var(--text);
    padding: 0 18px;
    font-size: 14px;
  }
  .header-search input::placeholder { color: var(--muted); }
  .cart-btn {
    position: relative;
    height: 44px;
    padding: 0 20px;
    border-radius: var(--radius-btn);
    border: 1px solid var(--neon-pink);
    background: transparent;
    color: var(--text);
    font-size: 14px;
    letter-spacing: .08em;
    transition: box-shadow .2s ease, background .2s ease;
  }
  .cart-btn:hover {
    background: rgba(255, 45, 154, .12);
    box-shadow: 0 0 14px rgba(255, 45, 154, .55);
  }
  .cart-count {
    display: inline-block;
    min-width: 22px;
    height: 22px;
    line-height: 22px;
    border-radius: var(--radius-btn);
    background: var(--neon-pink);
    color: #14040d;
    font-weight: 700;
    font-size: 13px;
    text-align: center;
    margin-left: 8px;
    padding: 0 6px;
    box-shadow: 0 0 10px rgba(255, 45, 154, .8);
  }
  .cart-count.bump { animation: bump .3s ease; }

  /* ===== 招牌横幅 ===== */
  .hero { padding: 40px 0 8px; }
  .hero-inner {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px;
  }
  .hero-title {
    font-size: 44px;
    font-weight: 800;
    letter-spacing: .06em;
    line-height: 1.15;
    text-shadow: 0 0 14px rgba(34, 230, 255, .55), 0 0 34px rgba(255, 45, 154, .35);
  }
  .hero-title em {
    font-style: normal;
    color: var(--neon-pink);
    text-shadow: 0 0 12px rgba(255, 45, 154, .85);
  }
  .hero-copy {
    margin-top: 12px;
    color: var(--muted);
    font-size: 15px;
    letter-spacing: .04em;
    max-width: 460px;
  }
  .hero-open {
    flex: none;
    text-align: right;
    font-size: 13px;
    color: var(--neon-amber);
    letter-spacing: .18em;
    border: 1px dashed rgba(255, 194, 75, .55);
    border-radius: 10px;
    padding: 12px 16px;
    text-shadow: 0 0 8px rgba(255, 194, 75, .6);
  }

  /* ===== 分类筛选 ===== */
  .filter-bar {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-top: 26px;
    flex-wrap: wrap;
  }
  .tabs { display: flex; gap: 10px; flex-wrap: wrap; }
  .tab {
    height: 38px;
    padding: 0 20px;
    border-radius: var(--radius-btn);
    border: 1px solid var(--stall-edge);
    background: var(--stall-deep);
    color: var(--muted);
    font-size: 14px;
    letter-spacing: .1em;
    transition: color .18s ease, border-color .18s ease, box-shadow .18s ease;
  }
  .tab:hover { color: var(--text); border-color: var(--neon-cyan); }
  .tab.active {
    color: #041014;
    background: var(--neon-cyan);
    border-color: var(--neon-cyan);
    font-weight: 700;
    box-shadow: 0 0 16px rgba(34, 230, 255, .6);
  }
  .result-line {
    margin-left: auto;
    font-size: 13px;
    color: var(--muted);
    letter-spacing: .06em;
  }
  .result-line strong { color: var(--neon-amber); font-weight: 700; }

  /* ===== 摊位网格 ===== */
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
    margin-top: 20px;
    padding-bottom: 28px;
  }
  .card {
    background: linear-gradient(180deg, var(--stall) 0%, var(--stall-deep) 100%);
    border: 1px solid var(--stall-edge);
    border-radius: var(--radius-card);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
  }
  .card:hover {
    transform: translateY(-4px);
    border-color: var(--accent, var(--neon-pink));
    box-shadow: 0 12px 30px rgba(0, 0, 0, .5), 0 0 22px color-mix(in srgb, var(--accent, var(--neon-pink)) 45%, transparent);
  }
  .awning {
    height: 26px;
    background: repeating-linear-gradient(90deg,
      var(--accent, var(--neon-pink)) 0 18px,
      var(--stall-deep) 18px 36px);
    box-shadow: inset 0 -6px 8px rgba(0, 0, 0, .45), 0 2px 8px color-mix(in srgb, var(--accent, var(--neon-pink)) 50%, transparent);
  }
  .visual {
    height: 150px;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(closest-side, color-mix(in srgb, var(--accent, var(--neon-pink)) 26%, transparent), transparent);
  }
  .glyph {
    font-size: 72px;
    font-weight: 800;
    color: var(--accent, var(--neon-pink));
    text-shadow:
      0 0 10px color-mix(in srgb, var(--accent, var(--neon-pink)) 90%, transparent),
      0 0 30px color-mix(in srgb, var(--accent, var(--neon-pink)) 55%, transparent);
    line-height: 1;
    user-select: none;
  }
  .body { padding: 16px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .stall-tag {
    font-size: 12px;
    color: var(--muted);
    letter-spacing: .08em;
  }
  .name { font-size: 18px; font-weight: 700; letter-spacing: .04em; }
  .desc { font-size: 13px; color: var(--muted); min-height: 20px; }
  .row {
    margin-top: auto;
    padding-top: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .price {
    font-size: 24px;
    font-weight: 800;
    color: var(--neon-amber);
    text-shadow: 0 0 10px rgba(255, 194, 75, .55);
    letter-spacing: .02em;
  }
  .price .cur { font-size: 14px; font-weight: 700; margin-right: 2px; }
  .add-btn {
    height: 38px;
    padding: 0 18px;
    border-radius: var(--radius-btn);
    border: 1px solid var(--neon-pink);
    background: transparent;
    color: var(--neon-pink);
    font-size: 14px;
    letter-spacing: .06em;
    transition: background .18s ease, color .18s ease, box-shadow .18s ease, border-color .18s ease;
  }
  .add-btn:hover {
    background: var(--neon-pink);
    color: #14040d;
    font-weight: 700;
    box-shadow: 0 0 16px rgba(255, 45, 154, .7);
  }
  .add-btn.added {
    background: rgba(42, 255, 196, .12);
    border-color: var(--neon-mint);
    color: var(--neon-mint);
    box-shadow: 0 0 12px rgba(42, 255, 196, .4);
  }
  .add-btn.added:hover {
    background: var(--neon-mint);
    color: #04120c;
  }
  .empty-tip {
    grid-column: 1 / -1;
    text-align: center;
    color: var(--muted);
    padding: 60px 0;
    font-size: 15px;
    letter-spacing: .1em;
  }

  /* ===== 页脚 ===== */
  .site-footer {
    border-top: 1px solid var(--stall-edge);
    padding: 20px 0 26px;
    margin-top: 8px;
  }
  .footer-inner {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: .1em;
  }

  /* ===== toast ===== */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 34px;
    transform: translateX(-50%) translateY(20px);
    background: var(--stall);
    border: 1px solid var(--neon-cyan);
    color: var(--text);
    border-radius: var(--radius-btn);
    padding: 10px 22px;
    font-size: 14px;
    letter-spacing: .06em;
    box-shadow: 0 0 18px rgba(34, 230, 255, .45);
    opacity: 0;
    pointer-events: none;
    transition: opacity .22s ease, transform .22s ease;
    z-index: 50;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @keyframes signFlicker {
    0%, 100% { opacity: 1; }
    3% { opacity: .55; }
    5% { opacity: 1; }
    46% { opacity: 1; }
    48% { opacity: .4; }
    50% { opacity: 1; }
    51% { opacity: .7; }
    53% { opacity: 1; }
  }
  @keyframes bump {
    0% { transform: scale(1); }
    40% { transform: scale(1.35); }
    100% { transform: scale(1); }
  }

  @media (prefers-reduced-motion: reduce) {
    .brand-name { animation: none; }
    .cart-count.bump { animation: none; }
    *, *::before, *::after {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
    }
  }

  @media (max-width: 768px) {
    .header-inner { height: auto; padding-top: 14px; padding-bottom: 14px; flex-wrap: wrap; }
    .header-search { order: 3; flex-basis: 100%; max-width: none; }
    .hero { padding-top: 26px; }
    .hero-inner { flex-direction: column; align-items: flex-start; }
    .hero-title { font-size: 30px; }
    .hero-open { text-align: left; }
    .result-line { margin-left: 0; }
    .grid { grid-template-columns: repeat(2, 1fr); gap: 14px; }
    .visual { height: 110px; }
    .glyph { font-size: 54px; }
    .name { font-size: 16px; }
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="wrap header-inner">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true">
        <ellipse cx="20" cy="18" rx="12" ry="14" fill="none" stroke="#ffc24b" stroke-width="2.5"/>
        <path d="M8 18h24M20 4v28M11 9c4 3 14 3 18 0M11 27c4-3 14-3 18 0" fill="none" stroke="#ffc24b" stroke-width="1.6"/>
        <path d="M20 32v5m-3 0h6" stroke="#ff2d9a" stroke-width="2" fill="none"/>
      </svg>
      <div>
        <div class="brand-name">灯河夜市</div>
        <div class="brand-sub">DENGHÉ NIGHT MART</div>
      </div>
    </div>
    <div class="header-search">
      <input id="searchInput" type="search" placeholder="搜今晚想吃的、想玩的…" aria-label="搜索摊位货品">
    </div>
    <button class="cart-btn" id="cartBtn" type="button">
      灯篮<span class="cart-count" id="cartCount">0</span>
    </button>
  </div>
</header>

<main class="wrap">
  <section class="hero" aria-label="夜市招牌">
    <div class="hero-inner">
      <div>
        <h1 class="hero-title">今晚的摊位<em>都亮着</em></h1>
        <p class="hero-copy">沿河五十四个摊位，吃食、玩物、日用、手作分四列排开。看中什么，丢进灯篮，收摊前统一到河湾口取货。</p>
      </div>
      <div class="hero-open">今晚营业<br>18:00 — 次日 02:00</div>
    </div>
  </section>

  <section aria-label="摊位筛选">
    <div class="filter-bar">
      <div class="tabs" id="tabs" role="tablist">
        <button class="tab active" type="button" data-cat="all">全部</button>
        <button class="tab" type="button" data-cat="吃食">吃食</button>
        <button class="tab" type="button" data-cat="玩物">玩物</button>
        <button class="tab" type="button" data-cat="日用">日用</button>
        <button class="tab" type="button" data-cat="手作">手作</button>
      </div>
      <div class="result-line" id="resultLine">今晚出摊 <strong>8</strong> 件货品</div>
    </div>
    <div class="grid" id="grid"></div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap footer-inner">
    <span>灯河夜市 · 天亮收摊</span>
    <span>货品文案为示例，价格为演示价</span>
    <span>取货点：河湾口 3 号灯柱下</span>
  </div>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  "use strict";

  var ACCENTS = {
    pink: "var(--neon-pink)",
    cyan: "var(--neon-cyan)",
    amber: "var(--neon-amber)"
  };

  var PRODUCTS = [
    { id: "p1", glyph: "鱿", accent: ACCENTS.pink, cat: "吃食", stall: "阿海烧烤 · 3 号摊", name: "炭烤鱿鱼须", desc: "炭火现烤，刷双层辣酱", price: 12 },
    { id: "p2", glyph: "冰", accent: ACCENTS.cyan, cat: "吃食", stall: "甜水铺 · 7 号摊", name: "桂花红糖冰粉", desc: "手搓冰粉，桂花蜜收尾", price: 8 },
    { id: "p3", glyph: "灯", accent: ACCENTS.amber, cat: "手作", stall: "灯匠小屋 · 12 号摊", name: "手作牛皮纸灯笼", desc: "竹骨纸面，暖光不烫手", price: 36 },
    { id: "p4", glyph: "蛙", accent: ACCENTS.cyan, cat: "玩物", stall: "旧时光杂货 · 5 号摊", name: "复古铁皮青蛙", desc: "上满发条，能蹦一整条巷", price: 18 },
    { id: "p5", glyph: "星", accent: ACCENTS.amber, cat: "玩物", stall: "闪光小铺 · 9 号摊", name: "星星发光头箍", desc: "三档闪烁，续航一整晚", price: 15 },
    { id: "p6", glyph: "筐", accent: ACCENTS.pink, cat: "日用", stall: "竹语 · 15 号摊", name: "竹编收纳小筐", desc: "整竹剖丝，零胶水手工", price: 22 },
    { id: "p7", glyph: "兔", accent: ACCENTS.pink, cat: "吃食", stall: "川妹子卤味 · 2 号摊", name: "香辣冷吃兔", desc: "先卤后炒，锁鲜盒装", price: 28 },
    { id: "p8", glyph: "囊", accent: ACCENTS.cyan, cat: "手作", stall: "草木集 · 11 号摊", name: "艾草驱蚊香囊", desc: "老配方缝制的随行香包", price: 16 }
  ];

  var CATS = ["all", "吃食", "玩物", "日用", "手作"];
  var activeCat = "all";
  var keyword = "";
  var added = {};
  var toastTimer = null;

  var grid = document.getElementById("grid");
  var tabs = document.getElementById("tabs");
  var resultLine = document.getElementById("resultLine");
  var cartCount = document.getElementById("cartCount");
  var cartBtn = document.getElementById("cartBtn");
  var searchInput = document.getElementById("searchInput");
  var toast = document.getElementById("toast");

  function currentList() {
    return PRODUCTS.filter(function (p) {
      var catOk = activeCat === "all" || p.cat === activeCat;
      var kw = keyword.trim();
      var kwOk = !kw || p.name.indexOf(kw) !== -1 || p.stall.indexOf(kw) !== -1 || p.desc.indexOf(kw) !== -1;
      return catOk && kwOk;
    });
  }

  function render() {
    var list = currentList();
    var html = "";
    list.forEach(function (p) {
      var isAdded = !!added[p.id];
      html += '<article class="card" style="--accent:' + p.accent + '" data-id="' + p.id + '">' +
        '<div class="awning" aria-hidden="true"></div>' +
        '<div class="visual"><span class="glyph" aria-hidden="true">' + p.glyph + '</span></div>' +
        '<div class="body">' +
          '<div class="stall-tag">' + p.stall + ' · ' + p.cat + '</div>' +
          '<h3 class="name">' + p.name + '</h3>' +
          '<p class="desc">' + p.desc + '</p>' +
          '<div class="row">' +
            '<div class="price"><span class="cur">¥</span>' + p.price + '</div>' +
            '<button class="add-btn' + (isAdded ? " added" : "") + '" type="button" data-add="' + p.id + '">' +
              (isAdded ? "已加入 ✓" : "加入灯篮") +
            '</button>' +
          '</div>' +
        '</div>' +
      '</article>';
    });
    if (!list.length) {
      html = '<div class="empty-tip">这个摊位还没开张，换个词或分类再逛。</div>';
    }
    grid.innerHTML = html;

    var catName = activeCat === "all" ? "" : " · " + activeCat;
    resultLine.innerHTML = "今晚出摊 <strong>" + list.length + "</strong> 件货品" + catName;
  }

  function totalCount() {
    return Object.keys(added).reduce(function (sum, k) { return sum + (added[k] ? 1 : 0); }, 0);
  }

  function syncCart() {
    cartCount.textContent = String(totalCount());
    cartCount.classList.remove("bump");
    void cartCount.offsetWidth;
    cartCount.classList.add("bump");
  }

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add("show");
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.classList.remove("show"); }, 1600);
  }

  grid.addEventListener("click", function (e) {
    var btn = e.target.closest("[data-add]");
    if (!btn) return;
    var id = btn.getAttribute("data-add");
    var p = PRODUCTS.filter(function (item) { return item.id === id; })[0];
    if (!added[id]) {
      added[id] = true;
      showToast("已把「" + p.name + "」放进灯篮");
    } else {
      added[id] = false;
      showToast("已把「" + p.name + "」从灯篮取出");
    }
    syncCart();
    render();
  });

  tabs.addEventListener("click", function (e) {
    var tab = e.target.closest(".tab");
    if (!tab) return;
    activeCat = tab.getAttribute("data-cat");
    var all = tabs.querySelectorAll(".tab");
    for (var i = 0; i < all.length; i++) all[i].classList.toggle("active", all[i] === tab);
    render();
  });

  searchInput.addEventListener("input", function () {
    keyword = searchInput.value;
    render();
  });

  cartBtn.addEventListener("click", function () {
    var n = totalCount();
    showToast(n === 0 ? "灯篮还是空的，去摊位上逛逛吧" : "灯篮里已有 " + n + " 件，收摊前到河湾口取货");
  });

  render();
})();
</script>
</body>
</html>
