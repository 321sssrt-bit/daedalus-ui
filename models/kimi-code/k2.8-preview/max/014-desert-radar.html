<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>搜索无结果 · 漠野装备库</title>
<style>
  :root{
    --page:#E9DEC5;
    --surface:#F8F2E4;
    --text:#38291B;
    --muted:#8C7A5B;
    --accent:#B4552D;
    --olive:#7A8450;
    --line:#D8C9A8;
    --radius-ctl:10px;
    --radius-card:16px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
    background:
      radial-gradient(900px 420px at 85% -8%, rgba(248,242,228,.9), rgba(248,242,228,0) 70%),
      radial-gradient(760px 380px at -10% 108%, rgba(216,201,168,.55), rgba(216,201,168,0) 70%),
      var(--page);
    color:var(--text);
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  button{font-family:inherit;cursor:pointer;}
  input{font-family:inherit;}

  /* ===== 顶栏 ===== */
  .topbar{
    height:64px;
    background:var(--surface);
    border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:20;
  }
  .topbar-inner{
    max-width:1200px;height:64px;margin:0 auto;padding:0 24px;
    display:flex;align-items:center;gap:32px;
  }
  .brand{
    font-size:19px;font-weight:700;letter-spacing:.12em;color:var(--text);
    text-decoration:none;white-space:nowrap;display:flex;align-items:center;gap:10px;
  }
  .brand-mark{
    width:26px;height:26px;border-radius:50%;
    background:conic-gradient(from 210deg, var(--accent), #D98E4A 55%, var(--accent));
    position:relative;flex:none;
  }
  .brand-mark::after{
    content:"";position:absolute;inset:7px;border-radius:50%;background:var(--surface);
  }
  .searchbar{
    flex:1;max-width:560px;display:flex;height:40px;
    border:1.5px solid var(--line);border-radius:var(--radius-ctl);
    background:#FDFAF2;overflow:hidden;
  }
  .searchbar:focus-within{border-color:var(--accent);}
  .searchbar input{
    flex:1;border:none;outline:none;background:transparent;
    padding:0 14px;font-size:14px;color:var(--text);
  }
  .searchbar input::placeholder{color:var(--muted);}
  .searchbar button{
    border:none;background:var(--accent);color:#FBF4E6;
    font-size:14px;font-weight:600;padding:0 20px;letter-spacing:.1em;
  }
  .searchbar button:hover{background:#9E4726;}
  .topnav{display:flex;gap:22px;margin-left:auto;align-items:center;}
  .topnav a{
    color:var(--muted);text-decoration:none;font-size:14px;
  }
  .topnav a:hover{color:var(--accent);}
  .list-badge{
    font-size:13px;color:var(--text);border:1px solid var(--line);
    border-radius:999px;padding:5px 12px;background:#FDFAF2;white-space:nowrap;
  }
  .list-badge b{color:var(--accent);font-weight:700;}

  /* ===== 主区 ===== */
  .stage{
    flex:1;width:100%;max-width:1200px;margin:0 auto;
    padding:56px 24px 64px;
    display:flex;flex-direction:column;align-items:center;
  }
  .radar-wrap{display:flex;flex-direction:column;align-items:center;gap:16px;margin-bottom:36px;}
  .radar{
    width:220px;height:220px;border-radius:50%;position:relative;overflow:hidden;
    background:radial-gradient(circle at 50% 50%, #F3EAD3 0%, #EBDFC2 68%, #E4D5B3 100%);
    border:1px solid var(--line);
    box-shadow:0 10px 30px rgba(56,41,27,.10), inset 0 0 0 1px rgba(253,250,242,.6);
  }
  .radar svg{position:absolute;inset:0;width:100%;height:100%;}
  .sweep{
    position:absolute;inset:0;border-radius:50%;
    background:conic-gradient(from 0deg, rgba(180,85,45,.38), rgba(180,85,45,.10) 55deg, rgba(180,85,45,0) 78deg, rgba(180,85,45,0) 360deg);
    animation:spin 4.5s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .blip{
    position:absolute;width:8px;height:8px;border-radius:50%;
    background:var(--accent);opacity:.25;
    animation:ping 2.6s ease-in-out infinite;
  }
  .blip-a{top:38%;left:60%;}
  .blip-b{top:64%;left:32%;animation-delay:.9s;}
  @keyframes ping{
    0%,100%{opacity:.18;transform:scale(.8);}
    50%{opacity:.95;transform:scale(1.25);}
  }
  .radar-status{
    font-size:13px;color:var(--muted);letter-spacing:.08em;
    display:flex;align-items:center;gap:8px;
  }
  .radar-status::before{
    content:"";width:8px;height:8px;border-radius:50%;background:var(--olive);flex:none;
  }
  .radar-status.hit::before{background:var(--accent);}

  /* ===== 结果面板 ===== */
  .panel{
    width:100%;max-width:720px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius-card);
    padding:36px 40px 32px;
    box-shadow:0 14px 36px rgba(56,41,27,.10);
  }
  .panel.enter{animation:rise .3s ease both;}
  @keyframes rise{
    from{opacity:0;transform:translateY(12px);}
    to{opacity:1;transform:translateY(0);}
  }
  .state-title{
    font-size:26px;line-height:1.4;font-weight:700;letter-spacing:.02em;
    margin-bottom:14px;
  }
  .state-title .term{color:var(--accent);}
  .state-desc{
    font-size:15px;line-height:1.8;color:var(--muted);margin-bottom:26px;
  }
  .suggest-label{
    font-size:13px;font-weight:600;letter-spacing:.14em;color:var(--olive);
    margin-bottom:12px;
  }
  .chips{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:26px;}
  .chip{
    border:1.5px solid var(--line);background:#FDFAF2;color:var(--text);
    font-size:14px;padding:8px 16px;border-radius:999px;
    transition:background-color .15s ease, border-color .15s ease, color .15s ease;
  }
  .chip:hover{border-color:var(--accent);color:var(--accent);}
  .chip:active{background:#F3E8CF;}
  .tips{
    list-style:none;border-top:1px dashed var(--line);padding-top:18px;
    display:flex;flex-direction:column;gap:9px;
  }
  .tips li{
    font-size:13px;line-height:1.6;color:var(--muted);
    padding-left:18px;position:relative;
  }
  .tips li::before{
    content:"";position:absolute;left:2px;top:.55em;
    width:6px;height:6px;border-radius:50%;background:var(--olive);opacity:.7;
  }

  /* ===== 结果列表 ===== */
  .result-meta{
    font-size:13px;color:var(--muted);letter-spacing:.06em;margin-bottom:20px;
  }
  .result-meta b{color:var(--accent);font-weight:700;}
  .result-list{list-style:none;display:flex;flex-direction:column;gap:14px;}
  .result-item{
    display:flex;align-items:center;gap:16px;
    border:1px solid var(--line);border-radius:12px;
    background:#FDFAF2;padding:16px 18px;
  }
  .item-thumb{
    width:56px;height:56px;border-radius:10px;flex:none;
    background:linear-gradient(135deg, #EBDFC2, #DCCBA0);
    display:flex;align-items:center;justify-content:center;
    font-size:22px;color:var(--olive);font-weight:700;
  }
  .item-info{flex:1;min-width:0;}
  .item-name{font-size:15px;font-weight:600;margin-bottom:5px;}
  .item-tagrow{display:flex;gap:8px;align-items:center;}
  .item-tag{
    font-size:11px;color:var(--olive);border:1px solid var(--olive);
    border-radius:4px;padding:1px 7px;letter-spacing:.06em;opacity:.85;
  }
  .item-sub{font-size:12px;color:var(--muted);}
  .item-side{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:none;}
  .item-price{font-size:17px;font-weight:700;color:var(--text);}
  .item-price small{font-size:12px;font-weight:400;color:var(--muted);margin-left:2px;}
  .add-btn{
    border:1.5px solid var(--accent);background:transparent;color:var(--accent);
    font-size:13px;padding:6px 14px;border-radius:8px;font-weight:600;
    transition:background-color .15s ease, color .15s ease;
  }
  .add-btn:hover{background:var(--accent);color:#FBF4E6;}
  .add-btn.added{
    background:var(--olive);border-color:var(--olive);color:#FBF4E6;cursor:default;
  }
  .back-line{margin-top:22px;border-top:1px dashed var(--line);padding-top:16px;}
  .back-line button{
    background:none;border:none;color:var(--accent);font-size:13px;
    text-decoration:underline;text-underline-offset:3px;padding:0;
  }
  .back-line button:hover{color:#9E4726;}

  footer{
    text-align:center;padding:22px 24px;font-size:12px;color:var(--muted);
    letter-spacing:.08em;border-top:1px solid var(--line);
  }

  /* ===== 响应式：1280 → 768 ===== */
  @media (max-width:900px){
    .topbar{height:auto;}
    .topbar-inner{
      height:auto;flex-wrap:wrap;gap:12px;padding:12px 20px;
    }
    .searchbar{order:3;flex-basis:100%;max-width:none;}
    .topnav{display:none;}
    .stage{padding:40px 20px 48px;}
    .radar{width:176px;height:176px;}
    .panel{padding:26px 24px;}
    .state-title{font-size:21px;}
    .result-item{flex-wrap:wrap;}
  }

  /* ===== 减少动态 ===== */
  @media (prefers-reduced-motion: reduce){
    .sweep{animation:none;}
    .blip{animation:none;opacity:.85;}
    .panel.enter{animation:none;}
    html{scroll-behavior:auto;}
    .chip,.add-btn{transition:none;}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#"><span class="brand-mark"></span>漠野装备库</a>
    <div class="searchbar">
      <input id="searchInput" type="text" value="夜光帐篷" autocomplete="off" aria-label="搜索装备">
      <button id="searchBtn" type="button">搜索</button>
    </div>
    <nav class="topnav">
      <a href="#">装备分类</a>
      <a href="#">行程规划</a>
      <a href="#">我的订单</a>
    </nav>
    <span class="list-badge">装备清单 <b id="listCount">0</b> 件</span>
  </div>
</header>

<main class="stage">
  <div class="radar-wrap">
    <div class="radar" aria-hidden="true">
      <svg viewBox="0 0 220 220">
        <circle cx="110" cy="110" r="98" fill="none" stroke="#7A8450" stroke-width="1.4" opacity=".45"/>
        <circle cx="110" cy="110" r="66" fill="none" stroke="#7A8450" stroke-width="1.2" opacity=".38"/>
        <circle cx="110" cy="110" r="34" fill="none" stroke="#7A8450" stroke-width="1.2" opacity=".32"/>
        <line x1="110" y1="12" x2="110" y2="208" stroke="#D8C9A8" stroke-width="1"/>
        <line x1="12" y1="110" x2="208" y2="110" stroke="#D8C9A8" stroke-width="1"/>
        <circle cx="110" cy="110" r="4" fill="#B4552D"/>
      </svg>
      <div class="sweep"></div>
      <span class="blip blip-a"></span>
      <span class="blip blip-b"></span>
    </div>
    <p class="radar-status" id="radarStatus">信号扫描中 · 未捕获与「夜光帐篷」相关的目标</p>
  </div>

  <section class="panel" id="resultPanel" aria-live="polite"></section>
</main>

<footer>漠野装备库 · 为穿越沙海的人备好每一件行装</footer>

<script>
(function(){
  var panel = document.getElementById('resultPanel');
  var input = document.getElementById('searchInput');
  var btn = document.getElementById('searchBtn');
  var status = document.getElementById('radarStatus');
  var listCount = document.getElementById('listCount');
  var listTotal = 0;

  var RESULTS = {
    sand: [
      { name:'高筒防沙鞋套 · 驼色', tag:'防沙', sub:'弹力束口 · 适合戈壁与沙丘徒步', price:69 },
      { name:'轻量防沙脚套 · 岩灰', tag:'轻量', sub:'收纳后仅掌心大小 · 单只 38g', price:49 }
    ],
    sun: [
      { name:'冰感防晒面罩 · 沙丘黄', tag:'防晒', sub:'UPF50+ · 口鼻立体透气网', price:39 },
      { name:'护颈一体防晒面罩 · 赭石', tag:'防晒', sub:'后颈加长下摆 · 骑行适用', price:45 }
    ]
  };

  function escapeHtml(s){
    return s.replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function resolveKind(term){
    if(/鞋套|脚套|披肩|防沙/.test(term)) return 'sand';
    if(/面罩|防晒|遮阳/.test(term)) return 'sun';
    return null;
  }

  function renderEmpty(term){
    var safe = escapeHtml(term);
    panel.innerHTML =
      '<h1 class="state-title">没有找到与<span class="term">「' + safe + '」</span>相关的装备</h1>' +
      '<p class="state-desc">这片沙海里还没有收录它。可能是叫法太新、名称有误，或它还不属于沙漠行装的常备清单。装备库每天都在扩充，也可以换个说法再搜一次。</p>' +
      '<p class="suggest-label">试试这些沙海常备</p>' +
      '<div class="chips">' +
        '<button class="chip" type="button" data-term="防沙鞋套">防沙鞋套</button>' +
        '<button class="chip" type="button" data-term="防晒面罩">防晒面罩</button>' +
        '<button class="chip" type="button" data-term="防沙披肩">防沙披肩</button>' +
      '</div>' +
      '<ul class="tips">' +
        '<li>检查错别字，或缩短关键词，例如「防沙」「防晒」。</li>' +
        '<li>按用途描述搜索，例如「遮阳」「滤水」「防风」。</li>' +
        '<li>新品收录有周期，急用的装备可以联系装备顾问登记。</li>' +
      '</ul>';
    status.textContent = '信号扫描中 · 未捕获与「' + term + '」相关的目标';
    status.classList.remove('hit');
  }

  function renderResults(term, kind){
    var safe = escapeHtml(term);
    var items = RESULTS[kind];
    var html =
      '<h1 class="state-title">找到与<span class="term">「' + safe + '」</span>相关的装备</h1>' +
      '<p class="result-meta">雷达已捕获信号 · 共 <b>' + items.length + '</b> 件装备</p>' +
      '<ul class="result-list">';
    items.forEach(function(it, i){
      html +=
        '<li class="result-item">' +
          '<div class="item-thumb" aria-hidden="true">' + escapeHtml(it.tag.charAt(0)) + '</div>' +
          '<div class="item-info">' +
            '<p class="item-name">' + escapeHtml(it.name) + '</p>' +
            '<div class="item-tagrow"><span class="item-tag">' + escapeHtml(it.tag) + '</span>' +
            '<span class="item-sub">' + escapeHtml(it.sub) + '</span></div>' +
          '</div>' +
          '<div class="item-side">' +
            '<span class="item-price"><small>¥</small>' + it.price + '</span>' +
            '<button class="add-btn" type="button" data-name="' + escapeHtml(it.name) + '">加入装备清单</button>' +
          '</div>' +
        '</li>';
    });
    html += '</ul><div class="back-line"><button type="button" id="backEmpty">重新输入关键词搜索</button></div>';
    panel.innerHTML = html;
    status.textContent = '已捕获信号 · 找到 ' + items.length + ' 件装备';
    status.classList.add('hit');
  }

  function runSearch(raw){
    var term = (raw || '').trim();
    if(!term){ term = '夜光帐篷'; }
    input.value = term;
    var kind = resolveKind(term);
    if(kind){ renderResults(term, kind); }
    else { renderEmpty(term); }
    panel.classList.remove('enter');
    void panel.offsetWidth;
    panel.classList.add('enter');
  }

  panel.addEventListener('click', function(e){
    var chip = e.target.closest('.chip');
    if(chip){ runSearch(chip.getAttribute('data-term')); return; }
    var add = e.target.closest('.add-btn');
    if(add && !add.classList.contains('added')){
      add.classList.add('added');
      add.textContent = '已加入清单';
      listTotal += 1;
      listCount.textContent = String(listTotal);
      return;
    }
    if(e.target.closest('#backEmpty')){ input.focus(); input.select(); }
  });

  btn.addEventListener('click', function(){ runSearch(input.value); });
  input.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ runSearch(input.value); }
  });

  runSearch('夜光帐篷');
})();
</script>
</body>
</html>
