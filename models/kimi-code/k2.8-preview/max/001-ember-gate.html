<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>余烬塔 · 夜岗入口</title>
<style>
:root{
  --page:#0a0f18;
  --surface:#121b2b;
  --surface-2:#0e1622;
  --input:#0c141f;
  --line:#22304a;
  --line-soft:#1a2740;
  --hover-line:#2e415f;
  --text:#e8eef7;
  --muted:#8091a8;
  --faint:#5c6b80;
  --accent:#ff7a1a;
  --accent-2:#ffb26b;
  --accent-deep:#ff6d0d;
  --accent-hi:#ff8c38;
  --danger:#ff5d5d;
  --success:#43d9a3;
  --onaccent:#231203;
  --tab-bg:#1b2940;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
body{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:96px 24px 120px;
  background:var(--page);
  color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:14px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
.bg{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(1000px 520px at 50% 36%, rgba(255,122,26,.07), transparent 62%),
    radial-gradient(820px 520px at 10% 92%, rgba(38,74,132,.16), transparent 62%),
    radial-gradient(720px 440px at 90% 8%, rgba(255,122,26,.05), transparent 58%);
}
.bg::after{
  content:"";position:absolute;inset:0;
  background-image:
    radial-gradient(1.6px 1.6px at 12% 20%, rgba(232,238,247,.55), transparent 60%),
    radial-gradient(1.2px 1.2px at 28% 68%, rgba(232,238,247,.4), transparent 60%),
    radial-gradient(1.8px 1.8px at 44% 12%, rgba(255,178,107,.6), transparent 60%),
    radial-gradient(1.2px 1.2px at 61% 80%, rgba(232,238,247,.35), transparent 60%),
    radial-gradient(1.5px 1.5px at 73% 26%, rgba(232,238,247,.5), transparent 60%),
    radial-gradient(1.1px 1.1px at 86% 58%, rgba(255,178,107,.45), transparent 60%),
    radial-gradient(1.4px 1.4px at 94% 16%, rgba(232,238,247,.4), transparent 60%),
    radial-gradient(1.2px 1.2px at 7% 52%, rgba(232,238,247,.3), transparent 60%);
  opacity:.7;
}
.topbar{
  position:fixed;top:0;left:0;right:0;z-index:5;
  height:64px;padding:0 40px;
  display:flex;align-items:center;justify-content:space-between;
}
.brand{display:flex;align-items:center;gap:10px}
.brand-cn{font-size:16px;font-weight:700;letter-spacing:6px}
.brand-en{font-size:10.5px;letter-spacing:.32em;color:var(--muted);margin-left:2px}
.sysline{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.dot-status{width:7px;height:7px;border-radius:50%;background:var(--success);box-shadow:0 0 8px rgba(67,217,163,.9);animation:blink 2.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.3}}
.gate{
  position:relative;z-index:2;
  display:grid;grid-template-columns:2px auto 2px;column-gap:48px;align-items:stretch;
}
.beacon{
  position:absolute;top:-46px;left:50%;transform:translateX(-50%);
  width:6px;height:6px;border-radius:50%;
  background:var(--accent-2);box-shadow:0 0 12px 3px rgba(255,122,26,.75);
  animation:blink 3.2s ease-in-out infinite;
}
.pillar{
  position:relative;display:block;margin-block:-28px;
  background:linear-gradient(180deg, rgba(255,122,26,0) 0%, rgba(255,122,26,.85) 22%, var(--accent-2) 50%, rgba(255,122,26,.85) 78%, rgba(255,122,26,0) 100%);
  opacity:.9;
}
.pillar::before{
  content:"";position:absolute;inset:-7px;
  background:inherit;filter:blur(10px);opacity:.45;
  animation:pulse 4s ease-in-out infinite;
}
.pillar::after{
  content:"";position:absolute;left:0;right:0;top:-72px;height:72px;
  background:linear-gradient(180deg, rgba(255,224,190,0), rgba(255,224,190,.95), rgba(255,224,190,0));
  animation:travel 4.5s linear infinite;
}
@keyframes travel{to{top:100%}}
@keyframes pulse{50%{opacity:.22}}
.card{
  width:400px;
  padding:44px 44px 36px;
  border-radius:14px;
  border:1px solid var(--line);
  background:linear-gradient(180deg, rgba(20,31,49,.94), rgba(14,22,34,.97));
  box-shadow:0 24px 80px rgba(0,0,0,.5), inset 0 1px 0 rgba(232,238,247,.05);
  animation:fadeUp .5s ease-out both;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}}
@keyframes shake{
  10%,90%{transform:translateX(-1px)}
  20%,80%{transform:translateX(2px)}
  30%,50%,70%{transform:translateX(-4px)}
  40%,60%{transform:translateX(4px)}
}
.card.shake{animation:shake .4s}
.mark{display:grid;place-items:center;margin-bottom:14px}
h1{font-size:22px;line-height:1.35;font-weight:600;text-align:center;letter-spacing:.04em}
.sub{margin-top:8px;font-size:13px;color:var(--muted);text-align:center}
.tabs{
  display:grid;grid-template-columns:1fr 1fr;gap:4px;
  margin:26px 0 22px;padding:4px;
  background:var(--surface-2);border:1px solid var(--line-soft);border-radius:10px;
}
.tab{
  height:36px;border:0;border-radius:7px;background:transparent;
  color:var(--muted);font-size:14px;cursor:pointer;
  transition:background .15s,color .15s;
}
.tab.active{background:var(--tab-bg);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.tab:focus-visible,.primary:focus-visible,.ghost:focus-visible,.send:focus-visible,.eye:focus-visible,.linkbtn:focus-visible,.modal-close:focus-visible{
  outline:2px solid var(--accent-2);outline-offset:2px;
}
.field{margin-bottom:18px}
.field>label{display:block;font-size:13px;color:var(--muted);margin-bottom:8px;letter-spacing:.02em}
.field input{
  width:100%;height:46px;padding:0 14px;
  background:var(--input);border:1px solid var(--line-soft);border-radius:9px;
  color:var(--text);font-size:14px;line-height:46px;
  transition:border-color .18s,box-shadow .18s;
}
.field input::placeholder{color:var(--faint)}
.field input:hover{border-color:var(--hover-line)}
.field input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,122,26,.18)}
.field input.invalid{border-color:var(--danger);box-shadow:0 0 0 3px rgba(255,93,93,.14)}
.input-wrap{position:relative}
#pwdPass{padding-right:44px}
#codeInput{padding-right:104px}
.eye{
  position:absolute;right:6px;top:50%;transform:translateY(-50%);
  width:32px;height:32px;display:grid;place-items:center;
  background:none;border:0;color:var(--muted);cursor:pointer;border-radius:7px;
  transition:color .15s;
}
.eye:hover{color:var(--text)}
.eye .hide{display:none}
.send{
  position:absolute;right:6px;top:50%;transform:translateY(-50%);
  height:34px;padding:0 12px;border-radius:7px;
  border:1px solid var(--line);background:#152238;color:var(--accent-2);
  font-size:13px;cursor:pointer;white-space:nowrap;
  transition:color .15s,border-color .15s;
}
.send:hover:not(:disabled){border-color:var(--accent)}
.send:disabled{color:var(--muted);cursor:not-allowed}
.row{display:flex;justify-content:space-between;align-items:center;margin:2px 0 20px}
.check{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);cursor:pointer;user-select:none}
.check input{width:15px;height:15px;accent-color:var(--accent);cursor:pointer}
.linkbtn{background:none;border:0;color:var(--accent-2);font-size:13px;cursor:pointer;padding:2px 0}
.linkbtn:hover{text-decoration:underline}
.err{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--danger);margin:-6px 0 14px}
.err::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--danger);flex:none}
.primary{
  width:100%;height:48px;border:0;border-radius:10px;
  background:linear-gradient(180deg,var(--accent-hi),var(--accent-deep));
  color:var(--onaccent);font-size:15px;font-weight:700;letter-spacing:.06em;
  cursor:pointer;position:relative;
  box-shadow:0 6px 24px rgba(255,122,26,.28), inset 0 1px 0 rgba(255,255,255,.28);
  transition:transform .15s,filter .15s,box-shadow .15s;
}
.primary:hover:not(:disabled){filter:brightness(1.06);transform:translateY(-1px)}
.primary:active:not(:disabled){transform:translateY(0);box-shadow:0 3px 14px rgba(255,122,26,.3)}
.primary:disabled{cursor:wait;filter:saturate(.6) brightness(.9)}
.primary.loading{color:transparent}
.primary.loading::after{
  content:"";position:absolute;width:20px;height:20px;left:50%;top:50%;
  margin:-10px 0 0 -10px;border-radius:50%;
  border:2.5px solid rgba(35,18,3,.35);border-top-color:var(--onaccent);
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.fineprint{margin-top:20px;text-align:center;font-size:12px;color:var(--faint)}
.success{text-align:center;padding:26px 0 6px}
.okring{
  width:64px;height:64px;margin:0 auto 18px;border-radius:50%;
  display:grid;place-items:center;
  background:rgba(67,217,163,.12);border:1.5px solid rgba(67,217,163,.5);color:var(--success);
  animation:pop .35s ease-out;
}
.okring.small{width:48px;height:48px;margin-bottom:14px}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.success h2{font-size:19px;font-weight:600;margin-bottom:8px}
.success p{font-size:13.5px;color:var(--muted);line-height:1.7}
.ghost{
  margin-top:20px;height:40px;padding:0 22px;border-radius:9px;
  border:1px solid var(--line);background:transparent;color:var(--text);
  font-size:14px;cursor:pointer;transition:border-color .15s,color .15s;
}
.ghost:hover{border-color:var(--accent);color:var(--accent-2)}
.runway{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);z-index:1;display:flex;gap:34px}
.runway i{width:4px;height:4px;border-radius:50%;background:var(--accent);opacity:.3}
.runway i:nth-of-type(5){opacity:.75;box-shadow:0 0 8px rgba(255,122,26,.8)}
.foot{position:fixed;left:0;right:0;bottom:22px;z-index:1;text-align:center;font-size:12px;color:#55637a;letter-spacing:.03em}
.modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:20px}
.modal-backdrop{position:absolute;inset:0;background:rgba(4,7,12,.66);backdrop-filter:blur(6px)}
.modal-card{
  position:relative;width:400px;max-width:calc(100vw - 40px);
  padding:32px 30px 24px;border-radius:14px;
  border:1px solid var(--line);
  background:linear-gradient(180deg,#151f31,#101a29);
  box-shadow:0 30px 90px rgba(0,0,0,.6);
  animation:rise .25s ease-out;
}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
.modal-close{
  position:absolute;top:10px;right:10px;width:32px;height:32px;
  display:grid;place-items:center;background:none;border:0;border-radius:8px;
  color:var(--muted);cursor:pointer;transition:color .15s;
}
.modal-close:hover{color:var(--text)}
.modal-card h2{font-size:17px;font-weight:600;margin-bottom:6px}
.modal-sub{font-size:13px;color:var(--muted);margin-bottom:18px}
.modal-card form>label{display:block;font-size:13px;color:var(--muted);margin-bottom:8px}
.modal-card form>input{
  width:100%;height:46px;padding:0 14px;margin-bottom:4px;
  background:var(--input);border:1px solid var(--line-soft);border-radius:9px;
  color:var(--text);font-size:14px;transition:border-color .18s,box-shadow .18s;
}
.modal-card form>input::placeholder{color:var(--faint)}
.modal-card form>input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,122,26,.18)}
.modal-card form>input.invalid{border-color:var(--danger);box-shadow:0 0 0 3px rgba(255,93,93,.14)}
.modal-card .primary{margin-top:14px}
.modal-fine{margin-top:16px;padding-top:14px;border-top:1px solid var(--line-soft);font-size:12px;color:var(--faint);line-height:1.7}
.recover-done{text-align:center;padding:10px 0 2px}
.recover-done p{font-size:13.5px;color:var(--muted);line-height:1.7}
@media (max-width:900px){
  .topbar{padding:0 24px}
  .brand-en{display:none}
  .gate{column-gap:26px}
  .card{padding:36px 32px 30px}
}
@media (max-width:520px){
  body{padding:80px 16px 110px}
  .gate{grid-template-columns:1fr}
  .pillar,.beacon{display:none}
  .card{width:calc(100vw - 32px)}
  .runway{display:none}
}
@media (prefers-reduced-motion:reduce){
  .pillar::before,.pillar::after,.dot-status,.beacon{animation:none!important}
  .card,.modal-card,.okring,.card.shake{animation:none!important}
  *{transition-duration:120ms!important}
}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>

<header class="topbar">
  <div class="brand">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
      <path fill="#ff7a1a" d="M12 2c.7 3.4-1 5.2-2.5 7C8 10.8 6.6 12.7 6.6 15a5.4 5.4 0 0 0 10.8 0c0-1.7-.7-3.1-1.5-4.3-.4 1.1-1 1.9-2 2.3.5-3-.3-7-1.9-9.9Z"/>
      <circle cx="12" cy="15.2" r="1.7" fill="#0a0f18"/>
    </svg>
    <span class="brand-cn">余烬塔</span>
    <span class="brand-en">EMBER TOWER</span>
  </div>
  <div class="sysline"><span class="dot-status" aria-hidden="true"></span>值守正常 · v3.2.1</div>
</header>

<main class="gate">
  <span class="pillar" aria-hidden="true"></span>
  <span class="beacon" aria-hidden="true"></span>
  <section class="card" aria-labelledby="cardTitle">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="38" height="38">
        <path fill="#ff7a1a" d="M12 2c.7 3.4-1 5.2-2.5 7C8 10.8 6.6 12.7 6.6 15a5.4 5.4 0 0 0 10.8 0c0-1.7-.7-3.1-1.5-4.3-.4 1.1-1 1.9-2 2.3.5-3-.3-7-1.9-9.9Z"/>
        <circle cx="12" cy="15.2" r="1.7" fill="#121b2b"/>
      </svg>
    </div>
    <h1 id="cardTitle">欢迎回到夜岗</h1>
    <p class="sub">验证身份后进入值守台。连续输错 3 次将锁定 15 分钟。</p>

    <div class="tabs" role="tablist" aria-label="登录方式">
      <button type="button" role="tab" id="tabPass" class="tab active" aria-selected="true" aria-controls="formPass">密码登录</button>
      <button type="button" role="tab" id="tabCode" class="tab" aria-selected="false" aria-controls="formCode">验证码登录</button>
    </div>

    <form id="formPass" class="panel" novalidate>
      <div class="field">
        <label for="acctPass">账号</label>
        <input id="acctPass" name="account" type="text" autocomplete="username" placeholder="工号或邮箱，如 qi.chen">
      </div>
      <div class="field">
        <label for="pwdPass">密码</label>
        <div class="input-wrap">
          <input id="pwdPass" name="password" type="password" autocomplete="current-password" placeholder="输入登录密码">
          <button type="button" class="eye" id="togglePass" aria-label="显示密码" aria-pressed="false">
            <svg id="eyeOn" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z"/><circle cx="12" cy="12" r="2.7"/>
            </svg>
            <svg id="eyeOff" class="hide" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z"/><path d="m4 4 16 16"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="row">
        <label class="check"><input type="checkbox" id="rememberMe" checked>在此设备上记住我</label>
        <button type="button" class="linkbtn" id="forgotBtn">忘记密码？</button>
      </div>
      <p class="err" id="errPass" role="alert" hidden></p>
      <button type="submit" class="primary" id="btnPass">进入值守台</button>
    </form>

    <form id="formCode" class="panel" novalidate hidden>
      <div class="field">
        <label for="acctCode">手机号</label>
        <input id="acctCode" name="phone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="注册时使用的 11 位手机号">
      </div>
      <div class="field">
        <label for="codeInput">验证码</label>
        <div class="input-wrap">
          <input id="codeInput" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="6 位数字">
          <button type="button" class="send" id="btnSendCode">获取验证码</button>
        </div>
      </div>
      <p class="err" id="errCode" role="alert" hidden></p>
      <button type="submit" class="primary" id="btnCode">进入值守台</button>
    </form>

    <p class="fineprint">账号由值班调度统一下发 · 遇到问题请联系值班调度 400-820-0147</p>

    <div class="success" id="successPanel" hidden>
      <div class="okring" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m5 12.5 4.5 4.5L19 7.5"/>
        </svg>
      </div>
      <h2>验证通过</h2>
      <p>闸门已开，欢迎回到夜岗。<br>值守台正在载入，请稍候。</p>
      <button type="button" class="ghost" id="btnBack">返回演示</button>
    </div>
  </section>
  <span class="pillar" aria-hidden="true"></span>
</main>

<div class="runway" aria-hidden="true">
  <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
</div>

<footer class="foot">© 2025 余烬塔值守系统 · 内部平台请勿外传 · 沪ICP备2025000000号-1</footer>

<div class="modal" id="recoverModal" hidden>
  <div class="modal-backdrop" data-close></div>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="recoverTitle">
    <button type="button" class="modal-close" data-close aria-label="关闭找回密码">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <path d="M6 6l12 12M18 6 6 18"/>
      </svg>
    </button>
    <h2 id="recoverTitle">找回密码</h2>
    <p class="modal-sub">输入注册邮箱，系统将发送密码重置链接。</p>
    <form id="recoverForm" novalidate>
      <label for="recoverMail">注册邮箱</label>
      <input id="recoverMail" name="email" type="email" autocomplete="email" placeholder="如 qi.chen@nightops.cn">
      <p class="err" id="errRecover" role="alert" hidden></p>
      <button type="submit" class="primary" id="btnRecover">发送重置链接</button>
    </form>
    <div class="recover-done" id="recoverDone" hidden>
      <div class="okring small" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m5 12.5 4.5 4.5L19 7.5"/>
        </svg>
      </div>
      <p>重置链接已发送，10 分钟内有效。<br>若未收到，请查看垃圾邮件或联系值班调度。</p>
      <button type="button" class="ghost" id="btnRecoverBack">完成</button>
    </div>
    <p class="modal-fine">账号由调度统一下发？直接拨打值班调度 400-820-0147 人工重置。</p>
  </div>
</div>

<script>
(function(){
  var $ = function(s, r){ return (r || document).querySelector(s); };
  var $$ = function(s, r){ return Array.prototype.slice.call((r || document).querySelectorAll(s)); };

  var tabPass = $('#tabPass'), tabCode = $('#tabCode');
  var formPass = $('#formPass'), formCode = $('#formCode');
  var errPass = $('#errPass'), errCode = $('#errCode');
  var successPanel = $('#successPanel');
  var tabs = $('.tabs'), fineprint = $('.fineprint');

  function clearErr(){ errPass.hidden = true; errCode.hidden = true; }
  function clearInvalid(){
    $$('.invalid').forEach(function(el){ el.classList.remove('invalid'); el.removeAttribute('aria-invalid'); });
  }
  function showErr(el, msg, input){
    el.textContent = msg; el.hidden = false;
    if (input){ input.classList.add('invalid'); input.setAttribute('aria-invalid', 'true'); }
  }
  function shake(){
    var card = $('.card');
    card.classList.remove('shake');
    void card.offsetWidth;
    card.classList.add('shake');
  }
  function switchMode(mode){
    var isPass = mode === 'pass';
    tabPass.classList.toggle('active', isPass);
    tabCode.classList.toggle('active', !isPass);
    tabPass.setAttribute('aria-selected', String(isPass));
    tabCode.setAttribute('aria-selected', String(!isPass));
    formPass.hidden = !isPass;
    formCode.hidden = isPass;
    clearErr(); clearInvalid();
  }
  tabPass.addEventListener('click', function(){ switchMode('pass'); });
  tabCode.addEventListener('click', function(){ switchMode('code'); });

  document.addEventListener('input', function(e){
    if (e.target && e.target.classList && e.target.classList.contains('invalid')){
      e.target.classList.remove('invalid');
      e.target.removeAttribute('aria-invalid');
    }
  });

  var pwd = $('#pwdPass'), eye = $('#togglePass');
  eye.addEventListener('click', function(){
    var show = pwd.type === 'password';
    pwd.type = show ? 'text' : 'password';
    eye.setAttribute('aria-pressed', String(show));
    eye.setAttribute('aria-label', show ? '隐藏密码' : '显示密码');
    $('#eyeOn').classList.toggle('hide', show);
    $('#eyeOff').classList.toggle('hide', !show);
    pwd.focus();
  });

  var sendBtn = $('#btnSendCode'), timer = null;
  sendBtn.addEventListener('click', function(){
    var phone = $('#acctCode');
    var v = phone.value.trim();
    if (!v){ showErr(errCode, '请先输入手机号', phone); shake(); phone.focus(); return; }
    if (!/^1\d{10}$/.test(v)){ showErr(errCode, '手机号格式不正确，应为 11 位数字', phone); shake(); phone.focus(); return; }
    clearErr(); clearInvalid();
    var left = 60;
    sendBtn.disabled = true;
    sendBtn.textContent = left + 's 后重发';
    timer = setInterval(function(){
      left -= 1;
      if (left <= 0){
        clearInterval(timer);
        sendBtn.disabled = false;
        sendBtn.textContent = '重新获取';
      } else {
        sendBtn.textContent = left + 's 后重发';
      }
    }, 1000);
  });

  function fakeAuth(btn, done){
    btn.disabled = true;
    btn.classList.add('loading');
    setTimeout(function(){
      btn.disabled = false;
      btn.classList.remove('loading');
      done();
    }, 900);
  }
  function showSuccess(){
    formPass.hidden = true;
    formCode.hidden = true;
    tabs.hidden = true;
    fineprint.hidden = true;
    successPanel.hidden = false;
  }

  formPass.addEventListener('submit', function(e){
    e.preventDefault();
    clearErr(); clearInvalid();
    var acct = $('#acctPass'), pw = $('#pwdPass');
    if (!acct.value.trim()){ showErr(errPass, '请输入账号', acct); shake(); acct.focus(); return; }
    if (!pw.value){ showErr(errPass, '请输入密码', pw); shake(); pw.focus(); return; }
    fakeAuth($('#btnPass'), showSuccess);
  });

  formCode.addEventListener('submit', function(e){
    e.preventDefault();
    clearErr(); clearInvalid();
    var phone = $('#acctCode'), code = $('#codeInput');
    var v = phone.value.trim();
    if (!v){ showErr(errCode, '请先输入手机号', phone); shake(); phone.focus(); return; }
    if (!/^1\d{10}$/.test(v)){ showErr(errCode, '手机号格式不正确，应为 11 位数字', phone); shake(); phone.focus(); return; }
    if (!/^\d{6}$/.test(code.value.trim())){ showErr(errCode, '验证码为 6 位数字', code); shake(); code.focus(); return; }
    fakeAuth($('#btnCode'), showSuccess);
  });

  $('#btnBack').addEventListener('click', function(){
    successPanel.hidden = true;
    tabs.hidden = false;
    fineprint.hidden = false;
    formPass.reset();
    formCode.reset();
    switchMode('pass');
  });

  var modal = $('#recoverModal');
  function openModal(){
    modal.hidden = false;
    $('#recoverForm').hidden = false;
    $('#recoverDone').hidden = true;
    $('#recoverMail').value = '';
    $('#recoverMail').classList.remove('invalid');
    $('#errRecover').hidden = true;
    $('#recoverMail').focus();
  }
  function closeModal(){ modal.hidden = true; }
  $('#forgotBtn').addEventListener('click', openModal);
  modal.addEventListener('click', function(e){
    if (e.target.closest('[data-close]')) closeModal();
  });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && !modal.hidden) closeModal();
  });
  $('#recoverForm').addEventListener('submit', function(e){
    e.preventDefault();
    var mail = $('#recoverMail'), err = $('#errRecover');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(mail.value.trim())){
      err.textContent = '邮箱格式不正确，请检查后重试';
      err.hidden = false;
      mail.classList.add('invalid');
      mail.focus();
      return;
    }
    $('#recoverForm').hidden = true;
    $('#recoverDone').hidden = false;
  });
  $('#btnRecoverBack').addEventListener('click', closeModal);
})();
</script>
</body>
</html>
