<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>芽泥 · 注册</title>
<style>
  :root{
    --cream:#fbf8f2;
    --leaf:#3e7d4f;
    --leaf-deep:#2c5e3b;
    --leaf-soft:#e3efdf;
    --tangerine:#e8853d;
    --ink:#263627;
    --ink-soft:#5c6b5a;
    --ink-mute:#96a192;
    --line:#d9e2d0;
    --card:#ffffff;
    --shadow:0 16px 40px rgba(38,68,44,.10);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:var(--cream);
    background-image:radial-gradient(rgba(62,125,79,.06) 1.2px,transparent 1.2px);
    background-size:22px 22px;
    color:var(--ink);
    font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif;
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 16px;
  }
  .card{
    width:100%;max-width:920px;background:var(--card);border-radius:24px;
    box-shadow:var(--shadow);overflow:hidden;
    display:grid;grid-template-columns:0.9fr 1.1fr;min-height:600px;
  }
  /* 左侧品牌插画 */
  .brand{
    background:linear-gradient(165deg,#dfeee0 0%,#cfe4cf 55%,#bcd8bd 100%);
    padding:44px 36px;display:flex;flex-direction:column;justify-content:space-between;
    position:relative;overflow:hidden;
  }
  .brand .logo{font-size:20px;font-weight:800;color:var(--leaf-deep);letter-spacing:.06em;display:flex;align-items:center;gap:8px}
  .brand .logo svg{width:26px;height:26px}
  .brand .hero{margin:8px 0;text-align:center}
  .brand .hero svg{width:100%;max-width:280px;height:auto}
  .brand .slogan{font-size:14px;line-height:2;color:var(--leaf-deep);background:rgba(255,255,255,.75);border-radius:16px;padding:14px 18px;backdrop-filter:none}
  .brand .steps{margin-top:16px;display:flex;gap:10px;font-size:11px;color:var(--leaf-deep);font-weight:600}
  .brand .steps span{flex:1;background:rgba(255,255,255,.65);border-radius:999px;padding:8px 6px;text-align:center}
  /* 右侧表单 */
  .form{padding:48px 52px 40px;display:flex;flex-direction:column;justify-content:center}
  .kicker{font-size:11px;font-weight:700;letter-spacing:.22em;color:var(--tangerine);margin-bottom:10px}
  h1{font-size:24px;line-height:1.3;margin-bottom:6px}
  .sub{font-size:13px;color:var(--ink-soft);margin-bottom:26px}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:7px}
  .field label em{font-style:normal;color:var(--tangerine);margin-left:2px}
  .field input{
    width:100%;padding:12px 14px;font-size:14px;color:var(--ink);
    background:#fbfbf7;border:1.5px solid var(--line);border-radius:12px;
    font-family:inherit;outline:none;transition:border-color .15s,box-shadow .15s;
  }
  .field input::placeholder{color:#b4bfae}
  .field input:focus{border-color:var(--leaf);box-shadow:0 0 0 3px rgba(62,125,79,.14)}
  .field input.bad{border-color:#d4524a;box-shadow:0 0 0 3px rgba(212,82,74,.12)}
  .field .hint{margin-top:6px;font-size:11px;color:var(--ink-mute)}
  .field .hint.err{color:#c0443c}
  .agree{display:flex;gap:8px;align-items:flex-start;font-size:12px;color:var(--ink-soft);margin:2px 0 20px;user-select:none;cursor:pointer}
  .agree input{accent-color:var(--leaf);margin-top:2px}
  .agree a{color:var(--leaf);text-decoration:none}
  .agree a:hover{text-decoration:underline}
  .submit{
    width:100%;padding:14px;font-size:15px;font-weight:700;letter-spacing:.12em;
    background:var(--leaf);color:#fff;border:none;border-radius:14px;cursor:pointer;
    font-family:inherit;transition:background .15s,transform .1s,box-shadow .15s;
  }
  .submit:hover{background:var(--leaf-deep);box-shadow:0 8px 18px rgba(44,94,59,.28)}
  .submit:active{transform:translateY(1px)}
  .submit:disabled{background:var(--ink-mute);cursor:default;box-shadow:none}
  .toast{
    margin-top:16px;font-size:12px;line-height:1.7;padding:10px 14px;border-radius:12px;min-height:38px;
    background:var(--leaf-soft);color:var(--leaf-deep);opacity:0;transform:translateY(-4px);
    transition:opacity .25s,transform .25s;
  }
  .toast.show{opacity:1;transform:none}
  .toast.bad{background:#fbe9e7;color:#a33a33}
  .login-link{margin-top:18px;font-size:12px;color:var(--ink-mute);text-align:center}
  .login-link a{color:var(--leaf);font-weight:600;text-decoration:none}
  .login-link a:hover{text-decoration:underline}
  @media (max-width:840px){
    .card{grid-template-columns:1fr;min-height:0}
    .brand{padding:28px 24px}
    .brand .hero svg{max-width:180px}
    .form{padding:32px 24px 36px}
  }
  @media (prefers-reduced-motion:reduce){
    .submit,.field input,.toast{transition:none}
    .toast{transform:none}
  }
</style>
</head>
<body>
<main class="card">
  <section class="brand" aria-label="品牌区">
    <div class="logo">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c-2.5 2-4 5-4 8 0 3 1.5 5 4 6 2.5-1 4-3 4-6 0-3-1.5-6-4-8z" fill="#2c5e3b"/><path d="M12 13v8" stroke="#2c5e3b" stroke-width="1.6" stroke-linecap="round"/><path d="M8 19.5c2.6 1 5.4 1 8 0" stroke="#2c5e3b" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>
      芽泥 Bai-ny
    </div>
    <div class="hero">
      <svg viewBox="0 0 280 240" role="img" aria-label="盆栽新芽插画">
        <ellipse cx="140" cy="216" rx="104" ry="14" fill="#3e7d4f" opacity=".18"/>
        <rect x="106" y="168" width="68" height="52" rx="10" fill="#e8853d"/>
        <path d="M118 120 Q140 84 162 120" fill="#3e7d4f" opacity=".55"/>
        <path d="M140 168 L140 96" stroke="#5c6b5a" stroke-width="6" stroke-linecap="round"/>
        <path d="M140 104 C120 92 112 70 118 48 C138 58 148 82 140 104 Z" fill="#3e7d4f"/>
        <path d="M140 108 C158 100 166 80 162 60 C146 70 138 90 140 108 Z" fill="#68a578"/>
        <circle cx="252" cy="52" r="7" fill="#e8853d"/>
        <circle cx="22" cy="92" r="5" fill="#68a578"/>
        <path d="M30 40 q10 -8 20 0" stroke="#68a578" stroke-width="3" fill="none" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="slogan">起个名字，种下第一株属于你的主页。泥里的事，交给芽泥帮你记、帮你长、帮你开花。</div>
    <div class="steps"><span>1 起名</span><span>2 种下</span><span>3 等待开花</span></div>
  </section>

  <section class="form" aria-label="注册表单">
    <p class="kicker">NEW MEMBER · 01</p>
    <h1>加入芽泥</h1>
    <p class="sub">两分钟建好你的园圃。已有账号的伙伴请直接去登录。</p>

    <form id="regForm" novalidate>
      <div class="field">
        <label for="nick">园圃昵称<em>*</em></label>
        <input id="nick" name="nick" type="text" maxlength="16" placeholder="比如：南窗红豆" autocomplete="nickname">
        <p class="hint" id="nickHint">最多 16 个字，之后随时可改。</p>
      </div>
      <div class="field">
        <label for="mail">邮箱<em>*</em></label>
        <input id="mail" name="mail" type="email" placeholder="you@example.com" autocomplete="email">
        <p class="hint" id="mailHint">用于找回密码，不会公开。</p>
      </div>
      <div class="field">
        <label for="pwd">密码<em>*</em></label>
        <input id="pwd" name="pwd" type="password" placeholder="至少 8 位，含字母和数字" autocomplete="new-password">
        <p class="hint" id="pwdHint">至少 8 位，含字母和数字。</p>
      </div>
      <label class="agree"><input type="checkbox" id="agree"> 我已阅读并同意<a href="#">《园圃公约》</a>与<a href="#">《种子条款》</a></label>
      <button class="submit" id="submitBtn" type="submit">种下账号</button>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </form>

    <p class="login-link">已经是一盆老苗？<a href="#">去登录</a></p>
  </section>
</main>
<script>
(function(){
  var form=document.getElementById('regForm'),
      nick=document.getElementById('nick'),nickHint=document.getElementById('nickHint'),
      mail=document.getElementById('mail'),mailHint=document.getElementById('mailHint'),
      pwd=document.getElementById('pwd'),pwdHint=document.getElementById('pwdHint'),
      agree=document.getElementById('agree'),
      btn=document.getElementById('submitBtn'),toast=document.getElementById('toast');

  function show(msg,bad){
    toast.textContent=msg;
    toast.classList.toggle('bad',!!bad);
    toast.classList.add('show');
  }
  function clearBad(){
    [nick,mail,pwd].forEach(function(i){i.classList.remove('bad')});
  }

  form.addEventListener('submit',function(e){
    e.preventDefault();clearBad();
    var ok=true;
    if(!nick.value.trim()){nick.classList.add('bad');nickHint.textContent='请先给园圃起个名字。';nickHint.classList.add('err');ok=false;}
    else{nickHint.textContent='最多 16 个字，之后随时可改。';nickHint.classList.remove('err');}
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(mail.value.trim())){
      mail.classList.add('bad');mailHint.textContent='邮箱格式像是少了一片叶子，检查一下。';mailHint.classList.add('err');ok=false;
    }else{mailHint.textContent='用于找回密码，不会公开。';mailHint.classList.remove('err');}
    if(!/^(?=.*[A-Za-z])(?=.*\d).{8,}$/.test(pwd.value)){
      pwd.classList.add('bad');pwdHint.textContent='密码至少 8 位，且同时包含字母和数字。';pwdHint.classList.add('err');ok=false;
    }else{pwdHint.textContent='至少 8 位，含字母和数字。';pwdHint.classList.remove('err');}
    if(!agree.checked){show('还需要勾选同意《园圃公约》才能种下账号。',true);ok=false;}
    if(!ok)return;
    btn.disabled=true;btn.textContent='正在松土…';
    setTimeout(function(){
      btn.disabled=false;btn.textContent='种下账号';
      show('✓ 账号已创建：欢迎来到芽泥，南窗红豆，你的园圃从今天开始发芽。',false);
    },900);
  });

  [nick,mail,pwd].forEach(function(i){i.addEventListener('input',function(){i.classList.remove('bad')})});
  nick.focus();
})();
</script>
</body>
</html>
