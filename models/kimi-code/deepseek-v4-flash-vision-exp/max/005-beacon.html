<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雾灯 · 找回密码</title>
<style>
  :root{
    --sea:#10203a;
    --sea-2:#0a1426;
    --fog:#e9eef4;
    --fog-soft:#b8c3d3;
    --fog-mute:#7d8ba1;
    --lamp:#e9b64a;
    --lamp-deep:#b8862e;
    --warn:#cf4b34;
    --warn-soft:#fbe4dc;
    --ok:#3f8f6b;
    --ink:#1d2a40;
    --line:#d3dbe6;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:
      radial-gradient(1000px 620px at 20% -20%, #1a2c4d 0%, transparent 62%),
      linear-gradient(180deg,#0a1426 0%,#132643 100%);
    color:var(--fog);
    font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif;
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 16px;
  }
  .lg-wrap{width:100%;max-width:960px;display:grid;grid-template-columns:1fr 1.1fr;min-height:560px;border-radius:20px;overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.5)}
  .lg-visual{
    background:linear-gradient(180deg,#0d1b33 0%,#0a1426 100%);
    padding:44px 38px;display:flex;flex-direction:column;justify-content:space-between;
    position:relative;overflow:hidden;
  }
  .lg-visual::before{
    content:"";position:absolute;top:-40px;right:-60px;width:280px;height:280px;border-radius:50%;
    background:radial-gradient(circle,rgba(233,182,74,.22),transparent 68%);
  }
  .lg-visual .mark{font-size:20px;font-weight:800;letter-spacing:.1em;color:var(--fog)}
  .lg-visual .mark i{font-style:normal;color:var(--lamp)}
  .lg-visual .illus{margin:10px auto;max-width:300px;width:100%}
  .lg-visual .illus svg{width:100%;height:auto;display:block}
  .lg-visual .note{font-size:12.5px;line-height:2;color:var(--fog-soft);border-top:1px solid rgba(233,238,244,.15);padding-top:16px}
  .lg-visual .note b{color:var(--lamp)}
  .form-zone{background:var(--fog);color:var(--ink);padding:52px 50px 40px;display:flex;flex-direction:column;justify-content:center}
  .kicker{font-size:11px;letter-spacing:.3em;color:var(--lamp-deep);font-weight:700;margin-bottom:10px}
  h1{font-size:25px;margin-bottom:6px}
  .sub{font-size:13px;color:#5b6a80;margin-bottom:26px}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:12px;font-weight:600;color:#44536b;margin-bottom:7px}
  .field input{
    width:100%;padding:13px 14px;font-size:15px;color:var(--ink);
    background:#fff;border:1.5px solid #cfd8e4;border-radius:10px;outline:none;
    font-family:inherit;transition:border-color .15s,box-shadow .15s;
  }
  .field input::placeholder{color:#9aa7ba}
  .field input:focus{border-color:var(--lamp-deep);box-shadow:0 0 0 3px rgba(184,134,46,.18)}
  .send{
    width:100%;padding:14px;font-size:15px;font-weight:700;letter-spacing:.14em;
    background:var(--lamp);color:#221a10;border:none;border-radius:10px;cursor:pointer;
    font-family:inherit;transition:background .15s,transform .1s,box-shadow .15s;
  }
  .send:hover{background:#f3c76e;box-shadow:0 10px 22px rgba(233,182,74,.35)}
  .send:active{transform:translateY(1px)}
  .send:disabled{background:#d8cfae;cursor:default}
  .state-card{
    display:none;border:1px solid #d3dbe6;border-radius:12px;padding:16px;margin-top:6px;
    background:#fff;font-size:13px;line-height:2;color:#44536b;
  }
  .state-card.show{display:block}
  .state-card .row{display:flex;align-items:center;gap:10px;font-weight:600;color:var(--ink)}
  .state-card .dot{width:26px;height:26px;border-radius:50%;background:#f0f3f8;display:flex;align-items:center;justify-content:center;font-size:13px;flex:none}
  .state-card.waiting .dot{background:var(--warn-soft);color:var(--warn);animation:pulse 1.6s ease-in-out infinite}
  .state-card.done .dot{background:#e2efe7;color:var(--ok)}
  .state-card .timer{margin-top:6px;font-size:12px;color:#7d8ba1;font-family:"Courier New",Consolas,monospace}
  .state-card .alt-line{margin-top:8px;font-size:12px;color:#5b6a80}
  .state-card button.resend{
    background:none;border:none;color:var(--lamp-deep);font-size:12px;font-weight:700;cursor:pointer;
    font-family:inherit;padding:0;margin-top:8px;
  }
  .state-card button.resend:hover{text-decoration:underline}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
  .backlink{margin-top:20px;text-align:center;font-size:12px;color:#7d8ba1}
  .backlink a{color:#2e5f86;text-decoration:none;font-weight:600}
  .backlink a:hover{text-decoration:underline}
  @media (max-width:820px){
    .lg-wrap{grid-template-columns:1fr;min-height:0}
    .lg-visual{padding:26px 24px;order:2}
    .lg-visual .illus{max-width:200px}
    .form-zone{padding:36px 26px 40px}
  }
  @media (prefers-reduced-motion:reduce){
    .send,.field input{transition:none}
    .state-card.waiting .dot{animation:none}
  }
</style>
</head>
<body>
<main class="lg-wrap">
  <section class="lg-visual" aria-label="灯塔区">
    <div class="mark">雾灯 <i>Foglight</i></div>
    <div class="illus">
      <svg viewBox="0 0 300 260" role="img" aria-label="雾中灯塔插画">
        <path d="M0 224 L70 180 L150 232 L230 176 L300 226 L300 260 L0 260 Z" fill="#15233d"/>
        <path d="M0 236 L66 208 L148 244 L232 202 L300 240 L300 260 L0 260 Z" fill="#0d1830"/>
        <rect x="118" y="74" width="64" height="130" rx="8" fill="#e9eef4"/>
        <path d="M118 96 h64 M118 120 h64 M118 144 h64" stroke="#cf4b34" stroke-width="26"/>
        <rect x="104" y="48" width="92" height="30" rx="6" fill="#1a2c4d"/>
        <rect x="128" y="12" width="44" height="40" rx="8" fill="#e9b64a"/>
        <circle cx="150" cy="32" r="18" fill="#f3cd6f"/>
        <rect x="140" y="170" width="20" height="34" rx="3" fill="#cf4b34"/>
        <path d="M196 30 L300 8 L300 44 Z" fill="#e9b64a" opacity=".55"/>
        <path d="M104 30 L0 8 L0 44 Z" fill="#e9b64a" opacity=".4"/>
        <circle cx="248" cy="64" r="4" fill="#e9eef4" opacity=".8"/>
        <circle cx="60" cy="100" r="3" fill="#e9eef4" opacity=".6"/>
        <path d="M30 150 q14 -10 28 0 M246 160 q12 -9 24 0" stroke="#b8c3d3" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      </svg>
    </div>
    <p class="note">灯光在雾里指路，密码在忘了的时候也一样。<b>雾灯局全年 3,500 次</b>帮人点回门前的灯。</p>
  </section>

  <section class="form-zone" aria-label="找回密码表单">
    <p class="kicker">RECOVERY · 编号 1447</p>
    <h1>找回密码</h1>
    <p class="sub">输入注册时留的联系方式，我们寄去一盏新的引路灯。</p>

    <form id="recForm" novalidate>
      <div class="field">
        <label for="contact">注册邮箱或手机号</label>
        <input id="contact" type="text" placeholder="you@example.com 或 138 0000 0000" autocomplete="username">
      </div>
      <button class="send" id="sendBtn" type="submit">寄出引路灯</button>
    </form>

    <div class="state-card waiting" id="waitCard" role="status" aria-live="polite">
      <div class="row"><span class="dot">✉</span> 引路灯已寄出</div>
      <div class="timer" id="timer">30 秒后可重新点亮</div>
      <div class="alt-line">30 分钟内没收到？先翻翻垃圾邮件柜。</div>
      <button class="resend" id="resendBtn" type="button">重发一次</button>
    </div>

    <div class="state-card done" id="doneCard">
      <div class="row"><span class="dot">✓</span> 邮件已重新到达</div>
      <div class="alt-line">打开邮件里的「重新点亮」，就能设置新密码。</div>
    </div>

    <p class="backlink">想起来了？<a href="#">返回登录</a></p>
  </section>
</main>
<script>
(function(){
  var form=document.getElementById('recForm'),
      contact=document.getElementById('contact'),
      sendBtn=document.getElementById('sendBtn'),
      waitCard=document.getElementById('waitCard'),
      doneCard=document.getElementById('doneCard'),
      timer=document.getElementById('timer'),
      resend=document.getElementById('resendBtn'),
      LEFT=30;

  function startWait(){
    LEFT=30;
    waitCard.classList.remove('show');doneCard.classList.remove('show');
    waitCard.classList.add('show');
    timer.textContent=LEFT+' 秒后可重新点亮';
    var t=setInterval(function(){
      LEFT--;
      timer.textContent=Math.max(LEFT,0)+' 秒后可重新点亮';
      if(LEFT<=0){clearInterval(t);timer.textContent='现在就可以再次点亮';resend.disabled=false;}
    },1000);
    resend.disabled=true;
  }
  form.addEventListener('submit',function(e){
    e.preventDefault();
    var v=contact.value.trim();
    if(!v){alert('请先填写注册邮箱或手机号。');contact.focus();return;}
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v) && !/^1[3-9]\d{9}$/.test(v.replace(/[\s-]/g,''))){
      alert('这个联系方式看起来不像邮箱或手机号，请检查。');return;
    }
    sendBtn.disabled=true;sendBtn.textContent='正在点亮…';
    setTimeout(function(){
      sendBtn.disabled=false;sendBtn.textContent='寄出引路灯';
      startWait();
    },800);
  });
  resend.addEventListener('click',function(){
    doneCard.classList.add('show');
    startWait();
  });
  contact.focus();
})();
</script>
</body>
</html>
