<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>胡同口小卖部 · 采购筐</title>
<style>
  :root{
    --deli:#fdf3e7;
    --deli-2:#f8e8d4;
    --cream:#fff9ef;
    --pink:#e75480;
    --pink-deep:#c33a63;
    --pink-soft:#fde4ec;
    --red:#d43a2f;
    --teal:#3e8d84;
    --teal-deep:#2c6a63;
    --gold:#e2a63d;
    --ink:#4a2c21;
    --ink-soft:#7c5a4a;
    --ink-mute:#ac927e;
    --line:#e8d4be;
    --cash:#b98a5a;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:
      radial-gradient(900px 520px at 88% -10%, rgba(231,84,128,.09), transparent 60%),
      var(--deli);
    color:var(--ink);
    font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif;
    min-height:100vh;display:flex;justify-content:center;padding:0 14px 70px;
  }
  .wrap{width:100%;max-width:1100px}
  /* 顶 */
  .top{
    display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;
    padding:24px 4px 16px;border-bottom:2px solid var(--pink);
  }
  .top .name{display:flex;align-items:center;gap:12px}
  .top .name .m{width:40px;height:40px;border-radius:50%;background:var(--pink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:19px;box-shadow:0 4px 10px rgba(231,84,128,.3)}
  .top h1{font-size:21px;font-weight:900;letter-spacing:.04em}
  .top .sub{font-size:11px;color:var(--ink-mute);margin-top:3px}
  .top .back{font-size:12.5px;color:var(--teal);cursor:pointer;border-bottom:1px dashed var(--teal)}
  /* 主区 */
  .work{display:grid;grid-template-columns:1fr 330px;gap:22px;margin-top:22px}
  .list{display:flex;flex-direction:column;gap:14px}
  .item{
    display:grid;grid-template-columns:86px 1fr 130px;gap:16px;align-items:center;
    background:var(--cream);border:1px solid var(--line);border-radius:14px;padding:14px 16px;
    box-shadow:0 3px 0 rgba(74,44,33,.08);transition:box-shadow .15s;
  }
  .item:hover{box-shadow:0 8px 20px rgba(74,44,33,.14)}
  .item .thumb{
    width:86px;height:86px;border-radius:10px;background:var(--deli-2);display:flex;align-items:center;justify-content:center;overflow:hidden;
  }
  .item .thumb svg{width:100%;height:100%}
  .item .mid .nm{font-size:14.5px;font-weight:800}
  .item .mid .ds{font-size:11px;color:var(--ink-soft);margin-top:4px;line-height:1.6}
  .item .mid .pj{font-size:12px;color:var(--pink-deep);font-weight:800;margin-top:6px}
  .item .side{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
  .item .stepper{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:99px;overflow:hidden;background:#fff}
  .item .stepper button{width:32px;height:30px;border:none;background:none;font-size:15px;cursor:pointer;color:var(--ink-soft);font-family:inherit}
  .item .stepper button:hover{background:var(--pink-soft);color:var(--pink-deep)}
  .item .stepper .n{width:38px;text-align:center;font-size:13.5px;font-weight:800}
  .item .line-total{font-size:15px;font-weight:900;color:var(--ink)}
  .item .del{font-size:11px;color:var(--ink-mute);cursor:pointer;text-decoration:underline}
  .item .del:hover{color:var(--red)}
  .item.empty{
    grid-template-columns:1fr;text-align:center;padding:34px 20px;color:var(--ink-soft);
  }
  .item.empty .big{font-size:30px;margin-bottom:8px}
  /* 结算 */
  .checkout{
    align-self:start;background:var(--cream);border:1px solid var(--line);border-radius:16px;
    padding:20px 20px 18px;position:sticky;top:20px;box-shadow:0 8px 24px rgba(74,44,33,.12);
  }
  .checkout h2{font-size:15px;font-weight:900;display:flex;align-items:center;gap:8px;margin-bottom:14px}
  .checkout h2 .cash{width:26px;height:26px;border-radius:8px;background:var(--cash);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px}
  .checkout .r{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-soft);padding:7px 0}
  .checkout .r.total{font-size:15px;font-weight:900;color:var(--ink);border-top:1px dashed var(--line);margin-top:6px;padding-top:12px}
  .checkout .r.total b{font-size:20px;color:var(--pink-deep)}
  .save-tip{font-size:11px;color:var(--teal-deep);background:var(--pink-soft);border-radius:8px;padding:8px 10px;margin-top:10px;line-height:1.7}
  .pay{
    width:100%;margin-top:14px;padding:14px;border:none;border-radius:12px;background:var(--pink);
    color:#fff;font-size:15px;font-weight:900;letter-spacing:.14em;cursor:pointer;font-family:inherit;
    box-shadow:0 5px 0 var(--pink-deep);transition:background .15s,transform .1s,box-shadow .1s;
  }
  .pay:hover{background:#ed5f8d}
  .pay:active{transform:translateY(2px);box-shadow:0 3px 0 var(--pink-deep)}
  .pay:disabled{background:var(--ink-mute);box-shadow:0 5px 0 #8f7666;cursor:default}
  .note{font-size:10.5px;color:var(--ink-mute);text-align:center;margin-top:10px}
  @media (max-width:900px){
    .work{grid-template-columns:1fr}
    .checkout{position:static}
    .item{grid-template-columns:70px 1fr;grid-template-rows:auto auto}
    .item .side{grid-column:2;flex-direction:row;align-items:center;justify-content:space-between;width:100%}
    .item .thumb{width:70px;height:70px}
  }
  @media (prefers-reduced-motion:reduce){
    .item,.pay{transition:none}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="name">
      <span class="m">¥</span>
      <div>
        <h1>采购筐</h1>
        <p class="sub">胡同口小卖部 · 今日开张 08:00–22:00</p>
      </div>
    </div>
    <span class="back" id="back">← 继续逛逛</span>
  </header>

  <div class="work">
    <section class="list" id="list" aria-label="购物车列表"></section>

    <aside class="checkout" aria-label="结算区">
      <h2><span class="cash">￥</span> 结账台</h2>
      <div class="r"><span>商品小计</span><span id="sub">¥0.0</span></div>
      <div class="r"><span>零头抹掉</span><span id="disc">−¥0.0</span></div>
      <div class="r"><span>送货</span><span id="ship">¥5.0</span></div>
      <div class="r total"><span>应收</span><b id="grand">¥0.0</b></div>
      <div class="save-tip" id="tip">再加 3.0 元就免 5 元送货费！</div>
      <button class="pay" id="pay" type="button">去结账</button>
      <p class="note">支持现金、微信、推车记账</p>
    </aside>
  </div>
</div>
<script>
(function(){
  var seed=[
    {id:1,name:'山楂丹 250g',ds:'老配方 · 0.25kg 盒装',price:8.5,unit:'元/盒',qty:2,t:'a'},
    {id:2,name:'橘子汽水（老瓶）',ds:'玻璃瓶 · 押金 1 元退瓶',price:5.0,unit:'元/瓶',qty:3,t:'b'},
    {id:3,name:'儿童橡皮糖 混色',ds:'散称 250g 起',price:12.0,unit:'元/500g',qty:1,t:'c'},
    {id:4,name:'咪咪虾条 大包',ds:'怀旧经典 · 90g',price:4.5,unit:'元/包',qty:1,t:'d'},
    {id:5,name:'九制话梅 罐装',ds:'酸到眯眼 · 300g',price:9.8,unit:'元/罐',qty:1,t:'e'}
  ];
  var thumbs={
    a:'<svg viewBox="0 0 100 100"><rect width="100" height="100" fill="#f8e8d4"/><circle cx="50" cy="50" r="34" fill="#d43a2f"/><circle cx="50" cy="50" r="22" fill="#e75480"/><circle cx="50" cy="50" r="10" fill="#fde4ec"/></svg>',
    b:'<svg viewBox="0 0 100 100"><rect width="100" height="100" fill="#f8e8d4"/><rect x="34" y="22" width="32" height="58" rx="8" fill="#3e8d84"/><rect x="34" y="22" width="32" height="12" fill="#2c6a63"/><path d="M42 46 h16" stroke="#fdf3e7" stroke-width="3"/></svg>',
    c:'<svg viewBox="0 0 100 100"><rect width="100" height="100" fill="#f8e8d4"/><circle cx="34" cy="46" r="12" fill="#e75480"/><circle cx="58" cy="38" r="12" fill="#e2a63d"/><circle cx="66" cy="60" r="12" fill="#d43a2f"/><circle cx="42" cy="64" r="10" fill="#3e8d84"/></svg>',
    d:'<svg viewBox="0 0 100 100"><rect width="100" height="100" fill="#f8e8d4"/><rect x="26" y="34" width="48" height="34" rx="4" fill="#e2a63d"/><path d="M26 44 h48 M26 58 h48" stroke="#b8862e" stroke-width="2"/><text x="50" y="52" font-size="11" fill="#4a2c21" text-anchor="middle">虾条</text></svg>',
    e:'<svg viewBox="0 0 100 100"><rect width="100" height="100" fill="#f8e8d4"/><rect x="30" y="24" width="40" height="58" rx="8" fill="#c33a63"/><rect x="30" y="24" width="40" height="16" fill="#9c2749"/><text x="50" y="94" font-size="9" fill="#7c5a4a" text-anchor="middle">九制话梅</text></svg>'
  };
  var SHIP=5,FREE=40;
  var data=seed.slice();
  var list=document.getElementById('list');
  function money(n){return '¥'+n.toFixed(1)}
  function calc(){
    var sub=0;data.forEach(function(i){sub+=i.price*i.qty});
    var disc=Math.floor(sub)-sub; // 抹零
    var ship=sub>=FREE?0:SHIP;
    return {sub:sub,disc:disc,ship:ship,grand:sub+ship};
  }
  function render(){
    list.innerHTML='';
    if(!data.length){
      list.innerHTML='<div class="item empty"><div class="big">🧺</div>筐还是空的——去货架上拎点东西吧。<br><span style="font-size:11px" id="goBack2">← 返回小卖部</span></div>';
      document.getElementById('goBack2')&&document.getElementById('goBack2').addEventListener('click',goBack);
    }
    data.forEach(function(it){
      var d=document.createElement('div');d.className='item';
      d.innerHTML='<div class="thumb">'+thumbs[it.t]+'</div>'+
        '<div class="mid"><div class="nm">'+it.name+'</div><div class="ds">'+it.ds+'</div><div class="pj">单价 '+it.price+' '+it.unit+'</div></div>'+
        '<div class="side">'+
          '<div class="stepper"><button type="button" data-a="minus">−</button><span class="n">'+it.qty+'</span><button type="button" data-a="plus">＋</button></div>'+
          '<div class="line-total">'+money(it.price*it.qty)+'</div>'+
          '<span class="del">删掉</span></div>';
      d.querySelector('[data-a=minus]').addEventListener('click',function(){
        if(it.qty>1){it.qty--;render();}else{data.splice(data.indexOf(it),1);render();}
      });
      d.querySelector('[data-a=plus]').addEventListener('click',function(){it.qty++;render();});
      d.querySelector('.del').addEventListener('click',function(){data.splice(data.indexOf(it),1);render();});
      list.appendChild(d);
    });
    var c=calc();
    document.getElementById('sub').textContent=money(c.sub);
    document.getElementById('disc').textContent='−'+money(c.disc);
    document.getElementById('ship').textContent=c.ship===0?'免运费':money(c.ship);
    document.getElementById('grand').textContent=money(c.grand);
    document.getElementById('tip').innerHTML=c.ship===0?'已免送货费，感谢光顾！':'再加 '+(FREE-c.sub).toFixed(1)+' 元就免 '+SHIP+' 元送货费！';
    document.getElementById('pay').disabled=!data.length;
  }
  function goBack(){}
  document.getElementById('back').addEventListener('click',goBack);
  document.getElementById('pay').addEventListener('click',function(){
    document.getElementById('pay').textContent='去结账 · 收银点亮';
    setTimeout(function(){document.getElementById('pay').textContent='去结账';},1200);
  });
  render();
})();
</script>
</body>
</html>
