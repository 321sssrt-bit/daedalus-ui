<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>山野食谱 · 槐花鸡蛋饼</title>
<style>
  :root{
    --cream:#fbf6e8;
    --cream-2:#f3ead3;
    --honey:#e0a83c;
    --honey-deep:#b9852a;
    --honey-soft:rgba(224,168,60,.14);
    --leaf:#5f7f45;
    --leaf-deep:#47622f;
    --leaf-soft:rgba(95,127,69,.12);
    --ink:#3f3720;
    --ink-soft:#6f6448;
    --ink-mute:#a89b78;
    --line:#e0d3b0;
    --line-soft:#e9dfc2;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:#e6d8b8;
    font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif;
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:26px 14px;
  }
  .phone{
    width:390px;max-width:100%;height:844px;max-height:calc(100vh - 40px);
    background:var(--cream);border-radius:36px;border:1px solid #d5c294;overflow:hidden;
    box-shadow:0 24px 60px rgba(90,70,30,.24),inset 0 0 0 6px #fffdf4;
    display:flex;flex-direction:column;position:relative;
  }
  .notch{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:120px;height:22px;border-radius:99px;background:#3f3720;z-index:20}
  .screen{flex:1;display:flex;flex-direction:column;overflow-y:auto;position:relative}
  .screen::-webkit-scrollbar{width:0}
  /* 顶部 */
  .appbar{position:sticky;top:0;z-index:10;background:rgba(251,246,232,.92);backdrop-filter:blur(6px);padding:46px 18px 10px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line-soft)}
  .appbar .b{width:34px;height:34px;border-radius:50%;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer}
  .appbar .t{font-size:11px;color:var(--ink-mute);letter-spacing:.18em}
  .appbar .r{font-size:12px;color:var(--honey-deep);font-weight:800}
  /* 主图 */
  .hero{margin:14px 16px 0;border-radius:18px;overflow:hidden;height:210px;background:var(--cream-2);position:relative}
  .hero svg{width:100%;height:100%;display:block}
  .hero .cat{position:absolute;top:12px;left:12px;background:var(--honey);color:#3f2f08;font-size:10px;font-weight:800;padding:4px 12px;border-radius:99px}
  .hero .like{
    position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.9);
    display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;border:none;
  }
  /* 标题区 */
  .head{padding:16px 18px 0}
  .head h1{font-size:22px;font-weight:900;letter-spacing:.02em;color:var(--ink)}
  .head .meta{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:11px;color:var(--ink-mute)}
  .head .meta .au{display:flex;align-items:center;gap:6px}
  .head .meta .au i{width:22px;height:22px;border-radius:50%;background:var(--leaf);color:#f7fbef;display:flex;align-items:center;justify-content:center;font-size:10px;font-style:normal}
  /* 可控调节 */
  .tunable{
    margin:14px 16px 0;background:#fffdf4;border:1px solid var(--line);border-radius:14px;padding:14px 16px;
  }
  .tunable .tt{font-size:12px;font-weight:800;color:var(--ink-soft);margin-bottom:10px;display:flex;justify-content:space-between}
  .tunable .tt .val{color:var(--honey-deep);font-weight:800}
  .tunable .seg{display:flex;gap:8px}
  .tunable .seg button{
    flex:1;padding:9px;font-size:12px;border-radius:10px;border:1.5px solid var(--line);background:var(--cream);
    color:var(--ink-soft);cursor:pointer;font-family:inherit;transition:all .12s;
  }
  .tunable .seg button.on{background:var(--leaf);border-color:var(--leaf-deep);color:#f7fbef;font-weight:800}
  .tunable .slider{margin-top:12px}
  .tunable .slider .lab{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink-mute);margin-bottom:6px}
  .tunable .slider input[type=range]{width:100%;accent-color:var(--honey)}
  /* 正文 */
  .body{padding:16px 18px 0;font-size:13.5px;line-height:2.1;color:var(--ink-soft)}
  .body h3{font-size:13px;font-weight:800;color:var(--ink);margin:14px 0 6px}
  .body ul{padding-left:4px;list-style:none}
  .body li{display:flex;gap:9px;margin-bottom:8px}
  .body li::before{content:"◐";color:var(--honey);flex:none}
  /* 底部操作条 */
  .bar{
    position:absolute;left:0;right:0;bottom:0;background:#fffdf4;border-top:1px solid var(--line);
    padding:12px 16px 20px;display:flex;gap:10px;
  }
  .bar .save{
    flex:1;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--honey);color:#3f2f08;
    border:none;border-radius:12px;padding:13px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;
    transition:background .15s;
  }
  .bar .save:hover{background:#eab54c}
  .bar .save.saved{background:var(--leaf);color:#f7fbef}
  .bar .begin{
    flex:1;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--leaf-deep);color:#f7fbef;
    border:none;border-radius:12px;padding:13px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;
  }
  .bar .begin:hover{background:#53703a}
  @media (prefers-reduced-motion:reduce){
    .tunable .seg button,.bar .save{transition:none}
  }
</style>
</head>
<body>
<div class="phone">
  <span class="notch"></span>
  <div class="screen">
    <header class="appbar">
      <span class="b">‹</span>
      <span class="t">山野食谱 · 今日 1 篇</span>
      <span class="r">全览</span>
    </header>

    <section class="hero" aria-label="主图">
      <svg viewBox="0 0 360 210" preserveAspectRatio="xMidYMid slice">
        <rect width="360" height="210" fill="#f3ead3"/>
        <ellipse cx="180" cy="238" rx="220" ry="60" fill="#e2d2a8"/>
        <circle cx="276" cy="46" r="26" fill="#e0a83c"/>
        <path d="M150 0 q-40 60 10 120 l52 0 q50 -60 10 -120 Z" fill="#5f7f45"/>
        <path d="M150 0 q40 60 -10 120" fill="none" stroke="#47622f" stroke-width="3"/>
        <circle cx="112" cy="120" r="13" fill="#fbf6e8"/><circle cx="240" cy="118" r="13" fill="#fbf6e8"/>
        <path d="M60 150 a60 44 0 0 1 88 0 Z" fill="#e0a83c"/>
        <path d="M120 140 l70 -20" stroke="#b9852a" stroke-width="5" stroke-linecap="round"/>
      </svg>
      <span class="cat">应季 · 5 月</span>
      <button class="like" id="likeBtn" type="button">♡</button>
    </section>

    <section class="head">
      <h1>槐花鸡蛋饼</h1>
      <div class="meta">
        <span class="au"><i>禾</i>禾青</span>
        <span>· 20 分钟</span>
        <span>· 485 人做过</span>
      </div>
    </section>

    <section class="tunable" aria-label="可调参数">
      <div class="tt"><span>调味浓度</span><span class="val" id="tuneVal">标准 · 甜</span></div>
      <div class="seg" id="tuneSeg">
        <button type="button">清淡</button>
        <button class="on" data-v="标准 · 甜" type="button">标准 · 甜</button>
        <button data-v="偏咸" type="button">偏咸</button>
      </div>
      <div class="slider">
        <div class="lab"><span>槐花用量</span><span id="slLab">2 把</span></div>
        <input type="range" id="sl" min="1" max="4" value="2">
      </div>
    </section>

    <section class="body">
      <h3>备料</h3>
      <ul>
        <li>鲜槐花 2 把（清水漂洗 3 遍，控干）</li>
        <li>鸡蛋 3 只 · 面粉 60 克 · 细盐少许</li>
        <li>可加：一小勺蜂蜜（甜口）</li>
      </ul>
      <h3>做法</h3>
      <p>槐花与蛋液、面粉拌匀成糊。热锅薄油，小火慢摊，两面金黄即起。趁热吃最好——凉了花香就散了。</p>
      <p style="margin-top:10px">禾青说：甜口那份请先试「标准 · 甜」，盐要少放半勺。</p>
    </section>

    <div style="height:96px"></div>
  </div>

  <div class="bar">
    <button class="save" id="saveBtn" type="button">♡ 收藏食谱</button>
    <button class="begin" type="button">开始做 ▸</button>
  </div>
</div>
<script>
(function(){
  var tune=document.getElementById('tuneVal');
  document.querySelectorAll('#tuneSeg button').forEach(function(b){
    b.addEventListener('click',function(){
      document.querySelectorAll('#tuneSeg button').forEach(function(x){x.classList.remove('on')});
      b.classList.add('on');
      tune.textContent=b.dataset.v||'清淡';
    });
  });
  var sl=document.getElementById('sl'),slLab=document.getElementById('slLab');
  sl.addEventListener('input',function(){
    slLab.textContent=sl.value+' 把';
    document.querySelector('.body li').innerHTML='鲜槐花 '+sl.value+' 把（清水漂洗 3 遍，控干）';
  });
  var like=document.getElementById('likeBtn'),save=document.getElementById('saveBtn');
  like.addEventListener('click',function(){this.textContent=this.textContent==='♡'?'♥':'♡';});
  save.addEventListener('click',function(){
    this.classList.toggle('saved');
    this.textContent=this.classList.contains('saved')?'✓ 已收藏':'♡ 收藏食谱';
  });
})();
</script>
</body>
</html>
