<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>算盘堂 · 趣味数学课</title>
<style>
  :root{
    --bamboo:#eef3ea;
    --bamboo-2:#e3ecdd;
    --jade:#3f7f5c;
    --jade-deep:#2c5f43;
    --jade-soft:rgba(63,127,92,.12);
    --cinnabar:#b03828;
    --cinnabar-deep:#8f2d20;
    --cinnabar-soft:rgba(176,56,40,.1);
    --ink:#2b3328;
    --ink-soft:#5a6455;
    --ink-mute:#95a08e;
    --amber:#d9a441;
    --amber-soft:rgba(217,164,65,.13);
    --line:#cfd9cb;
    --line-soft:#e0e8dc;
    --white:#fbfdfa;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:
      radial-gradient(1000px 600px at 50% -10%, rgba(255,255,255,.5), transparent 60%),
      var(--bamboo);
    color:var(--ink);
    font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif;
    min-height:100vh;padding:0;
  }
  .phone{
    width:100%;min-height:100vh;max-width:900px;margin:0 auto;background:var(--bamboo);
    overflow:hidden;display:flex;flex-direction:column;position:relative;
  }
  .notch{display:none}
  .screen{flex:1;display:flex;flex-direction:column;overflow-y:auto;position:relative}
  .screen::-webkit-scrollbar{width:0}
  .appbar{padding:24px 24px 8px;display:flex;justify-content:space-between;align-items:center}
  .appbar .t{font-size:14px;font-weight:900}
  .appbar .p{font-size:11px;color:var(--ink-mute)}
  /* 课程入口 */
  .lesson{
    margin:14px 24px;border:1px solid var(--line);border-radius:16px;background:var(--white);padding:20px 24px;cursor:pointer;transition:box-shadow .12s;
  }
  .lesson:hover{box-shadow:0 6px 16px rgba(43,51,40,.1)}
  .lesson .l1{display:flex;justify-content:space-between;align-items:center}
  .lesson .nm{font-size:15px;font-weight:900}
  .lesson .progress{font-size:10.5px;color:var(--ink-mute)}
  .lesson .desc{font-size:12px;color:var(--ink-soft);margin-top:8px;line-height:1.8}
  .lesson .tag{display:inline-block;margin-top:10px;font-size:10px;padding:3px 10px;border-radius:99px;background:var(--jade-soft);color:var(--jade-deep);font-weight:800}
  /* 练习视图 */
  .quiz{display:none;padding:16px 24px 40px}
  .quiz.show{display:block}
  .qcard{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:20px 20px}
  .qcard .qno{font-size:10.5px;letter-spacing:.2em;color:var(--ink-mute)}
  .qcard h2{font-size:19px;font-weight:900;margin-top:10px;line-height:1.5}
  .qcard .qbody{font-size:14px;color:var(--ink-soft);margin-top:10px;line-height:2}
  .qcard .qbody b{color:var(--ink)}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
  .opt{
    display:flex;align-items:center;gap:10px;padding:13px 16px;border:1.5px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;transition:all .12s;font-size:14px;color:var(--ink);
  }
  .opt:hover{border-color:var(--jade)}
  .opt.sel{border-color:var(--jade);background:var(--jade-soft);font-weight:700}
  .opt.correct{border-color:var(--jade);background:var(--jade-soft);color:var(--jade-deep);font-weight:800}
  .opt.wrong{border-color:var(--cinnabar);background:var(--cinnabar-soft);color:var(--cinnabar-deep)}
  .check{width:100%;margin-top:16px;padding:14px;border:none;border-radius:14px;background:var(--jade);color:#f2f8f0;font-size:15px;font-weight:900;cursor:pointer;font-family:inherit;box-shadow:0 5px 0 var(--jade-deep)}
  .check:disabled{background:var(--ink-mute);box-shadow:0 5px 0 #7c8d7c;cursor:default}
  /* 结果 */
  .res{margin-top:16px;background:var(--white);border:1.5px solid var(--line);border-radius:16px;padding:16px 18px;display:none}
  .res.show{display:block}
  .res .rt{font-size:14px;font-weight:900}
  .res .rt.bad{color:var(--cinnabar-deep)}
  .res .rt.good{color:var(--jade-deep)}
  .res .expl{font-size:12.5px;color:var(--ink-soft);line-height:2;margin-top:8px;border-top:1px dashed var(--line);padding-top:10px}
  .res .expl b{color:var(--ink)}
  .res .again{margin-top:12px;width:100%;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink-soft);font-size:13px;font-weight:800;cursor:pointer;font-family:inherit}
  /* 完成 */
  .finish{display:none;text-align:center;padding:20px 18px 30px}
  .finish.show{display:block}
  .finish .big{width:76px;height:76px;border-radius:50%;background:var(--jade);color:#f2f8f0;display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 14px}
  .finish h1{font-size:20px;font-weight:900}
  .finish p{font-size:12.5px;color:var(--ink-soft);margin-top:8px;line-height:2}
  .finish .again2{margin-top:18px;padding:12px 26px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink-soft);font-size:13px;font-weight:800;cursor:pointer;font-family:inherit}
  @media (prefers-reduced-motion:reduce){
    .opt,.check{transition:none}
  }
</style>
</head>
<body>
<div class="phone">
  <span class="notch"></span>
  <div class="screen">
    <header class="appbar">
      <span class="t">算盘堂</span>
      <span class="p">珠算 · 趣味数学</span>
    </header>

    <!-- 课程入口 -->
    <section id="homeView">
      <div class="lesson" id="lessonCard">
        <div class="l1"><span class="nm">《三个数的加法》</span><span class="progress">0 / 3 题</span></div>
        <p class="desc">用算盘练手：一宫、二宫、三宫。每道题你都有两次机会——第一次可以大胆试，答错会给出解释，订正后照样算完成。</p>
        <span class="tag">入门 · 约 6 分钟</span>
      </div>
      <div style="margin:0 16px;font-size:11px;color:var(--ink-mute);line-height:2">
        本课三题：<b style="color:var(--ink-soft)">一宫 2+7 / 二宫 15+6 / 三宫 24+17</b>。
      </div>
    </section>

    <!-- 练习 -->
    <section class="quiz" id="quizView">
      <div class="qcard">
        <p class="qno" id="qNo">第一宫 · 第 1 题</p>
        <h2 id="qTitle"></h2>
        <p class="qbody" id="qBody"></p>
        <div class="opts" id="qOpts"></div>
      </div>
      <button class="check" id="checkBtn" type="button" disabled>提交答案</button>
      <div class="res" id="resBox"></div>
    </section>

    <!-- 完成 -->
    <section class="finish" id="finishView">
      <span class="big">✓</span>
      <h1>《三个数的加法》已完成</h1>
      <p>本课 3 题全部作答完成。<br>答错的题已用解释订正——<b>订正后的答案也算完成</b>。下一课《十个数的减法》等你。</p>
      <button class="again2" id="finishAgain" type="button">再学一遍</button>
    </section>
  </div>
</div>
<script>
(function(){
  var Q=[
    {no:'第一宫 · 第 1 题',title:'算盘加一',body:'请看算盘：<b>上珠 1 颗 = 5，下珠 1 颗 = 1</b>。现在请把「2」加到「7」上，结果是多少？',
     opts:['9','8','10','11'],ans:0,expl:'7+2=9。上珠 5 加下珠 4（两颗下珠=4）即 9；也直接念口诀「七二添作九」的启蒙式记忆。'},
    {no:'第二宫 · 第 2 题',title:'两位数加法',body:'15 颗珠子是「一上四下」。老师要你<b>再加上 6</b>，满十进一，结果是多少？',
     opts:['21','20','19','22'],ans:0,expl:'15+6：个位 5+6=11，写 1 进 1；十位 1+1=2，得 21。',
     },
    {no:'第三宫 · 第 3 题',title:'进位加法',body:'24 加 17：<b>个位 4+7=11</b>，写 1 进 1；十位 2+1+1=4。得多少？',
     opts:['41','42','31','40'],ans:0,expl:'24+17=41。个位进位的 1 必须加到十位：2+1(进位)+1=4。'}
  ];
  var qi=0,picked=null,tries=0;
  var home=document.getElementById('homeView'),quiz=document.getElementById('quizView'),finishEl=document.getElementById('finishView');
  function show(view){
    home.style.display=view==='home'?'block':'none';
    quiz.classList.toggle('show',view==='quiz');
    finishEl.classList.toggle('show',view==='finish');
  }
  function renderQ(){
    var q=Q[qi];
    tries=0;picked=null;
    document.getElementById('qNo').textContent=q.no;
    document.getElementById('qTitle').textContent=q.title;
    document.getElementById('qBody').innerHTML=q.body;
    var box=document.getElementById('qOpts');box.innerHTML='';
    var res=document.getElementById('resBox');res.classList.remove('show');
    q.opts.forEach(function(o,i){
      var d=document.createElement('div');d.className='opt';d.textContent=o;
      d.addEventListener('click',function(){
        if(res.classList.contains('show'))return;
        document.querySelectorAll('#qOpts .opt').forEach(function(x){x.classList.remove('sel')});
        d.classList.add('sel');picked=i;
        document.getElementById('checkBtn').disabled=false;
      });
      box.appendChild(d);
    });
    document.getElementById('checkBtn').disabled=true;
  }
  document.getElementById('lessonCard').addEventListener('click',function(){
    show('quiz');renderQ();
  });
  document.getElementById('checkBtn').addEventListener('click',function(){
    if(picked===null)return;
    var q=Q[qi],res=document.getElementById('resBox');
    var opts=document.querySelectorAll('#qOpts .opt');
    if(picked===q.ans){
      // 正确：绿 + 跳到下一题
      opts[picked].classList.add('correct');
      res.classList.add('show');
      res.innerHTML='<div class="rt good">✓ 答对了！</div><div class="expl">'+q.expl.replace(/<b>|\<\/b>/g,'')+'</div>';
      document.getElementById('checkBtn').disabled=true;
      setTimeout(function(){
        qi++;
        if(qi<Q.length){renderQ();}else{show('finish');}
      },1500);
    }else{
      // 错误：红 + 解释 + 提供订正机会
      tries++;
      opts[picked].classList.add('wrong');
      var correctOpt=opts[q.ans];correctOpt.classList.add('correct');
      res.classList.add('show');
      res.innerHTML='<div class="rt bad">× 答错了：正确答案是「'+q.opts[q.ans]+'」</div>'+
        '<div class="expl">订正解释：'+q.expl+'<br>返回题目再次作答（第 <b>'+tries+'</b> 次机会），提交正确即算订正成功。</div>'+
        '<button class="again" id="retryBtn" type="button">返回题目再答一次</button>';
      document.getElementById('checkBtn').disabled=true;
      document.getElementById('retryBtn').addEventListener('click',function(){
        res.classList.remove('show');
        document.querySelectorAll('#qOpts .opt').forEach(function(x){x.classList.remove('sel','correct','wrong')});
        picked=null;document.getElementById('checkBtn').disabled=true;
      });
    }
  });
  document.getElementById('finishAgain').addEventListener('click',function(){
    qi=0;show('home');
  });
  show('home');
})();
</script>
</body>
</html>
