<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>咕咕通 · 会话</title>
<style>
  :root{
    --pigeon:#eef1f4;
    --pigeon-2:#e2e7ec;
    --slate:#3f4a58;
    --slate-deep:#2d3542;
    --navy:#33506b;
    --navy-deep:#243c53;
    --white:#ffffff;
    --ink:#26313d;
    --ink-soft:#57646f;
    --ink-mute:#93a0ab;
    --line:#d5dce2;
    --line-soft:#e5eaee;
    --beak:#e8944a;
    --beak-deep:#c47533;
    --beak-soft:rgba(232,148,74,.14);
    --err:#c2544b;
    --err-soft:rgba(194,84,75,.13);
    --ok:#3f8f74;
    --ok-soft:rgba(63,143,116,.13);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#dbe2e7;font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:26px 14px}
  .phone{
    width:390px;max-width:100%;height:844px;max-height:calc(100vh - 40px);background:var(--pigeon);
    border-radius:36px;border:1px solid #b9c4cc;overflow:hidden;box-shadow:0 24px 60px rgba(47,58,72,.25),inset 0 0 0 6px #fff;
    display:flex;flex-direction:column;position:relative;
  }
  .notch{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:120px;height:22px;border-radius:99px;background:#26313d;z-index:20}
  .screen{flex:1;display:flex;flex-direction:column;overflow-y:auto;position:relative}
  .screen::-webkit-scrollbar{width:0}
  /* 会话列表 */
  .list{padding:44px 14px 20px}
  .list .lt{font-size:12px;font-weight:900;padding:0 6px 12px}
  .lrow{
    display:grid;grid-template-columns:46px 1fr;gap:12px;align-items:center;background:var(--white);
    border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;cursor:pointer;
    transition:box-shadow .12s,transform .12s;
  }
  .lrow:hover{box-shadow:0 6px 14px rgba(47,58,72,.1)}
  .lrow.sel{border-color:var(--navy);background:#f7fafc}
  .lrow .ava{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;font-weight:800}
  .lrow .nm{font-size:13px;font-weight:800;color:var(--ink)}
  .lrow .last{font-size:11px;color:var(--ink-mute);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
  .lrow .meta{text-align:right;font-size:10px;color:var(--ink-mute)}
  /* 会话页 */
  .chat{display:none;flex-direction:column;height:100%}
  .chat.show{display:flex}
  .chatbar{
    background:var(--navy);padding:44px 14px 10px;display:flex;align-items:center;gap:10px;color:#f2f6fa;
  }
  .chatbar .b{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer}
  .chatbar .ava{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:800}
  .chatbar .nm{font-size:14px;font-weight:900}
  .chatbar .st{font-size:9.5px;color:#a9c3d8;margin-top:2px}
  /* 消息流 */
  .msgs{flex:1;overflow-y:auto;padding:14px 14px 10px;display:flex;flex-direction:column;gap:10px}
  .day{text-align:center;font-size:10px;color:var(--ink-mute);margin:4px 0}
  .m{max-width:78%;display:flex;flex-direction:column}
  .m .bubble{padding:10px 13px;border-radius:16px;font-size:13px;line-height:1.7;word-break:break-word}
  .m.in{align-self:flex-start}
  .m.in .bubble{background:var(--white);border:1px solid var(--line);border-bottom-left-radius:4px;color:var(--ink)}
  .m.out{align-self:flex-end;align-items:flex-end}
  .m.out .bubble{background:var(--navy);color:#f2f6fa;border-bottom-right-radius:4px}
  .m .meta-row{display:flex;align-items:center;gap:7px;margin-top:4px;font-size:10px;color:var(--ink-mute)}
  .m.out .meta-row{justify-content:flex-end}
  .st-t{font-size:10px}
  .st-t.sent{color:var(--ink-mute)}
  .st-t.deliv{color:var(--ok)}
  .st-t.err{color:var(--err);font-weight:800}
  .retry{
    font-size:10px;color:var(--err);background:var(--err-soft);border:1px solid rgba(194,84,75,.3);border-radius:99px;
    padding:3px 10px;cursor:pointer;font-family:inherit;font-weight:800;
  }
  .retry:hover{background:rgba(194,84,75,.22)}
  /* 输入条 */
  .composer{
    display:flex;gap:10px;align-items:center;background:var(--white);border-top:1px solid var(--line);
    padding:10px 12px 22px;
  }
  .composer input{
    flex:1;padding:11px 14px;border:1.5px solid var(--line);border-radius:99px;outline:none;background:var(--pigeon-2);
    font-size:13px;font-family:inherit;color:var(--ink);
  }
  .composer input:focus{border-color:var(--navy)}
  .composer .fail{
    border:none;background:var(--beak);color:#3a2510;border-radius:99px;padding:0 14px;font-size:11px;font-weight:800;cursor:pointer;font-family:inherit;
  }
  .composer .send{
    width:38px;height:38px;border-radius:50%;border:none;background:var(--navy);color:#fff;font-size:15px;cursor:pointer;font-family:inherit;flex:none;
  }
  @media (prefers-reduced-motion:reduce){
    .lrow{transition:none}
  }
</style>
</head>
<body>
<div class="phone">
  <span class="notch"></span>
  <div class="screen" style="display:flex;flex-direction:column">
    <!-- 会话列表视图 -->
    <section class="list" id="listView" style="display:flex;flex-direction:column;height:100%;overflow-y:auto">
      <p class="lt">咕咕通 · 消息</p>
      <div class="lrow sel" data-c="阿禾" data-a="#4c7f9e">
        <span class="ava" style="background:#4c7f9e">禾</span>
        <div><div class="nm">阿禾</div><div class="last">晚饭后楼下老地方？</div></div>
        <span class="meta">19:42</span>
      </div>
      <div class="lrow" data-c="老白" data-a="#8a6f4d">
        <span class="ava" style="background:#8a6f4d">白</span>
        <div><div class="nm">老白</div><div class="last">上次说的书我带来了</div></div>
        <span class="meta">18:56</span>
      </div>
      <div class="lrow" data-c="修理铺小张" data-a="#e8944a">
        <span class="ava" style="background:#e8944a">张</span>
        <div><div class="nm">修理铺小张</div><div class="last">车子好了，明天来取</div></div>
        <span class="meta">17:30</span>
      </div>
    </section>

    <!-- 会话视图 -->
    <section class="chat" id="chatView">
      <header class="chatbar">
        <span class="b" id="chatBack">‹</span>
        <span class="ava" id="cAva">禾</span>
        <div>
          <div class="nm" id="cName">阿禾</div>
          <div class="st" id="cSt">在线 · 常用</div>
        </div>
      </header>
      <div class="msgs" id="msgs"></div>
      <div class="composer">
        <input id="input" type="text" placeholder="飞只鸽子…">
        <button class="fail" id="failBtn" type="button" title="让下一条发送失败">📵 模拟断线</button>
        <button class="send" id="sendBtn" type="button">➤</button>
      </div>
    </section>
  </div>
</div>
<script>
(function(){
  var failMode=false,failOnce=false;
  var msgsEl=document.getElementById('msgs');
  var seed=[
    {who:'in',t:'来啦？我到了楼下便利店',tm:'19:38',st:'sent'},
    {who:'out',t:'三分钟后到',tm:'19:39',st:'deliv'},
    {who:'in',t:'晚饭后楼下老地方？',tm:'19:42',st:'sent'}
  ];
  function renderMsgs(){
    msgsEl.innerHTML='<div class="day">今天 19:38</div>';
    seed.forEach(function(m){
      var d=document.createElement('div');d.className='m '+m.who;
      d.innerHTML='<div class="bubble">'+m.t+'</div>'+
        '<div class="meta-row"><span>'+m.tm+'</span>'+
        (m.who==='out'?'<span class="st-t '+m.st+'">'+(m.st==='err'?'发送失败':'')+(m.st==='sent'?'已发送':'')+(m.st==='deliv'?'已送达 ✓':'')+'</span>':'')+
        (m.who==='out'&&m.st==='err'?'<button class="retry" type="button">重发</button>':'')+
        '</div>';
      if(m.st==='err'){
        d.querySelector('.retry').addEventListener('click',function(){
          m.st='deliv';
          renderMsgs();
        });
      }
      msgsEl.appendChild(d);
    });
    msgsEl.scrollTop=msgsEl.scrollHeight;
  }
  document.querySelectorAll('.lrow').forEach(function(r){
    r.addEventListener('click',function(){
      document.querySelectorAll('.lrow').forEach(function(x){x.classList.remove('sel')});
      r.classList.add('sel');
      document.getElementById('cName').textContent=r.dataset.c;
      document.getElementById('cAva').textContent=r.dataset.c.slice(0,1);
      document.getElementById('cAva').style.background=r.dataset.a;
      renderMsgs();
      document.getElementById('listView').style.display='none';
      document.getElementById('chatView').classList.add('show');
    });
  });
  document.getElementById('chatBack').addEventListener('click',function(){
    document.getElementById('chatView').classList.remove('show');
    document.getElementById('listView').style.display='flex';
  });
  document.getElementById('failBtn').addEventListener('click',function(){
    failOnce=true;
    this.textContent='📵 下一条将失败';
    this.style.background='var(--err)';this.style.color='#fff';
    setTimeout(function(){var b=document.getElementById('failBtn');b.textContent='📵 模拟断线';b.style.background='';b.style.color='';},1400);
  });
  function now(){return new Date().toTimeString().slice(0,5)}
  document.getElementById('sendBtn').addEventListener('click',function(){
    var inp=document.getElementById('input'),t=inp.value.trim();
    if(!t)return;
    var m={who:'out',t:t,tm:now(),st:failOnce?'err':'sent'};
    failOnce=false;
    seed.push(m);
    inp.value='';
    renderMsgs();
    if(m.st==='sent'){
      setTimeout(function(){
        m.st='deliv';renderMsgs();
      },700);
    }
  });
  document.getElementById('input').addEventListener('keydown',function(e){
    if(e.key==='Enter')this.nextElementSibling.click&&document.getElementById('sendBtn').click();
  });
  renderMsgs();
})();
</script>
</body>
</html>
