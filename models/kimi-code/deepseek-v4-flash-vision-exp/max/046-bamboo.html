<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>竹社 · 协作空间</title>
<style>
  :root{
    --bamboo:#eef3ea;
    --bamboo-2:#e2eadb;
    --jade:#3f7f5c;
    --jade-deep:#2c5f43;
    --jade-soft:rgba(63,127,92,.12);
    --ink:#2b3328;
    --ink-soft:#5a6455;
    --ink-mute:#95a08e;
    --amber:#d9a441;
    --amber-soft:rgba(217,164,65,.13);
    --err:#c0665a;
    --err-soft:rgba(192,102,90,.13);
    --line:#cfd9cb;
    --line-soft:#e0e8dc;
    --white:#fbfdfa;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:
      radial-gradient(1000px 600px at 50% -10%, rgba(255,255,255,.5), transparent 60%),
      var(--bamboo);
    color:var(--ink);
    font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif;
    min-height:100vh;padding:24px 20px 50px;
  }
  .wrap{max-width:1080px;margin:0 auto}
  .head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;padding-bottom:18px;border-bottom:2px solid var(--jade)}
  .head .idn{display:flex;align-items:center;gap:12px}
  .head .idn .mk{width:42px;height:42px;border-radius:12px;background:var(--jade);color:#f2f8f0;display:flex;align-items:center;justify-content:center;font-size:20px}
  .head h1{font-size:21px;font-weight:900}
  .head .sub{font-size:11px;color:var(--ink-mute);margin-top:4px}
  .head .who{font-size:12px;color:var(--ink-soft);background:var(--white);border:1px solid var(--line);border-radius:99px;padding:8px 16px}
  /* 布局 */
  .cols{display:grid;grid-template-columns:300px 1fr;gap:20px;margin-top:22px}
  .taskbox{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:18px}
  .taskbox h2{font-size:13px;font-weight:900;color:var(--ink-soft);margin-bottom:14px}
  .task{
    border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;cursor:pointer;transition:box-shadow .12s;
  }
  .task:hover{box-shadow:0 6px 14px rgba(43,51,40,.1)}
  .task.sel{border-color:var(--jade);background:#f4f9f2}
  .task .tn{font-size:13.5px;font-weight:800}
  .task .tm{font-size:10.5px;color:var(--ink-mute);margin-top:5px;line-height:1.7}
  .task .ts{display:inline-block;font-size:10px;padding:2px 10px;border-radius:99px;background:var(--jade-soft);color:var(--jade-deep);font-weight:800;margin-top:8px}
  .task.lock .ts{background:var(--amber-soft);color:#8a6415}
  .task .lockic{font-size:11px;color:#8a6415;font-weight:800;margin-top:6px;display:none}
  .task.lock .lockic{display:block}
  /* 详细 */
  .detail{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:22px 24px}
  .detail .dh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .detail h2{font-size:19px;font-weight:900}
  .detail .status{font-size:11px;font-weight:800;padding:4px 12px;border-radius:99px;background:var(--jade-soft);color:var(--jade-deep)}
  .detail .meta{font-size:12px;color:var(--ink-soft);margin-top:10px;line-height:1.9}
  .detail .desc{font-size:13px;color:var(--ink-soft);line-height:2;margin-top:12px}
  .assign{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
  .as{padding:8px 14px;border:1.5px solid var(--line);border-radius:99px;background:none;font-size:12px;cursor:pointer;font-family:inherit;color:var(--ink-soft);transition:all .12s}
  .as.sel{border-color:var(--jade);background:var(--jade-soft);color:var(--jade-deep);font-weight:800}
  .adv{margin-top:16px;display:flex;gap:8px}
  .adv button{flex:1;padding:12px;border:none;border-radius:12px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit;transition:background .15s}
  .adv .next{background:var(--jade);color:#f2f8f0}
  .adv .next:hover{background:var(--jade-deep)}
  .adv .apply{background:var(--amber);color:#3c2c0a;display:none}
  .applied{display:flex;align-items:center;gap:10px;margin-top:14px;background:var(--amber-soft);border:1px solid rgba(217,164,65,.4);border-radius:12px;padding:11px 14px;font-size:12px;color:#7a5a1c}
  .applied .ok{color:var(--jade-deep)}
  /* 活动记录 */
  .activity{margin-top:26px;background:var(--white);border:1px solid var(--line);border-radius:16px;padding:18px 22px}
  .activity h2{font-size:13px;font-weight:900;color:var(--ink-soft);margin-bottom:12px}
  .arow{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line-soft);font-size:12.5px;color:var(--ink-soft)}
  .arow:last-child{border-bottom:none}
  .arow .dot{width:8px;height:8px;border-radius:50%;background:var(--jade);flex:none}
  .arow .t{flex:1}
  .arow .tm{font-size:10.5px;color:var(--ink-mute)}
  .arow.deny .dot{background:var(--err)}
  @media (max-width:900px){
    .cols{grid-template-columns:1fr}
  }
  @media (prefers-reduced-motion:reduce){
    .task,.as,.adv button{transition:none}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <div class="idn">
      <span class="mk">竹</span>
      <div>
        <h1>竹社 · 协作空间</h1>
        <p class="sub">旬刊《新竹集》编辑部 · 稿件流转工作台</p>
      </div>
    </div>
    <span class="who">我是 校对·阿慎 · 编辑权限</span>
  </header>

  <div class="cols">
    <section class="taskbox" aria-label="任务列表">
      <h2>稿件任务</h2>
      <div id="tasks"></div>
    </section>

    <section class="detail" aria-label="任务详情">
      <div class="dh">
        <h2 id="dtTitle">—</h2>
        <span class="status" id="dtStatus">—</span>
      </div>
      <p class="meta" id="dtMeta"></p>
      <p class="desc" id="dtDesc"></p>
      <p style="font-size:11.5px;font-weight:800;color:var(--ink-soft);margin-top:16px">分派给</p>
      <div class="assign" id="dtAssign"></div>
      <div class="adv">
        <button class="apply" id="applyBtn" type="button">申请编辑权限</button>
        <button class="next" id="nextBtn" type="button">推进状态</button>
      </div>
      <div class="applied" id="appliedBox" style="display:none">✓ <span class="ok">已向主编申请「编辑权限」</span>——批准后你将能修改本文稿。</div>
    </section>
  </div>

  <section class="activity" aria-label="活动记录">
    <h2>活动记录</h2>
    <div id="actRows"></div>
  </section>
</div>
<script>
(function(){
  var STATUS=['待认领','审读中','待终审','已发稿'];
  var tasks=[
    {id:1,t:'《巷口修表匠》通讯稿',s:'审读中',m:'作者 老周 · 3000 字 · 周四截稿',desc:'一篇市井人物稿，建议删去第二段过渡，补一句清晨镜头。',lock:false},
    {id:2,t:'《菜市场观察》专栏',s:'待认领',m:'作者 小满 · 1800 字',desc:'轻松向专栏稿，语言可以更口语化。',lock:false},
    {id:3,t:'《竹社访谈：远近主编》',s:'待终审',m:'「锁定」：仅主编可推进',desc:'访谈稿已过两审，需要主编终审签字后发稿。',lock:true}
  ];
  var assignees=['阿慎（我）','老周作者','小满','竹社主编'];
  var cur=0,selAssign=0;
  var logs=[
    {t:'阿慎 将《巷口修表匠》从「待认领」推进到「审读中」',tm:'10:12',deny:false},
    {t:'小满 提交《菜市场观察》初稿',tm:'09:40',deny:false}
  ];
  function renderTasks(){
    var box=document.getElementById('tasks');box.innerHTML='';
    tasks.forEach(function(t,i){
      var d=document.createElement('div');d.className='task'+(t.lock?' lock':'')+(i===cur?' sel':'');
      d.innerHTML='<div class="tn">'+t.t+'</div><div class="tm">'+t.m+'</div>'+
        '<span class="ts">'+t.s+'</span>'+(t.lock?'<div class="lockic">🔒 权限不足 · 仅主编可推进</div>':'');
      d.addEventListener('click',function(){cur=i;renderDetail();renderTasks();});
      box.appendChild(d);
    });
  }
  function renderDetail(){
    var t=tasks[cur];
    document.getElementById('dtTitle').textContent=t.t;
    document.getElementById('dtStatus').textContent=t.s;
    document.getElementById('dtMeta').textContent=t.m;
    document.getElementById('dtDesc').textContent=t.desc;
    var ab=document.getElementById('dtAssign');ab.innerHTML='';
    assignees.forEach(function(a,i){
      var b=document.createElement('button');b.className='as'+(i===selAssign?' sel':'');b.type='button';b.textContent=a;
      b.addEventListener('click',function(){
        selAssign=i;renderDetail();
      });
      ab.appendChild(b);
    });
    var apply=document.getElementById('applyBtn'),applied=document.getElementById('appliedBox');
    if(t.lock){
      apply.style.display='block';document.getElementById('nextBtn').style.display='none';
      applied.style.display='none';
    }else{
      apply.style.display='none';document.getElementById('nextBtn').style.display='block';
      applied.style.display='none';
    }
  }
  function pushLog(txt,deny){
    logs.unshift({t:txt,tm:new Date().toTimeString().slice(0,5),deny:!!deny});
    renderLogs();
  }
  function renderLogs(){
    var box=document.getElementById('actRows');box.innerHTML='';
    logs.forEach(function(l){
      var d=document.createElement('div');d.className='arow'+(l.deny?' deny':'');
      d.innerHTML='<span class="dot"></span><span class="t">'+l.t+'</span><span class="tm">'+l.tm+'</span>';
      box.appendChild(d);
    });
  }
  document.getElementById('applyBtn').addEventListener('click',function(){
    document.getElementById('appliedBox').style.display='flex';
    pushLog('阿慎 申请《竹社访谈：远近主编》编辑权限',true);
    // 模拟主编批准：短暂延迟后解除锁定
    var t=tasks.find(function(x){return x.lock});
    setTimeout(function(){
      if(t)t.lock=false;
      renderTasks();renderDetail();
      pushLog('主编 批准：你获得《竹社访谈：远近主编》编辑权限',false);
    },900);
  });
  document.getElementById('nextBtn').addEventListener('click',function(){
    var t=tasks[cur];
    var idx=STATUS.indexOf(t.s);
    if(idx<STATUS.length-1){
      t.s=STATUS[idx+1];
      pushLog('阿慎 将《'+t.t.replace('《','').replace('》','')+'》推进到「'+t.s+'」',false);
    }
    renderTasks();renderDetail();
  });
  renderTasks();renderDetail();renderLogs();
})();
</script>
</body>
</html>
