<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>长乐客栈 · 庄主主页</title>
<style>
  :root{
    --rice:#f6f0df;
    --rice-2:#efe7d0;
    --ink:#262119;
    --ink-soft:#5d5342;
    --ink-mute:#9a8f78;
    --cinnabar:#a33b2e;
    --cinnabar-deep:#7f2a20;
    --cinnabar-soft:#f3e2da;
    --jade:#3f6e5b;
    --jade-soft:#e2ebe2;
    --line:#d3c7a9;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:
      radial-gradient(900px 520px at 50% -10%, rgba(243,226,218,.5), transparent 60%),
      var(--rice);
    background-image:
      repeating-linear-gradient(0deg,rgba(38,33,25,.025) 0 1px,transparent 1px 22px),
      radial-gradient(900px 520px at 50% -10%, rgba(243,226,218,.5), transparent 60%),
      var(--rice);
    color:var(--ink);
    font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif;
    min-height:100vh;display:flex;justify-content:center;padding:30px 16px 70px;
  }
  .scroll{
    width:100%;max-width:1000px;
    border:1px solid var(--line);
    box-shadow:0 0 0 10px var(--rice-2),0 0 0 11px var(--line),0 30px 60px rgba(38,33,25,.18);
    background:var(--rice);padding:0;
  }
  /* 榜头 */
  .band{
    display:flex;justify-content:space-between;align-items:center;padding:14px 26px;
    border-bottom:1px solid var(--line);background:var(--rice-2);
  }
  .band .inname{font-size:13px;font-weight:800;letter-spacing:.3em;color:var(--cinnabar-deep)}
  .band .addr{font-size:11px;color:var(--ink-mute);letter-spacing:.12em}
  /* 门面 */
  .porter{
    display:grid;grid-template-columns:280px 1fr;gap:26px;padding:34px 36px 24px;
    border-bottom:2px solid var(--ink);
  }
  .porter .portrait{
    background:var(--rice-2);border:1px solid var(--line);position:relative;padding:16px;
  }
  .porter .portrait svg{width:100%;height:auto;display:block}
  .porter .portrait .seal{
    position:absolute;right:-12px;top:-12px;width:56px;height:56px;border:2.5px solid var(--cinnabar);
    color:var(--cinnabar);border-radius:4px;display:flex;align-items:center;justify-content:center;
    font-family:"KaiTi",STKaiti,serif;font-size:17px;font-weight:700;transform:rotate(6deg);background:var(--rice);
  }
  .porter .who h1{font-size:30px;font-family:"KaiTi",STKaiti,"Microsoft YaHei",serif;font-weight:800;letter-spacing:.1em;color:var(--ink)}
  .porter .who .style{font-size:12.5px;color:var(--ink-soft);margin-top:6px;line-height:1.8}
  .porter .who .style b{color:var(--cinnabar)}
  .porter .who .acct{margin-top:14px;font-size:11.5px;color:var(--ink-mute);letter-spacing:.1em}
  .porter .who .nums{display:flex;gap:24px;margin-top:18px}
  .porter .who .nums .n{text-align:center}
  .porter .who .nums .n b{display:block;font-size:22px;font-weight:900;color:var(--ink);font-family:"KaiTi",STKaiti,serif}
  .porter .who .nums .n span{font-size:10.5px;color:var(--ink-mute)}
  .porter .who .ops{display:flex;gap:10px;margin-top:20px}
  .porter .who .ops .foll{
    padding:10px 22px;border:1.5px solid var(--cinnabar);background:var(--cinnabar);color:var(--rice);
    border-radius:4px;font-size:13px;font-weight:800;letter-spacing:.14em;cursor:pointer;font-family:inherit;transition:all .15s;
  }
  .porter .who .ops .foll:hover{background:var(--cinnabar-deep)}
  .porter .who .ops .mail{
    padding:10px 22px;border:1.5px solid var(--line);background:none;color:var(--ink-soft);
    border-radius:4px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s;
  }
  .porter .who .ops .mail:hover{border-color:var(--ink);color:var(--ink)}
  /* 动态留白 */
  .spaces{padding:26px 36px 10px}
  .spaces .colh{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--ink);padding-bottom:10px;margin-bottom:16px}
  .spaces .colh h2{font-size:16px;font-weight:800;letter-spacing:.22em;font-family:"KaiTi",STKaiti,serif}
  .spaces .colh .all{font-size:11px;color:var(--ink-soft);cursor:pointer;border-bottom:1px dashed var(--ink-soft)}
  .card-list{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding-bottom:8px}
  .ac{
    background:var(--rice-2);border:1px solid var(--line);padding:14px 14px 12px;cursor:pointer;transition:box-shadow .15s,transform .15s;
    display:flex;flex-direction:column;
  }
  .ac:hover{box-shadow:0 10px 22px rgba(38,33,25,.16);transform:translateY(-2px)}
  .ac .pic{height:110px;background:#fffdf6;border:1px solid var(--line);margin-bottom:10px;overflow:hidden;position:relative}
  .ac .pic svg{width:100%;height:100%}
  .ac .pic .tag{position:absolute;top:6px;left:6px;font-size:9.5px;background:var(--cinnabar);color:#fff;padding:2px 7px;border-radius:2px}
  .ac .tt{font-size:13px;font-weight:800;line-height:1.5}
  .ac .mm{font-size:10.5px;color:var(--ink-mute);margin-top:6px}
  .ac .pp{font-size:11px;color:var(--ink-soft);margin-top:8px;border-top:1px dashed var(--line);padding-top:7px;display:flex;justify-content:space-between}
  /* 客来简讯 */
  .guest{margin-top:24px;padding:20px 36px 26px;border-top:1px dashed var(--line)}
  .guest h2{font-size:15px;font-weight:800;letter-spacing:.2em;font-family:"KaiTi",STKaiti,serif;margin-bottom:14px}
  .guest .g{display:flex;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line-soft)}
  .guest .g:last-child{border-bottom:none}
  .guest .g .a{width:34px;height:34px;border-radius:50%;background:var(--jade);color:#f2f6f0;display:flex;align-items:center;justify-content:center;flex:none;font-size:12px}
  .guest .g .txt{font-size:12.5px;color:var(--ink-soft);line-height:1.8}
  .guest .g .txt b{color:var(--ink)}
  .guest .g .txt .tm{color:var(--ink-mute);font-size:10.5px;margin-left:8px}
  .foot{display:flex;justify-content:center;padding:16px 0 26px;font-size:11px;color:var(--ink-mute);letter-spacing:.2em}
  @media (max-width:860px){
    .porter{grid-template-columns:1fr}
    .porter .portrait{max-width:260px;margin:0 auto}
    .card-list{grid-template-columns:repeat(2,1fr)}
  }
  @media (max-width:520px){.card-list{grid-template-columns:1fr}}
  @media (prefers-reduced-motion:reduce){
    .ac,.porter .who .ops button{transition:none}
    .ac:hover{transform:none}
  }
</style>
</head>
<body>
<main class="scroll">
  <header class="band">
    <span class="inname">长乐客栈</span>
    <span class="addr">长安西市 · 风字街 12 号 · 掌灯不打烊</span>
  </header>

  <section class="porter" aria-label="庄主名片">
    <div class="portrait">
      <svg viewBox="0 0 240 260" role="img" aria-label="庄主画像">
        <circle cx="120" cy="96" r="52" fill="#f0e5c9"/>
        <path d="M68 96 q52 -60 104 0 l-10 8 q-42 -44 -84 0 Z" fill="#262119"/>
        <path d="M84 108 q36 -34 72 0" stroke="#262119" stroke-width="3" fill="none"/>
        <circle cx="101" cy="102" r="4" fill="#262119"/>
        <circle cx="139" cy="102" r="4" fill="#262119"/>
        <path d="M104 122 q16 12 32 0" stroke="#262119" stroke-width="2.5" fill="none"/>
        <path d="M60 190 q60 -60 120 0 l0 70 l-120 0 Z" fill="#a33b2e"/>
        <path d="M104 190 l16 34 l16 -34" fill="#f6f0df"/>
        <rect x="16" y="236" width="208" height="24" fill="#d3c7a9"/>
      </svg>
      <span class="seal">庄</span>
    </div>
    <div class="who">
      <h1>沈长乐</h1>
      <p class="style">长乐客栈<b>第三代庄主</b>。煮酒、说书、收留过路的侠客；也替街坊立字据、传口信。一杆秤称公道，一壶酒解千愁。</p>
      <p class="acct">帐号 @changle_inn · 立号 宣德三年 · 本店认证客栈</p>
      <div class="nums">
        <div class="n"><b>72</b><span>在店夜</span></div>
        <div class="n"><b>1,208</b><span>故人</span></div>
        <div class="n"><b>306</b><span>定场段子</span></div>
      </div>
      <div class="ops">
        <button class="foll" id="folBtn" type="button">留宿 · 关注</button>
        <button class="mail" type="button">递帖相谈</button>
      </div>
    </div>
  </section>

  <section class="spaces" aria-label="庄主作品">
    <div class="colh"><h2>庄主手记</h2><span class="all">翻看全部</span></div>
    <div class="card-list" id="cardList"></div>
  </section>

  <section class="guest" aria-label="客来简讯">
    <h2>客来简讯</h2>
    <div class="g"><span class="a">剑</span><p class="txt"><b>夜雨客</b>：今夜打尖，要一间能看见西市灯火的房。<span class="tm">2 刻钟前</span></p></div>
    <div class="g"><span class="a">酒</span><p class="txt"><b>杜三斤</b>：说好的「醉打金枝」下回再续，半壶记我账上。<span class="tm">1 时辰前</span></p></div>
    <div class="g"><span class="a">信</span><p class="txt"><b>柳掌柜</b>：送来的账本字迹太抖，让贵店先生再誊一遍。<span class="tm">今晨</span></p></div>
  </section>

  <footer class="foot">长乐客栈 · 宣纸为记 · 谢绝赊账（掌柜以外的客人）</footer>
</main>
<script>
(function(){
  var posts=[
    {t:'《说书人第 40 记：灯下补靴人》',m:'1 时辰前 · 24 段评',pic:'a'},
    {t:'相熟》手稿：给灶房老李的十封信',m:'昨日 · 19 段评',pic:'b'},
    {t:'客栈夜话：中秋灯会的三件旧事',m:'3 日前 · 58 段评',pic:'c'},
    {t:'「客来留诗」墙贴新收 7 首',m:'5 日前 · 12 段评',pic:'d'}
  ];
  var pics={
    a:'<svg viewBox="0 0 200 140"><rect width="200" height="140" fill="#f0e5c9"/><circle cx="100" cy="64" r="30" fill="#ffe9a8"/><path d="M60 108 h80 M70 94 h60" stroke="#5d5342" stroke-width="4"/><circle cx="42" cy="42" r="6" fill="#a33b2e"/></svg>',
    b:'<svg viewBox="0 0 200 140"><rect width="200" height="140" fill="#efe7d0"/><rect x="52" y="34" width="96" height="72" fill="#fffdf6" stroke="#d3c7a9"/><path d="M62 50 h76 M62 62 h76 M62 74 h48" stroke="#262119" stroke-width="2.5"/><circle cx="164" cy="38" r="10" fill="#a33b2e"/></svg>',
    c:'<svg viewBox="0 0 200 140"><rect width="200" height="140" fill="#f0e5c9"/><circle cx="100" cy="52" r="34" fill="#e8b64c"/><path d="M20 108 q80 -44 160 0 Z" fill="#3f6e5b"/><circle cx="52" cy="44" r="3" fill="#f6f0df"/><circle cx="152" cy="38" r="3" fill="#f6f0df"/></svg>',
    d:'<svg viewBox="0 0 200 140"><rect width="200" height="140" fill="#efe7d0"/><rect x="34" y="26" width="132" height="88" fill="#fffdf6" stroke="#d3c7a9"/><path d="M44 44 l24 24 M68 44 l-24 24" stroke="#262119" stroke-width="2"/><path d="M120 58 v20 M110 68 h20" stroke="#a33b2e" stroke-width="3"/></svg>'
  };
  var list=document.getElementById('cardList');
  posts.forEach(function(p){
    var d=document.createElement('div');d.className='ac';
    d.innerHTML='<div class="pic">'+pics[p.pic]+'<span class="tag">手记</span></div>'+
      '<div class="tt">'+p.t+'</div><div class="mm">'+p.m+'</div>'+
      '<div class="pp"><span>沈长乐</span><span>寄 ›</span></div>';
    list.appendChild(d);
  });
  var fol=document.getElementById('folBtn');
  fol.addEventListener('click',function(){
    var on=fol.textContent.indexOf('已留宿')>-1;
    fol.textContent=on?'留宿 · 关注':'已留宿夜 · 不再迷路';
    fol.style.background=on?'var(--cinnabar)':'var(--cinnabar-deep)';
  });
})();
</script>
</body>
</html>
