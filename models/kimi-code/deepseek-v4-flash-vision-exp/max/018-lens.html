<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>光蚀相机行 · 商品详情</title>
<style>
  :root{
    --gallery:#f4f5f7;
    --gallery-2:#e9ebef;
    --metal:#3a3f46;
    --metal-2:#545b64;
    --graphite:#23272d;
    --optic:#2f7fd4;
    --optic-deep:#22589c;
    --optic-soft:rgba(47,127,212,.12);
    --ivory:#f7f4ec;
    --ink:#22262c;
    --ink-soft:#5b6169;
    --ink-mute:#939aa4;
    --line:#d5d9df;
    --risk:#c2554e;
    --risk-soft:#f7e5e3;
    --looknow:#1f8a70;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:
      radial-gradient(900px 500px at 85% -10%, rgba(47,127,212,.07), transparent 60%),
      var(--gallery);
    color:var(--ink);
    font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif;
    min-height:100vh;display:flex;justify-content:center;padding:0 16px 60px;
  }
  .page{width:100%;max-width:1180px}
  /* 顶栏 */
  .head{
    display:flex;justify-content:space-between;align-items:center;padding:20px 0 16px;
    border-bottom:1px solid var(--line);
  }
  .head .idn{display:flex;align-items:center;gap:12px}
  .head .idn .mark{width:38px;height:38px;border-radius:10px;background:var(--graphite);display:flex;align-items:center;justify-content:center;color:var(--ivory);font-size:17px}
  .head .idn .t{font-size:15px;font-weight:800;letter-spacing:.08em}
  .head .idn .t small{display:block;font-size:9.5px;color:var(--ink-mute);letter-spacing:.28em;font-weight:400;margin-top:2px}
  .head .crumb{font-size:11.5px;color:var(--ink-soft)}
  .head .crumb b{color:var(--ink)}
  .head .cart-line{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-soft)}
  .head .cart-line .n{background:var(--optic);color:#fff;border-radius:99px;padding:1px 8px;font-size:11px}
  /* 主体双栏 */
  .main{display:grid;grid-template-columns:1.05fr 1fr;gap:34px;margin-top:26px}
  /* 展台 */
  .stage{
    background:linear-gradient(180deg,#fff,#eef0f3);
    border:1px solid var(--line);border-radius:16px;position:relative;overflow:hidden;
    min-height:460px;display:flex;align-items:center;justify-content:center;
  }
  .stage::before{content:"";position:absolute;inset:0;background:radial-gradient(560px 300px at 50% 62%,rgba(47,127,212,.10),transparent 70%)}
  .stage svg{width:78%;max-width:440px;height:auto;position:relative}
  .stage .model{
    position:absolute;left:18px;bottom:14px;font-size:10.5px;color:var(--ink-mute);letter-spacing:.14em;
    background:rgba(255,255,255,.8);border-radius:6px;padding:4px 10px;
  }
  .stage .stock-tag{
    position:absolute;top:16px;left:16px;font-size:11px;font-weight:800;padding:5px 12px;border-radius:99px;
    background:var(--risk);color:#fff;
  }
  /* 信息栏 */
  .info .cat{font-size:11px;letter-spacing:.28em;color:var(--optic);font-weight:700;margin-bottom:10px}
  .info h1{font-size:27px;line-height:1.4;font-weight:800;margin-bottom:8px}
  .info .vendor{font-size:12.5px;color:var(--ink-soft);display:flex;gap:10px;align-items:center;margin-bottom:18px}
  .info .vendor .dot{width:7px;height:7px;border-radius:50%;background:var(--looknow)}
  .price-row{display:flex;align-items:baseline;gap:12px;padding:16px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:20px}
  .price-row .now{font-size:31px;font-weight:900;color:var(--risk);font-variant-numeric:tabular-nums}
  .price-row .old{font-size:14px;color:var(--ink-mute);text-decoration:line-through}
  .price-row .note{font-size:11px;color:var(--ink-soft)}
  .spec{margin-bottom:20px}
  .spec .sl{font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:10px}
  .spec .opts{display:flex;gap:10px;flex-wrap:wrap}
  .spec .opt{
    padding:10px 18px;border:1.5px solid var(--line);border-radius:10px;background:#fff;
    font-size:13.5px;cursor:pointer;font-family:inherit;color:var(--ink-soft);
    transition:border-color .15s,background .15s,color .15s;
  }
  .spec .opt:hover{border-color:var(--optic-deep)}
  .spec .opt.sel{border-color:var(--optic);background:var(--optic-soft);color:var(--optic-deep);font-weight:700}
  .spec .opt.off{color:var(--ink-mute);text-decoration:line-through;pointer-events:none}
  .qty{display:flex;align-items:center;gap:14px;margin-bottom:22px}
  .qty .sl{font-size:12px;font-weight:700;color:var(--ink-soft)}
  .qty .ctrl{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
  .qty .ctrl button{width:40px;height:42px;border:none;background:#fff;font-size:17px;cursor:pointer;color:var(--ink-soft);font-family:inherit}
  .qty .ctrl button:hover{background:var(--gallery-2)}
  .qty .ctrl .v{width:52px;text-align:center;font-size:15px;font-weight:700;border-left:1px solid var(--line);border-right:1px solid var(--line);line-height:42px}
  .buy-row{display:flex;gap:12px;margin-bottom:14px}
  .buy{
    flex:1.4;padding:15px;border:none;border-radius:12px;background:var(--risk);color:#fff;
    font-size:15.5px;font-weight:800;letter-spacing:.1em;cursor:pointer;font-family:inherit;
    box-shadow:0 8px 20px rgba(194,85,78,.3);transition:background .15s,transform .1s;
  }
  .buy:hover{background:#a9453e}
  .buy:active{transform:translateY(1px)}
  .collect{
    flex:1;padding:15px;border:1.5px solid var(--line);border-radius:12px;background:#fff;
    font-size:14.5px;font-weight:700;color:var(--ink-soft);cursor:pointer;font-family:inherit;transition:all .15s;
  }
  .collect:hover{border-color:var(--optic);color:var(--optic-deep)}
  .collect.on{border-color:var(--optic);background:var(--optic-soft);color:var(--optic-deep)}
  .delivery{
    font-size:11.5px;color:var(--ink-soft);line-height:1.9;background:var(--gallery-2);
    border-radius:10px;padding:12px 14px;
  }
  .delivery b{color:var(--ink)}
  @media (max-width:900px){
    .main{grid-template-columns:1fr}
    .stage{min-height:340px}
    .head .crumb{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    .spec .opt,.buy,.collect,.qty .ctrl button{transition:none}
  }
</style>
</head>
<body>
<div class="page">
  <header class="head">
    <div class="idn">
      <span class="mark">◎</span>
      <div class="t">光蚀相机行<small>OPTICS & CO. · EST. 1973</small></div>
    </div>
    <div class="crumb">首页 <b>/</b> 二手精选 <b>/</b> 旁轴相机</div>
    <div class="cart-line">已选 <span class="n" id="cartN">0</span> 件</div>
  </header>

  <div class="main">
    <section class="stage" aria-label="货品主图">
      <span class="stock-tag">仅剩 1 台</span>
      <svg viewBox="0 0 640 400" role="img" aria-label="旁轴相机实物图">
        <defs>
          <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#545b64"/><stop offset="1" stop-color="#3a3f46"/>
          </linearGradient>
        </defs>
        <rect x="120" y="120" width="400" height="190" rx="18" fill="url(#body)"/>
        <rect x="150" y="96" width="120" height="30" rx="8" fill="#23272d"/>
        <circle cx="470" cy="150" r="46" fill="#1d2026"/>
        <circle cx="470" cy="150" r="32" fill="#2f7fd4"/>
        <circle cx="470" cy="150" r="18" fill="#10141a"/>
        <circle cx="470" cy="150" r="8" fill="#4d93dd"/>
        <circle cx="188" cy="176" r="26" fill="#1d2026"/>
        <circle cx="188" cy="176" r="18" fill="#2f7fd4"/>
        <circle cx="188" cy="176" r="9" fill="#10141a"/>
        <path d="M138 292 h364" stroke="#f7f4ec" stroke-width="2"/>
        <rect x="236" y="310" width="180" height="24" rx="6" fill="#23272d"/>
        <rect x="430" y="300" width="60" height="20" rx="6" fill="#23272d"/>
        <rect x="330" y="84" width="46" height="20" rx="6" fill="#aabbc9"/>
        <text x="330" y="98" font-size="12" fill="#23272d" font-family="monospace">2431</text>
      </svg>
      <span class="model">K-Ⅰ 旁轴 · 银色机身 · 1973 年产</span>
    </section>

    <section class="info" aria-label="商品信息">
      <p class="cat">VINTAGE · 二手精选 12 号</p>
      <h1>K-Ⅰ 全幅旁轴摄影机 「冰河银」</h1>
      <div class="vendor"><span class="dot"></span> 光蚀相机行自检 · 9 成新 · 快门 24,300 张</div>

      <div class="price-row">
        <span class="now">¥4,860</span>
        <span class="old">¥5,600</span>
        <span class="note">含 12 个月店内保修</span>
      </div>

      <div class="spec">
        <p class="sl">机身成色</p>
        <div class="opts" id="gradeOpts">
          <button class="opt" data-g="标准" type="button">标准成色</button>
          <button class="opt sel" data-g="优选" type="button">优选成色（+¥300）</button>
          <button class="opt off" data-g="全新" type="button">全新（缺货）</button>
        </div>
      </div>

      <div class="qty">
        <span class="sl">数量</span>
        <div class="ctrl">
          <button id="minus" type="button">−</button>
          <span class="v" id="qv">1</span>
          <button id="plus" type="button">＋</button>
        </div>
      </div>

      <div class="buy-row">
        <button class="buy" id="buyBtn" type="button">立即购入</button>
        <button class="collect" id="favBtn" type="button">♡ 收藏</button>
      </div>

      <div class="delivery">
        发货：<b>北京现货</b>，下单后 24 小时内出库 · 顺丰保价<br>
        验货：收货 7 天内可退，机身补漆瑕疵包退换
      </div>
    </section>
  </div>
</div>
<script>
(function(){
  var qv=1,grade='优选',fav=false,cartN=0;
  var pq={'标准':'¥4,860','优选':'¥5,160'};
  function upd(){document.getElementById('qv').textContent=qv;
    document.getElementById('cartN').textContent=cartN;
    document.getElementById('buyBtn').textContent=grade==='优选'?'立即购入 · ¥5,160':'立即购入 · ¥4,860';
  }
  document.getElementById('minus').addEventListener('click',function(){if(qv>1){qv--;upd()}});
  document.getElementById('plus').addEventListener('click',function(){if(qv<3){qv++;upd()}});
  document.querySelectorAll('#gradeOpts .opt').forEach(function(b){
    b.addEventListener('click',function(){
      if(b.classList.contains('off'))return;
      document.querySelectorAll('#gradeOpts .opt').forEach(function(x){x.classList.remove('sel')});
      b.classList.add('sel');grade=b.dataset.g;upd();
    });
  });
  document.getElementById('buyBtn').addEventListener('click',function(){
    cartN+=qv;upd();
    var b=document.getElementById('buyBtn');b.textContent='已加入 · 马上结账';
    setTimeout(function(){upd()},1400);
  });
  document.getElementById('favBtn').addEventListener('click',function(){
    fav=!fav;var b=document.getElementById('favBtn');
    b.textContent=fav?'♥ 已收藏':'♡ 收藏';b.classList.toggle('on',fav);
  });
  upd();
})();
</script>
</body>
</html>
