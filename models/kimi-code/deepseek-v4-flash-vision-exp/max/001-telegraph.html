<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>远望电讯 · 登录</title>
<style>
  :root{
    --paper:#f3ecd9;
    --paper-deep:#e9dfc4;
    --ink:#1c2416;
    --ink-soft:#4c5341;
    --ink-mute:#8a8a70;
    --teal:#0f6e6b;
    --teal-dark:#0a4f4d;
    --signal:#c0392b;
    --line:#c9bd9c;
    --card:#faf6e9;
    --shadow:0 6px 0 rgba(28,36,22,.12);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif;
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    padding:32px 16px;
    background-image:
      linear-gradient(rgba(28,36,22,.035) 1px,transparent 1px),
      linear-gradient(90deg,rgba(28,36,22,.035) 1px,transparent 1px);
    background-size:28px 28px;
  }
  .sheet{
    width:100%;max-width:960px;
    background:var(--paper-deep);
    border:1px solid var(--line);
    box-shadow:var(--shadow);
    display:grid;grid-template-columns:1fr 1fr;
    min-height:560px;
    position:relative;
  }
  .sheet::before{
    content:"远望电讯 · 每日电报";position:absolute;top:14px;left:50%;transform:translateX(-50%);
    font-size:11px;letter-spacing:.35em;color:var(--ink-mute);white-space:nowrap;
  }
  /* 左半：电报机插画 */
  .visual{
    border-right:1px dashed var(--line);
    padding:64px 40px 40px;
    display:flex;flex-direction:column;justify-content:space-between;
    background:
      radial-gradient(circle at 30% 20%, rgba(15,110,107,.10), transparent 55%),
      var(--paper-deep);
  }
  .visual .brand{
    font-size:22px;font-weight:800;letter-spacing:.12em;color:var(--teal-dark);
  }
  .visual .brand small{display:block;font-size:11px;font-weight:500;letter-spacing:.3em;color:var(--ink-mute);margin-top:6px}
  .visual figure{margin:16px auto;width:100%;max-width:300px}
  .visual figure svg{width:100%;height:auto;display:block}
  .visual .tagline{font-size:13px;line-height:1.9;color:var(--ink-soft);border-top:1px solid var(--line);padding-top:16px}
  .visual .tagline b{color:var(--signal)}
  /* 右半：表单 */
  .form-side{
    background:var(--card);
    padding:72px 48px 40px;
    display:flex;flex-direction:column;justify-content:center;
  }
  .kicker{font-size:11px;letter-spacing:.3em;color:var(--ink-mute);margin-bottom:10px}
  h1{font-size:26px;line-height:1.3;margin-bottom:6px}
  .sub{font-size:13px;color:var(--ink-soft);margin-bottom:28px}
  .field{margin-bottom:18px}
  .field label{display:block;font-size:12px;letter-spacing:.08em;color:var(--ink-soft);margin-bottom:8px}
  .field .box{position:relative}
  .field input{
    width:100%;padding:12px 14px;font-size:15px;color:var(--ink);
    background:#fffdf4;border:1px solid var(--line);border-radius:4px;
    font-family:inherit;outline:none;
    transition:border-color .15s,box-shadow .15s;
  }
  .field input::placeholder{color:#aaa98f}
  .field input:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(15,110,107,.15)}
  .field .say{position:absolute;right:10px;top:50%;transform:translateY(-50%);
    font-size:12px;letter-spacing:.1em;color:var(--teal);background:none;border:none;cursor:pointer;font-family:inherit}
  .row{display:flex;justify-content:space-between;align-items:center;margin:4px 0 24px}
  .remember{font-size:12px;color:var(--ink-soft);display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
  .remember input{accent-color:var(--teal)}
  .forgot{font-size:12px;color:var(--teal);text-decoration:none;border-bottom:1px dashed var(--teal);padding-bottom:1px}
  .forgot:hover{color:var(--teal-dark)}
  .login{
    width:100%;padding:14px;font-size:15px;font-weight:700;letter-spacing:.25em;
    background:var(--teal);color:#f6f2e2;border:1px solid var(--teal-dark);border-radius:4px;
    cursor:pointer;font-family:inherit;transition:background .15s,transform .1s;
    position:relative;
  }
  .login:hover{background:var(--teal-dark)}
  .login:active{transform:translateY(1px)}
  .login:disabled{background:var(--ink-mute);border-color:var(--ink-mute);cursor:default}
  .login .dot{
    display:inline-block;width:8px;height:8px;background:#f6f2e2;border-radius:50%;
    margin-right:10px;vertical-align:1px;opacity:0;
  }
  .login.loading .dot{opacity:1;animation:blink 1s steps(2) infinite}
  @keyframes blink{0%{opacity:1}50%{opacity:.2}100%{opacity:1}}
  .ledger{font-family:"Courier New",Consolas,monospace;font-size:13px;line-height:1.8;color:var(--ink-soft);
    background:#f6f0dd;border:1px dashed var(--line);padding:12px 14px;margin-top:26px;min-height:44px}
  .ledger .ok{color:var(--teal)}
  .ledger .err{color:var(--signal)}
  .alt{margin-top:18px;font-size:12px;color:var(--ink-mute);text-align:center}
  .alt a{color:var(--teal);text-decoration:none}
  .alt a:hover{text-decoration:underline}
  @media (max-width:820px){
    .sheet{grid-template-columns:1fr}
    .visual{border-right:none;border-bottom:1px dashed var(--line)}
    .visual figure{max-width:180px}
    .form-side{padding:40px 28px 32px}
  }
  @media (prefers-reduced-motion:reduce){
    .login.loading .dot{animation:none;opacity:1}
    .field input,.login{transition:none}
  }
</style>
</head>
<body>
<main class="sheet">
  <section class="visual" aria-label="品牌区">
    <div class="brand">远望电讯<small>YUANWANG WIRELESS · EST. 1912</small></div>
    <figure>
      <svg viewBox="0 0 300 210" role="img" aria-label="老式电报机插图">
        <rect x="14" y="150" width="272" height="34" rx="6" fill="#0f6e6b"/>
        <rect x="26" y="60" width="248" height="72" rx="8" fill="#e9dfc4" stroke="#c9bd9c"/>
        <g stroke="#1c2416" stroke-width="3" fill="none">
          <path d="M40 120 L70 92 L100 120 L130 88 L160 120 L190 90 L220 120 L250 84"/>
          <path d="M40 104 L70 76 L100 104 L130 72 L160 104 L190 74 L220 104 L250 68" stroke="#0f6e6b"/>
        </g>
        <circle cx="262" cy="60" r="26" fill="#c0392b"/>
        <path d="M252 60 L258 54 L258 66 Z M268 54 L274 60 L268 66 Z" fill="#f3ecd9"/>
        <circle cx="262" cy="60" r="33" fill="none" stroke="#0f6e6b" stroke-width="2" opacity=".5"/>
        <path d="M70 150 L70 128 M230 150 L230 128" stroke="#f3ecd9" stroke-width="6"/>
        <rect x="128" y="184" width="44" height="10" rx="3" fill="#f3ecd9"/>
      </svg>
    </figure>
    <p class="tagline">一通电报的认真，从一封登录开始。<b>1926 年第一条跨海电报</b>经由本局发出——百年来，报文从未迟到。</p>
  </section>

  <section class="form-side" aria-label="登录表单">
    <p class="kicker">AUTHENTICATION · NO. 0417</p>
    <h1>登录远望电讯</h1>
    <p class="sub">输入您的电报员证号与密码，继续收发报文。</p>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="uid">电报员证号 / 邮箱</label>
        <div class="box">
          <input id="uid" name="uid" type="text" autocomplete="username" placeholder="如：MARS-0417 或 mars@yuanwang.example" required>
        </div>
      </div>
      <div class="field">
        <label for="pwd">密码</label>
        <div class="box">
          <input id="pwd" name="pwd" type="password" autocomplete="current-password" placeholder="输入密码" required>
          <button type="button" class="say" id="sayPwd">显示</button>
        </div>
      </div>
      <div class="row">
        <label class="remember"><input type="checkbox" id="remember"> 记住我在本机旁</label>
        <a class="forgot" href="#" id="forgotLink">忘记密码?</a>
      </div>
      <button class="login" id="loginBtn" type="submit"><span class="dot"></span>发报 · 进入</button>
    </form>

    <div class="ledger" id="ledger" aria-live="polite">收报机就绪：等待输入证号与密码。</div>

    <p class="alt">还没有证号？<a href="#">在线申请入局</a></p>
  </section>
</main>
<script>
(function(){
  var form=document.getElementById('loginForm'),
      uid=document.getElementById('uid'),
      pwd=document.getElementById('pwd'),
      btn=document.getElementById('loginBtn'),
      say=document.getElementById('sayPwd'),
      ledger=document.getElementById('ledger'),
      forgot=document.getElementById('forgotLink');

  say.addEventListener('click',function(){
    var show=pwd.type==='password';
    pwd.type=show?'text':'password';
    say.textContent=show?'隐藏':'显示';
  });

  form.addEventListener('submit',function(e){
    e.preventDefault();
    var u=uid.value.trim(),p=pwd.value;
    if(!u){ledger.innerHTML='<span class="err">× 证号为空：请填入电报员证号或邮箱。</span>';uid.focus();return;}
    if(!p){ledger.innerHTML='<span class="err">× 密码为空：报文需要密钥才能揭开。</span>';pwd.focus();return;}
    btn.disabled=true;btn.classList.add('loading');
    var old=btn.innerHTML;btn.innerHTML='<span class="dot"></span>拍发中…';
    setTimeout(function(){
      btn.disabled=false;btn.classList.remove('loading');
      btn.innerHTML='<span class="dot"></span>已入局 · 发送成功';
      ledger.innerHTML='<span class="ok">✓ 2026-09-04 09:41 证号 <b>'+u.replace(/</g,'&lt;')+'</b> 验证通过。今日第 3,217 封报文，等您签发。</span>';
      pwd.blur();
    },900);
  });

  forgot.addEventListener('click',function(e){
    e.preventDefault();
    ledger.innerHTML='<span class="err">↻ 已为您接通「密码找回」：下一步前往总机报出证号。</span>';
  });

  uid.focus();
})();
</script>
</body>
</html>
