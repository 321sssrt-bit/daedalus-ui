<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>观测者研究院 · 成员目录</title>
  <style>
    :root {
      --page: #E8E9EC;
      --sidebar: #DDE0E4;
      --surface: #F7F7F8;
      --ink: #191B20;
      --muted: #666B75;
      --line: #C7CAD1;
      --violet: #6838E8;
      --violet-dark: #4D24B8;
      --violet-pale: #DCD2FA;
      --signal: #B8F36B;
      --white: #FFFFFF;
      --shadow: 0 18px 50px rgba(25, 27, 32, 0.18);
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { color-scheme: light; }
    body {
      margin: 0;
      min-width: 320px;
      background: var(--page);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      font-size: 14px;
      line-height: 1.6;
    }
    button, input { font: inherit; }
    button { color: inherit; }
    button, a, input { -webkit-tap-highlight-color: transparent; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, a:focus-visible {
      outline: 3px solid var(--violet);
      outline-offset: 3px;
    }
    .skip-link {
      position: fixed;
      left: 16px;
      top: -60px;
      z-index: 100;
      padding: 8px 14px;
      background: var(--ink);
      color: var(--white);
      text-decoration: none;
    }
    .skip-link:focus { top: 12px; }
    .app {
      display: grid;
      grid-template-columns: 232px minmax(0, 1fr);
      min-height: 100vh;
    }
    .sidebar {
      position: relative;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding: 28px 20px 24px;
      background: var(--sidebar);
      border-right: 1px solid var(--line);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0 4px 40px;
    }
    .brand-mark {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      background: var(--ink);
      color: var(--white);
    }
    .brand-mark svg { width: 27px; height: 27px; }
    .brand-name { display: block; font-size: 16px; font-weight: 760; letter-spacing: 0.08em; }
    .brand-en { display: block; color: var(--muted); font-size: 9px; letter-spacing: 0.18em; }
    .nav-label {
      margin: 0 10px 10px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.2em;
    }
    .side-nav { display: grid; gap: 5px; }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      min-height: 44px;
      padding: 10px 12px;
      border: 0;
      border-radius: 3px;
      background: transparent;
      text-align: left;
      transition: background 160ms ease, color 160ms ease;
    }
    .nav-item svg { width: 18px; height: 18px; flex: 0 0 18px; }
    .nav-item:hover { background: rgba(255, 255, 255, 0.55); }
    .nav-item.active { background: var(--ink); color: var(--white); }
    .nav-item .nav-count {
      margin-left: auto;
      color: var(--muted);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }
    .nav-item.active .nav-count { color: var(--violet-pale); }
    .side-section { margin-top: 34px; }
    .lab-list { display: grid; gap: 12px; margin: 0; padding: 0 10px; list-style: none; }
    .lab-list li { display: flex; align-items: center; gap: 9px; color: #484D56; font-size: 12px; }
    .lab-dot { width: 6px; height: 6px; border: 1px solid var(--violet); border-radius: 50%; }
    .side-foot {
      margin-top: auto;
      padding: 18px 10px 0;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 11px;
    }
    .system-line { display: flex; align-items: center; gap: 8px; color: var(--ink); }
    .system-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--violet); box-shadow: 0 0 0 4px rgba(104, 56, 232, 0.1); }
    .side-foot p { margin: 7px 0 0; }
    .main { min-width: 0; padding: 0 36px 42px; overflow: hidden; }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 76px;
      gap: 20px;
      border-bottom: 1px solid var(--line);
    }
    .crumb { color: var(--muted); font-size: 12px; letter-spacing: 0.08em; }
    .crumb strong { color: var(--ink); font-weight: 650; }
    .top-meta { display: flex; align-items: center; gap: 18px; color: var(--muted); font-size: 11px; }
    .edition { padding: 3px 8px; border: 1px solid var(--line); border-radius: 2px; font-variant-numeric: tabular-nums; }
    .hero {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      padding: 28px 0 24px;
    }
    .eyebrow { margin: 0 0 4px; color: var(--violet); font-size: 10px; font-weight: 800; letter-spacing: 0.22em; }
    h1 { margin: 0; font-size: clamp(30px, 3.1vw, 44px); line-height: 1.2; letter-spacing: -0.045em; font-weight: 740; }
    .hero-note { max-width: 325px; margin: 0 0 3px; color: var(--muted); font-size: 12px; line-height: 1.75; }
    .control-deck {
      display: grid;
      grid-template-columns: minmax(210px, 1fr) auto;
      gap: 14px 18px;
      align-items: center;
      padding: 16px 18px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 4px;
    }
    .search-wrap { position: relative; min-width: 0; }
    .search-wrap svg {
      position: absolute;
      left: 13px;
      top: 50%;
      width: 17px;
      height: 17px;
      color: var(--muted);
      transform: translateY(-50%);
      pointer-events: none;
    }
    .search-label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); }
    .search {
      width: 100%;
      height: 42px;
      padding: 0 40px 0 40px;
      border: 1px solid var(--line);
      border-radius: 2px;
      background: var(--white);
      color: var(--ink);
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }
    .search::placeholder { color: #858A94; }
    .search:hover { border-color: #9297A1; }
    .search:focus { border-color: var(--violet); box-shadow: 0 0 0 3px rgba(104, 56, 232, 0.1); }
    .clear-search {
      position: absolute;
      right: 6px;
      top: 5px;
      width: 32px;
      height: 32px;
      border: 0;
      background: transparent;
      color: var(--muted);
      border-radius: 2px;
      font-size: 20px;
      line-height: 1;
    }
    .clear-search:hover { background: var(--page); color: var(--ink); }
    .view-switch { display: flex; padding: 3px; background: var(--page); border: 1px solid var(--line); border-radius: 3px; }
    .view-button {
      display: grid;
      place-items: center;
      width: 36px;
      height: 34px;
      padding: 0;
      border: 0;
      border-radius: 2px;
      background: transparent;
      color: var(--muted);
    }
    .view-button svg { width: 17px; height: 17px; }
    .view-button:hover { color: var(--violet); }
    .view-button[aria-pressed="true"] { background: var(--white); color: var(--violet); box-shadow: 0 1px 4px rgba(25, 27, 32, 0.12); }
    .filters { grid-column: 1 / -1; display: flex; align-items: center; flex-wrap: wrap; gap: 7px; }
    .filter-button {
      min-height: 32px;
      padding: 5px 12px;
      border: 1px solid transparent;
      border-radius: 2px;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      transition: color 150ms ease, background 150ms ease, border-color 150ms ease;
    }
    .filter-button:hover { border-color: var(--line); color: var(--ink); }
    .filter-button[aria-pressed="true"] { border-color: var(--violet); background: var(--violet-pale); color: var(--violet-dark); font-weight: 650; }
    .onsite-filter { display: inline-flex; align-items: center; gap: 7px; margin-left: auto; color: var(--muted); font-size: 12px; cursor: pointer; }
    .onsite-filter input { width: 15px; height: 15px; margin: 0; accent-color: var(--violet); }
    .result-bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 52px; }
    .result-count { margin: 0; color: var(--muted); font-size: 12px; }
    .result-count strong { color: var(--ink); font-size: 14px; font-variant-numeric: tabular-nums; }
    .index-note { color: var(--muted); font-size: 10px; letter-spacing: 0.12em; }
    .people-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
    .person-card {
      position: relative;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 188px;
      padding: 19px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--surface);
      text-align: left;
      transition: transform 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
    }
    .person-card::after {
      content: "";
      position: absolute;
      right: -24px;
      bottom: -38px;
      width: 100px;
      height: 100px;
      border: 1px solid rgba(104, 56, 232, 0.12);
      border-radius: 50%;
      pointer-events: none;
    }
    .person-card:hover { z-index: 1; border-color: var(--violet); box-shadow: 0 8px 24px rgba(25, 27, 32, 0.1); transform: translateY(-3px); }
    .person-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .avatar { display: block; width: 66px; height: 66px; flex: 0 0 66px; border-radius: 50%; }
    .presence { display: inline-flex; align-items: center; gap: 5px; padding-top: 2px; color: var(--muted); font-size: 10px; white-space: nowrap; }
    .presence::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #9A9EA6; }
    .presence.onsite::before { background: var(--signal); box-shadow: 0 0 0 2px rgba(104, 56, 232, 0.15); }
    .person-name { margin: 13px 0 0; font-size: 18px; font-weight: 720; line-height: 1.35; letter-spacing: 0.01em; }
    .person-role { margin: 2px 0 0; color: var(--muted); font-size: 11px; }
    .person-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: auto; padding-top: 13px; }
    .dept-tag { color: var(--violet-dark); font-size: 10px; font-weight: 650; letter-spacing: 0.06em; }
    .open-hint { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); font-size: 10px; }
    .open-hint svg { width: 13px; height: 13px; transition: transform 160ms ease; }
    .person-card:hover .open-hint svg { transform: translateX(3px); }
    .people-grid.is-list { grid-template-columns: 1fr; gap: 8px; }
    .is-list .person-card { display: grid; grid-template-columns: 60px minmax(120px, 0.8fr) minmax(150px, 1.4fr) auto; align-items: center; gap: 18px; min-height: 88px; padding: 13px 18px; }
    .is-list .person-top { display: contents; }
    .is-list .avatar { width: 54px; height: 54px; }
    .is-list .presence { position: absolute; right: 18px; top: 10px; font-size: 9px; }
    .is-list .person-name { margin: 0; font-size: 16px; }
    .is-list .person-role { margin: 0; }
    .is-list .person-foot { margin: 0; padding: 0; justify-content: flex-end; }
    .is-list .dept-tag { display: none; }
    .empty-state { padding: 58px 24px; border: 1px dashed var(--line); text-align: center; background: rgba(247, 247, 248, 0.55); }
    .empty-state svg { width: 48px; height: 48px; color: var(--violet); }
    .empty-state h2 { margin: 12px 0 4px; font-size: 18px; }
    .empty-state p { margin: 0 0 18px; color: var(--muted); font-size: 12px; }
    .text-button { min-height: 38px; padding: 7px 16px; border: 1px solid var(--ink); border-radius: 2px; background: var(--ink); color: var(--white); }
    .text-button:hover { background: var(--violet-dark); border-color: var(--violet-dark); }
    .profile-dialog {
      width: min(680px, calc(100vw - 32px));
      max-height: calc(100vh - 48px);
      padding: 0;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: var(--surface);
      color: var(--ink);
      box-shadow: var(--shadow);
    }
    .profile-dialog::backdrop { background: rgba(25, 27, 32, 0.52); backdrop-filter: blur(4px); }
    .dialog-close {
      position: absolute;
      right: 16px;
      top: 16px;
      z-index: 2;
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 50%;
      background: rgba(25, 27, 32, 0.25);
      color: var(--white);
      font-size: 24px;
      line-height: 1;
    }
    .dialog-close:hover { background: var(--violet); }
    .profile-head { position: relative; display: flex; align-items: flex-end; gap: 24px; min-height: 214px; padding: 34px; background: var(--ink); color: var(--white); overflow: hidden; }
    .profile-head::after { content: ""; position: absolute; width: 260px; height: 260px; right: -80px; top: -110px; border: 1px solid rgba(220, 210, 250, 0.3); border-radius: 50%; box-shadow: 0 0 0 36px rgba(104, 56, 232, 0.12), 0 0 0 74px rgba(104, 56, 232, 0.08); }
    .profile-head .avatar { position: relative; z-index: 1; width: 112px; height: 112px; border: 1px solid rgba(255, 255, 255, 0.3); }
    .profile-heading { position: relative; z-index: 1; }
    .profile-heading .eyebrow { color: var(--violet-pale); }
    .profile-heading h2 { margin: 0; font-size: 34px; line-height: 1.25; }
    .profile-heading p { margin: 4px 0 0; color: #C9CCD1; font-size: 13px; }
    .profile-body { padding: 28px 34px 32px; }
    .profile-bio { margin: 0 0 24px; font-size: 14px; line-height: 1.9; }
    .profile-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 20px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .data-label { display: block; margin-bottom: 4px; color: var(--muted); font-size: 10px; letter-spacing: 0.12em; }
    .data-value { font-size: 13px; }
    .research-block { margin-top: 22px; }
    .research-block h3 { margin: 0 0 10px; font-size: 12px; }
    .research-tags { display: flex; flex-wrap: wrap; gap: 7px; }
    .research-tags span { padding: 4px 10px; background: var(--violet-pale); color: var(--violet-dark); border-radius: 2px; font-size: 11px; }
    .profile-actions { display: flex; gap: 10px; margin-top: 26px; }
    .primary-action, .secondary-action { min-height: 42px; padding: 9px 17px; border-radius: 2px; font-weight: 650; }
    .primary-action { border: 1px solid var(--violet); background: var(--violet); color: var(--white); }
    .primary-action:hover { background: var(--violet-dark); border-color: var(--violet-dark); }
    .secondary-action { border: 1px solid var(--line); background: transparent; }
    .secondary-action:hover { border-color: var(--ink); background: var(--page); }
    .toast {
      position: fixed;
      left: 50%;
      bottom: 26px;
      z-index: 120;
      max-width: calc(100vw - 32px);
      padding: 11px 18px;
      border: 1px solid #4033A0;
      border-radius: 3px;
      background: var(--ink);
      color: var(--white);
      box-shadow: var(--shadow);
      font-size: 12px;
      transform: translateX(-50%);
    }
    @media (max-width: 1120px) {
      .app { grid-template-columns: 198px minmax(0, 1fr); }
      .sidebar { padding-inline: 14px; }
      .main { padding-inline: 26px; }
      .people-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .hero-note { max-width: 250px; }
    }
    @media (max-width: 820px) {
      .app { display: block; }
      .sidebar { min-height: 0; padding: 14px 20px; border-right: 0; border-bottom: 1px solid var(--line); }
      .brand { margin: 0 0 14px; }
      .brand-mark { width: 34px; height: 34px; flex-basis: 34px; }
      .nav-label, .side-section, .side-foot { display: none; }
      .side-nav { display: flex; gap: 6px; overflow-x: auto; }
      .nav-item { width: auto; min-height: 38px; padding: 7px 11px; white-space: nowrap; }
      .nav-item .nav-count { margin-left: 4px; }
      .main { padding: 0 22px 32px; }
      .topbar { min-height: 56px; }
      .hero { padding: 24px 0 20px; }
      .hero-note { display: none; }
      .is-list .person-card { grid-template-columns: 54px minmax(100px, 1fr) minmax(120px, 1fr); }
      .is-list .person-foot { display: none; }
    }
    @media (max-width: 580px) {
      .main { padding-inline: 16px; }
      .top-meta { display: none; }
      .control-deck { grid-template-columns: minmax(0, 1fr) auto; padding: 12px; }
      .onsite-filter { width: 100%; margin: 4px 0 0; }
      .people-grid { grid-template-columns: 1fr; }
      .index-note { display: none; }
      .is-list .person-card { grid-template-columns: 54px 1fr; gap: 12px; }
      .is-list .person-role { grid-column: 2; }
      .profile-head { align-items: flex-start; flex-direction: column; padding: 28px 24px; }
      .profile-head .avatar { width: 82px; height: 82px; }
      .profile-body { padding: 24px; }
      .profile-grid { grid-template-columns: 1fr; gap: 14px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
      .person-card:hover { transform: none; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#directory">跳到成员目录</a>
  <div class="app">
    <aside class="sidebar" aria-label="研究院导航">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none"><circle cx="16" cy="16" r="10" stroke="currentColor"/><circle cx="16" cy="16" r="3" fill="#B8F36B"/><path d="M16 1v7M16 24v7M1 16h7M24 16h7" stroke="currentColor"/></svg>
        </span>
        <span><span class="brand-name">观测者研究院</span><span class="brand-en">PEOPLE OBSERVATORY</span></span>
      </div>
      <p class="nav-label">工作空间 / 01</p>
      <nav class="side-nav" aria-label="主导航">
        <button class="nav-item" type="button" data-nav="overview">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z" stroke="currentColor" stroke-width="1.5"/></svg>
          研究概览
        </button>
        <button class="nav-item active" type="button" aria-current="page">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="9" cy="8" r="3" stroke="currentColor" stroke-width="1.5"/><path d="M3.5 19c.5-4 2.5-6 5.5-6s5 2 5.5 6M16 5.5a3 3 0 0 1 0 5.8M17 13c2 .6 3.2 2.6 3.5 5" stroke="currentColor" stroke-width="1.5"/></svg>
          成员目录 <span class="nav-count">09</span>
        </button>
        <button class="nav-item" type="button" data-nav="projects">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 7.5h6l2-3h8v15H4z" stroke="currentColor" stroke-width="1.5"/><path d="M4 10h16" stroke="currentColor" stroke-width="1.5"/></svg>
          研究项目
        </button>
        <button class="nav-item" type="button" data-nav="calendar">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="4" y="5.5" width="16" height="14" stroke="currentColor" stroke-width="1.5"/><path d="M8 3v5M16 3v5M4 10h16" stroke="currentColor" stroke-width="1.5"/></svg>
          在所日程
        </button>
      </nav>
      <section class="side-section" aria-labelledby="lab-heading">
        <h2 class="nav-label" id="lab-heading">研究方向 / 04</h2>
        <ul class="lab-list">
          <li><span class="lab-dot"></span>认知与感知</li>
          <li><span class="lab-dot"></span>计算系统</li>
          <li><span class="lab-dot"></span>交互与材料</li>
          <li><span class="lab-dot"></span>城市与行为</li>
        </ul>
      </section>
      <div class="side-foot">
        <div class="system-line"><span class="system-dot"></span>目录已同步</div>
        <p>最后更新：今天 09:42<br>仅限内部研究协作使用</p>
      </div>
    </aside>

    <main class="main" id="directory">
      <header class="topbar">
        <div class="crumb">工作空间&nbsp; / &nbsp;<strong>成员目录</strong></div>
        <div class="top-meta"><span>上海 · 徐汇研究站</span><span class="edition">2026 / 春季名册</span></div>
      </header>
      <section class="hero" aria-labelledby="page-title">
        <div>
          <p class="eyebrow">PEOPLE, PRACTICE &amp; INQUIRY</p>
          <h1 id="page-title">找到一起追问的人。</h1>
        </div>
        <p class="hero-note">9 位在册成员，跨越 4 个研究方向。按领域检索，或直接从一张面孔开始认识彼此。</p>
      </section>

      <section class="control-deck" aria-label="成员筛选工具">
        <div class="search-wrap">
          <label class="search-label" for="member-search">搜索姓名、职位或研究关键词</label>
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" stroke="currentColor" stroke-width="1.7"/><path d="m15.5 15.5 4 4" stroke="currentColor" stroke-width="1.7"/></svg>
          <input class="search" id="member-search" type="search" placeholder="搜索姓名、职位或研究关键词" autocomplete="off">
          <button class="clear-search" id="clear-search" type="button" aria-label="清空搜索" hidden>×</button>
        </div>
        <div class="view-switch" aria-label="目录视图">
          <button class="view-button" id="grid-view" type="button" aria-label="网格视图" aria-pressed="true">
            <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M3 3h5v5H3zM12 3h5v5h-5zM3 12h5v5H3zM12 12h5v5h-5z" stroke="currentColor" stroke-width="1.4"/></svg>
          </button>
          <button class="view-button" id="list-view" type="button" aria-label="列表视图" aria-pressed="false">
            <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M6 4h11M6 10h11M6 16h11" stroke="currentColor" stroke-width="1.5"/><circle cx="3" cy="4" r="1" fill="currentColor"/><circle cx="3" cy="10" r="1" fill="currentColor"/><circle cx="3" cy="16" r="1" fill="currentColor"/></svg>
          </button>
        </div>
        <div class="filters" role="group" aria-label="按研究方向筛选">
          <button class="filter-button" type="button" data-dept="all" aria-pressed="true">全部方向</button>
          <button class="filter-button" type="button" data-dept="perception" aria-pressed="false">认知与感知</button>
          <button class="filter-button" type="button" data-dept="compute" aria-pressed="false">计算系统</button>
          <button class="filter-button" type="button" data-dept="material" aria-pressed="false">交互与材料</button>
          <button class="filter-button" type="button" data-dept="city" aria-pressed="false">城市与行为</button>
          <label class="onsite-filter"><input id="onsite-only" type="checkbox">仅显示今日在所</label>
        </div>
      </section>

      <div class="result-bar">
        <p class="result-count" id="result-count" aria-live="polite"></p>
        <span class="index-note">INDEX / A—Z</span>
      </div>
      <section class="people-grid" id="people-grid" aria-label="成员列表"></section>
      <section class="empty-state" id="empty-state" hidden>
        <svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><circle cx="21" cy="21" r="13" stroke="currentColor" stroke-width="1.5"/><path d="m31 31 9 9M15 21h12" stroke="currentColor" stroke-width="1.5"/></svg>
        <h2>这组条件下还没有成员</h2>
        <p>试试缩短关键词，或恢复查看全部研究方向。</p>
        <button class="text-button" id="reset-filters" type="button">清除全部筛选</button>
      </section>
    </main>
  </div>

  <dialog class="profile-dialog" id="profile-dialog" aria-label="成员简介">
    <button class="dialog-close" id="profile-close" type="button" aria-label="关闭成员简介">×</button>
    <div id="profile-content"></div>
  </dialog>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script>
    const people = [
      { id: "lin-yao", name: "林遥", initials: "LY", role: "主任研究员 · 感知科学", dept: "perception", department: "认知与感知", onsite: true, location: "A-302 · 感知实验室", email: "linyao@observatory.local", color: "#6838E8", accent: "#DCD2FA", bio: "关注光线、声音如何塑造人的空间判断，主导多感官环境研究。她相信好的实验不从设备开始，而从一次被认真描述的体感开始。", research: ["空间感知", "多感官交互", "环境心理"], project: "「微光城市」夜间步行感知研究" },
      { id: "zhou-jiming", name: "周既明", initials: "ZJ", role: "计算研究员 · 可信系统", dept: "compute", department: "计算系统", onsite: true, location: "B-214 · 计算工作间", email: "zhoujm@observatory.local", color: "#292C34", accent: "#B8F36B", bio: "研究可解释的人机协同系统，把复杂模型转译成研究者可以追问和修正的工具。目前正在搭建面向小样本观察的开放计算笔记。", research: ["人机协同", "可解释系统", "研究工具"], project: "「显影」可解释分析工作台" },
      { id: "chen-wei", name: "陈苇", initials: "CW", role: "设计研究员 · 材料叙事", dept: "material", department: "交互与材料", onsite: false, location: "C-108 · 材料图书馆", email: "chenwei@observatory.local", color: "#7657A8", accent: "#F0E9FA", bio: "在纤维、陶土与电子元件之间寻找温柔的交互方式。她维护着院里的材料图书馆，也记录每种材料被触摸、弯折和老化后的变化。", research: ["柔性材料", "触觉设计", "慢速制造"], project: "「呼吸的表面」响应织物档案" },
      { id: "han-qing", name: "韩青", initials: "HQ", role: "博士后研究员 · 注意力", dept: "perception", department: "认知与感知", onsite: true, location: "A-306 · 静音观察室", email: "hanqing@observatory.local", color: "#4D24B8", accent: "#DCD2FA", bio: "研究碎片信息环境中的注意力恢复，关心人如何在不被打扰的情况下重新获得专注。常通过步行访谈与低侵入传感展开观察。", research: ["注意力恢复", "步行访谈", "行为观察"], project: "「走神之后」注意力微档案" },
      { id: "su-hang", name: "苏杭", initials: "SH", role: "研究工程师 · 原型系统", dept: "compute", department: "计算系统", onsite: false, location: "B-210 · 原型工位", email: "suhang@observatory.local", color: "#454A55", accent: "#B8F36B", bio: "把研究问题快速变成可试用、可拆解的原型，擅长边缘计算与传感装置。他的工位上总有一台正在被重新接线的机器。", research: ["边缘计算", "快速原型", "传感网络"], project: "「微气象」分布式环境感知节点" },
      { id: "xu-zhao", name: "许照", initials: "XZ", role: "研究助理 · 体验档案", dept: "material", department: "交互与材料", onsite: true, location: "C-112 · 体验档案室", email: "xuzhao@observatory.local", color: "#9775C8", accent: "#F7F3FC", bio: "负责体验样本的采集、编目与回访，擅长从细碎的使用痕迹里发现新问题。她正在建立一套可以触摸的产品历史档案。", research: ["体验编目", "使用痕迹", "设计民族志"], project: "「物的记忆」日常用品使用档案" },
      { id: "meng-qiu", name: "孟秋", initials: "MQ", role: "数据研究员 · 公共生活", dept: "city", department: "城市与行为", onsite: true, location: "D-201 · 城市观测站", email: "mengqiu@observatory.local", color: "#343743", accent: "#C9B8F5", bio: "用轻量数据理解街区里的公共生活，尤其关注街角、长椅与树荫如何让人停留。坚持让数据回到具体街道与真实日常。", research: ["街区观察", "公共生活", "数据叙事"], project: "「停留一刻」街角公共性测量" },
      { id: "tang-zhen", name: "唐真", initials: "TZ", role: "城市研究员 · 社区协作", dept: "city", department: "城市与行为", onsite: false, location: "D-203 · 社区联络桌", email: "tangzhen@observatory.local", color: "#6838E8", accent: "#DCD2FA", bio: "在研究者与社区居民之间建立长期协作，组织开放工作坊与街区共绘。她关心研究结束之后，知识能否继续留在社区里。", research: ["社区共创", "参与式研究", "街区更新"], project: "「附近有声」社区声音共绘计划" },
      { id: "lu-sheng", name: "陆声", initials: "LS", role: "访问学者 · 声景研究", dept: "perception", department: "认知与感知", onsite: true, location: "A-301 · 声景编辑室", email: "lusheng@observatory.local", color: "#5B6070", accent: "#E5E0F5", bio: "记录城市声景与个体聆听经验，研究声音如何成为地点的记忆索引。驻院期间，他正在整理横跨十二年的清晨录音。", research: ["城市声景", "聆听方法", "声音档案"], project: "「六点三十分」城市清晨录音集" }
    ];

    const state = { dept: "all", query: "", onsite: false, view: "grid" };
    const grid = document.getElementById("people-grid");
    const search = document.getElementById("member-search");
    const clearSearch = document.getElementById("clear-search");
    const onsiteOnly = document.getElementById("onsite-only");
    const emptyState = document.getElementById("empty-state");
    const resultCount = document.getElementById("result-count");
    const dialog = document.getElementById("profile-dialog");
    const profileContent = document.getElementById("profile-content");
    const toast = document.getElementById("toast");
    let toastTimer;

    function avatar(person) {
      return `<svg class="avatar" viewBox="0 0 80 80" role="img" aria-label="${person.name}的字母头像">
        <circle cx="40" cy="40" r="39" fill="${person.color}"/>
        <path d="M-4 59C18 23 43 18 85 21M-7 68C19 34 48 28 88 31" fill="none" stroke="${person.accent}" stroke-opacity=".34" stroke-width="1"/>
        <circle cx="60" cy="18" r="11" fill="none" stroke="${person.accent}" stroke-opacity=".5"/>
        <text x="40" y="47" text-anchor="middle" fill="${person.accent}" font-family="Arial, sans-serif" font-size="23" font-weight="700" letter-spacing="1">${person.initials}</text>
      </svg>`;
    }

    function filteredPeople() {
      const keyword = state.query.trim().toLowerCase();
      return people.filter(person => {
        const matchesDept = state.dept === "all" || person.dept === state.dept;
        const matchesOnsite = !state.onsite || person.onsite;
        const haystack = `${person.name} ${person.role} ${person.department} ${person.research.join(" ")}`.toLowerCase();
        return matchesDept && matchesOnsite && (!keyword || haystack.includes(keyword));
      });
    }

    function renderPeople() {
      const matches = filteredPeople();
      grid.classList.toggle("is-list", state.view === "list");
      grid.innerHTML = matches.map(person => `
        <button class="person-card" type="button" data-person="${person.id}" aria-label="查看${person.name}的简介">
          <span class="person-top">
            ${avatar(person)}
            <span class="presence${person.onsite ? " onsite" : ""}">${person.onsite ? "今日在所" : "外出研究"}</span>
          </span>
          <span class="person-name">${person.name}</span>
          <span class="person-role">${person.role}</span>
          <span class="person-foot">
            <span class="dept-tag">${person.department}</span>
            <span class="open-hint">查看简介 <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8h9M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.3"/></svg></span>
          </span>
        </button>`).join("");
      resultCount.innerHTML = `显示 <strong>${String(matches.length).padStart(2, "0")}</strong> / ${String(people.length).padStart(2, "0")} 位成员`;
      emptyState.hidden = matches.length !== 0;
      grid.hidden = matches.length === 0;
      clearSearch.hidden = !state.query;
    }

    function setView(view) {
      state.view = view;
      document.getElementById("grid-view").setAttribute("aria-pressed", String(view === "grid"));
      document.getElementById("list-view").setAttribute("aria-pressed", String(view === "list"));
      renderPeople();
    }

    function openProfile(person) {
      profileContent.innerHTML = `
        <div class="profile-head">
          ${avatar(person)}
          <div class="profile-heading">
            <p class="eyebrow">MEMBER / ${person.initials}</p>
            <h2>${person.name}</h2>
            <p>${person.role}</p>
          </div>
        </div>
        <div class="profile-body">
          <p class="profile-bio">${person.bio}</p>
          <div class="profile-grid">
            <div><span class="data-label">当前项目</span><span class="data-value">${person.project}</span></div>
            <div><span class="data-label">研究位置</span><span class="data-value">${person.location}</span></div>
            <div><span class="data-label">研究方向</span><span class="data-value">${person.department}</span></div>
            <div><span class="data-label">今日状态</span><span class="data-value">${person.onsite ? "在所，可预约简短交流" : "外出研究，可留言"}</span></div>
          </div>
          <div class="research-block"><h3>持续关注</h3><div class="research-tags">${person.research.map(tag => `<span>${tag}</span>`).join("")}</div></div>
          <div class="profile-actions">
            <button class="primary-action" type="button" data-copy="${person.email}" data-name="${person.name}">复制研究邮箱</button>
            <button class="secondary-action" type="button" id="profile-back">返回目录</button>
          </div>
        </div>`;
      dialog.showModal();
    }

    function showToast(message) {
      clearTimeout(toastTimer);
      toast.textContent = message;
      toast.hidden = false;
      toastTimer = setTimeout(() => { toast.hidden = true; }, 2600);
    }

    async function copyEmail(email, name) {
      let copied = false;
      try {
        await navigator.clipboard.writeText(email);
        copied = true;
      } catch (error) {
        const helper = document.createElement("textarea");
        helper.value = email;
        helper.style.position = "fixed";
        helper.style.opacity = "0";
        document.body.appendChild(helper);
        helper.select();
        copied = document.execCommand("copy");
        helper.remove();
      }
      showToast(copied ? `已复制${name}的研究邮箱` : `邮箱：${email}`);
    }

    document.querySelectorAll("[data-dept]").forEach(button => {
      button.addEventListener("click", () => {
        state.dept = button.dataset.dept;
        document.querySelectorAll("[data-dept]").forEach(item => item.setAttribute("aria-pressed", String(item === button)));
        renderPeople();
      });
    });
    document.querySelectorAll("[data-nav]").forEach(button => {
      button.addEventListener("click", () => showToast(`${button.textContent.trim()}在当前目录演示中仅作导航提示`));
    });
    search.addEventListener("input", () => { state.query = search.value; renderPeople(); });
    clearSearch.addEventListener("click", () => { search.value = ""; state.query = ""; search.focus(); renderPeople(); });
    onsiteOnly.addEventListener("change", () => { state.onsite = onsiteOnly.checked; renderPeople(); });
    document.getElementById("grid-view").addEventListener("click", () => setView("grid"));
    document.getElementById("list-view").addEventListener("click", () => setView("list"));
    document.getElementById("reset-filters").addEventListener("click", () => {
      state.dept = "all"; state.query = ""; state.onsite = false;
      search.value = ""; onsiteOnly.checked = false;
      document.querySelectorAll("[data-dept]").forEach(item => item.setAttribute("aria-pressed", String(item.dataset.dept === "all")));
      renderPeople();
      search.focus();
    });
    grid.addEventListener("click", event => {
      const card = event.target.closest("[data-person]");
      if (card) openProfile(people.find(person => person.id === card.dataset.person));
    });
    document.getElementById("profile-close").addEventListener("click", () => dialog.close());
    profileContent.addEventListener("click", event => {
      const copyButton = event.target.closest("[data-copy]");
      if (copyButton) copyEmail(copyButton.dataset.copy, copyButton.dataset.name);
      if (event.target.closest("#profile-back")) dialog.close();
    });
    dialog.addEventListener("click", event => {
      if (event.target === dialog) {
        const box = dialog.getBoundingClientRect();
        if (event.clientX < box.left || event.clientX > box.right || event.clientY < box.top || event.clientY > box.bottom) dialog.close();
      }
    });

    renderPeople();
  </script>
</body>
</html>
