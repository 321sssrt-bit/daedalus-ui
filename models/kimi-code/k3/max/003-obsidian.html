<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>黑曜 · 邀请进入</title>
<style>
:root{
  --abyss:#0c0d10;
  --obsidian:#14161b;
  --amber:#d9a441;
  --amber-dim:#6e5527;
  --ink:#ece7db;
  --muted:#8f8a7c;
  --line:#2a2d34;
  --danger:#e0654f;
  --ok:#58b07c;
  --radius-in:10px;
  --radius-card:16px;
  --sp:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font:15px/1.65 "PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:var(--abyss);color:var(--ink);min-height:100vh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:40px 20px;position:relative;overflow:hidden;
}
body::before{
  content:"";position:absolute;width:720px;height:720px;left:50%;top:50%;
  transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle,rgba(217,164,65,.08) 0%,rgba(217,164,65,0) 62%);
}
.orbit{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border:1px solid rgba(217,164,65,.14);border-radius:50%;width:560px;height:560px}
.star{position:absolute;width:3px;height:3px;border-radius:50%;background:var(--amber);opacity:.55}
.card{
  position:relative;z-index:1;width:min(384px,100%);background:var(--obsidian);
  border:1px solid rgba(217,164,65,.32);border-radius:var(--radius-card);
  padding:40px 34px 30px;text-align:center;
  box-shadow:0 24px 64px rgba(0,0,0,.55);
}
.gem{width:56px;height:56px;margin:0 auto 20px;display:grid;place-items:center}
h1{font-size:21px;letter-spacing:.3em;padding-left:.3em;font-weight:700}
.lead{color:var(--muted);font-size:13px;margin:12px 0 26px;line-height:1.8}
.code-input{
  width:100%;height:52px;text-align:center;font:600 21px/1 ui-monospace,Consolas,monospace;
  letter-spacing:.24em;padding-left:.24em;color:var(--amber);background:#0f1115;
  border:1px solid var(--line);border-radius:var(--radius-in);text-transform:uppercase;
  transition:border-color .18s ease,box-shadow .18s ease;
}
.code-input::placeholder{color:#4d4433;letter-spacing:.24em}
.code-input:hover{border-color:#3c3f47}
.code-input:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 3px rgba(217,164,65,.18)}
.code-input.err{border-color:var(--danger);animation:shake .3s ease}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.feedback{min-height:22px;font-size:13px;margin:12px 0 4px;color:var(--muted)}
.feedback.err{color:var(--danger)}
.feedback.ok{color:var(--ok)}
.submit{
  width:100%;height:48px;margin-top:14px;border:0;border-radius:var(--radius-in);cursor:pointer;
  background:var(--amber);color:#191307;font:inherit;font-weight:700;letter-spacing:.28em;padding-left:.28em;
  transition:background .18s ease,transform .12s ease,opacity .18s ease;
}
.submit:hover:not(:disabled){background:#e7b655}
.submit:active:not(:disabled){transform:translateY(1px)}
.submit:disabled{opacity:.55;cursor:wait}
.submit:focus-visible{outline:3px solid rgba(217,164,65,.45);outline-offset:2px}
.hint{margin-top:18px;font-size:12px;color:var(--muted);letter-spacing:.06em}
.hint code{font-family:ui-monospace,Consolas,monospace;color:var(--amber-dim)}
.divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px;margin:24px 0 14px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.request{background:none;border:0;color:var(--muted);font:inherit;font-size:13px;cursor:pointer;border-bottom:1px solid var(--amber-dim);padding-bottom:1px}
.request:hover{color:var(--amber)}
.foot{position:relative;z-index:1;margin-top:26px;color:#55524a;font-size:12px;letter-spacing:.18em}
.done{display:none}
.done.show{display:block}
.done p{color:var(--muted);font-size:13.5px;margin-top:10px}
.gate{display:none}
.gate.hide{display:none}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<div class="orbit" aria-hidden="true"></div>
<span class="star" style="left:18%;top:22%" aria-hidden="true"></span>
<span class="star" style="left:82%;top:30%" aria-hidden="true"></span>
<span class="star" style="left:74%;top:76%" aria-hidden="true"></span>
<span class="star" style="left:14%;top:68%" aria-hidden="true"></span>
<main class="card">
  <div class="gate" id="gate-view">
    <div class="gem" aria-hidden="true">
      <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
        <path d="M24 4L40 16L34 42H14L8 16L24 4Z" stroke="#d9a441" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M8 16H40M24 4L17 16L24 42L31 16L24 4Z" stroke="#6e5527" stroke-width="1.2" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1>黑 曜</h1>
    <p class="lead">这是一间上锁的协作暗室。<br>没有邀请，谁也进不去。</p>
    <form id="invite-form" novalidate>
      <input class="code-input" id="code" type="text" inputmode="latin" maxlength="9" placeholder="XXXX-XXXX" autocomplete="off" aria-label="邀请码">
      <p class="feedback" id="feedback">邀请码为 8 位字符，写在你的邀请信里。</p>
      <button class="submit" id="submit" type="submit">核 对</button>
    </form>
    <div class="divider">没有邀请码</div>
    <button class="request" id="request" type="button">向室主申请一封邀请信</button>
    <p class="hint">演示环境：输入 <code>YAO8-24K3</code> 可通过核对</p>
  </div>
  <div class="done" id="done-view">
    <div class="gem" aria-hidden="true">
      <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
        <circle cx="24" cy="24" r="20" stroke="#58b07c" stroke-width="1.6"/>
        <path d="M15 24.5L21 30.5L33 17.5" stroke="#58b07c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1>门 已 开</h1>
    <p>核对通过。暗室 07 号为你留了一席，<br>端到端加密已就绪。</p>
  </div>
</main>
<p class="foot">OBSIDIAN ROOM · 邀请制加密协作</p>
<script>
(function(){
  var code=document.getElementById('code');
  var feedback=document.getElementById('feedback');
  var submit=document.getElementById('submit');
  var form=document.getElementById('invite-form');
  var attempts=5;
  var busy=false;
  code.addEventListener('input',function(){
    var raw=code.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8);
    code.value=raw.length>4?raw.slice(0,4)+'-'+raw.slice(4):raw;
    code.classList.remove('err');
  });
  form.addEventListener('submit',function(ev){
    ev.preventDefault();
    if(busy)return;
    var v=code.value;
    if(!/^[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(v)){
      feedback.textContent='格式不对：应为 4 位 + 短横 + 4 位，共 8 位字符。';
      feedback.className='feedback err';
      code.classList.add('err');
      return;
    }
    busy=true;
    submit.disabled=true;
    submit.textContent='核验中…';
    setTimeout(function(){
      busy=false;
      submit.disabled=false;
      submit.textContent='核 对';
      if(v==='YAO8-24K3'){
        feedback.textContent='';
        document.getElementById('gate-view').style.display='none';
        document.getElementById('done-view').classList.add('show');
      }else{
        attempts-=1;
        code.classList.add('err');
        if(attempts>0){
          feedback.textContent='这枚邀请码不存在，或已被人用掉。还可再试 '+attempts+' 次。';
        }else{
          feedback.textContent='五次都未通过，本机已被谢绝来访。请去申请邀请信。';
          submit.disabled=true;
        }
        feedback.className='feedback err';
      }
    },700);
  });
  document.getElementById('request').addEventListener('click',function(){
    feedback.textContent='申请已进入队列，室主通常会在两个工作日内回信。';
    feedback.className='feedback ok';
  });
})();
</script>
</body>
</html>
