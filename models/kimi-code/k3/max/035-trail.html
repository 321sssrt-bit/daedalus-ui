<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>山径 · 路线详情</title>
<style>
:root{
  --pine:#3a6b4f;
  --pine-deep:#2c5540;
  --lime-bg:#f2f4ee;
  --card:#ffffff;
  --ink:#2b352d;
  --muted:#7d8a7f;
  --line:#dfe5da;
  --amber:#d98e3d;
  --frame:#10151f;
  --sp:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font:15px/1.65 "PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:#262b34;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
}
.stage{text-align:center}
.device-label{color:#8b93a1;font-size:12px;letter-spacing:.2em;margin-bottom:14px}
.phone{
  width:390px;height:min(844px,calc(100vh - 90px));border-radius:38px;border:11px solid var(--frame);
  background:var(--lime-bg);overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5);
}
.screen{height:100%;overflow-y:auto;display:flex;flex-direction:column}
.map{
  height:190px;background:linear-gradient(165deg,#dfe8d8,#c9dcc2);position:relative;flex:0 0 auto;
}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.map .back{
  position:absolute;top:16px;left:16px;width:36px;height:36px;border-radius:50%;border:0;
  background:rgba(255,255,255,.85);color:var(--pine);font-size:16px;cursor:pointer;z-index:2;
}
.map .tag{
  position:absolute;bottom:14px;right:14px;background:rgba(255,255,255,.85);color:var(--pine-deep);
  font:600 11px/1 ui-monospace,Consolas,monospace;padding:6px 11px;border-radius:999px;
}
.body{flex:1;padding:20px 20px 16px}
.t-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
h1{font:700 21px/1.4 "PingFang SC",sans-serif;letter-spacing:.03em}
.fav{
  flex:0 0 40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#fff;
  font-size:17px;color:var(--muted);cursor:pointer;transition:all .15s ease;
}
.fav.on{color:#c9483c;border-color:#ecc9c2;background:#fdf1ee}
.sub{color:var(--muted);font-size:12.5px;margin-top:5px}
.stats{display:flex;gap:10px;margin:16px 0}
.stat{
  flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center;
}
.stat .v{font:700 17px/1.2 ui-monospace,Consolas,monospace;color:var(--pine-deep)}
.stat .k{font-size:10.5px;color:var(--muted);margin-top:3px}
.pace-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
.pace-card h2{font-size:13.5px;margin-bottom:10px}
.seg{display:flex;background:var(--lime-bg);border-radius:999px;padding:3px;gap:2px}
.seg button{
  flex:1;border:0;background:none;border-radius:999px;padding:8px 0;font:inherit;font-size:12.5px;
  color:var(--muted);cursor:pointer;transition:all .14s ease;
}
.seg button.on{background:var(--pine);color:#fff;font-weight:700}
.pace-out{margin-top:12px;font-size:13px;color:var(--ink);line-height:1.9}
.pace-out b{color:var(--pine-deep)}
.desc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
.desc h2{font-size:13.5px;margin-bottom:8px}
.desc p{font-size:13.5px;color:#47544a;line-height:1.9}
.points{list-style:none;margin-top:10px}
.points li{display:flex;gap:10px;font-size:13px;padding:6px 0;color:#47544a}
.points li::before{content:"";flex:0 0 8px;height:8px;border-radius:50%;background:var(--pine);margin-top:7px}
.points li span{color:var(--muted);margin-left:auto;font-family:ui-monospace,Consolas,monospace;font-size:11.5px}
.bottom{
  position:sticky;bottom:0;background:rgba(242,244,238,.94);padding:12px 20px 18px;
  border-top:1px solid var(--line);
}
.start{
  width:100%;height:50px;border:0;border-radius:14px;background:var(--pine);color:#fff;
  font:inherit;font-weight:700;font-size:15px;letter-spacing:.2em;cursor:pointer;transition:background .14s ease;
}
.start:hover{background:var(--pine-deep)}
.toast{
  position:fixed;left:50%;bottom:30px;transform:translate(-50%,16px);opacity:0;pointer-events:none;
  background:var(--ink);color:#f2f4ee;padding:11px 24px;border-radius:999px;font-size:13px;transition:all .28s ease;z-index:9;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:520px){
  body{padding:0}
  .device-label{display:none}
  .phone{width:100%;height:100vh;border:0;border-radius:0}
}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<div class="stage">
  <p class="device-label">山 径 TRAIL</p>
  <div class="phone">
    <div class="screen">
      <div class="map">
        <button class="back" type="button" aria-label="返回">←</button>
        <svg viewBox="0 0 390 190" preserveAspectRatio="none" aria-hidden="true">
          <path d="M-10 150C60 130 90 90 150 96C210 102 240 50 300 46C340 43 370 60 400 50" stroke="#3a6b4f" stroke-width="2.4" fill="none" stroke-dasharray="8 6"/>
          <path d="M-10 60C50 50 110 74 170 66C240 56 300 90 400 74" stroke="#a9bfa4" stroke-width="1.4" fill="none"/>
          <path d="M-10 110C70 96 140 126 210 118C280 110 330 128 400 118" stroke="#a9bfa4" stroke-width="1.4" fill="none"/>
          <circle cx="150" cy="96" r="5" fill="#d98e3d"/>
          <circle cx="300" cy="46" r="5" fill="#3a6b4f"/>
        </svg>
        <span class="tag">海拔 1,024m</span>
      </div>
      <div class="body">
        <div class="t-row">
          <div>
            <h1>徽杭古道 · 反穿线</h1>
            <p class="sub">临安 → 绩溪 · 中级难度 · 四季可走</p>
          </div>
          <button class="fav" id="fav" type="button" aria-label="收藏" aria-pressed="false">♡</button>
        </div>
        <div class="stats">
          <div class="stat"><div class="v">18.5</div><div class="k">公里</div></div>
          <div class="stat"><div class="v">860</div><div class="k">累计爬升 m</div></div>
          <div class="stat"><div class="v" id="v-time">7.5</div><div class="k">参考用时 h</div></div>
        </div>
        <div class="pace-card">
          <h2>按你的节奏估一估</h2>
          <div class="seg" role="tablist" aria-label="节奏">
            <button type="button" data-p="easy">休闲走</button>
            <button class="on" type="button" data-p="std">标准走</button>
            <button type="button" data-p="hard">强驴走</button>
          </div>
          <p class="pace-out" id="pace-out">标准走：约 <b>7.5 小时</b>，建议 7:30 前入山。带 <b>2 升水</b>、路餐一顿、登山杖与雨披；蓝天凹垭口风大，备一件抓绒。</p>
        </div>
        <div class="desc">
          <h2>路线说明</h2>
          <p>反穿人少，先苦后甜。上午连续爬升到蓝天凹，午后沿山脊缓下，徽派村落收尾。雨天石阶湿滑，务必穿防滑鞋。</p>
          <ul class="points">
            <li>永来村入山口<span>0 km</span></li>
            <li>黄毛培茶亭<span>4.2 km</span></li>
            <li>蓝天凹垭口<span>9.8 km</span></li>
            <li>江南村关隘<span>14.6 km</span></li>
            <li>绩溪出口<span>18.5 km</span></li>
          </ul>
        </div>
      </div>
      <div class="bottom">
        <button class="start" id="start" type="button">开 始 徒 步</button>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
(function(){
  var paces={
    easy:'休闲走：约 <b>9 小时</b>，建议 7:00 前入山，茶亭多歇两脚。带 <b>2 升水</b>、两顿路餐、登山杖、雨披与头灯（防走夜路）。',
    std:'标准走：约 <b>7.5 小时</b>，建议 7:30 前入山。带 <b>2 升水</b>、路餐一顿、登山杖与雨披；蓝天凹垭口风大，备一件抓绒。',
    hard:'强驴走：约 <b>5.5 小时</b>，8:30 入山也来得及。带 <b>1.5 升水</b>、能量胶两支、越野跑鞋可跑山脊段；雨后就别赶了。'
  };
  var times={easy:'9.0',std:'7.5',hard:'5.5'};
  var out=document.getElementById('pace-out');
  var vtime=document.getElementById('v-time');
  var segs=document.querySelectorAll('.seg button');
  for(var i=0;i<segs.length;i++){
    (function(b){
      b.addEventListener('click',function(){
        for(var j=0;j<segs.length;j++)segs[j].classList.remove('on');
        b.classList.add('on');
        var p=b.getAttribute('data-p');
        out.innerHTML=paces[p];
        vtime.textContent=times[p];
      });
    })(segs[i]);
  }
  var fav=document.getElementById('fav');
  var toast=document.getElementById('toast');
  var timer=null;
  function say(msg){
    toast.textContent=msg;
    toast.classList.add('show');
    if(timer)clearTimeout(timer);
    timer=setTimeout(function(){toast.classList.remove('show')},2000);
  }
  fav.addEventListener('click',function(){
    var on=fav.classList.contains('on');
    if(on){fav.classList.remove('on');fav.textContent='♡';fav.setAttribute('aria-pressed','false')}
    else{fav.classList.add('on');fav.textContent='♥';fav.setAttribute('aria-pressed','true');say('已收进「想走的线」。')}
  });
  document.getElementById('start').addEventListener('click',function(){
    say('已记录起点，下山记得回来打卡。');
  });
})();
</script>
</body>
</html>
