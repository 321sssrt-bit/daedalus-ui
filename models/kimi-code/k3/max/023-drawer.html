<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>百宝屉 · 收藏夹</title>
<style>
:root{
  --wood:#33261a;
  --wood-2:#40301f;
  --wood-3:#4a3823;
  --brass:#c9a86a;
  --paper:#efe4cc;
  --ink:#2c2116;
  --muted:#a08d6f;
  --line:#55402a;
  --radius-card:10px;
  --radius-ctl:6px;
  --sp:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font:14.5px/1.6 "PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:var(--wood);color:var(--paper);min-height:100vh;padding:28px 30px 56px;
}
.head{max-width:1060px;margin:0 auto 22px;display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:14px}
h1{font:700 25px/1.3 "Songti SC","STSong","SimSun",serif;letter-spacing:.24em}
.head .sub{color:var(--muted);font-size:12.5px;letter-spacing:.14em;margin-top:4px}
.tabs{display:flex;gap:7px}
.tabs button{
  border:1px solid var(--line);background:var(--wood-2);color:var(--muted);border-radius:var(--radius-ctl);
  padding:8px 17px;font:inherit;font-size:13px;cursor:pointer;transition:all .14s ease;letter-spacing:.06em;
}
.tabs button:hover{border-color:var(--brass);color:var(--paper)}
.tabs button.on{background:var(--brass);border-color:var(--brass);color:var(--ink);font-weight:700}
.cabinet{
  max-width:1060px;margin:0 auto;background:var(--wood-2);border:1px solid var(--line);
  border-radius:var(--radius-card);padding:18px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25),0 20px 50px rgba(0,0,0,.35);
}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.drawer{
  position:relative;background:var(--wood-3);border:1px solid var(--line);border-radius:8px;
  padding:16px 14px 44px;text-align:center;box-shadow:inset 0 2px 6px rgba(0,0,0,.3);
  transition:transform .15s ease;
}
.drawer:hover{transform:translateY(-2px)}
.drawer .spec{height:74px;display:grid;place-items:center;margin-bottom:10px}
.label{
  display:inline-block;background:var(--paper);color:var(--ink);border:1px solid #cbb37f;border-radius:3px;
  padding:5px 14px;font-size:13px;font-weight:600;letter-spacing:.08em;
  box-shadow:0 1px 0 rgba(0,0,0,.3);
}
.drawer .when{display:block;margin-top:7px;font-size:11px;color:var(--muted);letter-spacing:.1em}
.pull{
  position:absolute;left:50%;bottom:12px;transform:translateX(-50%);
  width:34px;height:12px;border:2px solid var(--brass);border-radius:0 0 12px 12px;border-top:0;
}
.rm{
  position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);
  background:var(--wood-2);color:var(--muted);font-size:12px;cursor:pointer;opacity:0;transition:all .14s ease;
}
.drawer:hover .rm{opacity:1}
.rm:hover{color:#f0c9c0;border-color:#b5453c;background:#5a2c24}
.rm:focus-visible{opacity:1;outline:2px solid var(--brass)}
.empty-hint{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 0;font-size:13px;letter-spacing:.1em}
.toast{
  position:fixed;left:50%;bottom:30px;transform:translate(-50%,16px);opacity:0;pointer-events:none;
  background:var(--paper);color:var(--ink);padding:11px 22px;border-radius:999px;font-size:13.5px;
  transition:all .28s ease;z-index:9;display:flex;gap:14px;align-items:center;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast button{border:0;background:none;color:#8a5a2a;font:inherit;font-size:13px;font-weight:700;cursor:pointer;border-bottom:1px solid #8a5a2a;padding:0 0 1px}
@media(max-width:920px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<div class="head">
  <div>
    <h1>百宝屉</h1>
    <p class="sub">沈墨的标本收藏 · 共 <span id="total">8</span> 屉</p>
  </div>
  <nav class="tabs" aria-label="分类">
    <button class="on" type="button" data-c="all">全部</button>
    <button type="button" data-c="ore">矿石</button>
    <button type="button" data-c="plant">植物</button>
    <button type="button" data-c="insect">昆虫</button>
    <button type="button" data-c="shell">贝壳</button>
  </nav>
</div>
<div class="cabinet">
  <main class="grid" id="grid">
    <article class="drawer" data-c="ore">
      <button class="rm" type="button" aria-label="移出收藏">✕</button>
      <div class="spec"><svg width="56" height="56" viewBox="0 0 56 56" fill="none"><path d="M28 8L44 20L40 46H16L12 20L28 8Z" fill="#7b93c9" stroke="#c9a86a" stroke-width="1.6"/><path d="M12 20H44M28 8L22 20L28 46L34 20L28 8" stroke="#4a5a80" stroke-width="1.2"/></svg></div>
      <span class="label">蓝晶石原矿</span>
      <span class="when">甲辰年 · 收自云南</span>
      <span class="pull" aria-hidden="true"></span>
    </article>
    <article class="drawer" data-c="plant">
      <button class="rm" type="button" aria-label="移出收藏">✕</button>
      <div class="spec"><svg width="56" height="56" viewBox="0 0 56 56" fill="none"><path d="M28 48V24" stroke="#7a9b6d" stroke-width="2.2" stroke-linecap="round"/><path d="M28 24C28 14 21 9 11 10C12 20 18 25 28 24Z" fill="#9dbb8f"/><path d="M28 30C28 22 34 17 44 18C44 27 38 31 28 30Z" fill="#7a9b6d"/></svg></div>
      <span class="label">银杏秋叶标本</span>
      <span class="when">乙巳秋 · 收自故里</span>
      <span class="pull" aria-hidden="true"></span>
    </article>
    <article class="drawer" data-c="insect">
      <button class="rm" type="button" aria-label="移出收藏">✕</button>
      <div class="spec"><svg width="56" height="56" viewBox="0 0 56 56" fill="none"><ellipse cx="28" cy="32" rx="9" ry="13" fill="#8a5a2a"/><path d="M28 19V12M28 12L24 8M28 12L32 8" stroke="#c9a86a" stroke-width="2" stroke-linecap="round"/><path d="M19 28L10 22M19 36L10 40M37 28L46 22M37 36L46 40" stroke="#c9a86a" stroke-width="1.8" stroke-linecap="round"/><path d="M28 22V44" stroke="#5a3a1a" stroke-width="1.6"/></svg></div>
      <span class="label">独角仙 · 雄</span>
      <span class="when">丙午夏 · 收自天目山</span>
      <span class="pull" aria-hidden="true"></span>
    </article>
    <article class="drawer" data-c="shell">
      <button class="rm" type="button" aria-label="移出收藏">✕</button>
      <div class="spec"><svg width="56" height="56" viewBox="0 0 56 56" fill="none"><path d="M28 10C40 10 46 20 46 30C46 40 38 46 28 46C18 46 10 40 10 30C10 20 16 10 28 10Z" fill="#e0b896" stroke="#c9a86a" stroke-width="1.6"/><path d="M28 10C24 20 24 34 28 46M28 10C34 18 36 32 33 45M28 10C20 17 18 30 21 44" stroke="#b08a5a" stroke-width="1.4"/></svg></div>
      <span class="label">维纳斯骨螺</span>
      <span class="when">丙午春 · 收自涠洲</span>
      <span class="pull" aria-hidden="true"></span>
    </article>
    <article class="drawer" data-c="ore">
      <button class="rm" type="button" aria-label="移出收藏">✕</button>
      <div class="spec"><svg width="56" height="56" viewBox="0 0 56 56" fill="none"><rect x="14" y="14" width="12" height="28" rx="2" fill="#c9c2b8" stroke="#8a8074" stroke-width="1.5"/><rect x="28" y="8" width="12" height="34" rx="2" fill="#ded8ce" stroke="#8a8074" stroke-width="1.5"/><rect x="21" y="20" width="12" height="22" rx="2" fill="#b8b0a4" stroke="#8a8074" stroke-width="1.5"/></svg></div>
      <span class="label">水晶晶簇</span>
      <span class="when">乙巳冬 · 收自东海</span>
      <span class="pull" aria-hidden="true"></span>
    </article>
    <article class="drawer" data-c="plant">
      <button class="rm" type="button" aria-label="移出收藏">✕</button>
      <div class="spec"><svg width="56" height="56" viewBox="0 0 56 56" fill="none"><circle cx="28" cy="28" r="4" fill="#e8c85a"/><path d="M28 12V20M28 36V44M12 28H20M36 28H44M17 17L22 22M34 34L39 39M39 17L34 22M22 34L17 39" stroke="#d97f4a" stroke-width="2.4" stroke-linecap="round"/></svg></div>
      <span class="label">波斯菊押花</span>
      <span class="when">丙午夏 · 收自花圃</span>
      <span class="pull" aria-hidden="true"></span>
    </article>
    <article class="drawer" data-c="insect">
      <button class="rm" type="button" aria-label="移出收藏">✕</button>
      <div class="spec"><svg width="56" height="56" viewBox="0 0 56 56" fill="none"><path d="M28 22C20 8 8 10 10 22C12 32 22 34 28 26C34 34 44 32 46 22C48 10 36 8 28 22Z" fill="#7baec9" stroke="#4a7a9a" stroke-width="1.6"/><path d="M28 22V44" stroke="#4a7a9a" stroke-width="2" stroke-linecap="round"/><circle cx="28" cy="46" r="2.4" fill="#4a7a9a"/></svg></div>
      <span class="label">青凤蝶</span>
      <span class="when">乙巳夏 · 收自溪谷</span>
      <span class="pull" aria-hidden="true"></span>
    </article>
    <article class="drawer" data-c="shell">
      <button class="rm" type="button" aria-label="移出收藏">✕</button>
      <div class="spec"><svg width="56" height="56" viewBox="0 0 56 56" fill="none"><path d="M14 38C14 24 24 12 34 12C42 12 46 18 46 24C46 30 42 34 37 34C32 34 29 31 29 27" stroke="#c9a86a" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M14 38C20 40 30 44 40 42" stroke="#e0b896" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg></div>
      <span class="label">鹦鹉螺切片</span>
      <span class="when">甲辰冬 · 收自旧货摊</span>
      <span class="pull" aria-hidden="true"></span>
    </article>
  </main>
</div>
<div class="toast" id="toast"><span id="toast-text"></span><button id="undo" type="button">放回去</button></div>
<script>
(function(){
  var grid=document.getElementById('grid');
  var total=document.getElementById('total');
  var toast=document.getElementById('toast');
  var toastText=document.getElementById('toast-text');
  var timer=null;
  var lastRemoved=null,lastNext=null;
  function refreshCount(){
    var n=grid.querySelectorAll('.drawer').length;
    total.textContent=n;
    var hint=grid.querySelector('.empty-hint');
    if(n===0&&!hint){
      var d=document.createElement('div');
      d.className='empty-hint';
      d.textContent='屉子都空了。';
      grid.appendChild(d);
    }
  }
  function bindRm(){
    var btns=grid.querySelectorAll('.rm');
    for(var i=0;i<btns.length;i++){
      (function(btn){
        btn.addEventListener('click',function(ev){
          ev.stopPropagation();
          var card=btn.parentNode;
          lastRemoved=card;
          lastNext=card.nextSibling;
          var name=card.querySelector('.label').firstChild.nodeValue;
          grid.removeChild(card);
          refreshCount();
          toastText.textContent='「'+name+'」已移出百宝屉';
          toast.classList.add('show');
          if(timer)clearTimeout(timer);
          timer=setTimeout(function(){toast.classList.remove('show')},3000);
        });
      })(btns[i]);
    }
  }
  document.getElementById('undo').addEventListener('click',function(){
    if(!lastRemoved)return;
    grid.insertBefore(lastRemoved,lastNext&&lastNext.parentNode===grid?lastNext:null);
    lastRemoved=null;
    bindRm();
    refreshCount();
    toast.classList.remove('show');
  });
  var tabs=document.querySelectorAll('.tabs button');
  for(var k=0;k<tabs.length;k++){
    (function(tab){
      tab.addEventListener('click',function(){
        for(var j=0;j<tabs.length;j++)tabs[j].classList.remove('on');
        tab.classList.add('on');
        var c=tab.getAttribute('data-c');
        var drawers=grid.querySelectorAll('.drawer');
        for(var m=0;m<drawers.length;m++){
          var show=c==='all'||drawers[m].getAttribute('data-c')===c;
          drawers[m].style.display=show?'':'none';
        }
      });
    })(tabs[k]);
  }
  bindRm();
})();
</script>
</body>
</html>
