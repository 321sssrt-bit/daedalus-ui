<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>破晓 · 今天的第一页</title>
<style>
:root{
  --dawn-hi:#fff6e8;
  --dawn-lo:#ffd3a0;
  --ink:#4a3a2c;
  --muted:#9b8570;
  --accent:#e07b39;
  --accent-deep:#c4631f;
  --card:#fffaf2;
  --line:#f0d9b8;
  --radius-card:20px;
  --radius-ctl:999px;
  --sp:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font:15px/1.75 "PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  color:var(--ink);min-height:100vh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:40px 24px;text-align:center;
  background:linear-gradient(180deg,var(--dawn-hi) 0%,#ffe4bd 52%,var(--dawn-lo) 100%);
}
.brand{font-size:13px;letter-spacing:.5em;padding-left:.5em;color:var(--accent-deep);font-weight:700;margin-bottom:34px}
.sun{width:180px;height:118px;margin-bottom:26px}
h1{font:700 30px/1.4 "Songti SC","STSong","SimSun",serif;letter-spacing:.1em}
.lead{color:var(--muted);max-width:420px;margin:14px auto 34px}
.actions{display:flex;flex-direction:column;gap:14px;align-items:center}
.primary{
  border:0;border-radius:var(--radius-ctl);cursor:pointer;padding:14px 40px;
  background:var(--accent);color:#fff;font:inherit;font-weight:700;font-size:15.5px;letter-spacing:.14em;
  box-shadow:0 10px 26px rgba(224,123,57,.4);transition:background .16s ease,transform .14s ease;
}
.primary:hover{background:var(--accent-deep);transform:translateY(-1px)}
.primary:active{transform:translateY(0)}
.primary:focus-visible{outline:3px solid rgba(224,123,57,.4);outline-offset:3px}
.secondary{
  background:none;border:0;cursor:pointer;color:var(--accent-deep);font:inherit;font-size:14px;
  letter-spacing:.08em;padding:6px 10px;border-radius:8px;border-bottom:1px dashed rgba(196,99,31,.5);
}
.secondary:hover{color:var(--accent);border-bottom-style:solid}
.secondary:focus-visible{outline:3px solid rgba(224,123,57,.35)}
.quiet{margin-top:44px;color:var(--muted);font-size:12.5px;letter-spacing:.2em}
.composer,.sample{
  display:none;width:min(520px,100%);background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius-card);box-shadow:0 18px 46px rgba(160,110,50,.18);
  padding:26px 26px 22px;text-align:left;margin-top:8px;
}
.composer.show,.sample.show{display:block}
.composer h2,.sample h2{font-size:17px;margin-bottom:12px;letter-spacing:.06em}
.composer textarea{
  width:100%;min-height:120px;resize:vertical;padding:13px 14px;font:inherit;color:var(--ink);
  background:#fffdf8;border:1px solid var(--line);border-radius:12px;line-height:1.8;
}
.composer textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(224,123,57,.14)}
.composer .row{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
.count{color:var(--muted);font-size:12.5px;font-family:ui-monospace,Consolas,monospace}
.save{
  border:0;border-radius:var(--radius-ctl);cursor:pointer;padding:9px 24px;
  background:var(--accent);color:#fff;font:inherit;font-size:13.5px;font-weight:700;letter-spacing:.1em;
}
.save:hover:not(:disabled){background:var(--accent-deep)}
.save:disabled{opacity:.4;cursor:not-allowed}
.sample p{color:var(--ink);font-size:14px;line-height:1.9}
.sample .who{margin-top:12px;color:var(--muted);font-size:12.5px;letter-spacing:.1em}
.toast{
  position:fixed;left:50%;bottom:34px;transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:var(--ink);color:#fff6e8;padding:11px 22px;border-radius:999px;font-size:13.5px;
  letter-spacing:.08em;transition:all .3s ease;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<p class="brand">破 晓 日 记</p>
<svg class="sun" viewBox="0 0 180 118" fill="none" aria-hidden="true">
  <circle cx="90" cy="74" r="34" fill="#f4a259"/>
  <path d="M90 22V10M48 36L40 26M132 36L140 26" stroke="#e07b39" stroke-width="3" stroke-linecap="round"/>
  <path d="M16 88H164" stroke="#c4631f" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="1 10"/>
  <path d="M34 100H146" stroke="#e07b39" stroke-width="2" stroke-linecap="round" opacity=".55"/>
  <path d="M56 110H124" stroke="#e07b39" stroke-width="2" stroke-linecap="round" opacity=".3"/>
  <path d="M36 52C38 48 42 48 44 52C46 48 50 48 52 52" stroke="#9b8570" stroke-width="2" stroke-linecap="round"/>
  <path d="M128 46C130 42 134 42 136 46C138 42 142 42 144 46" stroke="#9b8570" stroke-width="2" stroke-linecap="round"/>
</svg>
<h1>今天的第一页，还是空白</h1>
<p class="lead">这里是你的晨间日记。每天只留一页，写三两句也好。太阳刚出来，此刻写下的话，晚上回来看会不一样。</p>
<div class="actions">
  <button class="primary" id="start" type="button">写下今天的第一句</button>
  <button class="secondary" id="peek" type="button">先翻翻别人的清晨</button>
</div>
<div class="composer" id="composer">
  <h2>8 月 14 日 · 清晨</h2>
  <textarea id="entry" placeholder="窗外还蒙蒙亮，我……" maxlength="200"></textarea>
  <div class="row">
    <span class="count" id="count">0 / 200</span>
    <button class="save" id="save" type="button" disabled>收进今日册</button>
  </div>
</div>
<div class="sample" id="sample">
  <h2>来自一位陌生早起的邻居</h2>
  <p>「五点半醒了，索性去阳台看那盆茉莉。开了三朵，比昨天多一朵。原来等待是有动静的，只是白天太吵听不见。」</p>
  <p class="who">—— 破晓第 4,812 位记录者</p>
</div>
<p class="quiet">每天只写一页 · 写完即封存</p>
<div class="toast" id="toast">已收进今日册，明早见。</div>
<script>
(function(){
  var composer=document.getElementById('composer');
  var sample=document.getElementById('sample');
  var entry=document.getElementById('entry');
  var count=document.getElementById('count');
  var save=document.getElementById('save');
  var toast=document.getElementById('toast');
  document.getElementById('start').addEventListener('click',function(){
    sample.classList.remove('show');
    composer.classList.add('show');
    entry.focus();
  });
  document.getElementById('peek').addEventListener('click',function(){
    composer.classList.remove('show');
    sample.classList.toggle('show');
  });
  entry.addEventListener('input',function(){
    count.textContent=entry.value.length+' / 200';
    save.disabled=entry.value.trim().length<2;
  });
  save.addEventListener('click',function(){
    composer.classList.remove('show');
    toast.classList.add('show');
    setTimeout(function(){toast.classList.remove('show')},2400);
  });
})();
</script>
</body>
</html>
