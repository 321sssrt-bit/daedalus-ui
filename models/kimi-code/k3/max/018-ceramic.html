<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>青瓷山房 · 器型详情</title>
<style>
:root{
  --paper:#f7f4ec;
  --celadon:#8fb3a0;
  --celadon-deep:#5f8a74;
  --celadon-bg:#dfe9e0;
  --ink:#2f3a34;
  --muted:#93a096;
  --line:#e0dccb;
  --gold:#b89b5e;
  --radius-card:14px;
  --radius-ctl:8px;
  --sp:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font:15px/1.7 "PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:var(--paper);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;
}
.topbar{
  display:flex;align-items:center;justify-content:space-between;padding:18px 40px;
  border-bottom:1px solid var(--line);
}
.brand{font:700 17px/1 "Songti SC","STSong","SimSun",serif;letter-spacing:.3em}
.crumb{color:var(--muted);font-size:12.5px;letter-spacing:.08em}
.stage{flex:1;display:flex;max-width:1160px;width:100%;margin:0 auto;padding:44px 40px;gap:56px}
.visual{
  flex:1;min-height:480px;background:var(--celadon-bg);border-radius:var(--radius-card);
  display:grid;place-items:center;position:relative;overflow:hidden;
}
.visual::after{
  content:"";position:absolute;left:50%;bottom:64px;width:220px;height:26px;border-radius:50%;
  background:rgba(95,138,116,.22);transform:translateX(-50%);filter:blur(2px);
}
.visual .mark{
  position:absolute;top:18px;left:22px;font-size:11.5px;color:var(--celadon-deep);letter-spacing:.24em;
}
.vase{width:240px;height:360px}
.info{flex:0 0 400px;display:flex;flex-direction:column;justify-content:center}
.series{color:var(--celadon-deep);font-size:12px;letter-spacing:.3em;margin-bottom:14px}
h1{font:700 30px/1.35 "Songti SC","STSong","SimSun",serif;letter-spacing:.08em}
.sub{color:var(--muted);font-size:13.5px;margin:10px 0 24px}
.price{font:700 30px/1 ui-monospace,Consolas,monospace;color:var(--ink);margin-bottom:6px}
.price small{font:400 12px/1 "PingFang SC",sans-serif;color:var(--muted);margin-left:8px;letter-spacing:.1em}
.divider{height:1px;background:var(--line);margin:24px 0}
.opts-label{font-size:12.5px;color:var(--muted);letter-spacing:.14em;margin-bottom:10px}
.opts{display:flex;gap:9px;margin-bottom:8px}
.opt{
  border:1px solid var(--line);background:#fdfbf5;border-radius:var(--radius-ctl);cursor:pointer;
  padding:10px 18px;font:inherit;font-size:13.5px;color:var(--ink);transition:all .15s ease;
}
.opt small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.opt:hover{border-color:var(--celadon)}
.opt.on{border-color:var(--celadon-deep);background:var(--celadon-bg);box-shadow:inset 0 0 0 1px var(--celadon-deep)}
.opt:focus-visible{outline:3px solid rgba(95,138,116,.35)}
.qty{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:var(--radius-ctl);width:max-content;margin:14px 0 26px;background:#fdfbf5}
.qty button{
  width:40px;height:42px;border:0;background:none;font:inherit;font-size:17px;color:var(--ink);cursor:pointer;
  transition:color .13s ease;
}
.qty button:hover:not(:disabled){color:var(--celadon-deep)}
.qty button:disabled{opacity:.3;cursor:not-allowed}
.qty .n{width:46px;text-align:center;font:600 15px/1 ui-monospace,Consolas,monospace}
.actions{display:flex;gap:12px;align-items:center}
.buy{
  flex:1;height:52px;border:0;border-radius:var(--radius-ctl);cursor:pointer;background:var(--ink);color:#f7f4ec;
  font:inherit;font-weight:700;font-size:15px;letter-spacing:.26em;padding-left:.26em;transition:background .16s ease;
}
.buy:hover{background:var(--celadon-deep)}
.buy:focus-visible{outline:3px solid rgba(47,58,52,.4);outline-offset:2px}
.fav{
  width:52px;height:52px;border:1px solid var(--line);border-radius:var(--radius-ctl);background:#fdfbf5;
  cursor:pointer;display:grid;place-items:center;transition:border-color .15s ease;font-size:19px;color:var(--muted);
}
.fav:hover{border-color:var(--gold);color:var(--gold)}
.fav.on{border-color:var(--gold);color:var(--gold)}
.notes{margin-top:26px;color:var(--muted);font-size:12.5px;line-height:2}
.toast{
  position:fixed;left:50%;bottom:32px;transform:translate(-50%,16px);opacity:0;pointer-events:none;
  background:var(--ink);color:#f7f4ec;padding:11px 24px;border-radius:999px;font-size:13.5px;letter-spacing:.06em;
  transition:all .3s ease;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:920px){
  .stage{flex-direction:column;gap:26px;padding:26px 20px}
  .visual{min-height:320px}
  .info{flex:none;width:100%}
}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">青瓷山房</div>
  <nav class="crumb">器 / 茶席 · 花器 / 龙泉窑 周师傅亲制</nav>
</header>
<main class="stage">
  <div class="visual">
    <span class="mark">粉青釉 · 一窑仅成六件</span>
    <svg class="vase" viewBox="0 0 240 360" fill="none" aria-label="瓷器器型示意">
      <g id="shape-yuhu">
        <path d="M96 30C96 58 74 78 74 120C74 148 52 180 52 232C52 296 84 330 120 330C156 330 188 296 188 232C188 180 166 148 166 120C166 78 144 58 144 30L132 30C132 52 148 76 148 118C148 150 170 182 170 230C170 288 144 312 120 312C96 312 70 288 70 230C70 182 92 150 92 118C92 76 108 52 108 30Z" fill="#a9c8b6" stroke="#5f8a74" stroke-width="2.5"/>
        <path d="M92 36H148" stroke="#5f8a74" stroke-width="3" stroke-linecap="round"/>
        <path d="M82 210C100 218 140 218 158 210" stroke="#f7f4ec" stroke-width="2" opacity=".55" stroke-linecap="round"/>
      </g>
      <g id="shape-mei" style="display:none">
        <path d="M88 40C88 62 70 82 62 112C52 150 48 200 56 250C64 306 92 330 120 330C148 330 176 306 184 250C192 200 188 150 178 112C170 82 152 62 152 40L138 40C138 58 156 82 162 116C170 156 172 202 166 246C160 292 140 312 120 312C100 312 80 292 74 246C68 202 70 156 78 116C84 82 102 58 102 40Z" fill="#a9c8b6" stroke="#5f8a74" stroke-width="2.5"/>
        <path d="M84 46H156" stroke="#5f8a74" stroke-width="3" stroke-linecap="round"/>
        <path d="M66 190C90 200 150 200 174 190" stroke="#f7f4ec" stroke-width="2" opacity=".55" stroke-linecap="round"/>
      </g>
      <g id="shape-douli" style="display:none">
        <path d="M42 130C60 210 88 262 120 262C152 262 180 210 198 130L186 130C170 198 146 244 120 244C94 244 70 198 54 130Z" fill="#a9c8b6" stroke="#5f8a74" stroke-width="2.5"/>
        <path d="M38 124H202" stroke="#5f8a74" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M104 262V286C104 292 136 292 136 286V262" fill="#a9c8b6" stroke="#5f8a74" stroke-width="2.5"/>
        <path d="M66 160C86 170 154 170 174 160" stroke="#f7f4ec" stroke-width="2" opacity=".55" stroke-linecap="round"/>
      </g>
    </svg>
  </div>
  <div class="info">
    <p class="series">龙泉窑 · 癸卯秋窑</p>
    <h1 id="pname">粉青玉壶春瓶</h1>
    <p class="sub">釉色如雨过天青云破处。周师傅亲制，一窑仅成六件，件件附手写窑签。</p>
    <p class="price" id="price">¥1,280<small>含锦盒与顺丰保价</small></p>
    <div class="divider"></div>
    <p class="opts-label">器型</p>
    <div class="opts" role="tablist" aria-label="器型选择">
      <button class="opt on" type="button" data-shape="yuhu" data-name="粉青玉壶春瓶" data-price="¥1,280">玉壶春瓶<small>高 26cm</small></button>
      <button class="opt" type="button" data-shape="mei" data-name="粉青梅瓶" data-price="¥1,680">梅瓶<small>高 28cm</small></button>
      <button class="opt" type="button" data-shape="douli" data-name="粉青斗笠盏" data-price="¥460">斗笠盏<small>口径 14cm</small></button>
    </div>
    <p class="opts-label">数量</p>
    <div class="qty">
      <button id="minus" type="button" disabled>−</button>
      <span class="n" id="qn">1</span>
      <button id="plus" type="button">＋</button>
    </div>
    <div class="actions">
      <button class="buy" id="buy" type="button">立 即 购 得</button>
      <button class="fav" id="fav" type="button" aria-label="收藏" aria-pressed="false">♡</button>
    </div>
    <p class="notes">· 手工拉坯，尺寸釉色略有出入，正是手作的脾气<br>· 七日无损可退，来回运费山房承担<br>· 每件附周师傅手写窑签与烧成温度记录</p>
  </div>
</main>
<div class="toast" id="toast"></div>
<script>
(function(){
  var price=document.getElementById('price');
  var pname=document.getElementById('pname');
  var toast=document.getElementById('toast');
  var qn=document.getElementById('qn');
  var minus=document.getElementById('minus');
  var plus=document.getElementById('plus');
  var fav=document.getElementById('fav');
  var qty=1,timer=null;
  var shapes=['yuhu','mei','douli'];
  var opts=document.querySelectorAll('.opt');
  for(var i=0;i<opts.length;i++){
    (function(btn){
      btn.addEventListener('click',function(){
        for(var j=0;j<opts.length;j++)opts[j].classList.remove('on');
        btn.classList.add('on');
        var s=btn.getAttribute('data-shape');
        for(var k=0;k<shapes.length;k++){
          document.getElementById('shape-'+shapes[k]).style.display=shapes[k]===s?'':'none';
        }
        pname.textContent=btn.getAttribute('data-name');
        price.innerHTML=btn.getAttribute('data-price')+'<small>含锦盒与顺丰保价</small>';
      });
    })(opts[i]);
  }
  minus.addEventListener('click',function(){
    if(qty>1){qty-=1;qn.textContent=qty;minus.disabled=qty===1}
  });
  plus.addEventListener('click',function(){
    if(qty<6){qty+=1;qn.textContent=qty;minus.disabled=false}
  });
  fav.addEventListener('click',function(){
    var on=fav.classList.contains('on');
    if(on){fav.classList.remove('on');fav.textContent='♡';fav.setAttribute('aria-pressed','false')}
    else{fav.classList.add('on');fav.textContent='♥';fav.setAttribute('aria-pressed','true')}
  });
  document.getElementById('buy').addEventListener('click',function(){
    toast.textContent=pname.textContent+' × '+qty+' 已下单，这就为你包上三层棉纸。';
    toast.classList.add('show');
    if(timer)clearTimeout(timer);
    timer=setTimeout(function(){toast.classList.remove('show')},2200);
  });
})();
</script>
</body>
</html>
