<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>脉搏 · 训练数据看板</title>
<style>
:root{
  --bg:#16181d;
  --panel:#1f232b;
  --panel-2:#262b34;
  --bar:#313947;
  --volt:#a8f03c;
  --volt-deep:#7fc22a;
  --ink:#eceff3;
  --muted:#8b93a1;
  --line:#2e3440;
  --radius-card:12px;
  --radius-ctl:8px;
  --sp:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font:14px/1.55 "PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:var(--bg);color:var(--ink);min-height:100vh;
}
.topbar{
  height:56px;display:flex;align-items:center;justify-content:space-between;
  padding:0 26px;border-bottom:1px solid var(--line);background:var(--panel);
}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;letter-spacing:.14em}
.brand .live{width:8px;height:8px;border-radius:50%;background:var(--volt);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.3}}
.range{font:12px/1 ui-monospace,Consolas,monospace;color:var(--muted)}
.wrap{padding:22px 26px;display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.stats{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-card);padding:15px 18px}
.stat .k{color:var(--muted);font-size:12px;letter-spacing:.08em}
.stat .v{font:700 28px/1.25 ui-monospace,Consolas,monospace;margin-top:4px}
.stat .v small{font-size:13px;color:var(--muted);font-weight:400;margin-left:4px}
.stat .d{font-size:11.5px;margin-top:3px;color:var(--volt)}
.chart-card{grid-column:span 8;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-card);padding:18px 20px}
.side-card{grid-column:span 4;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-card);padding:18px 20px}
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.head h2{font-size:14.5px;letter-spacing:.04em}
.head .read{font:12px/1 ui-monospace,Consolas,monospace;color:var(--volt)}
.seg{display:flex;background:var(--panel-2);border-radius:999px;padding:3px;gap:2px}
.seg button{
  border:0;background:none;color:var(--muted);font:inherit;font-size:12px;padding:5px 14px;border-radius:999px;
  cursor:pointer;transition:all .14s ease;
}
.seg button.on{background:var(--volt);color:#16181d;font-weight:700}
.chart{width:100%;height:260px;display:block}
.bar{fill:var(--bar);cursor:pointer;transition:fill .14s ease}
.bar:hover{fill:#414b5e}
.bar.on{fill:var(--volt)}
.axis{font:10px/1 ui-monospace,Consolas,monospace;fill:var(--muted)}
.zone{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
.zone:last-child{border-bottom:0}
.zone .nm{flex:0 0 76px;color:var(--muted)}
.zone .barbg{flex:1;height:8px;border-radius:4px;background:var(--panel-2);overflow:hidden}
.zone .barbg i{display:block;height:100%;border-radius:4px}
.zone .pc{font:11.5px/1 ui-monospace,Consolas,monospace;color:var(--ink);width:38px;text-align:right}
.recent{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.recent h3{font-size:12.5px;color:var(--muted);letter-spacing:.08em;margin-bottom:10px}
.recent li{display:flex;justify-content:space-between;font-size:12.5px;padding:6px 0;list-style:none}
.recent .mono{font-family:ui-monospace,Consolas,monospace;color:var(--muted)}
@media(max-width:980px){
  .chart-card,.side-card{grid-column:1/-1}
  .stats{grid-template-columns:repeat(2,1fr)}
}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="live" aria-hidden="true"></span>
    脉搏 PULSE
  </div>
  <span class="range">训练季 · 第 24–36 周</span>
</header>
<main class="wrap">
  <section class="stats" aria-label="关键数字">
    <div class="stat"><div class="k">本周跑量</div><div class="v">42.6<small>km</small></div><div class="d">▲ 环比 +12%</div></div>
    <div class="stat"><div class="k">平均心率</div><div class="v">138<small>bpm</small></div><div class="d">▼ 静息走低，好兆头</div></div>
    <div class="stat"><div class="k">训练时长</div><div class="v">5:12<small>h</small></div><div class="d">▲ 连续 6 周达标</div></div>
    <div class="stat"><div class="k">总消耗</div><div class="v">3,240<small>kcal</small></div><div class="d">▲ +8%</div></div>
  </section>
  <section class="chart-card">
    <div class="head">
      <h2>训练负荷趋势</h2>
      <span class="read" id="readout">点一根柱子看数值</span>
      <div class="seg" role="tablist" aria-label="粒度切换">
        <button class="on" id="seg-week" type="button">按周</button>
        <button id="seg-month" type="button">按月</button>
      </div>
    </div>
    <svg class="chart" id="chart" viewBox="0 0 640 260" preserveAspectRatio="none" aria-label="训练负荷柱状图">
      <g id="g-week">
        <rect class="bar" x="10" y="102.8" width="42.5" height="133.2" rx="4" data-l="W24" data-v="31.5"></rect>
        <rect class="bar" x="62.5" y="82.9" width="42.5" height="153.1" rx="4" data-l="W25" data-v="36.2"></rect>
        <rect class="bar" x="115" y="115.9" width="42.5" height="120.1" rx="4" data-l="W26" data-v="28.4"></rect>
        <rect class="bar" x="167.5" y="66.4" width="42.5" height="169.6" rx="4" data-l="W27" data-v="40.1"></rect>
        <rect class="bar" x="220" y="75.3" width="42.5" height="160.7" rx="4" data-l="W28" data-v="38"></rect>
        <rect class="bar" x="272.5" y="47.4" width="42.5" height="188.6" rx="4" data-l="W29" data-v="44.6"></rect>
        <rect class="bar" x="325" y="95.6" width="42.5" height="140.4" rx="4" data-l="W30" data-v="33.2"></rect>
        <rect class="bar" x="377.5" y="59.3" width="42.5" height="176.7" rx="4" data-l="W31" data-v="41.8"></rect>
        <rect class="bar" x="430" y="36" width="42.5" height="200" rx="4" data-l="W32" data-v="47.3"></rect>
        <rect class="bar" x="482.5" y="69" width="42.5" height="167" rx="4" data-l="W33" data-v="39.5"></rect>
        <rect class="bar" x="535" y="45.7" width="42.5" height="190.3" rx="4" data-l="W34" data-v="45"></rect>
        <rect class="bar" x="587.5" y="55.9" width="42.5" height="180.1" rx="4" data-l="W35" data-v="42.6"></rect>
        <text class="axis" x="31.25" y="254" text-anchor="middle">W24</text>
        <text class="axis" x="83.75" y="254" text-anchor="middle">W25</text>
        <text class="axis" x="136.25" y="254" text-anchor="middle">W26</text>
        <text class="axis" x="188.75" y="254" text-anchor="middle">W27</text>
        <text class="axis" x="241.25" y="254" text-anchor="middle">W28</text>
        <text class="axis" x="293.75" y="254" text-anchor="middle">W29</text>
        <text class="axis" x="346.25" y="254" text-anchor="middle">W30</text>
        <text class="axis" x="398.75" y="254" text-anchor="middle">W31</text>
        <text class="axis" x="451.25" y="254" text-anchor="middle">W32</text>
        <text class="axis" x="503.75" y="254" text-anchor="middle">W33</text>
        <text class="axis" x="556.25" y="254" text-anchor="middle">W34</text>
        <text class="axis" x="608.75" y="254" text-anchor="middle">W35</text>
      </g>
      <g id="g-month" style="display:none">
        <rect class="bar" x="10" y="98" width="95" height="138" rx="4" data-l="3月" data-v="118"></rect>
        <rect class="bar" x="115" y="81.6" width="95" height="154.4" rx="4" data-l="4月" data-v="132"></rect>
        <rect class="bar" x="220" y="88.6" width="95" height="147.4" rx="4" data-l="5月" data-v="126"></rect>
        <rect class="bar" x="325" y="55.9" width="95" height="180.1" rx="4" data-l="6月" data-v="154"></rect>
        <rect class="bar" x="430" y="36" width="95" height="200" rx="4" data-l="7月" data-v="171"></rect>
        <rect class="bar" x="535" y="45.4" width="95" height="190.6" rx="4" data-l="8月" data-v="163"></rect>
        <text class="axis" x="57.5" y="254" text-anchor="middle">3月</text>
        <text class="axis" x="162.5" y="254" text-anchor="middle">4月</text>
        <text class="axis" x="267.5" y="254" text-anchor="middle">5月</text>
        <text class="axis" x="372.5" y="254" text-anchor="middle">6月</text>
        <text class="axis" x="477.5" y="254" text-anchor="middle">7月</text>
        <text class="axis" x="582.5" y="254" text-anchor="middle">8月</text>
      </g>
    </svg>
  </section>
  <aside class="side-card">
    <div class="head"><h2>心率区间分布</h2></div>
    <div class="zone"><span class="nm">恢复 &lt;120</span><span class="barbg"><i style="width:22%;background:#5b8dd9"></i></span><span class="pc">22%</span></div>
    <div class="zone"><span class="nm">燃脂 120–140</span><span class="barbg"><i style="width:41%;background:#a8f03c"></i></span><span class="pc">41%</span></div>
    <div class="zone"><span class="nm">有氧 140–155</span><span class="barbg"><i style="width:24%;background:#e8b45a"></i></span><span class="pc">24%</span></div>
    <div class="zone"><span class="nm">阈值 155–170</span><span class="barbg"><i style="width:9%;background:#e06a4f"></i></span><span class="pc">9%</span></div>
    <div class="zone"><span class="nm">冲刺 &gt;170</span><span class="barbg"><i style="width:4%;background:#c44848"></i></span><span class="pc">4%</span></div>
    <div class="recent">
      <h3>最近训练</h3>
      <ul>
        <li><span>晨间轻松跑</span><span class="mono">8.2 km · 132 bpm</span></li>
        <li><span>间歇 400m × 10</span><span class="mono">6.0 km · 158 bpm</span></li>
        <li><span>周末长距离</span><span class="mono">21.1 km · 141 bpm</span></li>
      </ul>
    </div>
  </aside>
</main>
<script>
(function(){
  var chart=document.getElementById('chart');
  var readout=document.getElementById('readout');
  var segW=document.getElementById('seg-week');
  var segM=document.getElementById('seg-month');
  var gW=document.getElementById('g-week');
  var gM=document.getElementById('g-month');
  var mode='week';
  function clearSel(){
    var bars=chart.querySelectorAll('.bar');
    for(var i=0;i<bars.length;i++)bars[i].classList.remove('on');
  }
  var allBars=chart.querySelectorAll('.bar');
  for(var k=0;k<allBars.length;k++){
    (function(bar){
      bar.addEventListener('click',function(){
        clearSel();
        bar.classList.add('on');
        readout.textContent=bar.getAttribute('data-l')+' · '+bar.getAttribute('data-v')+(mode==='week'?' km / 周':' km / 月');
      });
    })(allBars[k]);
  }
  function setMode(next){
    mode=next;
    gW.style.display=next==='week'?'':'none';
    gM.style.display=next==='month'?'':'none';
    segW.classList.toggle('on',next==='week');
    segM.classList.toggle('on',next==='month');
    clearSel();
    readout.textContent='点一根柱子看数值';
  }
  segW.addEventListener('click',function(){setMode('week')});
  segM.addEventListener('click',function(){setMode('month')});
})();
</script>
</body>
</html>
