<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>星图 · 成员目录</title>
<style>
:root{
  --space:#0f1626;
  --space-2:#16203a;
  --star:#f4d47c;
  --ink:#e6e9f2;
  --muted:#8d97ad;
  --line:#263252;
  --accent:#7b93f2;
  --radius-card:14px;
  --radius-ctl:999px;
  --sp:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font:14.5px/1.6 "PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:var(--space);color:var(--ink);min-height:100vh;position:relative;
}
.stars{position:fixed;inset:0;pointer-events:none;z-index:0}
.tw{position:absolute;border-radius:50%;background:#e6e9f2;animation:tw 3s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.25}to{opacity:.9}}
.wrap{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:30px 26px 50px}
.head{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:16px;margin-bottom:24px}
h1{font-size:24px;letter-spacing:.16em}
.head .sub{color:var(--muted);font-size:12.5px;margin-top:6px;letter-spacing:.1em}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.chip{
  border:1px solid var(--line);background:var(--space-2);border-radius:var(--radius-ctl);cursor:pointer;
  padding:7px 16px;font:inherit;font-size:13px;color:var(--muted);transition:all .14s ease;
}
.chip:hover{border-color:var(--accent);color:var(--ink)}
.chip.on{background:var(--star);border-color:var(--star);color:#241d08;font-weight:700}
.chip:focus-visible{outline:3px solid rgba(244,212,124,.4)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.member{
  background:var(--space-2);border:1px solid var(--line);border-radius:var(--radius-card);
  padding:20px 16px 16px;text-align:center;cursor:pointer;transition:transform .15s ease,border-color .15s ease;
  font:inherit;color:inherit;display:block;width:100%;
}
.member:hover{transform:translateY(-3px);border-color:var(--star)}
.member:focus-visible{outline:3px solid rgba(244,212,124,.4)}
.avatar{width:72px;height:72px;margin:0 auto 12px;border-radius:50%;background:var(--space);border:1px solid var(--line);display:grid;place-items:center}
.member h2{font-size:15px;margin-bottom:3px;font-weight:700}
.member .role{font-size:11.5px;color:var(--star);letter-spacing:.12em;margin-bottom:6px}
.member .city{font-size:12px;color:var(--muted)}
.overlay{
  position:fixed;inset:0;background:rgba(8,12,24,.7);display:none;align-items:center;justify-content:center;
  padding:24px;z-index:10;
}
.overlay.show{display:flex}
.profile{
  width:min(420px,100%);background:var(--space-2);border:1px solid var(--star);border-radius:var(--radius-card);
  padding:28px 26px;position:relative;box-shadow:0 24px 70px rgba(0,0,0,.6);
}
.profile .close{
  position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);
  background:none;color:var(--muted);font-size:16px;cursor:pointer;transition:all .13s ease;
}
.profile .close:hover{color:var(--ink);border-color:var(--ink)}
.profile .head2{display:flex;gap:16px;align-items:center;margin-bottom:16px}
.profile h3{font-size:19px;letter-spacing:.06em}
.profile .role2{font-size:12px;color:var(--star);letter-spacing:.12em}
.kv{display:grid;grid-template-columns:72px 1fr;gap:8px 12px;font-size:13px;margin:16px 0}
.kv dt{color:var(--muted)}
.kv dd{color:var(--ink)}
.profile .bio{font-size:13px;color:var(--muted);line-height:1.9;border-top:1px dashed var(--line);padding-top:14px}
@media(max-width:960px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<div class="stars" id="stars" aria-hidden="true">
  <span class="tw" style="width:2px;height:2px;left:8%;top:12%"></span>
  <span class="tw" style="width:1px;height:1px;left:22%;top:64%"></span>
  <span class="tw" style="width:3px;height:3px;left:35%;top:30%"></span>
  <span class="tw" style="width:1px;height:1px;left:48%;top:80%"></span>
  <span class="tw" style="width:2px;height:2px;left:57%;top:18%"></span>
  <span class="tw" style="width:1px;height:1px;left:66%;top:52%"></span>
  <span class="tw" style="width:2px;height:2px;left:74%;top:8%"></span>
  <span class="tw" style="width:1px;height:1px;left:83%;top:70%"></span>
  <span class="tw" style="width:3px;height:3px;left:91%;top:38%"></span>
  <span class="tw" style="width:1px;height:1px;left:14%;top:86%"></span>
  <span class="tw" style="width:2px;height:2px;left:40%;top:55%"></span>
  <span class="tw" style="width:1px;height:1px;left:95%;top:88%"></span>
</div>
<div class="wrap">
  <div class="head">
    <div>
      <h1>星图成员录</h1>

    </div>
    <div class="filters" role="tablist" aria-label="按组别筛选">
      <button class="chip on" type="button" data-g="all">全部</button>

  <main class="grid" id="grid">
    <button class="member" type="button" data-g="visual" data-i="0">

    <button class="member" type="button" data-g="edu" data-i="2">
      <div class="avatar"><svg width="52" height="52" viewBox="0 0 68 68" fill="none"><path d="M12 30L28 16L44 24L58 14M44 24L40 46L22 52" stroke="#7b93f2" stroke-width="1" opacity=".7"/><circle cx="12" cy="30" r="2.2" fill="#f4d47c"/><circle cx="28" cy="16" r="1.6" fill="#e6e9f2"/><circle cx="44" cy="24" r="2.6" fill="#f4d47c"/><circle cx="58" cy="14" r="1.8" fill="#e6e9f2"/><circle cx="40" cy="46" r="2" fill="#f4d47c"/><circle cx="22" cy="52" r="1.6" fill="#e6e9f2"/></svg></div>
      <h2>小满</h2><p class="role">科普讲解</p><p class="city">市区科技馆</p>
    </button>
    <button class="member" type="button" data-g="visual" data-i="3">
      <div class="avatar"><svg width="52" height="52" viewBox="0 0 68 68" fill="none"><path d="M20 14L38 26L56 20L50 44L28 50L16 34L20 14" stroke="#7b93f2" stroke-width="1" opacity=".7"/><circle cx="20" cy="14" r="2.4" fill="#f4d47c"/><circle cx="38" cy="26" r="1.8" fill="#e6e9f2"/><circle cx="56" cy="20" r="2.2" fill="#f4d47c"/><circle cx="50" cy="44" r="1.6" fill="#e6e9f2"/><circle cx="28" cy="50" r="2.6" fill="#f4d47c"/><circle cx="16" cy="34" r="1.8" fill="#e6e9f2"/></svg></div>
      <h2>一瓢</h2><p class="role">目视派</p><p class="city">良渚</p>
    </button>
    <button class="member" type="button" data-g="photo" data-i="4">
      <div class="avatar"><svg width="52" height="52" viewBox="0 0 68 68" fill="none"><path d="M14 40L26 18L44 14L56 32L46 52L24 54L14 40" stroke="#7b93f2" stroke-width="1" opacity=".7"/><circle cx="14" cy="40" r="1.8" fill="#e6e9f2"/><circle cx="26" cy="18" r="2.4" fill="#f4d47c"/><circle cx="44" cy="14" r="1.6" fill="#e6e9f2"/><circle cx="56" cy="32" r="2.6" fill="#f4d47c"/><circle cx="46" cy="52" r="2" fill="#e6e9f2"/><circle cx="24" cy="54" r="1.6" fill="#f4d47c"/></svg></div>
      <h2>拾光</h2><p class="role">深空摄影</p><p class="city">富阳</p>
    </button>
    <button class="member" type="button" data-g="edu" data-i="5">
      <div class="avatar"><svg width="52" height="52" viewBox="0 0 68 68" fill="none"><path d="M10 22L30 34L52 26M30 34L26 54M52 26L58 46" stroke="#7b93f2" stroke-width="1" opacity=".7"/><circle cx="10" cy="22" r="2.2" fill="#f4d47c"/><circle cx="30" cy="34" r="2.6" fill="#e6e9f2"/><circle cx="52" cy="26" r="1.8" fill="#f4d47c"/><circle cx="26" cy="54" r="1.6" fill="#e6e9f2"/><circle cx="58" cy="46" r="2" fill="#f4d47c"/></svg></div>
      <h2>阿斗</h2><p class="role">科普讲解</p><p class="city">城东小学</p>
    </button>
    <button class="member" type="button" data-g="visual" data-i="6">
      <div class="avatar"><svg width="52" height="52" viewBox="0 0 68 68" fill="none"><path d="M16 16L34 30L52 16M34 30L34 52M34 30L18 44M34 30L50 44" stroke="#7b93f2" stroke-width="1" opacity=".7"/><circle cx="16" cy="16" r="2" fill="#f4d47c"/><circle cx="34" cy="30" r="2.8" fill="#e6e9f2"/><circle cx="52" cy="16" r="2" fill="#f4d47c"/><circle cx="34" cy="52" r="1.6" fill="#e6e9f2"/><circle cx="18" cy="44" r="1.8" fill="#f4d47c"/><circle cx="50" cy="44" r="1.8" fill="#e6e9f2"/></svg></div>
      <h2>迟萤</h2><p class="role">目视派 · 流星组</p><p class="city">千岛湖</p>
    </button>
    <button class="member" type="button" data-g="photo" data-i="7">
      <div class="avatar"><svg width="52" height="52" viewBox="0 0 68 68" fill="none"><path d="M12 48L24 28L40 36L56 18M40 36L54 50" stroke="#7b93f2" stroke-width="1" opacity=".7"/><circle cx="12" cy="48" r="1.8" fill="#e6e9f2"/><circle cx="24" cy="28" r="2.4" fill="#f4d47c"/><circle cx="40" cy="36" r="1.8" fill="#e6e9f2"/><circle cx="56" cy="18" r="2.6" fill="#f4d47c"/><circle cx="54" cy="50" r="2" fill="#e6e9f2"/></svg></div>
      <h2>河鼓</h2><p class="role">深空摄影 · 行星组</p><p class="city">钱塘江边</p>
    </button>
  </main>
</div>
<div class="overlay" id="overlay">
  <div class="profile" role="dialog" aria-modal="true" aria-label="成员简介">
    <button class="close" id="close" type="button" aria-label="关闭">✕</button>
    <div class="head2">
      <div class="avatar" id="p-avatar"></div>
      <div>
        <h3 id="p-name"></h3>
        <p class="role2" id="p-role"></p>
      </div>
    </div>
    <dl class="kv">
      <dt>常驻</dt><dd id="p-city"></dd>
      <dt>设备</dt><dd id="p-gear"></dd>
      <dt>入会</dt><dd id="p-since"></dd>
      <dt>代表作</dt><dd id="p-work"></dd>
    </dl>
    <p class="bio" id="p-bio"></p>
  </div>
</div>
<script>
(function(){
  var profiles=[
    {gear:'20 寸道布森',since:'2016 春',work:'手绘月面图册 40 幅',bio:'只看目镜里的东西，不拍照。说星星是看的，不是存的。每周三晚在城北台带新人认星座。'},
    {gear:'102APO + 冷冻相机',since:'2019 秋',work:'M42 累计曝光 22 小时',bio:'为了等一个无月夜可以连请三天年假。后期坚持「看得出原片」的克制流派。'},
    {gear:'激光笔与一幅好嗓子',since:'2021 夏',work:'「阳台认星」系列 26 期',bio:'坚信科普的第一步是让人抬头。给小朋友们讲星星从不照稿，星座神话张口就来。'},
    {gear:'15×70 双筒',since:'2022 春',work:'双筒梅西耶全马拉松',bio:'只用双筒打完了梅西耶马拉松。装备预算全部换成了去暗夜保护区的车票。'},
    {gear:'80ED 改机',since:'2020 冬',work:'玫瑰星云窄带三色',bio:'上班族，打野摄影党。设备常年塞在后备箱，哪个郊区的云先散就往哪开。'},
    {gear:'自制活动星图',since:'2018 秋',work:'操场天文课 140 场',bio:'小学科学老师。每年带孩子在操场办认星夜，坚持手写观测记录本。'},
    {gear:'躺椅与暖宝宝',since:'2023 夏',work:'三大流星雨全勤记录',bio:'专看流星雨。群里人称「许愿司长」，每小时流量报数比电台还准。'},
    {gear:'C11 + 行星相机',since:'2017 冬',work:'木星空域五年对比',bio:'行星摄影老手。说行星像老朋友，每年都要看看它们气色如何。'}
  ];
  var overlay=document.getElementById('overlay');
  var grid=document.getElementById('grid');
  var cards=grid.querySelectorAll('.member');
  for(var i=0;i<cards.length;i++){
    (function(card){
      card.addEventListener('click',function(){
        var idx=Number(card.getAttribute('data-i'));
        var p=profiles[idx];
        document.getElementById('p-avatar').innerHTML=card.querySelector('.avatar').innerHTML;
        document.getElementById('p-name').textContent=card.querySelector('h2').firstChild.nodeValue;
        document.getElementById('p-role').textContent=card.querySelector('.role').firstChild.nodeValue;
        document.getElementById('p-city').textContent=card.querySelector('.city').firstChild.nodeValue;
        document.getElementById('p-gear').textContent=p.gear;
        document.getElementById('p-since').textContent=p.since;
        document.getElementById('p-work').textContent=p.work;
        document.getElementById('p-bio').textContent=p.bio;
        overlay.classList.add('show');
      });
    })(cards[i]);
  }
  document.getElementById('close').addEventListener('click',function(){overlay.classList.remove('show')});
  overlay.addEventListener('click',function(ev){if(ev.target===overlay)overlay.classList.remove('show')});
  document.addEventListener('keydown',function(ev){if(ev.key==='Escape')overlay.classList.remove('show')});
  var chips=document.querySelectorAll('.chip');
  for(var k=0;k<chips.length;k++){
    (function(c){
      c.addEventListener('click',function(){
        for(var j=0;j<chips.length;j++)chips[j].classList.remove('on');
        c.classList.add('on');
        var g=c.getAttribute('data-g');
        for(var m=0;m<cards.length;m++){
          var show=g==='all'||cards[m].getAttribute('data-g')===g;
          cards[m].style.display=show?'':'none';
        }
      });
    })(chips[k]);
  }
  var stars=document.getElementById('stars');
  for(var n=0;n<48;n++){
    var tw=document.createElement('span');
    tw.className='tw';
    var sz=(n%3)+1;
    tw.style.width=sz+'px';tw.style.height=sz+'px';
    tw.style.left=(n*37%100)+'%';
    tw.style.top=(n*53%100)+'%';
    tw.style.animationDelay=(n%7)*.4+'s';
    stars.appendChild(tw);
  }
})();
</script>
</body>
</html>
