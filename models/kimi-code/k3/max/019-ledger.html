<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>账房 · 购物车</title>
<style>
:root{
  --kraft:#e2cfa8;
  --kraft-2:#d6bf92;
  --paper:#f4ead2;
  --ink:#2b2620;
  --muted:#7d6f56;
  --line:#c3ad83;
  --red:#a83a32;
  --red-deep:#8a2b24;
  --radius-card:10px;
  --radius-ctl:6px;
  --sp:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font:14.5px/1.6 "PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:var(--kraft);color:var(--ink);min-height:100vh;padding:30px 20px 60px;
  background-image:radial-gradient(rgba(120,90,40,.12) 1px,transparent 1.4px);background-size:22px 22px;
}
.book{max-width:780px;margin:0 auto}
.head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px;padding:0 6px}
h1{font:700 24px/1.3 "Songti SC","STSong","SimSun",serif;letter-spacing:.2em}
.head .who{color:var(--muted);font-size:12.5px;letter-spacing:.1em}
.ledger{
  background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-card);
  box-shadow:0 14px 34px rgba(90,65,25,.25);padding:0 0 8px;position:relative;overflow:hidden;
}
.ledger::before{content:"";position:absolute;top:0;bottom:0;left:44px;width:1.5px;background:rgba(168,58,50,.4)}
.ledger::after{content:"";position:absolute;top:0;bottom:0;left:48px;width:1px;background:rgba(168,58,50,.22)}
table{width:100%;border-collapse:collapse}
th,td{padding:13px 18px 13px 66px;text-align:left;font-size:14px;border-bottom:1px solid var(--line)}
th{
  font:600 11.5px/1 "PingFang SC",sans-serif;color:var(--muted);letter-spacing:.18em;
  border-bottom:2px solid var(--ink);padding-top:16px;
}
th:nth-child(3),td:nth-child(3),th:nth-child(4),td:nth-child(4){text-align:center}
th:nth-child(2),td:nth-child(2),th:nth-child(5),td:nth-child(5){text-align:right;padding-right:20px;padding-left:18px}
tr.gone td{opacity:.32;text-decoration:line-through}
.name{font-weight:600}
.name small{display:block;font-weight:400;color:var(--muted);font-size:11.5px;margin-top:2px}
.mono{font-family:ui-monospace,Consolas,monospace}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:var(--radius-ctl);background:#fbf4e2}
.qty button{
  width:30px;height:30px;border:0;background:none;font:inherit;font-size:15px;cursor:pointer;color:var(--ink);
}
.qty button:hover:not(:disabled){color:var(--red)}
.qty button:disabled{opacity:.3;cursor:not-allowed}
.qty .n{min-width:34px;text-align:center;font:600 13.5px/1 ui-monospace,Consolas,monospace}
.del{
  border:0;background:none;color:var(--muted);font:inherit;font-size:12.5px;cursor:pointer;
  border-bottom:1px dashed var(--muted);padding:0 0 1px;
}
.del:hover{color:var(--red);border-bottom-color:var(--red)}
.foot{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 12px 66px}
.foot .sum-label{font-size:12.5px;color:var(--muted);letter-spacing:.14em}
.total{font:700 30px/1 ui-monospace,Consolas,monospace;color:var(--red)}
.total small{font-size:13px;color:var(--muted);font-weight:400}
.checkout{
  border:0;border-radius:var(--radius-ctl);background:var(--red);color:#f4ead2;cursor:pointer;
  padding:14px 34px;font:inherit;font-weight:700;font-size:15px;letter-spacing:.24em;padding-left:calc(34px + .24em);
  box-shadow:0 6px 16px rgba(168,58,50,.3);transition:background .15s ease;
}
.checkout:hover:not(:disabled){background:var(--red-deep)}
.checkout:disabled{opacity:.4;cursor:not-allowed}
.checkout:focus-visible{outline:3px solid rgba(168,58,50,.4);outline-offset:2px}
.empty-row td{text-align:center;color:var(--muted);padding:34px 18px 30px 66px;font-size:13.5px}
.toast{
  position:fixed;left:50%;bottom:30px;transform:translate(-50%,16px);opacity:0;pointer-events:none;
  background:var(--ink);color:#f4ead2;padding:11px 24px;border-radius:999px;font-size:13.5px;transition:all .28s ease;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.stamp{
  position:absolute;right:26px;top:14px;width:64px;height:64px;border:2px solid var(--red);border-radius:8px;
  display:grid;place-items:center;color:var(--red);font:700 15px/1.4 "Songti SC","STSong",serif;
  text-align:center;transform:rotate(6deg);opacity:.5;letter-spacing:.1em;pointer-events:none;
}
@media(max-width:680px){
  .ledger::before,.ledger::after{display:none}
  th,td{padding:10px 10px}
  .foot{padding:16px 12px}
  .stamp{display:none}
}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<div class="book">
  <div class="head">
    <h1>账房 · 购物清单</h1>
    <span class="who">三省文具铺 · 熟客 周清言</span>
  </div>
  <div class="ledger">
    <div class="stamp" aria-hidden="true">三省<br>文房</div>
    <table>
      <thead>
        <tr><th>货品</th><th>单价</th><th>数量</th><th>小计</th><th>划掉</th></tr>
      </thead>
      <tbody id="tbody">
        <tr data-price="38.00">
          <td class="name">狼毫小楷 · 行云<small>湖州善琏镇制</small></td>
          <td class="mono">¥38.00</td>
          <td><span class="qty"><button class="m" type="button">−</button><span class="n">1</span><button class="p" type="button">＋</button></span></td>
          <td class="mono sub">¥38.00</td>
          <td><button class="del" type="button">划去</button></td>
        </tr>
        <tr data-price="16.50">
          <td class="name">楮皮信笺 · 一刀五十张<small>仿宋楮皮纸</small></td>
          <td class="mono">¥16.50</td>
          <td><span class="qty"><button class="m" type="button">−</button><span class="n">2</span><button class="p" type="button">＋</button></span></td>
          <td class="mono sub">¥33.00</td>
          <td><button class="del" type="button">划去</button></td>
        </tr>
        <tr data-price="52.00">
          <td class="name">松烟墨 · 半斤笏<small>老胡开文墨厂</small></td>
          <td class="mono">¥52.00</td>
          <td><span class="qty"><button class="m" type="button">−</button><span class="n">1</span><button class="p" type="button">＋</button></span></td>
          <td class="mono sub">¥52.00</td>
          <td><button class="del" type="button">划去</button></td>
        </tr>
        <tr data-price="9.80">
          <td class="name">黄铜裁纸刀<small>手工打磨 · 带皮套</small></td>
          <td class="mono">¥9.80</td>
          <td><span class="qty"><button class="m" type="button">−</button><span class="n">1</span><button class="p" type="button">＋</button></span></td>
          <td class="mono sub">¥9.80</td>
          <td><button class="del" type="button">划去</button></td>
        </tr>
      </tbody>
    </table>
    <div class="foot">
      <div>
        <div class="sum-label">合计（不含运资）</div>
        <div class="total" id="total">¥132.80</div>
      </div>
      <button class="checkout" id="checkout" type="button">去 结 算</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
(function(){
  var tbody=document.getElementById('tbody');
  var total=document.getElementById('total');
  var checkout=document.getElementById('checkout');
  var toast=document.getElementById('toast');
  var timer=null;
  function fmt(v){return '¥'+v.toFixed(2)}
  function recalc(){
    var rows=tbody.querySelectorAll('tr[data-price]');
    var sum=0,alive=0;
    for(var i=0;i<rows.length;i++){
      var r=rows[i];
      if(r.classList.contains('gone'))continue;
      alive++;
      var price=Number(r.getAttribute('data-price'));
      var n=Number(r.querySelector('.n').firstChild.nodeValue);
      var sub=price*n;
      sum+=sub;
      r.querySelector('.sub').textContent=fmt(sub);
    }
    total.textContent=fmt(sum);
    checkout.disabled=alive===0;
    if(alive===0){
      var tr=document.createElement('tr');
      tr.className='empty-row';
      tr.innerHTML='<td colspan="5">账页空了。去铺子里再挑点什么吧。</td>';
      tbody.appendChild(tr);
    }
  }
  function bind(){
    var rows=tbody.querySelectorAll('tr[data-price]');
    for(var i=0;i<rows.length;i++){
      (function(r){
        r.querySelector('.m').addEventListener('click',function(){
          var nEl=r.querySelector('.n');
          var n=Number(nEl.firstChild.nodeValue);
          if(n>1){nEl.textContent=n-1;recalc()}
        });
        r.querySelector('.p').addEventListener('click',function(){
          var nEl=r.querySelector('.n');
          var n=Number(nEl.firstChild.nodeValue);
          if(n<99){nEl.textContent=n+1;recalc()}
        });
        r.querySelector('.del').addEventListener('click',function(){
          r.classList.add('gone');
          recalc();
        });
      })(rows[i]);
    }
  }
  checkout.addEventListener('click',function(){
    toast.textContent='账已记清，'+total.textContent+'，掌柜的这就给你包货。';
    toast.classList.add('show');
    if(timer)clearTimeout(timer);
    timer=setTimeout(function(){toast.classList.remove('show')},2200);
  });
  bind();
  recalc();
})();
</script>
</body>
</html>
