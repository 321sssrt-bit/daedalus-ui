<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>钤印 · 发布确认</title>
<style>
:root{
  --xuan:#f6f1e4;
  --cinnabar:#b23c2a;
  --cinnabar-deep:#932e1e;
  --ink:#33302a;
  --muted:#8b8474;
  --line:#ddd2ba;
  --gold:#b89b5e;
  --radius-card:14px;
  --radius-ctl:8px;
  --sp:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font:15px/1.75 "PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:var(--xuan);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:40px 24px;
}
.card{
  width:min(480px,100%);background:#fbf7ea;border:1px solid var(--line);border-radius:var(--radius-card);
  padding:38px 36px 28px;text-align:center;box-shadow:0 18px 46px rgba(120,90,40,.14);
}
.seal-ic{width:62px;height:62px;margin:0 auto 18px}
h1{font:700 24px/1.4 "Songti SC","STSong","SimSun",serif;letter-spacing:.14em}
.conseq{
  margin:14px auto 22px;color:var(--ink);font-size:14px;line-height:1.9;max-width:360px;
  background:#f4edda;border:1px solid var(--line);border-radius:var(--radius-ctl);padding:12px 16px;
}
.conseq b{color:var(--cinnabar)}
.item{font-size:12.5px;color:var(--muted);margin-bottom:22px;letter-spacing:.06em}
.item b{color:var(--ink)}
.gate{text-align:left;margin-bottom:22px}
.agree{
  display:flex;align-items:flex-start;gap:10px;font-size:13.5px;cursor:pointer;
  padding:12px 14px;border:1px solid var(--line);border-radius:var(--radius-ctl);background:#fdfaf0;
}
.agree input{position:absolute;opacity:0;pointer-events:none}
.agree .box{
  flex:0 0 20px;height:20px;border:1.5px solid var(--line);border-radius:6px;background:#fff;
  display:grid;place-items:center;transition:all .15s ease;margin-top:1px;
}
.agree .box svg{opacity:0;transform:scale(.5);transition:all .15s ease}
.agree input:checked + .box{background:var(--cinnabar);border-color:var(--cinnabar)}
.agree input:checked + .box svg{opacity:1;transform:scale(1)}
.agree input:focus-visible + .box{box-shadow:0 0 0 3px rgba(178,60,42,.3)}
.wordrow{margin-top:12px}
.wordrow label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:7px}
.wordrow input{
  width:100%;height:46px;text-align:center;font:700 17px/1 "Songti SC","STSong","SimSun",serif;
  letter-spacing:.5em;padding-left:.5em;color:var(--cinnabar);background:#fdfaf0;
  border:1.5px solid var(--line);border-radius:var(--radius-ctl);transition:border-color .15s ease,box-shadow .15s ease;
}
.wordrow input:focus{outline:none;border-color:var(--cinnabar);box-shadow:0 0 0 3px rgba(178,60,42,.14)}
.wordrow input::placeholder{color:#c9bfa4;font-weight:400}
.actions{display:flex;gap:12px}
.back{
  flex:1;height:50px;border:1.5px solid var(--ink);background:none;border-radius:var(--radius-ctl);
  font:inherit;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;letter-spacing:.1em;
  transition:all .14s ease;
}
.back:hover{background:var(--ink);color:#f6f1e4}
.confirm{
  flex:1.2;height:50px;border:0;border-radius:var(--radius-ctl);background:var(--cinnabar);color:#fbf7ea;
  font:inherit;font-weight:700;font-size:14.5px;letter-spacing:.2em;padding-left:.2em;cursor:pointer;
  transition:background .15s ease,opacity .15s ease;
}
.confirm:hover:not(:disabled){background:var(--cinnabar-deep)}
.confirm:disabled{opacity:.35;cursor:not-allowed}
.confirm:focus-visible,.back:focus-visible{outline:3px solid rgba(178,60,42,.35);outline-offset:2px}
.done{display:none}
.done.show{display:block}
.bigseal{
  width:110px;height:110px;margin:0 auto 20px;border:4px solid var(--cinnabar);border-radius:50%;
  display:grid;place-items:center;color:var(--cinnabar);font:700 26px/1.3 "Songti SC","STSong","SimSun",serif;
  letter-spacing:.1em;transform:rotate(-7deg);animation:stamp .34s ease;
}
@keyframes stamp{from{transform:rotate(-7deg) scale(1.5);opacity:0}to{transform:rotate(-7deg) scale(1);opacity:1}}
.done h2{font:700 22px/1.4 "Songti SC","STSong","SimSun",serif;letter-spacing:.14em}
.done p{color:var(--muted);font-size:13.5px;margin-top:10px;line-height:1.9}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<main class="card">
  <div id="ask">
    <svg class="seal-ic" viewBox="0 0 62 62" fill="none" aria-hidden="true">
      <rect x="10" y="26" width="42" height="28" rx="4" stroke="#b23c2a" stroke-width="2.4"/>
      <path d="M24 26V16C24 11 27 8 31 8C35 8 38 11 38 16V26" stroke="#b23c2a" stroke-width="2.4"/>
      <path d="M24 36H38M24 43H34" stroke="#b23c2a" stroke-width="2.2" stroke-linecap="round"/>
    </svg>
    <h1>即将钤印付印</h1>
    <p class="conseq">付印后，本期内容将<b>锁定并同步到全部订阅终端</b>，纸刊送印厂开印——此动作<b>不可撤回</b>。</p>
    <p class="item">待印件：<b>《档案》第 47 期 · 处暑号</b>（6 篇 / 58 页）</p>
    <div class="gate">
      <label class="agree">
        <input type="checkbox" id="ck">
        <span class="box" aria-hidden="true"><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 6.5L4.8 9L10 3.5" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span>我已通读最终校对样，确认六篇篇目、页码与图片均已核定。</span>
      </label>
      <div class="wordrow">
        <label for="word">手写「付印」二字，以正此印</label>
        <input id="word" type="text" placeholder="付印" autocomplete="off" maxlength="2">
      </div>
    </div>
    <div class="actions">
      <button class="back" id="back" type="button">返回再校一遍</button>
      <button class="confirm" id="confirm" type="button" disabled>钤 印 付 印</button>
    </div>
  </div>
  <div class="done" id="done">
    <div class="bigseal">付<br>印</div>
    <h2>已 付 印</h2>
    <p>《档案》第 47 期 · 处暑号已锁定。<br>印厂回执单号 YS-2026-0814，明晨开印。</p>
  </div>
</main>
<script>
(function(){
  var ck=document.getElementById('ck');
  var word=document.getElementById('word');
  var confirm=document.getElementById('confirm');
  function gate(){
    confirm.disabled=!(ck.checked&&word.value.replace(/\s/g,'')==='付印');
  }
  ck.addEventListener('change',gate);
  word.addEventListener('input',gate);
  document.getElementById('back').addEventListener('click',function(){
    word.value='';
    ck.checked=false;
    gate();
    word.focus();
  });
  confirm.addEventListener('click',function(){
    document.getElementById('ask').style.display='none';
    document.getElementById('done').classList.add('show');
  });
})();
</script>
</body>
</html>
