<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>熔炉 · 注销账号</title>
<style>
:root{
  --char:#181619;
  --panel:#221f24;
  --lava:#e0432e;
  --lava-deep:#b02e1d;
  --ember:#f08a3c;
  --ink:#ece7e2;
  --muted:#97908c;
  --line:#38333a;
  --radius-card:14px;
  --radius-ctl:8px;
  --sp:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font:15px/1.7 "PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:var(--char);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:40px 24px;position:relative;overflow:hidden;
}
body::before{
  content:"";position:absolute;left:50%;bottom:-180px;width:640px;height:360px;transform:translateX(-50%);
  background:radial-gradient(ellipse at center,rgba(224,67,46,.22),transparent 65%);pointer-events:none;
}
.card{
  position:relative;width:min(500px,100%);background:var(--panel);border:1px solid var(--line);
  border-top:4px solid var(--lava);border-radius:var(--radius-card);padding:34px 34px 26px;
  box-shadow:0 30px 70px rgba(0,0,0,.6);
}
.warn-row{display:flex;gap:16px;align-items:flex-start;margin-bottom:20px}
.warn-ic{
  flex:0 0 52px;height:52px;border-radius:12px;background:rgba(224,67,46,.14);
  display:grid;place-items:center;
}
h1{font-size:21px;letter-spacing:.1em}
.warn-row .sub{color:var(--muted);font-size:12.5px;margin-top:5px;letter-spacing:.06em}
.loss{
  border:1px solid var(--line);border-radius:var(--radius-ctl);margin-bottom:20px;overflow:hidden;
}
.loss h2{
  font-size:12px;letter-spacing:.2em;color:var(--ember);padding:11px 16px;background:rgba(240,138,60,.08);
  border-bottom:1px solid var(--line);
}
.loss ul{list-style:none}
.loss li{
  display:flex;gap:11px;align-items:center;padding:11px 16px;font-size:13.5px;border-bottom:1px solid var(--line);
}
.loss li:last-child{border-bottom:0}
.loss li::before{content:"✕";color:var(--lava);font-weight:700;font-size:12px}
.loss li b{font-family:ui-monospace,Consolas,monospace;color:var(--ink)}
.loss li span{color:var(--muted)}
.gate{margin-bottom:22px}
.gate label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:8px}
.gate label b{color:var(--lava);letter-spacing:.2em}
.gate input{
  width:100%;height:46px;text-align:center;font:700 16px/1 ui-monospace,Consolas,monospace;letter-spacing:.4em;
  padding-left:.4em;color:var(--lava);background:#17151a;border:1.5px solid var(--line);border-radius:var(--radius-ctl);
  transition:border-color .15s ease,box-shadow .15s ease;
}
.gate input:focus{outline:none;border-color:var(--lava);box-shadow:0 0 0 3px rgba(224,67,46,.18)}
.gate input::placeholder{color:#4d4750;font-weight:400}
.actions{display:flex;flex-direction:column;gap:11px}
.cancel{
  width:100%;height:52px;border:0;border-radius:var(--radius-ctl);background:var(--ink);color:#181619;
  font:inherit;font-weight:700;font-size:15px;letter-spacing:.16em;cursor:pointer;
  transition:background .15s ease;
}
.cancel:hover{background:#ffffff}
.cancel:focus-visible{outline:3px solid rgba(236,231,226,.4);outline-offset:2px}
.danger{
  width:100%;height:44px;border:1px solid var(--lava-deep);background:none;border-radius:var(--radius-ctl);
  color:var(--lava);font:inherit;font-size:13px;letter-spacing:.1em;cursor:pointer;
  transition:all .15s ease;
}
.danger:disabled{opacity:.3;cursor:not-allowed;border-color:var(--line);color:var(--muted)}
.danger:hover:not(:disabled){background:rgba(224,67,46,.12)}
.foot{margin-top:18px;text-align:center;color:var(--muted);font-size:11.5px;letter-spacing:.08em}
.done{display:none;text-align:center;padding:14px 0 4px}
.done.show{display:block}
.done .ash{width:70px;height:70px;margin:0 auto 16px}
.done h2{font-size:19px;letter-spacing:.14em}
.done p{color:var(--muted);font-size:13px;margin-top:10px;line-height:1.9}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<main class="card">
  <div id="ask">
    <div class="warn-row">
      <div class="warn-ic" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
          <path d="M14 3C14 9 7 11.5 7 18C7 23 10 25.5 14 25.5C18 25.5 21 23 21 18C21 11.5 14 9 14 3Z" stroke="#e0432e" stroke-width="2" stroke-linejoin="round"/>
          <path d="M14 14C14 17 11.8 18 11.8 20.5C11.8 22.8 12.9 24 14 24C15.1 24 16.2 22.8 16.2 20.5C16.2 18 14 17 14 14Z" fill="#f08a3c"/>
        </svg>
      </div>
      <div>
        <h1>注销「萤石集市」账号</h1>
        <p class="sub">账号 qingyan 将进入熔炉 · 操作编号 DL-4471</p>
      </div>
    </div>
    <div class="loss">
      <h2>注销后，你将失去</h2>
      <ul>
        <li><b>42</b><span>笔订单与对应售后资格</span></li>
        <li><b>128</b><span>件收藏与 6 个心愿单</span></li>
        <li><b>3,400</b><span>会员积分与未用的 2 张券</span></li>
        <li><b>实名</b><span>认证信息、3 个收货地址</span></li>
      </ul>
    </div>
    <div class="gate">
      <label for="word">如确意已决，请手书 <b>销毁</b> 二字确认（注销后不可恢复）</label>
      <input id="word" type="text" placeholder="销毁" autocomplete="off" maxlength="2">
    </div>
    <div class="actions">
      <button class="cancel" id="cancel" type="button">再想想，先不注销</button>
      <button class="danger" id="destroy" type="button" disabled>确认注销，投入熔炉</button>
    </div>
    <p class="foot">注销即时生效 · 有未完结售后单时需先处理</p>
  </div>
  <div class="done" id="done">
    <svg class="ash" viewBox="0 0 70 70" fill="none" aria-hidden="true">
      <circle cx="35" cy="35" r="30" stroke="#97908c" stroke-width="2"/>
      <path d="M24 35L32 43L47 27" stroke="#97908c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <h2>账号已注销</h2>
    <p>qingyan 的资料已尽数投入熔炉。<br>炉温回落，此处已无痕迹。再会。</p>
  </div>
</main>
<script>
(function(){
  var word=document.getElementById('word');
  var destroy=document.getElementById('destroy');
  word.addEventListener('input',function(){
    destroy.disabled=word.value.replace(/\s/g,'')!=='销毁';
  });
  destroy.addEventListener('click',function(){
    document.getElementById('ask').style.display='none';
    document.getElementById('done').classList.add('show');
  });
  document.getElementById('cancel').addEventListener('click',function(){
    word.value='';
    destroy.disabled=true;
    word.focus();
  });
})();
</script>
</body>
</html>
