<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>信鸽 · 队讯</title>
<style>
:root{
  --tele:#2e6b52;
  --tele-deep:#23533f;
  --paper:#f2eee0;
  --card:#fffdf4;
  --ink:#2b332c;
  --muted:#8a8f80;
  --line:#dcd6c0;
  --danger:#c0452e;
  --frame:#10151f;
  --sp:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font:15px/1.6 "PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:#262b34;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
}
.stage{text-align:center}
.device-label{color:#8b93a1;font-size:12px;letter-spacing:.2em;margin-bottom:14px}
.phone{
  width:390px;height:min(844px,calc(100vh - 90px));border-radius:38px;border:11px solid var(--frame);
  background:var(--paper);overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5);
}
.screen{height:100%;display:flex;flex-direction:column;position:relative}
.view{display:none;flex-direction:column;height:100%}
.view.on{display:flex}
.topbar{
  flex:0 0 auto;background:var(--tele);color:#f2eee0;padding:14px 18px;
  display:flex;align-items:center;gap:11px;
}
.topbar .bk{border:0;background:none;color:#f2eee0;font-size:17px;cursor:pointer;padding:2px 6px}
.topbar h1{font-size:15.5px;letter-spacing:.1em;flex:1}
.sig{display:flex;align-items:center;gap:6px;font:10.5px/1 ui-monospace,Consolas,monospace}
.sig .bars{display:inline-flex;gap:1.5px;align-items:flex-end}
.sig .bars i{width:3.5px;background:#f2eee0;border-radius:1px}
.sig .bars i:nth-child(1){height:4px}.sig .bars i:nth-child(2){height:7px}.sig .bars i:nth-child(3){height:10px}.sig .bars i:nth-child(4){height:13px}
.sig.weak .bars i:nth-child(3),.sig.weak .bars i:nth-child(4){opacity:.25}
.weak-toggle{
  display:flex;align-items:center;gap:7px;background:rgba(0,0,0,.18);border:1px solid rgba(242,238,224,.35);
  border-radius:999px;padding:5px 11px;color:#f2eee0;font:inherit;font-size:11px;cursor:pointer;
}
.weak-toggle .sw{width:26px;height:15px;border-radius:999px;background:rgba(242,238,224,.3);position:relative;transition:background .15s ease}
.weak-toggle .sw::after{content:"";position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:50%;background:#f2eee0;transition:left .15s ease}
.weak-toggle[aria-checked="true"] .sw{background:#d98e3d}
.weak-toggle[aria-checked="true"] .sw::after{left:13px}
.list{flex:1;overflow-y:auto;padding:14px 14px}
.chat-row{
  width:100%;display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:13px 14px;margin-bottom:9px;cursor:pointer;text-align:left;font:inherit;color:inherit;
  transition:transform .13s ease;
}
.chat-row:active{transform:scale(.99)}
.chat-row .av{flex:0 0 42px;height:42px;border-radius:12px;display:grid;place-items:center;font-weight:700;color:#fff;font-size:14px}
.chat-row .nm{font-size:14px;font-weight:600}
.chat-row .pv{font-size:12px;color:var(--muted);margin-top:2px}
.chat-row .tm{margin-left:auto;font:10.5px/1 ui-monospace,Consolas,monospace;color:var(--muted);align-self:flex-start}
.feed{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:10px}
.day{align-self:center;font-size:10.5px;color:var(--muted);background:rgba(0,0,0,.05);padding:3px 10px;border-radius:999px}
.msg{max-width:78%;display:flex;flex-direction:column}
.msg .who{font-size:10.5px;color:var(--muted);margin-bottom:3px}
.bubble{
  padding:10px 13px;border-radius:12px;font-size:14px;line-height:1.7;position:relative;
  border:1px solid var(--line);background:var(--card);
}
.msg.me{align-self:flex-end;align-items:flex-end}
.msg.me .bubble{background:#e4eddc;border-color:#c3d4b0}
.msg .st{font-size:10.5px;color:var(--muted);margin-top:3px;font-family:ui-monospace,Consolas,monospace}
.msg.fail .bubble{border-color:var(--danger);background:#fbeae5}
.msg .st.fail-st{color:var(--danger);font-weight:700}
.retry{
  margin-left:6px;border:1px solid var(--danger);background:none;color:var(--danger);border-radius:999px;
  font:inherit;font-size:10.5px;padding:2px 10px;cursor:pointer;font-weight:700;
}
.retry:hover{background:var(--danger);color:#fff}
.composer{
  flex:0 0 auto;display:flex;gap:9px;padding:12px 14px;background:var(--card);border-top:1px solid var(--line);
}
.composer input{
  flex:1;height:42px;border:1px solid var(--line);border-radius:999px;padding:0 16px;font:inherit;
  font-size:14px;color:var(--ink);background:var(--paper);min-width:0;
}
.composer input:focus{outline:none;border-color:var(--tele)}
.send{
  width:74px;border:0;border-radius:999px;background:var(--tele);color:#fff;font:inherit;font-weight:700;
  font-size:13.5px;letter-spacing:.1em;cursor:pointer;transition:background .14s ease;
}
.send:hover:not(:disabled){background:var(--tele-deep)}
.send:disabled{opacity:.4;cursor:not-allowed}
.net-banner{
  display:none;background:#fdf3d8;color:#8a6410;font-size:11.5px;padding:7px 14px;letter-spacing:.06em;
  border-bottom:1px solid #ecd9ac;
}
.net-banner.show{display:block}
@media(max-width:520px){
  body{padding:0}
  .device-label{display:none}
  .phone{width:100%;height:100vh;border:0;border-radius:0}
}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<div class="stage">
  <p class="device-label">信 鸽 CARRIER</p>
  <div class="phone">
    <div class="screen">
      <section class="view on" id="v-list">
        <div class="topbar"><h1>信鸽 · 队讯</h1><span class="sig" id="sig1"><span class="bars"><i></i><i></i><i></i><i></i></span>4G</span></div>
        <div class="list" id="list">
          <button class="chat-row" type="button" data-c="eagle">
            <span class="av" style="background:#2e6b52">鹰</span>
            <span><span class="nm">山鹰小队 · 8 人</span><p class="pv">老巡：明早集合时间不变</p></span>
            <span class="tm">21:14</span>
          </button>
          <button class="chat-row" type="button" data-c="base">
            <span class="av" style="background:#8a6a3a">营</span>
            <span><span class="nm">大本营后勤</span><p class="pv">后勤：气罐已放到三号帐</p></span>
            <span class="tm">20:47</span>
          </button>
          <button class="chat-row" type="button" data-c="met">
            <span class="av" style="background:#4a6fa5">云</span>
            <span><span class="nm">天气观察哨</span><p class="pv">云哨：后半夜阵风六级</p></span>
            <span class="tm">19:32</span>
          </button>
        </div>
      </section>
      <section class="view" id="v-chat">
        <div class="topbar">
          <button class="bk" id="back" type="button">←</button>
          <h1 id="chat-name">山鹰小队</h1>
          <span class="sig" id="sig2"><span class="bars"><i></i><i></i><i></i><i></i></span>4G</span>
          <button class="weak-toggle" id="weak" type="button" role="switch" aria-checked="false"><span>弱网模拟</span><span class="sw" aria-hidden="true"></span></button>
        </div>
        <div class="net-banner" id="net-banner">弱网模拟已开：下一条消息将发送失败，可点消息旁「重试」恢复。</div>
        <div class="feed" id="feed">
          <span class="day">今天 21:00</span>
          <div class="msg"><span class="who">老巡</span><div class="bubble">明早 5:30 老地方集合，头灯都检查一遍。</div></div>
          <div class="msg"><span class="who">江雾</span><div class="bubble">收到。我顺路带两壶热水。</div></div>
          <div class="msg me"><div class="bubble">我带备用电池和地图。</div><span class="st">已送达 21:12</span></div>
        </div>
        <div class="composer">
          <input id="draft" type="text" placeholder="给山鹰小队捎句话……" aria-label="消息输入">
          <button class="send" id="send" type="button">捎出</button>
        </div>
      </section>
    </div>
  </div>
</div>
<script>
(function(){
  var vList=document.getElementById('v-list');
  var vChat=document.getElementById('v-chat');
  var feed=document.getElementById('feed');
  var draft=document.getElementById('draft');
  var send=document.getElementById('send');
  var weak=document.getElementById('weak');
  var banner=document.getElementById('net-banner');
  var sig1=document.getElementById('sig1');
  var sig2=document.getElementById('sig2');
  var weakOn=false;
  var chatRows=document.querySelectorAll('.chat-row');
  for(var i=0;i<chatRows.length;i++){
    (function(row){
      row.addEventListener('click',function(){
        document.getElementById('chat-name').textContent=row.querySelector('.nm').textContent;
        vList.classList.remove('on');
        vChat.classList.add('on');
      });
    })(chatRows[i]);
  }
  document.getElementById('back').addEventListener('click',function(){
    vChat.classList.remove('on');
    vList.classList.add('on');
  });
  weak.addEventListener('click',function(){
    weakOn=!weakOn;
    weak.setAttribute('aria-checked',String(weakOn));
    if(weakOn){banner.classList.add('show');sig1.classList.add('weak');sig2.classList.add('weak')}
    else{banner.classList.remove('show');sig1.classList.remove('weak');sig2.classList.remove('weak')}
  });
  function scrollDown(){feed.scrollTop=feed.scrollHeight}
  function attachRetry(btn,msgEl,stEl){
    btn.addEventListener('click',function(){
      stEl.textContent='重发中…';
      stEl.className='st';
      setTimeout(function(){
        if(weakOn){
          stEl.textContent='未送达 · 仍处弱网 ';
          stEl.className='st fail-st';
          stEl.appendChild(btn);
        }else{
          msgEl.classList.remove('fail');
          stEl.textContent='已送达（重发） '+now();
          stEl.className='st';
        }
      },700);
    });
  }
  function now(){
    var d=new Date();
    return (d.getHours()<10?'0':'')+d.getHours()+':'+(d.getMinutes()<10?'0':'')+d.getMinutes();
  }
  function sendMsg(){
    var text=draft.value.replace(/^\s+|\s+$/g,'');
    if(!text)return;
    draft.value='';
    var msgEl=document.createElement('div');
    msgEl.className='msg me';
    var bubble=document.createElement('div');
    bubble.className='bubble';
    bubble.textContent=text;
    var st=document.createElement('span');
    st.className='st';
    st.textContent='捎出中…';
    msgEl.appendChild(bubble);
    msgEl.appendChild(st);
    feed.appendChild(msgEl);
    scrollDown();
    setTimeout(function(){
      if(weakOn){
        msgEl.classList.add('fail');
        st.textContent='未送达 · 弱网 ';
        st.className='st fail-st';
        var btn=document.createElement('button');
        btn.className='retry';
        btn.type='button';
        btn.textContent='重试';
        st.appendChild(btn);
        attachRetry(btn,msgEl,st);
      }else{
        st.textContent='已送达 '+now();
      }
      scrollDown();
    },800);
  }
  send.addEventListener('click',sendMsg);
  draft.addEventListener('keydown',function(ev){if(ev.key==='Enter')sendMsg()});
})();
</script>
</body>
</html>
