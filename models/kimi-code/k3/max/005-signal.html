<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>烽火台 · 找回密码</title>
<style>
:root{
  --bg:#1d2733;
  --panel:#26313f;
  --panel-2:#2e3a4a;
  --signal:#f08c2e;
  --signal-deep:#d1700f;
  --ink:#e4e9ef;
  --muted:#8a97a5;
  --line:#3a4756;
  --ok:#4fc08d;
  --radius-ctl:6px;
  --radius-box:8px;
  --sp:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font:14px/1.6 "PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;
}
.topbar{
  height:50px;flex:0 0 50px;display:flex;align-items:center;justify-content:space-between;
  padding:0 22px;border-bottom:1px solid var(--line);background:var(--panel);
}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.16em}
.status{display:flex;align-items:center;gap:8px;font:12px/1 ui-monospace,Consolas,monospace;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.35}}
.main{flex:1;display:flex;align-items:center;justify-content:center;padding:36px 20px}
.card{width:min(404px,100%);background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-box)}
.card-head{
  padding:12px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;
  font:11px/1 ui-monospace,Consolas,monospace;letter-spacing:.18em;color:var(--muted);
}
.card-head b{color:var(--signal);font-weight:600}
.card-body{padding:24px 22px 22px}
h1{font-size:18px;letter-spacing:.06em;margin-bottom:8px}
.lead{color:var(--muted);font-size:13px;margin-bottom:22px}
.field label{display:block;font:11px/1 ui-monospace,Consolas,monospace;letter-spacing:.16em;color:var(--muted);margin-bottom:8px}
.field input{
  width:100%;height:44px;padding:0 13px;font:14px/1.5 ui-monospace,Consolas,monospace;color:var(--ink);
  background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius-ctl);
  transition:border-color .15s ease,box-shadow .15s ease;
}
.field input::placeholder{color:#5b6875}
.field input:hover{border-color:#4a5a6d}
.field input:focus{outline:none;border-color:var(--signal);box-shadow:0 0 0 3px rgba(240,140,46,.16)}
.err{display:none;color:#e0785f;font-size:12.5px;margin-top:8px}
.err.show{display:block}
.submit{
  width:100%;height:46px;margin-top:20px;border:0;border-radius:var(--radius-ctl);cursor:pointer;
  background:var(--signal);color:#241703;font:inherit;font-weight:700;letter-spacing:.22em;padding-left:.22em;
  transition:background .15s ease,transform .1s ease;
}
.submit:hover:not(:disabled){background:var(--signal-deep);color:#fff}
.submit:active:not(:disabled){transform:translateY(1px)}
.submit:disabled{opacity:.5;cursor:not-allowed}
.submit:focus-visible{outline:3px solid rgba(240,140,46,.4);outline-offset:2px}
.backline{display:block;text-align:center;margin-top:16px;color:var(--muted);font-size:13px;text-decoration:none}
.backline:hover{color:var(--signal)}
.wait{display:none;text-align:center}
.wait.show{display:block}
.radar{width:84px;height:84px;margin:2px auto 16px;position:relative}
.radar svg{display:block}
.count{font:700 40px/1 ui-monospace,Consolas,monospace;color:var(--signal);margin:6px 0 4px}
.wait p{color:var(--muted);font-size:13px}
.wait .who{color:var(--ink);font-family:ui-monospace,Consolas,monospace}
.resend{
  margin-top:18px;width:100%;height:42px;border:1px solid var(--line);border-radius:var(--radius-ctl);
  background:var(--panel-2);color:var(--ink);font:inherit;font-size:13px;cursor:pointer;letter-spacing:.1em;
  transition:border-color .15s ease;
}
.resend:hover:not(:disabled){border-color:var(--signal);color:var(--signal)}
.resend:disabled{color:var(--muted);cursor:not-allowed}
.foot{padding:14px;text-align:center;color:#5b6875;font:11px/1 ui-monospace,Consolas,monospace;letter-spacing:.2em}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <svg width="22" height="22" viewBox="0 0 22 22" fill="none" aria-hidden="true">
      <path d="M11 3L18 17H4L11 3Z" stroke="#f08c2e" stroke-width="1.8" stroke-linejoin="round"/>
      <circle cx="11" cy="13" r="2.2" fill="#f08c2e"/>
    </svg>
    烽火台
  </div>
  <div class="status"><span class="dot" aria-hidden="true"></span>全部探针正常 · 延迟 26ms</div>
</header>
<main class="main">
  <div class="card">
    <div class="card-head"><span>ACCOUNT / RECOVERY</span><b>单号 RC-2093</b></div>
    <div class="card-body">
      <form id="reset-form" novalidate>
        <h1>重置控制台口令</h1>
        <p class="lead">输入值班邮箱或手机号，系统会发出一条限时重置指令。</p>
        <div class="field">
          <label for="contact">CONTACT / 联系方式</label>
          <input id="contact" type="text" autocomplete="username" placeholder="oncall@fenghuo.ops 或 138 0000 0000">
          <p class="err" id="err">没有查到这条联系方式对应的账号，检查后再试。</p>
        </div>
        <button class="submit" id="submit" type="submit">发出重置指令</button>
        <a class="backline" href="#login" id="back-login">想起口令了？返回登录</a>
      </form>
      <div class="wait" id="wait-view">
        <div class="radar" aria-hidden="true">
          <svg width="84" height="84" viewBox="0 0 84 84" fill="none">
            <circle cx="42" cy="42" r="38" stroke="#3a4756" stroke-width="1.6"/>
            <circle cx="42" cy="42" r="26" stroke="#3a4756" stroke-width="1.2"/>
            <circle cx="42" cy="42" r="14" stroke="#3a4756" stroke-width="1.2"/>
            <path d="M42 42L66 20" stroke="#f08c2e" stroke-width="2" stroke-linecap="round"/>
            <circle cx="66" cy="20" r="3.4" fill="#f08c2e"/>
          </svg>
        </div>
        <h1>指令已发出</h1>
        <div class="count" id="count">60</div>
        <p>重置链接已送往 <span class="who" id="who"></span>，<br>十分钟内有效。没收到可先查垃圾邮件。</p>
        <button class="resend" id="resend" type="button" disabled>重新发出（60 秒后可用）</button>
        <a class="backline" href="#login" id="back-login-2">返回登录</a>
      </div>
    </div>
  </div>
</main>
<p class="foot">FENGHUO OPS · 7 × 24 值班系统</p>
<script>
(function(){
  var form=document.getElementById('reset-form');
  var contact=document.getElementById('contact');
  var err=document.getElementById('err');
  var wait=document.getElementById('wait-view');
  var who=document.getElementById('who');
  var count=document.getElementById('count');
  var resend=document.getElementById('resend');
  var timer=null;
  function mask(v){
    if(v.indexOf('@')>-1){var p=v.split('@');return p[0].slice(0,2)+'***@'+p[1]}
    return v.slice(0,3)+' **** '+v.slice(-4);
  }
  function startCountdown(){
    var left=60;
    resend.disabled=true;
    count.textContent=left;
    resend.textContent='重新发出（'+left+' 秒后可用）';
    timer=setInterval(function(){
      left-=1;
      count.textContent=left;
      if(left<=0){clearInterval(timer);resend.disabled=false;resend.textContent='重新发出重置指令';return}
      resend.textContent='重新发出（'+left+' 秒后可用）';
    },1000);
  }
  form.addEventListener('submit',function(ev){
    ev.preventDefault();
    var v=contact.value.trim();
    var ok=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)||/^1\d{10}$/.test(v.replace(/\s/g,''));
    if(!ok){err.classList.add('show');contact.focus();return}
    err.classList.remove('show');
    who.textContent=mask(v);
    form.style.display='none';
    wait.classList.add('show');
    startCountdown();
  });
  resend.addEventListener('click',function(){startCountdown()});
  document.getElementById('back-login').addEventListener('click',function(ev){ev.preventDefault()});
  document.getElementById('back-login-2').addEventListener('click',function(ev){ev.preventDefault()});
})();
</script>
</body>
</html>
