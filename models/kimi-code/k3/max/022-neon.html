<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>宋霓 NEON SONG · 主页</title>
<style>
:root{
  --bg:#150f1e;
  --panel:#1f1629;
  --neon:#e86fc9;
  --neon-2:#8e6df0;
  --ink:#efeaf6;
  --muted:#9a8fb0;
  --line:#2f2440;
  --radius-card:16px;
  --radius-ctl:999px;
  --sp:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font:15px/1.7 "PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:var(--bg);color:var(--ink);min-height:100vh;
}
.hero{
  position:relative;padding:64px 32px 40px;overflow:hidden;
  background:radial-gradient(900px 380px at 18% -10%,rgba(232,111,201,.28),transparent 60%),
             radial-gradient(700px 340px at 85% 0%,rgba(142,109,240,.26),transparent 60%);
}
.hero-inner{max-width:1020px;margin:0 auto;display:flex;gap:30px;align-items:center;position:relative}
.avatar{
  flex:0 0 124px;height:124px;border-radius:50%;padding:4px;
  background:linear-gradient(135deg,var(--neon),var(--neon-2));
}
.avatar .in{
  width:100%;height:100%;border-radius:50%;background:var(--bg);display:grid;place-items:center;
  font:700 40px/1 "Songti SC","STSong","SimSun",serif;color:var(--neon);
}
.who h1{font-size:34px;letter-spacing:.08em}
.who .en{color:var(--neon);font-size:13px;letter-spacing:.4em;margin-top:2px}
.who .line{color:var(--muted);margin-top:12px;font-size:14.5px}
.who .stats{display:flex;gap:26px;margin-top:16px;font-size:12.5px;color:var(--muted)}
.who .stats b{color:var(--ink);font-family:ui-monospace,Consolas,monospace;font-size:16px;margin-right:5px}
.acts{margin-left:auto;display:flex;flex-direction:column;gap:10px;align-items:stretch}
.follow{
  border:0;border-radius:var(--radius-ctl);cursor:pointer;padding:12px 34px;
  background:linear-gradient(90deg,var(--neon),var(--neon-2));color:#fff;
  font:inherit;font-weight:700;font-size:14.5px;letter-spacing:.14em;
  box-shadow:0 8px 26px rgba(232,111,201,.4);transition:all .18s ease;
}
.follow:hover{transform:translateY(-1px)}
.follow.on{background:var(--panel);border:1px solid var(--neon);box-shadow:none;color:var(--neon)}
.contact{
  border:1px solid var(--line);background:none;border-radius:var(--radius-ctl);cursor:pointer;
  padding:10px 34px;color:var(--ink);font:inherit;font-size:13px;letter-spacing:.1em;transition:all .15s ease;
}
.contact:hover{border-color:var(--neon);color:var(--neon)}
.wrap{max-width:1020px;margin:0 auto;padding:26px 32px 60px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px}
.sec-head h2{font-size:17px;letter-spacing:.14em}
.sec-head span{color:var(--muted);font-size:12px}
.works{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.work{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-card);overflow:hidden;
  cursor:pointer;transition:transform .15s ease,border-color .15s ease;text-align:left;font:inherit;color:inherit;padding:0;
}
.work:hover{transform:translateY(-3px);border-color:var(--neon)}
.work.sel{border-color:var(--neon);box-shadow:0 0 0 1px var(--neon),0 12px 30px rgba(232,111,201,.22)}
.cover{height:120px;display:grid;place-items:center;position:relative}
.cover span{font:700 30px/1 "Songti SC","STSong","SimSun",serif;color:rgba(255,255,255,.9);text-shadow:0 2px 14px rgba(0,0,0,.4)}
.c1{background:linear-gradient(135deg,#e86fc9,#5b2a86)}
.c2{background:linear-gradient(135deg,#8e6df0,#1f2d6b)}
.c3{background:linear-gradient(135deg,#f06a8a,#7a2050)}
.c4{background:linear-gradient(135deg,#6fd1e8,#1e4a66)}
.c5{background:linear-gradient(135deg,#f0a86f,#8a3a1e)}
.c6{background:linear-gradient(135deg,#b06ee8,#3a1e66)}
.work .wi{padding:12px 14px}
.work h3{font-size:14px}
.work .tp{font-size:11.5px;color:var(--muted);margin-top:2px}
.spin{
  display:none;margin-top:18px;background:var(--panel);border:1px solid var(--neon);border-radius:var(--radius-card);
  padding:18px 22px;
}
.spin.show{display:block}
.spin .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.spin h3{font-size:15px}
.spin .live{font:11px/1 ui-monospace,Consolas,monospace;color:var(--neon);letter-spacing:.2em}
.spin ol{list-style:none}
.spin li{
  display:flex;justify-content:space-between;padding:8px 2px;font-size:13.5px;border-bottom:1px dashed var(--line);
}
.spin li:last-child{border-bottom:0}
.spin .dur{font-family:ui-monospace,Consolas,monospace;color:var(--muted);font-size:12px}
.feed{margin-top:34px}
.post{display:flex;gap:14px;padding:14px 4px;border-bottom:1px solid var(--line);font-size:13.5px}
.post .dot{flex:0 0 9px;height:9px;border-radius:50%;background:var(--neon);margin-top:7px}
.post .when{flex:0 0 86px;color:var(--muted);font-size:12px;font-family:ui-monospace,Consolas,monospace;margin-top:2px}
.post p{color:var(--ink)}
.post p small{display:block;color:var(--muted);margin-top:3px;font-size:12px}
@media(max-width:860px){
  .hero-inner{flex-direction:column;text-align:center}
  .acts{margin-left:0;flex-direction:row}
  .who .stats{justify-content:center}
  .works{grid-template-columns:1fr 1fr}
}
@media(max-width:560px){.works{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<header class="hero">
  <div class="hero-inner">
    <div class="avatar"><div class="in">霓</div></div>
    <div class="who">
      <h1>宋霓</h1>
      <p class="en">NEON SONG</p>
      <p class="line">在城市的电流里写歌的人 · 合成器 / 人声 / 独立制作</p>
      <div class="stats">
        <span><b>24</b>首作品</span>
        <span><b>131</b>场演出</span>
        <span><b id="fans">86,214</b>位听众</span>
      </div>
    </div>
    <div class="acts">
      <button class="follow" id="follow" type="button" aria-pressed="false">＋ 关注</button>
      <button class="contact" id="contact" type="button">演出邀约</button>
    </div>
  </div>
</header>
<main class="wrap">
  <div class="sec-head"><h2>作 品</h2><span>点一张唱片看曲目</span></div>
  <div class="works" id="works">
    <button class="work" type="button" data-i="0">
      <div class="cover c1"><span>雨站</span></div>
      <div class="wi"><h3>雨站 Rain Stop</h3><p class="tp">专辑 · 2025 · 9 首</p></div>
    </button>
    <button class="work" type="button" data-i="1">
      <div class="cover c2"><span>夜班机</span></div>
      <div class="wi"><h3>夜班机 Night Shift</h3><p class="tp">EP · 2024 · 5 首</p></div>
    </button>
    <button class="work" type="button" data-i="2">
      <div class="cover c3"><span>霓虹河口</span></div>
      <div class="wi"><h3>霓虹河口 Neon Delta</h3><p class="tp">单曲 · 2024 · 1 首</p></div>
    </button>
    <button class="work" type="button" data-i="3">
      <div class="cover c4"><span>冷敷</span></div>
      <div class="wi"><h3>冷敷 Cold Compress</h3><p class="tp">专辑 · 2023 · 10 首</p></div>
    </button>
    <button class="work" type="button" data-i="4">
      <div class="cover c5"><span>橙线</span></div>
      <div class="wi"><h3>橙线 Orange Line</h3><p class="tp">EP · 2022 · 4 首</p></div>
    </button>
    <button class="work" type="button" data-i="5">
      <div class="cover c6"><span>低频信箱</span></div>
      <div class="wi"><h3>低频信箱 Lo-Fi Mailbox</h3><p class="tp">合集 · 2021 · 12 首</p></div>
    </button>
  </div>
  <div class="spin" id="spin">
    <div class="top"><h3 id="spin-title"></h3><span class="live">TRACKLIST</span></div>
    <ol id="tracks"></ol>
  </div>
  <section class="feed">
    <div class="sec-head"><h2>动 态</h2><span>最近三周</span></div>
    <div class="post"><span class="dot"></span><span class="when">08-12</span><p>巡演杭州站开票，9 月 6 日 MAO Livehouse。<small>票价 180 / 260，学生票 120</small></p></div>
    <div class="post"><span class="dot"></span><span class="when">08-05</span><p>《雨站》黑胶二压到货，这次换了透明紫胶。<small>限量 500 张，编号随机</small></p></div>
    <div class="post"><span class="dot"></span><span class="when">07-28</span><p>在棚里给新专辑录最后一轨和声，快了。<small>新专辑预计十月</small></p></div>
  </section>
</main>
<script>
(function(){
  var albums=[
    {name:'雨站 Rain Stop',tracks:[['雨站','4:12'],['末班环线','3:48'],['玻璃伞','5:01'],['积水的站牌','3:36'],['夜行雨衣','4:40'],['候车室','2:58'],['逆光检票口','4:15'],['伞骨','3:52'],['晴转雨','6:02']]},
    {name:'夜班机 Night Shift',tracks:[['打卡声','1:58'],['夜班机','4:33'],['传送带','3:47'],['四点钟的灯','5:12'],['交接','3:29']]},
    {name:'霓虹河口 Neon Delta',tracks:[['霓虹河口','5:44']]},
    {name:'冷敷 Cold Compress',tracks:[['冷敷','4:02'],['退烧','3:51'],['白噪音点滴','6:20'],['37.2','4:18'],['冰袋','3:33'],['走廊','5:07'],['探病时间','4:44'],['体温计','3:26'],['出院小结','4:58'],['后遗症','5:35']]},
    {name:'橙线 Orange Line',tracks:[['橙线','4:21'],['换乘','3:38'],['终点站在修','4:55'],['末班之后','6:11']]},
    {name:'低频信箱 Lo-Fi Mailbox',tracks:[['拆信','2:44'],['低频信箱','4:09'],['邮票边角','3:17'],['回执','3:58'],['慢递','4:36'],['涂改液','3:05'],['邮编','4:47'],['挂号','3:40'],['退件','5:02'],['钢笔水','3:29'],['邮路','4:51'],['信箱底','6:18']]}
  ];
  var spin=document.getElementById('spin');
  var spinTitle=document.getElementById('spin-title');
  var tracks=document.getElementById('tracks');
  var sel=-1;
  var works=document.querySelectorAll('.work');
  for(var i=0;i<works.length;i++){
    (function(card){
      card.addEventListener('click',function(){
        var idx=Number(card.getAttribute('data-i'));
        if(sel===idx){
          sel=-1;
          spin.classList.remove('show');
          card.classList.remove('sel');
          return;
        }
        sel=idx;
        for(var j=0;j<works.length;j++)works[j].classList.remove('sel');
        card.classList.add('sel');
        var album=albums[idx];
        spinTitle.textContent=album.name;
        var html='';
        for(var k=0;k<album.tracks.length;k++){
          html+='<li><span>'+(k+1)+'. '+album.tracks[k][0]+'</span><span class="dur">'+album.tracks[k][1]+'</span></li>';
        }
        tracks.innerHTML=html;
        spin.classList.add('show');
      });
    })(works[i]);
  }
  var follow=document.getElementById('follow');
  var fans=document.getElementById('fans');
  follow.addEventListener('click',function(){
    var on=follow.classList.contains('on');
    if(on){
      follow.classList.remove('on');
      follow.textContent='＋ 关注';
      follow.setAttribute('aria-pressed','false');
      fans.textContent='86,214';
    }else{
      follow.classList.add('on');
      follow.textContent='已关注';
      follow.setAttribute('aria-pressed','true');
      fans.textContent='86,215';
    }
  });
  document.getElementById('contact').addEventListener('click',function(){
    var c=document.getElementById('contact');
    c.textContent='经纪邮箱已复制：booking@songni.cn';
  });
})();
</script>
</body>
</html>
