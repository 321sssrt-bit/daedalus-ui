<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>空山 · 搜索</title>
<style>
:root{
  --mist:#e8e6ee;
  --mist-2:#dcd8e6;
  --ink:#3c3a4a;
  --muted:#8b8799;
  --accent:#6e6390;
  --accent-deep:#554b75;
  --card:#f4f2f8;
  --line:#d2cde0;
  --radius-ctl:999px;
  --radius-card:16px;
  --sp:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font:15px/1.7 "PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:var(--mist);color:var(--ink);min-height:100vh;position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center;padding:40px 24px;
}
.fog{position:absolute;border-radius:50%;filter:blur(60px);opacity:.6;pointer-events:none}
.fog.a{width:420px;height:420px;left:-100px;top:8%;background:#d8d3e6;animation:drift 26s ease-in-out infinite alternate}
.fog.b{width:360px;height:360px;right:-80px;bottom:10%;background:#e3dfd0;animation:drift 32s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate(60px,30px)}}
.stage{position:relative;z-index:1;width:min(560px,100%);text-align:center}
.brand{font-size:12px;letter-spacing:.5em;padding-left:.5em;color:var(--muted);margin-bottom:30px}
.search{
  display:flex;background:var(--card);border:1px solid var(--line);border-radius:var(--radius-ctl);
  padding:5px 5px 5px 20px;box-shadow:0 12px 34px rgba(85,75,117,.12);margin-bottom:34px;
}
.search input{
  flex:1;border:0;background:none;font:inherit;font-size:15px;color:var(--ink);min-width:0;
}
.search input:focus{outline:none}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(110,99,144,.16)}
.search button{
  border:0;border-radius:999px;cursor:pointer;padding:10px 24px;background:var(--accent);color:#fff;
  font:inherit;font-size:13.5px;font-weight:700;letter-spacing:.12em;transition:background .15s ease;
}
.search button:hover{background:var(--accent-deep)}
.empty h1{font:700 24px/1.5 "Songti SC","STSong","SimSun",serif;letter-spacing:.06em;margin-bottom:10px}
.empty .term{color:var(--accent-deep);border-bottom:1px solid var(--accent);padding-bottom:1px}
.empty p{color:var(--muted);font-size:14px;margin-bottom:26px}
.suggest{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.chip{
  border:1px solid var(--line);background:rgba(244,242,248,.7);border-radius:999px;cursor:pointer;
  padding:9px 18px;font:inherit;font-size:13px;color:var(--ink);transition:all .15s ease;
}
.chip:hover{border-color:var(--accent);color:var(--accent-deep);background:var(--card)}
.chip:focus-visible{outline:3px solid rgba(110,99,144,.3)}
.results{display:none;text-align:left;margin-top:8px}
.results.show{display:block}
.hit{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius-card);
  padding:15px 18px;margin-bottom:10px;cursor:pointer;transition:border-color .14s ease;
}
.hit:hover{border-color:var(--accent)}
.hit h2{font-size:15px;margin-bottom:4px}
.hit p{font-size:12.5px;color:var(--muted)}
.hit .mark{color:var(--accent-deep);font-weight:700}
.note{font-size:12px;color:var(--muted);margin-bottom:14px;letter-spacing:.08em}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<div class="fog a" aria-hidden="true"></div>
<div class="fog b" aria-hidden="true"></div>
<main class="stage">
  <p class="brand">空 山 文 档 库</p>
  <form class="search" id="form">
    <input id="q" type="text" value="夜航西飞 手稿" aria-label="搜索词">
    <button type="submit">入山找</button>
  </form>
  <div class="empty" id="empty">
    <h1>山里雾大，没有找到「<span class="term" id="term">夜航西飞 手稿</span>」</h1>
    <p>馆藏 12,406 份文档里，没有一份同时装下这些字。换几个词，或者把词拆散些。</p>
    <div class="suggest">
      <button class="chip" type="button" data-q="夜航">只找「夜航」</button>
      <button class="chip" type="button" data-q="手稿 誊抄">试试「手稿 誊抄」</button>
      <button class="chip" type="button" data-q="">散开雾，看看全部馆藏</button>
    </div>
  </div>
  <div class="results" id="results">
    <p class="note" id="note"></p>
    <div id="hits"></div>
  </div>
</main>
<script>
(function(){
  var q=document.getElementById('q');
  var term=document.getElementById('term');
  var empty=document.getElementById('empty');
  var results=document.getElementById('results');
  var note=document.getElementById('note');
  var hits=document.getElementById('hits');
  var library=[
    {t:'《夜航》飞行随笔 · 全三卷',d:'散文 / 1942 年首版影印 · 入库编号 KS-0412'},
    {t:'夜航西飞（中译本）',d:'柏瑞尔·马卡姆 / 译本序含手稿照片两帧 · KS-1098'}
  ];
  function showEmpty(word){
    results.classList.remove('show');
    empty.style.display='block';
    term.textContent=word;
  }
  function showResults(word){
    empty.style.display='none';
    note.textContent='雾散了些：「'+word+'」找到 2 份馆藏';
    hits.innerHTML='';
    library.forEach(function(item){
      var el=document.createElement('div');
      el.className='hit';
      el.innerHTML='<h2>'+item.t.replace('夜航','<span class="mark">夜航</span>')+'</h2><p>'+item.d+'</p>';
      hits.appendChild(el);
    });
    results.classList.add('show');
  }
  function search(word){
    var w=word.trim();
    if(w===''){showResults('全部馆藏');note.textContent='全部 12,406 份馆藏按入库时间排列（此处展示 2 份示例）';return}
    if(w==='夜航'){showResults(w);return}
    showEmpty(w);
  }
  document.getElementById('form').addEventListener('submit',function(ev){
    ev.preventDefault();
    search(q.value);
  });
  document.querySelectorAll('.chip').forEach(function(c){
    c.addEventListener('click',function(){
      var w=c.getAttribute('data-q');
      q.value=w;
      search(w);
    });
  });
})();
</script>
</body>
</html>
