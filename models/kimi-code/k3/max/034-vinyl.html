<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>唱盘 · 正在播放</title>
<style>
:root{
  --brown:#241a12;
  --brown-2:#2f2318;
  --cream:#f3e8d3;
  --amber:#d9a45b;
  --muted:#a08d72;
  --line:#3d2f22;
  --frame:#10151f;
  --sp:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font:15px/1.6 "PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:#262b34;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
}
.stage{text-align:center}
.device-label{color:#8b93a1;font-size:12px;letter-spacing:.2em;margin-bottom:14px}
.phone{
  width:390px;height:min(844px,calc(100vh - 90px));border-radius:38px;border:11px solid var(--frame);
  background:var(--brown);overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5);
}
.screen{height:100%;display:flex;flex-direction:column;padding:20px 24px 18px;color:var(--cream)}
.top{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);letter-spacing:.16em}
.disc-zone{flex:1;display:grid;place-items:center;padding:20px 0}
.disc{
  width:272px;height:272px;border-radius:50%;position:relative;
  background:repeating-radial-gradient(circle at center,#1a120c 0 2px,#241a12 2px 4px);
  box-shadow:0 18px 44px rgba(0,0,0,.55),inset 0 0 0 1px #000;
}
.disc .label{
  position:absolute;inset:88px;border-radius:50%;background:var(--amber);
  display:grid;place-items:center;text-align:center;
}
.disc .label span{font:700 13px/1.5 "Songti SC","STSong","SimSun",serif;color:#4a2f12;letter-spacing:.1em}
.disc .hole{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--brown);border:2px solid var(--cream)}
.disc.spin{animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.title-zone{text-align:center;margin-bottom:16px}
.title-zone h1{font:700 22px/1.4 "Songti SC","STSong","SimSun",serif;letter-spacing:.1em}
.title-zone p{color:var(--muted);font-size:12.5px;margin-top:4px;letter-spacing:.12em}
.prog-zone{margin-bottom:18px}
.prog{height:5px;border-radius:3px;background:var(--line);position:relative;cursor:pointer}
.prog i{position:absolute;left:0;top:0;bottom:0;width:32%;background:var(--amber);border-radius:3px}
.times{display:flex;justify-content:space-between;font:11px/1 ui-monospace,Consolas,monospace;color:var(--muted);margin-top:8px}
.controls{display:flex;align-items:center;justify-content:center;gap:34px;padding-bottom:14px}
.ctl{
  border:0;background:none;color:var(--cream);cursor:pointer;display:grid;place-items:center;
  width:52px;height:52px;border-radius:50%;transition:background .14s ease;
}
.ctl:hover{background:var(--brown-2)}
.ctl.play{width:68px;height:68px;background:var(--amber);color:#241a12}
.ctl.play:hover{background:#e5b76f}
.ctl:focus-visible{outline:3px solid rgba(217,164,91,.45)}
@media(max-width:520px){
  body{padding:0}
  .device-label{display:none}
  .phone{width:100%;height:100vh;border:0;border-radius:0}
}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  .disc.spin{animation:none!important}
}
</style>
</head>
<body>
<div class="stage">
  <p class="device-label">唱 盘 VINYL</p>
  <div class="phone">
    <div class="screen">
      <div class="top"><span>正在播放</span><span>A 面 · 33⅓ 转</span></div>
      <div class="disc-zone">
        <div class="disc spin" id="disc">
          <div class="label"><span id="disc-label">城南<br>夜话</span></div>
          <div class="hole" aria-hidden="true"></div>
        </div>
      </div>
      <div class="title-zone">
        <h1 id="t-name">城南夜话</h1>
        <p id="t-art">宋霓 · 雨站</p>
      </div>
      <div class="prog-zone">
        <div class="prog" id="prog"><i id="bar"></i></div>
        <div class="times"><span id="cur">1:21</span><span id="dur">4:12</span></div>
      </div>
      <div class="controls">
        <button class="ctl" id="prev" type="button" aria-label="上一首">
          <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M6 5V17M16 5L8 11L16 17V5Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="ctl play" id="play" type="button" aria-label="播放或暂停">
          <svg id="ic-pause" width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M8 5V19M16 5V19" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
          <svg id="ic-play" width="24" height="24" viewBox="0 0 24 24" fill="none" style="display:none"><path d="M8 5L19 12L8 19V5Z" fill="currentColor"/></svg>
        </button>
        <button class="ctl" id="next" type="button" aria-label="下一首">
          <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M16 5V17M6 5L14 11L6 17V5Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
  </div>
</div>
<script>
(function(){
  var tracks=[
    {name:'城南夜话',art:'宋霓 · 雨站',dur:252,label:'城南<br>夜话'},
    {name:'末班环线',art:'宋霓 · 雨站',dur:228,label:'末班<br>环线'},
    {name:'霓虹河口',art:'宋霓 · 霓虹河口',dur:344,label:'霓虹<br>河口'}
  ];
  var idx=0,pos=81,playing=true,timer=null;
  var disc=document.getElementById('disc');
  var tName=document.getElementById('t-name');
  var tArt=document.getElementById('t-art');
  var discLabel=document.getElementById('disc-label');
  var cur=document.getElementById('cur');
  var dur=document.getElementById('dur');
  var bar=document.getElementById('bar');
  var icPlay=document.getElementById('ic-play');
  var icPause=document.getElementById('ic-pause');
  function fmt(s){return Math.floor(s/60)+':'+(s%60<10?'0':'')+s%60}
  function render(){
    var t=tracks[idx];
    tName.textContent=t.name;
    tArt.textContent=t.art;
    discLabel.innerHTML=t.label;
    dur.textContent=fmt(t.dur);
    cur.textContent=fmt(pos);
    bar.style.width=(pos/t.dur*100)+'%';
  }
  function setPlaying(p){
    playing=p;
    if(p){disc.classList.add('spin')}else{disc.classList.remove('spin')}
    icPlay.style.display=p?'none':'';
    icPause.style.display=p?'':'none';
  }
  document.getElementById('play').addEventListener('click',function(){setPlaying(!playing)});
  function step(d){
    idx=(idx+d+tracks.length)%tracks.length;
    pos=0;
    render();
  }
  document.getElementById('next').addEventListener('click',function(){step(1)});
  document.getElementById('prev').addEventListener('click',function(){step(-1)});
  document.getElementById('prog').addEventListener('click',function(ev){
    var r=ev.currentTarget.getBoundingClientRect();
    pos=Math.round(tracks[idx].dur*Math.min(Math.max((ev.clientX-r.left)/r.width,0),1));
    render();
  });
  timer=setInterval(function(){
    if(!playing)return;
    pos+=1;
    if(pos>=tracks[idx].dur){step(1);return}
    cur.textContent=fmt(pos);
    bar.style.width=(pos/tracks[idx].dur*100)+'%';
  },1000);
  render();
})();
</script>
</body>
</html>
