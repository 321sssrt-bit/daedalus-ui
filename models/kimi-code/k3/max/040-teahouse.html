<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>茶肆 · 等候叫号</title>
<style>
:root{
  --bamboo:#4a7c59;
  --bamboo-deep:#3a6347;
  --rice:#f5f1e4;
  --card:#fffdf4;
  --ink:#2f3a33;
  --muted:#83918a;
  --line:#dde3d6;
  --amber:#d98e3d;
  --frame:#10151f;
  --sp:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font:15px/1.65 "PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:#262b34;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
}
.stage{text-align:center}
.device-label{color:#8b93a1;font-size:12px;letter-spacing:.2em;margin-bottom:14px}
.phone{
  width:390px;height:min(844px,calc(100vh - 90px));border-radius:38px;border:11px solid var(--frame);
  background:var(--rice);overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5);
}
.screen{height:100%;overflow-y:auto;padding:22px 20px 20px;display:flex;flex-direction:column}
.shop{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.shop .nm{font-size:16px;font-weight:700;letter-spacing:.08em}
.shop .st{font-size:11px;color:var(--muted);letter-spacing:.1em}
.ticket{
  background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;
  margin-bottom:16px;position:relative;
}
.ticket .top{
  background:var(--bamboo);color:#f5f1e4;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;
}
.top .k{font-size:11px;letter-spacing:.22em;opacity:.85}
.top .no{font:700 30px/1 ui-monospace,Consolas,monospace;letter-spacing:.06em}
.tear{
  height:14px;background:radial-gradient(circle at 7px -2px,transparent 7px,var(--card) 7.5px);
  background-size:14px 14px;position:relative;
}
.ticket .mid{padding:16px 18px 14px;text-align:center}
.mid .now{font-size:12.5px;color:var(--muted);letter-spacing:.14em}
.mid .call{font:700 34px/1.2 ui-monospace,Consolas,monospace;color:var(--bamboo-deep);margin:4px 0 8px}
.mid .ahead{font-size:13px;color:var(--ink)}
.mid .ahead b{color:var(--amber);font-family:ui-monospace,Consolas,monospace;font-size:17px}
.eta{
  display:flex;justify-content:center;gap:8px;align-items:baseline;margin-top:10px;
  font-size:12.5px;color:var(--muted);
}
.eta b{font:700 20px/1 ui-monospace,Consolas,monospace;color:var(--ink)}
.steps{display:flex;align-items:flex-start;padding:14px 18px 18px}
.step{flex:1;text-align:center;position:relative;font-size:10.5px;color:var(--muted)}
.step::before{
  content:"";display:block;width:14px;height:14px;border-radius:50%;margin:0 auto 6px;
  background:var(--card);border:2px solid var(--line);position:relative;z-index:1;
}
.step::after{
  content:"";position:absolute;top:7px;left:calc(-50% + 8px);right:calc(50% + 8px);height:2px;background:var(--line);
}
.step:first-child::after{display:none}
.step.on{color:var(--bamboo-deep);font-weight:700}
.step.on::before{background:var(--bamboo);border-color:var(--bamboo)}
.step.now::before{background:var(--amber);border-color:var(--amber);animation:pulse 1.6s infinite}
@keyframes pulse{50%{transform:scale(1.25)}}
.actions{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.refresh{
  width:100%;height:48px;border:0;border-radius:12px;background:var(--bamboo);color:#fff;
  font:inherit;font-weight:700;font-size:14px;letter-spacing:.16em;cursor:pointer;transition:background .14s ease;
}
.refresh:hover:not(:disabled){background:var(--bamboo-deep)}
.refresh:disabled{opacity:.5;cursor:not-allowed}
.row2{display:flex;gap:10px}
.aside-btn,.cancel-btn{
  flex:1;height:44px;border-radius:12px;font:inherit;font-size:13px;cursor:pointer;transition:all .14s ease;
}
.aside-btn{border:1.5px solid var(--bamboo);background:none;color:var(--bamboo-deep);font-weight:600}
.aside-btn:hover{background:#eef3ea}
.aside-btn.on{background:var(--bamboo);color:#fff}
.cancel-btn{border:1.5px solid var(--line);background:none;color:var(--muted)}
.cancel-btn:hover{border-color:#c0483c;color:#c0483c}
.notice{
  display:none;background:#fdf3e0;border:1px solid #ecd9ac;border-radius:12px;padding:12px 15px;
  font-size:12.5px;color:#7a5a1e;margin-bottom:12px;line-height:1.8;
}
.notice.show{display:block}
.banner{
  display:none;text-align:center;padding:18px;border-radius:14px;background:var(--bamboo);color:#fff;margin-bottom:14px;
}
.banner.show{display:block}
.banner h2{font-size:19px;letter-spacing:.2em}
.banner p{font-size:12.5px;opacity:.9;margin-top:5px}
@media(max-width:520px){
  body{padding:0}
  .device-label{display:none}
  .phone{width:100%;height:100vh;border:0;border-radius:0}
}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<div class="stage">
  <p class="device-label">茶 肆 TEAHOUSE</p>
  <div class="phone">
    <div class="screen">
      <div class="shop">
        <span class="nm">知竹茶肆 · 湖滨店</span>
        <span class="st">营业中 · 21:30 打烊</span>
      </div>
      <div class="banner" id="banner">
        <h2>到 你 了</h2>
        <p>A42 号贵客，窗边竹景位已备好，请进门报号。</p>
      </div>
      <div class="ticket" id="ticket">
        <div class="top"><span class="k">取号票 · 两人位</span><span class="no">A42</span></div>
        <div class="tear" aria-hidden="true"></div>
        <div class="mid">
          <p class="now">当前叫到</p>
          <p class="call" id="call">A38</p>
          <p class="ahead">前面还有 <b id="ahead">4</b> 桌</p>
          <p class="eta">预计再等 <b id="eta">12</b> 分钟</p>
        </div>
        <div class="steps" aria-label="排队步骤">
          <div class="step on" id="st1">已取号</div>
          <div class="step now" id="st2">等候中</div>
          <div class="step" id="st3">准备入座</div>
          <div class="step" id="st4">已叫号</div>
        </div>
      </div>
      <div class="notice" id="notice">到号提醒已开：轮到 A42 时会震动并响铃，你可以先去湖边转一圈，别走远就行。</div>
      <div class="actions">
        <button class="refresh" id="refresh" type="button">看看叫到几号了</button>
        <div class="row2">
          <button class="aside-btn" id="aside" type="button">先逛逛，到号叫我</button>
          <button class="cancel-btn" id="cancel" type="button">过号不等了</button>
        </div>
      </div>
      <div class="notice" id="bye" style="background:#f0ece2;border-color:#d8d2c2;color:#6b6558">号已取消。想喝了随时回来重新取号，桂花引子给你留着。</div>
    </div>
  </div>
</div>
<script>
(function(){
  var called=38;
  var call=document.getElementById('call');
  var ahead=document.getElementById('ahead');
  var eta=document.getElementById('eta');
  var refresh=document.getElementById('refresh');
  var banner=document.getElementById('banner');
  var ticket=document.getElementById('ticket');
  var aside=document.getElementById('aside');
  var notice=document.getElementById('notice');
  var bye=document.getElementById('bye');
  var steps=[document.getElementById('st1'),document.getElementById('st2'),document.getElementById('st3'),document.getElementById('st4')];
  function renderSteps(n){
    for(var i=0;i<steps.length;i++){
      steps[i].classList.remove('on','now');
      if(i<n)steps[i].classList.add('on');
      else if(i===n)steps[i].classList.add('now');
    }
    if(n>=3)steps[3].classList.add('on');
  }
  refresh.addEventListener('click',function(){
    if(called>=42)return;
    called+=1;
    call.textContent='A'+called;
    var left=42-called;
    ahead.textContent=left;
    eta.textContent=left*3;
    if(left===1){renderSteps(2)}
    if(called===42){
      renderSteps(3);
      banner.classList.add('show');
      refresh.disabled=true;
      refresh.textContent='已叫到 A42';
      notice.classList.remove('show');
    }else{
      renderSteps(1);
    }
  });
  aside.addEventListener('click',function(){
    var on=aside.classList.contains('on');
    if(on){
      aside.classList.remove('on');
      aside.textContent='先逛逛，到号叫我';
      notice.classList.remove('show');
    }else{
      aside.classList.add('on');
      aside.textContent='提醒已开，等我叫';
      notice.classList.add('show');
    }
  });
  document.getElementById('cancel').addEventListener('click',function(){
    ticket.style.opacity='.45';
    bye.classList.add('show');
    refresh.disabled=true;
    aside.disabled=true;
    refresh.textContent='已取消取号';
  });
})();
</script>
</body>
</html>
