<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>暗房 · 冲印台</title>
<style>
:root{
  --dark:#171014;
  --panel:#221820;
  --red:#d93a4e;
  --red-deep:#a52a3a;
  --amber:#e8a94e;
  --ink:#f0e8e8;
  --muted:#a09096;
  --line:#3a2a32;
  --ok:#4caf7d;
  --radius-card:12px;
  --radius-ctl:8px;
  --sp:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font:14px/1.6 "PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:var(--dark);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;
}
.topbar{
  height:54px;flex:0 0 54px;display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;border-bottom:1px solid var(--line);background:var(--panel);
}
.brand{display:flex;align-items:center;gap:10px;font:700 15.5px/1 "Songti SC","STSong","SimSun",serif;letter-spacing:.26em;color:var(--red)}
.brand .lamp{width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 12px var(--red)}
.topbar .note{font:11px/1 ui-monospace,Consolas,monospace;color:var(--muted);letter-spacing:.12em}
.main{flex:1;display:flex;min-height:0}
.preview-zone{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(ellipse at 50% 40%,#241318 0%,#171014 70%);
}
.frame{
  width:min(560px,100%);aspect-ratio:4/3;border:10px solid #0c090b;border-radius:4px;
  box-shadow:0 24px 60px rgba(0,0,0,.6);overflow:hidden;position:relative;
}
.photo{
  position:absolute;inset:0;
  background:
    radial-gradient(ellipse at 30% 70%,#8a6a4a 0%,transparent 55%),
    radial-gradient(ellipse at 72% 30%,#c9a86a 0%,transparent 45%),
    linear-gradient(160deg,#5b4a3a 0%,#2c241e 55%,#16110d 100%);
}
.photo.bw{filter:grayscale(1) contrast(1.05)!important}
.layer{position:absolute;inset:0;pointer-events:none}
.layer.grain{background-image:radial-gradient(rgba(240,232,232,.35) 1px,transparent 1.2px);background-size:5px 5px;opacity:.35;display:none}
.layer.grain.on{display:block}
.layer.vig{box-shadow:inset 0 0 90px 30px rgba(0,0,0,.75);display:none}
.layer.vig.on{display:block}
.frame .fname{
  position:absolute;left:12px;bottom:10px;font:10.5px/1 ui-monospace,Consolas,monospace;
  color:rgba(240,232,232,.75);letter-spacing:.14em;z-index:2;
}
.bench{
  flex:0 0 372px;background:var(--panel);border-left:1px solid var(--line);padding:18px 20px;overflow-y:auto;
}
.bench h2{font-size:12px;letter-spacing:.22em;color:var(--muted);margin:4px 0 12px}
.slider-row{margin-bottom:14px}
.slider-row .sr-h{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:6px}
.slider-row .sr-h .v{font-family:ui-monospace,Consolas,monospace;color:var(--amber)}
input[type=range]{width:100%;accent-color:var(--red);height:22px;cursor:pointer}
.layers{display:flex;gap:8px;margin-bottom:16px}
.lchip{
  flex:1;border:1px solid var(--line);background:none;border-radius:var(--radius-ctl);padding:8px 0;
  font:inherit;font-size:12px;color:var(--muted);cursor:pointer;transition:all .13s ease;
}
.lchip.on{border-color:var(--red);color:var(--red);background:rgba(217,58,78,.1)}
.colorseg{display:flex;background:#17111a;border-radius:999px;padding:3px;margin-bottom:16px}
.colorseg button{
  flex:1;border:0;background:none;border-radius:999px;padding:7px 0;font:inherit;font-size:12px;
  color:var(--muted);cursor:pointer;
}
.colorseg button.on{background:var(--red);color:#fff;font-weight:700}
.divider{height:1px;background:var(--line);margin:14px 0}
.sel-row{display:flex;gap:10px;margin-bottom:12px}
.sel{flex:1}
.sel label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:6px;letter-spacing:.08em}
.sel select{
  width:100%;height:38px;padding:0 10px;border:1px solid var(--line);border-radius:var(--radius-ctl);
  background:#17111a;color:var(--ink);font:inherit;font-size:13px;
}
.conflict{
  display:none;background:#3a1420;border:1px solid var(--red-deep);border-radius:var(--radius-ctl);
  padding:12px 14px;font-size:12.5px;color:#f0b8c0;line-height:1.9;margin-bottom:12px;
}
.conflict.show{display:block}
.conflict b{color:#fff}
.export{
  width:100%;height:48px;border:0;border-radius:var(--radius-ctl);background:var(--red);color:#fff;
  font:inherit;font-weight:700;font-size:14px;letter-spacing:.22em;cursor:pointer;transition:background .14s ease;
}
.export:hover:not(:disabled){background:var(--red-deep)}
.export:disabled{opacity:.45;cursor:wait}
.result{
  display:none;margin-top:14px;background:#14201a;border:1px solid #2c5a42;border-radius:var(--radius-ctl);
  padding:14px 16px;
}
.result.show{display:block}
.result h3{color:var(--ok);font-size:13.5px;margin-bottom:8px}
.result .rl{display:flex;justify-content:space-between;font-size:12px;color:#a8c8b4;padding:3px 0}
.result .rl b{font-family:ui-monospace,Consolas,monospace;color:#e8f4ec}
@media(max-width:920px){
  .main{flex-direction:column}
  .bench{flex:none;width:100%;border-left:0;border-top:1px solid var(--line)}
}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="lamp" aria-hidden="true"></span>暗 房 冲 印 台</div>
  <span class="note">安全灯已开 · 相纸 K-3 型</span>
</header>
<div class="main">
  <main class="preview-zone">
    <div class="frame">
      <div class="photo" id="photo"></div>
      <div class="layer grain on" id="l-grain"></div>
      <div class="layer vig on" id="l-vig"></div>
      <span class="fname" id="fname">巷口修表铺 · 黄昏（彩色）</span>
    </div>
  </main>
  <aside class="bench">
    <h2>显影参数</h2>
    <div class="slider-row">
      <div class="sr-h"><span>曝光</span><span class="v" id="v-exp">+0.3</span></div>
      <input type="range" id="s-exp" min="-10" max="10" value="3">
    </div>
    <div class="slider-row">
      <div class="sr-h"><span>对比</span><span class="v" id="v-con">1.10</span></div>
      <input type="range" id="s-con" min="80" max="140" value="110">
    </div>
    <div class="slider-row">
      <div class="sr-h"><span>暖调</span><span class="v" id="v-warm">+12</span></div>
      <input type="range" id="s-warm" min="0" max="40" value="12">
    </div>
    <h2>图层</h2>
    <div class="layers">
      <button class="lchip on" id="c-grain" type="button">胶片颗粒</button>
      <button class="lchip on" id="c-vig" type="button">暗角</button>
    </div>
    <h2>影像色彩</h2>
    <div class="colorseg" id="colorseg">
      <button class="on" type="button" data-c="color">彩色</button>
      <button type="button" data-c="bw">黑白</button>
    </div>
    <div class="divider"></div>
    <h2>导出</h2>
    <div class="sel-row">
      <div class="sel">
        <label>格式</label>
        <select id="f-fmt">
          <option value="jpeg">JPEG 数字稿</option>
          <option value="tiff">TIFF 无损稿</option>
          <option value="silver">银盐相纸（实体）</option>
        </select>
      </div>
      <div class="sel">
        <label>尺寸</label>
        <select id="f-size">
          <option>6 寸</option>
          <option>A4</option>
          <option>方 8 寸</option>
        </select>
      </div>
    </div>
    <div class="conflict" id="conflict"></div>
    <button class="export" id="export" type="button">开 始 导 出</button>
    <div class="result" id="result">
      <h3>导出完成，已收进「成品匣」</h3>
      <div class="rl"><span>文件</span><b id="r-name"></b></div>
      <div class="rl"><span>规格</span><b id="r-spec"></b></div>
      <div class="rl"><span>体积</span><b id="r-size"></b></div>
    </div>
  </aside>
</div>
<script>
(function(){
  var photo=document.getElementById('photo');
  var fname=document.getElementById('fname');
  var sExp=document.getElementById('s-exp');
  var sCon=document.getElementById('s-con');
  var sWarm=document.getElementById('s-warm');
  var vExp=document.getElementById('v-exp');
  var vCon=document.getElementById('v-con');
  var vWarm=document.getElementById('v-warm');
  var conflict=document.getElementById('conflict');
  var result=document.getElementById('result');
  var colorMode='color';
  function apply(){
    var e=Number(sExp.value)/10;
    var c=Number(sCon.value)/100;
    var w=Number(sWarm.value);
    vExp.textContent=(e>=0?'+':'')+e.toFixed(1);
    vCon.textContent=c.toFixed(2);
    vWarm.textContent='+'+w;
    var f='brightness('+(1+e*0.12)+') contrast('+c+') sepia('+(w/45)+')';
    if(colorMode==='bw')f+=' grayscale(1)';
    photo.style.filter=f;
  }
  sExp.addEventListener('input',apply);
  sCon.addEventListener('input',apply);
  sWarm.addEventListener('input',apply);
  document.getElementById('c-grain').addEventListener('click',function(){
    var b=document.getElementById('c-grain');
    var on=b.classList.contains('on');
    if(on){b.classList.remove('on')}else{b.classList.add('on')}
    var l=document.getElementById('l-grain');
    if(on){l.classList.remove('on')}else{l.classList.add('on')}
  });
  document.getElementById('c-vig').addEventListener('click',function(){
    var b=document.getElementById('c-vig');
    var on=b.classList.contains('on');
    if(on){b.classList.remove('on')}else{b.classList.add('on')}
    var l=document.getElementById('l-vig');
    if(on){l.classList.remove('on')}else{l.classList.add('on')}
  });
  var cBtns=document.querySelectorAll('#colorseg button');
  for(var i=0;i<cBtns.length;i++){
    (function(b){
      b.addEventListener('click',function(){
        for(var j=0;j<cBtns.length;j++)cBtns[j].classList.remove('on');
        b.classList.add('on');
        colorMode=b.getAttribute('data-c');
        fname.textContent='巷口修表铺 · 黄昏（'+(colorMode==='bw'?'黑白':'彩色')+'）';
        conflict.classList.remove('show');
        apply();
      });
    })(cBtns[i]);
  }
  document.getElementById('f-fmt').addEventListener('change',function(){
    conflict.classList.remove('show');
  });
  document.getElementById('export').addEventListener('click',function(){
    var fmtSel=document.getElementById('f-fmt');
    var fmt=fmtSel.value;
    var fmtName=fmtSel.options[fmtSel.selectedIndex].text;
    if(fmt==='silver'&&colorMode==='color'){
      conflict.innerHTML='导出被拦下：<b>银盐相纸（实体）只承接黑白影像</b>，当前作品是彩色。两条路：把「影像色彩」切到黑白，或改用 JPEG / TIFF 数字稿。';
      conflict.classList.add('show');
      result.classList.remove('show');
      return;
    }
    conflict.classList.remove('show');
    var btn=document.getElementById('export');
    btn.disabled=true;
    btn.textContent='冲洗中…';
    setTimeout(function(){
      btn.disabled=false;
      btn.textContent='开 始 导 出';
      var size=document.getElementById('f-size').value;
      var ext=fmt==='silver'?'银盐相纸':(fmt==='tiff'?'TIFF':'JPEG');
      document.getElementById('r-name').textContent='暗房-巷口修表铺-0'+(100+Math.floor(Math.random()*900))+'.'+(fmt==='silver'?'print':fmt);
      document.getElementById('r-spec').textContent=fmtName+' · '+size+' · '+(colorMode==='bw'?'黑白':'彩色');
      document.getElementById('r-size').textContent=fmt==='tiff'?'48.6 MB':(fmt==='silver'?'实体 1 张':'8.2 MB');
      result.classList.add('show');
    },1200);
  });
  apply();
})();
</script>
</body>
</html>
