<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>烟花 · 抢票成功</title>
<style>
:root{
  --night:#131c33;
  --night-2:#1a2647;
  --gold:#f0c75e;
  --gold-2:#f5d98a;
  --ink:#eef0f8;
  --muted:#98a1bd;
  --line:#2a3760;
  --frame:#10151f;
  --sp:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font:15px/1.65 "PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  background:#262b34;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
}
.stage{text-align:center}
.device-label{color:#8b93a1;font-size:12px;letter-spacing:.2em;margin-bottom:14px}
.phone{
  width:390px;height:min(844px,calc(100vh - 90px));border-radius:38px;border:11px solid var(--frame);
  background:var(--night);overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5);
}
.screen{
  height:100%;overflow-y:auto;padding:26px 22px 22px;display:flex;flex-direction:column;
  position:relative;color:var(--ink);
}
.spark{position:absolute;border-radius:50%;background:var(--gold);opacity:.7;animation:tw 2.6s ease-in-out infinite alternate}
@keyframes tw{from{opacity:.25;transform:scale(.8)}to{opacity:.9;transform:scale(1.15)}}
.hero{text-align:center;padding:26px 0 20px;position:relative;z-index:1}
.burst{width:88px;height:88px;margin:0 auto 16px}
h1{font:700 26px/1.4 "Songti SC","STSong","SimSun",serif;letter-spacing:.16em}
.hero .sub{color:var(--muted);font-size:12.5px;margin-top:6px;letter-spacing:.14em}
.receipt{
  position:relative;z-index:1;background:var(--night-2);border:1px solid var(--line);border-radius:16px;
  overflow:hidden;margin-bottom:16px;
}
.receipt .band{
  background:linear-gradient(90deg,rgba(240,199,94,.18),rgba(240,199,94,.05));
  border-bottom:1px dashed var(--line);padding:13px 18px;display:flex;justify-content:space-between;align-items:center;
}
.band .k{font-size:11.5px;color:var(--muted);letter-spacing:.16em}
.band .no{font:700 15px/1 ui-monospace,Consolas,monospace;color:var(--gold);letter-spacing:.06em}
.r-rows{padding:8px 18px 12px}
.r-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.r-row:last-child{border-bottom:0}
.r-row .k{color:var(--muted);font-size:12.5px}
.r-row .v{font-weight:600;text-align:right}
.r-row .v.seat{color:var(--gold);font-family:ui-monospace,Consolas,monospace}
.detail{
  position:relative;z-index:1;background:rgba(26,38,71,.6);border:1px solid var(--line);border-radius:14px;
  margin-bottom:18px;overflow:hidden;
}
.detail .head{
  width:100%;display:flex;justify-content:space-between;align-items:center;padding:13px 16px;
  background:none;border:0;color:var(--ink);font:inherit;font-size:13px;cursor:pointer;
}
.detail .head .arr{color:var(--gold);transition:transform .18s ease}
.detail.open .head .arr{transform:rotate(90deg)}
.detail .inner{display:none;padding:2px 16px 16px;font-size:12.5px;color:var(--muted);line-height:2}
.detail.open .inner{display:block}
.detail .inner b{color:var(--ink)}
.detail .qr{
  width:96px;height:96px;margin:8px auto 4px;background:#eef0f8;border-radius:8px;
  display:grid;place-items:center;
}
.spacer{flex:1}
.done{
  position:relative;z-index:1;width:100%;height:52px;border:0;border-radius:14px;
  background:var(--gold);color:#131c33;font:inherit;font-weight:700;font-size:15.5px;letter-spacing:.24em;
  cursor:pointer;transition:background .15s ease;
}
.done:hover{background:var(--gold-2)}
.done:focus-visible{outline:3px solid rgba(240,199,94,.45);outline-offset:2px}
@media(max-width:520px){
  body{padding:0}
  .device-label{display:none}
  .phone{width:100%;height:100vh;border:0;border-radius:0}
}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<div class="stage">
  <p class="device-label">烟 花 FIREWORK</p>
  <div class="phone">
    <div class="screen">
      <span class="spark" style="width:5px;height:5px;left:12%;top:9%"></span>
      <span class="spark" style="width:3px;height:3px;left:84%;top:13%"></span>
      <span class="spark" style="width:4px;height:4px;left:70%;top:5%"></span>
      <span class="spark" style="width:3px;height:3px;left:24%;top:20%"></span>
      <span class="spark" style="width:4px;height:4px;left:90%;top:26%"></span>
      <span class="spark" style="width:3px;height:3px;left:8%;top:32%"></span>
      <div class="hero">
        <svg class="burst" viewBox="0 0 88 88" fill="none" aria-hidden="true">
          <circle cx="44" cy="44" r="30" stroke="#f0c75e" stroke-width="2.4"/>
          <path d="M33 44L41 52L56 35" stroke="#f0c75e" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M44 6V14M44 74V82M6 44H14M74 44H82M17 17L22.5 22.5M65.5 65.5L71 71M71 17L65.5 22.5M22.5 65.5L17 71" stroke="#f0c75e" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <h1>抢 到 了</h1>
        <p class="sub">第 41,203 次尝试之后 · 手速击败了 98% 的人</p>
      </div>
      <div class="receipt">
        <div class="band"><span class="k">订单编号</span><span class="no">FW-20260906-4417</span></div>
        <div class="r-rows">
          <div class="r-row"><span class="k">演出</span><span class="v">「铁轨之声」秋季专场</span></div>
          <div class="r-row"><span class="k">时间</span><span class="v">9 月 6 日 周六 19:30</span></div>
          <div class="r-row"><span class="k">席位</span><span class="v seat">A 区 · 12 排 08 座</span></div>
          <div class="r-row"><span class="k">实付</span><span class="v">¥260.00</span></div>
        </div>
      </div>
      <div class="detail" id="detail">
        <button class="head" id="d-head" type="button"><span>取票与入场详情</span><span class="arr">→</span></button>
        <div class="inner">
          <div class="qr">
            <svg width="76" height="76" viewBox="0 0 76 76" fill="none" aria-label="取票码示意">
              <rect x="4" y="4" width="20" height="20" stroke="#131c33" stroke-width="3"/>
              <rect x="52" y="4" width="20" height="20" stroke="#131c33" stroke-width="3"/>
              <rect x="4" y="52" width="20" height="20" stroke="#131c33" stroke-width="3"/>
              <path d="M32 8H40V16H32ZM32 28H46V36H32ZM52 32H60V40H52ZM64 32H70V38H64ZM10 32H18V40H10ZM32 52H40V60H32ZM46 56H54V64H46ZM58 52H68V60H58ZM32 64H38V70H32Z" fill="#131c33"/>
            </svg>
          </div>
          <p style="text-align:center"><b>取票码 8821 4406</b></p>
          <p>· 入场：演出当日 18:30 起凭码入场，一人一票<br>· 退改：开演 48 小时前可退，收 10% 手续费<br>· 提醒：席位已锁定 30 天，转赠需在票夹操作</p>
        </div>
      </div>
      <div class="spacer"></div>
      <button class="done" id="done" type="button">完 成</button>
    </div>
  </div>
</div>
<script>
(function(){
  var detail=document.getElementById('detail');
  document.getElementById('d-head').addEventListener('click',function(){
    detail.classList.contains('open')?detail.classList.remove('open'):detail.classList.add('open');
  });
  document.getElementById('done').addEventListener('click',function(ev){
    ev.target.textContent='已收入票夹';
  });
})();
</script>
</body>
</html>
