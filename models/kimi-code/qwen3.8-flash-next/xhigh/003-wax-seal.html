<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹤止会 · 凭函入席</title>
<style>
:root{
  --charcoal:#141210;
  --charcoal-2:#1d1a15;
  --card:#221e18;
  --gold:#c9a227;
  --gold-dim:#8f7434;
  --wax-red:#9e2b25;
  --wax-deep:#6e1b17;
  --ivory:#efe6d2;
  --muted:#8f8574;
  --hairline:#4a4132;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:Georgia,"Times New Roman","Songti SC","STSong","SimSun",serif;
  background:radial-gradient(860px 620px at 50% 36%,#241f16 0%,#181510 55%,#141210 100%);
  color:var(--ivory);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:72px 24px 40px;
}
.hall{width:min(480px,100%);position:relative;}
/* ── 火漆印 ── */
.seal-wrap{
  position:absolute;left:50%;top:-54px;transform:translateX(-50%);
  width:108px;height:108px;z-index:3;
}
.seal-wrap svg{width:108px;height:108px;display:block;filter:drop-shadow(0 6px 12px rgba(0,0,0,.6));}
.seal-crack{opacity:0;transition:opacity .3s ease;}
.shaking{animation:a3-shake .5s ease;}
@keyframes a3-shake{
  0%,100%{transform:translateX(-50%) rotate(0deg);}
  20%{transform:translateX(-50%) rotate(-4deg) translateX(-4px);}
  40%{transform:translateX(-50%) rotate(3deg) translateX(4px);}
  60%{transform:translateX(-50%) rotate(-2deg) translateX(-3px);}
  80%{transform:translateX(-50%) rotate(1deg);}
}
/* ── 函封卡 ── */
.letter{
  position:relative;
  background:linear-gradient(180deg,var(--card) 0%,var(--charcoal-2) 100%);
  border:1px solid var(--gold-dim);
  padding:96px 52px 44px;
  text-align:center;
}
.letter::before{
  content:"";position:absolute;inset:8px;
  border:1px solid rgba(201,162,39,.32);
  pointer-events:none;
}
.overline{font-size:11px;letter-spacing:8px;color:var(--gold);margin-bottom:22px;}
.crane{width:64px;height:64px;margin:0 auto 18px;display:block;}
h1{font-size:38px;font-weight:400;letter-spacing:18px;text-indent:18px;color:var(--ivory);margin-bottom:14px;}
.salon-sub{font-size:13px;letter-spacing:5px;color:var(--muted);margin-bottom:34px;}
.intro{
  font-size:14.5px;line-height:2.1;color:#c9bda2;letter-spacing:1px;
  padding:0 12px;margin-bottom:38px;
}
.intro b{color:var(--gold);font-weight:400;}
.rule{width:56px;height:1px;background:var(--gold-dim);margin:0 auto 34px;}
.code-label{font-size:12px;letter-spacing:6px;color:var(--muted);margin-bottom:14px;}
#a3-code{
  width:266px;background:transparent;border:0;
  border-bottom:1px solid var(--gold-dim);
  color:var(--ivory);font-family:inherit;font-size:21px;
  text-align:center;letter-spacing:7px;padding:8px 4px 10px;
  text-transform:uppercase;
  transition:border-color .2s ease;
}
#a3-code:focus{outline:none;border-bottom-color:var(--gold);}
#a3-code::placeholder{color:#5f5847;letter-spacing:5px;font-size:16px;}
.hint{margin-top:12px;font-size:12px;letter-spacing:2px;color:var(--muted);}
.hint b{color:var(--ivory);font-weight:400;letter-spacing:3px;}
.verify{
  margin-top:34px;width:266px;height:52px;
  background:transparent;border:1px solid var(--gold);
  color:var(--gold);font-family:inherit;font-size:15px;
  letter-spacing:10px;text-indent:10px;cursor:pointer;
  transition:background .22s ease,color .22s ease;
}
.verify:hover{background:var(--gold);color:var(--charcoal);}
.verify:active{transform:translateY(1px);}
.verify:focus-visible{outline:1px dashed var(--ivory);outline-offset:4px;}
/* 失败反馈 */
.deny{
  margin:22px auto 0;max-width:300px;
  border:1px solid var(--wax-red);
  background:rgba(158,43,37,.12);
  color:#d98f83;
  font-size:13px;letter-spacing:2px;line-height:1.8;
  padding:10px 16px;
}
.deny b{display:block;color:#e5b3a8;font-weight:400;letter-spacing:4px;margin-bottom:2px;}
/* 成功态 */
.opened{text-align:center;padding-top:6px;}
.opened .seat-no{font-size:12px;letter-spacing:7px;color:var(--gold);margin-bottom:16px;}
.opened h2{font-size:30px;font-weight:400;letter-spacing:12px;text-indent:12px;margin-bottom:16px;}
.opened p{font-size:13.5px;line-height:2.1;color:var(--muted);letter-spacing:1px;margin-bottom:30px;}
.enter{
  width:266px;height:52px;background:var(--gold);border:1px solid var(--gold);
  color:var(--charcoal);font-family:inherit;font-size:15px;
  letter-spacing:10px;text-indent:10px;cursor:pointer;
  transition:background .22s ease,color .22s ease;
}
.enter:hover{background:transparent;color:var(--gold);}
.relock{
  display:inline-block;margin-top:22px;background:none;border:none;
  font-family:inherit;font-size:12px;letter-spacing:3px;color:var(--muted);
  cursor:pointer;border-bottom:1px solid var(--hairline);padding:0 2px 2px;
}
.relock:hover{color:var(--ivory);}
.vestige{margin-top:18px;text-align:center;font-size:11px;letter-spacing:6px;color:#57503f;}
@media (max-width:768px){
  body{padding:84px 14px 28px;}
  .letter{padding:84px 24px 34px;}
  h1{font-size:30px;letter-spacing:12px;text-indent:12px;}
  #a3-code,.verify,.enter{width:100%;}
}
@media (prefers-reduced-motion: reduce){
  .shaking{animation:none;}
  .seal-crack,.verify,#a3-code,.enter{transition:none;}
}
</style>
</head>
<body>
<div class="hall">
  <div class="seal-wrap" id="a3-seal" aria-hidden="true">
    <svg viewBox="0 0 120 120">
      <defs>
        <radialGradient id="a3-waxgrad" cx="38%" cy="32%" r="75%">
          <stop offset="0%" stop-color="#b8433a"></stop>
          <stop offset="55%" stop-color="#9e2b25"></stop>
          <stop offset="100%" stop-color="#6e1b17"></stop>
        </radialGradient>
      </defs>
      <polygon points="60.0,8.0 74.1,16.7 90.6,17.9 96.8,33.3 109.5,43.9 105.5,60.0 109.5,76.1 96.8,86.7 90.6,102.1 74.1,103.3 60.0,112.0 45.9,103.3 29.4,102.1 23.2,86.7 10.5,76.1 14.5,60.0 10.5,43.9 23.2,33.3 29.4,17.9 45.9,16.7" fill="url(#a3-waxgrad)"></polygon>
      <circle cx="60" cy="60" r="34" fill="none" stroke="#d8b04a" stroke-width="1" opacity=".8"></circle>
      <text x="60" y="71" text-anchor="middle" font-size="32" fill="#e9cf9a" font-family="Georgia,SimSun,serif">鹤</text>
      <polyline id="a3-crack" class="seal-crack" points="60,10 54,30 64,44 52,60 63,76 55,94 61,110" fill="none" stroke="#141210" stroke-width="3" stroke-linejoin="round"></polyline>
    </svg>
  </div>

  <main class="letter">
    <div id="a3-verifybox">
      <p class="overline">邀 请 函 · 编 号 QY-7301</p>
      <svg class="crane" viewBox="0 0 64 64" aria-hidden="true">
        <path d="M10 46c8-2 12-8 14-16 2-9 7-16 16-18l-3 7 9-3c-1 10-6 16-12 20-7 5-15 8-24 10z" fill="none" stroke="#c9a227" stroke-width="1.6" stroke-linejoin="round"></path>
        <circle cx="43" cy="15" r="1.3" fill="#c9a227"></circle>
        <path d="M14 52h36" stroke="#8f7434" stroke-width="1"></path>
      </svg>
      <h1>鹤止会</h1>
      <p class="salon-sub">第 一 百 二 十 七 席 · 秋 席</p>
      <p class="intro">入会不设推荐，只认此函。<br>请将<b>随函密文</b>抄录于下，由账前火漆核验；核验通过后，函自启封。</p>
      <div class="rule"></div>
      <p class="code-label">核 验 密 文</p>
      <input id="a3-code" type="text" autocomplete="off" spellcheck="false" placeholder="密文形如 XX-0000-XX">
      <p class="hint">密文印于函封内侧： <b>QY-7301-XK</b></p>
      <div class="deny" id="a3-deny" hidden>
        <b>火漆不合</b>
        此密文未获本席登记，原函请留原件，勿再投函。
      </div>
      <div>
        <button class="verify" id="a3-verify" type="button">验封入席</button>
      </div>
    </div>

    <div class="opened" id="a3-opened" hidden>
      <p class="seat-no">第 一 百 二 十 七 席 · 已 为 您 留</p>
      <h2>函启 · 恭迎入席</h2>
      <p>火漆已验，席位自今宵起为您点亮。<br>秋席开于白露后第三夜，戌时正，后门入。</p>
      <button class="enter" type="button" onclick="return false">移步内厅</button>
      <br>
      <button class="relock" id="a3-relock" type="button">重新封函（演示）</button>
    </div>

    <p class="vestige">鹤 止 会 · 凭 函 而 入 · 阅 后 谨 藏</p>
  </main>
</div>
<script>
(function () {
  var CODE = 'QY-7301-XK';
  var input = document.getElementById('a3-code');
  var btn = document.getElementById('a3-verify');
  var deny = document.getElementById('a3-deny');
  var verifybox = document.getElementById('a3-verifybox');
  var opened = document.getElementById('a3-opened');
  var seal = document.getElementById('a3-seal');
  var crack = document.getElementById('a3-crack');
  var relock = document.getElementById('a3-relock');

  /* 火漆核验 */
  function check() {
    var value = input.value.trim().toUpperCase();
    if (value === CODE) {
      deny.hidden = true;
      crack.style.opacity = '0';
      seal.style.transform = 'translateX(-50%) translateY(-10px)';
      seal.style.opacity = '.45';
      verifybox.hidden = true;
      opened.hidden = false;
      return;
    }
    deny.hidden = false;
    crack.style.opacity = '1';
    seal.classList.remove('shaking');
    /* 重新触发摆动 */
    void seal.offsetWidth;
    seal.classList.add('shaking');
    input.focus();
  }

  btn.addEventListener('click', check);
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { check(); }
  });
  input.addEventListener('input', function () {
    deny.hidden = true;
    crack.style.opacity = '0';
  });

  relock.addEventListener('click', function () {
    opened.hidden = true;
    verifybox.hidden = false;
    seal.style.transform = 'translateX(-50%)';
    seal.style.opacity = '1';
    input.value = '';
    input.focus();
  });
})();
</script>
</body>
</html>
