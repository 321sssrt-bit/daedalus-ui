<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>拼团小窝 · 拼团消息</title>
<style>
/* ============ 设计令牌 ============ */
:root{
  --page:#fbf4ea;        /* 奶白页面底 */
  --chat-bg:#f8efe1;     /* 聊天区奶白加深，衬托白气泡 */
  --surface:#fffcf7;     /* 气泡与输入面 */
  --surface-2:#fff3e6;   /* 列表悬停/柔橙浅底 */
  --card:#ffffff;        /* 拼团卡片面 */
  --ink:#4a382d;         /* 暖棕主文字 */
  --muted:#a08a78;       /* 辅助棕灰 */
  --line:#f0e0cc;        /* 分隔线/描边 */
  --coral:#ff7f66;       /* 珊瑚橙主强调 */
  --coral-deep:#ee6046;  /* 珊瑚橙深：徽标/强调文字 */
  --coral-soft:#ffe4db;  /* 珊瑚橙浅底 */
  --blue:#9ec9e8;        /* 奶油蓝次强调 */
  --blue-deep:#5d9cc9;   /* 奶油蓝深：已读/链接 */
  --blue-soft:#e8f2fa;   /* 奶油蓝浅底 */
  --danger:#e5484d;      /* 发送失败红 */
  --danger-soft:#fdecec; /* 失败浅底 */
  --mint:#4cb07f;        /* 成团绿 */
  --mint-soft:#e1f3ea;   /* 成团浅底 */
  --sh-candy:0 10px 22px -8px rgba(255,127,102,.35);   /* 糖果投影（橙） */
  --sh-card:0 10px 26px -12px rgba(74,56,45,.14);      /* 通用软投影 */
  --r-bubble:20px;       /* 大圆角气泡 */
  --r-chip:999px;        /* 圆胖胶囊控件 */
  --font:system-ui,-apple-system,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:var(--font);
  color:var(--ink);
  background:var(--page);
  background-image:radial-gradient(rgba(255,127,102,.08) 2.5px,transparent 2.5px);
  background-size:26px 26px;
  font-size:15px;line-height:1.55;
}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}
input,textarea{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid rgba(255,127,102,.45);outline-offset:2px;border-radius:8px}

/* ============ 手机画布 ============ */
.app{
  position:relative;display:flex;flex-direction:column;
  width:100%;max-width:460px;height:100vh;height:100dvh;
  margin:0 auto;background:var(--page);overflow:hidden;
}
@media (min-width:520px){
  .app{margin:18px auto;height:calc(100vh - 36px);height:calc(100dvh - 36px);
       border:1px solid var(--line);border-radius:34px;box-shadow:var(--sh-card)}
}
.screen{display:none;flex-direction:column;flex:1;min-height:0}
.screen.on{display:flex;animation:screen-in .26s ease-out both}
@keyframes screen-in{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}

/* ============ 会话列表屏 ============ */
#screenList{background:var(--page)}
.listHead{
  position:relative;padding:26px 20px 18px;overflow:hidden;
  background:linear-gradient(180deg,var(--coral-soft) 0%,rgba(255,228,219,0) 92%);
  border-bottom:1px solid var(--line);
}
.listHead h1{font-size:25px;font-weight:800;letter-spacing:.5px;position:relative;z-index:2}
.listHead p{font-size:13px;color:var(--muted);margin-top:3px;position:relative;z-index:2}
.decoCloud{position:absolute;right:6px;top:14px;width:150px;height:74px;opacity:.9;z-index:1}
.decoDots{position:absolute;left:10px;bottom:8px;width:88px;height:26px;z-index:1}
.convList{flex:1;overflow-y:auto;padding:10px 12px 22px}
.convItem{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:13px 12px;border-radius:18px;transition:background .15s ease;
}
.convItem:hover,.convItem:focus-visible{background:var(--surface-2)}
.convItem + .convItem{margin-top:4px}
.convAvr{
  flex:0 0 52px;height:52px;border-radius:26px;display:flex;align-items:center;justify-content:center;
  font-size:25px;border:2.5px solid #ffffff;box-shadow:var(--sh-card);
}
.convMain{flex:1;min-width:0}
.convTop{display:flex;align-items:center;gap:6px}
.convName{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.miniTag{flex:none;font-size:10px;line-height:1;padding:3px 7px;border-radius:var(--r-chip);font-weight:700}
.tagTop{background:var(--coral);color:#fff}
.tagMute{background:var(--blue-soft);color:var(--blue-deep)}
.convPrev{font-size:12.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.convRight{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.convTime{font-size:11px;color:var(--muted)}
.badge{
  min-width:19px;height:19px;padding:0 6px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  background:var(--coral-deep);color:#fff;font-size:11.5px;font-weight:700;
  box-shadow:0 4px 10px -3px rgba(238,96,70,.55);
}
.badge.hidden{display:none}
.listFoot{padding:0 20px 14px;font-size:11px;color:var(--muted);text-align:center}
</style>
<style>
/* ============ 聊天屏：顶栏 ============ */
#screenChat{background:var(--chat-bg)}
.chatHead{
  flex:none;display:flex;align-items:center;gap:10px;padding:10px 12px;
  background:var(--surface);border-bottom:1px solid var(--line);z-index:5;
}
.iconBtn{
  flex:none;width:38px;height:38px;border-radius:19px;display:flex;align-items:center;justify-content:center;
  background:var(--surface-2);color:var(--coral-deep);transition:transform .12s ease,background .15s ease;
}
.iconBtn:hover{background:var(--coral-soft)}
.iconBtn:active{transform:scale(.9)}
.chatAvr{
  flex:none;width:40px;height:40px;border-radius:20px;display:flex;align-items:center;justify-content:center;
  font-size:20px;border:2px solid #fff;box-shadow:var(--sh-card);
}
.chatTitle{flex:1;min-width:0}
.chatTitle b{display:block;font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chatTitle span{display:block;font-size:11px;color:var(--muted)}
.weakChip{
  flex:none;display:flex;align-items:center;gap:5px;height:34px;padding:0 11px;border-radius:var(--r-chip);
  background:var(--blue-soft);color:var(--blue-deep);font-size:12px;font-weight:700;
  border:1.5px solid var(--blue);transition:all .15s ease;
}
.weakChip.on{background:var(--danger-soft);color:var(--danger);border-color:var(--danger)}
.weakChip.on.shake{animation:chip-shake .4s ease}
@keyframes chip-shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}

/* ============ 消息流 ============ */
.msgs{flex:1;min-height:0;overflow-y:auto;padding:14px 12px 10px;scroll-behavior:smooth}
.dayPill{display:flex;justify-content:center;margin:2px 0 12px}
.dayPill span{font-size:11px;color:var(--muted);background:var(--surface);border:1px solid var(--line);
  padding:3px 12px;border-radius:var(--r-chip)}
.row{display:flex;gap:9px;margin-bottom:14px;align-items:flex-start;animation:pop-in .22s ease-out both}
@keyframes pop-in{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
.row.me{flex-direction:row-reverse}
.mAvr{
  flex:0 0 36px;height:36px;border-radius:18px;display:flex;align-items:center;justify-content:center;
  font-size:17px;border:2px solid #fff;box-shadow:var(--sh-card);margin-top:16px;
}
.mBody{display:flex;flex-direction:column;max-width:262px;min-width:0}
.row.me .mBody{align-items:flex-end}
.mName{font-size:11px;color:var(--muted);margin:0 4px 3px}
.bubble{
  position:relative;padding:9px 13px;font-size:15px;line-height:1.5;word-break:break-word;
  white-space:pre-wrap;user-select:text;
}
.bubble.other{
  background:var(--surface);border:1px solid var(--line);color:var(--ink);
  border-radius:var(--r-bubble) var(--r-bubble) var(--r-bubble) 8px;box-shadow:var(--sh-card);
}
.bubble.mine{
  background:var(--coral);color:#fff;border-radius:var(--r-bubble) var(--r-bubble) 8px var(--r-bubble);
  box-shadow:var(--sh-candy);
}
.bubble.mine.failed{
  background:var(--danger-soft);color:var(--ink);border:1.5px dashed var(--danger);box-shadow:none;
}
.bubble.editable{cursor:pointer}
.bubble.editable:hover{filter:brightness(.97)}
.editedTag{font-size:10.5px;color:rgba(255,255,255,.75);margin-left:6px}
.bubble.mine.failed .editedTag{color:var(--muted)}
.mMeta{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);margin:4px 4px 0}
.mMeta .st{display:inline-flex;align-items:center;gap:4px}
.mMeta.read .st{color:var(--blue-deep);font-weight:700}
.mMeta.failed .st{color:var(--danger);font-weight:800}
.spin{width:11px;height:11px;border-radius:50%;border:2px solid var(--muted);border-top-color:transparent;
  animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.failActions{display:flex;gap:8px;margin:7px 0 0}
.retryBtn{
  display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 13px;border-radius:var(--r-chip);
  background:#fff;border:1.5px solid var(--danger);color:var(--danger);font-size:12.5px;font-weight:800;
  transition:transform .12s ease,background .15s ease;
}
.retryBtn:hover{background:var(--danger-soft)}
.retryBtn:active{transform:scale(.94)}
.ghostBtn{
  display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 12px;border-radius:var(--r-chip);
  background:var(--surface);border:1.5px solid var(--line);color:var(--muted);font-size:12.5px;font-weight:700;
  transition:transform .12s ease,color .15s ease,border-color .15s ease;
}
.ghostBtn:hover{color:var(--coral-deep);border-color:var(--coral)}
.ghostBtn:active{transform:scale(.94)}
.editRow{margin:7px 0 0}
.typingRow .bubble{display:inline-flex;gap:5px;align-items:center;padding:12px 15px}
.tdot{width:7px;height:7px;border-radius:50%;background:var(--blue);animation:tdot 1s ease-in-out infinite}
.tdot:nth-child(2){animation-delay:.16s;background:var(--coral)}
.tdot:nth-child(3){animation-delay:.32s}
@keyframes tdot{0%,100%{transform:translateY(0);opacity:.55}50%{transform:translateY(-4px);opacity:1}}

/* ============ 拼团卡片 ============ */
.groupCard{
  width:250px;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;
  box-shadow:var(--sh-card);
}
.gcTop{display:flex;gap:11px;padding:13px 13px 9px;align-items:center}
.gcFruit{
  flex:0 0 46px;height:46px;border-radius:23px;background:var(--coral-soft);display:flex;align-items:center;
  justify-content:center;font-size:24px;border:2px solid #fff;box-shadow:var(--sh-candy);
}
.gcTitle{font-size:14.5px;font-weight:800;line-height:1.3}
.gcSub{font-size:11px;color:var(--muted);margin-top:2px}
.gcPrice{display:flex;align-items:baseline;gap:7px;padding:0 13px 8px}
.gcNow{font-size:20px;font-weight:900;color:var(--coral-deep)}
.gcNow i{font-style:normal;font-size:12px}
.gcOld{font-size:12px;color:var(--muted);text-decoration:line-through}
.gcBarWrap{padding:0 13px 4px}
.gcBar{height:9px;border-radius:5px;background:var(--blue-soft);overflow:hidden;border:1px solid var(--line)}
.gcBar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--coral),var(--coral-deep));
  width:93.75%;transition:width .5s ease}
.gcBar.full i{background:linear-gradient(90deg,#6cc79a,var(--mint))}
.gcCnt{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);padding:4px 1px 0}
.gcCnt b.joined{color:var(--mint)}
.gcBtn{
  display:block;width:calc(100% - 26px);margin:8px 13px 13px;height:38px;border-radius:var(--r-chip);
  background:var(--coral);color:#fff;font-size:13.5px;font-weight:800;box-shadow:var(--sh-candy);
  transition:transform .12s ease,background .2s ease;
}
.gcBtn:hover{background:var(--coral-deep)}
.gcBtn:active{transform:scale(.95)}
.gcBtn.done{background:var(--mint-soft);color:var(--mint);box-shadow:none;cursor:default}
</style>
<style>
/* ============ 输入区 ============ */
.composerWrap{flex:none;background:var(--surface);border-top:1px solid var(--line);z-index:5}
.netHint{
  display:none;align-items:center;gap:7px;margin:8px 12px 0;padding:7px 11px;
  background:var(--danger-soft);border:1px dashed var(--danger);border-radius:12px;
  color:var(--danger);font-size:11.5px;font-weight:700;line-height:1.4;
}
.netHint.on{display:flex}
.netHint svg{flex:none}
.editBar{
  display:none;align-items:center;gap:8px;margin:8px 12px 0;padding:7px 11px;
  background:var(--blue-soft);border-radius:12px;font-size:11.5px;font-weight:700;color:var(--blue-deep);
}
.editBar.on{display:flex}
.editBar .cancelEdit{margin-left:auto;color:var(--muted);font-size:12px;font-weight:700;
  padding:3px 9px;border-radius:var(--r-chip);border:1px solid var(--line);background:#fff}
.emojiRow{display:flex;gap:6px;padding:8px 12px 0}
.emojiBtn{
  width:34px;height:34px;border-radius:17px;font-size:17px;background:var(--surface-2);
  display:flex;align-items:center;justify-content:center;transition:transform .12s ease,background .15s ease;
}
.emojiBtn:hover{background:var(--coral-soft)}
.emojiBtn:active{transform:scale(.86) rotate(-8deg)}
.composer{display:flex;align-items:flex-end;gap:9px;padding:8px 12px 12px}
#msgInput{
  flex:1;min-width:0;height:44px;padding:10px 16px;font-size:15px;
  background:var(--page);border:1.5px solid var(--line);border-radius:var(--r-chip);
  transition:border-color .15s ease,box-shadow .15s ease;
}
#msgInput::placeholder{color:#c3b2a2}
#msgInput:focus{outline:none;border-color:var(--coral);box-shadow:0 0 0 3px rgba(255,127,102,.16)}
#sendBtn{
  flex:none;display:flex;align-items:center;gap:6px;height:44px;padding:0 18px;border-radius:22px;
  background:var(--coral);color:#fff;font-size:14.5px;font-weight:800;box-shadow:var(--sh-candy);
  transition:transform .12s ease,background .15s ease,box-shadow .15s ease;
}
#sendBtn:hover:not(.off){background:var(--coral-deep)}
#sendBtn:active:not(.off){transform:scale(.93)}
#sendBtn.off{background:var(--line);color:#c9b8a6;box-shadow:none;cursor:not-allowed}

/* ============ 轻提示 ============ */
#toast{
  position:absolute;left:50%;bottom:118px;transform:translate(-50%,14px);z-index:50;
  max-width:310px;padding:10px 18px;border-radius:var(--r-chip);
  background:var(--ink);color:#fff8f1;font-size:13px;font-weight:600;line-height:1.45;
  box-shadow:0 12px 26px -10px rgba(74,56,45,.5);opacity:0;pointer-events:none;
  transition:opacity .22s ease,transform .22s ease;text-align:center;
}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ============ 动效降级 ============ */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important;transition:none !important;scroll-behavior:auto !important}
  .spin{border-top-color:var(--muted)}
  .tdot{opacity:.8}
  #toast{transform:translate(-50%,0)}
}
</style>
</head>
<body>
<div class="app">

  <!-- 会话列表屏 -->
  <main class="screen on" id="screenList">
    <header class="listHead">
      <svg class="decoCloud" viewBox="0 0 150 74" aria-hidden="true">
        <ellipse cx="48" cy="52" rx="34" ry="20" fill="#9ec9e8" opacity=".38"/>
        <ellipse cx="84" cy="40" rx="30" ry="22" fill="#ff7f66" opacity=".22"/>
        <ellipse cx="116" cy="55" rx="26" ry="16" fill="#9ec9e8" opacity=".3"/>
        <circle cx="26" cy="24" r="7" fill="#ff7f66" opacity=".3"/>
        <circle cx="66" cy="14" r="5" fill="#9ec9e8" opacity=".5"/>
        <circle cx="134" cy="22" r="8" fill="#ff7f66" opacity=".18"/>
      </svg>
      <svg class="decoDots" viewBox="0 0 88 26" aria-hidden="true">
        <circle cx="6" cy="13" r="5" fill="#ff7f66" opacity=".35"/>
        <circle cx="23" cy="13" r="4" fill="#9ec9e8" opacity=".55"/>
        <circle cx="38" cy="13" r="3" fill="#ff7f66" opacity=".25"/>
        <circle cx="51" cy="13" r="2.5" fill="#9ec9e8" opacity=".4"/>
        <circle cx="62" cy="13" r="2" fill="#ff7f66" opacity=".3"/>
        <circle cx="72" cy="13" r="1.5" fill="#9ec9e8" opacity=".45"/>
      </svg>
      <h1>拼团小窝</h1>
      <p>本周有 3 个团等你上车 🛒</p>
    </header>
    <div class="convList" id="convList"></div>
    <div class="listFoot">点进任意一群即可聊天 · 演示数据仅在本地</div>
  </main>

  <!-- 聊天屏 -->
  <main class="screen" id="screenChat">
    <header class="chatHead">
      <button class="iconBtn" id="backBtn" type="button" aria-label="返回会话列表">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4 L7 12 L15 20"/></svg>
      </button>
      <div class="chatAvr" id="chatAvr"></div>
      <div class="chatTitle"><b id="chatTitle"></b><span id="chatSub"></span></div>
      <button class="weakChip" id="weakChip" type="button" aria-pressed="false" title="演示入口：开启后下一条消息发送失败">
        <svg width="15" height="15" viewBox="0 0 24 16" fill="currentColor" aria-hidden="true">
          <rect x="2" y="10" width="4" height="6" rx="2"/><rect x="9" y="6" width="4" height="10" rx="2"/><rect x="16" y="1" width="4" height="15" rx="2"/>
        </svg>
        <span id="weakChipTxt">网络流畅</span>
      </button>
    </header>
    <div class="msgs" id="msgs" aria-live="polite"></div>
    <div class="composerWrap">
      <div class="netHint" id="netHint">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 3 L22 20 L2 20 Z"/><path d="M12 10 v4"/><circle cx="12" cy="17" r=".6" fill="currentColor"/></svg>
        弱网模式开着：下一条消息会发送失败（用于演示），点右上角胶囊可关闭。
      </div>
      <div class="editBar" id="editBar">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20 L4 15 L16 3 L21 8 L9 20 Z"/><path d="M13 6 L18 11"/></svg>
        <span id="editTxt">编辑消息中</span>
        <button class="cancelEdit" id="editCancel" type="button">取消</button>
      </div>
      <div class="emojiRow" id="emojiRow">
        <button class="emojiBtn" type="button" data-emo="😊">😊</button>
        <button class="emojiBtn" type="button" data-emo="🍑">🍑</button>
        <button class="emojiBtn" type="button" data-emo="🥬">🥬</button>
        <button class="emojiBtn" type="button" data-emo="🚚">🚚</button>
        <button class="emojiBtn" type="button" data-emo="✅">✅</button>
      </div>
      <div class="composer">
        <input id="msgInput" type="text" placeholder="说点什么，比如「帮我留一组」" autocomplete="off" maxlength="120">
        <button id="sendBtn" class="off" type="button">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 11.5 L21 3 L15.5 21 L11.6 13.4 Z"/><path d="M11.6 13.4 L21 3" fill="none" stroke="#fff" stroke-width="1.4"/></svg>
          <span id="sendLbl">发送</span>
        </button>
      </div>
    </div>
  </main>

  <div id="toast" role="status"></div>
</div>
<script>
/* ============ 演示数据（纯前端模拟） ============ */
var ZHANG={name:'团长张姐',emoji:'👩‍🌾',bg:'linear-gradient(135deg,#ffe9c4,#ffcf8f)'};
var LI={name:'小李',emoji:'😎',bg:'linear-gradient(135deg,#dcebfa,#9ec9e8)'};
var WANG={name:'王姨',emoji:'👵',bg:'linear-gradient(135deg,#ffe0d6,#ffb3a0)'};
var LIU={name:'菜农刘哥',emoji:'👨‍🌾',bg:'linear-gradient(135deg,#e2f3e6,#a8dcbb)'};
var BING={name:'冷库小哥',emoji:'🧑‍🔧',bg:'linear-gradient(135deg,#e8f2fa,#b7d9ef)'};
var MEI={name:'客服小美',emoji:'💁‍♀️',bg:'linear-gradient(135deg,#e8f2fa,#9ec9e8)'};

      ]},
  g2:{id:'g2',name:'幸福里 · 蔬菜直供群',sub:'24 人在群 · 今早已截单',emoji:'🥬',
      avrBg:'linear-gradient(135deg,#e2f3e6,#a8dcbb)',unread:2,time:'昨天',top:false,muted:false,
      replier:LIU,
      replies:['好嘞，给你留着！','菠菜刚到，特别水灵 🥬','明早驿站见，9点前哦 🚚'],

      ]},

      avrBg:'linear-gradient(135deg,#e8f2fa,#9ec9e8)',unread:0,time:'周一',top:false,muted:true,
      replier:BING,

      msgs:[
        {id:21,from:'other',who:BING,text:'您退回的冻虾重新发出了，顺丰冷链，预计明天下午到',time:'周一 15:02'},
        {id:22,from:'other',who:MEI,text:'给您添麻烦啦，运费我们承担 🙏',time:'周一 15:05'},
        {id:23,from:'me',text:'收到，谢谢！这次记得多放两袋冰袋 🧊',time:'周一 15:07',status:'read'}
      ]}
};

/* ============ 运行时状态 ============ */
var state={convId:null,weak:false,openMsg:null,editId:null,editIsFail:false,typing:null,joined:{}};
var uid=100;
var el=function(id){return document.getElementById(id);};
var input,msgsEl,toastTimer=null;
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function nowHM(){
  var d=new Date();
  var p=function(n){return (n<10?'0':'')+n;};
  return p(d.getHours())+':'+p(d.getMinutes());
}
function toast(text){
  var t=el('toast');
  t.textContent=text;
  t.classList.add('on');
  if(toastTimer){clearTimeout(toastTimer);}
  toastTimer=setTimeout(function(){t.classList.remove('on');},2300);
}

/* ============ 会话列表渲染 ============ */
function previewOf(c){
  var m=c.msgs[c.msgs.length-1];
  if(!m){return '还没有消息';}
  var head=m.from==='me'?'我：':(m.who?m.who.name+'：':'');
  if(m.type==='card'){return head+'【拼团】阳山水蜜桃 5斤装 ¥39/组';}
  return head+m.text;
}
function renderList(){
  var html='';
  ORDER.forEach(function(id){
    var c=convs[id];
    var tags='';
    if(c.top){tags+='<span class="miniTag tagTop">置顶</span>';}
    if(c.muted){tags+='<span class="miniTag tagMute">免打扰</span>';}
    var badge=c.unread>0?'<span class="badge">'+c.unread+'</span>':'<span class="badge hidden"></span>';
    html+='<button class="convItem" type="button" data-conv="'+id+'">'
      +'<span class="convAvr" style="background:'+c.avrBg+'">'+c.emoji+'</span>'
      +'<span class="convMain"><span class="convTop"><span class="convName">'+esc(c.name)+'</span>'+tags+'</span>'
      +'<span class="convPrev">'+esc(previewOf(c))+'</span></span>'
      +'<span class="convRight"><span class="convTime">'+esc(c.time)+'</span>'+badge+'</span>'
      +'</button>';
  });
  el('convList').innerHTML=html;
}

/* ============ 屏幕切换 ============ */
function showScreen(id){
  el('screenList').classList.toggle('on',id==='screenList');
  el('screenChat').classList.toggle('on',id==='screenChat');
}
function openChat(id){
  var c=convs[id];
  state.convId=id;
  state.openMsg=null;
  c.unread=0;
  el('chatAvr').textContent=c.emoji;
  el('chatAvr').style.background=c.avrBg;
  el('chatTitle').textContent=c.name;
  el('chatSub').textContent=c.sub;
  showScreen('screenChat');
  renderChat(true);
}
/* ============ 内嵌图标 ============ */
var CHK='<svg width="13" height="12" viewBox="0 0 26 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 13 L7 18 L15.5 7"/><path d="M11.5 16.5 L13.5 18.5 L23 7.5"/></svg>';
var WARN='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 3 L22 20 L2 20 Z"/><path d="M12 10 v4"/><circle cx="12" cy="17" r=".8" fill="currentColor"/></svg>';
var RETRY='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 12a8.5 8.5 0 1 1-2.6-6.1"/><path d="M20.5 2.5 v4 h-4"/></svg>';
var PENCIL='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20 L4 15 L16 3 L21 8 L9 20 Z"/></svg>';

/* ============ 聊天渲染 ============ */
function metaCls(m){
  if(m.status==='failed'){return 'failed';}
  if(m.status==='read'){return 'read';}
  return '';
}
function metaHtml(m,c){
  if(m.status==='sending'){return '<span class="st"><span class="spin"></span>发送中</span>';}
  if(m.status==='failed'){return '<span class="st">'+WARN+'发送失败 · 内容已保留</span>';}
  if(m.status==='read'){return '<span class="st">'+CHK+'已读 · '+esc(c.replier.name)+'</span>';}
  return '<span class="st">'+CHK+'已送达</span>';
}
function cardHtml(c){
  var joined=!!state.joined[c.id];
  var barW=joined?'100%':'93.75%';
  var cnt=joined?'<b class="joined">16/16 已成团 🎉</b><span>明早冷库直发</span>'
                :'<b>15/16 人已拼</b><span>还差 1 人成团</span>';
  var btn=joined?'<span class="gcBtn done">已登记 ✓</span>'
                :'<button class="gcBtn" type="button" data-act="join">我要补位 · 抢最后 1 组</button>';
  return '<div class="groupCard">'
    +'<div class="gcTop"><span class="gcFruit">🍑</span><span><span class="gcTitle">阳山水蜜桃 5斤装</span>'
    +'<span class="gcSub">单果250g+ · 冷库直供 · 周六自提</span></span></div>'
    +'<div class="gcPrice"><span class="gcNow"><i>¥</i>39</span><span class="gcOld">门店价 ¥58</span></div>'
    +'<div class="gcBarWrap"><div class="gcBar'+(joined?' full':'')+'"><i style="width:'+barW+'"></i></div>'
    +'<div class="gcCnt">'+cnt+'</div></div>'+btn+'</div>';
}
function rowHtml(m,c){
  if(m.from==='me'){
    var cls='bubble mine';
    var clickable=(m.status==='delivered'||m.status==='read');
    if(m.status==='failed'){cls+=' failed';}
    if(clickable){cls+=' editable';}
    var bubble=(clickable
      ?'<button class="'+cls+'" type="button" data-open="'+m.id+'" title="点按可编辑">'
      :'<div class="'+cls+'">')
      +esc(m.text)+(m.edited?'<span class="editedTag">已编辑</span>':'')
      +(clickable?'</button>':'</div>');
    var tail='';
    if(m.status==='failed'){
      tail='<div class="failActions">'
        +'<button class="retryBtn" type="button" data-act="retry" data-id="'+m.id+'">'+RETRY+'重试发送</button>'
        +'<button class="ghostBtn" type="button" data-act="editfail" data-id="'+m.id+'">'+PENCIL+'改一改</button></div>';
    }else if(state.openMsg===m.id){
      tail='<div class="editRow"><button class="ghostBtn" type="button" data-act="edit" data-id="'+m.id+'">'+PENCIL+'编辑这条</button></div>';
    }
    return '<div class="row me"><span class="mAvr" style="background:'+ME.bg+'">'+ME.emoji+'</span>'
      +'<div class="mBody">'+bubble
      +'<div class="mMeta '+metaCls(m)+'">'+metaHtml(m,c)+'</div>'+tail+'</div></div>';
  }
  var body=m.type==='card'?cardHtml(c):'<div class="bubble other">'+esc(m.text)+'</div>';
  return '<div class="row"><span class="mAvr" style="background:'+m.who.bg+'">'+m.who.emoji+'</span>'
    +'<div class="mBody"><span class="mName">'+esc(m.who.name)+' · '+esc(m.time)+'</span>'+body+'</div></div>';
}
function renderChat(stick){
  var c=convs[state.convId];
  if(!c){return;}
  var top=msgsEl.scrollTop;
  var html='<div class="dayPill"><span>今天 · 群公告：取货请报手机尾号</span></div>';
  c.msgs.forEach(function(m){html+=rowHtml(m,c);});
  if(state.typing&&state.typing.conv===c.id){
    html+='<div class="row typingRow"><span class="mAvr" style="background:'+c.replier.bg+'">'+c.replier.emoji+'</span>'
      +'<div class="mBody"><span class="mName">'+esc(c.replier.name)+' 正在输入</span>'
      +'<div class="bubble other"><span class="tdot"></span><span class="tdot"></span><span class="tdot"></span></div></div></div>';
  }
  msgsEl.innerHTML=html;
  msgsEl.scrollTop=(stick===false)?top:msgsEl.scrollHeight;
}

/* ============ 消息流程 ============ */
function findMsg(id){
  var c=convs[state.convId];
  for(var i=0;i<c.msgs.length;i=i+1){
    if(c.msgs[i].id===id){return c.msgs[i];}
  }
  return null;
}
function scheduleReply(c){
  setTimeout(function(){
    state.typing={conv:c.id};
    if(state.convId===c.id){renderChat(true);}
    setTimeout(function(){
      var m={id:++uid,from:'other',who:c.replier,text:c.replies[c.replyIdx%c.replies.length],time:nowHM()};
      c.replyIdx=c.replyIdx+1;
      c.time=m.time;
      c.msgs.push(m);
      state.typing=null;
      if(state.convId===c.id){renderChat(true);}
    },1100);
  },1400);
}
function pump(m,c){
  setTimeout(function(){
    if(state.weak){
      m.status='failed';
      if(state.convId===c.id){renderChat(true);}
      toast('弱网把这条消息吞掉了：内容已保留在气泡里，点「重试发送」找回');
    }else{
      m.status='delivered';
      if(state.convId===c.id){renderChat(true);}
      setTimeout(function(){
        m.status='read';
        if(state.convId===c.id){renderChat(false);}
      },1700);
      scheduleReply(c);
    }
  },900);
}
function doRetry(id){
  var m=findMsg(id);
  if(!m){return;}
  if(state.weak){
    toast('弱网开关还开着：先点右上角「弱网中」胶囊关一下，再重试 🙂');
    var chip=el('weakChip');
    chip.classList.add('shake');
    setTimeout(function(){chip.classList.remove('shake');},450);
    return;
  }
  m.status='sending';
  state.openMsg=null;
  renderChat(true);
  pump(m,convs[state.convId]);
  toast('正在重发…');
}
function clearEditBar(){
  state.editId=null;
  state.editIsFail=false;
  el('editBar').classList.remove('on');
  el('sendLbl').textContent='发送';
}
function enterEdit(id,isFail){
  var m=findMsg(id);
  if(!m){return;}
  state.editId=id;
  state.editIsFail=isFail;
  input.value=m.text;
  el('editTxt').textContent=isFail?'编辑并重发这条失败消息':'编辑消息中 · 保存后会替换原气泡';
  el('editBar').classList.add('on');
  el('sendLbl').textContent='保存';
  state.openMsg=null;
  renderChat(false);
  updateSendState();
  input.focus();
}
function cancelEdit(){
  clearEditBar();
  input.value='';
  updateSendState();
}
function updateSendState(){
  el('sendBtn').classList.toggle('off',!input.value.trim());
}
function doSend(){
  var t=input.value.trim();
  if(!t){return;}
  var c=convs[state.convId];
  if(state.editId!=null){
    var m=findMsg(state.editId);
    var wasFail=state.editIsFail;
    if(!m){cancelEdit();return;}
    m.text=t;
    m.edited=true;
    clearEditBar();
    input.value='';
    updateSendState();
    if(wasFail){
      m.status='sending';
      renderChat(true);
      pump(m,c);
    }else{
      renderChat(false);
      toast('消息已更新，气泡上标了「已编辑」✏️');
    }
    return;
  }
  var nm={id:++uid,from:'me',text:t,time:nowHM(),status:'sending'};
  c.msgs.push(nm);
  c.time=nm.time;
  input.value='';
  updateSendState();
  state.openMsg=null;
  renderChat(true);
  pump(nm,c);
}
function joinCard(){
  var c=convs[state.convId];
  if(state.joined[c.id]){return;}
  state.joined[c.id]=true;
  renderChat(false);
  toast('已帮你登记 1 组，成团后群里通知 🎉');
}

/* ============ 事件绑定 ============ */
input=el('msgInput');
msgsEl=el('msgs');
ORDER.forEach(function(id){convs[id].replyIdx=0;});
renderList();

el('convList').addEventListener('click',function(ev){
  var item=ev.target.closest('[data-conv]');
  if(item){openChat(item.getAttribute('data-conv'));}
});
el('backBtn').addEventListener('click',function(){
  cancelEdit();
  state.openMsg=null;
  renderList();
  showScreen('screenList');
});
el('weakChip').addEventListener('click',function(){
  state.weak=!state.weak;
  this.classList.toggle('on',state.weak);
  this.setAttribute('aria-pressed',state.weak?'true':'false');
  el('weakChipTxt').textContent=state.weak?'弱网中':'网络流畅';
  el('netHint').classList.toggle('on',state.weak);
  toast(state.weak?'弱网模式已开：下一条消息会发送失败（演示入口）':'网络恢复正常 ✅ 可以去重试失败消息了');
});
msgsEl.addEventListener('click',function(ev){
  var act=ev.target.closest('[data-act]');
  if(act){
    var kind=act.getAttribute('data-act');
    if(kind==='join'){joinCard();return;}
    var id=parseInt(act.getAttribute('data-id'),10);
    if(kind==='retry'){doRetry(id);}
    if(kind==='edit'){enterEdit(id,false);}
    if(kind==='editfail'){enterEdit(id,true);}
    return;
  }
  var op=ev.target.closest('[data-open]');
  if(op){
    var mid=parseInt(op.getAttribute('data-open'),10);
    state.openMsg=(state.openMsg===mid)?null:mid;
    renderChat(false);
  }
});
el('emojiRow').addEventListener('click',function(ev){
  var b=ev.target.closest('[data-emo]');
  if(!b){return;}
  input.value=input.value+b.getAttribute('data-emo');
  updateSendState();
  input.focus();
});
el('editCancel').addEventListener('click',cancelEdit);
el('sendBtn').addEventListener('click',doSend);
input.addEventListener('input',updateSendState);
input.addEventListener('keydown',function(ev){
  if(ev.key==='Enter'){ev.preventDefault();doSend();}
});
</script>
