<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>萌芽手账 · 注册</title>
<style>
:root{
  --paper:#fff8e7;
  --grid:#e8d9b5;
  --card:#fffdf6;
  --pink:#f4a9b8;
  --pink-deep:#e0788f;
  --mint:#8fc7a3;
  --mint-deep:#4e9c74;
  --sun:#ffd98e;
  --ink:#54463a;
  --muted:#9b8a76;
  --line:#e6d7ba;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Yuanti SC","YouYuan",sans-serif;
  color:var(--ink);
  background-color:var(--paper);
  background-image:radial-gradient(var(--grid) 1.3px,transparent 1.3px);
  background-size:26px 26px;
  min-height:100vh;
  padding:56px 24px 40px;
  position:relative;
  overflow-x:hidden;
}
/* ── 散落的贴纸 ── */
.sticker{position:absolute;pointer-events:none;}
.st-tulip{left:max(12px,4vw);top:120px;width:88px;transform:rotate(-14deg);animation:a2-sway 5s ease-in-out infinite alternate;}
.st-cloud{right:max(16px,6vw);top:84px;width:110px;transform:rotate(6deg);animation:a2-sway 6.5s .4s ease-in-out infinite alternate;}
.st-star{right:max(48px,12vw);top:340px;width:56px;transform:rotate(12deg);animation:a2-sway 4.5s .8s ease-in-out infinite alternate;}
.st-sprout{left:max(60px,10vw);bottom:64px;width:76px;transform:rotate(8deg);animation:a2-sway 5.8s .2s ease-in-out infinite alternate;}
@keyframes a2-sway{from{rotate:-6deg;}to{rotate:4deg;}}
/* ── 手账卡 ── */
.page{display:flex;flex-direction:column;align-items:center;}
.card{
  position:relative;
  width:min(560px,100%);
  background:var(--card);
  border:1px solid var(--line);
  border-radius:22px;
  box-shadow:0 18px 44px rgba(154,120,70,.18);
  padding:56px 56px 40px;
}
.tape{
  position:absolute;width:128px;height:34px;
  background:var(--pink);opacity:.55;
}
.tape::after{content:"";position:absolute;inset:0;border-left:2px dashed rgba(255,255,255,.8);border-right:2px dashed rgba(255,255,255,.8);}
.tape-l{left:-30px;top:34px;transform:rotate(-32deg);}
.tape-r{right:-26px;top:-14px;transform:rotate(48deg);background:var(--mint);}
.kicker{font-size:12px;letter-spacing:4px;color:var(--mint-deep);margin-bottom:10px;}
h1{font-size:32px;font-weight:800;letter-spacing:2px;line-height:1.3;}
h1 em{font-style:normal;color:var(--pink-deep);}
.squig{display:block;width:190px;height:14px;margin:8px 0 14px;}
.sub{font-size:14.5px;color:var(--muted);margin-bottom:30px;letter-spacing:1px;}
/* ── 表单 ── */
.field{margin-bottom:20px;}
.field label{display:block;font-size:13px;font-weight:700;color:var(--mint-deep);letter-spacing:2px;margin-bottom:7px;}
.field input[type="text"],.field input[type="email"],.field input[type="password"]{
  width:100%;height:48px;padding:0 16px;
  font:inherit;font-size:15px;color:var(--ink);
  background:#ffffff;
  border:1.5px dashed var(--line);
  border-radius:14px;
  transition:border-color .18s ease,box-shadow .18s ease;
}
.field input::placeholder{color:#c4b399;}
.field input:focus{
  outline:none;
  border-style:solid;
  border-color:var(--pink);
  box-shadow:0 0 0 4px rgba(244,169,184,.28);
}
.err{display:none;font-size:12.5px;color:var(--pink-deep);margin-top:6px;letter-spacing:1px;}
.err.show{display:block;}
/* 湿度条 */
.meter{display:flex;align-items:center;gap:8px;margin-top:8px;}
.meter i{display:block;width:56px;height:8px;border-radius:999px;background:var(--line);transition:background .2s ease;}
.meter i.on1{background:var(--sun);}
.meter i.on2{background:var(--mint);}
.meter i.on3{background:var(--pink-deep);}
.meter-txt{font-size:12px;color:var(--muted);letter-spacing:1px;}
/* 贴纸选择 */
.pick-h{font-size:13px;font-weight:700;color:var(--mint-deep);letter-spacing:2px;margin:26px 0 10px;}
.chips{display:flex;gap:12px;flex-wrap:wrap;}
.chip{
  display:flex;flex-direction:column;align-items:center;gap:4px;
  width:86px;padding:10px 6px 8px;
  background:#ffffff;border:1.5px dashed var(--line);border-radius:16px;
  font:inherit;font-size:12px;color:var(--muted);letter-spacing:1px;
  cursor:pointer;
  transition:transform .16s ease,border-color .16s ease,background .16s ease,color .16s ease;
}
.chip svg{width:34px;height:34px;}
.chip:hover{transform:translateY(-3px) rotate(-2deg);border-color:var(--pink);}
.chip.on{background:#fdeef1;border:1.5px solid var(--pink-deep);color:var(--pink-deep);font-weight:700;box-shadow:0 6px 14px rgba(224,120,143,.22);}
.chip:focus-visible{outline:2px solid var(--mint-deep);outline-offset:2px;}
/* 同意与按钮 */
.agree{display:flex;align-items:center;gap:10px;margin:26px 0 18px;font-size:13px;color:var(--muted);}
.agree input{
  appearance:none;width:20px;height:20px;flex:none;border:1.5px solid var(--mint);
  border-radius:6px;background:#ffffff;position:relative;cursor:pointer;
  transition:background .16s ease,border-color .16s ease;
}
.agree input:checked{background:var(--mint-deep);border-color:var(--mint-deep);}
.agree input:checked::after{content:"✓";position:absolute;left:0;right:0;top:-1px;text-align:center;color:#ffffff;font-size:14px;}
.agree a{color:var(--mint-deep);text-decoration:none;border-bottom:1px dashed var(--mint);}
.go{
  width:100%;height:54px;border:none;border-radius:999px;
  background:var(--pink-deep);color:#ffffff;
  font:inherit;font-size:17px;font-weight:700;letter-spacing:6px;text-indent:6px;
  cursor:pointer;
  box-shadow:0 10px 22px rgba(224,120,143,.35);
  transition:background .18s ease,transform .18s ease,box-shadow .18s ease;
}
.go:hover:not(:disabled){background:var(--pink);color:#7c3247;transform:translateY(-2px);}
.go:active:not(:disabled){transform:translateY(0);}
.go:disabled{background:#e9dfc9;color:#b3a68e;box-shadow:none;cursor:not-allowed;}
.go:focus-visible{outline:3px solid var(--mint-deep);outline-offset:3px;}
.have{margin-top:22px;text-align:center;font-size:13.5px;color:var(--muted);}
.have a{color:var(--mint-deep);font-weight:700;text-decoration:none;border-bottom:2px solid var(--mint);}
.have a:hover{color:var(--pink-deep);border-color:var(--pink-deep);}
.foot{margin-top:26px;font-size:12px;letter-spacing:3px;color:#c0ad8d;}
/* 成功态 */
.done{text-align:center;padding:22px 0 8px;}
.done svg{width:96px;height:96px;}
.done h2{font-size:26px;font-weight:800;letter-spacing:3px;margin:12px 0 8px;color:var(--ink);}
.done p{font-size:14px;color:var(--muted);margin-bottom:22px;letter-spacing:1px;}
.done .again{background:none;border:none;font:inherit;font-size:13px;color:var(--mint-deep);cursor:pointer;border-bottom:1px dashed var(--mint);padding:2px;}
@media (max-width:768px){
  body{padding:28px 14px;}
  .sticker{display:none;}
  .card{padding:38px 22px 30px;}
  h1{font-size:26px;}
  .chip{width:calc(50% - 6px);}
  .meter i{width:40px;}
}
@media (prefers-reduced-motion: reduce){
  .sticker,.chip{animation:none !important;transition:none !important;}
  .go,.field input,.agree input{transition-duration:.01ms !important;}
}
</style>
</head>
<body>
<svg class="sticker st-tulip" viewBox="0 0 24 24" aria-hidden="true">
  <path d="M5 9c0-3.4 2.4-4.6 7-4.6S19 5.6 19 9v4.6c0 3.2-3.2 5-7 5s-7-1.8-7-5V9z" fill="#f4a9b8"></path>
  <path d="M12 18.6V22" stroke="#4e9c74" stroke-width="1.4" fill="none" stroke-linecap="round"></path>
  <path d="M12 20.4c-2.4.2-3.7-.9-4.6-2.3 1.9-.4 3.5.2 4.6 2.3z" fill="#8fc7a3"></path>
</svg>
<svg class="sticker st-cloud" viewBox="0 0 24 24" aria-hidden="true">
  <path d="M7.5 17.5a4.2 4.2 0 1 1 .5-8.4 5.2 5.2 0 0 1 9.8 1.2 3.6 3.6 0 0 1-.6 7.2h-9.7z" fill="#ffffff" stroke="#8fc7a3" stroke-width="1.2"></path>
</svg>
<svg class="sticker st-star" viewBox="0 0 24 24" aria-hidden="true">
  <polygon points="12,2.6 14.6,9 21.4,9.4 16.2,13.6 18,20.4 12,16.6 6,20.4 7.8,13.6 2.6,9.4 9.4,9" fill="#ffd98e" stroke="#e0a23c" stroke-width="0.6"></polygon>
</svg>
<svg class="sticker st-sprout" viewBox="0 0 24 24" aria-hidden="true">
  <path d="M12 21v-8" stroke="#4e9c74" stroke-width="1.6" fill="none" stroke-linecap="round"></path>
  <path d="M12 13C12 8 8.6 5.6 4.4 5.2 4 9.6 7 12.8 12 13z" fill="#8fc7a3"></path>
  <path d="M12 13c.4-4.4 3.6-6.6 7.6-6.8.2 4-2.8 6.6-7.6 6.8z" fill="#4e9c74"></path>
</svg>

<main class="page">
  <div class="card">
    <span class="tape tape-l" aria-hidden="true"></span>
    <span class="tape tape-r" aria-hidden="true"></span>

    <div id="a2-formArea">
      <p class="kicker">NO.001 · 新的一本</p>
      <h1>开始你的<em>萌芽手账</em></h1>
      <svg class="squig" viewBox="0 0 190 14" aria-hidden="true">
        <path d="M2 9c14-8 26 6 40-1s26 6 40-1 26 6 40-1 26 6 66 0" fill="none" stroke="#f4a9b8" stroke-width="3" stroke-linecap="round"></path>
      </svg>
      <p class="sub">写下第一页，季节会替你保管种子。</p>

      <form id="a2-signupForm" novalidate>
        <div class="field">
          <label for="a2-nick">昵称</label>
          <input id="a2-nick" type="text" autocomplete="nickname" placeholder="想在扉页写哪个名字？">
          <p class="err" id="a2-errNick">扉页不能空着，先写个名字吧</p>
        </div>
        <div class="field">
          <label for="a2-mail">邮箱</label>
          <input id="a2-mail" type="email" autocomplete="email" placeholder="用来给你寄每年的开花通知">
          <p class="err" id="a2-errMail">这个地址好像寄不到信，检查下有没有 @</p>
        </div>
        <div class="field">
          <label for="a2-pwd">密码</label>
          <input id="a2-pwd" type="password" autocomplete="new-password" placeholder="八位以上，别让小猫猜到">
          <div class="meter" aria-hidden="true">
            <i id="a2-bar1"></i><i id="a2-bar2"></i><i id="a2-bar3"></i>
            <span class="meter-txt" id="a2-meterTxt">土还没浇水</span>
          </div>
          <p class="err" id="a2-errPwd">密码少于八位，种子睡不醒</p>
        </div>

        <p class="pick-h">选一枚开册贴纸</p>
        <div class="chips" role="group" aria-label="开册贴纸">
          <button type="button" class="chip on" data-sticker="郁金香">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9c0-3.4 2.4-4.6 7-4.6S19 5.6 19 9v4.6c0 3.2-3.2 5-7 5s-7-1.8-7-5V9z" fill="#f4a9b8"></path><path d="M12 18.6V22" stroke="#4e9c74" stroke-width="1.4" fill="none" stroke-linecap="round"></path></svg>
            郁金香
          </button>
          <button type="button" class="chip" data-sticker="打盹云">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 17.5a4.2 4.2 0 1 1 .5-8.4 5.2 5.2 0 0 1 9.8 1.2 3.6 3.6 0 0 1-.6 7.2h-9.7z" fill="#ffffff" stroke="#8fc7a3" stroke-width="1.4"></path></svg>
            打盹云
          </button>
          <button type="button" class="chip" data-sticker="小太阳">
            <svg viewBox="0 0 24 24" aria-hidden="true"><polygon points="12,2.6 14.6,9 21.4,9.4 16.2,13.6 18,20.4 12,16.6 6,20.4 7.8,13.6 2.6,9.4 9.4,9" fill="#ffd98e" stroke="#e0a23c" stroke-width="0.6"></polygon></svg>
            小太阳
          </button>
          <button type="button" class="chip" data-sticker="双叶芽">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21v-8" stroke="#4e9c74" stroke-width="1.6" fill="none" stroke-linecap="round"></path><path d="M12 13C12 8 8.6 5.6 4.4 5.2 4 9.6 7 12.8 12 13z" fill="#8fc7a3"></path><path d="M12 13c.4-4.4 3.6-6.6 7.6-6.8.2 4-2.8 6.6-7.6 6.8z" fill="#4e9c74"></path></svg>
            双叶芽
          </button>
        </div>

        <label class="agree">
          <input type="checkbox" id="a2-agree">
          <span>我同意<a href="#" onclick="return false">《萌芽公约》</a>和<a href="#" onclick="return false">《种子存放规则》</a></span>
        </label>

        <button type="submit" class="go" id="a2-go" disabled>注册并开始写</button>
      </form>

      <p class="have">已经有手账了？<a href="#" onclick="return false">翻回上一本 · 去登录</a></p>
    </div>

    <div class="done" id="a2-done" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M5 9c0-3.4 2.4-4.6 7-4.6S19 5.6 19 9v4.6c0 3.2-3.2 5-7 5s-7-1.8-7-5V9z" fill="#f4a9b8"></path>
        <path d="M12 18.6V22" stroke="#4e9c74" stroke-width="1.4" fill="none" stroke-linecap="round"></path>
        <path d="M12 20.4c-2.4.2-3.7-.9-4.6-2.3 1.9-.4 3.5.2 4.6 2.3z" fill="#8fc7a3"></path>
      </svg>
      <h2>手账已立</h2>
      <p id="a2-doneTxt">「郁金香」贴纸已贴上扉页，第一页在等你落笔。</p>
      <button type="button" class="again" id="a2-again">翻回注册页看看</button>
    </div>
  </div>
  <p class="foot">萌芽手账 · 把日子过成图鉴 · 客服藏在第 42 页</p>
</main>

<script>
(function () {
  var form = document.getElementById('a2-signupForm');
  var nick = document.getElementById('a2-nick');
  var mail = document.getElementById('a2-mail');
  var pwd = document.getElementById('a2-pwd');
  var errNick = document.getElementById('a2-errNick');
  var errMail = document.getElementById('a2-errMail');
  var errPwd = document.getElementById('a2-errPwd');
  var bar1 = document.getElementById('a2-bar1');
  var bar2 = document.getElementById('a2-bar2');
  var bar3 = document.getElementById('a2-bar3');
  var meterTxt = document.getElementById('a2-meterTxt');
  var agree = document.getElementById('a2-agree');
  var go = document.getElementById('a2-go');
  var formArea = document.getElementById('a2-formArea');
  var done = document.getElementById('a2-done');
  var doneTxt = document.getElementById('a2-doneTxt');
  var again = document.getElementById('a2-again');
  var chips = document.querySelectorAll('.chip');
  var picked = '郁金香';

  /* 贴纸单选 */
  chips.forEach(function (chip) {
    chip.addEventListener('click', function () {
      chips.forEach(function (c) { c.classList.remove('on'); });
      chip.classList.add('on');
      picked = chip.getAttribute('data-sticker');
    });
  });

  /* 密码湿度 */
  pwd.addEventListener('input', function () {
    var v = pwd.value;
    var kinds = 0;
    if (/[a-z]/.test(v)) { kinds = kinds + 1; }
    if (/[A-Z\u4e00-\u9fa5]/.test(v)) { kinds = kinds + 1; }
    if (/[0-9]/.test(v)) { kinds = kinds + 1; }
    if (/[^a-zA-Z0-9\u4e00-\u9fa5]/.test(v)) { kinds = kinds + 1; }
    var level = 0;
    if (v.length >= 8) { level = 1; }
    if (v.length >= 8 && kinds >= 2) { level = 2; }
    if (v.length >= 10 && kinds >= 3) { level = 3; }
    if (v.length > 0 && v.length < 8) { level = 1; }
    bar1.className = level >= 1 ? 'on1' : '';
    bar2.className = level >= 2 ? 'on2' : '';
    bar3.className = level >= 3 ? 'on3' : '';
    if (v.length === 0) { meterTxt.textContent = '土还没浇水'; }
    else if (level === 1) { meterTxt.textContent = '土有点干'; }
    else if (level === 2) { meterTxt.textContent = '湿润刚好'; }
    else { meterTxt.textContent = '雨来了，芽很壮'; }
    if (v.length >= 8) { errPwd.classList.remove('show'); }
  });

  /* 公约门控 */
  agree.addEventListener('change', function () {
    go.disabled = !agree.checked;
  });

  nick.addEventListener('input', function () {
    if (nick.value.trim()) { errNick.classList.remove('show'); }
  });
  mail.addEventListener('input', function () {
    if (mail.value.indexOf('@') > 0) { errMail.classList.remove('show'); }
  });

  /* 提交 */
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var ok = true;
    if (!nick.value.trim()) { errNick.classList.add('show'); ok = false; }
    if (mail.value.indexOf('@') <= 0) { errMail.classList.add('show'); ok = false; }
    if (pwd.value.length < 8) { errPwd.classList.add('show'); ok = false; }
    if (!ok) { return; }
    doneTxt.textContent = '「' + picked + '」已贴上扉页，第一页在等你落笔。';
    formArea.hidden = true;
    done.hidden = false;
  });

  again.addEventListener('click', function () {
    done.hidden = true;
    formArea.hidden = false;
  });
})();
</script>
</body>
</html>
