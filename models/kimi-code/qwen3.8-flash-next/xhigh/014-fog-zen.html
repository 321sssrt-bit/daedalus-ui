<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>雾山选物 · 没有找到</title>
<style>
  :root{
    --paper:#f2f2f0;
    --fog:#e8e8e6;
    --fog-deep:#dcdcd8;
    --line:#d5d5d1;
    --ink:#5a5c5e;
    --muted:#9b9d9a;
    --moss:#7a8b6f;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none!important}
  html,body{min-height:100%}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Songti SC","STSong","SimSun",Georgia,serif;
    display:flex;flex-direction:column;min-height:100vh;
    padding:34px 40px 0;
  }
  ::selection{background:var(--moss);color:var(--paper)}

  /* ── 顶栏：只剩一个词和一条搜索线 ── */
  header{display:flex;flex-direction:column;align-items:center;gap:26px}
  .brand{font-size:15px;letter-spacing:14px;color:var(--ink);padding-left:14px}
  .qwrap{width:560px;max-width:100%}
  .qbar{display:flex;align-items:baseline;border-bottom:1px solid var(--ink);padding-bottom:9px}
  .qbar input{
    flex:1;min-width:0;border:0;background:transparent;outline:none;
    font:inherit;font-size:16px;letter-spacing:3px;color:var(--ink);
  }
  .qbar input::placeholder{color:var(--muted);letter-spacing:3px}
  .qbtn{
    font:inherit;font-size:13px;letter-spacing:4px;color:var(--muted);
    background:transparent;border:0;cursor:pointer;padding:2px 0 2px 18px;
    transition:color .2s ease;
  }
  .qbtn:hover{color:var(--moss)}
  .qstate{margin-top:10px;font-size:12px;letter-spacing:2px;color:var(--muted);text-align:right}
  .qstate b{font-weight:400;color:var(--moss)}

  /* ── 主区：大留白，一条矮栏 ── */
  main{
    position:relative;flex:1;width:100%;max-width:980px;margin:0 auto;
    display:flex;flex-direction:column;align-items:center;
    padding:118px 24px 150px;text-align:center;overflow:hidden;
  }
  .lowbar{width:280px;height:8px;background:var(--fog-deep);position:relative;margin-bottom:44px}
  .lowbar::after{content:"";position:absolute;left:0;top:0;bottom:0;width:34px;background:var(--moss)}
  body.found .lowbar::after{width:132px;transition:width .5s ease}

  h1{font-size:21px;font-weight:400;letter-spacing:4px;line-height:2;margin-bottom:14px}
  h1 em{font-style:normal;color:var(--muted)}
  h1 .hit{font-style:normal;color:var(--moss);letter-spacing:3px}
  .sub{font-size:13.5px;letter-spacing:3px;color:var(--muted);line-height:2;margin-bottom:58px}

  .sug-label{font-size:12px;letter-spacing:6px;color:var(--muted);margin-bottom:18px}
  ul.sugs{list-style:none;display:flex;flex-direction:column;gap:2px;width:420px;max-width:100%}
  .sugs button{
    font:inherit;font-size:14px;letter-spacing:2px;color:var(--ink);
    background:var(--fog);border:0;padding:13px 22px;cursor:pointer;text-align:left;
    display:flex;justify-content:space-between;align-items:baseline;gap:14px;
    transition:background .2s ease,color .2s ease,box-shadow .2s ease;
  }
  .sugs button i{font-style:normal;font-size:12px;letter-spacing:2px;color:var(--muted)}
  .sugs button:hover{background:var(--paper);color:var(--moss);box-shadow:inset 3px 0 0 var(--moss)}
  .sugs button:hover i{color:var(--moss)}
  .sugs button:focus-visible{outline:1px dashed var(--moss);outline-offset:2px}
  .hint{margin-top:26px;font-size:12px;letter-spacing:3px;color:var(--muted)}

  /* ── 灰调远山 ── */
  .hills{position:absolute;left:0;right:0;bottom:0;width:100%;height:170px;display:block}
  .hill-far{fill:var(--fog-deep)}
  .hill-near{fill:var(--line)}
  .hill-far,.hill-near{animation:drift 46s ease-in-out infinite alternate}
  .hill-near{animation-duration:58s;animation-direction:alternate-reverse}
  @keyframes drift{from{transform:translateX(-14px)}to{transform:translateX(14px)}}

  footer{padding:0 0 26px;text-align:center;font-size:11px;letter-spacing:4px;color:var(--muted)}

  @media (max-width:768px){
    body{padding:26px 20px 0}
    main{padding:76px 8px 130px}
    .qwrap{width:100%}
    .lowbar{width:210px}
    ul.sugs{width:100%}
    h1{letter-spacing:2px}
  }
  @media (prefers-reduced-motion: reduce){
    *{animation:none!important;transition:none!important}
    .hills{visibility:visible}
  }
</style>
</head>
<body>
<header>
  <div class="brand">雾山选物</div>
  <div class="qwrap">
    <form class="qbar" id="fz-form" role="search">
      <input id="fz-input" type="text" value="雪夜 保温 杯" aria-label="搜索词" autocomplete="off">
      <button class="qbtn" type="submit">再找一次</button>
    </form>
    <p class="qstate" id="fz-state">第 1 次搜索 · 用词「<b>雪夜 保温 杯</b>」</p>
  </div>
</header>

<main>
  <div class="lowbar" aria-hidden="true"></div>
  <h1 id="fz-title">雾太浓，没有寻到<em>「雪夜 保温 杯」</em></h1>
  <p class="sub" id="fz-sub">三个词一起进山，雾就散了不开了。把条件放轻一点。</p>

  <p class="sug-label">换 个 搜 法</p>
  <ul class="sugs" id="fz-sugs">
    <li><button type="button" data-term="保温杯">去掉「雪夜」，只搜「保温杯」<i>约 6 处</i></button></li>
    <li><button type="button" data-term="夜巡 保温杯">换成「夜巡 保温杯」<i>约 3 处</i></button></li>
    <li><button type="button" data-term="饮具 保温">改搜类目「饮具 · 保温」<i>约 12 处</i></button></li>
    <li><button type="button" data-term="焖茶壶">换个说法「焖茶壶」<i>约 4 处</i></button></li>
  </ul>
  <p class="hint">一次只留一个形容。雾会散的。</p>

  <svg class="hills" viewBox="0 0 980 170" preserveAspectRatio="none" aria-hidden="true">
    <path class="hill-far" d="M-40 170 L120 74 L250 128 L410 40 L560 118 L700 66 L860 126 L1020 82 L1020 170 Z"></path>
    <path class="hill-near" d="M-40 170 L90 118 L240 150 L430 96 L620 142 L790 108 L980 148 L1020 170 Z"></path>
  </svg>
</main>

<footer>雾山选物 · 每一页只放必要的话</footer>

<script>
/* 空态页：改搜建议可点，搜索线与结果文案随之改写 */
var FZ_HITS = {"保温杯":6, "夜巡 保温杯":3, "饮具 保温":12, "焖茶壶":4};
var fzRound = 1;
function fzSearch(term){
  term = String(term || "").trim();
  if(!term){ return; }
  fzRound += 1;
  document.getElementById("fz-input").value = term;
  var hits = Object.prototype.hasOwnProperty.call(FZ_HITS, term) ? FZ_HITS[term] : 0;
  document.getElementById("fz-state").innerHTML =
    "第 " + fzRound + " 次搜索 · 用词「<b>" + term + "</b>」";
  var title = document.getElementById("fz-title");
  var sub = document.getElementById("fz-sub");
  if(hits > 0){
    document.body.classList.add("found");
    title.innerHTML = "雾散了些 · 「<span class=\"hit\">" + term + "</span>」寻到 <span class=\"hit\">" + hits + "</span> 处所在";
    sub.textContent = "要的东西在第一页里。嫌多的话，再减一个词。";
  }else{
    document.body.classList.remove("found");
    title.innerHTML = "雾太浓，没有寻到<em>「" + term + "」</em>";
    sub.textContent = "三个词一起进山，雾就散了不开了。把条件放轻一点。";
  }
}

document.getElementById("fz-form").addEventListener("submit", function(e){
  e.preventDefault();
  fzSearch(document.getElementById("fz-input").value);
});

document.getElementById("fz-sugs").addEventListener("click", function(e){
  var b = e.target.closest("[data-term]");
  if(b){ fzSearch(b.dataset.term); }
});
</script>
</body>
</html>
