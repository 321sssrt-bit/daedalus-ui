<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>找回通行 · 雨山账号中心</title>
<style>
:root{
  --page:#eef4f1;
  --celadon:#dfe9e4;
  --surface:#f7faf8;
  --celadon-deep:#9fc2b3;
  --rain:#5f7f74;
  --ink:#33403a;
  --muted:#7c8d85;
  --line:#c9dbd2;
  --mist:#e6efea;
  --alert:#a8695c;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  background:var(--page);
  color:var(--ink);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  font-weight:300;
  -webkit-font-smoothing:antialiased;
  display:flex;
  flex-direction:column;
  align-items:center;
}
.rainfield{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
}
.rainfield svg{width:100%;height:100%;display:block;}
.shell{
  position:relative;
  z-index:1;
  width:100%;
  max-width:460px;
  padding:96px 24px 64px;
  display:flex;
  flex-direction:column;
  min-height:100vh;
}
.brand{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:88px;
}
.brand-mark{width:26px;height:26px;flex:none;}
.brand-name{
  font-size:13px;
  letter-spacing:0.42em;
  color:var(--rain);
  font-weight:400;
}
h1{
  font-size:30px;
  font-weight:300;
  letter-spacing:0.28em;
  line-height:1.5;
  margin-bottom:14px;
}
.lede{
  font-size:14px;
  line-height:2;
  color:var(--muted);
  letter-spacing:0.06em;
  margin-bottom:52px;
}
.field{margin-bottom:30px;}
.field label{
  display:block;
  font-size:12px;
  letter-spacing:0.3em;
  color:var(--rain);
  margin-bottom:12px;
}
.field .input-line{
  display:block;
  width:100%;
  border:none;
  border-bottom:1px solid var(--line);
  background:transparent;
  font:inherit;
  font-size:16px;
  letter-spacing:0.08em;
  color:var(--ink);
  padding:10px 2px 12px;
  outline:none;
  transition:border-color 240ms ease;
}
.field .input-line:focus{border-bottom-color:var(--celadon-deep);}
.field .input-line::placeholder{color:#a9b8b1;letter-spacing:0.06em;}
.hint{
  display:block;
  margin-top:10px;
  font-size:12px;
  letter-spacing:0.05em;
  color:var(--alert);
  min-height:18px;
}
.btn-send{
  width:100%;
  margin-top:10px;
  padding:16px 0;
  border:none;
  border-radius:2px;
  background:var(--celadon-deep);
  color:#f7faf8;
  font:inherit;
  font-size:15px;
  letter-spacing:0.5em;
  text-indent:0.5em;
  cursor:pointer;
  transition:background-color 240ms ease,transform 160ms ease;
}
.btn-send:hover{background:var(--rain);}
.btn-send:active{transform:translateY(1px);}
.btn-send:disabled{background:var(--mist);color:var(--muted);cursor:default;}
.foot{
  margin-top:auto;
  padding-top:96px;
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  font-size:13px;
  color:var(--muted);
  letter-spacing:0.08em;
}
.back-login{
  background:none;
  border:none;
  font:inherit;
  font-size:13px;
  letter-spacing:0.08em;
  color:var(--rain);
  cursor:pointer;
  border-bottom:1px solid var(--celadon-deep);
  padding:2px 0;
}
.back-login:hover{color:var(--ink);}
/* 等待态 */
.sent-pane{display:none;flex-direction:column;}
.sent-pane.show{display:flex;}
.form-pane.hide{display:none;}
.breather{
  width:56px;height:56px;
  margin:6px auto 40px;
  border-radius:50%;
  background:radial-gradient(circle at 50% 42%,var(--celadon-deep) 0%,var(--celadon) 70%,var(--mist) 100%);
  animation:breathe 3.2s ease-in-out infinite;
}
@keyframes breathe{
  0%,100%{transform:scale(1);opacity:0.82;}
  50%{transform:scale(1.14);opacity:1;}
}
.sent-title{
  text-align:center;
  font-size:19px;
  font-weight:300;
  letter-spacing:0.24em;
  text-indent:0.24em;
  margin-bottom:14px;
}
.sent-detail{
  text-align:center;
  font-size:13px;
  color:var(--muted);
  letter-spacing:0.08em;
  line-height:2.1;
  margin-bottom:44px;
}
.sent-detail b{
  color:var(--rain);
  font-weight:400;
  font-variant-numeric:tabular-nums;
}
.count-row{
  text-align:center;
  font-size:13px;
  letter-spacing:0.12em;
  color:var(--muted);
  margin-bottom:30px;
  font-variant-numeric:tabular-nums;
}
.count-row b{color:var(--ink);font-weight:400;}
.resend{
  width:100%;
  padding:14px 0;
  border:1px solid var(--celadon-deep);
  border-radius:2px;
  background:transparent;
  color:var(--rain);
  font:inherit;
  font-size:14px;
  letter-spacing:0.42em;
  text-indent:0.42em;
  cursor:pointer;
  transition:background-color 240ms ease,color 240ms ease;
}
.resend:hover:not(:disabled){background:var(--celadon);color:var(--ink);}
.resend:disabled{border-color:var(--line);color:#b3c1ba;cursor:default;}
.edit-way{
  display:block;
  margin:22px auto 0;
  background:none;
  border:none;
  font:inherit;
  font-size:13px;
  color:var(--muted);
  letter-spacing:0.1em;
  cursor:pointer;
  border-bottom:1px dashed var(--line);
  padding:2px 1px;
}
.edit-way:hover{color:var(--rain);}
.toast{
  position:fixed;
  left:50%;
  bottom:44px;
  transform:translate(-50%,14px);
  background:var(--ink);
  color:var(--surface);
  font-size:13px;
  letter-spacing:0.14em;
  padding:12px 26px;
  border-radius:2px;
  opacity:0;
  pointer-events:none;
  transition:opacity 320ms ease,transform 320ms ease;
  z-index:9;
}
.toast.show{opacity:0.94;transform:translate(-50%,0);}
@media (max-width:768px){
  .shell{padding:56px 22px 48px;}
  .brand{margin-bottom:56px;}
  h1{font-size:25px;}
  .lede{margin-bottom:38px;}
  .foot{padding-top:64px;flex-direction:column;gap:18px;}
}
@media (prefers-reduced-motion:reduce){
  .breather{animation:none;opacity:0.95;}
  .toast,.btn-send,.resend,.input-line{transition:none;}
}
</style>
</head>
<body>
<div class="rainfield" aria-hidden="true">
  <svg viewBox="0 0 1280 800" preserveAspectRatio="xMidYMid slice" role="presentation" focusable="false">
    <g stroke="#c9dbd2" stroke-width="1" opacity="0.55">
      <line x1="142" y1="60" x2="132" y2="212"></line>
      <line x1="305" y1="520" x2="296" y2="688"></line>
      <line x1="1108" y1="90" x2="1099" y2="244"></line>
      <line x1="1196" y1="470" x2="1187" y2="620"></line>
      <line x1="86" y1="560" x2="78" y2="676"></line>
      <line x1="1042" y1="640" x2="1034" y2="762"></line>
    </g>
    <path d="M0 700 Q 320 664 640 690 T 1280 682 L1280 800 L0 800 Z" fill="#dfe9e4" opacity="0.6"></path>
  </svg>
</div>

<main class="shell">
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 26 26" role="img" aria-label="雨山徽记">
      <path d="M3 18 Q13 6 23 18" fill="none" stroke="#5f7f74" stroke-width="1.4" stroke-linecap="round"></path>
      <path d="M7 22 Q13 15 19 22" fill="none" stroke="#9fc2b3" stroke-width="1.4" stroke-linecap="round"></path>
    </svg>
    <span class="brand-name">雨山账号中心</span>
  </div>

  <section class="form-pane" id="005-form-pane">
    <h1>找回通行</h1>
    <p class="lede">别急。留下注册时用的邮箱或手机号，<br>验证信会像一场小雨，安静地落过去。</p>

    <div class="field">
      <label for="005-contact">接收方式</label>
      <input class="input-line" id="005-contact" type="text" autocomplete="off"
             placeholder="邮箱，或 11 位手机号">
      <span class="hint" id="005-hint" aria-live="polite"></span>
    </div>

    <button class="btn-send" id="005-send" type="button">发送验证信</button>

    <div class="foot">
      <span>雨山 · 通行保障</span>
      <button class="back-login" id="005-back1" type="button">想起来了，返回登录</button>
    </div>
  </section>

  <section class="sent-pane" id="005-sent-pane" aria-live="polite">
    <h1>找回通行</h1>
    <div class="breather" aria-hidden="true"></div>
    <p class="sent-title">验证信已送出</p>
    <p class="sent-detail" id="005-sent-detail">正在向 <b>—</b> 投递<br>一分钟内送达，若未收到请查收檐下（垃圾箱）</p>
    <p class="count-row"><b id="005-count">60</b> 秒后可重新送出</p>
    <button class="resend" id="005-resend" type="button" disabled>再送一次</button>
    <button class="edit-way" id="005-edit" type="button">接收方式不对？改一个</button>
    <div class="foot">
      <span>雨山 · 通行保障</span>
      <button class="back-login" id="005-back2" type="button">想起来了，返回登录</button>
    </div>
  </section>
</main>

<div class="toast" id="005-toast" role="status"></div>

<script>
(function(){
  "use strict";
  var input=document.getElementById("005-contact");
  var hint=document.getElementById("005-hint");
  var send=document.getElementById("005-send");
  var formPane=document.getElementById("005-form-pane");
  var sentPane=document.getElementById("005-sent-pane");
  var detail=document.getElementById("005-sent-detail");
  var countEl=document.getElementById("005-count");
  var resend=document.getElementById("005-resend");
  var toast=document.getElementById("005-toast");
  var timer=null;

  function looksValid(v){
    if(v.indexOf("@")>0&&v.length>=6){return true;}
    return /^1\d{10}$/.test(v);
  }
  function mask(v){
    if(v.indexOf("@")>0){
      var at=v.indexOf("@");
      var head=v.slice(0,Math.min(at,3));
      return head+"***"+v.slice(at);
    }
    return v.slice(0,3)+" **** "+v.slice(7);
  }
  function showToast(msg){
    toast.textContent=msg;
    toast.classList.add("show");
    setTimeout(function(){toast.classList.remove("show");},2600);
  }
  function startCountdown(){
    var left=60;
    countEl.textContent=left;
    resend.disabled=true;
    if(timer){clearInterval(timer);}
    timer=setInterval(function(){
      left-=1;
      countEl.textContent=left;
      if(left<=0){
        clearInterval(timer);
        timer=null;
        resend.disabled=false;
      }
    },1000);
  }
  function doSend(){
    var v=(input.value||"").trim();
    if(!looksValid(v)){
      hint.textContent="格式像还差一点：邮箱需含 @，手机号需 11 位。";
      input.style.borderBottomColor="#a8695c";
      return;
    }
    hint.textContent="";
    input.style.borderBottomColor="";
    detail.innerHTML="正在向 <b>"+mask(v)+"</b> 投递<br>一分钟内送达，若未收到请查收檐下（垃圾箱）";
    formPane.classList.add("hide");
    sentPane.classList.add("show");
    startCountdown();
  }

  input.addEventListener("input",function(){
    hint.textContent="";
    input.style.borderBottomColor="";
  });
  input.addEventListener("keydown",function(ev){
    if(ev.key==="Enter"){doSend();}
  });
  send.addEventListener("click",doSend);
  resend.addEventListener("click",function(){
    if(resend.disabled){return;}
    startCountdown();
    showToast("已重新送出一封验证信");
  });
  document.getElementById("005-edit").addEventListener("click",function(){
    sentPane.classList.remove("show");
    formPane.classList.remove("hide");
    if(timer){clearInterval(timer);timer=null;}
    input.focus();
  });
  function back(){showToast("正在带你返回登录页…");}
  document.getElementById("005-back1").addEventListener("click",back);
  document.getElementById("005-back2").addEventListener("click",back);
})();
</script>
</body>
</html>
