<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NORDVANN 北岸家居 · 常驻款选购</title>
<style>
:root{
  --wood:#e8dfd2;
  --paper:#f7f2ea;
  --paper-2:#efe7db;
  --white:#fcfaf6;
  --ink:#2e2a25;
  --ink-2:#5b5348;
  --muted:#8d8375;
  --line:#d8ccba;
  --line-2:#e5dccd;
  --fjord:#39586e;
  --fjord-deep:#2a4356;
  --fjord-soft:#dde5e9;
  --moss:#7f8c6c;
  --moss-soft:#e4e8dd;
  --clay:#a85c3c;
  --clay-soft:#f1e0d6;
  --ui:system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --display:Georgia,"Iowan Old Style","Times New Roman","Songti SC","STSong",serif;
  --r-ctl:3px;
  --r-box:5px;
  --shadow:0 1px 0 rgba(46,42,37,.04),0 10px 26px -22px rgba(46,42,37,.28);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--wood);
  color:var(--ink);
  font:14px/1.66 var(--ui);
  -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
h1,h2,h3,h4,p{margin:0;}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;}
input,textarea,select{font:inherit;color:inherit;}
ol,ul{margin:0;padding:0;list-style:none;}
.mono-latin{font-family:var(--display);}
.lab{
  font-size:11px;
  letter-spacing:.19em;
  text-transform:uppercase;
  color:var(--muted);
  font-weight:600;
}
.hair{height:1px;background:var(--line-2);border:0;}

.site-head{
  position:sticky;
  top:0;
  z-index:30;
  background:var(--wood);
  border-bottom:1px solid var(--line);
}
.head-in{
  max-width:1216px;
  margin:0 auto;
  padding:0 32px;
  height:74px;
  display:flex;
  align-items:center;
  gap:26px;
}
.brand{display:flex;align-items:baseline;gap:11px;}
.brand-mark{
  font-family:var(--display);
  font-size:22px;
  letter-spacing:.16em;
  color:var(--fjord);
}
.brand-sub{font-size:12.5px;color:var(--ink-2);letter-spacing:.1em;}
.head-nav{margin-left:auto;display:flex;align-items:center;gap:24px;}
.head-nav span{font-size:13px;color:var(--muted);}
.head-nav span.on{color:var(--ink);}
.head-cart{
  display:flex;
  align-items:center;
  gap:9px;
  border:1px solid var(--line);
  border-radius:var(--r-ctl);
  padding:7px 13px 7px 11px;
  background:var(--white);
  transition:border-color .16s ease,background .16s ease;
}
.head-cart:hover{border-color:var(--fjord);}
.head-cart svg{display:block;}
.cart-n{
  min-width:20px;
  height:20px;
  padding:0 5px;
  border-radius:10px;
  background:var(--fjord);
  color:var(--white);
  font-size:11.5px;
  line-height:20px;
  text-align:center;
}
.cart-n.pop{animation:pop .34s ease-out;}
.cart-n.zero{background:var(--paper-2);color:var(--muted);}

.stepbar{
  background:var(--paper);
  border-bottom:1px solid var(--line);
}
.stepbar-in{
  max-width:1216px;
  margin:0 auto;
  padding:0 32px;
  height:52px;
  display:flex;
  align-items:center;
  gap:0;
}
.step{
  display:flex;
  align-items:center;
  gap:9px;
  padding-right:34px;
  position:relative;
  white-space:nowrap;
}
.step + .step::before{
  content:"";
  position:absolute;
  left:-19px;
  top:50%;
  width:16px;
  height:1px;
  background:var(--line);
}
.step i{
  width:19px;
  height:19px;
  border:1px solid var(--line);
  border-radius:50%;
  font-family:var(--display);
  font-size:11px;
  font-style:normal;
  line-height:17px;
  text-align:center;
  color:var(--muted);
  background:var(--white);
}
.step s{text-decoration:none;font-size:12.5px;color:var(--muted);letter-spacing:.04em;}
.step[data-state="now"] i{border-color:var(--fjord);background:var(--fjord);color:var(--white);}
.step[data-state="now"] s{color:var(--ink);}
.step[data-state="done"] i{border-color:var(--moss);color:var(--moss);}
.step[data-state="done"] s{color:var(--ink-2);}
.step-tag{margin-left:auto;font-size:11.5px;color:var(--muted);letter-spacing:.06em;}

.shell{max-width:1216px;margin:0 auto;padding:0 32px 64px;}
.stage{
  display:grid;
  grid-template-columns:752px 360px;
  gap:40px;
  align-items:start;
  padding-top:30px;
}

.view{animation:rise .26s ease-out both;}

.hero{
  position:relative;
  border:1px solid var(--line);
  border-radius:var(--r-box);
  background:var(--paper);
  overflow:hidden;
}
.hero-in{position:relative;padding:34px 36px 32px;z-index:2;max-width:430px;}
.hero h1{
  font-family:var(--display);
  font-size:35px;
  line-height:1.24;
  font-weight:400;
  letter-spacing:.01em;
  margin:12px 0 10px;
}
.hero h1 em{font-style:normal;color:var(--fjord);}
.hero p{font-size:13.5px;color:var(--ink-2);max-width:380px;}
.hero-meta{
  margin-top:20px;
  padding-top:16px;
  border-top:1px solid var(--line-2);
  display:flex;
  gap:28px;
}
.hero-meta div{font-size:12px;color:var(--muted);}
.hero-meta b{display:block;font-family:var(--display);font-size:18px;color:var(--ink);font-weight:400;letter-spacing:.02em;}
.hero-art{position:absolute;right:-26px;top:0;width:474px;height:100%;z-index:1;pointer-events:none;}

.filters{
  display:flex;
  align-items:center;
  gap:8px;
  margin:26px 0 16px;
}
.filter{
  border:1px solid var(--line);
  border-radius:var(--r-ctl);
  background:var(--white);
  padding:6px 14px;
  font-size:12.5px;
  color:var(--ink-2);
  transition:border-color .16s ease,color .16s ease,background .16s ease;
}
.filter:hover{border-color:var(--fjord);color:var(--fjord);}
.filter[aria-pressed="true"]{
  background:var(--fjord);
  border-color:var(--fjord);
  color:var(--white);
}
.filters .count{margin-left:auto;font-size:12px;color:var(--muted);}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:22px;
}
.card{
  position:relative;
  border:1px solid var(--line);
  border-radius:var(--r-box);
  background:var(--white);
  overflow:hidden;
  transition:border-color .18s ease,transform .18s ease,box-shadow .18s ease;
}
.card:hover{border-color:var(--fjord);transform:translateY(-2px);box-shadow:var(--shadow);}
.card-art{
  height:172px;
  background:var(--paper);
  border-bottom:1px solid var(--line-2);
  position:relative;
  overflow:hidden;
}
.card-art svg{position:absolute;left:0;top:0;width:100%;height:100%;}
.card-flag{
  position:absolute;
  left:12px;
  top:12px;
  z-index:2;
  font-size:11px;
  letter-spacing:.1em;
  color:var(--fjord);
  background:rgba(252,250,246,.9);
  border:1px solid var(--fjord-soft);
  border-radius:var(--r-ctl);
  padding:3px 8px;
}
.card-flag.warn{color:var(--clay);border-color:var(--clay);background:var(--clay-soft);}
.card-body{padding:16px 18px 18px;}
.card-body h3{font-size:15.5px;letter-spacing:.02em;}
.card-latin{font-family:var(--display);font-size:11.5px;letter-spacing:.15em;color:var(--muted);}
.card-blurb{margin-top:8px;font-size:12.5px;color:var(--ink-2);min-height:41px;}
.card-foot{
  margin-top:12px;
  padding-top:13px;
  border-top:1px solid var(--line-2);
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:10px;
}
.price-from{font-size:11px;color:var(--muted);letter-spacing:.08em;display:block;}
.price{font-size:19px;letter-spacing:.01em;color:var(--ink);}
.price::before{content:"¥ ";font-family:var(--display);font-size:13px;color:var(--muted);}
.stock-hint{font-size:11.5px;color:var(--moss);letter-spacing:.04em;}
.stock-hint.none{color:var(--clay);}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  border:1px solid var(--fjord);
  border-radius:var(--r-ctl);
  background:var(--fjord);
  color:var(--white);
  padding:11px 22px;
  font-size:13.5px;
  letter-spacing:.06em;
  transition:background .16s ease,border-color .16s ease,transform .16s ease,color .16s ease;
}
.btn:hover{background:var(--fjord-deep);border-color:var(--fjord-deep);transform:translateY(-1px);}
.btn:active{transform:translateY(0);}
.btn:focus-visible{outline:2px solid var(--fjord);outline-offset:2px;}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink-2);}
.btn.ghost:hover{background:var(--white);border-color:var(--fjord);color:var(--fjord);}
.btn.moss{background:var(--moss);border-color:var(--moss);}
.btn.moss:hover{background:#6d7a5b;border-color:#6d7a5b;}
.btn.wide{width:100%;}
.btn.blocked{
  background:transparent;
  border:1px dashed var(--clay);
  color:var(--clay);
  cursor:not-allowed;
}
.btn.blocked:hover{background:var(--clay-soft);border-color:var(--clay);transform:none;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn.tiny{padding:6px 12px;font-size:12px;letter-spacing:.04em;}
.link{
  display:inline-flex;
  align-items:center;
  gap:6px;
  font-size:12.5px;
  color:var(--fjord);
  border-bottom:1px solid var(--fjord-soft);
  padding-bottom:1px;
  transition:border-color .16s ease,color .16s ease;
}
.link:hover{color:var(--fjord-deep);border-color:var(--fjord);}
.detail-top{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:24px;
  padding-bottom:18px;
  border-bottom:1px solid var(--line);
}
.detail-top h2{font-family:var(--display);font-size:29px;font-weight:400;letter-spacing:.01em;margin-top:6px;}
.detail-top .latin{font-family:var(--display);font-size:12px;letter-spacing:.18em;color:var(--muted);}
.detail-tag{
  border:1px solid var(--fjord-soft);
  background:var(--fjord-soft);
  color:var(--fjord);
  border-radius:var(--r-ctl);
  padding:4px 10px;
  font-size:11.5px;
  letter-spacing:.08em;
  white-space:nowrap;
}
.detail-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:28px;
  padding-top:24px;
}
.panel{
  border:1px solid var(--line);
  border-radius:var(--r-box);
  background:var(--white);
}
.panel-head{
  padding:14px 18px;
  border-bottom:1px solid var(--line-2);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}
.panel-head h3{font-size:13.5px;letter-spacing:.06em;}
.panel-body{padding:18px;}
.art-panel{
  background:var(--paper);
  min-height:322px;
  position:relative;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
}
.art-panel svg.big{width:100%;height:322px;display:block;}
.art-cap{
  position:absolute;
  left:18px;
  bottom:14px;
  right:18px;
  display:flex;
  justify-content:space-between;
  font-size:11px;
  letter-spacing:.1em;
  color:var(--muted);
  border-top:1px solid var(--line-2);
  padding-top:10px;
}
.spec-group + .spec-group{margin-top:20px;padding-top:18px;border-top:1px solid var(--line-2);}
.spec-name{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;}
.spec-name b{font-size:13px;font-weight:600;letter-spacing:.04em;}
.spec-name span{font-size:12px;color:var(--muted);}
.swatches{display:flex;flex-wrap:wrap;gap:8px;}
.sw{
  border:1px solid var(--line);
  border-radius:var(--r-ctl);
  background:var(--white);
  padding:8px 13px;
  font-size:12.5px;
  color:var(--ink-2);
  display:flex;
  align-items:center;
  gap:7px;
  transition:border-color .16s ease,color .16s ease,background .16s ease;
}
.sw .chip-dot{width:11px;height:11px;border-radius:50%;border:1px solid rgba(46,42,37,.18);}
.sw:hover:not(.oos){border-color:var(--fjord);color:var(--fjord);}
.sw[aria-pressed="true"]{border-color:var(--fjord);background:var(--fjord-soft);color:var(--fjord);}
.sw.oos{color:var(--muted);background:var(--paper-2);cursor:pointer;border-style:dashed;}
.sw.oos s{text-decoration:none;font-size:11px;color:var(--clay);letter-spacing:.06em;}
.sw.oos[aria-pressed="true"]{border-color:var(--clay);background:var(--clay-soft);color:var(--clay);}

.qty-row{
  margin-top:22px;
  padding-top:18px;
  border-top:1px solid var(--line-2);
  display:flex;
  align-items:center;
  gap:14px;
}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:var(--r-ctl);background:var(--white);overflow:hidden;}
.stepper button{
  width:34px;
  height:34px;
  font-size:16px;
  color:var(--ink-2);
  transition:background .14s ease,color .14s ease;
}
.stepper button:hover:not(:disabled){background:var(--fjord-soft);color:var(--fjord);}
.stepper button:disabled{color:var(--line);cursor:not-allowed;}
.stepper output{
  width:44px;
  text-align:center;
  font-size:14px;
  border-left:1px solid var(--line-2);
  border-right:1px solid var(--line-2);
  line-height:34px;
}
.qty-note{font-size:12px;color:var(--muted);}
.qty-note b{color:var(--ink);font-weight:600;}
.buy-row{
  margin-top:20px;
  display:flex;
  align-items:center;
  gap:14px;
}
.buy-price{margin-right:auto;}
.buy-price .num{font-size:26px;letter-spacing:.01em;}
.buy-price .num::before{content:"¥ ";font-family:var(--display);font-size:16px;color:var(--muted);}
.buy-price small{display:block;font-size:11px;color:var(--muted);letter-spacing:.06em;}

.oos-bar{
  margin-top:18px;
  border:1px solid var(--clay);
  border-left-width:3px;
  border-radius:var(--r-ctl);
  background:var(--clay-soft);
  padding:13px 16px;
  display:flex;
  align-items:flex-start;
  gap:11px;
  animation:rise .2s ease-out both;
}
.oos-bar svg{flex:none;margin-top:2px;}
.oos-bar .t{font-size:13px;color:var(--clay);letter-spacing:.04em;}
.oos-bar .d{font-size:12px;color:var(--ink-2);margin-top:3px;}
.oos-bar .acts{margin-top:9px;display:flex;gap:8px;flex-wrap:wrap;}
.mini{
  border:1px solid var(--clay);
  border-radius:var(--r-ctl);
  padding:5px 11px;
  font-size:12px;
  color:var(--clay);
  background:rgba(252,250,246,.6);
  transition:background .16s ease,transform .16s ease;
}
.mini:hover{background:var(--white);transform:translateY(-1px);}
.mini.mossy{border-color:var(--moss);color:#5f6b4f;}
.mini.ink{border-color:var(--line);color:var(--ink-2);}
.mini.ink:hover{border-color:var(--fjord);color:var(--fjord);}

.trigger-panel{
  margin-top:22px;
  border:1px dashed var(--line);
  border-radius:var(--r-box);
  background:var(--paper-2);
  padding:16px 18px;
  display:flex;
  align-items:center;
  gap:16px;
}
.trigger-panel .txt{flex:1;}
.trigger-panel .txt b{font-size:12.5px;letter-spacing:.06em;display:block;}
.trigger-panel .txt p{font-size:11.5px;color:var(--muted);margin-top:3px;}
.trigger-panel .btns{display:flex;gap:8px;flex-wrap:wrap;}

.cart-panel .line{
  display:grid;
  grid-template-columns:1fr auto;
  gap:4px 14px;
  padding:14px 18px;
  border-bottom:1px solid var(--line-2);
  transition:background .16s ease;
}
.cart-panel .line:hover{background:var(--paper);}
.cart-panel .line.bad{background:var(--clay-soft);}
.line-name{font-size:13.5px;}
.line-spec{font-size:11.5px;color:var(--muted);letter-spacing:.04em;margin-top:2px;}
.line-spec .oos-tag{color:var(--clay);}
.line-right{text-align:right;}
.line-amount{font-size:14px;}
.line-unit{font-size:11px;color:var(--muted);}
.line-ctrl{grid-column:1/-1;display:flex;align-items:center;gap:10px;margin-top:6px;}
.line-ctrl .stepper{transform:scale(.9);transform-origin:left center;}
.line-acts{margin-left:auto;display:flex;gap:8px;}
.cart-empty{padding:34px 18px;text-align:center;}
.cart-empty p{font-size:13px;color:var(--muted);margin-top:12px;}
.cart-empty svg{opacity:.55;}
.totals{padding:16px 18px 18px;background:var(--paper);}
.total-row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-2);padding:3px 0;}
.total-row span:last-child{font-variant-numeric:tabular-nums;}
.total-row.free b{color:var(--moss);font-weight:500;}
.grand{
  margin-top:10px;
  padding-top:12px;
  border-top:1px solid var(--line);
  display:flex;
  align-items:baseline;
  justify-content:space-between;
}
.grand .lab{align-self:center;}
.grand .v{font-size:25px;letter-spacing:.01em;}
.grand .v::before{content:"¥ ";font-family:var(--display);font-size:15px;color:var(--muted);}
.cart-cta{padding:16px 18px 18px;border-top:1px solid var(--line);display:grid;gap:10px;}
.cta-note{font-size:11.5px;color:var(--muted);text-align:center;}
.cta-note.err{color:var(--clay);}

.field{margin-bottom:16px;}
.field label{display:block;font-size:12px;color:var(--ink-2);letter-spacing:.06em;margin-bottom:6px;}
.field input,.field textarea{
  width:100%;
  border:1px solid var(--line);
  border-radius:var(--r-ctl);
  background:var(--white);
  padding:10px 12px;
  font-size:13.5px;
  transition:border-color .16s ease,box-shadow .16s ease;
}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--fjord);box-shadow:0 0 0 3px rgba(57,88,110,.13);}
.field textarea{min-height:66px;resize:vertical;}
.field.err input{border-color:var(--clay);box-shadow:0 0 0 3px rgba(168,92,60,.12);}
.field .tip{font-size:11.5px;color:var(--clay);margin-top:5px;min-height:16px;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;}
.radio-row{display:grid;gap:8px;}
.radio{
  display:flex;
  align-items:center;
  gap:10px;
  border:1px solid var(--line);
  border-radius:var(--r-ctl);
  background:var(--white);
  padding:10px 13px;
  font-size:13px;
  transition:border-color .16s ease,background .16s ease;
}
.radio:hover{border-color:var(--fjord);}
.radio[aria-checked="true"]{border-color:var(--fjord);background:var(--fjord-soft);}
.radio i{
  width:14px;height:14px;border:1px solid var(--line);border-radius:50%;flex:none;
  display:inline-block;position:relative;background:var(--white);
}
.radio[aria-checked="true"] i{border-color:var(--fjord);}
.radio[aria-checked="true"] i::after{
  content:"";position:absolute;inset:3px;border-radius:50%;background:var(--fjord);
}
.radio .p{margin-left:auto;font-size:12.5px;color:var(--ink-2);}

.review-line{
  display:grid;
  grid-template-columns:1fr auto auto;
  gap:2px 16px;
  padding:12px 18px;
  border-bottom:1px solid var(--line-2);
  font-size:13px;
}
.review-line .sp{grid-column:1;font-size:11.5px;color:var(--muted);}
.review-line .qy{grid-column:2;font-size:12px;color:var(--ink-2);align-self:center;}
.review-line .amt{grid-column:3;align-self:center;}
.review-line.bad{background:var(--clay-soft);}
.review-line.bad .nm{color:var(--clay);}
.review-line .sp .stepper{margin-top:4px;}
.block-note{
  margin:14px 18px 0;
  border:1px solid var(--clay);
  border-left-width:3px;
  background:var(--clay-soft);
  border-radius:var(--r-ctl);
  padding:12px 14px;
  font-size:12.5px;
  color:var(--clay);
}
.block-note ol{margin-top:6px;list-style:decimal;padding-left:18px;}
.block-note li{color:var(--ink-2);font-size:12px;padding:1px 0;}

.receipt-wrap{
  border:1px solid var(--line);
  border-radius:var(--r-box);
  background:var(--white);
  overflow:hidden;
}
.receipt-head{
  position:relative;
  background:var(--paper);
  border-bottom:1px solid var(--line);
  padding:30px 32px 26px;
  overflow:hidden;
}
.receipt-head .in{position:relative;z-index:2;max-width:420px;}
.ok-mark{
  width:44px;height:44px;border-radius:50%;
  border:1px solid var(--moss);background:var(--moss-soft);
  display:flex;align-items:center;justify-content:center;
  animation:rise .3s ease-out both;
}
.receipt-head h2{font-family:var(--display);font-size:27px;font-weight:400;margin:14px 0 6px;}
.receipt-head p{font-size:13px;color:var(--ink-2);}
.receipt-no{
  margin-top:16px;padding-top:14px;border-top:1px dashed var(--line);
  display:flex;gap:34px;flex-wrap:wrap;
}
.receipt-no div b{display:block;font-family:var(--display);font-size:16px;font-weight:400;letter-spacing:.06em;}
.receipt-no div span{font-size:11px;color:var(--muted);letter-spacing:.1em;}
.receipt-art{position:absolute;right:-10px;top:-30px;width:340px;height:230px;z-index:1;opacity:.85;}
.rc-row{
  display:grid;grid-template-columns:1fr auto;gap:2px 18px;
  padding:13px 32px;border-bottom:1px solid var(--line-2);font-size:13px;
}
.rc-row .sp{font-size:11.5px;color:var(--muted);}
.rc-row .amt{text-align:right;}
.rc-row .qt{font-size:11.5px;color:var(--muted);text-align:right;}
.rc-totals{padding:16px 32px 20px;background:var(--paper);}
.rc-meta{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);}
.rc-meta div{padding:16px 32px;border-right:1px solid var(--line-2);}
.rc-meta div:last-child{border-right:0;}
.rc-meta b{display:block;font-size:12.5px;font-weight:600;margin-top:5px;}
.rc-meta p{font-size:11.5px;color:var(--muted);}
.receipt-cta{padding:18px 32px 22px;display:flex;gap:12px;align-items:center;}
.receipt-cta .note{font-size:11.5px;color:var(--muted);margin-left:auto;}

.toast{
  position:fixed;
  left:50%;
  bottom:34px;
  transform:translateX(-50%) translateY(12px);
  background:var(--ink);
  color:var(--wood);
  border-radius:var(--r-ctl);
  padding:11px 20px;
  font-size:12.5px;
  letter-spacing:.05em;
  opacity:0;
  pointer-events:none;
  transition:opacity .22s ease,transform .22s ease;
  z-index:60;
  box-shadow:0 14px 30px -18px rgba(46,42,37,.6);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.bad{background:var(--clay);}

.foot{
  border-top:1px solid var(--line);
  margin-top:20px;
}
.foot-in{
  max-width:1216px;margin:0 auto;padding:22px 32px 40px;
  display:flex;gap:18px;align-items:center;
  font-size:11.5px;color:var(--muted);letter-spacing:.05em;
}
.foot-in .dot{width:4px;height:4px;border-radius:50%;background:var(--line);}

@keyframes rise{from{opacity:0;transform:translateY(9px);}to{opacity:1;transform:translateY(0);}}
@keyframes pop{0%{transform:scale(1);}42%{transform:scale(1.32);}100%{transform:scale(1);}}
@keyframes drift{from{transform:translateY(0);}to{transform:translateY(-16px);}}

@media (max-width:1180px){
  .stage{grid-template-columns:1fr;gap:26px;}
  .shell{padding:0 22px 48px;}
  .head-in,.stepbar-in,.foot-in{padding-left:22px;padding-right:22px;}
  .hero-art{width:340px;right:-70px;}
}
@media (max-width:820px){
  .detail-grid,.two-col,.grid{grid-template-columns:1fr;}
  .rc-meta{grid-template-columns:1fr;}
  .rc-meta div{border-right:0;border-bottom:1px solid var(--line-2);}
  .hero-art{display:none;}
  .hero h1{font-size:28px;}
  .head-nav span{display:none;}
  .step{padding-right:22px;}
  .step s{display:none;}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.001s !important;
    animation-delay:0s !important;
    animation-iteration-count:1 !important;
    transition-duration:.001s !important;
    transition-delay:0s !important;
  }
  .card:hover{transform:none;}
  .btn:hover{transform:none;}
  .mini:hover{transform:none;}
  .hero-art g{animation:none !important;}
  .toast{transition:none;}
}

  var out = '';

  for (i = 1; i <= n; i++) {

    d = 'M' + (cx - r) + ' ' + cy +
        ' C' + (cx - r) + ' ' + (cy - r * 0.72) + ' ' +

        (cx + r * 0.4) + ' ' + (cy + r) + ' ' + cx + ' ' + (cy + r) +
        ' C' + (cx - r * 0.5) + ' ' + (cy + r) + ' ' +
        (cx - r) + ' ' + (cy + r * 0.6) + ' ' + (cx - r) + ' ' + cy + 'Z';
    out += '<path d="' + d + '" fill="none" stroke="' + color +
           '" stroke-width="0.7" opacity="' + (opacity - i * 0.035).toFixed(3) + '"/>';
  }

/* ---------- 数据层 ---------- */

function findP(pid) {
  var i;
  for (i = 0; i < CATALOG.length; i++) {
    if (CATALOG[i].id === pid) return CATALOG[i];
  }
  return null;
}

function pickKey(p, pick) {
  var parts = [];
  var i;
  for (i = 0; i < p.groups.length; i++) {
    parts.push(pick[p.groups[i].key]);
  }
  return parts.join('|');
}

function stockOf(pid, pick) {
  var p = findP(pid);
  var k = pickKey(p, pick);
  return p.stock[k];
}

function priceOf(pid, pick) {
  var p = findP(pid);
  var total = p.base;
  var i, j, opts;
  for (i = 0; i < p.groups.length; i++) {
    opts = p.groups[i].opts;
    for (j = 0; j < opts.length; j++) {
      if (opts[j].v === pick[p.groups[i].key]) total += opts[j].delta;
    }
  }
  return total;
}

function specLabel(pid, pick) {
  var p = findP(pid);
  var out = [];
  var i;
  for (i = 0; i < p.groups.length; i++) out.push(pick[p.groups[i].key]);
  return out.join(' · ');
}

function stockText(n) {
  if (n <= 0) return '暂时缺货';

function money(n) {
  return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}

function cartCount() {
  var n = 0, i;
  for (i = 0; i < state.cart.length; i++) n += state.cart[i].qty;
  return n;
}

function cartGood(pid, pick, qty) {
  return { pid: pid, pick: pick, qty: qty, key: pickKey(findP(pid), pick) };
}

function cartTotals() {
  var sub = 0, i, l, st, blocked = 0;
  for (i = 0; i < state.cart.length; i++) {
    l = state.cart[i];
    st = stockOf(l.pid, l.pick);
    if (st <= 0 || l.qty > st) { blocked++; continue; }
    sub += priceOf(l.pid, l.pick) * l.qty;
  }
  var ship = sub === 0 ? 0 : (sub >= FREE_SHIP ? 0 : SHIP_FEE);
  if (state.form.ship === 'pickup') ship = 0;
  return { sub: sub, ship: ship, total: sub + ship, blocked: blocked };
}

function blockingLines() {
  var out = [], i, l, s;
  for (i = 0; i < state.cart.length; i++) {
    l = state.cart[i];
    s = stockOf(l.pid, l.pick);
    if (s <= 0 || l.qty > s) out.push({ line: l, stock: s });
  }
  return out;
}

function availableAlternatives(p) {
  var out = [];
  var gi, oi, g, o, trial, kk, cnt, parts;
  for (gi = 0; gi < p.groups.length; gi++) {
    g = p.groups[gi];
    for (oi = 0; oi < g.opts.length; oi++) {
      o = g.opts[oi];
      if (state.pick[g.key] === o.v) continue;
      trial = {};
      parts = [];
      for (kk in state.pick) trial[kk] = state.pick[kk];
      trial[g.key] = o.v;
      cnt = stockOf(p.id, trial);
      if (cnt <= 0) continue;
      for (kk in trial) parts.push(kk + '=' + trial[kk]);
      out.push({ sw: parts.join('|'), label: specLabel(p.id, trial), stock: cnt });
      if (out.length >= 3) return out;
    }
  }
  return out;
}

  html += '<div class="two-col">' +
    field('name', '收货人', f.name, state.errs.name, '请输入姓名') +
    field('phone', '手机号', f.phone, state.errs.phone, '11 位大陆手机号') +
    '</div>';
  html += '<div class="field' + (state.errs.addr ? ' err' : '') + '"><label for="f-addr">详细地址</label>' +
    '<input id="f-addr" data-act="type" data-f="addr" value="' + esc(f.addr) + '" placeholder="省市区 + 街道门牌">' +
    '<div class="tip">' + (state.errs.addr || '') + '</div></div>';
  html += '<div class="field"><label>配送方式</label><div class="radio-row">' +
    radio('ship', 'standard', '标准送装（3–5 个工作日，满 ¥' + money(FREE_SHIP) + ' 包邮）', t.sub >= FREE_SHIP ? '¥ 0' : '¥ ' + money(SHIP_FEE)) +
    radio('ship', 'pickup', '工作室自提（次日下午，奥斯陆 · 长沙湾 12 号）', '¥ 0') +
    '</div></div>';
  html += '<div class="field"><label for="f-note">备注（可不填）</label>' +
    '<textarea id="f-note" data-act="type" data-f="note" placeholder="如：无电梯 6 楼，请提前电话联系">' + esc(f.note) + '</textarea></div>';
  html += '</div></div>';

  var i, l, p, st, unit, bad;
  var rows = '';
  for (i = 0; i < state.cart.length; i++) {
    l = state.cart[i];
    p = findP(l.pid);
    st = stockOf(l.pid, l.pick);
    unit = priceOf(l.pid, l.pick);
    bad = st <= 0 || l.qty > st;
    rows += '<div class="review-line' + (bad ? ' bad' : '') + '">' +
      '<span class="nm">' + esc(p.name) + '</span><span class="qy">× ' + l.qty + '</span>' +
      '<span class="amt">' + (bad ? '待处理' : '¥ ' + money(unit * l.qty)) + '</span>' +
      '<span class="sp">' + esc(specLabel(l.pid, l.pick)) + '</span></div>';
  }
  html += '<div class="panel" style="margin-top:22px"><div class="panel-head"><h3>下单清单</h3>' +
    '<span class="lab">' + cartCount() + ' 件</span></div>' + rows;

  if (block.length) {
    html += '<div class="block-note"><b>库存不足，暂时无法提交：</b><ol>';
    for (i = 0; i < block.length; i++) {
      l = block[i].line;
      html += '<li>' + esc(findP(l.pid).name) + ' · ' + esc(specLabel(l.pid, l.pick)) +
        '（需 ' + l.qty + ' 件，现货 ' + block[i].stock + ' 件）</li>';
    }
    html += '</ol><div style="margin-top:8px">改选有货规格或把数量减到现货以内后即可提交。</div></div>';
  }

  html += totalsHtml(t) + '<div class="cart-cta">';
  if (block.length || !state.cart.length) {
    html += '<button type="button" class="btn blocked wide" data-act="submit-blocked">提交订单</button>' +
      '<span class="cta-note err">' + (block.length ? '存在 ' + block.length + ' 项库存问题，已阻止提交' : '购物袋为空') + '</span>';
  } else {
    html += '<button type="button" class="btn wide" data-act="submit">提交订单 ¥ ' + money(t.total) + '</button>' +
      '<span class="cta-note">提交后按下单数量扣减库存</span>';
  }
  html += '</div></div></div>';
  return html;
}

function field(k, label, val, err, ph) {
  return '<div class="field' + (err ? ' err' : '') + '"><label for="f-' + k + '">' + label + '</label>' +
    '<input id="f-' + k + '" data-act="type" data-f="' + k + '" value="' + esc(val) + '" placeholder="' + ph + '">' +
    '<div class="tip">' + (err || '') + '</div></div>';
}

function radio(group, val, label, price) {
  return '<button type="button" class="radio" data-act="radio" data-g="' + group + '" data-v="' + val +
    '" aria-checked="' + (state.form[group] === val) + '"><i></i>' + label +
    '<span class="p">' + price + '</span></button>';
}
/* ---------- 回执页 ---------- */

function viewReceipt() {
  var o = state.order;
  var html = '<div class="view"><div class="receipt-wrap">';
  html += '<div class="receipt-head">' + receiptArt() + '<div class="in">' +
    '<div class="ok-mark"><svg width="21" height="21" viewBox="0 0 21 21" aria-hidden="true">' +
    '<path d="M5 11.2 9 15l7.2-8.4" fill="none" stroke="#7f8c6c" stroke-width="1.7"/></svg></div>' +
    '<span class="lab" style="display:block;margin-top:14px">MOTTAGNING / 订单已受理</span>' +
    '<h2>订单已生成，仓库开始拣货</h2>' +
    '<p>我们已按下单数量扣减库存，' + o.count + ' 件商品将于 ' + o.eta + ' 前送出。</p>' +
    '<div class="receipt-no">' +
    '<div><b>' + o.no + '</b><span>订单号</span></div>' +
    '<div><b>' + o.time + '</b><span>下单时间</span></div>' +
    '<div><b>' + (o.ship === 'pickup' ? '工作室自提' : '标准送装') + '</b><span>配送方式</span></div>' +
    '</div></div></div>';

  var i, l;
  for (i = 0; i < o.lines.length; i++) {
    l = o.lines[i];
    html += '<div class="rc-row"><span>' + esc(l.name) + '</span>' +
      '<span class="amt">¥ ' + money(l.amount) + '</span>' +
      '<span class="sp">' + esc(l.spec) + '</span>' +
      '<span class="qt">× ' + l.qty + ' · 单价 ¥' + money(l.unit) + '</span></div>';
  }

  html += '<div class="rc-totals">' +
    '<div class="total-row"><span>商品金额</span><span>¥ ' + money(o.totals.sub) + '</span></div>' +
    '<div class="total-row"><span>配送费</span><span>' + (o.totals.ship ? '¥ ' + money(o.totals.ship) : '包邮') + '</span></div>' +
    '<div class="grand"><span class="lab">实付</span><span class="v">' + money(o.totals.total) + '</span></div></div>';

  html += '<div class="rc-meta">' +
    '<div><span class="lab">收货</span><b>' + esc(o.form.name) + ' ' + esc(o.form.phone) + '</b>' +
    '<p>' + esc(o.form.addr || '工作室自提') + '</p></div>' +
    '<div><span class="lab">备注</span><b>' + (o.form.note ? esc(o.form.note) : '无') + '</b><p>已随单发送至拣货单</p></div>' +
    '<div><span class="lab">售后</span><b>15 天无理由退换</b><p>大件家具提供上门取件</p></div>' +
    '</div>';

  html += '<div class="receipt-cta">' +
    '<button type="button" class="btn moss" data-act="again">继续选购</button>' +
    '<button type="button" class="btn ghost" data-act="again-reset">清空并重来做缺货演示</button>' +
    '<span class="note">本回执为演示数据，可在 1280 × 800 视口核对</span></div>';
  html += '</div></div>';
  return html;
}

/* ---------- 状态迁移 ---------- */

function goto(view) {
  state.view = view;
  state.bump = 0;
  render();
  window.scrollTo(0, 0);
}

function openProduct(pid) {
  var p = findP(pid);
  var pick = {};
  var i;
  for (i = 0; i < p.groups.length; i++) pick[p.groups[i].key] = p.groups[i].opts[0].v;
  state.pid = pid;
  state.pick = pick;
  state.qty = 1;
  goto('detail');
}

function addToCart() {
  var st = currentStock();
  if (st <= 0) {
    toast('「' + specLabel(state.pid, state.pick) + '」已售罄，请先改选规格', true);
    return;
  }
  if (state.qty > st) {
    toast('数量超过现货 ' + st + ' 件，请先减量', true);
    return;
  }
  var key = pickKey(findP(state.pid), state.pick);
  var i, hit = null;
  for (i = 0; i < state.cart.length; i++) {
    if (state.cart[i].key === key) hit = state.cart[i];
  }
  if (hit) hit.qty += state.qty;
  else state.cart.push({ pid: state.pid, pick: state.pick, qty: state.qty, key: key });
  state.bump = 1;
  toast('已加入购物袋：' + specLabel(state.pid, state.pick) + ' × ' + state.qty);
  goto('cart');
}

function setQty(d) {
  var st = currentStock();
  var n = state.qty + d;
  if (n < 1) n = 1;
  if (n > 6) n = 6;
  if (st > 0 && n > st) {
    toast('现货只有 ' + st + ' 件', true);
    n = st;
  }
  state.qty = n;
  render();
}

function applySw(sw) {
  var parts = sw.split('|');
  var i, kv;
  for (i = 0; i < parts.length; i++) {
    kv = parts[i].split('=');
    state.pick[kv[0]] = kv[1];
  }
  var st = currentStock();
  if (st > 0 && state.qty > st) state.qty = st;
  toast('已改选为 ' + specLabel(state.pid, state.pick));
  render();
}

function lineSw(i, sw) {
  var l = state.cart[i];
  var parts = sw.split('|');
  var j, kv;
  for (j = 0; j < parts.length; j++) {
    kv = parts[j].split('=');
    l.pick[kv[0]] = kv[1];
  }
  l.key = pickKey(findP(l.pid), l.pick);
  var st = stockOf(l.pid, l.pick);
  if (st > 0 && l.qty > st) l.qty = st;
  toast('该行已改选为 ' + specLabel(l.pid, l.pick));
  render();
}

function setStock(pick, n) {
  var p = findP(state.pid);
  p.stock[pickKey(p, pick)] = n;
}

function lineStock(l, n) {
  var p = findP(l.pid);
  p.stock[pickKey(p, l.pick)] = n;
}

function validate() {
  var e = {};
  var f = state.form;
  if (!f.name.trim()) e.name = '请填写收货人姓名';
  if (!/^1\d{10}$/.test(f.phone.trim())) e.phone = '请填写 11 位手机号，以 1 开头';
  if (!state.form.addr.trim() && f.ship === 'standard') e.addr = '标准送装需要填写详细地址';
  state.errs = e;
  return !Object.keys(e).length;
}

function submitOrder() {
  var block = blockingLines();
  if (block.length) {
    toast('库存不足，已阻止提交：' + findP(block[0].line.pid).name, true);
    return;
  }
  if (!state.cart.length) {
    toast('购物袋是空的', true);
    return;
  }
  if (!validate()) {
    toast('请先补全收货信息', true);
    render();
    return;
  }
  var t = cartTotals();
  var lines = [];
  var i, l, p, unit;
  for (i = 0; i < state.cart.length; i++) {
    l = state.cart[i];
    p = findP(l.pid);
    unit = priceOf(l.pid, l.pick);
    lines.push({
      name: p.name,
      spec: specLabel(l.pid, l.pick),
      qty: l.qty,
      unit: unit,
      amount: unit * l.qty
    });
    lineStock(l, stockOf(l.pid, l.pick) - l.qty);
  }
  var d = new Date();
  var pad = function (n) { return n < 10 ? '0' + n : '' + n; };
  state.order = {
    no: 'NV-' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '-' + (4100 + state.orderSeq),
    time: d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()),
    eta: '明日 18:00',
    count: cartCount(),
    lines: lines,
    totals: { sub: t.sub, ship: t.ship, total: t.total },
    form: { name: state.form.name.trim(), phone: state.form.phone.trim(), addr: state.form.addr.trim(), note: state.form.note.trim() },
    ship: state.form.ship
  };
  state.orderSeq = (state.orderSeq || 1) + 1;
  state.cart = [];
  state.errs = {};
  toast('订单 ' + state.order.no + ' 已生成');
  goto('receipt');
}

/* ---------- 事件绑定 ---------- */

function onAct(act, el) {
  var i = el.getAttribute('data-i');
  i = i === null ? -1 : parseInt(i, 10);
  switch (act) {
    case 'filter':
      state.filter = el.getAttribute('data-cat');
      render();
      break;
    case 'open':
      openProduct(el.getAttribute('data-pid'));
      break;
    case 'back':
    case 'back-browse':
      goto('browse');
      break;
    case 'pick':
      state.pick[el.getAttribute('data-key')] = el.getAttribute('data-val');
      var st = stockOf(state.pid, state.pick);
      if (st > 0 && state.qty > st) state.qty = st;
      if (st <= 0) state.qty = 1;
      render();
      break;
    case 'q+':
      setQty(1);
      break;
    case 'q-':
      setQty(-1);
      break;
    case 'add':
      addToCart();
      break;
    case 'add-blocked':
      addToCart();
      break;
    case 'swap':
      applySw(el.getAttribute('data-sw'));
      break;
    case 'fit':
      state.qty = currentStock();
      toast('数量已减至现货 ' + state.qty + ' 件');
      render();
      break;
    case 'mk-oos':
      setStock(state.pick, 0);
      toast('已将「' + specLabel(state.pid, state.pick) + '」置为缺货', true);
      render();
      break;
    case 'mk-low':
      setStock(state.pick, 1);
      toast('已将「' + specLabel(state.pid, state.pick) + '」库存设为 1');
      render();
      break;
    case 'go-checkout':
      goto('checkout');
      break;
    case 'go-cart':
      goto('cart');
      break;
    case 'lq+':
    case 'lq-':
      changeLineQty(i, act === 'lq+' ? 1 : -1);
      break;
    case 'l-oos':
      lineStock(state.cart[i], 0);
      toast('仓库报缺：' + specLabel(state.cart[i].pid, state.cart[i].pick) + ' 已缺货', true);
      render();
      break;
    case 'l-restock':
      lineStock(state.cart[i], stockOf(state.cart[i].pid, state.cart[i].pick) + 3);
      toast('仓库回补 3 件：' + specLabel(state.cart[i].pid, state.cart[i].pick));
      render();
      break;
    case 'l-swap':
      lineSw(i, el.getAttribute('data-sw'));
      break;
    case 'l-fit':
      state.cart[i].qty = stockOf(state.cart[i].pid, state.cart[i].pick);
      toast('数量已减至现货以内');
      render();
      break;
    case 'l-del':
      state.cart.splice(i, 1);
      toast('已从购物袋移除');
      render();
      break;
    case 'radio':
      state.form[el.getAttribute('data-g')] = el.getAttribute('data-v');
      render();
      break;
    case 'submit':
      submitOrder();
      break;
    case 'submit-blocked':
      toast('库存不足，提交已被阻止，请先处理缺货款', true);
      break;
    case 'again':
      goto('browse');
      break;
    case 'again-reset':
      resetStock();
      state.order = null;
      state.cart = [];
      goto('browse');
      break;
    default:
      break;
  }
}

function changeLineQty(i, d) {
  var l = state.cart[i];
  var st = stockOf(l.pid, l.pick);
  var n = l.qty + d;
  if (n < 1) n = 1;
  if (n > 6) n = 6;
  if (st > 0 && n > st) {
    toast('该行现货只有 ' + st + ' 件', true);
    n = st;
  }
  l.qty = n;
  render();
}

var STOCK0 = null;

function snapshotStock() {
  STOCK0 = {};
  var i, k;
  for (i = 0; i < CATALOG.length; i++) {
    STOCK0[CATALOG[i].id] = {};
    for (k in CATALOG[i].stock) STOCK0[CATALOG[i].id][k] = CATALOG[i].stock[k];
  }
}

function resetStock() {
  var i, k, p;
  for (i = 0; i < CATALOG.length; i++) {
    p = CATALOG[i];
    for (k in STOCK0[p.id]) p.stock[k] = STOCK0[p.id][k];
  }
  toast('已恢复初始库存，可重走一遍流程');
}

document.addEventListener('click', function (ev) {
  var el = ev.target.closest ? ev.target.closest('[data-act]') : null;
  if (!el || el.tagName !== 'BUTTON') return;
  onAct(el.getAttribute('data-act'), el);
});

document.addEventListener('input', function (ev) {
  var el = ev.target;
  if (!el.getAttribute || el.getAttribute('data-act') !== 'type') return;
  state.form[el.getAttribute('data-f')] = el.value;
});

document.addEventListener('change', function (ev) {
  var el = ev.target;
  if (!el.getAttribute || el.getAttribute('data-act') !== 'type') return;
  state.errs = {};
});

/* ---------- 渲染 ---------- */

function render() {
  var html = '';
  if (state.view === 'browse') html = viewBrowse();
  else if (state.view === 'detail') html = viewDetail();
  else if (state.view === 'cart') html = viewCart();
  else if (state.view === 'checkout') html = viewCheckout();
  else html = viewReceipt();

  $main.innerHTML = html;
  if (state.view === 'receipt') {
    $aside.innerHTML = '<div class="panel"><div class="panel-head"><h3>本单已完成</h3>' +
      '<span class="lab">STEP 05</span></div><div class="panel-body">' +
      '<p style="font-size:13px;color:#5b5348">购物袋已清空，库存按下单数量扣减。可点「清空并重来做缺货演示」恢复初始库存。</p>' +
      '</div></div>';
  } else {
    $aside.innerHTML = asideHtml();
  }
  renderSteps();
  renderHead();
}

function init() {
  $main = document.getElementById('main');
  $aside = document.getElementById('aside');
  $steps = document.getElementById('steps');
  $toast = document.getElementById('toast');
  document.getElementById('headCart').addEventListener('click', function () {
    goto(state.cart.length ? 'cart' : 'browse');
  });
  var links = document.querySelectorAll('#headnav span');
  var i;
  for (i = 0; i < links.length; i++) {
    links[i].addEventListener('click', function () {
      var k = this.getAttribute('data-nav');
      if (k === 'browse') goto('browse');
      else if (k === 'cart') goto('cart');
      else if (state.order) goto('receipt');
      else toast('还没有订单，先提交一单吧', true);
    });
  }
  snapshotStock();
  render();
}

init();
</script>
</body>
</html>
