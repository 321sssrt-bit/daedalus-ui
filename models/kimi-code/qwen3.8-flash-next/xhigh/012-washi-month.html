<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>庭月历 · 二〇二六年九月</title>
<style>
:root{
  --washi:#f6f1e6;
  --card:#fbf7ec;
  --ai:#31486e;
  --ink:#2a2f3a;
  --muted:#8a8574;
  --line:#d9d0ba;
  --bamboo:#6f8f6a;
  --maple:#c4633c;
  --wisteria:#7b6aa0;
  --seal:#b3402e;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:
    radial-gradient(ellipse at 12% 8%,rgba(49,72,110,.05),transparent 45%),
    radial-gradient(ellipse at 90% 95%,rgba(196,99,60,.05),transparent 40%),
    var(--washi);
  color:var(--ink);
  font:13px/1.6 Georgia,"Times New Roman","Songti SC","STSong","SimSun",serif;
}
.wrap{max-width:1216px;margin:0 auto;padding:20px 24px 34px;display:grid;grid-template-columns:58px 1fr 300px;gap:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
.vert{writing-mode:vertical-rl;letter-spacing:.4em}

/* ── 左题签带 ── */
.tate{
  background:var(--ai);color:#f2efe4;
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  padding:18px 0;gap:10px;
}
.tate .m{font-size:30px;letter-spacing:.5em;font-weight:700}
.tate .y{font-size:11px;letter-spacing:.45em;color:#c5cde0}
.tate .sekku{font-size:13px;letter-spacing:.5em;color:#e6dcc4;border-top:1px solid rgba(242,239,228,.4);padding-top:14px}
.tate .stamp{width:22px;height:22px;background:var(--seal);color:#fff;font-size:10px;display:grid;place-items:center;letter-spacing:0}

/* ── 中央历面 ── */
.calendar{padding:0 22px;min-width:0}
.calhead{display:flex;align-items:baseline;gap:16px;margin-bottom:10px}
.calhead h1{font-size:21px;letter-spacing:.3em;color:var(--ai)}
.calhead .note{font-size:11px;color:var(--muted);letter-spacing:.1em}
.calhead .today-pill{margin-left:auto;font-size:11px;color:var(--seal);border:1px solid var(--seal);padding:1px 10px;letter-spacing:.14em}
.weekbar{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--ai);border-bottom:1px solid var(--ai)}
.weekbar span{text-align:center;padding:4px 0;font-size:11px;letter-spacing:.3em;color:var(--ai)}
.weekbar span.wk{color:var(--seal)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:96px;border-left:1px solid var(--line)}
.cell{
  border-right:1px solid var(--line);border-bottom:1px solid var(--line);
  background:var(--card);padding:5px 7px;overflow:hidden;text-align:left;
}
.cell.out{background:transparent;color:#c9c2ad}
.cell .d{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px}
.cell.now .d::after{content:"今日";font-size:9px;color:#fff;background:var(--seal);padding:0 4px;letter-spacing:.1em}
.cell.now{background:#fdf9ee;box-shadow:inset 0 0 0 1px rgba(179,64,46,.35)}
.chips{margin-top:4px;display:flex;flex-direction:column;gap:3px}
.chip{
  display:block;width:100%;text-align:left;font-size:11px;line-height:1.35;
  padding:2px 6px;border-left:3px solid var(--muted);
  background:rgba(49,72,110,.06);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  transition:background .12s;
}
.chip:hover{background:rgba(49,72,110,.14)}
.chip.sel{background:var(--ai);color:#f4f1e6}
.chip.team{border-left-color:var(--bamboo)}
.chip.launch{border-left-color:var(--ai)}
.chip.self{border-left-color:var(--maple)}
.chip.mark{border-left-color:var(--wisteria)}
.chip i{font-style:normal;opacity:.62;margin-right:4px;font-size:10px}
.legend{display:flex;gap:16px;margin-top:8px;font-size:10px;color:var(--muted);letter-spacing:.08em;flex-wrap:wrap}
.legend b{display:inline-block;width:8px;height:8px;margin-right:4px;vertical-align:1px}

/* ── 右栏 ── */
aside{padding-left:22px;border-left:1px solid var(--line)}
aside h2{font-size:12px;letter-spacing:.4em;color:var(--ai);border-bottom:1px solid var(--ai);padding-bottom:5px;margin-bottom:8px}
.detail{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--ai);min-height:186px;padding:12px 14px;margin-bottom:14px;position:relative}
.detail .empty{color:var(--muted);font-size:12px;margin-top:70px;text-align:center;letter-spacing:.2em}
.detail .close{position:absolute;top:6px;right:9px;font-size:14px;color:var(--muted);line-height:1;padding:3px}
.detail .close:hover{color:var(--seal)}
.detail .k{position:absolute;top:10px;left:12px;writing-mode:vertical-rl;font-size:26px;color:rgba(49,72,110,.16);letter-spacing:.2em;font-weight:700}
.detail h3{font-size:15px;margin:2px 66px 6px 0;line-height:1.4}
.detail .row{font-size:11px;color:var(--muted);margin-bottom:3px;letter-spacing:.05em}
.detail .row b{color:var(--ink);font-weight:400}
.detail .cat{display:inline-block;font-size:10px;letter-spacing:.2em;border:1px solid;padding:0 7px;margin:5px 0 7px}
.cat.team{color:var(--bamboo);border-color:var(--bamboo)}
.cat.launch{color:var(--ai);border-color:var(--ai)}
.cat.self{color:var(--maple);border-color:var(--maple)}
.cat.mark{color:var(--wisteria);border-color:var(--wisteria)}
.detail .memo{font-size:12px;border-top:1px dotted var(--line);padding-top:7px;margin-top:4px}
.agenda p{border-bottom:1px dotted var(--line);padding:5px 0;font-size:12px;cursor:pointer;display:flex;gap:8px;align-items:baseline;transition:background .12s}
.agenda p:hover{background:rgba(49,72,110,.05)}
.agenda p i{font-style:normal;color:var(--ai);font-size:11px;flex:none;width:46px}
.agenda p b{font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agenda .none{color:var(--muted);font-size:11px;letter-spacing:.15em;border-bottom:0;cursor:default}
.sekku-rail{margin-top:16px;display:flex;justify-content:flex-end}
.sekku-rail .vert{font-size:12px;color:var(--maple);border-right:1px solid var(--maple);padding-right:8px;height:96px}

@media (max-width:1024px){
  .wrap{grid-template-columns:46px 1fr}
  aside{grid-column:1/-1;border-left:0;padding-left:0;border-top:1px solid var(--line);margin-top:14px;padding-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:0 22px}
  aside h2{grid-column:1/-1}
  .detail{margin-bottom:0}
}
@media (max-width:768px){
  .wrap{grid-template-columns:1fr;padding:12px 12px 24px}
  .tate{flex-direction:row;padding:8px 14px}
  .tate .m,.tate .y,.tate .sekku{writing-mode:horizontal-tb;letter-spacing:.3em}
  .tate .sekku{border-top:0;border-left:1px solid rgba(242,239,228,.4);padding:0 0 0 14px}
  .calendar{padding:0}
  .grid{grid-auto-rows:64px}
  aside{grid-template-columns:1fr}
  .sekku-rail{display:none}
  .chip{font-size:10px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <div class="tate" aria-hidden="true">
    <span class="stamp">印</span>
    <span class="m vert">九月</span>
    <span class="y vert">二〇二六年</span>
    <span class="sekku vert">白露 · 秋分</span>
  </div>

  <section class="calendar">
    <div class="calhead">
      <h1>庭月历</h1>
      <span class="note">一格一日 · 点便签看详情</span>
      <span class="today-pill">今天 9 月 7 日 · 月曜</span>
    </div>
    <div class="weekbar">
      <span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span><span class="wk">日</span>
    </div>
    <div class="grid" id="grid"></div>
    <div class="legend">
      <span><b style="background:var(--bamboo)"></b>团队协同</span>
      <span><b style="background:var(--ai)"></b>产品交付</span>
      <span><b style="background:var(--maple)"></b>私人日程</span>
      <span><b style="background:var(--wisteria)"></b>重要节点</span>
    </div>
  </section>

  <aside>
    <h2>事 项 详 情</h2>
    <div class="detail" id="detail" aria-live="polite">
      <div class="empty">点历格中的事，<br>于此展开</div>
    </div>
    <h2>本 月 一 览</h2>
    <div class="agenda" id="agenda"></div>
    <div class="sekku-rail"><span class="vert">初秋 · 爽爽として</span></div>
  </aside>

</div>

<script>
var CAT={team:"团队协同",launch:"产品交付",self:"私人日程",mark:"重要节点"};
var EVENTS=[
  {d:1, t:"10:00",e:"11:30",ttl:"迭代规划 · 9月第1周",cat:"team",who:"产品全体 · 听雨室",memo:"把导出订阅排进本迭代；验收口径由林可补充。"},
  {d:2, t:"全天",e:"",ttl:"结账链路改版 · 上线前检查",cat:"mark",who:"前端 + QA",memo:"对照检查单 12 项，重点：优惠券叠加与发票预览。"},
  {d:3, t:"14:00",e:"15:30",ttl:"设计评审 · 暗色主题 v2",cat:"team",who:"小满 · 投影厅",memo:"带第一版对照图，仓库夜班同事远程参会。"},
  {d:4, t:"19:30",e:"20:30",ttl:"跑步社 5 公里",cat:"self",who:"河堤东集合",memo:"新鞋先磨合一周再跑长距离。"},
  {d:7, t:"09:30",e:"10:00",ttl:"周会 · 数据例会",cat:"team",who:"会议室听雨",memo:"过一遍周成交与退款率；客单价连跌要给出解释。"},
  {d:7, t:"15:00",e:"16:00",ttl:"法务合同评审",cat:"mark",who:"与仓配供应商 · 线上",memo:"关注赔付条款第 7.2 条与账期变更。"},
  {d:8, t:"11:00",e:"12:00",ttl:"客户访谈 · 沈阳门店",cat:"team",who:"老周远程陪同",memo:"问清盘点导出的真实痛点，带两版原型。"},
  {d:10, t:"20:00",e:"21:00",ttl:"版本发布 v4.3",cat:"launch",who:"值班：丁岚",memo:"灰度 10% 观察 2 小时；回滚脚本演练已通过。"},
  {d:12, t:"09:00",e:"10:00",ttl:"牙科复诊",cat:"self",who:"市口腔医院 3 楼",memo:"记得带上个月的片子。"},
  {d:15, t:"13:30",e:"16:00",ttl:"季度 OKR 对齐",cat:"team",who:"全体管理层 · 大会议室",memo:"上午先发自查表，会上只讨论分歧项。"},
  {d:18, t:"全天",e:"",ttl:"中秋游园会 · 大堂发礼",cat:"self",who:"行政轮值",memo:"12:00 与 17:00 两波，每波留 30 份备用。"},
  {d:22, t:"10:00",e:"12:00",ttl:"压测 · 结账链路",cat:"mark",who:"性能组 + 值班",memo:"目标 3 倍日常峰值；失败场景必须演练降级。"},
  {d:24, t:"16:00",e:"17:00",ttl:"设计复盘 · 秋上新",cat:"team",who:"设计 + 前端",memo:"只复盘延期两次的页面，别再开大会。"},
  {d:28, t:"12:00",e:"13:30",ttl:"团队午饭局",cat:"self",who:"巷子里居酒屋",memo:"给新同事阿澈办个小小欢迎。"},
  {d:30, t:"17:00",e:"18:00",ttl:"月报提交截止",cat:"mark",who:"各负责人",memo:"口径以衡束纪事月末刊为准，附一页结论。"}
];

/* 2026-09：9 月 1 日为周二（周一为一周之首），共 30 天，前补 8/31，后补 10/1–4 */
var grid=document.getElementById("grid");
var cells={};
function addCell(num,label,out,now){
  var c=document.createElement("div");
  c.className="cell"+(out?" out":"")+(now?" now":"");
  c.innerHTML='<div class="d">'+label+"</div>";
  var box=document.createElement("div");
  box.className="chips";
  c.appendChild(box);
  grid.appendChild(c);
  cells[num]=box;
}
addCell("831","8月31",true,false);
for(var i=1;i<=30;i++)addCell(String(i),String(i),false,i===7);
for(var j=1;j<=4;j++)addCell("10"+j,"10月"+j,true,false);

EVENTS.forEach(function(ev,idx){
  var box=cells[String(ev.d)];
  var b=document.createElement("button");
  b.className="chip "+ev.cat;
  b.dataset.i=idx;
  b.innerHTML="<i>"+ev.t+"</i>";
  b.appendChild(document.createTextNode(ev.ttl));
  b.title=ev.d+"日 "+ev.ttl;
  box.appendChild(b);
});

/* 详情卡 */
var detail=document.getElementById("detail");
function esc(s){var p=document.createElement("span");p.textContent=s;return p.innerHTML}
function show(idx){
  var ev=EVENTS[idx];
  document.querySelectorAll(".chip.sel").forEach(function(x){x.classList.remove("sel")});
  var chip=grid.querySelector('.chip[data-i="'+idx+'"]');
  if(chip)chip.classList.add("sel");
  detail.innerHTML=
    '<button class="close" title="收起">×</button>'+
    '<span class="k">'+ev.d+'</span>'+
    '<h3>'+esc(ev.ttl)+'</h3>'+
    '<div class="row"><b>'+(ev.e?ev.t+" – "+ev.e:ev.t)+'</b> · 9月'+ev.d+'日</div>'+
    '<div class="row">相关 · '+esc(ev.who)+'</div>'+
    '<span class="cat '+ev.cat+'">'+CAT[ev.cat]+'</span>'+
    '<div class="memo">'+esc(ev.memo)+'</div>';
  detail.querySelector(".close").addEventListener("click",function(){
    detail.innerHTML='<div class="empty">点历格中的事，<br>于此展开</div>';
    if(chip)chip.classList.remove("sel");
  });
}
grid.addEventListener("click",function(e){
  var b=e.target.closest(".chip");
  if(b)show(+b.dataset.i);
});

/* 本月一览 */
var agenda=document.getElementById("agenda");
function fillAgenda(){
  agenda.innerHTML="";
  var today=new Date();
  var list=EVENTS.filter(function(ev){return ev.d>=today.getDate()});
  if(!list.length){
    var p=document.createElement("p");
    p.className="none";
    p.textContent="本月事项已全部完成";
    agenda.appendChild(p);
    return;
  }
  list.forEach(function(ev){
    var p=document.createElement("p");
    p.innerHTML="<i>9/"+ev.d+" "+ev.t+"</i><b></b>";
    p.querySelector("b").textContent=ev.ttl;
    p.addEventListener("click",function(){show(EVENTS.indexOf(ev))});
    agenda.appendChild(p);
  });
}
fillAgenda();
</script>
</body>
</html>
