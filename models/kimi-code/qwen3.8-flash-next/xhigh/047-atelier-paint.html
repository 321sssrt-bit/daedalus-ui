<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>047 · 颜料工作台 — 向海坡地厚涂导出</title>
<style>
:root{
  --cream:#f6f1e6; --board:#fffdf7; --paperln:#e4d9c3;
  --ink:#2b2620; --ink2:#6f665a;
  --cobalt:#2456b0; --cadmium:#f2b705; --alizarin:#c8402f; --viridian:#1e7a5f;
  --r:14px; --r2:10px;
  --sp1:8px; --sp2:12px; --sp3:16px; --sp4:24px; --sp5:32px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font:14px/1.55 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:
    repeating-linear-gradient(0deg,rgba(43,38,32,.025) 0 1px,transparent 1px 5px),
    repeating-linear-gradient(90deg,rgba(43,38,32,.02) 0 1px,transparent 1px 7px),
    var(--cream);
  color:var(--ink); min-height:100vh;
}
/* ---------- 顶栏 ---------- */
.topbar{
  display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:var(--sp3);
  padding:14px var(--sp4) 10px;background:var(--board);border-bottom:1px solid var(--paperln);
}
.topbar .swatches{display:flex;gap:6px}
.topbar .swatches i{width:26px;height:14px;border-radius:7px;border:2px solid var(--ink)}
.sw-c{background:var(--cobalt)}.sw-d{background:var(--cadmium)}.sw-a{background:var(--alizarin)}.sw-v{background:var(--viridian)}
.topbar h1{font-size:17px;font-weight:800;letter-spacing:.02em}
.topbar .no{font:700 12px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--alizarin)}
.topbar .meta{font-size:12px;color:var(--ink2);text-align:right}
/* ---------- 三栏 ---------- */
.work{display:grid;grid-template-columns:280px minmax(0,1fr) 312px;gap:var(--sp4);
  max-width:1440px;margin:0 auto;padding:var(--sp4)}
.panel{background:var(--board);border:2px solid var(--ink);border-radius:var(--r);
  box-shadow:4px 4px 0 rgba(43,38,32,.14)}
.panel h2{font-size:13px;font-weight:800;padding:12px var(--sp3);border-bottom:2px dashed var(--paperln);
  display:flex;justify-content:space-between;align-items:center;letter-spacing:.06em}
.panel h2 small{font:600 10px/1 ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--ink2);letter-spacing:.12em}
.pbody{padding:var(--sp3);display:flex;flex-direction:column;gap:var(--sp3)}
/* ---------- 参数控件 ---------- */
.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}
.field .hint{font-size:11px;color:var(--ink2);font-weight:400}
select{width:100%;padding:8px 10px;font:inherit;font-size:13px;color:var(--ink);
  background:var(--cream);border:2px solid var(--ink);border-radius:var(--r2)}
input[type=range]{width:100%;accent-color:var(--cobalt)}
.val{font:700 12px/1 ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--cobalt)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:2px solid var(--ink);border-radius:var(--r2);overflow:hidden}
.seg input{position:absolute;opacity:0}
.seg label{display:block;text-align:center;padding:7px 0;font-size:12px;font-weight:700;cursor:pointer;color:var(--ink2)}
.seg input:checked + label{background:var(--cadmium);color:var(--ink)}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:var(--sp2)}
.toggle .tg-name{font-size:13px;font-weight:700}
.toggle .tg-name i{display:inline-block;width:10px;height:10px;border-radius:50%;border:2px solid var(--ink);margin-right:6px;vertical-align:-1px}
.sw{position:relative;width:44px;height:24px;flex:none;cursor:pointer}
.sw input{position:absolute;opacity:0}
.sw span{position:absolute;inset:0;background:var(--paperln);border:2px solid var(--ink);border-radius:12px;transition:.15s}
.sw span::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;
  background:var(--board);border:2px solid var(--ink);transition:.15s}
.sw input:checked + span{background:var(--viridian)}
.sw input:checked + span::after{left:22px}
.layers{display:flex;flex-direction:column;gap:8px}
.lay{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.lay input{accent-color:var(--alizarin);width:16px;height:16px}
.lay .chip{width:14px;height:14px;border-radius:4px;border:2px solid var(--ink)}
/* ---------- 中栏预览 ---------- */
.stagewrap{display:flex;flex-direction:column;gap:var(--sp2);min-width:0}
.stagehead{display:flex;justify-content:space-between;align-items:baseline;gap:var(--sp2)}
.stagehead b{font-size:14px}
.stagehead span{font:12px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--ink2)}
.stage{padding:var(--sp4);background:var(--board);border:2px solid var(--ink);border-radius:var(--r);
  box-shadow:4px 4px 0 rgba(43,38,32,.14)}
#canvasBox{position:relative;margin:0 auto;max-width:640px;aspect-ratio:3/4;
  border:6px solid #d8c9a8;border-radius:4px;outline:2px solid var(--ink);overflow:hidden;
  transition:aspect-ratio .2s ease}
#canvasBox.size-square{aspect-ratio:1/1}
#canvasBox.size-banner{aspect-ratio:16/9}
#canvasBox::before{content:"";position:absolute;inset:0;
  background:repeating-conic-gradient(#ded4c0 0 25%,#fdfaf1 0 50%) 0 0/18px 18px;opacity:0;transition:.15s}
#canvasBox.alpha::before{opacity:1}
#art{position:absolute;inset:0;width:100%;height:100%;filter:hue-rotate(12deg)}
#grain{position:absolute;inset:0;pointer-events:none;opacity:.55;mix-blend-mode:multiply;transition:opacity .15s;
  background-image:repeating-linear-gradient(0deg,rgba(122,108,86,.12) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,rgba(122,108,86,.09) 0 1px,transparent 1px 4px),repeating-linear-gradient(45deg,rgba(122,108,86,.05) 0 1px,transparent 1px 7px)}
#canvasBox.nograin #grain{display:none}
#art[data-paint="thin"] .sk{stroke-width:3}
#art[data-paint="mid"] .sk{stroke-width:6}
#art[data-paint="thick"] .sk{stroke-width:10}
.stagefoot{display:flex;justify-content:space-between;gap:var(--sp2);font-size:12px;color:var(--ink2)}
.stagefoot code{font:11px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace;background:var(--board);
  border:1px solid var(--paperln);border-radius:6px;padding:2px 8px}
/* ---------- 右栏导出 ---------- */
.fmtcards{display:flex;flex-direction:column;gap:8px}
.fmt{display:flex;align-items:center;gap:10px;border:2px solid var(--paperln);border-radius:var(--r2);
  padding:9px 12px;cursor:pointer;background:var(--cream);transition:.12s}
.fmt input{accent-color:var(--cobalt);width:16px;height:16px;flex:none}
.fmt b{font-size:13px}
.fmt em{font-style:normal;font-size:11px;color:var(--ink2);margin-left:auto;text-align:right}
.fmt.sel{border-color:var(--ink);background:#fff;box-shadow:3px 3px 0 rgba(43,38,32,.14)}
#fmtWarn{display:none;font-size:12px;font-weight:700;color:var(--alizarin);
  background:#f9e3de;border:2px dashed var(--alizarin);border-radius:var(--r2);padding:8px 10px}
#fmtWarn.on{display:block}
#btnExport{width:100%;padding:12px;font:inherit;font-size:15px;font-weight:800;cursor:pointer;
  color:#fff;background:var(--cobalt);border:2px solid var(--ink);border-radius:var(--r2);
  box-shadow:3px 3px 0 rgba(43,38,32,.25);position:relative;overflow:hidden}
#btnExport:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:4px 4px 0 rgba(43,38,32,.25)}
#btnExport:disabled{opacity:.55;cursor:wait}
#prog{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,255,255,.35)}
/* 结果 / 冲突 */
#outlet{display:flex;flex-direction:column;gap:var(--sp2)}
.card-out{border:2px solid var(--ink);border-radius:var(--r2);padding:12px}
.card-out.ok{background:#e7f3ec;border-color:var(--viridian)}
.card-out.bad{background:#f9e3de;border-color:var(--alizarin);animation:shake .3s ease}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.card-out h3{font-size:13px;display:flex;align-items:center;gap:8px;margin-bottom:8px}
.card-out .dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink)}
.ok .dot{background:var(--viridian)}.bad .dot{background:var(--alizarin)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px var(--sp2);font-size:12px}
.kv dt{color:var(--ink2)}.kv dd{font:700 12px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace}
.card-out p{font-size:12px;line-height:1.6}
.card-out p b{color:var(--alizarin)}
.fixbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.fixbtns button{font:inherit;font-size:12px;font-weight:700;padding:6px 10px;cursor:pointer;
  background:var(--board);color:var(--ink);border:2px solid var(--ink);border-radius:8px}
.fixbtns button:hover{background:var(--cadmium)}
/* 日志 */
.logwrap{margin-top:var(--sp2)}
#expLog{list-style:none;display:flex;flex-direction:column;max-height:180px;overflow-y:auto}
#expLog li{display:flex;gap:8px;font-size:12px;padding:6px 2px;border-bottom:1px dashed var(--paperln)}
#expLog time{flex:none;font:11px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--ink2)}
#expLog li.deny{color:var(--alizarin)}#expLog li.deny::before{content:"✕";font-weight:800}
#expLog li.win{color:var(--viridian)}#expLog li.win::before{content:"✓";font-weight:800}
/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(12px);z-index:99;
  padding:10px 18px;font-size:13px;font-weight:700;color:var(--ink);background:var(--board);
  border:2px solid var(--ink);border-radius:999px;box-shadow:4px 4px 0 rgba(43,38,32,.2);
  opacity:0;pointer-events:none;transition:.18s ease;max-width:80vw}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{background:#f9e3de;border-color:var(--alizarin)}
#toast.ok2{background:#e7f3ec;border-color:var(--viridian)}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="swatches" aria-hidden="true"><i class="sw-c"></i><i class="sw-d"></i><i class="sw-a"></i><i class="sw-v"></i></div>
  <h1>颜料工作台 <span class="no">ATELIER-047 · 版07</span><br>
    <small style="font-size:12px;font-weight:400;color:var(--ink2)">《向海坡地 · 厚涂实验第 7 号》</small></h1>
  <div class="meta">草图 v7 · 本地已存 14:32<br>作者：林一苇（画室 3 号位）</div>
</header>

<main class="work">
  <!-- 左：参数与图层 -->
  <aside class="panel">
    <h2>画面参数 <small>PARAMS</small></h2>
    <div class="pbody">
      <div class="field">
        <label for="sizeSel">画布尺寸</label>
        <select id="sizeSel">
          <option value="poster" selected>海报 1200 × 1600</option>
          <option value="square">方图 1080 × 1080</option>
          <option value="banner">横幅 1600 × 900</option>
        </select>
      </div>
      <div class="field">
        <label for="hue">色相偏移 <span class="val" id="hueVal">12°</span></label>
        <input type="range" id="hue" min="0" max="360" step="1" value="12">
      </div>
      <div class="field">
        <label>颜料厚度</label>
        <div class="seg">
          <input type="radio" name="paint" id="pThin" value="thin"><label for="pThin">薄涂</label>
          <input type="radio" name="paint" id="pMid" value="mid" checked><label for="pMid">厚涂</label>
          <input type="radio" name="paint" id="pThick" value="thick"><label for="pThick">impasto</label>
        </div>
      </div>
      <div class="field">
        <div class="toggle">
          <span class="tg-name"><i style="background:var(--cadmium)"></i>画布颗粒（位图质感）</span>
          <label class="sw"><input type="checkbox" id="tGrain" checked><span></span></label>
        </div>
      </div>
      <div class="field">
        <div class="toggle">
          <span class="tg-name"><i style="background:var(--viridian)"></i>透明底（去天空衬底）</span>
          <label class="sw"><input type="checkbox" id="tAlpha"><span></span></label>
        </div>
      </div>
      <div class="field">
        <label>图层 <span class="hint">点掉即隐藏</span></label>
        <div class="layers">
          <label class="lay"><input type="checkbox" id="layBase" checked><i class="chip" style="background:var(--cobalt)"></i>色底层</label>
          <label class="lay"><input type="checkbox" id="layLine" checked><i class="chip" style="background:var(--ink)"></i>线稿层</label>
          <label class="lay"><input type="checkbox" id="layHi" checked><i class="chip" style="background:#fff"></i>高光层</label>
        </div>
      </div>
    </div>
  </aside>

  <!-- 中：实时预览 -->
  <section class="stagewrap">
    <div class="stagehead"><b>实时预览</b><span id="stageInfo">—</span></div>
    <div class="stage">
      <div id="canvasBox">
        <svg id="art" viewBox="0 0 480 360" preserveAspectRatio="xMidYMid slice" data-paint="mid" aria-label="向海坡地厚涂预览">
          <g id="layBaseG">
            <rect id="sky" x="0" y="0" width="480" height="360" fill="#bcd7ea"/>
            <rect x="0" y="252" width="480" height="108" fill="#2e6f9e"/>
            <circle cx="368" cy="84" r="38" fill="#f2b705" stroke="#2b2620" stroke-width="4"/>
            <path d="M0 268 L150 148 L262 246 L350 172 L480 258 L480 360 L0 360 Z" fill="#1e7a5f" stroke="#2b2620" stroke-width="4"/>
            <path d="M0 304 L110 232 L236 302 L360 238 L480 300 L480 360 L0 360 Z" fill="#c8402f" stroke="#2b2620" stroke-width="4"/>
          </g>
          <g id="layLineG" fill="none" stroke="#2b2620" stroke-linecap="round">
            <path class="sk" stroke-width="6" d="M14 330 C90 318 180 340 240 328 S400 340 466 326"/>
            <path class="sk" stroke-width="6" d="M20 344 C120 334 210 352 300 340 S430 350 466 342"/>
            <path class="sk" stroke-width="6" d="M300 52 l14 10 -14 10 M322 44 l14 10 -14 10"/>
          </g>
          <g id="layHiG" stroke="#fdfaf1" stroke-linecap="round" fill="none">
            <path class="sk" stroke-width="6" d="M150 158 l26 -8 M186 176 l30 -6"/>
            <path class="sk" stroke-width="6" d="M352 182 l26 -8 M104 242 l24 -6"/>
            <circle cx="368" cy="84" r="8" fill="#fdfaf1" stroke="none"/>
          </g>
        </svg>
        <div id="grain"></div>
      </div>
    </div>
    <div class="stagefoot">
      <span>所见即所得：左栏任何改动立即反映到画框。</span>
      <code id="paramEcho">—</code>
    </div>
  </section>

  <!-- 右：导出 -->
  <aside class="panel">
    <h2>导出作品 <small>EXPORT</small></h2>
    <div class="pbody">
      <div class="field">
        <label>导出格式</label>
        <div class="fmtcards">
          <label class="fmt sel"><input type="radio" name="fmt" value="png" checked><b>PNG</b><em>无损 · 支持透明</em></label>
          <label class="fmt"><input type="radio" name="fmt" value="jpg"><b>JPG</b><em>压缩 · 不支持透明</em></label>
          <label class="fmt"><input type="radio" name="fmt" value="svg"><b>SVG</b><em>矢量 · 不含位图质感</em></label>
        </div>
      </div>
      <div id="fmtWarn"></div>
      <button id="btnExport">导出作品<span id="prog"></span></button>
      <div id="outlet" aria-live="polite"></div>
      <div class="logwrap">
        <label style="display:block;font-size:12px;font-weight:700;margin-bottom:4px">导出记录</label>
        <ul id="expLog">
          <li><time>13:58</time><span>导出成功 向海坡地-v7_方图.png · 1.4 MB</span></li>
          <li class="deny"><time>13:41</time><span>导出被阻止：SVG 无法包含画布颗粒 · 未生成文件</span></li>
          <li><time>13:20</time><span>导出成功 向海坡地-v7_横幅.jpg · 0.6 MB</span></li>
        </ul>
      </div>
    </div>
  </aside>
</main>

<div id="toast" role="status"></div>

<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id);};
var SIZES={
  poster:{cls:"",label:"海报 1200×1600",w:1200,h:1600,name:"海报"},
  square:{cls:"size-square",label:"方图 1080×1080",w:1080,h:1080,name:"方图"},
  banner:{cls:"size-banner",label:"横幅 1600×900",w:1600,h:900,name:"横幅"}
};
var FMT={png:"PNG",jpg:"JPG",svg:"SVG"};
var state={size:"poster",hue:12,paint:"mid",grain:true,alpha:false,
  layers:{base:true,line:true,hi:true},fmt:"png"};
var art=$("art"),box=$("canvasBox");

function nowHM(){var d=new Date();return ("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2);}

function conflictOf(){
  if(state.fmt==="svg"&&state.grain) return {key:"svg-grain",
    why:"SVG 是矢量格式，无法封装「画布颗粒」这一位图滤镜。",
    fixes:["改用 PNG 导出","关闭画布颗粒"]};
  if(state.fmt==="jpg"&&state.alpha) return {key:"jpg-alpha",
    why:"JPG 格式不支持透明通道，开启「透明底」后无法压出合法文件。",
    fixes:["改用 PNG 导出","关闭透明底"]};
  return null;
}

function apply(){
  art.style.filter="hue-rotate("+state.hue+"deg)";
  art.setAttribute("data-paint",state.paint);
  $("hueVal").textContent=state.hue+"°";
  $("grain").style.opacity=state.paint==="thin"?".3":(state.paint==="mid"?".55":".8");
  $("sky").style.display=state.alpha?"none":"";
  $("layBaseG").style.display=state.layers.base?"":"none";
  $("layLineG").style.display=state.layers.line?"":"none";
  $("layHiG").style.display=state.layers.hi?"":"none";
  box.className="";if(SIZES[state.size].cls)box.classList.add(SIZES[state.size].cls);
  if(!state.grain)box.classList.add("nograin");
  if(state.alpha)box.classList.add("alpha");
  var vis=["色底","线稿","高光"].filter(function(n,i){return state.layers[["base","line","hi"][i]];}).join("+")||"无图层";
  $("stageInfo").textContent=SIZES[state.size].label;
  $("paramEcho").textContent="色相"+state.hue+"° · "+({thin:"薄涂",mid:"厚涂",thick:"impasto"})[state.paint]+
    (state.grain?" · 颗粒":"")+(state.alpha?" · 透明":"")+" · "+vis;
  var c=conflictOf(),w=$("fmtWarn");
  if(c){w.textContent="⚠ 当前组合会被阻止："+c.why;w.classList.add("on");}
  else w.classList.remove("on");
  var cards=document.querySelectorAll(".fmt");
  for(var i=0;i<cards.length;i++){
    cards[i].classList.toggle("sel",cards[i].querySelector("input").checked);
  }
}

function log(cls,text){
  var li=document.createElement("li");
  if(cls)li.className=cls;
  li.innerHTML="<time>"+nowHM()+"</time><span>"+text+"</span>";
  var ul=$("expLog");ul.insertBefore(li,ul.firstChild);
}
var tt;
function toast(kind,text){
  var t=$("toast");t.textContent=text;t.className="on "+kind;
  clearTimeout(tt);tt=setTimeout(function(){t.className="";},2400);
}

function sizeMB(){
  var px=SIZES[state.size].w*SIZES[state.size].h/1e6;
  var f={png:.9,jpg:.32,svg:0}[state.fmt];
  var paintK=state.paint==="thick"?1.25:(state.paint==="mid"?1:.8);
  var m=state.fmt==="svg"?(1.6+ (state.layers.base+state.layers.line+state.layers.hi)*.4):px*f*paintK;
  return m.toFixed(m<10?2:1)+" MB";
}

function renderOk(){
  var s=SIZES[state.size];
  var fname="向海坡地-v7_"+s.name+"."+state.fmt;
  $("outlet").innerHTML='<div class="card-out ok"><h3><i class="dot"></i>导出完成 · '+FMT[state.fmt]+
    '</h3><dl class="kv"><dt>文件</dt><dd>'+fname+'</dd><dt>尺寸</dt><dd>'+s.w+' × '+s.h+
    '</dd><dt>大小</dt><dd>'+sizeMB()+'</dd><dt>状态</dt><dd>已写入本地 · 模拟</dd></dl></div>';
  log("win","导出成功 "+fname+" · "+sizeMB());
  toast("ok2","导出完成："+fname);
}

function renderBad(c){
  $("outlet").innerHTML='<div class="card-out bad"><h3><i class="dot"></i>导出被阻止 · 设置冲突'+
    '</h3><p><b>'+c.why+'</b><br>本次导出未生成任何文件，画面数据没有被改动。</p>'+
    '<div class="fixbtns"><button data-fix="fmt">改用 PNG 导出</button>'+
    (state.fmt==="svg"?'<button data-fix="grain">关闭画布颗粒</button>':'<button data-fix="alpha">关闭透明底</button>')+
    '</div></div>';
  log("deny","导出被阻止："+(state.fmt==="svg"?"SVG ":"JPG ")+
    (state.fmt==="svg"?"无法包含画布颗粒":"与透明底冲突")+" · 未生成文件");
  toast("err","导出条件冲突，已阻止");
  var bs=$("outlet").querySelectorAll("[data-fix]");
  for(var i=0;i<bs.length;i++){
    bs[i].addEventListener("click",function(){
      if(this.getAttribute("data-fix")==="fmt"){
        state.fmt="png";document.querySelector('input[name=fmt][value=png]').checked=true;
      }else if(this.getAttribute("data-fix")==="grain"){
        state.grain=false;$("tGrain").checked=false;
      }else{state.alpha=false;$("tAlpha").checked=false;}
      $("outlet").innerHTML="";apply();
      toast("","已按建议改好设置，可重新导出");
    });
  }
}

$("btnExport").addEventListener("click",function(){
  var btn=this;
  var c=conflictOf();
  if(c){renderBad(c);return;}
  btn.disabled=true;var prog=$("prog");prog.style.width="0";
  requestAnimationFrame(function(){prog.style.transition="width .7s linear";prog.style.width="100%";});
  setTimeout(function(){
    btn.disabled=false;prog.style.transition="none";prog.style.width="0";
    renderOk();
  },760);
});

$("sizeSel").addEventListener("change",function(){state.size=this.value;$("outlet").innerHTML="";apply();});
$("hue").addEventListener("input",function(){state.hue=+this.value;apply();});
var ps=document.querySelectorAll('input[name=paint]');
for(var i=0;i<ps.length;i++){ps[i].addEventListener("change",function(){state.paint=this.value;apply();});}
$("tGrain").addEventListener("change",function(){state.grain=this.checked;apply();});
$("tAlpha").addEventListener("change",function(){state.alpha=this.checked;apply();});
$("layBase").addEventListener("change",function(){state.layers.base=this.checked;apply();});
$("layLine").addEventListener("change",function(){state.layers.line=this.checked;apply();});
$("layHi").addEventListener("change",function(){state.layers.hi=this.checked;apply();});
var fs=document.querySelectorAll('input[name=fmt]');
for(var j=0;j<fs.length;j++){fs[j].addEventListener("change",function(){state.fmt=this.value;$("outlet").innerHTML="";apply();});}

apply();
})();
</script>
</body>
</html>
