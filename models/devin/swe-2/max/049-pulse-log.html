<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>脉动录 · 每日活动记录</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --coral-900:#8c2f1f;
  --coral-700:#c93b25;
  --coral-600:#e0452f;
  --coral-500:#ff5a45;
  --coral-400:#ff7a63;
  --coral-300:#ffa794;
  --coral-200:#ffc9bc;
  --coral-100:#ffe9e3;
  --cream:#fff4f0;
  --card:#ffffff;
  --ink:#38160f;
  --ink-2:#7d4c44;
  --ink-3:#bd968d;
  --line:#f7dcd4;
  --danger:#d61f0e;
  --gold:#ffd9a0;
  --deep:#42150f;
}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(900px 600px at 18% -10%,#7a291b 0%,rgba(122,41,27,0) 55%),radial-gradient(700px 500px at 92% 108%,#5e1e12 0%,rgba(94,30,18,0) 60%),var(--deep);
  color:var(--ink);
}
.phone{
  width:392px;height:min(852px,calc(100vh - 48px));min-height:620px;
  background:#2a0f0a;border-radius:46px;padding:11px;
  box-shadow:0 40px 90px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.06),inset 0 0 0 2px #572016;
}
.screen{
  position:relative;height:100%;border-radius:36px;overflow:hidden;
  background:var(--cream);display:flex;flex-direction:column;
}
.statusbar{
  height:40px;display:flex;align-items:center;justify-content:space-between;
  padding:0 22px;font-size:12.5px;font-weight:700;color:var(--ink);flex:none;
}
.statusbar .icons{display:flex;gap:6px;align-items:center}
.statusbar svg{display:block}
.app{flex:1;overflow-y:auto;padding:2px 16px 20px;scrollbar-width:none}
.app::-webkit-scrollbar{display:none}
.hd{display:flex;justify-content:space-between;align-items:flex-end;padding:10px 4px 14px}
.eyebrow{font-size:11px;letter-spacing:.16em;color:#c47a6a;font-weight:600}
.hd h1{font-size:27px;letter-spacing:.02em;color:var(--ink);line-height:1.15;margin-top:3px}
.streak{
  background:var(--coral-100);border:1px solid var(--coral-200);color:var(--coral-700);
  font-size:12px;font-weight:700;padding:7px 11px;border-radius:999px;
  display:flex;align-items:center;gap:5px;
}
.hero{
  position:relative;overflow:hidden;border-radius:24px;padding:20px;
  background:linear-gradient(135deg,#ff6a4d 0%,#e8422a 58%,#d6341d 100%);
  color:#fff;display:flex;align-items:center;gap:18px;
  box-shadow:0 16px 34px rgba(228,61,36,.35);
}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.hero::before{width:240px;height:240px;right:-76px;top:-96px;border:1px solid rgba(255,255,255,.16)}
.hero::after{width:150px;height:150px;right:44px;bottom:-86px;border:14px solid rgba(255,255,255,.07)}
.ring-wrap{position:relative;width:132px;height:132px;flex:none}
.ring{width:132px;height:132px;transform:rotate(-90deg)}
.ring-track{fill:none;stroke:rgba(255,255,255,.28);stroke-width:11}
.ring-fill{
  fill:none;stroke:#ffffff;stroke-width:11;stroke-linecap:round;
  filter:drop-shadow(0 0 6px rgba(255,255,255,.55));
  transition:stroke-dashoffset .9s cubic-bezier(.33,.9,.25,1);
}
.ring-center{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;
}
.ring-center strong{font-size:25px;line-height:1;font-variant-numeric:tabular-nums}
.ring-center span{font-size:10.5px;opacity:.85;margin-top:5px;letter-spacing:.08em}
.hero-text{position:relative;flex:1;min-width:0}
.hero-goal{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.hero-goal small{font-size:12px;font-weight:600;opacity:.85;margin-left:2px}
.hero-sub{font-size:12px;opacity:.92;margin-top:6px;line-height:1.5}
.goal-badge{
  display:none;margin-top:9px;background:rgba(255,255,255,.22);color:#fff;
  font-size:11px;font-weight:700;padding:5px 9px;border-radius:999px;
  border:1px solid rgba(255,255,255,.4);align-items:center;gap:4px;
}
.hero.done .goal-badge{display:inline-flex}
.stats{display:flex;gap:10px;margin-top:14px}
.stat{
  flex:1;background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:11px 10px 10px;box-shadow:0 5px 14px rgba(190,72,45,.06);
}
.stat b{font-size:17px;color:var(--coral-600);font-variant-numeric:tabular-nums;display:block}
.stat span{font-size:11px;color:var(--ink-3);margin-top:2px;display:block}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:20px;
  padding:16px;margin-top:14px;box-shadow:0 6px 18px rgba(190,72,45,.07);
}
.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.card h2{font-size:15px;color:var(--ink);font-weight:700}
.tag{font-size:10.5px;color:var(--coral-600);background:var(--coral-100);border-radius:999px;padding:3px 8px;font-weight:600}
.chart{position:relative;height:112px;display:flex;align-items:flex-end;gap:8px;padding-top:14px}
.goal-line{
  position:absolute;left:0;right:0;border-top:1.5px dashed rgba(224,69,47,.5);pointer-events:none;
}
.goal-line span{
  position:absolute;right:0;top:-9px;font-size:9.5px;color:var(--coral-600);
  background:var(--card);padding:0 4px;font-weight:600;
}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;position:relative;z-index:1}
.bar-val{font-size:9.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.bar{
  width:100%;max-width:26px;border-radius:7px 7px 3px 3px;background:var(--coral-200);
  transition:height .8s cubic-bezier(.33,.9,.25,1);
}
.bar-col.today .bar{background:linear-gradient(180deg,var(--coral-400),var(--coral-600));box-shadow:0 4px 10px rgba(224,69,47,.35)}
.bar-col.today .bar-val{color:var(--coral-600);font-weight:700}
.bar-day{font-size:10.5px;color:var(--ink-3)}
.bar-col.today .bar-day{color:var(--coral-600);font-weight:700}
.trend-msg{font-size:12.5px;color:var(--ink-2);margin-top:12px;line-height:1.6}
.trend-msg b{color:var(--coral-600)}
.chips{display:flex;gap:8px;margin-bottom:14px}
.chip{
  flex:1;padding:10px 0;border:1px solid var(--coral-200);background:#fff;border-radius:12px;
  font-size:13.5px;color:var(--ink-2);cursor:pointer;transition:all .15s;font-family:inherit;
}
.chip.on{
  background:var(--coral-500);border-color:var(--coral-500);color:#fff;font-weight:700;
  box-shadow:0 6px 14px rgba(255,90,69,.3);
}
.f-label{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:600;color:var(--ink);margin-bottom:8px}
.f-label .range{font-size:11px;color:var(--ink-3);font-weight:400}
.dur-row{display:flex;gap:8px}
.dur-input{
  flex:1;min-width:0;font-size:16px;padding:12px 14px;border:1.5px solid #ecc9c0;
  border-radius:12px;background:#fffafa;color:var(--ink);outline:none;font-family:inherit;
  font-variant-numeric:tabular-nums;transition:border-color .15s,box-shadow .15s,background .15s;
}
.dur-input::placeholder{color:#d3a99f}
.dur-input:focus{border-color:var(--coral-500);box-shadow:0 0 0 3px rgba(255,90,69,.15);background:#fff}
.dur-input.err{border-color:var(--danger);background:#fff0ec;box-shadow:0 0 0 3px rgba(214,31,14,.13)}
.qbtn{
  padding:0 13px;border-radius:12px;border:1px solid var(--coral-200);color:var(--coral-700);
  background:#fff;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;transition:all .15s;flex:none;
}
.qbtn:active{transform:scale(.95)}
.err-row{
  display:none;align-items:flex-start;gap:6px;margin-top:9px;
  color:var(--danger);font-size:12.5px;line-height:1.5;
}
.err-row.show{display:flex}
.err-row svg{flex:none;margin-top:2px}
.save{
  margin-top:14px;width:100%;padding:14px;border:none;border-radius:14px;
  background:linear-gradient(135deg,#ff6a4d,#e8422a);color:#fff;font-size:16px;font-weight:800;
  letter-spacing:.06em;cursor:pointer;font-family:inherit;
  box-shadow:0 10px 22px rgba(228,61,36,.32);transition:transform .12s,box-shadow .12s;
}
.save:active{transform:scale(.98);box-shadow:0 5px 12px rgba(228,61,36,.3)}
.form-hint{font-size:11px;color:var(--ink-3);margin-top:9px;text-align:center}
.rec{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid #f9e4de}
.rec:first-child{border-top:none;padding-top:2px}
.rec-dot{
  width:36px;height:36px;border-radius:12px;background:var(--coral-100);flex:none;
  display:flex;align-items:center;justify-content:center;color:var(--coral-600);
}
.rec-t{flex:1;min-width:0}
.rec-t b{font-size:13.5px;color:var(--ink);display:block}
.rec-t span{font-size:11.5px;color:var(--ink-3)}
.rec-m{font-weight:800;color:var(--coral-600);font-size:15px;font-variant-numeric:tabular-nums;flex:none}
.rec.new{animation:pop .45s ease}
@keyframes pop{from{opacity:0;transform:translateY(-6px)}}
.empty{font-size:12.5px;color:var(--ink-3);text-align:center;padding:10px 0 4px}
.tabbar{
  display:flex;border-top:1px solid var(--line);background:#fff;flex:none;
  padding:6px 4px 10px;
}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:10.5px;color:var(--ink-3);padding:7px 0 4px;cursor:pointer;
  background:none;border:none;font-family:inherit;
}
.tab.on{color:var(--coral-600);font-weight:700}
.tab svg{width:20px;height:20px}
.toast{
  position:absolute;left:16px;right:16px;top:12px;z-index:20;
  background:rgba(56,22,15,.94);color:#ffece7;padding:12px 14px;border-radius:14px;
  font-size:12.5px;display:flex;gap:8px;align-items:center;line-height:1.5;
  transform:translateY(-150%);transition:transform .45s cubic-bezier(.2,.9,.3,1.15);
  box-shadow:0 12px 30px rgba(0,0,0,.28);pointer-events:none;
}
.toast.show{transform:translateY(0)}
.toast svg{flex:none}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
.shake{animation:shake .4s ease}
@media (max-width:430px){
  body{padding:0;display:block}
  .phone{width:100%;height:100dvh;min-height:0;border-radius:0;padding:0;box-shadow:none}
  .screen{border-radius:0}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="stage">
  <div class="phone">

      <div class="statusbar">
        <span>9:41</span>
        <span class="icons">
          <svg width="16" height="11" viewBox="0 0 16 11" fill="none"><rect x="0" y="7" width="3" height="4" rx="0.8" fill="#38160f"/><rect x="4.5" y="5" width="3" height="6" rx="0.8" fill="#38160f"/><rect x="9" y="2.5" width="3" height="8.5" rx="0.8" fill="#38160f"/><rect x="13" y="0" width="3" height="11" rx="0.8" fill="#38160f" opacity=".3"/></svg>
          <svg width="15" height="11" viewBox="0 0 15 11" fill="none"><path d="M7.5 10.2 5.6 8.1a2.8 2.8 0 0 1 3.8 0Z" fill="#38160f"/><path d="M3.6 6.2a5.6 5.6 0 0 1 7.8 0L10 7.8a3.6 3.6 0 0 0-5 0Z" fill="#38160f"/><path d="M1.2 3.8a9.4 9.4 0 0 1 12.6 0l-1.4 1.6a7.4 7.4 0 0 0-9.8 0Z" fill="#38160f"/></svg>
          <svg width="24" height="11" viewBox="0 0 24 11" fill="none"><rect x="0" y="0.5" width="20" height="10" rx="2.6" stroke="#38160f" opacity=".4"/><rect x="1.8" y="2.3" width="13" height="6.4" rx="1.4" fill="#38160f"/><path d="M22.5 3.5v4a1.8 1.8 0 0 0 0-4Z" fill="#38160f" opacity=".4"/></svg>
        </span>
      </div>
      <div class="app" id="appScroll">
        <header class="hd">
          <div>
            <p class="eyebrow">9月23日 周三</p>
            <h1>脉动录</h1>
          </div>
          <span class="streak">
            <svg width="12" height="14" viewBox="0 0 12 14" fill="none"><path d="M6 .8C6.8 3 3.4 4.4 3.4 7.4a2.6 2.6 0 0 0 5.2.4c.5 1.2 1.6.6 1.6-.6C10.2 4.6 7.6 3.4 6 .8Z" fill="#e0452f"/><path d="M6 13.4a4.9 4.9 0 0 1-4.4-4.9C1.6 5.3 4 4.2 4.6 2.4c.4 1.4 1.9 2 1.9 3.7" stroke="#e0452f" stroke-width=".9" stroke-linecap="round"/></svg>

          </span>
        </header>
        <section class="hero" id="hero">
          <div class="ring-wrap">
            <svg class="ring" viewBox="0 0 148 148">
              <circle class="ring-track" cx="74" cy="74" r="64"></circle>
              <circle class="ring-fill" id="ringFill" cx="74" cy="74" r="64"></circle>
            </svg>
            <div class="ring-center">
              <strong id="pctText">54%</strong>
              <span>今日目标</span>
            </div>
          </div>
          <div class="hero-text">
            <p class="hero-goal"><span id="todayMin">27</span><small> / </small><span id="goalMin">50</span><small> 分钟</small></p>
            <p class="hero-sub" id="heroSub">还差 23 分钟达成今日目标</p>
            <span class="goal-badge" id="goalBadge">
              <svg width="11" height="11" viewBox="0 0 12 12" fill="none"><path d="M2 6.4 4.8 9 10 3.4" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
              目标达成
            </span>
          </div>
        </section>
        <section class="stats">
          <div class="stat"><b id="statWeek">240</b><span>本周累计(分)</span></div>
          <div class="stat"><b id="statCount">2</b><span>今日记录(次)</span></div>
          <div class="stat"><b>6</b><span>连续打卡(天)</span></div>
        </section>
        <section class="card" id="trendCard">
          <div class="card-head">
            <h2>七日趋势</h2>
            <span class="tag">随记录更新</span>
          </div>
          <div class="chart" id="chart">
            <div class="goal-line" id="goalLine"><span>目标 50</span></div>
          </div>
          <p class="trend-msg" id="trendMsg"></p>
        </section>
        <section class="card" id="formCard">
          <div class="card-head">
            <h2>记录一次活动</h2>
            <span class="tag">计入今日</span>
          </div>
          <div class="chips" id="chips">
            <button class="chip on" data-type="跑步">跑步</button>
            <button class="chip" data-type="骑行">骑行</button>
            <button class="chip" data-type="健走">健走</button>
            <button class="chip" data-type="游泳">游泳</button>
          </div>
          <div class="f-label">
            <span>活动时长（分钟）</span>
            <span class="range">单次 1–240，超范围无法保存</span>
          </div>
          <div class="dur-row">
            <input class="dur-input" id="durInput" type="text" inputmode="numeric" placeholder="例如 20" autocomplete="off">
            <button class="qbtn" data-add="10">+10</button>
            <button class="qbtn" data-add="20">+20</button>
          </div>
          <p class="err-row" id="errRow">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="6" stroke="#d61f0e" stroke-width="1.4"/><path d="M7 4v3.4" stroke="#d61f0e" stroke-width="1.6" stroke-linecap="round"/><circle cx="7" cy="10" r="0.9" fill="#d61f0e"/></svg>
            <span id="errText"></span>
          </p>
          <button class="save" id="saveBtn">保存记录</button>
          <p class="form-hint">无效数据不会写入，进度保持不变</p>
        </section>
        <section class="card">
          <div class="card-head">
            <h2>今日记录</h2>
            <span class="tag" id="recTotal">共 27 分钟</span>
          </div>
          <ul id="recList" style="list-style:none"></ul>
        </section>
      </div>
      <nav class="tabbar">
        <button class="tab on" data-goto="top">
          <svg viewBox="0 0 20 20" fill="none"><path d="M3 8.6 10 3l7 5.6V16a1 1 0 0 1-1 1h-4v-5H8v5H4a1 1 0 0 1-1-1Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>

        </button>
        <button class="tab" data-goto="form">
          <svg viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="7.2" stroke="currentColor" stroke-width="1.5"/><path d="M10 6.8v6.4M6.8 10h6.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          记一笔
        </button>
        <button class="tab" data-goto="trend">
          <svg viewBox="0 0 20 20" fill="none"><path d="M3.5 16.5h13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M5.5 16V11M10 16V6.5M14.5 16V9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          趋势
        </button>
      </nav>
      <div class="toast" id="toast">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="7" stroke="#ffd9a0" stroke-width="1.4"/><path d="M5 8.2 7.2 10.4 11 5.8" stroke="#ffd9a0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span id="toastText"></span>
      </div>
    </div>
  </div>
</div>
<script>
(function(){
  var GOAL=50,MAXV=240,BARH=92;
  var week=[{d:'四',v:32},{d:'五',v:45},{d:'六',v:18},{d:'日',v:52},{d:'一',v:40},{d:'二',v:26},{d:'今天',v:27}];
  var state={today:27,count:2};
  var records=[{type:'通勤快走',min:12,time:'08:40'},{type:'晨跑',min:15,time:'07:20'}];
  var selType='跑步';
  var C=2*Math.PI*64;
  var ring=document.getElementById('ringFill');
  ring.style.strokeDasharray=C;
  var chart=document.getElementById('chart');
  week.forEach(function(w,i){
    var col=document.createElement('div');
    col.className='bar-col'+(i===6?' today':'');
    col.innerHTML='<span class="bar-val">'+w.v+'</span><div class="bar"></div><span class="bar-day">'+w.d+'</span>';
    chart.appendChild(col);
  });
  var bars=chart.querySelectorAll('.bar');
  var vals=chart.querySelectorAll('.bar-val');
  var goalLine=document.getElementById('goalLine');
  var prevAvg=Math.round((32+45+18+52+40+26)/6);
  function renderTrend(){
    var max=GOAL;
    week.forEach(function(w){if(w.v>max)max=w.v});
    max=max*1.12;
    week.forEach(function(w,i){
      bars[i].style.height=Math.max(6,w.v/max*BARH)+'px';
      vals[i].textContent=w.v;
    });
    goalLine.style.bottom=(14+GOAL/max*BARH)+'px';
    var msg=document.getElementById('trendMsg');
    var diff=Math.round((state.today-prevAvg)/prevAvg*100);
    if(state.today>=prevAvg){
      msg.innerHTML='今日已记 <b>'+state.today+'</b> 分钟，超出近六日均值（'+prevAvg+' 分）<b>'+diff+'%</b>，趋势向上。';
    }else{
      msg.innerHTML='今日已记 <b>'+state.today+'</b> 分钟，距近六日均值（'+prevAvg+' 分）还差 <b>'+Math.abs(diff)+'%</b>，再补一段就追平。';
    }
  }
  function renderHero(){
    var pct=Math.min(state.today/GOAL,1);
    ring.style.strokeDashoffset=C*(1-pct);
    document.getElementById('pctText').textContent=Math.round(state.today/GOAL*100)+'%';
    document.getElementById('todayMin').textContent=state.today;
    var sub=document.getElementById('heroSub');
    var hero=document.getElementById('hero');
    if(state.today>=GOAL){
      hero.classList.add('done');
      sub.textContent='今日累计 '+state.today+' 分钟，已超标完成';
    }else{
      hero.classList.remove('done');
      sub.textContent='还差 '+(GOAL-state.today)+' 分钟达成今日目标';
    }
  }
  function renderStats(){
    var total=week.reduce(function(s,w){return s+w.v},0);
    document.getElementById('statWeek').textContent=total;
    document.getElementById('statCount').textContent=state.count;
    document.getElementById('recTotal').textContent='共 '+state.today+' 分钟';
  }
  var recList=document.getElementById('recList');
  var icons={
    '跑步':'<svg width="17" height="17" viewBox="0 0 18 18" fill="none"><circle cx="11" cy="3.4" r="1.6" stroke="currentColor" stroke-width="1.4"/><path d="M3.5 13.5l3-1 1.6-3 2.2.8 2-1.6M8 7.5l3-1 2 1.8 2.5-.6M6.5 16.5l1-3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    '骑行':'<svg width="17" height="17" viewBox="0 0 18 18" fill="none"><circle cx="4.5" cy="12.5" r="2.8" stroke="currentColor" stroke-width="1.4"/><circle cx="13.5" cy="12.5" r="2.8" stroke="currentColor" stroke-width="1.4"/><path d="M4.5 12.5 7 6h3.5l3 6.5M7 6 6 3.8h2.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    '健走':'<svg width="17" height="17" viewBox="0 0 18 18" fill="none"><circle cx="9.5" cy="3.4" r="1.6" stroke="currentColor" stroke-width="1.4"/><path d="M9.5 6v3.5l-2.5 3v3.5M9.5 9.5l2.8 2.4 1 3.6M7 8l-2.6 1.4M11.8 7l2.4 1.8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    '游泳':'<svg width="17" height="17" viewBox="0 0 18 18" fill="none"><circle cx="12.5" cy="4.5" r="1.6" stroke="currentColor" stroke-width="1.4"/><path d="M2.5 8.5 7 6l3.5 2M2 12.5c1.5 1.3 3 1.3 4.5 0s3-1.3 4.5 0 3 1.3 4.5 0" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>'
  };
  function recItem(r,fresh){
    var li=document.createElement('li');
    li.className='rec'+(fresh?' new':'');
    li.innerHTML='<span class="rec-dot">'+icons[r.type]+'</span><span class="rec-t"><b>'+r.type+'</b><span>'+r.time+'</span></span><span class="rec-m">+'+r.min+'′</span>';
    return li;
  }
  function renderRecords(){
    recList.innerHTML='';
    records.forEach(function(r){recList.appendChild(recItem(r,false))});
  }
  var dur=document.getElementById('durInput');
  var errRow=document.getElementById('errRow');
  var errText=document.getElementById('errText');
  function showError(msg){
    errText.textContent=msg;
    errRow.classList.add('show');
    dur.classList.add('err');
    dur.classList.remove('shake');
    void dur.offsetWidth;
    dur.classList.add('shake');
  }
  function clearError(){
    errRow.classList.remove('show');
    dur.classList.remove('err');
  }
  dur.addEventListener('input',clearError);
  var toast=document.getElementById('toast');
  var toastTimer=null;
  function showToast(msg){
    document.getElementById('toastText').textContent=msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer=setTimeout(function(){toast.classList.remove('show')},2600);
  }
  function nowTime(){
    var d=new Date();
    var h=d.getHours(),m=d.getMinutes();
    return (h<10?'0':'')+h+':'+(m<10?'0':'')+m;
  }
  document.getElementById('saveBtn').addEventListener('click',function(){
    var raw=dur.value.trim();
    var v=Number(raw);
    if(raw===''||!Number.isFinite(v)||!Number.isInteger(v)){
      showError('「活动时长」需填写 1–240 之间的整数分钟，当前内容无法保存。');
      return;
    }
    if(v<1||v>MAXV){
      showError('「活动时长」需在 1–240 分钟之间，'+v+' 超出合理范围，已拦截未保存。');
      return;
    }
    clearError();
    var before=Math.round(state.today/GOAL*100);
    state.today+=v;
    state.count+=1;
    week[6].v=state.today;
    records.unshift({type:selType,min:v,time:nowTime()});
    renderHero();renderStats();renderTrend();
    recList.insertBefore(recItem(records[0],true),recList.firstChild);
    var after=Math.round(state.today/GOAL*100);
    dur.value='';
    if(state.today>=GOAL&&before<100){
      showToast('已保存 · 进度 '+before+'% → '+after+'% · 今日目标已达成');
    }else{
      showToast('已保存 · 今日进度 '+before+'% → '+after+'%');
    }
  });
  document.getElementById('chips').addEventListener('click',function(e){
    var b=e.target.closest('.chip');
    if(!b)return;
    this.querySelectorAll('.chip').forEach(function(c){c.classList.remove('on')});
    b.classList.add('on');
    selType=b.getAttribute('data-type');
  });
  document.querySelectorAll('.qbtn').forEach(function(b){
    b.addEventListener('click',function(){
      var cur=Number(dur.value.trim());
      var base=Number.isInteger(cur)?cur:0;
      dur.value=base+Number(b.getAttribute('data-add'));
      clearError();
    });
  });
  var appScroll=document.getElementById('appScroll');
  document.querySelectorAll('.tab').forEach(function(t){
    t.addEventListener('click',function(){
      document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('on')});
      t.classList.add('on');
      var g=t.getAttribute('data-goto');
      if(g==='form'){document.getElementById('formCard').scrollIntoView({behavior:'smooth',block:'start'})}
      else if(g==='trend'){document.getElementById('trendCard').scrollIntoView({behavior:'smooth',block:'start'})}
      else{appScroll.scrollTo({top:0,behavior:'smooth'})}
    });
  });
  renderHero();renderStats();renderTrend();renderRecords();
})();
</script>
</body>
</html>
