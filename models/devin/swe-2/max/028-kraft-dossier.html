<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>进驻申请 · 产业园区入驻登记表</title>
<style>
  :root{
    --kraft:#d9c5a0; --kraft-deep:#c4ad82; --paper:#f2ead6; --paper-2:#e9dec4;
    --ink:#2b2418; --ink-soft:#6b5d43; --faded:#94815f; --line:#a8936d; --red:#b3382a; --green:#4a6b3a;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    background:var(--kraft);color:var(--ink);
    font-family:"Songti SC","STSong","Noto Serif CJK SC",Georgia,serif;min-height:100vh;
  }
  .page{max-width:960px;margin:0 auto;padding:46px 30px 90px}
  .dossier{
    background:var(--paper);border:1px solid var(--line);
    box-shadow:0 2px 0 var(--kraft-deep),0 18px 44px #6b5a3522;padding:44px 48px 50px;position:relative;
  }
  .dossier::before{
    content:"机密 · 普";position:absolute;top:26px;right:34px;color:var(--red);
    border:2px solid var(--red);padding:4px 10px;font-size:12px;letter-spacing:3px;
    transform:rotate(6deg);opacity:.75;
  }
  .redhead{text-align:center;border-bottom:3px double var(--red);padding-bottom:20px;margin-bottom:10px}
  .redhead .org{font-size:26px;color:var(--red);letter-spacing:10px;font-weight:700}
  .redhead .doc{font-size:20px;letter-spacing:6px;margin-top:14px;font-weight:600}
  .redhead .no{font-size:12px;color:var(--ink-soft);letter-spacing:2px;margin-top:12px}
  .hintline{font-size:12.5px;color:var(--ink-soft);padding:14px 0 26px;letter-spacing:1px;display:flex;justify-content:space-between}
  .layout{display:grid;grid-template-columns:170px 1fr;gap:34px}
  nav.jump{position:sticky;top:30px;align-self:start}
  nav.jump .j{
    display:block;font-size:13.5px;letter-spacing:2px;color:var(--ink-soft);
    padding:10px 0 10px 16px;border-left:3px solid var(--line);cursor:pointer;transition:all .2s;
    text-decoration:none;
  }
  nav.jump .j:hover{color:var(--ink)}
  nav.jump .j.on{color:var(--red);border-left-color:var(--red);font-weight:600}
  section.sec{border:1px solid var(--ink);margin-bottom:26px;background:#faf5e8}
  section.sec>h2{
    background:var(--ink);color:var(--paper);font-size:14px;letter-spacing:5px;
    padding:10px 18px;font-weight:600;
  }
  section.sec .body{padding:22px 22px 24px}
  .f{margin-bottom:18px}
  .f:last-child{margin-bottom:0}
  .f label{display:block;font-size:13.5px;margin-bottom:8px;letter-spacing:1px}
  .f label .req{color:var(--red);margin-left:4px}
  .f label .opt{color:var(--faded);font-size:12px;margin-left:6px}
  .f input[type=text],.f input[type=tel],.f input[type=email],.f select,.f textarea{
    width:100%;font-family:inherit;font-size:14px;color:var(--ink);
    background:#fffdf6;border:1px solid var(--line);padding:10px 13px;outline:none;transition:border-color .15s;
  }
  .f textarea{min-height:88px;resize:vertical;line-height:1.8}
  .f input:focus,.f select:focus,.f textarea:focus{border-color:var(--ink);box-shadow:0 0 0 2px #2b241822}
  .f .sub{font-size:11.5px;color:var(--faded);margin-top:6px;letter-spacing:1px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .actions{
    display:flex;gap:16px;justify-content:flex-end;margin-top:8px;align-items:center;
  }
  .draft-status{font-size:12.5px;color:var(--faded);margin-right:auto;letter-spacing:1px}
  .btn{
    font-family:inherit;font-size:15px;letter-spacing:5px;cursor:pointer;padding:13px 34px;
    transition:all .2s ease;border-radius:2px;
  }
  .btn-ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
  .btn-ghost:hover{background:var(--paper-2)}
  .btn-main{background:var(--red);color:#f7ecd8;border:1.5px solid var(--red)}
  .btn-main:hover{background:#9c2f23;transform:translateY(-1px)}
  .btn:focus-visible{outline:2px solid var(--red);outline-offset:2px}
  .toast{
    position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(90px);
    background:var(--ink);color:var(--paper);padding:12px 26px;font-size:13.5px;letter-spacing:2px;
    transition:transform .3s ease;
  }
  .toast.show{transform:translateX(-50%) translateY(0)}
  @media (max-width:820px){
    .layout{grid-template-columns:1fr}
    nav.jump{position:static;display:flex;gap:6px;flex-wrap:wrap}
    nav.jump .j{border-left:none;border-bottom:2px solid var(--line);padding:8px 4px}
    nav.jump .j.on{border-bottom-color:var(--red)}
    .two{grid-template-columns:1fr}
    .dossier{padding:28px 20px 36px}
    .dossier::before{top:14px;right:14px;font-size:10px}
  }
  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto}
    *{transition:none!important;animation:none!important}
  }
</style>
</head>
<body>
<div class="page">
  <div class="dossier">
    <div class="redhead">
      <div class="org">望江产业园区管理委员会</div>
      <div class="doc">企 业 进 驻 申 请 登 记 表</div>
      <div class="no">望园字〔2026〕第 047 号 · 编号 WJ-RU-2026-0914</div>
    </div>
    <div class="hintline"><span>＊ 为必填项；填毕请提交，纸质材料同步寄管委会招商科</span><span>共三节</span></div>

    <div class="layout">
      <nav class="jump" id="jump">
        <a class="j on" href="#s1">一、企业概况</a>
        <a class="j" href="#s2">二、进驻需求</a>
        <a class="j" href="#s3">三、联系与承诺</a>
      </nav>

      <form id="form" novalidate>
        <section class="sec" id="s1">
          <h2>一、企业概况</h2>
          <div class="body">
            <div class="f"><label>企业全称<span class="req">＊</span></label><input type="text" placeholder="例：望江云杉数据科技有限公司"></div>
            <div class="two">
              <div class="f"><label>统一社会信用代码<span class="req">＊</span></label><input type="text" placeholder="18 位代码"></div>
              <div class="f"><label>成立年份<span class="req">＊</span></label><select><option>2020 年之后</option><option>2010–2019</option><option>2009 年及以前</option></select></div>
            </div>
            <div class="two">
              <div class="f"><label>所属行业<span class="req">＊</span></label><select><option>数字技术</option><option>智能制造</option><option>文化创意</option><option>现代服务</option><option>其他</option></select></div>
              <div class="f"><label>现有员工数</label><input type="text" placeholder="选填"></div>
            </div>
            <div class="f"><label>主营业务简介<span class="req">＊</span></label><textarea placeholder="一两句话说明做什么、主要产品是什么"></textarea></div>
          </div>
        </section>

        <section class="sec" id="s2">
          <h2>二、进驻需求</h2>
          <div class="body">
            <div class="two">
              <div class="f"><label>拟进驻区域<span class="req">＊</span></label><select><option>研发办公区</option><option>中试厂房</option><option>展示中心</option><option>配套服务区</option></select></div>
              <div class="f"><label>需求面积（㎡）<span class="req">＊</span></label><input type="text" placeholder="例：800"></div>
            </div>
            <div class="two">
              <div class="f"><label>计划入驻时间<span class="req">＊</span></label><select><option>一个月内</option><option>三个月内</option><option>半年内</option></select></div>
              <div class="f"><label>水电气特殊要求</label><input type="text" placeholder="选填，如恒温恒湿"></div>
            </div>
            <div class="f"><label>其他需求说明</label><textarea placeholder="选填，如卸货平台、环评要求等"></textarea></div>
          </div>
        </section>

        <section class="sec" id="s3">
          <h2>三、联系与承诺</h2>
          <div class="body">
            <div class="two">
              <div class="f"><label>联系人姓名<span class="req">＊</span></label><input type="text" placeholder="经办人"></div>
              <div class="f"><label>联系电话<span class="req">＊</span></label><input type="tel" placeholder="手机或座机"></div>
            </div>
            <div class="f"><label>电子邮箱<span class="opt">（选填）</span></label><input type="email" placeholder="用于接收入驻回执"></div>
            <div class="f" style="display:flex;gap:10px;align-items:flex-start">
              <input type="checkbox" id="promise" style="margin-top:4px;accent-color:#b3382a">
              <label for="promise" style="margin:0;font-size:13px;line-height:1.7">本单位承诺：所填内容真实有效，如有虚假愿承担相应责任。<span class="req">＊</span></label>
            </div>
          </div>
        </section>

        <div class="actions">
          <span class="draft-status" id="draftStatus">草稿未保存</span>
          <button type="button" class="btn btn-ghost" id="draftBtn">存为草稿</button>
          <button type="submit" class="btn btn-main" id="submitBtn">提交申请</button>
        </div>
      </form>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const links=document.querySelectorAll('#jump .j');
const secs=[...document.querySelectorAll('section.sec')];
links.forEach(l=>l.addEventListener('click',e=>{
  e.preventDefault();
  document.querySelector(l.getAttribute('href')).scrollIntoView({behavior:'smooth',block:'start'});
}));
const spy=()=>{
  let idx=0;
  secs.forEach((s,i)=>{if(s.getBoundingClientRect().top<160)idx=i;});
  links.forEach((l,i)=>l.classList.toggle('on',i===idx));
};
document.addEventListener('scroll',spy,{passive:true});
function toast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2400);
}
document.getElementById('draftBtn').addEventListener('click',()=>{
  const t=new Date();
  document.getElementById('draftStatus').textContent='草稿已保存 · '+t.getHours()+':'+String(t.getMinutes()).padStart(2,'0');
  toast('草稿已存入本机，可稍后续填');
});
document.getElementById('form').addEventListener('submit',e=>{
  e.preventDefault();
  if(!document.getElementById('promise').checked){toast('请先勾选承诺条款');document.getElementById('s3').scrollIntoView({behavior:'smooth'});return;}
  toast('申请已提交 · 受理号将在 3 个工作日内送达');
});
</script>
</body>
</html>
