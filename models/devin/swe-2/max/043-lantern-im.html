<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>灯语 · 灯下有人等你说话</title>
<style>
:root{
  --night:#17100d;
  --bg:#261712;
  --surface:#342016;
  --surface-2:#40261a;
  --line:#4d3122;
  --paper:#f3dcba;
  --paper-deep:#e8c89a;
  --paper-text:#4a2c18;
  --flame:#e8873b;
  --flame-deep:#cf6f28;
  --glow:#ffb45e;
  --lantern:#c8462b;
  --lantern-deep:#9e341f;
  --text:#f5e8d2;
  --muted:#b08f6f;
  --danger:#e05a3a;
  --ok:#8fb573;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  background:var(--night);
  color:var(--text);
}
.stage{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
.phone{
  width:390px;height:844px;max-height:calc(100vh - 40px);
  background:#120c0a;border-radius:44px;padding:10px;flex:none;
  box-shadow:0 30px 80px rgba(0,0,0,.65),0 0 0 2px #3a241a;
}
.screen{
  width:100%;height:100%;border-radius:36px;overflow:hidden;position:relative;
  background:
    radial-gradient(120% 34% at 50% -8%,rgba(255,180,94,.14),transparent 62%),
    var(--bg);
  display:flex;flex-direction:column;
}
@media (max-width:520px){
  .stage{padding:0}
  .phone{width:100%;height:100vh;height:100dvh;max-height:none;border-radius:0;padding:0;box-shadow:none}
  .screen{border-radius:0}
}
.view{
  position:absolute;inset:0;display:flex;flex-direction:column;
  transition:transform .38s cubic-bezier(.32,.72,.24,1),opacity .32s ease;
}
#listView{transform:translateX(0)}
#listView.away{transform:translateX(-24%);opacity:.55;pointer-events:none}
#chatView{transform:translateX(102%);pointer-events:none}
#chatView.open{transform:translateX(0);pointer-events:auto}
header{display:flex;align-items:center;gap:12px;flex:none}
.app-head{padding:22px 18px 14px;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{filter:drop-shadow(0 0 10px rgba(255,180,94,.55));animation:flicker 3.2s ease-in-out infinite}
.brand h1{font-size:24px;letter-spacing:6px;font-weight:700}
.brand p{font-size:11px;color:var(--muted);letter-spacing:2px;margin-top:3px}
.net-pill{
  font-size:11px;color:var(--glow);border:1px solid var(--line);border-radius:999px;
  padding:5px 10px;display:flex;align-items:center;gap:6px;background:rgba(64,38,26,.6);
}
.net-pill i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block;box-shadow:0 0 6px var(--ok)}
.section-label{padding:2px 20px 10px;font-size:12px;color:var(--muted);letter-spacing:3px;flex:none}
.conv-scroll{flex:1;overflow-y:auto;padding:0 12px 12px}
.conv{
  display:flex;gap:12px;align-items:center;padding:13px 12px;border-radius:18px;
  cursor:pointer;transition:background .18s ease,transform .18s ease;
}
.conv:hover{background:var(--surface)}
.conv:active{transform:scale(.985)}
.conv + .conv{margin-top:2px}
.avatar{
  width:50px;height:50px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  font-size:19px;font-weight:600;color:#ffe9c4;position:relative;
  box-shadow:inset 0 -6px 12px rgba(0,0,0,.28),0 0 14px rgba(255,180,94,.22);
}
.avatar::after{content:"";position:absolute;bottom:-3px;right:1px;width:11px;height:11px;border-radius:50%;background:var(--ok);border:2px solid var(--bg)}
.avatar.off::after{background:var(--muted);box-shadow:none}
.conv-main{flex:1;min-width:0}
.conv-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.conv-name{font-size:15.5px;font-weight:600}
.conv-time{font-size:11px;color:var(--muted);flex:none}
.conv-preview{
  font-size:13px;color:var(--muted);margin-top:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.conv-preview.fail{color:var(--danger)}
.badge{
  min-width:19px;height:19px;border-radius:999px;background:var(--lantern);color:#ffe9c4;
  font-size:11px;line-height:19px;text-align:center;padding:0 5px;margin-left:6px;flex:none;
  box-shadow:0 0 8px rgba(200,70,43,.6);
}
.tabbar{
  flex:none;display:flex;border-top:1px solid var(--line);
  background:rgba(52,32,22,.92);padding:6px 8px calc(8px + env(safe-area-inset-bottom));
}
.tabbar button{
  flex:1;background:none;border:0;color:var(--muted);font-size:11px;padding:8px 0 6px;
  display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;font-family:inherit;
}
.tabbar button.on{color:var(--glow)}
.tabbar svg{width:22px;height:22px}
.chat-head{
  padding:14px 12px;gap:10px;border-bottom:1px solid var(--line);
  background:rgba(52,32,22,.85);backdrop-filter:blur(6px);
}
.back-btn{
  width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);
  color:var(--text);font-size:19px;line-height:1;cursor:pointer;flex:none;
}
.chat-peer{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.chat-peer .avatar{width:38px;height:38px;font-size:15px}
.chat-peer h2{font-size:16px;font-weight:600}
.chat-peer p{font-size:11px;color:var(--muted);margin-top:2px}
.drill-btn{
  border:1px solid var(--line);background:var(--surface);color:var(--muted);
  border-radius:999px;padding:7px 11px;font-size:11px;cursor:pointer;flex:none;
  display:flex;align-items:center;gap:6px;font-family:inherit;transition:all .2s ease;
}
.drill-btn i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.drill-btn.on{border-color:var(--danger);color:#ffc9b8;background:rgba(224,90,58,.14)}
.drill-btn.on i{background:var(--danger);box-shadow:0 0 8px var(--danger)}
.drill-banner{
  flex:none;background:rgba(224,90,58,.16);border-bottom:1px solid rgba(224,90,58,.4);
  color:#ffc9b8;font-size:12px;padding:8px 16px;display:flex;gap:8px;align-items:center;
}
.msg-scroll{flex:1;overflow-y:auto;padding:16px 14px 10px;display:flex;flex-direction:column;gap:12px}
.day-tag{align-self:center;font-size:11px;color:var(--muted);background:rgba(64,38,26,.7);padding:4px 12px;border-radius:999px;letter-spacing:2px}
.msg{display:flex;flex-direction:column;max-width:78%;animation:rise .28s ease both}
.msg.them{align-self:flex-start;align-items:flex-start}
.msg.me{align-self:flex-end;align-items:flex-end}
.bubble{
  padding:10px 14px;font-size:15px;line-height:1.5;word-break:break-word;position:relative;
}
.msg.them .bubble{
  background:linear-gradient(160deg,var(--paper),var(--paper-deep));
  color:var(--paper-text);border-radius:4px 20px 20px 20px;
  box-shadow:0 2px 10px rgba(0,0,0,.3),inset 0 0 12px rgba(255,244,220,.4);
}
.msg.me .bubble{
  background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 3px,transparent 3px 14px),
    linear-gradient(160deg,var(--flame),var(--flame-deep));
  color:#fff8ec;border-radius:20px 4px 20px 20px;
  box-shadow:0 3px 14px rgba(232,135,59,.35);
}
.msg.me.failed .bubble{
  background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 3px,transparent 3px 14px),
    linear-gradient(160deg,#8a4a34,#6e3626);
  outline:1.5px dashed var(--danger);outline-offset:2px;opacity:.92;
}
.meta{display:flex;align-items:center;gap:5px;font-size:10.5px;margin-top:5px;color:var(--muted)}
.meta .st-time{opacity:.8}
.meta .st-send{color:var(--muted)}
.meta .st-ok{color:var(--glow)}
.meta .st-fail{color:var(--danger);font-weight:600}
.retry-btn{
  border:1px solid var(--danger);background:rgba(224,90,58,.12);color:#ffb59f;
  font-size:11px;border-radius:999px;padding:3px 10px;cursor:pointer;font-family:inherit;
}
.retry-btn:active{transform:scale(.95)}
.spin{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--muted);border-top-color:var(--glow);animation:spin .8s linear infinite;display:inline-block}
.sys-hint{
  align-self:center;font-size:11.5px;color:#ffb59f;background:rgba(224,90,58,.12);
  border:1px dashed rgba(224,90,58,.5);border-radius:12px;padding:7px 14px;text-align:center;
  animation:rise .3s ease both;
}
.composer{
  flex:none;display:flex;gap:10px;align-items:center;
  padding:10px 12px calc(12px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);background:rgba(52,32,22,.92);
}
.composer input{
  flex:1;border:1px solid var(--line);background:var(--surface);color:var(--text);
  border-radius:999px;padding:12px 16px;font-size:15px;font-family:inherit;outline:none;
  transition:border-color .2s ease,box-shadow .2s ease;
}
.composer input:focus{border-color:var(--flame);box-shadow:0 0 0 3px rgba(232,135,59,.18)}
.composer input::placeholder{color:var(--muted)}
.send-btn{
  width:46px;height:46px;border-radius:50%;border:0;flex:none;cursor:pointer;
  background:linear-gradient(150deg,var(--flame),var(--flame-deep));color:#fff8ec;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 14px rgba(232,135,59,.45);transition:transform .15s ease,opacity .2s ease;
}
.send-btn:disabled{opacity:.35;box-shadow:none;cursor:default}
.send-btn:not(:disabled):active{transform:scale(.92)}
.toast{
  position:absolute;left:50%;bottom:88px;transform:translateX(-50%) translateY(20px);
  background:rgba(23,16,13,.94);border:1px solid var(--line);color:var(--text);
  font-size:12.5px;padding:9px 18px;border-radius:999px;opacity:0;pointer-events:none;
  transition:opacity .25s ease,transform .25s ease;white-space:nowrap;z-index:30;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes flicker{0%,100%{filter:drop-shadow(0 0 10px rgba(255,180,94,.55))}50%{filter:drop-shadow(0 0 16px rgba(255,180,94,.85))}}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="stage">
  <div class="phone">
    <div class="screen">

      <section class="view" id="listView">
        <header class="app-head">
          <div class="brand">
            <svg width="34" height="40" viewBox="0 0 34 40" fill="none">
              <rect x="12" y="1" width="10" height="4" rx="1.5" fill="#8a5a2e"/>
              <ellipse cx="17" cy="17" rx="12" ry="13" fill="#c8462b"/>
              <path d="M10 5.5 Q5.5 17 10 28.5 M17 4 Q17 17 17 30 M24 5.5 Q28.5 17 24 28.5" stroke="#ffb45e" stroke-width="1.4" fill="none"/>
              <rect x="12" y="29" width="10" height="4" rx="1.5" fill="#8a5a2e"/>
              <path d="M17 33 L17 38" stroke="#ffb45e" stroke-width="1.6"/>
              <path d="M14.5 38.5 L17 36 L19.5 38.5" stroke="#c8462b" stroke-width="1.6" fill="none"/>
            </svg>
            <div>
              <h1>灯语</h1>
              <p>灯下有人等你说话</p>
            </div>
          </div>
          <div class="net-pill"><i></i>灯火常明</div>
        </header>
        <div class="section-label">消 息</div>
        <div class="conv-scroll" id="convList"></div>
        <nav class="tabbar">
          <button class="on" id="tabMsg">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6.5 Q4 4.5 6 4.5 L18 4.5 Q20 4.5 20 6.5 L20 14.5 Q20 16.5 18 16.5 L10 16.5 L6 20 L6 16.8 Q4 16.5 4 14.5 Z"/></svg>
            消息
          </button>
          <button id="tabFair">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3 Q17 7 17 13 Q17 19 12 21 Q7 19 7 13 Q7 7 12 3 Z"/><path d="M12 3 L12 21"/></svg>
            灯会
          </button>
          <button id="tabMe">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4.5 20 Q5 14 12 14 Q19 14 19.5 20"/></svg>
            我的
          </button>
        </nav>
      </section>

      <section class="view" id="chatView">
        <header class="chat-head">
          <button class="back-btn" id="backBtn" aria-label="返回列表">‹</button>
          <div class="chat-peer">
            <div class="avatar" id="chatAvatar">陈</div>
            <div>
              <h2 id="chatName">陈灯笼</h2>
              <p id="chatNote">在线 · 灯火常明</p>
            </div>
          </div>
          <button class="drill-btn" id="drillBtn" aria-pressed="false"><i></i>断线演练</button>
        </header>
        <div class="drill-banner" id="drillBanner" hidden>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3 L22 20 L2 20 Z"/><path d="M12 10 L12 14 M12 17 L12 17.2"/></svg>
          断线演练已开启：下一条消息将发送失败，仅演练一次
        </div>
        <div class="msg-scroll" id="msgScroll"></div>
        <form class="composer" id="composer">
          <input id="msgInput" type="text" placeholder="把话递到灯下…" autocomplete="off" maxlength="200">
          <button class="send-btn" id="sendBtn" type="submit" disabled aria-label="发送">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M3.4 11.2 L20.5 3.5 Q21.7 3 21.5 4.3 L13.8 21.4 Q13.2 22.6 12.3 21.4 L10.1 14.7 Q9.9 14.1 9.3 13.9 L3.4 12.4 Q2.2 12 3.4 11.2 Z"/></svg>
          </button>
        </form>
      </section>

      <div class="toast" id="toast"></div>
    </div>
  </div>
</div>
<script>
var CONVS=[
  {id:'c1',name:'陈灯笼',ch:'陈',note:'扎灯二十年 · 在线',hue:'#c8462b',unread:2,time:'21:07',msgs:[
    {from:'them',text:'桃花纸托人带了两刀，够糊十二盏灯。',time:'21:02',status:'sent'},
    {from:'me',text:'好，浆糊我来调，今年少放矾，纸面更润。',time:'21:04',status:'sent'},
    {from:'them',text:'骨架已经扎好了，明晚来一起糊纸？',time:'21:07',status:'sent'}]},
  {id:'c2',name:'阿禾',ch:'禾',note:'火锅一级搭子 · 在线',hue:'#e8873b',unread:0,time:'20:48',msgs:[
    {from:'them',text:'明天大降温，牛油锅底我备好了。',time:'20:41',status:'sent'},
    {from:'me',text:'我带黄喉和贡菜，七点到你楼下。',time:'20:48',status:'sent'}]},
  {id:'c3',name:'加班搭子群',ch:'群',note:'12 盏灯亮着',hue:'#8a5a2e',unread:5,time:'19:32',msgs:[
    {from:'them',text:'老周：今晚谁守机房？我带了热茶。',time:'19:30',status:'sent'},
    {from:'them',text:'小盏：我值守到十点，后面交给你。',time:'19:32',status:'sent'}]},
  {id:'c4',name:'妈',ch:'妈',note:'家里那盏灯',hue:'#a0522d',unread:0,time:'昨天',msgs:[
    {from:'them',text:'降温了，柜子第二层有厚毛衣。',time:'昨天 18:20',status:'sent'},
    {from:'me',text:'知道啦，周末回去看你腌的咸菜。',time:'昨天 18:33',status:'sent'}]},
  {id:'c5',name:'巷口小卖部',ch:'店',note:'掌柜在线',hue:'#6e3626',unread:0,time:'周六',msgs:[
    {from:'them',text:'新到了桂花米酒，给你留了两瓶。',time:'周六 15:12',status:'sent'}]}
];
var state={open:null,drill:false,seq:0,lastFailConv:null};
var $=function(id){return document.getElementById(id)};

function toast(t){
  var el=$('toast');el.textContent=t;el.classList.add('show');
  clearTimeout(el._t);el._t=setTimeout(function(){el.classList.remove('show')},1800);
}
function nowTime(){
  var d=new Date();function p(n){return (n<10?'0':'')+n}
  return p(d.getHours())+':'+p(d.getMinutes());
}
function previewOf(c){
  var m=c.msgs[c.msgs.length-1];
  if(!m)return'';
  var who=m.from==='me'?'我：':'';
  if(m.status==='failed')return'fail|'+who+m.text;
  return who+m.text;
}
function renderConvs(){
  var box=$('convList');box.innerHTML='';
  CONVS.forEach(function(c){
    var li=document.createElement('div');li.className='conv';
    var last=c.msgs[c.msgs.length-1];
    var pv=previewOf(c);var fail=pv.indexOf('fail|')===0;
    if(fail)pv=pv.slice(5);
    li.innerHTML='<div class="avatar'+(c.unread?'':' off')+'" style="background:radial-gradient(circle at 35% 30%,'+c.hue+',#3a1d12)">'+c.ch+'</div>'+
      '<div class="conv-main"><div class="conv-top"><span class="conv-name"></span><span class="conv-time"></span></div>'+
      '<div class="conv-preview'+(fail?' fail':'')+'"></div></div>';
    li.querySelector('.conv-name').textContent=c.name;
    li.querySelector('.conv-time').textContent=last?last.time.split(' ').pop():'';
    li.querySelector('.conv-preview').textContent=(fail?'发送失败 · ':'')+pv;
    if(c.unread){var b=document.createElement('span');b.className='badge';b.textContent=c.unread;li.appendChild(b)}
    li.addEventListener('click',function(){openChat(c.id)});
    box.appendChild(li);
  });
}
function renderMsgs(){
  var c=CONVS.filter(function(x){return x.id===state.open})[0];
  var box=$('msgScroll');box.innerHTML='';
  var tag=document.createElement('div');tag.className='day-tag';tag.textContent='今晚 · 灯还亮着';box.appendChild(tag);
  c.msgs.forEach(function(m){
    var row=document.createElement('div');
    row.className='msg '+m.from+(m.status==='failed'?' failed':'');
    var bub=document.createElement('div');bub.className='bubble';bub.textContent=m.text;row.appendChild(bub);
    var meta=document.createElement('div');meta.className='meta';
    if(m.from==='me'){
      if(m.status==='sending'){
        meta.innerHTML='<span class="spin"></span><span class="st-send">递送中</span>';
      }else if(m.status==='failed'){
        meta.innerHTML='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 3 L22 20 L2 20 Z"/><path d="M12 10 L12 14"/></svg><span class="st-fail">发送失败 · 内容已保留</span>';
        var rb=document.createElement('button');rb.className='retry-btn';rb.type='button';rb.textContent='重试';
        rb.addEventListener('click',function(){retryMsg(c,m)});meta.appendChild(rb);
      }else{
        meta.innerHTML='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M4.5 12.5 L9.5 17.5 L19.5 6.5"/></svg><span class="st-ok">已送达</span>';
      }
    }
    var t=document.createElement('span');t.className='st-time';t.textContent=m.time;meta.appendChild(t);
    row.appendChild(meta);box.appendChild(row);
  });
  if(state.lastFailConv===c.id){
    var h=document.createElement('div');h.className='sys-hint';
    h.textContent='那句话没递出去，还在原处。点「重试」再递一次。';
    box.appendChild(h);
  }
  box.scrollTop=box.scrollHeight;
}
function openChat(id){
  var c=CONVS.filter(function(x){return x.id===id})[0];
  state.open=id;c.unread=0;renderConvs();
  $('chatName').textContent=c.name;$('chatNote').textContent=c.note;
  var av=$('chatAvatar');av.textContent=c.ch;
  av.style.background='radial-gradient(circle at 35% 30%,'+c.hue+',#3a1d12)';
  renderMsgs();
  $('listView').classList.add('away');$('chatView').classList.add('open');
}
function closeChat(){
  $('chatView').classList.remove('open');$('listView').classList.remove('away');
}
function setDrill(on){
  state.drill=on;
  var b=$('drillBtn');b.classList.toggle('on',on);b.setAttribute('aria-pressed',on?'true':'false');
  $('drillBanner').hidden=!on;
}
function sendMsg(){
  var inp=$('msgInput');var text=inp.value.trim();
  if(!text)return;
  var c=CONVS.filter(function(x){return x.id===state.open})[0];
  var m={from:'me',text:text,time:nowTime(),status:'sending',sid:++state.seq};
  c.msgs.push(m);inp.value='';$('sendBtn').disabled=true;renderMsgs();
  var willFail=state.drill;
  setTimeout(function(){
    if(willFail){
      m.status='failed';state.lastFailConv=c.id;
      setDrill(false);toast('演练结束：这条消息没有递出去');
    }else{
      m.status='sent';
      if(state.lastFailConv===c.id)state.lastFailConv=null;
    }
    renderMsgs();renderConvs();
  },willFail?750:650);
}
function retryMsg(c,m){
  m.status='sending';renderMsgs();
  setTimeout(function(){
    m.status='sent';state.lastFailConv=null;
    renderMsgs();renderConvs();toast('已送达');
  },620);
}
$('composer').addEventListener('submit',function(e){e.preventDefault();sendMsg()});
$('msgInput').addEventListener('input',function(){$('sendBtn').disabled=!this.value.trim()});
$('backBtn').addEventListener('click',closeChat);
$('drillBtn').addEventListener('click',function(){setDrill(!state.drill)});
$('tabFair').addEventListener('click',function(){toast('「灯会」集市在原型范围之外')});
$('tabMe').addEventListener('click',function(){toast('「我的」页面在原型范围之外')});
$('tabMsg').addEventListener('click',function(){toast('已经在消息页')});
renderConvs();
</script>
</body>
</html>
