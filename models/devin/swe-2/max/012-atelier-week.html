<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>画室历 · 梧桐街画室课程周历</title>
<style>
:root{
  --paper:#f5eedd;--paper-2:#efe4cb;--card:#faf4e4;
  --ink:#2f3d5c;--ink-soft:#5a6a8c;--line:#ddd0b8;--line-2:#cbbfa0;
  --ochre:#c1843a;--clay:#a85738;--sage:#7a8450;--umber:#8a6a44;
  --stamp:#b3402a;--block-ink:#3d2e1c;
  --hand:"Kaiti SC","STKaiti","KaiTi","楷体","STSong",serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background-color:var(--paper);
  background-image:
    radial-gradient(1000px 500px at 50% -8%,rgba(255,255,255,.5),transparent 60%),
    repeating-linear-gradient(0deg,transparent 0 3px,rgba(120,90,40,.018) 3px 4px);
  color:var(--ink);font-size:14px;line-height:1.6;min-height:100vh;
}
.page{max-width:1240px;margin:0 auto;padding:30px 28px 60px}

/* 页头 */
.head{display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap;
  border-bottom:2px solid var(--ink);padding-bottom:18px;margin-bottom:22px}
.title-block h1{font-family:var(--hand);font-size:40px;font-weight:700;color:var(--ink);
  letter-spacing:6px;line-height:1.1}
.title-block .sub{color:var(--ink-soft);font-size:13px;letter-spacing:2px;margin-top:6px}
.title-block .sub i{font-style:normal;color:var(--stamp)}
.week-ctl{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.week-label{font-family:var(--hand);font-size:20px;color:var(--ink);min-width:230px;text-align:center}
.week-label small{display:block;font-family:-apple-system,"Segoe UI","PingFang SC",sans-serif;
  font-size:11px;color:var(--ink-soft);letter-spacing:1px;margin-top:2px}
.wbtn{border:1px solid var(--line-2);background:var(--card);color:var(--ink);
  width:34px;height:34px;border-radius:50%;font-size:16px;cursor:pointer;
  box-shadow:0 1px 0 rgba(90,70,40,.15);transition:background .2s,transform .15s}
.wbtn:hover{background:var(--paper-2)}
.wbtn:active{transform:scale(.94)}
.btn-today{border:1px solid var(--ink);background:var(--ink);color:var(--card);
  padding:7px 16px;border-radius:20px;font-size:13px;cursor:pointer;letter-spacing:2px;
  font-family:inherit;transition:background .2s}
.btn-today:hover{background:#233050}
.btn-today:disabled{opacity:.45;cursor:default}
.legend{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:14px;font-size:12px;color:var(--ink-soft)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:2px;display:inline-block;transform:rotate(-2deg)}

/* 周历网格 */
.cal{background:var(--card);border:1px solid var(--line-2);border-radius:6px;
  box-shadow:0 2px 0 rgba(90,70,40,.08),0 14px 34px rgba(90,70,40,.12);
  overflow-x:auto}
.cal-inner{min-width:760px}
.cal-head{display:grid;grid-template-columns:64px repeat(7,1fr);
  border-bottom:2px solid var(--ink)}
.cal-head .corner{border-right:1px solid var(--line)}
.day-head{padding:10px 6px 8px;text-align:center;border-right:1px solid var(--line)}
.day-head:last-child{border-right:0}
.day-head .dow{font-family:var(--hand);font-size:15px;letter-spacing:2px}
.day-head .dnum{font-size:12px;color:var(--ink-soft);margin-top:2px;font-variant-numeric:tabular-nums}
.day-head.today .dow{color:var(--stamp)}
.day-head.today .dnum{display:inline-flex;width:26px;height:26px;border-radius:50%;
  border:1.5px solid var(--stamp);color:var(--stamp);align-items:center;justify-content:center;
  margin-top:2px;font-weight:600;transform:rotate(-6deg)}
.cal-body{display:grid;grid-template-columns:64px repeat(7,1fr);position:relative}
.gutter{border-right:1px solid var(--line);position:relative}
.gutter .h-label{position:absolute;right:8px;transform:translateY(-50%);
  font-size:11px;color:var(--ink-soft);font-family:var(--hand);letter-spacing:1px}
.col{border-right:1px solid var(--line);position:relative;
  background-image:repeating-linear-gradient(0deg,transparent 0 55px,var(--line) 55px 56px)}
.col:last-child{border-right:0}
.col.today{background-color:rgba(179,64,42,.05)}
.evt{position:absolute;left:5px;right:5px;border-radius:3px;padding:6px 8px;
  color:var(--block-ink);cursor:pointer;overflow:hidden;
  box-shadow:inset 0 0 0 1px rgba(61,46,28,.18),0 1px 2px rgba(61,46,28,.2);
  transition:transform .15s,box-shadow .15s}
.evt::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:rgba(61,46,28,.35)}
.evt:hover{transform:translateY(-1px) rotate(-.4deg);box-shadow:inset 0 0 0 1px rgba(61,46,28,.3),0 4px 10px rgba(61,46,28,.3)}
.evt .t{font-family:var(--hand);font-size:13px;font-weight:700;line-height:1.3}
.evt .meta{font-size:10px;opacity:.85;margin-top:2px}
.evt.booked{outline:2px dashed var(--stamp);outline-offset:-4px}
.evt.booked::after{content:"已约";position:absolute;right:5px;top:5px;font-size:10px;
  border:1px solid var(--stamp);color:var(--stamp);border-radius:2px;padding:0 3px;
  font-family:var(--hand);transform:rotate(6deg)}

/* 详情抽屉 */
.backdrop{position:fixed;inset:0;background:rgba(47,61,92,.22);opacity:0;pointer-events:none;transition:opacity .3s;z-index:20}
.backdrop.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:360px;max-width:92vw;z-index:21;
  background:var(--card);border-left:1px solid var(--line-2);
  box-shadow:-16px 0 40px rgba(61,46,28,.18);
  transform:translateX(105%);transition:transform .35s ease;
  padding:26px 26px 30px;overflow-y:auto}
.drawer.show{transform:translateX(0)}
.drawer .close{position:absolute;top:16px;right:16px;width:30px;height:30px;border-radius:50%;
  border:1px solid var(--line-2);background:var(--paper);color:var(--ink);cursor:pointer;font-size:14px}
.drawer .close:hover{background:var(--paper-2)}
.d-tag{display:inline-block;padding:3px 10px;border-radius:3px;color:var(--card);
  font-size:11px;letter-spacing:2px;margin-bottom:14px}
.drawer h2{font-family:var(--hand);font-size:26px;color:var(--ink);letter-spacing:2px;line-height:1.3}
.d-rows{margin:18px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.d-row{display:flex;padding:10px 2px;border-bottom:1px dashed var(--line);font-size:13px}
.d-row:last-child{border-bottom:0}
.d-row .k{width:76px;color:var(--ink-soft);flex:0 0 auto;letter-spacing:1px}
.d-row .v{color:var(--ink)}
.d-desc{font-size:13px;color:var(--ink-soft);line-height:1.8;margin-bottom:20px}
.seat-line{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.seat-bar{flex:1;height:6px;background:var(--paper-2);border-radius:3px;overflow:hidden}
.seat-bar i{display:block;height:100%;background:var(--ochre)}
.seat-num{font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.btn-book{width:100%;padding:12px;border-radius:4px;border:1.5px solid var(--ink);
  background:var(--ink);color:var(--card);font-size:14px;letter-spacing:3px;cursor:pointer;
  font-family:var(--hand);transition:background .2s}
.btn-book:hover{background:#233050}
.btn-book.booked{background:var(--stamp);border-color:var(--stamp)}
.btn-book:disabled{opacity:.5;cursor:not-allowed}
.d-note{margin-top:14px;font-size:11px;color:var(--ink-soft);text-align:center}

@media (max-width:900px){
  .page{padding:20px 16px 40px}
  .week-ctl{margin-left:0;width:100%}
  .week-label{min-width:0;flex:1;text-align:left}
  .title-block h1{font-size:32px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="page">
  <header class="head">
    <div class="title-block">
      <h1>画室历</h1>
      <div class="sub">梧桐街画室 · 课程周历 <i>·</i> 第 <i>3</i> 期学员适用</div>
    </div>
    <div class="week-ctl">
      <button class="wbtn" id="prevW" aria-label="上一周">‹</button>
      <div class="week-label" id="weekLabel">—<small></small></div>
      <button class="wbtn" id="nextW" aria-label="下一周">›</button>
      <button class="btn-today" id="btnToday">回到本周</button>
    </div>
  </header>

  <div class="legend" id="legend"></div>

  <section class="cal">
    <div class="cal-inner">
      <div class="cal-head" id="calHead">
        <div class="corner"></div>
      </div>
      <div class="cal-body" id="calBody">
        <div class="gutter" id="gutter"></div>
      </div>
    </div>
  </section>
</div>

<div class="backdrop" id="backdrop"></div>
<aside class="drawer" id="drawer" aria-label="课程详情">
  <button class="close" id="dClose" aria-label="关闭">✕</button>
  <span class="d-tag" id="dTag"></span>
  <h2 id="dTitle"></h2>
  <div class="d-rows" id="dRows"></div>
  <p class="d-desc" id="dDesc"></p>
  <div class="seat-line">
    <div class="seat-bar"><i id="dSeatBar"></i></div>
    <span class="seat-num" id="dSeatNum"></span>
  </div>
  <button class="btn-book" id="dBook"></button>
  <p class="d-note">预约在上课前 2 小时截止 · 可在「我的课表」中取消</p>
</aside>

<script>
(function(){
  var DAY_MS=86400000, HOUR_H=56, START=9, END=21;
  var TYPES={
    oil:{name:"油画",color:"#c1843a"},
    wc:{name:"水彩",color:"#a85738"},
    sketch:{name:"写生",color:"#7a8450"},
    mat:{name:"材料",color:"#8a6a44"},
    open:{name:"开放",color:"#2f3d5c"}
  };
  var EVENTS=[
    {k:"oil",t:"油画基础 · 静物",dow:0,st:10,dur:2,room:"东画室",teacher:"林既明",seats:12,left:5,
      desc:"从单色稿起形,练三组静物的明度秩序;画材由画室统一备,无需自带。"},
    {k:"mat",t:"色稿讲评",dow:0,st:15,dur:1.5,room:"西画室",teacher:"苏晚舟",seats:16,left:9,
      desc:"带上周的色稿作业,逐一讲评色调与色阶,现场改一张示范。"},
    {k:"wc",t:"水彩技法 · 湿接",dow:1,st:14,dur:2,room:"露台画室",teacher:"顾青梧",seats:10,left:3,
      desc:"练习湿接与控水,画两张小品;如遇雨天移至东画室。"},
    {k:"sketch",t:"模特写生 · 半身",dow:2,st:9.5,dur:2.5,room:"东画室",teacher:"林既明",seats:14,left:0,
      desc:"请自备速写本与炭笔,模特每小时休息十分钟。"},
    {k:"mat",t:"材料课 · 坦培拉入门",dow:2,st:19,dur:2,room:"材料间",teacher:"隋一灯",seats:8,left:4,
      desc:"蛋黄乳液的调法与板上作画流程,含一块练习板。"},
    {k:"oil",t:"油画进阶 · 人像",dow:3,st:14,dur:3,room:"东画室",teacher:"林既明",seats:10,left:6,
      desc:"限完成静物单元的学员;重点讲肤色阶与暗部透气。"},
    {k:"sketch",t:"速写晚自习",dow:4,st:19,dur:2,room:"西画室",teacher:"轮流值课",seats:20,left:12,
      desc:"自由练习,值课老师巡回指导;画室提供灯光与画架。"},
    {k:"open",t:"画室开放日",dow:5,st:10,dur:8,room:"全部画室",teacher:"全体老师",seats:40,left:21,
      desc:"学员可带一位朋友参观;下午四点有公开课与茶水。"},
    {k:"sketch",t:"静物素描 · 长期作业",dow:6,st:10,dur:2,room:"西画室",teacher:"苏晚舟",seats:12,left:8,
      desc:"同一组静物连续画四周,本周进入塑造阶段。"}
  ];
  var booked={};
  var weekOffset=0;
  var DOW=["周一","周二","周三","周四","周五","周六","周日"];

  function monday(off){
    var base=new Date(2026,8,23);
    var dow=(base.getDay()+6)%7;
    return new Date(base.getTime()+(off*7-dow)*DAY_MS);
  }
  function fmtD(d){return (d.getMonth()+1)+"月"+d.getDate()+"日";}
  function fmtT(h){var hh=Math.floor(h),mm=Math.round((h-hh)*60);return hh+":"+(mm<10?"0":"")+mm;}

  var head=document.getElementById("calHead"),body=document.getElementById("calBody"),gut=document.getElementById("gutter");

  function renderHead(){
    var m=monday(weekOffset);
    var html='<div class="corner"></div>';
    var todayIdx=weekOffset===0?2:-1;
    for(var i=0;i<7;i++){
      var d=new Date(m.getTime()+i*DAY_MS);
      html+='<div class="day-head'+(i===todayIdx?' today':'')+'"><div class="dow">'+DOW[i]+'</div><div class="dnum">'+d.getDate()+'</div></div>';
    }
    head.innerHTML=html;
    document.getElementById("weekLabel").innerHTML=
      m.getFullYear()+"年"+(m.getMonth()+1)+"月 · 第"+(weekOffset===0?"本":(weekOffset>0?"+":"")+weekOffset)+"周"+
      "<small>"+fmtD(m)+" – "+fmtD(new Date(m.getTime()+6*DAY_MS))+"</small>";
    document.getElementById("btnToday").disabled=weekOffset===0;
  }

  function renderBody(){
    var gh=(END-START)*HOUR_H;
    gut.style.height=gh+"px";gut.innerHTML="";
    for(var h=START;h<=END;h++){
      var lb=document.createElement("div");
      lb.className="h-label";lb.style.top=((h-START)*HOUR_H)+"px";lb.textContent=h+":00";
      gut.appendChild(lb);
    }
    Array.prototype.slice.call(body.querySelectorAll(".col")).forEach(function(c){c.remove();});
    var todayIdx=weekOffset===0?2:-1;
    for(var i=0;i<7;i++){
      var col=document.createElement("div");
      col.className="col"+(i===todayIdx?" today":"");
      col.style.height=gh+"px";
      EVENTS.forEach(function(ev,idx){
        if(ev.dow!==i)return;
        var el=document.createElement("div");
        el.className="evt"+(booked[idx]?" booked":"");
        el.style.top=((ev.st-START)*HOUR_H)+"px";
        el.style.height=(ev.dur*HOUR_H-4)+"px";
        el.style.background=TYPES[ev.k].color;
        el.style.color=ev.k==="open"?"#faf4e4":"#3d2e1c";
        el.innerHTML='<div class="t">'+ev.t+'</div><div class="meta">'+fmtT(ev.st)+"–"+fmtT(ev.st+ev.dur)+" · "+ev.room+'</div>';
        el.addEventListener("click",function(){openDetail(idx);});
        col.appendChild(el);
      });
      body.appendChild(col);
    }
  }

  function renderLegend(){
    var html="";
    Object.keys(TYPES).forEach(function(k){
      html+='<span><i style="background:'+TYPES[k].color+'"></i>'+TYPES[k].name+'</span>';
    });
    document.getElementById("legend").innerHTML=html;
  }

  var cur=-1;
  function openDetail(idx){
    cur=idx;var ev=EVENTS[idx],tp=TYPES[ev.k];
    document.getElementById("dTag").textContent=tp.name+"课";
    document.getElementById("dTag").style.background=tp.color;
    document.getElementById("dTitle").textContent=ev.t;
    var m=monday(weekOffset),d=new Date(m.getTime()+ev.dow*DAY_MS);
    document.getElementById("dRows").innerHTML=
      '<div class="d-row"><span class="k">时间</span><span class="v">'+DOW[ev.dow]+" "+fmtD(d)+" "+fmtT(ev.st)+"–"+fmtT(ev.st+ev.dur)+'</span></div>'+
      '<div class="d-row"><span class="k">教室</span><span class="v">'+ev.room+'</span></div>'+
      '<div class="d-row"><span class="k">带课</span><span class="v">'+ev.teacher+'</span></div>';
    document.getElementById("dDesc").textContent=ev.desc;
    updSeat();
    document.getElementById("drawer").classList.add("show");
    document.getElementById("backdrop").classList.add("show");
  }
  function updSeat(){
    var ev=EVENTS[cur];
    var left=ev.left-(booked[cur]?1:0);
    document.getElementById("dSeatBar").style.width=((ev.seats-left)/ev.seats*100)+"%";
    document.getElementById("dSeatBar").style.background=left<=3?"#b3402a":"#c1843a";
    document.getElementById("dSeatNum").textContent=left>0?("余 "+left+" / "+ev.seats+" 席"):"已满 "+ev.seats+" 席";
    var b=document.getElementById("dBook");
    if(booked[cur]){b.textContent="已预约 · 点击取消";b.className="btn-book booked";b.disabled=false;}
    else if(left<=0){b.textContent="名额已满";b.className="btn-book";b.disabled=true;}
    else{b.textContent="预约此课";b.className="btn-book";b.disabled=false;}
  }
  function closeDetail(){
    document.getElementById("drawer").classList.remove("show");
    document.getElementById("backdrop").classList.remove("show");
  }

  document.getElementById("dBook").addEventListener("click",function(){
    if(cur<0)return;
    var ev=EVENTS[cur],left=ev.left-(booked[cur]?1:0);
    if(booked[cur])booked[cur]=false;
    else if(left>0)booked[cur]=true;
    updSeat();renderBody();
  });
  document.getElementById("dClose").addEventListener("click",closeDetail);
  document.getElementById("backdrop").addEventListener("click",closeDetail);
  document.getElementById("prevW").addEventListener("click",function(){weekOffset--;renderHead();renderBody();});
  document.getElementById("nextW").addEventListener("click",function(){weekOffset++;renderHead();renderBody();});
  document.getElementById("btnToday").addEventListener("click",function(){weekOffset=0;renderHead();renderBody();});

  renderLegend();renderHead();renderBody();
})();
</script>
</body>
</html>
