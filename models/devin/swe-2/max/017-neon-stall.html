<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>晚集 WANJI · 霓虹夜市</title>
<style>
:root{
  --bg:#14041f;
  --panel:#1e0930;
  --panel2:#2a0f42;
  --text:#f7ecff;
  --dim:#b48ad4;
  --pink:#ff2d9e;
  --yellow:#f2ff3d;
  --cyan:#3ae6ff;
  --green:#43ff9e;
  --line:rgba(255,45,158,.35);
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;
  background-image:
    radial-gradient(1200px 400px at 50% -120px,rgba(255,45,158,.16),transparent 70%),
    radial-gradient(900px 320px at 12% 108%,rgba(58,230,255,.1),transparent 70%);
}
.mono{font-family:ui-monospace,"SF Mono",Consolas,"Courier New",monospace}
.ticker{overflow:hidden;border-bottom:1px solid var(--line);background:rgba(30,9,48,.8);white-space:nowrap}
.ticker-in{display:inline-block;padding:9px 0;animation:slide 22s linear infinite;font-size:12.5px;letter-spacing:.22em;color:var(--yellow);text-shadow:0 0 8px rgba(242,255,61,.6)}
.ticker-in em{font-style:normal;color:var(--cyan);margin:0 18px}
@keyframes slide{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.top{display:flex;align-items:center;gap:22px;padding:22px 0 14px;flex-wrap:wrap}
.sign{line-height:1}
.sign .cn{
  font-size:56px;font-weight:900;letter-spacing:.12em;color:#fff;
  text-shadow:0 0 4px #fff,0 0 12px var(--pink),0 0 30px var(--pink),0 0 64px var(--pink);
}
.sign .cn .flicker{animation:flick 3.4s infinite}
@keyframes flick{0%,100%{opacity:1}91%{opacity:1}92%{opacity:.35}93%{opacity:1}96%{opacity:.55}97%{opacity:1}}
.sign .en{margin-top:8px;font-size:11px;letter-spacing:.5em;color:var(--cyan);text-shadow:0 0 10px rgba(58,230,255,.8)}
.hours{
  border:1px solid var(--green);color:var(--green);padding:7px 14px;font-size:12.5px;
  letter-spacing:.16em;border-radius:999px;text-shadow:0 0 8px rgba(67,255,158,.7);
  box-shadow:0 0 12px rgba(67,255,158,.28),inset 0 0 8px rgba(67,255,158,.12);white-space:nowrap;
}
.hours .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:8px;box-shadow:0 0 8px var(--green);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.basket{
  margin-left:auto;position:relative;border:1.5px solid var(--pink);background:rgba(255,45,158,.08);
  color:var(--pink);padding:10px 20px;font-size:14px;letter-spacing:.14em;cursor:pointer;
  font-family:inherit;border-radius:4px;text-shadow:0 0 8px rgba(255,45,158,.7);
  box-shadow:0 0 14px rgba(255,45,158,.3),inset 0 0 10px rgba(255,45,158,.14);
  transition:box-shadow .2s ease,background .2s ease;
}
.basket:hover{background:rgba(255,45,158,.18);box-shadow:0 0 24px rgba(255,45,158,.5)}
.basket .cnt{
  position:absolute;top:-10px;right:-10px;min-width:24px;height:24px;border-radius:50%;
  background:var(--yellow);color:#3a2b00;font-weight:800;font-size:12.5px;
  display:flex;align-items:center;justify-content:center;padding:0 5px;
  box-shadow:0 0 12px rgba(242,255,61,.8);
}
.basket .cnt.bump{animation:bump .35s ease}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.45)}100%{transform:scale(1)}}
.cats{display:flex;flex-wrap:wrap;gap:10px;padding:6px 0 20px}
.cat{
  border:1px solid rgba(58,230,255,.5);background:transparent;color:var(--cyan);
  font-size:13px;letter-spacing:.18em;padding:8px 16px;cursor:pointer;border-radius:4px;
  font-family:inherit;text-shadow:0 0 8px rgba(58,230,255,.6);
  box-shadow:inset 0 0 8px rgba(58,230,255,.12);
  transition:all .18s ease;
}
.cat:hover{box-shadow:0 0 14px rgba(58,230,255,.35),inset 0 0 10px rgba(58,230,255,.2)}
.cat[aria-pressed="true"]{
  background:var(--cyan);color:#062a33;text-shadow:none;font-weight:700;
  box-shadow:0 0 22px rgba(58,230,255,.55);
}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;padding-bottom:14px}
.item{
  background:linear-gradient(160deg,var(--panel) 0%,var(--panel2) 100%);
  border:1px solid rgba(180,138,212,.3);border-radius:8px;padding:12px 12px 14px;
  display:flex;flex-direction:column;gap:8px;position:relative;
  transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease;
}
.item:hover{transform:translateY(-4px);border-color:var(--pink);box-shadow:0 8px 30px rgba(255,45,158,.22)}
.item .row1{display:flex;justify-content:space-between;align-items:center}
.stall-no{font-size:10px;letter-spacing:.16em;color:var(--dim)}
.fav{border:none;background:transparent;cursor:pointer;color:var(--dim);padding:2px;transition:color .15s ease,transform .15s ease}
.fav svg{display:block}
.fav:hover{color:var(--pink);transform:scale(1.15)}
.fav.on{color:var(--pink);text-shadow:0 0 10px var(--pink)}
.pic{height:86px;display:flex;align-items:center;justify-content:center}
.pic svg{height:74px;width:auto;filter:drop-shadow(0 0 7px currentColor)}
.pic.c-cyan{color:var(--cyan)}
.pic.c-pink{color:var(--pink)}
.pic.c-yellow{color:var(--yellow)}
.pic.c-green{color:var(--green)}
.item .nm{font-size:14.5px;font-weight:600;letter-spacing:.06em}
.item .tag{position:absolute;top:34px;left:0;background:var(--pink);color:#fff;font-size:10px;letter-spacing:.12em;padding:2px 8px 2px 6px;border-radius:0 3px 3px 0;box-shadow:0 0 10px rgba(255,45,158,.6)}
.item .row3{display:flex;align-items:baseline;gap:8px}
.price{color:var(--yellow);font-size:19px;font-weight:800;letter-spacing:.02em;text-shadow:0 0 10px rgba(242,255,61,.55)}
.price .y{font-size:12px;margin-right:2px}
.unit{font-size:10.5px;color:var(--dim)}
.add{
  margin-top:auto;border:1.5px solid var(--pink);background:transparent;color:var(--pink);
  font-family:inherit;font-size:13px;letter-spacing:.2em;padding:9px 0;cursor:pointer;
  border-radius:4px;text-shadow:0 0 8px rgba(255,45,158,.6);
  box-shadow:inset 0 0 10px rgba(255,45,158,.15);
  transition:background .18s ease,color .18s ease,box-shadow .18s ease;
}
.add:hover{background:var(--pink);color:#fff;text-shadow:none;box-shadow:0 0 18px rgba(255,45,158,.6)}
.add.added{background:var(--green);border-color:var(--green);color:#04301c;text-shadow:none;font-weight:700;box-shadow:0 0 18px rgba(67,255,158,.55)}
.item[hidden]{display:none}
.notice{
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  padding:14px 0;display:flex;gap:26px;flex-wrap:wrap;font-size:12px;color:var(--dim);letter-spacing:.1em;
}
.notice b{color:var(--cyan);font-weight:600;text-shadow:0 0 8px rgba(58,230,255,.6)}
.foot{padding:26px 0 40px;text-align:center;font-size:11px;letter-spacing:.3em;color:var(--dim)}
.foot .lg{color:var(--pink);text-shadow:0 0 10px rgba(255,45,158,.7);letter-spacing:.4em}
@media (max-width:1024px){.grid{grid-template-columns:repeat(4,1fr)}}
@media (max-width:860px){
  .grid{grid-template-columns:repeat(3,1fr)}
  .sign .cn{font-size:42px}
}
@media (max-width:640px){
  .grid{grid-template-columns:repeat(2,1fr)}
  .basket{margin-left:0}
  .top{gap:14px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .ticker-in{animation:none!important;transform:none}
  .item:hover{transform:none}
}
</style>
</head>
<body>
<div class="ticker"><div class="ticker-in" id="tick"></div></div>

<div class="wrap">
  <header class="top">
    <div class="sign">
      <div class="cn">晚<span class="flicker">集</span></div>
      <div class="en">WANJI NIGHT MARKET</div>
    </div>
    <div class="hours"><span class="dot"></span>开市中 · 每日 18:00 — 02:00</div>
    <button class="basket" id="basketBtn">菜篮<span class="cnt" id="basketCnt">0</span></button>
  </header>

  <nav class="cats" id="cats" aria-label="摊位栏目">
    <button class="cat" data-cat="all" aria-pressed="true">全部摊位</button>
    <button class="cat" data-cat="解馋" aria-pressed="false">解馋夜食</button>
    <button class="cat" data-cat="手作" aria-pressed="false">手作器物</button>
    <button class="cat" data-cat="衣帽" aria-pressed="false">衣帽旧物</button>
    <button class="cat" data-cat="绿植" aria-pressed="false">绿植小景</button>
  </nav>

  <main class="grid" id="grid"></main>

  <div class="notice">
    <span><b>满 99</b> 全场免配送费</span>
    <span><b>02:00</b> 前下单当晚送到</span>
    <span><b>七天</b> 器物类无理由退</span>
    <span><b>摊号</b> 下单备注可到店自提</span>
  </div>
  <footer class="foot">
    <div class="lg">晚 集</div>
    <div style="margin-top:10px">霓虹夜市线上分集 · 摊口直发</div>
  </footer>
</div>

<script>
var ITEMS=[
  {no:"B-01",cat:"解馋",name:"手打柠檬茶",price:"14.00",unit:"/ 杯 500ml",tag:"热卖",c:"c-cyan",
   svg:'<path d="M30 14h20l-3 46H33z"/><path d="M33 26h14" stroke-dasharray="2 2"/><path d="M50 18l8-10"/><circle cx="41" cy="34" r="5"/>'},
  {no:"B-02",cat:"解馋",name:"炭烤鱿鱼须",price:"22.00",unit:"/ 串",tag:"",c:"c-cyan",
   svg:'<ellipse cx="40" cy="18" rx="10" ry="8"/><path d="M32 24c0 10 2 18 4 26M40 26v26M48 24c0 10-2 18-4 26"/><path d="M30 52h20"/>'},
  {no:"B-03",cat:"解馋",name:"红糖冰粉",price:"9.90",unit:"/ 碗",tag:"",c:"c-cyan",
   svg:'<path d="M20 30h40c0 14-9 24-20 24S20 44 20 30z"/><path d="M26 24h28"/><circle cx="34" cy="38" r="2"/><circle cx="46" cy="40" r="2"/><path d="M54 12c2 3 2 6 0 8"/>'},
  {no:"B-04",cat:"手作",name:"霓虹灯牌小夜灯",price:"89.00",unit:"/ 盏",tag:"招牌",c:"c-pink",
   svg:'<rect x="22" y="14" width="36" height="28" rx="4"/><path d="M30 28h20" stroke-width="3"/><path d="M40 42v10"/><path d="M30 54h20"/>'},
  {no:"B-05",cat:"手作",name:"搪瓷缸·晚集限定",price:"39.00",unit:"/ 只",tag:"",c:"c-pink",
   svg:'<path d="M26 18h26v30a8 8 0 0 1-8 8h-10a8 8 0 0 1-8-8z"/><path d="M52 24h8v12h-8"/><path d="M28 30h22" stroke-dasharray="3 3"/>'},
  {no:"B-06",cat:"手作",name:"盲盒机抽徽章",price:"12.00",unit:"/ 抽",tag:"仅此一机",c:"c-pink",
   svg:'<rect x="22" y="12" width="36" height="44" rx="4"/><circle cx="40" cy="26" r="8"/><circle cx="40" cy="26" r="3"/><rect x="32" y="42" width="16" height="6"/>'},
  {no:"B-07",cat:"衣帽",name:"古着牛仔外套",price:"158.00",unit:"/ 件",tag:"孤品",c:"c-yellow",
   svg:'<path d="M32 14l-12 8 4 10 6-3v28h20V29l6 3 4-10-12-8-8 6z"/><path d="M36 36h8" stroke-dasharray="2 2"/>'},
  {no:"B-08",cat:"衣帽",name:"编织渔网包",price:"46.00",unit:"/ 只",tag:"",c:"c-yellow",
   svg:'<path d="M28 24c-4 8-6 16-6 24h36c0-8-2-16-6-24"/><path d="M32 24c0-8 4-12 8-12s8 4 8 12"/><path d="M26 34h28M24 42h32" stroke-dasharray="4 3"/>'},
  {no:"B-09",cat:"绿植",name:"文竹小盆栽",price:"18.00",unit:"/ 盆",tag:"",c:"c-green",
   svg:'<path d="M30 52h20l-3-12H33z"/><path d="M40 40V22M40 34c-8-2-12-8-12-16M40 30c8-2 12-8 12-16"/>'},
  {no:"B-10",cat:"绿植",name:"霓虹多肉组合",price:"26.00",unit:"/ 三棵",tag:"新摊",c:"c-green",
   svg:'<path d="M26 52h12l-1-8h-10z"/><path d="M44 52h12l-1-8H45z"/><path d="M32 44c-4-8 0-14 0-18 0 4 4 10 0 18zM50 44c-4-8 0-14 0-18 0 4 4 10 0 18z"/>'}
];
var ICON_OPEN='<svg viewBox="0 0 80 64" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">';
var grid=document.getElementById("grid"),basketCnt=0;
var added={};
function render(){
  var html="",i,p;
  for(i=0;i<ITEMS.length;i++){
    p=ITEMS[i];
    html+='<article class="item" data-cat="'+p.cat+'">'
      +'<div class="row1"><span class="stall-no mono">'+p.no+'</span>'
      +'<button class="fav" data-i="'+i+'" aria-label="收藏 '+p.name+'"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20s-7.5-4.6-9.5-9C1 7.5 3 4 6.5 4c2 0 3.6 1.1 4.5 2.7L12 8l1-1.3C13.9 5.1 15.5 4 17.5 4 21 4 23 7.5 21.5 11c-2 4.4-9.5 9-9.5 9z"/></svg></button></div>'
      +(p.tag?'<span class="tag">'+p.tag+'</span>':'')
      +'<div class="pic '+p.c+'">'+ICON_OPEN+p.svg+'</svg></div>'
      +'<div class="nm">'+p.name+'</div>'
      +'<div class="row3"><span class="price mono"><span class="y">¥</span>'+p.price+'</span><span class="unit">'+p.unit+'</span></div>'
      +'<button class="add" data-i="'+i+'">入 筐</button></article>';
  }
  grid.innerHTML=html;
}
grid.addEventListener("click",function(e){
  var a=e.target.closest(".add");
  if(a){
    var i=a.dataset.i;
    basketCnt++;added[i]=(added[i]||0)+1;
    var cnt=document.getElementById("basketCnt");
    cnt.textContent=basketCnt;cnt.classList.remove("bump");void cnt.offsetWidth;cnt.classList.add("bump");
    a.classList.add("added");a.textContent="已入筐 ×"+added[i];
    return;
  }
  var f=e.target.closest(".fav");
  if(f){f.classList.toggle("on")}
});
document.getElementById("cats").addEventListener("click",function(e){
  var b=e.target.closest(".cat");if(!b)return;
  var cat=b.dataset.cat;
  this.querySelectorAll(".cat").forEach(function(x){x.setAttribute("aria-pressed",x===b?"true":"false")});
  grid.querySelectorAll(".item").forEach(function(it){it.hidden=(cat!=="all"&&it.dataset.cat!==cat)});
});
document.getElementById("basketBtn").addEventListener("click",function(){
  this.firstChild.textContent="菜篮·"+basketCnt+" 件 ";
});
var seg="霓虹夜市开市中 <em>◆</em> 满 99 免配送 <em>◆</em> 02:00 前下单当晚达 <em>◆</em> 器物七天无理由退 <em>◆</em> ";
document.getElementById("tick").innerHTML=seg+seg+seg+seg;
render();
</script>
</body>
</html>
