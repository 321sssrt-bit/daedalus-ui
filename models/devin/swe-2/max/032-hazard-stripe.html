<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>危废处置 · 账号永久注销</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#3a3d40;font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#e8e6e1;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:36px 20px}
.stripe{height:14px;background:repeating-linear-gradient(-45deg,#f2c200 0 22px,#1c1c1c 22px 44px)}
.card{width:100%;max-width:620px;background:#46494d;border:1px solid #5a5e63;box-shadow:0 20px 50px rgba(0,0,0,.45)}
.inner{padding:34px 40px 36px}
.head{display:flex;align-items:center;gap:16px;margin-bottom:8px}
.sign{flex:none;width:52px;height:52px;background:#f2c200;clip-path:polygon(50% 0,100% 90%,0 90%);display:grid;place-items:center}
.sign span{color:#1c1c1c;font-weight:900;font-size:24px;margin-top:12px}
.head h1{font-size:23px;letter-spacing:3px;color:#f4f2ee}
.head .sub{font-family:"Courier New",monospace;font-size:11.5px;letter-spacing:2px;color:#8f9499;margin-top:3px}
.loss{margin-top:22px;border:1px solid #5a5e63;background:#3a3d40}
.loss h2{font-size:12px;letter-spacing:3px;color:#f2c200;padding:10px 16px;border-bottom:1px solid #5a5e63;font-weight:700}
.loss ul{list-style:none}
.loss li{display:flex;gap:12px;padding:12px 16px;font-size:13.5px;border-bottom:1px dashed #4d5155;color:#d6d3cc;align-items:baseline}
.loss li:last-child{border-bottom:0}
.loss li::before{content:"×";color:#f2c200;font-weight:800}
.loss b{color:#fff}
.typearea{margin-top:24px}
.typearea label{font-size:13px;color:#bab6ad;display:block;margin-bottom:10px;line-height:1.7}
.typearea label b{color:#f2c200;font-family:"Courier New",monospace;letter-spacing:1px}
.typearea input{width:100%;padding:13px 14px;font-size:15px;letter-spacing:2px;background:#2c2f32;border:1.5px solid #5a5e63;color:#f4f2ee;outline:none;font-family:inherit}
.typearea input:focus{border-color:#f2c200;box-shadow:0 0 0 3px rgba(242,194,0,.18)}
.actions{margin-top:28px;display:flex;gap:16px;align-items:stretch}
.btn-cancel{flex:1.4;padding:16px;background:#e8e6e1;color:#1c1c1c;border:0;font-size:15.5px;font-weight:800;letter-spacing:4px;cursor:pointer;transition:background .15s}
.btn-cancel:hover{background:#fff}
.btn-del{flex:1;padding:16px;background:#a12718;color:#f4f2ee;border:0;font-size:15.5px;font-weight:800;letter-spacing:2px;cursor:pointer;position:relative;transition:background .15s}
.btn-del:disabled{background:#5a3f3b;color:#a89a97;cursor:not-allowed}
.btn-del:not(:disabled):hover{background:#c22f1c}
.note{margin-top:16px;font-size:12px;color:#8f9499;line-height:1.7}
.final{display:none;text-align:center;padding:40px 0 8px}
.final .drum{font-size:44px}
.final h2{font-size:19px;letter-spacing:4px;margin:14px 0 8px;color:#f2c200}
.final p{font-size:13px;color:#bab6ad;line-height:1.8}
.gone .inner{display:none}.gone .final{display:block}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:640px){.inner{padding:26px 20px}.actions{flex-direction:column}}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="stripe"></div>
  <div class="inner">
    <div class="head">
      <span class="sign"><span>!</span></span>
      <div>
        <h1>永久注销账号</h1>
        <div class="sub">DANGER ZONE · 危废处置单 HW-49</div>
      </div>
    </div>
    <div class="loss">
      <h2>注销后将永久失去</h2>
      <ul>
        <li>账号 <b>pl_0821</b> 与全部身份信息，不可找回、不可重注册同名</li>
        <li><b>7 年</b> 的处置记录与 214 张转运联单电子存根</li>
        <li>余额 <b>¥3,860.00</b> 与未结算的 2 笔处置款</li>
        <li>「危废管家」企业版订阅（剩余 13 个月）</li>
        <li>已对接的 4 个监管平台报送通道</li>
      </ul>
    </div>
    <div class="typearea">
      <label for="w">如确认继续，请输入确认词 <b>永久注销</b>。删除按钮在此之前保持不可用。</label>
      <input id="w" type="text" autocomplete="off" placeholder="在此输入：永久注销">
    </div>
    <div class="actions">
      <button class="btn-cancel" id="cancel">取消，保留账号</button>
      <button class="btn-del" id="del" disabled>永久删除</button>
    </div>
    <p class="note" id="note">取消按钮始终可用且更醒目——离开这个页面不需要任何理由。</p>
  </div>
  <div class="final" id="final">
    <div class="drum">☠</div>
    <h2>账号已送入处置流程</h2>
    <p>处置单号 HW-49-0923-07。法定留存数据脱敏后封存 5 年，<br>其余内容将在 24 小时内粉碎清除。</p>
  </div>
  <div class="stripe"></div>
</div>
<script>
const w=document.getElementById('w'),del=document.getElementById('del'),note=document.getElementById('note'),card=document.getElementById('card');
w.addEventListener('input',()=>{del.disabled=w.value.trim()!=='永久注销';});
del.addEventListener('click',()=>{card.classList.add('gone');});
document.getElementById('cancel').addEventListener('click',()=>{w.value='';del.disabled=true;note.textContent='已取消——你的账号、余额与记录原样保留。';});
</script>
</body>
</html>
