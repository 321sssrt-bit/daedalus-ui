<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>涟 · 通知中心</title>
<style>
:root{
  --bg:#e6ecf4;--ink:#1f2d4d;--muted:#67718c;--faint:#93a0bd;
  --glass:rgba(255,255,255,.55);--glass-strong:rgba(255,255,255,.72);
  --edge:rgba(255,255,255,.7);
  --blue:#4f7cff;--purple:#7c5cf0;--teal:#26b7a5;--orange:#f08a3c;
  --pink:#e85d9e;--green:#3aa564;--slate:#8a9bb8;
  --shadow:0 10px 34px rgba(31,45,77,.10);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6;min-height:100vh;overflow-x:hidden}
.blob{position:fixed;border-radius:50%;filter:blur(70px);pointer-events:none;z-index:0}
.b1{width:420px;height:420px;left:-120px;top:-100px;background:radial-gradient(circle,#b9d2ff,transparent 70%)}
.b2{width:380px;height:380px;right:-100px;top:16%;background:radial-gradient(circle,#ffd9ee,transparent 70%)}
.b3{width:340px;height:340px;left:24%;bottom:-140px;background:radial-gradient(circle,#c4efe2,transparent 70%)}
.page{position:relative;z-index:1;max-width:880px;margin:0 auto;padding:26px 24px 80px}

/* 顶条 */
.topbar{display:flex;align-items:center;gap:14px;margin-bottom:30px}
.brand{display:flex;align-items:center;gap:10px}
.brand .mark{width:34px;height:34px;border-radius:12px;background:linear-gradient(140deg,#4f7cff,#26b7a5);
  display:grid;place-items:center;box-shadow:0 6px 16px rgba(79,124,255,.35)}
.brand b{font-size:17px;letter-spacing:2px}
.topbar .me{margin-left:auto;display:flex;align-items:center;gap:10px;background:var(--glass);
  border:1px solid var(--edge);border-radius:99px;padding:5px 14px 5px 6px;
  backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);box-shadow:var(--shadow)}
.topbar .me .av{width:26px;height:26px;border-radius:50%;background:linear-gradient(140deg,#7c5cf0,#e85d9e);
  color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700}
.topbar .me span{font-size:12px;color:var(--muted)}

/* 标题区 */
.pane{background:var(--glass);border:1px solid var(--edge);border-radius:20px;
  backdrop-filter:blur(18px) saturate(1.35);-webkit-backdrop-filter:blur(18px) saturate(1.35);
  box-shadow:var(--shadow);overflow:hidden}
.pane-head{padding:22px 26px 0;display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.pane-head h1{font-size:24px;font-weight:700;letter-spacing:2px}
.unread-pill{background:rgba(79,124,255,.14);color:var(--blue);border-radius:99px;
  padding:3px 12px;font-size:12px;font-weight:600}
.head-acts{margin-left:auto;display:flex;gap:8px}
.btn-ghost{border:1px solid rgba(31,45,77,.16);background:rgba(255,255,255,.4);color:var(--ink);
  padding:7px 14px;border-radius:10px;font-size:12px;cursor:pointer;font-family:inherit;letter-spacing:1px}
.btn-ghost:hover{background:rgba(255,255,255,.75)}
.btn-ghost.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn-ghost.primary:hover{background:#3d6af0}
.btn-ghost:disabled{opacity:.45;cursor:default}
.tabs{display:flex;gap:4px;padding:14px 26px 0;border-bottom:1px solid rgba(31,45,77,.08)}
.tab{border:0;background:transparent;padding:9px 14px;font-size:13px;color:var(--muted);
  cursor:pointer;font-family:inherit;border-bottom:2px solid transparent;letter-spacing:1px}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--blue);border-bottom-color:var(--blue);font-weight:600}

/* 通知列表 */
.list{padding:10px 14px 18px;display:flex;flex-direction:column;gap:8px}
.note{background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.65);border-radius:14px;
  padding:14px 16px;cursor:pointer;transition:background .2s,box-shadow .2s,border-color .2s}
.note:hover{background:rgba(255,255,255,.75);box-shadow:0 6px 18px rgba(31,45,77,.09)}
.note.unread{background:var(--glass-strong)}
.note .row{display:flex;gap:12px;align-items:flex-start}
.ico{width:38px;height:38px;border-radius:12px;flex:0 0 auto;display:grid;place-items:center}
.ico svg{width:18px;height:18px}
.note .mid{flex:1;min-width:0}
.note .tt{display:flex;align-items:baseline;gap:8px}
.note .tt b{font-size:14px;font-weight:600}
.note .tt .badge{font-size:10px;padding:1px 8px;border-radius:99px;font-weight:600;letter-spacing:1px}
.note .sm{font-size:12.5px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note.open .sm{white-space:normal}
.note .rt{flex:0 0 auto;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.note .tm{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.dot{width:9px;height:9px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 3px rgba(79,124,255,.15)}
.dot.read{background:transparent;box-shadow:inset 0 0 0 1.5px #c4cde0}
.note .ext{display:none;margin-top:12px;padding-top:12px;border-top:1px dashed rgba(31,45,77,.14)}
.note.open .ext{display:block;animation:fadein .25s ease}
.ext .detail{font-size:13px;color:var(--ink);line-height:1.8;margin-bottom:12px}
.ext .ops{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.op{border:1px solid rgba(31,45,77,.16);background:rgba(255,255,255,.6);color:var(--ink);
  padding:6px 14px;border-radius:9px;font-size:12px;cursor:pointer;font-family:inherit}
.op:hover{background:#fff}
.op.acc{background:var(--blue);border-color:var(--blue);color:#fff}
.op.done{opacity:.55;pointer-events:none}
.state-tag{font-size:11px;font-weight:600;color:var(--green);letter-spacing:1px}
.list-empty{padding:44px 20px;text-align:center;color:var(--muted);font-size:13px}

.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,80px);z-index:60;
  background:rgba(31,45,77,.85);color:#fff;padding:10px 22px;border-radius:12px;font-size:13px;
  letter-spacing:1px;backdrop-filter:blur(8px);transition:transform .3s;box-shadow:0 10px 30px rgba(31,45,77,.3)}
.toast.show{transform:translate(-50%,0)}
@keyframes fadein{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

@media (max-width:640px){
  .page{padding:18px 12px 60px}
  .pane{border-radius:16px}
  .pane-head{padding:18px 16px 0}
  .tabs{padding:12px 16px 0;overflow-x:auto}
  .list{padding:8px 8px 14px}
  .note .tt b{font-size:13px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<div class="page">
  <header class="topbar">
    <div class="brand">
      <div class="mark">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
          <circle cx="9" cy="9" r="2" fill="#fff"/>
          <circle cx="9" cy="9" r="5" stroke="#fff" stroke-width="1.2" opacity=".75"/>
          <circle cx="9" cy="9" r="7.5" stroke="#fff" stroke-width="1" opacity=".4"/>
        </svg>
      </div>
      <b>涟</b>
    </div>
    <div class="me"><span class="av">我</span><span>沈涟漪 · 产品设计组</span></div>
  </header>

  <section class="pane">
    <div class="pane-head">
      <h1>通知中心</h1>
      <span class="unread-pill" id="unreadPill">3 条未读</span>
      <div class="head-acts">
        <button class="btn-ghost primary" id="btnAll">全部标为已读</button>
      </div>
    </div>
    <div class="tabs" id="tabs">
      <button class="tab on" data-f="all">全部</button>
      <button class="tab" data-f="unread">未读</button>
      <button class="tab" data-f="me">@我</button>
      <button class="tab" data-f="act">待处理</button>
    </div>
    <div class="list" id="list"></div>
  </section>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  var TYPES={
    comment:{n:"评论",c:"#4f7cff",ic:'<svg viewBox="0 0 18 18" fill="none"><path d="M3 3h12v9H8l-3.5 3V12H3z" stroke="#4f7cff" stroke-width="1.5" stroke-linejoin="round"/></svg>'},
    mention:{n:"提及",c:"#7c5cf0",ic:'<svg viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="3" stroke="#7c5cf0" stroke-width="1.5"/><path d="M12 6v3.5a2 2 0 0 0 4 0V9a6.5 6.5 0 1 0-3 5.4" stroke="#7c5cf0" stroke-width="1.5" fill="none"/></svg>'},
    approve:{n:"审批",c:"#f08a3c",ic:'<svg viewBox="0 0 18 18" fill="none"><rect x="3.5" y="2.5" width="11" height="13" rx="2" stroke="#f08a3c" stroke-width="1.5"/><path d="M6.5 9.5l1.8 1.8 3.2-3.6" stroke="#f08a3c" stroke-width="1.5" stroke-linecap="round"/></svg>'},
    system:{n:"系统",c:"#26b7a5",ic:'<svg viewBox="0 0 18 18" fill="none"><path d="M14.5 9a5.5 5.5 0 1 1-1.6-3.9M14.5 3v3h-3" stroke="#26b7a5" stroke-width="1.5" stroke-linecap="round"/></svg>'},
    invite:{n:"邀请",c:"#3aa564",ic:'<svg viewBox="0 0 18 18" fill="none"><circle cx="7" cy="6" r="2.6" stroke="#3aa564" stroke-width="1.5"/><path d="M2.5 15c.6-2.8 2.4-4.2 4.5-4.2s3.9 1.4 4.5 4.2M13 6.5h3M14.5 5v3" stroke="#3aa564" stroke-width="1.5" stroke-linecap="round"/></svg>'},
    rank:{n:"榜单",c:"#e85d9e",ic:'<svg viewBox="0 0 18 18" fill="none"><path d="M4 15V8M9 15V3M14 15v-5" stroke="#e85d9e" stroke-width="1.8" stroke-linecap="round"/></svg>'},
    remind:{n:"提醒",c:"#8a9bb8",ic:'<svg viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9.5" r="5.5" stroke="#8a9bb8" stroke-width="1.5"/><path d="M9 6.5v3l2 1.6M6.5 2.5L4 4.5M11.5 2.5L14 4.5" stroke="#8a9bb8" stroke-width="1.5" stroke-linecap="round"/></svg>'}
  };
  var NOTES=[
    {id:1,ty:"comment",tm:"10:24",unread:true,me:true,act:false,
      t:"林澈 评论了《潮汐报表 V3》",s:"这一版标题层级清楚多了,建议在周四评审会同步。",
      d:"林澈:这版把「环比异常」单独成块后,扫读速度快了不少。唯一建议:把图例挪到卡片内部右下,免得和数据带抢视线。",ops:["查看原帖","回复评论"]},
    {id:2,ty:"mention",tm:"09:51",unread:true,me:true,act:false,
      t:"苏茉 在《季度规划》中提到了你",s:"@沈涟漪 这块的交互走查排期麻烦看下是否合理。",
      d:"苏茉 在文档「季度规划 · 设计线」第 4 节中 @ 了你:「交互走查想排在开发联调前一周,你这边时间能错开吗?」",ops:["打开文档","回复苏茉"]},
    {id:3,ty:"approve",tm:"09:12",unread:true,me:false,act:true,
      t:"差旅报销单待审批 · ¥2,340",s:"设计组 · 祁望 · 苏州可用性调研往返差旅。",
      d:"报销明细:高铁往返 ¥1,120,酒店两晚 ¥1,050,市内交通 ¥170。凭证 6 张已验真。",ops:["同意","驳回"],stateKey:true},
    {id:4,ty:"system",tm:"昨天 18:40",unread:false,me:false,act:false,
      t:"数据同步已完成",s:"上周产品报表已更新,共同步 1,284 条记录。",
      d:"同步范围:行为埋点 W38 全量 + 漏斗中间表重算。耗时 6 分 12 秒,未发现冲突记录。",ops:["查看同步日志"]},
    {id:5,ty:"invite",tm:"昨天 15:02",unread:false,me:false,act:true,
      t:"陈岸 邀请你加入「湖区共创」项目",s:"角色:贡献者 · 有效期至 9 月 30 日。",
      d:"陈岸 邀请你以「贡献者」身份加入项目「湖区共创 · 组件库主题工作流」。加入后可见全部画板与批注记录。",ops:["接受","婉拒"],stateKey:true},
    {id:6,ty:"rank",tm:"昨天 09:00",unread:false,me:false,act:false,
      t:"本周活跃榜:你排名第 3",s:"共交付 14 条批注,较上周 +4。",
      d:"本周你在「潮汐报表」「湖区共创」两个项目中共留下 14 条批注,位列产品设计组第 3,第一是林澈(17 条)。",ops:["查看榜单"]},
    {id:7,ty:"remind",tm:"周三 08:30",unread:false,me:false,act:false,
      t:"提醒:明天 10:00 一对一沟通",s:"与主管的一对一沟通,地点:3F 玻璃亭。",
      d:"议程模板已生成:上次待办 3 项、本季度目标进度、阻塞事项。可提前在文档里补充议题。",ops:["查看议程","稍后提醒"]}
  ];
  var state={filter:"all",open:-1};
  var doneState={};

  function $(id){return document.getElementById(id);}
  function unreadCnt(){return NOTES.filter(function(n){return n.unread;}).length;}

  function filtered(){
    return NOTES.filter(function(n){
      if(state.filter==="unread")return n.unread;
      if(state.filter==="me")return n.me;
      if(state.filter==="act")return n.act&&!doneState[n.id];
      return true;
    });
  }

  function render(){
    var pill=$("unreadPill"),c=unreadCnt();
    pill.textContent=c?c+" 条未读":"全部已读";
    $("btnAll").disabled=!c;
    var list=filtered(),html="";
    if(!list.length)html='<div class="list-empty">此类目下暂无通知</div>';
    list.forEach(function(n){
      var T=TYPES[n.ty],open=state.open===n.id;
      html+='<div class="note'+(n.unread?" unread":"")+(open?" open":"")+'" data-id="'+n.id+'">'+
        '<div class="row"><div class="ico" style="background:'+T.c+'22">'+T.ic+'</div>'+
        '<div class="mid"><div class="tt"><b>'+n.t+'</b>'+
        '<span class="badge" style="background:'+T.c+'1f;color:'+T.c+'">'+T.n+'</span>'+
        (doneState[n.id]?'<span class="state-tag">'+doneState[n.id]+'</span>':'')+
        '</div><div class="sm">'+n.s+'</div>'+
        '<div class="ext"><div class="detail">'+n.d+'</div><div class="ops">'+
        n.ops.map(function(o,i){
          var cls="op"+(i===0?" acc":"");
          if(doneState[n.id])cls+=" done";
          return '<button class="'+cls+'" data-op="'+n.id+":"+i+'">'+o+'</button>';
        }).join("")+
        (n.unread?"":'<button class="op" data-unread="'+n.id+'">标为未读</button>')+
        '</div></div></div>'+
        '<div class="rt"><span class="tm">'+n.tm+'</span><span class="dot'+(n.unread?"":" read")+'"></span></div>'+
        '</div></div>';
    });
    $("list").innerHTML=html;
  }

  var tt=null;
  function toast(s){
    var t=$("toast");t.textContent=s;t.classList.add("show");
    clearTimeout(tt);tt=setTimeout(function(){t.classList.remove("show");},2400);
  }

  $("list").addEventListener("click",function(e){
    var op=e.target.closest("[data-op]");
    if(op){
      var parts=op.dataset.op.split(":"),id=+parts[0],i=+parts[1];
      var n=NOTES.filter(function(x){return x.id===id;})[0];
      if(doneState[id])return;
      if(n.stateKey){
        doneState[id]=n.ops[i];
        toast("已"+n.ops[i]+" · 该事项移出待处理");
      }else{
        toast("已打开「"+n.ops[i]+"」(演示)");
      }
      n.unread=false;render();return;
    }
    var u=e.target.closest("[data-unread]");
    if(u){
      var n2=NOTES.filter(function(x){return x.id==u.dataset.unread;})[0];
      n2.unread=true;render();return;
    }
    var card=e.target.closest(".note");if(!card)return;
    var nid=+card.dataset.id;
    state.open=state.open===nid?-1:nid;
    var n3=NOTES.filter(function(x){return x.id===nid;})[0];
    if(state.open===nid)n3.unread=false;
    render();
  });
  $("tabs").addEventListener("click",function(e){
    var t=e.target.closest(".tab");if(!t)return;
    this.querySelectorAll(".tab").forEach(function(x){x.classList.remove("on");});
    t.classList.add("on");state.filter=t.dataset.f;render();
  });
  $("btnAll").addEventListener("click",function(){
    NOTES.forEach(function(n){n.unread=false;});
    toast("已全部标为已读");render();
  });

  render();
})();
</script>
</body>
</html>
