<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>兑票 · 预订成功</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#241b2e;font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px 16px}
.phone{width:390px;height:844px;background:#f6f0f5;border-radius:40px;overflow:hidden;position:relative;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 10px #14101a;display:flex;flex-direction:column;color:#3a2d45}
.statusbar{height:34px;display:flex;justify-content:space-between;align-items:center;padding:0 26px;font-size:12px;color:#8a7a96;flex:none}
.mid{flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 24px 0;overflow:hidden}
.ok{margin:12px 0 6px;font-size:12px;letter-spacing:5px;color:#8a4d8f;font-weight:600}
.ticket{width:100%;max-width:330px;border-radius:18px;overflow:hidden;box-shadow:0 16px 40px rgba(80,40,90,.3);position:relative}
.t-top{background:linear-gradient(130deg,#c76b9d 0%,#9d5cb8 55%,#7a4dc4 100%);padding:26px 24px 22px;color:#fdf3fb;position:relative}
.t-top::after{content:"";position:absolute;right:-40px;bottom:-40px;width:130px;height:130px;border-radius:50%;border:16px solid rgba(255,255,255,.12)}
.t-check{width:44px;height:44px;border-radius:50%;background:#fdf3fb;display:grid;place-items:center;font-size:22px;color:#7a4dc4;font-weight:800}
.t-top h1{margin-top:14px;font-size:22px;letter-spacing:2px;font-weight:700}
.t-top .ev{margin-top:6px;font-size:12.5px;opacity:.85;letter-spacing:1px}
.perf{height:0;border-top:2px dashed #f6f0f5;position:relative}
.perf::before,.perf::after{content:"";position:absolute;top:-12px;width:24px;height:24px;border-radius:50%;background:#f6f0f5}
.perf::before{left:-12px}.perf::after{right:-12px}
.t-bot{background:#fdf3fb;padding:18px 24px 20px}
.trow{display:flex;justify-content:space-between;align-items:center;padding:7px 0}
.trow .k{font-size:11.5px;color:#9a86a8;letter-spacing:2px}
.trow .v{font-size:13.5px;font-weight:700;color:#3a2d45;font-family:"Courier New",monospace}
.trow .v.big{font-size:16px;color:#7a4dc4}
.qrrow{display:flex;gap:18px;align-items:center;margin-top:12px;padding-top:14px;border-top:1px dashed #d8c5de}
.qr{width:86px;height:86px;flex:none}
.qrinfo{flex:1;font-size:11px;color:#9a86a8;line-height:1.8;letter-spacing:1px}
.detail{margin-top:6px;width:100%;max-width:330px}
.d-head{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;font-size:12.5px;color:#8a4d8f;cursor:pointer;user-select:none;font-weight:600}
.d-head .arr{transition:transform .2s}
.detail.open .d-head .arr{transform:rotate(180deg)}
.d-body{max-height:0;overflow:hidden;transition:max-height .3s ease;font-size:12px;color:#6b5a78;line-height:1.9;background:#fdf3fb;border-radius:10px}
.detail.open .d-body{max-height:200px}
.d-body .in{padding:12px 16px}
.actions{margin-top:auto;width:100%;max-width:330px;padding:14px 0 20px}
.b-done{width:100%;border:0;border-radius:12px;padding:16px;background:linear-gradient(90deg,#c76b9d,#9d5cb8);color:#fdf3fb;font-size:15px;font-weight:700;letter-spacing:5px;cursor:pointer;box-shadow:0 8px 20px rgba(125,77,140,.35);transition:transform .15s}
.b-done:active{transform:scale(.97)}
.b-done.done{background:#4a3b55}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:430px){body{padding:0}.phone{width:100%;height:100vh;border-radius:0;box-shadow:none}}
</style>
</head>
<body>
<div class="phone">
  <div class="statusbar"><span>20:16</span><span>兑票 · TICKET</span></div>
  <div class="mid">
    <div class="ok">预订成功 · 电子票根</div>
    <div class="ticket">
      <div class="t-top">
        <div class="t-check">✓</div>
        <h1>雾港之夜 · 巡回现场</h1>
        <div class="ev">星岸体育馆 · 内场站票</div>
      </div>
      <div class="perf"></div>
      <div class="t-bot">
        <div class="trow"><span class="k">取票编号</span><span class="v big">DT-7741-0925</span></div>
        <div class="trow"><span class="k">场次时间</span><span class="v">2026-10-03 周六 19:30</span></div>
        <div class="trow"><span class="k">席位</span><span class="v">内场 B 区 · 第 4 排 21 号</span></div>
        <div class="qrrow">
          <div class="qr"><svg viewBox="0 0 100 100"><rect width="100" height="100" fill="#fdf3fb"/><g fill="#3a2d45"><rect x="8" y="8" width="24" height="24"/><rect x="68" y="8" width="24" height="24"/><rect x="8" y="68" width="24" height="24"/><rect x="14" y="14" width="12" height="12" fill="#fdf3fb"/><rect x="74" y="14" width="12" height="12" fill="#fdf3fb"/><rect x="14" y="74" width="12" height="12" fill="#fdf3fb"/><rect x="40" y="8" width="6" height="6"/><rect x="52" y="14" width="6" height="6"/><rect x="44" y="26" width="6" height="6"/><rect x="60" y="40" width="6" height="6"/><rect x="76" y="46" width="6" height="6"/><rect x="42" y="54" width="6" height="6"/><rect x="86" y="58" width="6" height="6"/><rect x="58" y="70" width="6" height="6"/><rect x="74" y="78" width="6" height="6"/><rect x="40" y="86" width="6" height="6"/></g></svg></div>
          <div class="qrinfo">入场时出示本码扫码核销<br>闸机开放：开场前 90 分钟<br>每码仅可核销一次</div>
        </div>
      </div>
    </div>
    <div class="detail" id="det">
      <div class="d-head" id="dhead"><span>展开票夹细则</span><span class="arr">⌄</span></div>
      <div class="d-body"><div class="in">· 实名入场，请携带购票证件原件<br>· 禁止外带食品、专业摄录设备<br>· 退改：开场前 48 小时可退，收 8% 手续费<br>· 客服热线 400-921-7741（工作日 10:00–19:00）</div></div>
    </div>
    <div class="actions"><button class="b-done" id="done">完成，收进票夹</button></div>
  </div>
</div>
<script>
const det=document.getElementById('det');
document.getElementById('dhead').addEventListener('click',()=>det.classList.toggle('open'));
const done=document.getElementById('done');
done.addEventListener('click',()=>{done.classList.add('done');done.textContent='已收进票夹 ✓';});
</script>
</body>
</html>
