<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>囤单 · 我的货架</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#2c2620;font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px 16px}
.phone{width:390px;height:844px;background:#efe4cd;border-radius:40px;overflow:hidden;position:relative;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 10px #14110d;display:flex;flex-direction:column;color:#4a3b26}
.statusbar{height:34px;display:flex;justify-content:space-between;align-items:center;padding:0 26px;font-size:12px;color:#8a7658;flex:none}
.topbar{padding:8px 22px;display:flex;justify-content:space-between;align-items:center;flex:none}
.topbar .tt{font-size:17px;letter-spacing:4px;font-weight:700}
.topbar .tag{font-size:10.5px;padding:5px 11px;border-radius:3px;background:#d8b56a;color:#4a3b26;letter-spacing:2px;font-weight:600;transform:rotate(1.5deg);box-shadow:0 1px 0 rgba(0,0,0,.08)}
.stage{flex:1;position:relative;margin:10px 22px 0}
.shelf{position:absolute;left:0;right:0;height:16px;background:linear-gradient(180deg,#c9a86f,#a5814c);border-radius:3px;box-shadow:0 6px 12px rgba(74,59,38,.25)}
.shelf::before,.shelf::after{content:"";position:absolute;top:16px;width:14px;height:60px;background:#b08d55}
.shelf::before{left:26px}.shelf::after{right:26px}
.s1{top:150px}.s2{top:330px}
.box{position:absolute;bottom:16px;background:linear-gradient(180deg,#cfa973,#bd9560);border:1px solid #a5814c;border-radius:2px}
.box::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:22px;margin-left:-11px;background:rgba(255,255,255,.32);border-left:1px dashed #a5814c;border-right:1px dashed #a5814c}
.box::after{content:"FRAGILE";position:absolute;right:6px;bottom:6px;font-size:7px;letter-spacing:1px;color:#8a683d;transform:rotate(-4deg)}
.bx-a{left:30px;width:64px;height:56px;opacity:.35}
.bx-b{right:34px;width:80px;height:44px;opacity:.35}
.msg{position:absolute;left:0;right:0;top:420px;text-align:center;padding:0 40px}
.msg h1{font-size:21px;letter-spacing:3px;font-weight:700;color:#4a3b26}
.msg p{margin-top:12px;font-size:13px;line-height:1.9;color:#8a7658}
.cta{margin-top:26px;display:inline-flex;align-items:center;gap:10px;background:#4a3b26;color:#f4ead2;border:0;padding:16px 30px;font-size:15px;font-weight:700;letter-spacing:3px;border-radius:4px;cursor:pointer;box-shadow:0 8px 20px rgba(74,59,38,.35);position:relative;transition:transform .15s}
.cta::before{content:"";position:absolute;top:-7px;left:14%;right:14%;height:14px;background:rgba(216,181,106,.75);transform:rotate(-1deg)}
.cta:active{transform:scale(.96)}
.msg .sub{display:block;margin-top:14px;font-size:11.5px;color:#a08c66;letter-spacing:1px}
.navbar{flex:none;height:64px;background:#e3d3ae;border-top:2px dashed #b08d55;display:grid;grid-template-columns:repeat(4,1fr)}
.nav{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;color:#8a7658;letter-spacing:1px;border:0;background:none;cursor:pointer}
.nav .ni{font-size:17px}
.nav.on{color:#4a3b26;font-weight:700}
.drop{position:absolute;bottom:16px;width:70px;height:52px;background:linear-gradient(180deg,#d8b57c,#c49c64);border:1px solid #a5814c;border-radius:2px;box-shadow:0 4px 8px rgba(74,59,38,.3);animation:dropIn .5s cubic-bezier(.3,1.5,.4,1)}
.drop::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:20px;margin-left:-10px;background:rgba(255,255,255,.32)}
@keyframes dropIn{from{transform:translateY(-160px);opacity:.3}to{transform:none;opacity:1}}
.toast{position:absolute;top:56px;left:50%;transform:translateX(-50%);background:#4a3b26;color:#f4ead2;padding:9px 20px;font-size:12.5px;border-radius:3px;opacity:0;transition:opacity .3s;letter-spacing:2px;z-index:9}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:430px){body{padding:0}.phone{width:100%;height:100vh;border-radius:0;box-shadow:none}}
</style>
</head>
<body>
<div class="phone">
  <div class="statusbar"><span>15:02</span><span>囤单 · 货架区</span></div>
  <div class="topbar"><span class="tt">我的货架</span><span class="tag">A-03 仓</span></div>
  <div class="stage">
    <div class="shelf s1"><div class="box bx-a"></div><div class="box bx-b"></div></div>
    <div class="shelf s2"></div>
    <div class="msg" id="msg">
      <h1>货架还空着</h1>
      <p>这个仓位一单货都还没囤。<br>把常买的东西丢进来，凑满就自动拼箱。</p>
      <button class="cta" id="go">📦 去囤第一单</button>
      <span class="sub">已有 2 个空箱位预留在 A-03</span>
    </div>
  </div>
  <div class="navbar">
    <button class="nav"><span class="ni">⌂</span>首页</button>
    <button class="nav on"><span class="ni">▤</span>货架</button>
    <button class="nav"><span class="ni">◈</span>拼箱</button>
    <button class="nav"><span class="ni">☺</span>我的</button>
  </div>
  <div class="toast" id="toast">第一箱已上架</div>
</div>
<script>
const go=document.getElementById('go'),toast=document.getElementById('toast'),msg=document.getElementById('msg'),s2=document.querySelector('.s2');
let n=0;
go.addEventListener('click',()=>{
 n++;
 const b=document.createElement('div');b.className='drop';
 b.style.left=(20+(n-1)*82)+'px';s2.appendChild(b);
 toast.textContent='第 '+n+' 箱已上架';toast.classList.add('show');
 setTimeout(()=>toast.classList.remove('show'),1500);
 msg.querySelector('h1').textContent='货架开张了';
 msg.querySelector('p').innerHTML='已囤 '+n+' 箱，再囤 '+(Math.max(0,4-n))+' 箱自动拼箱发货。';
 msg.querySelector('.sub').textContent='剩余空位 '+(Math.max(0,3-n))+' 个';
 go.textContent=n>=4?'📦 去拼箱发货':'📦 继续囤货';});
document.querySelectorAll('.nav').forEach(x=>x.addEventListener('click',()=>{document.querySelectorAll('.nav').forEach(y=>y.classList.remove('on'));x.classList.add('on');}));
</script>
</body>
</html>
