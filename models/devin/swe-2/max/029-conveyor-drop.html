<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>送件口 · 批量文件投送</title>
<style>
  :root{
    --bg:#dfe8ee; --belt:#3b4a54; --belt-2:#324049; --panel:#f4f8fa; --line:#b8c6cf;
    --ink:#222e36; --ink-soft:#5d7180; --warn:#e8a012; --go:#2e9e63; --danger:#d1495b; --steel:#8ba2b0;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:var(--bg);color:var(--ink);
    font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;
    background-image:repeating-linear-gradient(90deg,#00000005 0 2px,transparent 2px 80px);
  }
  .page{max-width:1040px;margin:0 auto;padding:44px 30px 80px}
  header{display:flex;align-items:center;gap:18px;margin-bottom:30px}
  header .lamp{width:14px;height:14px;border-radius:50%;background:var(--go);box-shadow:0 0 0 4px #2e9e6333;flex:none}
  header h1{font-size:26px;letter-spacing:4px}
  header .cap{font-size:12.5px;color:var(--ink-soft);letter-spacing:2px;margin-left:auto}
  .dropzone{
    border:3px dashed var(--steel);border-radius:14px;background:var(--panel);
    padding:52px 30px;text-align:center;cursor:pointer;transition:all .2s ease;position:relative;overflow:hidden;
  }
  .dropzone::after{
    content:"";position:absolute;left:0;right:0;bottom:0;height:16px;
    background:repeating-linear-gradient(45deg,var(--warn) 0 22px,var(--belt) 22px 44px);
  }
  .dropzone:hover,.dropzone.drag{border-color:var(--warn);background:#eef4f7}
  .dropzone .icon{font-size:44px;display:block;margin-bottom:14px}
  .dropzone h2{font-size:20px;letter-spacing:2px}
  .dropzone p{font-size:13px;color:var(--ink-soft);margin-top:10px;letter-spacing:1px}
  .dropzone .browse{color:var(--belt);font-weight:700;text-decoration:underline}
  .queue{margin-top:34px}
  .queue .qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .queue h2{font-size:14px;letter-spacing:4px;color:var(--ink-soft)}
  .queue .qhead .stat{font-size:13px;color:var(--ink-soft)}
  .belt{
    background:var(--belt);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:12px;
  }
  .file{
    display:grid;grid-template-columns:46px 1fr auto auto auto;gap:14px;align-items:center;
    background:var(--panel);border-radius:8px;padding:14px 18px;transition:all .2s ease;
  }
  .file .fic{width:46px;height:46px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:22px;background:var(--bg)}
  .file .fname{font-size:14.5px;font-weight:600}
  .file .fsize{font-size:12px;color:var(--ink-soft);margin-top:4px;font-variant-numeric:tabular-nums}
  .file .prog{width:150px}
  .file .prog .bar{height:8px;background:#d7e0e6;border-radius:4px;overflow:hidden}
  .file .prog .bar i{display:block;height:100%;background:var(--go);border-radius:4px;transition:width .3s ease}
  .file .prog .pct{font-size:11px;color:var(--ink-soft);margin-top:4px;text-align:right}
  .file .st{font-size:12px;font-weight:600;letter-spacing:1px;padding:5px 12px;border-radius:4px;white-space:nowrap}
  .file .st.ready{background:#dceee4;color:var(--go)}
  .file .st.moving{background:#fdf0d3;color:#9a6d0b}
  .file .rm{
    font-size:12px;cursor:pointer;color:var(--danger);border:1px solid var(--danger);
    background:none;padding:5px 12px;border-radius:4px;font-family:inherit;transition:all .15s;
  }
  .file .rm:hover{background:var(--danger);color:#fff}
  .file.leaving{opacity:0;transform:translateX(40px)}
  .actions{display:flex;justify-content:space-between;align-items:center;margin-top:26px}
  .actions .note{font-size:12.5px;color:var(--ink-soft)}
  .start{
    font-family:inherit;font-size:16px;font-weight:700;letter-spacing:4px;cursor:pointer;
    background:var(--warn);color:#3b2e05;border:none;padding:16px 44px;border-radius:8px;
    border-bottom:4px solid #b87b0a;transition:all .15s;
  }
  .start:hover:not(:disabled){transform:translateY(-2px);border-bottom-width:6px}
  .start:active:not(:disabled){transform:translateY(1px);border-bottom-width:2px}
  .start:disabled{opacity:.45;cursor:not-allowed}
  .start:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
  @media (max-width:820px){
    .file{grid-template-columns:40px 1fr auto;row-gap:8px}
    .file .prog{grid-column:1/-1;width:100%}
    .page{padding:30px 16px 60px}
  }
  @media (prefers-reduced-motion: reduce){
    *{transition:none!important;animation:none!important}
  }
</style>
</head>
<body>
<div class="page">
  <header>
    <span class="lamp"></span>
    <h1>送件口 · 3 号传送带</h1>
    <span class="cap">分拣车间 · 班次 甲 / 单批限 50 件</span>
  </header>

  <div class="dropzone" id="dz" role="button" tabindex="0" aria-label="拖放或选择文件">
    <span class="icon">📦</span>
    <h2>把文件放上传送带</h2>
    <p>拖到此处，或 <span class="browse">点我挑选文件</span> · 支持图纸 / 清单 / 影像，单件 ≤ 200MB</p>
    <input type="file" id="pick" multiple style="display:none">
  </div>

  <div class="queue">
    <div class="qhead">
      <h2>在 带 货 件</h2>
      <span class="stat" id="stat"></span>
    </div>
    <div class="belt" id="belt"></div>
    <div class="actions">
      <span class="note">传送带就绪后点「开始处理」，分拣机会按序入仓。</span>
      <button class="start" id="startBtn">开始处理</button>
    </div>
  </div>
</div>

<script>
const belt=document.getElementById('belt'),stat=document.getElementById('stat'),startBtn=document.getElementById('startBtn');
let files=[
  {n:"冲压件图纸-终版.dwg",s:"48.2 MB",p:100,st:"就绪",ic:"📐"},
  {n:"九月发货清单.xlsx",s:"1.8 MB",p:100,st:"就绪",ic:"📋"},
  {n:"车间巡检影像-0912.zip",s:"186.4 MB",p:64,st:"输送中",ic:"🎞️"}
];
function render(){
  belt.innerHTML='';
  files.forEach((f,i)=>{
    const el=document.createElement('div');el.className='file';
    el.innerHTML=`<div class="fic">${f.ic}</div>
      <div><div class="fname">${f.n}</div><div class="fsize">${f.s} · 批次 B-0914</div></div>
      <div class="prog"><div class="bar"><i style="width:${f.p}%"></i></div><div class="pct">${f.p}%</div></div>
      <span class="st ${f.st==='就绪'?'ready':'moving'}">${f.st}</span>
      <button class="rm">移下带</button>`;
    el.querySelector('.rm').addEventListener('click',()=>{
      el.classList.add('leaving');setTimeout(()=>{files.splice(i,1);render();},200);
    });
    belt.appendChild(el);
  });
  stat.textContent=`在带 ${files.length} 件 · 合计 ${(files.reduce((a,f)=>a+parseFloat(f.s),0)).toFixed(1)} MB`;
  startBtn.disabled=files.length===0||files.every(f=>f.st==='就绪'&&f.done);
}
let clock=setInterval(()=>{
  let moved=false;
  files.forEach(f=>{
    if(f.p<100){f.p=Math.min(100,f.p+Math.floor(Math.random()*9));if(f.p===100)f.st='就绪';moved=true;}
  });
  if(moved)render();
},700);
const dz=document.getElementById('dz'),pick=document.getElementById('pick');
dz.addEventListener('click',()=>pick.click());
dz.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick.click();}});
pick.addEventListener('change',()=>{
  [...pick.files].forEach(f=>{
    files.push({n:f.name,s:(f.size/1048576).toFixed(1)+' MB',p:0,st:'输送中',ic:'📦'});
  });
  render();
});
['dragover','dragenter'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add('drag');}));
['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.remove('drag');}));
startBtn.addEventListener('click',()=>{
  if(files.every(f=>f.p===100)){startBtn.textContent='已入仓 ✓';startBtn.disabled=true;}
  else{startBtn.textContent='等待输送…';setTimeout(()=>startBtn.textContent='开始处理',1200);}
});
render();
</script>
</body>
</html>
