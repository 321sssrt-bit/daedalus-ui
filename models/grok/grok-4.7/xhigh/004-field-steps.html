<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>田垄手册</title>
<style>

* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: #e4efe2; color: #1e3328; font: 18px/1.6 "Songti SC","SimSun","PMingLiU",serif; padding: 40px 48px; }
.rail { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; height: 72px; }
.rail button { border: 1px solid #c5d5c8; background: #f7fbf6; color: #5d7364; border-radius: 18px; cursor: pointer; font: 14px/1.4 system-ui,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
.rail button[aria-current="step"] { background: #2f6b45; color: #f7fbf6; border-color: #2f6b45; }
.rail button.done { box-shadow: inset 0 -4px 0 #e1a15a; }
h1 { font-size: 56px; line-height: 1.05; margin: 36px 0 12px; max-width: 760px; }
.story { max-width: 760px; margin: 0; min-height: 96px; }
.actions { display: flex; gap: 12px; margin-top: 32px; align-items: center; }
.primary, .ghost { height: 48px; min-width: 140px; border-radius: 999px; cursor: pointer; font-size: 16px; }
.primary { border: 0; background: #2f6b45; color: #f7fbf6; }
.primary:hover { background: #1e3328; }
.ghost { background: transparent; border: 1px solid #1e3328; color: #1e3328; }
.ghost:disabled { color: #5d7364; border-color: #c5d5c8; cursor: not-allowed; }
.skip { background: none; border: 0; color: #1e3328; text-decoration: underline; cursor: pointer; font-size: 16px; }
@media (max-width: 800px) {
  body { padding: 20px; }
  h1 { font-size: 40px; }
  .actions { flex-direction: column; align-items: stretch; gap: 10px; }
}


@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

</style>
</head>
<body>

<main>
  <p>田垄手册</p>
  <div class="rail" id="t004-rail">
    <button type="button" data-step="0">1 认田</button>
    <button type="button" data-step="1">2 记雨</button>
    <button type="button" data-step="2">3 收第一垄</button>
  </div>
  <h1 id="t004-title">先认出你的那一块</h1>
  <p class="story" id="t004-story">手册只做三件事。第一步是给田起一个你自己记得住的名字。</p>
  <div class="actions">
    <button class="ghost" id="t004-prev" type="button">上一步</button>
    <button class="primary" id="t004-next" type="button">下一步</button>
    <button class="skip" id="t004-skip" type="button">跳过</button>
  </div>
</main>

<script>

(function () {
  var steps = [
    ["先认出你的那一块", "手册只做三件事。第一步是给田起一个你自己记得住的名字。"],
    ["雨落下来就记一笔", "不必精确到毫米。写上「小雨」或「浇过」，以后回看就够。"],
    ["第一垄收成单独留着", "它用来对照，不拿来炫耀。准备好了就从今天这块田开始。"]
  ];
  var index = 0;
  var title = document.getElementById("t004-title");
  var story = document.getElementById("t004-story");
  var prev = document.getElementById("t004-prev");
  var next = document.getElementById("t004-next");
  var buttons = Array.prototype.slice.call(document.querySelectorAll("#t004-rail button"));
  function paint() {
    title.textContent = steps[index][0];
    story.textContent = steps[index][1];
    prev.disabled = index === 0;
    next.textContent = index === 2 ? "开始种" : "下一步";
    buttons.forEach(function (button, step) {
      button.setAttribute("aria-current", step === index ? "step" : "false");
      button.classList.toggle("done", step < index);
    });
  }
  function go(step) { index = step; paint(); }
  prev.addEventListener("click", function () { if (index > 0) go(index - 1); });
  next.addEventListener("click", function () {
    if (index < 2) go(index + 1);
    else { title.textContent = "今天从这块田开始"; story.textContent = "三步已经看完，记录会留在田里。"; }
  });
  document.getElementById("t004-skip").addEventListener("click", function () {
    title.textContent = "手册已收起";
    story.textContent = "手册已收起，从今日田开始。";
    next.textContent = "开始种";
  });
  buttons.forEach(function (button) {
    button.addEventListener("click", function () { go(Number(button.getAttribute("data-step"))); });
  });
  paint();
})();

</script>
</body>
</html>
