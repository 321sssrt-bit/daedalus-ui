<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>软木列</title>
<style>

* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: #c9956a; color: #3a2a1e; font: 15px/1.45 "Songti SC","SimSun","PMingLiU",serif; padding: 24px; }
header { height: 64px; display: flex; align-items: center; justify-content: space-between; }
h1 { font-size: 28px; margin: 0; }
.add { height: 40px; border: 0; border-radius: 999px; background: #8c3d2f; color: #fffaf3; padding: 0 18px; cursor: pointer; font: 15px "Songti SC","SimSun","PMingLiU",serif; }
.add:hover { background: #3a2a1e; }
.board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.lane { background: #f3e6d4; border-radius: 18px; padding: 12px; min-height: 420px; }
.lane h2 { font-size: 13px; letter-spacing: 0.08em; margin: 4px 8px 12px; }
.card { display: block; width: 100%; text-align: left; min-height: 72px; margin-bottom: 8px; border-radius: 12px; border: 1px solid #e4d3bf; background: #fffaf3; color: #3a2a1e; padding: 12px; cursor: pointer; font: 15px "Songti SC","SimSun","PMingLiU",serif; }
.card:hover { transform: translateY(-2px); }
@media (max-width: 800px) {
  .board { grid-template-columns: 1fr; }
  .lane { min-height: 0; }
}


@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

</style>
</head>
<body>

<header>
  <h1>软木列</h1>
  <button class="add" id="t010-add" type="button">新建一条</button>
</header>
<div class="board">
  <section class="lane" id="t010-lane-0"><h2>待钉</h2></section>
  <section class="lane" id="t010-lane-1"><h2>在做</h2></section>
  <section class="lane" id="t010-lane-2"><h2>晾干</h2></section>
</div>

<script>

(function () {
  var names = ["修壶嘴", "配釉", "写标"];
  var lanes = [0, 1, 2].map(function (index) { return document.getElementById("t010-lane-" + index); });
  var serial = 3;
  function card(title, lane) {
    var button = document.createElement("button");
    button.className = "card";
    button.type = "button";
    button.textContent = title;
    button.addEventListener("click", function () {
      var next = Math.min(lane + 1, 2);
      if (next === lane) return;
      lane = next;
      lanes[next].appendChild(button);
    });
    lanes[lane].appendChild(button);
  }
  names.forEach(function (name, index) { card(name, index === 2 ? 1 : 0); });
  document.getElementById("t010-add").addEventListener("click", function () {
    serial += 1;
    card("新活 " + serial, 0);
  });
})();

</script>
</body>
</html>
