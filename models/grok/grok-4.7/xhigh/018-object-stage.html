<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>器物册</title>
<style>

* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; color: #111111; font: 16px/1.5 system-ui,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
.stage { min-height: 100vh; display: grid; grid-template-columns: 1.1fr 0.9fr; }
.object { background: #e8e2d8; padding: 48px; display: flex; align-items: end; }
.orb { width: 280px; height: 280px; border-radius: 50% 50% 46% 46%; background: #f3f0eb; border: 1px solid #111111; }
.buy { background: #f3f0eb; padding: 48px; display: flex; align-items: center; }
.buy > div { width: min(420px, 100%); }
h1 { font-size: 64px; line-height: 0.95; margin: 0; }
.price { color: #8f2f2a; font-size: 28px; margin: 12px 0; }
.muted { color: #6e675e; }
.specs { display: flex; gap: 8px; margin: 16px 0; }
.specs button { height: 40px; border-radius: 999px; border: 1px solid #111111; background: #ffffff; padding: 0 14px; cursor: pointer; }
.specs button[aria-pressed="true"] { background: #111111; color: #ffffff; }
.primary { width: 100%; height: 56px; border: 0; background: #8f2f2a; color: #ffffff; cursor: pointer; font-size: 16px; }
@media (max-width: 800px) {
  .stage { grid-template-columns: 1fr; }
  .buy { padding: 24px; }
  h1 { font-size: 48px; }
}


@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

</style>
</head>
<body>

<main class="stage">
  <section class="object"><div class="orb" id="t018-orb"></div></section>
  <section class="buy"><div>
    <p class="muted">器物册 · 灯</p>
    <h1>北窗灯</h1>
    <p class="price" id="t018-price">先选釉</p>
    <p class="muted">手工拉坯，每只口沿都不重复。</p>
    <div class="specs">
      <button type="button" data-price="280" data-name="素坯">素坯</button>
      <button type="button" data-price="360" data-name="青釉">青釉</button>
    </div>
    <button class="primary" id="t018-buy" type="button">买下这只</button>
    <p id="t018-note"></p>
  </div></section>
</main>

<script>

(function () {
  var picked = "";
  document.querySelector(".specs").addEventListener("click", function (event) {
    var button = event.target.closest("button");
    if (!button) return;
    picked = button.getAttribute("data-name");
    document.querySelectorAll(".specs button").forEach(function (item) {
      item.setAttribute("aria-pressed", item === button ? "true" : "false");
    });
    document.getElementById("t018-price").textContent = button.getAttribute("data-price") + " 元";
    document.getElementById("t018-orb").style.background = picked === "青釉" ? "#d5e0d8" : "#f3f0eb";
  });
  document.getElementById("t018-buy").addEventListener("click", function () {
    document.getElementById("t018-note").textContent = picked ? "已记下：" + picked : "先选一个规格。";
  });
})();

</script>
</body>
</html>
