<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>铜锁验证</title>
<style>

* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #12151c; color: #e8eef8; font: 16px/1.5 ui-monospace,"Cascadia Mono","Consolas",monospace; padding: 24px; }
.lock { width: 520px; max-width: 100%; background: #1c2230; border-radius: 16px; padding: 32px; }
h1 { font-size: 28px; margin: 0 0 8px; }
.lead { color: #8ea0b8; margin: 0 0 20px; }
.digits { display: flex; gap: 8px; }
.digits input { width: 64px; height: 64px; text-align: center; font: 28px/1 ui-monospace,"Cascadia Mono","Consolas",monospace; border-radius: 8px; border: 1px solid #8ea0b8; background: #12151c; color: #e8eef8; }
.digits input:focus { outline: none; border-color: #7ddea0; }
.actions { display: flex; gap: 8px; margin-top: 16px; }
button { height: 44px; border-radius: 8px; padding: 0 16px; cursor: pointer; font: 14px ui-monospace,"Cascadia Mono","Consolas",monospace; }
.go { border: 0; background: #7ddea0; color: #12151c; }
.resend { background: transparent; color: #e8eef8; border: 1px solid #8ea0b8; }
button:disabled { opacity: 0.45; cursor: not-allowed; }
.bad { color: #ff6b6b; min-height: 22px; }
.ok { color: #7ddea0; }
@media (max-width: 800px) {
  .lock { width: 100%; }
  .digits input { width: 1fr; flex: 1; }
}


@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

</style>
</head>
<body>

<main class="lock">
  <h1>再对一次锁</h1>
  <p class="lead">密码已经通过。把刚送到的六位写进锁里。</p>
  <div class="digits" id="t006-digits">
    <input aria-label="第1位" maxlength="1" inputmode="numeric">
    <input aria-label="第2位" maxlength="1" inputmode="numeric">
    <input aria-label="第3位" maxlength="1" inputmode="numeric">
    <input aria-label="第4位" maxlength="1" inputmode="numeric">
    <input aria-label="第5位" maxlength="1" inputmode="numeric">
    <input aria-label="第6位" maxlength="1" inputmode="numeric">
  </div>
  <div class="actions">
    <button class="go" id="t006-go" type="button">确认</button>
    <button class="resend" id="t006-resend" type="button" disabled>重发 <span id="t006-count">30</span></button>
  </div>
  <p class="bad" id="t006-bad" hidden>这一串对不上。</p>
  <p class="bad" id="t006-lock" hidden>锁已合上，稍后再试。</p>
  <p class="ok" id="t006-ok" hidden>锁已打开。</p>
</main>

<script>

(function () {
  var inputs = Array.prototype.slice.call(document.querySelectorAll("#t006-digits input"));
  var fails = 0;
  var left = 30;
  var resend = document.getElementById("t006-resend");
  var count = document.getElementById("t006-count");
  var timer = setInterval(function () {
    left -= 1;
    if (left <= 0) { left = 0; clearInterval(timer); resend.disabled = false; }
    count.textContent = String(left);
  }, 1000);
  inputs.forEach(function (input, index) {
    input.addEventListener("input", function () {
      input.value = input.value.replace(/\D/g, "").slice(0, 1);
      if (input.value && inputs[index + 1]) inputs[index + 1].focus();
    });
  });
  resend.addEventListener("click", function () {
    left = 30;
    resend.disabled = true;
    count.textContent = "30";
    clearInterval(timer);
    timer = setInterval(function () {
      left -= 1;
      if (left <= 0) { left = 0; clearInterval(timer); resend.disabled = false; }
      count.textContent = String(left);
    }, 1000);
  });
  document.getElementById("t006-go").addEventListener("click", function () {
    if (fails >= 3) return;
    var code = inputs.map(function (input) { return input.value; }).join("");
    var ok = code === "482913";
    document.getElementById("t006-ok").hidden = !ok;
    document.getElementById("t006-bad").hidden = ok;
    if (ok) return;
    fails += 1;
    if (fails >= 3) {
      document.getElementById("t006-lock").hidden = false;
      inputs.forEach(function (input) { input.disabled = true; });
      document.getElementById("t006-go").disabled = true;
    }
  });
})();

</script>
</body>
</html>
