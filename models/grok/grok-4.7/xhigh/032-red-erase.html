<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>红销</title>
<style>

* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: #f4f4f4; color: #1a1a1a; font: 16px/1.6 system-ui,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; padding: 64px; }
h1 { color: #9d1c1c; font-size: 44px; line-height: 1.1; margin: 0 0 12px; }
ul { color: #666666; padding-left: 18px; max-width: 560px; }
label { display: block; margin-top: 12px; }
input { display: block; margin-top: 8px; width: 280px; max-width: 100%; height: 48px; border: 1px solid #dddddd; padding: 0 12px; font: 16px system-ui,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
.actions { display: flex; gap: 12px; align-items: center; margin-top: 24px; }
.cancel { height: 56px; min-width: 220px; border: 0; background: #1a1a1a; color: #ffffff; cursor: pointer; font-size: 16px; }
.delete { height: 40px; background: transparent; color: #9d1c1c; border: 1px solid #9d1c1c; padding: 0 12px; cursor: pointer; }
.delete:disabled { color: #bbbbbb; border-color: #dddddd; cursor: not-allowed; }
@media (max-width: 800px) {
  body { padding: 20px; }
  .actions { flex-direction: column; align-items: stretch; }
}


@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

</style>
</head>
<body>

<main>
  <h1>删掉整柜</h1>
  <p>这一步之后找不回来。</p>
  <ul>
    <li>窑籍和称呼</li>
    <li>留下的样带</li>
    <li>未结的账单</li>
  </ul>
  <label>输入确认词「红销」
    <input id="t032-word" autocomplete="off">
  </label>
  <div class="actions">
    <button class="cancel" id="t032-cancel" type="button">取消并留下</button>
    <button class="delete" id="t032-delete" type="button" disabled>删除整柜</button>
  </div>
  <p id="t032-note"></p>
</main>

<script>

(function () {
  var word = document.getElementById("t032-word");
  var del = document.getElementById("t032-delete");
  word.addEventListener("input", function () { del.disabled = word.value.trim() !== "红销"; });
  del.addEventListener("click", function () {
    document.getElementById("t032-note").textContent = "整柜已红销。";
  });
  document.getElementById("t032-cancel").addEventListener("click", function () {
    document.getElementById("t032-note").textContent = "柜子还在，什么都没删。";
  });
})();

</script>
</body>
</html>
