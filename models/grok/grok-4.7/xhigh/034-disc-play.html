<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>黑胶</title>
<style>

* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #2a241c; font-family: system-ui,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
.phone { width: 390px; height: 844px; overflow: auto; position: relative; }
@media (max-width: 800px) {
  body { display: block; background: #2a241c; }
  .phone { width: 100%; min-height: 100vh; height: auto; }
}

.phone { background: #1a140f; color: #f6efe4; text-align: center; padding: 36px 24px 24px; }
h1 { font-family: "Songti SC","SimSun","PMingLiU",serif; font-size: 28px; margin: 0; }
.by { color: #a89880; }
.disc { width: 250px; height: 250px; margin: 36px auto; border-radius: 50%; background: radial-gradient(circle at 50% 50%, #1a140f 18px, #c8b59a 19px); }
.disc.on { animation: spin 8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
input { width: 100%; accent-color: #e25b2a; }
.controls { display: flex; justify-content: center; gap: 16px; margin-top: 24px; }
.play { width: 64px; height: 64px; border-radius: 999px; border: 0; background: #f6efe4; color: #1a140f; cursor: pointer; }
.next { height: 44px; border: 0; background: transparent; color: #f6efe4; cursor: pointer; font: 16px "Songti SC","SimSun","PMingLiU",serif; }
@media (max-width: 800px) { .disc { width: 200px; height: 200px; } }



@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

</style>
</head>
<body>

<div class="phone">
  <p class="by">正在听</p>
  <h1 id="t034-title">秋分夜谈</h1>
  <p class="by" id="t034-by">陈禾</p>
  <div class="disc" id="t034-disc"></div>
  <input id="t034-range" type="range" min="0" max="100" value="32">
  <p id="t034-pos">32%</p>
  <div class="controls">
    <button class="play" id="t034-play" type="button">播放</button>
    <button class="next" id="t034-next" type="button">下一首</button>
  </div>
</div>

<script>

(function () {
  var playing = false;
  var tracks = [["秋分夜谈", "陈禾"], ["第二乐章", "霜询"]];
  var index = 0;
  var disc = document.getElementById("t034-disc");
  document.getElementById("t034-play").addEventListener("click", function () {
    playing = !playing;
    this.textContent = playing ? "暂停" : "播放";
    disc.classList.toggle("on", playing);
  });
  document.getElementById("t034-next").addEventListener("click", function () {
    index = (index + 1) % tracks.length;
    document.getElementById("t034-title").textContent = tracks[index][0];
    document.getElementById("t034-by").textContent = tracks[index][1];
  });
  document.getElementById("t034-range").addEventListener("input", function () {
    document.getElementById("t034-pos").textContent = this.value + "%";
  });
})();

</script>
</body>
</html>
