<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>夜航门</title>
<style>

* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0c0c0c; color: #f3ead7; font: 16px/1.5 "Songti SC","SimSun","PMingLiU",serif; padding: 24px; }
.gate { width: 480px; max-width: 100%; background: #171717; padding: 40px 36px; border-top: 4px solid #d6b25e; }
.kicker { letter-spacing: 0.42em; color: #d6b25e; font-size: 13px; margin: 0 0 12px; }
h1 { font-size: 48px; line-height: 1.05; margin: 0 0 8px; }
p { color: #8d8474; margin: 0 0 20px; }
input { width: 100%; height: 64px; border: 1px solid #d6b25e; background: #0c0c0c; color: #f3ead7; font: 28px/1 "Songti SC","SimSun","PMingLiU",serif; letter-spacing: 0.4em; text-align: center; }
input:focus { outline: 3px solid #d6b25e; outline-offset: 3px; }
button { margin-top: 16px; width: 100%; height: 48px; border: 0; background: #d6b25e; color: #0c0c0c; letter-spacing: 0.2em; cursor: pointer; font-size: 16px; }
button:hover { background: #f3ead7; }
.fail { margin-top: 12px; padding: 12px; color: #c4473a; background: #3a1816; }
.ok { margin-top: 12px; color: #d6b25e; }
@media (max-width: 800px) {
  body { padding: 20px; }
  .gate { width: 100%; }
  input { font-size: 22px; }
}


@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

</style>
</head>
<body>

<main class="gate">
  <p class="kicker">只限持帖</p>
  <h1>夜航门</h1>
  <p>没有邀请就进不去栈桥。把帖子上的四个字交给门。</p>
  <form id="t003-form">
    <label for="t003-code" style="position:absolute;left:-999px">邀请码</label>
    <input id="t003-code" maxlength="8" placeholder="邀请码" aria-label="邀请码">
    <button id="t003-check" type="submit">核对夜航</button>
    <p class="fail" id="t003-fail" hidden>这张帖子对不上今夜的门。</p>
    <p class="ok" id="t003-ok" hidden>门已开，从左侧栈桥进。</p>
  </form>
</main>

<script>

(function () {
  document.getElementById("t003-form").addEventListener("submit", function (event) {
    event.preventDefault();
    var code = document.getElementById("t003-code").value.trim();
    var ok = code === "夜航";
    document.getElementById("t003-fail").hidden = ok || !code ? code === "夜航" : false;
    if (!code) {
      document.getElementById("t003-fail").hidden = false;
      document.getElementById("t003-ok").hidden = true;
      return;
    }
    document.getElementById("t003-fail").hidden = ok;
    document.getElementById("t003-ok").hidden = !ok;
  });
})();

</script>
</body>
</html>
