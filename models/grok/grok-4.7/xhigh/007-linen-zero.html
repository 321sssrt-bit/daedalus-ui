<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>麻布工作室</title>
<style>

* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: #f4f0e6; color: #2c2a26; font: 18px/1.6 "Songti SC","SimSun","PMingLiU",serif; padding: 18vh 8vw 48px; }
h1 { font-size: 76px; line-height: 0.92; max-width: 640px; margin: 0; font-weight: 700; }
.lead { max-width: 460px; color: #7a746a; margin: 20px 0 0; }
.actions { display: flex; gap: 20px; margin-top: 36px; }
button { height: 56px; padding: 0 28px; cursor: pointer; font: 16px "Songti SC","SimSun","PMingLiU",serif; }
.start { border: 0; background: #b5522a; color: #fffdf8; }
.start:hover { background: #2c2a26; }
.sample { background: transparent; border: 1px solid #2c2a26; color: #2c2a26; }
.panel { margin-top: 28px; max-width: 460px; border-top: 1px solid #ddd4c4; padding-top: 16px; }
@media (max-width: 800px) {
  body { padding: 24px; }
  h1 { font-size: 48px; }
  .actions { flex-direction: column; }
  button { width: 100%; }
}


@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

</style>
</head>
<body>

<main>
  <h1>这里还没有你的东西</h1>
  <p class="lead">麻布工作室留给你的桌是空的。可以从一件自己的东西开始，也可以只看别人怎样摆。</p>
  <div class="actions">
    <button class="start" id="t007-start" type="button">开始第一件</button>
    <button class="sample" id="t007-sample" type="button">看一间样板</button>
  </div>
  <div class="panel" id="t007-sample-panel" hidden>
    <p>样板间现在有：一只未上釉的杯子，一张靠北窗的桌子。</p>
  </div>
  <p class="panel" id="t007-started" hidden>第一件已摆上桌。它还没有名字。</p>
</main>

<script>

(function () {
  document.getElementById("t007-sample").addEventListener("click", function () {
    document.getElementById("t007-sample-panel").hidden = false;
  });
  document.getElementById("t007-start").addEventListener("click", function () {
    document.getElementById("t007-started").hidden = false;
  });
})();

</script>
</body>
</html>
