<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>铜钱袋</title>
<style>

* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #d7c4a3; font-family: system-ui,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
.phone { width: 390px; height: 844px; overflow: auto; position: relative; }
@media (max-width: 800px) {
  body { display: block; background: #d7c4a3; }
  .phone { width: 100%; min-height: 100vh; height: auto; }
}

.phone { background: #f4f7f4; color: #1c2822; display: flex; flex-direction: column; }
#t033-home, #t033-sub { flex: 1 1 auto; }
.hero { height: 220px; background: #14352c; color: #f4f7f4; padding: 28px 24px; }
.hero b { display: block; color: #e6c27a; font-size: 48px; line-height: 1; margin: 8px 0 16px; }
.pair { display: flex; gap: 8px; }
.pair button { height: 40px; border-radius: 12px; border: 0; padding: 0 16px; cursor: pointer; }
.out { background: #e6c27a; color: #14352c; }
.in { background: transparent; color: #e6c27a; border: 1px solid #e6c27a; }
.tx { height: 64px; display: flex; justify-content: space-between; align-items: center; padding: 0 24px; border-bottom: 1px solid #e1ebe4; background: #f4f7f4; }
.tx small { display: block; color: #6d7c74; }
.tabs { position: sticky; bottom: 0; height: 64px; display: grid; grid-template-columns: repeat(4, 1fr); background: #14352c; }
.tabs button { border: 0; background: transparent; color: #f4f7f4; cursor: pointer; }
.tabs button[aria-current="page"] { color: #e6c27a; }
.sub { padding: 24px; }



@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

</style>
</head>
<body>

<div class="phone">
  <div id="t033-home">
    <header class="hero">
      <span>铜钱袋</span>
      <b>128.50</b>
      <div class="pair">
        <button class="out" id="t033-out" type="button">转出</button>
        <button class="in" id="t033-in" type="button">收款</button>
      </div>
    </header>
    <div class="tx"><div>林夏<small>昨夜</small></div><span>-20</span></div>
    <div class="tx"><div>窑口<small>今日</small></div><span>+46</span></div>
    <div class="tx"><div>夜谈<small>今日</small></div><span>-12</span></div>
  </div>
  <div class="sub" id="t033-sub" hidden></div>
  <nav class="tabs">
    <button type="button" data-tab="home" aria-current="page">首页</button>
    <button type="button" data-tab="out">转出</button>
    <button type="button" data-tab="in">收款</button>
    <button type="button" data-tab="me">我的</button>
  </nav>
</div>

<script>

(function () {
  var home = document.getElementById("t033-home");
  var sub = document.getElementById("t033-sub");
  var copy = { out: "转出将进入收款人选择。余额仍是 128.50。", in: "收款码给林夏即可。入账记在流水最上。", me: "许棠 · 窑口北架" };
  function show(tab) {
    document.querySelectorAll(".tabs button").forEach(function (button) {
      button.setAttribute("aria-current", button.getAttribute("data-tab") === tab ? "page" : "false");
    });
    var onHome = tab === "home";
    home.hidden = !onHome;
    sub.hidden = onHome;
    if (!onHome) sub.textContent = copy[tab];
  }
  document.querySelector(".tabs").addEventListener("click", function (event) {
    var button = event.target.closest("button");
    if (button) show(button.getAttribute("data-tab"));
  });
  document.getElementById("t033-out").addEventListener("click", function () { show("out"); });
  document.getElementById("t033-in").addEventListener("click", function () { show("in"); });
})();

</script>
</body>
</html>
