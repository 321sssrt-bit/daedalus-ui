<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>闸口回执</title>
<style>

* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #d9eadf; font-family: system-ui,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
.phone { width: 390px; height: 844px; overflow: auto; position: relative; }
@media (max-width: 800px) {
  body { display: block; background: #d9eadf; }
  .phone { width: 100%; min-height: 100vh; height: auto; }
}

.phone { background: #f4fbf7; color: #143028; display: grid; place-items: center; padding: 20px; }
.ticket { width: 320px; max-width: 100%; background: #fbfffc; border-radius: 18px; padding: 22px; }
h1 { font-size: 28px; margin: 0; color: #1f7a4d; }
.lead { color: #5e7a6c; }
.rule { border-top: 1px dashed #1f7a4d; margin: 14px 0; }
.code { font-size: 20px; margin: 8px 0; }
.more { border: 0; background: transparent; color: #1f7a4d; cursor: pointer; padding: 0; }
.detail { background: #e7f5ee; border-radius: 12px; padding: 12px; margin-top: 10px; }
.done { width: 100%; height: 48px; border: 0; border-radius: 12px; background: #1f7a4d; color: #fbfffc; cursor: pointer; margin-top: 12px; }



@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

</style>
</head>
<body>

<div class="phone">
  <article class="ticket">
    <h1>闸口已放开</h1>
    <p class="lead">这张回执留给今夜。</p>
    <p class="code">HZ-闸-19</p>
    <p>时间 · 亥时</p>
    <div class="rule"></div>
    <button class="more" id="t039-more" type="button">展开细节</button>
    <div class="detail" id="t039-detail" hidden>席位北侧第六。入口左栈桥。帖子字样仍是夜航。</div>
    <button class="done" id="t039-done" type="button">完成</button>
    <p id="t039-note"></p>
  </article>
</div>

<script>

(function () {
  document.getElementById("t039-more").addEventListener("click", function () {
    var detail = document.getElementById("t039-detail");
    detail.hidden = !detail.hidden;
    this.textContent = detail.hidden ? "展开细节" : "收起细节";
  });
  document.getElementById("t039-done").addEventListener("click", function () {
    document.getElementById("t039-note").textContent = "回执已收好。";
  });
})();

</script>
</body>
</html>
