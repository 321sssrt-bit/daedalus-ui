<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>港务申请</title>
<style>

* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: #e7eef2; color: #102028; font: 15px/1.5 system-ui,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
.form { min-height: 100vh; display: grid; grid-template-columns: 220px 1fr; }
nav { padding: 32px 20px; }
nav a { display: flex; align-items: center; height: 44px; color: #5d6e78; text-decoration: none; }
nav a:focus { color: #0e4d6c; outline: none; }
main { padding: 32px; max-width: 720px; }
section { background: #ffffff; border-radius: 12px; padding: 18px; margin-bottom: 28px; border: 1px solid #d5e0e6; }
h1 { margin: 0 0 16px; font-size: 32px; }
h2 { margin: 0 0 12px; font-size: 18px; }
label { display: block; margin-bottom: 12px; color: #5d6e78; }
.need { color: #a33b32; }
input { width: 100%; height: 44px; border-radius: 8px; border: 1px solid #d5e0e6; padding: 0 12px; font: 15px system-ui,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
input.bad { border-color: #a33b32; }
.actions { display: flex; gap: 8px; }
.draft { height: 44px; background: #ffffff; border: 1px solid #0e4d6c; color: #0e4d6c; padding: 0 16px; cursor: pointer; }
.submit { height: 44px; border: 0; background: #0e4d6c; color: #ffffff; padding: 0 16px; cursor: pointer; }
@media (max-width: 800px) {
  .form { grid-template-columns: 1fr; }
  nav { display: flex; gap: 12px; padding: 12px 16px; }
  main { padding: 16px; }
}


@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

</style>
</head>
<body>

<div class="form">
  <nav>
    <a href="#t028-ship-sec">船</a>
    <a href="#t028-cargo-sec">货</a>
    <a href="#t028-contact-sec">联系</a>
  </nav>
  <main>
    <h1>港务申请</h1>
    <form id="t028-form">
      <section id="t028-ship-sec"><h2>船</h2><label>船名 <span class="need">必填</span><input id="t028-ship"></label></section>
      <section id="t028-cargo-sec"><h2>货</h2><label>货种<input id="t028-cargo" placeholder="例如 春茶"></label></section>
      <section id="t028-contact-sec"><h2>联系</h2><label>值班手机<input id="t028-phone"></label></section>
      <div class="actions">
        <button class="draft" id="t028-draft" type="button">保存草稿</button>
        <button class="submit" id="t028-submit" type="submit">提交</button>
      </div>
      <p id="t028-note"></p>
    </form>
  </main>
</div>

<script>

(function () {
  var ship = document.getElementById("t028-ship");
  document.getElementById("t028-draft").addEventListener("click", function () {
    document.getElementById("t028-note").textContent = "草稿留在这页，船名仍是「" + ship.value + "」。";
  });
  document.getElementById("t028-form").addEventListener("submit", function (event) {
    event.preventDefault();
    var bad = !ship.value.trim();
    ship.classList.toggle("bad", bad);
    document.getElementById("t028-note").textContent = bad ? "船名还空着。" : "申请已交给港务。";
  });
})();

</script>
</body>
</html>
