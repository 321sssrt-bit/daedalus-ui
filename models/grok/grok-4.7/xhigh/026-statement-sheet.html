<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>对账单</title>
<style>

* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: #f7f6f2; color: #172033; font: 14px/1.5 system-ui,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; padding: 32px 16px; }
.sheet { width: 880px; max-width: 100%; margin: 0 auto; }
.plan { height: 120px; border-radius: 12px; background: #172033; color: #f7f6f2; padding: 20px; display: flex; justify-content: space-between; align-items: center; }
.table-wrap { margin-top: 20px; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 640px; }
th { text-align: left; color: #667084; font-size: 12px; font-weight: 500; height: 36px; }
td { height: 52px; border-top: 1px solid #e3e0d8; }
.invoice { border: 0; background: transparent; color: #2f6f62; cursor: pointer; }
.change { margin-top: 16px; height: 40px; border-radius: 8px; border: 1px solid #2f6f62; background: transparent; color: #2f6f62; padding: 0 14px; cursor: pointer; }
.ways button { margin-right: 8px; height: 36px; }
@media (max-width: 800px) { body { padding: 16px; } }


@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

</style>
</head>
<body>

<main class="sheet">
  <h1>对账单</h1>
  <section class="plan"><div><div>当前方案</div><strong>听一年</strong></div><div>280 / 年</div></section>
  <div class="table-wrap"><table>
    <thead><tr><th>日期</th><th>事项</th><th>金额</th><th>票据</th></tr></thead>
    <tbody id="t026-rows">
      <tr><td>03-02</td><td>三月样带</td><td>280</td><td><button class="invoice" type="button">发票</button></td></tr>
      <tr><td>03-18</td><td>夜谈席</td><td>0</td><td><button class="invoice" type="button">发票</button></td></tr>
      <tr><td>04-09</td><td>试釉</td><td>36</td><td><button class="invoice" type="button">发票</button></td></tr>
      <tr><td>05-01</td><td>季度对账</td><td>0</td><td><button class="invoice" type="button">发票</button></td></tr>
    </tbody>
  </table></div>
  <button class="change" id="t026-pay" type="button">更换支付方式</button>
  <div class="ways" id="t026-ways" hidden>
    <button type="button" id="t026-cash">柜面现金</button>
    <button type="button" id="t026-month">登记月结</button>
    <p id="t026-now">当前：登记月结</p>
  </div>
</main>

<script>

(function () {
  document.getElementById("t026-rows").addEventListener("click", function (event) {
    var button = event.target.closest("button");
    if (!button) return;
    button.textContent = "已开";
  });
  document.getElementById("t026-pay").addEventListener("click", function () {
    document.getElementById("t026-ways").hidden = false;
  });
  document.getElementById("t026-cash").addEventListener("click", function () {
    document.getElementById("t026-now").textContent = "当前：柜面现金";
  });
  document.getElementById("t026-month").addEventListener("click", function () {
    document.getElementById("t026-now").textContent = "当前：登记月结";
  });
})();

</script>
</body>
</html>
