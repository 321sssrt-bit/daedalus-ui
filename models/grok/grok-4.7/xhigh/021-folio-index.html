<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>折帖</title>
<style>

* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: #f3efe6; color: #1d1a16; font: 16px/1.6 "Songti SC","SimSun","PMingLiU",serif; }
.spread { min-height: 100vh; display: grid; grid-template-columns: 58% 42%; }
h1 { font-size: 48px; margin: 28px; }
.row { width: 100%; height: 76px; border: 0; border-bottom: 1px solid #d9d1c3; background: transparent; display: flex; justify-content: space-between; align-items: center; padding: 0 28px; cursor: pointer; font: 22px "Songti SC","SimSun","PMingLiU",serif; color: #1d1a16; }
.row small { color: #6e675c; font-size: 13px; }
.row[aria-current="true"] { color: #a3472d; }
.summary { background: #1f2a24; color: #f3efe6; padding: 40px; }
@media (max-width: 800px) {
  .spread { grid-template-columns: 1fr; }
  .row { height: 64px; padding: 0 16px; font-size: 18px; }
}


@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

</style>
</head>
<body>

<div class="spread">
  <section>
    <h1>折帖</h1>
    <div id="t021-list">
      <button class="row" type="button" data-author="账房" data-text="潮声账房只在夜潮前开门，柜钥不外借。">潮声<small>账房</small></button>
      <button class="row" type="button" data-author="许棠" data-text="这一窑的青釉偏冷，试片留在北架。">窑记<small>许棠</small></button>
      <button class="row" type="button" data-author="周北" data-text="夜航帖改到亥时，旧帖仍能进门。">夜航<small>周北</small></button>
      <button class="row" type="button" data-author="陈禾" data-text="秋分夜谈留了六个席，记在九月二十二。">节气<small>陈禾</small></button>
      <button class="row" type="button" data-author="霜询" data-text="第二乐章的样带只保留到天亮。">样带<small>霜询</small></button>
    </div>
  </section>
  <aside class="summary" id="t021-summary"><p>先点一篇。</p><h2>摘要还空着</h2></aside>
</div>

<script>

(function () {
  document.getElementById("t021-list").addEventListener("click", function (event) {
    var button = event.target.closest("button");
    if (!button) return;
    document.querySelectorAll(".row").forEach(function (item) { item.setAttribute("aria-current", "false"); });
    button.setAttribute("aria-current", "true");
    document.getElementById("t021-summary").innerHTML = "<p>" + button.getAttribute("data-author") + "</p><h2>" + button.childNodes[0].textContent + "</h2><p>" + button.getAttribute("data-text") + "</p>";
  });
})();

</script>
</body>
</html>
