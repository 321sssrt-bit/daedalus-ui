<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>碳素笔记</title>
<style>

* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #202428; font-family: system-ui,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
.phone { width: 390px; height: 844px; overflow: auto; position: relative; }
@media (max-width: 800px) {
  body { display: block; background: #202428; }
  .phone { width: 100%; min-height: 100vh; height: auto; }
}

.phone { background: #15181b; color: #f2f4f3; display: flex; flex-direction: column; }
.top { height: 48px; display: flex; align-items: center; padding: 0 16px; color: #8b9490; border-bottom: 1px solid #2c3338; }
input, textarea { width: 100%; border: 0; background: transparent; color: #f2f4f3; font-family: system-ui,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
input { height: 64px; font-size: 28px; padding: 0 16px; }
textarea { flex: 1; min-height: 360px; font-size: 16px; line-height: 1.6; padding: 12px 16px; resize: none; }
.dock { height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; border-top: 1px solid #2c3338; }
.count { color: #8b9490; font-size: 12px; }
button { height: 36px; border-radius: 8px; padding: 0 12px; cursor: pointer; }
.draft { background: transparent; color: #f2f4f3; border: 1px solid #8b9490; }
.publish { border: 0; background: #d6ff4a; color: #15181b; }



@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

</style>
</head>
<body>

<div class="phone">
  <div class="top">碳素笔记</div>
  <input id="t036-title" placeholder="标题">
  <textarea id="t036-body" placeholder="正文"></textarea>
  <div class="dock">
    <span class="count" id="t036-count">0 字</span>
    <div>
      <button class="draft" id="t036-draft" type="button">存草稿</button>
      <button class="publish" id="t036-publish" type="button">发布</button>
    </div>
  </div>
  <p id="t036-note" style="padding:0 16px"></p>
</div>

<script>

(function () {
  var body = document.getElementById("t036-body");
  var title = document.getElementById("t036-title");
  body.addEventListener("input", function () {
    document.getElementById("t036-count").textContent = body.value.length + " 字";
  });
  document.getElementById("t036-draft").addEventListener("click", function () {
    document.getElementById("t036-note").textContent = "草稿还在这页。";
  });
  document.getElementById("t036-publish").addEventListener("click", function () {
    var note = document.getElementById("t036-note");
    if (!title.value.trim() || !body.value.trim()) note.textContent = "标题和正文都要有。";
    else note.textContent = "已送到折帖。";
  });
})();

</script>
</body>
</html>
