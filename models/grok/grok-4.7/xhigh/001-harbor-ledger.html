<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>潮声账房 · 登录</title>
<style>

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100vh; }
body { background: #10242b; color: #1c1914; font: 16px/1.5 system-ui,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
.app { min-height: 100vh; display: grid; grid-template-columns: 46% 54%; }
.brand { padding: 64px 56px; color: #f4efe4; background: #10242b; border-right: 1px solid #c4552a; display: flex; flex-direction: column; justify-content: space-between; }
.brand p { margin: 0; max-width: 280px; color: #f4efe4; }
.brand h1 { margin: 0; font-family: "Songti SC","SimSun","PMingLiU",serif; font-size: 92px; line-height: 0.9; letter-spacing: -0.04em; }
.brand small { letter-spacing: 0.28em; font-size: 13px; }
.panel { background: #f3efe4; padding: 72px 80px; display: flex; align-items: center; }
form { width: min(420px, 100%); }
h2 { font-family: "Songti SC","SimSun","PMingLiU",serif; font-size: 28px; margin: 0 0 8px; }
.lead { color: #6e675c; margin: 0 0 28px; }
.row { margin-bottom: 18px; }
label { display: block; font-size: 13px; letter-spacing: 0.08em; color: #6e675c; margin-bottom: 8px; }
input { width: 100%; height: 48px; border: 1px solid #1c1914; background: #fffaf1; color: #1c1914; padding: 0 14px; border-radius: 0; font: 16px/1.5 system-ui,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
input:focus { outline: 3px solid #c4552a; outline-offset: 2px; }
.passline { display: flex; gap: 8px; }
.passline input { flex: 1; }
.toggle { width: 72px; height: 48px; border: 1px solid #1c1914; background: #fffaf1; cursor: pointer; }
.toggle:hover { background: #f4efe4; }
.primary { height: 52px; width: 100%; border: 0; background: #c4552a; color: #fffaf1; letter-spacing: 0.12em; cursor: pointer; font-size: 16px; }
.primary:hover { background: #a3431f; }
.primary:disabled { background: #6e675c; cursor: not-allowed; }
.ghost { margin-top: 14px; background: transparent; border: 0; color: #1c1914; text-decoration: underline; cursor: pointer; font-size: 14px; padding: 0; }
.error { color: #8f2d2d; min-height: 22px; font-size: 14px; }
.hint { border-top: 1px solid #d9d0c0; margin-top: 28px; padding-top: 16px; color: #1c1914; }
@media (max-width: 800px) {
  .app { grid-template-columns: 1fr; }
  .brand { min-height: 200px; padding: 32px 24px; }
  .brand h1 { font-size: 64px; }
  .panel { padding: 28px 24px; }
}


@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

</style>
</head>
<body>

<main class="app">
  <section class="brand">
    <small>第三码头 · 日账</small>
    <h1>潮声<br>账房</h1>
    <p>夜潮前把当日柜账打开。账号是柜号，钥是你离开时亲手封上的那一串。</p>
  </section>
  <section class="panel">
    <form id="t001-form">
      <h2>进入今日账册</h2>
      <p class="lead">只接待已经建柜的人。</p>
      <div class="row">
        <label for="t001-account">账房账号</label>
        <input id="t001-account" name="account" autocomplete="username" placeholder="例如 柜-14">
      </div>
      <div class="row">
        <label for="t001-pass">柜钥</label>
        <div class="passline">
          <input id="t001-pass" name="password" type="password" autocomplete="current-password">
          <button class="toggle" id="t001-toggle" type="button">显示</button>
        </div>
      </div>
      <p class="error" id="t001-error" hidden>先把账号和柜钥写全。</p>
      <button class="primary" id="t001-enter" type="submit">进入账房</button>
      <button class="ghost" id="t001-forgot" type="button">忘记柜钥</button>
      <div class="hint" id="t001-hint" hidden>
        <p>柜号会发到登记手机；急用可走纸质回执，向值班账房要临时封条。</p>
      </div>
      <p class="hint" id="t001-done" hidden>账册已打开。今日未结 6 笔。</p>
    </form>
  </section>
</main>

<script>

(function () {
  var form = document.getElementById("t001-form");
  var pass = document.getElementById("t001-pass");
  document.getElementById("t001-toggle").addEventListener("click", function () {
    var showing = pass.type === "text";
    pass.type = showing ? "password" : "text";
    this.textContent = showing ? "显示" : "隐藏";
  });
  document.getElementById("t001-forgot").addEventListener("click", function () {
    document.getElementById("t001-hint").hidden = false;
  });
  form.addEventListener("submit", function (event) {
    event.preventDefault();
    var account = document.getElementById("t001-account").value.trim();
    var secret = pass.value;
    var error = document.getElementById("t001-error");
    if (!account || !secret) {
      error.hidden = false;
      return;
    }
    error.hidden = true;
    document.getElementById("t001-done").hidden = false;
  });
})();

</script>
</body>
</html>
