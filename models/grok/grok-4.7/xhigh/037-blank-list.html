<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>空清单</title>
<style>

* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #d5e4ea; font-family: system-ui,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
.phone { width: 390px; height: 844px; overflow: auto; position: relative; }
@media (max-width: 800px) {
  body { display: block; background: #d5e4ea; }
  .phone { width: 100%; min-height: 100vh; height: auto; }
}

.phone { background: #f3fafb; color: #14323c; display: flex; flex-direction: column; }
.empty { flex: 1; display: grid; place-items: center; text-align: center; padding: 24px; }
h1 { font-size: 32px; line-height: 1.25; margin: 0; }
p { color: #6d838c; }
button.create { height: 48px; border: 0; border-radius: 999px; background: #0f7a78; color: #f3fafb; padding: 0 18px; cursor: pointer; }
.tabs { height: 58px; display: grid; grid-template-columns: repeat(3, 1fr); background: #0f3a4a; }
.tabs button { border: 0; background: transparent; color: #f3fafb; }
.tabs button[aria-current="page"] { color: #9be7e2; }
.item { padding: 20px; }



@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

</style>
</head>
<body>

<div class="phone">
  <div class="empty" id="t037-empty">
    <div>
      <h1>清单上还没有一条</h1>
      <p>潮汐清单不替你预写。</p>
      <button class="create" id="t037-create" type="button">去写第一条</button>
    </div>
  </div>
  <div class="item" id="t037-item" hidden>记下白露的温度</div>
  <nav class="tabs" id="t037-tabs">
    <button type="button" aria-current="page">清单</button>
    <button type="button">日程</button>
    <button type="button">我</button>
  </nav>
</div>

<script>

(function () {
  document.getElementById("t037-create").addEventListener("click", function () {
    document.getElementById("t037-empty").hidden = true;
    document.getElementById("t037-item").hidden = false;
  });
  document.getElementById("t037-tabs").addEventListener("click", function (event) {
    var button = event.target.closest("button");
    if (!button) return;
    document.querySelectorAll("#t037-tabs button").forEach(function (item) {
      item.setAttribute("aria-current", item === button ? "page" : "false");
    });
  });
})();

</script>
</body>
</html>
