<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>听潮</title>
<style>

* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: #0f1c2e; color: #f7f4ef; font: 15px/1.5 "Songti SC","SimSun","PMingLiU",serif; padding: 40px; }
h1 { font-size: 42px; margin: 0 0 24px; }
.tiers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; align-items: start; }
.tier { background: #16324f; border-radius: 20px; padding: 24px; min-height: 360px; display: flex; flex-direction: column; }
.tier.rec { transform: translateY(-16px); box-shadow: inset 0 6px 0 #e7b15a; }
.tier b.price { color: #e7b15a; font-size: 28px; }
ul { padding-left: 18px; color: #8ea0b8; flex: 1; }
button { height: 44px; border-radius: 999px; cursor: pointer; font: 15px "Songti SC","SimSun","PMingLiU",serif; }
.rec button { border: 0; background: #e7b15a; color: #0f1c2e; }
.tier:not(.rec) button { background: transparent; color: #dfe7f2; border: 1px solid #dfe7f2; }
#t020-choice { min-height: 28px; }
@media (max-width: 800px) {
  body { padding: 16px; }
  .tiers { grid-template-columns: 1fr; }
  .tier.rec { transform: none; }
}


@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

</style>
</head>
<body>

<main>
  <p>听潮录音室</p>
  <h1>选一档听下去</h1>
  <div class="tiers">
    <article class="tier"><h2>听一季</h2><b class="price">90</b><ul><li>当季样带</li><li>一场夜谈旁听</li><li>不保留席位</li></ul><button type="button" data-plan="听一季">购买</button></article>
    <article class="tier rec"><h2>听一年</h2><p>推荐</p><b class="price">280</b><ul><li>四季样带</li><li>夜谈固定席</li><li>可改期一次</li></ul><button type="button" data-plan="听一年">购买</button></article>
    <article class="tier"><h2>工作室</h2><b class="price">面议</b><ul><li>白天空档</li><li>自带乐手</li><li>单独出入口</li></ul><button type="button" data-plan="工作室">联系</button></article>
  </div>
  <p id="t020-choice"></p>
</main>

<script>

(function () {
  document.querySelector(".tiers").addEventListener("click", function (event) {
    var button = event.target.closest("button");
    if (!button) return;
    document.getElementById("t020-choice").textContent = "已选择" + button.getAttribute("data-plan");
  });
})();

</script>
</body>
</html>
