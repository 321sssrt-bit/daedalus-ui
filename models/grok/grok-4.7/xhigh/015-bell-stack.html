<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>更铃</title>
<style>

* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: #f6f4ee; color: #20211e; font: 15px/1.5 system-ui,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; padding: 28px 16px 48px; }
.wrap { max-width: 680px; margin: 0 auto; }
header { min-height: 72px; display: flex; align-items: center; justify-content: space-between; }
h1 { font-size: 28px; margin: 0; }
.readall { height: 36px; border: 0; border-radius: 999px; background: #3f6f54; color: #ffffff; padding: 0 16px; cursor: pointer; }
.item { width: 100%; text-align: left; min-height: 76px; border: 0; border-radius: 12px; background: #ffffff; margin-bottom: 8px; padding: 14px 16px; cursor: pointer; font: 15px system-ui,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; color: #20211e; }
.item.unread { box-shadow: inset 4px 0 0 #8d3b2f; }
.item small { display: block; color: #6f6a60; font-size: 13px; }
.item .sys { color: #3f6f54; }
.more { display: block; margin-top: 8px; }
@media (max-width: 800px) {
  body { padding: 16px; }
}


@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

</style>
</head>
<body>

<main class="wrap">
  <header>
    <h1>更铃</h1>
    <button class="readall" id="t015-read" type="button">全部标已读</button>
  </header>
  <div id="t015-list">
    <button class="item unread" type="button" data-more="潮位越过警戒线 12 厘米，北闸已派人。"><small class="sys">系统 · 刚刚</small>潮汛过线</button>
    <button class="item unread" type="button" data-more="北窑降到 980 度，这一炉可以开一条缝。"><small>设备 · 8 分钟前</small>窑温</button>
    <button class="item unread" type="button" data-more="林夏把帖子留在门房，没有进栈桥。"><small>别人 · 21 分钟前</small>夜航帖送到</button>
    <button class="item" type="button" data-more="三月对账单已放在柜面，不含新的欠款。"><small>账务 · 昨天</small>对账单到了</button>
    <button class="item unread" type="button" data-more="第二乐章的样带只保留到天亮。"><small>提醒 · 昨天</small>样带将过期</button>
  </div>
</main>

<script>

(function () {
  document.getElementById("t015-list").addEventListener("click", function (event) {
    var button = event.target.closest(".item");
    if (!button) return;
    button.classList.remove("unread");
    if (button.querySelector(".more")) return;
    var more = document.createElement("span");
    more.className = "more";
    more.textContent = button.getAttribute("data-more");
    button.appendChild(more);
  });
  document.getElementById("t015-read").addEventListener("click", function () {
    document.querySelectorAll(".item").forEach(function (item) { item.classList.remove("unread"); });
  });
})();

</script>
</body>
</html>
