<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>锥桶</title>
<style>

* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f0d2b0; font-family: system-ui,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
.phone { width: 390px; height: 844px; overflow: auto; position: relative; }
@media (max-width: 800px) {
  body { display: block; background: #f0d2b0; }
  .phone { width: 100%; min-height: 100vh; height: auto; }
}

.phone { background: #fff6ee; color: #3a2416; display: grid; place-items: center; text-align: center; padding: 24px; }
.mark { width: 64px; height: 64px; margin: 0 auto 12px; background: #e07020; clip-path: polygon(50% 0, 100% 100%, 0 100%); }
h1 { font-size: 30px; line-height: 1.25; margin: 0; }
.code { color: #8a6248; }
button { width: 300px; max-width: 100%; height: 48px; border-radius: 12px; cursor: pointer; }
.retry { border: 0; background: #e07020; color: #fff6ee; }
.home { margin-top: 8px; height: 44px; border: 0; background: transparent; color: #3a2416; }



@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

</style>
</head>
<body>

<div class="phone">
  <div>
    <div class="mark"></div>
    <h1>这条栈桥暂时走不通</h1>
    <p>夜航门这边的路断了一小段，不是你的帖子失效。</p>
    <p class="code">编号 HZ-2044</p>
    <button class="retry" id="t038-retry" type="button">重试</button>
    <button class="home" id="t038-home" type="button">回首页</button>
    <p id="t038-note"></p>
  </div>
</div>

<script>

(function () {
  document.getElementById("t038-retry").addEventListener("click", function () {
    document.getElementById("t038-note").textContent = "已重新接通，可以从栈桥进去。";
  });
  document.getElementById("t038-home").addEventListener("click", function () {
    document.getElementById("t038-note").textContent = "回到铜钱袋首页。";
  });
})();

</script>
</body>
</html>
