<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>许棠</title>
<style>

* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: #f4efe6; color: #241c16; font: 15px/1.5 "Songti SC","SimSun","PMingLiU",serif; }
.mast { min-height: 280px; background: #243044; color: #f4efe6; display: flex; align-items: end; padding: 36px; }
h1 { font-size: 56px; margin: 0; }
.role { color: #8d8478; margin: 8px 0 0; font-size: 18px; }
.actions { display: flex; gap: 8px; margin-top: 16px; }
button { height: 40px; border-radius: 999px; padding: 0 16px; cursor: pointer; font: 14px "Songti SC","SimSun","PMingLiU",serif; }
.follow { border: 0; background: #d06a45; color: #f4efe6; }
.follow.on { background: transparent; color: #f4efe6; border: 1px solid #f4efe6; }
.contact { background: transparent; color: #f4efe6; border: 1px solid #8d8478; }
.works { padding: 28px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.work { height: 140px; background: #e7dfd2; padding: 16px; }
.mail { padding: 0 28px 28px; }
@media (max-width: 800px) {
  .mast { min-height: 220px; }
  h1 { font-size: 40px; }
  .works { grid-template-columns: 1fr; padding: 16px; }
}


@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

</style>
</head>
<body>

<header class="mast">
  <div>
    <h1>许棠</h1>
    <p class="role">给器物定釉的人</p>
    <div class="actions">
      <button class="follow" id="t022-follow" type="button">关注</button>
      <button class="contact" id="t022-contact" type="button">联系</button>
    </div>
  </div>
</header>
<section class="works">
  <article class="work">青釉试片</article>
  <article class="work">北窗灯</article>
  <article class="work">冷窑笔记</article>
</section>
<p class="mail" id="t022-mail" hidden>信可寄到窑口北架，许棠亲收。</p>

<script>

(function () {
  document.getElementById("t022-follow").addEventListener("click", function () {
    var on = this.classList.toggle("on");
    this.textContent = on ? "已关注" : "关注";
  });
  document.getElementById("t022-contact").addEventListener("click", function () {
    document.getElementById("t022-mail").hidden = false;
  });
})();

</script>
</body>
</html>
