<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>候场</title>
<style>

* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #d9d6ea; font-family: system-ui,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
.phone { width: 390px; height: 844px; overflow: auto; position: relative; }
@media (max-width: 800px) {
  body { display: block; background: #d9d6ea; }
  .phone { width: 100%; min-height: 100vh; height: auto; }
}

.phone { background: #f7f6fb; color: #241f33; padding: 28px 20px; }
h1 { font-size: 28px; margin: 0 0 8px; }
.eta { background: #ece9f6; border-radius: 16px; padding: 12px 14px; }
.step { height: 72px; display: flex; align-items: center; gap: 12px; color: #7e7894; }
.step i { width: 12px; height: 12px; border-radius: 99px; background: #d9d6ea; display: block; }
.step.now { color: #3d3a8c; box-shadow: inset 8px 0 0 #3d3a8c; }
.step.now i { background: #3d3a8c; animation: pulse 1.2s ease infinite; }
@keyframes pulse { 50% { transform: scale(1.4); } }
.aside, .cancel { width: 100%; cursor: pointer; }
.aside { height: 48px; border: 0; border-radius: 12px; background: #3d3a8c; color: #f7f6fb; margin-top: 24px; }
.cancel { height: 44px; margin-top: 8px; border: 0; background: transparent; color: #241f33; }



@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

</style>
</head>
<body>

<div class="phone">
  <p>候场</p>
  <h1>帖子已经收下</h1>
  <div class="eta">预计时间 · 大约一刻钟</div>
  <div class="step"><i></i>收帖</div>
  <div class="step now"><i></i>对闸</div>
  <div class="step"><i></i>进栈桥</div>
  <button class="aside" id="t040-aside" type="button">放到一边</button>
  <button class="cancel" id="t040-cancel" type="button">取消等候</button>
  <p id="t040-note"></p>
</div>

<script>

(function () {
  document.getElementById("t040-aside").addEventListener("click", function () {
    document.getElementById("t040-note").textContent = "已收进后台，闸口好了再叫你。";
  });
  document.getElementById("t040-cancel").addEventListener("click", function () {
    document.getElementById("t040-note").textContent = "等候已取消，帖子退回门房。";
  });
})();

</script>
</body>
</html>
