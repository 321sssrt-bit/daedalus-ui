<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>回执纸</title>
<style>

* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #efe6d4; color: #243044; font: 16px/1.6 "Songti SC","SimSun","PMingLiU",serif; padding: 32px; }
.sheet { width: 560px; max-width: 100%; background: #fbf7ef; padding: 48px 48px 48px 96px; box-shadow: inset 8px 0 0 #e15b4a; }
h1 { font-size: 36px; line-height: 1.2; margin: 0 0 8px; }
.lead { color: #6d6458; margin: 0 0 24px; }
label { display: block; font-size: 14px; margin-bottom: 8px; }
input { width: 100%; height: 48px; border: 0; border-bottom: 1px solid #243044; background: transparent; color: #243044; font: 16px/1.5 "Songti SC","SimSun","PMingLiU",serif; }
input:focus { outline: none; border-bottom: 2px solid #e15b4a; }
.row { display: flex; gap: 16px; align-items: center; margin-top: 20px; }
button.primary { height: 48px; min-width: 160px; border: 0; background: #243044; color: #fbf7ef; cursor: pointer; }
button.primary:hover { background: #e15b4a; }
.link { background: none; border: 0; color: #243044; text-decoration: underline; cursor: pointer; font: 15px "Songti SC","SimSun","PMingLiU",serif; }
.wait { margin-top: 20px; padding: 16px; background: #efe6d4; }
.backnote { margin-top: 12px; }
@media (max-width: 800px) {
  .sheet { width: 100%; padding: 28px 20px 28px 20px; box-shadow: inset 0 8px 0 #e15b4a; }
}


@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

</style>
</head>
<body>

<main class="sheet">
  <h1>把入口寄回来</h1>
  <p class="lead">人进不去时，用当初留下的联系方式要一张回执。</p>
  <form id="t005-form">
    <label for="t005-contact">登记过的手机或信箱</label>
    <input id="t005-contact" placeholder="手机或信箱">
    <div class="row">
      <button class="primary" id="t005-send" type="submit">发出回执</button>
      <button class="link" id="t005-back" type="button">回到登录</button>
    </div>
    <p class="backnote" id="t005-backnote" hidden>登录门仍开着，回执送达前先别反复要。</p>
  </form>
  <div class="wait" id="t005-wait" hidden>
    <strong>回执已出门</strong>
    <p>回执已出门，大约一刻钟内看手机。这段时间入口暂时不再重复发送。</p>
    <button class="link" id="t005-back2" type="button">回到登录</button>
  </div>
</main>

<script>

(function () {
  function showBack() { document.getElementById("t005-backnote").hidden = false; }
  document.getElementById("t005-back").addEventListener("click", showBack);
  document.getElementById("t005-back2").addEventListener("click", showBack);
  document.getElementById("t005-form").addEventListener("submit", function (event) {
    event.preventDefault();
    if (!document.getElementById("t005-contact").value.trim()) return;
    document.getElementById("t005-form").hidden = true;
    document.getElementById("t005-wait").hidden = false;
  });
})();

</script>
</body>
</html>
