<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>尘册</title>
<style>

* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: #e6d3b4; color: #2b2118; font: 16px/1.6 "Songti SC","SimSun","PMingLiU",serif; }
.bar { min-height: 72px; background: #4a3728; color: #f0d7a2; display: flex; align-items: center; gap: 16px; padding: 0 32px; }
.bar span { color: #e6d3b4; }
.empty { padding: 12vh 32px 0; max-width: 760px; }
h1 { font-size: 48px; line-height: 1.15; margin: 0; }
.lead { color: #7d6a58; }
.ideas { display: flex; gap: 16px; margin-top: 28px; }
.ideas button { width: 240px; height: 120px; text-align: left; padding: 16px; border: 0; background: #f8f1e4; color: #2b2118; box-shadow: inset 8px 0 0 #4a3728; cursor: pointer; font: 18px "Songti SC","SimSun","PMingLiU",serif; }
.ideas button:hover { background: #fffaf3; }
@media (max-width: 800px) {
  .bar { flex-wrap: wrap; height: auto; padding: 16px; }
  .ideas { flex-direction: column; }
  .ideas button { width: 100%; }
  h1 { font-size: 36px; }
}


@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

</style>
</head>
<body>

<header class="bar">
  <span>尘册检索</span>
  <strong id="t014-query">盐田旧档</strong>
</header>
<main class="empty">
  <h1>尘册里没有这一夹</h1>
  <p class="lead">架子从甲到丁都翻过，没有和这个词对上的卷宗。</p>
  <div class="ideas">
    <button type="button" id="t014-a" data-q="盐田 1998">改找盐田 1998</button>
    <button type="button" id="t014-b" data-q="旧档目录">改找旧档目录</button>
  </div>
</main>

<script>

(function () {
  document.querySelector(".ideas").addEventListener("click", function (event) {
    var button = event.target.closest("button");
    if (!button) return;
    document.getElementById("t014-query").textContent = button.getAttribute("data-q");
  });
})();

</script>
</body>
</html>
