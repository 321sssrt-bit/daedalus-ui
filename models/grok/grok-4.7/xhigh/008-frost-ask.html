<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>霜询</title>
<style>

* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: #d5e3ea; color: #16303a; font: 15px/1.6 system-ui,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
.ghost { padding: 48px; color: #5d7580; }
.ghost h2 { font-weight: 500; }
.shade { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(22,48,58,0.18); }
.ask { width: 460px; max-width: calc(100% - 32px); background: #f8fbfc; border-radius: 20px; padding: 28px; box-shadow: 0 20px 50px rgba(22,48,58,0.16); }
h1 { font-size: 32px; line-height: 1.25; margin: 0 0 8px; }
.why { margin: 0; color: #5d7580; }
.allow { width: 100%; height: 48px; margin-top: 20px; border: 0; border-radius: 10px; background: #1f6f8b; color: #f8fbfc; cursor: pointer; font-size: 16px; }
.allow:hover { background: #16303a; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.pair button { height: 44px; border-radius: 10px; border: 1px solid #c5d5dc; background: #f8fbfc; color: #16303a; cursor: pointer; }
.result { min-height: 24px; margin: 12px 0 0; }
@media (max-width: 800px) {
  .ghost { display: none; }
}


@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

</style>
</head>
<body>

<div class="ghost">
  <h2>今日排练稿</h2>
  <p>第二乐章还停在第 40 小节。权限决定之前，收录不会开始。</p>
</div>
<div class="shade">
  <section class="ask">
    <p>霜询要一项能力</p>
    <h1>使用麦克风</h1>
    <p class="why">要把这一遍排练收进今日样带。不收录就无法回听走音的地方。</p>
    <button class="allow" id="t008-allow" type="button">允许</button>
    <div class="pair">
      <button id="t008-once" type="button">仅此一次</button>
      <button id="t008-deny" type="button">拒绝</button>
    </div>
    <p class="result" id="t008-result"></p>
  </section>
</div>

<script>

(function () {
  var result = document.getElementById("t008-result");
  document.getElementById("t008-allow").addEventListener("click", function () {
    result.textContent = "麦克风保持可用，直到你在房间里关掉。";
  });
  document.getElementById("t008-once").addEventListener("click", function () {
    result.textContent = "只收这一遍，结束后麦克风会交还。";
  });
  document.getElementById("t008-deny").addEventListener("click", function () {
    result.textContent = "这一遍不收录声音，排练稿仍可看。";
  });
})();

</script>
</body>
</html>
