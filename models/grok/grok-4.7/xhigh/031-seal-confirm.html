<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>火漆</title>
<style>

* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6f0e6; color: #241810; font: 16px/1.6 "Songti SC","SimSun","PMingLiU",serif; padding: 24px; }
.card { width: 520px; max-width: 100%; background: #fffaf3; padding: 32px; box-shadow: inset 0 10px 0 #7a1f2b; }
h1 { font-size: 36px; margin: 0 0 8px; }
.lead { color: #74685c; }
label { display: flex; gap: 8px; align-items: center; }
.actions { display: flex; gap: 12px; margin-top: 20px; }
.back { height: 48px; min-width: 180px; border: 0; background: #241810; color: #fffaf3; cursor: pointer; font: 16px "Songti SC","SimSun","PMingLiU",serif; }
.go { height: 48px; min-width: 140px; border: 0; background: #7a1f2b; color: #fffaf3; cursor: pointer; font: 16px "Songti SC","SimSun","PMingLiU",serif; }
.go:disabled { background: #c8b2b4; cursor: not-allowed; }
@media (max-width: 800px) {
  .card { width: 100%; }
  .actions { flex-direction: column; }
  .back, .go { width: 100%; }
}


@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

</style>
</head>
<body>

<main class="card">
  <p>火漆</p>
  <h1>挂出去之前</h1>
  <p class="lead">这一版会挂到折帖目录，今日不可再撤回。</p>
  <label><input id="t031-check" type="checkbox">我知道今日不能撤回</label>
  <div class="actions">
    <button class="back" id="t031-back" type="button">返回改稿</button>
    <button class="go" id="t031-confirm" type="button" disabled>确认发布</button>
  </div>
  <p id="t031-note"></p>
</main>

<script>

(function () {
  var check = document.getElementById("t031-check");
  var go = document.getElementById("t031-confirm");
  check.addEventListener("change", function () { go.disabled = !check.checked; });
  go.addEventListener("click", function () {
    document.getElementById("t031-note").textContent = "已挂到折帖目录。";
  });
  document.getElementById("t031-back").addEventListener("click", function () {
    document.getElementById("t031-note").textContent = "回到改稿，火漆还没盖。";
  });
})();

</script>
</body>
</html>
