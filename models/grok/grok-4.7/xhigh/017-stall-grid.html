<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>早市摊</title>
<style>

* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: #f6e7c1; color: #3e2c1b; font: 15px/1.4 "Songti SC","SimSun","PMingLiU",serif; padding: 28px 32px; }
header { min-height: 88px; display: flex; align-items: end; justify-content: space-between; border-bottom: 2px solid #3e2c1b; }
h1 { font-size: 40px; margin: 0; }
nav { color: #8a7158; display: flex; gap: 16px; }
.grid { margin-top: 16px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
article { height: 180px; background: #fffdf6; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; justify-content: space-between; }
article:hover { transform: translateY(-2px); }
.price { color: #c84b31; font-size: 18px; }
button { height: 32px; border-radius: 999px; border: 1px solid #3e2c1b; background: transparent; cursor: pointer; font: 13px "Songti SC","SimSun","PMingLiU",serif; }
button[aria-pressed="true"] { background: #6d8b3a; color: #fffdf6; border-color: #6d8b3a; }
@media (max-width: 800px) {
  body { padding: 16px; }
  .grid { grid-template-columns: 1fr 1fr; }
  header { flex-wrap: wrap; }
}


@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

</style>
</head>
<body>

<header>
  <h1>早市摊</h1>
  <nav><span>今日</span><span>干货</span><span>茶</span></nav>
</header>
<div class="grid" id="t017-grid"></div>

<script>

(function () {
  var goods = [["春笋", "18 / 斤"], ["腌梅", "12 / 罐"], ["新茶", "46 / 两"], ["豆腐", "4 / 块"], ["青柑", "9 / 斤"], ["蛋", "15 / 盒"]];
  var grid = document.getElementById("t017-grid");
  goods.forEach(function (item) {
    var card = document.createElement("article");
    card.innerHTML = "<div><b>" + item[0] + "</b><div class='price'>" + item[1] + "</div></div>";
    var button = document.createElement("button");
    button.type = "button";
    button.textContent = "收藏";
    button.addEventListener("click", function () {
      var on = button.getAttribute("aria-pressed") === "true";
      button.setAttribute("aria-pressed", on ? "false" : "true");
      button.textContent = on ? "收藏" : "已藏";
    });
    card.appendChild(button);
    grid.appendChild(card);
  });
})();

</script>
</body>
</html>
