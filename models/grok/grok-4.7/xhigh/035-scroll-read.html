<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>边注</title>
<style>

* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #c8c2b8; font-family: system-ui,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
.phone { width: 390px; height: 844px; overflow: auto; position: relative; }
@media (max-width: 800px) {
  body { display: block; background: #c8c2b8; }
  .phone { width: 100%; min-height: 100vh; height: auto; }
}

.phone { background: #f7f3ea; color: #221c16; }
.bar { position: sticky; top: 0; height: 56px; display: flex; align-items: center; gap: 8px; padding: 0 16px; background: #f7f3ea; border-bottom: 1px solid #e4d8c8; }
h1 { font-family: "Songti SC","SimSun","PMingLiU",serif; font-size: 32px; margin: 20px 22px 8px; }
.note { color: #7a7064; margin: 0 22px; font-size: 13px; }
.body { padding: 16px 22px 88px; font-family: "Songti SC","SimSun","PMingLiU",serif; font-size: 18px; line-height: 1.7; }
.save { position: sticky; bottom: 12px; margin: 0 22px; width: calc(100% - 44px); height: 44px; border: 0; background: #8c3d2f; color: #f7f3ea; cursor: pointer; }



@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

</style>
</head>
<body>

<div class="phone">
  <div class="bar"><span>字号</span><input id="t035-size" type="range" min="16" max="24" value="18"></div>
  <h1>冷窑笔记</h1>
  <p class="note" id="t035-note">现在是 18 像素</p>
  <p class="body" id="t035-body">窑冷下来之后才写。青釉在这个温度偏灰，试片不要急着端走。北窗的灯还没定价，先留在架上。</p>
  <button class="save" id="t035-save" type="button">收藏</button>
</div>

<script>

(function () {
  var size = document.getElementById("t035-size");
  size.addEventListener("input", function () {
    document.getElementById("t035-body").style.fontSize = size.value + "px";
    document.getElementById("t035-note").textContent = "现在是 " + size.value + " 像素";
  });
  document.getElementById("t035-save").addEventListener("click", function () {
    this.textContent = "已收进钉板";
  });
})();

</script>
</body>
</html>
