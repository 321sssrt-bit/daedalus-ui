<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>窑口 · 建档</title>
<style>

* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: repeating-linear-gradient(90deg, #e7d7c4, #e7d7c4 28px, #efe4d4 28px, #efe4d4 56px); color: #3d2a22; font: 16px/1.5 "Songti SC","SimSun","PMingLiU",serif; display: grid; place-items: center; padding: 48px; }
.card { width: 560px; max-width: 100%; background: #f7f1e8; border-radius: 28px; padding: 36px; box-shadow: 0 18px 40px rgba(61,42,34,0.12); }
h1 { font-size: 40px; line-height: 1.15; margin: 0; }
.lead { color: #8a7364; margin: 8px 0 24px; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
label { display: block; font-size: 13px; margin-bottom: 8px; color: #8a7364; }
input { width: 100%; height: 46px; border-radius: 12px; border: 1px solid #d9c6b4; background: #fffaf4; color: #3d2a22; padding: 0 12px; font: 16px/1.5 "Songti SC","SimSun","PMingLiU",serif; }
input:focus { outline: 3px solid #8a5a3a; outline-offset: 1px; }
.error { color: #6e2e1f; min-height: 24px; }
.primary { width: 100%; height: 52px; border: 0; border-radius: 999px; background: #8a5a3a; color: #f7f1e8; font-size: 18px; cursor: pointer; }
.primary:hover { background: #6e4328; }
.foot { display: flex; justify-content: space-between; align-items: center; margin-top: 22px; border-top: 1px solid #e7d7c4; padding-top: 14px; }
.link { background: none; border: 0; color: #8a5a3a; cursor: pointer; text-decoration: underline; font: 15px/1.4 "Songti SC","SimSun","PMingLiU",serif; padding: 0; }
.ok { margin: 12px 0 0; }
@media (max-width: 800px) {
  body { padding: 20px; }
  .card { width: 100%; }
  .grid { grid-template-columns: 1fr; }
}


@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

</style>
</head>
<body>

<main class="card">
  <p>窑口 · 新客建档</p>
  <h1>留下你的称呼</h1>
  <p class="lead">下一窑开火前，我们按这个名字给你留一只试釉杯。</p>
  <form id="t002-form">
    <div class="grid">
      <div>
        <label for="t002-name">称呼</label>
        <input id="t002-name" placeholder="怎么称呼你">
      </div>
      <div>
        <label for="t002-phone">手机</label>
        <input id="t002-phone" inputmode="tel" placeholder="11 位手机号">
      </div>
    </div>
    <p class="error" id="t002-error" hidden>称呼和手机都要留下。</p>
    <button class="primary" id="t002-submit" type="submit">建一份窑籍</button>
    <p class="ok" id="t002-ok" hidden>窑籍已留下，明日可来取章。</p>
  </form>
  <div class="foot">
    <span>已经在册的人不必重填。</span>
    <button class="link" id="t002-login" type="button">已经有窑籍？去登录</button>
  </div>
  <p id="t002-login-note" hidden>从登录门进入，用手机号取回窑籍。</p>
</main>

<script>

(function () {
  document.getElementById("t002-form").addEventListener("submit", function (event) {
    event.preventDefault();
    var name = document.getElementById("t002-name").value.trim();
    var phone = document.getElementById("t002-phone").value.trim();
    var bad = !name || phone.length < 11;
    document.getElementById("t002-error").hidden = !bad;
    document.getElementById("t002-ok").hidden = bad;
  });
  document.getElementById("t002-login").addEventListener("click", function () {
    document.getElementById("t002-login-note").hidden = false;
  });
})();

</script>
</body>
</html>
