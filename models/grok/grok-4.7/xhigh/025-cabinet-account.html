<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>柜格</title>
<style>

* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: #efe8dc; color: #241e18; font: 15px/1.5 system-ui,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
.cabinet { min-height: 100vh; display: grid; grid-template-columns: 420px 1fr; }
.list { padding: 28px; }
.who { height: 72px; background: #fffaf3; border-radius: 12px; display: flex; align-items: center; padding: 0 16px; margin-bottom: 22px; }
.group { margin-bottom: 22px; background: #fffaf3; border-radius: 12px; overflow: hidden; }
.group h2 { margin: 0; padding: 12px 16px 0; font-size: 12px; color: #74695c; letter-spacing: 0.08em; }
.group button { width: 100%; height: 56px; text-align: left; border: 0; border-bottom: 1px solid #e4d9c8; background: transparent; padding: 0 16px; cursor: pointer; font: 15px system-ui,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; color: #241e18; }
.detail { background: #2c3330; color: #efe8dc; padding: 36px; }
@media (max-width: 800px) {
  .cabinet { grid-template-columns: 1fr; }
}


@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

</style>
</head>
<body>

<div class="cabinet">
  <section class="list">
    <h1>柜格</h1>
    <div class="who"><div><b>许棠</b><div>窑口北架</div></div></div>
    <section class="group"><h2>资料</h2><button type="button" data-text="称呼目前是许棠，改名要等下一窑。">称呼</button></section>
    <section class="group"><h2>安全</h2><button type="button" data-text="柜钥上次更换在白露前。再换会寄回执。">柜钥</button></section>
    <section class="group"><h2>通知</h2><button type="button" data-text="窑温只在夜里响。样带过期会再提一次。">更铃</button></section>
  </section>
  <aside class="detail" id="t025-detail"><h2>这一格还关着</h2><p>点开左边任意一行。</p></aside>
</div>

<script>

(function () {
  document.querySelector(".list").addEventListener("click", function (event) {
    var button = event.target.closest("button");
    if (!button) return;
    document.getElementById("t025-detail").innerHTML = "<h2>" + button.textContent + "</h2><p>" + button.getAttribute("data-text") + "</p>";
  });
})();

</script>
</body>
</html>
