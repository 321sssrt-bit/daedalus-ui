<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>付款台</title>
<style>

* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; font: 16px/1.5 system-ui,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
.desk { min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr; }
.summary { background: #111814; color: #f4f1ea; padding: 48px; }
.summary h1 { font-size: 28px; margin: 0 0 24px; }
.row { display: flex; justify-content: space-between; color: #8b9090; margin: 8px 0; }
.amount { color: #e7c36a; font-size: 64px; line-height: 1; margin-top: 32px; }
.pay { background: #f4f1ea; color: #1b1a17; padding: 48px; display: flex; flex-direction: column; justify-content: center; }
.method { height: 72px; border-radius: 12px; border: 1px solid #c8c2b6; background: transparent; text-align: left; padding: 0 16px; margin-bottom: 12px; cursor: pointer; font: 16px system-ui,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
.method[aria-pressed="true"] { border: 2px solid #111814; }
.primary { height: 56px; border: 0; background: #111814; color: #e7c36a; cursor: pointer; font-size: 16px; }
@media (max-width: 800px) {
  .desk { grid-template-columns: 1fr; }
  .summary, .pay { padding: 24px; }
  .amount { font-size: 48px; }
}


@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

</style>
</head>
<body>

<main class="desk">
  <section class="summary">
    <h1>付款台</h1>
    <div class="row"><span>春笋</span><span>18</span></div>
    <div class="row"><span>新茶</span><span>46</span></div>
    <div class="amount">64</div>
  </section>
  <section class="pay">
    <h2>怎么付</h2>
    <button class="method" type="button" data-pay="柜面现金">柜面现金</button>
    <button class="method" type="button" data-pay="登记月结">登记月结</button>
    <button class="primary" id="t024-pay" type="button">确认支付</button>
    <p id="t024-note"></p>
  </section>
</main>

<script>

(function () {
  var picked = "";
  document.querySelectorAll(".method").forEach(function (button) {
    button.addEventListener("click", function () {
      picked = button.getAttribute("data-pay");
      document.querySelectorAll(".method").forEach(function (item) {
        item.setAttribute("aria-pressed", item === button ? "true" : "false");
      });
    });
  });
  document.getElementById("t024-pay").addEventListener("click", function () {
    document.getElementById("t024-note").textContent = picked ? "已用" + picked + "收下 64 元。" : "先选一种支付。";
  });
})();

</script>
</body>
</html>
