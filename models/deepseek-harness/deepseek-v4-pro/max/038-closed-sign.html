<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>巷邻小店 · 暂时打烊</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,"Segoe UI","Microsoft YaHei","PingFang SC","Helvetica Neue",sans-serif;
  background:#24150a;
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  padding:28px 16px;
}
.phone{
  width:390px;height:844px;max-height:94vh;
  border-radius:46px;
  border:9px solid #0e0905;
  box-shadow:0 30px 60px rgba(0,0,0,.55), inset 0 0 0 2px rgba(244,228,201,.14);
  overflow:hidden;
  display:flex;flex-direction:column;
  background:#2b1c12;
  position:relative;
}
.statusbar{
  flex:0 0 auto;height:46px;padding:0 22px;
  display:flex;align-items:center;justify-content:space-between;
  background:rgba(46,30,18,.9);color:#f4e4c9;font-size:14px;font-weight:600;
  border-bottom:1px solid rgba(244,228,201,.12);
  position:relative;z-index:3;
}
.statusbar .right{display:flex;align-items:center;gap:6px}
.statusbar svg{display:block}
.screen{
  flex:1;overflow-y:auto;position:relative;z-index:2;
  display:flex;flex-direction:column;
  background-color:#2b1c12;
  background-image:
    repeating-linear-gradient(0deg, rgba(0,0,0,.2) 0 3px, rgba(255,255,255,.02) 3px 7px),
    repeating-linear-gradient(90deg, rgba(255,255,255,.03) 0 1px, transparent 1px 46px);
  scrollbar-width:none;
}
.screen::-webkit-scrollbar{display:none}
.hang{display:flex;flex-direction:column;align-items:center;padding:6px 0 0}
.hook{width:44px;height:44px}
.rope{width:2px;height:34px;background:linear-gradient(#8a6a4a,#a9865a)}
.sign{
  position:relative;width:292px;margin-top:0;
  background:#5a3a22;border:6px solid #3f2a1a;border-radius:16px;
  padding:30px 22px 26px;text-align:center;
  box-shadow:0 16px 34px rgba(0,0,0,.42), inset 0 2px 0 rgba(255,255,255,.08);
}
.sign::before,.sign::after{
  content:"";position:absolute;top:-12px;width:10px;height:10px;border-radius:50%;
  background:#c9a45c;box-shadow:inset 0 -1px 2px rgba(0,0,0,.4);
}
.sign::before{left:16px}
.sign::after{right:16px}
.lamp{
  display:inline-block;width:14px;height:14px;border-radius:50%;
  background:#e8a13a;margin-bottom:12px;
  box-shadow:0 0 0 6px rgba(232,161,58,.16),0 0 18px rgba(232,161,58,.6);
}
.sign.open .lamp{background:#7ecf8a;box-shadow:0 0 0 6px rgba(126,207,138,.16),0 0 18px rgba(126,207,138,.6)}
.signTitle{font-size:30px;font-weight:700;color:#f4e4c9;letter-spacing:.04em}
.signSub{font-size:13px;color:#d8c39e;margin-top:10px;letter-spacing:.06em}
.explain{padding:26px 26px 0;text-align:center}
.explain h1{font-size:20px;color:#f4e4c9;font-weight:700;margin-bottom:12px}
.explain p{font-size:14px;line-height:1.9;color:#d8c39e}
.ticket{
  margin:24px 26px 0;padding:14px 16px;border-radius:14px;
  background:rgba(244,228,201,.06);border:1px solid rgba(244,228,201,.14);
  display:flex;align-items:center;justify-content:space-between;
}
.ticket .lab{font-size:12px;color:#d8c39e;letter-spacing:.05em}
.ticket .code{font-size:15px;font-weight:700;color:#f4e4c9;font-family:ui-monospace,"SF Mono","Consolas",monospace;letter-spacing:.04em}
.copybtn{
  border:0;background:rgba(244,228,201,.12);color:#f4e4c9;font:inherit;font-size:12px;
  padding:7px 12px;border-radius:9px;cursor:pointer;
}
.copybtn:hover{background:rgba(244,228,201,.22)}
.actions{padding:20px 26px 30px;display:flex;flex-direction:column;gap:12px}
.primary{
  border:0;background:#e8a13a;color:#24150a;font:inherit;font-size:16px;font-weight:700;
  padding:15px;border-radius:14px;cursor:pointer;letter-spacing:.04em;
  box-shadow:0 8px 20px rgba(232,161,58,.28);display:flex;align-items:center;justify-content:center;gap:8px;
}
.primary:hover{background:#f2b755}
.primary:focus-visible{outline:3px solid #f4e4c9;outline-offset:2px}
.primary:disabled{opacity:.75;cursor:not-allowed}
.primary .spinner{
  width:16px;height:16px;border-radius:50%;border:2px solid rgba(36,21,10,.35);
  border-top-color:#24150a;animation:spin .7s linear infinite;display:none;
}
.primary.loading .spinner{display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.ghost{
  border:1px solid rgba(244,228,201,.4);background:transparent;color:#f4e4c9;
  font:inherit;font-size:15px;font-weight:600;padding:14px;border-radius:14px;cursor:pointer;
}
.ghost:hover{background:rgba(244,228,201,.1)}
.toast{
  position:absolute;left:50%;bottom:96px;transform:translateX(-50%) translateY(16px);
  background:#f4e4c9;color:#24150a;font-size:13px;padding:10px 16px;border-radius:22px;
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;white-space:nowrap;z-index:30;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:480px){
  body{padding:0}
  .phone{width:100%;height:100vh;max-height:none;border-radius:0;border:0;box-shadow:none}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="phone">
  <div class="statusbar">
    <span>9:41</span>
    <span class="right">
      <svg width="17" height="12" viewBox="0 0 17 12" aria-hidden="true"><rect x="0" y="8" width="3" height="4" rx="1" fill="#f4e4c9"/><rect x="4.5" y="6" width="3" height="6" rx="1" fill="#f4e4c9"/><rect x="9" y="3" width="3" height="9" rx="1" fill="#f4e4c9"/><rect x="13.5" y="0" width="3" height="12" rx="1" fill="#f4e4c9" opacity=".35"/></svg>
      <svg width="17" height="12" viewBox="0 0 17 12" aria-hidden="true"><path d="M1 5.2 A7.5 7.5 0 0 1 16 5.2 L13.8 7.6 A4.5 4.5 0 0 0 3.2 7.6 Z" fill="#f4e4c9"/><circle cx="8.5" cy="10" r="1.6" fill="#f4e4c9"/></svg>
      <svg width="26" height="13" viewBox="0 0 26 13" aria-hidden="true"><rect x="0.5" y="0.5" width="21" height="12" rx="3.5" fill="none" stroke="#f4e4c9" opacity=".5"/><rect x="2.5" y="2.5" width="16" height="8" rx="1.5" fill="#f4e4c9"/><rect x="22.5" y="4" width="3" height="5" rx="1" fill="#f4e4c9" opacity=".5"/></svg>
    </span>
  </div>

  <div class="screen" id="screen">
    <div class="hang">
      <svg class="hook" viewBox="0 0 44 44" aria-hidden="true">
        <circle cx="22" cy="14" r="5" fill="#c9a45c"/>
        <rect x="21" y="16" width="2" height="10" fill="#a9865a"/>
        <path d="M21 26 C18 30 14 34 22 34 C30 34 26 30 23 26" fill="none" stroke="#c9a45c" stroke-width="4" stroke-linecap="round"/>
      </svg>
      <div class="rope"></div>
      <div class="sign" id="sign">
        <span class="lamp"></span>
        <div class="signTitle" id="signTitle">本店打烊了</div>
        <div class="signSub">正在小检修 · 稍后开门</div>
      </div>
    </div>

    <div class="explain">
      <h1 id="explainTitle">这条路暂时走不通</h1>
      <p id="explainText">我们正在给店面做个小检修，过几分钟再来敲门就好。你的订单和积分都好好留着，一样也不会少。</p>
    </div>

    <div class="ticket">
      <div>
        <div class="lab">故障单号</div>
        <div class="code" id="code">HZ-2047-1182</div>
      </div>
      <button class="copybtn" type="button" id="copy">复制</button>
    </div>
  </div>

  <div class="actions">
    <button class="primary" type="button" id="retry"><span class="spinner"></span><span id="retryText">再敲一次门</span></button>
    <button class="ghost" type="button" id="home">回首页</button>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
(function(){
  var sign=document.getElementById("sign");
  var signTitle=document.getElementById("signTitle");
  var explainTitle=document.getElementById("explainTitle");
  var explainText=document.getElementById("explainText");
  var retry=document.getElementById("retry");
  var retryText=document.getElementById("retryText");
  var toast=document.getElementById("toast");

  function showToast(msg){
    toast.textContent=msg;
    toast.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t=setTimeout(function(){toast.classList.remove("show");},2400);
  }

  document.getElementById("copy").addEventListener("click",function(){
    var code=document.getElementById("code").textContent;
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(code).then(function(){showToast("已复制故障单号 "+code);},function(){showToast("故障单号 "+code);});
    }else{
      showToast("故障单号 "+code);
    }
  });

  document.getElementById("retry").addEventListener("click",function(){
    if(retry.classList.contains("loading")){return;}
    retry.classList.add("loading");
    retry.disabled=true;
    retryText.textContent="正在重新敲门…";
    setTimeout(function(){
      retry.classList.remove("loading");
      retry.disabled=false;
      sign.classList.add("open");
      signTitle.textContent="恢复营业啦";
      explainTitle.textContent="欢迎回来";
      explainText.textContent="门已经重新打开了，你的订单都还在。这就带你回到店里继续逛。";
      retryText.textContent="进入店铺";
      showToast("已恢复，正在带你回去");
    },1400);
  });

  document.getElementById("home").addEventListener("click",function(){
    sign.classList.remove("open");
    signTitle.textContent="本店打烊了";
    explainTitle.textContent="这条路暂时走不通";
    explainText.textContent="我们正在给店面做个小检修，过几分钟再来敲门就好。你的订单和积分都好好留着，一样也不会少。";
    retryText.textContent="再敲一次门";
    showToast("已回到首页（演示）");
  });
})();
</script>
</body>
</html>
