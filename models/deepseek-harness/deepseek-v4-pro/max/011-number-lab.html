<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数据实验室 · 经营分析</title>
<style>
  :root{
    --bg:#ffffff;
    --panel:#f4f5f7;
    --grid:#e6e8ec;
    --ink:#1f2430;
    --muted:#6b7280;
    --blue:#2563eb;
    --green:#16a34a;
    --orange:#f97316;
    --purple:#8b5cf6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,"Segoe UI","Microsoft YaHei","PingFang SC","Helvetica Neue",sans-serif;
    background:var(--bg);color:var(--ink);min-height:100vh;
  }
  .wrap{max-width:1280px;margin:0 auto;padding:22px 24px 48px}

  header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
  .title-block h1{font-size:22px;font-weight:700;letter-spacing:.5px}
  .title-block p{font-size:13px;color:var(--muted);margin-top:6px}
  .hdr-right{display:flex;align-items:center;gap:10px}
  .seg{display:inline-flex;background:var(--panel);border:1px solid var(--grid);border-radius:8px;padding:3px}
  .seg button{
    font-family:inherit;border:none;background:transparent;cursor:pointer;
    padding:7px 16px;border-radius:6px;font-size:13px;color:var(--muted);font-weight:600;
    transition:background .12s ease,color .12s ease;
  }
  .seg button:hover{color:var(--ink)}
  .seg button.active{background:var(--white);color:var(--ink);box-shadow:0 1px 3px rgba(31,36,48,.14)}
  .btn-export{
    font-family:inherit;cursor:pointer;border:1px solid var(--grid);background:var(--white);
    color:var(--ink);padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;
    transition:border-color .12s ease,background .12s ease;
  }
  .btn-export:hover{border-color:var(--blue);background:var(--panel)}

  /* KPI */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
  .kpi{
    background:var(--white);border:1px solid var(--grid);border-radius:10px;padding:16px 16px 12px;
    position:relative;overflow:hidden;
  }
  .kpi-label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
  .kpi-value{font-size:28px;font-weight:700;margin-top:8px;font-variant-numeric:tabular-nums;letter-spacing:.5px}
  .kpi-delta{font-size:12px;margin-top:6px;font-weight:600}
  .up{color:var(--green)} .down{color:var(--orange)}
  .kpi-spark{position:absolute;right:12px;bottom:10px;opacity:.9}

  .grid2{display:grid;grid-template-columns:1fr 320px;gap:16px}

  .card{background:var(--white);border:1px solid var(--grid);border-radius:10px}
  .card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px 8px;flex-wrap:wrap}
  .card-head h2{font-size:15px;font-weight:700}
  .legend{display:flex;gap:16px;font-size:12px;color:var(--muted)}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .swatch{width:10px;height:10px;border-radius:2px;display:inline-block}
  .chart-body{padding:4px 12px 14px}
  .chart-body svg{width:100%;height:auto;display:block}
  .axis text{font-family:inherit;font-size:11px;fill:var(--muted)}
  .gridline{stroke:var(--grid);stroke-width:1}
  .bar{transition:opacity .12s ease}
  .bar:hover{opacity:.8}

  /* 右侧栏 */
  .side{display:flex;flex-direction:column;gap:16px}
  .rank{padding:14px 18px}
  .rank h3{font-size:13px;font-weight:700;margin-bottom:14px}
  .rank-row{margin-bottom:14px}
  .rank-row:last-child{margin-bottom:0}
  .rank-top{display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px}
  .rank-top .name{color:var(--ink);font-weight:600}
  .rank-top .val{color:var(--muted);font-variant-numeric:tabular-nums}
  .track{height:8px;border-radius:4px;background:var(--panel);overflow:hidden}
  .fill{height:100%;border-radius:4px}
  .note{padding:14px 18px;font-size:12px;color:var(--muted);line-height:1.7}
  .note b{color:var(--ink)}

  @media (max-width:768px){
    .wrap{padding:16px}
    .kpis{grid-template-columns:1fr 1fr}
    .grid2{grid-template-columns:1fr}
  }
  @media (max-width:520px){
    .kpis{grid-template-columns:1fr}
  }
  @media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title-block">
      <h1>数据实验室 · 经营分析</h1>
      <p>访问与订单趋势一览 · 数据每 5 分钟自动刷新</p>
    </div>
    <div class="hdr-right">
      <div class="seg" id="granularity" role="group" aria-label="粒度切换">
        <button data-g="day" class="active">日</button>
        <button data-g="week">周</button>
        <button data-g="month">月</button>
      </div>
      <button class="btn-export" id="exportBtn">导出报表</button>
    </div>
  </header>

  <section class="kpis">
    <div class="kpi">
      <div class="kpi-label"><span class="dot" style="background:#2563eb"></span>总访问量</div>
      <div class="kpi-value" id="kpi-visits">0</div>
      <div class="kpi-delta up" id="kpi-visits-delta">▲ 8.2%</div>
      <svg class="kpi-spark" width="72" height="28" viewBox="0 0 72 28" aria-hidden="true">
        <polyline points="0,22 12,18 24,20 36,12 48,14 60,7 72,9" fill="none" stroke="#2563eb" stroke-width="2"/>
      </svg>
    </div>
    <div class="kpi">
      <div class="kpi-label"><span class="dot" style="background:#16a34a"></span>总订单</div>
      <div class="kpi-value" id="kpi-orders">0</div>
      <div class="kpi-delta up" id="kpi-orders-delta">▲ 5.1%</div>
      <svg class="kpi-spark" width="72" height="28" viewBox="0 0 72 28" aria-hidden="true">
        <polyline points="0,24 12,20 24,22 36,15 48,17 60,9 72,11" fill="none" stroke="#16a34a" stroke-width="2"/>
      </svg>
    </div>
    <div class="kpi">
      <div class="kpi-label"><span class="dot" style="background:#f97316"></span>转化率</div>
      <div class="kpi-value" id="kpi-cvr">0%</div>
      <div class="kpi-delta up" id="kpi-cvr-delta">▲ 0.6%</div>
      <svg class="kpi-spark" width="72" height="28" viewBox="0 0 72 28" aria-hidden="true">
        <polyline points="0,20 12,14 24,16 36,18 48,10 60,13 72,8" fill="none" stroke="#f97316" stroke-width="2"/>
      </svg>
    </div>
    <div class="kpi">
      <div class="kpi-label"><span class="dot" style="background:#8b5cf6"></span>客单价</div>
      <div class="kpi-value">¥128</div>
      <div class="kpi-delta up">▲ 6.4% · 近 30 天均值</div>
      <svg class="kpi-spark" width="72" height="28" viewBox="0 0 72 28" aria-hidden="true">
        <polyline points="0,21 12,19 24,22 36,16 48,12 60,14 72,7" fill="none" stroke="#8b5cf6" stroke-width="2"/>
      </svg>
    </div>
  </section>

  <div class="grid2">
    <section class="card">
      <div class="card-head">
        <h2>访问与订单趋势</h2>
        <div class="legend">
          <span><i class="swatch" style="background:#2563eb"></i>访问量</span>
          <span><i class="swatch" style="background:#16a34a"></i>订单量</span>
        </div>
      </div>
      <div class="chart-body" id="chart"></div>
    </section>

    <div class="side">
      <section class="card rank">
        <h3>渠道来源</h3>
        <div class="rank-row"><div class="rank-top"><span class="name">自然搜索</span><span class="val">38%</span></div><div class="track"><div class="fill" style="width:38%;background:#2563eb"></div></div></div>
        <div class="rank-row"><div class="rank-top"><span class="name">直接访问</span><span class="val">27%</span></div><div class="track"><div class="fill" style="width:27%;background:#16a34a"></div></div></div>
        <div class="rank-row"><div class="rank-top"><span class="name">社交媒体</span><span class="val">21%</span></div><div class="track"><div class="fill" style="width:21%;background:#f97316"></div></div></div>
        <div class="rank-row"><div class="rank-top"><span class="name">邮件营销</span><span class="val">14%</span></div><div class="track"><div class="fill" style="width:14%;background:#8b5cf6"></div></div></div>
      </section>
      <section class="card note">
        <b>口径说明</b><br>
        转化率 = 订单量 ÷ 访问量；客单价为近 30 天成交均值。切换上方「日 / 周 / 月」可改变主图与关键数字的统计粒度。
      </section>
    </div>
  </div>
</div>

<script>
  var data = {
    day: {
      labels: ["周一","周二","周三","周四","周五","周六","周日"],
      visits: [420,560,480,720,690,810,640],
      orders: [36,51,44,68,62,79,57]
    },
    week: {
      labels: ["第1周","第2周","第3周","第4周","第5周","第6周","第7周","第8周"],
      visits: [2980,3240,3120,3580,3710,3690,4020,4180],
      orders: [280,305,291,342,360,351,388,401]
    },
    month: {
      labels: ["1月","2月","3月","4月","5月","6月","7月","8月"],
      visits: [12400,13200,12800,14100,15200,14900,16300,17100],
      orders: [1150,1240,1200,1330,1460,1420,1580,1660]
    }
  };
  var cur = 'day';

  function sum(a){ var s=0; for (var i=0;i<a.length;i++) s+=a[i]; return s; }
  function fmt(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ","); }

  function niceMax(v){
    var p = Math.pow(10, Math.floor(Math.log10(v)));
    var d = v / p;
    var f = d <= 1 ? 1 : d <= 2 ? 2 : d <= 5 ? 5 : 10;
    return f * p;
  }

  function renderChart(){
    var d = data[cur];
    var n = d.labels.length;
    var W = 720, H = 300;
    var ml = 46, mr = 12, mt = 16, mb = 32;
    var plotW = W - ml - mr, plotH = H - mt - mb;
    var max = niceMax(Math.max.apply(null, d.visits.concat(d.orders)));
    var s = '';
    /* 网格与刻度 */
    for (var k = 0; k <= 4; k++){
      var y = mt + plotH * (1 - k/4);
      var val = Math.round(max * k/4);
      s += '<line class="gridline" x1="'+ml+'" y1="'+y+'" x2="'+(W-mr)+'" y2="'+y+'"/>';
      s += '<text class="axis" x="'+(ml-8)+'" y="'+(y+4)+'" text-anchor="end">'+fmt(val)+'</text>';
    }
    var group = plotW / n;
    var bw = Math.min(26, group * 0.32);
    for (var i = 0; i < n; i++){
      var cx = ml + group * (i + 0.5);
      var lx = cx + group * 0.34;
      var vh = plotH * d.visits[i] / max;
      var oh = plotH * d.orders[i] / max;
      var vx = lx - bw - 2, ox = lx + 2;
      var vy = mt + plotH - vh, oy = mt + plotH - oh;
      s += '<rect class="bar" x="'+vx+'" y="'+vy+'" width="'+bw+'" height="'+vh+'" rx="3" fill="#2563eb"><title>访问量 '+fmt(d.visits[i])+'</title></rect>';
      s += '<rect class="bar" x="'+ox+'" y="'+oy+'" width="'+bw+'" height="'+oh+'" rx="3" fill="#16a34a"><title>订单量 '+fmt(d.orders[i])+'</title></rect>';
      s += '<text class="axis" x="'+cx+'" y="'+(H-10)+'" text-anchor="middle">'+d.labels[i]+'</text>';
    }
    document.getElementById('chart').innerHTML =
      '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="访问与订单趋势柱状图">'+s+'</svg>';
  }

  function renderKpis(){
    var d = data[cur];
    var v = sum(d.visits), o = sum(d.orders);
    var cvr = (o / v * 100);
    document.getElementById('kpi-visits').textContent = fmt(v);
    document.getElementById('kpi-orders').textContent = fmt(o);
    document.getElementById('kpi-cvr').textContent = cvr.toFixed(1) + '%';
    document.getElementById('kpi-visits-delta').textContent = '▲ ' + (cur==='day'?'8.2':cur==='week'?'6.9':'5.4') + '%';
    document.getElementById('kpi-orders-delta').textContent = '▲ ' + (cur==='day'?'5.1':cur==='week'?'4.3':'3.7') + '%';
    document.getElementById('kpi-cvr-delta').textContent = '▲ ' + (cur==='day'?'0.6':cur==='week'?'0.4':'0.3') + '%';
  }

  function render(){ renderChart(); renderKpis(); }

  document.getElementById('granularity').addEventListener('click', function(e){
    var b = e.target.closest('button');
    if (!b) return;
    cur = b.dataset.g;
    var all = this.querySelectorAll('button');
    for (var i=0;i<all.length;i++){ all[i].classList.remove('active'); }
    b.classList.add('active');
    render();
  });

  document.getElementById('exportBtn').addEventListener('click', function(){
    var names = {day:'日报', week:'周报', month:'月报'};
    var note = document.querySelector('.note');
    var old = note.innerHTML;
    note.innerHTML = '<b>已生成报表</b><br>「'+names[cur]+'」导出任务已进入队列，稍后在下载中心取件。';
    note.style.border = '1px solid #16a34a';
    setTimeout(function(){ note.innerHTML = old; note.style.border = ''; }, 2200);
  });

  render();
</script>
</body>
</html>
