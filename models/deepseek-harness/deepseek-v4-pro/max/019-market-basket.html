<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>早集生鲜 · 购物车</title>
<style>
  :root{
    --red:#c8442c;
    --red-deep:#a8341f;
    --cream:#f6efe3;
    --card:#fffdf7;
    --tan:#b9894e;
    --green:#3f7d5a;
    --green-deep:#2f5c43;
    --ink:#2c2418;
    --muted:#8a7a63;
    --line:#e6d3b3;
    --delete:#b5342f;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,"Segoe UI","Microsoft YaHei","PingFang SC","Helvetica Neue",sans-serif;
    background:var(--cream);
    background-image:radial-gradient(#e9dcc4 1px, transparent 1px);
    background-size:22px 22px;
    color:var(--ink);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .awning{
    height:54px;
    background-image:repeating-linear-gradient(90deg, var(--red) 0 42px, #fff4ea 42px 84px);
    border-bottom:3px solid var(--red-deep);
    box-shadow:0 3px 12px rgba(44,36,24,.18);
  }
  .shell{max-width:1120px;margin:0 auto;padding:28px 24px 56px}
  .top{
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    margin-bottom:20px;flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:14px}
  .brand .basket{
    width:52px;height:52px;border-radius:14px;background:var(--red);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 0 var(--red-deep);
  }
  .brand h1{font-size:26px;letter-spacing:1px;font-weight:800}
  .brand p{color:var(--muted);font-size:13px}
  .stall-note{
    font-size:13px;color:var(--tan);background:#f3e6cd;border:1px dashed var(--tan);
    padding:8px 14px;border-radius:999px;
  }
  .layout{display:grid;grid-template-columns:1fr 336px;gap:24px;align-items:start}
  .list{display:flex;flex-direction:column;gap:14px}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:16px 18px;display:grid;grid-template-columns:72px 1fr auto auto auto;
    gap:14px;align-items:center;box-shadow:0 1px 2px rgba(44,36,24,.06);
  }
  .thumb{
    width:72px;height:72px;border-radius:14px;background:#f3ead9;
    display:flex;align-items:center;justify-content:center;overflow:hidden;
  }
  .thumb svg{width:52px;height:52px}
  .info h3{font-size:17px;font-weight:700}
  .info .from{font-size:12.5px;color:var(--muted);margin-top:3px}
  .tag{
    display:inline-flex;align-items:center;gap:6px;background:#f0dcc0;border:1px solid var(--tan);
    color:#7a5a2e;font-size:12px;font-weight:700;padding:3px 9px;border-radius:8px;
    position:relative;transform:rotate(-2deg);
  }
  .tag::before{
    content:"";width:7px;height:7px;border-radius:50%;background:var(--cream);
    border:1px solid var(--tan);display:inline-block;
  }
  .price-cell{text-align:center;min-width:74px}
  .price-cell .label{display:block;font-size:11px;color:var(--muted)}
  .price-cell .num{font-size:15px;font-weight:800}
  .stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .step{
    width:34px;height:34px;border:none;background:#f7efe0;color:var(--ink);
    font-size:18px;cursor:pointer;transition:background .15s ease;
  }
  .step:hover{background:#ecdcc0}
  .step:active{background:#dfcaa2}
  .qty{width:36px;text-align:center;font-size:15px;font-weight:700}
  .line-total{min-width:84px;text-align:right;font-size:16px;font-weight:800}
  .del{
    border:none;background:none;color:var(--delete);font-size:13px;cursor:pointer;
    text-decoration:underline;text-underline-offset:3px;padding:4px;
  }
  .del:hover{color:var(--red)}
  .summary{
    background:var(--card);border:1px dashed var(--tan);border-radius:16px;
    padding:20px;position:sticky;top:24px;box-shadow:0 2px 6px rgba(44,36,24,.06);
  }
  .summary h2{font-size:18px;margin-bottom:14px;letter-spacing:.5px}
  .summary .row{display:flex;justify-content:space-between;padding:8px 0;font-size:14px;color:var(--muted)}
  .summary .row b{color:var(--ink)}
  .summary .ship-note{font-size:12px;color:var(--green);background:#e9f2ec;padding:6px 10px;border-radius:8px;margin:6px 0 10px}
  .summary .total{
    display:flex;justify-content:space-between;align-items:baseline;
    border-top:2px solid var(--line);margin-top:10px;padding-top:14px;
  }
  .summary .total .big{font-size:30px;font-weight:900;color:var(--red)}
  .summary .total .unit{font-size:14px;color:var(--muted)}
  .checkout{
    width:100%;margin-top:18px;padding:14px 0;border:none;border-radius:14px;
    background:var(--red);color:#fff;font-size:16px;font-weight:700;letter-spacing:2px;
    cursor:pointer;box-shadow:0 4px 0 var(--red-deep);transition:transform .12s ease, box-shadow .12s ease;
  }
  .checkout:hover{background:#d44e36}
  .checkout:active{transform:translateY(3px);box-shadow:0 1px 0 var(--red-deep)}
  .checkout[disabled]{background:#cbb;box-shadow:0 4px 0 #a99;cursor:not-allowed;letter-spacing:2px}
  .empty{
    background:var(--card);border:2px dashed var(--line);border-radius:16px;
    padding:64px 24px;text-align:center;color:var(--muted);
  }
  .empty .glyph{font-size:46px;line-height:1}
  .empty h3{color:var(--ink);font-size:20px;margin:14px 0 6px}
  .empty p{font-size:14px;margin-bottom:18px}
  .back-shop{
    display:inline-block;padding:12px 26px;border-radius:12px;background:var(--green);
    color:#fff;border:none;font-size:15px;font-weight:600;cursor:pointer;
  }
  .back-shop:hover{background:var(--green-deep)}
  .toast{
    position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);
    background:var(--green);color:#fff;padding:13px 22px;border-radius:12px;
    font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s ease, transform .25s ease;
    box-shadow:0 8px 24px rgba(44,36,24,.25);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media (max-width:860px){
    .layout{grid-template-columns:1fr}
    .summary{position:static}
    .card{grid-template-columns:60px 1fr auto;grid-template-areas:"thumb info del" "thumb stepper stepper" "thumb price price"}
  }
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>
  <div class="awning" aria-hidden="true"></div>
  <main class="shell">
    <header class="top">
      <div class="brand">
        <div class="basket" aria-hidden="true">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fffdf7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 9h16l-1.5 10a2 2 0 0 1-2 1.7h-9a2 2 0 0 1-2-1.7L4 9z"/>
            <path d="M8 11V6a4 4 0 0 1 8 0v5"/>
          </svg>
        </div>
        <div>
          <h1>早集生鲜</h1>
          <p>每周六 · 城北广场早市 · 摊主张婶</p>
        </div>
      </div>
      <span class="stall-note">🕖 今天 6:00 – 11:00 出摊</span>
    </header>

    <div class="layout">
      <section class="list" id="list" aria-label="购物车清单">
        <article class="card item" data-price="12.8" data-name="沙瓤番茄">
          <div class="thumb">
            <svg viewBox="0 0 64 64" aria-hidden="true">
              <circle cx="32" cy="36" r="22" fill="#d4482f"/>
              <circle cx="26" cy="30" r="6" fill="#ec6a4a"/>
              <path d="M32 16c-2-7 6-10 7-4 0 2-2 4-7 4z" fill="#3f7d5a"/>
              <path d="M32 16c1-6 8-7 8-2-1 2-4 3-8 2z" fill="#4f9168"/>
            </svg>
          </div>
          <div class="info">
            <h3>沙瓤番茄</h3>
            <div class="from">产地直采 · 约 500g / 斤</div>
          </div>
          <div class="price-cell">
            <span class="label">单价</span>
            <span class="tag num">¥12.80</span>
          </div>
          <div class="stepper">
            <button class="step" data-act="minus" aria-label="减少数量">−</button>
            <span class="qty">2</span>
            <button class="step" data-act="plus" aria-label="增加数量">+</button>
          </div>
          <div class="line-total">¥25.60</div>
          <button class="del" data-act="del">删除</button>
        </article>

        <article class="card item" data-price="18.5" data-name="散养土鸡蛋">
          <div class="thumb">
            <svg viewBox="0 0 64 64" aria-hidden="true">
              <rect x="12" y="34" width="40" height="16" rx="4" fill="#c9a06a"/>
              <ellipse cx="24" cy="28" rx="8" ry="10" fill="#f4e6c8"/>
              <ellipse cx="40" cy="28" rx="8" ry="10" fill="#f4e6c8"/>
              <ellipse cx="32" cy="26" rx="8" ry="10" fill="#fbf1da"/>
            </svg>
          </div>
          <div class="info">
            <h3>散养土鸡蛋</h3>
            <div class="from">农家自养 · 30 枚 / 盒</div>
          </div>
          <div class="price-cell">
            <span class="label">单价</span>
            <span class="tag num">¥18.50</span>
          </div>
          <div class="stepper">
            <button class="step" data-act="minus" aria-label="减少数量">−</button>
            <span class="qty">1</span>
            <button class="step" data-act="plus" aria-label="增加数量">+</button>
          </div>
          <div class="line-total">¥18.50</div>
          <button class="del" data-act="del">删除</button>
        </article>

        <article class="card item" data-price="9.9" data-name="嫩叶菠菜">
          <div class="thumb">
            <svg viewBox="0 0 64 64" aria-hidden="true">
              <path d="M32 52c-12-6-18-16-14-28 2 6 6 9 14 10 8-1 12-4 14-10 4 12-2 22-14 28z" fill="#3f7d5a"/>
              <path d="M32 52v-8M32 44c-8-1-12-4-14-10M32 44c8-1 12-4 14-10" stroke="#2f5c43" stroke-width="2" fill="none"/>
            </svg>
          </div>
          <div class="info">
            <h3>嫩叶菠菜</h3>
            <div class="from">清晨现割 · 约 300g / 把</div>
          </div>
          <div class="price-cell">
            <span class="label">单价</span>
            <span class="tag num">¥9.90</span>
          </div>
          <div class="stepper">
            <button class="step" data-act="minus" aria-label="减少数量">−</button>
            <span class="qty">3</span>
            <button class="step" data-act="plus" aria-label="增加数量">+</button>
          </div>
          <div class="line-total">¥29.70</div>
          <button class="del" data-act="del">删除</button>
        </article>

        <article class="card item" data-price="28" data-name="槐花蜂蜜">
          <div class="thumb">
            <svg viewBox="0 0 64 64" aria-hidden="true">
              <rect x="24" y="20" width="16" height="10" rx="3" fill="#8a6a3b"/>
              <rect x="20" y="14" width="24" height="8" rx="3" fill="#b9894e"/>
              <rect x="22" y="30" width="20" height="24" rx="4" fill="#e0a33c"/>
              <rect x="26" y="26" width="12" height="6" rx="2" fill="#8a6a3b"/>
              <text x="32" y="46" font-size="11" text-anchor="middle" fill="#7a5a2e" font-weight="700">蜜</text>
            </svg>
          </div>
          <div class="info">
            <h3>槐花蜂蜜</h3>
            <div class="from">本地蜂场 · 500g / 罐</div>
          </div>
          <div class="price-cell">
            <span class="label">单价</span>
            <span class="tag num">¥28.00</span>
          </div>
          <div class="stepper">
            <button class="step" data-act="minus" aria-label="减少数量">−</button>
            <span class="qty">1</span>
            <button class="step" data-act="plus" aria-label="增加数量">+</button>
          </div>
          <div class="line-total">¥28.00</div>
          <button class="del" data-act="del">删除</button>
        </article>
      </section>

      <aside class="summary">
        <h2>结算小计</h2>
        <div class="row"><span>商品件数</span><b id="count">7 件</b></div>
        <div class="row"><span>商品金额</span><b id="subtotal">¥101.80</b></div>
        <div class="row"><span>配送费</span><b id="shipping">¥0.00</b></div>
        <div class="ship-note" id="shipnote">已满 ¥99 元，本单免配送费 🚚</div>
        <div class="total">
          <span>合计</span>
          <span class="big"><span class="unit">¥</span><span id="grand">101.80</span></span>
        </div>
        <button class="checkout" id="checkout">去结算</button>
      </aside>
    </div>
  </main>
  <div class="toast" id="toast" role="status">已提交订单，摊主正在打包 🧺</div>

<script>
  (function(){
    var list = document.getElementById('list');
    var subtotalEl = document.getElementById('subtotal');
    var shippingEl = document.getElementById('shipping');
    var grandEl = document.getElementById('grand');
    var countEl = document.getElementById('count');
    var shipnote = document.getElementById('shipnote');
    var checkout = document.getElementById('checkout');
    var toast = document.getElementById('toast');
    var FREE_OVER = 99;
    var SHIP_FEE = 8;
    var toastTimer = null;

    function fmt(n){ return n.toFixed(2); }

    function recalc(){
      var items = list.querySelectorAll('.item');
      var subtotal = 0, count = 0;
      items.forEach(function(it){
        var price = parseFloat(it.getAttribute('data-price'));
        var qty = parseInt(it.querySelector('.qty').textContent, 10);
        var line = price * qty;
        it.querySelector('.line-total').textContent = '¥' + fmt(line);
        subtotal += line;
        count += qty;
      });
      var ship = subtotal >= FREE_OVER ? 0 : SHIP_FEE;
      subtotalEl.textContent = '¥' + fmt(subtotal);
      shippingEl.textContent = '¥' + fmt(ship);
      grandEl.textContent = fmt(subtotal + ship);
      countEl.textContent = count + ' 件';
      if (subtotal >= FREE_OVER) {
        shipnote.textContent = '已满 ¥99 元，本单免配送费 🚚';
      } else if (subtotal > 0) {
        shipnote.textContent = '再买 ¥' + fmt(FREE_OVER - subtotal) + ' 即免配送费';
      } else {
        shipnote.textContent = '';
      }
      var empty = items.length === 0;
      checkout.disabled = empty;
      checkout.textContent = empty ? '篮子空啦' : '去结算';
      if (empty) { ensureEmptyState(); }
    }

    function ensureEmptyState(){
      if (!list.querySelector('.empty')) {
        var div = document.createElement('div');
        div.className = 'empty';
        div.innerHTML = '<div class="glyph">🧺</div><h3>篮子里还没有东西</h3><p>去摊位挑几样新鲜的吧</p><button class="back-shop" id="backShop">回早集逛逛</button>';
        list.appendChild(div);
        document.getElementById('backShop').addEventListener('click', restore);
      }
    }

    function restore(){
      list.innerHTML = DEFAULT_ITEMS;
      recalc();
    }

    function showToast(msg){
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function(){ toast.classList.remove('show'); }, 2200);
    }

    list.addEventListener('click', function(e){
      var btn = e.target.closest('[data-act]');
      if (!btn) return;
      var card = btn.closest('.item');
      var act = btn.getAttribute('data-act');
      if (act === 'minus') {
        var q = parseInt(card.querySelector('.qty').textContent, 10);
        if (q > 1) { card.querySelector('.qty').textContent = q - 1; recalc(); }
      } else if (act === 'plus') {
        var q2 = parseInt(card.querySelector('.qty').textContent, 10);
        card.querySelector('.qty').textContent = q2 + 1; recalc();
      } else if (act === 'del') {
        var name = card.getAttribute('data-name');
        card.remove();
        recalc();
        showToast('已把「' + name + '」放回摊位');
      }
    });

    checkout.addEventListener('click', function(){
      if (checkout.disabled) return;
      showToast('订单已提交，摊主正在打包 🧺');
    });

    var DEFAULT_ITEMS = list.innerHTML;
    recalc();
  })();
</script>
</body>
</html>
