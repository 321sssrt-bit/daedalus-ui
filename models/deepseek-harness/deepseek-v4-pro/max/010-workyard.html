<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>工地看板 · 城建西区</title>
<style>
  :root{
    --ink:#191917;
    --panel:#23231f;
    --line:#34342e;
    --hazard:#f6c61e;
    --paper:#f3efe2;
    --rust:#d84315;
    --white:#ffffff;
    --muted:#8a8a80;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,"Segoe UI","Microsoft YaHei","PingFang SC","Helvetica Neue",sans-serif;
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,.012) 0 1px, transparent 1px 3px),
      var(--ink);
    color:var(--paper);
    min-height:100vh;
  }
  .wrap{max-width:1280px;margin:0 auto;padding:20px 24px 40px}

  /* 顶栏 */
  header{
    display:flex;align-items:center;gap:16px;
    padding:14px 18px;border:1px solid var(--line);border-radius:8px;
    background:var(--panel);box-shadow:0 6px 0 rgba(0,0,0,.25);
    position:sticky;top:0;z-index:20;
  }
  .brand{display:flex;align-items:center;gap:12px}
  .brand-mark{
    width:34px;height:34px;border-radius:6px;
    background:repeating-linear-gradient(45deg, var(--hazard) 0 7px, var(--ink) 7px 14px);
    border:2px solid var(--hazard);
  }
  .brand h1{font-size:18px;letter-spacing:1px;color:var(--white);font-weight:700}
  .brand small{display:block;font-size:11px;color:var(--muted);letter-spacing:2px;margin-top:2px}
  .hdr-mid{flex:1;display:flex;gap:20px;margin-left:8px;flex-wrap:wrap}
  .hdr-stat{font-size:12px;color:var(--muted)}
  .hdr-stat b{display:block;font-size:20px;color:var(--hazard);font-weight:700;line-height:1.1}
  .hdr-right{display:flex;align-items:center;gap:12px}
  .date{font-size:12px;color:var(--muted);text-align:right;line-height:1.5}
  .date b{color:var(--paper);font-weight:600}

  .btn{
    font-family:inherit;cursor:pointer;border:none;border-radius:6px;
    padding:10px 16px;font-size:14px;font-weight:700;letter-spacing:1px;
    transition:transform .08s ease, box-shadow .08s ease, background .12s ease;
  }
  .btn:focus-visible{outline:2px solid var(--hazard);outline-offset:2px}
  .btn:active{transform:translateY(1px)}
  .btn-primary{
    background:var(--hazard);color:var(--ink);
    box-shadow:0 3px 0 #b89100;
  }
  .btn-primary:hover{background:#ffd63a}
  .btn-ghost{
    background:transparent;color:var(--paper);border:1px solid var(--line);
  }
  .btn-ghost:hover{border-color:var(--hazard);color:var(--hazard)}

  /* 看板 */
  .board{
    display:grid;grid-template-columns:repeat(4,1fr);gap:14px;
    margin-top:22px;align-items:start;
  }
  .col{
    background:var(--panel);border:1px solid var(--line);border-radius:8px;
    overflow:hidden;min-height:360px;
  }
  .col-head{
    padding:12px 12px 10px;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#2a2a24,#23231f);
  }
  .col-title{
    display:flex;align-items:center;justify-content:space-between;
    font-size:14px;font-weight:700;color:var(--white);
    padding-top:9px;border-top:6px solid transparent;
    border-image:repeating-linear-gradient(45deg, var(--hazard) 0 8px, var(--ink) 8px 16px) 1;
  }
  .col-count{
    display:inline-flex;align-items:center;justify-content:center;
    min-width:22px;height:22px;border-radius:11px;
    background:var(--ink);color:var(--hazard);font-size:12px;font-weight:700;
    border:1px solid var(--line);
  }
  .col-note{font-size:11px;color:var(--muted);margin-top:6px;letter-spacing:1px}
  .cards{display:flex;flex-direction:column;gap:10px;padding:12px;min-height:120px}

  .card{
    background:var(--paper);color:var(--ink);
    border:1px solid var(--line);border-radius:6px;padding:10px 10px 8px;
    cursor:pointer;position:relative;
    box-shadow:0 3px 0 rgba(0,0,0,.28);
    transition:transform .1s ease, box-shadow .1s ease, border-color .12s ease;
  }
  .card:hover{transform:translateY(-2px);box-shadow:0 6px 0 rgba(0,0,0,.28);border-color:var(--hazard)}
  .card:focus-visible{outline:2px solid var(--hazard);outline-offset:2px}
  .tape{
    position:absolute;top:-7px;left:10px;width:46px;height:14px;
    background:repeating-linear-gradient(45deg, rgba(246,198,30,.85) 0 5px, rgba(246,198,30,.25) 5px 10px);
    transform:rotate(-2deg);border-radius:2px;
  }
  .card-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:2px}
  .card-title{font-size:14px;font-weight:700;line-height:1.3}
  .badge{font-size:11px;font-weight:700;padding:2px 7px;border-radius:3px;letter-spacing:1px;white-space:nowrap}
  .badge-high{background:var(--rust);color:var(--white)}
  .badge-mid{background:var(--hazard);color:var(--ink)}
  .card-meta{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
  .card-zone{font-size:11px;color:#5b5b52}
  .avatar{
    width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--hazard);
    display:inline-flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:700;
  }
  .card-ops{display:flex;gap:6px;align-items:center}
  .move-btn{
    width:24px;height:24px;border-radius:4px;border:1px solid var(--line);
    background:var(--panel);color:var(--paper);font-size:13px;line-height:1;
    cursor:pointer;transition:background .1s ease, color .1s ease;
  }
  .move-btn:hover{background:var(--hazard);color:var(--ink);border-color:var(--hazard)}
  .move-btn:disabled{opacity:.3;cursor:not-allowed}
  .move-btn:disabled:hover{background:var(--panel);color:var(--paper);border-color:var(--line)}

  .empty{padding:26px 10px;text-align:center;color:var(--muted);font-size:12px;border:1px dashed var(--line);border-radius:6px}

  /* 新建弹层 */
  .overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.55);
    display:none;align-items:center;justify-content:center;z-index:50;
  }
  .overlay.open{display:flex}
  .modal{
    width:400px;max-width:92vw;background:var(--panel);
    border:1px solid var(--line);border-radius:10px;box-shadow:0 18px 40px rgba(0,0,0,.5);
    padding:22px;color:var(--paper);
  }
  .modal h2{font-size:16px;color:var(--white);margin-bottom:16px;display:flex;align-items:center;gap:8px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;letter-spacing:1px}
  .field input,.field select{
    width:100%;padding:10px 12px;border-radius:6px;border:1px solid var(--line);
    background:var(--ink);color:var(--paper);font-size:14px;font-family:inherit;
  }
  .field input:focus,.field select:focus{outline:2px solid var(--hazard);outline-offset:1px;border-color:var(--hazard)}
  .modal-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:6px}

  .toast{
    position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);
    background:var(--hazard);color:var(--ink);font-weight:700;font-size:13px;
    padding:11px 20px;border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.4);
    opacity:0;pointer-events:none;transition:opacity .18s ease, transform .18s ease;z-index:60;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (max-width:768px){
    .wrap{padding:14px}
    header{flex-wrap:wrap}
    .hdr-mid{order:3;width:100%}
    .board{grid-template-columns:1fr 1fr}
  }
  @media (max-width:560px){
    .board{grid-template-columns:1fr}
  }
  @media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <span class="brand-mark"></span>
      <div>
        <h1>城建西区 · 施工看板</h1>
        <small>CONSTRUCTION SITE BOARD</small>
      </div>
    </div>
    <div class="hdr-mid">
      <div class="hdr-stat">本周任务<b id="stat-total">0</b></div>
      <div class="hdr-stat">施工中<b id="stat-doing">0</b></div>
      <div class="hdr-stat">已交付<b id="stat-done">0</b></div>
    </div>
    <div class="hdr-right">
      <div class="date">2025 年 3 月 18 日<b>星期二 · 晴</b></div>
      <button class="btn btn-primary" id="newTaskBtn">＋ 新建任务</button>
    </div>
  </header>

  <main class="board" id="board">
    <section class="col" data-col="0">
      <div class="col-head">
        <div class="col-title">待开工<span class="col-count">0</span></div>
        <div class="col-note">WAITING · 排队进场</div>
      </div>
      <div class="cards" data-list="0"></div>
    </section>
    <section class="col" data-col="1">
      <div class="col-head">
        <div class="col-title">施工中<span class="col-count">0</span></div>
        <div class="col-note">IN PROGRESS · 现场作业</div>
      </div>
      <div class="cards" data-list="1"></div>
    </section>
    <section class="col" data-col="2">
      <div class="col-head">
        <div class="col-title">待验收<span class="col-count">0</span></div>
        <div class="col-note">REVIEW · 监理核验</div>
      </div>
      <div class="cards" data-list="2"></div>
    </section>
    <section class="col" data-col="3">
      <div class="col-head">
        <div class="col-title">已交付<span class="col-count">0</span></div>
        <div class="col-note">DONE · 归档移交</div>
      </div>
      <div class="cards" data-list="3"></div>
    </section>
  </main>
</div>

<div class="overlay" id="overlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h2 id="modalTitle">＋ 新建任务</h2>
    <div class="field">
      <label for="taskName">任务名称</label>
      <input id="taskName" type="text" placeholder="例如：消防管道打压">
    </div>
    <div class="field">
      <label for="taskPri">优先级</label>
      <select id="taskPri">
        <option value="mid">普通</option>
        <option value="high">高 · 安全相关</option>
      </select>
    </div>
    <div class="field">
      <label for="taskOwner">负责人</label>
      <input id="taskOwner" type="text" placeholder="例如：李工">
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" id="cancelBtn">取消</button>
      <button class="btn btn-primary" id="addBtn">添加任务</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  /* 初始任务数据 */
  var seed = [
    {t:"基坑降水作业", p:"high", o:"张工", z:"A 区 · 负一层", c:0},
    {t:"钢筋笼吊装", p:"mid", o:"李工", z:"B 区 · 塔吊", c:0},
    {t:"地下二层浇筑", p:"high", o:"王工", z:"C 区 · 负二层", c:1},
    {t:"外架拆除", p:"mid", o:"赵工", z:"D 区 · 东立面", c:1},
    {t:"塔吊基础验收", p:"high", o:"孙工", z:"A 区 · 主塔", c:2},
    {t:"A 栋幕墙预埋", p:"mid", o:"周工", z:"A 栋 · 1–8 层", c:3}
  ];
  var seq = seed.length;

  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

  function makeCard(d, id){
    var el = document.createElement('div');
    el.className = 'card';
    el.tabIndex = 0;
    el.dataset.id = id;
    el.innerHTML =
      '<span class="tape"></span>' +
      '<div class="card-top">' +
        '<span class="card-title">' + esc(d.t) + '</span>' +
        '<span class="badge ' + (d.p==='high' ? 'badge-high' : 'badge-mid') + '">' + (d.p==='high' ? '高' : '普通') + '</span>' +
      '</div>' +
      '<div class="card-meta">' +
        '<span class="card-zone">' + esc(d.z) + '</span>' +
        '<span class="card-ops">' +
          '<span class="avatar">' + esc(d.o.charAt(0)) + '</span>' +
          '<button class="move-btn" data-dir="-1" aria-label="退回上一列">◀</button>' +
          '<button class="move-btn" data-dir="1" aria-label="推进下一列">▶</button>' +
        '</span>' +
      '</div>';
    return el;
  }

  function render(){
    var lists = document.querySelectorAll('.cards');
    lists.forEach(function(l){ l.innerHTML = ''; });
    seed.forEach(function(d, i){
      var el = makeCard(d, i);
      document.querySelector('[data-list="'+d.c+'"]').appendChild(el);
    });
    refreshCounts();
    refreshButtons();
  }

  function refreshCounts(){
    for (var c=0; c<4; c++){
      var n = seed.filter(function(d){ return d.c===c; }).length;
      document.querySelector('.col[data-col="'+c+'"] .col-count').textContent = n;
    }
    document.getElementById('stat-total').textContent = seed.length;
    document.getElementById('stat-doing').textContent = seed.filter(function(d){ return d.c===1; }).length;
    document.getElementById('stat-done').textContent = seed.filter(function(d){ return d.c===3; }).length;
  }

  function refreshButtons(){
    seed.forEach(function(d, i){
      var card = document.querySelector('.card[data-id="'+i+'"]');
      if (!card) return;
      card.querySelector('[data-dir="-1"]').disabled = (d.c === 0);
      card.querySelector('[data-dir="1"]').disabled = (d.c === 3);
    });
  }

  function move(id, dir){
    var d = seed[id];
    var target = d.c + dir;
    if (target < 0 || target > 3) return;
    d.c = target;
    render();
    showToast('任务「' + d.t + '」已移动到「' + colName(target) + '」');
  }

  function colName(c){ return ['待开工','施工中','待验收','已交付'][c]; }

  function showToast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(function(){ t.classList.remove('show'); }, 2200);
  }

  /* 事件委托：点击卡片推进、点击移动按钮移动 */
  document.getElementById('board').addEventListener('click', function(e){
    var btn = e.target.closest('.move-btn');
    var card = e.target.closest('.card');
    if (!card) return;
    var id = Number(card.dataset.id);
    if (btn){ move(id, Number(btn.dataset.dir)); }
    else { move(id, 1); }
  });

  /* 新建任务 */
  var overlay = document.getElementById('overlay');
  document.getElementById('newTaskBtn').addEventListener('click', function(){
    document.getElementById('taskName').value = '';
    document.getElementById('taskOwner').value = '';
    overlay.classList.add('open');
    document.getElementById('taskName').focus();
  });
  document.getElementById('cancelBtn').addEventListener('click', function(){
    overlay.classList.remove('open');
  });
  document.getElementById('addBtn').addEventListener('click', function(){
    var name = document.getElementById('taskName').value.trim();
    if (!name){ showToast('请先填写任务名称'); return; }
    var owner = document.getElementById('taskOwner').value.trim() || '待分派';
    var pri = document.getElementById('taskPri').value;
    seed.unshift({t:name, p:pri, o:owner, z:"新任务 · 待定工区", c:0});
    render();
    overlay.classList.remove('open');
    showToast('已新建任务「' + name + '」');
  });
  overlay.addEventListener('click', function(e){
    if (e.target === overlay) overlay.classList.remove('open');
  });

  render();
</script>
</body>
</html>
