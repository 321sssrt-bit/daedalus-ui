<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>夜航 · 写文章</title>
<style>
  :root {
    --bg: #0c1120;
    --surface: #161e36;
    --surface2: #1b2542;
    --cyan: #6ee7ff;
    --text: #e6ecff;
    --muted: #56618f;
    --accent: #8ea2ff;
    --border: #242f52;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", "Helvetica Neue", sans-serif;
    background: radial-gradient(circle at 50% 12%, #131c36 0%, #070b16 70%);
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 20px; color: var(--text);
  }
  .phone {
    width: 390px; height: 844px;
    background: var(--bg);
    border: 1px solid #2b3660;
    border-radius: 46px;
    box-shadow: 0 30px 80px rgba(0,0,0,.65), 0 4px 18px rgba(0,0,0,.4);
    overflow: hidden; position: relative;
  }
  .screen { height: 100%; overflow-y: auto; padding: 0 22px 24px; display: flex; flex-direction: column; }

  .statusbar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px 4px 0; font-size: 13px; color: var(--muted); letter-spacing: .5px;
  }
  .sb-icons { font-size: 12px; letter-spacing: 1px; }

  .topbar { display: flex; align-items: center; gap: 6px; margin: 8px 0 2px; }
  .back { width: 36px; height: 36px; border-radius: 50%; border: none; background: transparent; color: var(--text); font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .back:active { background: rgba(255,255,255,.08); }
  .top-title { font-size: 15px; color: var(--muted); letter-spacing: 2px; flex: 1; }
  .ghost-btn { border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 999px; padding: 8px 14px; font-size: 13px; cursor: pointer; }
  .ghost-btn:active { background: var(--surface2); }
  .publish-btn { border: none; background: var(--accent); color: #0b1030; border-radius: 999px; padding: 8px 16px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .publish-btn:active { filter: brightness(.92); }

  /* 标题输入 */
  .title-wrap { position: relative; margin-top: 10px; }
  #titleInput {
    width: 100%; border: none; outline: none; background: transparent;
    font-size: 24px; font-weight: 700; color: var(--text); line-height: 1.4;
    caret-color: var(--cyan); padding: 6px 0;
  }
  #titleInput::placeholder { color: #3c466e; }
  .glow-line {
    position: absolute; left: 0; right: 0; bottom: 0; height: 2px; border-radius: 1px;
    background: linear-gradient(90deg, var(--cyan), transparent 70%);
    opacity: 0; transition: opacity .2s;
  }
  .title-wrap:focus-within .glow-line { opacity: 1; }

  /* 正文输入 */
  .body-wrap { flex: 1; display: flex; flex-direction: column; margin-top: 8px; }
  #bodyInput {
    flex: 1; width: 100%; resize: none; border: none; outline: none; background: transparent;
    font-size: 16px; line-height: 1.9; color: var(--text); caret-color: var(--cyan);
    padding: 4px 0;
  }
  #bodyInput::placeholder { color: #3c466e; }

  .err { color: #ff8d8d; font-size: 12px; margin-top: 6px; min-height: 18px; }

  /* 底部状态 */
  .footer {
    display: flex; align-items: center; justify-content: space-between;
    border-top: 1px solid var(--border); padding-top: 14px; margin-top: 10px;
    font-size: 12px; color: var(--muted);
  }
  .status { display: flex; align-items: center; gap: 8px; }
  .status .state { color: var(--text); }
  .state.saved { color: #7ee6a8; }
  .state.published { color: var(--cyan); }
  .caret { color: var(--cyan); animation: blink 1.1s steps(1) infinite; text-shadow: 0 0 8px rgba(110,231,255,.9); font-size: 15px; }
  @keyframes blink { 50% { opacity: 0; } }
  .count { font-variant-numeric: tabular-nums; }

  /* 成功浮层 */
  .overlay {
    position: absolute; inset: 0; background: rgba(7,11,22,.92);
    display: none; align-items: center; justify-content: center; z-index: 10; padding: 30px;
  }
  .overlay.show { display: flex; }
  .overlay .card {
    width: 100%; background: var(--surface); border: 1px solid var(--border);
    border-radius: 22px; padding: 34px 26px; text-align: center;
  }
  .overlay .check {
    width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 18px;
    background: linear-gradient(135deg, var(--cyan), var(--accent));
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 10px 30px rgba(110,231,255,.35);
  }
  .overlay .check svg { width: 30px; height: 30px; fill: none; stroke: #0b1030; stroke-width: 3; }
  .overlay h2 { font-size: 20px; margin-bottom: 8px; }
  .overlay p { color: var(--muted); font-size: 14px; line-height: 1.7; }
  .overlay .sum { color: var(--text); font-weight: 600; }
  .overlay .again { margin-top: 24px; width: 100%; border: none; background: var(--accent); color: #0b1030; font-size: 15px; font-weight: 600; border-radius: 12px; padding: 13px; cursor: pointer; }
  .overlay .again:active { filter: brightness(.92); }

  @media (max-width: 430px) {
    body { padding: 0; }
    .phone { width: 100vw; height: 100vh; border: none; border-radius: 0; box-shadow: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
  <div class="phone">
    <div class="screen">
      <div class="statusbar"><span>21:47</span><span class="sb-icons">☾ &nbsp;●&nbsp; ▮▮</span></div>
      <header class="topbar">
        <button class="back" id="backBtn" aria-label="返回">‹</button>
        <span class="top-title">新文章</span>
        <button class="ghost-btn" id="draftBtn">存草稿</button>
        <button class="publish-btn" id="publishBtn">发布</button>
      </header>

      <div class="title-wrap">
        <input id="titleInput" type="text" placeholder="写一个标题…" autocomplete="off">
        <div class="glow-line"></div>
      </div>

      <div class="body-wrap">
        <textarea id="bodyInput" placeholder="从这里开始写正文。深夜码字，光标会在黑暗中替你领路。"></textarea>
        <p class="err" id="errText"></p>
      </div>

      <div class="footer">
        <div class="status">
          <span class="caret">▍</span>
          <span class="state" id="stateText">未保存</span>
        </div>
        <span class="count">共 <b id="countNum">0</b> 字</span>
      </div>
    </div>

    <div class="overlay" id="overlay">
      <div class="card">
        <div class="check">
          <svg viewBox="0 0 24 24"><path d="M4 12.5 9.5 18 20 6.5"/></svg>
        </div>
        <h2>发布成功</h2>
        <p>你的文章已发布到「夜航」</p>
        <p class="sum" id="sumText"></p>
        <button class="again" id="againBtn">写新一篇</button>
      </div>
    </div>
  </div>

<script>
  /* 实时字数 + 存草稿 + 发布校验/成功态 */
  var titleInput = document.getElementById('titleInput');
  var bodyInput = document.getElementById('bodyInput');
  var countNum = document.getElementById('countNum');
  var stateText = document.getElementById('stateText');
  var errText = document.getElementById('errText');
  var overlay = document.getElementById('overlay');
  var sumText = document.getElementById('sumText');

  function charCount(s) { return (s.replace(/\s+/g, '').length); }
  function updateCount() {
    var n = charCount(titleInput.value) + charCount(bodyInput.value);
    countNum.textContent = n;
  }
  titleInput.addEventListener('input', updateCount);
  bodyInput.addEventListener('input', updateCount);

  function setState(cls, text) {
    stateText.className = 'state' + (cls ? ' ' + cls : '');
    stateText.textContent = text;
  }

  document.getElementById('draftBtn').addEventListener('click', function () {
    setState('saved', '已存草稿 · 21:47');
    errText.textContent = '';
  });

  document.getElementById('publishBtn').addEventListener('click', function () {
    var t = titleInput.value.trim();
    var b = bodyInput.value.trim();
    if (!t) { errText.textContent = '标题不能为空'; titleInput.focus(); return; }
    if (!b) { errText.textContent = '正文不能为空'; bodyInput.focus(); return; }
    errText.textContent = '';
    setState('published', '已发布');
    sumText.textContent = '《' + t + '》 · ' + charCount(b) + ' 字';
    overlay.classList.add('show');
  });

  document.getElementById('againBtn').addEventListener('click', function () {
    overlay.classList.remove('show');
    titleInput.value = '';
    bodyInput.value = '';
    updateCount();
    setState('', '未保存');
  });

  document.getElementById('backBtn').addEventListener('click', function () {
    setState('saved', '已存草稿 · 21:47');
  });

  updateCount();
</script>
</body>
</html>
