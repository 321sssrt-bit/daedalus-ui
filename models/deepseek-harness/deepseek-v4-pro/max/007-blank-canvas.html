<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>留白画室 · 欢迎</title>
<style>
  :root{
    --page:#fbfbfa;
    --surface:#ffffff;
    --ink:#141414;
    --muted:#7a7a74;
    --hairline:#e8e8e2;
    --fill:#ecece6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,"Segoe UI","Microsoft YaHei","PingFang SC","Helvetica Neue",sans-serif;
    background:var(--page);
    color:var(--ink);
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
    display:flex;
    flex-direction:column;
  }
  .serif{font-family:Georgia,"Times New Roman","Songti SC","STSong","SimSun",serif}
  a{color:inherit}

  /* 顶部导航 */
  header{
    height:64px;flex:0 0 auto;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 40px;
    background:var(--surface);
    border-bottom:1px solid var(--hairline);
  }
  .brand{display:flex;align-items:center;gap:10px}
  .brand .mark{width:20px;height:20px;border:1.5px solid var(--ink);border-radius:5px;position:relative}
  .brand .mark::after{content:"";position:absolute;left:4px;top:4px;width:9px;height:9px;background:var(--ink)}
  .brand .name{font-size:15px;letter-spacing:.14em;font-weight:600}
  .nav{display:flex;align-items:center;gap:24px}
  .nav a{color:var(--muted);text-decoration:none;font-size:13px;letter-spacing:.04em}
  .nav a:hover{color:var(--ink)}
  .nav .active{color:var(--ink);position:relative}
  .nav .active::after{content:"";position:absolute;left:0;right:0;bottom:-7px;height:1px;background:var(--ink)}
  .avatar{width:30px;height:30px;border-radius:50%;background:var(--ink);color:#ffffff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}

  /* 主舞台 */
  .stage{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 40px 80px;overflow:auto}
  .empty{display:flex;flex-direction:column;align-items:center;text-align:center;max-width:560px}
  .canvas-art{margin-bottom:34px}
  .canvas-art svg{display:block}
  h1{
    font-size:56px;line-height:1.15;font-weight:400;letter-spacing:.02em;
    margin-bottom:18px;
  }
  .rule{width:44px;height:1px;background:var(--ink);margin:0 0 22px}
  .lead{font-size:16px;color:var(--muted);max-width:420px;margin-bottom:38px}
  .actions{display:flex;gap:14px}
  .btn{
    appearance:none;border:0;cursor:pointer;
    font-family:inherit;font-size:14px;letter-spacing:.04em;
    height:46px;padding:0 28px;border-radius:8px;
    transition:background .18s ease,color .18s ease,border-color .18s ease,transform .18s ease;
  }
  .btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .btn.primary{background:var(--ink);color:#ffffff}
  .btn.primary:hover{background:#2c2c2c}
  .btn.primary:active{transform:translateY(1px)}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--hairline)}
  .btn.ghost:hover{border-color:var(--ink);background:var(--fill)}

  /* 示例作品条 */
  .samples{width:100%;max-width:980px;margin-top:56px}
  .samples .head{display:flex;align-items:baseline;justify-content:space-between;padding-bottom:14px;border-bottom:1px solid var(--hairline);margin-bottom:22px}
  .samples .head h2{font-size:20px;font-weight:400;letter-spacing:.06em}
  .samples .head span{font-size:12px;color:var(--muted)}
  .sample-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
  .sample-card{background:var(--surface);border:1px solid var(--hairline);border-radius:10px;overflow:hidden}
  .sample-card .thumb{height:150px;background:var(--fill);display:flex;align-items:center;justify-content:center}
  .sample-card .meta{padding:14px 16px 16px}
  .sample-card .meta h3{font-size:14px;font-weight:600;letter-spacing:.03em}
  .sample-card .meta p{font-size:12px;color:var(--muted);margin-top:3px}

  /* 我的作品 */
  .works{width:100%;max-width:980px;margin-top:56px}
  .works .head{padding-bottom:14px;border-bottom:1px solid var(--hairline);margin-bottom:22px}
  .works .head h2{font-size:20px;font-weight:400;letter-spacing:.06em}
  .works-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
  .work-card{background:var(--surface);border:1px solid var(--hairline);border-radius:10px;overflow:hidden;transition:border-color .18s ease}
  .work-card:hover{border-color:var(--ink)}
  .work-card .thumb{height:150px;background:var(--page);border-bottom:1px solid var(--hairline);display:flex;align-items:center;justify-content:center}
  .work-card .meta{padding:14px 16px 16px}
  .work-card .meta h3{font-size:14px;font-weight:600;letter-spacing:.03em}
  .work-card .meta p{font-size:12px;color:var(--muted);margin-top:3px}

  /* 弹窗 */
  .modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:24px}
  .modal[hidden]{display:none}
  .modal-backdrop{position:absolute;inset:0;background:rgba(20,20,20,.28);animation:fadeIn .18s ease}
  .modal-card{
    position:relative;width:400px;max-width:100%;
    background:var(--surface);border:1px solid var(--hairline);border-radius:12px;
    padding:30px 30px 26px;box-shadow:0 24px 60px rgba(0,0,0,.14);
    animation:riseIn .22s ease;
  }
  .modal-card h3{font-size:22px;font-weight:400;letter-spacing:.04em;margin-bottom:6px}
  .modal-card .hint{font-size:13px;color:var(--muted);margin-bottom:20px}
  .modal-card label{display:block;font-size:12px;color:var(--muted);letter-spacing:.08em;margin-bottom:8px}
  .modal-card input{
    width:100%;height:44px;padding:0 14px;font-size:15px;font-family:inherit;
    border:1px solid var(--hairline);border-radius:8px;background:var(--page);color:var(--ink);
  }
  .modal-card input:focus{outline:none;border-color:var(--ink);background:#ffffff}
  .modal-actions{display:flex;justify-content:flex-end;gap:12px;margin-top:24px}

  /* 提示 */
  .toast{
    position:fixed;left:50%;bottom:36px;transform:translateX(-50%);
    background:var(--ink);color:#ffffff;font-size:13px;letter-spacing:.03em;
    padding:11px 20px;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.18);
    z-index:60;animation:toastIn .22s ease;
  }
  .toast[hidden]{display:none}

  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes riseIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes toastIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}

  /* 768 断点 */
  @media (max-width:768px){
    header{padding:0 20px}
    .nav a{display:none}
    .nav .active{display:block}
    .stage{padding:40px 20px 64px}
    h1{font-size:40px}
    .actions{flex-direction:column;width:100%;max-width:320px}
    .actions .btn{width:100%}
    .sample-grid,.works-grid{grid-template-columns:1fr}
  }

  @media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
  <header>
    <div class="brand">
      <span class="mark"></span>
      <span class="name">留白画室</span>
    </div>
    <nav class="nav">
      <a class="active" href="#">工作台</a>
      <a href="#">我的作品</a>
      <a href="#">收藏</a>
      <a href="#">帮助</a>
    </nav>
    <div class="right" style="display:flex;align-items:center;gap:16px">
      <span class="avatar">林</span>
    </div>
  </header>

  <main class="stage">
    <section class="empty" id="emptyView">
      <figure class="canvas-art" aria-hidden="true">
        <svg viewBox="0 0 360 240" width="360" height="240" role="img">
          <rect x="18" y="14" width="324" height="212" rx="5" fill="#ffffff" stroke="#e8e8e2" stroke-width="1.5"/>
          <line x1="18" y1="158" x2="342" y2="158" stroke="#e8e8e2" stroke-width="1.5"/>
          <circle cx="256" cy="92" r="20" fill="#ecece6"/>
          <line x1="18" y1="110" x2="342" y2="110" stroke="#e8e8e2" stroke-width="1"/>
        </svg>
      </figure>
      <h1 class="serif">你的画布还空着</h1>
      <div class="rule"></div>
      <p class="lead">登录后还没有任何作品。新建第一块画布，或先看看别人怎么留白。</p>
      <div class="actions">
        <button class="btn primary" id="newBtn">新建画布</button>
        <button class="btn ghost" id="browseBtn">浏览示例作品</button>
      </div>
    </section>

    <section class="samples" id="sampleStrip" hidden>
      <div class="head">
        <h2 class="serif">示例作品</h2>
        <span>来自公开画廊</span>
      </div>
      <div class="sample-grid">
        <div class="sample-card">
          <div class="thumb"><svg viewBox="0 0 200 120" width="180" height="120"><rect x="20" y="18" width="160" height="84" fill="#ffffff"/><path d="M20 92 L90 40 L130 70 L180 30" fill="none" stroke="#141414" stroke-width="2"/></svg></div>
          <div class="meta"><h3>雾山</h3><p>陈屿 · 布面水墨</p></div>
        </div>
        <div class="sample-card">
          <div class="thumb"><svg viewBox="0 0 200 120" width="180" height="120"><circle cx="100" cy="60" r="38" fill="none" stroke="#141414" stroke-width="2"/><circle cx="100" cy="60" r="18" fill="#ecece6"/></svg></div>
          <div class="meta"><h3>风谷</h3><p>周岚 · 数字绘画</p></div>
        </div>
        <div class="sample-card">
          <div class="thumb"><svg viewBox="0 0 200 120" width="180" height="120"><rect x="40" y="44" width="120" height="40" fill="none" stroke="#141414" stroke-width="2"/><line x1="40" y1="44" x2="160" y2="84" stroke="#141414" stroke-width="2"/></svg></div>
          <div class="meta"><h3>静物 · 陶</h3><p>方岸 · 线稿</p></div>
        </div>
      </div>
    </section>

    <section class="works" id="worksView" hidden>
      <div class="head"><h2 class="serif">我的作品</h2></div>
      <div class="works-grid" id="worksGrid"></div>
    </section>
  </main>

  <div class="modal" id="modal" hidden>
    <div class="modal-backdrop" id="modalBackdrop"></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h3 class="serif" id="modalTitle">新建画布</h3>
      <p class="hint">给它一个名字，之后随时可以改。</p>
      <label for="canvasName">画布名称</label>
      <input id="canvasName" type="text" placeholder="例如：晨雾" maxlength="24">
      <div class="modal-actions">
        <button class="btn ghost" id="cancelBtn">取消</button>
        <button class="btn primary" id="confirmBtn">创建</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script>
    /* 元素引用 */
    var newBtn = document.getElementById('newBtn');
    var browseBtn = document.getElementById('browseBtn');
    var sampleStrip = document.getElementById('sampleStrip');
    var emptyView = document.getElementById('emptyView');
    var worksView = document.getElementById('worksView');
    var worksGrid = document.getElementById('worksGrid');
    var modal = document.getElementById('modal');
    var modalBackdrop = document.getElementById('modalBackdrop');
    var cancelBtn = document.getElementById('cancelBtn');
    var confirmBtn = document.getElementById('confirmBtn');
    var canvasName = document.getElementById('canvasName');
    var toast = document.getElementById('toast');

    function showToast(msg){
      toast.textContent = msg;
      toast.hidden = false;
      window.clearTimeout(showToast._t);
      showToast._t = window.setTimeout(function(){ toast.hidden = true; }, 2600);
    }

    function openModal(){
      canvasName.value = '';
      modal.hidden = false;
      canvasName.focus();
    }
    function closeModal(){ modal.hidden = true; }

    newBtn.addEventListener('click', openModal);
    modalBackdrop.addEventListener('click', closeModal);
    cancelBtn.addEventListener('click', closeModal);
    canvasName.addEventListener('keydown', function(e){
      if(e.key === 'Enter'){ confirmBtn.click(); }
    });
    window.addEventListener('keydown', function(e){
      if(e.key === 'Escape' && !modal.hidden){ closeModal(); }
    });

    confirmBtn.addEventListener('click', function(){
      var name = canvasName.value.trim() || '未命名画布';
      closeModal();
      emptyView.hidden = true;
      worksView.hidden = false;
      var card = document.createElement('div');
      card.className = 'work-card';
      card.innerHTML = '<div class="thumb"><svg viewBox="0 0 200 120" width="180" height="120"><rect x="20" y="18" width="160" height="84" fill="#ffffff" stroke="#e8e8e2"/><line x1="20" y1="80" x2="180" y2="80" stroke="#ecece6"/></svg></div>' +
        '<div class="meta"><h3>' + name + '</h3><p>空白画布 · 刚刚创建</p></div>';
      worksGrid.appendChild(card);
      showToast('已创建画布「' + name + '」');
      sampleStrip.hidden = true;
      browseBtn.textContent = '浏览示例作品';
    });

    browseBtn.addEventListener('click', function(){
      var willShow = sampleStrip.hidden;
      sampleStrip.hidden = !willShow;
      browseBtn.textContent = willShow ? '收起示例' : '浏览示例作品';
    });
  </script>
</body>
</html>
