<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>珊瑚聊 · 即时通讯</title>
<style>
  :root {
    --page: #faf0ec;
    --surface: #ffffff;
    --coral: #ff6f61;
    --coral-deep: #d94f3d;
    --ink: #3a2b28;
    --muted: #8f7d78;
    --bubble-in: #f3e9e5;
    --danger: #c0392b;
    --online: #3fae7a;
    --line: #efe2dd;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", "Helvetica Neue", sans-serif;
    color: var(--ink);
    background: radial-gradient(1200px 700px at 50% 0%, #f7ded7 0%, #efc6bb 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .phone {
    width: 390px;
    height: 844px;
    background: var(--page);
    border: 8px solid var(--coral-deep);
    border-radius: 46px;
    box-shadow: 0 30px 60px rgba(58, 43, 40, 0.28);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
  }
  @media (max-width: 430px) {
    body { align-items: stretch; }
    .phone {
      width: 100vw;
      height: 100vh;
      max-width: 100vw;
      max-height: 100vh;
      border-radius: 0;
      border: none;
      box-shadow: none;
    }
  }
  .statusbar {
    height: 28px;
    flex: 0 0 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    font-size: 13px;
    font-weight: 600;
    color: var(--coral-deep);
    background: var(--page);
  }
  .sb-right { display: flex; align-items: center; gap: 6px; }
  .sb-bars { letter-spacing: 1px; color: var(--coral); }
  .sb-batt {
    width: 22px; height: 11px;
    border: 1.5px solid var(--coral-deep);
    border-radius: 3px;
    position: relative;
  }
  .sb-batt::after {
    content: "";
    position: absolute; right: -4px; top: 2px;
    width: 2px; height: 5px;
    background: var(--coral-deep);
    border-radius: 1px;
  }
  .sb-batt::before {
    content: "";
    position: absolute; left: 2px; top: 2px; bottom: 2px; width: 14px;
    background: var(--coral);
    border-radius: 1px;
  }
  .screen { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .view { display: flex; flex-direction: column; height: 100%; min-height: 0; }

  /* 列表页 */
  .appbar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 16px 12px;
  }
  .appbar-title { flex: 1; font-size: 22px; font-weight: 700; }
  .add-btn {
    width: 34px; height: 34px;
    border: none; background: var(--coral);
    color: #ffffff;
    border-radius: 12px;
    font-size: 20px; line-height: 1;
    cursor: pointer;
  }
  .add-btn:active { background: var(--coral-deep); }
  .body { flex: 1; min-height: 0; overflow-y: auto; padding: 0 16px 12px; }
  .body::-webkit-scrollbar { width: 0; }
  .search {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border: 1.5px solid var(--line);
    border-radius: 14px;
    padding: 11px 14px;
    margin-bottom: 14px;
    color: var(--muted);
    font-size: 14px;
  }
  .conv-list { display: flex; flex-direction: column; gap: 4px; }
  .conv {
    display: flex;
    align-items: center;
    gap: 12px;
    border: none;
    background: transparent;
    border-radius: 16px;
    padding: 12px 10px;
    cursor: pointer;
    text-align: left;
    width: 100%;
  }
  .conv:active { background: var(--bubble-in); }
  .avatar {
    width: 50px; height: 50px;
    border-radius: 50%;
    background: #ffd9d2;
    color: var(--coral-deep);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 700;
    flex: 0 0 auto;
  }
  .conv-meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .conv-meta b { font-size: 16px; font-weight: 600; }
  .conv-meta i {
    font-style: normal; font-size: 13px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .conv-right { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; flex: 0 0 auto; }
  .conv-right em { font-style: normal; font-size: 12px; color: var(--muted); }
  .unread {
    min-width: 20px; height: 20px;
    padding: 0 6px;
    border-radius: 999px;
    background: var(--coral);
    color: #ffffff;
    font-size: 12px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .divider { height: 1px; background: var(--line); margin: 4px 8px; }

  /* 会话页 */
  .chatbar { border-bottom: 1px solid var(--line); background: var(--surface); }
  .back {
    width: 34px; height: 34px;
    border: none; background: transparent;
    border-radius: 12px;
    font-size: 22px; line-height: 1;
    color: var(--coral-deep);
    cursor: pointer;
  }
  .back:active { background: var(--bubble-in); }
  .chat-title { flex: 1; display: flex; flex-direction: column; }
  .c-name { font-size: 16px; font-weight: 700; }
  .c-status { font-size: 12px; color: var(--online); }
  .c-status.away { color: var(--muted); }
  .net { display: flex; align-items: center; gap: 7px; cursor: pointer; }
  .net input { display: none; }
  .net-text { font-size: 12px; font-weight: 600; color: var(--online); }
  .net-text.off { color: var(--danger); }
  .net-track {
    width: 40px; height: 22px;
    border-radius: 999px;
    background: #d9d0cc;
    position: relative;
    transition: background 0.2s ease;
  }
  .net-thumb {
    position: absolute; top: 2px; left: 2px;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: #ffffff;
    transition: left 0.2s ease;
  }
  .net input:checked + .net-track { background: var(--online); }
  .net input:checked + .net-track .net-thumb { left: 20px; }
  .offline-banner {
    flex: 0 0 auto;
    background: #fdecea;
    color: var(--danger);
    font-size: 12px;
    text-align: center;
    padding: 8px 16px;
    border-bottom: 1px solid #f6d8d2;
  }
  .msgs {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msgs::-webkit-scrollbar { width: 0; }
  .day { align-self: center; font-size: 11px; color: var(--muted); background: var(--bubble-in); border-radius: 999px; padding: 4px 12px; }
  .msg { display: flex; flex-direction: column; max-width: 78%; }
  .msg.in { align-self: flex-start; align-items: flex-start; }
  .msg.out { align-self: flex-end; align-items: flex-end; }
  .bubble {
    padding: 11px 14px;
    border-radius: 18px;
    font-size: 15px;
    line-height: 1.45;
    word-break: break-word;
  }
  .msg.in .bubble { background: var(--bubble-in); color: var(--ink); border-bottom-left-radius: 6px; }
  .msg.out .bubble { background: var(--coral); color: #ffffff; border-bottom-right-radius: 6px; }
  .msg.out .bubble.failed { background: #f6d8d2; color: var(--danger); cursor: pointer; }
  .status { font-size: 11px; margin-top: 4px; color: var(--muted); }
  .status.delivered { color: var(--online); }
  .status.failed { color: var(--danger); font-weight: 600; cursor: pointer; }
  .status.sending { color: var(--muted); }
  /* 输入区 */
  .composer {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px 14px;
    background: var(--surface);
    border-top: 1px solid var(--line);
  }
  .composer input {
    flex: 1;
    height: 44px;
    border: 1.5px solid var(--line);
    border-radius: 22px;
    padding: 0 16px;
    font-size: 15px;
    color: var(--ink);
    background: var(--page);
    outline: none;
  }
  .composer input:focus { border-color: var(--coral); }
  .send {
    height: 44px;
    padding: 0 20px;
    border: none;
    border-radius: 22px;
    background: var(--coral);
    color: #ffffff;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  .send:active { background: var(--coral-deep); }
  .send:disabled { background: #f2c6bf; color: #ffffff; cursor: not-allowed; }
  /* 提示浮层 */
  .toast {
    position: absolute;
    left: 50%;
    top: 90px;
    transform: translateX(-50%);
    background: rgba(58, 43, 40, 0.92);
    color: #ffffff;
    font-size: 13px;
    padding: 9px 16px;
    border-radius: 999px;
    z-index: 10;
    white-space: nowrap;
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
  <div class="phone">
    <div class="statusbar">
      <span>9:41</span>
      <span class="sb-right"><span class="sb-bars">▂▄▆█</span><span class="sb-batt"></span></span>
    </div>
    <div class="screen">

      <!-- 会话列表 -->
      <div class="view" id="view-list">
        <div class="appbar">
          <span class="appbar-title">消息</span>
          <button class="add-btn" onclick="toast('新建会话')">＋</button>
        </div>
        <div class="body">
          <div class="search">🔍 搜索联系人或消息</div>
          <div class="conv-list" id="conv-list"></div>
        </div>
      </div>

      <!-- 当前会话 -->
      <div class="view" id="view-chat" hidden>
        <div class="appbar chatbar">
          <button class="back" onclick="backList()">‹</button>
          <div class="chat-title">
            <span class="c-name" id="chat-name">林晓雨</span>
            <span class="c-status" id="chat-status">在线</span>
          </div>
          <label class="net">
            <span class="net-text" id="net-text">在线</span>
            <input type="checkbox" id="net-toggle" checked onchange="toggleNet()">
            <span class="net-track"><span class="net-thumb"></span></span>
          </label>
        </div>
        <div class="offline-banner" id="offline-banner" hidden>已断网 · 下一条消息将发送失败，恢复网络后可重试</div>
        <div class="msgs" id="msgs"></div>
        <div class="composer">
          <input id="msg-input" type="text" placeholder="输入消息…" oninput="onInput()" onkeydown="onKey(event)">
          <button class="send" id="send-btn" onclick="send()" disabled>发送</button>
        </div>
      </div>

    </div>
    <div class="toast" id="toast" hidden></div>
  </div>

  <script>
    /* 珊瑚聊即时通讯原型：会话、发送、失败与重试 */
    var msgSeq = 0;
    var state = { online: true, key: null };

    var conversations = {
      lin: { name: '林晓雨', avatar: '林', online: true, time: '10:24', unread: 2, messages: [
        { id: ++msgSeq, from: 'in', text: '这周六有空吗？', status: 'read' },
        { id: ++msgSeq, from: 'out', text: '有的，下午怎么样？', status: 'delivered' },
        { id: ++msgSeq, from: 'in', text: '那就下午三点，老地方见', status: 'read' }
      ]},
      chen: { name: '陈默', avatar: '陈', online: false, time: '09:12', unread: 0, messages: [
        { id: ++msgSeq, from: 'in', text: '文件我发你邮箱了', status: 'read' },
        { id: ++msgSeq, from: 'out', text: '收到，谢谢！', status: 'delivered' }
      ]},
      zhou: { name: '周妍', avatar: '周', online: true, time: '昨天', unread: 1, messages: [
        { id: ++msgSeq, from: 'out', text: '明天见面吗？', status: 'delivered' },
        { id: ++msgSeq, from: 'in', text: '好的，明天见', status: 'read' }
      ]}
    };

    function el(id) { return document.getElementById(id); }
    function esc(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    function nowTime() {
      var t = new Date();
      return pad(t.getHours()) + ':' + pad(t.getMinutes());
    }
    function pad(n) { return (n < 10 ? '0' : '') + n; }

    function renderList() {
      var keys = ['lin', 'chen', 'zhou'];
      var html = '';
      for (var i = 0; i < keys.length; i++) {
        var c = conversations[keys[i]];
        var last = c.messages[c.messages.length - 1];
        var preview = last ? ((last.from === 'out' ? '我：' : '') + last.text) : '';
        html += '<button class="conv" onclick="openChat(\'' + keys[i] + '\')">' +
          '<span class="avatar">' + c.avatar + '</span>' +
          '<span class="conv-meta"><b>' + c.name + '</b><i>' + esc(preview) + '</i></span>' +
          '<span class="conv-right"><em>' + c.time + '</em>' +
          (c.unread > 0 ? '<span class="unread">' + c.unread + '</span>' : '') +
          '</span></button>';
        if (i < keys.length - 1) { html += '<div class="divider"></div>'; }
      }
      el('conv-list').innerHTML = html;
    }

    function openChat(key) {
      state.key = key;
      var c = conversations[key];
      c.unread = 0;
      el('chat-name').textContent = c.name;
      var st = el('chat-status');
      st.textContent = c.online ? '在线' : '离线';
      st.classList.toggle('away', !c.online);
      renderList();
      renderMessages();
      showChat();
    }
    function backList() {
      renderList();
      var list = el('view-list');
      var chat = el('view-chat');
      chat.hidden = true;
      list.hidden = false;
    }
    function showChat() {
      el('view-list').hidden = true;
      el('view-chat').hidden = false;
    }

    function statusHtml(m) {
      if (m.from === 'in') { return ''; }
      if (m.status === 'sending') { return '<span class="status sending">发送中…</span>'; }
      if (m.status === 'failed') { return '<span class="status failed" onclick="retryMsg(' + m.id + ')">⚠ 发送失败 · 点按重试</span>'; }
      return '<span class="status delivered">✓✓ 已送达</span>';
    }

    function renderMessages() {
      if (!state.key) { return; }
      var c = conversations[state.key];
      var html = '<div class="day">今天</div>';
      for (var i = 0; i < c.messages.length; i++) {
        var m = c.messages[i];
        var cls = m.from === 'in' ? 'in' : 'out';
        var bubbleCls = (m.status === 'failed') ? 'bubble failed' : 'bubble';
        var tap = (m.status === 'failed') ? ' onclick="retryMsg(' + m.id + ')"' : '';
        html += '<div class="msg ' + cls + '">' +
          '<span class="' + bubbleCls + '"' + tap + '>' + esc(m.text) + '</span>' +
          statusHtml(m) +
          '</div>';
      }
      el('msgs').innerHTML = html;
      el('msgs').scrollTop = el('msgs').scrollHeight;
    }

    function send() {
      var input = el('msg-input');
      var text = input.value.replace(/^\s+|\s+$/g, '');
      if (!text) { return; }
      input.value = '';
      onInput();
      var c = conversations[state.key];
      var m = { id: ++msgSeq, from: 'out', text: text, status: 'sending' };
      c.messages.push(m);
      c.time = nowTime();
      renderMessages();
      setTimeout(function () {
        m.status = state.online ? 'delivered' : 'failed';
        renderMessages();
        renderList();
      }, 700);
    }

    function retryMsg(id) {
      if (!state.online) {
        toast('请先开启网络再重试');
        return;
      }
      var c = conversations[state.key];
      for (var i = 0; i < c.messages.length; i++) {
        if (c.messages[i].id === id && c.messages[i].status === 'failed') {
          c.messages[i].status = 'sending';
          renderMessages();
          (function (m) {
            setTimeout(function () { m.status = 'delivered'; renderMessages(); renderList(); }, 600);
          })(c.messages[i]);
          break;
        }
      }
    }

    function toggleNet() {
      state.online = el('net-toggle').checked;
      var t = el('net-text');
      t.textContent = state.online ? '在线' : '离线';
      t.classList.toggle('off', !state.online);
      el('offline-banner').hidden = state.online;
    }

    function onInput() {
      el('send-btn').disabled = el('msg-input').value.replace(/^\s+|\s+$/g, '') === '';
    }
    function onKey(e) {
      if (e.key === 'Enter') { e.preventDefault(); send(); }
    }

    function toast(text) {
      var t = el('toast');
      t.textContent = text;
      t.hidden = false;
      clearTimeout(t._timer);
      t._timer = setTimeout(function () { t.hidden = true; }, 1800);
    }

    renderList();
    renderMessages();
  </script>
</body>
</html>
