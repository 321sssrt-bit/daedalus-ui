<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>危险删除 · 工作区控制台</title>
<style>
  :root{
    --bg:#170b0b;
    --panel:#241212;
    --panel-2:#2b1515;
    --line:#4a2a2a;
    --red:#e12e3c;
    --red-deep:#8f1620;
    --stripe:#d9bd4a;
    --text:#f3e9e9;
    --muted:#b9a7a7;
    --sans:-apple-system,"Segoe UI","Microsoft YaHei","PingFang SC","Helvetica Neue",sans-serif;
    --mono:Consolas,"SF Mono","Menlo",monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    font-size:14px;
    line-height:1.6;
    min-height:100vh;
  }
  .hazard{
    height:30px;
    background:repeating-linear-gradient(
      -45deg,
      var(--stripe) 0 16px,
      #241010 16px 32px
    );
    border-bottom:1px solid #000;
  }
  .bar{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 40px;
    background:var(--panel);
    border-bottom:1px solid var(--line);
  }
  .bar .sys{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:13px;letter-spacing:1px;}
  .bar .sys .pulse{width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 0 4px rgba(225,46,60,.22);}
  .bar .crumb{font-size:12px;color:var(--muted);}

  .wrap{max-width:860px;margin:0 auto;padding:40px 24px 64px;}

  .alert-head{
    display:flex;align-items:center;gap:14px;
    border:1px solid var(--red);
    background:linear-gradient(180deg,#2b1515,#241212);
    border-radius:6px;
    padding:16px 20px;
    margin-bottom:26px;
  }
  .alert-head .ico{
    width:40px;height:40px;flex:0 0 40px;
    display:flex;align-items:center;justify-content:center;
    background:var(--red);color:#fff;
    border-radius:4px;font-size:22px;font-weight:700;
  }
  .alert-head h1{margin:0;font-size:18px;font-weight:700;letter-spacing:1px;}
  .alert-head p{margin:2px 0 0;font-size:13px;color:var(--muted);}

  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:6px;
    padding:28px;
  }
  .panel h2{
    margin:0 0 4px;
    font-size:16px;
    font-weight:700;
  }
  .panel .sub{font-size:13px;color:var(--muted);margin:0 0 22px;}
  .target{
    display:flex;align-items:center;gap:14px;
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:6px;
    padding:14px 16px;
    margin-bottom:24px;
  }
  .target .tile{
    width:44px;height:44px;flex:0 0 44px;border-radius:6px;
    background:#3a1414;color:var(--red);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);font-weight:700;font-size:15px;
  }
  .target .name{font-size:15px;font-weight:600;}
  .target .dim{font-size:12px;color:var(--muted);font-family:var(--mono);}

  .lose-title{font-size:13px;color:var(--muted);margin:0 0 10px;letter-spacing:1px;}
  .lose-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-bottom:24px;
  }
  .lose{
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:6px;
    padding:14px;
    text-align:left;
  }
  .lose .n{font-family:var(--mono);font-size:24px;font-weight:700;color:var(--red);line-height:1.2;}
  .lose .l{font-size:12px;color:var(--muted);margin-top:4px;}
  .recover-note{
    font-size:13px;color:var(--muted);
    background:var(--panel-2);
    border:1px dashed var(--line);
    border-radius:6px;
    padding:12px 14px;
    margin-bottom:24px;
  }
  .recover-note strong{color:var(--stripe);}

  .divider{height:1px;background:var(--line);margin:22px 0;}

  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:8px;}
  .phrase{font-family:var(--mono);font-size:14px;color:var(--stripe);}
  .field input[type=text]{
    width:100%;
    background:#120808;
    border:1px solid var(--line);
    border-radius:4px;
    color:var(--text);
    font-family:var(--mono);
    font-size:15px;
    padding:12px 14px;
  }
  .field input[type=text]:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 3px rgba(225,46,60,.18);}
  .hint{font-size:12px;color:var(--muted);margin-top:8px;min-height:16px;}
  .hint.err{color:var(--red);}

  .actions{display:flex;flex-direction:column;gap:10px;margin-top:8px;}
  .btn{
    display:block;width:100%;
    font-family:var(--sans);
    font-size:15px;font-weight:700;
    padding:14px 0;
    border-radius:4px;
    cursor:pointer;
    text-align:center;
    letter-spacing:1px;
    transition:background-color .15s ease,border-color .15s ease,color .15s ease;
  }
  .btn-cancel{
    background:#f3e9e9;
    border:1px solid #f3e9e9;
    color:#170b0b;
  }
  .btn-cancel:hover{background:#fff;}
  .btn-delete{
    background:transparent;
    border:1px solid var(--red);
    color:var(--red);
  }
  .btn-delete:hover:not(:disabled){background:var(--red);color:#fff;}
  .btn-delete:disabled{
    border-color:var(--line);
    color:#6b4a4a;
    cursor:not-allowed;
    background:transparent;
  }
  .safe-note{font-size:12px;color:var(--muted);margin-top:16px;text-align:center;}

  .toast{
    position:fixed;
    left:50%;bottom:36px;
    transform:translateX(-50%) translateY(20px);
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:6px;
    color:var(--text);
    padding:12px 20px;
    font-size:14px;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease,transform .2s ease;
    z-index:10;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast.ok{border-color:var(--stripe);color:var(--stripe);}

  @media (max-width:768px){
    .bar{padding:14px 20px;}
    .lose-grid{grid-template-columns:repeat(2,1fr);}
    .wrap{padding:24px 16px 48px;}
  }
  @media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
  <div class="hazard" aria-hidden="true"></div>
  <header class="bar">
    <div class="sys"><span class="pulse"></span>DATACENTER-04 · 危险操作台</div>
    <div class="crumb">设置 / 工作区 / 删除</div>
  </header>

  <div class="wrap">
    <div class="alert-head">
      <div class="ico">!</div>
      <div>
        <h1>你正在删除整个工作区</h1>
        <p>此操作会清除工作区内所有数据，且默认处于锁定状态，请谨慎判断。</p>
      </div>
    </div>

    <section class="panel" id="panel">
      <h2>删除「红图数据中心」</h2>
      <p class="sub">请先确认你将失去什么，再输入确认词解锁删除。</p>

      <div class="target">
        <div class="tile">红</div>
        <div>
          <div class="name">红图数据中心</div>
          <div class="dim">workspace: hongtu-prod-01</div>
        </div>
      </div>

      <p class="lose-title">删除后，你将永久失去以下内容：</p>
      <div class="lose-grid">
        <div class="lose"><div class="n">3</div><div class="l">个看板</div></div>
        <div class="lose"><div class="n">128</div><div class="l">条记录</div></div>
        <div class="lose"><div class="n">9</div><div class="l">位成员</div></div>
        <div class="lose"><div class="n">42</div><div class="l">份附件</div></div>
      </div>

      <div class="recover-note">
        删除后有 <strong>30 天恢复期</strong>，逾期将永久清除，无法找回。
      </div>

      <div class="divider"></div>

      <div class="field">
        <label for="confirm-word">输入确认词 <span class="phrase">永久删除</span> 以解锁</label>
        <input type="text" id="confirm-word" placeholder="在此输入「永久删除」" autocomplete="off" spellcheck="false">
        <div class="hint" id="hint">删除按钮默认不可用，输入正确确认词后才会解锁。</div>
      </div>

      <div class="actions">
        <button class="btn btn-cancel" id="btn-cancel" type="button" autofocus>取消 · 返回安全区</button>
        <button class="btn btn-delete" id="btn-delete" type="button" disabled>永久删除</button>
      </div>
      <p class="safe-note">取消是最安全的做法，不会产生任何更改。</p>
    </section>

    <div class="toast" id="toast"></div>
  </div>

  <script>
    /* 危险删除：确认词输入正确才解锁删除；取消始终更醒目 */
    var word = document.getElementById('confirm-word');
    var del = document.getElementById('btn-delete');
    var hint = document.getElementById('hint');
    var cancelBtn = document.getElementById('btn-cancel');
    var toast = document.getElementById('toast');
    var panel = document.getElementById('panel');
    var deleted = false;

    function showToast(msg, ok){
      toast.textContent = msg;
      toast.className = 'toast show' + (ok ? ' ok' : '');
      clearTimeout(showToast._t);
      showToast._t = setTimeout(function(){
        toast.className = 'toast';
      }, 2200);
    }

    word.addEventListener('input', function(){
      if(deleted) return;
      var v = word.value.trim();
      if(v === '永久删除'){
        del.disabled = false;
        hint.textContent = '确认词正确，删除按钮已解锁。';
        hint.className = 'hint';
      } else if(v === ''){
        del.disabled = true;
        hint.textContent = '删除按钮默认不可用，输入正确确认词后才会解锁。';
        hint.className = 'hint';
      } else {
        del.disabled = true;
        hint.textContent = '确认词不完整或不对，请输入「永久删除」。';
        hint.className = 'hint err';
      }
    });

    del.addEventListener('click', function(){
      if(del.disabled || deleted) return;
      deleted = true;
      del.textContent = '正在删除…';
      setTimeout(function(){
        panel.innerHTML =
          '<h2>工作区已删除</h2>' +
          '<p class="sub">「红图数据中心」已进入 30 天恢复期。</p>' +
          '<div class="target"><div class="tile">!</div><div>' +
          '<div class="name">已删除 · 保留至 2025-07-14</div>' +
          '<div class="dim">所有数据已锁定，恢复期内可撤销。</div>' +
          '</div></div>' +
          '<div class="recover-note">如需找回，请在恢复期内点击下方<strong>撤销删除</strong>。</div>' +
          '<div class="actions"><button class="btn btn-cancel" id="btn-undo" type="button">撤销删除</button></div>';
        var undo = document.getElementById('btn-undo');
        undo.addEventListener('click', function(){
          location.reload();
        });
        showToast('删除完成，数据已进入恢复期。', true);
      }, 900);
    });

    cancelBtn.addEventListener('click', function(){
      if(deleted) return;
      showToast('已取消，未做任何更改。', false);
      word.value = '';
      del.disabled = true;
      hint.textContent = '删除按钮默认不可用，输入正确确认词后才会解锁。';
      hint.className = 'hint';
    });
  </script>
</body>
</html>
