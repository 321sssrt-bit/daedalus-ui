<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>金门会馆 · 邀请进入</title>
<style>
:root{
  --bg:#0c0a08;
  --panel:#14100b;
  --gold:#d4af37;
  --goldhi:#e7c968;
  --golddim:#8a6d1f;
  --ivory:#ece5d3;
  --muted:#7a7263;
  --err:#c0503a;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:Georgia,"Times New Roman","Songti SC","STSong",serif;
  background:
    radial-gradient(circle at 50% -8%,rgba(212,175,55,.16),transparent 46%),
    radial-gradient(circle at 50% 120%,rgba(212,175,55,.08),transparent 44%),
    var(--bg);
  color:var(--ivory);
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  padding:56px 24px;
}
.gate{
  width:560px;max-width:100%;
  text-align:center;
  position:relative;
  padding:54px 52px 46px;
  background:linear-gradient(180deg,rgba(212,175,55,.05),rgba(212,175,55,0) 30%),var(--panel);
  border:1px solid var(--golddim);
  box-shadow:0 0 0 6px var(--bg),0 0 0 7px var(--golddim),0 30px 70px -20px rgba(0,0,0,.85);
}
.emblem{margin:0 auto 20px;width:84px;height:84px}
.emblem svg{width:100%;height:100%}
.kicker{font-size:13px;letter-spacing:.5em;color:var(--gold);text-transform:uppercase;margin-bottom:12px}
h1{
  font-weight:400;font-size:38px;letter-spacing:.22em;color:var(--ivory);
}
h1 .thin{color:var(--gold)}
.sub{font-size:14px;color:var(--muted);letter-spacing:.12em;margin-top:10px}
.rule{display:flex;align-items:center;justify-content:center;gap:14px;margin:26px auto 30px;max-width:340px}
.rule .line{height:1px;background:linear-gradient(90deg,transparent,var(--golddim));flex:1}
.rule .line:last-child{background:linear-gradient(90deg,var(--golddim),transparent)}
.rule .diamond{width:8px;height:8px;transform:rotate(45deg);background:var(--gold);box-shadow:0 0 10px rgba(212,175,55,.7)}
.field{max-width:340px;margin:0 auto 20px;text-align:left}
.field label{display:block;font-size:13px;letter-spacing:.18em;color:var(--gold);margin-bottom:9px}
.field input{
  width:100%;background:rgba(0,0,0,.35);border:1px solid var(--golddim);
  color:var(--goldhi);font:inherit;font-size:20px;letter-spacing:.34em;text-align:center;
  padding:13px 12px;outline:none;text-transform:uppercase;
  transition:border-color .2s ease, box-shadow .2s ease;
}
.field input::placeholder{color:var(--muted);letter-spacing:.18em;font-size:14px;text-transform:none}
.field input:focus{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 0 18px rgba(212,175,55,.28)}
.field .cap{font-size:12px;color:var(--muted);letter-spacing:.08em;margin-top:8px}
.checkbtn{
  display:block;width:340px;max-width:100%;margin:0 auto;
  border:1px solid var(--gold);background:transparent;color:var(--gold);
  font:inherit;font-size:15px;letter-spacing:.34em;text-indent:.34em;
  padding:14px;cursor:pointer;
  transition:background .2s ease, color .2s ease, box-shadow .2s ease;
}
.checkbtn:hover{background:var(--gold);color:var(--bg);box-shadow:0 0 26px rgba(212,175,55,.35)}
.checkbtn:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.checkbtn:disabled{border-color:var(--golddim);color:var(--golddim);background:transparent;cursor:not-allowed;box-shadow:none}
.feedback{min-height:26px;margin-top:20px;font-size:14px;letter-spacing:.08em}
.feedback.err{color:var(--err)}
.feedback.ok{color:var(--goldhi)}
.gate.shake{animation:shake .4s ease}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-9px)}
  40%{transform:translateX(8px)}
  60%{transform:translateX(-6px)}
  80%{transform:translateX(4px)}
}
.how{margin-top:26px;border-top:1px solid rgba(138,109,31,.4);padding-top:22px;display:none}
.how.show{display:block}
.how p{font-size:13px;color:var(--muted);line-height:2;letter-spacing:.06em}
.how b{color:var(--gold);font-weight:400}
.howlink{background:none;border:0;color:var(--golddim);font:inherit;font-size:13px;letter-spacing:.14em;cursor:pointer;margin-top:20px}
.howlink:hover{color:var(--gold)}
.welcome{display:none}
.welcome.show{display:block}
.welcome .flourish{margin:6px auto 18px;display:flex;align-items:center;justify-content:center;gap:10px}
.welcome .flourish .f{width:40px;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.welcome .flourish .f:last-child{background:linear-gradient(90deg,var(--gold),transparent)}
.welcome h2{font-weight:400;font-size:30px;letter-spacing:.18em;color:var(--goldhi)}
.welcome p{font-size:15px;color:var(--ivory);letter-spacing:.1em;margin-top:14px;line-height:2}
.welcome p small{color:var(--muted);letter-spacing:.06em}
.again{background:none;border:1px solid var(--golddim);color:var(--gold);font:inherit;font-size:13px;letter-spacing:.2em;padding:10px 22px;cursor:pointer;margin-top:26px}
.again:hover{border-color:var(--gold)}
.foot{margin-top:32px;font-size:11px;color:var(--muted);letter-spacing:.22em;text-transform:uppercase}
@media (max-width:768px){
  body{padding:32px 16px}
  .gate{padding:38px 26px 32px}
  h1{font-size:30px;letter-spacing:.14em}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<main class="gate" id="gate" role="main">
  <div class="emblem" aria-hidden="true">
    <svg viewBox="0 0 84 84" fill="none">
      <path d="M30 64 V40 A12 12 0 0 1 54 40 V64" stroke="#d4af37" stroke-width="2.5"/>
      <path d="M24 64 H60" stroke="#d4af37" stroke-width="2.5"/>
      <path d="M38 46 H46" stroke="#8a6d1f" stroke-width="1.5"/>
      <circle cx="42" cy="26" r="4" fill="#e7c968"/>
      <path d="M42 12 V18" stroke="#e7c968" stroke-width="1.5"/>
    </svg>
  </div>

  <div class="kicker">Golden Gate</div>
  <h1>金<span class="thin">门</span>会馆</h1>
  <p class="sub">仅限受邀者入内 · 会员制私邸</p>

  <div class="rule"><span class="line"></span><span class="diamond"></span><span class="line"></span></div>

  <div id="entry">
    <div class="field">
      <label for="code">邀请码</label>
      <input id="code" type="text" maxlength="16" autocomplete="off" spellcheck="false" placeholder="请输入邀请码" aria-describedby="cap">
      <p class="cap" id="cap">如引荐人名片所示，八位字母与数字。</p>
    </div>

    <button class="checkbtn" id="check" type="button">核对邀请</button>

    <p class="feedback" id="feedback" role="status"></p>

    <button class="howlink" id="howLink" type="button">没有邀请码？</button>

    <div class="how" id="how">
      <p>每一位会员可邀请 <b>两位</b> 新友入会。</p>
      <p>请向你的引荐人索取 <b>八位邀请码</b>，每个码仅可被使用一次。</p>
      <p>若你的码已失效，请联系会馆管家 <b>concierge@goldengate.club</b>。</p>
    </div>
  </div>

  <div class="welcome" id="welcome" role="status">
    <div class="flourish"><span class="f"></span><span class="f"></span></div>
    <h2>欢迎入会</h2>
    <p>尊贵的第 <span id="memberNo">128</span> 位会员，<br><small>门已为你开启，请在管家引导下入席。</small></p>
    <button class="again" id="again" type="button">重新核对邀请码</button>
  </div>

  <p class="foot">Golden Gate · Est. 2019 · Members Only</p>
</main>

<script>
(function(){
  var gate = document.getElementById("gate");
  var code = document.getElementById("code");
  var check = document.getElementById("check");
  var feedback = document.getElementById("feedback");
  var howLink = document.getElementById("howLink");
  var how = document.getElementById("how");
  var entry = document.getElementById("entry");
  var welcome = document.getElementById("welcome");
  var memberNo = document.getElementById("memberNo");
  var again = document.getElementById("again");
  var attempts = 0;

  function setMsg(msg, cls){ feedback.textContent = msg; feedback.className = "feedback " + (cls || ""); }

  howLink.addEventListener("click", function(){
    var open = how.classList.toggle("show");
    howLink.textContent = open ? "收起邀请说明" : "没有邀请码？";
  });

  function shake(){
    gate.classList.remove("shake");
    void gate.offsetWidth;
    gate.classList.add("shake");
  }

  function verify(){
    var v = code.value.trim().toUpperCase();
    if (v === "") { setMsg("请输入邀请码后再核对。", "err"); shake(); return; }
    if (v === "GG202588") {
      setMsg("邀请码有效，正在为你开启金门…", "ok");
      check.disabled = true;
      check.textContent = "已通过核对";
      setTimeout(function(){
        memberNo.textContent = (128 + Math.floor(Math.random() * 3));
        entry.style.display = "none";
        welcome.classList.add("show");
      }, 700);
      return;
    }
    attempts++;
    var left = 3 - attempts;
    if (left <= 0) {
      setMsg("多次失败，本邀请码通道已暂缓，请联系引荐人获取新码。", "err");
      check.disabled = true;
      check.textContent = "请稍后再试";
      shake();
      setTimeout(function(){
        attempts = 0;
        check.disabled = false;
        check.textContent = "核对邀请";
      }, 8000);
    } else {
      setMsg("邀请码无效或已被使用，请核对后重试（剩余 " + left + " 次）。", "err");
      shake();
    }
  }

  check.addEventListener("click", verify);
  code.addEventListener("keydown", function(e){
    if (e.key === "Enter") { verify(); }
  });

  again.addEventListener("click", function(){
    welcome.classList.remove("show");
    entry.style.display = "";
    code.value = "";
    setMsg("", "");
    check.disabled = false;
    check.textContent = "核对邀请";
  });
})();
</script>
</body>
</html>
