<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>信号塔 · 通知中心</title>
<style>
  :root{
    --bg:#0b0e12;
    --panel:#141a22;
    --panel2:#1b232e;
    --border:#232c38;
    --amber:#ffb020;
    --amber-dim:#b97712;
    --text:#e8edf3;
    --muted:#8a95a3;
    --critical:#ff5a5f;
    --info:#3f8cff;
    --success:#2fd48f;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,"Segoe UI","Microsoft YaHei","PingFang SC","Helvetica Neue",sans-serif;
    background:var(--bg);
    color:var(--text);
    font-size:14px;
    line-height:1.5;
    min-height:100vh;
  }
  .mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace}
  .console{
    max-width:1080px;
    margin:0 auto;
    min-height:800px;
    padding:20px 24px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  /* 顶栏 */
  .topbar{
    display:flex;align-items:center;gap:16px;
    padding-bottom:16px;border-bottom:1px solid var(--border);
  }
  .brand{display:flex;align-items:center;gap:12px}
  .tower{display:flex;align-items:flex-end;gap:3px;height:28px}
  .tower span{width:6px;background:var(--amber);border-radius:1px 1px 0 0;display:block}
  .tower span:nth-child(1){height:10px}
  .tower span:nth-child(2){height:16px;opacity:.85}
  .tower span:nth-child(3){height:24px}
  .tower span:nth-child(4){height:18px;opacity:.85}
  .tower span:nth-child(5){height:28px;opacity:.7}
  .brand .name{font-size:18px;font-weight:700;letter-spacing:2px}
  .brand .name em{font-style:normal;color:var(--amber)}
  .brand .ver{font-size:11px;color:var(--muted);margin-top:2px}
  .live{
    margin-left:auto;display:flex;align-items:center;gap:8px;
    font-size:12px;color:var(--success);
  }
  .live .pulse{width:9px;height:9px;border-radius:50%;background:var(--success);box-shadow:0 0 0 0 rgba(47,212,143,.6);animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(47,212,143,.55)}70%{box-shadow:0 0 0 8px rgba(47,212,143,0)}100%{box-shadow:0 0 0 0 rgba(47,212,143,0)}}
  /* 通道状态条 */
  .channels{
    display:grid;grid-template-columns:repeat(5,1fr);gap:10px;
  }
  .channel{
    background:var(--panel);border:1px solid var(--border);border-radius:8px;
    padding:10px 12px;
  }
  .channel .k{font-size:11px;color:var(--muted);letter-spacing:1px;margin-bottom:4px}
  .channel .v{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
  .channel .s{width:8px;height:8px;border-radius:50%}
  .channel.ok .s{background:var(--success)}
  .channel.warn .s{background:var(--amber)}
  .channel.bad .s{background:var(--critical)}
  .channel.ok .v{color:var(--text)}
  .channel.warn .v{color:var(--amber)}
  .channel.bad .v{color:var(--critical)}
  /* 主面板 */
  .panel{
    flex:1;background:var(--panel);border:1px solid var(--border);border-radius:10px;
    display:flex;flex-direction:column;overflow:hidden;
  }
  .panel-head{
    display:flex;align-items:center;gap:14px;
    padding:14px 18px;border-bottom:1px solid var(--border);
  }
  .panel-head .title{font-size:15px;font-weight:700}
  .panel-head .count{
    background:var(--amber);color:#201300;border-radius:999px;
    padding:1px 9px;font-size:12px;font-weight:700;
  }
  .filters{display:flex;gap:6px;margin-left:8px;flex-wrap:wrap}
  .fbtn{
    background:transparent;border:1px solid var(--border);color:var(--muted);
    border-radius:6px;padding:5px 12px;font-size:12px;cursor:pointer;font-family:inherit;
  }
  .fbtn:hover{color:var(--text);border-color:var(--amber-dim)}
  .fbtn.on{background:var(--amber);border-color:var(--amber);color:#201300;font-weight:600}
  .readall{
    margin-left:auto;background:transparent;border:1px solid var(--amber-dim);color:var(--amber);
    border-radius:6px;padding:7px 14px;font-size:12px;cursor:pointer;font-family:inherit;
  }
  .readall:hover{background:rgba(255,176,32,.12)}
  .list{overflow-y:auto;flex:1}
  .notif{
    border-bottom:1px solid var(--border);
    cursor:pointer;
  }
  .notif:last-child{border-bottom:none}
  .notif .row{
    display:flex;align-items:center;gap:12px;padding:13px 18px;
  }
  .notif:hover .row{background:var(--panel2)}
  .notif.unread .row{background:rgba(255,176,32,.05)}
  .notif.unread:hover .row{background:var(--panel2)}
  .badge{
    width:34px;height:34px;border-radius:7px;flex:none;
    display:grid;place-items:center;font-weight:700;font-size:14px;
  }
  .badge.critical{background:rgba(255,90,95,.16);color:var(--critical)}
  .badge.warn{background:rgba(255,176,32,.16);color:var(--amber)}
  .badge.info{background:rgba(63,140,255,.16);color:var(--info)}
  .badge.success{background:rgba(47,212,143,.16);color:var(--success)}
  .badge.system{background:rgba(138,149,163,.16);color:var(--muted)}
  .nmain{flex:1;min-width:0}
  .nmain .t{display:flex;align-items:center;gap:8px}
  .nmain .t b{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tag{
    font-size:10px;letter-spacing:1px;border-radius:3px;padding:1px 6px;
    flex:none;font-weight:600;
  }
  .tag.critical{background:rgba(255,90,95,.16);color:var(--critical)}
  .tag.warn{background:rgba(255,176,32,.16);color:var(--amber)}
  .tag.info{background:rgba(63,140,255,.16);color:var(--info)}
  .tag.success{background:rgba(47,212,143,.16);color:var(--success)}
  .tag.system{background:rgba(138,149,163,.16);color:var(--muted)}
  .nmain .d{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nmeta{flex:none;text-align:right}
  .nmeta .time{font-size:12px;color:var(--muted)}
  .nmeta .code{font-size:10px;color:var(--amber-dim);margin-top:2px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--amber);flex:none;margin-left:2px}
  .chev{color:var(--muted);flex:none;font-size:12px;transition:transform .15s}
  .notif.open .chev{transform:rotate(90deg)}
  .detail{
    display:none;padding:4px 18px 16px 64px;background:rgba(0,0,0,.16);
  }
  .notif.open .detail{display:block}
  .detail .kv{font-size:12px;color:var(--muted);line-height:1.9}
  .detail .kv b{color:var(--text);font-weight:600}
  .detail .trace{
    margin-top:8px;padding:10px 12px;background:#0b0e12;border:1px solid var(--border);
    border-radius:6px;font-size:11px;color:var(--muted);overflow-x:auto;white-space:pre;
  }
  .detail .acts{margin-top:12px;display:flex;gap:8px}
  .mini{
    background:transparent;border:1px solid var(--border);color:var(--text);
    border-radius:6px;padding:6px 14px;font-size:12px;cursor:pointer;font-family:inherit;
  }
  .mini:hover{border-color:var(--amber-dim)}
  .empty{padding:48px 20px;text-align:center;color:var(--muted);font-size:13px}
  @media (max-width:768px){
    .console{padding:12px;min-height:100vh}
    .channels{grid-template-columns:repeat(2,1fr)}
    .panel-head{flex-wrap:wrap}
    .detail{padding-left:18px}
    .topbar{flex-wrap:wrap}
  }
  @media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
  <div class="console">
    <header class="topbar">
      <div class="brand">
        <div class="tower" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
        <div>
          <div class="name">信号<em>塔</em></div>
          <div class="ver mono">OPS CONSOLE · v4.3.1</div>
        </div>
      </div>
      <div class="live mono"><span class="pulse"></span>RUNNING</div>
    </header>

    <section class="channels">
      <div class="channel ok"><div class="k">接入网关</div><div class="v"><span class="s"></span>正常</div></div>
      <div class="channel ok"><div class="k">核心服务</div><div class="v"><span class="s"></span>正常</div></div>
      <div class="channel warn"><div class="k">消息队列</div><div class="v"><span class="s"></span>积压</div></div>
      <div class="channel ok"><div class="k">存储节点</div><div class="v"><span class="s"></span>正常</div></div>
      <div class="channel bad"><div class="k">支付网关</div><div class="v"><span class="s"></span>超时</div></div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <span class="title">通知中心</span>
        <span class="count" id="unreadCount">0</span>
        <div class="filters" id="filters">
          <button class="fbtn on" data-type="all" type="button">全部</button>
          <button class="fbtn" data-type="critical" type="button">告警</button>
          <button class="fbtn" data-type="warn" type="button">警告</button>
          <button class="fbtn" data-type="security" type="button">安全</button>
          <button class="fbtn" data-type="system" type="button">系统</button>
        </div>
        <button class="readall" id="readAll" type="button">全部标已读</button>
      </div>
      <div class="list" id="list"></div>
    </section>
  </div>

<script>
(function(){
  var items = [
    {id:1, type:"critical", tag:"告警", time:"12:48", code:"GW-502",
     title:"支付网关响应超时", desc:"12:48:03 起连续 41 次请求超过 3s 未返回", read:false,
     detail:{影响范围:"支付 / 退款通道", 触发阈值:"3s", 当前值:"4.7s", 建议:"已自动切换备用网关"},
     trace:"gw.check() -> timeout 4700ms\nretry 1..3 failed\nfallback -> backup-gw-02 (ok)"},
    {id:2, type:"warn", tag:"警告", time:"12:31", code:"MQ-101",
     title:"消息队列积压超过阈值", desc:"队列 order-events 积压 8.4k 条，消费速率下降", read:false,
     detail:{队列:"order-events", 积压:"8,412 条", 消费速率:"214 条/s", 建议:"观察 5 分钟，持续上升再扩容"},
     trace:"lag=8412  threshold=5000\nconsumer count=6/8  (2 down)"},
    {id:3, type:"security", tag:"安全", time:"11:52", code:"SEC-7",
     title:"检测到异常登录尝试", desc:"账号 ops-zhou 在陌生 IP 连续失败 5 次", read:false,
     detail:{账号:"ops-zhou", 来源IP:"203.0.113.42", 尝试:"5 次", 处置:"已临时锁定 10 分钟"},
     trace:"login fail x5 -> lock 600s\nip reputation: 高"},
    {id:4, type:"warn", tag:"警告", time:"10:20", code:"CERT-30",
     title:"服务证书将在 30 天后过期", desc:"api.example.internal 证书有效期剩余 30 天", read:false,
     detail:{证书:"api.example.internal", 到期:"2025-07-18", 剩余:"30 天", 建议:"提前 7 天前完成轮换"},
     trace:"notAfter = 2025-07-18T00:00:00Z"},
    {id:5, type:"system", tag:"系统", time:"10:05", code:"NODE-7",
     title:"节点 7 完成滚动重启", desc:"node-7 已退出集群 12 分钟并重新加入，无数据丢失", read:true,
     detail:{节点:"node-7", 离线时长:"12 分钟", 数据完整性:"校验通过", 状态:"已重新加入"},
     trace:"drain -> restart -> join -> rebalance (ok)"},
    {id:6, type:"success", tag:"完成", time:"06:00", code:"BK-OK",
     title:"夜间备份任务完成", desc:"全量备份 2.4 TB 已完成并校验通过", read:true,
     detail:{数据量:"2.4 TB", 耗时:"3 小时 12 分", 校验:"SHA-256 通过", 副本:"3 份"},
     trace:"backup full -> verify sha256 -> ok"},
    {id:7, type:"info", tag:"消息", time:"昨天", code:"REL-43",
     title:"新版本 v4.3.1 已可部署", desc:"发布说明与回滚方案已同步，可安排窗口", read:true,
     detail:{版本:"v4.3.1", 变更:"12 项修复 + 3 项优化", 回滚:"支持一键回滚", 建议:"选择低峰窗口"},
     trace:"changelog ready · rollback plan ready"}
  ];

  var listEl = document.getElementById("list");
  var unreadCount = document.getElementById("unreadCount");
  var readAllBtn = document.getElementById("readAll");
  var filtersEl = document.getElementById("filters");
  var currentFilter = "all";
  var openId = null;

  function renderCount(){
    var n = items.filter(function(i){return !i.read;}).length;
    unreadCount.textContent = String(n);
  }

  function visibleItems(){
    return items.filter(function(i){
      if(currentFilter === "all") return true;
      return i.type === currentFilter;
    });
  }

  function render(){
    var vis = visibleItems();
    listEl.innerHTML = "";
    if(vis.length === 0){
      var e = document.createElement("div");
      e.className = "empty";
      e.textContent = "该类型下暂无通知";
      listEl.appendChild(e);
      return;
    }
    vis.forEach(function(i){
      var wrap = document.createElement("div");
      wrap.className = "notif" + (i.read ? "" : " unread") + (openId === i.id ? " open" : "");
      wrap.setAttribute("data-id", i.id);

      var row = document.createElement("div");
      row.className = "row";

      var badge = document.createElement("div");
      badge.className = "badge " + i.type;
      badge.textContent = i.tag.charAt(0);

      var nmain = document.createElement("div");
      nmain.className = "nmain";
      var t = document.createElement("div");
      t.className = "t";
      var b = document.createElement("b");
      b.textContent = i.title;
      var tag = document.createElement("span");
      tag.className = "tag " + i.type;
      tag.textContent = i.tag;
      t.appendChild(b);
      t.appendChild(tag);
      var d = document.createElement("div");
      d.className = "d";
      d.textContent = i.desc;
      nmain.appendChild(t);
      nmain.appendChild(d);

      var nmeta = document.createElement("div");
      nmeta.className = "nmeta";
      var time = document.createElement("div");
      time.className = "time mono";
      time.textContent = i.time;
      var code = document.createElement("div");
      code.className = "code mono";
      code.textContent = i.code;
      nmeta.appendChild(time);
      nmeta.appendChild(code);

      var chev = document.createElement("span");
      chev.className = "chev";
      chev.textContent = "›";

      row.appendChild(badge);
      row.appendChild(nmain);
      row.appendChild(nmeta);
      if(!i.read){ var dot = document.createElement("span"); dot.className = "dot"; row.appendChild(dot); }
      row.appendChild(chev);

      var detail = document.createElement("div");
      detail.className = "detail";
      var kv = document.createElement("div");
      kv.className = "kv";
      Object.keys(i.detail).forEach(function(k){
        kv.innerHTML += "<b>" + k + "：</b>" + i.detail[k] + "<br>";
      });
      var trace = document.createElement("div");
      trace.className = "trace mono";
      trace.textContent = i.trace;
      var acts = document.createElement("div");
      acts.className = "acts";
      var markBtn = document.createElement("button");
      markBtn.className = "mini";
      markBtn.textContent = i.read ? "标记为未读" : "标记已读";
      markBtn.type = "button";
      markBtn.addEventListener("click", function(ev){
        ev.stopPropagation();
        i.read = !i.read;
        renderCount();
        render();
      });
      acts.appendChild(markBtn);
      detail.appendChild(kv);
      detail.appendChild(trace);
      detail.appendChild(acts);

      wrap.appendChild(row);
      wrap.appendChild(detail);

      row.addEventListener("click", function(){
        openId = (openId === i.id) ? null : i.id;
        if(!i.read){ i.read = true; renderCount(); }
        render();
      });

      listEl.appendChild(wrap);
    });
  }

  readAllBtn.addEventListener("click", function(){
    items.forEach(function(i){ i.read = true; });
    renderCount();
    render();
  });

  filtersEl.addEventListener("click", function(e){
    var btn = e.target.closest(".fbtn");
    if(!btn) return;
    currentFilter = btn.getAttribute("data-type");
    filtersEl.querySelectorAll(".fbtn").forEach(function(x){ x.classList.toggle("on", x === btn); });
    render();
  });

  renderCount();
  render();
})();
</script>
</body>
</html>
