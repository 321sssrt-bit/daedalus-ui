<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>角色与权限 · 棋盘</title>
<style>
:root{
  --bg:#ececee;
  --panel:#ffffff;
  --bd:#dcdce1;
  --dark:#1c1c22;
  --light:#f7f7f8;
  --text:#16161b;
  --muted:#6b6b74;
  --green:#2e7d4f;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,"Segoe UI","Microsoft YaHei","PingFang SC","Helvetica Neue",sans-serif;
  background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.app{display:grid;grid-template-columns:268px 1fr;min-height:100vh}

/* 顶栏 */
.bar{grid-column:1 / -1;display:flex;align-items:center;justify-content:space-between;background:var(--panel);border-bottom:1px solid var(--bd);padding:14px 24px}
.bar .l{display:flex;align-items:center;gap:12px}
.bar .mark{width:32px;height:32px;border-radius:8px;background:var(--dark);color:#fff;display:grid;place-items:center;font-size:17px}
.bar h1{font-size:17px;font-weight:650}
.bar .sub{color:var(--muted);font-size:12.5px}
.bar .r{display:flex;align-items:center;gap:12px}
.unsaved{color:var(--green);font-size:12.5px;font-weight:600;display:none}
.unsaved.show{display:inline-block}
.btn{border:1px solid var(--bd);background:var(--panel);color:var(--text);padding:9px 16px;border-radius:8px;font-size:13px;cursor:pointer;font-family:inherit;font-weight:550}
.btn:hover{background:#f4f4f5}
.btn.solid{background:var(--dark);border-color:var(--dark);color:#fff}
.btn.solid:hover{background:#2a2a32}

/* 侧栏角色 */
.side{border-right:1px solid var(--bd);background:var(--panel);padding:18px 14px;overflow-y:auto}
.side h2{font-size:12px;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;margin:0 6px 10px}
.role{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--bd);border-radius:10px;margin-bottom:10px;cursor:pointer;background:var(--panel)}
.role:hover{border-color:var(--muted)}
.role.active{border-color:var(--green);background:#f3faf5}
.role .piece{width:38px;height:38px;border-radius:9px;background:var(--light);border:1px solid var(--bd);display:grid;place-items:center;font-size:20px;flex:none}
.role.active .piece{background:var(--dark);border-color:var(--dark);color:#fff}
.role .info{flex:1;min-width:0}
.role .info b{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600}
.role .info span{display:block;color:var(--muted);font-size:12px;margin-top:1px}
.role .lock{font-size:10px;color:var(--green);border:1px solid var(--green);border-radius:4px;padding:0 5px;font-weight:600}

/* 主区 */
.main{padding:24px 26px 40px;overflow-y:auto}
.board-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}
.board-head h3{font-size:16px;font-weight:650}
.board-head p{color:var(--muted);font-size:12.5px}
.legend{display:flex;gap:16px;color:var(--muted);font-size:12px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.legend .lg{background:var(--dark)}
.legend .lw{background:var(--light);border:1px solid var(--bd)}
.legend .lm{background:var(--green)}

/* 棋盘矩阵 */
.matrix{background:var(--panel);border:1px solid var(--bd);border-radius:12px;overflow:hidden}
table{width:100%;border-collapse:collapse}
th{padding:14px 12px;font-size:13px;font-weight:650;text-align:center;border-bottom:1px solid var(--bd)}
th .pc{display:block;font-size:18px;line-height:1}
th small{display:block;color:var(--muted);font-weight:500;font-size:11px;margin-top:2px}
th.col-hl{background:#f3faf5}
td.perm{padding:0;text-align:left}
td.perm .pl{display:flex;align-items:center;gap:8px;padding:0 16px;font-size:13px;height:46px;font-weight:500}
td.sq{padding:0;text-align:center}
.sq button{width:100%;height:46px;border:none;background:transparent;cursor:pointer;font-size:16px;font-family:inherit;color:transparent;display:grid;place-items:center}
.sq.w{background:var(--light)}
.sq.b{background:var(--dark)}
.sq.granted button{color:#fff}
.sq.w.granted button{color:var(--dark)}
.sq.granted{box-shadow:inset 0 0 0 2px var(--green)}
.sq.owner{opacity:1}
.sq.locked button{cursor:not-allowed}

/* 预览条 */
.preview{margin-top:20px;background:var(--panel);border:1px solid var(--bd);border-radius:12px;padding:16px 18px}
.preview h4{font-size:13px;font-weight:650;margin-bottom:2px}
.preview .psub{color:var(--muted);font-size:12px;margin-bottom:12px}
.strip{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.pv{position:relative;height:58px;border-radius:8px;border:1px solid var(--bd);display:flex;align-items:flex-end;padding:6px;font-size:11px;color:var(--muted)}
.pv .g{position:absolute;top:6px;left:50%;transform:translateX(-50%);font-size:14px}
.pv.on{background:var(--dark);color:#fff}
.pv.on .g{color:#fff}
.pv.off{background:var(--light)}
.pv .lbl{width:100%;text-align:center}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--dark);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;z-index:30}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:768px){
  .app{grid-template-columns:1fr}
  .bar{grid-column:1}
  .side{border-right:none;border-bottom:1px solid var(--bd)}
  .strip{grid-template-columns:repeat(4,1fr)}
  .matrix{overflow-x:auto}
}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <div class="l">
      <div class="mark">♞</div>
      <div>
        <h1>角色与权限</h1>
        <div class="sub">黑方 · 布局阶段</div>
      </div>
    </div>
    <div class="r">
      <span class="unsaved" id="unsaved">● 有未保存更改</span>
      <button class="btn solid" id="saveBtn">保存更改</button>
    </div>
  </div>

  <aside class="side">
    <h2>角色 · 4</h2>
    <div class="role active" data-role="owner" data-name="所有者">
      <div class="piece">♔</div>
      <div class="info"><b>所有者 <span class="lock">锁定</span></b><span>1 名成员 · 拥有全部权限</span></div>
    </div>
    <div class="role" data-role="admin" data-name="管理员">
      <div class="piece">♕</div>
      <div class="info"><b>管理员</b><span>4 名成员 · 管理成员与设置</span></div>
    </div>
    <div class="role" data-role="editor" data-name="编辑">
      <div class="piece">♗</div>
      <div class="info"><b>编辑</b><span>12 名成员 · 编辑内容与导出</span></div>
    </div>
    <div class="role" data-role="viewer" data-name="访客">
      <div class="piece">♙</div>
      <div class="info"><b>访客</b><span>30 名成员 · 只读查看项目</span></div>
    </div>
  </aside>

  <main class="main">
    <div class="board-head">
      <div>
        <h3>权限棋盘</h3>
        <p>点击格位为角色授予或收回权限；所有者整列锁定。</p>
      </div>
      <div class="legend">
        <span><i class="lg"></i>已授权格位</span>
        <span><i class="lw"></i>空位</span>
        <span><i class="lm"></i>高亮选中</span>
      </div>
    </div>

    <div class="matrix">
      <table>
        <thead>
          <tr>
            <th style="text-align:left;padding-left:16px">权限 \ 角色</th>
            <th class="col-hl" data-col="owner"><span class="pc">♔</span>所有者<small>锁定</small></th>
            <th data-col="admin"><span class="pc">♕</span>管理员</th>
            <th data-col="editor"><span class="pc">♗</span>编辑</th>
            <th data-col="viewer"><span class="pc">♙</span>访客</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td class="perm"><div class="pl">查看项目</div></td>
            <td class="sq w owner granted locked" data-role="owner" data-perm="view"><button aria-label="所有者·查看项目">♟</button></td>
            <td class="sq b granted" data-role="admin" data-perm="view"><button aria-label="管理员·查看项目">♟</button></td>
            <td class="sq w granted" data-role="editor" data-perm="view"><button aria-label="编辑·查看项目">♟</button></td>
            <td class="sq b granted" data-role="viewer" data-perm="view"><button aria-label="访客·查看项目">♟</button></td>
          </tr>
          <tr>
            <td class="perm"><div class="pl">编辑内容</div></td>
            <td class="sq b owner granted locked" data-role="owner" data-perm="edit"><button aria-label="所有者·编辑内容">♟</button></td>
            <td class="sq w granted" data-role="admin" data-perm="edit"><button aria-label="管理员·编辑内容">♟</button></td>
            <td class="sq b granted" data-role="editor" data-perm="edit"><button aria-label="编辑·编辑内容">♟</button></td>
            <td class="sq w" data-role="viewer" data-perm="edit"><button aria-label="访客·编辑内容">♟</button></td>
          </tr>
          <tr>
            <td class="perm"><div class="pl">邀请成员</div></td>
            <td class="sq w owner granted locked" data-role="owner" data-perm="invite"><button aria-label="所有者·邀请成员">♟</button></td>
            <td class="sq b granted" data-role="admin" data-perm="invite"><button aria-label="管理员·邀请成员">♟</button></td>
            <td class="sq w" data-role="editor" data-perm="invite"><button aria-label="编辑·邀请成员">♟</button></td>
            <td class="sq b" data-role="viewer" data-perm="invite"><button aria-label="访客·邀请成员">♟</button></td>
          </tr>
          <tr>
            <td class="perm"><div class="pl">删除项目</div></td>
            <td class="sq b owner granted locked" data-role="owner" data-perm="delete"><button aria-label="所有者·删除项目">♟</button></td>
            <td class="sq w" data-role="admin" data-perm="delete"><button aria-label="管理员·删除项目">♟</button></td>
            <td class="sq b" data-role="editor" data-perm="delete"><button aria-label="编辑·删除项目">♟</button></td>
            <td class="sq w" data-role="viewer" data-perm="delete"><button aria-label="访客·删除项目">♟</button></td>
          </tr>
          <tr>
            <td class="perm"><div class="pl">管理计费</div></td>
            <td class="sq w owner granted locked" data-role="owner" data-perm="billing"><button aria-label="所有者·管理计费">♟</button></td>
            <td class="sq b" data-role="admin" data-perm="billing"><button aria-label="管理员·管理计费">♟</button></td>
            <td class="sq w" data-role="editor" data-perm="billing"><button aria-label="编辑·管理计费">♟</button></td>
            <td class="sq b" data-role="viewer" data-perm="billing"><button aria-label="访客·管理计费">♟</button></td>
          </tr>
          <tr>
            <td class="perm"><div class="pl">修改设置</div></td>
            <td class="sq b owner granted locked" data-role="owner" data-perm="settings"><button aria-label="所有者·修改设置">♟</button></td>
            <td class="sq w granted" data-role="admin" data-perm="settings"><button aria-label="管理员·修改设置">♟</button></td>
            <td class="sq b" data-role="editor" data-perm="settings"><button aria-label="编辑·修改设置">♟</button></td>
            <td class="sq w" data-role="viewer" data-perm="settings"><button aria-label="访客·修改设置">♟</button></td>
          </tr>
          <tr>
            <td class="perm"><div class="pl">导出数据</div></td>
            <td class="sq w owner granted locked" data-role="owner" data-perm="export"><button aria-label="所有者·导出数据">♟</button></td>
            <td class="sq b granted" data-role="admin" data-perm="export"><button aria-label="管理员·导出数据">♟</button></td>
            <td class="sq w granted" data-role="editor" data-perm="export"><button aria-label="编辑·导出数据">♟</button></td>
            <td class="sq b" data-role="viewer" data-perm="export"><button aria-label="访客·导出数据">♟</button></td>
          </tr>
          <tr>
            <td class="perm"><div class="pl">管理角色</div></td>
            <td class="sq b owner granted locked" data-role="owner" data-perm="roles"><button aria-label="所有者·管理角色">♟</button></td>
            <td class="sq w granted" data-role="admin" data-perm="roles"><button aria-label="管理员·管理角色">♟</button></td>
            <td class="sq b" data-role="editor" data-perm="roles"><button aria-label="编辑·管理角色">♟</button></td>
            <td class="sq w" data-role="viewer" data-perm="roles"><button aria-label="访客·管理角色">♟</button></td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="preview">
      <h4 id="previewTitle">格位预览 · 所有者</h4>
      <div class="psub">该角色在棋盘上占据的格位（绿框为已授权）。</div>
      <div class="strip" id="strip"></div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
var perms = [
  {key:'view', label:'查看项目'},
  {key:'edit', label:'编辑内容'},
  {key:'invite', label:'邀请成员'},
  {key:'delete', label:'删除项目'},
  {key:'billing', label:'管理计费'},
  {key:'settings', label:'修改设置'},
  {key:'export', label:'导出数据'},
  {key:'roles', label:'管理角色'}
];
var selectedRole = 'owner';
var unsaved = false;

var toastEl = document.getElementById('toast');
var toastTimer = null;
function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 2200);
}

function cellOf(role, perm){
  return document.querySelector('.sq[data-role="' + role + '"][data-perm="' + perm + '"]');
}

function renderPreview(){
  var role = selectedRole;
  var name = document.querySelector('.role[data-role="' + role + '"]').getAttribute('data-name');
  document.getElementById('previewTitle').textContent = '格位预览 · ' + name;
  var strip = document.getElementById('strip');
  strip.innerHTML = '';
  perms.forEach(function(p, i){
    var cell = cellOf(role, p.key);
    var on = cell.classList.contains('granted');
    var d = document.createElement('div');
    d.className = 'pv ' + (on ? 'on' : 'off');
    d.innerHTML = '<span class="g">' + (on ? '♟' : '·') + '</span><span class="lbl">' + p.label + '</span>';
    strip.appendChild(d);
  });
}

/* 选中角色 */
document.querySelectorAll('.role').forEach(function(r){
  r.addEventListener('click', function(){
    document.querySelectorAll('.role').forEach(function(x){ x.classList.remove('active'); });
    this.classList.add('active');
    selectedRole = this.getAttribute('data-role');
    /* 高亮列 */
    document.querySelectorAll('th[data-col]').forEach(function(th){ th.classList.toggle('col-hl', th.getAttribute('data-col') === selectedRole); });
    renderPreview();
  });
});

/* 点击格位授权/收回 */
document.querySelectorAll('.sq button').forEach(function(b){
  b.addEventListener('click', function(){
    var sq = this.parentElement;
    if (sq.classList.contains('locked')) {
      showToast('所有者权限不可修改');
      return;
    }
    sq.classList.toggle('granted');
    unsaved = true;
    document.getElementById('unsaved').classList.add('show');
    renderPreview();
  });
});

/* 保存 */
document.getElementById('saveBtn').addEventListener('click', function(){
  if (!unsaved) { showToast('没有需要保存的更改'); return; }
  unsaved = false;
  document.getElementById('unsaved').classList.remove('show');
  var now = new Date();
  var hh = ('0' + now.getHours()).slice(-2);
  var mm = ('0' + now.getMinutes()).slice(-2);
  showToast('权限已保存 · ' + hh + ':' + mm);
});

renderPreview();
</script>
</body>
</html>
