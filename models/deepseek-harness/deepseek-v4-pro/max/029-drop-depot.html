<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>东巷驿站 · 材料上传</title>
<style>
  :root{
    --beige:#f4e8d2;
    --paper:#fffaf1;
    --brown:#5c4326;
    --tag:#d97a2b;
    --stamp:#b23a2e;
    --line:#d9c39a;
    --muted:#8a7152;
    --green:#3f7d4e;
    --dark:#3a2c1a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,"Segoe UI","Microsoft YaHei","PingFang SC","Helvetica Neue",sans-serif;
    background:var(--beige);color:var(--brown);font-size:15px;line-height:1.6;
    min-height:100vh;padding:40px 20px 60px;
  }
  .page{max-width:840px;margin:0 auto}
  .topline{display:flex;align-items:center;gap:14px;margin-bottom:8px}
  .postmark{
    width:46px;height:46px;border:2px solid var(--stamp);border-radius:50%;color:var(--stamp);
    display:grid;place-items:center;font-weight:700;font-size:11px;letter-spacing:1px;text-align:center;
    transform:rotate(-8deg);line-height:1.1;flex:0 0 auto;background:var(--paper);
  }
  .topline h1{font-size:24px;font-weight:700;color:var(--dark);letter-spacing:.5px}
  .topline p{font-size:13px;color:var(--muted)}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 24px rgba(90,67,38,.08)}
  .dropzone{
    border:2px dashed var(--tag);border-radius:12px;margin:22px 22px 8px;padding:34px 20px;text-align:center;
    background:rgba(217,122,43,.06);cursor:pointer;transition:background .18s ease,border-color .18s ease;
  }
  .dropzone:hover,.dropzone.drag{background:rgba(217,122,43,.14);border-color:var(--stamp)}
  .dropzone .ic{font-size:40px;line-height:1}
  .dropzone .t{font-size:16px;font-weight:600;color:var(--dark);margin-top:8px}
  .dropzone .s{font-size:13px;color:var(--muted);margin-top:2px}
  .sum{display:flex;align-items:center;gap:8px;padding:10px 22px;font-size:13px;color:var(--muted)}
  .sum .badge{background:var(--tag);color:#fff;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600}
  .list{padding:0 22px 22px}
  .file-row{
    display:flex;align-items:center;gap:14px;padding:14px;border:1px solid var(--line);border-radius:10px;
    background:#fffdf7;margin-bottom:10px;position:relative;
  }
  .file-row:last-child{margin-bottom:0}
  .tag-tab{
    width:44px;height:30px;flex:0 0 auto;border-radius:4px;background:var(--tag);position:relative;color:#fff;
    display:grid;place-items:center;font-size:11px;font-weight:700;
  }
  .tag-tab::before{content:"";position:absolute;top:-7px;left:50%;transform:translateX(-50%);width:6px;height:7px;background:var(--paper);border:1px solid var(--line);border-radius:3px}
  .file-meta{flex:1;min-width:0}
  .file-meta .nm{font-size:14px;font-weight:600;color:var(--dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .file-meta .sz{font-size:12px;color:var(--muted);margin-top:2px}
  .status{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;flex:0 0 auto}
  .status.pending{background:#efe6d2;color:var(--muted)}
  .status.processing{background:#fdebd6;color:var(--tag)}
  .status.done{background:#e7f0e9;color:var(--green)}
  .status.failed{background:#f6deda;color:var(--stamp)}
  .progbar{height:4px;background:#efe6d2;border-radius:999px;margin-top:8px;overflow:hidden;display:none}
  .progbar i{display:block;height:100%;width:0;background:var(--tag);transition:width .2s linear}
  .del{
    border:none;background:transparent;color:var(--muted);font-size:13px;cursor:pointer;padding:6px 8px;
    border-radius:6px;flex:0 0 auto;
  }
  .del:hover{color:var(--stamp);background:#f6deda}
  .stamp{
    position:absolute;right:66px;top:50%;transform:translateY(-50%) rotate(-14deg);color:var(--stamp);
    border:2px solid var(--stamp);border-radius:6px;padding:3px 8px;font-size:12px;font-weight:700;letter-spacing:2px;
    opacity:0;transition:opacity .3s ease;background:rgba(255,250,241,.85);
  }
  .stamp.show{opacity:1}
  .actions{display:flex;gap:12px;padding:0 22px 22px}
  .btn{
    border:none;border-radius:9px;padding:12px 24px;font-size:15px;font-weight:600;cursor:pointer;
    font-family:inherit;transition:background .16s ease,opacity .16s ease;letter-spacing:.5px;
  }
  .btn-primary{background:var(--stamp);color:#fff}
  .btn-primary:hover{background:#8f2c22}
  .btn-ghost{background:transparent;color:var(--brown);border:1px solid var(--line)}
  .btn-ghost:hover{background:rgba(217,122,43,.1)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .note{padding:0 22px 22px;font-size:12px;color:var(--muted);line-height:1.5}
  @media (max-width:768px){
    .page{max-width:100%}
    .dropzone{margin:16px 16px 8px;padding:26px 14px}
    .list{padding:0 16px 16px}
    .actions{padding:0 16px 16px;flex-wrap:wrap}
    .stamp{right:54px}
  }
  @media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
  <div class="page">
    <div class="topline">
      <div class="postmark">东巷<br>驿站</div>
      <div><h1>材料上传</h1><p>请将办理所需材料打包交到驿站窗口</p></div>
    </div>

    <div class="card">
      <div class="dropzone" id="dropzone">
        <div class="ic">📦</div>
        <div class="t">点击选择文件，或拖放到这里</div>
        <div class="s">支持 PDF / JPG / PNG，单个文件不超过 10 MB</div>
      </div>

      <div class="sum"><span class="badge" id="fileCount">0</span>个文件已入列 · 合计 <b id="totalSize" style="color:var(--brown)">0 KB</b></div>

      <div class="list" id="fileList"></div>

      <div class="actions">
        <button class="btn btn-primary" id="processBtn" type="button">开始处理</button>
        <button class="btn btn-ghost" id="clearBtn" type="button">清空列表</button>
      </div>
      <p class="note">提示：文件入列后不会立即上传，点击「开始处理」才会盖章归档；处理中的文件请勿关闭页面。</p>
    </div>
  </div>

<script>
  var files=[];
  var seq=0;
  var samples=[
    {n:'户口簿首页.pdf',kb:614},
    {n:'收入证明.pdf',kb:1843},
    {n:'社保参保证明.jpg',kb:2458},
    {n:'居住证扫描件.png',kb:1120}
  ];
  var poolIdx=0;
  function fmt(kb){return kb>=1024 ? (kb/1024).toFixed(1)+' MB' : kb+' KB';}
  function totalKB(){return files.reduce(function(a,f){return a+(f.kb||0);},0);}
  function $(id){return document.getElementById(id);}
  function addFile(name,kb){
    files.push({id:'f'+(++seq),name:name,kb:kb,status:'pending',prog:0});
    render();
  }
  function render(){
    var list=$('fileList');
    list.innerHTML='';
    files.forEach(function(f){
      var row=document.createElement('div');row.className='file-row';row.id=f.id;
      var statusTxt=f.status==='pending'?'待处理':(f.status==='processing'?'处理中':(f.status==='done'?'已盖章':'失败'));
      var cls=f.status;
      var meta='<div class="file-meta"><div class="nm">'+f.name+'</div><div class="sz">'+fmt(f.kb)+' · '+statusTxt+'</div>';
      if(f.status==='processing'){meta+='<div class="progbar" style="display:block"><i style="width:'+f.prog+'%"></i></div>';}
      meta+='</div>';
      row.innerHTML='<div class="tag-tab">行</div>'+meta+
        '<span class="stamp'+(f.status==='done'?' show':'')+'">已盖章</span>'+
        '<span class="status '+cls+'">'+statusTxt+'</span>'+
        '<button class="del" type="button" data-del="'+f.id+'"'+(f.status==='processing'?' disabled':'')+'>删除</button>';
      list.appendChild(row);
    });
    $('fileCount').textContent=files.length;
    $('totalSize').textContent=fmt(totalKB());
    var hasPending=files.some(function(f){return f.status==='pending';});
    $('processBtn').disabled=!hasPending || files.length===0;
    if(files.length===0){list.innerHTML='<div style="text-align:center;color:var(--muted);padding:26px 0;font-size:14px">还没有文件入列，从上方添加。</div>';}
  }
  $('dropzone').addEventListener('click',function(){
    var s=samples[poolIdx%samples.length];poolIdx++;
    addFile(s.n,s.kb);
  });
  $('dropzone').addEventListener('dragover',function(e){e.preventDefault();this.classList.add('drag');});
  $('dropzone').addEventListener('dragleave',function(){this.classList.remove('drag');});
  $('dropzone').addEventListener('drop',function(e){
    e.preventDefault();this.classList.remove('drag');
    var fs=e.dataTransfer.files;
    if(fs&&fs.length){for(var i=0;i<fs.length;i++){addFile(fs[i].name,Math.max(1,Math.round(fs[i].size/1024)));}}
  });
  $('fileList').addEventListener('click',function(e){
    var id=e.target.getAttribute&&e.target.getAttribute('data-del');
    if(id){files=files.filter(function(f){return f.id!==id;});render();}
  });
  $('clearBtn').addEventListener('click',function(){files=[];render();});
  $('processBtn').addEventListener('click',function(){
    var pending=files.filter(function(f){return f.status==='pending';});
    pending.forEach(function(f){f.status='processing';f.prog=0;});
    render();
    var iv=setInterval(function(){
      var active=files.some(function(f){return f.status==='processing';});
      if(!active){clearInterval(iv);return;}
      var done=true;
      files.forEach(function(f){
        if(f.status==='processing'){
          f.prog=Math.min(100,f.prog+Math.floor(Math.random()*16+8));
          if(f.prog>=100){f.status='done';f.prog=100;}
          else{done=false;}
        }
      });
      render();
      if(done)clearInterval(iv);
    },220);
  });
  addFile('身份证复印件.pdf',1229);
  addFile('申请表扫描件.pdf',840);
</script>
</body>
</html>
