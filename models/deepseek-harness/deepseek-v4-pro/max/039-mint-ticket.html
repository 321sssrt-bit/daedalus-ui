<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>薄荷影城 · 预订成功</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,"Segoe UI","Microsoft YaHei","PingFang SC","Helvetica Neue",sans-serif;
  background:#d9f2e6;
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  padding:28px 16px;
}
.phone{
  width:390px;height:844px;max-height:94vh;
  border-radius:46px;
  border:9px solid #123b2c;
  box-shadow:0 30px 60px rgba(14,90,63,.28), inset 0 0 0 2px rgba(255,255,255,.5);
  overflow:hidden;
  display:flex;flex-direction:column;
  background:#eef9f3;
  position:relative;
}
.statusbar{
  flex:0 0 auto;height:46px;padding:0 22px;
  display:flex;align-items:center;justify-content:space-between;
  background:#eef9f3;color:#0e5a3f;font-size:14px;font-weight:600;
  border-bottom:1px solid #d7efe4;
}
.statusbar .right{display:flex;align-items:center;gap:6px}
.statusbar svg{display:block}
.screen{flex:1;overflow-y:auto;display:flex;flex-direction:column;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.header{padding:26px 22px 18px;text-align:center}
.badge{
  width:64px;height:64px;border-radius:50%;background:#35c98a;color:#ffffff;
  display:flex;align-items:center;justify-content:center;margin:0 auto 14px;
  box-shadow:0 10px 22px rgba(53,201,138,.4);
}
.header h1{font-size:24px;color:#0e5a3f;font-weight:700}
.header p{font-size:14px;color:#8aa79b;margin-top:6px}
.ticket{
  position:relative;margin:6px 20px 0;background:#ffffff;border-radius:18px;
  box-shadow:0 10px 26px rgba(14,90,63,.12);overflow:hidden;
}
.ticket .edge{height:10px;background:#35c98a}
.ticket .main{padding:20px 20px 22px}
.ticket .film{font-size:21px;font-weight:700;color:#0e5a3f}
.ticket .venue{font-size:13px;color:#8aa79b;margin-top:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;margin-top:18px}
.grid .cell .k{font-size:12px;color:#8aa79b;letter-spacing:.04em}
.grid .cell .v{font-size:16px;font-weight:600;color:#0e5a3f;margin-top:4px}
.grid .cell .v.seat{color:#1f9d6b;font-weight:700}
.tear{
  position:relative;height:0;border-top:2px dashed #b9ecdb;
  margin:0 20px;
}
.tear .notch{
  position:absolute;top:-9px;width:18px;height:18px;border-radius:50%;
  background:#eef9f3;box-shadow:inset 0 1px 3px rgba(14,90,63,.14);
}
.tear .notch.l{left:-30px}
.tear .notch.r{right:-30px}
.stub{display:flex;align-items:center;gap:18px;padding:20px 20px 22px}
.stub .info{flex:1}
.stub .k{font-size:12px;color:#8aa79b;letter-spacing:.04em}
.stub .v{font-size:16px;font-weight:700;color:#0e5a3f;margin-top:4px;font-family:ui-monospace,"SF Mono","Consolas",monospace}
.stub .v.code{color:#1f9d6b;font-size:20px;letter-spacing:.12em}
.qr{flex:0 0 auto}
.tag{
  position:absolute;top:16px;right:16px;background:#f6e7c8;color:#9c7a3c;
  font-size:11px;font-weight:600;padding:4px 9px;border-radius:8px;letter-spacing:.04em;
}
.details-toggle{
  margin:16px 20px 0;border:0;background:#ffffff;color:#1f9d6b;
  font:inherit;font-size:14px;font-weight:600;padding:14px;border-radius:14px;
  border:1px solid #d7efe4;cursor:pointer;display:flex;align-items:center;justify-content:space-between;
}
.details-toggle .arrow{transition:transform .25s}
.details-toggle.open .arrow{transform:rotate(180deg)}
.details{display:none;margin:10px 20px 0;background:#ffffff;border:1px solid #d7efe4;border-radius:14px;padding:16px 18px}
.details.show{display:block}
.details .line{display:flex;justify-content:space-between;font-size:14px;color:#0e5a3f;padding:7px 0}
.details .line .muted{color:#8aa79b}
.details .total{border-top:1px dashed #d7efe4;margin-top:8px;padding-top:12px;font-weight:700;color:#0e5a3f;display:flex;justify-content:space-between}
.details .tip{margin-top:12px;font-size:12px;color:#8aa79b;line-height:1.7}
.actions{padding:18px 20px 30px;display:flex;flex-direction:column;gap:12px}
.primary{
  border:0;background:#35c98a;color:#ffffff;font:inherit;font-size:16px;font-weight:700;
  padding:15px;border-radius:16px;cursor:pointer;box-shadow:0 8px 20px rgba(53,201,138,.32);
}
.primary:hover{background:#1f9d6b}
.primary:focus-visible{outline:3px solid #f6e7c8;outline-offset:2px}
.ghost{
  border:1px solid #b9ecdb;background:#ffffff;color:#1f9d6b;font:inherit;font-size:15px;font-weight:600;
  padding:14px;border-radius:16px;cursor:pointer;
}
.ghost:hover{background:#eef9f3}
.ghost.saved{background:#35c98a;border-color:#35c98a;color:#ffffff}
.toast{
  position:absolute;left:50%;bottom:96px;transform:translateX(-50%) translateY(16px);
  background:#0e5a3f;color:#ffffff;font-size:13px;padding:10px 16px;border-radius:22px;
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;white-space:nowrap;z-index:30;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:480px){
  body{padding:0}
  .phone{width:100%;height:100vh;max-height:none;border-radius:0;border:0;box-shadow:none}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="phone">
  <div class="statusbar">
    <span>9:41</span>
    <span class="right">
      <svg width="17" height="12" viewBox="0 0 17 12" aria-hidden="true"><rect x="0" y="8" width="3" height="4" rx="1" fill="#0e5a3f"/><rect x="4.5" y="6" width="3" height="6" rx="1" fill="#0e5a3f"/><rect x="9" y="3" width="3" height="9" rx="1" fill="#0e5a3f"/><rect x="13.5" y="0" width="3" height="12" rx="1" fill="#0e5a3f" opacity=".35"/></svg>
      <svg width="17" height="12" viewBox="0 0 17 12" aria-hidden="true"><path d="M1 5.2 A7.5 7.5 0 0 1 16 5.2 L13.8 7.6 A4.5 4.5 0 0 0 3.2 7.6 Z" fill="#0e5a3f"/><circle cx="8.5" cy="10" r="1.6" fill="#0e5a3f"/></svg>
      <svg width="26" height="13" viewBox="0 0 26 13" aria-hidden="true"><rect x="0.5" y="0.5" width="21" height="12" rx="3.5" fill="none" stroke="#0e5a3f" opacity=".5"/><rect x="2.5" y="2.5" width="16" height="8" rx="1.5" fill="#0e5a3f"/><rect x="22.5" y="4" width="3" height="5" rx="1" fill="#0e5a3f" opacity=".5"/></svg>
    </span>
  </div>

  <div class="screen">
    <div class="header">
      <div class="badge">
        <svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5 L10 17.5 L19 7" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <h1>预订成功</h1>
      <p>票已出好，请按时到场取票</p>
    </div>

    <div class="ticket">
      <div class="edge"></div>
      <span class="tag">已出票</span>
      <div class="main">
        <div class="film">《银河拾穗》2D</div>
        <div class="venue">薄荷影城 · 万象城店 · 6 号杜比全景声厅</div>
        <div class="grid">
          <div class="cell"><div class="k">日期</div><div class="v">2025-06-14 · 周六</div></div>
          <div class="cell"><div class="k">时间</div><div class="v">19:30</div></div>
          <div class="cell"><div class="k">座位</div><div class="v seat">B区 12排 7座、8座</div></div>
          <div class="cell"><div class="k">票数</div><div class="v">2 张</div></div>
        </div>
      </div>
      <div class="tear"><span class="notch l"></span><span class="notch r"></span></div>
      <div class="stub">
        <div class="info">
          <div class="k">订单编号</div>
          <div class="v">NO. 8824-1937</div>
          <div class="k" style="margin-top:10px">取票码</div>
          <div class="v code">8842</div>
        </div>
        <svg class="qr" width="78" height="78" viewBox="0 0 78 78" aria-hidden="true">
          <rect x="2" y="2" width="20" height="20" rx="2" fill="#0e5a3f"/>
          <rect x="7" y="7" width="10" height="10" rx="1" fill="#ffffff"/>
          <rect x="10.5" y="10.5" width="3" height="3" fill="#0e5a3f"/>
          <rect x="56" y="2" width="20" height="20" rx="2" fill="#0e5a3f"/>
          <rect x="61" y="7" width="10" height="10" rx="1" fill="#ffffff"/>
          <rect x="64.5" y="10.5" width="3" height="3" fill="#0e5a3f"/>
          <rect x="2" y="56" width="20" height="20" rx="2" fill="#0e5a3f"/>
          <rect x="7" y="61" width="10" height="10" rx="1" fill="#ffffff"/>
          <rect x="10.5" y="64.5" width="3" height="3" fill="#0e5a3f"/>
          <rect x="28" y="4" width="6" height="6" fill="#0e5a3f"/>
          <rect x="40" y="10" width="6" height="6" fill="#0e5a3f"/>
          <rect x="52" y="28" width="6" height="6" fill="#0e5a3f"/>
          <rect x="60" y="40" width="6" height="6" fill="#0e5a3f"/>
          <rect x="28" y="22" width="6" height="6" fill="#0e5a3f"/>
          <rect x="22" y="34" width="6" height="6" fill="#0e5a3f"/>
          <rect x="34" y="40" width="6" height="6" fill="#0e5a3f"/>
          <rect x="46" y="46" width="6" height="6" fill="#0e5a3f"/>
          <rect x="28" y="52" width="6" height="6" fill="#0e5a3f"/>
          <rect x="40" y="60" width="6" height="6" fill="#0e5a3f"/>
          <rect x="56" y="56" width="6" height="6" fill="#0e5a3f"/>
          <rect x="60" y="64" width="6" height="6" fill="#0e5a3f"/>
        </svg>
      </div>
    </div>

    <button class="details-toggle" type="button" id="detailsBtn">
      <span>展开订单详情</span>
      <svg class="arrow" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9 L12 15 L18 9" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="details" id="details">
      <div class="line"><span>影票 ×2</span><span>¥118.00</span></div>
      <div class="line"><span>在线选座服务费</span><span>¥6.00</span></div>
      <div class="line"><span class="muted">优惠券</span><span class="muted">-¥0.00</span></div>
      <div class="total"><span>实付合计</span><span>¥124.00</span></div>
      <div class="tip">开场前 30 分钟可在影院自助机凭取票码取票；开演 10 分钟后不可退改。</div>
    </div>
  </div>

  <div class="actions">
    <button class="primary" type="button" id="done">完成</button>
    <button class="ghost" type="button" id="save">保存到钱包</button>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
(function(){
  var detailsBtn=document.getElementById("detailsBtn");
  var details=document.getElementById("details");
  var save=document.getElementById("save");
  var toast=document.getElementById("toast");

  function showToast(msg){
    toast.textContent=msg;
    toast.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t=setTimeout(function(){toast.classList.remove("show");},2400);
  }

  detailsBtn.addEventListener("click",function(){
    var open=details.classList.toggle("show");
    detailsBtn.classList.toggle("open",open);
    detailsBtn.querySelector("span").textContent=open?"收起订单详情":"展开订单详情";
  });

  save.addEventListener("click",function(){
    var saved=save.classList.toggle("saved");
    save.textContent=saved?"✓ 已保存到钱包":"保存到钱包";
    showToast(saved?"已保存到钱包":"已从钱包移除");
  });

  document.getElementById("done").addEventListener("click",function(){
    showToast("祝观影愉快，我们放映厅见");
  });
})();
</script>
</body>
</html>
