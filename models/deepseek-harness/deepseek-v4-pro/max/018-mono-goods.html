<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MONO·ONE 静音机械键盘 · 商品详情</title>
<style>
  :root {
    --bg: #ffffff;
    --ink: #111111;
    --gray: #6b6b6b;
    --gray-2: #9a9a9a;
    --line: #e5e5e5;
    --panel: #f4f4f4;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", "Helvetica Neue", sans-serif;
    background: var(--bg); color: var(--ink); min-height: 100vh;
  }
  a { color: inherit; text-decoration: none; }

  /* 顶栏 */
  .topbar {
    display: flex; align-items: center; gap: 28px;
    padding: 20px 48px; border-bottom: 1px solid var(--line);
  }
  .logo { font-size: 18px; font-weight: 800; letter-spacing: 3px; }
  .logo span { color: var(--gray-2); }
  .nav { display: flex; gap: 24px; }
  .nav a { font-size: 14px; color: var(--gray); }
  .nav a:hover { color: var(--ink); }
  .spacer { flex: 1 1 auto; }
  .cart {
    display: flex; align-items: center; gap: 7px; font-size: 14px;
    color: var(--ink); font-weight: 700; background: none; border: 0; cursor: pointer;
  }
  .cart svg { width: 20px; height: 20px; }

  .wrap { max-width: 1160px; margin: 0 auto; padding: 32px 48px 72px; }
  .crumb { font-size: 13px; color: var(--gray-2); margin-bottom: 28px; }
  .crumb b { color: var(--ink); font-weight: 600; }

  .main { display: grid; grid-template-columns: 1.05fr 0.95fr; gap: 64px; align-items: start; }

  /* 大图面板 */
  .gallery {
    background: var(--panel); border-radius: 20px; padding: 48px 32px;
    display: flex; flex-direction: column; align-items: center; gap: 20px;
  }
  .gallery svg { width: 100%; max-width: 640px; height: auto; }
  .gallery .cap { font-size: 12px; color: var(--gray-2); letter-spacing: 1px; }

  /* 信息列 */
  .info h1 { font-size: 32px; font-weight: 800; letter-spacing: .5px; }
  .sub { font-size: 15px; color: var(--gray); margin-top: 8px; line-height: 1.6; }
  .rating { display: flex; align-items: center; gap: 8px; margin-top: 14px; font-size: 13px; color: var(--gray); }
  .stars { color: var(--ink); letter-spacing: 2px; }

  .price { display: flex; align-items: baseline; gap: 12px; margin-top: 22px; }
  .price .now { font-size: 34px; font-weight: 800; }
  .price .was { font-size: 16px; color: var(--gray-2); text-decoration: line-through; }
  .price .off { font-size: 12px; font-weight: 700; color: var(--ink); border: 1px solid var(--ink); padding: 3px 8px; border-radius: 6px; }

  .spec { margin-top: 28px; }
  .spec h2 { font-size: 14px; font-weight: 800; letter-spacing: 1px; margin-bottom: 12px; }
  .opts { display: flex; gap: 10px; flex-wrap: wrap; }
  .opt {
    border: 1px solid var(--line); background: var(--bg); color: var(--ink);
    font: inherit; font-size: 14px; padding: 10px 18px; border-radius: 999px; cursor: pointer;
    transition: border-color .15s ease, background .15s ease;
  }
  .opt:hover { border-color: var(--ink); }
  .opt.active { background: var(--ink); color: #fff; border-color: var(--ink); }
  .swatches { display: flex; gap: 14px; }
  .swatch {
    width: 40px; height: 40px; border-radius: 50%; cursor: pointer;
    border: 1px solid var(--line); padding: 0;
    box-shadow: inset 0 0 0 3px var(--bg);
  }
  .swatch.active { outline: 2px solid var(--ink); outline-offset: 3px; }
  .swatch-label { display: inline-block; font-size: 12px; color: var(--gray); margin-top: 6px; }

  .qty { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .qty button {
    width: 40px; height: 40px; border: 0; background: var(--panel); cursor: pointer;
    font-size: 18px; color: var(--ink); line-height: 1;
  }
  .qty button:hover { background: var(--line); }
  .qty button:disabled { color: var(--gray-2); cursor: default; background: var(--panel); }
  .qty .val { width: 48px; text-align: center; font-size: 15px; font-weight: 700; }

  .summary {
    margin-top: 20px; font-size: 13px; color: var(--gray);
    background: var(--panel); border-radius: 10px; padding: 12px 16px;
  }
  .summary b { color: var(--ink); }

  .actions { display: flex; gap: 12px; margin-top: 24px; }
  .buy {
    flex: 1 1 auto; border: 0; cursor: pointer; background: var(--ink); color: #fff;
    font: inherit; font-size: 16px; font-weight: 800; padding: 16px 28px; border-radius: 12px;
    transition: transform .15s ease;
  }
  .buy:hover { transform: translateY(-1px); }
  .buy:active { transform: translateY(0); }
  .cart-add {
    border: 1px solid var(--ink); background: var(--bg); color: var(--ink);
    font: inherit; font-size: 16px; font-weight: 800; padding: 16px 24px; border-radius: 12px; cursor: pointer;
  }
  .cart-add:hover { background: var(--panel); }

  .features { margin-top: 30px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px 20px; }
  .features li { list-style: none; font-size: 13px; color: var(--gray); display: flex; gap: 8px; align-items: center; }
  .features li::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--ink); flex: 0 0 auto; }

  .toast {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--ink); color: #fff; font-size: 14px;
    padding: 13px 22px; border-radius: 12px; opacity: 0; pointer-events: none;
    transition: opacity .25s ease, transform .25s ease; z-index: 60;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 900px) {
    .main { grid-template-columns: 1fr; gap: 36px; }
    .topbar { padding: 16px 24px; }
    .wrap { padding: 24px 24px 56px; }
  }
  @media (max-width: 560px) {
    .nav { display: none; }
    .info h1 { font-size: 26px; }
    .price .now { font-size: 28px; }
    .gallery { padding: 32px 18px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="logo">MONO<span>·</span>ONE</div>
  <nav class="nav">
    <a href="#">购买</a><a href="#">产品</a><a href="#">关于</a><a href="#">支持</a>
  </nav>
  <div class="spacer"></div>
  <button class="cart" type="button" id="cartBtn">
    <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h2l2.2 9.2a1.5 1.5 0 0 0 1.5 1.2h6.5a1.5 1.5 0 0 0 1.4-1.1L18.5 8H6" fill="none" stroke="#111111" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9" cy="18.5" r="1.3" fill="#111111"/><circle cx="15.5" cy="18.5" r="1.3" fill="#111111"/></svg>
    购物袋
  </button>
</header>

<div class="wrap">
  <div class="crumb">首页 / 数码外设 / <b>MONO·ONE 键盘</b></div>
  <div class="main">
    <section class="gallery">
      <svg viewBox="0 0 760 320" role="img" aria-label="MONO·ONE 静音机械键盘俯视图">
        <defs>
          <pattern id="kp" width="44" height="40" patternUnits="userSpaceOnUse">
            <rect x="4" y="4" width="36" height="32" rx="6" fill="#f4f4f4"/>
          </pattern>
        </defs>
        <ellipse cx="380" cy="300" rx="310" ry="15" fill="#e9e9e9"/>
        <rect x="30" y="34" width="700" height="232" rx="24" fill="#111111"/>
        <rect x="54" y="58" width="652" height="120" rx="8" fill="url(#kp)"/>
        <rect x="54" y="186" width="652" height="56" rx="8" fill="#111111"/>
        <rect x="270" y="192" width="220" height="44" rx="8" fill="#f4f4f4"/>
        <text x="380" y="220" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="2" fill="#111111">MONO·ONE</text>
        <rect x="508" y="192" width="80" height="44" rx="8" fill="#9a9a9a"/>
        <rect x="604" y="192" width="72" height="44" rx="8" fill="#9a9a9a"/>
        <circle cx="726" cy="50" r="3" fill="#e5e5e5"/>
      </svg>
      <p class="cap">MONO·ONE 静音机械键盘 · 俯视图</p>
    </section>

    <section class="info">
      <h1>MONO·ONE 静音机械键盘</h1>
      <p class="sub">全键静音轴体 + 三模连接，深夜办公也不打扰别人。金属定位板，手感沉稳，一套克制到底的桌面工具。</p>
      <div class="rating"><span class="stars">★★★★★</span> 4.9 · 128 条评价 · 现货</div>

      <div class="price"><span class="now">¥899</span><span class="was">¥1099</span><span class="off">限时立省 200</span></div>

      <div class="spec">
        <h2>轴体</h2>
        <div class="opts" id="switches">
          <button class="opt active" type="button" data-v="静音红轴">静音红轴</button>
          <button class="opt" type="button" data-v="静音茶轴">静音茶轴</button>
          <button class="opt" type="button" data-v="静音白轴">静音白轴</button>
        </div>
      </div>

      <div class="spec">
        <h2>配色</h2>
        <div class="swatches" id="colors">
          <div><button class="swatch active" type="button" data-v="曜石黑" style="background:#111111" aria-label="曜石黑"></button><span class="swatch-label">曜石黑</span></div>
          <div><button class="swatch" type="button" data-v="云雾白" style="background:#ffffff" aria-label="云雾白"></button><span class="swatch-label">云雾白</span></div>
          <div><button class="swatch" type="button" data-v="石墨灰" style="background:#9a9a9a" aria-label="石墨灰"></button><span class="swatch-label">石墨灰</span></div>
        </div>
      </div>

      <div class="spec">
        <h2>数量</h2>
        <div class="qty">
          <button type="button" id="minus" aria-label="减少">−</button>
          <span class="val" id="qtyVal">1</span>
          <button type="button" id="plus" aria-label="增加">+</button>
        </div>
      </div>

      <p class="summary" id="summary">已选：<b>曜石黑 · 静音红轴 × 1</b></p>

      <div class="actions">
        <button class="buy" type="button" id="buyBtn">立即购买</button>
        <button class="cart-add" type="button" id="addBtn">加入购物袋</button>
      </div>

      <ul class="features">
        <li>静音轴体，敲击更轻</li>
        <li>轴体热插拔，可换可玩</li>
        <li>蓝牙 / 2.4G / 有线三模</li>
        <li>阳极氧化金属定位板</li>
      </ul>
    </section>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  (function () {
    var sw = "静音红轴";
    var col = "曜石黑";
    var qty = 1;
    var toastTimer = null;
    var buyTimer = null;

    var switchBtns = Array.prototype.slice.call(document.querySelectorAll('#switches .opt'));
    var swatches = Array.prototype.slice.call(document.querySelectorAll('#colors .swatch'));

    function summary() {
      document.getElementById('summary').innerHTML = "已选：<b>" + col + " · " + sw + " × " + qty + "</b>";
    }
    function showToast(msg) {
      var t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      if (toastTimer) { clearTimeout(toastTimer); }
      toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2400);
    }
    function qtyUI() {
      document.getElementById('qtyVal').textContent = String(qty);
      document.getElementById('minus').disabled = (qty <= 1);
      document.getElementById('plus').disabled = (qty >= 10);
    }

    switchBtns.forEach(function (b) {
      b.addEventListener('click', function () {
        switchBtns.forEach(function (x) { x.classList.remove('active'); });
        b.classList.add('active');
        sw = b.getAttribute('data-v');
        summary();
      });
    });
    swatches.forEach(function (b) {
      b.addEventListener('click', function () {
        swatches.forEach(function (x) { x.classList.remove('active'); });
        b.classList.add('active');
        col = b.getAttribute('data-v');
        summary();
      });
    });
    document.getElementById('minus').addEventListener('click', function () {
      if (qty > 1) { qty--; qtyUI(); summary(); }
    });
    document.getElementById('plus').addEventListener('click', function () {
      if (qty < 10) { qty++; qtyUI(); summary(); }
    });

    document.getElementById('buyBtn').addEventListener('click', function () {
      var buy = document.getElementById('buyBtn');
      buy.textContent = "已下单 ✓";
      showToast("下单成功：" + col + " · " + sw + " × " + qty + "，稍后为你发货");
      if (buyTimer) { clearTimeout(buyTimer); }
      buyTimer = setTimeout(function () { buy.textContent = "立即购买"; }, 1800);
    });
    document.getElementById('addBtn').addEventListener('click', function () {
      showToast("已加入购物袋：" + col + " · " + sw + " × " + qty);
    });
    document.getElementById('cartBtn').addEventListener('click', function () {
      showToast("购物袋：可选配 " + col + " · " + sw);
    });

    qtyUI();
  })();
</script>
</body>
</html>
