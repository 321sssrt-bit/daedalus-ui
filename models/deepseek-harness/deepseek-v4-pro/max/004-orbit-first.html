<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>星图 · 新手引导</title>
<style>
  :root {
    --bg-deep: #070a1f;
    --bg-mid: #141a45;
    --bg-purple: #2a1a63;
    --primary: #7c5cff;
    --cyan: #59d0ff;
    --text: #eae9ff;
    --muted: #9aa0c9;
    --line: #3a3f6e;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", "Helvetica Neue", sans-serif;
    color: var(--text);
    background:
      radial-gradient(1200px 720px at 18% -12%, var(--bg-mid) 0%, transparent 58%),
      radial-gradient(980px 640px at 104% 112%, var(--bg-purple) 0%, transparent 55%),
      linear-gradient(158deg, var(--bg-deep) 0%, #0b1030 46%, var(--bg-deep) 100%);
    overflow-x: hidden;
  }
  .stars {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      radial-gradient(1.4px 1.4px at 12% 24%, rgba(234,233,255,.95), transparent 62%),
      radial-gradient(1px 1px at 27% 68%, rgba(89,208,255,.85), transparent 62%),
      radial-gradient(1.6px 1.6px at 44% 14%, rgba(234,233,255,.75), transparent 62%),
      radial-gradient(1px 1px at 61% 42%, rgba(89,208,255,.7), transparent 62%),
      radial-gradient(1.3px 1.3px at 72% 76%, rgba(234,233,255,.8), transparent 62%),
      radial-gradient(1px 1px at 86% 22%, rgba(234,233,255,.6), transparent 62%),
      radial-gradient(1.5px 1.5px at 94% 58%, rgba(89,208,255,.75), transparent 62%),
      radial-gradient(1px 1px at 8% 88%, rgba(234,233,255,.7), transparent 62%);
    animation: twinkle 7s ease-in-out infinite;
  }
  @keyframes twinkle { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
  .page {
    position: relative; z-index: 1;
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 48px 24px 40px;
  }
  .topbar {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: 22px 36px;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: .02em; }
  .brand .mark {
    width: 26px; height: 26px; border-radius: 8px;
    background: radial-gradient(circle at 32% 30%, var(--cyan), var(--primary));
    box-shadow: 0 0 16px rgba(124,92,255,.7);
  }
  .skip {
    color: var(--muted); text-decoration: none; font-size: 14px;
    padding: 8px 14px; border-radius: 8px;
    border: 1px solid var(--line); background: rgba(20,26,69,.4);
    transition: color .18s ease, border-color .18s ease;
  }
  .skip:hover { color: var(--text); border-color: var(--cyan); }
  .skip:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
  .card {
    width: 100%; max-width: 520px;
    text-align: center;
  }
  .hero { width: 260px; height: 210px; margin: 0 auto 6px; }
  .hero .glow { animation: pulse 4.5s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .28; } 50% { opacity: .5; } }
  .steps {
    display: flex; width: 100%; max-width: 400px;
    margin: 0 auto 34px;
  }
  .step { position: relative; flex: 1; text-align: center; }
  .step::before {
    content: ""; position: absolute; top: 13px; left: -50%;
    width: 100%; height: 2px; background: var(--line);
    transition: background .25s ease;
  }
  .step:first-child::before { display: none; }
  .step .dot {
    position: relative; z-index: 1;
    display: inline-flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; border-radius: 50%;
    border: 2px solid var(--line); background: var(--bg-deep);
    font-size: 13px; color: var(--muted);
    transition: border-color .25s ease, background .25s ease, color .25s ease;
  }
  .step .lab { display: block; margin-top: 10px; font-size: 13px; color: var(--muted); }
  .step.is-done::before, .step.is-active::before { background: var(--primary); }
  .step.is-done .dot { background: var(--primary); border-color: var(--primary); color: #fff; }
  .step.is-active .dot {
    border-color: var(--cyan); color: var(--text);
    box-shadow: 0 0 0 5px rgba(89,208,255,.14), 0 0 18px rgba(89,208,255,.5);
    animation: nodePulse 2.4s ease-in-out infinite;
  }
  .step.is-active .lab { color: var(--text); }
  @keyframes nodePulse { 0%,100% { box-shadow: 0 0 0 4px rgba(89,208,255,.12), 0 0 14px rgba(89,208,255,.45); } 50% { box-shadow: 0 0 0 8px rgba(89,208,255,.06), 0 0 22px rgba(89,208,255,.65); } }
  .slide { display: none; }
  .slide.is-active { display: block; animation: fade .3s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  h1 { margin: 0 0 12px; font-size: 34px; font-weight: 700; letter-spacing: .01em; }
  .desc { margin: 0 auto 26px; max-width: 380px; font-size: 16px; line-height: 1.75; color: var(--muted); }
  .features { margin: 0 auto 30px; max-width: 360px; text-align: left; display: grid; gap: 12px; }
  .feature {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px;
    background: rgba(20,26,69,.35); text-align: left;
  }
  .feature .ic {
    flex: 0 0 auto; width: 34px; height: 34px; border-radius: 9px;
    display: inline-flex; align-items: center; justify-content: center;
    background: rgba(124,92,255,.18); color: var(--cyan); font-size: 17px;
  }
  .feature b { display: block; font-size: 15px; margin-bottom: 3px; }
  .feature span { font-size: 13px; color: var(--muted); line-height: 1.6; }
  .actions { display: flex; justify-content: center; gap: 14px; margin-top: 4px; }
  button {
    font-family: inherit; font-size: 16px; cursor: pointer;
    border-radius: 10px; transition: transform .12s ease, background .18s ease, box-shadow .18s ease, border-color .18s ease;
  }
  .btn-primary {
    min-width: 168px; padding: 13px 26px;
    background: linear-gradient(135deg, var(--primary), #5b3bff);
    border: 1px solid transparent; color: #fff; font-weight: 600;
    box-shadow: 0 8px 24px rgba(124,92,255,.35);
  }
  .btn-primary:hover { box-shadow: 0 10px 30px rgba(124,92,255,.5); transform: translateY(-1px); }
  .btn-primary:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
  .btn-primary:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
  .btn-ghost {
    min-width: 120px; padding: 13px 22px;
    background: transparent; border: 1px solid var(--line); color: var(--text);
  }
  .btn-ghost:hover { border-color: var(--cyan); background: rgba(89,208,255,.08); }
  .btn-ghost:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
  .btn-ghost:disabled { opacity: .4; cursor: not-allowed; }
  .toast {
    position: fixed; left: 50%; bottom: 34px; transform: translateX(-50%) translateY(12px);
    padding: 12px 20px; border-radius: 10px;
    background: #10163a; border: 1px solid var(--line); color: var(--text);
    font-size: 14px; opacity: 0; pointer-events: none;
    transition: opacity .25s ease, transform .25s ease;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  @media (max-width: 768px) {
    .topbar { padding: 18px 20px; }
    .page { padding: 120px 18px 32px; }
    h1 { font-size: 27px; }
    .hero { width: 210px; height: 170px; }
    .actions { flex-direction: column-reverse; align-items: stretch; }
    .btn-primary, .btn-ghost { width: 100%; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
  <div class="stars" aria-hidden="true"></div>
  <header class="topbar">
    <div class="brand"><span class="mark"></span>星图 Stellar</div>
    <a class="skip" id="skip-link" href="#">跳过引导</a>
  </header>

  <main class="page">
    <div class="card">
      <svg class="hero" viewBox="0 0 320 240" aria-hidden="true">
        <defs>
          <radialGradient id="planet-g" cx="38%" cy="32%" r="72%">
            <stop offset="0%" stop-color="#7c5cff"/>
            <stop offset="55%" stop-color="#2a1a63"/>
            <stop offset="100%" stop-color="#141a45"/>
          </radialGradient>
          <radialGradient id="glow-g" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#59d0ff" stop-opacity=".9"/>
            <stop offset="100%" stop-color="#59d0ff" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <circle class="glow" cx="160" cy="120" r="96" fill="url(#glow-g)"/>
        <circle cx="160" cy="120" r="50" fill="url(#planet-g)"/>
        <ellipse cx="160" cy="120" rx="112" ry="28" fill="none" stroke="#59d0ff" stroke-opacity=".5" stroke-width="1.2" stroke-dasharray="3 7"/>
        <circle cx="272" cy="120" r="5" fill="#7c5cff"/>
        <circle cx="48" cy="120" r="4" fill="#59d0ff"/>
        <circle cx="160" cy="120" r="50" fill="none" stroke="#eae9ff" stroke-opacity=".12" stroke-width="1"/>
      </svg>

      <div class="steps" aria-label="引导进度">
        <div class="step is-active" id="node-1"><span class="dot">1</span><span class="lab">欢迎</span></div>
        <div class="step" id="node-2"><span class="dot">2</span><span class="lab">看懂</span></div>
        <div class="step" id="node-3"><span class="dot">3</span><span class="lab">首航</span></div>
      </div>

      <section class="slide is-active">
        <h1 id="slide-title-1">欢迎来到星图</h1>
        <p class="desc" id="slide-desc-1">星图把散落在各处的云资源收进同一片星空。跟着几步指引，很快你就能看清全局。</p>
      </section>

      <section class="slide">
        <h1 id="slide-title-2">三步看懂全局</h1>
        <div class="features">
          <div class="feature"><span class="ic">◉</span><div><b>观测</b><span>把实例、存储与告警并排陈列，一眼看到健康度。</span></div></div>
          <div class="feature"><span class="ic">⇄</span><div><b>连接</b><span>把相关资源串成一条链路，快速定位影响范围。</span></div></div>
          <div class="feature"><span class="ic">✧</span><div><b>巡航</b><span>保存常用视角，下次直接回到最关心的区域。</span></div></div>
        </div>
      </section>

      <section class="slide">
        <h1 id="slide-title-3">准备就绪，开始首航</h1>
        <p class="desc" id="slide-desc-3">你的星空已经点亮。点击「开始使用」，我们会为你生成第一张资源地图。</p>
      </section>

      <div class="actions">
        <button class="btn-ghost" id="btn-prev" type="button">上一步</button>
        <button class="btn-primary" id="btn-next" type="button">下一步</button>
      </div>
    </div>
  </main>

  <div class="toast" id="toast" role="status"></div>

<script>
(function () {
  var step = 0;
  var total = 3;
  var slides = document.querySelectorAll('.slide');
  var nodes = document.querySelectorAll('.step');
  var prevBtn = document.getElementById('btn-prev');
  var nextBtn = document.getElementById('btn-next');
  var skipBtn = document.getElementById('skip-link');
  var toast = document.getElementById('toast');
  var toastTimer = null;

  function render() {
    slides.forEach(function (s, i) { s.classList.toggle('is-active', i === step); });
    nodes.forEach(function (n, i) {
      n.classList.toggle('is-done', i < step);
      n.classList.toggle('is-active', i === step);
    });
    prevBtn.disabled = (step === 0);
    nextBtn.textContent = (step === total - 1) ? '开始使用' : '下一步';
  }

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    if (toastTimer) { clearTimeout(toastTimer); }
    toastTimer = setTimeout(function () { toast.classList.remove('show'); }, 2200);
  }

  prevBtn.addEventListener('click', function () {
    if (step > 0) { step -= 1; render(); }
  });
  nextBtn.addEventListener('click', function () {
    if (step < total - 1) { step += 1; render(); }
    else { showToast('正在进入你的星图…'); }
  });
  skipBtn.addEventListener('click', function (e) {
    e.preventDefault();
    step = total - 1;
    render();
    showToast('已跳过引导，随时可在帮助中重新查看');
  });

  render();
})();
</script>
</body>
</html>
