<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>轻云笔记 · 我的笔记</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,"Segoe UI","Microsoft YaHei","PingFang SC","Helvetica Neue",sans-serif;
  background:#eaf4fc;
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  padding:28px 16px;
}
.phone{
  width:390px;height:844px;max-height:94vh;
  border-radius:46px;
  border:9px solid #22323f;
  box-shadow:0 30px 60px rgba(31,74,102,.28), inset 0 0 0 2px rgba(255,255,255,.5);
  overflow:hidden;
  display:flex;flex-direction:column;
  background:#ffffff;
  position:relative;
}
.statusbar{
  flex:0 0 auto;height:46px;padding:0 22px;
  display:flex;align-items:center;justify-content:space-between;
  background:#ffffff;color:#24435c;font-size:14px;font-weight:600;
  border-bottom:1px solid #e3f0f9;
}
.statusbar .right{display:flex;align-items:center;gap:6px}
.statusbar svg{display:block}
.screen{flex:1;overflow-y:auto;display:flex;flex-direction:column;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.topbar{padding:18px 20px 4px}
.topbar .brand{font-size:22px;font-weight:700;color:#24435c;letter-spacing:.02em}
.topbar .sub{font-size:13px;color:#7b96ac;margin-top:4px}
.seg{display:flex;gap:8px;padding:16px 20px 6px}
.seg button{
  flex:1;border:0;background:#eaf4fc;color:#7b96ac;
  font:inherit;font-size:13px;padding:9px 0;border-radius:14px;cursor:pointer;
}
.seg button.on{background:#2f7fc4;color:#ffffff;font-weight:600}
.emptystate{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 32px 40px;text-align:center}
.illus{position:relative;width:190px;height:150px;margin-bottom:18px}
.illus .sun{position:absolute;right:6px;top:6px;width:52px;height:52px;border-radius:50%;background:#ffd166;box-shadow:0 0 0 10px rgba(255,209,102,.25)}
.illus .cloud{position:absolute;left:12px;bottom:8px}
.emptystate h2{font-size:20px;color:#24435c;font-weight:700;margin-bottom:10px}
.emptystate p{font-size:14px;line-height:1.8;color:#7b96ac;max-width:250px}
.actions{width:100%;padding:0 20px 26px;display:flex;flex-direction:column;gap:12px}
.primary{
  border:0;background:#4aa3e8;color:#ffffff;font:inherit;font-size:16px;font-weight:600;
  padding:15px;border-radius:16px;cursor:pointer;box-shadow:0 8px 20px rgba(74,163,232,.32);
}
.primary:hover{background:#2f7fc4}
.primary:focus-visible{outline:3px solid #ffd166;outline-offset:2px}
.ghost{
  border:1px solid #d9e9f5;background:#ffffff;color:#2f7fc4;font:inherit;font-size:14px;font-weight:600;
  padding:14px;border-radius:16px;cursor:pointer;
}
.ghost:hover{background:#eaf4fc}
.listhead{display:none;padding:8px 20px 4px;font-size:13px;color:#7b96ac}
.list{display:none;padding:6px 20px 12px;flex-direction:column;gap:12px}
.card{background:#ffffff;border:1px solid #d9e9f5;border-radius:18px;padding:16px;box-shadow:0 4px 14px rgba(31,74,102,.06)}
.card .t{font-size:16px;font-weight:600;color:#24435c;margin-bottom:6px}
.card .b{font-size:13px;color:#7b96ac;line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .meta{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:12px;color:#7b96ac}
.card .tag{background:#eaf4fc;color:#2f7fc4;border-radius:8px;padding:3px 8px;font-size:11px}
.tabbar{
  flex:0 0 auto;display:flex;border-top:1px solid #e3f0f9;background:#ffffff;padding:8px 6px 12px;
}
.tabbar button{
  flex:1;border:0;background:none;color:#7b96ac;font:inherit;font-size:11px;
  display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;padding:6px 0;
}
.tabbar button.on{color:#2f7fc4}
.tabbar svg{display:block}
.toast{
  position:absolute;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);
  background:#24435c;color:#ffffff;font-size:13px;padding:10px 16px;border-radius:22px;
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;white-space:nowrap;z-index:30;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.sheet{
  position:absolute;inset:0;z-index:40;display:none;align-items:flex-end;background:rgba(36,67,92,.38);
}
.sheet.show{display:flex}
.sheet .panel{
  width:100%;background:#ffffff;border-radius:26px 26px 0 0;padding:22px 20px 30px;
  animation:up .28s ease;
}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
.sheet h3{font-size:18px;color:#24435c;margin-bottom:16px}
.sheet label{display:block;font-size:13px;color:#7b96ac;margin:14px 0 6px}
.sheet input,.sheet textarea{
  width:100%;border:1px solid #d9e9f5;border-radius:14px;background:#f4faff;
  font:inherit;font-size:15px;color:#24435c;padding:12px 14px;outline:none;resize:none;
}
.sheet input:focus,.sheet textarea:focus{border-color:#4aa3e8;background:#ffffff}
.sheet textarea{height:96px}
.sheet .row{display:flex;gap:12px;margin-top:20px}
.sheet .row .primary{flex:1.4}
.sheet .row .ghost{flex:1}
.sheet .err{color:#e0533f;font-size:12px;margin-top:8px;display:none}
@media (max-width:480px){
  body{padding:0}
  .phone{width:100%;height:100vh;max-height:none;border-radius:0;border:0;box-shadow:none}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="phone">
  <div class="statusbar">
    <span>9:41</span>
    <span class="right">
      <svg width="17" height="12" viewBox="0 0 17 12" aria-hidden="true"><rect x="0" y="8" width="3" height="4" rx="1" fill="#24435c"/><rect x="4.5" y="6" width="3" height="6" rx="1" fill="#24435c"/><rect x="9" y="3" width="3" height="9" rx="1" fill="#24435c"/><rect x="13.5" y="0" width="3" height="12" rx="1" fill="#24435c" opacity=".35"/></svg>
      <svg width="17" height="12" viewBox="0 0 17 12" aria-hidden="true"><path d="M1 5.2 A7.5 7.5 0 0 1 16 5.2 L13.8 7.6 A4.5 4.5 0 0 0 3.2 7.6 Z" fill="#24435c"/><circle cx="8.5" cy="10" r="1.6" fill="#24435c"/></svg>
      <svg width="26" height="13" viewBox="0 0 26 13" aria-hidden="true"><rect x="0.5" y="0.5" width="21" height="12" rx="3.5" fill="none" stroke="#24435c" opacity=".5"/><rect x="2.5" y="2.5" width="16" height="8" rx="1.5" fill="#24435c"/><rect x="22.5" y="4" width="3" height="5" rx="1" fill="#24435c" opacity=".5"/></svg>
    </span>
  </div>

  <div class="screen" id="screen">
    <div class="topbar">
      <div class="brand">轻云笔记</div>
      <div class="sub" id="sub">你的想法，都轻轻浮在云端</div>
    </div>
    <div class="seg">
      <button class="on" type="button" data-seg="全部">全部</button>
      <button type="button" data-seg="收藏">收藏</button>
      <button type="button" data-seg="归档">归档</button>
    </div>

    <section class="emptystate" id="empty">
      <div class="illus" aria-hidden="true">
        <span class="sun"></span>
        <svg class="cloud" width="150" height="96" viewBox="0 0 150 96" aria-hidden="true">
          <path d="M38 82 Q26 82 26 72 Q26 63 36 62 Q37 48 52 46 Q66 44 70 55 Q80 50 90 56 Q102 55 104 66 Q116 68 115 78 Q114 86 103 86 Z" fill="#ffffff" stroke="#d9e9f5" stroke-width="2"/>
        </svg>
      </div>
      <h2>云里还没有笔记</h2>
      <p>写下第一个想法，它会被安安全全地存进云端，换台设备也能接着看。</p>
    </section>

    <div class="listhead" id="listhead">共 <b id="count">0</b> 条笔记 · 已同步到云端</div>
    <div class="list" id="list"></div>
  </div>

  <div class="actions" id="actions">
    <button class="primary" type="button" id="create">＋ 新建第一条笔记</button>
    <button class="ghost" type="button" id="sample">看看示例笔记</button>
  </div>

  <nav class="tabbar">
    <button class="on" type="button" data-tab="首页">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11 L12 4 L20 11 L20 20 L14 20 L14 14 L10 14 L10 20 L4 20 Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      首页
    </button>
    <button type="button" data-tab="收藏">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4 L14.5 9.5 L20.5 10 L16 14 L17.5 20 L12 16.5 L6.5 20 L8 14 L3.5 10 L9.5 9.5 Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      收藏
    </button>
    <button type="button" data-tab="新建">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 8.5 L12 15.5 M8.5 12 L15.5 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      新建
    </button>
    <button type="button" data-tab="我的">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M4.5 20 Q7 15 12 15 Q17 15 19.5 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      我的
    </button>
  </nav>

  <div class="toast" id="toast"></div>

  <div class="sheet" id="sheet">
    <div class="panel">
      <h3>新建笔记</h3>
      <label for="ntitle">标题</label>
      <input id="ntitle" type="text" placeholder="给这条笔记起个名字">
      <label for="nbody">正文</label>
      <textarea id="nbody" placeholder="写下此刻的想法…"></textarea>
      <div class="err" id="nerr">请先写一个标题，再保存到云端。</div>
      <div class="row">
        <button class="primary" type="button" id="save">保存到云端</button>
        <button class="ghost" type="button" id="close">取消</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  var empty=document.getElementById("empty");
  var list=document.getElementById("list");
  var listhead=document.getElementById("listhead");
  var count=document.getElementById("count");
  var actions=document.getElementById("actions");
  var sub=document.getElementById("sub");
  var sheet=document.getElementById("sheet");
  var ntitle=document.getElementById("ntitle");
  var nbody=document.getElementById("nbody");
  var nerr=document.getElementById("nerr");
  var toast=document.getElementById("toast");
  var total=0;

  function showToast(msg){
    toast.textContent=msg;
    toast.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t=setTimeout(function(){toast.classList.remove("show");},2200);
  }

  function addNote(title,body,tag){
    total++;
    var c=document.createElement("div");
    c.className="card";
    var bodyHtml=body.replace(/</g,"&lt;");
    c.innerHTML='<div class="t">'+title.replace(/</g,"&lt;")+'</div>'+
      (body?('<div class="b">'+bodyHtml+'</div>'):'')+
      '<div class="meta"><span>刚刚 · 已同步</span><span class="tag">'+tag+'</span></div>';
    list.appendChild(c);
    count.textContent=total;
    empty.style.display="none";
    list.style.display="flex";
    listhead.style.display="block";
    actions.style.display="none";
  }

  document.getElementById("create").addEventListener("click",function(){
    ntitle.value="";nbody.value="";nerr.style.display="none";
    sheet.classList.add("show");ntitle.focus();
  });
  document.getElementById("sample").addEventListener("click",function(){
    addNote("周末去海边","记得带上防晒霜、泳镜和一本想读很久的书。","想法");
    showToast("已添加示例笔记");
  });
  document.getElementById("close").addEventListener("click",function(){
    sheet.classList.remove("show");
  });
  document.getElementById("save").addEventListener("click",function(){
    var t=ntitle.value.trim();
    if(!t){nerr.style.display="block";return;}
    addNote(t,nbody.value.trim(),"新建");
    sheet.classList.remove("show");
    showToast("已保存到云端");
  });
  sheet.addEventListener("click",function(e){if(e.target===sheet){sheet.classList.remove("show");}});

  var segs=document.querySelectorAll(".seg button");
  segs.forEach(function(b){
    b.addEventListener("click",function(){
      segs.forEach(function(x){x.classList.remove("on");});
      b.classList.add("on");
      if(b.getAttribute("data-seg")==="收藏" && total===0){showToast("收藏夹也还空空的");}
      if(b.getAttribute("data-seg")==="归档" && total===0){showToast("还没有可以归档的内容");}
    });
  });

  var tabs=document.querySelectorAll(".tabbar button");
  tabs.forEach(function(b){
    b.addEventListener("click",function(){
      tabs.forEach(function(x){x.classList.remove("on");});
      b.classList.add("on");
      var t=b.getAttribute("data-tab");
      if(t==="新建"){ntitle.value="";nbody.value="";nerr.style.display="none";sheet.classList.add("show");}
      else if(t==="收藏"){showToast("「收藏」演示页");}
      else if(t==="我的"){showToast("「我的」演示页");}
      else{sub.textContent= total>0 ? "共 "+total+" 条笔记 · 全部已同步" : "你的想法，都轻轻浮在云端";}
    });
  });
})();
</script>
</body>
</html>
