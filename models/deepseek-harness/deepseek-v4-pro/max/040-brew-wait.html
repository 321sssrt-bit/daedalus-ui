<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>拾光咖啡 · 排队取餐</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,"Segoe UI","Microsoft YaHei","PingFang SC","Helvetica Neue",sans-serif;
  background:#ecd9c0;
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  padding:28px 16px;
}
.phone{
  width:390px;height:844px;max-height:94vh;
  border-radius:46px;
  border:9px solid #3f2a18;
  box-shadow:0 30px 60px rgba(90,58,36,.3), inset 0 0 0 2px rgba(255,255,255,.5);
  overflow:hidden;
  display:flex;flex-direction:column;
  background:#f6ead8;
  position:relative;
}
.statusbar{
  flex:0 0 auto;height:46px;padding:0 22px;
  display:flex;align-items:center;justify-content:space-between;
  background:#f6ead8;color:#5a3a24;font-size:14px;font-weight:600;
  border-bottom:1px solid #e7d3b6;
}
.statusbar .right{display:flex;align-items:center;gap:6px}
.statusbar svg{display:block}
.screen{flex:1;overflow-y:auto;display:flex;flex-direction:column;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.header{padding:22px 22px 6px}
.header .brand{font-size:20px;font-weight:700;color:#5a3a24}
.header .sub{font-size:13px;color:#b98a6a;margin-top:4px}
.queue{display:flex;flex-direction:column;align-items:center;padding:6px 22px 10px}
.cupArea{position:relative;height:150px;width:150px;display:flex;align-items:flex-end;justify-content:center;margin-bottom:6px}
.steam{position:absolute;left:50%;top:8px;width:40px;height:44px;transform:translateX(-50%)}
.steam i{
  position:absolute;bottom:0;width:3px;height:18px;border-radius:2px;background:#e7b98a;
  opacity:0;animation:rise 2.6s ease-in-out infinite;
}
.steam i:nth-child(1){left:6px;animation-delay:0s}
.steam i:nth-child(2){left:18px;animation-delay:.7s}
.steam i:nth-child(3){left:30px;animation-delay:1.4s}
@keyframes rise{
  0%{transform:translateY(14px) scaleY(.5);opacity:0}
  45%{opacity:.75}
  100%{transform:translateY(-24px) scaleY(1.1);opacity:0}
}
.ticket{
  width:100%;background:#ffffff;border-radius:20px;padding:20px 20px 22px;
  box-shadow:0 10px 26px rgba(90,58,36,.12);border:1px solid #ecd9c0;
}
.ticket .numRow{display:flex;align-items:baseline;justify-content:space-between}
.ticket .num{font-size:40px;font-weight:800;color:#8a5a3b;line-height:1}
.ticket .num small{font-size:16px;font-weight:600;color:#b98a6a;margin-left:2px}
.ticket .tag{background:#ecd9c0;color:#8a5a3b;font-size:12px;font-weight:600;padding:5px 10px;border-radius:9px}
.ticket .order{font-size:17px;font-weight:700;color:#5a3a24;margin-top:14px}
.ticket .orderSub{font-size:13px;color:#b98a6a;margin-top:5px}
.stepper{display:flex;align-items:center;margin-top:20px}
.stepper .step{display:flex;flex-direction:column;align-items:center;gap:6px;width:74px}
.stepper .dot{
  width:26px;height:26px;border-radius:50%;background:#ecd9c0;color:#b98a6a;
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;
}
.stepper .lab{font-size:11px;color:#b98a6a;white-space:nowrap}
.stepper .step.done .dot{background:#c98f5f;color:#ffffff}
.stepper .step.done .lab{color:#8a5a3b}
.stepper .step.on .dot{background:#8a5a3b;color:#ffffff;box-shadow:0 0 0 5px rgba(138,90,59,.14)}
.stepper .step.on .lab{color:#5a3a24;font-weight:600}
.stepper .line{flex:1;height:2px;background:#ecd9c0;margin:0 4px;transform:translateY(-8px)}
.stepper .line.done{background:#c98f5f}
.progress{margin-top:18px;height:8px;border-radius:5px;background:#ecd9c0;overflow:hidden}
.progress .fill{display:block;height:100%;width:60%;border-radius:5px;background:#c98f5f;transition:width .5s}
.eta{margin-top:14px;font-size:13px;color:#b98a6a;display:flex;justify-content:space-between;align-items:center}
.eta b{color:#5a3a24;font-weight:700}
.eta .cd{font-family:ui-monospace,"SF Mono","Consolas",monospace;font-size:15px;color:#8a5a3b;font-weight:700}
.actions{padding:14px 22px 28px;display:flex;flex-direction:column;gap:12px}
.primary{
  border:0;background:#8a5a3b;color:#ffffff;font:inherit;font-size:16px;font-weight:700;
  padding:15px;border-radius:16px;cursor:pointer;box-shadow:0 8px 20px rgba(138,90,59,.28);
}
.primary:hover{background:#5a3a24}
.primary:focus-visible{outline:3px solid #e7b98a;outline-offset:2px}
.ghost{
  border:1px solid #d9c2a3;background:#ffffff;color:#8a5a3b;font:inherit;font-size:15px;font-weight:600;
  padding:14px;border-radius:16px;cursor:pointer;
}
.ghost:hover{background:#f6ead8}
.ghost.danger{color:#c0563f;border-color:#e7c8bd}
.ghost.danger:hover{background:#fbe9e5}
.banner{display:none;margin:0 22px 18px;padding:12px 14px;border-radius:16px;background:#5a3a24;color:#ffffff;
  box-shadow:0 12px 26px rgba(90,58,36,.4);align-items:center;gap:12px}
.banner.show{display:flex}
.banner .cup{flex:0 0 auto}
.banner .txt{flex:1}
.banner .txt .t{font-size:14px;font-weight:700}
.banner .txt .s{font-size:12px;color:#e7b98a;margin-top:3px}
.banner button{
  border:0;background:#c98f5f;color:#3f2a18;font:inherit;font-size:13px;font-weight:700;
  padding:8px 12px;border-radius:10px;cursor:pointer;
}
.cancelled{display:none;flex-direction:column;align-items:center;text-align:center;padding:30px 32px 10px}
.cancelled.show{display:flex}
.cancelled .big{font-size:22px;font-weight:700;color:#5a3a24}
.cancelled p{font-size:14px;color:#b98a6a;line-height:1.8;margin-top:10px;max-width:240px}
.sheet{
  position:absolute;inset:0;z-index:40;display:none;align-items:flex-end;background:rgba(90,58,36,.4);
}
.sheet.show{display:flex}
.sheet .panel{
  width:100%;background:#ffffff;border-radius:26px 26px 0 0;padding:24px 22px 30px;
  animation:up .28s ease;text-align:center;
}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
.sheet h3{font-size:19px;color:#5a3a24;margin-bottom:8px}
.sheet p{font-size:14px;color:#b98a6a;line-height:1.7}
.sheet .row{display:flex;gap:12px;margin-top:22px}
.sheet .row .primary{flex:1;background:#c0563f;box-shadow:0 8px 20px rgba(192,86,63,.28)}
.sheet .row .primary:hover{background:#a3442f}
.sheet .row .ghost{flex:1}
.toast{
  position:absolute;left:50%;bottom:96px;transform:translateX(-50%) translateY(16px);
  background:#5a3a24;color:#ffffff;font-size:13px;padding:10px 16px;border-radius:22px;
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;white-space:nowrap;z-index:30;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:480px){
  body{padding:0}
  .phone{width:100%;height:100vh;max-height:none;border-radius:0;border:0;box-shadow:none}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="phone">
  <div class="statusbar">
    <span>9:41</span>
    <span class="right">
      <svg width="17" height="12" viewBox="0 0 17 12" aria-hidden="true"><rect x="0" y="8" width="3" height="4" rx="1" fill="#5a3a24"/><rect x="4.5" y="6" width="3" height="6" rx="1" fill="#5a3a24"/><rect x="9" y="3" width="3" height="9" rx="1" fill="#5a3a24"/><rect x="13.5" y="0" width="3" height="12" rx="1" fill="#5a3a24" opacity=".35"/></svg>
      <svg width="17" height="12" viewBox="0 0 17 12" aria-hidden="true"><path d="M1 5.2 A7.5 7.5 0 0 1 16 5.2 L13.8 7.6 A4.5 4.5 0 0 0 3.2 7.6 Z" fill="#5a3a24"/><circle cx="8.5" cy="10" r="1.6" fill="#5a3a24"/></svg>
      <svg width="26" height="13" viewBox="0 0 26 13" aria-hidden="true"><rect x="0.5" y="0.5" width="21" height="12" rx="3.5" fill="none" stroke="#5a3a24" opacity=".5"/><rect x="2.5" y="2.5" width="16" height="8" rx="1.5" fill="#5a3a24"/><rect x="22.5" y="4" width="3" height="5" rx="1" fill="#5a3a24" opacity=".5"/></svg>
    </span>
  </div>

  <div class="screen" id="screen">
    <div class="header">
      <div class="brand">拾光咖啡</div>
      <div class="sub" id="sub">你的咖啡正在排队制作</div>
    </div>

    <section class="queue" id="queue">
      <div class="cupArea">
        <div class="steam" aria-hidden="true"><i></i><i></i><i></i></div>
        <svg width="120" height="104" viewBox="0 0 120 104" aria-hidden="true">
          <ellipse cx="60" cy="92" rx="52" ry="8" fill="#ecd9c0"/>
          <path d="M36 34 L42 82 Q60 92 78 82 L84 34 Z" fill="#ffffff" stroke="#ecd9c0" stroke-width="2"/>
          <rect x="30" y="20" width="60" height="16" rx="8" fill="#8a5a3b"/>
          <rect x="30" y="34" width="60" height="6" fill="#c98f5f"/>
          <path d="M84 38 Q100 42 100 58 Q100 72 82 76" fill="none" stroke="#8a5a3b" stroke-width="5" stroke-linecap="round"/>
        </svg>
      </div>

      <div class="ticket">
        <div class="numRow">
          <div class="num">3 <small>号</small></div>
          <span class="tag">堂食 · 前台取餐</span>
        </div>
        <div class="order">燕麦拿铁 · 大杯</div>
        <div class="orderSub">半糖 · 少冰 · 燕麦奶</div>

        <div class="stepper">
          <div class="step done"><span class="dot">✓</span><span class="lab">已接单</span></div>
          <div class="line done"></div>
          <div class="step on"><span class="dot">2</span><span class="lab">咖啡制作中</span></div>
          <div class="line"></div>
          <div class="step"><span class="dot">3</span><span class="lab">待取餐</span></div>
        </div>
        <div class="progress"><span class="fill" id="fill"></span></div>
        <div class="eta">
          <span>预计还需约 <b>1 分钟</b></span>
          <span class="cd" id="cd">0:45</span>
        </div>
      </div>
    </section>

    <section class="cancelled" id="cancelled">
      <svg width="80" height="80" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#ecd9c0"/><path d="M8.5 12 L11 14.5 L15.5 10" fill="none" stroke="#b98a6a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div class="big">订单已取消</div>
      <p>这杯咖啡先不做了。若还想喝，随时可以重新下一单。</p>
    </section>
  </div>

  <div class="banner" id="banner">
    <svg class="cup" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3 L7 19 Q12 21 17 19 L18 3 Z" fill="#c98f5f"/><rect x="4.5" y="2" width="15" height="3" rx="1.5" fill="#8a5a3b"/></svg>
    <div class="txt">
      <div class="t">3 号 · 燕麦拿铁 · 制作中</div>
      <div class="s" id="bannerSub">预计还需约 1 分钟</div>
    </div>
    <button type="button" id="backToQueue">回到队列</button>
  </div>

  <div class="actions" id="actions">
    <button class="primary" type="button" id="aside">放到一边</button>
    <button class="ghost danger" type="button" id="cancelBtn">取消订单</button>
  </div>

  <div class="sheet" id="sheet">
    <div class="panel">
      <h3>要取消这杯咖啡吗？</h3>
      <p>取消后本单作废，退款会原路退回。确定不喝了？</p>
      <div class="row">
        <button class="primary" type="button" id="confirmCancel">确认取消</button>
        <button class="ghost" type="button" id="keep">再想想</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
(function(){
  var queue=document.getElementById("queue");
  var cancelled=document.getElementById("cancelled");
  var banner=document.getElementById("banner");
  var bannerSub=document.getElementById("bannerSub");
  var actions=document.getElementById("actions");
  var sub=document.getElementById("sub");
  var sheet=document.getElementById("sheet");
  var cd=document.getElementById("cd");
  var fill=document.getElementById("fill");
  var toast=document.getElementById("toast");
  var secs=45;
  var step=1;
  var timer=null;
  var reduced=window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function showToast(msg){
    toast.textContent=msg;
    toast.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t=setTimeout(function(){toast.classList.remove("show");},2400);
  }

  function tick(){
    if(secs<=0){
      clearInterval(timer);
      step=2;
      fill.style.width="100%";
      cd.textContent="已就绪";
      sub.textContent="你的咖啡好了，请到 2 号台取餐";
      bannerSub.textContent="已就绪 · 请取餐";
      showToast("咖啡已好，请到 2 号台取餐");
      return;
    }
    secs--;
    var m=Math.floor(secs/60), s=secs%60;
    cd.textContent=(m>0?m+":":"0:")+(s<10?"0"+s:s);
    bannerSub.textContent="预计还需约 1 分钟 · 剩余 "+cd.textContent;
  }

  function startTimer(){
    if(reduced){cd.textContent="约 1 分钟";return;}
    if(timer){clearInterval(timer);}
    timer=setInterval(tick,1000);
  }

  document.getElementById("aside").addEventListener("click",function(){
    queue.style.display="none";
    cancelled.classList.remove("show");
    banner.classList.add("show");
    actions.style.display="none";
    sub.textContent="已放到后台，做好会通知你";
    showToast("已放到一边，做好会提醒你");
  });

  document.getElementById("backToQueue").addEventListener("click",function(){
    queue.style.display="flex";
    banner.classList.remove("show");
    actions.style.display="flex";
    sub.textContent="你的咖啡正在排队制作";
  });

  document.getElementById("cancelBtn").addEventListener("click",function(){
    sheet.classList.add("show");
  });
  document.getElementById("keep").addEventListener("click",function(){
    sheet.classList.remove("show");
  });
  sheet.addEventListener("click",function(e){if(e.target===sheet){sheet.classList.remove("show");}});

  document.getElementById("confirmCancel").addEventListener("click",function(){
    sheet.classList.remove("show");
    if(timer){clearInterval(timer);timer=null;}
    queue.style.display="none";
    banner.classList.remove("show");
    cancelled.classList.add("show");
    actions.style.display="none";
    sub.textContent="订单已取消";
    showToast("订单已取消，退款原路退回");
  });

  document.getElementById("cancelled").addEventListener("click",function(){
    /* 重新下单：点击取消态卡片即恢复排队 */
    cancelled.classList.remove("show");
    queue.style.display="flex";
    actions.style.display="flex";
    secs=45; step=1;
    fill.style.width="60%";
    cd.textContent="0:45";
    sub.textContent="你的咖啡正在排队制作";
    showToast("已重新下单，重新排队");
    startTimer();
  });

  startTimer();
})();
</script>
</body>
</html>
