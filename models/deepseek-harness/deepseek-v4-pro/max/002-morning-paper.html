<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>晨间 · 注册</title>
<style>
:root{
  --paper:#f6efe1;
  --card:#fffdf7;
  --ink:#2f2a22;
  --muted:#8a7c63;
  --copper:#b5542f;
  --line:#e8dcc4;
  --ok:#4a7c59;
  --err:#b33a3a;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,"Segoe UI","Microsoft YaHei","PingFang SC","Helvetica Neue",sans-serif;
  background:
    radial-gradient(circle at 12% 18%,rgba(181,84,47,.05),transparent 40%),
    radial-gradient(circle at 88% 82%,rgba(120,90,40,.06),transparent 42%),
    var(--paper);
  color:var(--ink);
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  padding:56px 24px;
}
.sheet{
  width:520px;max-width:100%;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  box-shadow:0 12px 0 -3px #e9dcc2,0 30px 60px -18px rgba(120,90,40,.38);
  padding:44px 46px 40px;
}
.masthead{text-align:center;margin-bottom:30px}
.masthead .kicker{font-size:13px;letter-spacing:.28em;color:var(--copper);margin-bottom:10px}
.masthead h1{
  font-family:Georgia,"Times New Roman","Songti SC","STSong",serif;
  font-weight:600;font-size:34px;letter-spacing:.04em;color:var(--ink);
}
.masthead .rule{
  width:56px;height:1px;background:var(--line);margin:16px auto 12px;
  position:relative;
}
.masthead .rule::after{content:"";position:absolute;left:50%;top:-3px;transform:translateX(-50%);width:7px;height:7px;border-radius:50%;background:var(--copper)}
.masthead .sub{font-size:14px;color:var(--muted)}
.field{margin-bottom:18px}
.field label{display:block;font-size:14px;color:var(--ink);margin-bottom:7px}
.field label em{color:var(--copper);font-style:normal;margin-left:3px}
.field input{
  width:100%;border:1px solid var(--line);border-radius:10px;
  background:#fbf6ea;color:var(--ink);
  font:inherit;font-size:15px;padding:12px 14px;outline:none;
  transition:border-color .18s ease, box-shadow .18s ease;
}
.field input::placeholder{color:#b6a98c}
.field input:focus{border-color:var(--copper);box-shadow:0 0 0 3px rgba(181,84,47,.14)}
.field input.invalid{border-color:var(--err);box-shadow:0 0 0 3px rgba(179,58,58,.12)}
.hint{display:none;font-size:12px;color:var(--err);margin-top:6px}
.hint.show{display:block}
.strength{display:none;margin-top:8px}
.strength.show{display:flex;align-items:center;gap:8px}
.strength .bars{display:flex;gap:4px;flex:1}
.strength .bars span{height:5px;flex:1;border-radius:3px;background:var(--line);transition:background .2s ease}
.strength .txt{font-size:12px;color:var(--muted);width:34px;text-align:right}
.strength.lv1 .bars span:nth-child(1){background:var(--err)}
.strength.lv2 .bars span:nth-child(-n+2){background:#d29a3f}
.strength.lv3 .bars span:nth-child(-n+3){background:var(--ok)}
.choice{display:flex;align-items:flex-start;gap:9px;margin:6px 0 8px;cursor:pointer;font-size:14px;color:var(--ink)}
.choice input{position:absolute;opacity:0;width:1px;height:1px}
.choice .box{flex:0 0 auto;width:19px;height:19px;border:1px solid var(--line);border-radius:6px;background:#fbf6ea;display:inline-flex;align-items:center;justify-content:center;font-size:13px;color:var(--card);margin-top:1px}
.choice input:checked + .box{background:var(--copper);border-color:var(--copper)}
.choice input:focus-visible + .box{outline:2px solid var(--copper);outline-offset:2px}
.choice .small{color:var(--muted);font-size:13px}
.submit{
  width:100%;border:0;border-radius:12px;
  background:var(--copper);color:#fffdf7;
  font:inherit;font-size:16px;font-weight:600;letter-spacing:.14em;
  padding:14px;cursor:pointer;margin-top:22px;
  box-shadow:0 6px 0 #8f3f22,0 14px 26px -10px rgba(181,84,47,.55);
  transition:transform .12s ease, box-shadow .12s ease;
}
.submit:hover{transform:translateY(1px);box-shadow:0 5px 0 #8f3f22,0 12px 22px -10px rgba(181,84,47,.55)}
.submit:active{transform:translateY(4px);box-shadow:0 2px 0 #8f3f22}
.submit:focus-visible{outline:3px solid var(--copper);outline-offset:3px}
.form-status{margin-top:14px;min-height:20px;font-size:13px;text-align:center}
.form-status.err{color:var(--err)}
.form-status.ok{color:var(--ok)}
.switch{margin-top:22px;text-align:center;font-size:14px;color:var(--muted)}
.switch button{background:none;border:0;color:var(--copper);font:inherit;font-size:14px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.switch button:hover{color:var(--ink)}
.foot{margin-top:26px;padding-top:16px;border-top:1px dashed var(--line);text-align:center;font-size:12px;color:var(--muted);line-height:1.8}
.welcome{display:none;text-align:center}
.welcome.show{display:block}
.welcome .seal{margin:8px auto 22px;width:72px;height:72px;border-radius:50%;background:var(--copper);color:#fffdf7;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 4px #fffdf7,0 6px 16px -4px rgba(181,84,47,.6)}
.welcome .seal svg{width:40px;height:40px}
.welcome h2{font-family:Georgia,"Times New Roman","Songti SC","STSong",serif;font-weight:600;font-size:26px;margin-bottom:12px}
.welcome p{font-size:14px;color:var(--muted);line-height:1.9}
.welcome p b{color:var(--ink);font-weight:600}
.welcome .again{margin-top:26px;background:none;border:1px solid var(--line);border-radius:12px;color:var(--ink);font:inherit;font-size:14px;padding:11px 22px;cursor:pointer}
.welcome .again:hover{border-color:var(--copper);color:var(--copper)}
@media (max-width:768px){
  body{padding:32px 16px}
  .sheet{padding:30px 24px 28px}
  .masthead h1{font-size:28px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<main class="sheet" role="main">
  <div class="masthead">
    <div class="kicker">晨间 · 每日一读</div>
    <h1>注册账号</h1>
    <div class="rule"></div>
    <p class="sub">早上好，给自己留一杯咖啡的时间。</p>
  </div>

  <form id="form" novalidate>
    <div class="field">
      <label for="nickname">昵称<em>*</em></label>
      <input id="nickname" type="text" autocomplete="nickname" placeholder="大家怎么称呼你">
      <p class="hint" id="hintNick">请填写一个昵称，至少 2 个字。</p>
    </div>

    <div class="field">
      <label for="email">邮箱<em>*</em></label>
      <input id="email" type="email" autocomplete="email" placeholder="name@example.com">
      <p class="hint" id="hintEmail">请输入有效的邮箱地址。</p>
    </div>

    <div class="field">
      <label for="password">设置密码<em>*</em></label>
      <input id="password" type="password" autocomplete="new-password" placeholder="至少 8 位，建议混合数字与字母">
      <div class="strength" id="strength">
        <span class="bars"><span></span><span></span><span></span></span>
        <span class="txt" id="strengthTxt"></span>
      </div>
    </div>

    <div class="field">
      <label for="confirm">确认密码<em>*</em></label>
      <input id="confirm" type="password" autocomplete="new-password" placeholder="再输入一遍">
      <p class="hint" id="hintConfirm">两次输入的密码不一致。</p>
    </div>

    <label class="choice">
      <input id="news" type="checkbox" checked>
      <span class="box">✓</span>
      <span>订阅晨报，每周一至周六早 7:00 送达<span class="small">（可随时退订）</span></span>
    </label>

    <label class="choice">
      <input id="terms" type="checkbox">
      <span class="box">✓</span>
      <span>我已阅读并同意<span class="small">《用户协议》与《隐私政策》</span></span>
    </label>

    <button class="submit" id="submit" type="submit">领取我的晨间账号</button>

    <p class="form-status" id="formStatus" role="status"></p>
  </form>

  <div class="welcome" id="welcome" role="status">
    <div class="seal" aria-hidden="true">
      <svg viewBox="0 0 40 40" fill="none">
        <path d="M20 3 23 14 33 9 29 20 37 23 27 27 33 36 23 32 20 40 17 32 7 36 13 27 3 23 11 20 7 9 17 14Z" fill="#fffdf7" opacity=".92"/>
        <circle cx="20" cy="21" r="6" fill="none" stroke="#b5542f" stroke-width="1.6"/>
      </svg>
    </div>
    <h2>欢迎加入晨间</h2>
    <p id="welcomeText">你的账号已经准备好了。</p>
    <button class="again" id="again" type="button">再注册一个账号</button>
  </div>

  <div class="switch" id="switchRow">
    已经有账号？<button id="loginLink" type="button">直接登录</button>
  </div>

  <p class="foot">注册即表示你同意我们只在明早 7:00 打扰你一次。<br>晨间 · 把慢一点的日子读给你听。</p>
</main>

<script>
(function(){
  var form = document.getElementById("form");
  var nickname = document.getElementById("nickname");
  var email = document.getElementById("email");
  var password = document.getElementById("password");
  var confirm = document.getElementById("confirm");
  var terms = document.getElementById("terms");
  var submit = document.getElementById("submit");
  var formStatus = document.getElementById("formStatus");
  var strength = document.getElementById("strength");
  var strengthTxt = document.getElementById("strengthTxt");
  var welcome = document.getElementById("welcome");
  var welcomeText = document.getElementById("welcomeText");
  var switchRow = document.getElementById("switchRow");
  var again = document.getElementById("again");
  var loginLink = document.getElementById("loginLink");

  function showHint(el, on){ el.classList.toggle("show", on); el.parentElement.querySelector("input").classList.toggle("invalid", on); }

  function ratePwd(v){
    if (v.length === 0) { strength.classList.remove("show"); return; }
    strength.classList.add("show");
    strength.classList.remove("lv1","lv2","lv3");
    var score = 0;
    if (v.length >= 8) score++;
    if (/[0-9]/.test(v) && /[a-zA-Z]/.test(v)) score++;
    if (v.length >= 12) score++;
    var lv = score >= 3 ? "lv3" : (score === 2 ? "lv2" : "lv1");
    strength.classList.add(lv);
    strengthTxt.textContent = score >= 3 ? "强" : (score === 2 ? "中" : "弱");
  }

  password.addEventListener("input", function(){ ratePwd(password.value); });

  email.addEventListener("blur", function(){
    var ok = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim());
    showHint(document.getElementById("hintEmail"), email.value.trim() !== "" && !ok);
  });

  function setStatus(msg, cls){ formStatus.textContent = msg; formStatus.className = "form-status " + (cls || ""); }

  function validate(){
    var valid = true;
    var nick = nickname.value.trim();
    if (nick.length < 2) { showHint(document.getElementById("hintNick"), true); valid = false; }
    else { showHint(document.getElementById("hintNick"), false); }

    var em = email.value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)) { showHint(document.getElementById("hintEmail"), true); valid = false; }
    else { showHint(document.getElementById("hintEmail"), false); }

    var pwd = password.value;
    if (pwd.length < 8) { password.classList.add("invalid"); setStatus("密码至少需要 8 位。", "err"); valid = false; }
    else { password.classList.remove("invalid"); }

    if (confirm.value !== pwd || pwd === "") { showHint(document.getElementById("hintConfirm"), true); valid = false; }
    else { showHint(document.getElementById("hintConfirm"), false); }

    if (!terms.checked) { setStatus("请先阅读并勾选同意《用户协议》与《隐私政策》。", "err"); valid = false; }
    return valid;
  }

  form.addEventListener("submit", function(e){
    e.preventDefault();
    setStatus("", "");
    if (!validate()) { return; }
    welcomeText.textContent = "欢迎加入晨间，" + nickname.value.trim() + "。你的第一份晨报将在明早 7:00 送达 " + email.value.trim() + "。";
    form.style.display = "none";
    switchRow.style.display = "none";
    welcome.classList.add("show");
  });

  again.addEventListener("click", function(){
    welcome.classList.remove("show");
    form.style.display = "";
    switchRow.style.display = "";
    form.reset();
    strength.classList.remove("show");
    password.classList.remove("invalid");
    ["hintNick","hintEmail","hintConfirm"].forEach(function(id){
      var h = document.getElementById(id);
      h.classList.remove("show");
      h.parentElement.querySelector("input").classList.remove("invalid");
    });
    setStatus("", "");
  });

  loginLink.addEventListener("click", function(){
    setStatus("演示环境：这里应跳转到登录页，已有账号可直接登录。", "ok");
  });
})();
</script>
</body>
</html>
