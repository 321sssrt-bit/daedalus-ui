<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>阿迟 · 播客主理人主页</title>
<style>
:root{--bg:#f4f1ff;--violet:#5b2cf5;--mint:#3ff0b0;--peach:#ffb199;--ink:#120c2b;--sub:#625b7d;--white:#ffffff;--line:#e2dcf7}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:15px/1.55 "PingFang SC","Microsoft YaHei",system-ui,sans-serif}
.cover{height:220px;background:var(--violet);position:relative;overflow:hidden}
.cover svg{position:absolute;inset:0;width:100%;height:100%}
.top{position:absolute;top:18px;left:48px;right:48px;display:flex;justify-content:space-between;color:#fff;font-weight:800;z-index:1}
.wrap{max-width:1120px;margin:0 auto;padding:0 48px 56px;display:grid;grid-template-columns:320px 1fr;gap:40px}
.id{margin-top:-84px;position:relative}
.av{width:168px;height:168px;border-radius:44px;background:var(--peach);border:6px solid var(--bg);display:grid;place-items:center;font:900 64px/1 "PingFang SC",sans-serif;color:var(--ink);transform:rotate(-4deg)}
.id h1{font-size:34px;margin:18px 0 2px;letter-spacing:-.01em}
.id .hd{color:var(--sub);margin:0 0 10px}
.id .bio{margin:0 0 18px}
.stats{display:flex;gap:22px;margin-bottom:20px}
.stats b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--sub)}
.btns{display:flex;gap:10px;margin-bottom:22px}
.follow{flex:1;height:48px;border:0;border-radius:16px;background:var(--ink);color:#fff;font:inherit;font-weight:800;cursor:pointer;transition:background .15s}
.follow:hover{background:var(--violet)}
.follow[aria-pressed="true"]{background:var(--mint);color:var(--ink)}
.msg{height:48px;padding:0 18px;border:2px solid var(--ink);border-radius:16px;background:transparent;font:inherit;font-weight:800;cursor:pointer;color:var(--ink)}
.msg:hover{background:var(--white)}
.follow:focus-visible,.msg:focus-visible,.tabs button:focus-visible,.ep:focus-visible,.play:focus-visible{outline:3px solid var(--violet);outline-offset:3px}
.links{display:grid;gap:8px;font-size:14px}
.links a{display:flex;justify-content:space-between;padding:10px 14px;border-radius:12px;background:var(--white);color:var(--ink);text-decoration:none}
.links a:hover{background:#ebe5ff}
.form{display:none;margin-top:12px;background:var(--white);border-radius:16px;padding:14px}
.form.on{display:block}
.form textarea{width:100%;height:80px;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;resize:none}
.form textarea:focus{outline:none;border-color:var(--violet)}
.form button{margin-top:8px;height:38px;padding:0 16px;border:0;border-radius:12px;background:var(--violet);color:#fff;font:inherit;font-weight:700;cursor:pointer}
.main{padding-top:28px}
.tabs{display:flex;gap:6px;margin-bottom:18px}
.tabs button{height:38px;padding:0 16px;border-radius:999px;border:0;background:var(--white);font:inherit;font-weight:700;cursor:pointer;color:var(--sub)}
.tabs button[aria-selected="true"]{background:var(--ink);color:#fff}
.feat{display:grid;grid-template-columns:150px 1fr;gap:20px;background:var(--ink);color:#fff;border-radius:28px;padding:20px;margin-bottom:18px}
.feat .art{width:150px;height:150px;border-radius:20px;background:var(--mint);display:grid;place-items:center}
.feat small{color:var(--mint);font-weight:700}
.feat h2{margin:4px 0 8px;font-size:22px}
.feat p{margin:0 0 12px;color:#c8c2e2;font-size:14px}
.play{height:40px;padding:0 18px;border:0;border-radius:999px;background:var(--mint);color:var(--ink);font:inherit;font-weight:800;cursor:pointer}
.eps{display:grid;gap:10px}
.ep{display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center;background:var(--white);border-radius:18px;padding:12px 16px;border:2px solid transparent;cursor:pointer;width:100%;text-align:left;font:inherit;color:inherit}
.ep:hover{border-color:var(--violet)}
.ep .n{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;font-weight:900;font-size:18px}
.ep b{display:block}
.ep small{color:var(--sub)}
.ep .d{font-size:13px;color:var(--sub);text-align:right}
.ep[aria-pressed="true"]{border-color:var(--ink)}
.ep[aria-pressed="true"] .d{color:var(--violet);font-weight:800}
@media (max-width:960px){.wrap{grid-template-columns:1fr;padding:0 24px 40px}.top{left:24px;right:24px}.feat{grid-template-columns:1fr}.feat .art{width:100%;height:120px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.av{transform:none}}
</style>
</head>
<body>
<header class="cover"><div class="top"><span>回声电台</span><span>发现 · 排行 · 我的</span></div>
<svg viewBox="0 0 1280 220" preserveAspectRatio="none" aria-hidden="true"><path d="M0 150 C 200 80, 360 210, 560 140 S 900 60, 1280 150 L1280 220 L0 220Z" fill="#3ff0b0" opacity=".9"/><path d="M0 180 C 240 120, 420 230, 680 170 S 1040 110, 1280 190 L1280 220 L0 220Z" fill="#ffb199"/><g fill="#ffffff" opacity=".35"><rect x="900" y="40" width="6" height="40" rx="3"/><rect x="914" y="25" width="6" height="70" rx="3"/><rect x="928" y="50" width="6" height="22" rx="3"/><rect x="942" y="30" width="6" height="58" rx="3"/><rect x="956" y="45" width="6" height="30" rx="3"/></g></svg></header>
<div class="wrap">
  <section class="id">
    <div class="av" aria-hidden="true">迟</div>
    <h1>阿迟</h1><p class="hd">@achi_talks · 播客《慢半拍》主理人</p>
    <p class="bio">前建筑师，现在用声音盖房子。每周三聊城市、手艺和那些慢下来的人。</p>
    <div class="stats"><div><b id="fans">8.6 万</b><span>关注者</span></div><div><b>142</b><span>期节目</span></div><div><b>4.9</b><span>平均评分</span></div></div>
    <div class="btns"><button class="follow" id="follow" type="button" aria-pressed="false">＋ 关注</button><button class="msg" id="msg" type="button">联系合作</button></div>
    <form class="form" id="form"><label for="mt" style="font-size:13px;color:#625b7d">给阿迟留言（商务合作会在 3 个工作日内回复）</label><textarea id="mt" placeholder="你好，我们是…"></textarea><button type="submit">发送</button> <span id="sent" style="font-size:13px;color:#5b2cf5"></span></form>
    <div class="links" style="margin-top:14px"><a href="#">小宇宙 <span>→</span></a><a href="#">Apple 播客 <span>→</span></a><a href="#">合作邮箱 <span>hi@manbanpai.fm</span></a></div>
  </section>
  <section class="main">
    <div class="tabs" role="tablist"><button role="tab" aria-selected="true" data-t="ep">节目</button><button role="tab" aria-selected="false" data-t="post">动态</button></div>
    <div id="pane"></div>
  </section>
</div>
<script>
const E=[['142','在县城开一家书店，第三年','和「河边书屋」老板聊选书、租金和读者','52 分钟','#3ff0b0'],['141','老裁缝的最后一套西装','手工定制如何在快时尚里活下来','47 分钟','#ffb199'],['140','城市里的野生菜园','屋顶、阳台和社区花园的故事','38 分钟','#c8b6ff'],['139','建筑师为什么转行','我自己的故事，第一次讲完整','61 分钟','#ffe38a'],['138','修自行车的周师傅','一条街、一个摊、二十八年','44 分钟','#9ee7ff']];
const P=[['2 小时前','录完第 143 期了，嘉宾是一位做竹编的 90 后。下周三见 🎋'],['昨天','有听众寄来了自己做的书签，谢谢你，挂在录音桌上了。'],['10 月 6 日','《慢半拍》入选小宇宙 2026 年度人文类提名，谢谢每一位慢下来听我们说话的人。']];
let tab='ep',sel=0,fol=false;const pane=document.getElementById('pane');
function render(){if(tab==='ep'){pane.innerHTML='<div class="feat"><div class="art"><svg width="80" height="80" viewBox="0 0 80 80" aria-hidden="true"><circle cx="40" cy="40" r="36" fill="#120c2b"/><path d="M33 26l22 14-22 14z" fill="#3ff0b0"/></svg></div><div><small>最新一期 · EP'+E[sel][0]+'</small><h2>'+E[sel][1]+'</h2><p>'+E[sel][2]+' · '+E[sel][3]+'</p><button class="play" type="button" id="pl">▶ 播放</button></div></div><div class="eps">'+E.map((e,i)=>'<button type="button" class="ep" aria-pressed="'+(i===sel)+'" data-i="'+i+'"><span class="n" style="background:'+e[4]+'">'+e[0]+'</span><span><b>'+e[1]+'</b><small>'+e[2]+'</small></span><span class="d">'+(i===sel?'正在选中':e[3])+'</span></button>').join('')+'</div>';
 pane.querySelectorAll('.ep').forEach(b=>b.onclick=()=>{sel=+b.dataset.i;render()});document.getElementById('pl').onclick=e=>e.target.textContent=e.target.textContent.includes('播放')?'❚❚ 暂停':'▶ 播放'}
 else pane.innerHTML='<div class="eps">'+P.map(p=>'<div class="ep" style="cursor:default;grid-template-columns:1fr"><span><small>'+p[0]+'</small><b style="font-weight:400;margin-top:4px">'+p[1]+'</b></span></div>').join('')+'</div>'}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-selected',x===b));render()});
document.getElementById('follow').onclick=e=>{fol=!fol;e.target.setAttribute('aria-pressed',fol);e.target.textContent=fol?'✓ 已关注':'＋ 关注';document.getElementById('fans').textContent=fol?'8.6 万 +1':'8.6 万'};
document.getElementById('msg').onclick=()=>document.getElementById('form').classList.toggle('on');
document.getElementById('form').onsubmit=e=>{e.preventDefault();const v=document.getElementById('mt').value.trim();document.getElementById('sent').textContent=v?'已发送，阿迟会尽快回复。':'先写点什么吧'};
render();
</script>
</body>
</html>
