<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>找回密码 · 城市通行证</title>
<style>
:root{--red:#e30613;--red-d:#b8000c;--white:#ffffff;--black:#111111;--grey:#5e5e5e;--rule:#d0d0d0;--tint:#f4f4f4;--ok:#0a7a3d}
*{box-sizing:border-box}
body{margin:0;background:var(--white);color:var(--black);font:16px/1.5 "Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh}
header{display:grid;grid-template-columns:repeat(12,1fr);column-gap:24px;padding:0 64px;height:72px;align-items:center;border-bottom:4px solid var(--black)}
.mark{grid-column:span 4;display:flex;align-items:center;gap:12px;font-weight:700;font-size:18px}
.mark i{width:28px;height:28px;background:var(--red);position:relative}
.mark i:before,.mark i:after{content:"";position:absolute;background:#fff}
.mark i:before{left:12px;top:5px;width:4px;height:18px}.mark i:after{top:12px;left:5px;height:4px;width:18px}
header nav{grid-column:9/13;text-align:right;font-size:14px}
header nav a{color:var(--black);margin-left:24px;text-decoration:none;border-bottom:2px solid transparent}
header nav a:hover{border-color:var(--red)}
main{display:grid;grid-template-columns:repeat(12,1fr);column-gap:24px;padding:56px 64px}
.num{grid-column:1/4;font-weight:700;font-size:168px;line-height:.8;color:var(--red);letter-spacing:-.06em}
.col{grid-column:5/11}
.kicker{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--red);margin:0 0 12px}
h1{font-size:44px;line-height:1.1;margin:0 0 20px;font-weight:700;letter-spacing:-.01em}
.lead{font-size:18px;color:var(--grey);max-width:560px;margin:0 0 40px}
.seg{display:inline-flex;border:2px solid var(--black);margin-bottom:24px}
.seg button{background:var(--white);border:0;padding:10px 20px;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--black);color:var(--white)}
.seg button:focus-visible,.send:focus-visible,.link:focus-visible{outline:3px solid var(--red);outline-offset:2px}
label{display:block;font-size:13px;font-weight:700;margin-bottom:8px}
.inp{width:100%;max-width:520px;height:56px;border:0;border-bottom:2px solid var(--black);font:inherit;font-size:22px;padding:0 4px;background:var(--tint)}
.inp:hover{background:#ececec}
.inp:focus{outline:none;border-bottom-color:var(--red);background:#fff2f2}
.inp.bad{border-bottom-color:var(--red)}
.err{color:var(--red);font-size:14px;min-height:22px;margin-top:6px}
.send{margin-top:20px;height:60px;padding:0 40px;border:0;background:var(--red);color:#fff;font:inherit;font-size:18px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:24px}
.send:hover{background:var(--red-d)}
.send:disabled{background:var(--rule);color:var(--grey);cursor:not-allowed}
.link{display:inline-block;margin-top:32px;color:var(--black);font-weight:700;text-decoration:none;border-bottom:2px solid var(--black);padding-bottom:2px}
.link:hover{color:var(--red);border-color:var(--red)}
.wait{display:none}
.sent .form{display:none}.sent .wait{display:block}
.box{border-left:8px solid var(--ok);background:var(--tint);padding:20px 24px;max-width:560px;margin-bottom:28px}
.box b{display:block;font-size:18px;margin-bottom:4px}
.timer{display:flex;align-items:baseline;gap:12px;margin:8px 0 4px}
.timer span{font-weight:700;font-size:56px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.bar{height:4px;background:var(--rule);max-width:520px}.bar i{display:block;height:100%;background:var(--black);width:100%;transition:width 1s linear}
.steps{grid-column:1/13;display:grid;grid-template-columns:repeat(3,1fr);column-gap:24px;margin-top:64px;border-top:2px solid var(--black);padding-top:20px}
.steps div{font-size:14px;color:var(--grey)}.steps b{display:block;font-size:14px;color:var(--black)}
.steps .on b{color:var(--red)}
@media (max-width:900px){header,main{padding-left:28px;padding-right:28px}.num{grid-column:1/13;font-size:96px;margin-bottom:24px}.col{grid-column:1/13}header nav{display:none}.mark{grid-column:span 12}}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<header><div class="mark"><i aria-hidden="true"></i>城市通行证</div><nav><a href="#">办事指南</a><a href="#">无障碍</a><a href="#" class="back2">返回登录</a></nav></header>
<main id="main">
  <div class="num" aria-hidden="true" id="num">01</div>
  <div class="col">
    <div class="form">
      <p class="kicker">账号安全 · 找回密码</p>
      <h1>进不去了？<br>我们把重设链接发给你。</h1>
      <p class="lead">请填写注册城市通行证时绑定的手机号或邮箱。为保护你的社保、公积金等信息，链接 15 分钟内有效。</p>
      <div class="seg" role="group" aria-label="联系方式"><button type="button" aria-pressed="true" data-k="phone">手机号</button><button type="button" aria-pressed="false" data-k="mail">电子邮箱</button></div>
      <label for="c" id="cl">绑定手机号</label>
      <input class="inp" id="c" inputmode="tel" placeholder="例如 139 0000 1234" autocomplete="tel">
      <div class="err" id="err" role="alert"></div>
      <button class="send" id="send" type="button">发送重设链接 <span aria-hidden="true">→</span></button><br>
      <a class="link back2" href="#">← 想起来了，回登录</a>
    </div>
    <div class="wait" aria-live="polite">
      <p class="kicker">已发送 · 请查收</p>
      <h1>链接已在路上。</h1>
      <div class="box"><b>已发送至 <span id="to">139****1234</span></b>打开短信或邮件中的链接即可设置新密码。没收到的话，请先看看垃圾箱或短信拦截。</div>
      <div class="timer"><span id="sec">60</span>秒后可重新发送</div>
      <div class="bar"><i id="bar"></i></div>
      <button class="send" id="resend" type="button" disabled>重新发送</button><br>
      <a class="link" href="#" id="change">← 换一个手机号或邮箱</a>　<a class="link back2" href="#">回到登录</a>
    </div>
  </div>
  <div class="steps"><div class="on" id="s1"><b>01 填写联系方式</b>手机号或邮箱</div><div id="s2"><b>02 打开链接</b>15 分钟内有效</div><div><b>03 设置新密码</b>完成后自动登录</div></div>
</main>
<script>
const $=s=>document.querySelector(s);let kind='phone',t=null;
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{kind=b.dataset.k;document.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed',x===b));
 $('#cl').textContent=kind==='phone'?'绑定手机号':'绑定电子邮箱';$('#c').placeholder=kind==='phone'?'例如 139 0000 1234':'例如 name@example.cn';$('#c').inputMode=kind==='phone'?'tel':'email';$('#c').value='';$('#err').textContent='';$('#c').classList.remove('bad')});
function mask(v){if(kind==='phone'){const d=v.replace(/\D/g,'');return d.slice(0,3)+'****'+d.slice(-4)}const [a,b]=v.split('@');return a.slice(0,2)+'***@'+b}
function count(){let n=60;$('#resend').disabled=true;$('#sec').textContent=n;$('#bar').style.width='100%';clearInterval(t);t=setInterval(()=>{n--;$('#sec').textContent=n;$('#bar').style.width=(n/60*100)+'%';if(n<=0){clearInterval(t);$('#resend').disabled=false;$('#sec').textContent='0'}},1000)}
$('#send').onclick=()=>{const v=$('#c').value.trim();const ok=kind==='phone'?/^1\d{10}$/.test(v.replace(/\s/g,'')):/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v);
 if(!ok){$('#c').classList.add('bad');$('#err').textContent=kind==='phone'?'请输入 11 位中国大陆手机号':'邮箱格式不正确';$('#c').focus();return}
 $('#to').textContent=mask(v);$('#main').classList.add('sent');$('#num').textContent='02';$('#s1').classList.remove('on');$('#s2').classList.add('on');count()};
$('#resend').onclick=count;
$('#change').onclick=e=>{e.preventDefault();clearInterval(t);$('#main').classList.remove('sent');$('#num').textContent='01';$('#s2').classList.remove('on');$('#s1').classList.add('on');$('#c').focus()};
document.querySelectorAll('.back2').forEach(a=>a.onclick=e=>{e.preventDefault();alert('返回城市通行证登录页')});
</script>
</body>
</html>
