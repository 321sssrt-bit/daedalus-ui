<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>胶片圈</title>
<style>
:root{--paper:#f2f0eb;--card:#fffefb;--ink:#151413;--sub:#77726a;--line:#e2ddd3;--kodak:#ffb800;--red:#e03a1e;--red-l:#fdebe6;--ok:#2f8f5b}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 "Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;padding-bottom:84px}
header{position:sticky;top:0;z-index:3;background:var(--paper);display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
header h1{margin:0;font:900 22px/1 "Helvetica Neue",Arial,sans-serif;letter-spacing:-.02em;display:flex;align-items:center;gap:6px}
header h1 i{width:22px;height:16px;border:3px solid var(--ink);border-radius:3px;position:relative}
header h1 i:after{content:"";position:absolute;left:4px;top:1px;width:5px;height:5px;border-radius:50%;background:var(--kodak)}
header .tb{margin-left:auto;display:flex;gap:4px;background:#e6e2d9;border-radius:16px;padding:3px}
header .tb span{font-size:12px;padding:3px 10px;border-radius:13px;color:var(--sub)}
header .tb span.on{background:var(--card);color:var(--ink);font-weight:700}
.strip{display:flex;gap:10px;overflow:auto;padding:12px 16px 4px}
.strip div{flex:none;width:58px;text-align:center;font-size:11px;color:var(--sub)}
.strip i{display:block;width:58px;height:58px;border-radius:50%;border:2.5px solid var(--kodak);padding:3px;background-clip:content-box}
.banner{display:none;margin:10px 16px 0;padding:10px 12px;border-radius:12px;font-size:13px;align-items:center;gap:8px}
.banner.ok{display:flex;background:#e3f3ea;color:var(--ok)}
.feed{display:grid;gap:14px;padding:12px 16px}
.post{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px 12px 10px;box-shadow:0 1px 0 var(--line)}
.post.new{animation:nw .5s ease-out}
@keyframes nw{from{transform:translateY(-10px);opacity:0}}
.ph{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ph .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff}
.ph b{font-size:14px}.ph small{display:block;font-size:11px;color:var(--sub)}
.vis{margin-left:auto;font-size:11px;padding:2px 8px;border-radius:10px;background:#efebe2;color:var(--sub)}
.photo{height:220px;border:8px solid #fff;border-bottom-width:34px;box-shadow:0 2px 8px -3px #0003;position:relative}
.photo span{position:absolute;bottom:-26px;left:4px;font:italic 12px "Marker Felt","Comic Sans MS",cursive;color:#555}
.photo em{position:absolute;right:6px;bottom:6px;font:700 10px "Courier New",monospace;color:#ff9a3c;font-style:normal;letter-spacing:.1em}
.txt{margin:10px 0 6px}
.acts{display:flex;gap:16px;font-size:13px;color:var(--sub)}
.acts button{border:0;background:none;font:inherit;color:inherit;cursor:pointer;padding:4px 0}
.acts button[aria-pressed="true"]{color:var(--red);font-weight:700}
.fab{position:fixed;right:18px;bottom:96px;width:58px;height:58px;border-radius:50%;border:0;background:var(--ink);color:var(--kodak);font-size:28px;cursor:pointer;box-shadow:0 10px 20px -8px #0008;z-index:4}
nav{position:fixed;left:0;right:0;bottom:0;height:70px;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 0 12px;z-index:4}
nav span{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--sub)}
nav span b{font-size:19px;font-weight:400}
nav span.on{color:var(--ink);font-weight:700}
.cmp{position:fixed;inset:0;background:var(--paper);z-index:8;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);visibility:hidden}
.cmp.on{transform:none;visibility:visible}
.ch{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line)}
.ch button{border:0;background:none;font:inherit;cursor:pointer}
.ch .x{font-size:15px;color:var(--sub)}
.pub{height:36px;padding:0 18px;border-radius:18px;background:var(--ink)!important;color:var(--kodak);font-weight:800!important}
.pub:disabled{background:#cbc6bc!important;color:#f2f0eb;cursor:not-allowed}
.cb{flex:1;overflow:auto;padding:14px 16px}
.fail{display:none;background:var(--red-l);border:1.5px solid #f4b3a5;color:#9b2410;border-radius:12px;padding:12px;margin-bottom:12px;font-size:14px}
.fail.on{display:block}
.fail b{display:block;margin-bottom:2px}
.fail button{margin-top:8px;height:34px;padding:0 14px;border-radius:17px;border:0;background:var(--red);color:#fff;font:inherit;font-weight:700;cursor:pointer}
textarea{width:100%;min-height:120px;border:0;background:none;font-family:inherit;font-size:17px;line-height:1.6;resize:none;color:var(--ink)}
textarea:focus{outline:none}
.cnt{text-align:right;font-size:12px;color:var(--sub)}
.lbl{font-size:12px;font-weight:700;color:var(--sub);letter-spacing:.08em;margin:14px 0 8px}
.films{display:flex;gap:8px}
.films button{width:64px;height:64px;border-radius:6px;border:3px solid transparent;cursor:pointer;position:relative;font-size:10px;color:#fff;font-weight:700;display:flex;align-items:flex-end;justify-content:center;padding-bottom:3px;text-shadow:0 1px 2px #0008}
.films button[aria-pressed="true"]{border-color:var(--kodak);box-shadow:0 0 0 2px var(--ink)}
.scope{display:grid;gap:6px}
.scope button{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font:inherit;text-align:left;cursor:pointer}
.scope button small{display:block;color:var(--sub);font-size:12px}
.scope button[aria-checked="true"]{border-color:var(--ink);box-shadow:inset 4px 0 0 var(--kodak)}
.sim{display:flex;align-items:center;gap:10px;margin-top:16px;padding:10px 12px;border:1.5px dashed var(--red);border-radius:12px;font-size:13px;color:#9b2410;cursor:pointer}
.sim input{width:18px;height:18px;accent-color:var(--red)}
.load{display:none;position:absolute;inset:0;background:#f2f0ebcc;place-items:center;font-weight:700}
.load.on{display:grid}
button:focus-visible,textarea:focus-visible,.sim:focus-within{outline:3px solid var(--kodak);outline-offset:2px}
@media (min-width:600px){body{max-width:430px;margin:0 auto}nav,.cmp{max-width:430px;margin:0 auto}}
@media (prefers-reduced-motion:reduce){.cmp{transition:none}.post.new{animation:none}}
</style>
</head>
<body>
<header><h1><i></i>胶片圈</h1><div class="tb"><span class="on">关注</span><span>发现</span></div></header>
<div class="strip" aria-label="正在冲洗的好友"><div><i style="background:linear-gradient(135deg,#f6c27a,#d9583b)"></i>林夏</div><div><i style="background:linear-gradient(135deg,#9fc7d9,#3d6e8c)"></i>老周</div><div><i style="background:linear-gradient(135deg,#c9d99f,#6a8c3d)"></i>小葵</div><div><i style="background:linear-gradient(135deg,#e2b6d6,#8c3d74)"></i>阿北</div><div><i style="background:linear-gradient(135deg,#ddd,#888)"></i>米米</div></div>
<div class="banner" id="okb" role="status"></div>
<main class="feed" id="feed"></main>
<button class="fab" type="button" id="fab" aria-label="发布新动态">＋</button>
<nav aria-label="底栏"><span class="on"><b>◉</b>动态</span><span><b>⌕</b>发现</span><span><b>✉</b>消息</span><span><b>☺</b>我</span></nav>
<section class="cmp" id="cmp" role="dialog" aria-labelledby="ct">
  <div class="ch"><button class="x" type="button" id="cx">取消</button><b id="ct">新动态</b><button class="pub" type="button" id="pub" disabled>发布</button></div>
  <div class="cb" style="position:relative">
    <div class="fail" id="fail" role="alert"><b>发布未完成</b>照片上传中断了，动态没有发出去。文字、照片和「<span id="fsc"></span>」可见范围都已保留，可以直接重试。<br><button type="button" id="retry">重试发布</button></div>
    <textarea id="ta" maxlength="300" placeholder="这卷胶片拍到了什么？" aria-label="动态内容"></textarea>
    <div class="cnt" id="cnt">0 / 300</div>
    <div class="lbl">选一张底片</div>
    <div class="films" id="films"></div>
    <div class="lbl">谁可以看</div>
    <div class="scope" id="scope" role="radiogroup" aria-label="可见范围"></div>
    <label class="sim"><input type="checkbox" id="sim">模拟上传中断：让这次发布失败</label>
    <div class="load" id="load">正在冲洗上传…</div>
  </div>
</section>
<script>
const F=[['暖阳','linear-gradient(160deg,#ffd27a,#e0703a 60%,#7a3a2a)'],['海雾','linear-gradient(170deg,#cfe3ea,#6b9bb0 55%,#2c4a5a)'],['森林','linear-gradient(165deg,#d8e6b0,#6f8f4a 55%,#2f4a2a)'],['黑白','linear-gradient(160deg,#eee,#888 55%,#222)']];
const S=[['pub','🌍 公开','所有人都能在发现页看到'],['fol','👥 仅关注我的人','关注你的 128 人可见'],['fri','💛 好友圈','互相关注的 23 位好友可见'],['me','🔒 仅自己','只存在你的胶片盒里']];
let posts=[{u:'林夏',c:'#d9583b',t:'2 小时前',v:'pub',f:0,x:'楼下咖啡馆的窗，下午四点的光最好看。',l:12,me:0,cap:'Portra 400'},{u:'老周',c:'#3d6e8c',t:'昨天',v:'fol',f:1,x:'台风前的海，灰得很干净。',l:31,me:0,cap:'HP5 冲洗过度'},{u:'小葵',c:'#6a8c3d',t:'10 月 7 日',v:'fri',f:2,x:'第一次自己冲卷，糊了一半，但这张我喜欢。',l:8,me:0,cap:'第 24 张'}];
let d={x:'',f:0,v:'fri'};const $=s=>document.querySelector(s);const sn=k=>S.find(s=>s[0]===k)[1];
function feed(newTop){$('#feed').innerHTML=posts.map((p,i)=>'<article class="post'+(newTop&&i===0?' new':'')+'"><div class="ph"><span class="av" style="background:'+p.c+'">'+p.u[0]+'</span><div><b>'+p.u+'</b><small>'+p.t+'</small></div><span class="vis">'+sn(p.v)+'</span></div><div class="photo" style="background:'+F[p.f][1]+'"><span>'+p.cap+'</span><em>\'26 10 10</em></div><p class="txt">'+p.x.replace(/</g,'&lt;')+'</p><div class="acts"><button type="button" aria-pressed="'+!!p.me+'" data-l="'+i+'">♥ '+p.l+'</button><button type="button">💬 评论</button></div></article>').join('');
 document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{const p=posts[b.dataset.l];p.me=!p.me;p.l+=p.me?1:-1;feed()})}
function comp(){$('#ta').value=d.x;$('#cnt').textContent=d.x.length+' / 300';
 $('#films').innerHTML=F.map((f,i)=>'<button type="button" aria-pressed="'+(i===d.f)+'" data-f="'+i+'" style="background:'+f[1]+'">'+f[0]+'</button>').join('');
 document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{d.f=+b.dataset.f;comp()});
 $('#scope').innerHTML=S.map(s=>'<button type="button" role="radio" aria-checked="'+(s[0]===d.v)+'" data-v="'+s[0]+'"><span><b>'+s[1]+'</b><small>'+s[2]+'</small></span></button>').join('');
 document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{d.v=b.dataset.v;comp();$('#fsc').textContent=sn(d.v)});
 $('#pub').disabled=!d.x.trim()}
$('#ta').oninput=e=>{d.x=e.target.value;$('#cnt').textContent=d.x.length+' / 300';$('#pub').disabled=!d.x.trim()};
$('#fab').onclick=()=>{comp();$('#cmp').classList.add('on');setTimeout(()=>$('#ta').focus(),300)};
$('#cx').onclick=()=>{$('#cmp').classList.remove('on');if(d.x.trim()){$('#okb').className='banner ok';$('#okb').style.cssText='background:#efebe2;color:#77726a';$('#okb').textContent='草稿已保留，点 ＋ 继续编辑'}};
function publish(){if($('#fail').classList.contains('on'))$('#sim').checked=false;$('#load').classList.add('on');$('#pub').disabled=true;const fail=$('#sim').checked;
 setTimeout(()=>{$('#load').classList.remove('on');$('#pub').disabled=false;
  if(fail){$('#fail').classList.add('on');$('#fsc').textContent=sn(d.v);$('#pub').textContent='重试';$('.cb').scrollTop=0;return}
  posts.unshift({u:'我',c:'#151413',t:'刚刚',v:d.v,f:d.f,x:d.x.trim(),l:0,me:0,cap:F[d.f][0]+' · 新冲洗'});
  $('#fail').classList.remove('on');$('#pub').textContent='发布';$('#cmp').classList.remove('on');$('#okb').className='banner ok';$('#okb').style.cssText='';$('#okb').textContent='✓ 已发布 · 可见范围：'+sn(d.v);d={x:'',f:0,v:'fri'};$('#sim').checked=false;feed(true);scrollTo(0,0)},900)}
$('#pub').onclick=publish;
$('#retry').onclick=()=>{$('#sim').checked=false;publish()};
feed();
</script>
</body>
</html>
