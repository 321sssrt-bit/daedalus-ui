<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>日历 · 时序</title>
<style>
:root{--bg:#12121c;--side:#181828;--panel:#1d1d30;--line:#2c2c44;--text:#e8e8f4;--dim:#8d8daa;--now:#ff5c7a;--c1:#7c6cff;--c2:#2ec4b6;--c3:#ffb547;--c4:#ff7eb6}
*{box-sizing:border-box}
body{margin:0;height:100vh;display:grid;grid-template-columns:264px 1fr;background:var(--bg);color:var(--text);font:13px/1.45 "PingFang SC","Microsoft YaHei",system-ui,sans-serif;overflow:hidden}
aside{background:var(--side);border-right:1px solid var(--line);padding:20px 18px;display:flex;flex-direction:column;gap:22px}
.brand{font-weight:700;font-size:17px;display:flex;gap:8px;align-items:center}
.brand i{width:22px;height:22px;border-radius:7px;background:conic-gradient(var(--c1),var(--c2),var(--c3),var(--c4),var(--c1))}
.new{height:40px;border:0;border-radius:12px;background:var(--c1);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.new:hover{background:#8f81ff}
.mini h3,.cals h3{font-size:12px;color:var(--dim);margin:0 0 10px;font-weight:600}
.mini table{width:100%;border-collapse:collapse;text-align:center;font-size:12px}
.mini th{color:var(--dim);font-weight:400;padding:4px 0}
.mini td{padding:5px 0;border-radius:8px;cursor:pointer}
.mini td:hover{background:var(--panel)}
.mini td.o{color:#55556e}
.mini td.wk{background:#7c6cff22}
.mini td.td{background:var(--now);color:#fff;font-weight:700}
.cals label{display:flex;align-items:center;gap:10px;padding:6px 0;cursor:pointer}
.cals input{appearance:none;width:16px;height:16px;border-radius:5px;border:2px solid var(--c);margin:0;cursor:pointer}
.cals input:checked{background:var(--c)}
.cals input:focus-visible,.new:focus-visible,.nav button:focus-visible,.ev:focus-visible{outline:2px solid #fff;outline-offset:2px}
main{display:grid;grid-template-rows:60px 44px 1fr;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:14px;padding:0 24px;border-bottom:1px solid var(--line)}
.top h1{font-size:20px;margin:0;font-weight:600}
.nav{display:flex;gap:6px}
.nav button{height:32px;min-width:32px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--text);font:inherit;cursor:pointer;padding:0 10px}
.nav button:hover{border-color:var(--dim)}
.sp{flex:1}
.heads{display:grid;grid-template-columns:56px repeat(7,1fr);border-bottom:1px solid var(--line)}
.heads div{padding:6px 8px;color:var(--dim);font-size:12px;display:flex;gap:6px;align-items:baseline}
.heads b{font-size:18px;color:var(--text);font-weight:600}
.heads .t b{background:var(--now);color:#fff;border-radius:8px;padding:0 6px}
.grid{position:relative;overflow:auto;min-height:0}
.g{display:grid;grid-template-columns:56px repeat(7,1fr);position:relative}
.hr{height:52px;border-bottom:1px solid var(--line);font-size:11px;color:var(--dim);text-align:right;padding-right:8px;transform:translateY(-7px)}
.cell{height:52px;border-bottom:1px solid var(--line);border-left:1px solid var(--line)}
.ev{position:absolute;border-radius:10px;padding:6px 8px;font-size:12px;cursor:pointer;overflow:hidden;border:0;text-align:left;color:#fff;font-family:inherit;transition:transform .12s,box-shadow .12s}
.ev b{display:block;font-size:12.5px}
.ev span{opacity:.85}
.ev:hover{transform:translateY(-1px);box-shadow:0 6px 18px #0008}
.ev[aria-expanded="true"]{box-shadow:0 0 0 2px #fff}
.ev.hide{display:none}
.nowline{position:absolute;left:56px;right:0;height:2px;background:var(--now)}
.nowline:before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--now)}
.pop{position:fixed;width:300px;background:#26263c;border:1px solid #3a3a58;border-radius:14px;padding:16px 18px;box-shadow:0 20px 40px #000a;display:none;z-index:5}
.pop.on{display:block}
.pop h2{margin:0 0 4px;font-size:16px}
.pop p{margin:4px 0;color:#c4c4dc}
.pop .x{position:absolute;right:10px;top:8px;border:0;background:none;color:var(--dim);font-size:18px;cursor:pointer}
.pop .chip{display:inline-block;margin-top:8px;padding:2px 8px;border-radius:999px;font-size:11px}
@media (max-width:1000px){body{grid-template-columns:1fr}aside{display:none}}
@media (prefers-reduced-motion:reduce){.ev{transition:none}.ev:hover{transform:none}}
</style>
</head>
<body>
<aside>
  <div class="brand"><i aria-hidden="true"></i>时序</div>
  <button class="new" type="button" id="newb">＋ 新建日程</button>
  <div class="mini"><h3>2026 年 10 月</h3><table><thead><tr><th>一</th><th>二</th><th>三</th><th>四</th><th>五</th><th>六</th><th>日</th></tr></thead><tbody>
  <tr><td class="o">28</td><td class="o">29</td><td class="o">30</td><td>1</td><td>2</td><td>3</td><td>4</td></tr>
  <tr><td class="wk">5</td><td class="wk">6</td><td class="wk">7</td><td class="wk">8</td><td class="wk">9</td><td class="td">10</td><td class="wk">11</td></tr>
  <tr><td>12</td><td>13</td><td>14</td><td>15</td><td>16</td><td>17</td><td>18</td></tr>
  <tr><td>19</td><td>20</td><td>21</td><td>22</td><td>23</td><td>24</td><td>25</td></tr>
  <tr><td>26</td><td>27</td><td>28</td><td>29</td><td>30</td><td>31</td><td class="o">1</td></tr></tbody></table></div>
  <div class="cals"><h3>我的日历</h3>
    <label><input type="checkbox" checked data-k="c1" style="--c:#7c6cff">产品研发</label>
    <label><input type="checkbox" checked data-k="c2" style="--c:#2ec4b6">客户会议</label>
    <label><input type="checkbox" checked data-k="c3" style="--c:#ffb547">个人</label>
    <label><input type="checkbox" checked data-k="c4" style="--c:#ff7eb6">团队活动</label></div>
</aside>
<main>
  <div class="top"><h1>2026 年 10 月 · 第 41 周</h1><div class="nav"><button type="button" aria-label="上一周">‹</button><button type="button">今天</button><button type="button" aria-label="下一周">›</button></div><span class="sp"></span><div class="nav"><button type="button">日</button><button type="button" style="border-color:#7c6cff">周</button><button type="button">月</button></div></div>
  <div class="heads"><div></div><div>一 <b>5</b></div><div>二 <b>6</b></div><div>三 <b>7</b></div><div>四 <b>8</b></div><div>五 <b>9</b></div><div class="t">六 <b>10</b></div><div>日 <b>11</b></div></div>
  <div class="grid" id="grid"><div class="g" id="g"></div></div>
</main>
<div class="pop" id="pop" role="dialog" aria-labelledby="pt"><button class="x" type="button" id="px" aria-label="关闭">×</button><h2 id="pt"></h2><p id="pw"></p><p id="pl"></p><p id="pp"></p><span class="chip" id="pc"></span></div>
<script>
const S=8,E=20,H=52;const g=document.getElementById('g');
let html='';for(let h=S;h<E;h++){html+='<div class="hr">'+(h===S?'':h+':00')+'</div>';for(let d=0;d<7;d++)html+='<div class="cell"></div>'}g.innerHTML=html;
const evs=[[0,9.5,10.5,'c1','周会：Q4 路线图','线上 · 腾讯会议','主持：陈默 · 12 人'],[0,14,15.5,'c2','客户访谈：远山物流','3 号会议室','对接：周安然'],[1,10,12,'c1','设计评审：结算页 v3','5 号会议室','需带原型链接'],[1,18.5,19.5,'c3','羽毛球','体育馆 B 场','和老王约'],[2,9,9.5,'c4','站会','工位区','每日 15 分钟'],[2,13,14.5,'c2','供应商比价会','线上','财务部一同参加'],[3,11,12.5,'c1','技术方案对齐','4 号会议室','后端 + 前端'],[3,15,17,'c4','新人分享：数据埋点','大会议厅','主讲：林小禾'],[4,10,11,'c2','季度复盘：华东客户','线上','准备 PPT 10 页'],[4,16,18,'c4','团队下午茶','茶水间','本周轮值：设计组'],[5,10,11.5,'c3','带孩子上钢琴课','少年宫 302','记得带琴谱'],[5,14,15,'c1','值班：线上发布观察','远程','发布窗口 14:00'],[6,9,11,'c3','晨跑 + 早午餐','滨江步道','—']];
const col={c1:'#7c6cff',c2:'#2ec4b6',c3:'#ffb547',c4:'#ff7eb6'};const pop=document.getElementById('pop');let open=null;
function fmt(v){return Math.floor(v)+':'+(v%1?'30':'00')}
evs.forEach((e,i)=>{const b=document.createElement('button');b.type='button';b.className='ev';b.dataset.k=e[3];b.setAttribute('aria-expanded','false');
 b.style.background=col[e[3]];b.style.top=((e[1]-S)*H+2)+'px';b.style.height=((e[2]-e[1])*H-4)+'px';
 b.style.left='calc(56px + (100% - 56px) / 7 * '+e[0]+' + 4px)';b.style.width='calc((100% - 56px) / 7 - 8px)';
 b.innerHTML='<b>'+e[4]+'</b><span>'+fmt(e[1])+'–'+fmt(e[2])+'</span>';
 b.onclick=ev=>{ev.stopPropagation();if(open)open.setAttribute('aria-expanded','false');open=b;b.setAttribute('aria-expanded','true');
  document.getElementById('pt').textContent=e[4];document.getElementById('pw').textContent='10 月 '+(5+e[0])+' 日 · '+fmt(e[1])+'–'+fmt(e[2]);document.getElementById('pl').textContent='📍 '+e[5];document.getElementById('pp').textContent='📝 '+e[6];
  const pc=document.getElementById('pc');pc.textContent=document.querySelector('[data-k='+e[3]+']').parentNode.textContent.trim();pc.style.background=col[e[3]];
  const r=b.getBoundingClientRect();pop.classList.add('on');let x=r.right+10;if(x+300>innerWidth)x=r.left-310;pop.style.left=Math.max(10,x)+'px';pop.style.top=Math.min(innerHeight-200,Math.max(10,r.top))+'px'};
 g.append(b)});
const nl=document.createElement('div');nl.className='nowline';nl.style.top=((9.7-S)*H)+'px';nl.style.left='calc(56px + (100% - 56px) / 7 * 5)';nl.style.width='calc((100% - 56px) / 7)';g.append(nl);
function close(){pop.classList.remove('on');if(open)open.setAttribute('aria-expanded','false');open=null}
document.getElementById('px').onclick=close;document.addEventListener('click',e=>{if(!pop.contains(e.target))close()});document.addEventListener('keydown',e=>e.key==='Escape'&&close());
document.querySelectorAll('.cals input').forEach(c=>c.onchange=()=>document.querySelectorAll('.ev[data-k='+c.dataset.k+']').forEach(e=>e.classList.toggle('hide',!c.checked)));
document.getElementById('grid').scrollTop=H*0.5;
document.getElementById('newb').onclick=()=>alert('新建日程：本页演示周视图与查看详情');
</script>
</body>
</html>
