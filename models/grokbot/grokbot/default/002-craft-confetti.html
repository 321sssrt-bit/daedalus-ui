<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>注册 · 拾光手作</title>
<style>
:root{--cream:#fff4e6;--coral:#ff6b4a;--coral-d:#e2502f;--plum:#3a1f3d;--soft:#7d6378;--mint:#7fd1b9;--sun:#ffc94a;--line:#f0d9c4;--card:#ffffff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--cream);color:var(--plum);font:15px/1.6 "PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;overflow-x:hidden}
.top{display:flex;justify-content:space-between;align-items:center;padding:22px 48px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px}
.logo svg{width:36px;height:36px}
.top p{margin:0;font-size:14px;color:var(--soft)}
.top a{color:var(--coral-d);font-weight:700;text-decoration:none;border-bottom:2px solid var(--sun)}
.top a:hover{color:var(--plum)}
.wrap{display:grid;grid-template-columns:1fr 460px;gap:56px;max-width:1120px;margin:8px auto 40px;padding:0 48px;align-items:center}
.hero h1{font-size:46px;line-height:1.15;margin:0 0 16px;font-weight:900;letter-spacing:-.01em}
.hero h1 span{background:linear-gradient(transparent 62%,var(--sun) 62%)}
.hero p{font-size:17px;color:var(--soft);max-width:440px;margin:0 0 28px}
.stickers{display:flex;gap:14px;flex-wrap:wrap}
.st{padding:10px 16px;border-radius:999px;font-weight:700;font-size:14px;transform:rotate(-3deg);box-shadow:0 4px 0 #3a1f3d22}
.st:nth-child(1){background:var(--mint)}.st:nth-child(2){background:var(--sun);transform:rotate(2deg)}.st:nth-child(3){background:#ffd2c7;transform:rotate(-1deg)}
.card{background:var(--card);border-radius:28px;padding:34px 34px 28px;box-shadow:0 18px 0 -6px #ffd9c9,0 30px 60px -20px #3a1f3d33;position:relative}
.card h2{margin:0 0 4px;font-size:24px;font-weight:800}
.card .hint{margin:0 0 22px;color:var(--soft);font-size:14px}
.f{margin-bottom:16px}
.f label{display:block;font-weight:700;font-size:13px;margin-bottom:6px}
.f input{width:100%;height:48px;border-radius:14px;border:2px solid var(--line);padding:0 16px;font:inherit;color:var(--plum);background:#fffaf5;transition:border-color .15s,background .15s}
.f input:hover{border-color:#e9c3a5}
.f input:focus{outline:none;border-color:var(--coral);background:#fff}
.f.bad input{border-color:#d93b3b;background:#fff3f3}
.f .err{font-size:12px;color:#d93b3b;min-height:18px;margin-top:4px}
.meter{display:flex;gap:6px;margin-top:8px}.meter i{flex:1;height:6px;border-radius:6px;background:var(--line);transition:background .2s}
.meter-text{font-size:12px;color:var(--soft);margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font:inherit;font-size:13px;color:var(--plum);cursor:pointer;transition:all .15s}
.chip:hover{border-color:var(--coral)}
.chip[aria-pressed="true"]{background:var(--plum);border-color:var(--plum);color:#fff}
.chip:focus-visible,.go:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.agree{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--soft);margin:18px 0}
.agree input{width:18px;height:18px;accent-color:var(--coral);margin-top:2px}
.go{width:100%;height:54px;border:0;border-radius:16px;background:var(--coral);color:#fff;font-weight:800;font-size:17px;line-height:1;font-family:inherit;cursor:pointer;box-shadow:0 5px 0 var(--coral-d);transition:transform .1s,box-shadow .1s,background .15s}
.go:hover{background:#ff7d60}
.go:active{transform:translateY(4px);box-shadow:0 1px 0 var(--coral-d)}
.go:disabled{background:#e8cfc4;box-shadow:0 5px 0 #d8bcae;cursor:not-allowed}
.login{text-align:center;margin:16px 0 0;font-size:14px;color:var(--soft)}
.login a{color:var(--coral-d);font-weight:700}
.done{position:absolute;inset:0;border-radius:28px;background:var(--plum);color:#fff;display:grid;place-content:center;text-align:center;padding:30px;gap:10px}
.done[hidden]{display:none}
.done b{font-size:26px}.done p{margin:0;color:#e7d5e4}
.done button{margin:12px auto 0;padding:12px 22px;border-radius:14px;border:0;background:var(--sun);color:var(--plum);font-weight:800;font-size:15px;font-family:inherit;cursor:pointer}
@media (max-width:900px){.wrap{grid-template-columns:1fr;gap:28px;padding:0 28px}.hero h1{font-size:34px}.top{padding:18px 28px}.card{max-width:520px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.st{transform:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="logo"><svg viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="17" fill="#ff6b4a"/><path d="M10 22c3-8 13-8 16 0" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="13" cy="14" r="2" fill="#fff"/><circle cx="23" cy="14" r="2" fill="#fff"/></svg>拾光手作</div>
  <p>已经有账号了？ <a href="#" id="toLogin">去登录</a></p>
</header>
<div class="wrap">
  <section class="hero">
    <h1>把周末的那点<br><span>手作热情</span>，<br>交给一群同好。</h1>
    <p>拾光手作是 26 万手作人的社区：分享编织、陶艺、木工和皮具作品，报名线下工作坊，还能把作品挂进小铺。</p>
    <div class="stickers"><span class="st">🧶 本周 1,284 件新作</span><span class="st">🏺 32 场线下工作坊</span><span class="st">✂️ 新人首月免费上架</span></div>
  </section>
  <form class="card" id="form" novalidate>
    <h2>创建你的手作账号</h2>
    <p class="hint">1 分钟搞定，之后可以随时修改资料。</p>
    <div class="f" id="f-name"><label for="name">昵称</label><input id="name" placeholder="例如：橘子毛线团" maxlength="16"><div class="err"></div></div>
    <div class="f" id="f-mail"><label for="mail">手机号或邮箱</label><input id="mail" placeholder="用于登录与找回账号"><div class="err"></div></div>
    <div class="f" id="f-pw"><label for="pw">设置密码</label><input id="pw" type="password" placeholder="至少 8 位，包含字母与数字">
      <div class="meter" aria-hidden="true"><i></i><i></i><i></i></div><div class="meter-text" id="mt">密码强度：未填写</div><div class="err"></div></div>
    <div class="f"><label>你最想玩的手作（可多选）</label>
      <div class="chips" id="chips"><button type="button" class="chip" aria-pressed="true">编织</button><button type="button" class="chip" aria-pressed="false">陶艺</button><button type="button" class="chip" aria-pressed="false">木工</button><button type="button" class="chip" aria-pressed="false">皮具</button><button type="button" class="chip" aria-pressed="false">刺绣</button><button type="button" class="chip" aria-pressed="false">滴胶</button></div></div>
    <label class="agree"><input type="checkbox" id="agree"> 我已阅读并同意《拾光手作用户协议》与《隐私政策》</label>
    <button class="go" id="go" type="submit" disabled>注册并开始逛逛</button>
    <p class="login">已有账号？<a href="#" id="toLogin2">直接登录</a></p>
    <div class="done" id="done" hidden role="status"><b>🎉 欢迎加入，<span id="who">新朋友</span>！</b><p>我们给你推荐了 <span id="cnt">1</span> 个兴趣圈子，验证邮件已发出。</p><button type="button" id="back">回到表单</button></div>
  </form>
</div>
<script>
const $=s=>document.querySelector(s);
const agree=$('#agree'),go=$('#go');
agree.onchange=()=>go.disabled=!agree.checked;
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>c.setAttribute('aria-pressed',c.getAttribute('aria-pressed')!=='true'));
$('#pw').oninput=e=>{const v=e.target.value;let s=0;if(v.length>=8)s++;if(/[a-z]/i.test(v)&&/\d/.test(v))s++;if(/[^a-z0-9]/i.test(v)&&v.length>=10)s++;
 const cols=['#d93b3b','#ffc94a','#7fd1b9'];document.querySelectorAll('.meter i').forEach((i,n)=>i.style.background=n<s?cols[s-1]:'');
 $('#mt').textContent='密码强度：'+(v?['太弱','一般','不错','很强'][s]:'未填写')};
function setErr(id,msg){const f=$(id);f.classList.toggle('bad',!!msg);f.querySelector('.err').textContent=msg||''}
$('#form').onsubmit=e=>{e.preventDefault();let ok=true;
 const n=$('#name').value.trim(),m=$('#mail').value.trim(),p=$('#pw').value;
 setErr('#f-name',n?'':'给自己起个昵称吧');if(!n)ok=false;
 const mOk=/^1\d{10}$/.test(m)||/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(m);setErr('#f-mail',mOk?'':'请输入 11 位手机号或有效邮箱');if(!mOk)ok=false;
 const pOk=p.length>=8&&/[a-z]/i.test(p)&&/\d/.test(p);setErr('#f-pw',pOk?'':'密码需至少 8 位并同时包含字母和数字');if(!pOk)ok=false;
 if(!ok)return;$('#who').textContent=n;$('#cnt').textContent=document.querySelectorAll('.chip[aria-pressed="true"]').length||1;$('#done').hidden=false};
$('#back').onclick=()=>$('#done').hidden=true;
['#toLogin','#toLogin2'].forEach(s=>$(s).onclick=e=>{e.preventDefault();alert('将前往登录页（本原型只演示注册页）')});
</script>
</body>
</html>
