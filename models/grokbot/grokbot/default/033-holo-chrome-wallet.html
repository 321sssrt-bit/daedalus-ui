<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>钱包 · 闪豆</title>
<style>
:root{--bg:#eceef4;--chrome1:#f9fafc;--chrome2:#c9cfdb;--ink:#191a24;--sub:#6b6f80;--holo1:#a6f0ff;--holo2:#d7b4ff;--holo3:#ffc6e6;--holo4:#fff3b0;--in:#13a874;--out:#191a24;--accent:#6a4cff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(120% 60% at 50% 0,#ffffff,var(--bg) 60%);color:var(--ink);font:15px/1.5 "PingFang SC","Microsoft YaHei",system-ui,sans-serif;padding-bottom:96px}
.top{display:flex;justify-content:space-between;align-items:center;padding:16px 20px 8px}
.hi{display:flex;gap:10px;align-items:center}
.hi i{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--holo1),var(--holo2),var(--holo3));display:grid;place-items:center;font-style:normal;font-weight:800}
.hi small{display:block;color:var(--sub);font-size:12px}
.ib{width:40px;height:40px;border-radius:50%;border:1px solid #fff;background:linear-gradient(180deg,var(--chrome1),var(--chrome2));box-shadow:0 4px 10px -4px #0003,inset 0 1px #fff;font-size:17px;cursor:pointer}
.card{margin:12px 16px 0;border-radius:26px;padding:20px 22px 22px;position:relative;overflow:hidden;color:var(--ink);background:linear-gradient(115deg,var(--holo1),var(--holo2) 35%,var(--holo3) 60%,var(--holo4) 85%,var(--holo1));background-size:200% 200%;animation:sh 8s ease-in-out infinite alternate;box-shadow:0 18px 36px -18px #6a4cff88,inset 0 0 0 1px #ffffffaa}
.card:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,#ffffff00 0 14px,#ffffff33 14px 15px)}
@keyframes sh{to{background-position:100% 100%}}
.card>*{position:relative}
.card small{font-size:12px;letter-spacing:.12em;font-weight:600;opacity:.75}
.bal{display:flex;align-items:baseline;gap:6px;margin:6px 0 2px}
.bal b{font:800 40px/1.1 "SF Pro Display","Helvetica Neue",Arial,sans-serif;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.bal span{font-size:16px;font-weight:700}
.eye{border:0;background:#ffffff66;border-radius:12px;height:26px;padding:0 10px;font:inherit;font-size:12px;cursor:pointer;margin-left:auto}
.sub{display:flex;justify-content:space-between;font-size:12px;margin-top:10px}
.sub b{color:var(--in)}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:18px 16px 4px}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;font:inherit;font-size:12px;color:var(--ink);cursor:pointer}
.act i{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;font-style:normal;font-size:22px;background:linear-gradient(180deg,var(--chrome1),var(--chrome2));border:1px solid #fff;box-shadow:0 8px 16px -8px #0005,inset 0 1px #fff,inset 0 -2px 4px #0000000f}
.act.pri i{background:linear-gradient(180deg,#8c74ff,#5a3df0);color:#fff;border-color:#b6a8ff}
.act:active i{transform:scale(.94)}
.act:focus-visible i,.ib:focus-visible,.tab:focus-visible,.row:focus-visible,.eye:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sec{display:flex;justify-content:space-between;align-items:center;padding:20px 20px 6px}
.sec h2{margin:0;font-size:17px}
.sec a{font-size:13px;color:var(--accent);text-decoration:none;font-weight:600}
.list{margin:0 16px;background:#ffffffb8;border-radius:20px;border:1px solid #fff;box-shadow:0 10px 24px -18px #0004;overflow:hidden}
.row{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid #e7e9f0;width:100%;background:none;border-left:0;border-right:0;border-top:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.row:last-child{border-bottom:0}
.row .lg{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:19px;background:#f1f2f7}
.row b{display:block;font-weight:600;font-size:14px}
.row small{color:var(--sub);font-size:12px}
.amt{font:700 15px/1 "SF Pro Display","Helvetica Neue",Arial,sans-serif;font-variant-numeric:tabular-nums;text-align:right}
.amt.in{color:var(--in)}
.amt small{display:block;font:400 11px/1.6 "PingFang SC",sans-serif;color:var(--sub)}
nav{position:fixed;left:12px;right:12px;bottom:12px;height:68px;border-radius:24px;background:linear-gradient(180deg,#ffffffe6,#e3e6eee6);backdrop-filter:blur(14px);border:1px solid #fff;box-shadow:0 14px 30px -14px #0006;display:grid;grid-template-columns:repeat(4,1fr);padding:0 6px}
.tab{border:0;background:none;font:inherit;font-size:11px;color:var(--sub);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
.tab span{font-size:20px;filter:grayscale(1);opacity:.6}
.tab[aria-current]{color:var(--ink);font-weight:700}
.tab[aria-current] span{filter:none;opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:26px 26px 0 0;padding:14px 20px 28px;box-shadow:0 -20px 40px -20px #0005;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);z-index:9}
.sheet.on{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:#d5d8e2;margin:0 auto 12px}
.sheet h3{margin:0 0 4px}
.qr{width:180px;height:180px;margin:14px auto;border-radius:16px;background:conic-gradient(#191a24 0 25%,#fff 0 50%,#191a24 0 75%,#fff 0) 0 0/20px 20px;border:10px solid #fff;outline:2px solid #191a24}
.sheet p{text-align:center;color:var(--sub);font-size:13px;margin:0 0 12px}
.close{width:100%;height:48px;border:0;border-radius:16px;background:var(--ink);color:#fff;font:inherit;font-weight:700;cursor:pointer}
.mask{position:fixed;inset:0;background:#191a2444;opacity:0;pointer-events:none;transition:opacity .2s;z-index:8}
.mask.on{opacity:1;pointer-events:auto}
@media (min-width:600px){body{max-width:430px;margin:0 auto}nav{max-width:406px;margin:0 auto}}
@media (prefers-reduced-motion:reduce){.card{animation:none}.sheet,.mask{transition:none}}
</style>
</head>
<body>
<header class="top"><div class="hi"><i>阿</i><div><small>晚上好</small><b>阿柚</b></div></div><button class="ib" type="button" aria-label="消息">🔔</button></header>
<section class="card" aria-label="余额"><div style="display:flex;align-items:center"><small>闪豆余额 · 人民币</small><button class="eye" type="button" id="eye">隐藏</button></div>
  <div class="bal"><span>¥</span><b id="bal">8,426.50</b></div>
  <div class="sub"><span>本月收入 <b id="mi">+¥12,300.00</b></span><span>本月支出 ¥5,218.40</span></div></section>
<div class="acts"><button class="act pri" type="button" id="out"><i>↗</i>转出</button><button class="act" type="button" id="recv"><i>↙</i>收款</button><button class="act" type="button"><i>⌁</i>扫一扫</button><button class="act" type="button"><i>✦</i>理财</button></div>
<div class="sec"><h2>最近流水</h2><a href="#">全部</a></div>
<div class="list" id="list"></div>
<nav aria-label="主导航"><button class="tab" type="button" aria-current="page"><span>👛</span>钱包</button><button class="tab" type="button"><span>📊</span>账单</button><button class="tab" type="button"><span>🎁</span>权益</button><button class="tab" type="button"><span>🙂</span>我的</button></nav>
<div class="mask" id="mask"></div>
<section class="sheet" id="sheet" role="dialog" aria-labelledby="sht"><div class="grab"></div><h3 id="sht">收款码</h3><div class="qr" aria-label="示意二维码"></div><p>向对方出示此码，到账后会出现在「最近流水」</p><button class="close" type="button" id="sim">模拟收到 ¥200.00</button></section>
<script>
const $=s=>document.querySelector(s);let bal=8426.5,hid=false;
let T=[['☕','山野咖啡','今天 08:42 · 消费',-32],['💼','十月工资 · 星屿科技','10 月 10 日 · 收入',12300],['🚇','地铁 2 号线','10 月 9 日 · 交通',-4],['🍜','面馆 · 和小青转账','10 月 8 日 · AA 收款',46.5],['🛒','盒马鲜生','10 月 7 日 · 购物',-218.4]];
const f=n=>n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
function render(){$('#bal').textContent=hid?'••••••':f(bal);$('#eye').textContent=hid?'显示':'隐藏';
 $('#list').innerHTML=T.slice(0,5).map(t=>'<button class="row" type="button"><span class="lg">'+t[0]+'</span><span><b>'+t[1]+'</b><small>'+t[2]+'</small></span><span class="amt'+(t[3]>0?' in':'')+'">'+(hid?'••••':(t[3]>0?'+':'−')+f(Math.abs(t[3])))+'<small>'+(t[3]>0?'已到账':'已完成')+'</small></span></button>').join('')}
$('#eye').onclick=()=>{hid=!hid;render()};
const open=()=>{$('#sheet').classList.add('on');$('#mask').classList.add('on')},close=()=>{$('#sheet').classList.remove('on');$('#mask').classList.remove('on')};
$('#recv').onclick=open;$('#mask').onclick=close;
$('#sim').onclick=()=>{bal+=200;T.unshift(['🙋','来自 小鹿 的转账','刚刚 · 收款',200]);render();close()};
$('#out').onclick=()=>{$('#sht').textContent='转出';open();$('.qr').style.display='none';document.querySelector('.sheet p').textContent='选择转出到银行卡或好友（示例原型）';$('#sim').textContent='知道了';$('#sim').onclick=()=>{close();setTimeout(()=>{$('#sht').textContent='收款码';$('.qr').style.display='';document.querySelector('.sheet p').textContent='向对方出示此码，到账后会出现在「最近流水」';$('#sim').textContent='模拟收到 ¥200.00';$('#sim').onclick=()=>{bal+=200;T.unshift(['🙋','来自 小鹿 的转账','刚刚 · 收款',200]);render();close()}},300)}};
render();
</script>
</body>
</html>
