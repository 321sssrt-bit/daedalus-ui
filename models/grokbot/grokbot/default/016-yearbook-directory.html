<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>成员目录 · 青梧研究院</title>
<style>
:root{--cream:#faf6ef;--burg:#7a1f2b;--burg-l:#f3e3e1;--ink:#2a2422;--sub:#7b716b;--line:#e8dfd2;--card:#ffffff;--olive:#5b6b3a;--gold:#c08a2e}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--cream);color:var(--ink);font:14px/1.6 "PingFang SC","Microsoft YaHei",system-ui,sans-serif}
header{padding:28px 56px 0;display:flex;justify-content:space-between;align-items:flex-end}
header h1{margin:0;font:600 36px/1.15 "Songti SC","STSong","Noto Serif CJK SC",serif}
header p{margin:6px 0 0;color:var(--sub)}
.crest{width:56px;height:56px;border-radius:50%;border:2px solid var(--burg);display:grid;place-items:center;color:var(--burg);font:700 22px "Songti SC","STSong",serif}
.bar{display:flex;gap:14px;align-items:center;padding:20px 56px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.bar input{width:280px;height:40px;border:1px solid var(--line);border-radius:20px;padding:0 16px;font:inherit;background:var(--card)}
.bar input:focus{outline:none;border-color:var(--burg);box-shadow:0 0 0 3px #7a1f2b1f}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:34px;padding:0 14px;border-radius:17px;border:1px solid var(--line);background:var(--card);font:inherit;color:var(--ink);cursor:pointer}
.chip:hover{border-color:var(--burg)}
.chip[aria-pressed="true"]{background:var(--burg);border-color:var(--burg);color:#fff}
.count{margin-left:auto;color:var(--sub)}
.wrap{display:grid;grid-template-columns:1fr 360px;gap:0;min-height:calc(100vh - 200px)}
.grid{padding:24px 56px 48px;display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:20px;align-content:start}
.p{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px 14px 14px;text-align:center;cursor:pointer;transition:transform .15s,box-shadow .15s;font:inherit;color:inherit}
.p:hover{transform:translateY(-3px);box-shadow:0 10px 24px -12px #2a242244}
.p[aria-pressed="true"]{border-color:var(--burg);box-shadow:0 0 0 2px var(--burg)}
.p:focus-visible,.chip:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.ph{width:96px;height:112px;margin:0 auto 12px;border-radius:4px;display:grid;place-items:center;font:600 34px "Songti SC","STSong",serif;color:#fff;position:relative}
.ph:after{content:"";position:absolute;inset:5px;border:1px solid #ffffff66;border-radius:2px}
.p b{display:block;font:600 17px/1.3 "Songti SC","STSong",serif}
.p small{color:var(--sub);display:block}
.p .d{display:inline-block;margin-top:8px;font-size:12px;padding:1px 8px;border-radius:10px;background:var(--burg-l);color:var(--burg)}
.none{grid-column:1/-1;text-align:center;padding:60px;color:var(--sub)}
aside{border-left:1px solid var(--line);background:var(--card);padding:28px 28px 40px;position:sticky;top:0;align-self:start;min-height:calc(100vh - 200px)}
aside .big{width:120px;height:140px;border-radius:4px;display:grid;place-items:center;color:#fff;font:600 44px "Songti SC","STSong",serif;margin-bottom:16px}
aside h2{margin:0;font:600 26px/1.2 "Songti SC","STSong",serif}
aside .role{color:var(--burg);margin:4px 0 16px}
aside dl{display:grid;grid-template-columns:64px 1fr;gap:8px 10px;margin:0 0 18px}
aside dt{color:var(--sub)}aside dd{margin:0}
aside blockquote{margin:0 0 18px;padding:12px 14px;border-left:3px solid var(--gold);background:var(--cream);font-family:"Kaiti SC","STKaiti","KaiTi",serif;font-size:15px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}.tags span{font-size:12px;padding:2px 8px;border:1px solid var(--line);border-radius:10px}
.btn{height:40px;padding:0 18px;border:0;border-radius:20px;background:var(--burg);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.btn:hover{background:#5f1520}
.btn.o{background:none;border:1px solid var(--burg);color:var(--burg);margin-left:8px}
@media (max-width:1000px){.wrap{grid-template-columns:1fr}aside{position:static;border-left:0;border-top:1px solid var(--line)}.grid,header,.bar{padding-left:24px;padding-right:24px}.bar input{width:100%}}
@media (prefers-reduced-motion:reduce){.p{transition:none}.p:hover{transform:none}}
</style>
</head>
<body>
<header><div><h1>成员目录</h1><p>青梧研究院 · 2026 届全体研究员与工作人员</p></div><div class="crest" aria-hidden="true">梧</div></header>
<div class="bar"><input id="q" placeholder="搜姓名、方向或办公室" aria-label="搜索成员"><div class="chips" id="chips"><button class="chip" type="button" aria-pressed="true" data-d="">全部</button><button class="chip" type="button" aria-pressed="false" data-d="材料">材料所</button><button class="chip" type="button" aria-pressed="false" data-d="计算">计算所</button><button class="chip" type="button" aria-pressed="false" data-d="生命">生命所</button><button class="chip" type="button" aria-pressed="false" data-d="行政">行政</button></div><span class="count" id="count"></span></div>
<div class="wrap"><main class="grid" id="grid" aria-label="成员"></main><aside id="pf" aria-live="polite"></aside></div>
<script>
const P=[['沈知远','研究员 · 课题组长','材料','#7a1f2b','A 楼 412','钙钛矿太阳能电池','“做材料像做菜，火候比配方重要。”',['钙钛矿','薄膜','光伏'],'2014'],['顾以安','副研究员','计算','#2f4858','B 楼 207','图神经网络 · 分子性质预测','“好模型先学会说不知道。”',['GNN','药物发现'],'2019'],['林晚舟','博士后','生命','#5b6b3a','C 楼 118','单细胞测序','“每个细胞都有自己的日记。”',['单细胞','免疫'],'2023'],['许明澈','研究员','计算','#36454f','B 楼 305','高性能计算与调度','“让算力不排队。”',['HPC','调度'],'2016'],['唐若溪','助理研究员','材料','#9c4a2f','A 楼 309','柔性电子','“能弯的屏幕，背后是不弯的耐心。”',['柔性电子','传感'],'2021'],['周慕白','行政主管','行政','#6b5b4b','行政楼 101','科研行政与经费管理','“报销单上写清楚，大家都轻松。”',['经费','采购'],'2015'],['陆星河','博士生','生命','#3d5a80','C 楼 220','合成生物学','“把基因线路画成电路图。”',['合成生物','微流控'],'2024'],['温以宁','实验平台工程师','材料','#8a6a3b','A 楼 B1','电镜与表征平台','“预约系统里永远有我。”',['电镜','XRD'],'2018'],['程一诺','研究员','生命','#4f6d4a','C 楼 402','神经发育','“大脑在三岁前做了一生最难的工程。”',['神经','发育'],'2012'],['白砚秋','人事专员','行政','#7d5a6b','行政楼 104','招聘与入职','“新同事第一天的咖啡我来请。”',['招聘','入职'],'2022']];
let d='',sel=0;const $=s=>document.querySelector(s);
function card(p,i){const b=document.createElement('button');b.type='button';b.className='p';b.setAttribute('aria-pressed',i===sel);b.innerHTML='<div class="ph" style="background:'+p[3]+'">'+p[0][0]+'</div><b>'+p[0]+'</b><small>'+p[1]+'</small><span class="d">'+p[2]+(p[2]==='行政'?'':'所')+'</span>';b.onclick=()=>{sel=i;render()};return b}
function prof(p){$('#pf').innerHTML='<div class="big" style="background:'+p[3]+'">'+p[0][0]+'</div><h2>'+p[0]+'</h2><div class="role">'+p[1]+' · '+p[2]+(p[2]==='行政'?'部':'所')+'</div><dl><dt>方向</dt><dd>'+p[5]+'</dd><dt>办公室</dt><dd>'+p[4]+'</dd><dt>入院</dt><dd>'+p[8]+' 年</dd><dt>邮箱</dt><dd>'+['shen','gu','lin','xu','tang','zhou','lu','wen','cheng','bai'][P.indexOf(p)]+'@qingwu.ac.cn</dd></dl><blockquote>'+p[6]+'</blockquote><div class="tags">'+p[7].map(t=>'<span>'+t+'</span>').join('')+'</div><button class="btn" type="button">发消息</button><button class="btn o" type="button">预约面谈</button>'}
function render(){const q=$('#q').value.trim();const g=$('#grid');g.innerHTML='';let n=0;P.forEach((p,i)=>{if(d&&p[2]!==d)return;if(q&&!(p[0]+p[1]+p[4]+p[5]).includes(q))return;g.append(card(p,i));n++});
 if(!n)g.innerHTML='<div class="none">没有符合条件的成员，试试清空搜索或切换到「全部」。</div>';$('#count').textContent='共 '+n+' 人';prof(P[sel])}
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{d=c.dataset.d;document.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x===c));render()});
$('#q').oninput=render;render();
</script>
</body>
</html>
