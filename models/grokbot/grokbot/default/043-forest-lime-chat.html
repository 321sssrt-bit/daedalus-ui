<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>林语 · 消息</title>
<style>
:root{--bg:#0f1512;--panel:#16201b;--raise:#1e2a24;--line:#26352d;--lime:#c6f36b;--lime-d:#a8d84a;--text:#e8f0ea;--sub:#8fa197;--red:#ff6b5e;--amber:#ffc65c}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;position:relative}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);transition:opacity .2s,visibility .2s}
.scr.hide{opacity:0;visibility:hidden;pointer-events:none}
.scr.in{animation:sl .25s cubic-bezier(.2,.8,.2,1)}
@keyframes sl{from{transform:translateX(20px);opacity:0}}
.hd{display:flex;align-items:center;gap:10px;padding:14px 16px 10px}
.hd h1{margin:0;font-size:26px;letter-spacing:-.01em;flex:1}
.hd .me{width:34px;height:34px;border-radius:50%;background:var(--lime);color:var(--bg);display:grid;place-items:center;font-weight:800}
.srch{margin:0 16px 8px;height:40px;border-radius:12px;background:var(--panel);border:1px solid var(--line);display:flex;align-items:center;padding:0 12px;color:var(--sub);font-size:14px}
.tabs{display:flex;gap:6px;padding:4px 16px 8px}
.tabs span{font-size:13px;padding:4px 12px;border-radius:14px;background:var(--panel);color:var(--sub)}
.tabs span.on{background:var(--lime);color:var(--bg);font-weight:700}
.list{flex:1;overflow:auto;padding:0 8px}
.cv{display:grid;grid-template-columns:50px 1fr auto;gap:12px;align-items:center;width:100%;padding:10px 8px;border:0;border-radius:16px;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.cv:hover{background:var(--panel)}
.av{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:18px;color:var(--bg);position:relative}
.av.on:after{content:"";position:absolute;right:1px;bottom:1px;width:12px;height:12px;border-radius:50%;background:var(--lime);border:2px solid var(--bg)}
.cv b{display:block;font-size:15px}
.cv small{display:block;color:var(--sub);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:210px}
.cv small.f{color:var(--red)}
.cv .r{text-align:right;font-size:12px;color:var(--sub)}
.cv .n{display:inline-block;min-width:20px;height:20px;border-radius:10px;background:var(--lime);color:var(--bg);font-weight:800;font-size:12px;text-align:center;line-height:20px;padding:0 6px;margin-top:4px}
nav{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);padding:8px 0 14px;background:var(--panel)}
nav span{text-align:center;font-size:11px;color:var(--sub)}nav span b{display:block;font-size:19px;font-weight:400}
nav span.on{color:var(--lime)}
.ch .hd{border-bottom:1px solid var(--line);padding:10px 12px;gap:10px}
.ch .hd .av{width:38px;height:38px;font-size:15px}
.ch .hd div{flex:1}.ch .hd b{display:block;font-size:16px}.ch .hd small{color:var(--sub);font-size:12px}
.back{width:36px;height:36px;border:0;border-radius:50%;background:var(--panel);color:var(--text);font-size:18px;cursor:pointer}
.net{display:flex;align-items:center;gap:8px;padding:8px 14px;background:#1a1f15;border-bottom:1px solid var(--line);font-size:12px;color:var(--sub)}
.net b{color:var(--text);font-weight:600}
.sw{margin-left:auto;width:44px;height:24px;border-radius:12px;border:0;background:#33433a;position:relative;cursor:pointer;flex:none}
.sw:after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#cfd8d2;transition:left .15s}
.sw[aria-checked="true"]{background:var(--red)}
.sw[aria-checked="true"]:after{left:23px;background:#fff}
.net.bad{background:#2a1714;color:#ffb3aa}
.msgs{flex:1;overflow:auto;padding:14px 12px 8px;display:flex;flex-direction:column;gap:6px}
.day{align-self:center;font-size:11px;color:var(--sub);background:var(--panel);padding:2px 10px;border-radius:10px;margin:6px 0}
.m{max-width:76%;padding:8px 12px;border-radius:18px;font-size:15px;line-height:1.45;position:relative;word-break:break-word}
.m.them{align-self:flex-start;background:var(--raise);border-bottom-left-radius:6px}
.m.me{align-self:flex-end;background:var(--lime);color:#14200a;border-bottom-right-radius:6px}
.m.me.fail{background:transparent;color:var(--text);border:1.5px dashed var(--red)}
.st{align-self:flex-end;font-size:11px;color:var(--sub);margin:-2px 4px 4px;display:flex;gap:8px;align-items:center}
.st.read{color:var(--lime)}
.st.fail{color:var(--red);font-weight:600}
.st button{height:26px;padding:0 10px;border-radius:13px;border:1.5px solid var(--red);background:none;color:var(--red);font:inherit;font-weight:700;cursor:pointer}
.st button.del{border-color:var(--line);color:var(--sub)}
.typing{align-self:flex-start;background:var(--raise);border-radius:18px;padding:10px 14px;display:none;gap:4px}
.typing.on{display:flex}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--sub);animation:tp 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tp{50%{opacity:.3;transform:translateY(-2px)}}
.cmp{display:flex;align-items:flex-end;gap:8px;padding:8px 10px 14px;border-top:1px solid var(--line);background:var(--panel)}
.cmp textarea{flex:1;min-height:42px;max-height:110px;resize:none;border:1px solid var(--line);border-radius:21px;background:var(--bg);color:var(--text);font:inherit;padding:10px 14px;line-height:1.4}
.cmp textarea:focus{outline:none;border-color:var(--lime)}
.send{width:42px;height:42px;border-radius:50%;border:0;background:var(--lime);color:var(--bg);font-size:18px;font-weight:900;cursor:pointer;flex:none}
.send:disabled{background:#33433a;color:#5d6e64;cursor:not-allowed}
.cnt{font-size:11px;color:var(--sub);align-self:center;min-width:34px;text-align:right}
button:focus-visible,textarea:focus-visible,.cv:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
@media (min-width:600px){body{max-width:430px;margin:0 auto;border-left:1px solid var(--line);border-right:1px solid var(--line)}}
@media (prefers-reduced-motion:reduce){.scr.in,.typing i{animation:none}.sw:after,.scr{transition:none}}
</style>
</head>
<body>
<section class="scr" id="home" aria-label="会话列表">
  <div class="hd"><h1>消息</h1><span class="me" aria-label="我">岚</span></div>
  <div class="srch">🔍 搜索联系人和聊天记录</div>
  <div class="tabs"><span class="on">全部</span><span>未读</span><span>群组</span></div>
  <div class="list" id="list"></div>
  <nav aria-label="底栏"><span class="on"><b>💬</b>消息</span><span><b>👥</b>通讯录</span><span><b>⚙︎</b>我的</span></nav>
</section>
<section class="scr ch hide" id="chat" aria-label="当前会话">
  <div class="hd"><button class="back" type="button" id="bk" aria-label="返回会话列表">‹</button><span class="av" id="cav"></span><div><b id="cn"></b><small id="cs"></small></div></div>
  <div class="net" id="net"><span>📶</span><span id="nt">网络正常</span><button class="sw" type="button" role="switch" aria-checked="false" id="sw" aria-label="模拟断网：下一条发送失败"></button></div>
  <div class="msgs" id="msgs" aria-live="polite"></div>
  <div class="cmp"><textarea id="ta" rows="1" maxlength="500" placeholder="说点什么…" aria-label="输入消息"></textarea><span class="cnt" id="cnt"></span><button class="send" type="button" id="send" aria-label="发送" disabled>↑</button></div>
</section>
<script>
const C=[{id:'a',n:'小满',c:'#c6f36b',on:1,unread:2,m:[['them','周六去爬山吗？','09:12'],['them','听说南山的银杏黄了 🍂','09:13']]},
{id:'b',n:'设计组 · 周会',c:'#7fd6c2',on:0,unread:5,m:[['them','老许：周五前把首页稿给我','昨天'],['me','收到，周四晚上发','昨天','read']]},
{id:'c',n:'妈妈',c:'#ffc65c',on:1,unread:0,m:[['them','降温了记得加衣服','昨天'],['me','知道啦','昨天','read']]},
{id:'d',n:'阿哲',c:'#b9a6ff',on:0,unread:0,m:[['me','书我放你门口了','周一','read'],['them','谢啦！','周一']]},
{id:'e',n:'房东 陈先生',c:'#ff9f8a',on:0,unread:0,m:[['them','下月水电账单发你了','9/30']]}];
let cur=null,failNext=false,seq=0;const $=s=>document.querySelector(s);
const now=()=>{const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
function show(id){['home','chat'].forEach(s=>{const e=$('#'+s);e.classList.toggle('hide',s!==id);e.classList.remove('in');if(s===id){void e.offsetWidth;e.classList.add('in')}})}
function list(){$('#list').innerHTML=C.map(c=>{const l=c.m[c.m.length-1],f=c.m.some(x=>x[3]==='fail');return '<button class="cv" type="button" data-id="'+c.id+'"><span class="av'+(c.on?' on':'')+'" style="background:'+c.c+'">'+c.n[0]+'</span><span><b>'+c.n+'</b><small class="'+(f?'f':'')+'">'+(f?'❗ 有消息未发出':(l[0]==='me'?'我：':'')+l[1])+'</small></span><span class="r">'+l[2]+(c.unread?'<br><span class="n">'+c.unread+'</span>':'')+'</span></button>'}).join('');
 document.querySelectorAll('.cv').forEach(b=>b.onclick=()=>openC(b.dataset.id))}
function openC(id){cur=C.find(c=>c.id===id);cur.unread=0;$('#cav').textContent=cur.n[0];$('#cav').style.background=cur.c;$('#cn').textContent=cur.n;$('#cs').textContent=cur.on?'在线':'最近在线 2 小时前';render();show('chat');setTimeout(()=>$('#ta').focus(),260)}
const SL={sending:'发送中…',sent:'已发送',deliv:'已送达',read:'已读',fail:'❗ 发送失败'};
function render(){const h=['<span class="day">今天</span>'];cur.m.forEach((x,i)=>{h.push('<div class="m '+x[0]+(x[3]==='fail'?' me fail':'')+'">'+x[1].replace(/</g,'&lt;')+'</div>');
 if(x[0]==='me'&&i===cur.m.length-1||x[0]==='me'&&x[3]==='fail'||x[0]==='me'&&(x[3]==='sending'||x[3]==='deliv'))h.push('<div class="st '+(x[3]==='read'?'read':x[3]==='fail'?'fail':'')+'">'+x[2]+' · '+SL[x[3]||'sent']+(x[3]==='fail'?'<button type="button" data-rt="'+i+'">重试</button><button type="button" class="del" data-dl="'+i+'">删除</button>':'')+'</div>')});
 h.push('<div class="typing" id="typ"><i></i><i></i><i></i></div>');$('#msgs').innerHTML=h.join('');$('#msgs').scrollTop=1e6;
 document.querySelectorAll('[data-rt]').forEach(b=>b.onclick=()=>deliver(+b.dataset.rt,true));
 document.querySelectorAll('[data-dl]').forEach(b=>b.onclick=()=>{cur.m.splice(+b.dataset.dl,1);render()})}
function deliver(i,retry){const x=cur.m[i];x[3]='sending';if(retry)x[2]=now();render();const willFail=failNext&&!retry;
 setTimeout(()=>{if(willFail){x[3]='fail';failNext=false;setNet();render();return}
  if(retry&&$('#sw').getAttribute('aria-checked')==='true'){x[3]='fail';render();return}
  x[3]='deliv';render();if(cur.on)setTimeout(()=>{x[3]='read';render();reply()},900)},700)}
function reply(){if(cur.id!=='a'||cur.replied)return;cur.replied=1;setTimeout(()=>{const t=$('#typ');t&&t.classList.add('on');$('#msgs').scrollTop=1e6;setTimeout(()=>{cur.m.push(['them','好！那周六 8 点地铁站见 👟',now()]);render()},1200)},400)}
function setNet(){const on=failNext;$('#sw').setAttribute('aria-checked',on);$('#net').classList.toggle('bad',on);$('#nt').innerHTML=on?'<b>模拟断网已开启</b>：下一条消息会发送失败':'网络正常 · 打开右侧开关可模拟下一条发送失败'}
$('#sw').onclick=()=>{failNext=!failNext;setNet()};
$('#ta').oninput=()=>{const v=$('#ta').value;$('#send').disabled=!v.trim();$('#cnt').textContent=v.length>400?v.length+'/500':'';$('#ta').style.height='auto';$('#ta').style.height=Math.min(110,$('#ta').scrollHeight)+'px'};
function send(){const v=$('#ta').value.trim();if(!v)return;cur.m.push(['me',v,now(),'sending']);$('#ta').value='';$('#ta').oninput();deliver(cur.m.length-1,false)}
$('#send').onclick=send;$('#ta').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};
$('#bk').onclick=()=>{list();show('home')};
list();setNet();
</script>
</body>
</html>
