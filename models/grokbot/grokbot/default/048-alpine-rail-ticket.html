<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>山线铁路 · 购票</title>
<style>
:root{--red:#e30613;--red-d:#b8000c;--ink:#111;--g1:#f5f5f3;--g2:#e4e4e0;--g3:#8c8c88;--blue:#2d4f9e;--y:#ffcc00;--ok:#0a7d3c}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#d9d9d4;font:15px/1.45 "Helvetica Neue","Arial","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);display:flex;justify-content:center}
.app{width:100%;max-width:430px;height:100vh;height:100dvh;background:#fff;position:relative;overflow:hidden}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;visibility:hidden}
.scr.on{opacity:1;visibility:visible;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.bar{background:var(--red);color:#fff;padding:14px 16px 12px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.bar h1{font-size:17px;margin:0;font-weight:700;flex:1}
.bar .bk{width:34px;height:34px;border:0;background:#ffffff26;color:#fff;border-radius:50%;font-size:18px;cursor:pointer}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:.04em}
.logo i{width:26px;height:26px;background:#fff;display:grid;place-items:center;color:var(--red);font-style:normal;font-size:20px;font-weight:900;line-height:1}
.body{flex:1;overflow:auto;padding:16px}
.foot{padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--g2);background:#fff;flex-shrink:0}
.btn{width:100%;height:50px;border:0;background:var(--red);color:#fff;font-family:inherit;font-size:16px;font-weight:700;cursor:pointer}
.btn:active{background:var(--red-d)}.btn:disabled{background:var(--g2);color:var(--g3)}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--ink);margin-top:8px}
.route{border:2px solid var(--ink);position:relative}
.route label{display:block;padding:10px 14px;border-bottom:1px solid var(--g2)}
.route label:last-of-type{border-bottom:0}
.route small{display:block;font-size:12px;color:var(--g3)}
.route select{width:100%;border:0;font-family:inherit;font-size:20px;font-weight:700;background:none;padding:0;color:var(--ink);appearance:none}
.swap{position:absolute;right:14px;top:38px;width:40px;height:40px;border-radius:50%;border:2px solid var(--ink);background:#fff;font-size:18px;cursor:pointer}
.dates{display:flex;gap:6px;margin:14px 0;overflow:auto}
.dates button{flex:0 0 auto;min-width:62px;height:56px;border:2px solid var(--g2);background:#fff;font-family:inherit;font-size:12px;cursor:pointer}
.dates button b{display:block;font-size:16px}
.dates button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:#fff}
.clock{display:flex;align-items:center;gap:12px;margin-top:18px;padding:14px;background:var(--g1)}
.clock svg{flex-shrink:0}
.clock p{margin:0;font-size:13px;color:#444}
.sum{font-size:13px;color:#fff;opacity:.9}
.tr{width:100%;display:grid;grid-template-columns:1fr auto;gap:4px 10px;text-align:left;border:0;border-bottom:1px solid var(--g2);background:#fff;padding:14px 4px;font-family:inherit;cursor:pointer}
.tr:active{background:var(--g1)}
.tr .t{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.tr .t span{font-size:13px;color:var(--g3);font-weight:400;margin:0 6px}
.tr .p{font-size:18px;font-weight:700;text-align:right}
.tr .m{font-size:12px;color:#555;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tag{display:inline-block;padding:1px 6px;font-size:11px;font-weight:700;border:1px solid currentColor}
.tag.y{background:var(--y);border-color:var(--y);color:var(--ink)}
.tag.x{color:var(--g3)}
.tr.so{opacity:.45;cursor:not-allowed}
.tr .r{font-size:12px;text-align:right;color:var(--ok);font-weight:700}
.tr .r.low{color:var(--red)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:#444;margin:4px 0 12px}
.legend span{display:flex;align-items:center;gap:4px}
.legend i{width:16px;height:16px;border:2px solid var(--ink);display:inline-block}
.car{border:2px solid var(--ink);border-radius:26px 26px 6px 6px;padding:18px 12px 12px}
.car .hd{text-align:center;font-size:12px;color:var(--g3);margin-bottom:8px}
.row{display:grid;grid-template-columns:24px 1fr 1fr 1fr 14px 1fr 1fr;gap:6px;margin-bottom:6px;align-items:center}
.row b{font-size:11px;color:var(--g3);text-align:center;font-weight:400}
.seat{height:38px;border:2px solid var(--ink);background:#fff;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;position:relative;padding:0}
.seat:disabled{background:var(--g2);border-color:var(--g2);color:var(--g3);cursor:not-allowed}
.seat[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.seat.chk::after{content:"!";position:absolute;top:-6px;right:-6px;width:15px;height:15px;background:var(--y);color:var(--ink);font-size:11px;line-height:15px;border-radius:50%}
.seat.gone{background:repeating-linear-gradient(45deg,#ffe0e0 0 4px,#fff 4px 8px);border-color:var(--red);color:var(--red)}
.box{border:2px solid var(--ink);padding:14px;margin-bottom:12px}
.box h3{margin:0 0 8px;font-size:13px;color:var(--g3);font-weight:400}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dotted var(--g2)}
.kv:last-child{border:0}.kv b{font-variant-numeric:tabular-nums}
.big{display:flex;justify-content:space-between;align-items:baseline;font-size:15px}
.big b{font-size:26px}
.alert{border:3px solid var(--red);padding:14px;margin-bottom:14px;background:#fff5f5}
.alert h2{margin:0 0 6px;color:var(--red);font-size:18px;display:flex;gap:8px;align-items:center}
.alert h2 i{width:26px;height:26px;background:var(--red);color:#fff;display:grid;place-items:center;font-style:normal}
.alert p{margin:0;font-size:14px}
.keep{font-size:13px;color:#444;background:var(--g1);padding:10px 12px;margin-bottom:14px}
.ticket{border:2px solid var(--ink);position:relative;overflow:hidden}
.ticket .tp{background:var(--red);color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center}
.ticket .rt{display:grid;grid-template-columns:1fr auto 1fr;padding:16px 14px 8px;align-items:end}
.ticket .rt div:last-child{text-align:right}
.ticket .rt b{display:block;font-size:30px;font-variant-numeric:tabular-nums;line-height:1}
.ticket .rt span{font-size:14px}
.ticket .rt em{font-style:normal;font-size:12px;color:var(--g3);text-align:center;padding-bottom:6px}
.ticket .gr{display:grid;grid-template-columns:repeat(4,1fr);padding:8px 14px 14px;gap:6px;font-size:12px;color:var(--g3)}
.ticket .gr b{display:block;font-size:16px;color:var(--ink)}
.perf{border-top:2px dashed var(--ink);margin:0 -2px;position:relative}
.perf::before,.perf::after{content:"";position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid var(--ink)}
.perf::before{left:-12px}.perf::after{right:-12px}
.qr{display:flex;gap:14px;align-items:center;padding:14px}
.qr .q{width:96px;height:96px;display:grid;grid-template-columns:repeat(12,1fr);border:4px solid #fff;outline:2px solid var(--ink)}
.qr .q i{display:block}
.qr p{margin:0;font-size:12px;color:#444}
.qr p b{display:block;font-size:15px;color:var(--ink);letter-spacing:.06em}
button:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
<!-- 1 搜索 -->
<section class="scr on" id="s1" aria-label="搜索路线">
  <div class="bar"><div class="logo"><i>+</i>山线铁路</div></div>
  <div class="body">
    <h2 style="margin:4px 0 12px;font-size:24px">去哪里？</h2>
    <div class="route">
      <label><small>出发站</small><select id="from"><option>湖港站</option><option>雪松镇</option><option>圣河谷</option></select></label>
      <label><small>到达站</small><select id="to"><option>冰川口</option><option>雪松镇</option><option>圣河谷</option></select></label>
      <button class="swap" type="button" id="swap" aria-label="交换出发站和到达站">⇅</button>
    </div>
    <div class="dates" id="dates" role="group" aria-label="出发日期"></div>
    <label style="display:flex;justify-content:space-between;align-items:center;border:2px solid var(--g2);padding:10px 14px"><span>乘车人数</span><b>1 位成人</b></label>
    <div class="clock"><svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="20" fill="#fff" stroke="#111" stroke-width="2"/><g stroke="#111" stroke-width="3"><line x1="22" y1="22" x2="22" y2="9"/><line x1="22" y1="22" x2="31" y2="22"/></g><line x1="22" y1="22" x2="14" y2="32" stroke="#e30613" stroke-width="1.5"/><circle cx="14" cy="32" r="2.5" fill="#e30613"/></svg><p>准点率 98.2%。标有 <span class="tag y">确认时查票</span> 的班次或带黄色「!」的座位，会在确认订单时触发余票检查并显示售罄。</p></div>
  </div>
  <div class="foot"><button class="btn" type="button" id="go">查询班次</button></div>
</section>
<!-- 2 班次 -->
<section class="scr" id="s2" aria-label="选择班次">
  <div class="bar"><button class="bk" type="button" data-to="s1" aria-label="返回">‹</button><div style="flex:1"><h1 class="rtt"></h1><div class="sum" id="sum2"></div></div></div>
  <div class="body" id="list" style="padding-top:4px"></div>
</section>
<!-- 3 座位 -->
<section class="scr" id="s3" aria-label="选择座位">
  <div class="bar"><button class="bk" type="button" data-to="s2" aria-label="返回班次">‹</button><div style="flex:1"><h1 id="trn"></h1><div class="sum" id="sum3"></div></div></div>
  <div class="body">
    <div class="legend"><span><i></i>可选</span><span><i style="background:#e30613;border-color:#e30613"></i>已选</span><span><i style="background:#e4e4e0;border-color:#e4e4e0"></i>已售</span><span><span class="tag y">!</span> 确认时查票（会售罄）</span></div>
    <div class="car"><div class="hd">▲ 车头方向 · 05 车 · 二等座</div><div id="seats"></div></div>
  </div>
  <div class="foot"><div class="big" style="margin-bottom:8px"><span id="sel">请选择座位</span><b id="pr"></b></div><button class="btn" type="button" id="toc" disabled>下一步：确认订单</button></div>
</section>
<!-- 4 确认 -->
<section class="scr" id="s4" aria-label="确认订单">
  <div class="bar"><button class="bk" type="button" data-to="s3" aria-label="返回座位">‹</button><h1>确认订单</h1></div>
  <div class="body" id="conf"></div>
  <div class="foot"><button class="btn" type="button" id="pay">确认并支付</button></div>
</section>
<!-- 5 售罄 -->
<section class="scr" id="s5" aria-label="售罄">
  <div class="bar"><h1>无法出票</h1></div>
  <div class="body" id="sold"></div>
  <div class="foot"><button class="btn" type="button" id="reseat">改选其他座位</button><button class="btn ghost" type="button" id="retrain">返回结果改选班次</button></div>
</section>
<!-- 6 凭证 -->
<section class="scr" id="s6" aria-label="行程凭证">
  <div class="bar"><div class="logo"><i>+</i>行程凭证</div></div>
  <div class="body" id="tk"></div>
  <div class="foot"><button class="btn ghost" type="button" id="again" style="margin:0">再订一张</button></div>
</section>
</div>
<script>
const $=s=>document.querySelector(s);
const TR=[{no:'IR 512',d:'07:12',a:'09:38',dur:'2时26分',p:96,left:42},{no:'IC 708',d:'08:05',a:'10:02',dur:'1时57分',p:128,left:6},{no:'RE 330',d:'09:40',a:'12:51',dur:'3时11分',p:68,left:0},{no:'IC 714',d:'11:05',a:'13:02',dur:'1时57分',p:128,left:1,chk:1},{no:'IR 520',d:'13:12',a:'15:38',dur:'2时26分',p:96,left:23}];
const TAKEN=['01A','01B','02C','02F','03A','03D','04B','04C','05F','06A','06D','07B','07C','08A'];
const CHK=['08F','03F'];
let st={from:'湖港站',to:'冰川口',date:0,tr:null,seat:null,sold:{}},days=[];
const now=new Date(2026,9,12);for(let i=0;i<6;i++){const d=new Date(now);d.setDate(d.getDate()+i);days.push(d)}
const W='日一二三四五六';
$('#dates').innerHTML=days.map((d,i)=>'<button type="button" aria-pressed="'+(i===0)+'" data-i="'+i+'">周'+W[d.getDay()]+'<b>'+(d.getMonth()+1)+'/'+d.getDate()+'</b></button>').join('');
document.querySelectorAll('#dates button').forEach(b=>b.onclick=()=>{st.date=+b.dataset.i;document.querySelectorAll('#dates button').forEach(x=>x.setAttribute('aria-pressed',x===b))});
const ds=()=>{const d=days[st.date];return (d.getMonth()+1)+'月'+d.getDate()+'日 周'+W[d.getDay()]};
function go(id){document.querySelectorAll('.scr').forEach(s=>s.classList.toggle('on',s.id===id));const b=$('#'+id+' .body');if(b)b.scrollTop=0}
document.querySelectorAll('[data-to]').forEach(b=>b.onclick=()=>go(b.dataset.to));
$('#swap').onclick=()=>{const f=$('#from').value,t=$('#to').value;const of=[...$('#from').options].map(o=>o.text),ot=[...$('#to').options].map(o=>o.text);
 if(!of.includes(t))$('#from').add(new Option(t));if(!ot.includes(f))$('#to').add(new Option(f));$('#from').value=t;$('#to').value=f};
function list(){$('.rtt').textContent=st.from+' → '+st.to;$('#sum2').textContent=ds()+' · 1 位成人 · '+TR.length+' 个班次';
 $('#list').innerHTML=TR.map((t,i)=>{const so=t.left===0||st.sold[t.no]==='all';return '<button type="button" class="tr'+(so?' so':'')+'" data-i="'+i+'"'+(so?' aria-disabled="true"':'')+'><div class="t">'+t.d+'<span>— '+t.dur+' —</span>'+t.a+'</div><div class="p">¥'+t.p+'</div><div class="m"><span class="tag">'+t.no+'</span>'+(t.chk?'<span class="tag y">确认时查票</span>':'')+(t.no.startsWith('IC')?'直达':'经停 2 站')+'</div><div class="r'+(so||t.left<10?' low':'')+'">'+(so?'已售罄':t.left<10?'仅剩 '+t.left+' 张':'有票')+'</div></button>'}).join('');
 document.querySelectorAll('.tr').forEach(b=>b.onclick=()=>{const t=TR[+b.dataset.i];if(b.classList.contains('so'))return;st.tr=t;st.seat=null;seats();go('s3')})}
$('#go').onclick=()=>{st.from=$('#from').value;st.to=$('#to').value;if(st.from===st.to){alert('出发站和到达站不能相同');return}list();go('s2')};
function seats(){const t=st.tr;$('#trn').textContent=t.no+' · '+t.d+' 开';$('#sum3').textContent=st.from+' → '+st.to+' · '+ds();let h='';
 for(let r=1;r<=8;r++){const rr=String(r).padStart(2,'0');h+='<div class="row"><b>'+rr+'</b>';['A','B','C','','D','F'].forEach(c=>{if(!c){h+='<span></span>';return}const id=rr+c,tk=TAKEN.includes(id)||(t.left<10&&!t.chk&&(r+c.charCodeAt(0))%2===0),g=st.sold[t.no+id],ck=CHK.includes(id)&&!g;
  h+='<button type="button" class="seat'+(ck?' chk':'')+(g?' gone':'')+'" data-s="'+id+'" aria-pressed="'+(st.seat===id)+'" aria-label="'+r+' 排 '+c+' 座'+(ck?'，确认时查票':'')+(g?'，已售罄':'')+'"'+(tk||g?' disabled':'')+'>'+(g?'售罄':c)+'</button>'});h+='</div>'}
 $('#seats').innerHTML=h;document.querySelectorAll('.seat').forEach(b=>b.onclick=()=>{st.seat=b.dataset.s;document.querySelectorAll('.seat').forEach(x=>x.setAttribute('aria-pressed',x===b));upd()});upd()}
function upd(){const s=st.seat;$('#sel').textContent=s?'05 车 '+s+(CHK.includes(s)?'（确认时查票）':'')+(s.endsWith('A')||s.endsWith('F')?' · 靠窗':''):'请选择座位';$('#pr').textContent=s?'¥'+st.tr.p:'';$('#toc').disabled=!s}
$('#toc').onclick=()=>{const t=st.tr;$('#conf').innerHTML='<div class="box"><h3>行程</h3><div class="kv"><span>线路</span><b>'+st.from+' → '+st.to+'</b></div><div class="kv"><span>日期</span><b>'+ds()+'</b></div><div class="kv"><span>班次</span><b>'+t.no+' · '+t.d+'–'+t.a+'</b></div><div class="kv"><span>座位</span><b>05 车 '+st.seat+' · 二等座</b></div></div><div class="box"><h3>乘车人</h3><div class="kv"><span>林雨桐</span><b>身份证 ****3318</b></div></div><div class="box"><div class="kv"><span>票价</span><b>¥'+t.p+'.00</b></div><div class="kv"><span>服务费</span><b>¥0.00</b></div><div class="big" style="margin-top:6px"><span>应付</span><b>¥'+t.p+'.00</b></div></div>'+(t.chk||CHK.includes(st.seat)?'<p style="font-size:12px;color:#444;margin:0">⚠ 该'+(t.chk?'班次':'座位')+'标记为「确认时查票」，提交时会进行余票检查。</p>':'');go('s4')};
$('#pay').onclick=()=>{const t=st.tr,b=$('#pay');b.disabled=true;b.textContent='正在检查余票…';setTimeout(()=>{b.disabled=false;b.textContent='确认并支付';
 if(t.chk){st.sold[t.no]='all';fail('班次 '+t.no+'（'+t.d+' 开）','该班次最后 1 张余票已被其他乘客购买，整列车已售罄。',false)}
 else if(CHK.includes(st.seat)){st.sold[t.no+st.seat]=1;fail('座位 05 车 '+st.seat,'这个座位刚刚被锁定出售。同班次 '+t.no+' 仍有其他座位可选。',true)}
 else ticket()},900)};
function fail(what,why,canSeat){$('#sold').innerHTML='<div class="alert" role="alert"><h2><i>✕</i>'+what+' 已售罄</h2><p>'+why+'</p><p style="margin-top:6px;font-size:13px;color:#555">本次未扣款，订单未生成。</p></div><div class="keep"><b>已为你保留查询条件</b><br>'+st.from+' → '+st.to+' · '+ds()+' · 1 位成人</div>';
 $('#reseat').style.display=canSeat?'':'none';$('#retrain').className=canSeat?'btn ghost':'btn';$('#retrain').style.marginTop=canSeat?'8px':'0';go('s5')}
$('#reseat').onclick=()=>{st.seat=null;seats();go('s3')};$('#retrain').onclick=()=>{st.seat=null;list();go('s2')};
function ticket(){const t=st.tr,code='SL'+(t.no.replace(' ','')+st.seat).toUpperCase()+'26';let q='';let seed=0;for(const ch of code)seed=(seed*31+ch.charCodeAt(0))%9973;
 for(let i=0;i<144;i++){const r=Math.floor(i/12),c=i%12,fd=(r<3&&c<3)||(r<3&&c>8)||(r>8&&c<3);seed=(seed*73+11)%9973;const on=fd?!((r%9===1||c%9===1)&&!(r%9===0||c%9===0||r%9===2||c%9===2))&&!(r===1&&c===1)&&!(r===1&&c===10)&&!(r===10&&c===1):seed%2;q+='<i style="background:'+(on?'#111':'#fff')+'"></i>'}
 $('#tk').innerHTML='<p style="margin:0 0 12px;color:var(--ok);font-weight:700">✓ 出票成功，凭证已存入「我的行程」</p><div class="ticket"><div class="tp"><b>'+t.no+'</b><span>'+ds()+'</span></div><div class="rt"><div><b>'+t.d+'</b><span>'+st.from+'</span></div><em>'+t.dur+'<br>———▶</em><div><b>'+t.a+'</b><span>'+st.to+'</span></div></div><div class="gr"><div>车厢<b>05</b></div><div>座位<b>'+st.seat+'</b></div><div>席别<b>二等</b></div><div>票价<b>¥'+t.p+'</b></div></div><div class="perf"></div><div class="qr"><div class="q" role="img" aria-label="检票二维码">'+q+'</div><p>乘车人 林雨桐<b>'+code+'</b>请在开车前 3 分钟到达站台，出示此码检票。</p></div></div>';go('s6')}
$('#again').onclick=()=>{st.tr=null;st.seat=null;go('s1')};
</script>
</body>
</html>
