<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>习惯 · 像素岛</title>
<style>
:root{--sky:#9ad7ff;--sky2:#c9ecff;--grass:#5cc35a;--dirt:#a8693a;--ink:#1e1b3a;--white:#ffffff;--coin:#ffd23f;--red:#ff5a5f;--panel:#fff7e0}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(var(--sky) 0 62%,var(--sky2) 62%);color:var(--ink);font:15px/1.5 "Courier New","PingFang SC","Microsoft YaHei",monospace;padding-bottom:84px;image-rendering:pixelated}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px}
.top h1{margin:0;font-size:20px;letter-spacing:.05em}
.coins{display:flex;align-items:center;gap:6px;background:var(--ink);color:var(--coin);padding:4px 10px;font-weight:700;box-shadow:0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink)}
.coins i{width:12px;height:12px;background:var(--coin);box-shadow:inset -3px -3px 0 #d9a400}
.days{display:flex;gap:6px;padding:0 16px 8px;overflow:hidden}
.days span{flex:1;text-align:center;padding:6px 0;background:#ffffffaa;font-size:12px}
.days span b{display:block;font-size:15px}
.days span.t{background:var(--ink);color:#fff}
.scene{position:relative;height:300px;margin-top:6px}
.cl{position:absolute;width:8px;height:8px;background:#fff;box-shadow:8px 0 #fff,16px 0 #fff,24px 0 #fff,8px -8px #fff,16px -8px #fff,32px 0 #fff,24px -8px #fff,16px -16px #fff;animation:dr 18s linear infinite}
.cl.a{left:20px;top:40px}.cl.b{left:250px;top:90px;animation-duration:26s;transform:scale(1.4)}
@keyframes dr{50%{translate:30px 0}}
.isl{position:absolute;left:50%;bottom:18px;width:216px;height:72px;transform:translateX(-50%);background:linear-gradient(var(--grass) 0 24px,var(--dirt) 24px);clip-path:polygon(0 0,100% 0,100% 33%,88% 33%,88% 66%,72% 66%,72% 100%,28% 100%,28% 66%,12% 66%,12% 33%,0 33%)}
.sign{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);width:120px;height:72px;background:#d9a066;border:4px solid #7a4a24;display:grid;place-items:center;font-size:30px;font-weight:700;color:#7a4a24}
.sign:after{content:"";position:absolute;bottom:-26px;left:50%;width:10px;height:22px;background:#7a4a24;transform:translateX(-50%)}
.sprout{position:absolute;left:calc(50% + 74px);bottom:90px;width:8px;height:24px;background:var(--grass);box-shadow:-8px -8px 0 var(--grass),8px -12px 0 var(--grass),-16px -8px 0 #3c9a3a,16px -12px 0 #3c9a3a}
.msg{text-align:center;padding:4px 28px 0}
.msg h2{margin:0 0 6px;font-size:21px}
.msg p{margin:0 0 18px;color:#4a4670;font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px}
.cta{display:block;margin:0 auto;height:56px;padding:0 26px;border:0;background:var(--red);color:#fff;font:700 17px/1 "Courier New","PingFang SC",monospace;cursor:pointer;box-shadow:0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink),inset 0 -6px 0 #c9393e;letter-spacing:.06em}
.cta:active{box-shadow:0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink),inset 0 6px 0 #c9393e}
.sub{display:block;margin:14px auto 0;border:0;background:none;font:inherit;font-size:13px;color:var(--ink);text-decoration:underline;text-underline-offset:4px;cursor:pointer}
button:focus-visible{outline:4px dashed var(--ink);outline-offset:4px}
.list{padding:0 16px;display:none;gap:10px}
.list.on{display:grid}
.item{display:flex;align-items:center;gap:12px;background:var(--panel);padding:12px;box-shadow:0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink)}
.item span{font-size:24px}.item b{flex:1}
.item button{width:36px;height:36px;border:3px solid var(--ink);background:#fff;font-family:inherit;font-weight:700;font-size:16px;cursor:pointer}
.item button[aria-pressed="true"]{background:var(--grass);color:#fff}
nav{position:fixed;left:0;right:0;bottom:0;height:72px;background:var(--ink);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 6px 10px}
nav button{border:0;background:none;color:#a5a1d6;font:12px/1.2 "PingFang SC",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
nav button span{font-size:20px}
nav button[aria-current]{color:var(--coin);font-weight:700}
nav button[aria-current] span{transform:translateY(-2px)}
.pick{position:fixed;left:12px;right:12px;bottom:84px;background:var(--panel);padding:16px;display:none;box-shadow:0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink);z-index:5}
.pick.on{display:block}
.pick h3{margin:0 0 10px;font-size:16px}
.pick .g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pick .g button{height:48px;border:3px solid var(--ink);background:#fff;font:14px "PingFang SC",sans-serif;cursor:pointer;text-align:left;padding:0 10px}
.pick .g button:hover{background:var(--coin)}
.pick .cancel{margin-top:10px;width:100%;height:40px;border:0;background:none;font:inherit;text-decoration:underline;cursor:pointer}
@media (min-width:600px){body{max-width:430px;margin:0 auto}nav,.pick{max-width:430px;margin:0 auto}}
@media (prefers-reduced-motion:reduce){.cl{animation:none}}
</style>
</head>
<body>
<header class="top"><h1>我的习惯</h1><span class="coins"><i></i><span id="coin">0</span></span></header>
<div class="days" aria-label="本周"><span>一<b>5</b></span><span>二<b>6</b></span><span>三<b>7</b></span><span>四<b>8</b></span><span>五<b>9</b></span><span class="t">今<b>10</b></span><span>日<b>11</b></span></div>
<main id="empty">
  <div class="scene" aria-hidden="true"><i class="cl a"></i><i class="cl b"></i><div class="sign">0</div><i class="sprout"></i><div class="isl"></div></div>
  <section class="msg"><h2>小岛上还没有习惯</h2><p>每养成一个好习惯，岛上就会长出一样东西。<br>先从一件每天 5 分钟能做完的小事开始吧。</p>
    <button class="cta" type="button" id="new">＋ 种下第一个习惯</button><button class="sub" type="button" id="tpl">看看别人都在坚持什么</button></section>
</main>
<section class="list" id="list" aria-label="习惯列表"></section>
<div class="pick" id="pick" role="dialog" aria-labelledby="pk"><h3 id="pk">选一个开始（之后可以改）</h3><div class="g"><button type="button">💧 喝够 8 杯水</button><button type="button">📖 读 10 页书</button><button type="button">🚶 走 6000 步</button><button type="button">🧘 冥想 5 分钟</button></div><button class="cancel" type="button" id="cc">先不了</button></div>
<nav aria-label="底栏"><button type="button" aria-current="page"><span>🏝️</span>习惯</button><button type="button"><span>📅</span>日历</button><button type="button"><span>🏆</span>成就</button><button type="button"><span>⚙️</span>设置</button></nav>
<script>
const $=s=>document.querySelector(s);let H=[],coin=0;
const open=()=>$('#pick').classList.add('on'),close=()=>$('#pick').classList.remove('on');
$('#new').onclick=open;$('#cc').onclick=close;$('#tpl').onclick=open;
document.querySelectorAll('.pick .g button').forEach(b=>b.onclick=()=>{const t=b.textContent;H.push([t.slice(0,2),t.slice(3)]);close();render()});
function render(){if(!H.length){$('#empty').style.display='';$('#list').classList.remove('on');return}
 $('#empty').style.display='none';$('#list').classList.add('on');
 $('#list').innerHTML=H.map((h,i)=>'<div class="item"><span>'+h[0]+'</span><b>'+h[1]+'</b><button type="button" aria-pressed="false" aria-label="打卡 '+h[1]+'">✓</button></div>').join('')+'<button class="cta" type="button" id="more" style="margin-top:10px">＋ 再种一个</button>';
 document.querySelectorAll('.item button').forEach(b=>b.onclick=()=>{const on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on);coin+=on?10:-10;$('#coin').textContent=coin});
 $('#more').onclick=open}
</script>
</body>
</html>
