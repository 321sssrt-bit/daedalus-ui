<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>账号设置 · 云栈</title>
<style>
:root{--mica:#eef2f7;--card:#fbfcfd;--edge:#e1e6ee;--text:#1b1b1f;--sub:#5f6673;--accent:#0067c0;--accent-d:#00539c;--ok:#0f7b0f;--warn:#c42b1c}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(135deg,#e7eef8,#f3eef6 60%,#eef4f1);color:var(--text);font:14px/1.5 "Segoe UI Variable","Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;display:grid;grid-template-columns:280px 1fr}
nav{padding:20px 12px;display:flex;flex-direction:column;gap:2px}
.me{display:flex;gap:12px;align-items:center;padding:8px 12px 18px}
.av{width:56px;height:56px;border-radius:50%;background:conic-gradient(from 200deg,#0067c0,#5fb2ff,#9e7bff,#0067c0);display:grid;place-items:center;color:#fff;font-weight:700;font-size:20px}
.me b{display:block;font-size:15px}.me small{color:var(--sub)}
.search{margin:0 8px 12px;height:34px;border-radius:6px;border:1px solid var(--edge);border-bottom:2px solid #8a94a6;background:#ffffffb0;padding:0 10px;font:inherit}
.search:focus{outline:none;border-bottom-color:var(--accent)}
nav a{display:flex;gap:12px;align-items:center;padding:9px 12px;border-radius:6px;color:var(--text);text-decoration:none;position:relative}
nav a:hover{background:#00000008}
nav a[aria-current]{background:#ffffffb8}
nav a[aria-current]:before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:2px;background:var(--accent)}
main{padding:28px 40px 56px;max-width:920px}
h1{font-size:28px;font-weight:600;margin:0 0 20px}
.id{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;background:var(--card);border:1px solid var(--edge);border-radius:8px;padding:18px 20px;margin-bottom:24px}
.id .av{width:72px;height:72px;font-size:26px}
.id h2{margin:0;font-size:20px;font-weight:600}
.id p{margin:2px 0 0;color:var(--sub)}
.id .badge{display:inline-block;margin-top:6px;font-size:12px;background:#dbeafe;color:var(--accent);padding:1px 8px;border-radius:10px}
.btn{height:32px;padding:0 14px;border-radius:5px;border:1px solid var(--edge);background:#fff;font:inherit;cursor:pointer;color:var(--text)}
.btn:hover{background:#f6f8fb}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:var(--accent-d)}
.btn.dng{color:var(--warn)}
.btn:focus-visible,.row:focus-visible,.sw:focus-visible,nav a:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.grp{margin-bottom:22px}
.grp h3{font-size:14px;font-weight:600;margin:0 0 8px}
.row{display:grid;grid-template-columns:32px 1fr auto 20px;gap:14px;align-items:center;width:100%;min-height:64px;padding:10px 16px;background:var(--card);border:1px solid var(--edge);border-radius:6px;margin-bottom:3px;font:inherit;color:inherit;text-align:left;cursor:pointer}
.row:hover{background:#f7f9fb}
.row .ic{font-size:18px;text-align:center}
.row b{display:block;font-weight:400}
.row small{color:var(--sub);font-size:12px}
.row .val{color:var(--sub);font-size:13px}
.row .chev{transition:transform .2s;color:var(--sub)}
.row[aria-expanded="true"]{border-radius:6px 6px 0 0;margin-bottom:0}
.row[aria-expanded="true"] .chev{transform:rotate(180deg)}
.det{display:none;background:#f6f8fb;border:1px solid var(--edge);border-top:0;border-radius:0 0 6px 6px;padding:16px 16px 16px 62px;margin-bottom:3px}
.det.on{display:block}
.det label{display:block;font-size:12px;color:var(--sub);margin-bottom:4px}
.det input[type=text],.det input[type=email]{width:320px;max-width:100%;height:32px;border:1px solid var(--edge);border-bottom:2px solid #8a94a6;border-radius:5px;padding:0 10px;font:inherit;margin-bottom:12px;background:#fff}
.det input:focus{outline:none;border-bottom-color:var(--accent)}
.det .acts{display:flex;gap:8px}
.tg{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--edge)}
.tg:last-child{border:0}
.sw{width:40px;height:20px;border-radius:10px;border:1px solid #6b7280;background:transparent;position:relative;cursor:pointer;padding:0}
.sw:after{content:"";position:absolute;left:3px;top:3px;width:12px;height:12px;border-radius:50%;background:#4b5563;transition:left .15s}
.sw[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.sw[aria-checked="true"]:after{left:23px;background:#fff}
.ok{color:var(--ok);font-size:13px;margin-left:8px}
.devs{display:grid;gap:8px}.devs div{display:flex;justify-content:space-between;align-items:center}
@media (max-width:900px){body{grid-template-columns:1fr}nav{display:none}main{padding:20px}.id{grid-template-columns:auto 1fr}.id .btn{grid-column:1/-1;justify-self:start}}
@media (prefers-reduced-motion:reduce){.row .chev,.sw:after{transition:none}}
</style>
</head>
<body>
<nav aria-label="设置分类"><div class="me"><span class="av">韩</span><div><b>韩若初</b><small>本地账户 · 云栈</small></div></div><input class="search" placeholder="查找设置" aria-label="查找设置">
<a href="#" aria-current="page">👤 账号</a><a href="#">🔒 隐私与安全</a><a href="#">🔔 通知</a><a href="#">🎨 外观</a><a href="#">💳 订阅与账单</a><a href="#">❓ 帮助</a></nav>
<main>
  <h1>账号</h1>
  <section class="id"><span class="av">韩</span><div><h2>韩若初</h2><p>ruochu.han@yunzhan.io · 产品设计部</p><span class="badge">专业版 · 有效期至 2027-03-01</span></div><button class="btn" type="button">更换头像</button></section>
  <section class="grp"><h3>个人资料</h3>
    <button class="row" type="button" aria-expanded="false" data-d="d1"><span class="ic">🪪</span><span><b>姓名与显示名称</b><small>其他人在协作时看到的名字</small></span><span class="val" id="v1">韩若初</span><span class="chev">⌄</span></button>
    <div class="det" id="d1"><label for="nm">显示名称</label><input type="text" id="nm" value="韩若初"><div class="acts"><button class="btn pri" type="button" id="s1">保存</button><button class="btn" type="button" data-close="d1">取消</button><span class="ok" id="o1"></span></div></div>
    <button class="row" type="button" aria-expanded="false" data-d="d2"><span class="ic">✉️</span><span><b>电子邮箱</b><small>用于登录与接收账单</small></span><span class="val">ruochu.han@yunzhan.io</span><span class="chev">⌄</span></button>
    <div class="det" id="d2"><label for="em">新邮箱</label><input type="email" id="em" placeholder="name@company.com"><div class="acts"><button class="btn pri" type="button" id="s2">发送验证邮件</button><span class="ok" id="o2"></span></div></div>
  </section>
  <section class="grp"><h3>安全</h3>
    <button class="row" type="button" aria-expanded="false" data-d="d3"><span class="ic">🔑</span><span><b>密码</b><small>上次修改于 92 天前</small></span><span class="val">建议更新</span><span class="chev">⌄</span></button>
    <div class="det" id="d3"><p style="margin:0 0 10px">为了账户安全，建议每 90 天更新一次密码。修改后其他设备需重新登录。</p><button class="btn pri" type="button">修改密码</button></div>
    <button class="row" type="button" aria-expanded="false" data-d="d4"><span class="ic">📱</span><span><b>两步验证</b><small>登录时额外验证一次身份</small></span><span class="val" id="v4">已关闭</span><span class="chev">⌄</span></button>
    <div class="det" id="d4"><div class="tg"><span>使用身份验证器 App</span><button class="sw" type="button" role="switch" aria-checked="false" id="tfa" aria-label="身份验证器"></button></div><div class="tg"><span>短信验证码（尾号 3302）</span><button class="sw" type="button" role="switch" aria-checked="false" aria-label="短信验证"></button></div></div>
    <button class="row" type="button" aria-expanded="false" data-d="d5"><span class="ic">💻</span><span><b>已登录的设备</b><small>3 台设备</small></span><span class="val">当前：Surface Laptop</span><span class="chev">⌄</span></button>
    <div class="det" id="d5"><div class="devs"><div><span>Surface Laptop 7 · 上海 · 当前设备</span></div><div><span>iPhone 16 · 上海 · 2 小时前</span><button class="btn dng" type="button">退出</button></div><div><span>Chrome · 杭州 · 9 天前</span><button class="btn dng" type="button">退出</button></div></div></div>
  </section>
  <section class="grp"><h3>通知</h3>
    <button class="row" type="button" aria-expanded="false" data-d="d6"><span class="ic">🔔</span><span><b>通知偏好</b><small>选择你希望收到哪些提醒</small></span><span class="val" id="v6">3 项已开启</span><span class="chev">⌄</span></button>
    <div class="det" id="d6"><div class="tg"><span>有人 @ 我</span><button class="sw" type="button" role="switch" aria-checked="true" aria-label="有人@我"></button></div><div class="tg"><span>文件被评论</span><button class="sw" type="button" role="switch" aria-checked="true" aria-label="文件被评论"></button></div><div class="tg"><span>每周项目摘要邮件</span><button class="sw" type="button" role="switch" aria-checked="true" aria-label="每周摘要"></button></div><div class="tg"><span>产品更新与活动</span><button class="sw" type="button" role="switch" aria-checked="false" aria-label="产品更新"></button></div></div>
  </section>
</main>
<script>
const $=s=>document.querySelector(s);
document.querySelectorAll('.row').forEach(r=>r.onclick=()=>{const d=$('#'+r.dataset.d);const on=r.getAttribute('aria-expanded')!=='true';r.setAttribute('aria-expanded',on);d.classList.toggle('on',on)});
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{const id=b.dataset.close;$('#'+id).classList.remove('on');document.querySelector('[data-d='+id+']').setAttribute('aria-expanded','false')});
$('#s1').onclick=()=>{const v=$('#nm').value.trim();if(!v){$('#o1').style.color='#c42b1c';$('#o1').textContent='名称不能为空';return}$('#v1').textContent=v;document.querySelector('.id h2').textContent=v;$('#o1').style.color='';$('#o1').textContent='✓ 已保存'};
$('#s2').onclick=()=>{const v=$('#em').value.trim();$('#o2').style.color=/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)?'':'#c42b1c';$('#o2').textContent=/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)?'✓ 验证邮件已发送至 '+v:'邮箱格式不正确'};
document.querySelectorAll('.sw').forEach(s=>s.onclick=()=>{s.setAttribute('aria-checked',s.getAttribute('aria-checked')!=='true');
 const n=document.querySelectorAll('#d6 .sw[aria-checked="true"]').length;$('#v6').textContent=n+' 项已开启';
 const t=document.querySelectorAll('#d4 .sw[aria-checked="true"]').length;$('#v4').textContent=t?'已开启 '+t+' 种':'已关闭'});
</script>
</body>
</html>
