<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>转盘唱片行 · 首页</title>
<style>
:root{--mustard:#e8a628;--rust:#b4471c;--brown:#3d2414;--cream:#f4e6c8;--olive:#6f7a2e;--teal:#2c6e6a;--paper:#fbf2dc;--muted:#8a6a50}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--brown);font:15px/1.55 "Avenir Next","PingFang SC","Microsoft YaHei",sans-serif}
.ticker{background:var(--brown);color:var(--cream);font-size:13px;padding:7px 0;overflow:hidden;white-space:nowrap}
.ticker span{display:inline-block;padding-left:24px;animation:tk 26s linear infinite}
@keyframes tk{0%,8%{transform:translateX(0)}100%{transform:translateX(-100%)}}
header{display:flex;align-items:center;justify-content:space-between;padding:20px 48px;border-bottom:3px solid var(--brown)}
.logo{display:flex;align-items:center;gap:12px;font:900 30px/1 "Cooper Black","Songti SC","STSong",serif;letter-spacing:-.01em}
.logo svg{width:44px;height:44px}
nav{display:flex;gap:6px}
nav a{padding:8px 14px;border-radius:999px;color:var(--brown);text-decoration:none;font-weight:600;font-size:14px}
nav a:hover{background:var(--cream)}
nav a[aria-current]{background:var(--brown);color:var(--cream)}
.cartbtn{display:flex;gap:8px;align-items:center;height:42px;padding:0 16px;border-radius:999px;border:2px solid var(--brown);background:var(--mustard);font:inherit;font-weight:800;cursor:pointer;color:var(--brown)}
.cartbtn b{background:var(--brown);color:var(--cream);border-radius:999px;min-width:22px;height:22px;display:grid;place-items:center;font-size:12px}
.hero{margin:28px 48px 8px;border-radius:28px;background:var(--rust);color:var(--cream);display:grid;grid-template-columns:1.2fr 1fr;overflow:hidden;position:relative}
.hero .tx{padding:36px 40px}
.hero small{letter-spacing:.2em;font-weight:700;color:var(--mustard)}
.hero h1{font:900 46px/1.05 "Cooper Black","Songti SC","STSong",serif;margin:10px 0 12px}
.hero p{margin:0;max-width:420px;color:#f7dcc0}
.waves{position:relative}
.waves i{position:absolute;left:0;right:0;height:34px;border-radius:17px}
.sec{display:flex;justify-content:space-between;align-items:flex-end;margin:28px 48px 14px}
.sec h2{margin:0;font:900 26px/1 "Cooper Black","Songti SC","STSong",serif}
.sort{display:flex;gap:6px}
.sort button{border:2px solid var(--brown);background:transparent;border-radius:999px;padding:4px 12px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;color:var(--brown)}
.sort button[aria-pressed="true"]{background:var(--brown);color:var(--cream)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;padding:0 48px 56px}
.item{background:var(--cream);border-radius:20px;padding:14px;border:2px solid transparent;transition:border-color .15s,transform .15s}
.item:hover{border-color:var(--brown);transform:rotate(-.6deg)}
.cover{aspect-ratio:1;border-radius:12px;position:relative;overflow:hidden;margin-bottom:12px}
.cover svg{position:absolute;right:-24%;top:8%;width:84%;height:84%;transition:transform .5s}
.item:hover .cover svg{transform:rotate(40deg)}
.cover em{position:absolute;left:12px;top:12px;font-style:normal;font:900 18px/1.1 "Cooper Black","Songti SC",serif;color:#fff;max-width:60%;text-shadow:0 1px 0 #0003}
.cover .badge{position:absolute;left:10px;bottom:10px;background:var(--brown);color:var(--mustard);font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px}
.item h3{margin:0;font-size:15px}
.item .by{font-size:13px;color:var(--muted)}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.price{font:900 20px/1 "Avenir Next","PingFang SC",sans-serif}
.price s{font-size:12px;color:var(--muted);font-weight:400;margin-left:4px}
.acts{display:flex;gap:6px}
.fav,.add{height:36px;border-radius:999px;border:2px solid var(--brown);font:inherit;font-weight:800;cursor:pointer;color:var(--brown)}
.fav{width:36px;background:transparent}
.fav[aria-pressed="true"]{background:var(--rust);border-color:var(--rust);color:#fff}
.add{padding:0 14px;background:var(--mustard)}
.add:hover{background:#f2b843}
.add.done{background:var(--olive);border-color:var(--olive);color:#fff}
.fav:focus-visible,.add:focus-visible,.cartbtn:focus-visible,nav a:focus-visible,.sort button:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
@media (max-width:1000px){.grid{grid-template-columns:repeat(2,1fr);padding:0 24px 40px}header{padding:16px 24px}nav{display:none}.hero{margin:20px 24px;grid-template-columns:1fr}.waves{display:none}.sec{margin:24px}}
@media (prefers-reduced-motion:reduce){.ticker span{animation:none;padding-left:24px}.item,.cover svg{transition:none}.item:hover{transform:none}.item:hover .cover svg{transform:none}}
</style>
</head>
<body>
<div class="ticker"><span>📀 满 ¥299 包邮 · 每周五晚 8 点新品上架 · 二手唱片均经过清洗与试听 · 支持到店自提（上海市徐汇区永康路 37 号）📀</span></div>
<header><div class="logo"><svg viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="21" fill="#3d2414"/><circle cx="22" cy="22" r="14" fill="none" stroke="#6b4a32" stroke-width="1"/><circle cx="22" cy="22" r="9" fill="#e8a628"/><circle cx="22" cy="22" r="2" fill="#3d2414"/></svg>转盘唱片行</div>
<nav aria-label="栏目"><a href="#" aria-current="page">新品</a><a href="#">华语</a><a href="#">爵士</a><a href="#">城市流行</a><a href="#">二手淘碟</a><a href="#">唱机配件</a></nav>
<button class="cartbtn" type="button" id="cart">唱片袋 <b id="cc">0</b></button></header>
<section class="hero"><div class="tx"><small>本周主打 · 限量 300 张</small><h1>城市夜色，<br>在 33⅓ 转里。</h1><p>日本城市流行再版合集首发，180 克重量盘，附中文歌词册。会员预订立减 ¥40。</p></div>
<div class="waves" aria-hidden="true"><i style="top:30px;background:#e8a628"></i><i style="top:76px;background:#f4e6c8"></i><i style="top:122px;background:#6f7a2e"></i><i style="top:168px;background:#2c6e6a"></i></div></section>
<div class="sec"><h2>新上架</h2><div class="sort" role="group" aria-label="排序"><button type="button" aria-pressed="true" data-s="new">最新</button><button type="button" aria-pressed="false" data-s="low">价格从低</button><button type="button" aria-pressed="false" data-s="hot">热卖</button></div></div>
<main class="grid" id="grid"></main>
<script>
const R=[['午夜便利店','林野乐队','#2c6e6a',268,null,'新品',3,90],['海风与汽水','南方小姐','#e8a628',198,238,'特价',1,140],['蓝调星期一','沈夜爵士四重奏','#3d5a80',328,null,'',5,60],['旧电台','杜鹃合唱团','#b4471c',158,null,'二手 · 9 成新',7,200],['薄荷色夏天','苏打绿洲','#6f7a2e',228,null,'',2,75],['霓虹港湾','City Pop 再版合集','#8e3b6b',388,428,'限量',0,320],['山间小路','木吉他工作室','#8a6a50',178,null,'',6,40],['雨夜慢车','陈与夏','#22333b',248,null,'签名版',4,110]];
let cart=0,sort='new';const grid=document.getElementById('grid');
function rec(c){return '<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="49" fill="#1a120b"/><circle cx="50" cy="50" r="40" fill="none" stroke="#3a2a1d" stroke-width=".8"/><circle cx="50" cy="50" r="32" fill="none" stroke="#3a2a1d" stroke-width=".8"/><circle cx="50" cy="50" r="17" fill="'+c+'"/><circle cx="50" cy="50" r="2.5" fill="#1a120b"/></svg>'}
function render(){let L=R.map((r,i)=>[r,i]);if(sort==='low')L.sort((a,b)=>a[0][3]-b[0][3]);if(sort==='hot')L.sort((a,b)=>b[0][7]-a[0][7]);if(sort==='new')L.sort((a,b)=>a[0][6]-b[0][6]);
 grid.innerHTML=L.map(([r,i])=>'<article class="item"><div class="cover" style="background:'+r[2]+'">'+rec(r[2]==='#e8a628'?'#b4471c':'#e8a628')+'<em>'+r[0]+'</em>'+(r[5]?'<span class="badge">'+r[5]+'</span>':'')+'</div><h3>'+r[0]+'</h3><div class="by">'+r[1]+' · 黑胶 LP</div><div class="row"><span class="price">¥'+r[3]+(r[4]?'<s>¥'+r[4]+'</s>':'')+'</span><span class="acts"><button class="fav" type="button" aria-pressed="false" aria-label="收藏 '+r[0]+'">♡</button><button class="add" type="button" data-i="'+i+'">加入</button></span></div></article>').join('');
 grid.querySelectorAll('.fav').forEach(b=>b.onclick=()=>{const on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on);b.textContent=on?'♥':'♡'});
 grid.querySelectorAll('.add').forEach(b=>b.onclick=()=>{if(b.classList.contains('done'))return;cart++;document.getElementById('cc').textContent=cart;b.classList.add('done');b.textContent='已加入 ✓'})}
document.querySelectorAll('.sort button').forEach(b=>b.onclick=()=>{sort=b.dataset.s;document.querySelectorAll('.sort button').forEach(x=>x.setAttribute('aria-pressed',x===b));render()});
render();
</script>
</body>
</html>
