<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>购物车 · 小菜园鲜到家</title>
<style>
:root{--leaf:#1f8a4c;--leaf-d:#156b39;--lime:#d8f26a;--bg:#f2f7ee;--white:#ffffff;--ink:#17301f;--sub:#617565;--line:#dfe9d9;--tomato:#e5533d;--sun:#ffd23f}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:15px/1.55 "PingFang SC","Microsoft YaHei",system-ui,sans-serif}
header{background:var(--leaf);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 48px;height:68px}
.logo{font-weight:900;font-size:21px;display:flex;align-items:center;gap:8px}
.logo i{width:30px;height:30px;border-radius:50% 50% 50% 4px;background:var(--lime);display:inline-block}
.addr{font-size:13px;background:#ffffff22;padding:6px 12px;border-radius:999px}
.wrap{max-width:1160px;margin:0 auto;padding:28px 48px 56px;display:grid;grid-template-columns:1fr 360px;gap:28px;align-items:start}
h1{margin:0 0 16px;font-size:26px;display:flex;align-items:baseline;gap:10px}
h1 small{font-size:14px;color:var(--sub);font-weight:400}
.ship{background:var(--white);border-radius:18px;padding:14px 18px;margin-bottom:16px;display:flex;align-items:center;gap:14px}
.ship .bar{flex:1;height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.ship .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--leaf),#5cc06f);border-radius:5px;transition:width .3s}
.ship span{font-size:14px;white-space:nowrap}
.ship b{color:var(--tomato)}
.list{background:var(--white);border-radius:22px;padding:6px 22px}
.it{display:grid;grid-template-columns:24px 88px 1fr 140px 96px 36px;gap:16px;align-items:center;padding:18px 0;border-bottom:1px dashed var(--line)}
.it:last-child{border-bottom:0}
.it input[type=checkbox]{width:20px;height:20px;accent-color:var(--leaf)}
.pic{width:88px;height:88px;border-radius:20px;display:grid;place-items:center;font-size:44px}
.nm b{display:block;font-size:16px}
.nm small{color:var(--sub);display:block}
.nm .tag{display:inline-block;margin-top:4px;font-size:12px;background:var(--lime);color:var(--ink);padding:0 8px;border-radius:6px;font-weight:700}
.step{display:flex;align-items:center;background:var(--bg);border-radius:999px;height:40px;width:132px;justify-content:space-between;padding:0 4px}
.step button{width:32px;height:32px;border-radius:50%;border:0;background:var(--white);font-size:18px;font-weight:700;cursor:pointer;color:var(--leaf);box-shadow:0 1px 2px #17301f22}
.step button:hover{background:var(--leaf);color:#fff}
.step button:disabled{color:#b8c7bb;background:var(--white);cursor:not-allowed;box-shadow:none}
.step span{font-weight:700;font-variant-numeric:tabular-nums;min-width:28px;text-align:center}
.sum{text-align:right;font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
.sum small{display:block;font-weight:400;font-size:12px;color:var(--sub)}
.del{width:36px;height:36px;border-radius:50%;border:0;background:transparent;cursor:pointer;font-size:16px;color:var(--sub)}
.del:hover{background:#fdecea;color:var(--tomato)}
.undo{display:none;background:var(--ink);color:#fff;border-radius:14px;padding:12px 16px;margin-top:12px;justify-content:space-between;align-items:center}
.undo.on{display:flex}
.undo button{background:var(--lime);border:0;border-radius:999px;padding:4px 12px;font:inherit;font-weight:700;cursor:pointer}
aside{background:var(--white);border-radius:22px;padding:22px;position:sticky;top:20px}
aside h2{margin:0 0 14px;font-size:18px}
aside dl{display:grid;grid-template-columns:1fr auto;gap:10px;margin:0 0 16px;font-size:14px}
aside dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.minus{color:var(--tomato)}
.total{display:flex;justify-content:space-between;align-items:baseline;border-top:2px dashed var(--line);padding-top:14px;margin-bottom:16px}
.total b{font-size:32px;color:var(--leaf);font-variant-numeric:tabular-nums}
.go{width:100%;height:56px;border:0;border-radius:999px;background:var(--leaf);color:#fff;font:inherit;font-size:17px;font-weight:800;cursor:pointer;transition:background .15s}
.go:hover{background:var(--leaf-d)}
.go:disabled{background:#b8c7bb;cursor:not-allowed}
.go:focus-visible,.step button:focus-visible,.del:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.tip{font-size:12px;color:var(--sub);margin:10px 0 0;text-align:center}
.empty{padding:40px;text-align:center;color:var(--sub)}
@media (max-width:1000px){.wrap{grid-template-columns:1fr;padding:20px}.it{grid-template-columns:24px 64px 1fr 36px;row-gap:10px}.pic{width:64px;height:64px;font-size:32px}.step{grid-column:3}.sum{grid-column:3;text-align:left}header{padding:0 20px}}
@media (prefers-reduced-motion:reduce){.ship .bar i,.go{transition:none}}
</style>
</head>
<body>
<header><div class="logo"><i aria-hidden="true"></i>小菜园鲜到家</div><span class="addr">📍 送至：杭州市西湖区文三路 478 号 · 预计 30 分钟达</span></header>
<div class="wrap">
  <section>
    <h1>我的菜篮子 <small id="cnt"></small></h1>
    <div class="ship"><span>🚚</span><div class="bar"><i id="pb"></i></div><span id="st"></span></div>
    <div class="list" id="list"></div>
    <div class="undo" id="undo" role="status"><span id="ut"></span><button type="button" id="ub">撤销</button></div>
  </section>
  <aside aria-label="结算">
    <h2>结算明细</h2>
    <dl><dt>商品金额</dt><dd id="a1"></dd><dt>会员优惠</dt><dd class="minus" id="a2"></dd><dt>配送费</dt><dd id="a3"></dd></dl>
    <div class="total"><span>合计</span><b id="tot"></b></div>
    <button class="go" type="button" id="go">去结算</button>
    <p class="tip" id="tip">已选商品满 ¥59 免配送费</p>
  </aside>
</div>
<script>
let C=[{n:'云南高山小番茄',s:'500g / 盒 · 今早采摘',p:12.9,q:2,e:'🍅',bg:'#fde4df',t:'会员 9 折'},{n:'有机菠菜',s:'300g / 把',p:6.8,q:1,e:'🥬',bg:'#e2f4dc'},{n:'散养土鸡蛋',s:'10 枚 / 盒',p:18.5,q:1,e:'🥚',bg:'#fff4d6',t:'会员 9 折'},{n:'新西兰金奇异果',s:'6 个 / 盒',p:29.9,q:1,e:'🥝',bg:'#eef7d2'}];
C.forEach(c=>c.on=true);let removed=null;const $=s=>document.querySelector(s);const m=v=>'¥'+v.toFixed(2);
function render(){const L=$('#list');L.innerHTML='';if(!C.length)L.innerHTML='<div class="empty">菜篮子空了，去首页挑点新鲜的吧 🥕</div>';
 C.forEach((c,i)=>{const r=document.createElement('div');r.className='it';
  r.innerHTML='<input type="checkbox" '+(c.on?'checked':'')+' aria-label="选择 '+c.n+'"><div class="pic" style="background:'+c.bg+'">'+c.e+'</div><div class="nm"><b>'+c.n+'</b><small>'+c.s+' · '+m(c.p)+'</small>'+(c.t?'<span class="tag">'+c.t+'</span>':'')+'</div><div class="step"><button type="button" aria-label="减少" '+(c.q<=1?'disabled':'')+'>−</button><span>'+c.q+'</span><button type="button" aria-label="增加" '+(c.q>=20?'disabled':'')+'>＋</button></div><div class="sum">'+m(c.p*c.q)+'<small>'+c.q+' × '+m(c.p)+'</small></div><button class="del" type="button" aria-label="删除 '+c.n+'">🗑</button>';
  const [cb]=r.querySelectorAll('input');const [mi,pl]=r.querySelectorAll('.step button');
  cb.onchange=()=>{c.on=cb.checked;render()};mi.onclick=()=>{c.q--;render()};pl.onclick=()=>{c.q++;render()};
  r.querySelector('.del').onclick=()=>{removed=[c,i];C.splice(i,1);$('#ut').textContent='已移除「'+c.n+'」';$('#undo').classList.add('on');render()};L.append(r)});
 const sel=C.filter(c=>c.on),sub=sel.reduce((a,c)=>a+c.p*c.q,0),disc=sel.filter(c=>c.t).reduce((a,c)=>a+c.p*c.q*.1,0),after=sub-disc,fee=after>=59||!sel.length?0:6;
 $('#a1').textContent=m(sub);$('#a2').textContent='−'+m(disc);$('#a3').textContent=fee?m(fee):'免配送费';$('#tot').textContent=m(after+fee);
 $('#cnt').textContent='共 '+C.length+' 种，已选 '+sel.reduce((a,c)=>a+c.q,0)+' 件';$('#pb').style.width=Math.min(100,after/59*100)+'%';
 $('#st').innerHTML=after>=59?'已免配送费 🎉':'再买 <b>'+m(59-after)+'</b> 免配送费';$('#go').disabled=!sel.length;$('#go').textContent=sel.length?'去结算（'+sel.reduce((a,c)=>a+c.q,0)+' 件）':'请先选择商品'}
$('#ub').onclick=()=>{if(removed){C.splice(removed[1],0,removed[0]);removed=null;$('#undo').classList.remove('on');render()}};
$('#go').onclick=()=>{$('#tip').textContent='正在为你锁定库存，即将进入支付…'};
render();
</script>
</body>
</html>
