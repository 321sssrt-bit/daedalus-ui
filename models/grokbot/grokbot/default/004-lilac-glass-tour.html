<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>新手引导 · 云笺</title>
<style>
:root{--bg1:#e9e4ff;--bg2:#fde7f3;--violet:#6b4eff;--violet-d:#5338e0;--ink:#24203a;--sub:#6f6a8a;--glass:#ffffffb8;--edge:#ffffffe6;--pink:#ff8fc7;--sky:#8fd3ff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font:15px/1.65 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:radial-gradient(circle at 15% 20%,var(--bg2),transparent 45%),radial-gradient(circle at 85% 80%,#d9f0ff,transparent 45%),var(--bg1);overflow:hidden}
.app{position:fixed;inset:0;display:grid;grid-template-columns:240px 1fr;filter:blur(3px) saturate(.8);opacity:.6;pointer-events:none}
.app aside{background:#ffffff80;padding:24px}
.app aside i{display:block;height:12px;border-radius:6px;background:#d6d0f3;margin:14px 0}
.app main{padding:40px}
.app main i{display:block;height:16px;border-radius:8px;background:#e0dbf7;margin:16px 0;width:70%}
.scrim{position:fixed;inset:0;display:grid;place-items:center;padding:24px}
.dlg{width:760px;max-width:100%;border-radius:32px;background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:0 40px 80px -30px #6b4eff55;display:grid;grid-template-columns:320px 1fr;overflow:hidden}
.art{background:linear-gradient(160deg,#f3efff,#ffe9f5);display:grid;place-items:center;padding:28px;position:relative}
.art svg{width:240px;height:240px}
.scene{display:none}.scene.on{display:block;animation:pop .45s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:scale(.9) translateY(8px)}}
.body{padding:36px 40px 30px;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.step{font-size:12px;font-weight:600;color:var(--violet);background:#6b4eff14;padding:4px 10px;border-radius:999px}
.skip{border:0;background:none;color:var(--sub);font:inherit;font-size:14px;cursor:pointer;padding:6px 8px;border-radius:8px}
.skip:hover{background:#6b4eff10;color:var(--ink)}
h2{font-size:26px;margin:0 0 10px;line-height:1.3}
.desc{color:var(--sub);margin:0 0 18px;min-height:76px}
.tips{list-style:none;padding:0;margin:0 0 auto;display:grid;gap:8px}
.tips li{display:flex;gap:10px;align-items:center;font-size:14px;background:#ffffffa0;border-radius:12px;padding:8px 12px}
.tips kbd{font:600 12px ui-monospace,Menlo,monospace;background:#fff;border:1px solid #ddd6ff;border-bottom-width:2px;border-radius:6px;padding:1px 6px}
.nav{display:flex;align-items:center;gap:12px;margin-top:26px}
.dots{display:flex;gap:6px;margin-right:auto}
.dots button{width:8px;height:8px;border-radius:999px;border:0;background:#cfc7f5;padding:0;cursor:pointer;transition:width .25s,background .25s}
.dots button[aria-current="step"]{width:24px;background:var(--violet)}
.b{height:44px;padding:0 20px;border-radius:14px;font:inherit;font-weight:600;cursor:pointer;transition:background .15s}
.prev{border:1px solid #d6cffa;background:#fff;color:var(--ink)}
.prev:hover{background:#f6f3ff}
.prev:disabled{opacity:.4;cursor:not-allowed}
.next{border:0;background:var(--violet);color:#fff;min-width:120px}
.next:hover{background:var(--violet-d)}
.b:focus-visible,.dots button:focus-visible,.skip:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.final{position:fixed;inset:0;display:none;place-items:center;text-align:center}
.final.on{display:grid}
.final .card{background:#fff;border-radius:28px;padding:36px 48px;box-shadow:0 30px 60px -20px #6b4eff44}
.final h3{margin:0 0 6px;font-size:22px}.final p{margin:0 0 18px;color:var(--sub)}
@media (max-width:820px){.dlg{grid-template-columns:1fr}.art{padding:18px}.art svg{width:150px;height:150px}.body{padding:26px}}
@media (prefers-reduced-motion:reduce){.scene.on{animation:none}*{transition:none!important}}
</style>
</head>
<body>
<div class="app" aria-hidden="true"><aside><i></i><i></i><i></i><i></i></aside><main><i></i><i style="width:50%"></i><i></i><i style="width:40%"></i></main></div>
<div class="scrim" id="scrim">
  <section class="dlg" role="dialog" aria-modal="true" aria-labelledby="t">
    <div class="art" aria-hidden="true">
      <svg class="scene on" viewBox="0 0 240 240"><rect x="40" y="40" width="160" height="170" rx="18" fill="#fff"/><rect x="60" y="66" width="100" height="10" rx="5" fill="#6b4eff"/><rect x="60" y="90" width="120" height="8" rx="4" fill="#e3ddff"/><rect x="60" y="108" width="90" height="8" rx="4" fill="#e3ddff"/><circle cx="180" cy="52" r="22" fill="#ff8fc7"/><path d="M171 52l6 6 11-12" stroke="#fff" stroke-width="4" fill="none"/></svg>
      <svg class="scene" viewBox="0 0 240 240"><rect x="30" y="50" width="80" height="60" rx="14" fill="#fff"/><rect x="130" y="50" width="80" height="60" rx="14" fill="#8fd3ff"/><rect x="30" y="130" width="80" height="60" rx="14" fill="#ff8fc7"/><rect x="130" y="130" width="80" height="60" rx="14" fill="#fff"/><path d="M110 80h20M70 110v20M170 110v20" stroke="#6b4eff" stroke-width="4"/></svg>
      <svg class="scene" viewBox="0 0 240 240"><circle cx="120" cy="120" r="80" fill="#fff"/><circle cx="90" cy="105" r="22" fill="#8fd3ff"/><circle cx="150" cy="105" r="22" fill="#ff8fc7"/><circle cx="120" cy="155" r="22" fill="#6b4eff"/></svg>
      <svg class="scene" viewBox="0 0 240 240"><rect x="50" y="60" width="140" height="120" rx="20" fill="#fff"/><path d="M80 120l25 25 55-55" stroke="#6b4eff" stroke-width="10" fill="none" stroke-linecap="round"/></svg>
    </div>
    <div class="body">
      <div class="top"><span class="step" id="lbl">第 1 步 / 共 4 步</span><button class="skip" id="skip" type="button">跳过引导</button></div>
      <h2 id="t">云笺是一本会自己整理的笔记本</h2>
      <p class="desc" id="d">随手记下想法，云笺会按主题自动归类，并在你需要时把相关笔记推到眼前。</p>
      <ul class="tips" id="tips"></ul>
      <div class="nav">
        <div class="dots" id="dots"></div>
        <button class="b prev" id="prev" type="button" disabled>上一步</button>
        <button class="b next" id="next" type="button">下一步</button>
      </div>
    </div>
  </section>
</div>
<div class="final" id="final" role="status"><div class="card"><h3>🎉 准备好了</h3><p id="fm">已为你创建第一页笔记「我的第一张云笺」。</p><button class="b next" id="again" type="button">重新看一遍引导</button></div></div>
<script>
const steps=[
 {t:'云笺是一本会自己整理的笔记本',d:'随手记下想法，云笺会按主题自动归类，并在你需要时把相关笔记推到眼前。',tips:[['⌘ N','新建一张笔记'],['⌘ K','搜索全部笔记']]},
 {t:'用卡片把想法连起来',d:'在任意一段文字后输入「[[」，即可链接到另一张卡片。卡片之间的关系会自动画成知识地图。',tips:[['[[','插入双向链接'],['⌥ 拖动','把卡片拖进白板']]},
 {t:'和同伴共享一个空间',d:'邀请同事进入共享空间，多人同时编辑，光标与评论实时可见，再也不用来回传文件。',tips:[['@','提及同伴'],['⌘ ⇧ C','添加评论']]},
 {t:'都准备好了，开始写第一张吧',d:'我们为你准备了一页示例笔记。你随时可以在「帮助 → 新手引导」里重新打开这份说明。',tips:[['⌘ /','查看全部快捷键']]}
];
let i=0;const $=s=>document.querySelector(s);
const dots=$('#dots');steps.forEach((_,n)=>{const b=document.createElement('button');b.type='button';b.setAttribute('aria-label','跳到第 '+(n+1)+' 步');b.onclick=()=>go(n);dots.append(b)});
function go(n){i=n;const s=steps[i];$('#t').textContent=s.t;$('#d').textContent=s.d;$('#lbl').textContent='第 '+(i+1)+' 步 / 共 4 步';
 $('#tips').innerHTML=s.tips.map(([k,v])=>'<li><kbd>'+k+'</kbd>'+v+'</li>').join('');
 document.querySelectorAll('.scene').forEach((e,n)=>e.classList.toggle('on',n===i));
 [...dots.children].forEach((d,n)=>n===i?d.setAttribute('aria-current','step'):d.removeAttribute('aria-current'));
 $('#prev').disabled=i===0;$('#next').textContent=i===3?'开始使用云笺':'下一步';$('#skip').hidden=i===3}
$('#next').onclick=()=>{if(i<3)go(i+1);else finish('已为你创建第一页笔记「我的第一张云笺」。')};
$('#prev').onclick=()=>i>0&&go(i-1);
$('#skip').onclick=()=>finish('已跳过引导。可以在「帮助 → 新手引导」随时重新打开。');
function finish(m){$('#scrim').style.display='none';$('#fm').textContent=m;$('#final').classList.add('on')}
$('#again').onclick=()=>{$('#final').classList.remove('on');$('#scrim').style.display='';go(0)};
document.addEventListener('keydown',e=>{if($('#scrim').style.display==='none')return;if(e.key==='ArrowRight')$('#next').click();if(e.key==='ArrowLeft')$('#prev').click()});
go(0);
</script>
</body>
</html>
