<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>木与光 · 家居小铺</title>
<style>
:root{--oak:#f4efe6;--card:#fffdf9;--ink:#2a2723;--sub:#7a736a;--line:#e4dccf;--sage:#5e7a63;--sage-d:#48614d;--sage-l:#e6eee6;--clay:#c2643c;--clay-l:#fbece4;--sun:#e8b04a}
*{box-sizing:border-box}
body{margin:0;background:var(--oak);color:var(--ink);font:14px/1.55 "Avenir Next","PingFang SC","Microsoft YaHei",system-ui,sans-serif}
header{display:flex;align-items:center;gap:28px;padding:16px 36px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:4}
.logo{font:700 20px/1 Georgia,"Songti SC",serif;letter-spacing:.08em}
.logo span{color:var(--sage)}
header nav{display:flex;gap:18px;color:var(--sub)}
header nav b{color:var(--ink)}
.cartbtn{margin-left:auto;height:38px;padding:0 14px;border:1.5px solid var(--ink);border-radius:19px;background:none;font:inherit;font-weight:600;cursor:pointer}
.wrap{display:grid;grid-template-columns:1fr 360px;gap:28px;padding:24px 36px 48px;max-width:1360px;margin:0 auto}
.hero{display:flex;justify-content:space-between;align-items:end;margin-bottom:16px}
.hero h1{margin:0;font:400 30px/1.2 Georgia,"Songti SC",serif}
.hero p{margin:4px 0 0;color:var(--sub)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.p{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;text-align:left;padding:0;font:inherit;color:inherit;transition:transform .2s,box-shadow .2s}
.p:hover{transform:translateY(-3px);box-shadow:0 14px 26px -16px #2a272366}
.p .im{height:170px;display:grid;place-items:center;background:var(--sage-l)}
.p .b{padding:12px 14px 14px}
.p h3{margin:0;font-size:15px}
.p .pr{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.p .pr b{font:600 16px Georgia,serif}
.p .pr small{color:var(--sub)}
.dots{display:flex;gap:4px}.dots i{width:12px;height:12px;border-radius:50%;border:1px solid #0002}
aside{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;align-self:start;position:sticky;top:86px}
aside h2{margin:0 0 10px;font-size:17px;display:flex;justify-content:space-between}
aside h2 small{font-weight:400;color:var(--sub);font-size:13px}
.line{display:grid;grid-template-columns:48px 1fr auto;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
.line .th{width:48px;height:48px;border-radius:10px;background:var(--sage-l);display:grid;place-items:center}
.line b{display:block;font-size:14px}
.line select{margin-top:4px;height:28px;border:1px solid var(--line);border-radius:6px;background:#fff;font:inherit;font-size:12px}
.line .q{display:flex;align-items:center;gap:4px;margin-top:6px}
.line .q button{width:26px;height:26px;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;font:inherit}
.line .q span{min-width:22px;text-align:center;font-weight:600}
.line .amt{font:600 14px Georgia,serif;text-align:right}
.line .rm{display:block;border:0;background:none;color:var(--sub);font-size:12px;cursor:pointer;margin-top:4px;padding:0}
.line.bad{background:var(--clay-l);margin:0 -10px;padding:10px;border-radius:10px;border-top-color:transparent}
.line .warn{grid-column:2/-1;color:var(--clay);font-size:12px;font-weight:600}
.empty{color:var(--sub);text-align:center;padding:28px 0;border-top:1px solid var(--line)}
.sum{border-top:1px dashed var(--line);margin-top:6px;padding-top:10px;display:grid;gap:4px}
.sum div{display:flex;justify-content:space-between;color:var(--sub)}
.sum .tot{color:var(--ink);font-size:16px;font-weight:700}
.sum .tot b{font:700 22px Georgia,serif}
.btn{height:46px;border-radius:23px;border:0;background:var(--sage);color:#fff;font:inherit;font-size:15px;font-weight:700;cursor:pointer;width:100%;margin-top:12px}
.btn:hover{background:var(--sage-d)}
.btn:disabled{background:#c8c2b8;cursor:not-allowed}
.ghost{height:36px;border-radius:18px;border:1.5px dashed var(--clay);background:none;color:var(--clay);font:inherit;font-size:12px;font-weight:600;cursor:pointer;width:100%;margin-top:10px}
.ghost:hover{background:var(--clay-l)}
.alert{display:none;margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--clay-l);color:var(--clay);font-size:13px;border-left:4px solid var(--clay)}
.alert.on{display:block}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.mask{position:fixed;inset:0;background:#2a272366;display:none;place-items:center;z-index:9;padding:20px}
.mask.on{display:grid}
.dlg{background:var(--card);border-radius:18px;width:760px;max-width:100%;display:grid;grid-template-columns:320px 1fr;overflow:hidden;box-shadow:0 30px 60px -30px #000a}
.dlg .im{background:var(--sage-l);display:grid;place-items:center;min-height:360px}
.dlg .bd{padding:24px}
.dlg h3{margin:0;font:400 24px Georgia,"Songti SC",serif}
.dlg .price{font:600 22px Georgia,serif;margin:6px 0 12px}
.dlg p{color:var(--sub);margin:0 0 14px}
.lab{font-size:12px;color:var(--sub);margin:12px 0 6px;font-weight:600;letter-spacing:.05em}
.vs{display:flex;flex-wrap:wrap;gap:8px}
.v{height:36px;padding:0 12px;border:1.5px solid var(--line);border-radius:18px;background:#fff;font:inherit;cursor:pointer;display:flex;align-items:center;gap:6px}
.v i{width:14px;height:14px;border-radius:50%;border:1px solid #0002}
.v small{color:var(--sub);font-size:11px}
.v[aria-pressed="true"]{border-color:var(--sage);background:var(--sage-l);font-weight:600}
.v:disabled{opacity:.45;cursor:not-allowed;text-decoration:line-through}
.stp{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:18px;overflow:hidden}
.stp button{width:36px;height:34px;border:0;background:#fff;cursor:pointer;font-size:16px}
.stp output{min-width:36px;text-align:center;font-weight:700}
.stock{margin-left:10px;font-size:12px;color:var(--sub)}
.row{display:flex;gap:10px;margin-top:18px}
.row .btn{margin:0}
.x{height:46px;padding:0 18px;border-radius:23px;border:1.5px solid var(--line);background:#fff;font:inherit;cursor:pointer}
.rc{background:var(--card);border-radius:18px;width:520px;max-width:100%;padding:28px;text-align:center}
.rc .ok{width:64px;height:64px;border-radius:50%;background:var(--sage);color:#fff;display:grid;place-items:center;margin:0 auto 10px;font-size:30px}
.rc h3{margin:0;font:400 26px Georgia,"Songti SC",serif}
.rc .no{font:700 18px "SF Mono",Menlo,monospace;color:var(--sage);margin:6px 0 14px}
.rc table{width:100%;border-collapse:collapse;text-align:left;font-size:13px;margin-bottom:6px}
.rc td{padding:6px 0;border-bottom:1px solid var(--line)}
.rc td:last-child{text-align:right}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,80px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:22px;transition:transform .25s;z-index:10}
.toast.on{transform:translate(-50%,0)}
@media (max-width:1000px){.wrap{grid-template-columns:1fr;padding:16px}.grid{grid-template-columns:repeat(2,1fr)}aside{position:static}.dlg{grid-template-columns:1fr}.dlg .im{min-height:200px}header nav{display:none}}
@media (prefers-reduced-motion:reduce){.p,.toast{transition:none}.p:hover{transform:none}}
</style>
</head>
<body>
<header><span class="logo">木与<span>光</span></span><nav><b>全部</b><span>座椅</span><span>灯具</span><span>收纳</span></nav><button class="cartbtn" type="button" id="cb">购物车 · <span id="cc">0</span></button></header>
<div class="wrap">
  <main><div class="hero"><div><h1>秋天，给家添一点暖光</h1><p>满 ¥999 免运费 · 7 天无理由退换</p></div></div><div class="grid" id="grid"></div></main>
  <aside aria-label="购物车"><h2>购物车 <small id="cn">0 件</small></h2><div id="lines"></div>
    <div class="sum"><div><span>商品小计</span><span id="sub">¥0</span></div><div><span>运费</span><span id="ship">¥0</span></div><div class="tot"><span>合计</span><b id="tot">¥0</b></div></div>
    <div class="alert" id="alert" role="alert"></div>
    <button class="btn" type="button" id="sb" disabled>提交订单</button>
    <button class="ghost" type="button" id="oos" disabled>⚠ 模拟库存被抢购（触发缺货）</button>
  </aside>
</div>
<div class="mask" id="pm"><div class="dlg" role="dialog" aria-labelledby="pt"><div class="im" id="pimg"></div><div class="bd"><h3 id="pt"></h3><div class="price" id="pp"></div><p id="pd"></p>
  <div class="lab">颜色 / 规格</div><div class="vs" id="pv"></div>
  <div class="lab">数量</div><div><span class="stp"><button type="button" id="qm" aria-label="减少">−</button><output id="qv">1</output><button type="button" id="qp" aria-label="增加">＋</button></span><span class="stock" id="ps"></span></div>
  <div class="row"><button class="x" type="button" id="pc">再看看</button><button class="btn" type="button" id="pa">加入购物车</button></div></div></div></div>
<div class="mask" id="rm"><div class="rc" role="dialog" aria-labelledby="rt"><div class="ok">✓</div><h3 id="rt">订单已提交</h3><div class="no" id="rno"></div><table id="rtb"></table><p style="color:#7a736a;font-size:13px">预计 10 月 14 日送达 · 上海市徐汇区漕溪北路 88 号（林小禾）</p><button class="btn" type="button" id="rk">继续逛逛</button></div></div>
<div class="toast" id="toast" role="status"></div>
<script>
const svg={chair:c=>'<svg width="120" height="130" viewBox="0 0 120 130" aria-hidden="true"><rect x="22" y="10" width="76" height="62" rx="16" fill="'+c+'"/><rect x="16" y="64" width="88" height="22" rx="8" fill="'+c+'" opacity=".85"/><path d="M28 86l-8 40M92 86l8 40M44 86l-3 34M76 86l3 34" stroke="#8a6a44" stroke-width="5" stroke-linecap="round"/></svg>',
lamp:c=>'<svg width="120" height="140" viewBox="0 0 120 140" aria-hidden="true"><path d="M30 50Q60 0 90 50Z" fill="'+c+'"/><ellipse cx="60" cy="52" rx="30" ry="5" fill="#fff6d6"/><path d="M60 56v66" stroke="#8a6a44" stroke-width="4"/><ellipse cx="60" cy="126" rx="26" ry="6" fill="#8a6a44"/></svg>',
shelf:c=>'<svg width="130" height="130" viewBox="0 0 130 130" aria-hidden="true"><rect x="15" y="10" width="100" height="112" rx="4" fill="none" stroke="'+c+'" stroke-width="7"/><path d="M15 48h100M15 86h100" stroke="'+c+'" stroke-width="6"/><rect x="28" y="22" width="10" height="24" fill="#c2643c"/><rect x="40" y="26" width="8" height="20" fill="#e8b04a"/><circle cx="90" cy="70" r="10" fill="#5e7a63"/></svg>',
rug:c=>'<svg width="140" height="110" viewBox="0 0 140 110" aria-hidden="true"><rect x="10" y="15" width="120" height="80" rx="40" fill="'+c+'"/><rect x="26" y="28" width="88" height="54" rx="27" fill="none" stroke="#fff8" stroke-width="3" stroke-dasharray="6 5"/></svg>',
mug:c=>'<svg width="120" height="120" viewBox="0 0 120 120" aria-hidden="true"><rect x="28" y="30" width="56" height="66" rx="10" fill="'+c+'"/><path d="M84 46h8a12 12 0 010 24h-8" fill="none" stroke="'+c+'" stroke-width="7"/><path d="M44 18q6 6 0 12M60 14q6 8 0 16" stroke="#7a736a" stroke-width="3" fill="none"/></svg>',
stool:c=>'<svg width="110" height="130" viewBox="0 0 110 130" aria-hidden="true"><ellipse cx="55" cy="30" rx="40" ry="12" fill="'+c+'"/><rect x="15" y="30" width="80" height="10" fill="'+c+'"/><path d="M25 40l-8 80M85 40l8 80M55 40v80" stroke="#8a6a44" stroke-width="5" stroke-linecap="round"/></svg>'};
const P=[{id:'c1',n:'圆背休闲椅',t:'chair',pr:1299,d:'橡木腿 + 羊羔绒坐垫，坐深 52cm，适合窝着看书。',v:[['燕麦白','#e9dfcc',6],['苔藓绿','#7d9473',2],['焦糖棕','#b0713f',0]]},
{id:'l1',n:'蘑菇台灯',t:'lamp',pr:389,d:'三档暖光，可调亮度，灯罩为手工吹制玻璃。',v:[['奶油黄','#f1d9a0',12],['橄榄绿','#9aa36a',3],['陶土橙','#d58a5e',8]]},
{id:'s1',n:'五格开放书架',t:'shelf',pr:899,d:'白蜡木实木，宽 80cm，可横放可竖放。',v:[['原木色','#c9a477',4],['胡桃色','#7a5234',5]]},
{id:'r1',n:'椭圆羊毛地毯',t:'rug',pr:659,d:'新西兰羊毛手工簇绒，160 × 230cm。',v:[['燕麦白','#e3d6bf',7],['雾霾蓝','#8fa3b2',1]]},
{id:'m1',n:'粗陶马克杯',t:'mug',pr:79,d:'柴烧粗陶，容量 350ml，每只釉色略有不同。',v:[['霜白','#efe8dc',30],['墨黑','#3a3633',25],['苔绿','#7d9473',18]]},
{id:'t1',n:'圆凳',t:'stool',pr:259,d:'可叠放，承重 120kg，坐高 45cm。',v:[['原木色','#c9a477',9],['黑色','#2f2c29',6]]}];
let cart=[],cur=null,sv=0,q=1,orderSeq=4417;const $=s=>document.querySelector(s);const yen=n=>'¥'+n.toLocaleString('en-US');
const prod=id=>P.find(p=>p.id===id);
$('#grid').innerHTML=P.map(p=>'<button class="p" type="button" data-id="'+p.id+'"><div class="im">'+svg[p.t](p.v[0][1])+'</div><div class="b"><h3>'+p.n+'</h3><div class="pr"><b>'+yen(p.pr)+'</b><span class="dots">'+p.v.map(v=>'<i style="background:'+v[1]+'"></i>').join('')+'</span></div><small style="color:#7a736a">'+p.v.length+' 种颜色</small></div></button>').join('');
document.querySelectorAll('.p').forEach(b=>b.onclick=()=>openP(b.dataset.id));
function openP(id){cur=prod(id);sv=cur.v.findIndex(v=>v[2]>0);q=1;$('#pt').textContent=cur.n;$('#pp').textContent=yen(cur.pr);$('#pd').textContent=cur.d;renderP();$('#pm').classList.add('on');$('#pa').focus()}
function renderP(){const v=cur.v[sv];$('#pimg').innerHTML=svg[cur.t](v[1]).replace('width="1','width="2').replace(/height="(\d+)"/,(m,a)=>'height="'+a*2+'"');
 $('#pv').innerHTML=cur.v.map((x,i)=>'<button class="v" type="button" data-i="'+i+'" aria-pressed="'+(i===sv)+'" '+(x[2]?'':'disabled')+'><i style="background:'+x[1]+'"></i>'+x[0]+(x[2]?(x[2]<=3?' <small>仅剩 '+x[2]+'</small>':''):' <small>缺货</small>')+'</button>').join('');
 document.querySelectorAll('#pv .v').forEach(b=>b.onclick=()=>{sv=+b.dataset.i;q=Math.min(q,cur.v[sv][2]);renderP()});
 $('#qv').textContent=q;$('#ps').textContent='库存 '+v[2]+' 件';$('#qm').disabled=q<=1;$('#qp').disabled=q>=v[2];$('#pa').textContent='加入购物车 · '+yen(cur.pr*q)}
$('#qm').onclick=()=>{q--;renderP()};$('#qp').onclick=()=>{q++;renderP()};
$('#pc').onclick=()=>$('#pm').classList.remove('on');
$('#pa').onclick=()=>{const ex=cart.find(c=>c.id===cur.id&&c.v===sv);if(ex)ex.q+=q;else cart.push({id:cur.id,v:sv,q});$('#pm').classList.remove('on');toast('已加入：'+cur.n+' · '+cur.v[sv][0]+' × '+q);hideAlert();render()};
function stockOk(c){return prod(c.id).v[c.v][2]>=c.q}
function render(){const n=cart.reduce((a,c)=>a+c.q,0),sub=cart.reduce((a,c)=>a+prod(c.id).pr*c.q,0),ship=!n||sub>=999?0:49;
 $('#cc').textContent=n;$('#cn').textContent=n+' 件';$('#sub').textContent=yen(sub);$('#ship').textContent=n?(ship?yen(ship):'免运费'):'¥0';$('#tot').textContent=yen(sub+ship);
 const showBad=$('#alert').classList.contains('on');
 $('#lines').innerHTML=cart.length?cart.map((c,i)=>{const p=prod(c.id),v=p.v[c.v],bad=showBad&&!stockOk(c);return '<div class="line'+(bad?' bad':'')+'"><span class="th">'+svg[p.t](v[1]).replace(/width="\d+" height="\d+"/,'width="40" height="40"')+'</span><div><b>'+p.n+'</b><select data-i="'+i+'" aria-label="规格">'+p.v.map((x,j)=>'<option value="'+j+'" '+(j===c.v?'selected':'')+(x[2]?'':' disabled')+'>'+x[0]+'（'+(x[2]?'库存 '+x[2]:'缺货')+'）</option>').join('')+'</select><div class="q"><button type="button" data-m="'+i+'" aria-label="减少">−</button><span>'+c.q+'</span><button type="button" data-p="'+i+'" aria-label="增加">＋</button></div></div><div class="amt">'+yen(p.pr*c.q)+'<button class="rm" type="button" data-r="'+i+'">移除</button></div>'+(bad?'<div class="warn">「'+v[0]+'」'+(v[2]?'仅剩 '+v[2]+' 件，请减到 '+v[2]+' 件或换规格':'已售罄，请换一个有货的颜色')+'</div>':'')+'</div>'}).join(''):'<div class="empty">购物车是空的<br>点左侧商品挑一件吧</div>';
 document.querySelectorAll('#lines select').forEach(s=>s.onchange=()=>{const c=cart[s.dataset.i];c.v=+s.value;const st=prod(c.id).v[c.v][2];if(c.q>st)c.q=st;merge();check()});
 document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{const c=cart[b.dataset.m];c.q--;if(c.q<=0)cart.splice(b.dataset.m,1);check()});
 document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const c=cart[b.dataset.p];if(c.q<prod(c.id).v[c.v][2]){c.q++;check()}else toast('该规格库存只有 '+prod(c.id).v[c.v][2]+' 件')});
 document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{cart.splice(b.dataset.r,1);check()});
 $('#sb').disabled=!cart.length||(showBad&&cart.some(c=>!stockOk(c)));$('#oos').disabled=!cart.length}
function merge(){const m=[];cart.forEach(c=>{const e=m.find(x=>x.id===c.id&&x.v===c.v);if(e)e.q+=c.q;else m.push(c)});cart=m}
function check(){if($('#alert').classList.contains('on')){const bad=cart.filter(c=>!stockOk(c));if(!bad.length){$('#alert').innerHTML='✓ 库存问题已解决，可以重新提交订单';$('#alert').style.cssText='background:#e6eee6;color:#48614d;border-left-color:#5e7a63'}}render()}
function hideAlert(){$('#alert').classList.remove('on');$('#alert').style.cssText=''}
$('#oos').onclick=()=>{const c=cart[0],p=prod(c.id);p.v[c.v][2]=Math.max(0,c.q-1);toast('库存已变动：「'+p.n+' · '+p.v[c.v][0]+'」被抢购，剩 '+p.v[c.v][2]+' 件');render()};
$('#sb').onclick=()=>{const bad=cart.filter(c=>!stockOk(c));if(bad.length){$('#alert').classList.add('on');$('#alert').style.cssText='';$('#alert').innerHTML='<b>订单未提交：</b>'+bad.map(c=>{const p=prod(c.id),v=p.v[c.v];return '「'+p.n+' · '+v[0]+'」'+(v[2]?'库存只剩 '+v[2]+' 件':'已售罄')}).join('；')+'。请在下方标红的商品里减少数量或换规格。';render();return}
 const sub=cart.reduce((a,c)=>a+prod(c.id).pr*c.q,0),ship=sub>=999?0:49;orderSeq++;
 $('#rno').textContent='订单号 MG20261010-'+orderSeq;$('#rtb').innerHTML=cart.map(c=>{const p=prod(c.id);return '<tr><td>'+p.n+' · '+p.v[c.v][0]+' × '+c.q+'</td><td>'+yen(p.pr*c.q)+'</td></tr>'}).join('')+'<tr><td>运费</td><td>'+(ship?yen(ship):'免运费')+'</td></tr><tr><td><b>实付</b></td><td><b>'+yen(sub+ship)+'</b></td></tr>';
 cart.forEach(c=>prod(c.id).v[c.v][2]-=c.q);cart=[];hideAlert();render();$('#rm').classList.add('on')};
$('#rk').onclick=()=>$('#rm').classList.remove('on');
$('#cb').onclick=()=>document.querySelector('aside').scrollIntoView({behavior:'smooth'});
function toast(t){$('#toast').textContent=t;$('#toast').classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>$('#toast').classList.remove('on'),2000)}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('#pm').classList.remove('on');$('#rm').classList.remove('on')}});
render();
</script>
</body>
</html>
