<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>正在审核 · 行签</title>
<style>
:root{--dusk1:#2d1b4e;--dusk2:#6b3f8f;--peach:#ffb38a;--rose:#ff7aa2;--mint:#8ff0d0;--white:#fff8f4;--sub:#d8c8e8;--glass:#ffffff1a;--edge:#ffffff33}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--white);font:15px/1.55 "PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:radial-gradient(80% 50% at 80% 0,#ff7aa255,transparent 70%),radial-gradient(70% 50% at 0 40%,#ffb38a44,transparent 70%),linear-gradient(180deg,var(--dusk1),var(--dusk2) 70%,#a05a8a);display:flex;flex-direction:column;padding:16px 18px 24px}
.top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--sub)}
.top b{color:var(--white);font-size:15px}
.orb{position:relative;width:220px;height:220px;margin:28px auto 8px;display:grid;place-items:center}
.orb:before,.orb:after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--peach),var(--rose) 45%,#8f4fd6 80%);filter:blur(2px);animation:br 4s ease-in-out infinite}
.orb:after{inset:-26px;opacity:.25;filter:blur(18px);animation-delay:-2s}
@keyframes br{50%{transform:scale(.88)}}
.orb div{position:relative;text-align:center;text-shadow:0 1px 10px #2d1b4e88}
.orb small{display:block;font-size:12px;letter-spacing:.2em;opacity:.85}
.orb b{font:300 46px/1.1 "Helvetica Neue",Arial,sans-serif;font-variant-numeric:tabular-nums}
.orb span{font-size:13px}
.hint{text-align:center;font-size:13px;color:var(--sub);margin:4px 0 0}
h1{text-align:center;font-size:22px;margin:18px 0 4px}
.lead{text-align:center;color:var(--sub);margin:0 0 18px;font-size:14px}
.steps{list-style:none;margin:0;padding:14px 16px;background:var(--glass);border:1px solid var(--edge);border-radius:20px;backdrop-filter:blur(10px)}
.steps li{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;padding:8px 0;position:relative;color:var(--sub)}
.steps li:not(:last-child):after{content:"";position:absolute;left:12px;top:34px;bottom:-8px;width:2px;background:var(--edge)}
.steps i{width:26px;height:26px;border-radius:50%;border:2px solid var(--edge);display:grid;place-items:center;font-style:normal;font-size:12px}
.steps li.done{color:var(--white)}
.steps li.done i{background:var(--mint);border-color:var(--mint);color:var(--dusk1)}
.steps li.done:after{background:var(--mint)}
.steps li.cur{color:var(--white);font-weight:700}
.steps li.cur i{border-color:var(--peach);box-shadow:0 0 0 4px #ffb38a33}
.steps li.cur i:before{content:"";width:10px;height:10px;border-radius:50%;background:var(--peach);animation:pl 1.2s ease-in-out infinite}
@keyframes pl{50%{opacity:.3}}
.steps small{font-size:12px;font-weight:400;color:var(--sub)}
.acts{margin-top:auto;padding-top:22px;display:grid;gap:10px}
.bg{height:54px;border:0;border-radius:27px;background:var(--white);color:var(--dusk1);font-family:inherit;font-weight:700;font-size:16px;line-height:1;cursor:pointer}
.cx{height:46px;border:0;background:none;color:var(--sub);font:inherit;font-size:14px;text-decoration:underline;text-underline-offset:4px;cursor:pointer}
button:focus-visible{outline:3px solid var(--mint);outline-offset:3px}
.sheet{position:fixed;left:12px;right:12px;bottom:12px;background:#fff8f4;color:var(--dusk1);border-radius:22px;padding:18px;transform:translateY(130%);transition:transform .25s ease;z-index:5}
.sheet.on{transform:none}
.sheet h3{margin:0 0 4px}.sheet p{margin:0 0 14px;font-size:14px;color:#5a4a6a}
.sheet .r{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet button{height:48px;border-radius:24px;font-family:inherit;font-weight:700;font-size:15px;cursor:pointer}
.keep{border:0;background:var(--dusk1);color:#fff}
.kill{border:1.5px solid #c2185b;background:none;color:#c2185b}
.toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-90px);background:#fff8f4;color:var(--dusk1);border-radius:20px;padding:8px 16px;font-size:13px;transition:transform .25s;z-index:6;white-space:nowrap}
.toast.on{transform:translate(-50%,0)}
body.fin .orb:before,body.fin .orb:after{background:radial-gradient(circle at 35% 30%,#d6fff1,var(--mint) 50%,#2fae8a);animation:none}
body.fin .orb div{color:var(--dusk1)}
body.cancel .orb:before,body.cancel .orb:after{background:radial-gradient(circle,#8a7a9a,#4a3a5e);animation:none}
@media (min-width:600px){body{max-width:430px;margin:0 auto}.sheet{max-width:406px;margin:0 auto}}
@media (prefers-reduced-motion:reduce){.orb:before,.orb:after,.steps li.cur i:before{animation:none}.sheet,.toast{transition:none}}
</style>
</head>
<body>
<header class="top"><span>申请号 VS-2610-48213</span><b>行签</b></header>
<div class="orb" role="timer" aria-live="off"><div><small id="ol">预计还需</small><b id="eta">3:00</b><span id="ou">分钟</span></div></div>
<p class="hint" id="hint">跟着光圈慢慢呼吸，不用一直盯着这里</p>
<h1 id="ttl">已提交，正在审核材料</h1>
<p class="lead" id="lead">日本单次旅游签证 · 2 位申请人</p>
<ol class="steps" id="steps">
  <li class="done"><i>✓</i><span>材料已提交<br><small>01:48 · 9 份文件</small></span><small>完成</small></li>
  <li class="cur"><i></i><span>自动校验照片与护照<br><small>正在比对第 2 位申请人</small></span><small id="s2">进行中</small></li>
  <li><i>3</i><span>签证专员复核<br><small>约 1–2 分钟</small></span><small>等待</small></li>
  <li><i>4</i><span>生成递交确认单</span><small>等待</small></li></ol>
<div class="acts"><button class="bg" type="button" id="bg">放到后台，好了通知我</button><button class="cx" type="button" id="cx">取消这次申请</button></div>
<section class="sheet" id="sheet" role="dialog" aria-labelledby="sh"><h3 id="sh">确定取消申请？</h3><p>已上传的 9 份材料会保留 7 天，期间可以一键重新提交。服务费 ¥299 将原路退回。</p><div class="r"><button class="keep" type="button" id="keep">继续等待</button><button class="kill" type="button" id="kill">取消申请</button></div></section>
<div class="toast" id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s);let left=180,stage=1,tm;const L=[...document.querySelectorAll('#steps li')];
const fm=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
function setStage(k){stage=k;L.forEach((li,i)=>{li.className=i<k?'done':i===k?'cur':'';li.querySelector('i').textContent=i<k?'✓':i===k?'':String(i+1);li.lastElementChild.textContent=i<k?'完成':i===k?'进行中':'等待'})}
function toast(t){$('#toast').textContent=t;$('#toast').classList.add('on');setTimeout(()=>$('#toast').classList.remove('on'),2000)}
function run(){tm=setInterval(()=>{left=Math.max(0,left-6);$('#eta').textContent=fm(left);
 if(left<=120&&stage<2){setStage(2);$('#ttl').textContent='材料校验通过，专员复核中'}
 if(left<=30&&stage<3){setStage(3);$('#ttl').textContent='正在生成递交确认单'}
 if(left===0){clearInterval(tm);setStage(4);document.body.classList.add('fin');$('#ol').textContent='审核完成';$('#eta').textContent='✓';$('#ou').textContent='可以递交了';$('#ttl').textContent='审核通过';$('#hint').textContent='确认单已生成，可前往查看';$('#bg').textContent='查看递交确认单';$('#cx').style.display='none';toast('审核通过 · 已为你生成确认单')}},300)}
$('#bg').onclick=()=>{if(document.body.classList.contains('fin')){toast('已打开递交确认单 VS-2610-48213');return}if(document.body.classList.contains('cancel')){location.reload();return}toast('好的，审核完成会推送通知你')};
$('#cx').onclick=()=>$('#sheet').classList.add('on');$('#keep').onclick=()=>$('#sheet').classList.remove('on');
$('#kill').onclick=()=>{clearInterval(tm);$('#sheet').classList.remove('on');document.body.classList.add('cancel');$('#ol').textContent='已取消';$('#eta').textContent='—';$('#ou').textContent='';$('#ttl').textContent='申请已取消';$('#hint').textContent='服务费 ¥299 将在 1–3 个工作日退回';$('#lead').textContent='材料保留至 10 月 17 日，可随时重新提交';$('#bg').textContent='重新提交申请';$('#cx').style.display='none'};
run();
</script>
</body>
</html>
