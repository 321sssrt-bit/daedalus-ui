<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录 · 藏卷档案云</title>
<style>
:root{--night:#0f1b2d;--night2:#16273f;--paper:#f7f3ea;--ink:#1c2230;--muted:#6b7385;--brass:#c9a46a;--line:#ddd5c4;--error:#b3412f}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:15px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--paper);display:grid;grid-template-columns:minmax(0,560px) minmax(0,1fr);min-height:100vh}
.story{background:var(--night);color:#e9e3d6;padding:56px 56px 40px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.story svg{position:absolute;inset:0;width:100%;height:100%;opacity:.55}
.brand{position:relative;display:flex;align-items:center;gap:12px;font-family:"Songti SC","STSong","Noto Serif CJK SC",serif;font-size:22px;letter-spacing:.2em}
.brand i{width:34px;height:34px;border:1.5px solid var(--brass);display:grid;place-items:center;font-style:normal;color:var(--brass);font-size:16px;letter-spacing:0}
.quote{position:relative;max-width:400px}
.quote h1{font-family:"Songti SC","STSong","Noto Serif CJK SC",serif;font-weight:600;font-size:40px;line-height:1.25;margin:0 0 18px;color:#fbf7ee}
.quote p{margin:0;color:#a9b2c4;font-size:14px}
.ledger{position:relative;display:flex;gap:28px;font-size:12px;color:#8b95a9;border-top:1px solid #2a3b57;padding-top:18px}
.ledger b{display:block;color:var(--brass);font:600 20px/1.2 "Songti SC","STSong",serif}
main{display:grid;place-items:center;padding:48px}
.card{width:100%;max-width:400px}
.card h2{font-family:"Songti SC","STSong","Noto Serif CJK SC",serif;font-size:28px;margin:0 0 6px;font-weight:600}
.sub{color:var(--muted);margin:0 0 28px}
.tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:24px}
.tabs button{flex:1;background:none;border:0;padding:10px 0;font:inherit;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--night);font-weight:600}
.tabs button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.field{margin-bottom:18px}
input{width:100%;height:46px;border:1px solid var(--line);background:#fffdf8;border-radius:4px;padding:0 14px;font:inherit;color:var(--ink);transition:border-color .2s,box-shadow .2s}
input:hover{border-color:#b9ae98}
input:focus{outline:none;border-color:var(--night);box-shadow:0 0 0 3px #0f1b2d22}
input[aria-invalid="true"]{border-color:var(--error);box-shadow:0 0 0 3px #b3412f1f}
.row{display:flex;gap:10px}
.row input{flex:1}
.ghost{height:46px;padding:0 14px;border:1px solid var(--night);background:transparent;color:var(--night);border-radius:4px;font:inherit;cursor:pointer;white-space:nowrap}
.ghost:hover{background:#0f1b2d0d}
.ghost:disabled{border-color:var(--line);color:#a8a091;cursor:not-allowed;background:transparent}
.pw{position:relative}
.pw button{position:absolute;right:8px;top:8px;height:30px;border:0;background:none;color:var(--muted);font:inherit;font-size:13px;cursor:pointer}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin:-4px 0 22px}
.meta label{display:flex;align-items:center;gap:6px;margin:0;color:var(--ink)}
.meta input{width:16px;height:16px;accent-color:var(--night)}
a{color:var(--night);text-underline-offset:3px}
a:hover{color:#8a6a35}
.primary{width:100%;height:50px;border:0;border-radius:4px;background:var(--night);color:#fbf7ee;font-weight:600;font-size:16px;line-height:1;font-family:inherit;letter-spacing:.3em;cursor:pointer;transition:background .2s}
.primary:hover{background:var(--night2)}
.primary:focus-visible{outline:3px solid var(--brass);outline-offset:3px}
.primary:disabled{background:#9aa1ae;cursor:wait}
.msg{min-height:22px;font-size:13px;margin-top:12px;color:var(--error)}
.msg.ok{color:#2f6b4a}
.help{margin-top:30px;padding:16px;border:1px dashed var(--line);border-radius:4px;font-size:13px;color:var(--muted)}
.help strong{color:var(--ink)}
.help[hidden]{display:none}
.foot{margin-top:28px;font-size:12px;color:#9a927f}
@media (max-width:900px){body{grid-template-columns:1fr}.story{min-height:240px;padding:32px}.quote h1{font-size:30px}.ledger{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<aside class="story" aria-label="品牌介绍">
  <svg viewBox="0 0 560 800" aria-hidden="true" preserveAspectRatio="xMidYMid slice">
    <g fill="none" stroke="#c9a46a" stroke-width=".6">
      <circle cx="420" cy="180" r="120"/><circle cx="420" cy="180" r="80"/><circle cx="420" cy="180" r="40"/>
      <path d="M0 620 Q140 560 280 620 T560 620"/><path d="M0 660 Q140 600 280 660 T560 660"/>
    </g>
    <g fill="#e9e3d6"><circle cx="90" cy="120" r="1.4"/><circle cx="210" cy="80" r="1"/><circle cx="330" cy="330" r="1.6"/><circle cx="480" cy="400" r="1"/><circle cx="60" cy="400" r="1.2"/><circle cx="250" cy="460" r="1"/></g>
  </svg>
  <div class="brand"><i>藏</i>藏卷档案云</div>
  <div class="quote">
    <h1>每一页旧纸，<br>都在等它的读者。</h1>
    <p>机构档案数字化与权限管理平台。登录后继续你上次的整理进度。</p>
  </div>
  <div class="ledger"><div><b>128 万</b>已托管卷宗</div><div><b>342</b>合作馆藏机构</div><div><b>99.98%</b>年度可用</div></div>
</aside>
<main>
  <form class="card" id="form" novalidate>
    <h2>欢迎回来</h2>
    <p class="sub">使用机构账号登录藏卷档案云</p>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" aria-selected="true" data-mode="pw" id="tab-pw">密码登录</button>
      <button type="button" role="tab" aria-selected="false" data-mode="code" id="tab-code">短信验证码</button>
    </div>
    <div class="field">
      <label for="acct">账号</label>
      <input id="acct" autocomplete="username" placeholder="工号、邮箱或手机号" value="liu.qingyan@cityarchive.cn">
    </div>
    <div class="field" id="pwField">
      <label for="pw">密码</label>
      <div class="pw"><input id="pw" type="password" autocomplete="current-password" placeholder="请输入密码"><button type="button" id="peek">显示</button></div>
    </div>
    <div class="field" id="codeField" hidden>
      <label for="code">验证码</label>
      <div class="row"><input id="code" inputmode="numeric" maxlength="6" placeholder="6 位数字"><button type="button" class="ghost" id="send">获取验证码</button></div>
    </div>
    <div class="meta">
      <label><input type="checkbox" checked> 在此设备保持登录 7 天</label>
      <a href="#help" id="forgot">忘记密码？</a>
    </div>
    <button class="primary" id="go" type="submit">登 录</button>
    <div class="msg" id="msg" role="status" aria-live="polite"></div>
    <div class="help" id="help" hidden>
      <strong>找不到密码？</strong> 你可以：<br>
      1. 用「短信验证码」直接登录，再到账号设置里重设密码；<br>
      2. 联系本馆管理员（内线 8021）为你重置；<br>
      3. <a href="#" id="toCode">现在切换到验证码登录 →</a>
    </div>
    <p class="foot">登录即表示同意《藏卷服务协议》与《档案数据保密条款》 · 京 ICP 备 2021008812 号</p>
  </form>
</main>
<script>
const $=s=>document.querySelector(s);
let mode='pw';
function setMode(m){mode=m;document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.mode===m));$('#pwField').hidden=m!=='pw';$('#codeField').hidden=m!=='code';$('#msg').textContent='';}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
$('#peek').onclick=()=>{const p=$('#pw');const show=p.type==='password';p.type=show?'text':'password';$('#peek').textContent=show?'隐藏':'显示'};
$('#forgot').onclick=e=>{e.preventDefault();const h=$('#help');h.hidden=!h.hidden};
$('#toCode').onclick=e=>{e.preventDefault();setMode('code');$('#code').focus()};
let timer=null;
$('#send').onclick=()=>{let n=60;const b=$('#send');b.disabled=true;b.textContent=n+' 秒后重发';$('#msg').className='msg ok';$('#msg').textContent='验证码已发送至 138****2076';timer=setInterval(()=>{n--;b.textContent=n+' 秒后重发';if(n<=0){clearInterval(timer);b.disabled=false;b.textContent='重新获取'}},1000)};
$('#form').onsubmit=e=>{e.preventDefault();const m=$('#msg');m.className='msg';['#acct','#pw','#code'].forEach(s=>$(s).removeAttribute('aria-invalid'));
 if(!$('#acct').value.trim()){$('#acct').setAttribute('aria-invalid','true');m.textContent='请填写账号';return}
 const sec=mode==='pw'?$('#pw'):$('#code');
 if(!sec.value.trim()){sec.setAttribute('aria-invalid','true');m.textContent=mode==='pw'?'请填写密码':'请填写 6 位验证码';return}
 if(mode==='pw'&&sec.value.length<6){sec.setAttribute('aria-invalid','true');m.textContent='账号或密码不正确，还可尝试 4 次。';$('#help').hidden=false;return}
 const g=$('#go');g.disabled=true;g.textContent='正在进入…';setTimeout(()=>{g.disabled=false;g.textContent='登 录';m.className='msg ok';m.textContent='验证通过，正在打开「城市档案馆 · 第三整理室」…'},900)};
</script>
</body>
</html>
