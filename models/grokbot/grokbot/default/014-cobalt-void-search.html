<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>搜索无结果 · 素集</title>
<style>
:root{--white:#ffffff;--cobalt:#2b3cff;--cobalt-d:#1a28d6;--ink:#0b0d1a;--sub:#5a5f78;--line:#e3e5ef;--fog:#f3f4fa;--lemon:#e9ff6b}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--white);color:var(--ink);font:15px/1.55 "Inter","PingFang SC","Microsoft YaHei",system-ui,sans-serif}
header{display:flex;align-items:center;gap:28px;padding:16px 40px;border-bottom:1px solid var(--line)}
.logo{font:900 22px/1 "Inter","PingFang SC",sans-serif;letter-spacing:-.03em}
.logo span{color:var(--cobalt)}
form{flex:1;max-width:680px;display:flex;align-items:center;height:48px;border:2px solid var(--ink);border-radius:999px;padding:0 6px 0 20px;background:var(--white)}
form:focus-within{border-color:var(--cobalt);box-shadow:0 0 0 4px #2b3cff22}
form input{flex:1;border:0;font:inherit;font-size:16px;background:none;min-width:0}
form input:focus{outline:none}
form button{height:36px;padding:0 18px;border:0;border-radius:999px;background:var(--cobalt);color:#fff;font:inherit;font-weight:600;cursor:pointer}
form button:hover{background:var(--cobalt-d)}
.links{display:flex;gap:20px;font-size:14px;color:var(--sub)}
.filters{display:flex;gap:8px;align-items:center;padding:14px 40px;border-bottom:1px solid var(--line);font-size:13px;color:var(--sub)}
.fchip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 6px 0 12px;border-radius:999px;background:var(--fog);color:var(--ink);border:1px solid var(--line)}
.fchip button{width:20px;height:20px;border-radius:50%;border:0;background:#d9dcea;cursor:pointer;font-size:12px;line-height:1}
.fchip button:hover{background:var(--ink);color:#fff}
.clear{border:0;background:none;color:var(--cobalt);font:inherit;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
main{max-width:1080px;margin:0 auto;padding:56px 40px;display:grid;grid-template-columns:1fr 360px;gap:64px;align-items:start}
.q{font-size:14px;color:var(--sub);margin:0 0 10px}
h1{font-size:56px;line-height:1.05;margin:0 0 18px;letter-spacing:-.03em;font-weight:900}
h1 mark{background:var(--lemon);color:var(--ink);padding:0 .1em}
.lead{font-size:17px;color:var(--sub);margin:0 0 34px;max-width:520px}
.sug h2{font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:var(--sub);margin:0 0 12px}
.sug ol{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.sug li button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 18px;border:1px solid var(--line);border-radius:14px;background:var(--white);font:inherit;text-align:left;cursor:pointer;transition:border-color .15s,transform .15s}
.sug li button:hover{border-color:var(--cobalt);transform:translateX(4px)}
.sug li button:focus-visible,form button:focus-visible,.tag:focus-visible,.clear:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px}
.sug b{display:block;font-size:16px}.sug small{color:var(--sub)}
.sug .go{color:var(--cobalt);font-weight:700;white-space:nowrap}
.art{background:var(--fog);border-radius:24px;padding:28px;text-align:center}
.art svg{width:240px;height:200px}
.art p{margin:10px 0 0;font-size:13px;color:var(--sub)}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px;justify-content:center}
.tag{border:1px solid var(--line);background:var(--white);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.tag:hover{background:var(--ink);color:#fff}
.res{grid-column:1/-1;display:none;grid-template-columns:repeat(4,1fr);gap:16px}
.res.on{display:grid}
.res div{aspect-ratio:1;border-radius:16px;display:grid;place-items:end start;padding:12px;color:#fff;font-weight:600;font-size:13px}
@media (max-width:960px){main{grid-template-columns:1fr;padding:36px 24px}h1{font-size:40px}.links{display:none}header,.filters{padding-left:24px;padding-right:24px}.res{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:reduce){.sug li button{transition:none}.sug li button:hover{transform:none}}
</style>
</head>
<body>
<header><div class="logo">素集<span>.</span></div>
  <form id="f" role="search"><input id="q" value="蓝色渐变 3D 猫咪 图标 透明背景" aria-label="搜索素材"><button type="submit">搜索</button></form>
  <nav class="links"><span>图标</span><span>插画</span><span>3D</span><span>字体</span></nav></header>
<div class="filters" id="filters">已选筛选：<span class="fchip">格式：PNG<button type="button" aria-label="移除格式筛选">×</button></span><span class="fchip">授权：可商用<button type="button" aria-label="移除授权筛选">×</button></span><span class="fchip">尺寸：≥ 2048px<button type="button" aria-label="移除尺寸筛选">×</button></span><button class="clear" type="button" id="clear">清除全部</button></div>
<main>
  <section>
    <p class="q" id="ql">搜索「<span id="qt">蓝色渐变 3D 猫咪 图标 透明背景</span>」· 3 个筛选 · 0 个结果</p>
    <h1 id="h">一个也没找到，<br>但<mark>别走</mark>。</h1>
    <p class="lead">关键词有 5 个、筛选有 3 个，条件叠得太紧了。试试下面这些改法——每一条都已经帮你查过，确定有结果。</p>
    <div class="sug"><h2>换个搜法</h2><ol>
      <li><button type="button" data-q="3D 猫咪 图标" data-n="128"><span><b>减少关键词：3D 猫咪 图标</b><small>去掉「蓝色渐变」「透明背景」，透明背景可在下载时选</small></span><span class="go">128 个 →</span></button></li>
      <li><button type="button" data-q="蓝色渐变 3D 猫咪 图标 透明背景" data-n="46" data-clear="1"><span><b>保留关键词，移除尺寸筛选</b><small>大多数 3D 图标原尺寸是 1024px</small></span><span class="go">46 个 →</span></button></li>
      <li><button type="button" data-q="蓝色 3D 宠物 图标" data-n="312"><span><b>换个近义词：宠物 代替 猫咪</b><small>猫、狗、兔子等都会出现</small></span><span class="go">312 个 →</span></button></li></ol></div>
  </section>
  <aside class="art">
    <svg viewBox="0 0 240 200" aria-hidden="true"><circle cx="120" cy="100" r="74" fill="#ffffff"/><circle cx="104" cy="92" r="40" fill="none" stroke="#2b3cff" stroke-width="10"/><path d="M134 122l40 40" stroke="#0b0d1a" stroke-width="14" stroke-linecap="round"/><path d="M90 84q14-12 28 0" stroke="#2b3cff" stroke-width="5" fill="none" stroke-linecap="round"/><circle cx="96" cy="100" r="4" fill="#0b0d1a"/><circle cx="114" cy="100" r="4" fill="#0b0d1a"/><rect x="170" y="30" width="34" height="34" rx="9" fill="#e9ff6b"/><text x="187" y="54" text-anchor="middle" font-size="18" font-weight="900" fill="#0b0d1a">0</text></svg>
    <p>热门的蓝色 3D 系列</p>
    <div class="tags"><button class="tag" type="button" data-q="3D 图标 蓝色" data-n="2,406">3D 图标 · 蓝色</button><button class="tag" type="button" data-q="玻璃拟态" data-n="890">玻璃拟态</button><button class="tag" type="button" data-q="可爱 动物" data-n="1,532">可爱动物</button><button class="tag" type="button" data-q="渐变 插画" data-n="3,104">渐变插画</button></div>
  </aside>
  <div class="res" id="res"></div>
</main>
<script>
const $=s=>document.querySelector(s);const cols=['#2b3cff','#6c7bff','#0b0d1a','#00b3a4','#ff6b6b','#ffb020','#8a5cff','#1a28d6'];
function run(q,n,clear){$('#q').value=q;if(clear){$('#filters').querySelectorAll('.fchip')[2]?.remove()}
 const fc=$('#filters').querySelectorAll('.fchip').length;
 if(!n){$('#ql').innerHTML='搜索「<span class="qt">'+q+'</span>」· '+fc+' 个筛选 · 0 个结果';$('#res').classList.remove('on');return}
 $('#ql').innerHTML='搜索「<span class="qt">'+q+'</span>」· '+fc+' 个筛选 · <b style="color:#2b3cff">'+n+' 个结果</b>';$('#h').innerHTML='找到了 <mark>'+n+'</mark> 个。';
 document.querySelector('.lead').textContent='下面是前 8 个结果。想回到原来的搜索，可以在顶部搜索框里改回去。';
 $('#res').innerHTML=cols.map((c,i)=>'<div style="background:'+c+'">'+q.split(' ')[0]+' #'+(i+1)+'</div>').join('');$('#res').classList.add('on')}
document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>run(b.dataset.q,b.dataset.n,b.dataset.clear));
$('#f').onsubmit=e=>{e.preventDefault();const q=$('#q').value.trim();const n={'3D 猫咪 图标':'128','猫':'2,980','图标':'48,211'}[q];run(q,n)};
$('#filters').addEventListener('click',e=>{if(e.target.tagName==='BUTTON'&&e.target.closest('.fchip')){e.target.closest('.fchip').remove();const fc=$('#filters').querySelectorAll('.fchip').length;$('#ql').innerHTML='搜索「<span class="qt">'+$('#q').value+'</span>」· '+fc+' 个筛选 · '+(fc<=2?'<b style="color:#2b3cff">46 个结果</b> · 点上方建议查看':'0 个结果')}});
$('#clear').onclick=()=>{$('#filters').querySelectorAll('.fchip').forEach(c=>c.remove());$('#ql').innerHTML='搜索「<span class="qt">'+$('#q').value+'</span>」· 0 个筛选 · <b style="color:#2b3cff">71 个结果</b> · 点上方建议查看'};
</script>
</body>
</html>
