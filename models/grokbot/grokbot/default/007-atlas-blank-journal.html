<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>欢迎 · 行旅手账</title>
<style>
:root{--sand:#f2ead8;--paper:#fbf7ee;--teal:#0f6e6e;--teal-d:#0a5353;--rust:#d2643a;--ink:#2b2a26;--pencil:#77705f;--dot:#d9cdb1;--line:#e3d8bf}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;grid-template-columns:232px 1fr;background:var(--sand);color:var(--ink);font:15px/1.6 "Kaiti SC","STKaiti","KaiTi","PingFang SC","Microsoft YaHei",serif}
nav{background:var(--paper);border-right:1px solid var(--line);padding:24px 18px;display:flex;flex-direction:column;gap:4px;font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px}
.logo{font:700 20px/1 "Kaiti SC","STKaiti","KaiTi",serif;margin:0 8px 24px;display:flex;gap:8px;align-items:center;color:var(--teal)}
nav a{display:flex;justify-content:space-between;padding:9px 10px;border-radius:8px;color:var(--ink);text-decoration:none}
nav a:hover{background:#efe6d1}
nav a[aria-current]{background:var(--teal);color:#fff}
nav a span{color:var(--pencil);font-size:12px}
nav a[aria-current] span{color:#cfe7e7}
nav .sec{margin:18px 10px 6px;font-size:12px;color:var(--pencil)}
nav .empty{margin:0 10px;font-size:12px;color:#a69d88;border:1px dashed var(--dot);border-radius:8px;padding:10px}
main{position:relative;overflow:hidden;background-image:radial-gradient(var(--dot) 1.2px,transparent 1.2px);background-size:22px 22px;display:grid;grid-template-rows:auto 1fr}
.bar{display:flex;justify-content:space-between;align-items:center;padding:20px 40px;font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;color:var(--pencil)}
.av{width:34px;height:34px;border-radius:50%;background:var(--rust);color:#fff;display:grid;place-items:center;font-weight:700}
.hero{display:grid;grid-template-columns:420px 1fr;gap:48px;align-items:center;padding:0 72px 40px;max-width:1080px}
.stamp{position:relative;width:420px;height:400px}
.stamp svg{width:100%;height:100%}
h1{font-size:42px;line-height:1.25;margin:0 0 14px;font-weight:700}
h1 u{text-decoration:none;background:linear-gradient(transparent 70%,#f4b89f 70%)}
.lead{font-size:17px;color:var(--pencil);margin:0 0 30px;max-width:460px;font-family:"PingFang SC","Microsoft YaHei",sans-serif}
.acts{display:flex;gap:14px;flex-wrap:wrap;font-family:"PingFang SC","Microsoft YaHei",sans-serif}
.p{height:52px;padding:0 26px;border:0;border-radius:10px;background:var(--teal);color:#fff;font:inherit;font-size:16px;font-weight:600;cursor:pointer;box-shadow:0 3px 0 var(--teal-d)}
.p:hover{background:var(--teal-d)}
.s{height:52px;padding:0 22px;border:1.5px solid var(--ink);border-radius:10px;background:transparent;color:var(--ink);font:inherit;font-size:15px;cursor:pointer}
.s:hover{background:#fff8}
.p:focus-visible,.s:focus-visible,nav a:focus-visible,.chip:focus-visible{outline:3px solid var(--rust);outline-offset:3px}
.ideas{margin-top:34px;font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:13px;color:var(--pencil)}
.chips{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.chip{border:1px solid var(--dot);background:var(--paper);border-radius:999px;padding:6px 12px;font:inherit;color:var(--ink);cursor:pointer}
.chip:hover{border-color:var(--teal);color:var(--teal)}
.sheet{position:fixed;inset:0;background:#2b2a2655;display:none;place-items:center}
.sheet.on{display:grid}
.sheet form{background:var(--paper);border-radius:14px;padding:28px;width:420px;font-family:"PingFang SC","Microsoft YaHei",sans-serif;box-shadow:0 30px 60px -20px #0005}
.sheet h2{margin:0 0 16px;font:700 22px "Kaiti SC","STKaiti","KaiTi",serif}
.sheet label{display:block;font-size:13px;color:var(--pencil);margin:12px 0 6px}
.sheet input{width:100%;height:44px;border:1px solid var(--line);border-radius:8px;padding:0 12px;font:inherit;background:#fff}
.sheet input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px #0f6e6e22}
.sheet .row{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;font-family:"PingFang SC",sans-serif;font-size:14px;opacity:0;transition:opacity .3s}
.toast.on{opacity:1}
@media (max-width:980px){body{grid-template-columns:1fr}nav{display:none}.hero{grid-template-columns:1fr;padding:0 32px 32px}.stamp{width:280px;height:260px}h1{font-size:32px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<nav aria-label="主导航">
  <div class="logo"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="9" fill="none" stroke="#0f6e6e" stroke-width="2"/><path d="M11 4l2.5 7L11 18l-2.5-7z" fill="#d2643a"/></svg>行旅手账</div>
  <a href="#" aria-current="page">我的旅程 <span>0</span></a>
  <a href="#">灵感收藏 <span>0</span></a>
  <a href="#">同行伙伴 <span>0</span></a>
  <a href="#">花费账本 <span>¥0</span></a>
  <div class="sec">即将出发</div>
  <div class="empty">还没有日期临近的旅程</div>
</nav>
<main>
  <div class="bar"><span>2026 年 10 月 10 日 · 周六</span><div class="av" title="许嘉禾">许</div></div>
  <section class="hero">
    <div class="stamp" aria-hidden="true">
      <svg viewBox="0 0 420 400">
        <rect x="40" y="40" width="300" height="320" rx="6" fill="#fbf7ee" stroke="#d9cdb1" stroke-width="2" transform="rotate(-4 190 200)"/>
        <rect x="70" y="60" width="300" height="320" rx="6" fill="#fffdf6" stroke="#e3d8bf" stroke-width="2" transform="rotate(3 220 220)"/>
        <path d="M110 300 C150 220 200 260 240 190 S320 140 330 110" stroke="#0f6e6e" stroke-width="3" fill="none" stroke-dasharray="8 8"/>
        <circle cx="110" cy="300" r="9" fill="#d2643a"/><circle cx="330" cy="110" r="9" fill="none" stroke="#d2643a" stroke-width="3"/>
        <g transform="translate(255 245) rotate(-12)"><rect width="110" height="70" rx="4" fill="none" stroke="#d2643a" stroke-width="2.5" stroke-dasharray="4 3"/><text x="55" y="32" text-anchor="middle" font-size="16" fill="#d2643a" font-family="serif">第一站</text><text x="55" y="52" text-anchor="middle" font-size="11" fill="#d2643a">待 定</text></g>
      </svg>
    </div>
    <div>
      <h1>嘉禾，你好。<br>手账还是空白的，<br><u>下一站去哪？</u></h1>
      <p class="lead">把机票、酒店、想去的小馆和花费都记在一本手账里。先建一段旅程，剩下的我们帮你慢慢填满。</p>
      <div class="acts"><button class="p" id="new" type="button">＋ 新建第一段旅程</button><button class="s" id="imp" type="button">导入订单邮件</button></div>
      <div class="ideas">没想好？从一个灵感开始：
        <div class="chips"><button class="chip" type="button">🍁 京都 · 红叶季 5 天</button><button class="chip" type="button">🏔️ 川西 · 自驾 7 天</button><button class="chip" type="button">🌊 厦门 · 周末两天</button></div>
      </div>
    </div>
  </section>
</main>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sh"><form id="sf"><h2 id="sh">新建旅程</h2>
<label for="dest">目的地</label><input id="dest" placeholder="城市或地区，如：京都">
<label for="when">出发日期</label><input id="when" type="date" value="2026-11-14">
<div class="row"><button class="s" type="button" id="cancel">取消</button><button class="p" type="submit">创建</button></div></form></div>
<div class="toast" id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s);
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2200)}
$('#new').onclick=()=>{$('#sheet').classList.add('on');$('#dest').focus()};
$('#cancel').onclick=()=>$('#sheet').classList.remove('on');
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{$('#sheet').classList.add('on');$('#dest').value=c.textContent.split('·')[0].replace(/[^\u4e00-\u9fa5]/g,'');$('#dest').focus()});
$('#sf').onsubmit=e=>{e.preventDefault();const d=$('#dest').value.trim();if(!d){$('#dest').style.borderColor='#d2643a';$('#dest').placeholder='请先填写目的地';return}$('#sheet').classList.remove('on');toast('已创建「'+d+'」旅程，正在打开行程页…')};
$('#imp').onclick=()=>toast('把订单邮件转发到 trip@xinglv.cn，我们会自动识别航班与酒店');
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#sheet').classList.remove('on')});
</script>
</body>
</html>
