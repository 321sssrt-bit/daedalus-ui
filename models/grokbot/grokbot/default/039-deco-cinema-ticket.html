<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>购票成功 · 光华影院</title>
<style>
:root{--emerald:#0f4c45;--emerald-d:#0a3732;--gold:#c9a24a;--gold-l:#ecd9a6;--ivory:#fbf6ea;--ink:#1d2421;--sub:#6b6a5f;--bg:#e6efe9}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:15px/1.55 "Didot","Bodoni 72","Songti SC","STSong","Noto Serif SC",serif;padding:0 0 110px}
.top{background:var(--emerald);color:var(--ivory);text-align:center;padding:30px 20px 74px;position:relative;background-image:repeating-conic-gradient(from 0deg at 50% 120%,#ffffff08 0 6deg,transparent 6deg 12deg)}
.top .ok{width:60px;height:60px;margin:0 auto 10px;border:2px solid var(--gold);transform:rotate(45deg);display:grid;place-items:center}
.top .ok span{transform:rotate(-45deg);color:var(--gold);font-size:28px}
.top h1{margin:0;font-size:26px;letter-spacing:.12em}
.top p{margin:4px 0 0;color:var(--gold-l);font-size:13px;font-family:"PingFang SC",sans-serif}
.tk{margin:-56px 16px 0;background:var(--ivory);position:relative;border-radius:10px;box-shadow:0 18px 30px -18px #0f4c4588}
.tk:before{content:"";position:absolute;inset:8px;border:1px solid var(--gold);border-radius:6px;pointer-events:none}
.film{padding:22px 24px 14px;text-align:center}
.film small{font:600 11px/1 "PingFang SC",sans-serif;letter-spacing:.35em;color:var(--gold)}
.film h2{margin:6px 0 2px;font-size:24px}
.film span{color:var(--sub);font-size:13px;font-family:"PingFang SC",sans-serif}
.deco{display:flex;align-items:center;gap:8px;justify-content:center;color:var(--gold);margin:6px 0 0}
.deco:before,.deco:after{content:"";height:1px;width:60px;background:linear-gradient(90deg,transparent,var(--gold))}
.deco:after{transform:scaleX(-1)}
.grid{display:grid;grid-template-columns:1fr 1fr;padding:6px 24px 16px;gap:12px 10px;font-family:"PingFang SC",sans-serif}
.grid small{display:block;font-size:11px;color:var(--sub);letter-spacing:.1em}
.grid b{font-size:17px}
.grid .seat b{font:700 22px/1.2 "Didot","Bodoni 72",Georgia,serif;color:var(--emerald)}
.perf{position:relative;height:20px;margin:0 0}
.perf:before{content:"";position:absolute;left:20px;right:20px;top:9px;border-top:2px dashed #d7c99f}
.perf i{position:absolute;top:0;width:20px;height:20px;border-radius:50%;background:var(--bg)}
.perf i.l{left:-10px}.perf i.r{right:-10px}
.code{padding:12px 24px 22px;text-align:center}
.code small{font:11px "PingFang SC",sans-serif;color:var(--sub);letter-spacing:.2em}
.code b{display:block;font:700 30px/1.2 "SF Mono",Menlo,Consolas,monospace;letter-spacing:.18em;color:var(--emerald);margin:4px 0 8px}
.bc{height:46px;margin:0 auto;width:80%;background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 4px,var(--ink) 4px 7px,transparent 7px 9px,var(--ink) 9px 10px,transparent 10px 13px)}
details{margin:14px 16px 0;background:var(--ivory);border-radius:10px;border:1px solid #e1d6b8;font-family:"PingFang SC",sans-serif}
summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;justify-content:space-between;font-weight:600}
summary::-webkit-details-marker{display:none}
summary:after{content:"＋";color:var(--gold);font-weight:700}
details[open] summary:after{content:"－"}
summary:focus-visible,.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.rows{padding:0 16px 14px;font-size:14px}
.rows div{display:flex;justify-content:space-between;padding:6px 0;border-top:1px dotted #d7c99f}
.rows .t{font-weight:700;color:var(--emerald)}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px 20px;background:linear-gradient(transparent,var(--bg) 28%);display:grid;grid-template-columns:auto 1fr;gap:10px}
.btn{height:54px;border-radius:27px;font:700 16px/1 "PingFang SC",sans-serif;cursor:pointer}
.sec{border:1.5px solid var(--emerald);background:var(--ivory);color:var(--emerald);padding:0 18px}
.pri{border:0;background:var(--emerald);color:var(--ivory);letter-spacing:.15em}
.pri:hover{background:var(--emerald-d)}
.toast{text-align:center;font:13px "PingFang SC",sans-serif;color:var(--emerald);min-height:20px;margin-top:10px}
@media (min-width:600px){body{max-width:430px;margin:0 auto}.bar{max-width:430px;margin:0 auto}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top"><div class="ok" aria-hidden="true"><span>✓</span></div><h1>购票成功</h1><p>已发送到 138****6620，开场前 30 分钟提醒你</p></header>
<section class="tk" aria-label="电影票">
  <div class="film"><small>光华影院 · 3 号 IMAX 厅</small><h2>《潮汐之下》</h2><span>国语 · IMAX 2D · 128 分钟</span><div class="deco">✦</div></div>
  <div class="grid"><div><small>日期</small><b>10 月 12 日 周一</b></div><div><small>开场</small><b>19:40</b></div><div class="seat"><small>座位</small><b>7 排 12 座</b></div><div class="seat"><small>　</small><b>7 排 13 座</b></div></div>
  <div class="perf"><i class="l"></i><i class="r"></i></div>
  <div class="code"><small>取票码</small><b id="code">6280 1947</b><div class="bc" aria-label="取票条码"></div></div>
</section>
<details id="dt"><summary>订单明细</summary><div class="rows">
  <div><span>订单编号</span><span>GH20261010-73015</span></div><div><span>下单时间</span><span>2026-10-10 01:52</span></div>
  <div><span>电影票 ¥68 × 2</span><span>¥136.00</span></div><div><span>服务费</span><span>¥4.00</span></div><div><span>会员日立减</span><span>−¥20.00</span></div>
  <div class="t"><span>实付（微信支付）</span><span>¥120.00</span></div><div><span>退改规则</span><span>开场前 2 小时可退</span></div></div></details>
<div class="toast" id="toast" role="status"></div>
<div class="bar"><button class="btn sec" type="button" id="cal">加入日历</button><button class="btn pri" type="button" id="done">完成</button></div>
<script>
const $=s=>document.querySelector(s);
$('#cal').onclick=()=>{$('#toast').textContent='✓ 已加入日历：10 月 12 日 19:40《潮汐之下》';$('#cal').textContent='已加入'};
$('#done').onclick=()=>{$('#toast').textContent='已返回首页，电影票可在「我的 › 票夹」随时查看'};
</script>
</body>
</html>
