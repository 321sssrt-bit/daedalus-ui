<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>目录 · 山海文丛 第十二辑</title>
<style>
:root{--indigo:#1e2b4a;--indigo2:#26365c;--paper:#efe7d6;--ink:#1d1a16;--faint:#9a8f7c;--seal:#b5322a;--moon:#d9cfb8;--sky:#8ea6d1}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--indigo);color:var(--moon);font:16px/1.8 "Songti SC","STSong","Noto Serif CJK SC","SimSun",serif;display:grid;grid-template-columns:380px 1fr}
.cover{position:sticky;top:0;height:100vh;padding:56px 48px;display:flex;flex-direction:column;justify-content:space-between;border-right:1px solid #33456f;overflow:hidden}
.cover svg{position:absolute;right:-60px;bottom:-40px;width:360px;opacity:.35}
.vt{display:flex;flex-direction:row-reverse;justify-content:flex-end;gap:18px;align-items:flex-start}
.vt b{writing-mode:vertical-rl;font-size:44px;letter-spacing:.3em;font-weight:700;color:var(--paper);line-height:1.3}
.vt small{writing-mode:vertical-rl;font-size:16px;letter-spacing:.4em;color:var(--sky);margin-top:8px;white-space:nowrap}
.vt b{white-space:nowrap}
.seal{width:64px;height:64px;border:2px solid var(--seal);color:var(--seal);display:grid;place-items:center;font-size:18px;line-height:1.1;text-align:center;transform:rotate(-6deg);background:#b5322a14}
.colo{font-size:13px;color:#8a97b5;line-height:1.7;position:relative}
.book{background:var(--paper);color:var(--ink);padding:48px 64px 56px;display:grid;grid-template-columns:1fr 360px;gap:48px;align-items:start}
.head{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:12px}
.head h1{margin:0;font-size:30px;letter-spacing:.6em}
.tabs{display:flex;gap:18px;font-size:14px}
.tabs button{border:0;background:none;font:inherit;color:var(--faint);cursor:pointer;padding:2px 0;border-bottom:2px solid transparent}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-pressed="true"]{color:var(--seal);border-color:var(--seal)}
ol{list-style:none;margin:0;padding:0}
.sec{font-size:13px;letter-spacing:.4em;color:var(--seal);margin:22px 0 6px}
.e{display:grid;grid-template-columns:44px 1fr;align-items:baseline;width:100%;border:0;background:none;font:inherit;color:inherit;text-align:left;padding:10px 0;cursor:pointer;border-bottom:1px dotted #c9bfa9}
.e .no{font:italic 15px/1 Georgia,serif;color:var(--faint)}
.e .ln{display:flex;align-items:baseline;gap:8px}
.e .t{font-size:19px;font-weight:600;white-space:nowrap}
.e .dots{flex:1;border-bottom:2px dotted #b3a78f;transform:translateY(-5px);min-width:20px}
.e .pg{font:15px Georgia,serif}
.e .au{grid-column:2;font-size:13px;color:var(--faint)}
.e:hover .t{color:var(--seal)}
.e[aria-current="true"]{background:#e5dbc5}
.e[aria-current="true"] .t{color:var(--seal)}
.e:focus-visible,.tabs button:focus-visible,.rd:focus-visible{outline:2px solid var(--seal);outline-offset:2px}
.card{position:sticky;top:24px;background:#f7f1e3;border:1px solid #d6cbb2;padding:28px 26px;box-shadow:6px 6px 0 #d6cbb2}
.card .k{font-size:12px;letter-spacing:.3em;color:var(--seal)}
.card h2{margin:6px 0 4px;font-size:24px;line-height:1.35}
.card .by{font-size:14px;color:var(--faint);margin-bottom:16px}
.card p{margin:0 0 14px;font-size:15px;text-indent:2em}
.card blockquote{margin:0 0 18px;padding-left:12px;border-left:3px solid var(--seal);font-family:"Kaiti SC","STKaiti","KaiTi",serif;font-size:15px;color:#4a4339}
.rd{display:inline-block;padding:10px 20px;background:var(--indigo);color:var(--paper);border:0;font:inherit;font-size:14px;letter-spacing:.2em;cursor:pointer}
.rd:hover{background:var(--indigo2)}
@media (max-width:1100px){body{grid-template-columns:1fr}.cover{position:static;height:auto;flex-direction:row;align-items:center;padding:28px 32px}.vt b,.vt small{writing-mode:horizontal-tb}.vt b{font-size:30px}.book{grid-template-columns:1fr;padding:32px}.card{position:static}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<aside class="cover">
  <svg viewBox="0 0 300 300" aria-hidden="true"><path d="M0 220 L60 140 L100 180 L170 80 L230 160 L300 110 L300 300 L0 300Z" fill="#26365c"/><path d="M0 250 L80 190 L140 230 L210 170 L300 220 L300 300 L0 300Z" fill="#33456f"/><circle cx="230" cy="60" r="26" fill="none" stroke="#d9cfb8" stroke-width="1.5"/></svg>
  <div class="vt"><small>第十二辑 · 秋</small><b>山海文丛</b></div>
  <div class="seal" aria-hidden="true">山海<br>藏书</div>
  <div class="colo">二〇二六年十月出版<br>主编　许长宁<br>共收录小说、散文、诗与访谈十一篇</div>
</aside>
<main class="book">
  <div class="head"><h1>目录</h1><div class="tabs" role="group" aria-label="体裁"><button type="button" aria-pressed="true" data-g="">全部</button><button type="button" aria-pressed="false" data-g="小说">小说</button><button type="button" aria-pressed="false" data-g="散文">散文</button><button type="button" aria-pressed="false" data-g="诗">诗</button><button type="button" aria-pressed="false" data-g="访谈">访谈</button></div></div>
  <ol id="toc"></ol>
  <article class="card" id="card" aria-live="polite"></article>
</main>
<script>
const W=[['小说','北纬三十度的渡口','陈岸','原刊于《江南》2026 年第 3 期',3,'一个渡口的最后一位摆渡人，在大桥通车前夜，渡了最后一位不肯说名字的乘客。','他把桨横在船头，像把一辈子的话都搁下了。'],['小说','借来的雪','林知秋','首发',41,'南方小城从不下雪的冬天，一个女孩向邻居借来一台造雪机，只为让病中的外婆再看一次雪。','雪是借来的，可冷是真的。'],['小说','钟表匠的第七个抽屉','沈墨','首发',78,'老钟表匠去世后，徒弟在第七个抽屉里发现了一百多只停在同一时刻的表。','所有的表都停在四点十七分，那是师娘离开的时间。'],['散文','我的父亲是一棵树','周以宁','节选自同名散文集',112,'父亲退休后迷上了嫁接果树，作者在一年四季里，慢慢读懂了这个沉默的男人。','他说，嫁接的口子要对齐，不然树会记仇。'],['散文','菜市场的哲学','顾青','首发',131,'在一座老城的菜市场蹲了一年，记录下摊贩、讨价还价和那些不卖的东西。','最贵的不是菌子，是卖菌子的人记得你上回买了几两。'],['散文','雨季来信','温以安','首发',150,'一组写给十年前自己的信，关于离乡、改行和一次差点没赶上的航班。','亲爱的，你后来真的学会了游泳。'],['诗','秋分（组诗六首）','叶舟','首发',168,'以节气为线，写一座海边城市在秋分前后的光线、风和渔船。','光在这一天，把昼夜分得像两半橘子。'],['诗','地铁十号线','白砚','首发',176,'二十四首短诗，每一首写一个地铁站和在那里下车的人。','在知春路，有人把春天折进了公文包。'],['访谈','写作是把自己借给别人','编辑部 × 陈岸','对谈',184,'与本期头条作者聊方言、慢写作，以及为什么他的小说里总有水。','我写水，是因为它不肯停下。'],['访谈','翻译是第二次出生','编辑部 × 林舒','对谈',201,'资深译者谈二十年翻译生涯里，最难翻、也最舍不得翻完的一本书。','好的译文像一件合身的旧衣服。'],['散文','编后记','许长宁','编辑部',218,'本辑编选始末，以及我们为什么在这个秋天选择了「渡」作为主题。','愿每一位读者都能找到自己的渡口。']];
let g='',cur=0;const toc=document.getElementById('toc');
function card(i){const w=W[i];document.getElementById('card').innerHTML='<div class="k">'+w[0]+' · 第 '+w[4]+' 页</div><h2>'+w[1]+'</h2><div class="by">'+w[2]+'　·　'+w[3]+'</div><p>'+w[5]+'</p><blockquote>“'+w[6]+'”</blockquote><button class="rd" type="button">翻到第 '+w[4]+' 页阅读</button>'}
function render(){toc.innerHTML='';let last='';W.forEach((w,i)=>{if(g&&w[0]!==g)return;if(!g&&w[0]!==last){const s=document.createElement('li');s.className='sec';s.textContent=['小说','散文','诗','访谈'].indexOf(w[0])>=0?'· '+w[0]+' ·':'';toc.append(s);last=w[0]}
 const li=document.createElement('li');const b=document.createElement('button');b.type='button';b.className='e';b.setAttribute('aria-current',i===cur);
 b.innerHTML='<span class="no">'+String(i+1).padStart(2,'0')+'</span><span class="ln"><span class="t">'+w[1]+'</span><span class="dots"></span><span class="pg">'+w[4]+'</span></span><span class="au">'+w[2]+' · '+w[3]+'</span>';b.onclick=()=>{cur=i;render()};li.append(b);toc.append(li)});card(cur)}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{g=b.dataset.g;document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-pressed',x===b));const f=W.findIndex(w=>!g||w[0]===g);cur=f;render()});
render();
</script>
</body>
</html>
