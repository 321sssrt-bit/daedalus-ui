<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>购票暂时不可用 · 城轨通</title>
<style>
:root{--slate:#2b2f36;--panel:#1f2329;--line4:#00a3e0;--line2:#e4002b;--amber:#ffb81c;--white:#f5f6f7;--sub:#aab1bb;--green:#43b02a;--tile:#e9ebee}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--tile);color:var(--slate);font:15px/1.55 "Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--white);border-bottom:1px solid #d6d9de}
.bar b{font-size:16px}
.bar .lines{margin-left:auto;display:flex;gap:4px}
.bar .lines i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 11px/1 Arial;font-style:normal}
.sign{margin:16px;background:var(--panel);color:var(--white);border-radius:6px;overflow:hidden;box-shadow:0 10px 24px -14px #000a}
.sign .stripe{height:8px;background:var(--amber)}
.sign .hd{display:flex;align-items:center;gap:12px;padding:16px 18px 6px}
.sign .ic{width:46px;height:46px;flex:none;background:var(--amber);color:var(--panel);display:grid;place-items:center;font:900 28px/1 Arial;clip-path:polygon(50% 0,100% 100%,0 100%);padding-top:10px}
.sign small{font:700 11px/1 Arial,sans-serif;letter-spacing:.2em;color:var(--amber)}
.sign h1{margin:4px 0 0;font-size:22px;line-height:1.3}
.sign p{margin:0;padding:6px 18px 16px;color:#d9dde3;font-size:15px}
.route{display:flex;align-items:center;padding:4px 18px 18px;gap:0}
.route span{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--sub);gap:4px;flex:none}
.route span i{width:16px;height:16px;border-radius:50%;border:3px solid var(--line4);background:var(--panel)}
.route span.ok i{background:var(--line4)}
.route span.x i{border-color:var(--amber);background:var(--amber)}
.route span.x{color:var(--amber);font-weight:700}
.route b{flex:1;height:4px;background:var(--line4);margin-bottom:18px}
.route b.br{background:repeating-linear-gradient(90deg,var(--amber) 0 6px,transparent 6px 10px)}
.card{margin:0 16px;background:var(--white);border-radius:6px;padding:14px 16px}
.card h2{margin:0 0 8px;font-size:14px;color:#5b6370}
.card ul{margin:0;padding-left:18px}
.card li{margin:4px 0}
.ref{display:flex;justify-content:space-between;align-items:center;margin:12px 16px 0;background:var(--white);border-radius:6px;padding:12px 16px;border-left:6px solid var(--line2)}
.ref small{display:block;font-size:12px;color:#5b6370}
.ref b{font:700 17px/1.3 "SF Mono",Menlo,Consolas,monospace;letter-spacing:.04em}
.copy{height:34px;padding:0 12px;border:1.5px solid var(--slate);border-radius:17px;background:none;font:inherit;font-size:13px;font-weight:600;cursor:pointer;color:var(--slate)}
.acts{margin-top:auto;padding:18px 16px 22px;display:grid;gap:10px}
.retry{height:56px;border:0;border-radius:28px;background:var(--slate);color:#fff;font-family:inherit;font-weight:700;font-size:17px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
.retry:disabled{opacity:.75;cursor:progress}
.retry .sp{width:18px;height:18px;border:3px solid #ffffff55;border-top-color:#fff;border-radius:50%;display:none;animation:sp .8s linear infinite}
.retry.ld .sp{display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.home{height:52px;border:1.5px solid var(--slate);border-radius:26px;background:var(--white);color:var(--slate);font-family:inherit;font-weight:700;font-size:16px;line-height:1;cursor:pointer}
button:focus-visible{outline:3px solid var(--line4);outline-offset:3px}
.st{text-align:center;font-size:13px;color:#5b6370;min-height:20px}
.ok-view{display:none;margin:16px;background:var(--white);border-radius:6px;padding:24px 18px;text-align:center;border-top:8px solid var(--green)}
.ok-view b{display:block;font-size:20px;margin:8px 0 4px}
body.fixed .sign,body.fixed .card,body.fixed .ref{display:none}
body.fixed .ok-view{display:block}
@media (min-width:600px){body{max-width:430px;margin:0 auto}}
@media (prefers-reduced-motion:reduce){.retry .sp{animation:none}}
</style>
</head>
<body>
<header class="bar"><b>城轨通 · 购票</b><span class="lines" aria-hidden="true"><i style="background:#e4002b">2</i><i style="background:#00a3e0">4</i><i style="background:#43b02a">7</i></span></header>
<section class="sign" role="alert"><div class="stripe"></div>
  <div class="hd"><span class="ic" aria-hidden="true">!</span><div><small>服务暂停 · SERVICE NOTICE</small><h1>购票服务暂时连不上</h1></div></div>
  <p>不是你的网络问题，是我们的支付通道在 10:42 起出现故障，你的钱没有被扣。可以先刷乘车码进站，或稍后再买票。</p>
  <div class="route" aria-label="订单进度"><span class="ok"><i></i>选站</span><b></b><span class="ok"><i></i>下单</span><b class="br"></b><span class="x"><i></i>支付</span><b class="br"></b><span><i></i>出票</span></div>
</section>
<section class="card"><h2>你现在可以</h2><ul><li>直接用「乘车码」进站，按里程自动扣费</li><li>到站厅自助售票机用现金或银行卡买票</li><li>过几分钟点下面的「重新连接」</li></ul></section>
<div class="ref"><div><small>故障编号（联系客服时提供）</small><b id="ref">ERR-PAY-1010-0742</b></div><button class="copy" type="button" id="cp">复制</button></div>
<section class="ok-view" role="status"><span style="font-size:36px">✅</span><b>已恢复连接</b>你的订单「人民广场 → 龙阳路 · ¥5」可以继续支付了。</section>
<div class="acts"><div class="st" id="st" aria-live="polite">上次尝试：10:43</div><button class="retry" type="button" id="rt"><span class="sp"></span><span id="rtl">重新连接</span></button><button class="home" type="button" id="hm">回到首页</button></div>
<script>
const $=s=>document.querySelector(s);let n=0;
$('#cp').onclick=()=>{try{navigator.clipboard&&navigator.clipboard.writeText($('#ref').textContent)}catch(e){}$('#cp').textContent='已复制'};
$('#rt').onclick=()=>{if(document.body.classList.contains('fixed')){$('#st').textContent='正在前往支付…';return}
 const b=$('#rt');b.disabled=true;b.classList.add('ld');$('#rtl').textContent='正在连接…';n++;
 setTimeout(()=>{b.disabled=false;b.classList.remove('ld');
  if(n<2){$('#rtl').textContent='再试一次';$('#st').textContent='还没恢复（第 '+n+' 次尝试）。我们的工程师正在处理。'}
  else{document.body.classList.add('fixed');$('#rtl').textContent='继续支付';$('#st').textContent='服务已恢复 · 第 '+n+' 次尝试成功'}},1300)};
$('#hm').onclick=()=>{$('#st').textContent='正在返回首页…'};
</script>
</body>
</html>
