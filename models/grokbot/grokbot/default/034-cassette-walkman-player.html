<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>正在播放 · 磁带机</title>
<style>
:root{--cream:#f4ead5;--shell:#e8562a;--shell-d:#b9401c;--ink:#2a1d14;--sub:#7a6450;--tape:#3a2a20;--label:#fff9ea;--mustard:#f2b33d;--teal:#2c8c86}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--cream);color:var(--ink);font:15px/1.5 "PingFang SC","Microsoft YaHei",system-ui,sans-serif;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 18px}
.top button{width:40px;height:40px;border-radius:12px;border:2px solid var(--ink);background:var(--label);font-size:16px;cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
.top div{text-align:center;font-size:12px;color:var(--sub);letter-spacing:.15em}
.top div b{display:block;color:var(--ink);font-size:14px;letter-spacing:0}
.deck{margin:6px 18px 0;background:var(--shell);border-radius:22px;padding:18px 16px 16px;border:3px solid var(--ink);box-shadow:5px 6px 0 var(--ink);position:relative}
.deck:before{content:"SIDE A · 60 MIN";position:absolute;right:18px;top:8px;font:700 10px/1 "Courier New",monospace;color:#ffffffcc;letter-spacing:.15em}
.cas{background:var(--tape);border-radius:12px;padding:12px;margin-top:8px}
.lab{background:var(--label);border-radius:6px;padding:8px 10px 10px;position:relative;background-image:linear-gradient(transparent 26px,var(--mustard) 26px 30px,var(--teal) 30px 34px,transparent 34px)}
.lab small{font:700 10px/1 "Courier New",monospace;color:var(--sub);letter-spacing:.1em}
.lab h1{margin:2px 0 0;font:700 20px/1.2 "Marker Felt","Comic Sans MS","Kaiti SC","STKaiti","KaiTi",cursive;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.win{margin:14px auto 0;width:86%;height:70px;background:#1a120c;border-radius:36px;display:flex;justify-content:space-between;align-items:center;padding:0 14px;position:relative}
.reel{width:56px;height:56px;border-radius:50%;background:radial-gradient(circle,#fff 0 9px,transparent 10px),repeating-conic-gradient(var(--label) 0 20deg,#5a463a 20deg 60deg);border:4px solid #5a463a}
.playing .reel{animation:spin 2.4s linear infinite}
.reel.r{animation-duration:1.8s}
@keyframes spin{to{transform:rotate(360deg)}}
.ribbon{position:absolute;left:66px;right:66px;top:30px;height:10px;background:#5a463a;border-radius:2px}
.meta{padding:22px 22px 0}
.meta h2{margin:0;font-size:22px}
.meta p{margin:2px 0 0;color:var(--sub)}
.bar{padding:18px 22px 0}
.trk{position:relative;height:14px;border:2px solid var(--ink);border-radius:8px;background:var(--label);cursor:pointer}
.trk i{position:absolute;left:0;top:0;bottom:0;background:repeating-linear-gradient(90deg,var(--shell) 0 6px,var(--shell-d) 6px 8px);border-radius:6px 0 0 6px}
.trk input{position:absolute;inset:-6px 0;width:100%;opacity:0;cursor:pointer;margin:0}
.time{display:flex;justify-content:space-between;font:700 12px/1 "Courier New",monospace;margin-top:6px;color:var(--sub)}
.ctl{display:flex;justify-content:center;align-items:center;gap:22px;padding:22px 0 10px}
.k{width:58px;height:58px;border-radius:14px;border:3px solid var(--ink);background:var(--label);font-size:20px;cursor:pointer;box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.k:active,.k.dn{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.k.big{width:84px;height:84px;border-radius:20px;background:var(--mustard);font-size:30px}
.k:focus-visible,.top button:focus-visible,.q button:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
.q{margin:8px 18px 24px;border:2px solid var(--ink);border-radius:14px;background:var(--label);overflow:hidden}
.q h3{margin:0;font:700 12px/1 "Courier New",monospace;letter-spacing:.15em;padding:10px 12px;border-bottom:2px dashed #d8c8a8}
.q button{display:flex;justify-content:space-between;width:100%;padding:10px 12px;border:0;border-bottom:1px solid #eadcbf;background:none;font:inherit;font-size:14px;cursor:pointer;color:var(--ink);text-align:left}
.q button:last-child{border:0}
.q button[aria-current]{background:#fde6c6;font-weight:700}
.q button span{font:12px "Courier New",monospace;color:var(--sub)}
@media (min-width:600px){body{max-width:430px;margin:0 auto;border-left:2px solid var(--ink);border-right:2px solid var(--ink)}}
@media (prefers-reduced-motion:reduce){.playing .reel{animation:none}.k{transition:none}}
</style>
</head>
<body>
<header class="top"><button type="button" aria-label="收起">⌄</button><div>正在播放<b>周末慢车 · 歌单</b></div><button type="button" aria-label="更多">⋯</button></header>
<section class="deck" id="deck" aria-label="专辑主视觉"><div class="cas"><div class="lab"><small>MIXTAPE NO.07</small><h1 id="lt">海边的夏天快要过去</h1></div>
  <div class="win"><span class="reel"></span><span class="ribbon"></span><span class="reel r"></span></div></div></section>
<div class="meta"><h2 id="tt">海边的夏天快要过去</h2><p id="ar">白噪声乐团 · 《潮间带》</p></div>
<div class="bar"><div class="trk"><i id="fill"></i><input type="range" id="seek" min="0" max="1000" value="0" aria-label="播放进度"></div><div class="time"><span id="cur">0:00</span><span id="dur">3:48</span></div></div>
<div class="ctl"><button class="k" type="button" id="prev" aria-label="上一首">⏮</button><button class="k big" type="button" id="pp" aria-label="播放">▶</button><button class="k" type="button" id="next" aria-label="下一首">⏭</button></div>
<section class="q"><h3>接下来 · B 面</h3><div id="ql"></div></section>
<script>
const S=[['海边的夏天快要过去','白噪声乐团 · 《潮间带》',228],['慢车开往石门坎','鹿角巷 · 《周末慢车》',196],['晚风电台 FM 87.6','阿栗 · 单曲',254],['蓝色牛仔裤','白噪声乐团 · 《潮间带》',211]];
let i=0,t=72,play=true,timer;const $=s=>document.querySelector(s);const fm=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
function load(){const s=S[i];$('#tt').textContent=$('#lt').textContent=s[0];$('#ar').textContent=s[1];$('#dur').textContent=fm(s[2]);
 $('#ql').innerHTML=S.map((x,j)=>'<button type="button" data-j="'+j+'" '+(j===i?'aria-current="true"':'')+'>'+(j===i?'▶ ':'')+x[0]+'<span>'+fm(x[2])+'</span></button>').join('');
 document.querySelectorAll('#ql button').forEach(b=>b.onclick=()=>{i=+b.dataset.j;t=0;load();setPlay(true)});tick()}
function tick(){const d=S[i][2];$('#cur').textContent=fm(t);$('#fill').style.width=(t/d*100)+'%';$('#seek').value=Math.round(t/d*1000)}
function setPlay(p){play=p;$('#deck').classList.toggle('playing',p);$('#pp').textContent=p?'❚❚':'▶';$('#pp').setAttribute('aria-label',p?'暂停':'播放');$('#pp').classList.toggle('dn',p);clearInterval(timer);if(p)timer=setInterval(()=>{t++;if(t>=S[i][2]){i=(i+1)%S.length;t=0;load()}tick()},1000)}
$('#pp').onclick=()=>setPlay(!play);
$('#next').onclick=()=>{i=(i+1)%S.length;t=0;load()};
$('#prev').onclick=()=>{if(t>3)t=0;else i=(i-1+S.length)%S.length,t=0;load()};
$('#seek').oninput=e=>{t=Math.round(e.target.value/1000*S[i][2]);tick()};
load();setPlay(true);
</script>
</body>
</html>
