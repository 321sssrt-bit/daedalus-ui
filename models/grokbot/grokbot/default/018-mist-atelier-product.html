<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>雾屿 No.7 · 商品详情</title>
<style>
:root{--bone:#f3f0eb;--white:#fbfaf8;--black:#141414;--grey:#8a857d;--line:#d9d4cc;--smoke:#c9c3b9;--accent:#6e5a46}
*{box-sizing:border-box}
body{margin:0;background:var(--white);color:var(--black);font:14px/1.7 "Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;letter-spacing:.02em}
header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:22px 56px;border-bottom:1px solid var(--line);font-size:12px;letter-spacing:.18em}
header .l{display:flex;gap:28px}
header .logo{font:300 24px/1 "Didot","Bodoni 72","Songti SC","STSong",serif;letter-spacing:.5em}
header .r{text-align:right}
.crumb{padding:16px 56px;font-size:12px;color:var(--grey);letter-spacing:.1em}
main{display:grid;grid-template-columns:96px 1fr 440px;gap:40px;padding:8px 56px 64px}
.thumbs{display:flex;flex-direction:column;gap:12px}
.thumbs button{width:96px;height:120px;border:1px solid transparent;background:var(--bone);padding:0;cursor:pointer}
.thumbs button[aria-pressed="true"]{border-color:var(--black)}
.thumbs button:hover{border-color:var(--smoke)}
.thumbs button:focus-visible,.size button:focus-visible,.buy:focus-visible,.bag:focus-visible,.qty button:focus-visible{outline:1px solid var(--black);outline-offset:3px}
.thumbs svg{width:100%;height:100%}
.stage{background:var(--bone);height:640px;display:grid;place-items:center;position:relative}
.stage svg{height:78%}
.stage .cap{position:absolute;left:24px;bottom:20px;font-size:11px;letter-spacing:.2em;color:var(--grey)}
.info{padding-top:12px}
.info small{font-size:11px;letter-spacing:.3em;color:var(--grey)}
.info h1{font:300 40px/1.15 "Didot","Bodoni 72","Songti SC","STSong",serif;margin:10px 0 6px;letter-spacing:.04em}
.info .sub{color:var(--grey);margin:0 0 26px}
.price{font:300 28px/1 "Didot","Bodoni 72","Helvetica Neue",serif;margin-bottom:6px}
.unit{font-size:12px;color:var(--grey);margin-bottom:28px}
.lab{font-size:11px;letter-spacing:.24em;color:var(--grey);margin:0 0 10px;display:flex;justify-content:space-between}
.size{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:26px}
.size button{height:58px;border:1px solid var(--line);background:transparent;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.3;color:var(--black)}
.size button small{font-size:11px;color:var(--grey);letter-spacing:.05em}
.size button:hover{border-color:var(--black)}
.size button[aria-pressed="true"]{background:var(--black);color:var(--white);border-color:var(--black)}
.size button[aria-pressed="true"] small{color:var(--smoke)}
.size button:disabled{color:var(--smoke);cursor:not-allowed;text-decoration:line-through;border-style:dashed}
.qty{display:flex;align-items:center;border:1px solid var(--line);width:132px;height:48px;margin-bottom:22px}
.qty button{width:44px;height:100%;border:0;background:none;font-size:18px;cursor:pointer}
.qty button:disabled{color:var(--smoke);cursor:not-allowed}
.qty span{flex:1;text-align:center;font-variant-numeric:tabular-nums}
.buy{width:100%;height:56px;border:0;background:var(--black);color:var(--white);font:inherit;letter-spacing:.3em;cursor:pointer;margin-bottom:10px;transition:background .2s}
.buy:hover{background:#333333}
.bag{width:100%;height:56px;border:1px solid var(--black);background:transparent;font:inherit;letter-spacing:.3em;cursor:pointer;color:var(--black)}
.bag:hover{background:var(--bone)}
.note{margin-top:14px;font-size:12px;color:var(--accent);min-height:20px}
details{border-top:1px solid var(--line);padding:14px 0}
details:last-of-type{border-bottom:1px solid var(--line)}
summary{cursor:pointer;font-size:12px;letter-spacing:.2em;list-style:none;display:flex;justify-content:space-between}
summary:after{content:"+"}details[open] summary:after{content:"−"}
details p{margin:10px 0 0;color:#555049}
@media (max-width:1000px){main{grid-template-columns:1fr;padding:8px 24px 48px}.thumbs{flex-direction:row;order:2}.thumbs button{width:72px;height:90px}.stage{height:420px}header{padding:18px 24px}header .l{display:none}.crumb{padding:12px 24px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="l"><span>香氛</span><span>蜡烛</span><span>礼盒</span></div><div class="logo">雾屿</div><div class="r">搜索　账户　购物袋 (<span id="bc">0</span>)</div></header>
<div class="crumb">首页 / 香氛 / 木质调 / No.7 雨后杉林</div>
<main>
  <div class="thumbs" role="group" aria-label="商品图"></div>
  <div class="stage" id="stage"></div>
  <section class="info">
    <small>EAU DE PARFUM · 木质调</small>
    <h1>No.7 雨后杉林</h1>
    <p class="sub">雪松、湿润苔藓与一点点烟熏茶叶。像清晨走进下过雨的杉树林。</p>
    <div class="price" id="price">¥ 1,280</div><div class="unit" id="unit">50 ml · 约 ¥ 25.6 / ml · 含税</div>
    <div class="lab"><span>容量</span><span id="stock">现货，48 小时内发出</span></div>
    <div class="size" role="group" aria-label="容量">
      <button type="button" data-s="15" data-p="420" aria-pressed="false">15 ml<small>旅行装</small></button>
      <button type="button" data-s="50" data-p="1280" aria-pressed="true">50 ml<small>经典装</small></button>
      <button type="button" data-s="100" data-p="1980" aria-pressed="false">100 ml<small>珍藏装</small></button>
    </div>
    <div class="lab"><span>数量</span><span>每单限购 3 件</span></div>
    <div class="qty"><button type="button" id="minus" aria-label="减少">−</button><span id="q">1</span><button type="button" id="plus" aria-label="增加">＋</button></div>
    <button class="buy" type="button" id="buy">立即购买</button>
    <button class="bag" type="button" id="bag">加入购物袋</button>
    <div class="note" id="note" role="status" aria-live="polite">免费附赠 2 ml 试香与手写卡片</div>
    <details open><summary>香调结构</summary><p>前调：佛手柑、黑胡椒　中调：雪松、苔藓　后调：烟熏正山小种、香根草</p></details>
    <details><summary>配送与退换</summary><p>全国顺丰包邮；未拆封商品 14 天内可退换。</p></details>
  </section>
</main>
<script>
const V=[['#d9d1c4','#8b7d6b','正面'],['#cfd6cf','#5e6e5c','侧面'],['#e0d6c8','#6e5a46','礼盒'],['#c9c3b9','#3d3a35','香调意象']];
function bottle(b,c,big){return '<svg viewBox="0 0 120 180" aria-hidden="true"><rect x="0" y="0" width="120" height="180" fill="'+b+'" opacity="'+(big?0:1)+'"/><rect x="46" y="18" width="28" height="22" fill="'+c+'"/><rect x="24" y="40" width="72" height="118" rx="4" fill="#fbfaf8" opacity=".55" stroke="'+c+'" stroke-width="1.2"/><rect x="36" y="90" width="48" height="30" fill="none" stroke="'+c+'" stroke-width=".8"/><text x="60" y="108" text-anchor="middle" font-size="9" fill="'+c+'" letter-spacing="2">No.7</text></svg>'}
const th=document.querySelector('.thumbs'),st=document.getElementById('stage');let v=0,q=1,price=1280,size=50,bag=0;
V.forEach((x,i)=>{const b=document.createElement('button');b.type='button';b.setAttribute('aria-label','查看'+x[2]);b.setAttribute('aria-pressed',i===0);b.innerHTML=bottle(x[0],x[1],false);b.onclick=()=>{v=i;show()};th.append(b)});
function show(){st.style.background=V[v][0];st.innerHTML=bottle(V[v][0],V[v][1],true)+'<span class="cap">'+(v+1)+' / 4 · '+V[v][2]+'</span>';[...th.children].forEach((b,i)=>b.setAttribute('aria-pressed',i===v))}
function upd(){document.getElementById('price').textContent='¥ '+(price*q).toLocaleString('en-US');document.getElementById('unit').textContent=size+' ml × '+q+' · 约 ¥ '+(price/size).toFixed(1)+' / ml · 含税';document.getElementById('q').textContent=q;document.getElementById('minus').disabled=q<=1;document.getElementById('plus').disabled=q>=3}
document.querySelectorAll('.size button').forEach(b=>b.onclick=()=>{size=+b.dataset.s;price=+b.dataset.p;document.querySelectorAll('.size button').forEach(x=>x.setAttribute('aria-pressed',x===b));document.getElementById('stock').textContent=size===100?'仅剩 6 件':'现货，48 小时内发出';upd()});
document.getElementById('minus').onclick=()=>{if(q>1){q--;upd()}};document.getElementById('plus').onclick=()=>{if(q<3){q++;upd()}};
document.getElementById('bag').onclick=()=>{bag+=q;document.getElementById('bc').textContent=bag;document.getElementById('note').textContent='已加入购物袋：No.7 '+size+' ml × '+q};
document.getElementById('buy').onclick=()=>{document.getElementById('note').textContent='正在前往结算：¥ '+(price*q).toLocaleString('en-US')+'（'+size+' ml × '+q+'）'};
show();upd();
</script>
</body>
</html>
