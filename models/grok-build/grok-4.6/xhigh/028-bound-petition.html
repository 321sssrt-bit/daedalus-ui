<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>线装表 · 申请</title>
  <style>
    :root {
      --paper: #f3ead6;
      --ink: #231c14;
      --rule: #c9b48a;
      --red: #9c2b1a;
      --ok: #2f5d3a;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: #d8cbb0; color: var(--ink); font: 15px/1.55 Georgia, "Songti SC", serif; }
    .doc { max-width: 920px; margin: 20px auto; display: grid; grid-template-columns: 200px 1fr; background: var(--paper); min-height: 640px; }
    nav { padding: 20px 14px; border-right: 1px solid var(--rule); }
    nav button { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 8px 6px; font: inherit; cursor: pointer; }
    nav button.on { color: var(--red); }
    main { padding: 24px 28px; }
    h1 { margin: 0 0 12px; }
    section { display: none; }
    section.on { display: block; }
    label { display: block; margin: 12px 0 4px; }
    label span { color: var(--red); }
    input, textarea { width: 100%; border: 0; border-bottom: 1px solid var(--ink); background: transparent; font: inherit; padding: 6px 0; }
    textarea { min-height: 80px; }
    .bar { margin-top: 20px; display: flex; gap: 8px; }
    button.act { height: 38px; padding: 0 14px; cursor: pointer; font: inherit; }
    .draft { background: transparent; border: 1px solid var(--ink); }
    .submit { background: var(--red); color: #fff8e8; border: 0; }
    .msg { margin-top: 10px; }
    @media (max-width: 768px) { .doc { grid-template-columns: 1fr; } nav { display: flex; flex-wrap: wrap; border-right: 0; border-bottom: 1px solid var(--rule); } nav button { width: auto; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="doc">
    <nav>
      <button class="on" data-s="a" type="button">一、来历</button>
      <button data-s="b" type="button">二、场地</button>
      <button data-s="c" type="button">三、承诺</button>
    </nav>
    <main>
      <h1>线装表</h1>
      <section class="on" id="a">
        <label>申请人姓名 <span>*</span></label>
        <input id="name" value="林晚青">
        <label>所属摊或岗 <span>*</span></label>
        <input id="post" value="青圃社">
      </section>
      <section id="b">
        <label>想用的场地</label>
        <input id="place" value="青石集北坡">
        <label>起止日</label>
        <input id="days" value="八月初三至初八">
      </section>
      <section id="c">
        <label>承诺 <span>*</span></label>
        <textarea id="vow">散场自己扫石缝，不把苔剥走。</textarea>
      </section>
      <div class="bar">
        <button class="act draft" id="draft" type="button">保存草稿</button>
        <button class="act submit" id="go" type="button">呈交</button>
      </div>
      <p class="msg" id="msg"></p>
    </main>
  </div>
  <script>
    document.querySelectorAll("nav button").forEach(function (btn) {
      btn.addEventListener("click", function () {
        document.querySelectorAll("nav button").forEach(function (b) { b.className = ""; });
        btn.className = "on";
        document.querySelectorAll("main section").forEach(function (s) { s.className = ""; });
        document.getElementById(btn.getAttribute("data-s")).className = "on";
      });
    });
    document.getElementById("draft").addEventListener("click", function () {
      document.getElementById("msg").textContent = "草稿夹在第三页。还没呈交，值年看不见。";
    });
    document.getElementById("go").addEventListener("click", function () {
      var need = ["name", "post", "vow"].every(function (id) { return document.getElementById(id).value.trim(); });
      document.getElementById("msg").textContent = need
        ? "已呈交。线装表进值年匣，编号 XB-28。"
        : "有星号的空着，线装订不上。";
      if (!need) document.getElementById("msg").style.color = "#9c2b1a";
      else document.getElementById("msg").style.color = "#2f5d3a";
    });
  </script>
</body>
</html>
