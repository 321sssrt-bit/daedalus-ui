<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>青石集 · 今日摊</title>
  <style>
    :root {
      --stone: #6b7a74;
      --moss: #3d5a3a;
      --wet: #1f2c28;
      --foam: #e7efe8;
      --price: #d7c27a;
      --card: #2a3833;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: linear-gradient(#2b3a36, #1a2422); color: var(--foam); font: 15px/1.45 "Segoe UI", "PingFang SC", sans-serif; }
    header { padding: 22px 24px 8px; }
    .kicker { letter-spacing: 0.22em; font-size: 12px; color: #9bb5a8; }
    h1 { margin: 6px 0 0; font-size: 32px; font-weight: 500; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 18px 24px 40px; }
    .g { background: var(--card); padding: 14px; min-height: 180px; display: flex; flex-direction: column; border-top: 3px solid var(--moss); }
    .g h2 { margin: 0 0 6px; font-size: 18px; }
    .g .pr { color: var(--price); margin-top: auto; font-size: 20px; }
    .g button { margin-top: 8px; height: 34px; border: 0; background: var(--moss); color: var(--foam); cursor: pointer; }
    .g button.on { background: var(--price); color: var(--wet); }
    .bar { padding: 0 24px 24px; color: #9bb5a8; }
    @media (max-width: 768px) { .grid { grid-template-columns: 1fr 1fr; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <header>
    <div class="kicker">MOSS MARKET</div>
    <h1>青石集 · 湿石上的摊</h1>
  </header>
  <div class="grid" id="grid"></div>
  <p class="bar" id="bar">布袋还是空的。喜欢的先别走，按一下「收进布袋」。</p>
  <script>
    (function () {
      var goods = [
        { n: "青苔石皂", p: 28 }, { n: "雨花瓷盏", p: 64 }, { n: "溪石镇纸", p: 45 },
        { n: "苔绒坐垫", p: 120 }, { n: "湿叶手帐", p: 36 }, { n: "山泉瓶", p: 18 },
        { n: "石纹围裙", p: 88 }, { n: "雾绿线香", p: 22 }
      ];
      var bag = {};
      var grid = document.getElementById("grid");
      goods.forEach(function (g, i) {
        var el = document.createElement("article");
        el.className = "g";
        el.innerHTML = "<h2>" + g.n + "</h2><p>今早从北坡搬下来，石头还是湿的。</p><div class=\"pr\">¥ " + g.p + "</div><button type=\"button\">收进布袋</button>";
        el.querySelector("button").addEventListener("click", function () {
          bag[g.n] = !bag[g.n];
          this.className = bag[g.n] ? "on" : "";
          this.textContent = bag[g.n] ? "已在袋里" : "收进布袋";
          var n = Object.keys(bag).filter(function (k) { return bag[k]; }).length;
          document.getElementById("bar").textContent = n ? ("布袋里有 " + n + " 件。去木箱帐结也可以。") : "布袋还是空的。";
        });
        if (i < 6) grid.appendChild(el);
        else grid.appendChild(el);
      });
    })();
  </script>
</body>
</html>
