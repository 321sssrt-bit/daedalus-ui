<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>绛席 · 核帖</title>
  <style>
    :root {
      --wine: #6e1212;
      --gold: #f3d48a;
      --deep: #1a0808;
      --flame: #c43c2c;
      --ivory: #efe3c4;
      --bronze: #8a6a28;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% -10%, #a51f1f 0 28%, transparent 29%),
        var(--wine);
      color: var(--ivory);
      font: 16px/1.6 "Songti SC", "STSong", "SimSun", serif;
      display: grid;
      place-items: center;
      padding: 28px 16px;
    }
    .invite {
      width: min(560px, 100%);
      border: 2px solid var(--gold);
      outline: 8px solid var(--wine);
      outline-offset: 10px;
      box-shadow: 0 0 0 12px var(--gold);
      background: linear-gradient(180deg, #7a1616, #5a0e0e 40%, #4a0c0c);
      padding: 40px 36px 32px;
      text-align: center;
    }
    .seal {
      width: 72px; height: 72px; margin: 0 auto 16px;
      border: 3px solid var(--gold);
      border-radius: 50%;
      display: grid; place-items: center;
      color: var(--gold);
      letter-spacing: 0.2em;
      font-size: 14px;
    }
    h1 { margin: 0; font-size: 36px; color: var(--gold); letter-spacing: 0.24em; }
    .who { margin: 10px 0 0; color: var(--ivory); }
    .rule { height: 1px; background: var(--gold); margin: 22px 40px; opacity: 0.6; }
    p.note { margin: 0 24px 22px; color: #f0d8b0; font-size: 15px; }
    label { display: block; font-size: 13px; color: var(--gold); letter-spacing: 0.2em; }
    input {
      margin-top: 8px;
      width: min(280px, 80%);
      height: 46px;
      border: 1px solid var(--gold);
      background: var(--deep);
      color: var(--gold);
      text-align: center;
      letter-spacing: 0.28em;
      font: 18px/1 inherit;
    }
    input:focus { outline: 2px solid var(--gold); }
    .go {
      margin-top: 20px;
      height: 46px;
      padding: 0 28px;
      border: 1px solid var(--gold);
      background: var(--gold);
      color: var(--deep);
      letter-spacing: 0.2em;
      font: 700 15px/1 inherit;
      cursor: pointer;
    }
    .go:hover { background: #ffe3a4; }
    .go:disabled { background: #8a6a28; color: #3a2010; cursor: not-allowed; }
    .fb { min-height: 28px; margin-top: 16px; font-size: 14px; }
    .bad { color: #ffb4a4; }
    .good { color: var(--gold); }
    @media (max-width: 768px) {
      .invite { padding: 28px 18px; outline-width: 5px; }
      h1 { font-size: 28px; letter-spacing: 0.12em; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="invite">
    <div class="seal">请</div>
    <h1>绛席夜宴</h1>
    <p class="who">持帖人：沈纸年及其一位同伴</p>
    <div class="rule"></div>
    <p class="note">没有帖号的人，门厅不点灯。请把六位帖号按原样抄在金线上。</p>
    <form id="check">
      <label for="code">帖号</label><br>
      <input id="code" maxlength="6" value="绛-184" spellcheck="false">
      <div>
        <button class="go" type="submit">核对金线</button>
      </div>
      <p class="fb" id="fb"></p>
    </form>
  </main>
  <script>
    (function () {
      var fb = document.getElementById("fb");
      document.getElementById("check").addEventListener("submit", function (event) {
        event.preventDefault();
        var code = document.getElementById("code").value.trim();
        if (code === "绛-184") {
          fb.className = "fb good";
          fb.textContent = "金线对上了。二楼靠窗第三席，亥时开席。";
          return;
        }
        fb.className = "fb bad";
        if (!code) {
          fb.textContent = "帖号是空的。门厅仍是黑的。";
        } else {
          fb.textContent = "「" + code + "」对不上今夜名册。请向发帖人重要，或核对是否抄漏了绛字。";
        }
      });
    })();
  </script>
</body>
</html>
