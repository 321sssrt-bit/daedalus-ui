<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>白垩室 · 还没有作品</title>
  <style>
    :root {
      --wall: #f4f1ea;
      --plaster: #ece7dc;
      --char: #2c2a26;
      --dust: #8a8478;
      --graphite: #4a4740;
      --linen: #fffdf8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--wall);
      color: var(--char);
      font: 16px/1.6 "Segoe UI Variable", "Segoe UI", "PingFang SC", sans-serif;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 22px 40px;
      border-bottom: 1px solid #ddd6c8;
    }
    .mark { letter-spacing: 0.28em; font-size: 12px; color: var(--dust); }
    .ghost {
      border: 1px solid var(--char);
      background: transparent;
      height: 36px;
      padding: 0 14px;
      font: 13px/1 inherit;
      cursor: pointer;
    }
    main {
      max-width: 880px;
      margin: 0 auto;
      padding: 72px 24px 80px;
      text-align: center;
    }
    .cast {
      width: 180px; height: 180px; margin: 0 auto 28px;
      background: var(--plaster);
      border: 1px solid #d5cfc2;
      display: grid; place-items: center;
      box-shadow: inset 8px 8px 0 #e3ddd0;
    }
    .cast span { font-size: 64px; color: #c9c2b4; }
    h1 { font-size: 40px; font-weight: 500; margin: 0 0 10px; letter-spacing: 0.04em; }
    .lede { color: var(--dust); max-width: 28em; margin: 0 auto 28px; }
    .acts { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
    .prime {
      height: 46px;
      padding: 0 22px;
      border: 0;
      background: var(--char);
      color: var(--linen);
      font: 15px/1 inherit;
      cursor: pointer;
    }
    .prime:hover { background: var(--graphite); }
    .second {
      height: 46px;
      padding: 0 22px;
      border: 1px solid var(--char);
      background: var(--linen);
      cursor: pointer;
      font: 15px/1 inherit;
    }
    .tray { margin-top: 36px; color: var(--dust); font-size: 14px; min-height: 24px; }
    @media (max-width: 768px) {
      header { padding: 16px; }
      h1 { font-size: 30px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <header>
    <div class="mark">PLASTER ROOM</div>
    <button class="ghost" type="button" id="tour">看别人怎么摆</button>
  </header>
  <main>
    <div class="cast" aria-hidden="true"><span>石膏</span></div>
    <h1>房间是白的</h1>
    <p class="lede">你已经进来了。墙上还没有钉子，台面上没有小稿。先放一件东西，这间画室才开始算你的。</p>
    <div class="acts">
      <button class="prime" id="start" type="button">放上第一块小稿</button>
      <button class="second" id="import" type="button">从旧画夹搬进来</button>
    </div>
    <p class="tray" id="tray">台面空着。灯光是中性白。</p>
  </main>
  <script>
    (function () {
      var tray = document.getElementById("tray");
      document.getElementById("start").addEventListener("click", function () {
        tray.textContent = "第一块小稿已搁在北墙下。你可以开始钉钉子了。";
      });
      document.getElementById("import").addEventListener("click", function () {
        tray.textContent = "旧画夹还在登记。搬进来之前，这间房仍保持空。";
      });
      document.getElementById("tour").addEventListener("click", function () {
        tray.textContent = "邻室在下午开放参观。现在请先决定要不要留下第一件。";
      });
    })();
  </script>
</body>
</html>
