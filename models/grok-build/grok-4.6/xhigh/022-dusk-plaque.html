<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>暮牌 · 顾北</title>
  <style>
    :root {
      --dusk: #2a1830;
      --glow: #e07a3d;
      --pink: #d46a8a;
      --card: #3b2244;
      --paper: #f7e7d4;
      --mute: #c9a8b4;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: linear-gradient(160deg, #1a1020, #4a2040 45%, #e07a3d); color: var(--paper); font: 16px/1.5 "Segoe UI", "PingFang SC", sans-serif; }
    .plaque { max-width: 880px; margin: 40px auto; padding: 0 20px 40px; }
    .id { display: flex; gap: 20px; align-items: end; }
    .ava { width: 92px; height: 92px; background: var(--glow); color: #1a1020; display: grid; place-items: center; font-size: 36px; font-weight: 700; }
    h1 { margin: 0; font-size: 36px; }
    .who { color: var(--mute); margin: 4px 0 0; }
    .acts { margin: 18px 0 28px; display: flex; gap: 10px; }
    button { height: 40px; padding: 0 16px; border: 0; cursor: pointer; font: inherit; }
    .follow { background: var(--glow); color: #1a1020; }
    .follow.on { background: transparent; color: var(--paper); box-shadow: inset 0 0 0 1px var(--paper); }
    .mail { background: transparent; color: var(--paper); box-shadow: inset 0 0 0 1px var(--paper); }
    .works { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .w { background: var(--card); min-height: 120px; padding: 14px; }
    .w b { display: block; margin-bottom: 6px; }
    .st { min-height: 22px; margin-top: 14px; color: var(--pink); }
    @media (max-width: 768px) { .works { grid-template-columns: 1fr; } .id { flex-direction: column; align-items: start; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="plaque">
    <div class="id">
      <div class="ava">北</div>
      <div>
        <h1>顾北</h1>
        <p class="who">北港 3 号灯的守灯人。报文从黄昏开始写。</p>
      </div>
    </div>
    <div class="acts">
      <button class="follow" id="fo" type="button">关注这盏灯</button>
      <button class="mail" id="mail" type="button">写信给岗亭</button>
    </div>
    <div class="works">
      <article class="w"><b>熄灭四十秒</b>昨夜偏北，灯回亮后记下风速。</article>
      <article class="w"><b>潮位手稿</b>给脉镜的原始点，还没描成示波。</article>
      <article class="w"><b>回舱口诀</b>迷航先找 3 号，不要找岸上的霓虹。</article>
    </div>
    <p class="st" id="st"></p>
  </main>
  <script>
    (function () {
      var on = false;
      document.getElementById("fo").addEventListener("click", function () {
        on = !on;
        this.className = "follow" + (on ? " on" : "");
        this.textContent = on ? "已在看这盏灯" : "关注这盏灯";
        document.getElementById("st").textContent = on ? "黄昏报文会送到你的铜线匣。" : "已从守灯名单拿下。";
      });
      document.getElementById("mail").addEventListener("click", function () {
        document.getElementById("st").textContent = "纸条会夹进岗亭门缝。他天亮才回。";
      });
    })();
  </script>
</body>
</html>
