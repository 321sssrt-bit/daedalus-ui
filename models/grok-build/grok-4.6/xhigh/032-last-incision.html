<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>绝刀 · 删库</title>
  <style>
    :root {
      --black: #111;
      --yellow: #f0d000;
      --warn: #111;
      --paper: #fff8c8;
      --mute: #4a4a32;
      --cancel: #fff;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: repeating-linear-gradient(-45deg, #111, #111 16px, #f0d000 16px, #f0d000 32px); color: var(--warn); font: 16px/1.5 "Arial Black", "Arial", "Microsoft YaHei", sans-serif; display: grid; place-items: center; }
    .panel { width: min(560px, 92%); background: var(--paper); padding: 28px 24px; border: 6px solid #111; }
    h1 { margin: 0 0 10px; font-size: 28px; letter-spacing: 0.04em; }
    ul { margin: 0 0 16px; padding-left: 20px; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; font-weight: 400; }
    label { display: block; font-size: 13px; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; font-weight: 400; }
    input { width: 100%; height: 42px; margin-top: 6px; border: 3px solid #111; font: 18px/1 "Segoe UI", sans-serif; padding: 0 10px; }
    .acts { display: flex; gap: 10px; margin-top: 18px; }
    .cancel { flex: 2; height: 52px; background: var(--cancel); border: 4px solid #111; font: 18px/1 inherit; cursor: pointer; }
    .kill { flex: 1; height: 52px; background: #111; color: var(--yellow); border: 0; font: 14px/1 inherit; cursor: pointer; }
    .kill:disabled { background: #7a7a70; color: #ddd; cursor: not-allowed; }
    .msg { margin-top: 12px; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; font-weight: 400; }
    @media (max-width: 768px) { .acts { flex-direction: column-reverse; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="panel">
    <h1>绝刀</h1>
    <p style="font-family:'Segoe UI','Microsoft YaHei',sans-serif;font-weight:400">这一刀下去，整座库不再存在。不是归档，不是停更。</p>
    <ul>
      <li>418 期晚刊校样与订户名册</li>
      <li>货栈三道门未出的票</li>
      <li>铜线匣里未读的报</li>
    </ul>
    <label>输入「整库烧掉」才能举起刀
      <input id="w" autocomplete="off" placeholder="整库烧掉">
    </label>
    <div class="acts">
      <button class="cancel" id="cancel" type="button">放下，回账房</button>
      <button class="kill" id="kill" type="button" disabled>永久删除</button>
    </div>
    <p class="msg" id="msg"></p>
  </main>
  <script>
    var w = document.getElementById("w");
    var kill = document.getElementById("kill");
    w.addEventListener("input", function () { kill.disabled = w.value.trim() !== "整库烧掉"; });
    kill.addEventListener("click", function () {
      document.getElementById("msg").textContent = "刀已落下。这座库在演示里被标记为焚毁，回执 DK-0。";
      kill.disabled = true;
      w.disabled = true;
    });
    document.getElementById("cancel").addEventListener("click", function () {
      w.value = "";
      kill.disabled = true;
      document.getElementById("msg").textContent = "刀收回匣。库还在，账房灯还亮。";
    });
  </script>
</body>
</html>
