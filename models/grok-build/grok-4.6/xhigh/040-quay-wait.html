<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>渡口 · 还在办</title>
  <style>
    :root {
      --fog: #c5d4dc;
      --ink: #1a2830;
      --water: #6a8a96;
      --paper: #eef3f4;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #8aa4ae; display: grid; place-items: center; font: 16px/1.5 "Segoe UI", "PingFang SC", sans-serif; color: var(--ink); }
    .phone { width: 390px; height: 844px; background: linear-gradient(#d7e4e8, var(--fog)); border-radius: 36px; overflow: hidden; display: flex; flex-direction: column; padding: 36px 22px 24px; box-shadow: 0 0 0 10px #6a8088; }
    h1 { font-size: 26px; font-weight: 500; margin: 0 0 8px; }
    .step { background: var(--paper); padding: 16px; margin: 18px 0; }
    .step b { display: block; font-size: 20px; }
    .eta { color: var(--water); }
    .acts { margin-top: auto; display: grid; gap: 8px; }
    button { height: 44px; border: 0; cursor: pointer; font: inherit; }
    .later { background: var(--ink); color: #eef3f4; }
    .cancel { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
    .st { min-height: 22px; }
    @media (max-width: 430px) {
      body { display: block; background: var(--fog); }
      .phone { width: 100%; height: 100vh; border-radius: 0; box-shadow: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="phone">
    <h1>渡口还在办你的票</h1>
    <p>已经交到窗口。不必盯着雾。</p>
    <div class="step">当前步骤<b>窗口盖章</b></div>
    <p class="eta">预计还要 8 分钟。下一班船 19:02。</p>
    <p class="st" id="st"></p>
    <div class="acts">
      <button class="later" id="later" type="button">放到一边</button>
      <button class="cancel" id="cancel" type="button">取消这张申请</button>
    </div>
  </div>
  <script>
    document.getElementById("later").addEventListener("click", function () {
      document.getElementById("st").textContent = "放到晨案队列里。章盖好会往票夹送一张。";
    });
    document.getElementById("cancel").addEventListener("click", function () {
      document.getElementById("st").textContent = "申请已抽回。窗口那张纸作废，席位 7A 释放。";
    });
  </script>
</body>
</html>
