<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>三础 · 选一档</title>
  <style>
    :root {
      --raw: #cfc8bc;
      --slab: #e8e2d6;
      --ink: #1c1a16;
      --mark: #111;
      --rec: #d4552b;
      --mute: #6a645a;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--raw); color: var(--ink); font: 15px/1.45 "Arial Narrow", "Arial", "Microsoft YaHei", sans-serif; }
    header { padding: 36px 24px 10px; text-align: center; }
    h1 { font-size: 42px; letter-spacing: 0.18em; margin: 0; font-weight: 700; text-transform: uppercase; }
    .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; max-width: 1080px; margin: 20px auto 40px; border: 2px solid var(--mark); }
    .p { background: var(--slab); padding: 28px 22px; border-right: 2px solid var(--mark); }
    .p:last-child { border-right: 0; }
    .p.rec { background: #111; color: #e8e2d6; }
    .p h2 { margin: 0 0 8px; font-size: 22px; letter-spacing: 0.12em; }
    .tag { display: inline-block; background: var(--rec); color: #fff; font-size: 12px; padding: 2px 8px; margin-bottom: 10px; }
    ul { padding-left: 18px; min-height: 120px; }
    .price { font-size: 36px; margin: 12px 0; }
    button { height: 42px; width: 100%; border: 2px solid currentColor; background: transparent; color: inherit; cursor: pointer; letter-spacing: 0.1em; }
    .p.rec button { background: var(--rec); border-color: var(--rec); color: #fff; }
    .out { text-align: center; min-height: 24px; }
    @media (max-width: 768px) {
      .row { grid-template-columns: 1fr; }
      .p { border-right: 0; border-bottom: 2px solid var(--mark); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <header>
    <h1>三础</h1>
    <p>混凝土上只立三档。没有第四根柱子。</p>
  </header>
  <div class="row">
    <article class="p">
      <h2>基座</h2>
      <div class="price">¥ 0</div>
      <ul><li>一张晨案</li><li>七天货栈</li><li>无灯塔报文</li></ul>
      <button type="button" data-n="基座">先立住</button>
    </article>
    <article class="p rec">
      <div class="tag">现场在用</div>
      <h2>梁柱</h2>
      <div class="price">¥ 48 / 月</div>
      <ul><li>不限晨案</li><li>货栈三道门</li><li>脉镜按潮</li></ul>
      <button type="button" data-n="梁柱">买下梁柱</button>
    </article>
    <article class="p">
      <h2>殿身</h2>
      <div class="price">面议</div>
      <ul><li>专人值夜</li><li>铜线匣专线</li><li>月令朱批</li></ul>
      <button type="button" data-n="殿身">联系匠人</button>
    </article>
  </div>
  <p class="out" id="out"></p>
  <script>
    document.querySelectorAll("button").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var n = btn.getAttribute("data-n");
        document.getElementById("out").textContent = n === "殿身"
          ? "已写下匠人纸条。三日里会有人来量场地。"
          : "已选定「" + n + "」。收据会进复写帐。";
      });
    });
  </script>
</body>
</html>
