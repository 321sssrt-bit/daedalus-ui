<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>风暴线 · 不通</title>
  <style>
    :root {
      --sky: #1b2430;
      --wire: #d7dde4;
      --flash: #f0e36a;
      --ink: #e8eef4;
      --mute: #8a96a4;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #0c1016; display: grid; place-items: center; font: 16px/1.5 "Segoe UI", "Microsoft YaHei", sans-serif; color: var(--ink); }
    .phone { width: 390px; height: 844px; background: var(--sky); border-radius: 36px; overflow: hidden; display: flex; flex-direction: column; justify-content: center; padding: 28px 22px; box-shadow: 0 0 0 10px #2a3440; }
    .pole { height: 8px; background: var(--wire); margin: 0 0 28px; position: relative; }
    .pole::after { content: ""; position: absolute; right: 20%; top: -10px; width: 2px; height: 28px; background: var(--flash); }
    h1 { margin: 0 0 8px; font-size: 26px; font-weight: 600; }
    .code { color: var(--flash); font-family: Consolas, monospace; margin: 12px 0; }
    button { height: 44px; width: 100%; margin: 6px 0; border: 0; cursor: pointer; font: inherit; }
    .retry { background: var(--flash); color: #1b2430; }
    .home { background: transparent; color: var(--wire); box-shadow: inset 0 0 0 1px var(--wire); }
    .st { min-height: 22px; color: var(--mute); }
    @media (max-width: 430px) {
      body { display: block; background: var(--sky); }
      .phone { width: 100%; height: 100vh; border-radius: 0; box-shadow: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="pole" aria-hidden="true"></div>
    <h1>这条线被风吹断了</h1>
    <p>不是你按错。北港到岸上的铜线现在停着，报文过不去。</p>
    <div class="code">工单 SW-4408</div>
    <button class="retry" id="retry" type="button">再试一次</button>
    <button class="home" id="home" type="button">回晨案首页</button>
    <p class="st" id="st"></p>
  </div>
  <script>
    var n = 0;
    document.getElementById("retry").addEventListener("click", function () {
      n += 1;
      document.getElementById("st").textContent = n === 1
        ? "还是断的。工单已催过一次。"
        : "线仍断。别连点，值夜在修杆。";
    });
    document.getElementById("home").addEventListener("click", function () {
      document.getElementById("st").textContent = "折回晨案。风暴线修好前，报文会堆在匣盖上。";
    });
  </script>
</body>
</html>
