<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>霜许可 · 麦克风</title>
  <style>
    :root {
      --ice: #d7eef4;
      --glass: #f3fbfdcc;
      --ink: #16343c;
      --cyan: #2a7f8c;
      --line: #9ec4cc;
      --fog: #6b8d94;
      --deny: #8a4a3a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 20% 20%, #ffffff 0 12%, transparent 13%),
        linear-gradient(160deg, #b9dce4, #e8f6f8 45%, #c5e2e8);
      color: var(--ink);
      font: 16px/1.55 "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .sheet {
      width: min(520px, 100%);
      background: var(--glass);
      border: 1px solid #ffffffaa;
      box-shadow: 0 20px 50px #16343c22;
      padding: 32px 32px 24px;
      backdrop-filter: blur(10px);
    }
    .mic {
      width: 56px; height: 56px;
      border: 1px solid var(--line);
      border-radius: 50%;
      display: grid; place-items: center;
      color: var(--cyan);
      font-size: 12px;
      letter-spacing: 0.14em;
    }
    h1 { font-size: 26px; margin: 16px 0 8px; font-weight: 600; }
    .why { color: var(--fog); margin: 0 0 20px; }
    .why strong { color: var(--ink); font-weight: 600; }
    .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    button {
      height: 44px;
      border: 0;
      font: 14px/1 inherit;
      cursor: pointer;
    }
    .allow { background: var(--cyan); color: #f3fbfd; }
    .allow:hover { background: #216872; }
    .deny { background: transparent; color: var(--deny); border: 1px solid #d7b2a8; }
    .once { grid-column: 1 / -1; background: #edf7f8; color: var(--ink); border: 1px solid var(--line); }
    .status { min-height: 22px; margin-top: 14px; font-size: 14px; color: var(--cyan); }
    @media (max-width: 768px) {
      .sheet { padding: 24px 18px; }
      .acts { grid-template-columns: 1fr; }
      .once { grid-column: auto; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="sheet">
    <div class="mic">MIC</div>
    <h1>霜台想听这一间的声音</h1>
    <p class="why">要开的是<strong>麦克风</strong>，只为把你和室里另外两个人对上。不录音到云，离开房间即关。</p>
    <div class="acts">
      <button class="allow" id="allow" type="button">允许</button>
      <button class="deny" id="deny" type="button">拒绝</button>
      <button class="once" id="once" type="button">仅此一次，离开就关</button>
    </div>
    <p class="status" id="st">还没有决定。麦是关着的。</p>
  </main>
  <script>
    (function () {
      var st = document.getElementById("st");
      document.getElementById("allow").addEventListener("click", function () {
        st.textContent = "已允许。本机麦打开，指示灯在左上角。可随时在霜台设置里关掉。";
      });
      document.getElementById("deny").addEventListener("click", function () {
        st.textContent = "已拒绝。你仍可看字幕进房，但不能说话。";
      });
      document.getElementById("once").addEventListener("click", function () {
        st.textContent = "仅此一次：进这间房时打开，关页即撤权。";
      });
    })();
  </script>
</body>
</html>
