<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>朱印 · 付印</title>
  <style>
    :root {
      --paper: #f6edd8;
      --ink: #2a1b12;
      --ver: #b42318;
      --mute: #7a6550;
      --back: #fff8e8;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #e8d8b8; color: var(--ink); font: 16px/1.55 "KaiTi", "STKaiti", serif; display: grid; place-items: center; }
    .sheet { width: min(560px, 92%); background: var(--paper); padding: 32px 28px; border: 2px solid var(--ver); }
    h1 { margin: 0 0 8px; color: var(--ver); font-size: 28px; }
    .seal { width: 72px; height: 72px; border: 3px solid var(--ver); color: var(--ver); display: grid; place-items: center; margin: 0 0 16px; }
    label { display: flex; gap: 8px; align-items: start; margin: 16px 0; font-size: 14px; }
    .acts { display: flex; gap: 10px; }
    .back { flex: 1; height: 44px; background: var(--back); border: 1px solid var(--ink); cursor: pointer; font: inherit; }
    .go { flex: 1; height: 44px; background: var(--ver); color: #fff8e8; border: 0; cursor: pointer; font: inherit; }
    .go:disabled { background: #c9a8a4; cursor: not-allowed; }
    .msg { min-height: 22px; margin-top: 12px; }
    @media (max-width: 768px) { .sheet { padding: 22px 16px; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="sheet">
    <div class="seal">印</div>
    <h1>这一下就收不回来</h1>
    <p>付印后，今晚头版会按现在的校样上街。错字、人名、灯塔编号都会变成街上的纸，不能再抽回。</p>
    <label><input id="ok" type="checkbox"> 我看过校样，愿意盖这方朱印。</label>
    <div class="acts">
      <button class="back" id="back" type="button">退回校样</button>
      <button class="go" id="go" type="button" disabled>盖印付印</button>
    </div>
    <p class="msg" id="msg"></p>
  </main>
  <script>
    var box = document.getElementById("ok");
    var go = document.getElementById("go");
    box.addEventListener("change", function () { go.disabled = !box.checked; });
    go.addEventListener("click", function () {
      document.getElementById("msg").textContent = "印已下去。第 418 期开始付印，校样锁死。";
      go.disabled = true;
      box.disabled = true;
    });
    document.getElementById("back").addEventListener("click", function () {
      document.getElementById("msg").textContent = "退回校样台。朱印未盖，街上还没有这张纸。";
    });
  </script>
</body>
</html>
