<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>牛皮夹 · 自己</title>
  <style>
    :root {
      --manila: #e6c98a;
      --tab: #d7b66a;
      --ink: #2a2114;
      --paper: #f7edd4;
      --line: #c4a46a;
      --mute: #7a6540;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: #c9b07a; color: var(--ink); font: 15px/1.5 "Segoe UI", "Microsoft YaHei", sans-serif; }
    .folder { max-width: 880px; margin: 28px auto; background: var(--manila); padding: 0 0 20px; box-shadow: 8px 8px 0 #8a6a32; }
    .id { display: flex; justify-content: space-between; padding: 20px 24px; background: var(--tab); }
    .id h1 { margin: 0; font-size: 22px; }
    .group { margin: 12px 24px; background: var(--paper); }
    .group h2 { margin: 0; padding: 10px 14px; font-size: 14px; letter-spacing: 0.12em; background: #efe0b8; }
    .row { display: flex; justify-content: space-between; padding: 12px 14px; border-top: 1px solid var(--line); cursor: pointer; }
    .row:hover { background: #fff8e4; }
    .detail { display: none; padding: 0 14px 12px; color: var(--mute); font-size: 14px; }
    .row.open + .detail { display: block; }
    @media (max-width: 768px) { .folder { margin: 0; box-shadow: none; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="folder">
    <div class="id">
      <div>
        <h1>陈衡</h1>
        <div>晚刊订户 · 编号 418</div>
      </div>
      <div>夹脊：自己</div>
    </div>
    <section class="group">
      <h2>身份</h2>
      <div class="row">显示名</div>
      <div class="detail">现用「晚读人·陈衡」。改名次日头版才换。</div>
      <div class="row">报馆编号</div>
      <div class="detail">418。不能改，丢了走火漆信。</div>
    </section>
    <section class="group">
      <h2>安全</h2>
      <div class="row">口令</div>
      <div class="detail">上次换在上月。想换就走火漆信，不在这页明文改。</div>
      <div class="row">巡号设备</div>
      <div class="detail">绑在七号岗铜盒。解绑要值夜编辑签字。</div>
    </section>
    <section class="group">
      <h2>通知</h2>
      <div class="row">铜线匣</div>
      <div class="detail">未读黄线开着。夜间报文仍会响一次。</div>
      <div class="row">票夹</div>
      <div class="detail">系统票默认展开。人工票要自己翻。</div>
    </section>
  </main>
  <script>
    document.querySelectorAll(".row").forEach(function (row) {
      row.addEventListener("click", function () {
        row.classList.toggle("open");
      });
    });
  </script>
</body>
</html>
