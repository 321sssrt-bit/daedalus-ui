<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>一枝 · 晚香玉</title>
  <style>
    :root {
      --blush: #f3c7c0;
      --petal: #fff6f2;
      --ink: #4a2a2a;
      --stem: #3d5a3a;
      --price: #9a2a32;
      --mute: #8a6a66;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--blush); color: var(--ink); font: 16px/1.55 Georgia, "Noto Serif SC", serif; }
    .wrap { max-width: 1080px; margin: 0 auto; min-height: 100vh; display: grid; grid-template-columns: 1.1fr 0.9fr; }
    .viz {
      background:
        radial-gradient(circle at 50% 42%, #fff 0 12%, transparent 13%),
        linear-gradient(#f7d4ce, #e8b2ad);
      display: grid; place-items: center;
    }
    .flower { width: 220px; height: 320px; background: linear-gradient(#fff, #f7c8c2); border-radius: 120px 120px 40px 40px; box-shadow: 0 20px 0 #3d5a3a22; }
    .buy { padding: 48px 40px; background: var(--petal); }
    .shop { letter-spacing: 0.2em; font-size: 12px; color: var(--mute); }
    h1 { font-size: 40px; font-weight: 500; margin: 8px 0; }
    .price { font-size: 28px; color: var(--price); }
    .opts { display: flex; gap: 8px; margin: 18px 0; flex-wrap: wrap; }
    .opts button { height: 36px; padding: 0 12px; border: 1px solid var(--ink); background: transparent; cursor: pointer; font: inherit; }
    .opts button.on { background: var(--ink); color: var(--petal); }
    .go { height: 48px; width: 100%; border: 0; background: var(--price); color: #fff6f2; font: 16px inherit; cursor: pointer; }
    .go:hover { background: #7d1e26; }
    .note { min-height: 24px; color: var(--stem); margin-top: 12px; }
    @media (max-width: 768px) { .wrap { grid-template-columns: 1fr; } .viz { min-height: 240px; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <aside class="viz"><div class="flower" aria-hidden="true"></div></aside>
    <main class="buy">
      <div class="shop">一枝花店</div>
      <h1>晚香玉单枝</h1>
      <div class="price" id="price">¥ 48</div>
      <p>只卖一枝。纸套是旧乐谱，绳子是湿的亚麻。适合今晚就插进窄瓶。</p>
      <div>规格</div>
      <div class="opts" id="opts">
        <button class="on" data-p="48" type="button">单蕾</button>
        <button data-p="62" type="button">双蕾</button>
        <button data-p="86" type="button">带叶</button>
      </div>
      <button class="go" id="go" type="button">买下这一枝</button>
      <p class="note" id="note"></p>
    </main>
  </div>
  <script>
    (function () {
      var spec = "单蕾";
      document.getElementById("opts").addEventListener("click", function (event) {
        var btn = event.target.closest("button");
        if (!btn) return;
        document.querySelectorAll("#opts button").forEach(function (b) { b.className = ""; });
        btn.className = "on";
        spec = btn.textContent;
        document.getElementById("price").textContent = "¥ " + btn.getAttribute("data-p");
      });
      document.getElementById("go").addEventListener("click", function () {
        document.getElementById("note").textContent = spec + "已包好。纸套编号 18，傍晚前来取。";
      });
    })();
  </script>
</body>
</html>
