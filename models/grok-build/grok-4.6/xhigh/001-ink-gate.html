<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>墨闸晚刊 · 入闸</title>
  <style>
    :root {
      --page: #f3ead3;
      --ink: #1b1712;
      --cinnabar: #9c2b1a;
      --muted: #7a7264;
      --rule: #d7c8a6;
      --moss: #2f3a28;
      --paper: #fff8e8;
      --seal: #c44a2d;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 12% 18%, #fff6df 0 18%, transparent 19%),
        repeating-linear-gradient(0deg, transparent, transparent 27px, #e8dcbd 28px),
        var(--page);
      color: var(--ink);
      font: 16px/1.5 "Palatino Linotype", Palatino, "Songti SC", "STSong", "SimSun", serif;
    }
    .stage {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 420px minmax(0, 1fr);
      max-width: 1280px;
      margin: 0 auto;
    }
    .mast {
      padding: 48px 36px;
      border-right: 1px solid var(--ink);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: linear-gradient(180deg, #efe2c4 0%, #f3ead3 55%, #e7d7b2 100%);
    }
    .brand-en { letter-spacing: 0.28em; font-size: 11px; color: var(--cinnabar); text-transform: uppercase; }
    .brand-cn {
      writing-mode: vertical-rl;
      font-size: 64px;
      line-height: 1;
      letter-spacing: 0.18em;
      margin: 28px 0 0;
      font-weight: 700;
    }
    .issue { color: var(--muted); font-size: 13px; }
    .issue strong { display: block; color: var(--ink); font-size: 18px; margin-top: 6px; }
    .sheet {
      display: grid;
      place-items: center;
      padding: 48px 32px;
    }
    form {
      width: min(440px, 100%);
      background: var(--paper);
      border: 1px solid var(--ink);
      padding: 36px 32px 28px;
      box-shadow: 10px 10px 0 var(--moss);
    }
    h1 { margin: 0 0 6px; font-size: 28px; letter-spacing: 0.08em; }
    .lede { margin: 0 0 24px; color: var(--muted); font-size: 14px; }
    label { display: block; font-size: 13px; margin: 14px 0 6px; }
    input[type="text"], input[type="password"] {
      width: 100%;
      height: 44px;
      border: 1px solid var(--ink);
      background: #fffdf6;
      padding: 0 12px;
      font: inherit;
      color: inherit;
    }
    input:focus { outline: 2px solid var(--cinnabar); outline-offset: 2px; }
    .pass-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
    .ghost {
      height: 44px;
      border: 1px solid var(--ink);
      background: transparent;
      padding: 0 12px;
      font: 13px/1 inherit;
      cursor: pointer;
    }
    .ghost:hover { background: #f0e6cc; }
    .row { display: flex; justify-content: space-between; align-items: center; margin: 16px 0 22px; font-size: 13px; }
    .link { background: none; border: 0; color: var(--cinnabar); cursor: pointer; font: inherit; text-decoration: underline; padding: 0; }
    .link:focus-visible { outline: 2px solid var(--cinnabar); }
    button.enter {
      width: 100%;
      height: 48px;
      border: 0;
      background: var(--cinnabar);
      color: #fff8e8;
      font: 700 16px/1 inherit;
      letter-spacing: 0.18em;
      cursor: pointer;
    }
    button.enter:hover { background: var(--seal); }
    button.enter:disabled { background: #b7aea0; cursor: not-allowed; }
    .hint, .err, .ok {
      min-height: 22px;
      margin: 12px 0 0;
      font-size: 13px;
    }
    .err { color: var(--cinnabar); }
    .ok { color: var(--moss); }
    .hint { color: var(--muted); }
    @media (max-width: 768px) {
      .stage { grid-template-columns: 1fr; }
      .mast { min-height: 180px; border-right: 0; border-bottom: 1px solid var(--ink); }
      .brand-cn { writing-mode: horizontal-tb; font-size: 40px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="stage">
    <aside class="mast">
      <div>
        <div class="brand-en">Ink Gate Evening</div>
        <div class="brand-cn">墨闸晚刊</div>
      </div>
      <div class="issue">第 418 期 · 戊夜付印<strong>旧读者从这里入闸</strong></div>
    </aside>
    <main class="sheet">
      <form id="gate" novalidate>
        <h1>入闸</h1>
        <p class="lede">用订户名或报馆编号，核对后进入今晚的版面。</p>
        <label for="account">订户名 / 报馆编号</label>
        <input id="account" name="account" type="text" autocomplete="username" value="晚读人·陈衡">
        <label for="secret">口令或取报暗号</label>
        <div class="pass-row">
          <input id="secret" name="secret" type="password" autocomplete="current-password" value="******">
          <button class="ghost" id="toggle" type="button">显形</button>
        </div>
        <div class="row">
          <span>今日只核一次</span>
          <button class="link" id="forgot" type="button">找不到口令</button>
        </div>
        <button class="enter" id="enter" type="submit">进入晚刊</button>
        <p class="hint" id="note"></p>
      </form>
    </main>
  </div>
  <script>
    (function () {
      var secret = document.getElementById("secret");
      var toggle = document.getElementById("toggle");
      var note = document.getElementById("note");
      var shown = false;
      toggle.addEventListener("click", function () {
        shown = !shown;
        secret.type = shown ? "text" : "password";
        toggle.textContent = shown ? "隐去" : "显形";
      });
      document.getElementById("forgot").addEventListener("click", function () {
        note.className = "hint";
        note.textContent = "把订户名写给值夜编辑，或改走「失匙信」通道重开闸口。";
      });
      document.getElementById("gate").addEventListener("submit", function (event) {
        event.preventDefault();
        var account = document.getElementById("account").value.trim();
        var pass = secret.value.trim();
        if (!account || !pass) {
          note.className = "err";
          note.textContent = "闸口还缺一项。订户名和口令都要有。";
          return;
        }
        note.className = "ok";
        note.textContent = "核过了。正在把你送进今晚头版。";
      });
    })();
  </script>
</body>
</html>
