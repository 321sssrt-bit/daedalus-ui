<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>磁带舱 · 正在听</title>
  <style>
    :root {
      --orange: #e07a3d;
      --cabin: #2a2018;
      --cream: #f3e2c8;
      --ink: #f3e2c8;
      --mute: #b89a78;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #1a120c; display: grid; place-items: center; font: 15px/1.45 "Trebuchet MS", "Microsoft YaHei", sans-serif; color: var(--ink); }
    .phone { width: 390px; height: 844px; background: var(--cabin); border-radius: 36px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 0 0 10px #3a2818; }
    .art { height: 320px; margin: 36px 36px 12px; background: linear-gradient(#f0a060, var(--orange)); display: grid; place-items: center; color: #2a2018; font-size: 22px; letter-spacing: 0.2em; }
    h1 { margin: 0 24px 4px; font-size: 24px; }
    .who { margin: 0 24px 16px; color: var(--mute); }
    .bar { margin: 0 24px; height: 6px; background: #4a3828; }
    .bar i { display: block; height: 6px; width: 34%; background: var(--orange); }
    .time { display: flex; justify-content: space-between; margin: 6px 24px 20px; color: var(--mute); font-size: 12px; }
    .ctr { display: flex; justify-content: center; gap: 16px; }
    .ctr button { width: 64px; height: 64px; border: 0; background: var(--orange); color: #2a2018; font: 700 14px inherit; cursor: pointer; }
    .ctr button.ghost { background: transparent; color: var(--cream); box-shadow: inset 0 0 0 1px #b89a78; }
    @media (max-width: 430px) {
      body { display: block; background: var(--cabin); }
      .phone { width: 100%; height: 100vh; border-radius: 0; box-shadow: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="art" id="art">A 面</div>
    <h1 id="title">北港夜航</h1>
    <p class="who">顾北 · 口述磁带</p>
    <div class="bar"><i id="fill"></i></div>
    <div class="time"><span id="cur">01:12</span><span>03:28</span></div>
    <div class="ctr">
      <button class="ghost" id="next" type="button">下一首</button>
      <button id="pp" type="button">暂停</button>
    </div>
  </div>
  <script>
    (function () {
      var playing = true;
      var tracks = [
        { t: "北港夜航", a: "A 面", p: "34%" },
        { t: "绛席散场", a: "B 面", p: "12%" }
      ];
      var i = 0;
      document.getElementById("pp").addEventListener("click", function () {
        playing = !playing;
        this.textContent = playing ? "暂停" : "播放";
      });
      document.getElementById("next").addEventListener("click", function () {
        i = (i + 1) % tracks.length;
        document.getElementById("title").textContent = tracks[i].t;
        document.getElementById("art").textContent = tracks[i].a;
        document.getElementById("fill").style.width = tracks[i].p;
        document.getElementById("cur").textContent = i ? "00:22" : "01:12";
        playing = true;
        document.getElementById("pp").textContent = "暂停";
      });
    })();
  </script>
</body>
</html>
