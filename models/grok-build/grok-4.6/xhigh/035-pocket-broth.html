<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>口袋汤 · 详情</title>
  <style>
    :root {
      --paper: #f7efe0;
      --ink: #3a2a1c;
      --broth: #c45b2a;
      --leaf: #3d5a3a;
      --mute: #8a7058;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #5a4030; display: grid; place-items: center; font: 16px/1.6 Georgia, "Songti SC", serif; color: var(--ink); }
    .phone { width: 390px; height: 844px; background: var(--paper); border-radius: 36px; overflow: auto; box-shadow: 0 0 0 10px #3a281c; padding: 28px 22px 80px; }
    h1 { font-size: 28px; margin: 0 0 8px; }
    .adj { display: flex; align-items: center; gap: 10px; margin: 16px 0; }
    .adj button { width: 36px; height: 36px; border: 1px solid var(--ink); background: #fff; cursor: pointer; }
    .body { white-space: pre-wrap; }
    .save { position: sticky; bottom: 16px; width: 100%; height: 44px; border: 0; background: var(--broth); color: #fff8ee; cursor: pointer; font: inherit; }
    .st { color: var(--leaf); min-height: 22px; }
    @media (max-width: 430px) {
      body { display: block; background: var(--paper); }
      .phone { width: 100%; height: 100vh; border-radius: 0; box-shadow: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="phone">
    <h1>北港鱼汤</h1>
    <p style="color:#8a7058">口袋食谱 · 顾北口述</p>
    <div class="adj">份数 <button type="button" id="m">-</button><b id="n">2</b><button type="button" id="p">+</button></div>
    <div class="body" id="body"></div>
    <p class="st" id="st"></p>
    <button class="save" id="save" type="button">收藏进软木匣</button>
  </div>
  <script>
    (function () {
      var n = 2;
      function draw() {
        document.getElementById("n").textContent = String(n);
        document.getElementById("body").textContent = "水 " + (400 * n) + " ml\n小鱼 " + n + " 尾\n姜 两片\n盐 一撮\n\n汤开后改文火。灯塔夜班只喝这一碗。";
      }
      document.getElementById("m").addEventListener("click", function () { n = Math.max(1, n - 1); draw(); });
      document.getElementById("p").addEventListener("click", function () { n += 1; draw(); });
      document.getElementById("save").addEventListener("click", function () {
        document.getElementById("st").textContent = "已按 " + n + " 人份钉在软木匣「货」类。";
      });
      draw();
    })();
  </script>
</body>
</html>
