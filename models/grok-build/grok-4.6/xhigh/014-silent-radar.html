<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>静雷达 · 无回波</title>
  <style>
    :root {
      --deep: #04140f;
      --green: #39d98a;
      --dim: #1b3d2e;
      --fog: #8bbfa6;
      --alert: #d7e36a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--deep); color: var(--green);
      font: 15px/1.5 "Cascadia Mono", Consolas, monospace;
      display: grid; place-items: center;
    }
    .scope { width: min(720px, 92%); text-align: center; }
    .ring {
      width: 220px; height: 220px; margin: 0 auto 22px;
      border: 2px solid var(--dim);
      border-radius: 50%;
      box-shadow: inset 0 0 0 24px #072017, inset 0 0 0 25px #1b3d2e;
      display: grid; place-items: center;
    }
    .q {
      display: flex; gap: 8px; justify-content: center;
    }
    input {
      width: min(360px, 70%); height: 42px; background: #072017; color: var(--green);
      border: 1px solid var(--green); padding: 0 12px; font: inherit;
    }
    input:focus { outline: 2px solid var(--alert); }
    button { height: 42px; background: var(--green); color: var(--deep); border: 0; padding: 0 14px; font: 700 13px inherit; cursor: pointer; }
    h1 { font-size: 22px; margin: 8px 0; }
    .empty { color: var(--fog); }
    .sug { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
    .sug button { background: transparent; color: var(--alert); border: 1px dashed var(--alert); }
    @media (max-width: 768px) {
      .ring { width: 160px; height: 160px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="scope">
    <div class="ring">无回波</div>
    <div class="q">
      <input id="q" value="绛席 外卖">
      <button type="button" id="go">再探一次</button>
    </div>
    <h1>「<span id="shown">绛席 外卖</span>」没有回波</h1>
    <p class="empty">声呐转了一圈，海面只有自己的噪声。这个词还留在探头上，没有被清掉。</p>
    <div class="sug">
      <button type="button" data-s="绛席 夜宴">改探：绛席 夜宴</button>
      <button type="button" data-s="北港 灯塔">改探：北港 灯塔</button>
    </div>
  </main>
  <script>
    (function () {
      function apply(v) {
        document.getElementById("q").value = v;
        document.getElementById("shown").textContent = v;
      }
      document.getElementById("go").addEventListener("click", function () {
        apply(document.getElementById("q").value.trim() || "（空）");
      });
      document.querySelectorAll(".sug button").forEach(function (btn) {
        btn.addEventListener("click", function () { apply(btn.getAttribute("data-s")); });
      });
    })();
  </script>
</body>
</html>
