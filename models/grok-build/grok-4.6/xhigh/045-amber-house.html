<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>琥珀馆 · 在播</title>
  <style>
    :root {
      --dark: #140c08;
      --amber: #d48a2a;
      --gold: #f0c36a;
      --panel: #24180e;
      --ink: #f3e2c4;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--dark); color: var(--ink); font: 15px/1.45 "Segoe UI", "Microsoft YaHei", sans-serif; }
    .app { display: grid; grid-template-columns: 280px 1fr; min-height: 100vh; }
    aside { background: #1b120c; padding: 18px 14px; }
    .item { padding: 10px; cursor: pointer; border-left: 3px solid transparent; }
    .item.on { border-left-color: var(--amber); background: var(--panel); }
    main { padding: 20px 24px; }
    .screen { height: 280px; background: radial-gradient(circle at 50% 40%, #8a4a14, #1a0e08); display: grid; place-items: center; font-size: 28px; color: var(--gold); }
    .ctr { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
    button { height: 36px; padding: 0 12px; border: 0; background: var(--amber); color: #140c08; cursor: pointer; }
    button.ghost { background: transparent; color: var(--gold); box-shadow: inset 0 0 0 1px var(--amber); }
    input[type="range"] { width: 220px; }
    .st { margin-top: 10px; color: var(--gold); min-height: 24px; }
    @media (max-width: 768px) { .app { grid-template-columns: 1fr; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside id="list"></aside>
    <main>
      <h1 id="title">琥珀馆</h1>
      <div class="screen" id="sc">选择一条开始</div>
      <div class="ctr">
        <button id="pp" type="button">播放</button>
        <button class="ghost" id="next" type="button">下一条</button>
        <label>进度 <input id="seek" type="range" min="0" max="100" value="0"></label>
        <button class="ghost" id="save" type="button">保存播放状态</button>
        <button class="ghost" id="cut" type="button">模拟断网</button>
        <button class="ghost" id="re" type="button">重新连接</button>
      </div>
      <p class="st" id="st">未在播。</p>
    </main>
  </div>
  <script>
    (function () {
      var items = ["北港夜航（口述）", "开窑那一夜", "绛席散场录音"];
      var i = 0;
      var pos = 0;
      var playing = false;
      var cut = false;
      var saved = null;
      var list = document.getElementById("list");
      items.forEach(function (n, idx) {
        var el = document.createElement("div");
        el.className = "item" + (idx === 0 ? " on" : "");
        el.textContent = n;
        el.addEventListener("click", function () {
          i = idx; pos = 0; playing = true; cut = false;
          document.querySelectorAll(".item").forEach(function (x, j) { x.className = "item" + (j === i ? " on" : ""); });
          paint();
        });
        list.appendChild(el);
      });
      function paint() {
        document.getElementById("title").textContent = items[i];
        document.getElementById("sc").textContent = cut ? "信号断了" : (playing ? "播放中 " + pos + "%" : "暂停 " + pos + "%");
        document.getElementById("seek").value = String(pos);
        document.getElementById("pp").textContent = playing ? "暂停" : "播放";
        document.getElementById("st").textContent = cut
          ? "网络中断。进度停在 " + pos + "%，没有清掉。"
          : ("当前：" + items[i] + " · " + pos + "%" + (saved ? " · 已存档 " + saved.pos + "%" : ""));
      }
      document.getElementById("pp").addEventListener("click", function () {
        if (cut) return;
        playing = !playing;
        if (playing && pos < 100) pos = Math.min(100, pos + 8);
        paint();
      });
      document.getElementById("next").addEventListener("click", function () {
        if (cut) return;
        i = (i + 1) % items.length;
        pos = 0; playing = true;
        document.querySelectorAll(".item").forEach(function (x, j) { x.className = "item" + (j === i ? " on" : ""); });
        paint();
      });
      document.getElementById("seek").addEventListener("input", function () {
        if (cut) { this.value = String(pos); return; }
        pos = Number(this.value);
        paint();
      });
      document.getElementById("save").addEventListener("click", function () {
        saved = { i: i, pos: pos };
        document.getElementById("st").textContent = "已保存：" + items[i] + " @ " + pos + "%";
      });
      document.getElementById("cut").addEventListener("click", function () {
        cut = true; playing = false; paint();
      });
      document.getElementById("re").addEventListener("click", function () {
        if (!cut) { document.getElementById("st").textContent = "线本来就是通的。"; return; }
        cut = false; playing = true; paint();
        document.getElementById("st").textContent = "已重连，从 " + pos + "% 继续。";
      });
      paint();
    })();
  </script>
</body>
</html>
