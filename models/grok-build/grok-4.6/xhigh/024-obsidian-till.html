<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>黑金柜 · 结账</title>
  <style>
    :root {
      --black: #0d0d0f;
      --gold: #d4b46a;
      --slab: #17171c;
      --ink: #f3ead4;
      --mute: #9a8b6a;
      --line: #2a2a32;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 20% 0, #2a2418, var(--black)); color: var(--ink); font: 15px/1.5 "Palatino Linotype", Palatino, "Songti SC", serif; }
    .till { max-width: 920px; margin: 0 auto; padding: 36px 24px; display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 24px; }
    h1 { margin: 0 0 16px; letter-spacing: 0.18em; color: var(--gold); }
    .sum { background: var(--slab); padding: 20px; border: 1px solid var(--line); }
    .row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--line); }
    .amt { font-size: 36px; color: var(--gold); margin: 14px 0 0; }
    .pay label { display: block; padding: 12px; border: 1px solid var(--line); margin: 0 0 8px; cursor: pointer; }
    .pay label.on { border-color: var(--gold); }
    .go { height: 48px; width: 100%; border: 0; background: var(--gold); color: #14110a; letter-spacing: 0.16em; font: 700 15px inherit; cursor: pointer; }
    .go:hover { background: #e4c882; }
    .ok { display: none; margin-top: 12px; color: var(--gold); }
    @media (max-width: 768px) { .till { grid-template-columns: 1fr; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="till">
    <section class="sum">
      <h1>黑金柜</h1>
      <div class="row"><span>青苔石皂 ×2</span><span>¥ 56</span></div>
      <div class="row"><span>晚香玉单蕾</span><span>¥ 48</span></div>
      <div class="row"><span>溪石镇纸 ×3</span><span>¥ 135</span></div>
      <div class="amt">应付 ¥ 239</div>
      <p style="color:#9a8b6a">木箱已封。付钱之前再看一眼。</p>
    </section>
    <section class="pay">
      <p>付款方式</p>
      <label class="on"><input type="radio" name="p" value="金条" checked> 柜内金条划账</label>
      <label><input type="radio" name="p" value="铜钱"> 铜钱袋（现场点）</label>
      <button class="go" id="go" type="button">确认支付</button>
      <p class="ok" id="ok">金柜收下了。回执号 BK-239，可到复写帐下载。</p>
    </section>
  </div>
  <script>
    document.querySelectorAll(".pay label").forEach(function (lab) {
      lab.addEventListener("click", function () {
        document.querySelectorAll(".pay label").forEach(function (l) { l.className = ""; });
        lab.className = "on";
      });
    });
    document.getElementById("go").addEventListener("click", function () {
      var way = document.querySelector("input[name=p]:checked").value;
      var ok = document.getElementById("ok");
      ok.style.display = "block";
      ok.textContent = "金柜收下了（" + way + "）。回执号 BK-239，可到复写帐下载。";
    });
  </script>
</body>
</html>
