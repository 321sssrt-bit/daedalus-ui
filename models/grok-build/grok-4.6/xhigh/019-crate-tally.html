<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>木箱帐 · 已挑的货</title>
  <style>
    :root {
      --wood: #6b4226;
      --crate: #e8d3b0;
      --ink: #24180f;
      --stencil: #1d2c4a;
      --sum: #8b1e1e;
      --line: #c4a57a;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: #4a2e1a; color: var(--ink); font: 15px/1.45 "Trebuchet MS", "Microsoft YaHei", sans-serif; }
    .box { max-width: 860px; margin: 28px auto; background: var(--crate); padding: 24px 24px 20px; box-shadow: inset 0 0 0 6px #5a351c, 0 0 0 2px #d8c09a; }
    h1 { margin: 0 0 6px; letter-spacing: 0.14em; color: var(--stencil); }
    table { width: 100%; border-collapse: collapse; }
    th, td { border-bottom: 1px dashed var(--line); padding: 10px 6px; text-align: left; }
    .qty { display: flex; gap: 6px; align-items: center; }
    .qty button { width: 28px; height: 28px; border: 1px solid var(--stencil); background: #fff; cursor: pointer; }
    .del { border: 0; background: none; color: var(--sum); text-decoration: underline; cursor: pointer; }
    footer { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; }
    .total { font-size: 28px; color: var(--sum); }
    .pay { height: 44px; padding: 0 18px; background: var(--stencil); color: #f3e6cf; border: 0; cursor: pointer; }
    .pay:disabled { background: #9a8a74; }
    .msg { margin-top: 10px; min-height: 20px; }
    @media (max-width: 768px) {
      .box { margin: 12px; }
      footer { flex-direction: column; align-items: start; gap: 10px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="box">
    <h1>木箱帐</h1>
    <p>已经挑进木箱的货。改数量，合计跟着走。</p>
    <table>
      <thead><tr><th>货</th><th>单价</th><th>件</th><th>行合计</th><th></th></tr></thead>
      <tbody id="tb"></tbody>
    </table>
    <footer>
      <div>箱合计 <span class="total" id="sum">¥ 0</span></div>
      <button class="pay" id="pay" type="button">去结算</button>
    </footer>
    <p class="msg" id="msg"></p>
  </main>
  <script>
    (function () {
      var items = [
        { n: "青苔石皂", p: 28, q: 2 },
        { n: "晚香玉单蕾", p: 48, q: 1 },
        { n: "溪石镇纸", p: 45, q: 3 }
      ];
      function draw() {
        var tb = document.getElementById("tb");
        tb.innerHTML = "";
        var total = 0;
        items.forEach(function (it, i) {
          var line = it.p * it.q;
          total += line;
          var tr = document.createElement("tr");
          tr.innerHTML = "<td>" + it.n + "</td><td>¥ " + it.p + "</td><td class=\"qty\"><button type=\"button\" data-i=\"" + i + "\" data-d=\"-1\">-</button><span>" + it.q + "</span><button type=\"button\" data-i=\"" + i + "\" data-d=\"1\">+</button></td><td>¥ " + line + "</td><td><button class=\"del\" type=\"button\" data-x=\"" + i + "\">卸下</button></td>";
          tb.appendChild(tr);
        });
        document.getElementById("sum").textContent = "¥ " + total;
        document.getElementById("pay").disabled = items.length === 0;
      }
      document.getElementById("tb").addEventListener("click", function (event) {
        var btn = event.target.closest("button");
        if (!btn) return;
        if (btn.hasAttribute("data-x")) {
          items.splice(Number(btn.getAttribute("data-x")), 1);
        } else {
          var it = items[Number(btn.getAttribute("data-i"))];
          it.q = Math.max(1, it.q + Number(btn.getAttribute("data-d")));
        }
        draw();
      });
      document.getElementById("pay").addEventListener("click", function () {
        document.getElementById("msg").textContent = "木箱已封，转到黑金柜结账。合计 " + document.getElementById("sum").textContent + "。";
      });
      draw();
    })();
  </script>
</body>
</html>
