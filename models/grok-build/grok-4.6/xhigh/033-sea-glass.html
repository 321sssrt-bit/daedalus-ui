<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>海玻璃 · 钱包</title>
  <style>
    :root {
      --foam: #e7f4f2;
      --glass: #7fb8b0;
      --deep: #163a3a;
      --ink: #12302e;
      --coin: #d7c27a;
      --mute: #5a7a76;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #0e2424; display: grid; place-items: center; font: 15px/1.45 "Segoe UI", "PingFang SC", sans-serif; color: var(--ink); }
    .phone { width: 390px; height: 844px; background: linear-gradient(#bfe3dc, var(--foam)); border-radius: 36px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 0 0 10px #1a3333; }
    header { padding: 28px 22px 8px; }
    .bal { font-size: 40px; margin: 8px 0 0; }
    .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 22px; }
    .acts button { height: 44px; border: 0; background: var(--deep); color: var(--foam); cursor: pointer; }
    .list { flex: 1; overflow: auto; padding: 16px 22px; }
    .tx { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #c5ddd8; }
    .tab { display: grid; grid-template-columns: repeat(3, 1fr); height: 64px; background: #d5ebe6; }
    .tab button { border: 0; background: transparent; color: var(--mute); cursor: pointer; }
    .tab button.on { color: var(--deep); font-weight: 700; }
    .toast { min-height: 20px; padding: 0 22px; color: var(--deep); font-size: 13px; }
    @media (max-width: 430px) {
      body { display: block; background: #bfe3dc; }
      .phone { width: 100%; height: 100vh; border-radius: 0; box-shadow: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="phone">
    <header>
      <div>海玻璃</div>
      <div class="bal">¥ 328.60</div>
      <div style="color:#5a7a76">可用余额 · 潮汐零钱</div>
    </header>
    <div class="acts">
      <button type="button" id="out">转出</button>
      <button type="button" id="in">收款码</button>
    </div>
    <p class="toast" id="t"></p>
    <div class="list">
      <div class="tx"><span>青石集布袋</span><span>- ¥ 86.00</span></div>
      <div class="tx"><span>灯塔津贴</span><span>+ ¥ 120.00</span></div>
      <div class="tx"><span>绛席份子</span><span>- ¥ 48.00</span></div>
      <div class="tx"><span>退回铜钱</span><span>+ ¥ 12.60</span></div>
    </div>
    <nav class="tab">
      <button class="on" type="button">钱包</button>
      <button type="button">流水</button>
      <button type="button">我的</button>
    </nav>
  </div>
  <script>
    document.getElementById("out").addEventListener("click", function () {
      document.getElementById("t").textContent = "转出去青苔钱包。本页只把入口打开。";
    });
    document.getElementById("in").addEventListener("click", function () {
      document.getElementById("t").textContent = "收款码：HG-328。给别人看这块海玻璃即可。";
    });
    document.querySelectorAll(".tab button").forEach(function (btn) {
      btn.addEventListener("click", function () {
        document.querySelectorAll(".tab button").forEach(function (b) { b.className = ""; });
        btn.className = "on";
      });
    });
  </script>
</body>
</html>
