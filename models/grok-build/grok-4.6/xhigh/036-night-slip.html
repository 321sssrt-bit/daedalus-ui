<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>夜笺 · 写一封</title>
  <style>
    :root {
      --night: #1a1224;
      --paper: #2a1f38;
      --ink: #f0e4ff;
      --lilac: #b48ad4;
      --mute: #8a7498;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #0c0812; display: grid; place-items: center; font: 16px/1.55 "Segoe UI", "PingFang SC", sans-serif; color: var(--ink); }
    .phone { width: 390px; height: 844px; background: var(--night); border-radius: 36px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 0 0 10px #2a1838; padding: 24px 18px 16px; }
    input, textarea { width: 100%; background: var(--paper); color: var(--ink); border: 0; font: inherit; padding: 10px; }
    input { height: 44px; margin-bottom: 10px; }
    textarea { flex: 1; resize: none; min-height: 280px; }
    .meta { display: flex; justify-content: space-between; color: var(--mute); font-size: 13px; margin: 8px 0; }
    .row { display: flex; gap: 8px; }
    button { height: 44px; flex: 1; border: 0; cursor: pointer; font: inherit; }
    .pub { background: var(--lilac); color: #1a1224; }
    .draft { background: transparent; color: var(--lilac); box-shadow: inset 0 0 0 1px var(--lilac); }
    .st { min-height: 22px; color: var(--lilac); font-size: 13px; }
    @media (max-width: 430px) {
      body { display: block; background: var(--night); }
      .phone { width: 100%; height: 100vh; border-radius: 0; box-shadow: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="phone">
    <input id="t" value="给灯塔的回信">
    <textarea id="b">顾北：三号灯那四十秒，岸上也看见了。不要道歉。</textarea>
    <div class="meta"><span id="cnt"></span><span id="state">未发</span></div>
    <p class="st" id="st"></p>
    <div class="row">
      <button class="draft" id="dr" type="button">存草稿</button>
      <button class="pub" id="pub" type="button">发布</button>
    </div>
  </div>
  <script>
    function count() {
      var n = document.getElementById("b").value.length;
      document.getElementById("cnt").textContent = n + " 字";
    }
    document.getElementById("b").addEventListener("input", count);
    document.getElementById("dr").addEventListener("click", function () {
      document.getElementById("state").textContent = "草稿";
      document.getElementById("st").textContent = "夹进夜笺第三格。未发出。";
    });
    document.getElementById("pub").addEventListener("click", function () {
      if (!document.getElementById("t").value.trim() || !document.getElementById("b").value.trim()) {
        document.getElementById("st").textContent = "空笺不能寄出。";
        return;
      }
      document.getElementById("state").textContent = "已发";
      document.getElementById("st").textContent = "已送进铜线匣。岗亭天亮会拆。";
    });
    count();
  </script>
</body>
</html>
