<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登船票 · 办成了</title>
  <style>
    :root {
      --navy: #1d2c4a;
      --stub: #f6edd4;
      --ink: #1d2c4a;
      --perf: #c9b089;
      --ok: #2f6b45;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #142033; display: grid; place-items: center; font: 15px/1.5 "Trebuchet MS", "Microsoft YaHei", sans-serif; color: var(--ink); }
    .phone { width: 390px; height: 844px; background: #20324e; border-radius: 36px; overflow: hidden; display: flex; flex-direction: column; padding: 28px 18px; box-shadow: 0 0 0 10px #0e1828; }
    h1 { color: #f6edd4; margin: 0 0 16px; font-size: 22px; }
    .ticket { background: var(--stub); padding: 20px 18px; position: relative; }
    .ticket::after { content: ""; display: block; height: 14px; margin: 12px -18px -20px; background: repeating-linear-gradient(90deg, var(--stub) 0 10px, #20324e 10px 16px); }
    .no { font-size: 28px; letter-spacing: 0.08em; }
    .more { display: none; margin-top: 10px; font-size: 13px; }
    .ticket.open .more { display: block; }
    button { height: 44px; width: 100%; margin-top: 10px; border: 0; cursor: pointer; font: inherit; }
    .done { background: #f6edd4; color: var(--navy); }
    .exp { background: transparent; color: #f6edd4; box-shadow: inset 0 0 0 1px #f6edd4; }
    @media (max-width: 430px) {
      body { display: block; background: #20324e; }
      .phone { width: 100%; height: 100vh; border-radius: 0; box-shadow: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="phone">
    <h1>已经办成了</h1>
    <article class="ticket" id="tk">
      <div>北港渡</div>
      <div class="no">票号 NP-1902</div>
      <p>席位 7A · 今晚 19:02 开船</p>
      <div class="more">从北港栈桥 2 号上船。随身灯油另计。误船不退，可改次日寅时。</div>
    </article>
    <button class="exp" id="exp" type="button">展开细节</button>
    <button class="done" id="done" type="button">完成</button>
    <p id="st" style="color:#d7c8a0"></p>
  </div>
  <script>
    document.getElementById("exp").addEventListener("click", function () {
      var tk = document.getElementById("tk");
      var on = tk.classList.toggle("open");
      this.textContent = on ? "折上细节" : "展开细节";
    });
    document.getElementById("done").addEventListener("click", function () {
      document.getElementById("st").textContent = "票夹进钱包夹层。渡口见。";
    });
  </script>
</body>
</html>
