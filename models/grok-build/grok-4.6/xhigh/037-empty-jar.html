<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>空罐 · 还没有收藏</title>
  <style>
    :root {
      --clay: #e8d2b8;
      --ink: #4a3220;
      --glaze: #7a9e8a;
      --mute: #8a7058;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #c9b08c; display: grid; place-items: center; font: 16px/1.5 "Segoe UI", "PingFang SC", sans-serif; color: var(--ink); }
    .phone { width: 390px; height: 844px; background: var(--clay); border-radius: 36px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 0 0 10px #8a6a48; }
    main { flex: 1; display: grid; place-items: center; padding: 24px; text-align: center; }
    .jar { width: 120px; height: 150px; margin: 0 auto 16px; border: 6px solid var(--ink); border-radius: 10px 10px 40px 40px; background: #f4e6d0; }
    h1 { margin: 0 0 8px; font-size: 24px; font-weight: 500; }
    .go { height: 44px; padding: 0 18px; border: 0; background: var(--ink); color: var(--clay); cursor: pointer; font: inherit; }
    .tab { display: grid; grid-template-columns: repeat(3, 1fr); height: 64px; background: #dcc4a4; }
    .tab button { border: 0; background: transparent; cursor: pointer; color: var(--mute); }
    .tab button.on { color: var(--ink); font-weight: 700; }
    .st { min-height: 22px; color: var(--glaze); }
    @media (max-width: 430px) {
      body { display: block; background: var(--clay); }
      .phone { width: 100%; height: 100vh; border-radius: 0; box-shadow: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="phone">
    <main>
      <div>
        <div class="jar" aria-hidden="true"></div>
        <h1>罐子是空的</h1>
        <p>还没有把任何东西装进来。去青石集或软木匣拿第一件。</p>
        <button class="go" id="go" type="button">去装第一件</button>
        <p class="st" id="st"></p>
      </div>
    </main>
    <nav class="tab">
      <button type="button">集</button>
      <button class="on" type="button">罐</button>
      <button type="button">我</button>
    </nav>
  </div>
  <script>
    document.getElementById("go").addEventListener("click", function () {
      document.getElementById("st").textContent = "带着空罐去青石集。第一件请选轻的。";
    });
    document.querySelectorAll(".tab button").forEach(function (btn) {
      btn.addEventListener("click", function () {
        document.querySelectorAll(".tab button").forEach(function (b) { b.className = ""; });
        btn.className = "on";
      });
    });
  </script>
</body>
</html>
