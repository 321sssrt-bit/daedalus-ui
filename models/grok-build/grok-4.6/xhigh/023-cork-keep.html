<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>软木匣 · 钉下来的</title>
  <style>
    :root {
      --cork: #c9a36a;
      --board: #b8894a;
      --paper: #fff6df;
      --ink: #2b1d10;
      --pin: #c0392b;
      --mute: #6a4e2a;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: #7a562c; color: var(--ink); font: 14px/1.4 "Trebuchet MS", "Microsoft YaHei", sans-serif; }
    header { padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; background: #5a3c1c; color: var(--paper); }
    h1 { margin: 0; font-size: 20px; }
    .tabs button { height: 32px; margin-left: 6px; border: 1px solid #e8d3b0; background: transparent; color: #e8d3b0; cursor: pointer; }
    .tabs button.on { background: var(--paper); color: var(--ink); }
    .board { min-height: calc(100vh - 64px); padding: 18px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; background:
      repeating-linear-gradient(#c9a36a, #c9a36a 12px, #be9658 12px, #be9658 13px); }
    .note { background: var(--paper); padding: 16px 14px 12px; position: relative; min-height: 140px; }
    .note i { position: absolute; top: 8px; left: 50%; width: 12px; height: 12px; background: var(--pin); border-radius: 50%; transform: translateX(-50%); }
    .note button { position: absolute; right: 8px; bottom: 8px; border: 0; background: none; color: var(--pin); cursor: pointer; text-decoration: underline; }
    @media (max-width: 768px) { .board { grid-template-columns: 1fr 1fr; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <header>
    <h1>软木匣</h1>
    <div class="tabs">
      <button class="on" data-c="all" type="button">全钉</button>
      <button data-c="货" type="button">货</button>
      <button data-c="文" type="button">文</button>
    </div>
  </header>
  <div class="board" id="board"></div>
  <script>
    (function () {
      var notes = [
        { t: "青苔石皂", d: "还想再买两块给白垩室洗手。", c: "货" },
        { t: "晚香玉", d: "双蕾，傍晚取。", c: "货" },
        { t: "灯为什么只亮三号", d: "目录第 01，未拆。", c: "文" },
        { t: "月令初八盘点", d: "种子袋单独过磅。", c: "文" },
        { t: "山泉瓶", d: "青石集最便宜的一件。", c: "货" },
        { t: "铜线匣钉法", d: "陈衡那篇，要抄一句。", c: "文" },
        { t: "溪石镇纸", d: "木箱帐里还有三件。", c: "货" }
      ];
      var cat = "all";
      function draw() {
        var board = document.getElementById("board");
        board.innerHTML = "";
        notes.forEach(function (n, i) {
          if (cat !== "all" && n.c !== cat) return;
          var el = document.createElement("article");
          el.className = "note";
          el.innerHTML = "<i></i><b>" + n.t + "</b><p>" + n.d + "</p><button type=\"button\" data-i=\"" + i + "\">拔钉</button>";
          board.appendChild(el);
        });
      }
      document.querySelector(".tabs").addEventListener("click", function (event) {
        var btn = event.target.closest("button");
        if (!btn) return;
        document.querySelectorAll(".tabs button").forEach(function (b) { b.className = ""; });
        btn.className = "on";
        cat = btn.getAttribute("data-c");
        draw();
      });
      document.getElementById("board").addEventListener("click", function (event) {
        var btn = event.target.closest("button");
        if (!btn) return;
        notes.splice(Number(btn.getAttribute("data-i")), 1);
        draw();
      });
      draw();
    })();
  </script>
</body>
</html>
