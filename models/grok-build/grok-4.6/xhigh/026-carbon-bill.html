<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>复写帐 · 账单</title>
  <style>
    :root {
      --green: #d7ecd4;
      --ink: #1c3320;
      --copy: #2a5a38;
      --line: #9cbc98;
      --paper: #eef6ea;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: #b7cbb4; color: var(--ink); font: 14px/1.45 "Cascadia Mono", Consolas, "Microsoft YaHei", monospace; }
    .sheet { max-width: 900px; margin: 24px auto; background: var(--green); padding: 22px; box-shadow: 0 1px 0 #fff inset; }
    .now { display: flex; justify-content: space-between; gap: 12px; padding-bottom: 12px; border-bottom: 2px solid var(--copy); }
    h1 { margin: 0; font-size: 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 14px; }
    th, td { border-bottom: 1px dotted var(--line); padding: 8px 4px; text-align: left; }
    .acts { margin-top: 16px; display: flex; gap: 8px; flex-wrap: wrap; }
    button { height: 36px; padding: 0 12px; border: 1px solid var(--copy); background: var(--paper); color: var(--copy); cursor: pointer; font: inherit; }
    .msg { margin-top: 10px; min-height: 20px; color: var(--copy); }
    @media (max-width: 768px) { .now { flex-direction: column; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="sheet">
    <div class="now">
      <div>
        <h1>复写帐</h1>
        <div>当前方案：梁柱 · ¥ 48 / 月</div>
      </div>
      <div>下一撕：九月初一 · 金条划账</div>
    </div>
    <table>
      <thead><tr><th>日</th><th>摘要</th><th>方式</th><th>金额</th></tr></thead>
      <tbody>
        <tr><td>08-01</td><td>梁柱月费</td><td>金条</td><td>¥ 48</td></tr>
        <tr><td>07-18</td><td>黑金柜 BK-239</td><td>金条</td><td>¥ 239</td></tr>
        <tr><td>07-01</td><td>梁柱月费</td><td>金条</td><td>¥ 48</td></tr>
        <tr><td>06-12</td><td>殿身咨询（未成交）</td><td>铜钱</td><td>¥ 0</td></tr>
        <tr><td>06-01</td><td>基座升梁柱</td><td>金条</td><td>¥ 48</td></tr>
      </tbody>
    </table>
    <div class="acts">
      <button type="button" id="inv">下载本页发票</button>
      <button type="button" id="pay">更换支付方式</button>
    </div>
    <p class="msg" id="msg"></p>
  </main>
  <script>
    document.getElementById("inv").addEventListener("click", function () {
      document.getElementById("msg").textContent = "发票联已撕下（演示）。编号 FY-0801，仍是复写绿纸。";
    });
    var gold = true;
    document.getElementById("pay").addEventListener("click", function () {
      gold = !gold;
      document.getElementById("msg").textContent = gold ? "下一撕仍走柜内金条。" : "下一撕改铜钱袋。金柜会在初一来点。";
    });
  </script>
</body>
</html>
