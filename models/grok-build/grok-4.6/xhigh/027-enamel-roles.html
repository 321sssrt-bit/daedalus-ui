<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>珐琅章 · 谁能做什么</title>
  <style>
    :root {
      --navy: #1c2a4a;
      --enamel: #c43c2c;
      --gold: #e3c36a;
      --paper: #f4efe4;
      --ink: #1a1a1c;
      --ok: #2f6b45;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: #e7e0d2; color: var(--ink); font: 15px/1.45 "Segoe UI", "PingFang SC", sans-serif; }
    header { padding: 20px 24px; display: flex; justify-content: space-between; align-items: center; }
    h1 { margin: 0; }
    .save { height: 38px; background: var(--navy); color: #fff; border: 0; padding: 0 14px; cursor: pointer; }
    .roles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 0 24px 24px; }
    .r { background: var(--paper); padding: 16px; cursor: pointer; border-top: 10px solid var(--navy); }
    .r:nth-child(2) { border-top-color: var(--enamel); }
    .r:nth-child(3) { border-top-color: var(--gold); }
    .r.on { outline: 2px solid var(--navy); }
    .r h2 { margin: 0 0 8px; }
    ul { margin: 0; padding-left: 18px; min-height: 110px; }
    .preview { margin: 0 24px 32px; padding: 14px; background: #fff; min-height: 48px; }
    @media (max-width: 768px) { .roles { grid-template-columns: 1fr; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <header>
    <h1>珐琅章</h1>
    <button class="save" id="save" type="button">保存这套章</button>
  </header>
  <div class="roles">
    <article class="r on" data-n="值夜">
      <h2>值夜</h2>
      <ul><li>入闸、核帖</li><li>读铜线匣</li><li>不能开金柜</li></ul>
    </article>
    <article class="r" data-n="账房">
      <h2>账房</h2>
      <ul><li>复写帐、发票</li><li>改支付方式</li><li>不能改巡号设备</li></ul>
    </article>
    <article class="r" data-n="匠人">
      <h2>匠人</h2>
      <ul><li>货栈三道门</li><li>脉镜改粒度</li><li>不能发绛席帖</li></ul>
    </article>
  </div>
  <div class="preview" id="pv">预览：现在看着「值夜」的权限。保存后，新进闸的人按这套走。</div>
  <script>
    var cur = "值夜";
    document.querySelectorAll(".r").forEach(function (card) {
      card.addEventListener("click", function () {
        document.querySelectorAll(".r").forEach(function (c) { c.classList.remove("on"); });
        card.classList.add("on");
        cur = card.getAttribute("data-n");
        document.getElementById("pv").textContent = "预览：「" + cur + "」—— " + card.querySelector("ul").innerText.replace(/\n/g, " / ");
      });
    });
    document.getElementById("save").addEventListener("click", function () {
      document.getElementById("pv").textContent = "已保存。当前生效角色预览停在「" + cur + "」。";
    });
  </script>
</body>
</html>
