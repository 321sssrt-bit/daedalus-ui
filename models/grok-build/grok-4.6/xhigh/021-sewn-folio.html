<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>线装目 · 目录</title>
  <style>
    :root {
      --cloth: #3a2a22;
      --page: #f4ead4;
      --ink: #2b2118;
      --thread: #8b1e1e;
      --mute: #7a6a58;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--cloth); color: var(--ink); font: 16px/1.6 "KaiTi", "STKaiti", "Songti SC", serif; }
    .book { max-width: 820px; margin: 32px auto; background: var(--page); display: grid; grid-template-columns: 36px 1fr; min-height: 640px; }
    .spine { background: repeating-linear-gradient(#f4ead4, #f4ead4 18px, var(--thread) 18px, var(--thread) 20px); }
    main { padding: 36px 40px; }
    h1 { margin: 0 0 18px; font-size: 30px; }
    ol { list-style: none; padding: 0; margin: 0; }
    li { display: grid; grid-template-columns: 2em 1fr auto; gap: 10px; padding: 10px 0; border-bottom: 1px dotted #cbb89a; cursor: pointer; }
    li:hover, li.on { background: #efe2c8; }
    .from { color: var(--mute); font-size: 13px; }
    aside { display: none; margin-top: 22px; padding: 14px 16px; border-left: 3px solid var(--thread); }
    aside.on { display: block; }
    @media (max-width: 768px) { .book { margin: 0; min-height: 100vh; } main { padding: 24px 18px; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="book">
    <div class="spine" aria-hidden="true"></div>
    <main>
      <h1>线装目</h1>
      <ol id="list"></ol>
      <aside id="abs"></aside>
    </main>
  </div>
  <script>
    (function () {
      var items = [
        { t: "北港灯为什么只亮三号", a: "顾北", s: "守灯的人写潮、风和一次熄灭的四十秒。" },
        { t: "绛席的金线怎么对", a: "门厅", s: "帖号写法、失败时为何门厅继续黑着。" },
        { t: "青石集的湿货", a: "吴苔", s: "从北坡搬石皂到过磅，怕潮的东西单独列。" },
        { t: "白垩室还没有钉子", a: "尹霜", s: "空房间里第一块小稿该放在哪面墙。" },
        { t: "月令上旬的朱批", a: "值年", s: "把开犁、核帖、盘点写进初几，而不是写进周几。" },
        { t: "铜线匣的钉法", a: "陈衡", s: "未读黄线、匣盖铜钉，和一封不该归档的报。" }
      ];
      var list = document.getElementById("list");
      items.forEach(function (it, i) {
        var li = document.createElement("li");
        li.innerHTML = "<span>0" + (i + 1) + "</span><span>" + it.t + "</span><span class=\"from\">" + it.a + "</span>";
        li.addEventListener("click", function () {
          document.querySelectorAll("li").forEach(function (n) { n.className = ""; });
          li.className = "on";
          var abs = document.getElementById("abs");
          abs.className = "on";
          abs.innerHTML = "<strong>" + it.t + "</strong><p>来源：" + it.a + "</p><p>" + it.s + "</p>";
        });
        list.appendChild(li);
      });
    })();
  </script>
</body>
</html>
