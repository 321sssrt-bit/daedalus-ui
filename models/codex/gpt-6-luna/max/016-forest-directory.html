<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>成员目录｜栖木</title>
<style>
:root{--forest:#173B32;--leaf:#9CB98A;--paper:#F2F1E6;--ink:#24352E;--line:#D6DDD0;--cream:#FFFEF5;--moss:#516B52;--rust:#C78052;--muted:#738177}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Segoe UI","Microsoft YaHei",sans-serif}.frame{max-width:1360px;min-height:100vh;margin:auto;display:grid;grid-template-columns:205px minmax(0,1fr)}
.rail{background:var(--forest);color:var(--cream);padding:28px 18px;display:flex;flex-direction:column}.brand{font:700 16px Georgia,serif;letter-spacing:.08em}.brand i{color:var(--leaf);font-style:normal}.workspace{margin-top:43px;padding:13px 10px;border-top:1px solid #FFFFFF33;border-bottom:1px solid #FFFFFF33;font-size:11px;line-height:1.7;color:#D4E2D3}.nav{margin-top:18px;display:grid;gap:5px}.nav a{color:#BED0BF;text-decoration:none;padding:10px;font-size:12px}.nav a.active,.nav a:hover{background:#FFFFFF14;color:var(--cream)}.rail-foot{margin-top:auto;font-size:10px;line-height:1.8;color:#B0C4B3}
.content{padding:26px 30px 35px}.bar{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:12px;color:var(--muted);font-size:11px}.bar strong{color:var(--forest);font-family:Georgia,serif;font-size:14px;letter-spacing:.1em}.bar button{border:1px solid var(--line);background:transparent;color:var(--forest);padding:7px 11px;font-size:11px;cursor:pointer}.bar button:hover{background:var(--leaf)}
.heading{margin:29px 0 20px;display:flex;justify-content:space-between;align-items:end}.heading small{color:var(--rust);font-size:10px;letter-spacing:.18em;font-weight:700}.heading h1{font:500 34px/1.15 Georgia,"Songti SC",serif;margin:6px 0 0;color:var(--forest)}.heading p{font-size:12px;color:var(--muted);margin:0}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:18px}.filter{border:1px solid var(--line);background:transparent;color:var(--moss);padding:8px 13px;font-size:11px;cursor:pointer}.filter.active,.filter:hover,.filter:focus-visible{background:var(--forest);border-color:var(--forest);color:var(--cream);outline:0}.search{margin-left:auto;min-width:205px;height:35px;border:1px solid var(--line);background:var(--cream);padding:0 11px;color:var(--ink);font-size:11px}.search:focus{outline:2px solid var(--leaf)}
.columns{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:18px}.members{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.person[hidden]{display:none}.person{min-height:104px;border:1px solid var(--line);background:var(--cream);padding:13px;display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:center;text-align:left;color:inherit;cursor:pointer}.person:hover,.person:focus-visible,.person.selected{border-color:var(--moss);outline:1px solid var(--moss)}.avatar{width:44px;height:44px;border-radius:50%;background:var(--leaf);display:grid;place-items:center;color:var(--forest);font:700 14px Georgia,serif}.person:nth-child(3n) .avatar{background:#E7CFAD;color:#674C36}.person:nth-child(4n) .avatar{background:#C9D8C4}.name{display:block;font:600 14px Georgia,"Songti SC",serif;color:var(--forest)}.role{display:block;margin-top:4px;font-size:10px;color:var(--muted)}.status{display:block;margin-top:7px;color:var(--moss);font-size:9px}.status:before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--leaf);margin-right:5px}
.profile{min-height:330px;background:var(--forest);color:var(--cream);padding:19px 18px;align-self:start}.profile .avatar{width:62px;height:62px;font-size:20px;background:var(--leaf);margin-bottom:14px}.profile h2{font:500 20px Georgia,"Songti SC",serif;margin:0 0 4px}.profile .meta{color:#C1D3C2;font-size:11px}.profile p{font-size:11px;line-height:1.65;color:#D7E1D6;margin:17px 0}.profile hr{border:0;border-top:1px solid #FFFFFF30}.profile .contact{color:var(--leaf);font-size:10px}.profile.empty{background:#E4E8D9;color:var(--moss)}.profile.empty p{color:var(--moss)}
.statusline{min-height:17px;margin-top:12px;color:var(--rust);font-size:10px}
@media(max-width:930px){.frame{grid-template-columns:160px minmax(0,1fr)}.content{padding:22px 20px}.columns{grid-template-columns:1fr}.profile{min-height:0}.profile p{margin:10px 0}}
@media(max-width:680px){.frame{grid-template-columns:1fr}.rail{padding:14px 20px}.workspace,.nav,.rail-foot{display:none}.content{padding:18px 16px}.heading{align-items:flex-start;gap:8px;flex-direction:column}.heading h1{font-size:30px}.tools{gap:6px}.filter{padding:7px 9px}.search{margin:4px 0 0;width:100%}.members{grid-template-columns:1fr}.person{min-height:82px}.columns{gap:12px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="frame">
  <aside class="rail"><div class="brand"><i>栖</i>　栖木 / PEOPLE</div><div class="workspace">北岸工作室<br>成员　·　12 位</div><nav class="nav"><a class="active" href="#directory">全部成员</a><a href="#directory">编辑部</a><a href="#directory">影像组</a><a href="#directory">研究组</a></nav><div class="rail-foot">共创自 2022<br>让每个人都找得到彼此</div></aside>
  <main class="content" id="directory">
    <header class="bar"><strong>TEAM DIRECTORY</strong><div>最近同步　09:12　<button type="button">邀请成员</button></div></header>
    <section class="heading"><div><small>PEOPLE / 12</small><h1>成员目录</h1></div><p>找到一起把事情做好的伙伴</p></section>
    <div class="tools" role="group" aria-label="按团队筛选"><button class="filter active" data-team="all">全部</button><button class="filter" data-team="编辑部">编辑部</button><button class="filter" data-team="影像组">影像组</button><button class="filter" data-team="研究组">研究组</button><input class="search" id="memberSearch" type="search" placeholder="按姓名搜索" aria-label="按姓名搜索成员"></div>
    <div class="columns">
      <section class="members" aria-label="成员列表">
        <button class="person selected" data-team="编辑部" data-name="林岚" data-role="主编 · 编辑部" data-bio="负责城市与人物报道，擅长把长采访整理成清晰的故事线。"><span class="avatar">林</span><span><span class="name">林岚</span><span class="role">主编 · 编辑部</span><span class="status">在线 · 今天 08:47</span></span></button>
        <button class="person" data-team="编辑部" data-name="陈可" data-role="记者 · 编辑部" data-bio="关注交通与公共空间，正在跟进夜班公交服务专题。"><span class="avatar">陈</span><span><span class="name">陈可</span><span class="role">记者 · 编辑部</span><span class="status">在线 · 今天 08:39</span></span></button>
        <button class="person" data-team="影像组" data-name="许闻" data-role="摄影编辑 · 影像组" data-bio="负责现场摄影与档案整理，偏爱自然光和低饱和色彩。"><span class="avatar">许</span><span><span class="name">许闻</span><span class="role">摄影编辑 · 影像组</span><span class="status">在线 · 今天 08:31</span></span></button>
        <button class="person" data-team="研究组" data-name="周禾" data-role="资料研究 · 研究组" data-bio="整理城市年鉴、口述材料和公开数据，为专题补足来龙去脉。"><span class="avatar">周</span><span><span class="name">周禾</span><span class="role">资料研究 · 研究组</span><span class="status">离开 · 昨天 18:12</span></span></button>
        <button class="person" data-team="影像组" data-name="沈一" data-role="视觉设计 · 影像组" data-bio="为专题制作地图、图解与版面插画。"><span class="avatar">沈</span><span><span class="name">沈一</span><span class="role">视觉设计 · 影像组</span><span class="status">在线 · 今天 08:15</span></span></button>
        <button class="person" data-team="编辑部" data-name="唐野" data-role="文字编辑 · 编辑部" data-bio="把关事实、节奏和标题，常驻早班校对台。"><span class="avatar">唐</span><span><span class="name">唐野</span><span class="role">文字编辑 · 编辑部</span><span class="status">离开 · 昨天 17:56</span></span></button>
      </section>
      <aside class="profile" id="profile" aria-live="polite"><div class="avatar" id="profileInitial">林</div><h2 id="profileName">林岚</h2><div class="meta" id="profileRole">主编 · 编辑部</div><p id="profileBio">负责城市与人物报道，擅长把长采访整理成清晰的故事线。</p><hr><div class="contact">工作时段　09:00–18:00<br>所在时区　UTC+8</div></aside>
    </div>
    <div class="statusline" id="statusline" role="status"></div>
  </main>
</div>
<script>
var people=Array.from(document.querySelectorAll('.person')),activeTeam='all',search=document.getElementById('memberSearch'),statusline=document.getElementById('statusline');
function filterPeople(){var term=search.value.trim().toLowerCase(),shown=0;people.forEach(function(person){var teamMatch=activeTeam==='all'||person.dataset.team===activeTeam;var nameMatch=person.dataset.name.toLowerCase().includes(term);person.hidden=!(teamMatch&&nameMatch);if(!person.hidden)shown++;});statusline.textContent='显示 '+shown+' 位成员';}
document.querySelectorAll('.filter').forEach(function(button){button.addEventListener('click',function(){activeTeam=button.dataset.team;document.querySelectorAll('.filter').forEach(function(item){item.classList.toggle('active',item===button);});filterPeople();});});
search.addEventListener('input',filterPeople);
people.forEach(function(person){person.addEventListener('click',function(){people.forEach(function(item){item.classList.toggle('selected',item===person);});document.getElementById('profileInitial').textContent=person.querySelector('.avatar').textContent;document.getElementById('profileName').textContent=person.dataset.name;document.getElementById('profileRole').textContent=person.dataset.role;document.getElementById('profileBio').textContent=person.dataset.bio;document.getElementById('profile').classList.remove('empty');});});
</script>
</body>
</html>
