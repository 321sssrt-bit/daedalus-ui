<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>036 编辑发布</title>
<style>
:root{--page:#F3F4E9;--surface:#FFFFFF;--ink:#20291E;--muted:#74816B;--accent:#A5C94F;--line:#DAE4C5;--frame:#262522}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--page);color:var(--ink);font-family:Arial, 'Microsoft YaHei', sans-serif}
body{min-height:100vh}
button,input,textarea,select{font:inherit}
button{border:0;cursor:pointer;transition:background-color .16s ease,color .16s ease,transform .16s ease}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
button:disabled{cursor:not-allowed;opacity:.45}
.preview{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 5%,var(--surface),var(--page) 72%)}
.phone{width:390px;height:844px;overflow:hidden;border:8px solid var(--frame);border-radius:42px;background:var(--page);box-shadow:0 28px 100px #0003;display:flex;flex-direction:column}
.screen{flex:1;min-height:0;overflow:auto;padding:20px 22px}
@media(max-width:430px){.preview{padding:0;background:var(--page)}.phone{width:100vw;height:100dvh;min-height:100dvh;border:0;border-radius:0;box-shadow:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
.top{height:56px;display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:13px}.top .saved{color:#587444}.screen{padding-top:6px}.screen h1{font-size:23px;margin:10px 0 14px}.title{width:100%;height:46px;border:1px solid var(--line);border-radius:10px;padding:0 14px;background:var(--surface);color:var(--ink);font-size:16px}.body{margin-top:14px;width:100%;height:440px;resize:none;border:0;border-radius:12px;padding:16px;background:var(--surface);color:var(--ink);font-size:16px;line-height:1.8}.count{font-size:12px;color:var(--muted);text-align:right;margin-top:8px}.actions{height:76px;display:flex;gap:10px;padding:10px 20px 16px}.actions button{height:48px;border-radius:13px}.draft{width:104px;border:1px solid var(--line);background:transparent;color:var(--ink)}.publish{flex:1;background:var(--accent);color:#253018;font-weight:700}.publish:hover{background:#b6d76a}.publish:disabled{background:#d5dcc9}
button:hover:not(:disabled){filter:brightness(.92)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid currentColor;outline-offset:2px}button:disabled{cursor:not-allowed;opacity:.48}article:hover{filter:brightness(1.04)}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}</style>
</head>
<body>
<div class="preview">
<main class="phone">
<header class="top"><button aria-label="返回">‹</button><span id="saved" class="saved">刚刚保存</span><button aria-label="更多">•••</button></header><section class="screen"><h1>写下一段</h1><input id="title" class="title" value="雨停之前" aria-label="文章标题"><textarea id="body" class="body" aria-label="正文">把今天留给一件小事。先收好桌上的杯子，再去看一眼窗外的云。</textarea><div class="count"><span id="count">34</span> 字</div></section><footer class="actions"><button id="draft" class="draft">存草稿</button><button id="publish" class="publish">发布随笔</button></footer>
</main>
</div>
<script>
const body=document.querySelector('#body'),title=document.querySelector('#title');function update(){document.querySelector('#count').textContent=[...body.value].length;document.querySelector('#publish').disabled=!title.value.trim()||!body.value.trim()}body.oninput=title.oninput=()=>{update();document.querySelector('#saved').textContent='未保存'};document.querySelector('#draft').onclick=()=>document.querySelector('#saved').textContent='草稿已保存';document.querySelector('#publish').onclick=()=>{document.querySelector('#saved').textContent='已发布';document.querySelector('#publish').textContent='发布成功'};update();
</script>
</body>
</html>
