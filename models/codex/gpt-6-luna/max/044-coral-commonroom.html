<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>044 社交社区产品</title><style>:root{--page:#FFF4EF;--surface:#FFFFFF;--ink:#3C2D29;--muted:#937C75;--accent:#E96C58;--line:#F0D8D0}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--page);color:var(--ink);font-family:Arial, 'Microsoft YaHei', sans-serif;}button,input,select,textarea{font:inherit}button{cursor:pointer;transition:background-color .15s ease,color .15s ease,transform .15s ease}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button:disabled{opacity:.45;cursor:not-allowed}.preview{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0%,var(--surface),var(--page) 72%)}.phone{width:390px;height:844px;overflow:hidden;border:8px solid #262522;border-radius:40px;background:var(--page);box-shadow:0 28px 100px #0003;display:flex;flex-direction:column}.screen{flex:1;min-height:0;overflow:auto;padding:18px 20px}.desk{width:100%}@media(max-width:430px){.preview{padding:0;background:var(--page)}.phone{width:100vw;height:100dvh;min-height:100dvh;border:0;border-radius:0;box-shadow:none}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}.top{height:56px;display:flex;align-items:center;justify-content:space-between}.brand{font:24px Georgia,serif;color:var(--accent)}.screen{padding:8px 18px 10px;overflow:auto}.tabs{display:flex;gap:20px;border-bottom:1px solid var(--line);height:40px;font-size:12px;color:var(--muted)}.tabs b{color:var(--accent);border-bottom:2px solid var(--accent);padding-bottom:12px}.post{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px}.author{display:flex;gap:9px;align-items:center;font-size:12px;font-weight:700}.face{width:32px;height:32px;border-radius:50%;background:#f4d5ca;display:grid;place-items:center;color:#a64e3d}.author small{display:block;color:var(--muted);font-weight:400;margin-top:3px}.post p{font-size:13px;line-height:1.65;margin:11px 0}.actions{color:var(--muted);font-size:11px}.compose{border-top:1px solid var(--line);padding:10px 18px}.compose textarea{width:100%;height:74px;resize:none;border:1px solid var(--line);border-radius:13px;padding:12px;background:white;color:var(--ink);font-size:13px}.compose-row{display:flex;gap:8px;align-items:center;margin-top:8px}.compose select{flex:1;height:40px;border:1px solid var(--line);border-radius:10px;background:white;padding:0 10px;color:var(--ink)}.publish{height:42px;padding:0 18px;border-radius:12px;background:var(--accent);color:white}.trigger{width:100%;margin-top:7px;height:33px;border:1px dashed var(--accent);border-radius:9px;background:transparent;color:var(--accent);font-size:11px}.failure{margin-top:7px;background:#fff0ee;color:#a83e35;border-radius:9px;padding:9px;font-size:11px}.failure button{background:none;color:#a83e35;text-decoration:underline;margin-left:5px}.nav{height:50px;display:flex;justify-content:space-around;align-items:center;border-top:1px solid var(--line);color:var(--muted);font-size:11px}.newpost{border:1px solid var(--accent);box-shadow:0 4px 15px #e96c581a}</style></head><body><div class="preview"><main class="phone"><header class="top"><span class="brand">同频</span><button style="background:none;color:var(--accent)">＋ 发动态</button><span>⌕　◉</span></header><section class="screen"><div class="tabs"><b>关注</b><span>推荐</span><span>附近</span></div><article class="post"><div class="author"><span class="face">许</span><span>许小满<small>18 分钟前 · 杭州</small></span></div><p>在街角发现一家会认真烘面包的小店。黄油香一路跟着我走了两个街区。</p><div class="actions">♡ 28　　◯ 6　　↗ 分享</div></article><article class="post"><div class="author"><span class="face">周</span><span>周也<small>1 小时前</small></span></div><p>周末的菜市场有很好的青梅，准备回家煮一小锅果酱。</p><div class="actions">♡ 41　　◯ 3　　↗ 分享</div></article></section><section class="compose"><textarea id="draft" placeholder="今天有什么想分享？"></textarea><div class="compose-row"><select id="audience" aria-label="可见范围"><option value="公开">◉ 公开</option><option value="仅好友">◎ 仅好友</option></select><button id="publish" class="publish">发布</button></div><button id="trigger" class="trigger">模拟本次发布失败</button><div id="failure" class="failure" hidden>发布未完成，草稿与可见范围都已保留。<button id="retry">恢复连接并重试</button></div></section><footer class="nav"><span>⌂ 首页</span><span>◎ 消息</span><span>◉ 我的</span></footer></main></div><script>let armed=false;const draft=document.querySelector('#draft'),failure=document.querySelector('#failure');document.querySelector('#trigger').onclick=e=>{armed=true;e.currentTarget.textContent='已开启：本次发布会失败'};function publish(){const text=draft.value.trim();if(!text)return;if(armed){failure.hidden=false;armed=false;document.querySelector('#trigger').textContent='模拟本次发布失败';return}const post=document.createElement('article');post.className='post newpost';post.innerHTML='<div class="author"><span class="face">我</span><span>我<small>刚刚 · '+document.querySelector('#audience').value+'</small></span></div>';const p=document.createElement('p');p.textContent=text;post.append(p);post.insertAdjacentHTML('beforeend','<div class="actions">♡ 0　　◯ 评论　　↗ 分享</div>');document.querySelector('.tabs').after(post);draft.value='';failure.hidden=true}document.querySelector('#publish').onclick=publish;document.querySelector('#retry').onclick=publish;</script></body></html>
