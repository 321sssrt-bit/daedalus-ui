<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>049 健康习惯产品</title><style>:root{--page:#EFF4EC;--surface:#FFFFFF;--ink:#27372D;--muted:#7D8B7E;--accent:#6F9469;--line:#D9E4D5}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--page);color:var(--ink);font-family:Arial, 'Microsoft YaHei', sans-serif;}button,input,select,textarea{font:inherit}button{cursor:pointer;transition:background-color .15s ease,color .15s ease,transform .15s ease}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button:disabled{opacity:.45;cursor:not-allowed}.preview{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0%,var(--surface),var(--page) 72%)}.phone{width:390px;height:844px;overflow:hidden;border:8px solid #262522;border-radius:40px;background:var(--page);box-shadow:0 28px 100px #0003;display:flex;flex-direction:column}.screen{flex:1;min-height:0;overflow:auto;padding:18px 20px}.desk{width:100%}@media(max-width:430px){.preview{padding:0;background:var(--page)}.phone{width:100vw;height:100dvh;min-height:100dvh;border:0;border-radius:0;box-shadow:none}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}.top{height:54px;display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px}.screen{padding-top:5px}.screen h1{font-size:20px;margin:4px 0 12px}.goal{background:var(--surface);border:1px solid var(--line);border-radius:19px;padding:15px;display:flex;align-items:center;gap:15px}.ring{width:92px;height:92px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--accent) 0 45%,#dce7d9 45% 100%);position:relative}.ring:before{content:"";position:absolute;inset:8px;border-radius:50%;background:white}.ring strong{position:relative;font-size:14px}.goal small{display:block;color:var(--muted);font-size:11px}.goal b{display:block;font-size:18px;margin:4px 0}.entry{margin-top:13px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}.entry h2,.trend h2{font-size:14px;margin:0 0 10px}.entry label{font-size:11px;color:var(--muted)}.entry input{width:100%;height:48px;margin:6px 0 8px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font-size:17px;color:var(--ink);background:white}.entry button{width:100%;height:43px;border-radius:10px;background:var(--accent);color:white;font-weight:700}.error{font-size:11px;color:#a6463e;line-height:1.4;margin-bottom:8px}.trend{margin-top:12px;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}.bars{height:66px;display:flex;align-items:end;gap:8px;border-bottom:1px solid var(--line);padding:0 7px}.bar{flex:1;background:#c4d8bd;border-radius:5px 5px 0 0}.bar:nth-child(7){background:var(--accent);height:45%}.labels{display:flex;justify-content:space-between;font-size:9px;color:var(--muted);padding-top:5px}.record{font-size:11px;color:var(--muted);padding-top:8px}.record b{color:var(--ink)}.records{display:grid;gap:5px;margin-top:8px}.recordrow{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:7px;font-size:10px;color:var(--muted)}.recordrow b{color:var(--ink)}</style></head><body><div class="preview"><main class="phone"><header class="top"><span>◌ 每日步记</span><button>‹　9 月 23 日</button><span>⋯</span></header><section class="screen"><h1>走一点，记一点</h1><div class="goal"><div class="ring" id="ring"><strong id="percent">78%</strong></div><div><small>今日目标 · 8,000 步</small><b><span id="steps">6,200</span> 步</b><small id="left">还差 1,800 步就完成</small></div></div><article class="entry"><h2>记录一次活动</h2><label for="activity">本次步数　·　允许 0–30,000</label><input id="activity" type="number" min="0" max="30000" step="1" value="1200"><div id="error" class="error" hidden></div><button id="save">保存记录</button></article><article class="trend"><h2>近 7 天趋势</h2><div class="bars" id="bars"><i class="bar" style="height:37%"></i><i class="bar" style="height:56%"></i><i class="bar" style="height:48%"></i><i class="bar" style="height:75%"></i><i class="bar" style="height:60%"></i><i class="bar" style="height:83%"></i><i class="bar" style="height:45%"></i></div><div class="labels"><span>周三</span><span>周四</span><span>周五</span><span>周六</span><span>周日</span><span>周一</span><span>今天</span></div><div class="record">最近记录</div><div id="records" class="records"><div class="recordrow">今天早晨散步 <b>3,100 步</b></div></div></article></section></main></div><script>
let total=6200;
function paint(){
  document.querySelector('#steps').textContent=total.toLocaleString('en-US');
  const pct=Math.min(100,Math.round(total/8000*100));
  document.querySelector('#percent').textContent=pct+'%';
  document.querySelector('#ring').style.background='conic-gradient(var(--accent) 0 '+pct+'%, #dce7d9 '+pct+'% 100%)';
  document.querySelector('#left').textContent=total>=8000?'今日目标已达成':'还差 '+(8000-total).toLocaleString('en-US')+' 步就完成';
  document.querySelector('#bars').lastElementChild.style.height=Math.max(8,Math.min(100,pct))+'%';
}
document.querySelector('#save').onclick=function(){
  const field=document.querySelector('#activity'),n=Number(field.value),error=document.querySelector('#error');
  if(field.value.trim()===''||!Number.isInteger(n)||n<0||n>30000){error.hidden=false;error.textContent='请检查步数字段：单次记录需为 0–30,000 步的整数。今日进度保持 '+total.toLocaleString('en-US')+' 步。';return}
  error.hidden=true;total+=n;
  const row=document.createElement('div');row.className='recordrow';row.textContent='刚刚保存';
  const value=document.createElement('b');value.textContent=n.toLocaleString('en-US')+' 步';row.append(value);document.querySelector('#records').prepend(row);
  paint();
};
paint();
</script></body></html>
