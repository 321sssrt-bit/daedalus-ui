<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>025 账号设置 · plain-account</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer}a{color:inherit}svg{display:block}

:root{--page:#fff;--ink:#262926;--muted:#777d77;--line:#e2e5e1;--soft:#f7f8f6;--green:#377558;--pale:#eaf3ec}body{background:var(--page);color:var(--ink);min-height:100vh}.wrap{max-width:1100px;margin:auto;padding:0 42px}.top{height:64px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{font-size:13px;font-weight:750;letter-spacing:.06em}.top span{font-size:10px;color:var(--muted)}.layout{display:grid;grid-template-columns:205px 1fr;gap:42px;padding:34px 0}.side h2{font-size:10px;text-transform:uppercase;letter-spacing:.13em;color:#999;margin:7px 0 15px}.sidelink{display:block;padding:10px 12px;color:#687068;text-decoration:none;font-size:11px;border-left:2px solid transparent}.sidelink.active{background:var(--pale);border-color:var(--green);color:var(--green);font-weight:650}.content h1{font-size:29px;font-weight:550;margin:3px 0 5px}.sub{font-size:11px;color:var(--muted);margin-bottom:20px}.identity{display:flex;align-items:center;gap:13px;padding:15px 16px;border:1px solid var(--line);background:var(--soft);margin-bottom:22px}.avatar{width:42px;height:42px;border-radius:50%;background:#c9d9cc;display:grid;place-items:center;color:#315f45;font-weight:700;font-size:13px}.identity strong{font-size:12px}.identity small{display:block;color:var(--muted);font-size:10px;margin-top:4px}.edit{margin-left:auto;border:1px solid var(--line);background:#fff;padding:8px 12px;color:var(--green);font-size:10px}.group{margin-bottom:22px}.group h2{font-size:13px;margin:0;padding:0 0 8px;border-bottom:1px solid var(--line)}.row{border-bottom:1px solid var(--line)}.row button{width:100%;padding:14px 2px;border:0;background:#fff;display:flex;align-items:center;text-align:left;color:var(--ink)}.row button:hover{background:var(--soft)}.row strong{font-size:11px;font-weight:600}.row small{display:block;color:var(--muted);font-size:10px;margin-top:4px}.arrow{margin-left:auto;color:#8a928b;font-size:14px}.detail{display:none;background:var(--soft);padding:12px 14px 15px;font-size:10px;color:#657168;line-height:1.6}.detail.open{display:block}.detail button{width:auto;background:var(--green);color:#fff;border:0;padding:7px 12px;font-size:9px;margin-top:8px}.success{position:fixed;right:24px;bottom:22px;background:#275b40;color:white;padding:11px 15px;font-size:10px;opacity:0;transition:.2s}.success.show{opacity:1}@media(max-width:800px){.wrap{padding:0 24px}.layout{gap:22px;grid-template-columns:170px 1fr}}@media(max-width:620px){.layout{grid-template-columns:1fr;padding-top:24px}.side{display:flex;gap:5px;overflow:auto}.side h2{display:none}.sidelink{white-space:nowrap;border-left:0;border-bottom:2px solid transparent}.sidelink.active{border-bottom-color:var(--green)}.content h1{font-size:26px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}

button:hover:not(:disabled){filter:brightness(.92)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid currentColor;outline-offset:2px}button:disabled{cursor:not-allowed;opacity:.48}article:hover{filter:brightness(1.04)}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}</style>
</head>
<body>

<main class="wrap"><header class="top"><div class="brand">普通计划 / ACCOUNT</div><span>帮助中心　·　退出登录</span></header><div class="layout"><aside class="side"><h2>个人空间</h2><a class="sidelink active">账号资料</a><a class="sidelink">登录与安全</a><a class="sidelink">通知偏好</a><a class="sidelink">隐私与数据</a></aside><section class="content"><h1>账号设置</h1><p class="sub">管理个人资料、安全方式与消息接收习惯。</p><div class="identity"><div class="avatar">陈</div><div><strong>陈予安</strong><small>chen.yuan@example.cn</small></div><button class="edit" onclick="showToast()">编辑资料</button></div>
<section class="group"><h2>个人信息</h2><div class="row"><button aria-expanded="false" onclick="toggle(this)"><span><strong>个人资料</strong><small>显示名称、头像和所在时区</small></span><span class="arrow">＋</span></button><div class="detail">名称：陈予安　·　时区：北京时间 (UTC+8)<br><button onclick="showToast()">管理设置</button></div></div></section><section class="group"><h2>安全</h2><div class="row"><button aria-expanded="false" onclick="toggle(this)"><span><strong>登录与安全</strong><small>密码、两步验证和活跃设备</small></span><span class="arrow">＋</span></button><div class="detail">两步验证已开启；最近一次登录：今天 09:41<br><button onclick="showToast()">管理设置</button></div></div></section><section class="group"><h2>通知</h2><div class="row"><button aria-expanded="false" onclick="toggle(this)"><span><strong>通知偏好</strong><small>邮件和站内提醒的频率</small></span><span class="arrow">＋</span></button><div class="detail">每周摘要已开启；产品更新按需接收<br><button onclick="showToast()">管理设置</button></div></div></section><section class="group"><h2>隐私</h2><div class="row"><button aria-expanded="false" onclick="toggle(this)"><span><strong>隐私与数据</strong><small>数据下载、公开范围和账号访问</small></span><span class="arrow">＋</span></button><div class="detail">个人主页仅对分享链接可见<br><button onclick="showToast()">管理设置</button></div></div></section>
</section></div></main><div class="success" id="success">设置已保存</div>

<script>function toggle(b){let d=b.nextElementSibling,open=!d.classList.contains('open');d.classList.toggle('open',open);b.setAttribute('aria-expanded',open);b.querySelector('.arrow').textContent=open?'−':'＋'}function showToast(){let x=document.getElementById('success');x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1500)}</script>
</body>
</html>
