<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="page-name" content="005 找回密码"><title>005 找回密码</title><style>:root{--page:#edf8f3;--surface:#ffffff;--text:#263f38;--muted:#728b82;--accent:#32836a;--accent2:#91c8ad;--line:#cfe5d9}*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--text);font:15px/1.55 system-ui,sans-serif}.page{min-height:800px;display:grid;grid-template-columns:34% 66%;background:#fff}h1,h2,p{margin-top:0}.brand{position:absolute;top:32px;font-size:20px;font-weight:850;color:var(--accent)}.brand small{display:block;font-size:10px;color:var(--muted);font-weight:500}.side{padding:40px 50px;background:#e5f4ec;display:flex;flex-direction:column;justify-content:center}.leaf{height:230px;display:grid;place-items:center;font:180px/1 Georgia,serif;color:#438c70;transform:rotate(-18deg)}.side h2{font-size:32px;line-height:1.3}.side p{font-size:13px;color:var(--muted);max-width:320px}.side>small{font-size:10px;color:var(--accent)}.right{position:relative;display:grid;place-items:center;padding:55px}.lang{position:absolute;right:40px;top:30px;color:var(--muted);font-size:10px}.box{width:min(480px,100%);padding:42px;border:1px solid var(--line);border-radius:22px;box-shadow:0 18px 60px #234b3a0b}.icon{width:42px;height:42px;border-radius:14px;background:#e7f4ed;color:var(--accent);display:grid;place-items:center;font-weight:800;margin-bottom:22px}.eyebrow{font-size:9px;color:var(--accent);letter-spacing:.14em}.box h1{font-size:36px;line-height:1.2;margin:10px 0}.muted{color:var(--muted);font-size:13px}.box label{display:block;font-size:11px;font-weight:750;margin:23px 0 8px}.box input{display:block;width:100%;height:50px;border:1px solid var(--line);border-radius:12px;padding:0 14px;margin-top:7px;color:var(--text)}.box input:focus{outline:3px solid var(--accent2);outline-offset:2px}#send{width:100%;height:50px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-weight:750;margin-top:8px}#send:hover{background:#266a55}#status{min-height:24px;color:var(--accent);font-size:11px;margin:8px 0}.box>a{font-size:11px;color:var(--muted);text-decoration:none}.privacy{position:absolute;bottom:22px;color:#91a99f;font-size:9px}button:focus-visible,a:focus-visible{outline:3px solid var(--accent2);outline-offset:3px}

@media(max-width:640px){.page{display:block}.side{padding:20px 24px 8px}.brand{position:static;margin-bottom:10px}.leaf{display:none}.side h2{font-size:23px;margin:0 0 3px}.side p{font-size:11px;margin:0}.side>small{display:none}.right{padding:40px 18px 54px}.lang{right:16px;top:12px}.box{padding:26px 22px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}</style></head><body>
<main class="page"><aside class="side"><div class="brand">morrow <small>账户中心</small></div><div class="leaf">⌁</div><h2>入口丢了，<br>我们陪你找。</h2><p>重置链接只发给你本人。检查收件箱，也记得看看垃圾邮件夹。</p><small>安心找回 · 约 2 分钟</small></aside>
<section class="right"><div class="lang">帮助中心　·　中文</div><form id="reset" class="box"><div class="icon">↗</div><p class="eyebrow">账户恢复　/　01</p><h1 id="heading">找回密码</h1><p id="desc" class="muted">输入注册邮箱，我们会发送一条安全的重置链接。</p><label>注册邮箱<input id="email" type="email" required placeholder="you@example.com"></label><button id="send" type="submit">发送重置链接　→</button><p id="status" aria-live="polite"></p><a href="#login" id="back">← 回到登录</a></form><div class="privacy">栖木不会通过邮件索取你的密码。</div></section></main>
<script>document.getElementById("reset").onsubmit=function(e){e.preventDefault();document.getElementById("heading").textContent="邮件已出发";document.getElementById("desc").textContent="如果这个邮箱已注册，重置链接会在几分钟内送达。";document.getElementById("status").textContent="链接有效期为 30 分钟，请留意收件箱。";document.getElementById("send").textContent="重新发送链接";document.getElementById("send").type="button";document.getElementById("send").onclick=function(){document.getElementById("status").textContent="已再次发送，请稍后检查收件箱。"}};document.getElementById("back").onclick=function(e){e.preventDefault();document.getElementById("heading").textContent="欢迎回来";document.getElementById("desc").textContent="回到登录页，继续你的工作。";document.getElementById("status").textContent="";this.textContent="← 登录入口已为你保留"}</script></body></html>
