<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>022 个人主页 · coral-portrait</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer}a{color:inherit}svg{display:block}

:root{--page:#fff4ef;--ink:#392520;--muted:#876e65;--coral:#f47766;--pale:#ffd2c8;--line:#e9beb4;--green:#466e60}body{background:var(--page);color:var(--ink);min-height:100vh}.shell{max-width:1160px;margin:auto;padding:0 44px}.nav{height:72px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.logo{font:700 13px monospace;letter-spacing:.14em}.nav span{font-size:11px;color:var(--muted)}.hero{display:grid;grid-template-columns:.8fr 1.2fr;gap:54px;align-items:center;padding:45px 0 35px}.portrait{height:385px;background:var(--pale);position:relative;overflow:hidden}.portrait:before{content:"";position:absolute;width:190px;height:190px;border-radius:48% 52% 45% 55%;background:linear-gradient(145deg,#a96445,#6b4339);left:50%;top:77px;transform:translateX(-50%);box-shadow:0 0 0 13px #e8a49a}.portrait:after{content:"";position:absolute;width:265px;height:190px;border-radius:48% 48% 0 0;background:linear-gradient(120deg,#4f7770,#244d49);bottom:-32px;left:50%;transform:translateX(-50%)}.sun{position:absolute;width:88px;height:88px;border-radius:50%;background:#f9ad74;right:29px;top:28px;mix-blend-mode:multiply}.caption{position:absolute;z-index:1;bottom:13px;left:15px;font:10px monospace;color:#fef4ed;letter-spacing:.1em}.role{font:10px monospace;color:var(--coral);letter-spacing:.2em;text-transform:uppercase}.bio h1{font:500 clamp(42px,5vw,64px)/.98 Georgia,serif;margin:14px 0}.bio h1 em{font-style:italic;color:var(--coral)}.bio p{font-size:14px;line-height:1.8;color:#735e56;max-width:430px}.actions{display:flex;gap:9px;margin-top:22px}.actions button{padding:12px 19px;border-radius:99px;font-size:11px}.follow{background:var(--coral);color:white;border:1px solid var(--coral)}.contact{background:transparent;color:var(--ink);border:1px solid var(--ink)}.stat{display:flex;gap:32px;margin-top:26px}.stat b{font:22px Georgia,serif}.stat small{display:block;font:9px monospace;color:var(--muted);letter-spacing:.07em;margin-top:4px}.workhead{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:15px}.workhead h2{font:25px Georgia,serif;margin:0}.workhead span{font:10px monospace;color:var(--muted)}.works{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-top:16px}.work{height:150px;padding:16px;display:flex;align-items:end;font:13px Georgia,serif;color:white;background:linear-gradient(160deg,#e79b7e,#9c4e49)}.work:nth-child(2){background:linear-gradient(145deg,#a3baa7,#43776a)}.work:nth-child(3){background:linear-gradient(150deg,#f2c96c,#d07852)}.work small{display:block;font:9px monospace;opacity:.8;margin-top:4px}@media(max-width:800px){.shell{padding:0 26px}.hero{gap:28px}.portrait{height:330px}}@media(max-width:620px){.hero{grid-template-columns:1fr;padding-top:25px}.portrait{height:270px}.works{grid-template-columns:1fr 1fr}.work{height:120px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}

button:hover:not(:disabled){filter:brightness(.92)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid currentColor;outline-offset:2px}button:disabled{cursor:not-allowed;opacity:.48}article:hover{filter:brightness(1.04)}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}</style>
</head>
<body>

<main class="shell"><header class="nav"><div class="logo">MARA / STUDIO</div><span>作品　·　笔记　·　关于我</span><span>上海　GMT+8</span></header><section class="hero"><div class="portrait"><span class="sun"></span><span class="caption">PORTRAIT / EARLY SUMMER</span></div><div class="bio"><div class="role">摄影师　·　视觉叙事</div><h1>你好，我是<br><em>林玛拉。</em></h1><p>我拍下人和地方之间的微小联系。工作常在沿海城市与山路之间，也总在寻找一束刚好落下的光。</p><div class="actions"><button id="follow" class="follow" onclick="follow()">＋ 关注</button><button class="contact" onclick="location.href='mailto:hello@example.com'">联系我 ↗</button></div><div class="stat"><div><b>38</b><small>故事</small></div><div><b>12.6k</b><small>关注者</small></div><div><b>06</b><small>城市</small></div></div></div></section><section><div class="workhead"><h2>最近的观察</h2><span>SELECTED WORKS　2025—26</span></div><div class="works"><div class="work">潮汐以后<small>福建 · 2026</small></div><div class="work">午后修理铺<small>上海 · 2025</small></div><div class="work">夏天的背影<small>舟山 · 2025</small></div></div></section></main>

<script>let on=false;function follow(){on=!on;let b=document.getElementById('follow');b.textContent=on?'✓ 已关注':'＋ 关注';b.style.background=on?'var(--green)':'var(--coral)';b.style.borderColor=on?'var(--green)':'var(--coral')}</script>
</body>
</html>
