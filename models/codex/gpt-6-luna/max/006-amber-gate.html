<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="page-name" content="006 二次验证"><title>006 二次验证</title><style>:root{--page:#10100e;--surface:#1b1a16;--text:#f4e4bc;--muted:#9c947e;--accent:#d99a38;--accent2:#f0c36c;--line:#39352b}*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--text);font:15px/1.55 system-ui,sans-serif}.page{min-height:800px;padding:24px 44px;background:radial-gradient(ellipse at 50% 38%,#2a2418,#10100e 58%)}header,footer{max-width:1120px;margin:auto;display:flex;justify-content:space-between;color:var(--muted);font:10px system-ui;letter-spacing:.12em}header{height:42px;border-bottom:1px solid var(--line);align-items:center}header i{font-style:normal;color:var(--accent);margin-left:10px}.secure{color:#a4b68d;letter-spacing:.03em}.terminal{width:min(560px,100%);margin:42px auto 28px;background:var(--surface);border:1px solid #5a492b;padding:46px 48px 34px;position:relative;box-shadow:0 22px 70px #0008}.bar{position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--accent),var(--accent2),transparent)}.shield{width:42px;height:42px;border:1px solid var(--accent);display:grid;place-items:center;color:var(--accent);font-size:22px;margin-bottom:22px}.eyebrow{font-size:9px;color:var(--accent);letter-spacing:.16em}.terminal h1{font-size:34px;margin:13px 0}.desc{font-size:13px;color:var(--muted);line-height:1.75}.desc b{color:#e8d39e}.terminal label{display:flex;justify-content:space-between;font-size:11px;font-weight:700;margin:28px 0 9px}.terminal label small{font-size:9px;color:var(--muted)}.terminal input{width:100%;height:58px;background:#12120f;border:1px solid #66532f;color:var(--accent2);font:700 21px ui-monospace,monospace;letter-spacing:.3em;text-align:center;border-radius:3px}.terminal input:focus{outline:3px solid var(--accent2);outline-offset:2px}.error{min-height:20px;color:#b9a989;font-size:10px;margin:8px 0 13px}.confirm{width:100%;height:50px;border:0;border-radius:3px;background:var(--accent);color:#17130c;font-weight:850}.confirm:hover{background:var(--accent2)}.retry{display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:17px;padding-top:13px;font:9px system-ui;color:var(--muted)}.retry button{border:0;background:transparent;color:var(--accent2);font-size:9px}.demo{margin-top:25px;color:#786d56;font:9px ui-monospace,monospace}footer{padding-top:14px;border-top:1px solid var(--line);font-size:8px}

<main class="page"><header><b>BLACKBOX <i>SECURITY GATE</i></b><span class="secure">● 加密连接</span></header><section class="terminal"><div class="bar"></div><div class="shield">⬡</div><p class="eyebrow">IDENTITY CHECK · STEP 02/02</p><h1>再确认一次</h1><p class="desc">验证码已发送至 <b>m•••••@studio.hk</b><br>请在 10 分钟内输入。</p><label for="otp">一次性验证码 <small>６ 位数字</small></label><input id="otp" inputmode="numeric" maxlength="6" placeholder="— — — — — —" autocomplete="one-time-code"><p id="error" class="error" aria-live="polite">请输入短信中的 6 位代码。</p><button id="confirm" class="confirm">验证并继续　→</button><div class="retry"><span id="tries">剩余尝试 3 次</span><button id="resend" type="button">重新发送　00:24</button></div><p class="demo">演示验证码：246810</p></section><footer>SESSION ID　CN-8F2A-119　·　只在可信设备上输入验证码</footer></main>
<script>let left=3,locked=false;document.getElementById("otp").oninput=function(){this.value=this.value.replace(/\D/g,"").slice(0,6)};document.getElementById("confirm").onclick=function(){const e=document.getElementById("error"),v=document.getElementById("otp").value;if(locked){e.textContent="本次验证已锁定，请结束登录后重新开始。";return}if(v==="246810"){e.textContent="身份已确认，正在安全进入…";e.style.color="#a4b68d";return}left--;document.getElementById("tries").textContent="剩余尝试 "+left+" 次";e.textContent=left?"验证码不匹配，请核对后重试。":"尝试次数已用完，本次验证已锁定。";e.style.color="#df835d";if(!left){locked=true;this.disabled=true}};document.getElementById("resend").onclick=function(){left=3;locked=false;document.getElementById("tries").textContent="剩余尝试 3 次";document.getElementById("confirm").disabled=false;document.getElementById("error").textContent="新验证码已发送，请检查邮箱。"}</script></body></html>
