<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>029 文件上传 · violet-drop</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer}a{color:inherit}svg{display:block}

:root{--page:#171324;--panel:#211b35;--panel2:#2a2241;--ink:#f2edff;--muted:#aaa1c4;--line:#453b62;--violet:#b597ff;--pink:#f087c3;--green:#82dec2}body{background:radial-gradient(ellipse at 85% 0,#3d285b,transparent 39%),var(--page);color:var(--ink);min-height:100vh}.app{max-width:1180px;margin:auto;padding:0 35px}.top{height:69px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff18}.brand{font:800 12px monospace;letter-spacing:.15em}.brand i{color:var(--pink);font-style:normal}.top span{font-size:10px;color:var(--muted)}.layout{display:grid;grid-template-columns:1fr 310px;gap:18px;padding:26px 0}.main h1{font-size:29px;font-weight:550;margin:0}.lead{font-size:11px;color:var(--muted);margin:7px 0 19px}.drop{border:1px dashed #9e86cb;background:#221a37;min-height:220px;display:grid;place-items:center;text-align:center;padding:24px;position:relative;transition:.2s}.drop.drag{background:#33244d;border-color:var(--pink)}.cloud{width:46px;height:46px;border-radius:50%;background:#3b2b57;color:var(--violet);display:grid;place-items:center;font-size:21px;margin:0 auto 11px}.drop strong{font-size:13px}.drop p{font-size:10px;color:var(--muted);margin:7px}.select{display:inline-block;margin-top:9px;border:1px solid var(--violet);color:var(--ink);background:transparent;padding:9px 14px;font-size:10px}.drop small{display:block;font-size:9px;color:#83799e;margin-top:11px}.drop input{display:none}.queuehead{display:flex;justify-content:space-between;align-items:center;padding:18px 0 10px}.queuehead h2{font-size:13px;margin:0}.queuehead span{font:9px monospace;color:var(--muted)}.file{display:grid;grid-template-columns:38px 1fr auto;gap:11px;align-items:center;padding:12px;background:var(--panel);border:1px solid var(--line);margin-bottom:7px}.icon{width:34px;height:38px;border:1px solid #7967a4;color:var(--violet);display:grid;place-items:center;font:9px monospace}.file strong{font-size:10px}.file small{display:block;font:9px monospace;color:var(--muted);margin-top:5px}.ready{color:var(--green)}.del{background:none;border:0;color:var(--muted);font-size:16px}.aside{background:var(--panel);border:1px solid var(--line);padding:18px;height:max-content}.aside h2{font-size:14px;margin:0 0 16px}.stat{border-bottom:1px solid var(--line);padding:10px 0;display:flex;justify-content:space-between;font-size:10px;color:var(--muted)}.stat b{color:var(--ink);font-weight:500}.meter{height:5px;background:#413657;margin:11px 0 17px}.meter i{display:block;width:34%;height:100%;background:linear-gradient(90deg,var(--violet),var(--pink))}.process{width:100%;border:0;background:var(--violet);color:#170f2a;padding:13px;font-weight:800;font-size:10px;margin-top:14px}.process:disabled{opacity:.4;cursor:not-allowed}.aside p{font-size:9px;line-height:1.6;color:var(--muted)}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--green);color:#122420;padding:11px 16px;font-size:10px;opacity:0;transition:.18s}.toast.show{opacity:1}@media(max-width:850px){.app{padding:0 22px}.layout{grid-template-columns:1fr 250px;gap:12px}}@media(max-width:640px){.layout{grid-template-columns:1fr}.aside{grid-row:1}.drop{min-height:190px}.app{padding:0 15px}.file{grid-template-columns:34px 1fr auto}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}

button:hover:not(:disabled){filter:brightness(.92)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid currentColor;outline-offset:2px}button:disabled{cursor:not-allowed;opacity:.48}article:hover{filter:brightness(1.04)}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}</style>
</head>
<body>

<main class="app"><header class="top"><div class="brand">VIOLET <i>/</i> TRANSFER</div><span>项目空间　「秋季画册」</span><span>上传记录　·　帮助</span></header><div class="layout"><section class="main"><h1>把文件交进来</h1><p class="lead">选择本次要处理的图片与文档，处理前可随时移除。</p><label class="drop" id="drop"><div><div class="cloud">↑</div><strong>拖放文件到这里</strong><p>或从设备中选择，单个文件不超过 50 MB</p><span class="select">选择文件</span><small>支持 JPG、PNG、PDF、PSD</small></div><input id="picker" type="file" multiple accept=".jpg,.jpeg,.png,.pdf,.psd"></label><div class="queuehead"><h2>待处理文件</h2><span id="filecount">2 / 20</span></div><div id="files">
<article class="file"><div class="icon">JPG</div><div><strong>海边工作室_封面.jpg</strong><small>JPG · 8.4 MB　·　<span class="ready">已就绪</span></small></div><button class="del" aria-label="删除文件" onclick="removeFile(this)">×</button></article><article class="file"><div class="icon">PDF</div><div><strong>秋季目录_v3.pdf</strong><small>PDF · 2.1 MB　·　<span class="ready">已就绪</span></small></div><button class="del" aria-label="删除文件" onclick="removeFile(this)">×</button></article>
</div></section><aside class="aside"><h2>本次处理</h2><div class="stat"><span>文件数</span><b id="asidecount">2 个</b></div><div class="stat"><span>总大小</span><b id="size">10.5 MB</b></div><div class="stat"><span>本月额度</span><b>86 / 200 个</b></div><div class="meter"><i></i></div><button class="process" id="process" onclick="processFiles()">开始处理　→</button><p>文件会保存在当前项目空间。上传过程已加密，处理完成后你可管理每个文件。</p></aside></div></main><div id="toast" class="toast"></div>

<script>let next=0;const picker=document.getElementById('picker');picker.addEventListener('change',()=>[...picker.files].forEach(f=>addFile(f.name,(f.size/1048576).toFixed(1)+' MB',f.name.split('.').pop().toUpperCase())));function addFile(n,s,t){let a=document.createElement('article');a.className='file';a.innerHTML='<div class="icon">'+t+'</div><div><strong></strong><small>'+t+' · '+s+'　·　<span class="ready">已就绪</span></small></div><button class="del" aria-label="删除文件" onclick="removeFile(this)">×</button>';a.querySelector('strong').textContent=n;document.getElementById('files').append(a);update()}function update(){let n=document.querySelectorAll('.file').length;document.getElementById('filecount').textContent=n+' / 20';document.getElementById('asidecount').textContent=n+' 个';document.getElementById('process').disabled=n===0}function removeFile(b){b.closest('.file').remove();update()}function processFiles(){let t=document.getElementById('toast');t.textContent='文件已进入处理队列';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600)}const d=document.getElementById('drop');d.addEventListener('dragover',e=>{e.preventDefault();d.classList.add('drag')});d.addEventListener('dragleave',()=>d.classList.remove('drag'));d.addEventListener('drop',e=>{e.preventDefault();d.classList.remove('drag');[...e.dataTransfer.files].forEach(f=>addFile(f.name,(f.size/1048576).toFixed(1)+' MB',f.name.split('.').pop().toUpperCase()))});update()</script>
</body>
</html>
