<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>027 角色权限 · tide-roles</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer}a{color:inherit}svg{display:block}

:root{--page:#102729;--side:#0b1d20;--surface:#173538;--surface2:#1d4143;--ink:#e3f2ec;--muted:#91b5aa;--line:#315b59;--mint:#79d6b3;--gold:#d8c36b}body{background:var(--page);color:var(--ink);min-height:100vh;font-family:"Arial",system-ui,sans-serif}.app{max-width:1220px;margin:auto;min-height:100vh;display:grid;grid-template-columns:218px 1fr}.side{background:var(--side);border-right:1px solid #ffffff10;padding:27px 18px}.logo{font:700 12px monospace;letter-spacing:.14em;color:var(--mint);padding:5px 8px 31px}.side small{font:9px monospace;color:#6d9890;letter-spacing:.12em;padding:0 9px}.side a{display:block;padding:10px 9px;color:#a4c4b9;font-size:11px;text-decoration:none;margin-top:4px}.side a.active{background:#19393a;color:var(--mint);border-left:2px solid var(--mint)}.main{padding:27px 34px}.top{display:flex;justify-content:space-between;align-items:center;padding-bottom:18px;border-bottom:1px solid var(--line)}.crumb{font:10px monospace;color:var(--muted)}.top button{background:var(--mint);border:0;padding:10px 15px;color:#10312c;font-size:10px;font-weight:700}.heading{padding:20px 0}.heading h1{font-size:27px;margin:0;font-weight:500}.heading p{font-size:11px;color:var(--muted);margin:7px 0}.grid{display:grid;grid-template-columns:210px 1fr;gap:15px}.roles{background:var(--surface);border:1px solid var(--line);padding:8px;height:max-content}.role{display:block;width:100%;text-align:left;padding:14px 12px;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}.role:last-child{border:0}.role.active{background:var(--surface2);border-left:3px solid var(--mint)}.role strong{font-size:11px;display:block}.role small{font-size:9px;color:var(--muted);display:block;margin-top:5px}.permission{background:var(--surface);border:1px solid var(--line)}.permhead{display:flex;justify-content:space-between;align-items:center;padding:15px 18px;border-bottom:1px solid var(--line)}.permhead strong{font-size:12px}.permhead small{color:var(--muted);font:9px monospace}.table{width:100%;border-collapse:collapse}.table th{text-align:left;font:9px monospace;color:var(--muted);padding:11px 17px;background:#142d30}.table td{padding:13px 17px;border-top:1px solid var(--line);font-size:10px}.table td:first-child{font-size:11px}.check{accent-color:var(--mint);width:15px;height:15px}.table td:last-child{text-align:center}.preview{display:inline-block;color:var(--gold);border:1px solid #d8c36b55;padding:4px 7px;font:8px monospace;margin-left:8px}.foot{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-top:1px solid var(--line);color:var(--muted);font-size:9px}.foot button{background:var(--mint);border:0;color:#0d2b26;font-weight:700;padding:9px 17px;font-size:10px}.toast{position:fixed;bottom:22px;right:24px;color:#082a22;background:var(--mint);padding:11px 16px;font-size:10px;opacity:0;transition:.18s}.toast.show{opacity:1}@media(max-width:850px){.app{grid-template-columns:170px 1fr}.main{padding:22px 18px}.grid{grid-template-columns:165px 1fr}.table th,.table td{padding:10px}}@media(max-width:640px){.app{display:block}.side{display:none}.main{padding:18px 13px}.grid{grid-template-columns:1fr}.roles{display:flex;overflow:auto}.role{min-width:110px;border-right:1px solid var(--line);border-bottom:0}.table th:nth-child(2),.table td:nth-child(2){display:none}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}

button:hover:not(:disabled){filter:brightness(.92)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid currentColor;outline-offset:2px}button:disabled{cursor:not-allowed;opacity:.48}article:hover{filter:brightness(1.04)}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}</style>
</head>
<body>

<div class="app"><aside class="side"><div class="logo">◒　TIDELINE OS</div><small>管理空间</small><a>总览</a><a class="active">成员与权限</a><a>工作区设置</a><a>活动日志</a></aside><main class="main"><header class="top"><span class="crumb">工作区　/　权限控制</span><button onclick="save()">保存更改</button></header><section class="heading"><h1>角色与权限</h1><p>选择角色预览其权限；调整后保存将影响所有成员。</p></section><section class="grid"><nav class="roles" id="roles"><button type="button" class="role active" data-role="所有者" aria-pressed="true" onclick="selectRole(this)"><strong>所有者</strong><small>完整控制 · 2 位成员</small></button><button type="button" class="role" data-role="编辑者" aria-pressed="false" onclick="selectRole(this)"><strong>编辑者</strong><small>内容与发布 · 5 位成员</small></button><button type="button" class="role" data-role="访客" aria-pressed="false" onclick="selectRole(this)"><strong>访客</strong><small>只读访问 · 12 位成员</small></button></nav><section class="permission"><div class="permhead"><strong><span id="roleName">所有者</span> 权限清单 <span class="preview">预览中</span></strong><small>权限更改会记录在活动日志</small></div><table class="table"><thead><tr><th>权限项目</th><th>说明</th><th>允许</th></tr></thead><tbody id="perms">
<tr><td>管理成员</td><td>邀请、移除或修改成员角色</td><td><input class="check" type="checkbox" checked aria-label="管理成员"></td></tr><tr><td>编辑内容</td><td>创建与修改工作区内容</td><td><input class="check" type="checkbox" checked aria-label="编辑内容"></td></tr><tr><td>发布内容</td><td>使变更对外可见</td><td><input class="check" type="checkbox" checked aria-label="发布内容"></td></tr><tr><td>查看账单</td><td>访问订阅和付款记录</td><td><input class="check" type="checkbox" checked aria-label="查看账单"></td></tr><tr><td>删除工作区</td><td>永久移除工作区</td><td><input class="check" type="checkbox"  aria-label="删除工作区"></td></tr>
</tbody></table><div class="foot"><span>仅工作区管理员可修改角色权限。</span><button onclick="save()">保存更改</button></div></section></section></main></div><div id="toast" class="toast"></div>

<script>const sets={'所有者':[1,1,1,1,0],'编辑者':[0,1,1,0,0],'访客':[0,0,0,0,0]};function selectRole(b){document.querySelectorAll('.role').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.role').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));let r=b.dataset.role;document.getElementById('roleName').textContent=r;document.querySelectorAll('.check').forEach((x,i)=>x.checked=!!sets[r][i])}function save(){const role=document.querySelector('.role.active').dataset.role;sets[role]=Array.from(document.querySelectorAll('.check')).map(x=>x.checked?1:0);let t=document.getElementById('toast');t.textContent='权限已保存';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1500)}</script>
</body>
</html>
