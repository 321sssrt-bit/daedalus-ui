<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>046 团队协作产品</title><style>:root{--page:#F5F0E5;--surface:#FFFDF7;--ink:#302E2A;--muted:#817C70;--accent:#657D59;--line:#E2DACA}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--page);color:var(--ink);font-family:Arial, 'Microsoft YaHei', sans-serif;}button,input,select,textarea{font:inherit}button{cursor:pointer;transition:background-color .15s ease,color .15s ease,transform .15s ease}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button:disabled{opacity:.45;cursor:not-allowed}.preview{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0%,var(--surface),var(--page) 72%)}.phone{width:390px;height:844px;overflow:hidden;border:8px solid #262522;border-radius:40px;background:var(--page);box-shadow:0 28px 100px #0003;display:flex;flex-direction:column}.screen{flex:1;min-height:0;overflow:auto;padding:18px 20px}.desk{width:100%}@media(max-width:430px){.preview{padding:0;background:var(--page)}.phone{width:100vw;height:100dvh;min-height:100dvh;border:0;border-radius:0;box-shadow:none}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}.desk{max-width:1280px;min-height:800px;margin:auto;padding:24px 32px}.top{height:64px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{font:22px Georgia,serif;color:var(--accent)}.team{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}.faces{letter-spacing:-5px;color:var(--accent)}.create{display:flex;gap:8px;margin:18px 0}.create input,.create select{height:42px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--surface);color:var(--ink)}.create input{width:320px}.create select{width:170px}.create button{height:42px;padding:0 16px;border-radius:10px;background:var(--accent);color:white}.main{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:18px}.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.column{background:#eee9dd;border-radius:14px;padding:12px;min-height:570px}.colhead{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;padding:3px 3px 12px}.task{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:12px;margin-bottom:10px}.task strong{font-size:13px}.task small{display:block;color:var(--muted);margin:8px 0}.task button{height:31px;padding:0 10px;border:1px solid var(--line);background:white;color:var(--accent);border-radius:8px;font-size:11px}.task.locked{border-color:#d8bcb0}.activity{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:15px}.activity h2{font:18px Georgia,serif;margin:0 0 12px}.entry{font-size:11px;line-height:1.55;padding:10px 0;border-top:1px solid var(--line);color:var(--muted)}.entry b{color:var(--ink)}.permission{position:fixed;inset:0;background:#231e1a66;display:grid;place-items:center;padding:20px;z-index:3}.permission[hidden]{display:none}.dialog{width:min(400px,100%);padding:24px;background:var(--surface);border-radius:18px;box-shadow:0 20px 60px #0003}.dialog h2{margin:0 0 8px;font-size:19px}.dialog p{font-size:13px;color:var(--muted);line-height:1.6}.dialog button{height:42px;padding:0 14px;border-radius:9px;background:var(--accent);color:white}.dialog .close{background:transparent;color:var(--muted)}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#302e2a;color:white;padding:11px 16px;border-radius:10px;font-size:12px}@media(max-width:900px){.main{grid-template-columns:1fr}.activity{order:-1}.column{min-height:400px}}@media(max-width:768px){.desk{padding:16px;min-height:100dvh}.board{grid-template-columns:1fr}.column{min-height:160px}.create{flex-wrap:wrap}.create input{width:100%;flex:1 1 100%}.top{height:auto;padding-bottom:12px}}</style></head><body><div class=""><main class="desk"><header class="top"><span class="brand">橡木 / workspace</span><div class="team"><span class="faces">●●●</span> 季航的产品组　<span>＋ 邀请</span></div></header><section class="create"><input id="newtitle" placeholder="新增一项任务，例如：整理首页文案"><select id="assignee" aria-label="分派成员"><option>阿棠</option><option>季航</option></select><button id="add">＋ 创建并分派</button></section><div class="main"><section class="board"><div class="column" id="todo"><div class="colhead"><b>待处理</b><span>02</span></div><article class="task"><strong>首页视觉复核</strong><small>负责人 · 阿棠</small><button class="move">推进到进行中 →</button></article><article class="task locked" data-locked="true"><strong>预算审批</strong><small>负责人 · 季航 · 受限</small><button class="move">尝试受限操作</button></article></div><div class="column" id="doing"><div class="colhead"><b>进行中</b><span>01</span></div><article class="task"><strong>新手引导文案</strong><small>负责人 · 季航</small><button class="move">推进到已完成 →</button></article></div><div class="column" id="done"><div class="colhead"><b>已完成</b><span>00</span></div></div></section><aside class="activity"><h2>最近活动</h2><div id="activity"><div class="entry"><b>季航</b> 更新了「新手引导文案」<br>今天 10:20</div><div class="entry"><b>阿棠</b> 创建了「首页视觉复核」<br>今天 09:48</div></div></aside></div><div id="permission" class="permission" hidden><div class="dialog"><h2>暂时没有操作权限</h2><p>“预算审批”需要「项目管理」权限。这次状态没有写入，任务仍留在待处理。</p><button id="request">申请访问</button> <button id="close" class="close">安全返回</button></div></div><div id="toast" class="toast" hidden>访问申请已发送</div></main></div><script>let serial=0;const activity=document.querySelector('#activity');function counts(){document.querySelectorAll('.column').forEach(function(col){col.querySelector('.colhead span').textContent=String(col.querySelectorAll('.task').length).padStart(2,'0')})}function log(text){const e=document.createElement('div');e.className='entry';const actor=document.createElement('b');actor.textContent='你';e.append(actor,document.createTextNode(' '),document.createTextNode(text),document.createElement('br'),document.createTextNode('刚刚'));activity.prepend(e)}function move(card){if(card.dataset.locked){document.querySelector('#permission').hidden=false;return}const col=card.parentElement;const next=col.id==='todo'?'doing':'done';if(col.id==='done')return;document.querySelector('#'+next).append(card);counts();const btn=card.querySelector('button');btn.textContent=next==='doing'?'推进到已完成 →':'已完成';log('推进了「'+card.querySelector('strong').textContent+'」')}document.querySelectorAll('.move').forEach(b=>b.onclick=()=>move(b.closest('.task')));document.querySelector('#add').onclick=()=>{const input=document.querySelector('#newtitle'),title=input.value.trim();if(!title){input.focus();return}const card=document.createElement('article');card.className='task';card.innerHTML='<strong></strong><small></small><button class="move">推进到进行中 →</button>';card.querySelector('strong').textContent=title;card.querySelector('small').textContent='负责人 · '+document.querySelector('#assignee').value;card.querySelector('button').onclick=()=>move(card);document.querySelector('#todo').append(card);counts();log('创建并分派了「'+title+'」');input.value=''};document.querySelector('#request').onclick=()=>{document.querySelector('#permission').hidden=true;log('为「预算审批」申请了项目管理访问权限');const t=document.querySelector('#toast');t.hidden=false;setTimeout(()=>t.hidden=true,1600)};document.querySelector('#close').onclick=()=>document.querySelector('#permission').hidden=true;counts();</script></body></html>
