<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>023 收藏夹 · foundry-saves</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer}a{color:inherit}svg{display:block}

:root{--page:#19231e;--rail:#111915;--surface:#202e27;--surface2:#29392f;--text:#e4e8d6;--muted:#9da997;--line:#43554a;--lime:#c4d56a;--orange:#d68254}body{background:var(--page);color:var(--text);min-height:100vh;font-family:"Arial Narrow",Arial,system-ui,sans-serif}.app{max-width:1240px;margin:auto;min-height:100vh;display:grid;grid-template-columns:190px 1fr}.rail{background:var(--rail);padding:27px 18px;border-right:1px solid #ffffff10}.brand{font:800 13px monospace;letter-spacing:.13em;color:var(--lime);padding:5px 8px 27px}.sectionlabel{font:9px monospace;letter-spacing:.14em;color:#728177;padding:10px 8px}.navitem{display:block;text-decoration:none;color:#aab4a4;padding:10px 9px;font-size:11px;border-radius:3px;margin:3px 0}.navitem.active{background:#35463a;color:var(--lime)}.count{float:right;color:#889689}.main{padding:30px 38px}.top{display:flex;justify-content:space-between;align-items:center}.top span{font:10px monospace;color:var(--muted);letter-spacing:.09em}.top button{border:1px solid var(--line);background:none;color:var(--text);padding:9px 13px;font-size:10px}.heading{display:flex;align-items:end;justify-content:space-between;margin:26px 0 18px}.heading h1{font-size:33px;font-weight:500;margin:0}.heading p{font-size:11px;color:var(--muted);margin:7px 0 0}.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:17px}.tab{border:0;background:none;color:var(--muted);padding:11px 15px;font-size:10px;border-bottom:2px solid transparent}.tab.active{color:var(--lime);border-color:var(--lime)}.items{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.item{background:var(--surface);border:1px solid var(--line);min-height:230px;display:flex;flex-direction:column}.visual{height:126px;position:relative;background:linear-gradient(120deg,#607052,#293930);overflow:hidden}.visual:after{content:"";position:absolute;width:87px;height:87px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#d5b982,#74654b 55%,#393d30);left:50%;top:20px;transform:translateX(-50%);box-shadow:0 14px 25px #0006}.item:nth-child(3n+2) .visual{background:linear-gradient(120deg,#8a6b4c,#34271d)}.item:nth-child(3n+2) .visual:after{border-radius:10px;width:75px;height:88px;background:repeating-linear-gradient(0deg,#ddd4bf 0 5px,#948a78 6px 7px)}.item:nth-child(3n) .visual{background:linear-gradient(120deg,#777b58,#333d31)}.item:nth-child(3n) .visual:after{width:105px;height:52px;border-radius:4px;background:#b3b98d;top:40px}.itembody{padding:12px 13px;display:flex;justify-content:space-between;gap:10px;align-items:start;flex:1}.itembody strong{font-size:12px}.itembody small{display:block;color:var(--muted);font:9px monospace;margin-top:5px}.itembody button{background:none;border:1px solid var(--line);color:var(--orange);font-size:9px;padding:6px 8px}.empty{color:var(--muted);padding:30px;text-align:center;display:none}@media(max-width:850px){.app{grid-template-columns:150px 1fr}.rail{padding:22px 10px}.main{padding:26px 22px}.items{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.app{display:block}.rail{display:none}.main{padding:22px 17px}.items{grid-template-columns:1fr 1fr}.heading h1{font-size:27px}.top button{font-size:9px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}

button:hover:not(:disabled){filter:brightness(.92)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid currentColor;outline-offset:2px}button:disabled{cursor:not-allowed;opacity:.48}article:hover{filter:brightness(1.04)}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}</style>
</head>
<body>

<div class="app"><aside class="rail"><div class="brand">F O U N D R Y</div><div class="sectionlabel">工作台</div><a class="navitem">概览</a><a class="navitem active">收藏库 <span class="count" id="count">6</span></a><a class="navitem">最近浏览</a><div class="sectionlabel">个人</div><a class="navitem">我的标签</a></aside><main class="main"><header class="top"><span>COLLECTION / PERSONAL</span><button onclick="alert('已复制收藏夹链接')">分享收藏夹 ↗</button></header><section class="heading"><div><h1>慢慢攒下来的东西</h1><p>从不同地方带回来的灵感与器物。</p></div><span style="font:10px monospace;color:var(--muted)">已收藏 <b id="total">6</b> 件</span></section><nav class="tabs"><button class="tab active" onclick="filter('all',this)">全部　6</button><button class="tab" onclick="filter('器物',this)">器物</button><button class="tab" onclick="filter('阅读',this)">阅读</button><button class="tab" onclick="filter('空间',this)">空间</button></nav><section class="items" id="items">
<article class="item" data-kind="器物"><div class="visual"></div><div class="itembody"><div><strong>旧木椅修复手册</strong><small>京都 · 纸本档案</small></div><button onclick="remove(this)">移出收藏</button></div></article><article class="item" data-kind="器物"><div class="visual"></div><div class="itembody"><div><strong>河岸的手作玻璃杯</strong><small>台南 · 青弦工房</small></div><button onclick="remove(this)">移出收藏</button></div></article><article class="item" data-kind="阅读"><div class="visual"></div><div class="itembody"><div><strong>从材料出发的建筑</strong><small>专栏 · 07</small></div><button onclick="remove(this)">移出收藏</button></div></article><article class="item" data-kind="空间"><div class="visual"></div><div class="itembody"><div><strong>一间不急着营业的店</strong><small>杭州 · 旧厂房</small></div><button onclick="remove(this)">移出收藏</button></div></article><article class="item" data-kind="阅读"><div class="visual"></div><div class="itembody"><div><strong>石灰墙的日常维护</strong><small>手记 · 设计观察</small></div><button onclick="remove(this)">移出收藏</button></div></article><article class="item" data-kind="器物"><div class="visual"></div><div class="itembody"><div><strong>灰釉圆盘 / 1986</strong><small>二手市集 · 釜山</small></div><button onclick="remove(this)">移出收藏</button></div></article>
</section><p class="empty" id="empty">这个分类还没有收藏。</p></main></div>

<script>function filter(k,b){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');let n=0;document.querySelectorAll('.item').forEach(x=>{let show=k==='all'||x.dataset.kind===k;x.hidden=!show;if(show)n++});document.getElementById('empty').style.display=n?'none':'block'}function remove(b){b.closest('.item').remove();let n=document.querySelectorAll('.item').length;document.getElementById('count').textContent=n;document.getElementById('total').textContent=n;document.querySelector('.tab').textContent='全部　'+n;if(!n)document.getElementById('empty').style.display='block'}</script>
</body>
</html>
