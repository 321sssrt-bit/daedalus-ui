<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="page-name" content="004 新手引导"><title>004 新手引导</title><style>:root{--page:#090e20;--surface:#111a35;--text:#eff3ff;--muted:#8b9bbd;--accent:#7f8cff;--accent2:#55d9cf;--line:#263259}*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--text);font:15px/1.55 system-ui,sans-serif}.page{min-height:800px;padding:24px 48px;background:radial-gradient(circle at 76% 47%,#18224b,#090e20 55%)}header{height:52px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;font-size:12px;letter-spacing:.14em}header i{color:var(--accent);font-style:normal}header button{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:99px;padding:8px 14px;font-size:10px}.stage{width:min(1120px,100%);min-height:680px;margin:22px auto;display:grid;grid-template-columns:53% 47%;align-items:center}.copy{padding:28px 44px 28px 16px}.eyebrow{color:var(--accent2);font-size:10px;letter-spacing:.13em}.dots{display:flex;align-items:center;gap:11px;margin:25px 0;color:#7180a1;font-size:10px}.dots span{width:34px;height:1px;background:var(--line)}.dots b{font-weight:500}.dots .active{width:34px;height:34px;border:1px solid var(--accent);border-radius:50%;display:grid;place-items:center;color:#fff}.copy h1{font-size:42px;line-height:1.15}.desc{color:#bdc7e2;font-size:15px;min-height:55px}.buttons{display:flex;gap:10px;margin:29px 0 14px}.buttons button{height:46px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--text)}.buttons #next{min-width:150px;background:var(--accent);border-color:var(--accent);color:#fff;font-weight:750}.copy small{font-size:10px;color:var(--muted)}.orbit{width:390px;height:390px;max-width:100%;margin:auto;border:1px solid #283762;border-radius:50%;position:relative;display:grid;place-items:center;background:radial-gradient(circle,#18234a 0,#101a36 47%,transparent 48%)}.ring{position:absolute;border:1px solid #4654a366;border-radius:50%}.r1{width:68%;height:32%;transform:rotate(-30deg)}.r2{width:94%;height:47%;transform:rotate(42deg)}.r3{width:82%;height:82%;border-style:dashed}.planet{width:102px;height:102px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 34% 30%,#9dacf9,#424fb7 60%,#202852);box-shadow:0 0 50px #7f8cff66;font-size:13px;font-weight:800}.orbit>i{position:absolute;top:13%;left:24%;color:var(--accent2);font-style:normal;font-size:20px}.orbit>label{position:absolute;right:-18px;bottom:34px;background:#0d152b;border:1px solid var(--line);border-radius:11px;padding:10px 14px;font-size:9px;color:var(--muted)}.orbit>label b{color:var(--text)}footer{font-size:9px;letter-spacing:.16em;color:#627094;border-top:1px solid var(--line);padding-top:14px}button:focus-visible{outline:3px solid var(--accent2);outline-offset:3px}@media(max-width:900px){.page{padding:20px 28px}.stage{grid-template-columns:54% 46%;min-height:650px}.copy{padding:20px}.orbit{width:300px;height:300px}.copy h1{font-size:35px}}@media(max-width:640px){.page{padding:14px}.stage{display:flex;flex-direction:column-reverse;margin:15px auto}.orbit{width:220px;height:220px}.planet{width:72px;height:72px}.copy{padding:12px 6px}.copy h1{font-size:30px}.dots{margin:15px 0}.buttons{margin:18px 0}.orbit>label{right:-6px;bottom:10px}footer{font-size:7px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}</style></head><body>
<main class="page"><header><b>ASTRA <i>/</i> 观测站</b><button id="skip">跳过引导 ↗</button></header>
<section class="stage"><div class="copy"><p class="eyebrow">FIRST LIGHT / <span id="num">01</span> — 03</p><div class="dots"><b class="active">01</b><span></span><b>02</b><span></span><b>03</b></div><h1 id="heading">校准望远镜</h1><p class="desc" id="desc">先熟悉你的观测台。星图、目镜与夜空记录都会在这里相遇。</p><div class="buttons"><button id="back" disabled>← 上一步</button><button id="next">下一步　→</button></div><small>约需 1 分钟 · 可随时从帮助菜单重看</small></div>
<div class="orbit"><div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div><div class="planet" id="planet">01</div><i>✦</i><label>观测目标<br><b id="target">校准视野</b></label></div></section><footer>ASTRA OBSERVATORY　·　23° 08′ N　113° 16′ E</footer></main>
<script>const steps=[["校准望远镜","先熟悉你的观测台。星图、目镜与夜空记录都会在这里相遇。","校准视野"],["选择观测目标","从月面、行星或深空天体开始，每个目标都附有今晚的观测提示。","挑选星体"],["记录第一颗星","写下你看到的细节，保存后会出现在个人观测日志里。","记录发现"]];let n=0;function draw(){document.getElementById("num").textContent="0"+(n+1);document.getElementById("heading").textContent=steps[n][0];document.getElementById("desc").textContent=steps[n][1];document.getElementById("target").textContent=steps[n][2];document.getElementById("planet").textContent="0"+(n+1);document.getElementById("back").disabled=n===0;document.getElementById("next").textContent=n===2?"开始观测　↗":"下一步　→";document.querySelectorAll(".dots b").forEach((e,i)=>e.className=i===n?"active":"")}document.getElementById("next").onclick=function(){if(n<2){n++;draw()}else document.getElementById("desc").textContent="观测台已打开，祝你有一个好夜晚。"};document.getElementById("back").onclick=function(){if(n){n--;draw()}};document.getElementById("skip").onclick=function(){n=2;draw();document.getElementById("desc").textContent="引导已跳过，你可以直接开始观测。"}</script></body></html>
