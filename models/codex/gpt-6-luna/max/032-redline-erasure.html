<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>032 危险删除 · redline-erasure</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer}a{color:inherit}svg{display:block}

:root{--page:#e8e9e6;--surface:#f7f7f5;--ink:#282b29;--muted:#757a77;--line:#c8ccca;--red:#b73936;--redsoft:#f4d9d7;--dark:#363c39;--green:#427357}body{background:#e8e9e6;color:var(--ink);min-height:100vh;font-family:Arial,system-ui,sans-serif}.wrap{max-width:1080px;margin:auto;padding:0 42px}.top{height:66px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{font:700 11px monospace;letter-spacing:.12em}.top span{font:9px monospace;color:var(--muted)}.crumb{padding:19px 0 12px;font-size:10px;color:var(--muted)}.layout{display:grid;grid-template-columns:215px 1fr;gap:34px}.side{background:var(--surface);border:1px solid var(--line);padding:14px;height:max-content}.side b{display:block;font-size:10px;margin:0 0 10px}.side a{display:block;text-decoration:none;color:var(--muted);font-size:10px;padding:10px 8px;border-top:1px solid #e8e9e7}.side a.active{color:var(--red);font-weight:700}.content{max-width:690px}.tag{color:var(--red);font:9px monospace;letter-spacing:.13em}.content h1{font-size:29px;margin:8px 0 7px}.lead{font-size:11px;color:var(--muted);margin:0 0 17px}.danger{background:var(--surface);border:1px solid var(--line);padding:17px 19px;margin-bottom:12px}.danger h2{font-size:12px;margin:0 0 11px}.danger ul{margin:0;padding-left:17px;font-size:10px;line-height:1.9;color:#595e5b}.danger strong{color:var(--red)}.list{border-collapse:collapse;width:100%;font-size:10px}.list td{padding:9px 0;border-top:1px solid #e1e3e1}.list td:last-child{text-align:right;color:var(--muted);font-family:monospace}.warning{background:var(--redsoft);border-left:4px solid var(--red);padding:12px 14px;margin-bottom:14px;font-size:10px;line-height:1.6;color:#702d2b}.confirmbox{background:var(--surface);border:1px solid var(--line);padding:17px}.confirmbox label{font-size:10px;display:block;margin:0 0 8px}.confirmbox input{width:100%;height:38px;border:1px solid var(--line);padding:0 10px;background:#fff;font:11px monospace;outline:none}.confirmbox input:focus{border-color:var(--red);box-shadow:0 0 0 3px #b7393619}.hint{font-size:9px;color:var(--muted);margin-top:7px}.actions{display:flex;justify-content:flex-end;gap:9px;margin:14px 0 35px}.cancel{border:1px solid var(--dark);background:var(--dark);color:#fff;padding:12px 19px;font-size:10px;font-weight:700}.delete{border:1px solid var(--red);background:var(--red);color:white;padding:12px 19px;font-size:10px}.delete:disabled{background:#d5aaa8;border-color:#d5aaa8;cursor:not-allowed}.toast{position:fixed;bottom:20px;right:22px;background:var(--dark);color:#fff;padding:12px 16px;font-size:10px;display:none}.toast.show{display:block}@media(max-width:800px){.wrap{padding:0 24px}.layout{grid-template-columns:175px 1fr;gap:20px}}@media(max-width:620px){.layout{grid-template-columns:1fr}.side{display:flex;gap:5px;overflow:auto}.side b{display:none}.side a{white-space:nowrap;border-top:0;border-bottom:2px solid transparent}.side a.active{border-color:var(--red)}.content h1{font-size:25px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}

button:hover:not(:disabled){filter:brightness(.92)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid currentColor;outline-offset:2px}button:disabled{cursor:not-allowed;opacity:.48}article:hover{filter:brightness(1.04)}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}</style>
</head>
<body>

<main class="wrap"><header class="top"><div class="brand">WORKSPACE / 控制台</div><span>组织　山径设计</span><span>管理员　陈予安</span></header><div class="crumb">设置　/　数据与访问　/　移除工作区</div><div class="layout"><nav class="side"><b>数据与访问</b><a>工作区资料</a><a>成员与角色</a><a>导出数据</a><a class="active">删除工作区</a></nav><section class="content"><span class="tag">高风险操作　/　不可恢复</span><h1>删除这个工作区</h1><p class="lead">删除后，所有成员都将失去访问权。请在继续前完整阅读影响。</p><section class="danger"><h2>你将永久失去</h2><table class="list"><tr><td>项目与文件</td><td>46 个项目 · 18.2 GB</td></tr><tr><td>成员评论与历史版本</td><td>1,284 条记录</td></tr><tr><td>自动化、权限与分享链接</td><td>全部停用</td></tr></table></section><div class="warning"><strong>此操作无法撤销。</strong> 导出备份不会替你恢复评论、权限配置或分享链接。请先确认已下载需要保留的数据。</div><div class="confirmbox"><label for="phrase">输入工作区名称以确认：<strong>山径设计</strong></label><input id="phrase" autocomplete="off" placeholder="山径设计" oninput="gate()"><div class="hint">名称区分空格与符号；输入完全匹配后才能删除。</div></div><div class="actions"><button class="cancel" onclick="cancel()">先保留工作区</button><button id="delete" class="delete" disabled onclick="erase()">永久删除工作区</button></div></section></div></main><div id="toast" class="toast"></div>

<script>function gate(){document.getElementById('delete').disabled=document.getElementById('phrase').value!=='山径设计'}function cancel(){document.getElementById('phrase').value='';gate();let t=document.getElementById('toast');t.textContent='工作区已保留';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1500)}function erase(){let b=document.getElementById('delete');b.textContent='已提交删除请求';b.disabled=true;b.style.background='var(--dark)';document.getElementById('phrase').disabled=true;document.getElementById('toast').textContent='删除请求已记录（原型演示）';document.getElementById('toast').classList.add('show')}</script>
</body>
</html>
