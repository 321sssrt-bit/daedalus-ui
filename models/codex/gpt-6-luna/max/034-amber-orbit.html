<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>034 正在播放</title>
<style>
:root{--page:#15120F;--surface:#231E18;--ink:#F8F0DE;--muted:#B7A994;--accent:#E5A84B;--line:#7B6751;--frame:#262522}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--page);color:var(--ink);font-family:Arial, 'Microsoft YaHei', sans-serif}
body{min-height:100vh}
button,input,textarea,select{font:inherit}
button{border:0;cursor:pointer;transition:background-color .16s ease,color .16s ease,transform .16s ease}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
button:disabled{cursor:not-allowed;opacity:.45}
.preview{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 5%,var(--surface),var(--page) 72%)}
.phone{width:390px;height:844px;overflow:hidden;border:8px solid var(--frame);border-radius:42px;background:var(--page);box-shadow:0 28px 100px #0003;display:flex;flex-direction:column}
.screen{flex:1;min-height:0;overflow:auto;padding:20px 22px}
@media(max-width:430px){.preview{padding:0;background:var(--page)}.phone{width:100vw;height:100dvh;min-height:100dvh;border:0;border-radius:0;box-shadow:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
.top{height:52px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 22px;color:var(--muted);font-size:12px;letter-spacing:.12em}.screen{padding-top:8px}.hero{height:310px;border-radius:22px;background:linear-gradient(145deg,#392c1f,#211b15);display:grid;place-items:center;position:relative;overflow:hidden}.hero:before,.hero:after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;border:1px solid #e5a84b55}.hero:after{width:160px;height:160px}.disc{width:150px;height:150px;border-radius:50%;background:repeating-radial-gradient(circle,#211f1b 0 3px,#54483b 4px 5px);display:grid;place-items:center;z-index:1;box-shadow:0 14px 40px #0008}.disc span{width:48px;height:48px;border-radius:50%;background:var(--accent);display:grid;place-items:center;color:#23180a;font-size:11px}.song{margin-top:22px;display:flex;align-items:start;justify-content:space-between}.song h1{font-size:22px;margin:0 0 6px}.song p{font-size:13px;color:var(--muted);margin:0}.like{background:none;color:var(--accent);font-size:22px}.range{width:100%;accent-color:var(--accent);margin:22px 0 0}.times{display:flex;justify-content:space-between;color:var(--muted);font:11px Arial}.controls{height:82px;display:flex;align-items:center;justify-content:center;gap:30px}.controls button{background:none;color:var(--ink);font-size:19px}.controls .play{width:52px;height:52px;border-radius:50%;background:var(--accent);color:#21170c;font-size:20px}.queue{border-top:1px solid #ffffff19;padding-top:12px;color:var(--muted);font-size:12px}.queue b{float:right;color:var(--ink);font-weight:500}
button:hover:not(:disabled){filter:brightness(.92)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid currentColor;outline-offset:2px}button:disabled{cursor:not-allowed;opacity:.48}article:hover{filter:brightness(1.04)}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}</style>
</head>
<body>
<div class="preview">
<main class="phone">
<header class="top"><span>◉ 夜航 FM</span><span>正在播放</span><span>⋯</span></header><section class="screen"><div class="hero" aria-label="唱片封面插画"><div class="disc"><span>夜航</span></div></div><div class="song"><div><h1 id="track">晚风经过旧城</h1><p id="artist">林间电台 · 夜航手记</p></div><button class="like" aria-label="收藏">♡</button></div><input id="progress" class="range" type="range" min="0" max="258" value="96" aria-label="播放进度"><div class="times"><span id="elapsed">01:36</span><span>04:18</span></div><div class="controls"><button aria-label="上一首">↶</button><button id="play" class="play" aria-label="播放或暂停">Ⅱ</button><button id="next" aria-label="下一首">≫</button></div><div class="queue">下一首 <b>海岸线以北 · 3 首待播</b></div></section>
</main>
</div>
<script>
const play=document.querySelector('#play');play.onclick=()=>{const on=play.textContent==='Ⅱ';play.textContent=on?'▶':'Ⅱ';play.setAttribute('aria-label',on?'播放':'暂停')};document.querySelector('#next').onclick=()=>{document.querySelector('#track').textContent='海岸线以北';document.querySelector('#artist').textContent='林间电台 · 夜航手记';document.querySelector('#progress').value=0;document.querySelector('#elapsed').textContent='00:00'};document.querySelector('#progress').oninput=e=>{const s=+e.target.value;document.querySelector('#elapsed').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};document.querySelector('.like').onclick=e=>e.currentTarget.textContent=e.currentTarget.textContent==='♡'?'♥':'♡';
</script>
</body>
</html>
