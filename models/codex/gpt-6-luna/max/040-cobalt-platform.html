<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>040 等候</title>
<style>
:root{--page:#F2F6FC;--surface:#FFFFFF;--ink:#1D2E48;--muted:#7587A2;--accent:#316EC4;--line:#D7E3F4;--frame:#262522}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--page);color:var(--ink);font-family:Arial, 'Microsoft YaHei', sans-serif}
body{min-height:100vh}
button,input,textarea,select{font:inherit}
button{border:0;cursor:pointer;transition:background-color .16s ease,color .16s ease,transform .16s ease}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
button:disabled{cursor:not-allowed;opacity:.45}
.preview{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 5%,var(--surface),var(--page) 72%)}
.phone{width:390px;height:844px;overflow:hidden;border:8px solid var(--frame);border-radius:42px;background:var(--page);box-shadow:0 28px 100px #0003;display:flex;flex-direction:column}
.screen{flex:1;min-height:0;overflow:auto;padding:20px 22px}
@media(max-width:430px){.preview{padding:0;background:var(--page)}.phone{width:100vw;height:100dvh;min-height:100dvh;border:0;border-radius:0;box-shadow:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
.top{height:56px;display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:13px}.screen{padding-top:12px}.summary{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px}.kicker{color:var(--accent);font-size:12px;font-weight:700}.eta{display:flex;align-items:end;gap:8px;margin:14px 0}.eta strong{font-size:39px;letter-spacing:-.05em}.eta span{color:var(--muted);font-size:14px;padding-bottom:7px}.summary p{color:var(--muted);font-size:13px;margin:0}.steps{margin:24px 0 0;padding-left:3px}.step{display:grid;grid-template-columns:28px 1fr;gap:12px;min-height:70px}.dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);margin-top:2px;position:relative}.step:not(:last-child) .dot:after{content:"";position:absolute;width:2px;height:52px;background:var(--line);top:16px;left:6px}.step.done .dot{border-color:var(--accent);background:var(--accent)}.step.current .dot{border-color:var(--accent);box-shadow:0 0 0 5px #316ec41c}.step strong{font-size:14px}.step small{display:block;margin-top:5px;color:var(--muted);font-size:12px}.actions{margin-top:auto;padding:12px 22px 18px;display:grid;gap:8px}.actions button{height:46px;border-radius:13px}.away{background:var(--accent);color:white}.cancel{background:transparent;color:var(--muted)}
button:hover:not(:disabled){filter:brightness(.92)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid currentColor;outline-offset:2px}button:disabled{cursor:not-allowed;opacity:.48}article:hover{filter:brightness(1.04)}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}</style>
</head>
<body>
<div class="preview">
<main class="phone">
<header class="top"><span>‹ 申请进度</span><span>服务请求</span><span>⋯</span></header><section class="screen"><article class="summary"><div class="kicker" id="status">● 处理中</div><div class="eta"><strong>约 3</strong><span>分钟</span></div><p>前面还有 2 位 · 提交于 10:42</p></article><div class="steps"><div class="step done"><i class="dot"></i><div><strong>资料已提交</strong><small>今天 10:42</small></div></div><div class="step current"><i class="dot"></i><div><strong id="current">正在核对资料</strong><small>通常需要 3–5 分钟</small></div></div><div class="step"><i class="dot"></i><div><strong>完成处理</strong><small>处理完成后会收到通知</small></div></div></div></section><footer class="actions"><button id="away" class="away">放到一边，稍后提醒我</button><button id="cancel" class="cancel">取消这次申请</button></footer>
</main>
</div>
<script>
document.querySelector('#away').onclick=()=>{document.querySelector('#status').textContent='已放到一边 · 完成后提醒你';document.querySelector('#away').textContent='已为你保留进度'};document.querySelector('#cancel').onclick=()=>{document.querySelector('#status').textContent='申请已取消';document.querySelector('#current').textContent='等待已结束';document.querySelector('#cancel').disabled=true;document.querySelector('#away').textContent='返回申请首页'};
</script>
</body>
</html>
