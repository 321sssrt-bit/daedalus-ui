<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>棱镜数据 · 活跃用户</title>
<style>
:root{--page:#111317;--surface:#1A1E24;--text:#EEF2F1;--muted:#929BA1;--accent:#C7F36B;--pink:#FF6F9A;--line:#2A3036;--dim:#20252A}
*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--text);font:14px/1.5 "Segoe UI","Microsoft YaHei",sans-serif}button{font:inherit;cursor:pointer;color:inherit}button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.frame{max-width:1240px;margin:auto;padding:0 30px}.top{height:70px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:11px;font-weight:700;letter-spacing:.02em}.mark{height:28px;width:28px;border:1px solid var(--accent);color:var(--accent);display:grid;place-items:center;border-radius:8px}.nav{display:flex;gap:26px;color:var(--muted);font-size:12px}.nav b{color:var(--text)}.user{font-size:12px;color:var(--muted)}
main{padding:36px 0 48px}.title-row{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:23px}.eyebrow{color:var(--accent);font-size:10px;letter-spacing:.16em;text-transform:uppercase}.title-row h1{font-size:30px;letter-spacing:-.04em;margin:5px 0}.title-row p{color:var(--muted);margin:0;font-size:12px}.range{border:1px solid var(--line);border-radius:8px;padding:9px 13px;color:var(--muted);font-size:12px}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.metric{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:17px 18px;min-height:107px;position:relative;overflow:hidden}.metric:after{content:"";position:absolute;width:66px;height:66px;border:1px solid #c7f36b22;right:-20px;bottom:-31px;border-radius:50%}.metric label{color:var(--muted);font-size:11px}.value{font-size:25px;font-weight:650;letter-spacing:-.04em;margin-top:9px}.delta{font-size:11px;color:var(--accent);margin-left:7px}.delta.pink{color:var(--pink)}
.chart-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 24px 16px}.chart-head{display:flex;justify-content:space-between;align-items:flex-start}.chart-head h2{font-size:16px;margin:0 0 3px}.chart-head p{margin:0;color:var(--muted);font-size:11px}.tabs{display:flex;gap:4px;background:#111317;padding:4px;border-radius:9px}.tabs button{border:0;background:transparent;color:var(--muted);font-size:11px;padding:7px 13px;border-radius:6px}.tabs button[aria-pressed="true"]{background:var(--accent);color:#182016;font-weight:700}.legend{display:flex;gap:16px;justify-content:flex-end;color:var(--muted);font-size:10px;margin:18px 0 0}.legend span{display:flex;align-items:center;gap:6px}.dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}.dot.pink{background:var(--pink)}
.chart{width:100%;height:265px;display:block;margin-top:9px}.axis{fill:#778188;font-size:10px;font-family:inherit}.gridline{stroke:#32383E;stroke-width:1}.bar{fill:var(--accent);opacity:.78;rx:4;transition:height .16s ease,y .16s ease}.bar:hover{opacity:1}.trend{fill:none;stroke:var(--pink);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.point{fill:var(--surface);stroke:var(--pink);stroke-width:2}
.foot{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:15px;color:var(--muted);font-size:11px;margin-top:7px}.live{display:flex;align-items:center;gap:7px;color:#B2C1A6}.live i{width:6px;height:6px;border-radius:50%;background:var(--accent)}
@media(max-width:850px){.frame{padding:0 20px}.metrics{grid-template-columns:repeat(2,1fr)}.chart{height:240px}.nav{gap:14px}}
@media(max-width:600px){.top{height:62px}.nav{display:none}.title-row{align-items:flex-start;gap:12px;flex-direction:column}.title-row h1{font-size:26px}.metrics{gap:8px}.metric{padding:13px;min-height:92px}.value{font-size:21px}.chart-card{padding:16px 12px}.chart{height:210px}.tabs button{padding:7px 10px}.legend{justify-content:flex-start}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style></head>
<body><div class="frame"><header class="top"><div class="brand"><span class="mark">◒</span>棱镜 / INSIGHT</div><nav class="nav"><span>总览</span><b>行为分析</b><span>留存</span><span>实验</span></nav><span class="user">观测空间　⌄</span></header>
<main><div class="title-row"><div><div class="eyebrow">核心指标 / 01</div><h1>活跃用户</h1><p>看清每一次回访背后的节奏。</p></div><div class="range">◷　2026.09.01 — 09.30　⌄</div></div>
<section class="metrics" aria-label="关键数字"><article class="metric"><label>月活跃用户</label><div class="value">18,462 <span class="delta">↗ 12.8%</span></div></article><article class="metric"><label>日均活跃</label><div class="value">3,208 <span class="delta">↗ 6.4%</span></div></article><article class="metric"><label>回访频次</label><div class="value">2.7 <span class="delta">↗ 0.3</span></div></article><article class="metric"><label>平均停留</label><div class="value">4<span style="font-size:14px">分</span> 32<span style="font-size:14px">秒</span> <span class="delta pink">→ 稳定</span></div></article></section>
<section class="chart-card"><div class="chart-head"><div><h2>活跃趋势</h2><p id="period-note">9 月 1 日至 7 日 · 每日独立访客</p></div><div class="tabs" role="group" aria-label="切换图表粒度"><button data-period="day" aria-pressed="true">日</button><button data-period="week" aria-pressed="false">周</button><button data-period="month" aria-pressed="false">月</button></div></div>
<div class="legend"><span><i class="dot"></i>本期活跃</span><span><i class="dot pink"></i>上期对照</span></div>

>07</text></g></svg>
<div class="foot"><span>对比上一周期　·　数据每小时更新</span><span class="live"><i></i>数据已同步</span></div></section></main></div>
<script>
const tabs=[...document.querySelectorAll('[data-period]')],bars=[...document.querySelectorAll('.bar')],note=document.querySelector('#period-note');
const labels={day:'9 月 1 日至 7 日 · 每日独立访客',week:'8 月第 4 周至 9 月第 2 周 · 每周独立访客',month:'2026 年 3 月至 9 月 · 每月独立访客'};
document.querySelector('.tabs').addEventListener('click',e=>{const button=e.target.closest('[data-period]');if(!button)return;const key=button.dataset.period;tabs.forEach(t=>t.setAttribute('aria-pressed',String(t===button)));bars.forEach(b=>{const h=Number(b.dataset[key]);b.setAttribute('height',h);b.setAttribute('y',210-h)});note.textContent=labels[key]});
</script></body></html>
