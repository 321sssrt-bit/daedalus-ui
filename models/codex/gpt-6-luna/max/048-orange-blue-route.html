<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>048 出行服务产品</title><style>:root{--page:#F7F5F0;--surface:#FFFFFF;--ink:#24364A;--muted:#788899;--accent:#E68146;--line:#DDE2E5}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--page);color:var(--ink);font-family:Arial, 'Microsoft YaHei', sans-serif;}button,input,select,textarea{font:inherit}button{cursor:pointer;transition:background-color .15s ease,color .15s ease,transform .15s ease}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button:disabled{opacity:.45;cursor:not-allowed}.preview{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0%,var(--surface),var(--page) 72%)}.phone{width:390px;height:844px;overflow:hidden;border:8px solid #262522;border-radius:40px;background:var(--page);box-shadow:0 28px 100px #0003;display:flex;flex-direction:column}.screen{flex:1;min-height:0;overflow:auto;padding:18px 20px}.desk{width:100%}@media(max-width:430px){.preview{padding:0;background:var(--page)}.phone{width:100vw;height:100dvh;min-height:100dvh;border:0;border-radius:0;box-shadow:none}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}.top{height:58px;display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px}.screen{padding-top:6px}.screen h1{font:22px Georgia,serif;margin:4px 0 14px}.route{display:flex;align-items:center;justify-content:space-between;padding:15px 13px;background:var(--surface);border:1px solid var(--line);border-radius:15px}.route div{font-size:13px;font-weight:700}.route small{display:block;color:var(--muted);font-size:10px;font-weight:400;margin-bottom:4px}.route .arrow{color:var(--accent);font-size:20px}.date{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);padding:12px 3px}.search{width:100%;height:46px;border-radius:11px;background:var(--accent);color:white;font-weight:700}.sectiontitle{margin:15px 0 8px;font-size:13px}.trip{display:flex;align-items:center;gap:10px;padding:11px;border:1px solid var(--line);border-radius:13px;background:var(--surface);margin:8px 0}.trip.selected{border:2px solid var(--accent)}.trip input{accent-color:var(--accent)}.trip time{font-weight:700;font-size:16px;min-width:48px}.trip small{display:block;color:var(--muted);font-size:10px;margin-top:4px}.fare{margin-left:auto;font-weight:700;color:#394c61;font-size:13px}.seatrow{display:flex;gap:8px}.seat{flex:1;height:42px;border:1px solid var(--line);border-radius:10px;background:white;color:var(--ink);font-size:11px}.seat.selected{border:2px solid var(--accent);color:var(--accent)}.seat.sold{border-style:dashed;color:#a65336}.confirm{width:100%;height:49px;border-radius:12px;background:var(--accent);color:white;font-weight:700;margin-top:13px}.error{margin-top:9px;padding:10px;border-radius:10px;background:#fff0e9;color:#a14b32;font-size:11px;line-height:1.5}.receipt{padding:18px;margin-top:14px;background:#eaf4ec;border-radius:16px;text-align:center}.receipt strong{display:block;font-size:18px;color:#406e48;margin:8px}.receipt p{font-size:12px;color:var(--muted)}.route label{display:flex;flex-direction:column;gap:5px;font-size:9px;color:var(--muted);min-width:0}.route input{width:105px;max-width:100%;border:0;background:transparent;color:var(--ink);font-size:13px;font-weight:700;outline:none}.route input:focus-visible{outline:2px solid var(--accent)}.date input{font:inherit;color:var(--ink);border:1px solid var(--line);background:var(--surface);padding:5px}#results[hidden]{display:none}</style></head><body><div class="preview"><main class="phone"><header class="top"><button>‹ 返回</button><span>城际车票</span><span>订单</span></header><section class="screen"><h1>下一站，见面</h1><div class="route"><label>出发站<input id="from" value="杭州东" aria-label="出发站"></label><span class="arrow">→</span><label>到达站<input id="to" value="上海虹桥" aria-label="到达站"></label></div><div class="date"><label for="travelDate">出发日期</label><input id="travelDate" type="date" value="2026-09-24"></div><button id="search" class="search">搜索班次</button><div id="searchError" class="error" hidden></div><div id="results" hidden><div class="sectiontitle" id="searchSummary">杭州东 → 上海虹桥</div><div class="sectiontitle">可选班次　·　2 班</div><label class="trip selected"><input type="radio" name="trip" value="G7324" checked><time>09:20</time><span><b>G7324</b><small>1 小时 02 分 · 二等座可选</small></span><span class="fare">¥73</span></label><label class="trip"><input type="radio" name="trip" value="G7330"><time>09:55</time><span><b>G7330</b><small>1 小时 08 分 · 售罄检测演示</small></span><span class="fare">¥73</span></label><div class="sectiontitle">选择座位</div><div class="seatrow"><button class="seat selected" data-seat="A08">A08 · 靠窗</button><button class="seat" data-seat="D03">D03 · 售罄测试</button></div><div id="error" class="error" hidden></div><button id="confirm" class="confirm">确认订单　¥73</button></div><div id="receipt" class="receipt" hidden></div></section></main></div><script>
let selectedSeat='A08',orderCounter=0;
const results=document.querySelector('#results'),receipt=document.querySelector('#receipt'),from=document.querySelector('#from'),to=document.querySelector('#to'),travelDate=document.querySelector('#travelDate');
function routeLabel(){return from.value.trim()+' → '+to.value.trim()}
function dateLabel(){const parts=travelDate.value.split('-');return parts.length===3?Number(parts[1])+' 月 '+Number(parts[2])+' 日':travelDate.value}
document.querySelector('#search').onclick=function(){
  const error=document.querySelector('#searchError');error.hidden=true;receipt.hidden=true;results.hidden=true;document.querySelector('#error').hidden=true;
  if(!from.value.trim()||!to.value.trim()||!travelDate.value){error.hidden=false;error.textContent='请填写出发站、到达站和日期。';return}
  document.querySelector('#searchSummary').textContent=routeLabel()+'　·　'+dateLabel();results.hidden=false;
};
document.querySelectorAll('.trip').forEach(function(trip){trip.onclick=function(){document.querySelectorAll('.trip').forEach(function(item){item.classList.remove('selected')});trip.classList.add('selected');document.querySelector('#error').hidden=true}});
document.querySelectorAll('.seat').forEach(function(button){button.onclick=function(){document.querySelectorAll('.seat').forEach(function(item){item.classList.remove('selected')});button.classList.add('selected');selectedSeat=button.dataset.seat;document.querySelector('#error').hidden=true}});
document.querySelector('#confirm').onclick=function(){
  const chosen=document.querySelector('input[name="trip"]:checked'),trip=chosen.value;
  const tripTime=chosen.parentElement.querySelector('time').textContent;
  if(selectedSeat==='D03'||trip==='G7330'){const error=document.querySelector('#error');error.hidden=false;error.textContent=(selectedSeat==='D03'?'D03 座位':'G7330 班次')+'已售罄。路线和出发日期已为你保留，请改选可用班次或座位。';return}
  orderCounter++;
  receipt.replaceChildren();
  const label=document.createElement('small');label.textContent='行程凭证 · 已出票';
  const route=document.createElement('strong');route.textContent=routeLabel();
  const detail=document.createElement('p');detail.textContent=dateLabel()+' · '+trip+' '+tripTime+' · '+selectedSeat+' 靠窗';
  const order=document.createElement('b');order.textContent='订单号 TR0923-048-'+String(orderCounter).padStart(3,'0');
  document.querySelector('#error').hidden=true;receipt.append(label,route,detail,order);receipt.hidden=false;results.hidden=true;
};
[from,to,travelDate].forEach(function(input){input.addEventListener('input',function(){document.querySelector('#searchError').hidden=true;document.querySelector('#error').hidden=true;results.hidden=true;receipt.hidden=true})});
</script></body></html>
