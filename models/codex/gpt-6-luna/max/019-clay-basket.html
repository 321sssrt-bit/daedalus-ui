<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>019 购物车 · clay-basket</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer}a{color:inherit}svg{display:block}

:root{--page:#f1e6d8;--card:#fffaf3;--ink:#34231b;--muted:#8a7162;--line:#d7c5b4;--clay:#b95d42;--soft:#e5c6ad;--green:#647c68}body{background:var(--page);color:var(--ink);min-height:100vh}.wrap{max-width:1120px;margin:auto;padding:0 44px}.top{height:76px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.mark{font:700 20px Georgia,serif;color:var(--clay)}.steps{display:flex;gap:25px;font-size:11px;color:var(--muted)}.steps b{color:var(--clay);font-weight:600}.layout{display:grid;grid-template-columns:1.5fr .8fr;gap:40px;padding:42px 0}.left h1{font:400 34px Georgia,serif;margin:0 0 8px}.sub{font-size:12px;color:var(--muted);margin-bottom:26px}.cartrow{display:grid;grid-template-columns:104px 1fr auto;gap:18px;align-items:center;padding:17px 0;border-top:1px solid var(--line)}.thumb{height:96px;background:#d9a481;display:grid;place-items:center}.thumb:after{content:"";width:54px;height:60px;border-radius:0 0 18px 18px;background:linear-gradient(90deg,#ad553e,#d58460,#9f4f3c);box-shadow:5px 6px 13px #52302244}.thumb.bowl{background:#c3c7af}.thumb.bowl:after{width:72px;height:36px;border-radius:0 0 50% 50%;background:linear-gradient(#f6e8d3,#b6a084)}.thumb.cloth{background:#d8b75f}.thumb.cloth:after{width:54px;height:67px;background:repeating-linear-gradient(45deg,#e9ce85 0 5px,#c7a653 5px 8px);border-radius:4px}.productname{font:18px Georgia,serif}.meta{font-size:11px;color:var(--muted);margin-top:5px}.qty{display:flex;align-items:center;border:1px solid var(--line);height:32px;margin-top:12px;width:max-content}.qty button{border:0;background:none;width:31px;height:30px;color:var(--clay);font-size:17px}.qty span{width:26px;text-align:center;font-size:12px}.unitprice{text-align:right;font:16px Georgia,serif}.remove{display:block;border:0;background:none;color:var(--muted);font-size:10px;text-decoration:underline;margin:10px 0 0 auto}.summary{background:var(--card);padding:24px;height:max-content;border-top:4px solid var(--clay);box-shadow:0 8px 20px #60412a12}.summary h2{font:24px Georgia,serif;margin:0 0 20px}.sumline{display:flex;justify-content:space-between;font-size:12px;padding:9px 0;color:var(--muted)}.sumline.total{border-top:1px solid var(--line);color:var(--ink);font-size:17px;margin-top:8px;padding-top:18px}.shipping{background:#e8eee2;color:var(--green);padding:11px;font-size:10px;line-height:1.5;margin:16px 0}.checkout{width:100%;padding:15px;border:0;background:var(--clay);color:white;font-weight:700}.continue{display:block;text-align:center;font-size:10px;color:var(--muted);margin-top:15px}.empty{padding:26px;background:var(--card);color:var(--muted);display:none}@media(max-width:850px){.wrap{padding:0 24px}.layout{gap:22px}.cartrow{grid-template-columns:82px 1fr auto;gap:12px}.thumb{height:82px}}@media(max-width:620px){.steps{gap:8px}.layout{grid-template-columns:1fr;padding-top:28px}.summary{grid-row:1}.left h1{font-size:29px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}

button:hover:not(:disabled){filter:brightness(.92)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid currentColor;outline-offset:2px}button:disabled{cursor:not-allowed;opacity:.48}article:hover{filter:brightness(1.04)}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}</style>
</head>
<body>

<main class="wrap"><header class="top"><div class="mark">陶与日常</div><div class="steps"><b>购物车</b><span>—　配送</span><span>—　付款</span></div><span style="font-size:11px">需要帮助？</span></header><div class="layout"><section class="left"><h1>你的购物篮</h1><div class="sub" id="itemcount">3 件器物，慢慢挑选也没关系</div><div id="rows">
<article class="cartrow" data-price="168"><div class="thumb cup"></div><div><div class="productname">烤茶盏</div><div class="meta">赤陶 · 一只</div><div class="qty"><button aria-label="减少数量" onclick="step(this,-1)">−</button><span>1</span><button aria-label="增加数量" onclick="step(this,1)">+</button></div></div><div><div class="unitprice">¥ 168</div><button class="remove" onclick="removeRow(this)">移除</button></div></article><article class="cartrow" data-price="236"><div class="thumb bowl"></div><div><div class="productname">晨光浅碗</div><div class="meta">米釉 · 17 cm</div><div class="qty"><button aria-label="减少数量" onclick="step(this,-1)">−</button><span>1</span><button aria-label="增加数量" onclick="step(this,1)">+</button></div></div><div><div class="unitprice">¥ 236</div><button class="remove" onclick="removeRow(this)">移除</button></div></article><article class="cartrow" data-price="58"><div class="thumb cloth"></div><div><div class="productname">织纹杯垫</div><div class="meta">麦秆黄 · 一对</div><div class="qty"><button aria-label="减少数量" onclick="step(this,-1)">−</button><span>1</span><button aria-label="增加数量" onclick="step(this,1)">+</button></div></div><div><div class="unitprice">¥ 58</div><button class="remove" onclick="removeRow(this)">移除</button></div></article></div><div class="empty" id="empty">购物篮暂时空了。去找一件手作器物吧。</div></section><aside class="summary"><h2>订单合计</h2><div class="sumline"><span>商品金额</span><span id="subtotal">¥ 462</span></div><div class="sumline"><span>配送</span><span>¥ 0</span></div><div class="shipping">已享免费配送<br>陶器将以可回收填充物仔细包裹</div><div class="sumline total"><span>合计</span><strong id="total">¥ 462</strong></div><button class="checkout" onclick="alert('已进入配送信息填写')">继续结账　→</button><a class="continue" href="#">继续挑选器物</a></aside></div></main>

<script>function update(){let rows=[...document.querySelectorAll('.cartrow')],sum=0,count=0;rows.forEach(r=>{let q=+r.querySelector('.qty span').textContent;sum+=+r.dataset.price*q;count+=q});document.getElementById('subtotal').textContent='¥ '+sum;document.getElementById('total').textContent='¥ '+sum;document.getElementById('itemcount').textContent=count+' 件器物，慢慢挑选也没关系';document.getElementById('empty').style.display=rows.length?'none':'block'}function step(b,d){let s=b.parentElement.querySelector('span');s.textContent=Math.max(1,+s.textContent+d);update()}function removeRow(b){b.closest('.cartrow').remove();update()}update()</script>
</body>
</html>
