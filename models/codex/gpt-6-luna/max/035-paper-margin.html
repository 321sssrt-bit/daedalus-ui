<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>035 内容详情</title>
<style>
:root{--page:#F3ECDD;--surface:#FFFDF7;--ink:#29251F;--muted:#8A8173;--accent:#94754E;--line:#D9CDB8;--frame:#262522}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--page);color:var(--ink);font-family:Georgia, 'Songti SC', serif}
body{min-height:100vh}
button,input,textarea,select{font:inherit}
button{border:0;cursor:pointer;transition:background-color .16s ease,color .16s ease,transform .16s ease}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
button:disabled{cursor:not-allowed;opacity:.45}
.preview{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 5%,var(--surface),var(--page) 72%)}
.phone{width:390px;height:844px;overflow:hidden;border:8px solid var(--frame);border-radius:42px;background:var(--page);box-shadow:0 28px 100px #0003;display:flex;flex-direction:column}
.screen{flex:1;min-height:0;overflow:auto;padding:20px 22px}
@media(max-width:430px){.preview{padding:0;background:var(--page)}.phone{width:100vw;height:100dvh;min-height:100dvh;border:0;border-radius:0;box-shadow:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
.top{height:48px;display:flex;align-items:center;justify-content:space-between;color:var(--muted);font:12px Arial;letter-spacing:.08em}.screen{background:var(--surface);margin:0 8px 8px;border-radius:18px;padding:20px 18px}.tag{font:11px Arial;letter-spacing:.18em;color:var(--accent);text-transform:uppercase}.screen h1{font-size:27px;line-height:1.35;margin:12px 0}.byline{font:12px Arial;color:var(--muted);padding-bottom:18px;border-bottom:1px solid var(--line)}.body-copy{font-size:17px;line-height:1.9;letter-spacing:.02em;margin-top:22px}.body-copy p{margin:0 0 18px}.adjust{padding:12px 0 8px;border-top:1px solid var(--line);font:12px Arial;color:var(--muted)}.adjust input{width:100%;accent-color:var(--accent)}.actions{height:76px;flex:none;display:flex;gap:12px;align-items:center;padding:0 22px}.actions button{height:44px;border-radius:22px}.save{flex:1;background:transparent;border:1px solid var(--line);color:var(--ink)}.start{flex:1;background:var(--accent);color:#fff}.actions button:hover{filter:brightness(1.1)}
button:hover:not(:disabled){filter:brightness(.92)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid currentColor;outline-offset:2px}button:disabled{cursor:not-allowed;opacity:.48}article:hover{filter:brightness(1.04)}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}</style>
</head>
<body>
<div class="preview">
<main class="phone">
<header class="top"><span>‹ 返回</span><span>慢读</span><button id="save" class="like" aria-label="收藏">♡</button></header><section class="screen"><div class="tag">生活 · 6 分钟</div><h1>把慢一点，还给今天</h1><div class="byline">周予安　　2026 年 9 月 22 日</div><div class="body-copy" id="copy"><p>清晨的光落在窗台时，城市还没有完全醒来。你可以先不急着回答今天，也不必把每一分钟都安排得刚好。</p><p>给自己留一段没有目的的路。听树叶擦过屋檐，看咖啡升起的薄雾，或者只是把手放在温热的杯沿。</p><p>慢下来不是停住，而是让注意力重新回到正在发生的事情里。</p></div><div class="adjust"><label for="size">阅读字号　<span id="sizeValue">17 px</span></label><input id="size" type="range" min="16" max="23" value="17"></div></section><footer class="actions"><button class="save" id="done">读完这篇</button><button class="start" id="continue">继续阅读</button></footer>
</main>
</div>
<script>
const copy=document.querySelector('#copy'),size=document.querySelector('#size');size.oninput=()=>{copy.style.fontSize=size.value+'px';document.querySelector('#sizeValue').textContent=size.value+' px'};document.querySelector('#save').onclick=e=>e.currentTarget.textContent=e.currentTarget.textContent==='♡'?'♥':'♡';document.querySelector('#done').onclick=()=>document.querySelector('#done').textContent='已加入读完';document.querySelector('#continue').onclick=()=>document.querySelector('.screen').scrollTo({top:document.querySelector('.screen').scrollHeight,behavior:'smooth'});
</script>
</body>
</html>
