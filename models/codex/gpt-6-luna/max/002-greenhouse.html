<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="page-name" content="002 注册"><title>002 注册</title><style>:root{--page:#fbf2e9;--surface:#fffaf5;--text:#3c3028;--muted:#8e7666;--accent:#b65e3d;--accent2:#e4a771;--line:#e5cabc}
*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--text);font:15px/1.55 system-ui,sans-serif}.page{min-height:800px;display:grid;grid-template-columns:40% 60%;background:var(--surface)}h1,h2,p{margin-top:0}h1{font:500 36px/1.2 Georgia,serif}.garden{padding:42px 48px;background:#f4e4d6;display:flex;flex-direction:column;justify-content:center}.brand{font-size:20px;font-weight:850;color:var(--accent);margin-bottom:55px}.brand b{color:var(--text);margin-left:8px}.eyebrow{color:var(--accent);font-size:10px;letter-spacing:.15em}.garden h2{font:500 34px/1.3 Georgia,serif;margin:8px 0}.garden svg{width:100%;height:250px;margin:14px 0}.note{border-top:1px solid #dfbea9;padding-top:14px;font-size:12px}.note span{color:var(--muted)}.formarea{padding:50px;display:grid;place-items:center;position:relative}.login{position:absolute;right:48px;top:32px;color:var(--muted);font-size:11px}.login a{color:var(--accent);font-weight:750}.card{width:min(460px,100%);padding:38px;border:1px solid var(--line);border-radius:24px;box-shadow:0 18px 50px #74432d10}.badge{display:inline-block;background:#f4e3d5;color:var(--accent);padding:6px 10px;border-radius:99px;font-size:10px;font-weight:750}.card h1{margin:17px 0 8px}.muted{color:var(--muted);font-size:13px}.card label{display:block;font-weight:700;font-size:12px;margin-top:15px}.card input{display:block;width:100%;height:48px;margin-top:7px;border:1px solid var(--line);border-radius:12px;padding:0 13px;background:#fff;color:var(--text)}.card input:focus{outline:3px solid var(--accent2);outline-offset:2px}.primary{width:100%;height:52px;border:0;border-radius:14px;background:var(--accent);color:#fff;font-weight:800;margin-top:18px}.primary:hover{background:#98492f}.policy{text-align:center;font-size:9px;color:var(--muted);margin:14px 0 0}.card #msg{min-height:18px;text-align:center;color:var(--accent);font-size:11px;margin:6px 0 0}button:focus-visible,a:focus-visible{outline:3px solid var(--accent2);outline-offset:3px}
@media(max-width:900px){.garden{padding:28px}.formarea{padding:28px}.garden h2{font-size:28px}.brand{margin-bottom:30px}}
@media(max-width:640px){.page{display:block}.garden{padding:20px 24px 8px}.brand{margin:0 0 10px}.garden h2{font-size:23px;margin:4px 0}.garden svg{height:85px;margin:0}.note{display:none}.formarea{padding:40px 18px 22px}.login{top:11px;right:20px}.card{padding:26px 22px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}</style></head><body>
<main class="page">
<aside class="garden"><div class="brand">芽 <b>栖地</b></div><p class="eyebrow">慢一点，也会长大</p><h2>给你的新生活<br>留一块绿地。</h2>
<svg viewBox="0 0 390 250" role="img" aria-label="温室窗格与盆栽"><path d="M35 230V62L192 18l162 44v168" fill="#f5ddc7" stroke="#a34f33" stroke-width="4"/><path d="M35 62h319M192 20v210M112 43v187M274 43v187" stroke="#d3936b" stroke-width="3"/><path d="M153 213c-3-60 13-101 42-137 21 31 29 63 16 96-12 29-32 39-58 41M201 204c5-47 34-75 70-86-1 40-17 72-50 83" fill="#5d8064"/><path d="M147 212h129l-12 40h-105z" fill="#b65e3d"/></svg>
<p class="note"><b>一封欢迎信，已经在路上。</b><br><span>注册后可保存每一季的照料记录。</span></p></aside>
<section class="formarea"><div class="login">已有栖地账号？ <a href="#login">登录</a></div><form class="card" id="signup"><span class="badge">新住户登记</span><h1>欢迎入栖地</h1><p class="muted">留下三个小信息，我们就为你开好一块地。</p>
<label>你的名字<input required placeholder="例：林晓"></label><label>电子邮箱<input type="email" required placeholder="you@example.com"></label><label>设置密码<input type="password" required minlength="8" placeholder="至少 8 个字符"></label><button class="primary" type="submit">加入温室　↗</button><p class="policy">继续即表示你同意栖地的服务约定与隐私说明。</p><p id="msg" aria-live="polite"></p></form></section>
</main><script>document.getElementById("signup").onsubmit=function(e){e.preventDefault();document.getElementById("msg").textContent="你的栖地已准备好，欢迎加入。"}</script></body></html>
