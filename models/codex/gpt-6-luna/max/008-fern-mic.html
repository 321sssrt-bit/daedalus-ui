<main class="page"><header class="head"><b>HERBARIUM <span>声景采集册</span></b><small>初次设置　·　02 / 04</small></header><section class="permit"><aside class="botanical"><svg viewBox="0 0 380 380" role="img" aria-label="叶片与声波线稿"><circle cx="190" cy="190" r="150" fill="#e7ebcf"/><path d="M193 335C188 256 191 178 183 83" fill="none" stroke="#56783f" stroke-width="5"/><path d="M190 258C113 254 79 210 76 155c58 7 105 44 114 98M188 211c-1-70 38-116 97-137 8 61-20 113-90 146M185 300c-53-1-85-26-101-68 48 1 84 21 101 68" fill="#b8c782" stroke="#56783f" stroke-width="3"/><path d="M120 125q-20 35 0 70M101 112q-32 48 0 96M257 115q26 42 0 84M278 99q39 59 0 117" fill="none" stroke="#87975f" stroke-width="2"/></svg><small>FIELD NOTE NO. 08</small><b>听见叶脉之外</b><p>一段录音，留下此刻的栖地。</p></aside><div class="permission"><p class="eyebrow">设备权限 · 麦克风</p><h1>为植物留下<br>一段声音。</h1><p class="lead">采集叶片轻响、雨滴和林间环境，帮助你回到这片植物曾经生长的地方。</p><div class="why"><b>◖</b><span><strong>需要麦克风权限</strong><small>仅当你主动点下录音时使用，不会在后台启动。</small></span></div><div class="privacy"><b>你的声音只留在这台设备</b><span>演示页面不会启动麦克风，也不会上传音频。</span></div><div class="actions"><button class="allow" id="allow">允许一次　→</button><button class="deny" id="deny">暂不允许</button></div><p id="state" aria-live="polite">你可以稍后在设置里更改选择。</p></div></section><footer class="foot">HERBARIUM AUDIO JOURNAL　·　用心记录，不打扰自然</footer></main>
<script>document.getElementById("allow").onclick=function(){document.getElementById("state").textContent="已选择允许一次。开始录音时，系统才会请求设备权限。"};document.getElementById("deny").onclick=function(){document.getElementById("state").textContent="已选择暂不允许。你仍可浏览植物册，之后也能重新开启。"}</script></body></html>
