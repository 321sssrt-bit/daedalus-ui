<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>028 长表单 · pink-paperform</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer}a{color:inherit}svg{display:block}

:root{--page:#f6d9e4;--paper:#fff9fa;--ink:#3e2633;--muted:#986d7e;--line:#e4b7c9;--pink:#e64f92;--hot:#b92e6d;--lime:#d6e978}body{background:linear-gradient(120deg,#f7dce6,#f2cadb);color:var(--ink);min-height:100vh}.wrap{max-width:1120px;margin:auto;padding:0 38px}.top{height:70px;display:flex;align-items:center;justify-content:space-between}.logo{font:800 12px monospace;letter-spacing:.16em}.top small{font-size:10px;color:var(--muted)}.layout{display:grid;grid-template-columns:215px 1fr;gap:25px}.rail{position:sticky;top:16px;align-self:start;background:var(--paper);padding:18px 16px;border-radius:12px;box-shadow:0 7px 20px #833b5510}.rail b{font-size:11px}.progress{height:4px;background:#f0dae3;margin:12px 0 15px}.progress i{display:block;width:33%;height:100%;background:var(--pink)}.jump{display:block;text-decoration:none;padding:10px 9px;margin:3px 0;color:var(--muted);font-size:10px;border-radius:6px}.jump.active{background:#fde7ef;color:var(--hot);font-weight:700}.jump span{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:#f4d3df;margin-right:7px}.formhead{padding:2px 3px 17px}.eyebrow{font:9px monospace;color:var(--hot);letter-spacing:.15em}.formhead h1{font-size:30px;margin:8px 0 4px}.formhead p{font-size:11px;color:var(--muted);margin:0}.section{background:var(--paper);padding:22px 25px;border-radius:11px;margin:0 0 13px;box-shadow:0 7px 20px #833b550c;scroll-margin-top:14px}.secttitle{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:15px}.num{width:27px;height:27px;background:var(--pink);color:#fff;display:grid;place-items:center;border-radius:50%;font-size:11px;font-weight:700}.secttitle h2{font-size:15px;margin:0}.secttitle small{margin-left:auto;color:var(--muted);font-size:9px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field label{font-size:10px;display:block;margin-bottom:6px}.req{color:var(--hot);font-weight:800}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:6px;background:white;height:39px;padding:0 11px;color:var(--ink);font-size:11px;outline:none}.field textarea{height:72px;padding:10px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--pink);box-shadow:0 0 0 3px #e64f9220}.span2{grid-column:1/-1}.choice{display:flex;gap:8px}.choice label{border:1px solid var(--line);border-radius:6px;padding:9px 12px;font-size:10px;background:#fff}.choice input{accent-color:var(--pink)}.actions{display:flex;justify-content:flex-end;gap:9px;padding:7px 0 28px}.actions button{border-radius:6px;padding:12px 17px;font-size:10px}.draft{background:#fff;border:1px solid var(--line);color:var(--ink)}.submit{background:var(--pink);border:1px solid var(--pink);color:#fff;font-weight:700}.toast{position:fixed;bottom:20px;right:24px;background:var(--hot);color:#fff;padding:11px 15px;font-size:10px;opacity:0;transition:.2s}.toast.show{opacity:1}@media(max-width:850px){.wrap{padding:0 23px}.layout{grid-template-columns:175px 1fr;gap:15px}.section{padding:18px}}@media(max-width:640px){.layout{grid-template-columns:1fr}.rail{position:static;display:flex;align-items:center;gap:4px;overflow:auto;padding:10px}.rail b,.progress{display:none}.jump{white-space:nowrap}.formhead h1{font-size:25px}.fields{grid-template-columns:1fr}.span2{grid-column:auto}.section{padding:17px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}

button:hover:not(:disabled){filter:brightness(.92)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid currentColor;outline-offset:2px}button:disabled{cursor:not-allowed;opacity:.48}article:hover{filter:brightness(1.04)}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}</style>
</head>
<body>

<main class="wrap"><header class="top"><div class="logo">PINKFORM / 创作者入驻</div><small>保存时间　刚刚</small><small>草稿自动保留</small></header><div class="layout"><aside class="rail"><b>填写进度　1 / 3</b><div class="progress"><i></i></div><a href="#basic" class="jump active"><span>1</span>基本资料</a><a href="#work" class="jump"><span>2</span>作品与服务</a><a href="#confirm" class="jump"><span>3</span>联系偏好</a></aside><form id="form"><div class="formhead"><span class="eyebrow">CREATOR APPLICATION / 2026</span><h1>让更多人找到你的作品</h1><p>三步完成入驻申请，必填项已用 <b class="req">*</b> 标出。</p></div>
<section class="section" id="basic"><div class="secttitle"><span class="num">1</span><h2>基本资料</h2><small>必填字段</small></div><div class="fields"><div class="field"><label>公开名称 <span class="req">*</span></label><input required placeholder="例如：南枝工作室"></div><div class="field"><label>所在城市 <span class="req">*</span></label><input required placeholder="填写城市"></div><div class="field span2"><label>一句话介绍 <span class="req">*</span></label><input required placeholder="用一句话说说你在做什么"></div></div></section>
<section class="section" id="work"><div class="secttitle"><span class="num">2</span><h2>作品与服务</h2><small>可后续补充</small></div><div class="fields"><div class="field"><label>主要创作方向 <span class="req">*</span></label><select required><option value="">请选择</option><option>手作与器物</option><option>影像与摄影</option><option>空间与建筑</option></select></div><div class="field"><label>开始创作年份</label><input type="number" min="1900" max="2026" placeholder="例如：2018"></div><div class="field span2"><label>作品介绍</label><textarea placeholder="描述你的材料、方法和想持续探索的主题"></textarea></div></div></section>
<section class="section" id="confirm"><div class="secttitle"><span class="num">3</span><h2>联系偏好</h2><small>方便我们回访</small></div><div class="fields"><div class="field"><label>联系邮箱 <span class="req">*</span></label><input type="email" required placeholder="name@example.com"></div><div class="field"><label>希望的沟通方式</label><select><option>邮件</option><option>站内消息</option><option>电话</option></select></div><div class="field span2"><label>作品集链接</label><input type="url" placeholder="作品集地址"></div><div class="field span2"><label>申请目的</label><div class="choice"><label><input type="radio" name="goal" checked> 展示作品</label><label><input type="radio" name="goal"> 寻找合作</label><label><input type="radio" name="goal"> 申请市集</label></div></div></div></section><div class="actions"><button type="button" class="draft" onclick="toast('申请已保存为草稿')">保存草稿</button><button class="submit">提交申请　→</button></div></form></div></main><div class="toast" id="toast"></div>

<script>function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1500)}document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();if(e.currentTarget.reportValidity())toast('申请已提交，我们将在 3 个工作日内联系你')});document.querySelectorAll('.jump').forEach(a=>a.addEventListener('click',()=>{document.querySelectorAll('.jump').forEach(x=>x.classList.remove('active'));a.classList.add('active')}))</script>
</body>
</html>
