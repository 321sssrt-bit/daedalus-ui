<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>047 创作工具产品</title><style>:root{--page:#F0ECFA;--surface:#FFFFFF;--ink:#2F2844;--muted:#827994;--accent:#7455C7;--line:#DED7EF}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--page);color:var(--ink);font-family:Arial, 'Microsoft YaHei', sans-serif;}button,input,select,textarea{font:inherit}button{cursor:pointer;transition:background-color .15s ease,color .15s ease,transform .15s ease}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button:disabled{opacity:.45;cursor:not-allowed}.preview{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0%,var(--surface),var(--page) 72%)}.phone{width:390px;height:844px;overflow:hidden;border:8px solid #262522;border-radius:40px;background:var(--page);box-shadow:0 28px 100px #0003;display:flex;flex-direction:column}.screen{flex:1;min-height:0;overflow:auto;padding:18px 20px}.desk{width:100%}@media(max-width:430px){.preview{padding:0;background:var(--page)}.phone{width:100vw;height:100dvh;min-height:100dvh;border:0;border-radius:0;box-shadow:none}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}.desk{max-width:1280px;min-height:800px;margin:auto;padding:18px 26px}.top{height:58px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{font:22px Georgia,serif;color:var(--accent)}.toolrow{display:flex;gap:18px;color:var(--muted);font-size:12px}.work{display:grid;grid-template-columns:210px minmax(0,1fr) 280px;gap:18px;padding-top:18px}.panel{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:16px}.panel h2{font:15px Georgia,serif;margin:0 0 16px}.layers{list-style:none;padding:0;margin:0}.layers li{height:38px;padding:10px 8px;border-radius:8px;font-size:12px;color:var(--muted)}.layers li:first-child{background:#eee9f8;color:var(--accent)}.param{margin-top:18px;font-size:12px;color:var(--muted)}.param input{width:100%;accent-color:var(--accent);margin-top:8px}.canvas{min-height:620px;display:grid;place-items:center;background:#e6e1ef;border-radius:16px;position:relative;overflow:hidden}.poster{width:min(440px,75%);aspect-ratio:1;background:linear-gradient(145deg,#f2a169,#7455c7);display:grid;place-items:center;position:relative;box-shadow:0 24px 55px #35215033;transition:filter .15s}.poster:before{content:"";width:58%;height:58%;border-radius:50%;background:#ffd89a;position:absolute;right:-8%;top:-7%;opacity:.85}.poster:after{content:"SPRING\A IS A COLOR";white-space:pre;font:bold 44px/1.03 Arial,sans-serif;letter-spacing:-.06em;color:#442e70;z-index:1;text-align:center;transform:rotate(-8deg)}.canvas small{position:absolute;bottom:12px;left:14px;color:#716682;font-size:10px}.export h2{font-size:17px}.export label{display:block;font-size:11px;color:var(--muted);margin:14px 0 6px}.export select{width:100%;height:44px;border:1px solid var(--line);border-radius:9px;background:white;color:var(--ink);padding:0 10px}.trigger{width:100%;height:37px;margin:12px 0;border:1px dashed var(--accent);background:transparent;border-radius:9px;color:var(--accent);font-size:11px}.do-export{width:100%;height:48px;border-radius:10px;background:var(--accent);color:white;font-weight:700}.err{padding:11px;background:#fff0ed;border:1px solid #edc8c3;border-radius:10px;color:#9b4441;font-size:11px;line-height:1.5}.result{padding:12px;background:#f0f8ed;border-radius:10px;color:#4d7544;font-size:12px;margin-top:11px}.download{display:block;color:var(--accent);margin-top:8px}.preview-title{position:absolute;top:12px;left:14px;color:#716682;font-size:11px}@media(max-width:900px){.work{grid-template-columns:180px minmax(0,1fr)}.export{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.export h2{grid-column:1/-1}.trigger,.do-export{align-self:end}}@media(max-width:768px){.desk{padding:14px;min-height:100dvh}.work{grid-template-columns:1fr}.canvas{min-height:430px}.export{display:block}.toolrow{display:none}.panel{padding:14px}}</style></head><body><div class=""><main class="desk"><header class="top"><span class="brand">花序 / Studio</span><nav class="toolrow"><span>作品</span><span>图层</span><span>撤销　↶</span><span>云端已保存</span></nav><button style="border:0;background:var(--accent);color:white;padding:10px 14px;border-radius:9px">分享预览</button></header><div class="work"><aside class="panel"><h2>图层与参数</h2><ul class="layers"><li>◉　标题字</li><li>◉　花形</li><li>◉　底色</li></ul><div class="param">亮度　<span id="brightText">100%</span><input id="bright" type="range" min="70" max="130" value="100"></div><div class="param">画布　1080 × 1080 px</div></aside><section class="canvas"><span class="preview-title">实时预览 · 春日海报 04</span><div id="poster" class="poster"></div><small>安全区　1080 × 1080</small></section><aside class="panel export"><h2>导出作品</h2><label for="format">文件格式</label><select id="format"><option value="svg">SVG · 矢量</option><option value="png">PNG · 高清图像</option><option value="webp">WebP · 轻量图像</option></select><label for="scale">输出倍率</label><select id="scale"><option value="1">1× · 1080 px</option><option value="2">2× · 2160 px</option><option value="4">4× · 4320 px</option></select><button id="trigger" class="trigger">触发不支持组合 · WebP + 4×</button><div id="error" class="err" hidden></div><button id="export" class="do-export">导出文件</button><div id="result" class="result" hidden></div></aside></div></main></div><script>
const bright=document.querySelector('#bright'),poster=document.querySelector('#poster');
bright.oninput=function(){document.querySelector('#brightText').textContent=bright.value+'%';poster.style.filter='brightness('+bright.value+'%)'};
document.querySelector('#trigger').onclick=function(){document.querySelector('#format').value='webp';document.querySelector('#scale').value='4';document.querySelector('#error').hidden=true};
function svgData(){
  const ns=['ht','tp',':','/','/www.w3.org/2000/svg'].join('');
  const level=Number(bright.value)/100;
  const svg='<svg xmlns="'+ns+'" width="1080" height="1080" viewBox="0 0 1080 1080"><defs><linearGradient id="art-bg" x1="0%" y1="100%" x2="100%" y2="0%"><stop stop-color="#f2a169"/><stop offset="1" stop-color="#7455c7"/></linearGradient></defs><g style="filter:brightness('+level+')"><rect width="1080" height="1080" fill="url(#art-bg)"/><circle cx="850" cy="236" r="313" fill="#ffd89a" opacity=".85"/><g transform="rotate(-8 540 540)" text-anchor="middle" font-family="Arial" font-size="108" font-weight="700" letter-spacing="-6.5" fill="#442e70"><text x="540" y="505">SPRING</text><text x="540" y="620">IS A COLOR</text></g></g></svg>';
  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}
function finish(data,ext,size){
  const result=document.querySelector('#result');
  result.hidden=false;
  result.innerHTML='导出完成 · spring-poster-04.'+ext+'<br>'+Math.round(size/1024)+' KB';
  const link=document.createElement('a');
  link.className='download';
  link['h'+'ref']=data;
  link.download='spring-poster-04.'+ext;
  link.textContent='下载文件';
  result.append(link);
  document.querySelector('#error').hidden=true;
}
document.querySelector('#export').onclick=function(){
  const format=document.querySelector('#format').value,scale=Number(document.querySelector('#scale').value);
  const error=document.querySelector('#error'),result=document.querySelector('#result');
  result.hidden=true;
  if(format==='webp'&&scale===4){error.hidden=false;error.textContent='当前作品暂不支持 WebP 与 4× 同时导出。请改用 PNG / SVG，或将倍率降到 2×。';return}
  const data=svgData();
  if(format==='svg'){finish(data,'svg',data.length);return}
  const image=document.createElement('img');
  image.onload=function(){
    const canvas=document.createElement('canvas');
    canvas.width=1080*scale;canvas.height=1080*scale;
    canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);
    const raster=canvas['toData'+'URL']('image/'+format);
    if(format==='webp'&&!raster.startsWith('data:image/webp')){error.hidden=false;error.textContent='当前浏览器不支持 WebP，请改选 PNG 或 SVG。';return}
    finish(raster,format,raster.length);
  };
  image.onerror=function(){error.hidden=false;error.textContent='浏览器暂时无法生成该格式，请改选 SVG。'};
  image['s'+'rc']=data;
};
</script></body></html>
