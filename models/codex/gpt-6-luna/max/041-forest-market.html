<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>041 购物零售产品</title><style>:root{--page:#F2F1E8;--surface:#FFFEF9;--ink:#20352A;--muted:#7C897A;--accent:#557E50;--line:#D8DED0}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--page);color:var(--ink);font-family:Arial, 'Microsoft YaHei', sans-serif;}button,input,select,textarea{font:inherit}button{cursor:pointer;transition:background-color .15s ease,color .15s ease,transform .15s ease}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button:disabled{opacity:.45;cursor:not-allowed}.preview{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0%,var(--surface),var(--page) 72%)}.phone{width:390px;height:844px;overflow:hidden;border:8px solid #262522;border-radius:40px;background:var(--page);box-shadow:0 28px 100px #0003;display:flex;flex-direction:column}.screen{flex:1;min-height:0;overflow:auto;padding:18px 20px}.desk{width:100%}@media(max-width:430px){.preview{padding:0;background:var(--page)}.phone{width:100vw;height:100dvh;min-height:100dvh;border:0;border-radius:0;box-shadow:none}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}.desk{max-width:1280px;min-height:800px;margin:auto;padding:26px 34px}.top{height:68px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #d8ded0}.brand{font-family:Georgia,serif;font-size:23px;color:var(--accent);letter-spacing:.03em}.topnav{display:flex;gap:22px;color:var(--muted);font-size:13px}.badge{padding:9px 13px;border-radius:20px;background:#e4eadf;color:var(--accent);font-size:12px}.intro{padding:26px 0 18px;display:flex;justify-content:space-between;align-items:end}.intro small{color:var(--muted);letter-spacing:.12em}.intro h1{font-family:Georgia,serif;font-size:30px;font-weight:500;margin:8px 0 0}.layout{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:22px;align-items:start}.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card,.cart{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}.visual{height:150px;background:linear-gradient(150deg,#d7dfcb,#f5f1e5);display:grid;place-items:center;font:64px Georgia,serif;color:#617b57}.visual.mush{background:linear-gradient(150deg,#e8dec9,#f7f2e6);color:#9a7754}.cardbody{padding:16px}.card h2{font:18px Georgia,serif;margin:0 0 5px}.card p{margin:0;color:var(--muted);font-size:12px}.price{font-weight:700;color:var(--accent);margin:10px 0}.row{display:flex;gap:8px}.row select,.row input{height:40px;border:1px solid var(--line);border-radius:10px;background:white;color:var(--ink);padding:0 10px;min-width:0}.row select{flex:1}.row input{width:65px}.add,.primary{height:44px;border-radius:11px;padding:0 16px;background:var(--accent);color:white;font-weight:700}.add{margin-top:10px;width:100%}.cart{padding:20px;position:sticky;top:20px}.cart h2{font:21px Georgia,serif;margin:0 0 16px}.cartline{min-height:70px;border-top:1px solid var(--line);padding:13px 0;display:flex;justify-content:space-between;gap:10px;font-size:13px}.cartline small{display:block;color:var(--muted);margin-top:5px}.total{border-top:1px solid var(--line);padding:15px 0;display:flex;justify-content:space-between;font-weight:700}.error{background:#fff0e8;border:1px solid #efc3ac;border-radius:11px;padding:12px;color:#8a452c;font-size:12px;line-height:1.5;margin:10px 0}.test{width:100%;background:transparent;border:1px dashed var(--accent);color:var(--accent);border-radius:10px;height:38px;margin:8px 0}.primary{width:100%;height:50px}.receipt{margin-top:12px;padding:12px;border-radius:10px;background:#e8f0e5;color:#315d37;font-size:13px}.qtybuttons{display:inline-flex;gap:7px}.qtybuttons button{border:1px solid var(--line);background:white;border-radius:6px;width:25px;height:25px}@media(max-width:900px){.layout{grid-template-columns:1fr 310px}.topnav{display:none}}@media(max-width:768px){.desk{padding:18px;min-height:100dvh}.layout{grid-template-columns:1fr}.products{grid-template-columns:repeat(2,minmax(0,1fr))}.cart{position:static}.intro h1{font-size:24px}}</style></head><body><div class=""><main class="desk"><header class="top"><div class="brand">山里集</div><nav class="topnav"><span>当季食材</span><span>山野茶园</span><span>产地故事</span></nav><span class="badge">本周鲜选　03</span></header><section class="intro"><div><small>FIELD TO TABLE · 2026 秋季</small><h1>今早从山野送到</h1></div><span style="color:var(--muted);font-size:13px">当日采收 · 冷链直达</span></section><div class="layout"><section class="products"><article class="card"><div class="visual">茶</div><div class="cardbody"><h2>青岚高山芽茶</h2><p>海拔 1,200 米 · 春摘小叶种</p><div class="price">¥68 <small style="color:var(--muted);font-weight:400">/ 标准装</small></div><div class="row"><select id="teaSize" aria-label="茶叶规格"><option value="68">标准装 · 80g</option><option value="118">分享装 · 160g</option></select><input id="teaQty" type="number" min="1" max="9" value="1" aria-label="茶叶数量"></div><button id="addTea" class="add">加入购物车</button></div></article><article class="card"><div class="visual mush">菇</div><div class="cardbody"><h2>山野菌菇礼盒</h2><p>当季松茸与香菇 · 冷链鲜送</p><div class="price">¥118 <small style="color:var(--muted);font-weight:400">/ 家庭装</small></div><button id="addMush" class="add">加入购物车</button></div></article></section><aside class="cart"><h2>你的篮子</h2><div id="cartline" class="cartline"><span id="cartname">还没有选购商品</span><b id="lineprice">—</b></div><div class="error" id="error" hidden><b>库存不足</b><br><span id="errormsg">松露菇鲜品 · 1kg 暂时缺货，请改选有货商品。</span><br><button id="recover">改选青岚芽茶标准装</button></div><button id="test" class="test">演示：触发一项缺货</button><div class="total"><span id="sumlabel">合计</span><span id="sum">¥0</span></div><button id="submit" class="primary" disabled>提交订单</button><div id="receipt" class="receipt" hidden></div></aside></div></main></div><script>let qty=0,unit=0,name='',out=false;const fmt=n=>'¥'+n.toLocaleString('zh-CN');function render(){document.querySelector('#cartname').innerHTML=name?name+'<small>'+qty+' 件</small>':'还没有选购商品';document.querySelector('#lineprice').textContent=name?fmt(unit*qty):'—';document.querySelector('#sum').textContent=fmt(unit*qty);document.querySelector('#submit').disabled=!name||out;document.querySelector('#error').hidden=!out}function add(n,p,q){name=n;unit=p;qty=Math.max(1,Math.min(9,Number(q)||1));out=false;document.querySelector('#receipt').hidden=true;render()}document.querySelector('#addTea').onclick=()=>add('青岚高山芽茶 · '+(document.querySelector('#teaSize').selectedOptions[0].text),Number(document.querySelector('#teaSize').value),document.querySelector('#teaQty').value);document.querySelector('#addMush').onclick=()=>add('山野菌菇礼盒 · 家庭装',118,1);document.querySelector('#test').onclick=()=>{add('松露菇鲜品 · 1kg',218,1);out=true;document.querySelector('#errormsg').textContent='松露菇鲜品 · 1kg 暂时缺货，请改选有货商品。';render()};document.querySelector('#recover').onclick=()=>add('青岚高山芽茶 · 标准装',68,1);document.querySelector('#submit').onclick=()=>{if(out)return;document.querySelector('#receipt').hidden=false;document.querySelector('#receipt').textContent='订单已创建 · SJ-0923-041 · '+fmt(unit*qty);document.querySelector('#submit').textContent='订单已提交'};render();</script></body></html>
