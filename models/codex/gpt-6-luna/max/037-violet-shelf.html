<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>037 列表空态</title>
<style>
:root{--page:#F5F1FB;--surface:#FFFFFF;--ink:#302A3C;--muted:#81788D;--accent:#8C73C9;--line:#DCD4EF;--frame:#262522}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--page);color:var(--ink);font-family:Arial, 'Microsoft YaHei', sans-serif}
body{min-height:100vh}
button,input,textarea,select{font:inherit}
button{border:0;cursor:pointer;transition:background-color .16s ease,color .16s ease,transform .16s ease}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
button:disabled{cursor:not-allowed;opacity:.45}
.preview{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 5%,var(--surface),var(--page) 72%)}
.phone{width:390px;height:844px;overflow:hidden;border:8px solid var(--frame);border-radius:42px;background:var(--page);box-shadow:0 28px 100px #0003;display:flex;flex-direction:column}
.screen{flex:1;min-height:0;overflow:auto;padding:20px 22px}
@media(max-width:430px){.preview{padding:0;background:var(--page)}.phone{width:100vw;height:100dvh;min-height:100dvh;border:0;border-radius:0;box-shadow:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
.top{height:58px;display:flex;align-items:center;justify-content:space-between;font-size:13px}.screen{display:flex;flex-direction:column;justify-content:center}.empty-card{text-align:center;background:var(--surface);border:1px solid #dcd4ef;border-radius:24px;padding:28px 20px;box-shadow:0 18px 40px #34234a0d}.illustration{height:150px;position:relative;display:grid;place-items:center}.sheet{position:absolute;width:86px;height:112px;border-radius:12px;background:#e9e2f6;transform:rotate(-12deg);top:14px;left:calc(50% - 68px)}.sheet.two{background:#d9d0ee;transform:rotate(12deg);left:calc(50% - 18px)}.orb{z-index:1;width:74px;height:74px;border-radius:50%;background:var(--accent);color:white;display:grid;place-items:center;font-size:34px;box-shadow:0 12px 25px #8c73c944}.empty-card h1{font-size:21px;margin:8px 0}.empty-card p{font-size:13px;line-height:1.7;color:var(--muted);margin:0 0 18px}.create{width:100%;height:52px;border-radius:16px;background:var(--accent);color:white;font-weight:700}.example{margin-top:12px;background:none;color:var(--accent);font-size:13px}.newrow{display:flex;gap:8px;margin-top:14px}.newrow input{min-width:0;flex:1;height:44px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:white;color:var(--ink)}.nav{height:74px;display:flex;justify-content:space-around;align-items:center;border-top:1px solid var(--line);background:var(--surface);font-size:11px;color:var(--muted)}.nav b{color:var(--accent);font-weight:600}.items{list-style:none;padding:0;margin:16px 0 0;text-align:left}.items li{background:#faf9fd;border-radius:10px;padding:12px;margin-top:8px;font-size:14px}
button:hover:not(:disabled){filter:brightness(.92)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid currentColor;outline-offset:2px}button:disabled{cursor:not-allowed;opacity:.48}article:hover{filter:brightness(1.04)}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}</style>
</head>
<body>
<div class="preview">
<main class="phone">
<header class="top"><span>◷ 週计划</span><span>我的清单</span><button aria-label="更多">•••</button></header><section class="screen"><div id="empty" class="empty-card"><div class="illustration"><i class="sheet"></i><i class="sheet two"></i><div class="orb">＋</div></div><h1>今天要做什么？</h1><p>还没有清单。先记下一件<br>想完成的小事。</p><button id="create" class="create">新建第一条</button><button id="example" class="example">看看示例清单</button><div id="newrow" class="newrow" hidden><input id="newtask" placeholder="例如：给阳台的花浇水"><button id="add">添加</button></div></div><ul id="items" class="items"></ul></section><footer class="nav"><span>⌂<br>今天</span><b>☷<br>清单</b><span>◷<br>回顾</span></footer>
</main>
</div>
<script>
const row=document.querySelector('#newrow'),input=document.querySelector('#newtask'),items=document.querySelector('#items');document.querySelector('#create').onclick=()=>{row.hidden=false;input.focus()};document.querySelector('#add').onclick=()=>{const v=input.value.trim();if(!v){input.focus();return}const li=document.createElement('li');li.textContent='○　'+v;items.append(li);document.querySelector('#empty').querySelector('p').textContent='第一件小事已经记下。再慢慢加上你的安排。';row.hidden=true;input.value=''};document.querySelector('#example').onclick=()=>{input.value='整理书桌 10 分钟';row.hidden=false};
</script>
</body>
</html>
