<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>042 钱包支付产品</title><style>:root{--page:#F3F6FA;--surface:#FFFFFF;--ink:#182A43;--muted:#75869D;--accent:#F26B59;--line:#DCE4EE}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--page);color:var(--ink);font-family:Arial, 'Microsoft YaHei', sans-serif;}button,input,select,textarea{font:inherit}button{cursor:pointer;transition:background-color .15s ease,color .15s ease,transform .15s ease}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button:disabled{opacity:.45;cursor:not-allowed}.preview{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0%,var(--surface),var(--page) 72%)}.phone{width:390px;height:844px;overflow:hidden;border:8px solid #262522;border-radius:40px;background:var(--page);box-shadow:0 28px 100px #0003;display:flex;flex-direction:column}.screen{flex:1;min-height:0;overflow:auto;padding:18px 20px}.desk{width:100%}@media(max-width:430px){.preview{padding:0;background:var(--page)}.phone{width:100vw;height:100dvh;min-height:100dvh;border:0;border-radius:0;box-shadow:none}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}.top{height:58px;display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:13px}.screen{padding-top:8px}.balance{height:136px;border-radius:21px;padding:18px 20px;background:linear-gradient(135deg,#16385a,#182a43);color:white}.balance small{opacity:.7;font-size:12px}.balance strong{display:block;font:32px Arial;margin-top:12px}.section{margin-top:19px}.section h2{font-size:15px;margin:0 0 10px}.person{display:flex;gap:9px}.person button{flex:1;height:62px;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);font-size:12px}.person button.sel{border:2px solid var(--accent);color:var(--accent)}.avatar{display:block;font-size:19px;margin-bottom:2px}.field{height:78px;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:10px 13px;display:flex;align-items:center;gap:8px}.field b{font-size:24px}.field input{width:100%;border:0;outline:none;background:transparent;font-size:25px;color:var(--ink)}.source{margin-top:9px;width:100%;height:42px;border:1px solid var(--line);border-radius:11px;background:var(--surface);color:var(--ink);padding:0 10px}.hint{font-size:11px;color:var(--muted);margin-top:7px}.error{margin-top:10px;padding:11px;border-radius:11px;background:#fff0ee;color:#a63d31;font-size:12px;line-height:1.5}.review{margin-top:15px;width:100%;height:48px;background:var(--accent);border-radius:13px;color:white;font-weight:700}.confirm{padding:13px;margin-top:10px;background:#edf2f8;border-radius:13px;font-size:13px}.actions{margin-top:auto;padding:8px 20px 18px}.main{width:100%;height:50px;border-radius:14px;background:var(--accent);color:#fff;font-weight:700}.receipt{text-align:center;padding:18px;background:#eef8f2;border-radius:16px;color:#2c674d}.receipt strong{display:block;font-size:18px;margin:8px}.screen h1{font-size:20px;margin:4px 0 15px}.transactions{margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:15px;padding:13px}.transactions h2{font-size:12px;margin:0 0 9px}.transaction{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding:8px 0;color:var(--muted);font-size:10px}.transaction b{color:var(--ink)}</style></head><body><div class="preview"><main class="phone"><header class="top"><button aria-label="返回">‹ 返回</button><span>转账</span><span>帮助</span></header><section class="screen"><h1>给朋友转一笔</h1><div class="balance"><small id="balanceLabel">可用余额 · 零钱</small><strong id="balance">¥560.00</strong></div><div class="section"><h2>选择收款人</h2><div class="person"><button class="sel" data-person="林知夏"><span class="avatar">🌿</span>林知夏</button><button data-person="顾怀远"><span class="avatar">◉</span>顾怀远</button></div></div><div class="section"><h2>转账金额</h2><label class="field"><b>¥</b><input id="amount" type="number" min="0.01" step="0.01" value="120" aria-label="转账金额"></label><select id="source" class="source"><option value="560">零钱 · 可用 ¥560</option><option value="1000">零钱 + 备用金 · 可用 ¥1,000</option></select><div class="hint" id="limit">单笔转账需大于 ¥0.01</div><button id="low" style="margin-top:8px;background:none;color:var(--accent);font-size:12px">填入超额测试：¥680</button><div id="error" class="error" hidden></div></div><button id="review" class="review">核对并继续</button><div id="confirm" class="confirm" hidden><div>转给 <b id="to">林知夏</b>　·　<span id="confirmAmount">¥120</span></div><small id="confirmSource" style="display:block;margin-top:6px;color:var(--muted);font-size:11px">资金来源：零钱</small><button id="pay" class="main" style="margin-top:12px">确认转账</button></div><div id="receipt" class="receipt" hidden></div><article class="transactions"><h2>最近交易</h2><div id="transactions"><div class="transaction"><span>午间咖啡</span><b>− ¥26.00</b></div></div></article></section><footer class="actions"><button class="main" id="home">安全退出</button></footer></main></div><script>
const amount=document.querySelector('#amount'),error=document.querySelector('#error'),confirmBox=document.querySelector('#confirm'),source=document.querySelector('#source');
let recipient='林知夏',balances={'560':560,'1000':1000},transferCounter=0;
function showBalance(){const balance=balances[source.value];document.querySelector('#balance').textContent='¥'+balance.toFixed(2);document.querySelector('#balanceLabel').textContent='可用余额 · '+(source.value==='560'?'零钱':'零钱 + 备用金');document.querySelector('#limit').textContent='当前来源可用 ¥'+balance.toFixed(2)}
function updateConfirm(){document.querySelector('#confirmAmount').textContent='¥'+Number(amount.value||0).toFixed(2);document.querySelector('#confirmSource').textContent='资金来源：'+(source.value==='560'?'零钱':'零钱 + 备用金')}
document.querySelectorAll('.person button').forEach(function(button){button.onclick=function(){document.querySelectorAll('.person button').forEach(function(item){item.classList.remove('sel')});button.classList.add('sel');recipient=button.dataset.person;document.querySelector('#to').textContent=recipient;confirmBox.hidden=true;document.querySelector('#receipt').hidden=true}});
source.onchange=function(){showBalance();if(!confirmBox.hidden)updateConfirm()};
amount.addEventListener('input',function(){if(!confirmBox.hidden)updateConfirm()});
document.querySelector('#low').onclick=function(){amount.value=680;updateConfirm();error.hidden=true;confirmBox.hidden=true;document.querySelector('#receipt').hidden=true};
document.querySelector('#review').onclick=function(){updateConfirm();confirmBox.hidden=false;error.hidden=true};
document.querySelector('#pay').onclick=function(){
  const n=Number(amount.value),balance=balances[source.value];
  if(!Number.isFinite(n)||n<0.01){error.hidden=false;error.textContent='请输入不低于 ¥0.01 的金额。';return}
  if(n>balance){error.hidden=false;error.textContent='可用余额为 ¥'+balance.toFixed(2)+'，请降低金额或切换可用资金来源。';return}
  confirmBox.hidden=true;balances[source.value]=balance-n;showBalance();
  const receipt=document.querySelector('#receipt');receipt.hidden=false;transferCounter++;
  const title=document.createElement('strong');title.textContent='转账成功';receipt.replaceChildren(title,document.createTextNode('已转给 '+recipient+' · 交易号 W0923-042-'+String(transferCounter).padStart(3,'0')));
  const row=document.createElement('div');row.className='transaction';
  const who=document.createElement('span');who.textContent='转给 '+recipient;
  const value=document.createElement('b');value.textContent='− ¥'+n.toFixed(2);
  row.append(who,value);document.querySelector('#transactions').prepend(row);
};
document.querySelector('#home').onclick=function(){document.querySelector('#receipt').hidden=true;confirmBox.hidden=true};
showBalance();updateConfirm();
</script></body></html>
