<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>039 成功回执</title>
<style>
:root{--page:#EFF8F2;--surface:#FFFFFF;--ink:#23362E;--muted:#71877A;--accent:#347D5B;--line:#D6EADF;--frame:#262522}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--page);color:var(--ink);font-family:Arial, 'Microsoft YaHei', sans-serif}
body{min-height:100vh}
button,input,textarea,select{font:inherit}
button{border:0;cursor:pointer;transition:background-color .16s ease,color .16s ease,transform .16s ease}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
button:disabled{cursor:not-allowed;opacity:.45}
.preview{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 5%,var(--surface),var(--page) 72%)}
.phone{width:390px;height:844px;overflow:hidden;border:8px solid var(--frame);border-radius:42px;background:var(--page);box-shadow:0 28px 100px #0003;display:flex;flex-direction:column}
.screen{flex:1;min-height:0;overflow:auto;padding:20px 22px}
@media(max-width:430px){.preview{padding:0;background:var(--page)}.phone{width:100vw;height:100dvh;min-height:100dvh;border:0;border-radius:0;box-shadow:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
.top{height:56px;display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:13px}.screen{text-align:center;padding-top:14px}.badge{width:78px;height:78px;border-radius:50%;margin:0 auto 14px;background:#dcefe2;color:var(--accent);display:grid;place-items:center;font-size:39px}.screen h1{font-size:21px;margin:0 0 4px}.sub{color:var(--muted);font-size:13px;margin:0 0 20px}.ticket{text-align:left;border-radius:22px;background:var(--surface);padding:20px;box-shadow:0 16px 40px #23442e0b}.label{font-size:11px;letter-spacing:.1em;color:var(--muted)}.code{font:17px ui-monospace,monospace;letter-spacing:.02em;margin:7px 0 16px}.dash{border-top:1px dashed var(--line);margin:14px 0}.info{display:grid;grid-template-columns:1fr 1fr;gap:16px}.info strong{display:block;font-size:14px;margin-top:5px}.details{width:100%;background:transparent;color:var(--accent);padding:14px 0 0;margin-top:15px;border-top:1px solid var(--line)}.actions{height:78px;padding:12px 22px 20px}.finish{width:100%;height:50px;border-radius:14px;background:var(--accent);color:white;font-weight:700}
button:hover:not(:disabled){filter:brightness(.92)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid currentColor;outline-offset:2px}button:disabled{cursor:not-allowed;opacity:.48}article:hover{filter:brightness(1.04)}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}</style>
</head>
<body>
<div class="preview">
<main class="phone">
<header class="top"><span>〈 返回</span><span>我的预约</span><span>⋯</span></header><section class="screen"><div class="badge">✓</div><h1 id="result">预约已为你留好</h1><p class="sub">凭证已同步到你的行程</p><article class="ticket"><div class="label">预约编号</div><div class="code">MT-2026-0923-184</div><div class="dash"></div><div class="info"><div><span class="label">预约时间</span><strong>9 月 27 日<br>周日 · 14:30</strong></div><div><span class="label">场地席位</span><strong>B 区<br>12 排 08 座</strong></div></div><button id="details" class="details">查看预约详情　⌄</button><div id="extra" hidden class="info"><div><span class="label">入场口</span><strong>东侧 2 号门</strong></div><div><span class="label">凭证状态</span><strong>可直接核验</strong></div></div></article></section><footer class="actions"><button id="finish" class="finish">完成</button></footer>
</main>
</div>
<script>
const details=document.querySelector('#details'),extra=document.querySelector('#extra');details.onclick=()=>{extra.hidden=!extra.hidden;details.textContent=extra.hidden?'查看预约详情　⌄':'收起预约详情　⌃'};document.querySelector('#finish').onclick=()=>{document.querySelector('#result').textContent='行程已收好';document.querySelector('#finish').textContent='已完成'};
</script>
</body>
</html>
