<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>050 学习知识产品</title><style>:root{--page:#F4EFE2;--surface:#FFFDF6;--ink:#302B24;--muted:#837968;--accent:#A9703C;--line:#E2D8C5}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--page);color:var(--ink);font-family:Georgia, 'Songti SC', serif;}button,input,select,textarea{font:inherit}button{cursor:pointer;transition:background-color .15s ease,color .15s ease,transform .15s ease}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button:disabled{opacity:.45;cursor:not-allowed}.preview{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0%,var(--surface),var(--page) 72%)}.phone{width:390px;height:844px;overflow:hidden;border:8px solid #262522;border-radius:40px;background:var(--page);box-shadow:0 28px 100px #0003;display:flex;flex-direction:column}.screen{flex:1;min-height:0;overflow:auto;padding:18px 20px}.desk{width:100%}@media(max-width:430px){.preview{padding:0;background:var(--page)}.phone{width:100vw;height:100dvh;min-height:100dvh;border:0;border-radius:0;box-shadow:none}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}.desk{max-width:1280px;min-height:800px;margin:auto;padding:20px 32px}.top{height:62px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{font:24px Georgia,serif;color:var(--accent)}.top small{font-family:Arial,sans-serif;color:var(--muted)}.layout{display:grid;grid-template-columns:210px minmax(0,1fr) 250px;gap:20px;padding-top:22px}.nav,.lesson,.notes{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:16px}.nav h2,.notes h2{font:17px Georgia,serif;margin:0 0 15px}.nav button{display:block;width:100%;text-align:left;padding:12px 10px;border-radius:9px;background:transparent;color:var(--muted);font-size:12px;margin-bottom:5px}.nav button.active{background:#ece3d2;color:var(--accent);font-weight:700}.lesson{padding:27px 32px;min-height:610px}.crumb{font:11px Arial,sans-serif;color:var(--muted);letter-spacing:.06em}.lesson h1{font:30px Georgia,serif;font-weight:500;margin:15px 0 10px}.lead{font-size:14px;line-height:1.8;color:var(--muted);max-width:650px}.concept{margin:20px 0;padding:20px;background:#f7f2e7;border-left:3px solid var(--accent);font-size:15px;line-height:1.8}.start,.submit,.again{height:46px;padding:0 18px;border-radius:10px;background:var(--accent);color:white;font-weight:700}.quiz{margin-top:20px;border-top:1px solid var(--line);padding-top:19px}.quiz h2{font:19px Georgia,serif}.question{font-size:15px;margin:14px 0}.option{display:flex;align-items:center;gap:10px;padding:14px;border:1px solid var(--line);border-radius:10px;margin:8px 0;background:#fff}.option:has(input:checked){border:2px solid var(--accent);background:#fbf7ed}.option input{accent-color:var(--accent)}.feedback{margin:12px 0;padding:14px;background:#fff0e8;border:1px solid #e7c9a9;border-radius:10px;color:#7e4b31;font-size:13px;line-height:1.7}.feedback.good{background:#edf5e9;border-color:#d1e0c9;color:#43643a}.answer-actions{display:flex;gap:9px}.notes p{font-size:12px;line-height:1.7;color:var(--muted)}.progress{height:7px;border-radius:6px;background:#e8e1d3;margin:12px 0}.progress i{display:block;width:42%;height:100%;border-radius:6px;background:var(--accent)}.notes small{font:11px Arial,sans-serif;color:var(--muted)}@media(max-width:900px){.layout{grid-template-columns:180px minmax(0,1fr)}.notes{grid-column:2}}@media(max-width:768px){.desk{padding:16px;min-height:100dvh}.layout{grid-template-columns:1fr}.nav{display:flex;overflow:auto;gap:8px}.nav h2{display:none}.nav button{min-width:125px;margin:0}.lesson{padding:22px 18px;min-height:520px}.notes{grid-column:auto}.lesson h1{font-size:25px}}</style></head><body><div class=""><main class="desk"><header class="top"><span class="brand">页边 / 学习编辑部</span><span>看懂信息设计　　<small>上次学习：今天 09:40</small></span><span>◯ 个人进度</span></header><div class="layout"><nav class="nav"><h2>课程目录</h2><button>第 1 节　从版面开始</button><button>第 2 节　阅读的路径</button><button class="active" id="chapter">第 3 节　信息层级</button><button>第 4 节　留白与节奏</button></nav><article class="lesson"><div class="crumb">课程 / 信息设计基础 / 第 3 节</div><h1>先决定什么最重要</h1><p class="lead">页面上的每个元素都在争取注意力。建立层级，就是先决定读者应该看见什么、理解什么，再安排它们之间的距离和分量。</p><div class="concept">阅读顺序从信息层级开始。装饰与颜色都可以帮助表达，但它们不能替你决定内容的重要次序。</div><button id="start" class="start">开始本节练习</button><section id="quiz" class="quiz" hidden><h2>小练习 · 选择最合适的答案</h2><div class="question">安排页面内容时，最先决定什么？</div><label class="option"><input type="radio" name="answer" value="装饰效果">装饰效果</label><label class="option"><input type="radio" name="answer" value="信息层级">信息层级</label><label class="option"><input type="radio" name="answer" value="按钮颜色">按钮颜色</label><div id="feedback" class="feedback" hidden></div><div class="answer-actions"><button id="submit" class="submit">提交答案</button><button id="again" class="again" hidden>返回题目再次作答</button></div></section></article><aside class="notes"><h2>本节笔记</h2><p>先确定主次，再通过字号、位置、颜色和留白表达层级。</p><div class="progress"><i id="bar"></i></div><small id="progressText">课程进度　2 / 5 节</small><p style="margin-top:22px">预计用时<br><b style="color:var(--ink)">6 分钟</b></p></aside></div></main></div><script>let tries=0;document.querySelector('#start').onclick=()=>{document.querySelector('#quiz').hidden=false;document.querySelector('#start').hidden=true};document.querySelector('#submit').onclick=()=>{const picked=document.querySelector('input[name="answer"]:checked'),fb=document.querySelector('#feedback');if(!picked){fb.hidden=false;fb.className='feedback';fb.textContent='先选一个答案，再提交。';return}tries++;fb.hidden=false;if(picked.value==='信息层级'){fb.className='feedback good';fb.innerHTML='订正成功。先确立信息层级，再用装饰、颜色和按钮样式帮助读者理解。';document.querySelector('#again').hidden=true;document.querySelector('#submit').textContent='本节已掌握';document.querySelector('#submit').disabled=true;document.querySelector('#bar').style.width='60%';document.querySelector('#progressText').textContent='课程进度　3 / 5 节 · 已完成'}else{fb.className='feedback';fb.innerHTML='这次还没答对。先确定内容的主次顺序，再考虑装饰和按钮颜色。<br><b>提示：</b>从读者首先需要理解的内容开始。';document.querySelector('#again').hidden=false}};document.querySelector('#again').onclick=()=>{document.querySelectorAll('input[name="answer"]').forEach(r=>r.checked=false);document.querySelector('#feedback').hidden=true;document.querySelector('#again').hidden=true};document.querySelector('#chapter').onclick=()=>{document.querySelector('#quiz').hidden=true;document.querySelector('#start').hidden=false;document.querySelector('#start').textContent='继续本节';};</script></body></html>
