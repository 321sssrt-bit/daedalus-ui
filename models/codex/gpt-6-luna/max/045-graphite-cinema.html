<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>045 音视频平台</title><style>:root{--page:#14171C;--surface:#20252D;--ink:#F1F4F7;--muted:#89939E;--accent:#CF8B55;--line:#343B45}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--page);color:var(--ink);font-family:Arial, 'Microsoft YaHei', sans-serif;}button,input,select,textarea{font:inherit}button{cursor:pointer;transition:background-color .15s ease,color .15s ease,transform .15s ease}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button:disabled{opacity:.45;cursor:not-allowed}.preview{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0%,var(--surface),var(--page) 72%)}.phone{width:390px;height:844px;overflow:hidden;border:8px solid #262522;border-radius:40px;background:var(--page);box-shadow:0 28px 100px #0003;display:flex;flex-direction:column}.screen{flex:1;min-height:0;overflow:auto;padding:18px 20px}.desk{width:100%}@media(max-width:430px){.preview{padding:0;background:var(--page)}.phone{width:100vw;height:100dvh;min-height:100dvh;border:0;border-radius:0;box-shadow:none}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}.desk{max-width:1280px;min-height:800px;margin:auto;padding:20px 30px}.top{height:62px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.logo{font:23px Georgia,serif;color:var(--accent)}.topnav{display:flex;gap:20px;font-size:13px;color:var(--muted)}.top small{color:var(--muted)}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;padding-top:22px}.player{min-width:0}.picture{height:458px;border-radius:18px;background:radial-gradient(ellipse at 52% 42%,#785942,#27303a 52%,#14171c);display:grid;place-items:center;position:relative;overflow:hidden}.picture:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#111a 0,transparent 55%)}.horizon{width:75%;height:2px;background:#d69a5a88;transform:rotate(-8deg);box-shadow:0 28px 45px 15px #121819;z-index:1}.play-icon{position:absolute;z-index:2;width:60px;height:60px;border-radius:50%;border:1px solid #fff9;color:white;display:grid;place-items:center;font-size:22px;background:#12182077}.now{display:flex;align-items:center;justify-content:space-between;margin:16px 0 8px}.now h1{font:21px Georgia,serif;margin:0}.now p{font-size:12px;color:var(--muted);margin:6px 0}.status{font-size:11px;color:var(--accent)}.range{width:100%;accent-color:var(--accent)}.time{display:flex;justify-content:space-between;font:11px Arial;color:var(--muted)}.controls{display:flex;justify-content:center;align-items:center;gap:22px;height:62px}.controls button{background:none;color:var(--ink);font-size:20px}.controls .main{width:44px;height:44px;border-radius:50%;background:var(--accent);color:#171716}.save{display:block;margin-left:auto;background:transparent;color:var(--accent);border:1px solid var(--line);height:36px;padding:0 12px;border-radius:9px;font-size:11px}.side h2{font:19px Georgia,serif;margin:0 0 14px}.side button{width:100%;text-align:left;background:#20252d;border:1px solid var(--line);padding:12px;border-radius:11px;color:var(--ink);margin-bottom:8px}.side button:hover{border-color:var(--accent)}.side button small{display:block;color:var(--muted);margin-top:5px}.side .break{background:transparent;border:1px dashed var(--accent);color:var(--accent);text-align:center;margin-top:12px}.offline{margin-top:10px;background:#342923;border:1px solid #89603e;border-radius:11px;padding:12px;color:#e5c6a8;font-size:12px;line-height:1.5}.offline button{margin:10px 0 0;text-align:center;background:var(--accent);color:#141414;border:0}.saved{margin-top:10px;font-size:11px;color:var(--muted)}@media(max-width:900px){.workspace{grid-template-columns:minmax(0,1fr) 250px}}@media(max-width:768px){.desk{padding:18px;min-height:100dvh}.workspace{grid-template-columns:1fr}.picture{height:auto;aspect-ratio:16/9}.side{border-top:1px solid var(--line);padding-top:18px}.topnav{display:none}}</style></head><body><div class=""><main class="desk"><header class="top"><span class="logo">幅场 / FIELD</span><nav class="topnav"><span>发现</span><span>片单</span><span>电台</span></nav><small>设备连接正常　◉</small></header><div class="workspace"><section class="player"><div class="picture"><i class="horizon"></i><button id="play" class="play-icon">▶</button></div><div class="now"><div><h1 id="title">海岸线的清晨 · 第 2 集</h1><p>纪录片　·　24 分钟</p></div><span id="status" class="status">已暂停</span></div><input id="progress" class="range" type="range" min="0" max="1450" value="504" aria-label="播放进度"><div class="time"><span id="clock">08:24</span><span>24:10</span></div><div class="controls"><button>↶</button><button id="toggle" class="main">▶</button><button>≫</button></div><button id="save" class="save">保存播放状态</button><div id="saved" class="saved">尚未保存当前播放位置</div></section><aside class="side"><h2>继续探索</h2><button data-title="慢火厨房 · 一碗汤的时间">慢火厨房<small>厨房纪录 · 18 分钟</small></button><button data-title="海岸线的清晨 · 第 2 集">海岸线的清晨<small>沿岸生活 · 第 2 集</small></button><h2 style="margin-top:18px">当前队列</h2><button>下一集　潮汐与灯塔<small>04:10　·　纪录片</small></button><button id="break" class="break">模拟网络中断</button><div id="offline" class="offline" hidden>连接中断，播放已暂停；当前进度已保存。<button id="reconnect">重新连接并续播</button></div></aside></div></main></div><script>
let playing=false,savedTime=504,offline=false,timer=0;
const progress=document.querySelector('#progress'),clock=document.querySelector('#clock');
function time(v){return String(Math.floor(v/60)).padStart(2,'0')+':'+String(v%60).padStart(2,'0')}
function clearTimer(){clearInterval(timer);timer=0}
function state(){document.querySelector('#status').textContent=offline?'网络中断':playing?'正在播放':'已暂停';document.querySelector('#play').textContent=playing?'Ⅱ':'▶';document.querySelector('#toggle').textContent=playing?'Ⅱ':'▶';progress.disabled=offline}
function tick(){if(!playing||offline)return;const next=Math.min(+progress.max,+progress.value+1);progress.value=next;clock.textContent=time(next);if(next>=+progress.max){playing=false;clearTimer();state()}}
function startTimer(){clearTimer();timer=setInterval(tick,1000)}
function play(){if(offline)return;playing=!playing;if(playing)startTimer();else clearTimer();state()}
document.querySelector('#play').onclick=play;document.querySelector('#toggle').onclick=play;
progress.oninput=function(){clock.textContent=time(+progress.value)};
document.querySelector('#save').onclick=function(){savedTime=+progress.value;document.querySelector('#saved').textContent='已保存 · '+document.querySelector('#title').textContent+' · '+time(savedTime)};
document.querySelectorAll('.side button[data-title]').forEach(function(button){button.onclick=function(){if(offline)return;clearTimer();document.querySelector('#title').textContent=button.dataset.title;progress.value=0;clock.textContent='00:00';savedTime=0;playing=false;state()}});
document.querySelector('#break').onclick=function(){savedTime=+progress.value;offline=true;playing=false;clearTimer();document.querySelector('#offline').hidden=false;document.querySelector('#saved').textContent='断网前进度已保留 · '+time(savedTime);state()};
document.querySelector('#reconnect').onclick=function(){offline=false;progress.value=savedTime;clock.textContent=time(savedTime);playing=true;document.querySelector('#offline').hidden=true;state();startTimer()};
state();
</script></body></html>
