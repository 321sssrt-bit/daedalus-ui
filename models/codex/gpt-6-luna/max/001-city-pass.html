<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="page-name" content="001 登录"><title>001 登录</title><style>:root{--page:#edf5fb;--surface:#ffffff;--text:#16324c;--muted:#648198;--accent:#1478be;--accent2:#70c7ed;--line:#c5d9e7}*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--text);font:15px/1.55 system-ui,sans-serif}.page{width:min(1180px,calc(100% - 48px));min-height:720px;margin:40px auto;display:grid;grid-template-columns:44% 56%;background:var(--surface);border:1px solid var(--line);border-radius:28px;box-shadow:0 25px 70px #153e5d12}h1,h2,p{margin-top:0}h1{font-size:34px;line-height:1.1;letter-spacing:-.03em}.route{padding:42px 46px;background:linear-gradient(150deg,#fff,#eaf5fc);border-radius:28px 0 0 28px}.brand{font-size:18px;font-weight:850;margin-bottom:55px}.brand small{display:block;color:var(--muted);font-size:10px}.eyebrow{color:var(--accent);font-size:10px;letter-spacing:.15em}.route h2{font-size:31px;line-height:1.25}.muted{color:var(--muted);font-size:13px}.route svg{width:100%;height:190px;margin:28px 0 12px}.service{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding:15px 0;color:var(--muted);font-size:11px}.service b{color:var(--text)}.auth{padding:28px 58px;display:flex;flex-direction:column;justify-content:center}.top{width:min(440px,100%);margin:0 auto 18px;color:var(--accent);font-size:10px}.top span{float:right;color:var(--muted)}.card{width:min(440px,100%);margin:auto;padding:36px;border:1px solid var(--line);border-radius:20px;position:relative}.card>i{position:absolute;right:28px;top:27px;color:var(--accent);font-size:10px;font-style:normal}.card label{display:block;font-size:12px;font-weight:700;margin-top:18px}.card input{width:100%;height:48px;border:1px solid var(--line);border-radius:11px;padding:0 13px;margin-top:7px;background:#fbfdff;color:var(--text)}.pass{display:flex}.pass input{flex:1;min-width:0}.pass button{margin-top:7px;border:1px solid var(--line);border-left:0;border-radius:0 11px 11px 0;background:#fbfdff;color:var(--accent);padding:0 12px}.links{display:flex;justify-content:space-between;margin:15px 0 18px;font-size:10px;color:var(--muted)}.links a,.card footer a{color:var(--accent);text-decoration:none;font-weight:750}.primary{height:50px;width:100%;border:0;border-radius:12px;background:var(--accent);color:white;font-weight:750}.primary:hover{background:#0e649f}.primary b{float:right}.feedback{min-height:20px;font-size:11px;color:var(--accent);margin:6px 0 0}.card footer{text-align:center;color:var(--muted);font-size:10px;margin-top:15px}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--accent2);outline-offset:3px}@media(max-width:900px){.page{grid-template-columns:36% 64%;margin:16px auto;width:calc(100% - 32px)}.route{padding:28px}.auth{padding:24px}.brand{margin-bottom:32px}}@media(max-width:640px){.page{display:block;width:100%;margin:0;border-radius:0}.route{padding:22px 24px 8px}.route h2{font-size:24px;margin:8px 0}.route svg{height:95px;margin:5px 0}.service{display:none}.brand{margin-bottom:20px}.auth{padding:8px 18px 26px}.card{padding:28px 22px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}</style></head><body>
<main class="page">
<aside class="route"><div class="brand">↗ 云程 <small>城市通行证</small></div><p class="eyebrow">CITY PASS · 早高峰已就绪</p><h2>让每一段<br>路程，刚刚好。</h2><p class="muted">一张通行证，连接地铁、巴士与城市里的下一站。</p>
<svg viewBox="0 0 500 190" role="img" aria-label="城市路线图"><path d="M25 140C100 140 100 48 190 48s90 94 174 94 48-59 110-59" fill="none" stroke="#1478be" stroke-width="5"/><path d="M25 140C100 140 100 48 190 48s90 94 174 94 48-59 110-59" fill="none" stroke="#70c7ed" stroke-width="2" stroke-dasharray="3 10"/><g fill="#fff" stroke="#1478be" stroke-width="4"><circle cx="25" cy="140" r="9"/><circle cx="190" cy="48" r="9"/><circle cx="364" cy="142" r="9"/><circle cx="474" cy="83" r="9"/></g><text x="14" y="173" fill="#648198" font-size="12">西岸</text><text x="168" y="27" fill="#648198" font-size="12">中央站</text><text x="345" y="173" fill="#648198" font-size="12">美术馆</text></svg>
<div class="service"><b>06:00 — 01:00</b><span>每日陪你准时出发</span></div><small>云程交通 · 让城市近一点</small></aside>
<section class="auth"><div class="top">乘客入口 <span>繁體中文　⌄</span></div><form id="login" class="card"><i>YC / 01</i><h1>欢迎回来</h1><p class="muted">登录你的云程通行证，继续今天的行程。</p>
<label>账号或邮箱<input id="account" required placeholder="name@example.com"></label><label>密码<div class="pass"><input id="password" type="password" required placeholder="输入你的密码"><button id="show" type="button">显示</button></div></label>
<div class="links"><span>保持登录</span><a id="forgot" href="#reset">忘记密码？</a></div><button class="primary" type="submit">进入云程 <b>→</b></button><p class="feedback" id="feedback" aria-live="polite"></p><footer>还没有通行证？ <a href="#join">创建账户</a></footer></form></section></main>
<script>document.getElementById("show").onclick=function(){const p=document.getElementById("password");p.type=p.type==="password"?"text":"password";this.textContent=p.type==="password"?"显示":"隐藏"};document.getElementById("login").onsubmit=function(e){e.preventDefault();document.getElementById("feedback").textContent="账号信息已提交，正在安全核对…"};document.getElementById("forgot").onclick=function(e){e.preventDefault();document.getElementById("feedback").textContent="找回入口已就绪：重置链接会发送到注册邮箱。"}</script></body></html>
