<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>北线编辑部 · 周历</title>
<style>
:root{--page:#F5F1E8;--surface:#FFFEFA;--text:#26333A;--muted:#7A8588;--accent:#C74335;--rail:#E7D6C2;--line:#DED8CC;--soft:#F2EADF}
*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--text);font:14px/1.45 "Segoe UI","Microsoft YaHei",sans-serif}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{height:72px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 max(28px,calc((100vw - 1220px)/2));justify-content:space-between}.brand{display:flex;align-items:center;gap:12px;font-weight:700}.emblem{width:30px;height:30px;background:var(--accent);color:white;display:grid;place-items:center;border-radius:3px;font-weight:800}.nav{display:flex;gap:25px;font-size:12px;color:var(--muted)}.nav b{color:var(--accent)}.user{font-size:12px;color:var(--muted)}
.shell{max-width:1220px;margin:26px auto;padding:0 0 30px}.headline{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.kicker{font-size:10px;letter-spacing:.14em;color:var(--accent);font-weight:700}.headline h1{font-size:27px;letter-spacing:-.04em;margin:5px 0 0}.weeknav{display:flex;align-items:center;gap:12px}.weeknav button{width:34px;height:34px;border:1px solid var(--line);background:var(--surface);border-radius:50%}.weeknav span{font-size:12px;font-weight:700}.add{border:0;background:var(--accent);color:white;padding:10px 15px;border-radius:4px;font-size:12px;font-weight:700;margin-left:8px}
.summary{display:flex;gap:20px;align-items:center;color:var(--muted);font-size:11px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:11px 0;margin-bottom:14px}.summary strong{color:var(--text)}.line-icon{width:20px;height:3px;background:var(--accent);display:inline-block;vertical-align:middle;margin-right:7px}
.calendar{display:grid;grid-template-columns:66px repeat(7,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);box-shadow:0 5px 20px #3b2e2212}
.corner{height:67px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:grid;place-items:center;color:var(--muted);font-size:10px}.day{height:67px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:9px 5px;text-align:center}.day .dow{display:block;color:var(--muted);font-size:10px}.day .date{font-size:17px;font-weight:700;line-height:1.3}.day.today{background:#F9EDE9}.day.today .date{color:var(--accent)}.time{height:100px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:center;color:var(--muted);font-size:10px;padding-top:7px;position:relative}.time:after{content:"";position:absolute;left:0;right:-2000px;top:0;border-top:1px solid #eee9e1;z-index:0}.slot{height:100px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:7px 5px;position:relative}.event{display:block;width:100%;text-align:left;border:0;border-left:3px solid var(--accent);background:#F8EAE5;border-radius:2px;padding:8px 7px;margin:0;position:relative;z-index:1;min-height:60px}.event:hover{background:#F2D8D0}.event b{display:block;font-size:11px;line-height:1.35}.event small{display:block;color:#7D6F69;font-size:9px;margin-top:5px}.event.blue{border-left-color:#598196;background:#E9F0F1}.event.green{border-left-color:#73947D;background:#EAF0E8}.event.gold{border-left-color:#BB8B4B;background:#F6EEDC}
.below{display:grid;grid-template-columns:1fr 295px;gap:16px;margin-top:16px}.key{display:flex;gap:18px;align-items:center;color:var(--muted);font-size:11px;padding:10px 4px}.key i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}.detail{min-height:135px;background:var(--surface);border:1px solid var(--line);padding:17px 19px;position:relative}.detail:before{content:"";position:absolute;left:-1px;top:-1px;bottom:-1px;width:3px;background:var(--accent)}.detail small{color:var(--accent);font-size:10px;letter-spacing:.1em}.detail h2{font-size:16px;margin:6px 0}.detail p{font-size:11px;color:var(--muted);margin:4px 0}.route{margin-top:9px;border:0;background:transparent;color:var(--accent);font-size:11px;padding:0;font-weight:700}
@media(max-width:850px){.top{padding:0 20px}.shell{margin:20px;padding:0 16px 25px;overflow-x:auto}.calendar{min-width:820px}.below{grid-template-columns:1fr 260px}.summary{gap:12px;flex-wrap:wrap}}
@media(max-width:600px){.nav{display:none}.headline{align-items:flex-start;gap:10px;flex-direction:column}.headline h1{font-size:24px}.weeknav{align-self:stretch}.calendar{min-width:780px}.below{grid-template-columns:1fr}.detail{min-height:125px}.shell{padding-left:12px;padding-right:12px}.add{margin-left:auto}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style></head>
<body><header class="top"><div class="brand"><span class="emblem">北</span>北线编辑部</div><nav class="nav"><span>工作台</span><b>周历</b><span>任务表</span><span>通讯录</span></nav><span class="user">秋季刊制作组　⌄</span></header>
<main class="shell"><div class="headline"><div><div class="kicker">时刻表　/　每周安排</div><h1>9 月 21 日 — 27 日</h1></div><div class="weeknav"><button aria-label="上一周">‹</button><span>2026 年 · 第 39 周</span><button aria-label="下一周">›</button><button class="add">＋ 新建安排</button></div></div>
<div class="summary"><span><i class="line-icon"></i><strong>本周 12 项安排</strong></span><span>·</span><span>下一站：纸样评审　今天 11:00</span><span style="margin-left:auto">GMT+8　香港</span></div>
<section class="calendar" aria-label="一周日历">
<div class="corner">时间</div><div class="day"><span class="dow">周一</span><span class="date">21</span></div><div class="day"><span class="dow">周二</span><span class="date">22</span></div><div class="day today"><span class="dow">周三 · 今天</span><span class="date">23</span></div><div class="day"><span class="dow">周四</span><span class="date">24</span></div><div class="day"><span class="dow">周五</span><span class="date">25</span></div><div class="day"><span class="dow">周六</span><span class="date">26</span></div><div class="day"><span class="dow">周日</span><span class="date">27</span></div>
<div class="time">09:00</div><div class="slot"><button class="event blue" data-title="编辑晨会" data-time="周一 09:30 — 10:00" data-place="北线会议室 · 3 楼" data-people="林乔、许安、周棠"><b>编辑晨会</b><small>09:30 · 会议室 3F</small></button></div><div class="slot"></div><div class="slot"></div><div class="slot"><button class="event green" data-title="图版交接" data-time="周四 09:00 — 09:30" data-place="图书馆东门" data-people="陈野、唐也"><b>图版交接</b><small>09:00 · 图书馆</small></button></div><div class="slot"></div><div class="slot"></div><div class="slot"></div>
<div class="time">11:00</div><div class="slot"></div><div class="slot"><button class="event gold" data-title="采访提纲校订" data-time="周二 11:00 — 12:00" data-place="线上 · 北线编辑室" data-people="许安、林乔"><b>采访提纲校订</b><small>11:00 · 编辑室</small></button></div><div class="slot"><button class="event" data-title="纸样评审" data-time="周三 11:00 — 12:30" data-place="印务工作间 · 2 号桌" data-people="林乔、周棠、陈野"><b>纸样评审</b><small>11:00 · 印务工作间</small></button></div><div class="slot"></div><div class="slot"><button class="event blue" data-title="封面拍摄确认" data-time="周五 11:30 — 12:00" data-place="天台 · 北侧自然光区" data-people="唐也、陈野"><b>封面拍摄确认</b><small>11:30 · 天台北侧</small></button></div><div class="slot"></div><div class="slot"></div>
<div class="time">14:00</div><div class="slot"><button class="event green" data-title="插画一校" data-time="周一 14:00 — 15:30" data-place="插画台 · 靠窗位" data-people="陈野、周棠"><b>插画一校</b><small>14:00 · 插画台</small></button></div><div class="slot"></div><div class="slot"></div><div class="slot"><button class="event gold" data-title="采访录音整理" data-time="周四 14:30 — 15:30" data-place="安静间 · B 室" data-people="许安"><b>采访录音整理</b><small>14:30 · 安静间 B</small></button></div><div class="slot"></div><div class="slot"></div><div class="slot"></div>
<div class="time">16:00</div><div class="slot"></div><div class="slot"><button class="event" data-title="栏目字数确认" data-time="周二 16:00 — 16:30" data-place="北线会议室 · 3 楼" data-people="林乔、许安"><b>栏目字数确认</b><small>16:00 · 会议室 3F</small></button></div><div class="slot"><button class="event blue" data-title="摄影选片" data-time="周三 16:00 — 17:00" data-place="暗房 · 选片桌" data-people="唐也、周棠"><b>摄影选片</b><small>16:00 · 暗房</small></button></div><div class="slot"></div><div class="slot"></div><div class="slot"><button class="event green" data-title="下期选题便笺" data-time="周六 16:30 — 17:00" data-place="线上 · 编辑部频道" data-people="全体编辑"><b>下期选题便笺</b><small>16:30 · 线上</small></button></div><div class="slot"></div>
</section>
<div class="below"><div class="key"><span><i style="background:#C74335"></i>评审与会议</span><span><i style="background:#598196"></i>交接与拍摄</span><span><i style="background:#73947D"></i>制作任务</span><span><i style="background:#BB8B4B"></i>文字工作</span></div><aside class="detail" id="detail" aria-live="polite"><small>行程详情　/　待命</small><h2>选择一项安排</h2><p>点击日历中的事件，查看时间、地点和参与人。</p></aside></div>
</main>
<script>
document.querySelector('.calendar').addEventListener('click',e=>{const item=e.target.closest('.event');if(!item)return;const d=document.querySelector('#detail');d.innerHTML='<small>行程详情　/　已选中</small><h2></h2><p class="detail-time"></p><p class="detail-place"></p><p class="detail-people"></p><button class="route">查看路线　↗</button>';d.querySelector('h2').textContent=item.dataset.title;d.querySelector('.detail-time').textContent='◷　'+item.dataset.time;d.querySelector('.detail-place').textContent='⌖　'+item.dataset.place;d.querySelector('.detail-people').textContent='同行　'+item.dataset.people});
</script></body></html>
