<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>024 结账 · glacier-checkout</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer}a{color:inherit}svg{display:block}

:root{--page:#eef5f8;--surface:#fff;--ink:#173244;--muted:#67808f;--line:#cadce4;--blue:#37799b;--pale:#d7ecf5;--green:#4d8f78}body{background:linear-gradient(110deg,#eaf2f6,#f7fbfc);color:var(--ink);min-height:100vh}.wrap{max-width:1120px;margin:auto;padding:0 40px}.top{height:70px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{font-weight:800;letter-spacing:.11em;font-size:13px}.safe{font-size:10px;color:var(--green)}.progress{display:flex;gap:17px;font-size:10px;color:#92a8b3}.progress b{color:var(--blue)}.layout{display:grid;grid-template-columns:1.22fr .78fr;gap:28px;padding:28px 0}.form h1{font:500 30px Georgia,serif;margin:0}.lead{color:var(--muted);font-size:11px;margin:7px 0 19px}.box{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:18px 20px;margin-bottom:12px;box-shadow:0 4px 14px #38586b08}.box h2{font-size:12px;margin:0 0 13px;display:flex;justify-content:space-between}.box h2 span{color:var(--blue);font-size:10px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:11px}.field label{display:block;font-size:9px;color:var(--muted);margin-bottom:5px}.field input{width:100%;height:36px;border:1px solid var(--line);border-radius:4px;padding:0 10px;background:#fbfdfe;font-size:11px;color:var(--ink);outline:none}.field input:focus{border-color:var(--blue);box-shadow:0 0 0 3px #37799b20}.payrow{display:flex;gap:9px}.pay{flex:1;border:1px solid var(--line);border-radius:5px;background:#fff;padding:11px;text-align:left;font-size:10px;color:var(--ink)}.pay[aria-pressed=true]{border:2px solid var(--blue);background:#f0f8fb}.pay small{display:block;color:var(--muted);font-size:9px;margin-top:5px}.secure{font-size:9px;color:var(--green);margin-top:13px}.summary{background:#fff;border:1px solid var(--line);border-radius:7px;padding:21px;height:max-content}.summary h2{font:20px Georgia,serif;margin:0 0 16px}.product{display:flex;gap:13px;align-items:center;padding:12px 0;border-top:1px solid #e2edf1}.mini{width:58px;height:56px;background:#c7dce4;display:grid;place-items:center}.mini:after{content:"";width:27px;height:37px;border-radius:3px 3px 10px 10px;background:linear-gradient(90deg,#618799,#9dbcc7)}.product b{font-size:11px}.product small{display:block;color:var(--muted);font-size:9px;margin-top:5px}.product strong{margin-left:auto;font-size:11px}.line{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);padding:9px 0}.line.total{border-top:1px solid var(--line);margin-top:7px;padding-top:15px;color:var(--ink);align-items:baseline}.line.total strong{font-size:24px;color:var(--blue)}.confirm{width:100%;height:46px;border:0;border-radius:4px;background:var(--blue);color:#fff;font-weight:700;font-size:11px;margin-top:12px}.toast{display:none;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:12px 18px;background:var(--green);color:#fff;font-size:11px;border-radius:4px}.toast.show{display:block}@media(max-width:820px){.wrap{padding:0 24px}.layout{gap:15px}.box{padding:15px}.summary{padding:16px}}@media(max-width:650px){.progress{display:none}.layout{grid-template-columns:1fr}.summary{grid-row:1}.fields{grid-template-columns:1fr}.payrow{flex-direction:column}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}

button:hover:not(:disabled){filter:brightness(.92)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid currentColor;outline-offset:2px}button:disabled{cursor:not-allowed;opacity:.48}article:hover{filter:brightness(1.04)}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}</style>
</head>
<body>

<main class="wrap"><header class="top"><div class="brand">北屿 / GOODS</div><div class="progress"><span>购物袋　›</span><b>配送与付款　›</b><span>完成</span></div><span class="safe">▣ 安全结账</span></header><div class="layout"><section class="form"><h1>最后确认一下</h1><p class="lead">地址和付款方式确认后，我们会安排出库。</p><section class="box"><h2>配送地址 <span>编辑</span></h2><div class="fields"><div class="field"><label>收件人</label><input value="陈予安" aria-label="收件人"></div><div class="field"><label>手机号码</label><input value="138 0000 6218" aria-label="手机号码"></div><div class="field" style="grid-column:1/-1"><label>详细地址</label><input value="上海市徐汇区衡山路 17 号 2 楼" aria-label="详细地址"></div></div></section><section class="box"><h2>选择付款方式 <span>付款信息加密保护</span></h2><div class="payrow"><button class="pay" aria-pressed="true" onclick="pay(this)">银行卡 / 云闪付<small>尾号 2026 · 推荐</small></button><button class="pay" aria-pressed="false" onclick="pay(this)">微信支付<small>扫码安全支付</small></button><button class="pay" aria-pressed="false" onclick="pay(this)">支付宝<small>支持花呗</small></button></div><div class="secure">✓ 订单确认前不会扣款</div></section></section><aside class="summary"><h2>订单摘要</h2><div class="product"><div class="mini"></div><div><b>海盐釉咖啡壶</b><small>云雾白 · 1 件</small></div><strong>¥ 468</strong></div><div class="product"><div class="mini" style="background:#c1d5cf"></div><div><b>手捏分享杯</b><small>灰绿 · 2 件</small></div><strong>¥ 236</strong></div><div class="line"><span>商品金额</span><span>¥ 704</span></div><div class="line"><span>配送费</span><span>免运费</span></div><div class="line total"><span>实付金额</span><strong>¥ 704</strong></div><button class="confirm" onclick="confirmPay()">确认支付　¥704</button><p style="font-size:9px;line-height:1.6;color:var(--muted)">点击确认即表示你同意《购物条款》与《隐私说明》。</p></aside></div></main><div class="toast" id="toast">订单已确认，正在安全跳转…</div>

<script>function pay(b){document.querySelectorAll('.pay').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true')}function confirmPay(){let t=document.getElementById('toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}</script>
</body>
</html>
