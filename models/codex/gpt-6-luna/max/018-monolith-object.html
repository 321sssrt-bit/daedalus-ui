<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>018 器物详情 · monolith-object</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer}a{color:inherit}svg{display:block}

:root{--page:#f9f9f7;--surface:#fff;--ink:#111;--muted:#777;--line:#d9d9d5;--soft:#eee;--accent:#222}body{background:var(--page);color:var(--ink);min-height:100vh}.wrap{max-width:1160px;margin:auto;padding:0 54px}.top{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;font-size:11px;letter-spacing:.1em}.wordmark{font:700 16px Arial,sans-serif;letter-spacing:.24em}.top nav{display:flex;gap:26px;color:#555}.crumb{font-size:10px;color:var(--muted);padding:20px 0}.product{display:grid;grid-template-columns:1.13fr .87fr;gap:68px;align-items:center}.gallery{height:570px;background:#eeefed;display:grid;place-items:center;position:relative;overflow:hidden}.gallery:before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,#f2f2ef,#e2e3df)}.plate{position:relative;width:355px;height:355px;border-radius:50%;background:radial-gradient(circle at 42% 36%,#fff 0 27%,#dededb 33%,#f9f9f7 46%,#c6c7c3 51%,#ebebe8 62%,#fff 72%);box-shadow:20px 28px 40px #0002,inset 0 2px 8px #fff}.plate:after{content:"";position:absolute;inset:75px;border:1px solid #d1d1cc;border-radius:50%}.edition{position:absolute;left:22px;bottom:20px;font:10px monospace;letter-spacing:.15em;color:#666}.details{padding:12px 0}.kicker{font:10px monospace;letter-spacing:.18em;color:#888;text-transform:uppercase}.details h1{font:400 48px/1.02 Georgia,serif;letter-spacing:-.03em;margin:17px 0 9px}.subtitle{color:#777;font:italic 17px Georgia,serif}.price{font-size:18px;margin:24px 0 18px}.desc{color:#555;line-height:1.8;font-size:13px;max-width:370px;border-top:1px solid var(--line);padding-top:17px}.label{font-size:10px;letter-spacing:.12em;margin:26px 0 10px}.swatches{display:flex;gap:8px}.swatch{border:1px solid #aaa;background:#fff;padding:9px 13px;font-size:10px}.swatch[aria-pressed=true]{outline:1px solid #111;outline-offset:2px}.buy{margin-top:30px;width:100%;height:52px;background:#111;color:white;border:0;font-size:11px;letter-spacing:.14em}.note{font-size:10px;color:#777;margin-top:12px}.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,10px);opacity:0;background:#111;color:white;padding:12px 20px;font-size:12px;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:900px){.wrap{padding:0 26px}.product{gap:32px}.gallery{height:480px}.plate{width:290px;height:290px}.details h1{font-size:42px}}@media(max-width:640px){.top nav{display:none}.product{grid-template-columns:1fr;gap:20px}.gallery{height:360px}.plate{width:250px;height:250px}.details{padding-bottom:40px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}

button:hover:not(:disabled){filter:brightness(.92)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid currentColor;outline-offset:2px}button:disabled{cursor:not-allowed;opacity:.48}article:hover{filter:brightness(1.04)}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}</style>
</head>
<body>

<main class="wrap"><header class="top"><span class="wordmark">FORM / FIELD</span><nav><span>餐桌</span><span>器物档案</span><span>关于窑场</span></nav><span>购物袋　0</span></header><div class="crumb">器物档案　/　日用陶　/　F–12</div><section class="product"><div class="gallery"><div class="plate"></div><span class="edition">F–12 / WHEEL-THROWN / 2026</span></div><div class="details"><span class="kicker">FIELD SERIES · NO. 12</span><h1>浅釉<br>早餐盘</h1><div class="subtitle">A quiet beginning</div><div class="price">¥ 328</div><p class="desc">一只留有拉坯细纹的日用盘。浅灰釉在高温中自然流动，每片边缘略有不同，盛放早餐，也盛放寻常的一天。</p><div class="label">选择釉色 / 直径 22 CM</div><div class="swatches"><button class="swatch" aria-pressed="true" onclick="choose(this)">雾白</button><button class="swatch" aria-pressed="false" onclick="choose(this)">石墨</button><button class="swatch" aria-pressed="false" onclick="choose(this)">砂灰</button></div><button class="buy" onclick="buy()">放入购物袋　—　¥328</button><p class="note">手工制作 · 5 个工作日内发货 · 可在 7 日内退换</p></div></section></main><div class="toast" id="toast"></div>

<script>function choose(btn){document.querySelectorAll('.swatch').forEach(x=>x.setAttribute('aria-pressed','false'));btn.setAttribute('aria-pressed','true')}function buy(){const t=document.getElementById('toast');t.textContent='雾白早餐盘已加入购物袋';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600)}</script>
</body>
</html>
