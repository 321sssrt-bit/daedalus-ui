<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>搜索没有结果｜Fieldnote</title>
<style>
:root{--paper:#FAFAF6;--ink:#171A22;--blue:#2749C7;--line:#DDE2EF;--sand:#F1ECDF;--muted:#667085;--coral:#E45F44;--white:#FFFFFF}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Segoe UI","Microsoft YaHei",sans-serif}
.wrap{max-width:1200px;margin:auto;padding:26px 42px 48px}.top{height:55px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.logo{font:700 15px Georgia,serif;letter-spacing:.1em}.logo i{display:inline-block;width:14px;height:14px;background:var(--blue);border-radius:50%;margin-right:9px;vertical-align:-2px}.top small{color:var(--muted);font-size:11px;letter-spacing:.13em}
.main{max-width:850px;margin:72px auto 0}.kicker{color:var(--coral);font-size:11px;font-weight:700;letter-spacing:.18em}.main h1{font:500 clamp(34px,5vw,58px)/1.08 Georgia,"Songti SC",serif;letter-spacing:-.045em;margin:14px 0 11px}.intro{color:var(--muted);font-size:14px;margin:0 0 27px}
.search{height:66px;background:var(--white);border:1px solid var(--line);box-shadow:0 6px 22px #171A220D;display:flex;align-items:center;padding:6px 7px 6px 20px}.search:focus-within{outline:3px solid #2749C733;border-color:var(--blue)}.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:16px "Segoe UI","Microsoft YaHei",sans-serif;outline:0}.search button{height:50px;padding:0 22px;border:0;background:var(--blue);color:var(--white);font-weight:700;cursor:pointer}.search button:hover{background:var(--ink)}.search button:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.empty{margin-top:48px;display:grid;grid-template-columns:170px 1fr;gap:31px;align-items:center}.mark{height:156px;display:grid;place-items:center;background:var(--sand);position:relative;overflow:hidden}.mark:before,.mark:after{content:"";position:absolute;border:1px solid #D4C9AD;border-radius:50%;width:118px;height:118px}.mark:after{width:77px;height:77px;border-color:var(--coral)}.glass{position:relative;z-index:1;width:42px;height:42px;border:3px solid var(--blue);border-radius:50%}.glass:after{content:"";position:absolute;width:19px;height:3px;background:var(--blue);right:-14px;bottom:-7px;transform:rotate(45deg)}.empty h2{font:600 25px Georgia,"Songti SC",serif;margin:0 0 9px}.empty p{font-size:13px;line-height:1.65;color:var(--muted);margin:0}.query{color:var(--blue);font-weight:700}
.suggest{margin:39px 0 0 201px;border-top:1px solid var(--line);padding-top:20px}.suggest h3{font-size:11px;letter-spacing:.12em;color:var(--muted);margin:0 0 13px}.chips{display:flex;gap:9px;flex-wrap:wrap}.chips button{padding:9px 13px;border:1px solid var(--line);background:transparent;color:var(--ink);font-size:12px;cursor:pointer}.chips button:hover,.chips button:focus-visible{border-color:var(--blue);color:var(--blue);outline:0}.notice{font-size:11px;color:var(--coral);min-height:18px;margin-top:12px}
.bottom{display:flex;justify-content:space-between;margin-top:90px;border-top:1px solid var(--line);padding-top:12px;color:var(--muted);font-size:10px}
@media(max-width:760px){.wrap{padding:18px 22px 32px}.main{margin-top:48px}.empty{grid-template-columns:112px 1fr;gap:18px}.mark{height:112px}.mark:before{width:85px;height:85px}.mark:after{width:55px;height:55px}.suggest{margin-left:130px}.bottom{margin-top:60px}}
@media(max-width:500px){.main h1{font-size:38px}.search{height:auto;min-height:60px;padding-left:13px}.search input{font-size:14px}.search button{height:44px;padding:0 13px}.empty{grid-template-columns:1fr;margin-top:32px}.mark{width:104px;height:104px}.suggest{margin:29px 0 0}.bottom{gap:12px;flex-wrap:wrap}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main class="wrap">
  <header class="top"><div class="logo"><i></i>FIELDNOTE / 搜索</div><small>个人资料库　　⌘ K</small></header>
  <section class="main">
    <div class="kicker">LOOK AGAIN · 04 RESULTS CHECKED</div>
    <h1>这条线索还没有落点。</h1>
    <p class="intro">换一种说法，或从几个相近的方向继续找。</p>
    <form class="search" id="searchForm"><input id="query" type="search" value="海边徒步的旧电影" aria-label="搜索资料" autocomplete="off"><button type="submit">再搜一次</button></form>
    <section class="empty" aria-live="polite"><div class="mark" aria-hidden="true"><span class="glass"></span></div><div><h2>没有找到「<span class="query" id="queryEcho">海边徒步的旧电影</span>」</h2><p>检查一下词语有没有写错，或者先拿掉一个限定词。资料库仍然完整，这次只是没有匹配到可展示的内容。</p></div></section>
    <section class="suggest"><h3>试试缩小一步</h3><div class="chips"><button type="button" data-term="海边电影">海边电影</button><button type="button" data-term="徒步纪录片">徒步纪录片</button></div><p class="notice" id="notice" role="status"></p></section>
  </section>
  <footer class="bottom"><span>私人资料库 · 最近同步 08:36</span><span>搜索不会修改或删除任何内容</span></footer>
</main>
<script>
var input=document.getElementById('query'),echo=document.getElementById('queryEcho'),notice=document.getElementById('notice');
function showQuery(){var value=input.value.trim();echo.textContent=value||'空白搜索';notice.textContent=value?'仍没有匹配项，可以试试下面的短词。':'先输入一两个关键词，再重新搜索。';}
document.getElementById('searchForm').addEventListener('submit',function(event){event.preventDefault();showQuery();});
document.querySelectorAll('.chips button').forEach(function(button){button.addEventListener('click',function(){input.value=button.dataset.term;showQuery();input.focus();});});
</script>
</body>
</html>
