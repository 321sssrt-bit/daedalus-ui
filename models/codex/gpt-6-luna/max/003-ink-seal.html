<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="page-name" content="003 邀请进入"><title>003 邀请进入</title><style>:root{--page:#e9dfc8;--surface:#f7f0df;--text:#35291f;--muted:#83745d;--accent:#8d3c2c;--accent2:#b9944a;--line:#d7c8a7}*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--text);font:15px/1.7 Georgia,serif}.page{min-height:800px;padding:30px 48px;background:radial-gradient(ellipse at 52% 44%,#f7f0df,#e9dfc8 74%)}header,footer{max-width:1120px;margin:auto;display:flex;justify-content:space-between;color:var(--muted);font:700 10px system-ui;letter-spacing:.16em}header{padding:14px 0;border-block:1px solid #aa9b7d}.sheet{width:min(780px,100%);min-height:630px;background:var(--surface);margin:28px auto 20px;padding:55px 80px;position:relative;box-shadow:0 18px 55px #5d4c3320;border:1px solid #d3c29c}.sheet:before{content:"";position:absolute;inset:10px;border:1px solid #e4d8bd;pointer-events:none}.seal{position:absolute;right:64px;top:54px;width:118px;height:118px;border:2px solid var(--accent);border-radius:50%;display:grid;place-content:center;text-align:center;color:var(--accent);transform:rotate(8deg)}.seal b{font-size:36px;line-height:1}.seal small{font:700 9px system-ui;letter-spacing:.14em}.eyebrow{color:var(--accent);font:700 10px system-ui;letter-spacing:.15em;margin:0 0 18px}.sheet h1{font:500 43px/1.24 Georgia,serif;margin:0 0 18px}.copy{max-width:500px;font-size:16px;line-height:1.85;color:#665744}.divider{display:flex;align-items:center;gap:12px;color:var(--accent2);margin:23px 0}.divider:before,.divider:after{content:"";height:1px;background:#d9c9a9;flex:1}.sheet label{display:block;font:700 12px system-ui;margin-bottom:8px}.code{display:flex;gap:10px}.code input{height:52px;flex:1;min-width:0;border:1px solid #cbb992;background:#fbf7ec;padding:0 14px;font:600 14px system-ui;letter-spacing:.06em}.code button{height:52px;border:0;background:var(--accent <main class="page"><header>THE WRITERS’ GUILD <span>ARCHIVE · 028</span></header><section class="sheet"><div class="seal"><b>墨</b><small>会籍章</small></div><p class="eyebrow">写作公会 · 邀请函</p><h1>一张桌子，<br>为你留了位置。</h1><p class="copy">亲爱的写作者：<br>这封短笺邀你进入写作公会。我们每周围读一段未完成的文字，也认真听每一次沉默。</p><div class="divider">✦</div><label for="invite">你的邀请码</label><div class="code"><input id="invite" placeholder="例如 GUILD-28"><button id="verify" type="button">核对邀请　→</button></div><p id="notice" aria-live="polite">邀请码印在邀请邮件的末尾。</p><a id="help" href="#help">没有找到邀请函？写信给秘书处</a></section><footer>安静写作，彼此照亮。 <i>— 编辑委员会</i></footer></main>
<script>document.getElementById("verify").onclick=function(){const v=document.getElementById("invite").value.trim().toUpperCase(),n=document.getElementById("notice");n.textContent=v==="GUILD-28"?"印记吻合。秘书处已经为你打开一席。":"这枚印记没有对上，请核对邮件末尾的字母与数字。";n.style.color=v==="GUILD-28"?"#46714c":"#8d3c2c"};document.getElementById("help").onclick=function(e){e.preventDefault();document.getElementById("notice").textContent="请写信至秘书处：hello@writers-guild.example，我们会帮你查找邀请。"}</script></body></html>
