<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>038 故障</title>
<style>
:root{--page:#FFF8F6;--surface:#FFFFFF;--ink:#332625;--muted:#806B68;--accent:#C9433D;--line:#F2DAD5;--frame:#262522}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--page);color:var(--ink);font-family:Arial, 'Microsoft YaHei', sans-serif}
body{min-height:100vh}
button,input,textarea,select{font:inherit}
button{border:0;cursor:pointer;transition:background-color .16s ease,color .16s ease,transform .16s ease}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
button:disabled{cursor:not-allowed;opacity:.45}
.preview{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 5%,var(--surface),var(--page) 72%)}
.phone{width:390px;height:844px;overflow:hidden;border:8px solid var(--frame);border-radius:42px;background:var(--page);box-shadow:0 28px 100px #0003;display:flex;flex-direction:column}
.screen{flex:1;min-height:0;overflow:auto;padding:20px 22px}
@media(max-width:430px){.preview{padding:0;background:var(--page)}.phone{width:100vw;height:100dvh;min-height:100dvh;border:0;border-radius:0;box-shadow:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
.top{height:56px;display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted)}.screen{display:flex;flex-direction:column;justify-content:center}.error{text-align:center}.mark{width:96px;height:96px;border-radius:50%;margin:0 auto 20px;background:#f8e8e4;display:grid;place-items:center;color:var(--accent);font-size:44px;position:relative}.mark:after{content:"";width:124px;height:124px;border:1px dashed #c9433d66;border-radius:50%;position:absolute}.error h1{font-size:23px;margin:0 0 10px}.error p{font-size:14px;line-height:1.8;color:var(--muted);margin:0 auto 24px;max-width:290px}.ticket{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;text-align:left;font-size:11px;color:var(--muted)}.ticket b{display:block;color:var(--ink);font:14px ui-monospace,monospace;margin-top:6px}.actions{padding:14px 22px 20px;display:grid;gap:10px}.actions button{height:52px;border-radius:12px}.retry{background:var(--accent);color:white;font-weight:700}.home{background:transparent;color:var(--accent);border:1px solid var(--line)}.retry:hover{background:#ab332e}
button:hover:not(:disabled){filter:brightness(.92)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid currentColor;outline-offset:2px}button:disabled{cursor:not-allowed;opacity:.48}article:hover{filter:brightness(1.04)}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}</style>
</head>
<body>
<div class="preview">
<main class="phone">
<header class="top"><span>‹ 帮助中心</span><span>连接状态</span><span>⋯</span></header><section class="screen"><div class="error"><div class="mark">!</div><h1 id="headline">这条连接暂时中断</h1><p id="message">内容没有丢失，连接恢复后可以继续刚才的操作。</p><div class="ticket">故障编号<b>DL-2408-0317</b></div></div></section><footer class="actions"><button id="retry" class="retry">重新连接</button><button id="home" class="home">回到首页</button></footer>
</main>
</div>
<script>
const retry=document.querySelector('#retry');retry.onclick=()=>{retry.disabled=true;retry.textContent='正在检查线路…';document.querySelector('#message').textContent='正在安全地重连，请稍候。';setTimeout(()=>{document.querySelector('#headline').textContent='连接已恢复';document.querySelector('#message').textContent='刚才的内容仍然保留，你可以继续使用。';retry.disabled=false;retry.textContent='继续刚才的操作'},650)};retry.addEventListener('click',()=>{if(retry.textContent==='继续刚才的操作')retry.textContent='已继续'});document.querySelector('#home').onclick=()=>{document.querySelector('#headline').textContent='服务首页';document.querySelector('#message').textContent='网络连接正常。你可以重新开始，或打开帮助中心查看处理进度。'};
</script>
</body>
</html>
