<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>033 钱包首页 · lagoon-wallet</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer}a{color:inherit}svg{display:block}

:root{--page:#ddf2eb;--paper:#f8fffc;--ink:#163e3a;--muted:#6c9289;--line:#c4e0d8;--teal:#258c78;--mint:#a3dfca;--gold:#eabf63;--coral:#e78070}body{background:#cbe7dd;color:var(--ink);min-height:100vh}.phone{width:390px;min-height:844px;margin:0 auto;background:var(--paper);border-radius:30px;overflow:hidden;position:relative;box-shadow:0 20px 70px #164b3a28;padding-bottom:75px}.apphead{height:66px;padding:0 23px;display:flex;align-items:center;justify-content:space-between}.apphead strong{font-size:13px;letter-spacing:.05em}.avatar{width:32px;height:32px;border-radius:50%;background:#c4e7dc;display:grid;place-items:center;font-size:11px;color:var(--teal)}.balance{margin:0 17px;background:linear-gradient(135deg,#176e61,#28927d);color:#effff7;border-radius:18px;padding:20px 21px 17px;min-height:185px;position:relative;overflow:hidden}.balance:after{content:"";position:absolute;width:190px;height:190px;border-radius:50%;border:1px solid #ffffff2c;right:-54px;top:-95px;box-shadow:0 0 0 23px #ffffff0d,0 0 0 48px #ffffff0a}.balance small{font-size:10px;color:#b9ebd8}.balance h1{font:500 35px Georgia,serif;margin:11px 0 4px;letter-spacing:-.04em}.balance .change{font-size:9px;color:#c1ecdc}.eye{float:right;color:#c5f0df;font-size:14px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:17px}.action{height:63px;border:1px solid var(--line);background:#f0fbf6;border-radius:13px;display:flex;align-items:center;gap:11px;padding:0 15px;color:var(--ink);text-align:left}.action i{width:32px;height:32px;border-radius:10px;background:var(--mint);display:grid;place-items:center;color:#126251;font-style:normal;font-size:18px}.action span{font-size:11px;font-weight:650}.action small{display:block;font-size:8px;color:var(--muted);font-weight:400;margin-top:4px}.section{padding:0 19px}.secthead{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 9px}.secthead h2{font-size:13px;margin:0}.secthead button{border:0;background:none;color:var(--teal);font-size:9px}.transaction{display:flex;align-items:center;padding:10px 1px;border-bottom:1px solid #e4f0eb;gap:11px}.txicon{width:36px;height:36px;border-radius:12px;background:#e4f5ee;display:grid;place-items:center;color:var(--teal);font-size:14px}.txicon.out{background:#fff0ed;color:var(--coral)}.txinfo{min-width:0}.txinfo strong{font-size:10px;display:block}.txinfo small{font-size:8px;color:var(--muted);display:block;margin-top:4px}.amount{margin-left:auto;font:12px Georgia,serif;white-space:nowrap}.amount.in{color:var(--teal)}.amount.out{color:var(--ink)}.nav{position:absolute;bottom:0;left:0;right:0;height:69px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:7px 10px}.nav button{border:0;background:transparent;color:#86a69c;font-size:8px}.nav button i{display:block;font-style:normal;font-size:17px;margin-bottom:3px}.nav button.active{color:var(--teal);font-weight:700}.sheet{display:none;position:absolute;left:12px;right:12px;bottom:76px;background:#fff;border:1px solid var(--line);border-radius:17px;padding:17px;box-shadow:0 9px 30px #174e3d24}.sheet.show{display:block}.sheet h3{font-size:13px;margin:0 0 8px}.sheet p{font-size:10px;color:var(--muted);margin:0 0 12px}.sheet button{background:var(--teal);color:#fff;border:0;padding:9px 12px;border-radius:7px;font-size:10px}.toast{position:absolute;top:71px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 13px;border-radius:99px;font-size:9px;display:none}.toast.show{display:block}@media(min-width:600px){body{padding:22px 0}.phone{min-height:844px;border:7px solid #214e44}.balance{min-height:185px}}@media(max-width:420px){body{background:var(--paper)}.phone{width:100%;min-height:100vh;border-radius:0;box-shadow:none}.balance{margin-top:2px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}

button:hover:not(:disabled){filter:brightness(.92)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid currentColor;outline-offset:2px}button:disabled{cursor:not-allowed;opacity:.48}article:hover{filter:brightness(1.04)}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}</style>
</head>
<body>

<main class="phone"><header class="apphead"><strong>潮汐钱包</strong><span class="avatar">陈</span></header><section class="balance"><span class="eye">◉</span><small>账户总余额　·　人民币</small><h1>¥ 24,680.50</h1><span class="change">本月净流入　＋¥ 3,240.00</span></section><section class="actions"><button class="action" onclick="openSheet('转出资金','转账至已绑定银行卡，通常 2 小时内到账。')"><i>↑</i><span>转出<small>到银行卡</small></span></button><button class="action" onclick="openSheet('收款','出示收款码或复制你的收款链接。')"><i>↓</i><span>收款<small>分享收款方式</small></span></button></section><section class="section"><div class="secthead"><h2>最近流水</h2><button onclick="toast('已显示全部流水')">查看全部 →</button></div>
<article class="transaction"><span class="txicon in">↓</span><span class="txinfo"><strong>项目结算入账</strong><small>今天 10:24 · 青柠工作室</small></span><span class="amount in">＋ ¥ 2,800.00</span></article><article class="transaction"><span class="txicon out">↗</span><span class="txinfo"><strong>咖啡事务所</strong><small>今天 08:16 · 扫码支付</small></span><span class="amount out">− ¥ 36.00</span></article><article class="transaction"><span class="txicon in">↓</span><span class="txinfo"><strong>朋友转账</strong><small>昨天 19:42 · 来自 林知野</small></span><span class="amount in">＋ ¥ 120.00</span></article><article class="transaction"><span class="txicon out">↗</span><span class="txinfo"><strong>地铁乘车码</strong><small>昨天 08:05 · 交通出行</small></span><span class="amount out">− ¥ 4.00</span></article><article class="transaction"><span class="txicon in">↓</span><span class="txinfo"><strong>退款到账</strong><small>09 月 20 日 · 器物商店</small></span><span class="amount in">＋ ¥ 360.00</span></article>
</section><nav class="nav"><button class="active" onclick="nav(this,'钱包')"><i>◉</i>钱包</button><button onclick="nav(this,'明细')"><i>▤</i>明细</button><button onclick="nav(this,'卡片')"><i>▰</i>卡片</button><button onclick="nav(this,'我的')"><i>●</i>我的</button></nav><section class="sheet" id="sheet"><h3 id="sheetTitle"></h3><p id="sheetBody"></p><button onclick="closeSheet()">知道了</button></section><div id="toast" class="toast"></div></main>

<script>function openSheet(t,p){document.getElementById('sheetTitle').textContent=t;document.getElementById('sheetBody').textContent=p;document.getElementById('sheet').classList.add('show')}function closeSheet(){document.getElementById('sheet').classList.remove('show')}function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1300)}function nav(b,n){document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(n!=='钱包')toast(n+'功能已选中')}</script>
</body>
</html>
