<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>花圃 · 加入一起生长</title><style>*{box-sizing:border-box}body{margin:0;font:15px/1.6 "Segoe UI","Microsoft YaHei",sans-serif;color:var(--text);background:var(--page)}button,input,textarea,select{font:inherit}button{cursor:pointer;min-height:44px}button:hover{filter:brightness(.94)}button:active{transform:translateY(1px)}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}[hidden]{display:none!important}button,input,textarea,select{color:inherit}svg{max-width:100%}h1,h2,h3,p{margin-top:0}button{transition:filter .15s ease}input,textarea{min-width:0}a{color:inherit}label{display:block}small{font-size:12px}dialog{color:var(--text);border:1px solid var(--muted)}dialog::backdrop{background:rgba(0,0,0,.45)}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
 :root{--page:#c4f437;--surface:#f9f9eb;--text:#17200e;--muted:#4c5d27;--accent:#36651e;--line:#8ca72e;--soft:#ff91b3}.wrap{max-width:1180px;margin:auto;padding:30px 28px}.bar{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--text);padding-bottom:20px}.logo{font-weight:900;font-size:26px;letter-spacing:-1px}.bar span{font-size:12px;letter-spacing:1px}.stage{display:grid;grid-template-columns:1.08fr 1fr;gap:70px;align-items:center;padding-top:46px}.poster{position:relative;min-height:600px}.poster h1{font-size:96px;line-height:1.02;font-weight:950;letter-spacing:-7px;margin:20px 0 22px}.poster h1 span{display:inline-block;background:var(--text);color:var(--page);padding:0 14px 10px;transform:rotate(-4deg)}.poster p{max-width:300px;font-weight:600}.flower{position:absolute;bottom:50px;right:35px;width:175px;height:175px}.sticker{position:absolute;left:0;bottom:15px;border:2px solid var(--text);border-radius:50%;width:170px;height:88px;display:grid;place-items:center;font-size:14px;transform:rotate(-12deg)}.card{background:var(--surface);border:3px solid var(--text);box-shadow:10px 10px 0 var(--text);padding:34px 34px 28px;transform:rotate(1deg)}.card>*{transform:rotate(-1deg)}.card h2{font-size:29px;line-height:1.3;font-weight:850}.card p{color:var(--muted);font-size:13px}.field{margin:14px 0;font-weight:700;font-size:12px}.field input{display:block;margin-top:6px;width:100%;height:48px;padding:10px 12px;border:2px solid var(--text);background:var(--surface);border-radius:0}.primary{background:var(--text);color:var(--page);border:2px solid var(--text);width:100%;font-weight:800;padding:12px;margin-top:12px}.agree{display:flex;align-items:flex-start;gap:8px;font-size:11px;margin:18px 0}.agree input{margin-top:4px}.login-link{background:none;border:0;text-decoration:underline;font-weight:750}.card-bottom{border-top:1px solid var(--line);margin-top:24px;padding-top:13px;display:flex;justify-content:space-between;align-items:center;font-size:12px}.bigmark{font-size:70px;line-height:1.2;font-weight:900}.welcome-list{padding:0;list-style:none}.welcome-list li{border-bottom:1px solid var(--line);padding:14px 0}.error{color:var(--accent);font-weight:700}.footer{font-size:11px;margin-top:32px;display:flex;justify-content:space-between}@media(max-width:900px){.stage{gap:32px;grid-template-columns:1fr 1.1fr}.poster h1{font-size:70px;letter-spacing:-5px}.card{padding:24px}.flower{width:130px;right:0}.sticker{width:145px}}@media(max-width:620px){.stage{display:block;padding-top:20px}.poster{min-height:240px}.poster h1{font-size:58px}.poster p{max-width:210px}.flower{bottom:35px;right:0;width:110px}.sticker{display:none}.card{margin:12px 8px 0 0}.bar span{display:none}}</style></head><body><main class="wrap"><header class="bar"><div class="logo">✳ 花圃</div><span>让好奇生根 · 让邻里开花</span><b>社区 003</b></header><div class="stage"><section class="poster"><small>你的下一段好关系，从这里开始。</small><h1>别独自<br><span>发芽。</span></h1><p>交换一株绿植，认识一位邻居。<br>给日常，添一点新鲜事。</p><svg class="flower" viewBox="0 0 180 180" aria-hidden="true"><g fill="var(--soft)" stroke="var(--text)" stroke-width="3"><ellipse cx="90" cy="52" rx="28" ry="48"/><ellipse cx="90" cy="128" rx="28" ry="48"/><ellipse cx="52" cy="90" rx="48" ry="28"/><ellipse cx="128" cy="90" rx="48" ry="28"/><circle cx="90" cy="90" r="24" fill="var(--page)"/></g></svg><div class="sticker">免费加入<br>一起长点新东西</div></section><section class="card"><div id="signup"><small>领一张你的花圃通行证</small><h2>你好，新邻居。</h2><p>三个小空格，开启一种热闹的生活。</p><form id="signup-form"><label class="field">大家怎么称呼你<input id="nickname" autocomplete="nickname" maxlength="20" placeholder="例如：阳台上的阿青" required></label><label class="field">电子邮箱<input id="email" type="email" autocomplete="email" placeholder="you@example.com" required></label><label class="field">设置密码<input id="password" type="password" autocomplete="new-password" minlength="8" placeholder="至少 8 位字符" required></label><label class="agree"><input type="checkbox" id="agree" required><span>我愿意友善交流，尊重邻居的生活与隐私。</span></label><button class="primary">种下我的账号　↗</button></form><div class="card-bottom">已经在花圃？<button class="login-link" id="to-login">去登录 →</button></div></div><div id="login" hidden><small>老邻居，欢迎回家</small><h2>花圃见。</h2><form id="login-form"><label class="field">电子邮箱<input id="login-email" type="email" autocomplete="username" required></label><label class="field">密码<input id="login-password" type="password" autocomplete="current-password" minlength="8" required></label><button class="primary">登录花圃　→</button></form><button class="login-link" id="to-signup">我是新邻居，去注册</button></div><div id="welcome" hidden aria-live="polite"><div class="bigmark">✳</div><h2 id="welcome-title"></h2><p>你的花圃通行证已经准备好了。</p><ul class="welcome-list"><li>你的社区　滨江花圃</li><li>本周活动　周日的枝条交换</li><li>下一步　带一份好奇心来</li></ul><button class="primary" id="restart">返回入口</button></div></section></div><footer class="footer"><span>GROW SOMETHING TOGETHER.</span><span>© 2026 花圃社区</span></footer></main><script>
const $=s=>document.querySelector(s);function show(id){for(const s of ['signup','login','welcome'])$('#'+s).hidden=s!==id}$('#to-login').onclick=()=>{show('login');$('#login-email').focus()};$('#to-signup').onclick=()=>show('signup');$('#signup-form').onsubmit=e=>{e.preventDefault();if(!$('#nickname').value.trim())return $('#nickname').setCustomValidity('请填写称呼');$('#welcome-title').textContent=$('#nickname').value.trim()+'，生长愉快。';show('welcome')};$('#nickname').oninput=()=>$('#nickname').setCustomValidity('');$('#login-form').onsubmit=e=>{e.preventDefault();$('#welcome-title').textContent='欢迎回来，老邻居。';show('welcome')};$('#restart').onclick=()=>{show('signup');$('#password').value='';$('#login-password').value=''};
</script></body></html>
