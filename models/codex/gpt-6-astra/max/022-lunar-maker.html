<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>个人主页 · lunar-maker</title><style>*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.6}button,input,select,textarea{font:inherit}button,a,input,select,summary{touch-action:manipulation}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}button,a{color:inherit}button{transition:background .16s ease,color .16s ease,transform .16s ease}button:hover:not(:disabled){filter:brightness(.94)}:focus-visible{outline:3px solid var(--accent);outline-offset:4px}h1,h2,h3,p{margin:0}svg{max-width:100%;height:auto}button,select,input{min-height:40px}a{text-decoration:none}small{font-size:12px}button[aria-pressed=true]{font-weight:700}[hidden]{display:none!important}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}dialog{border:1px solid var(--line);padding:32px;max-width:min(580px,90vw);color:var(--text);background:var(--surface)}dialog::backdrop{background:#00000080}dialog .close{float:right}.status{min-height:24px}summary{cursor:pointer}input,select,textarea{max-width:100%}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

le{display:flex;justify-content:space-between;margin-top:12px;font-size:13px}.work small{font-size:10px;color:var(--muted)}.work:hover .work-title{text-decoration:underline}.footer{display:flex;justify-content:space-between;margin-top:32px;border-top:1px solid var(--line);padding:15px 0;font-size:11px;color:var(--muted)}dialog{border:2px solid var(--accent);background:var(--page)}dialog h2{font-size:30px;margin:12px 0}dialog p{margin:15px 0}dialog button{background:var(--accent);color:var(--page);border:0;padding:8px 18px}.email{font-family:Georgia,serif;font-size:25px;border-bottom:1px solid var(--line);padding:15px 0;word-break:break-all}.status{font-size:11px;color:var(--muted);margin-top:9px}@media(max-width:950px){.canvas{padding:24px}.hero{grid-template-columns:1.2fr 1fr;gap:25px}.name{font-size:65px;letter-spacing:-4px}.name span{font-size:66px;letter-spacing:-4px}.poster{max-height:370px}.bio{font-size:13px}.actions button{padding:9px 18px}.works{gap:16px}}@media(max-width:620px){.hero{display:block}.poster-wrap{margin:28px 20px 0}.poster{max-height:380px}.name{font-size:67px}.name span{font-size:74px}.nav span:last-child{display:none}.works{grid-template-columns:1fr}.work svg{height:230px}.footer span:last-child{display:none}}
</style></head><body><div class="canvas"><header class="nav"><div class="mark">月面造物 ↗</div><span>独立设计与视觉实验</span><span>上海　31°13′ N</span></header><main><section class="hero"><div class="identity"><div class="eyebrow">你好，地球朋友。</div><h1 class="name">我是江行。<span>Jiang Xing.</span></h1><p class="bio">一个在数字与纸张之间穿梭的独立设计师。<br>为有好奇心的品牌，创造有引力的视觉。</p><p class="availability">● 开放合作　／　品牌、艺术指导、出版</p><div class="actions"><button class="follow" id="follow" aria-pressed="false">关注江行　＋</button><button id="contact">聊聊项目 ↗</button></div><p class="status" id="follow-status" role="status">128 位同路人，感谢相遇。</p></div><div class="poster-wrap"><svg class="poster" viewBox="0 0 420 470" role="img" aria-label="月面造物轨道海报"><rect width="420" height="470" fill="#183DC4"/><circle cx="211" cy="228" r="109" fill="#F5F1E6"/><ellipse cx="211" cy="228" rx="195" ry="53" transform="rotate(-36 211 228)" fill="none" stroke="#E5CE78" stroke-width="3"/><ellipse cx="211" cy="228" rx="160" ry="55" transform="rotate(45 211 228)" fill="none" stroke="#D4A997" stroke-width="2"/><circle cx="324" cy="147" r="17" fill="#E5CE78"/><circle cx="157" cy="221" r="18" fill="#E9E2D2"/><circle cx="224" cy="278" r="26" fill="#E9E2D2"/><circle cx="248" cy="187" r="11" fill="#E9E2D2"/><text x="23" y="40" fill="#F5F1E6" font-size="12" letter-spacing="4">LUNAR / MAKER</text><text x="25" y="405" fill="#F5F1E6" font-size="49" font-family="Georgia,serif" letter-spacing="-3">STAY CURIOUS.</text><text x="27" y="436" fill="#F5F1E6" font-size="10" letter-spacing="3">越过日常的轨道，遇见新的可能。</text></svg><div class="caption"><span>视觉实验 No. 022</span><span>2026 ↗</span></div></div></section><section><div class="work-head"><h2>几件最近做的事</h2><span>SELECTED WORKS　01—03</span></div><div class="works"><button class="work" data-work="0"><svg viewBox="0 0 360 180" role="img" aria-label="潮间海报作品"><rect width="360" height="180" fill="#D4A997"/><path d="M0 107q60-76 120 0t120 0 120 0v73H0" fill="#183DC4"/><text x="27" y="72" fill="#F5F1E6" font-size="51" font-family=" let following=false;document.querySelector('#follow').onclick=()=>{following=!following;document.querySelector('#follow').setAttribute('aria-pressed',following);document.querySelector('#follow').textContent=following?'已关注　✓':'关注江行　＋';document.querySelector('#follow-status').textContent=following?'129 位同路人 · 已加入你的关注列表。':'128 位同路人，感谢相遇。'};const modal=document.querySelector('#profile-dialog');document.querySelector('#contact').onclick=()=>{document.querySelector('#dialog-content').innerHTML='<small>LET’S MAKE SOMETHING.</small><h2>把好点子，聊成好作品。</h2><p>欢迎品牌视觉、艺术指导与出版合作。请在邮件里简单介绍项目、预计时间与预算范围。</p><div class="email">hello@lunar-maker.example</div><p>上海 · 通常 2 个工作日内回复<br>这是展示用联系地址，暂无真实邮件投递。</p>';modal.showModal()};const works=[['潮间艺术节','把潮汐的循环转译成一套会呼吸的视觉：波形标志、双色海报与街道导视。','工作范围：品牌识别、海报、空间导视。'],['无用之书','一本关于闲散时刻的独立出版物。松弛的版面与紧密的书脊，让阅读在纸张之间慢下来。','工作范围：编辑设计、装帧、印刷指导。'],['二次生长','为再生材料工作室建立视觉语言。由两片叶子组成的标记，讲述旧材料的下一次生命。','工作范围：品牌策略、视觉识别、包装。']];document.querySelectorAll('[data-work]').forEach(b=>b.onclick=()=>{const w=works[b.dataset.work];document.querySelector('#dialog-content').innerHTML='<small>精选作品 / '+(+b.dataset.work+1)+'</small><h2>'+w[0]+'</h2><p>'+w[1]+'</p><p>'+w[2]+'</p>';modal.showModal()});document.querySelector('#close').onclick=()=>modal.close();
</script></body></html>
