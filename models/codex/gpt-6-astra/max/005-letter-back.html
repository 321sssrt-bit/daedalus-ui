<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>回邮 · 找回账户</title><style>*{box-sizing:border-box}body{margin:0;font:15px/1.6 "Segoe UI","Microsoft YaHei",sans-serif;color:var(--text);background:var(--page)}button,input,textarea,select{font:inherit}button{cursor:pointer;min-height:44px}button:hover{filter:brightness(.94)}button:active{transform:translateY(1px)}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}[hidden]{display:none!important}button,input,textarea,select{color:inherit}svg{max-width:100%}h1,h2,h3,p{margin-top:0}button{transition:filter .15s ease}input,textarea{min-width:0}a{color:inherit}label{display:block}small{font-size:12px}dialog{color:var(--text);border:1px solid var(--muted)}dialog::backdrop{background:rgba(0,0,0,.45)}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
 :root{--page:#e6e0d5;--surface:#fffaf0;--text:#243d49;--muted:#63767a;--accent:#b74035;--line:#c5bdae;--soft:#ead7bf}.desk{min-height:100vh;padding:68px 48px;display:grid;grid-template-columns:minmax(0,1fr);place-items:center}.envelope{width:1080px;max-width:100%;min-height:624px;background:var(--surface);position:relative;border:1px solid var(--line);box-shadow:0 18px 40px #243d4912;display:grid;grid-template-columns:47% 53%}.envelope:before{content:"";position:absolute;top:0;left:0;right:0;height:8px;background:repeating-linear-gradient(125deg,var(--accent) 0 20px,var(--surface) 20px 37px,var(--text) 37px 57px,var(--surface) 57px 74px)}.post{padding:48px 40px;border-right:1px dashed var(--line);position:relative}.logo{font-size:22px;letter-spacing:5px;font-weight:800}.stamp{position:absolute;right:30px;top:46px;border:2px dashed var(--accent);padding:12px 10px;color:var(--accent);font-size:11px;line-height:1.3;text-align:center;transform:rotate(8deg)}.post h1{font:400 62px/1.2 Georgia,"Songti SC",SimSun,serif;margin:75px 0 30px}.post p{max-width:295px;font-size:14px;color:var(--muted)}.address{margin-top:65px;font:13px/2 Consolas,monospace;color:var(--muted)}.form-side{padding:72px 54px 40px;display:flex;flex-direction:column}.number{font:12px Consolas,monospace;letter-spacing:3px;color:var(--accent);margin-bottom:22px}h2{font-size:27px;line-height:1.4;font-weight:600;margin-bottom:12px}.desc{color:var(--muted);font-size:13px}.field{font-size:12px;margin-top:30px}.field input{display:block;width:100%;height:52px;margin-top:8px;background:transparent;border:0;border-bottom:1px solid var(--text);padding:10px 0;border-radius:0}.primary{border:0;background:var(--accent);color:var(--surface);width:100%;padding:13px;margin-top:26px}.back{border:0;background:none;font-size:12px;align-self:flex-start;padding:0;margin-top:28px;text-decoration:underline;text-underline-offset:5px}.footer{margin-top:auto;padding-top:30px;font-size:11px;color:var(--muted)}.sent-icon{font:48px Georgia,serif;color:var(--accent);margin-bottom:20px}.address-label{display:block;overflow-wrap:anywhere;background:var(--soft);padding:14px;margin:22px 0;font:14px Consolas,monospace}.wait-note{padding:18px 0;border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);color:var(--muted);font-size:13px}.resend{background:none;border:1px solid var(--accent);color:var(--accent);padding:10px 18px;margin-top:20px}.status{font-size:12px;color:var(--accent);min-height:20px;margin-top:12px}@media(max-width:900px){.desk{padding:40px 28px}.post{padding:42px 28px}.form-side{padding:65px 30px 32px}.post h1{font-size:48px}.stamp{right:20px}}@media(max-width:620px){.desk{padding:20px}.envelope{display:block}.post{border-right:0;border-bottom:1px dashed var(--line)}.post h1{font-size:40px;margin:35px 0 12px}.address{display:none}.form-side{padding:32px}.stamp{top:32px}.post p{margin-bottom:0}}</style></head><body><main class="desk"><article class="envelope"><section class="post"><div class="logo">回邮</div><div class="stamp" aria-hidden="true">RETURN<br>TO YOU<br>✉</div><h1>总有一条路，<br>寄回你身边。</h1><p>密码可以忘记，属于你的文字不会。<br>给我们一个邮箱，让故事接着写。</p><div class="address">TO: THE STORYTELLER<br>FROM: LETTERBACK<br>邮程：约 1 分钟</div></section><section class="form-side"><div id="request"><div class="number">LETTER / 001</div><h2>找回你的回邮账户</h2><p class="desc">我们会向绑定邮箱寄出一封重设密码的邮件。</p><form id="reset-form"><label class="field">绑定的电子邮箱<input id="email" type="email" autocomplete="email" placeholder="your.name@example.com" required></label><button class="primary">寄出重设邮件　↗</button></form></div><div id="sent" hidden aria-live="polite"><div class="sent-icon">✉</div><h2>信已寄出，稍等片刻。</h2><p class="desc">请前往邮箱，打开“重设你的回邮密码”。</p><strong class="address-label" id="recipient"></strong><div class="wait-note">通常 1 分钟内送达。<br>没有看到？也请翻翻垃圾邮件文件夹。</div><button class="resend" id="resend">再次寄出</button><button class="back" id="change">修改邮箱</button><p class="status" id="status" role="status"></p></div><div id="login" hidden><div class="number">WELCOME HOME</div><h2>回到你的文字里</h2><form id="login-form"><label class="field">电子邮箱<input id="login-email" type="email" autocomplete="username" required></label><label class="field">密码<input id="password" type="password" minlength="6" autocomplete="current-password" required></label><button class="primary">登录回邮　→</button></form><p class="status" id="login-status" role="status"></p><button class="back" id="find-again">需要找回密码</button></div><button class="back" id="to-login">← 回到登录</button><footer class="footer">只寄你需要的信。<br>账户帮助 · 每天 09:00—21:00</footer></section></article></main><script>
const $=s=>document.querySelector(s);let timer;function show(id){for(const n of ['request','sent','login'])$('#'+n).hidden=n!==id;$('#to-login').hidden=id==='login';if(id==='login'){$('#login-form').hidden=false;$('#login-status').textContent='';$('#password').value=''}}function cooldown(){clearInterval(timer);let s=5;$('#resend').disabled=true;$('#resend').textContent=s+' 秒后可再次寄出';timer=setInterval(()=>{s--;$('#resend').textContent=s?s+' 秒后可再次寄出':'再次寄出';if(!s){clearInterval(timer);$('#resend').disabled=false}},1000)}$('#reset-form').onsubmit=e=>{e.preventDefault();$('#recipient').textContent=$('#email').value;$('#status').textContent='';show('sent');cooldown()};$('#resend').onclick=()=>{$('#status').textContent='已再次寄出，请以最新一封邮件为准。';cooldown()};$('#change').onclick=()=>show('request');$('#to-login').onclick=()=>{show('login');$('#login-email').value=$('#email').value};$('#find-again').onclick=()=>show('request');$('#login-form').onsubmit=e=>{e.preventDefault();$('#login-status').textContent='登录成功，你的私人信箱已打开。';$('#login-form').hidden=true};
</script></body></html>
