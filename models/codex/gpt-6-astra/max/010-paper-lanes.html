<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>纸带 · 把事情往前放</title><style>*{box-sizing:border-box}body{margin:0;font:15px/1.6 "Segoe UI","Microsoft YaHei",sans-serif;color:var(--text);background:var(--page)}button,input,textarea,select{font:inherit}button{cursor:pointer;min-height:44px}button:hover{filter:brightness(.94)}button:active{transform:translateY(1px)}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}[hidden]{display:none!important}button,input,textarea,select{color:inherit}svg{max-width:100%}h1,h2,h3,p{margin-top:0}button{transition:filter .15s ease}input,textarea{min-width:0}a{color:inherit}label{display:block}small{font-size:12px}dialog{color:var(--text);border:1px solid var(--muted)}dialog::backdrop{background:rgba(0,0,0,.45)}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
 :root{--page:#e9e5f3;--surface:#fffefa;--text:#292534;--muted:#6f677e;--accent:#674db4;--line:#c6bfd7;--soft:#d7ceef}.board{max-width:1240px;margin:auto;padding:32px 34px;min-height:800px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--text);padding-bottom:22px}.brand{font-size:24px;font-weight:850;letter-spacing:-1px}.team{font-size:11px;letter-spacing:2px}.head{display:flex;align-items:flex-end;justify-content:space-between;margin:33px 0 28px}.head h1{font-size:34px;line-height:1.25;font-weight:750;margin-bottom:10px;letter-spacing:-1px}.head p{font-size:13px;color:var(--muted);margin-bottom:0}.primary{border:1px solid var(--text);border-radius:0;background:var(--text);color:var(--surface);padding:11px 20px;font-size:13px;box-shadow:3px 3px 0 var(--accent)}.lanes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:25px}.lane{background:var(--soft);padding:16px;min-height:500px;border-top:4px solid var(--text)}.lane:nth-child(2){background:transparent;border-top-color:var(--accent)}.lane:nth-child(3){background:var(--surface);border-top-color:var(--muted)}.lane-header{display:flex;justify-content:space-between;align-items:center;margin:0 0 20px;font-size:14px}.lane-header b{font:13px Consolas,monospace;border:1px solid var(--line);padding:1px 7px}.card{position:relative;background:var(--surface);border:1px solid var(--line);padding:20px 18px 16px;margin:0 0 17px;box-shadow:0 3px 0 var(--line)}.lane:nth-child(3) .card{background:var(--page)}.card:before{content:"";position:absolute;width:54px;height:12px;left:calc(50% - 27px);top:-6px;background:var(--line);opacity:.65;transform:rotate(-3deg)}.card h3{font-size:16px;line-height:1.45;margin:10px 0;overflow-wrap:anywhere}.card p{font-size:12px;color:var(--muted);margin-bottom:18px;overflow-wrap:anywhere}.category{font-size:9px;letter-spacing:1px;color:var(--accent);font-weight:700}.card-foot{display:flex;justify-content:space-between;align-items:center;border-top:1px dashed var(--line);padding-top:12px;gap:8px}.person{font-size:10px;color:var(--muted)}.move{border:0;background:none;padding:0;font-size:11px;min-height:32px;text-decoration:underline;text-underline-offset:4px;color:var(--accent)}.status{font-size:11px;color:var(--muted);margin-top:20px;min-height:18px;overflow-wrap:anywhere}.dialog{width:440px;max-width:calc(100% - 40px);padding:30px;background:var(--surface);border:2px solid var(--text)}.dialog h2{font-size:25px}.field{font-size:12px;margin:18px 0}.field input,.field textarea{display:block;width:100%;padding:10px;margin-top:6px;background:var(--surface);border:1px solid var(--line);border-radius:0}.field textarea{height:100px;resize:vertical}.actions{display:flex;justify-content:flex-end;gap:12px}.cancel{background:none;border:1px solid var(--line);padding:10px 16px}@media(max-width:900px){.board{padding:28px}.lanes{gap:14px}.lane{padding:12px}.card{padding:18px 13px 13px}.card h3{font-size:15px}.head h1{font-size:30px}.card-foot{display:block}.move{display:block;margin-top:6px}}@media(max-width:620px){.board{padding:20px}.team{display:none}.head{display:block}.head .primary{margin-top:20px}.lanes{grid-template-columns:1fr}.lane{min-height:150px}.card-foot{display:flex}.move{margin-top:0}}</style></head><body><main class="board"><header class="top"><div class="brand">▰ 纸带</div><span class="team">小事工作室 / LITTLE THINGS STUDIO</span><small>秋季项目 · 2026</small></header><section class="head"><div><h1>把事情，一格格往前放。</h1><p>秋日刊物计划　/　小团队的大点子</p></div><button class="primary" id="new">＋ 贴一张新任务</button></section><section class="lanes" aria-label="任务看板"><section class="lane"><h2 class="lane-header">01 待开始 <b id="count-0">0</b></h2><div id="lane-0"></div></section><section class="lane"><h2 class="lane-header">02 正在做 <b id="count-1">0</b></h2><div id="lane-1"></div></section><section class="lane"><h2 class="lane-header">03 已完成 <b id="count-2">0</b></h2><div id="lane-2"></div></section></section><p class="status" id="status" role="status">不急，一次推进一件事。点击任务底部的操作即可移动。</p><dialog class="dialog" id="dialog" aria-labelledby="dialog-title"><h2 id="dialog-title">一个新点子，放在这里。</h2><form id="task-form"><label class="field">任务名称<input id="task-title" maxlength="60" required placeholder="这次，要完成什么？"></label><label class="field">补充说明<textarea id="task-description" maxlength="300" placeholder="留一句话给未来的自己"></textarea></label><div class="actions"><button class="cancel" id="cancel" type="button">取消</button><button class="primary">加入待开始</button></div></form></dialog></main><script>
const $=s=>document.querySelector(s);const tasks=[{title:'去河边采集秋天的颜色',description:'带上相机和色卡，找五种不重复的灰绿色。',category:'采集 / RESEARCH',person:'阿原 · 周一',state:0},{title:'写一段卷首的话',description:'关于慢下来的生活，控制在 300 字以内。',category:'文字 / EDITORIAL',person:'小满 · 周二',state:0},{title:'把封面留给一片叶子',description:'试试压印与单色，先做三种版式。',category:'设计 / DESIGN',person:'北北 · 今天',state:1},{title:'联系两家独立书店',description:'确认寄售数量，以及一场小小的分享会。',category:'联络 / COMMUNITY',person:'阿原 · 周三',state:1},{title:'确定这期的主题',description:'第 08 期：把日常重新看一遍。',category:'策划 / DIRECTION',person:'大家 · 已完成',state:2}];const labels=['待开始','正在做','已完成'];function render(){for(let s=0;s<3;s++){const list=tasks.filter(t=>t.state===s);$('#count-'+s).textContent=list.length;$('#lane-'+s).replaceChildren(...list.map(t=>{const c=document.createElement('article');c.className='card';const tag=document.createElement('span'),h=document.createElement('h3'),p=document.createElement('p'),f=document.createElement('div'),who=document.createElement('span'),b=document.createElement('button');tag.className='category';tag.textContent=t.category;h.textContent=t.title;p.textContent=t.description;f.className='card-foot';who.className='person';who.textContent=t.person;b.className='move';b.textContent=s===0?'开始做 →':s===1?'标记完成 ✓':'移回待开始 ↶';b.onclick=()=>{t.state=(t.state+1)%3;render();$('#status').textContent='“'+t.title+'”已移到'+labels[t.state]+'。'};f.append(who,b);c.append(tag,h,p,f);return c}))}}$('#new').onclick=()=>{$('#dialog').showModal();$('#task-title').focus()};$('#cancel').onclick=()=>$('#dialog').close();$('#task-form').onsubmit=e=>{e.preventDefault();const t=$('#task-title');if(!t.value.trim()){t.setCustomValidity('请写下任务名称');t.reportValidity();return}tasks.unshift({title:t.value.trim(),description:$('#task-description').value.trim()||'从一个小动作开始。',category:'新任务 / NEW',person:'我 · 刚刚',state:0});render();$('#status').textContent='新任务已加入待开始。';$('#task-form').reset();$('#dialog').close()};$('#task-title').oninput=()=>$('#task-title').setCustomValidity('');render();
</script></body></html>
