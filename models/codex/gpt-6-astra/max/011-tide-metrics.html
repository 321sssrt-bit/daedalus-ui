<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>潮汐电力 · 负荷观察</title><style>*{box-sizing:border-box}body{margin:0;font:15px/1.6 "Segoe UI","Microsoft YaHei",sans-serif;color:var(--text);background:var(--page)}button,input,textarea,select{font:inherit}button{cursor:pointer;min-height:44px}button:hover{filter:brightness(.94)}button:active{transform:translateY(1px)}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}[hidden]{display:none!important}button,input,textarea,select{color:inherit}svg{max-width:100%}h1,h2,h3,p{margin-top:0}button{transition:filter .15s ease}input,textarea{min-width:0}a{color:inherit}label{display:block}small{font-size:12px}dialog{color:var(--text);border:1px solid var(--muted)}dialog::backdrop{background:rgba(0,0,0,.45)}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
 :root{--page:#0e2025;--surface:#142c32;--text:#e2f4ef;--muted:#92b0b2;--accent:#68e3cb;--line:#315258;--soft:#244148}.monitor{max-width:1240px;margin:auto;padding:30px 40px;min-height:800px}.bar{display:flex;align-items:center;justify-content:space-between;padding-bottom:20px;border-bottom:1px solid var(--line)}.brand{font-size:21px;font-weight:600;letter-spacing:2px}.bar small{font:10px Consolas,monospace;letter-spacing:2px;color:var(--muted)}.title{display:flex;justify-content:space-between;align-items:flex-end;margin-top:34px}.title h1{font-size:30px;line-height:1.35;font-weight:500;margin:6px 0}.eyebrow{font:10px Consolas,monospace;letter-spacing:2px;color:var(--accent)}.switch{display:flex;border-bottom:1px solid var(--line);gap:4px}.switch button{border:0;background:none;color:var(--muted);padding:9px 17px;font-size:12px}.switch button[aria-pressed=true]{color:var(--accent);border-bottom:2px solid var(--accent)}.summary{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:28px;margin:30px 0 35px}.stat{border-left:1px solid var(--line);padding-left:25px}.stat:first-child{padding-left:0;border:0}.stat label{font-size:11px;color:var(--muted)}.stat strong{display:inline-block;font:38px/1.3 Consolas,monospace;font-weight:400;margin-top:8px}.stat small{color:var(--muted);margin-left:6px}.stat .positive{display:block;font-size:10px;color:var(--accent);margin-top:5px}.chart{background:var(--surface);padding:26px 24px 18px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.chart-head{display:flex;justify-content:space-between;align-items:center;font-size:12px}.legend{display:flex;gap:20px;color:var(--muted);font-size:10px}.legend span:before{content:"";display:inline-block;width:18px;border-top:2px solid var(--accent);margin:0 7px 3px 0}.legend span:last-child:before{border-color:var(--muted);border-top-style:dashed}.plot{width:100%;height:290px;display:block;margin-top:15px}.plot text{font:10px Consolas,monospace;fill:var(--muted)}.chart-foot{display:flex;justify-content:space-between;color:var(--muted);font-size:10px}.insights{display:grid;grid-template-columns:1.1fr 1fr;gap:48px;margin-top:30px}.insights h2{font-size:13px;font-weight:500;margin-bottom:10px}.insights p{font-size:12px;color:var(--muted);margin-bottom:0}.track{height:5px;background:var(--line);margin:16px 0 8px}.track span{height:100%;width:68%;display:block;background:var(--accent)}.row{display:flex;justify-content:space-between;font:11px Consolas,monospace;color:var(--muted)}.footer{font-size:10px;color:var(--muted);margin-top:28px}@media(max-width:900px){.monitor{padding:28px}.summary{gap:16px}.stat{padding-left:16px}.stat strong{font-size:29px}.stat small{font-size:10px}.chart{padding:22px 14px}.plot{height:265px}.insights{gap:25px}}@media(max-width:620px){.monitor{padding:20px}.bar small{display:none}.title{align-items:flex-start;gap:16px}.title h1{font-size:25px}.switch button{padding:8px 12px}.summary{grid-template-columns:1fr 1fr;gap:22px}.stat:nth-child(3){border:0;padding-left:0}.legend{gap:9px}.plot{height:230px}.insights{grid-template-columns:1fr}.chart-foot{display:block}}</style></head><body><main class="monitor"><header class="bar"><div class="brand">≈ 潮汐电力</div><small>ENERGY INTELLIGENCE / EAST COAST</small><small>● 数据在线</small></header><section class="title"><div><div class="eyebrow">GRID OBSERVATORY</div><h1>看见城市的呼吸。</h1></div><div class="switch" role="group" aria-label="时间粒度"><button id="day" aria-pressed="true">日</button><button id="week" aria-pressed="false">周</button></div></section><section class="summary" aria-label="关键电力数据"><article class="stat"><label id="total-label">今日用电量</label><div><strong id="total">48.6</strong><small>MWh</small></div><span class="positive" id="change">较昨日 −6.2%</span></article><article class="stat"><label>平均负荷</label><div><strong id="average">2.03</strong><small>MW</small></div><span class="positive">在计划范围内</span></article><article class="stat"><label>峰值负荷</label><div><strong id="peak">3.28</strong><small>MW</small></div><span class="positive" id="peak-time">出现在 14:00</span></article><article class="stat"><label>清洁能源占比</label><div><strong id="clean">68</strong><small>%</small></div><span class="positive" id="clean-change">较昨日 +4%</span></article></section><section class="chart"><div class="chart-head"><span id="chart-title">负荷曲线 · 09 月 05 日</span><div class="legend"><span>实际负荷</span><span>计划基线</span></div></div><svg class="plot" viewBox="0 0 1080 290" role="img" id="plot" aria-label="日负荷曲线，14 点达到峰值 3.28 兆瓦"><defs><linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".24"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs><g stroke="var(--line)" stroke-width="1"><path d="M45 30H1050M45 85H1050M45 140H1050M45 195H1050M45 250H1050"/></g><g><text x="0" y="34">4.0</text><text x="0" y="89">3.0</text><text x="0" y="144">2.0</text><text x="0" y="199">1.0</text><text x="0" y="254">0.0</text><text x="0" y="14">MW</text></g><path id="baseline" d="M45 161C220 178 280 155 400 139S580 87 700 116S880 145 1050 156" fill="none" stroke="var(--muted)" stroke-dasharray="6 7"/><path id="fill" fill="url(#area)"/><path id="curve" fill="none" stroke="var(--accent)" stroke-width="3"/><g id="axis"></g><circle id="peak-dot" cx="630" cy="70" r="5" fill="var(--accent)"/></svg><div class="chart-foot"><span id="chart-note" role="status">每 2 小时汇总一次 · 峰谷走势平稳</span><span>数据口径：园区总表 / 已扣除储能回送</span></div></section><section class="insights"><article><h2>调度观察</h2><p id="insight">午间光伏出力覆盖用电高峰，14:00 后负荷逐渐回落。建议保持当前储能放电安排。</p></article><article><h2>清洁能源覆盖</h2><div class="track"><span id="clean-bar"></span></div><div class="row"><span id="clean-label">当前 68%</span><span>季度目标 75%</span></div></article></section><footer class="footer">东岸园区　/　运营数据快照　/　上次更新 23:59</footer></main><script>
const $=s=>document.querySelector(s);const data={day:{total:'48.6',average:'2.03',peak:'3.28',clean:'68',change:'较昨日 −6.2%',time:'出现在 14:00',cleanChange:'较昨日 +4%',title:'负荷曲线 · 09 月 05 日',note:'每 2 小时汇总一次 · 峰谷走势平稳',labels:['00:00','04:00','08:00','12:00','16:00','20:00','24:00'],path:'M45 170C125 180 176 197 225 177S345 173 410 136S553 54 630 70S728 138 810 137S950 147 1050 187',base:'M45 161C220 178 280 155 400 139S580 87 700 116S880 145 1050 156',dot:[630,70],insight:'午间光伏出力覆盖用电高峰，14:00 后负荷逐渐回落。建议保持当前储能放电安排。'},week:{total:'342.8',average:'2.04',peak:'3.62',clean:'71',change:'较上周 −3.8%',time:'出现在 周三 13:00',cleanChange:'较上周 +7%',title:'负荷曲线 · 08 月 31 日—09 月 06 日',note:'每日平均负荷 · 周内用电节奏清晰',labels:['周一','周二','周三','周四','周五','周六','周日'],path:'M45 167C97 167 157 155 213 142S334 101 380 107S484 160 548 145S660 127 715 145S830 201 883 190S991 179 1050 179',base:'M45 152C190 140 280 130 380 136S535 148 650 151S870 166 1050 160',dot:[380,107],insight:'本周总用电较上周下降 3.8%，清洁能源覆盖提升至 71%。周末负荷下降，适合安排设备巡检。'}};function render(mode){let d=data[mode];for(const id of ['total','average','peak','clean','change'])$('#'+id).textContent=d[id];$('#total-label').textContent=mode==='day'?'今日用电量':'本周用电量';$('#peak-time').textContent=d.time;$('#clean-change').textContent=d.cleanChange;$('#chart-title').textContent=d.title;$('#chart-note').textContent=d.note;$('#insight').textContent=d.insight;$('#curve').setAttribute('d',d.path);$('#fill').setAttribute('d',d.path+'L1050 250H45Z');$('#baseline').setAttribute('d',d.base);$('#peak-dot').setAttribute('cx',d.dot[0]);$('#peak-dot').setAttribute('cy',d.dot[1]);$('#axis').innerHTML=d.labels.map((l,i)=>'<text x="'+(45+i*167.5)+'" y="277" text-anchor="middle">'+l+'</text>').join('');$('#plot').setAttribute('aria-label',d.title+'，峰值 '+d.peak+' 兆瓦，'+d.time);$('#clean-bar').style.width=d.clean+'%';$('#clean-label').textContent='当前 '+d.clean+'%';$('#day').setAttribute('aria-pressed',mode==='day');$('#week').setAttribute('aria-pressed',mode==='week')}$('#day').onclick=()=>render('day');$('#week').onclick=()=>render('week');render('day');
</script></body></html>
