<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>杏子里 · 有空来坐坐</title><style>
*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button,a,input,select,textarea{-webkit-tap-highlight-color:transparent}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:4px}[hidden]{display:none!important}svg{max-width:100%}button{transition:filter 140ms ease}button:hover:not(:disabled){filter:brightness(.93)}

:root{--page:#eadccd;--surface:#fffaf2;--text:#613b2b;--muted:#927765;--accent:#b95327;--apricot:#f3b477;--line:#eadbca;--soft:#f6ecda;--error:#ad392c}body{padding:32px;background:var(--page);color:var(--text);font:14px/1.6 "Segoe UI","Microsoft YaHei",sans-serif}.phone{width:390px;min-height:844px;margin:auto;background:var(--surface);border-radius:30px;overflow:hidden;box-shadow:0 16px 50px #613b2b24;display:flex;flex-direction:column}.status{display:flex;justify-content:space-between;padding:14px 23px 3px;font-size:10px}header{display:flex;align-items:center;justify-content:space-between;padding:17px 23px 13px}.wordmark{font:29px Georgia,"SimSun",serif}.flower{font-size:32px;color:var(--accent)}.hello{margin:5px 23px 18px}.hello h1{font:31px/1.3 Georgia,"SimSun",serif;margin:8px 0}.tiny{font-size:11px;color:var(--muted)}.tabs{display:flex;gap:24px;border-bottom:1px solid var(--line);padding:0 23px;margin-bottom:5px}.tabs button{background:none;color:var(--muted);border:0;border-bottom:3px solid transparent;padding:11px 0;font-size:13px}.tabs button[aria-pressed=true]{color:var(--accent);border-color:var(--accent)}.feed{padding:0 20px 15px}.post{padding:21px 0;border-bottom:1px solid var(--line)}.person{display:flex;align-items:center;gap:11px}.avatar{height:37px;width:37px;border-radius:13px;background:var(--soft);display:grid;place-items:center;font-size:19px}.person b{font-size:13px}.person small{display:block;font-size:10px;color:var(--muted)}.post p{margin:13px 0;line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere}.art{height:175px;background:#e5ead6;border-radius:12px;overflow:hidden;display:grid;place-items:center}.art svg{height:175px}.post-actions{display:flex;justify-content:space-between;align-items:center;margin-top:10px}.like{background:none;border:0;padding:5px 0;color:var(--muted);font-size:12px}.like[aria-pressed=true]{color:var(--accent)}.nav{margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding:15px 23px 20px;background:var(--surface);border-top:1px solid var(--line)}.nav button{background:none;border:0;color:var(--muted);font-size:12px;padding:8px}.nav .write{background:var(--accent);color:var(--surface);border-radius:50%;height:48px;width:48px;font-size:27px;padding:0;box-shadow:0 4px 0 #e7bea0}.composer{padding:10px 23px 28px;flex:1}.back{border:0;background:transparent;color:var(--text);font-size:13px;padding:8px 0}.composer h1{font:30px/1.4 Georgia,"SimSun",serif;margin:24px 0 15px}.label{font-size:12px;display:block;color:var(--muted);margin:16px 0 8px}textarea{width:100%;height:215px;resize:vertical;min-height:150px;border:1px solid var(--line);border-radius:15px;background:#fffef9;color:var(--text);padding:17px;font-size:16px;line-height:1.8}select{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--text)}.count{text-align:right;font-size:10px;color:var(--muted);margin-top:5px}.primary{width:100%;padding:15px;border:0;border-radius:30px;background:var(--accent);color:var(--surface);font-weight:600;margin-top:24px}.demo{background:none;border:0;text-decoration:underline;color:var(--muted);padding:17px 0;font-size:11px}.demo[aria-pressed=true]{color:var(--error)}.error{padding:14px;background:#fae0d8;border-radius:12px;color:var(--error);font-size:12px;margin-top:14px}.notice{margin:12px 20px;padding:12px 14px;border-radius:12px;background:var(--soft);font-size:12px;color:var(--accent)}.empty{padding:50px 0;text-align:center;color:var(--muted)}@media(max-width:600px){body{padding:0;background:var(--surface)}.phone{width:100%;min-height:100dvh;border-radius:0;box-shadow:none}}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style></head><body>
<main class="phone"><div class="status"><span>9:41</span><span>●● ▰</span></div><header><div class="wordmark">杏子里</div><span class="flower" aria-hidden="true">✳</span></header>
<section id="community"><div class="hello"><span class="tiny">邻里之间 / 09月05日</span><h1>有空，来坐坐。</h1></div><div class="tabs" aria-label="动态范围"><button id="allTab" aria-pressed="true">街坊的新鲜事</button><button id="mineTab" aria-pressed="false">我的小日常</button></div><div id="publishedNotice" class="notice" role="status" hidden></div><div id="feed" class="feed"></div></section>
<section id="composer" class="composer" hidden><button class="back" id="back">← 带着草稿回去</button><h1>今天有什么，<br>想和大家说说？</h1><label class="label" for="draft">写下你的小日常</label><textarea id="draft" maxlength="500" placeholder="比如，窗台上的花终于开了。"></textarea><div class="count"><span id="count">0</span> / 500</div><label class="label" for="audience">谁可以看到</label><select id="audience"><option value="街坊可见">街坊可见 · 分享给邻里</option><option value="朋友可见">朋友可见 · 熟悉的人</option><option value="仅自己">仅自己 · 留给自己的记录</option></select><div id="publishError" class="error" role="alert" hidden></div><button class="primary" id="publish" disabled>把日常分享出去</button><button class="demo" id="failPublish" aria-pressed="false">体验异常：让这次发布失败</button><p class="tiny">离线社区体验，内容只保留在当前页面。</p></section>
<nav id="navigation" class="nav" aria-label="社区导航"><button id="neighborhood">⌂ 邻里</button><button class="write" id="write" aria-label="写一条新动态">＋</button><button id="mine">◡ 我的</button></nav></main>
<script>
'use strict';
const $=id=>document.getElementById(id);

let posts=[{name:'阿木',initial:'木',time:'12分钟前',scope:'街坊可见',text:'花店门口的向日葵，今天开得特别好。\n路过的时候，送你一朵好心情。',art:true,likes:18,liked:false,mine:false},{name:'三楼的乔乔',initial:'乔',time:'38分钟前',scope:'街坊可见',text:'烤了一盘柠檬饼干，香气跑满了整个屋子。有人想尝尝吗？',likes:7,liked:false,mine:false}];let onlyMine=false,fail=false;
const flowerArt='<svg viewBox="0 0 330 175" aria-label="一束向日葵插画" role="img"><path d="M148 154L124 50M168 150L203 49M168 153L166 83" stroke="#63814d" stroke-width="5"/><path d="M148 124Q92 91 111 140M180 116Q231 84 214 135" fill="#91a270"/><g fill="#f3b477"><circle cx="118" cy="38" r="20"/><circle cx="102" cy="58" r="20"/><circle cx="130" cy="71" r="20"/><circle cx="144" cy="47" r="20"/><circle cx="194" cy="29" r="19"/><circle cx="180" cy="50" r="19"/><circle cx="206" cy="64" r="19"/><circle cx="224" cy="41" r="19"/></g><circle cx="123" cy="53" r="17" fill="#613b2b"/><circle cx="202" cy="44" r="17" fill="#613b2b"/><path d="M126 128L143 174H190L207 128Z" fill="#b95327"/><path d="M138 139L150 169M158 137L163 170" stroke="#e5aa80" stroke-width="3"/></svg>';
function render(){$('feed').replaceChildren();const visible=posts.filter(p=>!onlyMine||p.mine);if(!visible.length){const e=document.createElement('p');e.className='empty';e.textContent='你的第一条日常，还没写下。';$('feed').append(e)}visible.forEach(p=>{const article=document.createElement('article');article.className='post';const person=document.createElement('div');person.className='person';person.innerHTML='<span class="avatar"></span><div><b></b><small></small></div>';person.querySelector('.avatar').textContent=p.initial;person.querySelector('b').textContent=p.name;person.querySelector('small').textContent=p.time+' · '+p.scope;article.append(person);const content=document.createElement('p');content.textContent=p.text;article.append(content);if(p.art){const art=document.createElement('div');art.className='art';art.innerHTML=flowerArt;article.append(art)}const actions=document.createElement('div');actions.className='post-actions';const like=document.createElement('button');like.className='like';like.setAttribute('aria-pressed',p.liked);like.textContent=(p.liked?'♥':'♡')+' '+p.likes+' 份好心情';like.onclick=()=>{p.liked=!p.liked;p.likes+=p.liked?1:-1;render()};actions.append(like);const scope=document.createElement('span');scope.className='tiny';scope.textContent=p.scope==='仅自己'?'仅你自己可见':'杏子里';actions.append(scope);article.append(actions);$('feed').append(article)});$('allTab').setAttribute('aria-pressed',!onlyMine);$('mineTab').setAttribute('aria-pressed',onlyMine)}
function showFeed(mine=false){onlyMine=mine;$('community').hidden=false;$('composer').hidden=true;$('navigation').hidden=false;render();window.scrollTo(0,0)}
$('write').onclick=()=>{$('community').hidden=true;$('composer').hidden=false;$('navigation').hidden=true;$('publishedNotice').hidden=true;window.scrollTo(0,0)};$('back').onclick=()=>showFeed();
$('draft').oninput=()=>{$('count').textContent=$('draft').value.length;$('publish').disabled=!$('draft').value.trim()};
$('failPublish').onclick=()=>{fail=!fail;$('failPublish').setAttribute('aria-pressed',fail);$('failPublish').textContent=fail?'本次会断线 · 点击可取消':'体验异常：让这次发布失败'};
$('publish').onclick=()=>{const text=$('draft').value;if(!text.trim())return;if(fail){fail=false;$('failPublish').setAttribute('aria-pressed','false');$('failPublish').textContent='体验异常：让这次发布失败';$('publishError').hidden=false;$('publishError').textContent='刚才连接中断，发布没有完成。文字和可见范围都已保留。连接已恢复，可以重试。';$('publish').textContent='重试发布';return}const scope=$('audience').value;posts.unshift({name:'你',initial:'我',time:'刚刚',scope,text,likes:0,liked:false,mine:true});$('draft').value='';$('count').textContent='0';$('publish').disabled=true;$('publish').textContent='把日常分享出去';$('publishError').hidden=true;$('publishedNotice').textContent='日常已发布 · '+scope;$('publishedNotice').hidden=false;showFeed(false)};
$('allTab').onclick=()=>showFeed(false);$('mineTab').onclick=()=>showFeed(true);$('neighborhood').onclick=()=>showFeed(false);$('mine').onclick=()=>showFeed(true);render();

</script></body></html>
