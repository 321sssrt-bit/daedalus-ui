<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>账号设置 · quiet-account</title><style>*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.6}button,input,select,textarea{font:inherit}button,a,input,select,summary{touch-action:manipulation}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}button,a{color:inherit}button{transition:background .16s ease,color .16s ease,transform .16s ease}button:hover:not(:disabled){filter:brightness(.94)}:focus-visible{outline:3px solid var(--accent);outline-offset:4px}h1,h2,h3,p{margin:0}svg{max-width:100%;height:auto}button,select,input{min-height:40px}a{text-decoration:none}small{font-size:12px}button[aria-pressed=true]{font-weight:700}[hidden]{display:none!important}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}dialog{border:1px solid var(--line);padding:32px;max-width:min(580px,90vw);color:var(--text);background:var(--surface)}dialog::backdrop{background:#00000080}dialog .close{float:right}.status{min-height:24px}summary{cursor:pointer}input,select,textarea{max-width:100%}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

:root{--page:#F5F5F1;--surface:#FFFFFF;--text:#31362F;--muted:#898D82;--accent:#527060;--line:#DDDFD6;--sage:#EAF0E9;--error:#AD574A;--stone:#C5C8BA}body{background:var(--page);color:var(--text)}.app{max-width:1160px;margin:auto;padding:27px 44px}.header{display:flex;justify-content:space-between;align-items:center;padding-bottom:23px;border-bottom:1px solid var(--line)}.logo{font-size:19px;font-weight:600;letter-spacing:6px}.logo i{display:inline-block;width:15px;height:20px;border:1px solid var(--text);margin-right:12px;vertical-align:-3px;border-radius:9px 9px 0 0}.header small{color:var(--muted);font-size:11px}.layout{display:grid;grid-template-columns:185px 1fr;gap:76px;margin-top:40px}.side p{font-size:10px;letter-spacing:2px;color:var(--muted);margin-bottom:17px}.section-nav{display:flex;flex-direction:column;gap:5px}.section-nav button{border:0;background:transparent;padding:10px 13px;text-align:left;color:var(--muted);font-size:13px;display:flex;justify-content:space-between}.section-nav button[aria-pressed=true]{background:var(--sage);color:var(--text);border-left:2px solid var(--accent)}.side .note{border-top:1px solid var(--line);margin-top:45px;padding-top:18px;font-size:11px;line-height:1.9;color:var(--muted)}.main{max-width:654px;min-width:0}.identity>div{min-width:0}.identity h2,.identity p{overflow-wrap:anywhere}.identity .avatar,.identity .member{flex-shrink:0}.main h1{font-size:31px;font-weight:500;line-height:1.4;letter-spacing:-1px}.lead{color:var(--muted);font-size:12px;margin-top:9px}.identity{display:flex;gap:16px;align-items:center;margin:30px 0;padding-bottom:27px;border-bottom:1px solid var(--line)}.avatar{width:56px;height:56px;border-radius:50%;background:var(--sage);display:grid;place-items:center;font-family:Georgia,"SimSun",serif;font-size:24px;color:var(--accent)}.identity h2{font-size:17px;font-weight:500}.identity p{font-size:11px;color:var(--muted);margin-top:3px}.identity .member{margin-left:auto;color:var(--muted);font-size:10px;border:1px solid var(--line);padding:3px 8px;border-radius:4px}.group{background:var(--surface);border:1px solid var(--line);margin-bottom:13px;border-radius:6px;overflow:hidden}.group summary{list-style:none;padding:18px 20px;display:flex;justify-content:space-between;align-items:center}.group summary::-webkit-details-marker{display:none}.group summary h2{font-size:14px;font-weight:500}.group summary p{font-size:11px;color:var(--muted);margin-top:2px}.chev{font-size:18px;color:var(--muted)}.group[open] .chev{transform:rotate(90deg)}.detail{border-top:1px solid var(--line);padding:20px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:6px}.field input,.field textarea{width:100%;border:1px solid var(--line);background:var(--surface);padding:9px 11px;border-radius:3px;font-size:13px;color:var(--text)}.full{grid-column:1/-1}.field textarea{resize:vertical;min-height:70px}.row-setting{display:flex;justify-content:space-between;align-items:center;gap:18px;padding:7px 0}.row-setting+.row-setting{border-top:1px solid var(--line);margin-top:12px;padding-top:17px}.row-setting b{font-size:13px;font-weight:500}.row-setting small{display:block;color:var(--muted);font-size:11px;margin-top:4px}.toggle{accent-color:var(--accent);width:18px;height:18px;min-height:18px;flex:0 0 18px;cursor:pointer}.save-bar{display:flex;justify-content:space-between;align-items:center;gap:20px;padding-top:12px}.save{background:var(--text);color:var(--surface);border:0;border-radius:5px;padding:9px 21px}.status{font-size:11px;color:var(--accent)}.error{color:var(--error)}.footer{color:var(--muted);font-size:10px;margin-top:35px;padding-top:17px;border-top:1px solid var(--line)}@media(max-width:900px){.app{padding:24px}.layout{grid-template-columns:150px 1fr;gap:36px}.main h1{font-size:29px}.group summary{padding:16px}.detail{padding:17px}.fields{gap:12px}}@media(max-width:600px){.layout{display:block;margin-top:25px}.side .note,.side p{display:none}.section-nav{flex-direction:row;margin-bottom:28px}.section-nav button{padding:8px 12px}.section-nav button span{display:none}.fields{grid-template-columns:1fr}.header small{display:none}.identity .member{display:none}.save-bar{align-items:start}}
</style></head><body><div class="app"><header class="header"><div class="logo"><i aria-hidden="true"></i>静室</div><small>给专注一点空间。</small><span style="font-size:12px">个人空间　／　设置</span></header><div class="layout"><aside class="side"><p>账号与偏好</p><nav class="section-nav" aria-label="设置分组"><button data-section="profile" aria-pressed="true">个人资料 <span>01</span></button><button data-section="security" aria-pressed="false">安全与登录 <span>02</span></button><button data-section="notifications" aria-pressed="false">通知偏好 <span>03</span></button></nav><div class="note">你的空间，<br>按你的方式来。<br><br>设置只在保存后生效。</div></aside><main class="main"><h1>账号设置</h1><p class="lead">管理个人资料，以及与你有关的每一次提醒。</p><section class="identity"><div class="avatar" id="initial">林</div><div><h2 id="identity-name">林亦</h2><p id="identity-email">lin.yi@example.com</p></div><span class="member">个人会员</span></section><form id="settings-form"><details class="group" id="profile" open><summary><div><h2>个人资料</h2><p>让大家知道该怎样称呼你</p></div><span class="chev">›</span></summary><div class="detail fields"><div class="field"><label for="name">显示名称</label><input id="name" name="name" value="林亦" required maxlength="30"></div><div class="field"><label for="email">电子邮箱</label><input id="email" name="email" type="email" value="lin.yi@example.com" required></div><div class="field full"><label for="bio">一句介绍</label><textarea id="bio" name="bio" maxlength="120">读书，散步，慢慢完成喜欢的事。</textarea></div></div></details><details class="group" id="security"><summary><div><h2>安全与登录</h2><p id="security-summary">已开启两步验证</p></div><span class="chev">›</span></summary><div class="detail"><label class="row-setting"><span><b>两步验证</b><small>登录时多一次确认，保护你的空间。</small></span><input class="toggle" id="twofactor" type="checkbox" checked></label><div class="row-setting"><span><b>最近登录设备</b><small>Windows · 北京 · 今天 09:24</small></span><small>当前设备</small></div></div></details><details class="group" id="notifications"><summary><div><h2>通知偏好</h2><p id="notifications-summary">重要提及与每周摘要</p></div><span class="chev">›</span></summary><div class="detail"><label class="row-setting"><span><b>有人提到我</b><small>在评论或协作中被提及时提醒我。</small></span><input class="toggle" id="mentions" type="checkbox" checked></label><label class="row-setting"><span><b>每周摘要</b><small>每周一，用一封邮件回顾进展。</small></span><input class="toggle" id="digest" type="checkbox" checked></label></div></details><div class="save-bar"><p class="status" id="save-status" role="status">所有设置已是最新。</p><button class="save" id="save">保存更改</button></div></form><footer class="footer">静室账号　·　数据保留于当前页面</footer></main></div></div><script>
const form=document.querySelector('#settings-form'),status=document.querySelector('#save-status');document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-section]').forEach(x=>x.setAttribute('aria-pressed',x===b));const section=document.getElementById(b.dataset.section);section.open=true;section.querySelector('summary').focus()});const nameField=document.querySelector('#name');nameField.addEventListener('input',()=>nameField.setCustomValidity(''));form.addEventListener('input',()=>{status.textContent='有尚未保存的更改。';status.classList.remove('error')});form.noValidate=true;form.onsubmit=e=>{e.preventDefault();nameField.setCustomValidity(nameField.value.trim()?'':'显示名称不能只包含空格。');if(!form.checkValidity()){document.querySelector('#profile').open=true;status.textContent='请填写有效的名称与邮箱。';status.classList.add('error');form.reportValidity();return}document.querySelector('#identity-name').textContent=nameField.value.trim();document.querySelector('#identity-email').textContent=document.querySelector('#email').value;document.querySelector('#initial').textContent=document.querySelector('#name').value.trim().slice(0,1)||'静';document.querySelector('#security-summary').textContent=document.querySelector('#twofactor').checked?'已开启两步验证':'两步验证已关闭';const m=document.querySelector('#mentions').checked,d=document.querySelector('#digest').checked;document.querySelector('#notifications-summary').textContent=m&&d?'重要提及与每周摘要':m?'仅重要提及':d?'仅每周摘要':'已关闭所有提醒';status.textContent='已保存。个人资料、安全与通知偏好已更新。';status.classList.remove('error')};
</script></body></html>
