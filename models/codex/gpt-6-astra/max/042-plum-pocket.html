<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>梅子 · 把心意转给你</title><style>
*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button,a,input,select,textarea{-webkit-tap-highlight-color:transparent}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:4px}[hidden]{display:none!important}svg{max-width:100%}button{transition:filter 140ms ease}button:hover:not(:disabled){filter:brightness(.93)}

:root{--page:#ece5e6;--surface:#fff8f2;--text:#47202e;--muted:#866977;--accent:#a13e64;--rose:#e8a9b9;--line:#e7d6d9;--error:#b53639}body{background:var(--page);font:15px/1.55 "Segoe UI","Microsoft YaHei",sans-serif;color:var(--text);padding:32px}.phone{width:390px;min-height:844px;margin:auto;background:var(--surface);border-radius:36px;overflow:hidden;box-shadow:0 18px 55px #47202e20;display:flex;flex-direction:column}.status{display:flex;justify-content:space-between;padding:15px 25px 2px;font-size:11px;font-weight:700}.top{display:flex;justify-content:space-between;align-items:center;padding:15px 23px}.brand{font:25px Georgia,"SimSun",serif;letter-spacing:3px}.tiny{font-size:11px;color:var(--muted)}button{color:var(--text)}.icon{border:0;background:transparent;font-size:19px;padding:4px 8px}.balance{margin:7px 22px 28px;padding:25px 24px 20px;border-radius:25px;background:var(--text);color:var(--surface);position:relative;overflow:hidden}.balance:after{content:"";position:absolute;right:-25px;top:32px;width:136px;height:136px;border:1px solid #e8a9b955;border-radius:50%;box-shadow:0 0 0 23px #e8a9b911,0 0 0 46px #e8a9b90a}.balance label{font-size:12px;color:var(--rose)}.balance strong{display:block;font-size:39px;line-height:1.25;font-weight:500;letter-spacing:-1px;margin:13px 0 23px}.balance p{font-size:11px;margin:0;color:var(--rose)}.content{padding:0 22px 24px}.section-title{display:flex;justify-content:space-between;align-items:center;margin:5px 0 12px}h1{font:29px/1.3 Georgia,"SimSun",serif;margin:12px 0 8px}h2{font-size:16px;margin:0}.recipient{display:flex;align-items:center;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:17px 0;text-align:left;gap:14px}.avatar{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font:21px Georgia,"SimSun",serif;background:#f0d6c6}.avatar.blue{background:#d7dfe8;color:#44536b}.avatar.rose{background:#f0d3dc}.person{flex:1}.person strong{display:block;font-weight:600}.person small{color:var(--muted);font-size:11px}.recipient .arrow{color:var(--accent)}.safe{display:flex;gap:12px;background:#f1e8e6;border-radius:15px;margin-top:25px;padding:15px;font-size:12px;color:var(--muted)}.bottom{margin-top:auto;display:flex;border-top:1px solid var(--line);padding:14px 25px 20px;gap:50px;justify-content:center}.bottom button{background:none;border:0;padding:8px;font-size:12px}.bottom button.active{color:var(--accent);font-weight:700}.chosen{display:flex;align-items:center;gap:12px;padding:20px 0;border-bottom:1px solid var(--line)}.amount-label{display:block;font-size:12px;color:var(--muted);margin-top:26px}.money-input{display:flex;gap:8px;align-items:center;border-bottom:2px solid var(--text);padding:13px 0}.money-input span{font-size:27px}input{width:100%;min-width:0;font-size:42px;line-height:1.2;border:0;background:transparent;color:var(--text);outline-offset:8px}input::placeholder{color:#bba6ac}.primary{background:var(--text);color:var(--surface);border:0;border-radius:17px;padding:16px;width:100%;margin-top:25px;font-weight:600}.secondary{background:transparent;border:1px solid var(--line);border-radius:17px;padding:14px;width:100%;margin-top:10px}.demo{border:0;background:transparent;color:var(--muted);font-size:11px;text-decoration:underline;padding:18px 0}.error{background:#f9e0de;border-radius:14px;padding:16px;font-size:13px;color:var(--error);margin-top:16px}.review-amount{font-size:45px;letter-spacing:-1px;margin:28px 0 20px}.details{border-top:1px solid var(--line);padding-top:17px;display:grid;grid-template-columns:90px 1fr;gap:19px;font-size:13px}.details dt{color:var(--muted)}.details dd{margin:0;text-align:right;overflow-wrap:anywhere}.seal{margin:26px auto 12px;width:85px;height:85px;border-radius:50%;background:var(--rose);display:grid;place-items:center;font-size:38px}.center{text-align:center}.receipt-title{font:26px Georgia,"SimSun",serif}.records{padding:16px 0;border-bottom:1px solid var(--line)}@media(max-width:600px){body{padding:0;background:var(--surface)}.phone{width:100%;min-height:100dvh;border-radius:0;box-shadow:none}}@media(min-width:601px){.phone{border:1px solid var(--line)}}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style></head><body>
<main class="phone"><div class="status"><span>9:41</span><span>●●● ▰</span></div><header class="top"><button id="back" class="icon" aria-label="返回钱包" hidden>‹</button><div class="brand">梅子</div><span class="tiny">演示钱夹</span></header>
<section id="home"><div class="balance"><label>随时可用 · 人民币</label><strong id="balance">¥1,268.50</strong><p>给重要的人，一点刚好的心意。 ↗</p></div><div class="content"><div class="section-title"><h2>转给谁</h2><span class="tiny">常用收款人</span></div><button class="recipient" data-person="0"><span class="avatar">林</span><span class="person"><strong>林小满</strong><small>尾号 0638 · 家人</small></span><span class="arrow">↗</span></button><button class="recipient" data-person="1"><span class="avatar blue">陈</span><span class="person"><strong>陈一舟</strong><small>尾号 4821 · 朋友</small></span><span class="arrow">↗</span></button><button class="recipient" data-person="2"><span class="avatar rose">许</span><span class="person"><strong>许念</strong><small>尾号 7912 · 同事</small></span><span class="arrow">↗</span></button><div class="safe"><span>◇</span><span>每一笔心意，都先核对。<br>此演示账户不会划转真实资金。</span></div></div></section>
<section id="amount" class="content" hidden><div class="tiny">01 / 填写金额</div><h1>给你，一点心意。</h1><div class="chosen"><span class="avatar" id="initial">林</span><div class="person"><strong id="recipientName"></strong><small id="recipientAccount"></small></div></div><label class="amount-label" for="value">转账金额（元）</label><div class="money-input"><span>¥</span><input id="value" inputmode="decimal" placeholder="0.00" autocomplete="off" aria-describedby="available amountError"></div><p id="available" class="tiny"></p><div id="amountError" class="error" role="alert" hidden></div><button id="next" class="primary">核对这笔转账 →</button><button class="demo" id="tooMuch">体验余额不足：填入 ¥1,500</button></section>
<section id="review" class="content" hidden><div class="tiny">02 / 最后核对</div><h1>确认后，心意就送达。</h1><div class="review-amount" id="reviewAmount"></div><dl class="details"><dt>收款人</dt><dd id="reviewPerson"></dd><dt>收款账号</dt><dd id="reviewAccount"></dd><dt>付款来源</dt><dd>梅子余额</dd><dt>手续费</dt><dd>¥0.00</dd></dl><div id="fundsError" class="error" role="alert" hidden></div><button class="primary" id="confirm">确认转账</button><button class="secondary" id="edit">修改金额</button><p class="tiny center">本地体验，不会产生真实转账。</p></section>
<section id="receipt" class="content" hidden><div class="seal">✓</div><h1 class="receipt-title center">心意，已经送达。</h1><p class="tiny center">演示转账成功</p><div id="receiptAmount" class="review-amount center"></div><dl class="details"><dt>收款人</dt><dd id="receiptPerson"></dd><dt>凭证编号</dt><dd id="receiptId"></dd><dt>转账时间</dt><dd id="receiptTime"></dd><dt>剩余余额</dt><dd id="receiptBalance"></dd></dl><button class="primary" id="done">完成，回到钱夹</button></section>
<section id="history" class="content" hidden><h1>每一笔，都记得。</h1><div id="historyList" class="tiny">还没有转账凭证。</div></section><nav class="bottom" aria-label="钱包导航"><button id="homeTab" class="active">◒ 钱夹</button><button id="historyTab">▤ 凭证</button></nav></main>
<script>
'use strict';
const $=id=>document.getElementById(id);

const people=[{name:'林小满',account:'尾号 0638'},{name:'陈一舟',account:'尾号 4821'},{name:'许念',account:'尾号 7912'}];let balance=126850,person=0,pending=0,records=[];
const money=n=>'¥'+(n/100).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
function show(id){['home','amount','review','receipt','history'].forEach(x=>$(x).hidden=x!==id);$('back').hidden=id==='home';$('homeTab').classList.toggle('active',id!=='history');$('historyTab').classList.toggle('active',id==='history');window.scrollTo(0,0)}
function refresh(){$('balance').textContent=money(balance);$('available').textContent='余额可用 '+money(balance)+' · 无手续费'}
document.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>{person=Number(b.dataset.person);$('recipientName').textContent=people[person].name;$('initial').textContent=people[person].name[0];$('recipientAccount').textContent=people[person].account;$('value').value='';$('amountError').hidden=true;$('fundsError').hidden=true;refresh();show('amount')});
$('tooMuch').onclick=()=>{$('value').value='1500.00';$('value').focus()};
$('next').onclick=()=>{const value=$('value').value.trim();if(!/^\d{1,7}(\.\d{1,2})?$/.test(value)||Number(value)<=0){$('amountError').hidden=false;$('amountError').textContent='请输入大于 0 的金额，最多两位小数。';$('value').setAttribute('aria-invalid','true');return}pending=Math.round(Number(value)*100);$('amountError').hidden=true;$('value').removeAttribute('aria-invalid');$('reviewAmount').textContent=money(pending);$('reviewPerson').textContent=people[person].name;$('reviewAccount').textContent=people[person].account;$('fundsError').hidden=true;show('review')};
$('confirm').onclick=()=>{if($('review').hidden)return;if(pending>balance){$('fundsError').textContent='余额不足。当前可用 '+money(balance)+'，还差 '+money(pending-balance)+'。请修改金额后重新确认。';$('fundsError').hidden=false;return}if(pending<=0)return;balance-=pending;const record={amount:pending,name:people[person].name,id:'MZ-260905-'+String(records.length+1).padStart(3,'0'),time:new Date().toLocaleString('zh-CN'),balance};records.push(record);$('receiptAmount').textContent=money(record.amount);$('receiptPerson').textContent=record.name;$('receiptId').textContent=record.id;$('receiptTime').textContent=record.time;$('receiptBalance').textContent=money(balance);pending=0;refresh();show('receipt')};
$('edit').onclick=()=>{refresh();show('amount')};$('back').onclick=()=>show('home');$('done').onclick=()=>show('home');$('homeTab').onclick=()=>show('home');$('historyTab').onclick=()=>{$('historyList').replaceChildren();if(!records.length)$('historyList').textContent='还没有转账凭证。';records.slice().reverse().forEach(r=>{const el=document.createElement('div');el.className='records';el.textContent=r.name+' · '+money(r.amount)+' · '+r.id;$('historyList').append(el)});show('history')};refresh();

</script></body></html>
