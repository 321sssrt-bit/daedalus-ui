<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>听岚 · 给喧嚣留一道缝</title><style>
*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button,a,input,select,textarea{-webkit-tap-highlight-color:transparent}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:4px}[hidden]{display:none!important}svg{max-width:100%}button{transition:filter 140ms ease}button:hover:not(:disabled){filter:brightness(.93)}

:root{--page:#101824;--surface:#172235;--text:#e2e8f4;--muted:#8e9caf;--accent:#c2d6fa;--line:#2b394e;--blue:#6684b2;--warm:#e59d6f;--error:#f0ae92}body{background:var(--page);color:var(--text);font:14px/1.6 "Segoe UI","Microsoft YaHei",sans-serif}.layout{display:grid;grid-template-columns:196px 1fr;max-width:1440px;min-height:100vh;margin:auto}.sidebar{border-right:1px solid var(--line);padding:40px 28px;display:flex;flex-direction:column;gap:37px}.brand{font:31px Georgia,"SimSun",serif;letter-spacing:8px}.sidebar small{font-size:10px;letter-spacing:3px;color:var(--muted)}.side-item{background:none;border:0;color:var(--accent);text-align:left;padding:12px 0;border-bottom:1px solid var(--line);font-size:13px}.side-note{font-size:11px;line-height:1.8;color:var(--muted);margin-top:auto}main{padding:36px 42px 30px;min-width:0}.top{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);letter-spacing:2px}.pill{padding:3px 10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;color:var(--accent);letter-spacing:0}.heading{display:flex;justify-content:space-between;align-items:end;margin-top:27px}.eyebrow{color:var(--warm);font-size:10px;letter-spacing:3px}h1{font:52px/1.2 Georgia,"SimSun",serif;margin:10px 0 14px}.heading p{color:var(--muted);max-width:225px;font-size:12px}.player{display:grid;grid-template-columns:1.2fr 1fr;margin-top:20px;border:1px solid var(--line);background:var(--surface);min-height:300px}.cover{position:relative;display:grid;place-items:center;overflow:hidden;border-right:1px solid var(--line);background:radial-gradient(ellipse at 50% 60%,#415b81 0,#22334b 35%,#172235 75%)}.cover svg{height:265px;width:100%}.cover small{position:absolute;bottom:18px;left:21px;font:10px Consolas,monospace;color:var(--accent);letter-spacing:2px}.control{padding:25px 30px;display:flex;flex-direction:column}.control h2{font:30px/1.3 Georgia,"SimSun",serif;margin:16px 0 4px}.meta{font-size:11px;color:var(--muted)}.transport{display:flex;align-items:center;gap:18px;margin:23px 0 18px}.play{width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:var(--page);font-size:21px}.skip{background:none;color:var(--text);border:1px solid var(--line);border-radius:50%;width:39px;height:39px;font-size:16px}.range{width:100%;accent-color:var(--accent);height:4px;cursor:pointer}.times{display:flex;justify-content:space-between;font:10px Consolas,monospace;color:var(--muted);margin-top:8px}.tools{display:flex;gap:18px;align-items:center;margin-top:14px}.tools button{border:0;background:none;color:var(--accent);font-size:11px;padding:7px 0;text-decoration:underline}.tools label{font-size:10px;color:var(--muted);margin-left:auto}.tools input{width:65px;accent-color:var(--accent)}.notice{font-size:12px;border-left:2px solid var(--warm);background:#2e2d32;padding:15px 18px;margin:16px 0;color:var(--error);display:flex;align-items:center;justify-content:space-between;gap:20px}.notice button{border:1px solid var(--warm);color:var(--error);background:none;padding:9px 15px;flex:none}.saved{font-size:11px;color:var(--muted);min-height:28px;padding-top:8px}.discover-title{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:20px;margin-top:18px}.discover-title h3{font-weight:400;font-size:14px;margin:0}.discover-title small{font-size:10px;color:var(--muted)}.tracks{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:13px}.track{background:none;border:1px solid var(--line);padding:16px;color:var(--text);text-align:left;display:flex;align-items:center;gap:15px}.track[aria-pressed=true]{border-color:var(--blue);background:#1c2b42}.disc{width:40px;height:40px;border:1px solid var(--blue);border-radius:50%;display:grid;place-items:center;color:var(--blue);flex:none}.track b{display:block;font-weight:400}.track small{font-size:10px;color:var(--muted)}@media(max-width:1050px){.layout{grid-template-columns:140px 1fr}.sidebar{padding:35px 20px}main{padding:30px 26px}.control{padding:20px}.heading p{display:none}.track{padding:12px;gap:8px}.disc{width:30px;height:30px}}@media(max-width:800px){.layout{grid-template-columns:100px 1fr}.sidebar{padding:30px 15px}.brand{font-size:24px;letter-spacing:2px}.sidebar small{letter-spacing:0}main{padding:26px 22px}.player{grid-template-columns:1fr}.cover{border-right:0;border-bottom:1px solid var(--line)}.cover svg{height:190px}.control{padding:20px 25px}.control h2{margin:6px 0}.transport{margin:15px 0}.tracks{gap:8px}.disc{display:none}h1{font-size:40px}.notice{align-items:start;flex-direction:column;gap:10px}}@media(max-width:540px){.layout{grid-template-columns:1fr}.sidebar{padding:18px 20px;border:0;flex-direction:row;gap:18px;align-items:center}.side-note,.sidebar small{display:none}.side-item{padding:6px 0}main{padding:20px}.tracks{grid-template-columns:1fr}.disc{display:grid}.top{letter-spacing:0}}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style></head><body>
<div class="layout"><aside class="sidebar"><div><div class="brand">听岚</div><small>HUSH / CURRENT</small></div><button class="side-item" id="discover">◉ 发现声音</button><button class="side-item" id="savedJump">◷ 播放记忆</button><div class="side-note">耳朵去散步，<br>心留在这里。<br><br>离线合成音景<br>无需网络音源</div></aside><main><div class="top"><span>声音札记 / VOL. 09</span><span class="pill" id="connection">● 本地声场就绪</span></div><div class="heading"><div><div class="eyebrow">给 喧 嚣 留 一 道 缝</div><h1>让思绪，慢慢漂流。</h1></div><p>低频、留白、微小的变化。<br>三段合成音景，陪你把注意力<br>交还给当下。</p></div>
<section class="player" aria-label="音景播放器"><div class="cover"><svg viewBox="0 0 480 290" role="img" aria-label="暮蓝水面上层层扩散的波纹"><g fill="none" stroke="#6684b2"><ellipse cx="240" cy="166" rx="185" ry="82" opacity=".25"/><ellipse cx="240" cy="166" rx="159" ry="65" opacity=".4"/><ellipse cx="240" cy="166" rx="127" ry="49" opacity=".6"/><ellipse cx="240" cy="166" rx="94" ry="34"/><ellipse cx="240" cy="166" rx="57" ry="21"/></g><path d="M240 59C240 59 220 89 220 102C220 129 260 129 260 102C260 89 240 59 240 59Z" fill="#c2d6fa"/><path d="M231 145L231 174M249 148L249 168" stroke="#c2d6fa" opacity=".5"/></svg><small id="coverCode">01 / TIDAL LINES</small></div><div class="control"><span class="eyebrow" id="playState" role="status">等待播放</span><h2 id="trackName">潮线</h2><div class="meta" id="trackDescription">温润低频 · 离线合成音景</div><div class="transport"><button class="play" id="play" aria-label="开始播放">▶</button><button class="skip" id="nextTrack" aria-label="下一段音景">↠</button><span class="meta" id="segment">片段 01 / 12</span></div><label class="meta" for="progress">播放进度</label><input type="range" id="progress" class="range" min="0" max="180" step="1" value="0"><div class="times"><span id="elapsed">0:00</span><span>3:00</span></div><div class="tools"><button id="save">保存播放位置</button><label for="volume">音量</label><input id="volume" type="range" min="0" max="100" value="28"></div></div></section>
<div class="notice" id="interruption" role="alert" hidden><span id="interruptionText"></span><button id="reconnect">重新连接并继续</button></div><div class="tools"><button id="disconnect">体验异常：模拟网络中断</button><span class="saved" id="saved" role="status">还没有保存播放位置。</span></div><div class="discover-title" id="collection"><h3>留一段时间给自己</h3><small>可离线播放 · 每段 03:00</small></div><div class="tracks"><button class="track" data-track="0" aria-pressed="true"><span class="disc">◎</span><span><b>潮线</b><small>低频 / 放空</small></span></button><button class="track" data-track="1" aria-pressed="false"><span class="disc">◇</span><span><b>玻璃雨</b><small>清透 / 阅读</small></span></button><button class="track" data-track="2" aria-pressed="false"><span class="disc">∿</span><span><b>松影</b><small>柔和 / 专注</small></span></button></div></main></div>
<script>
'use strict';
const $=id=>document.getElementById(id);

const tracks=[{name:'潮线',code:'TIDAL LINES',description:'温润低频 · 离线合成音景',notes:[110,130.81,146.83,130.81],wave:'sine'},{name:'玻璃雨',code:'GLASS RAIN',description:'清透泛音 · 离线合成音景',notes:[261.63,329.63,392,293.66],wave:'sine'},{name:'松影',code:'PINE SHADE',description:'柔和层叠 · 离线合成音景',notes:[164.81,196,174.61,146.83],wave:'triangle'}];let track=0,position=0,playing=false,interrupted=false,ctx,gain,voices=[],lastTime=performance.now();
const stamp=n=>Math.floor(n/60)+':'+String(Math.floor(n%60)).padStart(2,'0');
function update(){const t=tracks[track];$('trackName').textContent=t.name;$('trackDescription').textContent=t.description;$('coverCode').textContent='0'+(track+1)+' / '+t.code;$('progress').value=position;$('elapsed').textContent=stamp(position);$('segment').textContent='片段 '+String(Math.min(12,Math.floor(position/15)+1)).padStart(2,'0')+' / 12';$('play').textContent=playing?'Ⅱ':'▶';$('play').setAttribute('aria-label',playing?'暂停播放':'开始播放');$('playState').textContent=interrupted?'连接中断 · 进度已保留':playing?'正在播放':position>=180?'播放结束':position>0?'已暂停':'等待播放';document.querySelectorAll('[data-track]').forEach(b=>b.setAttribute('aria-pressed',Number(b.dataset.track)===track))}
function tune(){if(!ctx||!voices.length)return;const note=tracks[track].notes[Math.floor(position/15)%4];voices.forEach((v,i)=>{v.type=tracks[track].wave;v.frequency.setTargetAtTime(note*(i?1.5:1),ctx.currentTime,.25)})}
function silence(){if(gain&&ctx)gain.gain.setTargetAtTime(0,ctx.currentTime,.04)}
async function start(){if(interrupted)return;if(position>=180)position=0;try{if(!ctx){const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)throw Error('unsupported');ctx=new Audio();gain=ctx.createGain();gain.gain.value=0;gain.connect(ctx.destination);voices=[0,1].map(()=>{const o=ctx.createOscillator();o.connect(gain);o.start();return o})}await ctx.resume();playing=true;lastTime=performance.now();tune();gain.gain.setTargetAtTime(Number($('volume').value)/100*.08,ctx.currentTime,.1);update()}catch{playing=false;$('saved').textContent='此浏览器未能启用声音，请使用支持音频的浏览器重试。';update()}}
function pause(){playing=false;silence();update()}
function choose(i){pause();track=i;position=0;interrupted=false;$('interruption').hidden=true;$('connection').textContent='● 本地声场就绪';update()}
document.querySelectorAll('[data-track]').forEach(b=>b.onclick=()=>choose(Number(b.dataset.track)));$('nextTrack').onclick=()=>{const wasPlaying=playing;choose((track+1)%tracks.length);if(wasPlaying)start()};$('play').onclick=()=>playing?pause():start();
$('progress').oninput=()=>{position=Number($('progress').value);tune();update()};$('volume').oninput=()=>{if(playing)gain.gain.setTargetAtTime(Number($('volume').value)/100*.08,ctx.currentTime,.1)};
$('disconnect').onclick=()=>{interrupted=true;pause();$('connection').textContent='○ 模拟网络中断';$('interruptionText').textContent='连接中断，已停在 '+stamp(position)+'。重新连接会从这里继续，进度不会重置。';$('interruption').hidden=false;update()};$('reconnect').onclick=()=>{interrupted=false;$('interruption').hidden=true;$('connection').textContent='● 连接已恢复';start()};
$('save').onclick=()=>{const saved={track,position:Math.floor(position),volume:Number($('volume').value)};try{localStorage.setItem('hush-current-position',JSON.stringify(saved));$('saved').textContent='已保存：'+tracks[track].name+' / '+stamp(saved.position)+' · 刷新后可继续'}catch{$('saved').textContent='当前浏览器不允许保存；播放位置仍在本页保留。'}};
try{const s=JSON.parse(localStorage.getItem('hush-current-position'));if(s&&Number.isInteger(s.track)&&s.track>=0&&s.track<tracks.length&&Number.isFinite(s.position)&&s.position>=0&&s.position<=180){track=s.track;position=s.position;if(Number.isFinite(s.volume))$('volume').value=Math.max(0,Math.min(100,s.volume));$('saved').textContent='已恢复：'+tracks[track].name+' / '+stamp(position)+'，按播放继续。'}}catch{}
setInterval(()=>{const now=performance.now();if(playing){position=Math.min(180,position+(now-lastTime)/1000);tune();if(position>=180)pause();update()}lastTime=now},250);$('discover').onclick=()=>$('collection').scrollIntoView();$('savedJump').onclick=()=>{$('save').focus();$('saved').scrollIntoView()};update();

</script></body></html>
