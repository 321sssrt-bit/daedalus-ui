<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大作 · 灵感放大器</title><style>
*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button,a,input,select,textarea{-webkit-tap-highlight-color:transparent}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:4px}[hidden]{display:none!important}svg{max-width:100%}button{transition:filter 140ms ease}button:hover:not(:disabled){filter:brightness(.93)}

:root{--page:#e8e9e5;--surface:#f8f9f5;--text:#23252c;--muted:#757978;--accent:#667219;--line:#cbd0c7;--lime:#e0ef55;--cyan:#86d9dc;--error:#b74434}body{background:var(--page);color:var(--text);font:13px/1.5 "Segoe UI","Microsoft YaHei",sans-serif}header{height:76px;background:var(--text);color:var(--surface);padding:0 30px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:29px;font-weight:800;letter-spacing:-2px}.brand small{font:10px Consolas,monospace;margin-left:18px;letter-spacing:2px;color:#b7bcba}.header-right{display:flex;align-items:center;gap:22px;font-size:11px}.header-right button{color:var(--lime);background:none;border:1px solid #575d58;padding:8px 12px;font-size:11px}.project-bar{display:flex;justify-content:space-between;padding:21px 30px;border-bottom:1px solid var(--line);font-size:12px}.project-bar span:last-child{color:var(--muted);font:11px Consolas,monospace}.workspace{display:grid;grid-template-columns:240px minmax(300px,1fr) 260px;max-width:1440px;min-height:650px;margin:auto}.panel{padding:25px 23px;background:var(--surface)}.edit{border-right:1px solid var(--line)}.export{border-left:1px solid var(--line)}h1{font-size:15px;margin:0 0 23px}h2{font-size:14px;margin:0 0 22px}.caption{font:10px Consolas,monospace;letter-spacing:1px;color:var(--muted);margin-bottom:10px}label{display:block;font-size:11px;margin:21px 0 8px}input[type=text],select{width:100%;padding:11px;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:3px;font-size:12px}input[type=range]{width:100%;accent-color:var(--text)}.colors{display:flex;gap:9px}.swatch{width:40px;height:40px;border:3px solid transparent;outline:1px solid var(--line);outline-offset:1px}.swatch[aria-pressed=true]{border-color:var(--text)}.check{display:flex;align-items:center;gap:8px;line-height:1.5}.check input{accent-color:var(--text);width:17px;height:17px}.hint{font-size:10px;color:var(--muted);line-height:1.8}.layer{border-top:1px solid var(--line);margin-top:25px;padding-top:18px}.layer div{display:flex;justify-content:space-between;font-size:11px;margin:13px 0}.canvas-zone{padding:28px 32px 22px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(45deg,#e3e5df 25%,transparent 25%),linear-gradient(-45deg,#e3e5df 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e3e5df 75%),linear-gradient(-45deg,transparent 75%,#e3e5df 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}.canvas-label{width:min(100%,340px);display:flex;justify-content:space-between;color:var(--muted);font:10px Consolas,monospace;margin-bottom:15px}.poster-wrap{width:min(100%,340px);aspect-ratio:600/760;box-shadow:0 10px 25px #23252c20}.poster-wrap svg{width:100%;height:100%;display:block}.canvas-footer{font-size:10px;color:var(--muted);margin-top:17px}.primary{padding:14px;width:100%;background:var(--text);color:var(--lime);border:0;margin-top:24px;font-weight:700}.format-note{padding:15px;border:1px solid var(--line);font-size:11px;margin-top:18px;line-height:1.9}.error{color:var(--error);background:#f6e1d8;padding:13px;font-size:11px;line-height:1.8;margin-top:17px;border-left:3px solid var(--error)}.result{margin-top:24px;border-top:1px solid var(--line);padding-top:20px}.result strong{font-size:15px}.result p{color:var(--muted);font-size:11px;overflow-wrap:anywhere}.result a{display:inline-block;border-bottom:1px solid var(--accent);color:var(--accent);font-size:12px;text-decoration:none;padding:5px 0}.test{border:0;background:none;color:var(--muted);font-size:10px;text-decoration:underline;padding:18px 0}.foot{max-width:1440px;margin:auto;padding:14px 30px;border-top:1px solid var(--line);font-size:10px;color:var(--muted);display:flex;justify-content:space-between}@media(max-width:1080px){.workspace{grid-template-columns:200px minmax(300px,1fr)}.export{grid-column:1/-1;border-left:0;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:0 30px}.export h2,.export .caption{grid-column:1/-1}.export .result{margin-top:0}.canvas-zone{padding:28px}.panel{padding:24px 20px}}@media(max-width:600px){header{padding:0 18px}.header-right span,.brand small{display:none}.workspace{grid-template-columns:1fr}.canvas-zone{grid-row:1}.edit{border:0;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:0 18px}.edit h1,.edit .caption,.edit .layer{grid-column:1/-1}.project-bar{padding:18px}.export{display:block}.foot{padding:14px 18px;gap:15px}}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style></head><body>
<header><div class="brand">大作 <small>DAZUO / STUDIO</small></div><div class="header-right"><span>每个想法，都值得成形。</span><button id="reset">重置作品</button></div></header><div class="project-bar"><span>未命名海报 / 灵感放大计划</span><span>600 × 760 PX · 实时预览</span></div><main class="workspace"><aside class="panel edit"><div class="caption">01 / MAKE IT YOURS</div><h1>从一句话开始</h1><div><label for="headline">主标题 · 最多 12 字</label><input type="text" id="headline" maxlength="12" value="把灵感放大"></div><div><label for="subtitle">副标题 · 最多 20 字</label><input type="text" id="subtitle" maxlength="20" value="日常之外，还有无限可能。"></div><div><label>主题色</label><div class="colors"><button class="swatch" style="background:#e0ef55" data-color="#e0ef55" aria-label="柠檬黄" aria-pressed="true"></button><button class="swatch" style="background:#86d9dc" data-color="#86d9dc" aria-label="冰川蓝" aria-pressed="false"></button><button class="swatch" style="background:#f3ac86" data-color="#f3ac86" aria-label="杏桃橙" aria-pressed="false"></button></div></div><div><label for="angle">形状转角 <span id="angleValue">−12°</span></label><input id="angle" type="range" min="-30" max="30" value="-12"></div><label class="check"><input id="transparent" type="checkbox">透明背景</label><div class="layer"><div><span>◎ 几何图形</span><span>可调整</span></div><div><span>Ｔ 文字层</span><span>可编辑</span></div><div><span>▧ 背景层</span><span id="backgroundState">可见</span></div></div></aside>
<section class="canvas-zone" aria-label="作品实时预览"><div class="canvas-label"><span>画板 01</span><span>600 : 760</span></div><div class="poster-wrap"><svg id="poster" viewBox="0 0 600 760" role="img" aria-label="海报实时预览"><rect id="paperBackground" width="600" height="760" fill="#23252c"/><text x="44" y="49" fill="#e0ef55" font-size="14" letter-spacing="5" font-family="sans-serif">MAKE ROOM FOR IDEAS</text><text id="posterTitle1" x="40" y="150" fill="#e0ef55" font-size="68" font-weight="700" font-family="Microsoft YaHei, sans-serif">把灵感放大</text><text id="posterTitle2" x="40" y="231" fill="#e0ef55" font-size="68" font-weight="700" font-family="Microsoft YaHei, sans-serif"></text><g id="geometry" transform="rotate(-12 320 450)"><circle cx="320" cy="450" r="181" fill="none" stroke="#86d9dc" stroke-width="2"/><circle cx="320" cy="450" r="130" fill="none" stroke="#86d9dc" stroke-width="2"/><path id="heroShape" d="M170 295L490 415L168 607Z" fill="#e0ef55"/><circle cx="317" cy="452" r="62" fill="#23252c"/><path d="M116 447H523M319 246V652" stroke="#86d9dc" stroke-width="1"/></g><line x1="44" y1="677" x2="556" y2="677" stroke="#757978"/><text id="posterSubtitle" x="44" y="716" fill="#e0ef55" font-size="20" font-family="Microsoft YaHei, sans-serif">日常之外，还有无限可能。</text><text x="548" y="49" fill="#86d9dc" font-size="14" text-anchor="end" font-family="monospace">01—∞</text></svg></div><div class="canvas-footer">所见即所得 / 改动实时反映在画板</div></section>
<aside class="panel export"><div class="caption">02 / LET IT OUT</div><h2>让作品走出去</h2><div><label for="format">导出格式</label><select id="format"><option value="svg">SVG · 矢量图形</option><option value="png">PNG · 支持透明</option><option value="jpeg">JPEG · 不支持透明</option></select><div class="format-note">尺寸　600 × 760 px<br>SVG 可继续编辑<br>PNG / JPEG 可直接使用</div><button class="primary" id="exportButton">导出作品 ↗</button><button class="test" id="unsupported">体验异常：透明背景 + JPEG</button></div><div><div id="exportError" class="error" role="alert" hidden></div><div id="exportResult" class="result" role="status" hidden><strong>作品准备好了。</strong><p id="exportDescription"></p><a id="download">下载作品 ↓</a></div><p class="hint">作品只在本地生成。导出文件包含当前画板的真实文字与图形。</p></div></aside></main><footer class="foot"><span>大作 / 每个想法都是一个开始。</span><span id="editStatus" role="status">画板已就绪</span></footer>
<script>
'use strict';
const $=id=>document.getElementById(id);

let color='#e0ef55',exportUrl=null;
function preview(){const title=$('headline').value;$('posterTitle1').textContent=title.slice(0,6);$('posterTitle2').textContent=title.slice(6);$('posterSubtitle').textContent=$('subtitle').value;['posterTitle1','posterTitle2','posterSubtitle','heroShape'].forEach(id=>$(id).setAttribute('fill',color));$('geometry').setAttribute('transform','rotate('+$('angle').value+' 320 450)');$('angleValue').textContent=$('angle').value+'°';$('paperBackground').setAttribute('fill',$('transparent').checked?'none':'#23252c');$('backgroundState').textContent=$('transparent').checked?'透明':'可见';document.querySelectorAll('[data-color]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.color===color));$('editStatus').textContent='预览已更新';$('exportError').hidden=true}
['headline','subtitle','angle','transparent'].forEach(id=>$(id).addEventListener('input',preview));document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{color=b.dataset.color;preview()});
$('reset').onclick=()=>{$('headline').value='把灵感放大';$('subtitle').value='日常之外，还有无限可能。';$('angle').value='-12';$('transparent').checked=false;$('format').value='svg';color='#e0ef55';preview()};
$('unsupported').onclick=()=>{$('transparent').checked=true;$('format').value='jpeg';preview();$('exportButton').focus()};
$('exportButton').onclick=async()=>{const format=$('format').value;if(!$('headline').value.trim()){$('exportError').textContent='主标题为空，请先写下作品的标题。';$('exportError').hidden=false;return}if(format==='jpeg'&&$('transparent').checked){$('exportError').textContent='JPEG 不支持透明背景。本次没有生成文件。请改用 PNG / SVG，或关闭透明背景后重新导出。';$('exportError').hidden=false;$('format').setAttribute('aria-invalid','true');return}$('format').removeAttribute('aria-invalid');$('exportError').hidden=true;$('exportButton').disabled=true;$('exportButton').textContent='正在生成…';try{const svg=$('poster').cloneNode(true);svg.setAttribute('width','600');svg.setAttribute('height','760');const source=new XMLSerializer().serializeToString(svg);let blob=new Blob([source],{type:'image/svg+xml;charset=utf-8'});if(format!=='svg'){const url=URL.createObjectURL (blob);try{const img=new Image();img.src=url;await img.decode();const canvas=document.createElement('canvas');canvas.width=600;canvas.height=760;const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0);blob=await new Promise(resolve=>canvas.toBlob(resolve,format==='png'?'image/png':'image/jpeg',.92));if(!blob)throw Error('export failed')}finally{URL.revokeObjectURL (url)}}if(exportUrl)URL.revokeObjectURL (exportUrl);exportUrl=URL.createObjectURL (blob);$('download').href=exportUrl;$('download').download='dazuo-poster.'+(format==='jpeg'?'jpg':format);$('exportDescription').textContent=format.toUpperCase()+' · 600 × 760 px · '+Math.max(1,Math.round(blob.size/1024))+' KB · '+($('transparent').checked?'透明背景':'深色背景');$('exportResult').hidden=false;$('editStatus').textContent='已生成可下载作品'}catch{$('exportError').textContent='当前浏览器未能完成图片导出。请改用 SVG 再试一次，画板改动仍保留。';$('exportError').hidden=false}finally{$('exportButton').disabled=false;$('exportButton').textContent='导出作品 ↗'}};

</script></body></html>
