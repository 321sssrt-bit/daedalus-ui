<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>绕路导航故障</title><style>*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button,a,input,select,textarea{-webkit-tap-highlight-color:transparent}button,a{touch-action:manipulation}button{cursor:pointer}button:disabled{cursor:not-allowed}a{color:inherit}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--focus,var(--accent));outline-offset:4px}[hidden]{display:none!important}button:hover:not(:disabled){filter:brightness(.94)}svg{display:block;max-width:100%}label{cursor:pointer}p{line-height:1.65}input,textarea,select{max-width:100%}textarea{resize:vertical}button{min-height:44px}::selection{background:var(--accent);color:var(--page)}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}body{background:#d9d6d0;display:grid;place-items:start center;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}.phone{width:100%;max-width:430px;min-height:100svh;position:relative;overflow:hidden}.statusbar{height:38px;padding:12px 25px 0;display:flex;justify-content:space-between;font-size:11px;font-weight:700;letter-spacing:.7px}.phone button,.phone input,.phone select{min-height:44px}@media(min-width:600px){body{padding:28px}.phone{width:390px;min-height:844px;border:8px solid #25272a;border-radius:42px;box-shadow:0 26px 70px #00000026}.statusbar{padding-top:13px;height:41px}}
:root{--page:#292e30;--surface:#343b3e;--text:#f2f1e6;--muted:#a7b0ae;--accent:#e0ed65;--line:#55615f;--road:#747d77;--focus:#ffb55d}.phone{background:var(--page);color:var(--text)}.route{padding:19px 25px 38px}.toprow{display:flex;justify-content:space-between;align-items:center}.brand{font-size:20px;font-weight:800;letter-spacing:2px}.signal{font:10px monospace;color:var(--accent);border:1px solid var(--line);padding:5px 8px}.map{height:215px;background:var(--surface);border:1px solid var(--line);margin:26px 0 22px;position:relative;overflow:hidden}.map svg{height:100%;width:100%}.map-label{position:absolute;bottom:9px;left:11px;font:9px monospace;color:var(--muted);letter-spacing:1px}.warning-strip{height:8px;background:repeating-linear-gradient(130deg,var(--accent) 0 12px,var(--page) 12px 22px);margin-top:19px}.error-code{font-size:91px;font-weight:850;letter-spacing:-6px;line-height:1;margin:20px 0 13px;color:var(--accent)}h1{font-size:29px;line-height:1.35;letter-spacing:-1px;margin:0 0 14px}.copy{font-size:12px;color:var(--muted);line-height:1.9;margin:0}.support{display:flex;justify-content:space-between;align-items:center;font:10px monospace;border-top:1px solid var(--line);padding-top:16px;margin-top:24px}.support span:last-child{color:var(--muted)}.actions{margin-top:25px;display:grid;gap:10px}.actions button{width:100%;padding:14px;border:1px solid var(--line);background:transparent;color:var(--text);font-size:12px;font-weight:600;border-radius:0}.actions .retry{background:var(--accent);color:var(--page);border-color:var(--accent)}.retry:disabled{background:var(--road);border-color:var(--road);color:var(--page)}.hint{font-size:10px;line-height:1.7;color:var(--muted);margin:16px 0 0}#status{font-size:11px;color:var(--accent);min-height:18px;margin:12px 0 0}.home,.success{padding:20px 25px 40px}.home h1,.success h1{font-size:35px;margin:47px 0 20px}.home p,.success p{font-size:13px;color:var(--muted);line-height:1.9}.home label{display:block;margin:25px 0;font-size:12px}.home input{background:var(--surface);color:var(--text);border:1px solid var(--line);padding:14px;margin-top:10px;width:100%}.home button,.success button{width:100%;border:0;background:var(--accent);color:var(--page);font-weight:650;padding:15px;margin-top:15px}.route-card{border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:30px 0;padding:25px 0}.route-card strong{font-size:45px;display:block;font-weight:500;letter-spacing:-2px}.route-card small{font-size:12px;color:var(--muted)}.checkmark{font-size:70px;color:var(--accent);margin-top:43px}.success .second{background:transparent;border:1px solid var(--line);color:var(--text)}
</style></head><body><div class="phone"><div class="statusbar"><span>9:41</span><span>●●●　▰</span></div><main class="route" id="errorView"><header class="toprow"><div class="brand">绕路</div><span class="signal">路线服务 / 离线</span></header><div class="map"><svg viewBox="0 0 330 215" role="img" aria-label="地图中间道路中断，黄色虚线绕行"><g fill="none" stroke="#55615f" stroke-width="15"><path d="m-20 40 160 0 0 180M10-20l0 90 330 0M90-20v235m125-235v235m-225-90h380M275-20v180l70 0"/></g><g fill="none" stroke="#747d77" stroke-width="1"><path d="M-10 125h360M140 0v230M0 70h340"/></g><path d="M37 169h53v-44h53" fill="none" stroke="#e0ed65" stroke-width="5"/><path d="M143 125v-55h74v55h63" fill="none" stroke="#e0ed65" stroke-width="4" stroke-dasharray="5 7"/><circle cx="37" cy="169" r="9" fill="#e0ed65" stroke="#292e30" stroke-width="3"/><circle cx="280" cy="125" r="8" fill="#f2f1e6"/><rect x="134" y="114" width="34" height="23" fill="#292e30" stroke="#e0ed65" stroke-width="2" transform="rotate(-12 150 125)"/><path d="m141 129 5-10m7 11 5-11" stroke="#e0ed65" stroke-width="3"/></svg><span class="map-label">ROUTE CONNECTION INTERRUPTED</span></div><div class="warning-strip"></div><div class="error-code">503<span style="font-size:18px;letter-spacing:0;margin-left:13px">临时绕行</span></div><h1>前方暂时不通。<br>我们正在找另一条路。</h1><p class="copy">路线服务暂时没有响应，你的目的地已经保留。稍后重试，就能从这里继续。</p><div class="support"><span>支持编号 RT-503-038</span><span>无需重新输入</span></div><div class="actions"><button class="retry" id="retry">再试一次　↻</button><button id="home">回到首页</button></div><p id="status" role="status"></p><p class="hint">本页为故障恢复演示。重试将模拟恢复连接，<br>不会请求实时导航。</p></main><main class="home" id="homeView" hidden><div class="brand">绕路</div><h1>今天，<br>想去哪里？</h1><p>目的地为你保留着。换一条路，也能好好到达。</p><form id="routeForm"><label>出发地<input id="origin" value="当前位置" required></label><label>目的地<input id="destination" value="西岸美术馆" required maxlength="60"></label><button type="submit">查看可用路线　→</button></form></main><main class="success" id="successView" hidden><div class="brand">绕路</div><div class="checkmark">↗</div><h1>路，又通了。</h1><p id="routeName">当前位置 → 西岸美术馆</p><div class="route-card"><small>建议路线 · 沿江步行</small><strong>18 分钟</strong><p>约 1.2 公里 · 经过滨江步道<br>本地演示路线，非实时路况。</p></div><button id="startRoute">开始步行预览</button><button class="second" id="successHome">回到首页</button><p id="navigationStatus" role="status"></p></main></div><script>
let busy=false,timer;function view(id){['errorView','homeView','successView'].forEach(v=>document.getElementById(v).hidden=v!==id);window.scrollTo(0,0)}function route(){document.querySelector('#routeName').textContent=document.querySelector('#origin').value+' → '+document.querySelector('#destination').value;document.querySelector('#startRoute').textContent='开始步行预览';document.querySelector('#navigationStatus').textContent='';view('successView')}
document.querySelector('#retry').onclick=()=>{if(busy)return;busy=true;document.querySelector('#retry').disabled=true;document.querySelector('#retry').textContent='正在重新连接…';document.querySelector('#status').textContent='保留目的地，正在检查可用路线。';timer=setTimeout(()=>{busy=false;route()},1200)};document.querySelector('#home').onclick=()=>{clearTimeout(timer);busy=false;view('homeView')};document.querySelector('#routeForm').onsubmit=e=>{e.preventDefault();route()};document.querySelector('#successHome').onclick=()=>view('homeView');document.querySelector('#startRoute').onclick=()=>{document.querySelector('#navigationStatus').textContent='预览已开始：向东步行 200 米，进入滨江步道。';document.querySelector('#startRoute').textContent='步行预览中'};
</script></body></html>
