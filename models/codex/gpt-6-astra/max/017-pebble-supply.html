<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>商店首页 · pebble-supply</title><style>*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.6}button,input,select,textarea{font:inherit}button,a,input,select,summary{touch-action:manipulation}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}button,a{color:inherit}button{transition:background .16s ease,color .16s ease,transform .16s ease}button:hover:not(:disabled){filter:brightness(.94)}:focus-visible{outline:3px solid var(--accent);outline-offset:4px}h1,h2,h3,p{margin:0}svg{max-width:100%;height:auto}button,select,input{min-height:40px}a{text-decoration:none}small{font-size:12px}button[aria-pressed=true]{font-weight:700}[hidden]{display:none!important}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}dialog{border:1px solid var(--line);padding:32px;max-width:min(580px,90vw);color:var(--text);background:var(--surface)}dialog::backdrop{background:#00000080}dialog .close{float:right}.status{min-height:24px}summary{cursor:pointer}input,select,textarea{max-width:100%}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

:root{--page:#F9F8F1;--surface:#E0ECE3;--text:#203B35;--muted:#63796F;--accent:#235B48;--line:#BED1C6;--pink:#EFC7C3;--yellow:#EADF9E;--blue:#CBDCE2}body{background:var(--page);color:var(--text)}.shop{max-width:1200px;margin:auto;padding:22px 40px}.nav{display:flex;align-items:center;justify-content:space-between;gap:25px;padding:8px 0 25px}.brand{font-size:24px;font-weight:900;letter-spacing:-1px}.brand span{display:inline-block;width:28px;height:22px;border-radius:48% 62% 45% 70%;background:var(--accent);vertical-align:middle;margin-right:10px}.nav small{color:var(--muted)}.saved{border:1px solid var(--text);border-radius:22px;padding:6px 18px;background:transparent}.hero{display:grid;grid-template-columns:1fr 270px;background:var(--surface);border-radius:8px 75px 8px 8px;padding:34px 42px;align-items:center;overflow:hidden}.eyebrow{font-size:11px;letter-spacing:3px}.hero h1{font-size:50px;line-height:1.25;letter-spacing:-2px;margin:13px 0}.hero p{color:var(--muted);font-size:13px}.hero-art{width:190px;justify-self:center;transform:rotate(-10deg)}.section-head{display:flex;justify-content:space-between;align-items:end;margin:32px 0 20px;gap:20px}.section-head h2{font-size:24px;letter-spacing:-.5px}.tabs{display:flex;gap:7px;flex-wrap:wrap}.tabs button{border:0;background:transparent;border-radius:20px;padding:6px 14px;font-size:12px}.tabs button[aria-pressed=true]{background:var(--text);color:var(--page)}.products{display:grid;grid-template-columns:repeat(3,1fr);gap:28px 22px}.product{position:relative}.pedestal{height:205px;background:var(--surface);border-radius:6px 6px 55px 6px;display:flex;align-items:center;justify-content:center}.product:nth-child(2n) .pedestal{background:var(--pink);border-radius:50px 6px 6px 6px}.product:nth-child(3n) .pedestal{background:var(--yellow);border-radius:6px 60px 6px 6px}.product:nth-child(4n) .pedestal{background:var(--blue)}.pedestal svg{height:164px;width:164px;filter:drop-shadow(0 12px 8px #203B3520)}.heart{position:absolute;top:13px;right:13px;width:36px;min-height:36px;border:1px solid #203B3530;background:var(--page);border-radius:50%;font-size:20px}.heart[aria-pressed=true]{background:var(--accent);color:var(--page)}.info{display:flex;justify-content:space-between;gap:8px;padding:13px 2px 0}.info h3{font-size:15px;font-weight:600}.info p{font-size:11px;color:var(--muted);margin-top:3px}.price{font-size:16px;font-weight:700}.status{font-size:12px;color:var(--muted)}.empty{text-align:center;padding:50px;background:var(--surface);border-radius:8px}.footer{margin:32px 0 8px;padding-top:18px;border-top:1px solid var(--line);display:flex;justify-content:space-between;color:var(--muted);font-size:12px}@media(max-width:900px){.shop{padding:20px 24px}.hero{padding:28px;grid-template-columns:1fr 190px}.hero h1{font-size:40px}.hero-art{width:155px}.products{gap:24px 16px}.pedestal{height:180px}}@media(max-width:620px){.products{grid-template-columns:repeat(2,1fr)}.hero{grid-template-columns:1fr 100px;padding:24px}.hero h1{font-size:30px}.hero-art{width:110px}.nav small{display:none}.section-head{display:block}.tabs{margin-top:12px}.pedestal{height:165px}.pedestal svg{width:140px;height:140px}}
</style></head><body><div class="shop"><header class="nav"><div class="brand"><span aria-hidden="true"></span>小石杂货</div><small>慢慢挑，日子长。</small><button class="saved" id="saved">我的收藏 <b id="saved-count">0</b> ♡</button></header><main><section class="hero"><div><div class="eyebrow">小石的秋日提案　/　VOL. 06</div><h1>寻常日子，<br>放一点喜欢。</h1><p>为桌边、窗台和生活里的小角落，选一件好东西。</p></div><svg class="hero-art" viewBox="0 0 220 220" aria-label="粉色小石与叶子插画" role="img"><path d="M34 138Q13 81 58 38T163 41Q220 65 199 135T118 207Q55 213 34 138" fill="#EFC7C3"/><path d="M113 161q-28-48-1-107M113 113q46-57 65-42-8 42-65 42M109 139q-50-19-49-48 41-4 49 48" fill="#235B48"/><circle cx="82" cy="163" r="9" fill="#F9F8F1"/><path d="M149 169q13-9 19-2" fill="none" stroke="#203B35" stroke-width="3"/></svg></section><div class="section-head"><div><div class="eyebrow">GOOD THINGS, EVERYDAY</div><h2>本周，值得带回家</h2></div><div class="tabs" aria-label="商品分类"><button data-category="全部" aria-pressed="true">全部好物</button><button data-category="餐桌" aria-pressed="false">餐桌</button><button data-category="家居" aria-pressed="false">家居</button><button data-category="随身" aria-pressed="false">随身</button></div></div><p class="status" id="shop-status" role="status">6 件好物，慢慢发现。</p><section class="products" id="products"></section><div class="empty" id="empty" hidden>收藏夹还空着。<br>点商品右上角的爱心，把喜欢的留下来。</div></main><footer class="footer"><span>好用，也好看。每一件都认真挑。</span><span>小石选物 · 秋 2026</span></footer></div><script>
const drawings=[`<path d="M44 59h91v75q0 29-45 29t-46-29V59" fill="#F9F8F1"/><path d="M135 78h13q33 27-3 47h-10" fill="none" stroke="#F9F8F1" stroke-width="14"/><ellipse cx="89" cy="59" rx="45" ry="12" fill="#C19E58"/><ellipse cx="89" cy="60" rx="36" ry="7" fill="#203B35"/><path d="M51 92h75M51 105h75" stroke="#EFC7C3" stroke-width="7"/>`,`<path d="M76 53h48v31q0 8 18 28 22 47-42 50-64-3-42-50 18-20 18-28V53" fill="#235B48"/><ellipse cx="100" cy="54" rx="24" ry="7" fill="#63796F"/><path d="M96 56Q71 31 80 9M101 54q20-26 28-35" fill="none" stroke="#203B35" stroke-width="3"/><path d="M81 27Q49 10 51 39q22 9 30-12M120 31q29-28 40-8-11 23-40 8" fill="#63796F"/>`,`<path d="M69 32h62l34 74H35l34-74" fill="#EFC7C3"/><path d="M99 107v54M67 166h67" stroke="#203B35" stroke-width="10" stroke-linecap="round"/><path d="M46 107h108" stroke="#F9F8F1" stroke-width="6"/><path d="M129 107v28" stroke="#203B35" stroke-width="2"/><circle cx="129" cy="137" r="4" fill="#203B35"/>`,`<path d="M47 71h108l-9 100H57L47 71" fill="#EADF9E"/><path d="M72 81V54q0-50 56 0v27" fill="none" stroke="#203B35" stroke-width="8"/><path d="M95 116q-30-14-26 12 8 24 33 15 29-13 17-29-14-12-24 2" fill="#235B48"/>`,`<path d="M62 91v-37q0-35 38-35t38 35v37q0 37-38 37T62 91" fill="#EADF9E" stroke="#235B48" stroke-width="9"/><path d="M72 92V53q0-22 20-24" stroke="#F9F8F1" stroke-width="5" fill="none"/><path d="M100 133v26M77 166h46" stroke="#235B48" stroke-width="10" stroke-linecap="round"/>`,`<rect x="50" y="31" width="103" height="140" rx="6" fill="#235B48"/><rect x="47" y="29" width="99" height="137" rx="5" fill="#F9F8F1"/><rect x="47" y="29" width="16" height="137" fill="#EFC7C3"/><circle cx="105" cy="90" r="22" fill="#EADF9E"/><path d="M83 113h44M83 125h30" stroke="#235B48" stroke-width="2"/>`];const products=[['清晨条纹杯','餐桌','陶瓷 / 320ml',68],['一枝花瓶','家居','手工釉 / 苔绿色',128],['小帽台灯','家居','暖光 / 樱花粉',269],['日常托特包','随身','厚帆布 / 麦穗黄',89],['拱门桌镜','家居','实木框 / 松绿色',159],['留白手账','随身','无酸纸 / A5',46]];let favorites=new Set(),category='全部',onlySaved=false;function render(){const matches=products.map((p,i)=>[p,i]).filter(([p,i])=>(category==='全部'||category===p[1])&&(!onlySaved||favorites.has(i)));document.querySelector('#products').innerHTML=matches.map(([p,i])=>`<article class="product"><div class="pedestal"><svg viewBox="0 0 200 200" role="img" aria-label="${p[0]}">${drawings[i]}</svg></div><button class="heart" data-heart="${i}" aria-label="收藏${p[0]}" aria-pressed="${favorites.has(i)}">${favorites.has(i)?'♥':'♡'}</button><div class="info"><div><h3>${p[0]}</h3><p>${p[2]}</p></div><span class="price">¥${p[3]}</span></div></article>`).join('');document.querySelector('#saved-count').textContent=favorites.size;document.querySelector('#empty').hidden=matches.length>0;document.querySelector('#shop-status').textContent=onlySaved?'我的收藏 · '+matches.length+' 件好物':category+' · '+matches.length+' 件好物';document.querySelectorAll('[data-heart]').forEach(b=>b.onclick=()=>{const id=+b.dataset.heart;favorites.has(id)?favorites.delete(id):favorites.add(id);render()})}render();document.querySelectorAll('[data-category]').forEach(b=>b.onclick=()=>{category=b.dataset.category;onlySaved=false;document.querySelector('#saved').setAttribute('aria-pressed','false');document.querySelectorAll('[data-category]').forEach(x=>x.setAttribute('aria-pressed',x===b));render()});document.querySelector('#saved').onclick=()=>{onlySaved=!onlySaved;category='全部';document.querySelectorAll('[data-category]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.category==='全部'));document.querySelector('#saved').setAttribute('aria-pressed',onlySaved);render()};
</script></body></html>
