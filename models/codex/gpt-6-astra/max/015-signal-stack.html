<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>通知中心 · signal-stack</title><style>*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.6}button,input,select,textarea{font:inherit}button,a,input,select,summary{touch-action:manipulation}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}button,a{color:inherit}button{transition:background .16s ease,color .16s ease,transform .16s ease}button:hover:not(:disabled){filter:brightness(.94)}:focus-visible{outline:3px solid var(--accent);outline-offset:4px}h1,h2,h3,p{margin:0}svg{max-width:100%;height:auto}button,select,input{min-height:40px}a{text-decoration:none}small{font-size:12px}button[aria-pressed=true]{font-weight:700}[hidden]{display:none!important}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}dialog{border:1px solid var(--line);padding:32px;max-width:min(580px,90vw);color:var(--text);background:var(--surface)}dialog::backdrop{background:#00000080}dialog .close{float:right}.status{min-height:24px}summary{cursor:pointer}input,select,textarea{max-width:100%}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

:root{--page:#211F1D;--surface:#2C2926;--text:#F4EEE4;--muted:#B5A99B;--accent:#FF9A5B;--line:#4C433A;--green:#B8CCAA}body{background:var(--page);color:var(--text)}.shell{max-width:1160px;margin:0 auto;padding:32px 36px}.mast{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:23px;align-items:center}.brand{font-size:20px;letter-spacing:2px;font-weight:800}.brand i{color:var(--accent);font-style:normal}.mast small{color:var(--muted)}.layout{display:grid;grid-template-columns:220px 1fr;gap:56px;padding-top:42px}.rail{border-right:1px solid var(--line);padding-right:32px}.tower{width:54px;margin:12px 0 28px}.rail h1{font-size:28px;letter-spacing:4px}.huge{font-size:104px;line-height:1.2;font-weight:300;color:var(--accent);font-variant-numeric:tabular-nums}.rail p{color:var(--muted)}.rail .aside{border-top:1px solid var(--line);margin-top:48px;padding-top:20px;font-size:12px}.topline{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:25px}.topline h2{font-size:22px}.primary{border:0;background:var(--accent);color:var(--page);border-radius:24px;padding:9px 18px;font-weight:700}.filters{display:flex;gap:8px;margin:16px 0 28px}.filters button{border:1px solid var(--line);border-radius:25px;background:transparent;padding:7px 18px;color:var(--muted)}.filters button[aria-pressed=true]{background:var(--text);color:var(--page)}.day{font-size:11px;letter-spacing:2px;color:var(--muted);margin:22px 0 8px}.feed{position:relative}.notice{position:relative;margin-left:21px;border-left:1px solid var(--line);padding:0 0 12px 28px}.notice:before{content:'';position:absolute;width:9px;height:9px;border:2px solid var(--muted);border-radius:50%;left:-6px;top:28px;background:var(--page)}.notice.unread:before{border-color:var(--accent);background:var(--accent)}details{border:1px solid transparent;border-radius:12px;padding:18px 20px;background:var(--surface)}details[open]{border-color:var(--line)}summary{list-style:none;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start}summary::-webkit-details-marker{display:none}.type{font-size:10px;display:inline-block;line-height:1.5;border:1px solid var(--line);border-radius:5px;padding:2px 7px;margin-bottom:7px;color:var(--green);letter-spacing:1px}.notice:nth-child(2) .type,.notice:nth-child(4) .type{color:var(--accent)}.title{font-size:15px;font-weight:600}.time{font-size:11px;color:var(--muted);white-space:nowrap;padding-top:4px}.detail{font-size:13px;color:var(--muted);margin-top:15px;padding-top:15px;border-top:1px solid var(--line)}.read-label{font-size:10px;display:block;margin-top:4px;color:var(--muted)}.unread .read-label{color:var(--accent)}.empty{padding:60px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}.status{color:var(--green);font-size:12px}@media(max-width:900px){.layout{grid-template-columns:170px 1fr;gap:30px}.shell{padding:24px}.rail{padding-right:20px}.huge{font-size:82px}}@media(max-width:600px){.layout{display:block}.rail{border:0;display:flex;gap:18px;align-items:center;margin-bottom:30px}.rail .aside,.tower,.rail p{display:none}.rail h1{font-size:22px}.huge{font-size:46px}.topline{align-items:start}.notice{padding-left:18px}.shell{padding:20px}.mast small{display:none}}
</style></head><body><div class="shell"><header class="mast"><div class="brand"><i>◒</i> 信号塔 <small>　SIGNAL</small></div><small>舟行工作室　／　星期六 · 09.05</small><span>林　<span aria-hidden="true">●</span></span></header><div class="layout"><aside class="rail"><svg class="tower" viewBox="0 0 70 86" aria-hidden="true"><path d="M35 10 15 76h40L35 10M24 45h22M20 61h30M35 24v52" fill="none" stroke="#FF9A5B" stroke-width="2"/><circle cx="35" cy="10" r="5" fill="#FF9A5B"/><path d="M21 5q-10 12 0 23M49 5q10 12 0 23" fill="none" stroke="#B5A99B"/></svg><h1>通知中心</h1><div class="huge" id="count">04</div><p>条未读信号</p><div class="aside">让重要的事<br>在这里找到你。<br><br>所有时间均为北京时间</div></aside><main><div class="topline"><div><small style="color:var(--muted)">你的工作，正在向前。</small><h2>最近发生的事</h2></div><button class="primary" id="readall">全部标为已读 ↗</button></div><div class="filters" aria-label="通知过滤"><button data-filter="all" aria-pressed="true">全部通知</button><button data-filter="unread" aria-pressed="false">只看未读</button></div><p class="status" id="notice-status" role="status">4 条新消息，已按时间排序</p><p class="day">今天　/　9 月 5 日</p><div class="feed" id="feed"></div><p class="empty" id="empty" hidden>已经全部读完。<br>下一条好消息，稍后再见。</p></main></div></div><script>
const notices=[['协作邀请','许知邀请你加入「秋日出版计划」','10:42','项目共有 8 位成员。你将以编辑身份参与内容与排期，邀请在 9 月 12 日前有效。',true],['安全提醒','新设备已登录你的账号','09:38','登录设备：Windows · 北京。若非本人操作，请到账号安全中结束其他会话。',true],['项目更新','「山间书店」第二版已交付','09:16','周弈上传了 12 张设计稿，并整理了首页、目录与阅读页的变更说明。',true],['账单动态','本月订阅收据已生成','08:30','工作室方案 ¥129.00 已支付。账单周期为 9 月 5 日至 10 月 4 日，电子收据已归档。',true],['有人提及你','陈叶在封面讨论中提到了你','昨天','“封面的留白很合适，想请你再看一下书脊文字的位置。”',false],['每周摘要','上周，你们完成了 16 个任务','昨天','按时完成率 94%，比上一周多交付 3 个任务。下一周有 2 个项目即将进入评审。',false]];let filter='all';const feed=document.querySelector('#feed');feed.innerHTML=notices.map((n,i)=>`<article class="notice ${n[4]?'unread':''}" data-i="${i}"><details><summary><div><span class="type">${n[0]}</span><div class="title">${n[1]}</div></div><div class="time">${n[2]}<span class="read-label">${n[4]?'未读':'已读'}</span></div></summary><p class="detail">${n[3]}</p></details></article>`).join('');function update(){const count=notices.filter(n=>n[4]).length;document.querySelector('#count').textContent=String(count).padStart(2,'0');document.querySelector('#readall').disabled=!count;let visible=0;feed.querySelectorAll('.notice').forEach(el=>{const unread=notices[+el.dataset.i][4];el.classList.toggle('unread',unread);el.querySelector('.read-label').textContent=unread?'未读':'已读';el.hidden=filter==='unread'&&!unread&&!el.querySelector('details').open;if(!el.hidden)visible++});document.querySelector('#empty').hidden=filter!=='unread'||visible>0}feed.querySelectorAll('details').forEach((el,i)=>el.addEventListener('toggle',()=>{if(el.open){notices[i][4]=false;document.querySelector('#notice-status').textContent='已读：'+notices[i][1]}update()}));document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.setAttribute('aria-pressed',x===b));update()});document.querySelector('#readall').onclick=()=>{notices.forEach(n=>n[4]=false);update();document.querySelector('#notice-status').textContent='全部 6 条通知已标为已读'};
</script></body></html>
