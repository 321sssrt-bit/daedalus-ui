<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>线电 · 消息抵达之前</title><style>
*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button,a,input,select,textarea{-webkit-tap-highlight-color:transparent}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:4px}[hidden]{display:none!important}svg{max-width:100%}button{transition:filter 140ms ease}button:hover:not(:disabled){filter:brightness(.93)}

:root{--page:#daddd6;--surface:#fcfcf8;--text:#20261e;--muted:#6e786c;--accent:#638b15;--lime:#d8fa77;--line:#d6dccf;--error:#ae3e30}body{padding:32px;background:var(--page);color:var(--text);font:14px/1.5 "Segoe UI","Microsoft YaHei",sans-serif}.phone{width:390px;min-height:844px;margin:auto;border:1px solid #929d88;background:var(--surface);box-shadow:9px 9px 0 #b6bdb0;display:flex;flex-direction:column}.status{height:35px;display:flex;justify-content:space-between;align-items:center;padding:0 20px;font:11px Consolas,monospace}header{height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-top:1px solid var(--line);border-bottom:2px solid var(--text)}header strong{font-size:27px;letter-spacing:-1px}header small{font:10px Consolas,monospace;letter-spacing:1px}button{color:var(--text)}.micro{font-size:10px;color:var(--muted);letter-spacing:2px}.intro{padding:28px 21px 18px}.intro h1{font-size:31px;line-height:1.2;margin:9px 0;font-weight:500;letter-spacing:-1px}.intro p{color:var(--muted);font-size:12px}.avatar{height:48px;width:48px;flex:none;display:grid;place-items:center;background:var(--lime);border:1px solid var(--text);font-size:23px}.convo{width:100%;display:flex;align-items:center;gap:15px;padding:21px 20px;text-align:left;border:0;border-top:1px solid var(--line);background:none}.convo .words{flex:1;min-width:0}.convo b{display:block;margin-bottom:6px}.convo p{font-size:12px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}.convo time{font:10px Consolas,monospace;color:var(--muted)}.list-note{margin:30px 20px;border:1px dashed var(--muted);padding:18px;font-size:12px;color:var(--muted)}.stripe{height:7px;background:repeating-linear-gradient(135deg,var(--text),var(--text) 2px,transparent 2px,transparent 8px);margin:20px}.bottom{margin-top:auto;padding:20px;border-top:1px solid var(--text);display:flex;justify-content:space-between;font-size:11px}.bottom span:first-child{font-weight:700}.back{background:none;border:0;font-size:26px;padding:0 10px 0 0}.chat-head{display:flex;align-items:center}.chat-head b{font-size:18px}.online{font-size:10px;color:var(--accent)}#chat{flex:1;display:flex;flex-direction:column}.chat-banner{padding:12px 20px;background:#edf0e6;border-bottom:1px solid var(--line);font-size:11px;color:var(--muted)}.thread{padding:17px 17px 10px;min-height:400px;max-height:540px;overflow-y:auto;scrollbar-width:thin}.day{text-align:center;font:10px Consolas,monospace;color:var(--muted);margin:9px 0 23px}.message{margin-bottom:20px;max-width:90%;overflow-wrap:anywhere}.message.mine{margin-left:auto;text-align:right}.bubble{display:inline-block;text-align:left;background:#edf0e6;padding:12px 14px;border:1px solid var(--line);white-space:pre-wrap}.mine .bubble{background:var(--lime);border-color:var(--text)}.delivery{font-size:10px;color:var(--muted);padding-top:5px}.delivery.failed{color:var(--error)}.retry{border:0;background:transparent;color:var(--error);font-size:11px;text-decoration:underline;padding:5px 0 5px 10px}.compose{margin-top:auto;border-top:1px solid var(--text);padding:14px 17px 20px}.compose-row{display:flex;align-items:end;gap:10px}textarea{resize:vertical;min-height:55px;max-height:150px;width:100%;padding:10px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:14px}.send{border:1px solid var(--text);background:var(--text);color:var(--lime);padding:17px 13px;flex:none}.test{border:0;background:transparent;color:var(--muted);font-size:11px;padding:13px 0 0}.test[aria-pressed=true]{color:var(--error)}.status-line{min-height:20px;font-size:11px;color:var(--muted);padding-top:8px}@media(max-width:600px){body{padding:0;background:var(--surface)}.phone{width:100%;min-height:100dvh;border:0;box-shadow:none}.thread{max-height:calc(100dvh - 300px);min-height:310px}}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style></head><body>
<main class="phone"><div class="status"><span>09:41</span><span>LTE ▰</span></div><header><div id="brand"><strong>线电</strong> <small>WIRE / 03</small></div><div id="chatHeading" class="chat-head" hidden><button class="back" id="back" aria-label="返回会话列表">‹</button><b id="chatName"></b></div><span class="online">● 在线</span></header>
<section id="list"><div class="intro"><div class="micro">小小屏幕 / 保持联络</div><h1>今天，也有回音。</h1><p>三段对话，等你接上。</p></div><button class="convo" data-convo="0"><span class="avatar">芥</span><span class="words"><b>小芥</b><p id="preview0">周六去河边吧，带上野餐垫。</p></span><time>09:36</time></button><button class="convo" data-convo="1"><span class="avatar" style="background:#e0e4f1">周</span><span class="words"><b>周行</b><p id="preview1">新版海报看到了，明天聊。</p></span><time>08:12</time></button><button class="convo" data-convo="2"><span class="avatar" style="background:#f0d6bc">修</span><span class="words"><b>修理小队</b><p id="preview2">下午三点，老地方集合。</p></span><time>昨天</time></button><div class="list-note">↗ 对话不必很长。<br>一句“收到”，也能让人安心。</div><div class="stripe"></div></section>
<section id="chat" hidden><div class="chat-banner">此处是离线对话体验，消息不会发给真实联系人。</div><div id="messages" class="thread" aria-live="polite"></div><div class="compose"><div class="compose-row"><textarea id="message" maxlength="800" aria-label="编辑消息" placeholder="接着说点什么…"></textarea><button id="send" class="send" disabled>发送 ↑</button></div><button class="test" id="failNext" aria-pressed="false">◇ 体验异常：让下一条发送失败</button><div id="composeStatus" class="status-line" role="status"></div></div></section><footer id="footer" class="bottom"><span>● 消息</span><span>03 段联络 / 本地体验</span></footer></main>
<script>
'use strict';
const $=id=>document.getElementById(id);

const contacts=['小芥','周行','修理小队'];const threads=[[{text:'周六去河边吧，带上野餐垫。',mine:false},{text:'好呀，我再带些水果。',mine:true,status:'已送达'}],[{text:'新版海报看到了，明天聊。',mine:false}],[{text:'下午三点，老地方集合。',mine:false}]];let current=0,fail=false,sequence=0;
function render(){const box=$('messages');box.replaceChildren();const day=document.createElement('div');day.className='day';day.textContent='今天 / 09:41';box.append(day);threads[current].forEach(m=>{const article=document.createElement('article');article.className='message'+(m.mine?' mine':'');if(m.id)article.dataset.messageId=m.id;const bubble=document.createElement('div');bubble.className='bubble';bubble.textContent=m.text;article.append(bubble);if(m.mine){const state=document.createElement('div');state.className='delivery'+(m.status==='未送达'?' failed':'');state.textContent=m.status;article.append(state);if(m.status==='未送达'){const retry=document.createElement('button');retry.className='retry';retry.textContent='重试发送';retry.onclick=()=>{const conversation=current;m.status='重试中';render();setTimeout(()=>{m.status='已送达';if(current!==conversation||$('chat').hidden)return;render();$('composeStatus').textContent='原消息已重新送达，没有重复创建。'},450)};state.append(retry)}}box.append(article)});box.scrollTop=box.scrollHeight}
function openConversation(i){current=i;$('list').hidden=true;$('footer').hidden=true;$('brand').hidden=true;$('chatHeading').hidden=false;$('chat').hidden=false;$('chatName').textContent=contacts[i];$('message').value='';$('send').disabled=true;$('composeStatus').textContent='';render()}
document.querySelectorAll('[data-convo]').forEach(b=>b.onclick=()=>openConversation(Number(b.dataset.convo)));
$('back').onclick=()=>{$('list').hidden=false;$('footer').hidden=false;$('brand').hidden=false;$('chatHeading').hidden=true;$('chat').hidden=true;threads.forEach((t,i)=>$('preview'+i).textContent=t[t.length-1].text)};
$('message').oninput=()=>{$('send').disabled=!$('message').value.trim()};$('failNext').onclick=()=>{fail=!fail;$('failNext').setAttribute('aria-pressed',fail);$('failNext').textContent=fail?'● 下一条会断线；点此取消':'◇ 体验异常：让下一条发送失败'};
$('send').onclick=()=>{const text=$('message').value.trim();if(!text)return;const m={id:++sequence,text,mine:true,status:'发送中'};const conversation=current;threads[conversation].push(m);const failThis=fail;fail=false;$('failNext').setAttribute('aria-pressed','false');$('failNext').textContent='◇ 体验异常：让下一条发送失败';$('message').value='';$('send').disabled=true;$('composeStatus').textContent='';render();setTimeout(()=>{m.status=failThis?'未送达':'已送达';if(current!==conversation||$('chat').hidden)return;render();$('composeStatus').textContent=failThis?'发送中断，内容已保留。请点击原消息下的重试。':'消息已送达。'},650)};

</script></body></html>
