<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>货舱素材上传</title><style>*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button,a,input,select,textarea{-webkit-tap-highlight-color:transparent}button,a{touch-action:manipulation}button{cursor:pointer}button:disabled{cursor:not-allowed}a{color:inherit}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--focus,var(--accent));outline-offset:4px}[hidden]{display:none!important}button:hover:not(:disabled){filter:brightness(.94)}svg{display:block;max-width:100%}label{cursor:pointer}p{line-height:1.65}input,textarea,select{max-width:100%}textarea{resize:vertical}button{min-height:44px}::selection{background:var(--accent);color:var(--page)}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
:root{--page:#f2f2ef;--surface:#ffffff;--text:#171916;--muted:#666c61;--accent:#ff6b24;--line:#c9cdc5;--green:#42672d;--focus:#2158ad}body{background:var(--page);font-family:system-ui,"Microsoft YaHei",sans-serif;color:var(--text)}.top{background:var(--text);color:var(--surface);height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 max(40px,calc((100vw - 1120px)/2))}.logo{font-size:24px;font-weight:900;letter-spacing:3px}.tag{font:11px monospace;color:#bcc4b8}.canvas{max-width:1120px;margin:auto;padding:43px 0}.heading{display:flex;align-items:end;justify-content:space-between;margin-bottom:28px}.heading small{font:12px monospace;letter-spacing:1px}h1{font-size:50px;letter-spacing:-2px;line-height:1.15;margin:10px 0 0;font-weight:900}.stamp{border:2px solid var(--text);padding:10px 17px;transform:rotate(-4deg);font-size:12px;font-weight:700}.workspace{display:grid;grid-template-columns:1fr 370px;gap:26px}.bay{background:var(--accent);border:2px solid var(--text);min-height:386px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:42px 25px;text-align:center}.bay:before,.bay:after{content:'';position:absolute;left:0;right:0;height:12px;background:repeating-linear-gradient(135deg,var(--text) 0 10px,var(--accent) 10px 20px)}.bay:before{top:0}.bay:after{bottom:0}.bay.drag{background:#ffc5a8}.crate{width:96px;height:88px;margin-bottom:21px}.bay h2{font-size:27px;font-weight:850;margin:0 0 11px}.bay p{font-size:12px;margin:0 0 25px}.bay button{background:var(--text);color:var(--surface);border:0;padding:12px 28px;font-weight:750}.bay input{display:none}.counter{background:var(--surface);border:1px solid var(--line);padding:26px;display:flex;flex-direction:column}.counter h2{font:12px monospace;letter-spacing:1px;margin:0}.count{font-size:96px;font-weight:900;line-height:1.2;letter-spacing:-8px;margin-top:16px}.count span{font-size:14px;letter-spacing:0;margin-left:12px;font-weight:500}.summary{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:17px;font-size:12px;margin-bottom:26px}.counter .start{margin-top:auto;border:0;background:var(--text);color:var(--surface);font-weight:700;padding:15px}.counter .start:disabled{background:var(--line);color:var(--muted)}.manifest{margin-top:31px}.manifest-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}.manifest h2{font-size:15px;margin:0}.manifest small{font:11px monospace;color:var(--muted)}.file{display:grid;grid-template-columns:50px minmax(0,1fr) 85px 110px 64px;gap:14px;align-items:center;border-top:1px solid var(--line);min-height:78px}.ext{border:1px solid var(--text);font-size:10px;font-weight:800;padding:12px 0;text-align:center;background:var(--surface)}.name{font-weight:650;font-size:14px;overflow-wrap:anywhere}.name small{display:block;margin-top:6px;font-size:10px;color:var(--muted);font-weight:400}.size,.state{font-size:12px}.state.done{color:var(--green)}.state.bad{color:#a42d15}.remove{border:0;background:transparent;color:var(--muted);font-size:12px}.remove:disabled{opacity:.4}.notice{border-top:2px solid var(--text);padding-top:16px;font-size:12px;display:flex;justify-content:space-between;gap:20px;color:var(--muted);margin-top:5px}#queueStatus{color:var(--green)}@media(max-width:1200px){.canvas{margin:0 40px}}@media(max-width:900px){.workspace{grid-template-columns:1fr 250px;gap:20px}.heading h1{font-size:44px}.counter{padding:22px}.bay{min-height:340px}.count{font-size:82px}.file{grid-template-columns:42px minmax(0,1fr) 66px 90px 50px;gap:10px}.stamp{font-size:10px}}@media(max-width:640px){.top{padding:0 22px}.tag{display:none}.canvas{margin:0 22px}.workspace{grid-template-columns:1fr}.counter{display:grid;grid-template-columns:1fr 1fr;gap:12px}.counter h2,.summary{grid-column:1/-1}.count{font-size:55px;margin:0}.counter .start{margin:0}.stamp{display:none}.heading h1{font-size:38px}.file{grid-template-columns:34px minmax(0,1fr) 55px}.size{grid-column:2;grid-row:auto}.state{grid-column:2}.remove{grid-column:3;grid-row:1/4}.notice{display:block}}
</style></head><body><header class="top"><div class="logo">货舱 CARGO</div><div class="tag">素材中转站　/　BAY 03　/　LOCAL</div></header><main class="canvas"><div class="heading"><div><small>新建批次　·　CG—0905—03</small><h1>好东西，装进来。</h1></div><div class="stamp">今日开放接收<br>素材整备 · 03 号舱</div></div><div class="workspace"><section class="bay" id="dropzone" aria-label="文件拖放区"><svg class="crate" viewBox="0 0 100 90" aria-hidden="true"><path d="M8 29 50 6 92 29v39L50 89 8 68Z M8 29l42 23 42-23M50 52v37M28 18l43 24v15" fill="none" stroke="currentColor" stroke-width="3"/><path d="M42 26h16M50 18v16" stroke="currentColor" stroke-width="3"/></svg><h2>把文件拖到这里</h2><p>图像、PDF 与 SVG · 单个不超过 50 MB</p><button id="choose" type="button">选择本机文件　＋</button><input id="files" type="file" multiple accept="image/*,.pdf,.svg" aria-label="选择素材文件"></section><aside class="counter"><h2>本次货单 / MANIFEST</h2><div class="count"><b id="count">02</b><span>份素材</span></div><div class="summary"><span>总载量</span><strong id="total">21.0 MB</strong></div><button class="start" id="process">开始处理　→</button></aside></div><section class="manifest"><div class="manifest-head"><h2>等待装舱的文件</h2><small>格式检查 → 本地整理 → 就绪</small></div><div id="queue"></div></section><div class="notice"><span>文件仅在本页整理，不会上传至任何服务器。</span><span id="queueStatus" role="status">两份示例素材已准备好</span></div></main><script>
let queue=[{name:'山脊品牌主视觉.png',bytes:18.4*1048576,state:'待处理',sample:true},{name:'秋季展陈手册.pdf',bytes:2.6*1048576,state:'待处理',sample:true}],busy=false;const host=document.querySelector('#queue'),status=document.querySelector('#queueStatus');
function render(){host.replaceChildren();queue.forEach((file,i)=>{const row=document.createElement('div');row.className='file';const ext=document.createElement('span');ext.className='ext';ext.textContent=file.name.split('.').pop().toUpperCase().slice(0,5);const name=document.createElement('div');name.className='name';name.textContent=file.name;const hint=document.createElement('small');hint.textContent=file.sample?'示例素材 · 本地演示':'本机文件 · 不会上传';name.append(hint);const size=document.createElement('span');size.className='size';size.textContent=(file.bytes/1048576).toFixed(1)+' MB';const state=document.createElement('span');state.className='state'+(file.state==='已就绪'?' done':file.error?' bad':'');state.textContent=file.state;const remove=document.createElement('button');remove.className='remove';remove.textContent='移除';remove.setAttribute('aria-label','移除 '+file.name);remove.disabled=busy;remove.onclick=()=>{queue.splice(i,1);render();status.textContent='已移除 '+file.name};row.append(ext,name,size,state,remove);host.append(row)});document.querySelector('#count').textContent=String(queue.length).padStart(2,'0');document.querySelector('#total').textContent=(queue.reduce((s,f)=>s+f.bytes,0)/1048576).toFixed(1)+' MB';const start=document.querySelector('#process');start.disabled=busy||!queue.some(f=>f.state==='待处理');start.textContent=busy?'正在整理…':'开始处理　→';document.querySelector('#choose').disabled=busy;if(!queue.length)host.textContent='货单还是空的。选择文件，开始装舱。'}
function add(files){if(busy)return;for(const file of files){let error=file.size>50*1048576?'超过 50 MB':(!/^image\//.test(file.type)&&!(/\.(pdf|svg|png|jpe?g|gif|webp|avif)$/i).test(file.name)?'不支持的格式':'');queue.push({name:file.name,bytes:file.size,state:error||'待处理',error})}render();status.textContent='货单已更新，请检查文件状态'}
const picker=document.querySelector('#files');document.querySelector('#choose').onclick=()=>picker.click();picker.onchange=()=>{add(picker.files);picker.value=''};const zone=document.querySelector('#dropzone');zone.ondragover=e=>{e.preventDefault();if(!busy)zone.classList.add('drag')};zone.ondragleave=()=>zone.classList.remove('drag');zone.ondrop=e=>{e.preventDefault();zone.classList.remove('drag');add(e.dataTransfer.files)};
document.querySelector('#process').onclick=()=>{busy=true;queue.filter(f=>f.state==='待处理').forEach(f=>f.state='整理中');render();status.textContent='正在检查并整理本地素材…';setTimeout(()=>{queue.filter(f=>f.state==='整理中').forEach(f=>f.state='已就绪');busy=false;render();status.textContent='本地整理完成 · '+queue.filter(f=>f.state==='已就绪').length+' 份素材已就绪'},1400)};render();
</script></body></html>
