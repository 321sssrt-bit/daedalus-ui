<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>窗边 · 让天气靠近一点</title><style>*{box-sizing:border-box}body{margin:0;font:15px/1.6 "Segoe UI","Microsoft YaHei",sans-serif;color:var(--text);background:var(--page)}button,input,textarea,select{font:inherit}button{cursor:pointer;min-height:44px}button:hover{filter:brightness(.94)}button:active{transform:translateY(1px)}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}[hidden]{display:none!important}button,input,textarea,select{color:inherit}svg{max-width:100%}h1,h2,h3,p{margin-top:0}button{transition:filter .15s ease}input,textarea{min-width:0}a{color:inherit}label{display:block}small{font-size:12px}dialog{color:var(--text);border:1px solid var(--muted)}dialog::backdrop{background:rgba(0,0,0,.45)}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
 :root{--page:#dcecf0;--surface:#f5fbfc;--text:#1d4755;--muted:#537885;--accent:#176379;--line:#a8cbd4;--soft:#bce3ed}.weather{max-width:1220px;margin:auto;padding:32px 46px;min-height:800px}.bar{display:flex;justify-content:space-between;align-items:center;font-size:12px}.logo{font-size:22px;font-weight:650;letter-spacing:3px}.scene{position:relative;margin-top:35px;min-height:636px;display:grid;grid-template-columns:1.1fr 1fr;gap:36px;align-items:center}.sky{height:610px;background:linear-gradient(155deg,var(--surface),var(--soft));border:1px solid var(--line);border-radius:130px 130px 8px 8px;position:relative;overflow:hidden;padding:45px 35px;display:flex;flex-direction:column;justify-content:space-between}.sky:before{content:"";position:absolute;left:50%;top:0;height:100%;border-left:8px solid var(--surface)}.sky:after{content:"";position:absolute;left:0;right:0;top:44%;border-top:8px solid var(--surface)}.sun{position:absolute;top:84px;left:105px;width:120px;height:120px;border-radius:50%;background:var(--surface);box-shadow:0 0 70px 22px var(--surface)}.hill{position:absolute;bottom:-100px;width:780px;height:330px;border-radius:50%;background:var(--line);left:-140px;transform:rotate(-14deg)}.hill.second{bottom:-215px;background:var(--accent);left:-10px}.sky-label,.temperature{position:relative;z-index:1}.sky-label{text-align:center;font-size:11px;letter-spacing:4px}.temperature{padding:0 0 24px;color:var(--text)}.temperature strong{font:88px/1.05 Georgia,serif;font-weight:400;letter-spacing:-5px}.temperature p{font-size:13px;margin-top:14px}.permission{position:relative;margin-left:-95px;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:35px;box-shadow:0 20px 48px #1d475518;z-index:2;max-width:470px}.icon{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;font-size:26px;background:var(--soft);color:var(--accent);margin-bottom:25px}.permission h1{font-size:29px;line-height:1.45;font-weight:600;letter-spacing:-1px}.permission p{font-size:13px;color:var(--muted)}.usage{display:flex;gap:10px;align-items:flex-start;padding:18px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:24px 0;font-size:12px}.usage b{display:block;font-weight:650}.primary{width:100%;border:0;border-radius:12px;padding:12px;background:var(--accent);color:var(--surface)}.secondary{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px;background:transparent;margin-top:10px}.deny{display:block;margin:7px auto 0;background:none;border:0;color:var(--muted);font-size:12px}.foot{position:absolute;bottom:0;right:0;font-size:11px;color:var(--muted)}.forecast{display:flex;justify-content:space-between;padding:20px 0;border-top:1px solid var(--line);margin-top:25px;font-size:12px;text-align:center}.forecast b{font-size:20px;display:block;margin-top:8px}.location-select{margin:20px 0}.location-select select{display:block;width:100%;margin-top:8px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:8px}@media(max-width:900px){.weather{padding:28px}.scene{grid-template-columns:1fr 1.15fr;gap:0}.sky{height:600px;padding:35px 20px}.permission{margin-left:-55px;padding:28px}.temperature strong{font-size:70px}.sun{left:45px}.permission h1{font-size:26px}}@media(max-width:620px){.scene{display:block;margin-top:24px;padding-bottom:35px}.sky{height:340px;border-radius:80px 80px 8px 8px}.temperature strong{font-size:64px}.permission{margin:-70px 12px 20px;max-width:none}.foot{left:12px;right:auto}.sky-label{display:none}.sun{top:40px}.temperature{padding-top:110px}}</style></head><body><main class="weather"><header class="bar"><div class="logo">☷ 窗边</div><span>每一次抬头，都有好天气。</span></header><div class="scene"><section class="sky" aria-label="窗景天气"><div class="sun" aria-hidden="true"></div><div class="hill" aria-hidden="true"></div><div class="hill second" aria-hidden="true"></div><div class="sky-label">A LITTLE CLOSER TO THE SKY</div><div class="temperature"><strong>24°</strong><p id="sky-city">杭州 · 晴间多云<br>适合把今天，过得慢一点。</p></div></section><section class="permission"><div id="request"><div class="icon" aria-hidden="true">⌾</div><h1>让天气，<br>刚好在你身边。</h1><p>允许窗边使用你的位置，为你显示附近天气、日落时间与临近降雨提醒。</p><div class="usage"><span>↳</span><div><b>只为眼前的天气</b><span>位置用于匹配所在城市，你可以随时更改。</span></div></div><button class="primary" id="allow">允许使用当前位置</button><button class="secondary" id="once">仅此一次</button><button class="deny" id="deny">暂不允许，手动选城市</button></div><div id="result" hidden aria-live="polite"><div class="icon" aria-hidden="true">☀</div><h1 id="result-title"></h1><p id="result-text"></p><label class="location-select" id="city-control" hidden>选择城市<select id="city"><option>杭州</option><option>苏州</option><option>厦门</option></select></label><div class="forecast"><div>现在<b>24°</b></div><div>15:00<b>26°</b></div><div>18:00<b>23°</b></div></div><p id="permission-state"></p><button class="secondary" id="preferences">更改位置偏好</button></div></section><footer class="foot">日落 18:21　·　微风 2 级　·　空气清新</footer></div></main><script>
const $=s=>document.querySelector(s);let mode='manual';function renderCity(){const city=mode==='manual'?$('#city').value:'杭州';$('#sky-city').replaceChildren(document.createTextNode(city+' · 晴间多云'),document.createElement('br'),document.createTextNode('适合把今天，过得慢一点。'));$('#result-text').textContent=mode==='manual'?'未使用你的位置。正在查看手动选择的'+city+'天气。':city+' · 晴间多云。接下来两小时无降雨，出门走走正好。'}function set(next){mode=next;$('#request').hidden=true;$('#result').hidden=false;$('#city-control').hidden=mode!=='manual';$('#result-title').textContent=mode==='manual'?'选一座你关心的城。':'现在，天气离你更近。';renderCity();$('#permission-state').textContent=mode==='once'?'位置权限：仅本次查看有效。':mode==='allow'?'位置权限：已允许；可在此更改。':'位置权限：未允许；当前使用手动城市。'}$('#allow').onclick=()=>set('allow');$('#once').onclick=()=>set('once');$('#deny').onclick=()=>set('manual');$('#preferences').onclick=()=>{$('#request').hidden=false;$('#result').hidden=true};$('#city').onchange=renderCity;
</script></body></html>
