<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>收藏夹 · cabinet-oddities</title><style>*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.6}button,input,select,textarea{font:inherit}button,a,input,select,summary{touch-action:manipulation}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}button,a{color:inherit}button{transition:background .16s ease,color .16s ease,transform .16s ease}button:hover:not(:disabled){filter:brightness(.94)}:focus-visible{outline:3px solid var(--accent);outline-offset:4px}h1,h2,h3,p{margin:0}svg{max-width:100%;height:auto}button,select,input{min-height:40px}a{text-decoration:none}small{font-size:12px}button[aria-pressed=true]{font-weight:700}[hidden]{display:none!important}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}dialog{border:1px solid var(--line);padding:32px;max-width:min(580px,90vw);color:var(--text);background:var(--surface)}dialog::backdrop{background:#00000080}dialog .close{float:right}.status{min-height:24px}summary{cursor:pointer}input,select,textarea{max-width:100%}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

:root{--page:#2E2822;--surface:#45392E;--text:#F0E3C9;--muted:#B3A187;--accent:#83C2B8;--line:#675441;--sand:#DCCBAD;--paper:#EEE5D2;--rust:#B97853}body{background:var(--page);color:var(--text)}.room{max-width:1180px;margin:auto;padding:28px 42px}.header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:20px}.logo{font-family:Georgia,"SimSun",serif;font-size:23px;letter-spacing:3px}.header small{font-size:10px;letter-spacing:3px;color:var(--muted)}.intro{display:flex;justify-content:space-between;align-items:end;margin:32px 0 24px}.intro h1{font-family:Georgia,"SimSun",serif;font-size:43px;font-weight:400;line-height:1.3}.intro p{font-size:12px;color:var(--muted);margin-top:12px}.count{font-family:Georgia,serif;font-size:54px;line-height:1;color:var(--accent)}.count small{font-family:"Segoe UI",sans-serif;font-size:10px;color:var(--muted);letter-spacing:2px;display:block;text-align:right;margin-top:8px}.toolbar{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:20px}.filters{display:flex;gap:9px}.filters button{background:transparent;border:1px solid var(--line);border-radius:2px;padding:6px 17px;font-size:12px;color:var(--muted)}.filters button[aria-pressed=true]{background:var(--sand);border-color:var(--sand);color:var(--page)}.status{font-size:11px;color:var(--accent)}.cabinet{display:grid;grid-template-columns:repeat(12,1fr);gap:13px;background:#211B16;padding:15px;border:1px solid var(--line);box-shadow:inset 0 0 0 5px var(--surface)}.specimen{grid-column:span 4;background:var(--surface);position:relative;min-height:236px;box-shadow:inset 0 9px 14px #00000028;border-bottom:8px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:end;padding:18px 17px 13px}.specimen:first-child{grid-column:span 5}.specimen:nth-child(2){grid-column:span 3}.specimen:nth-child(3){grid-column:span 4}.specimen:nth-child(4){grid-column:span 3}.specimen:nth-child(5){grid-column:span 5}.specimen:nth-child(6){grid-column:span 4}.specimen svg{height:160px;width:190px;filter:drop-shadow(0 12px 8px #00000040)}.label{background:var(--sand);color:var(--page);font-size:10px;letter-spacing:.6px;padding:5px 12px;box-shadow:0 1px 3px #00000030;min-width:134px;text-align:center;margin-top:12px}.remove{position:absolute;right:10px;top:9px;border:0;background:transparent;color:var(--muted);min-height:32px;width:32px;font-size:20px}.remove:hover{color:var(--text);background:#211B16}.category-tag{position:absolute;left:14px;top:13px;color:var(--muted);font-size:9px;letter-spacing:1px}.undo{background:transparent;border:0;color:var(--accent);padding:0 5px;text-decoration:underline;font-size:11px}.empty{grid-column:1/-1;min-height:250px;display:grid;place-items:center;text-align:center;color:var(--muted)}.footer{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:22px;letter-spacing:1px}@media(max-width:900px){.room{padding:24px}.intro h1{font-size:36px}.cabinet{grid-template-columns:repeat(6,1fr);gap:10px;padding:12px}.specimen,.specimen:first-child,.specimen:nth-child(n){grid-column:span 3;min-height:240px}.toolbar{align-items:start}.status{max-width:220px}}@media(max-width:540px){.room{padding:20px}.header small{display:none}.intro h1{font-size:30px}.count{font-size:40px}.toolbar{display:block}.filters{flex-wrap:wrap}.status{max-width:none;margin-top:10px}.cabinet{gap:8px;padding:10px}.specimen{padding:16px 8px 12px}.specimen svg{height:125px;width:145px}.label{min-width:0;width:100%;font-size:9px;padding:4px}.footer span:last-child{display:none}}
</style></head><body><div class="room"><header class="header"><div class="logo">奇物柜 <small> CABINET OF ODDITIES</small></div><small>收藏，也是一种观察。</small><span>私人藏室　No. 23</span></header><main><section class="intro"><div><small style="color:var(--accent);letter-spacing:3px">林的收藏</small><h1>把喜欢，安放妥当。</h1><p>路上遇见的物件、书页与灵光，都在这里。</p></div><div class="count"><span id="count">06</span><small>件心头好</small></div></section><div class="toolbar"><div class="filters" aria-label="收藏分类"><button data-filter="全部" aria-pressed="true">全部藏品</button><button data-filter="器物" aria-pressed="false">器物</button><button data-filter="阅读" aria-pressed="false">阅读</button><button data-filter="灵感" aria-pressed="false">灵感</button></div><div class="status" role="status"><span id="status">按收藏时间排列</span><button class="undo" id="undo" hidden>撤销</button></div></div><section class="cabinet" id="cabinet" aria-label="收藏物件"></section></main><footer class="footer"><span>每一格，都留着一次心动。</span><span>收藏记录保留于本次浏览会话</span></footer></div><script>
const art=[`<path d="M42 124Q40 41 99 27q40 14 58 97-53 32-115 0" fill="#EEE5D2"/><path d="M99 28v119M99 30Q57 76 57 132M99 30q42 47 44 102M99 29q-22 50-22 114M99 29q22 48 21 114" stroke="#B3A187" stroke-width="2" fill="none"/>`,`<path d="M64 35h73v62H64z" fill="#B97853"/><path d="M55 95h91v17H55zM64 110l-5 53M137 110l7 53" fill="none" stroke="#DCCBAD" stroke-width="8"/><path d="M74 40v46M90 40v46M106 40v46M123 40v46" stroke="#45392E" stroke-width="5"/>`,`<g transform="rotate(-9 100 90)"><rect x="44" y="24" width="112" height="145" fill="#83C2B8"/><path d="M56 24v145" stroke="#2E2822"/><text x="77" y="60" font-size="17" fill="#2E2822" font-family="SimSun,serif">器物</text><text x="77" y="85" font-size="17" fill="#2E2822" font-family="SimSun,serif">小史</text><circle cx="110" cy="128" r="19" fill="#EEE5D2"/></g>`,`<path d="M77 30h46v47q31 28 22 79-42 18-89 0-9-51 21-79V30" fill="#83C2B8"/><ellipse cx="100" cy="31" rx="23" ry="7" fill="#45392E"/><path d="M71 96q-7 27-4 45" stroke="#EEE5D2" stroke-width="5" fill="none" opacity=".6"/>`,`<g transform="rotate(5 100 90)"><rect x="22" y="23" width="156" height="137" fill="#EEE5D2"/><rect x="32" y="33" width="136" height="101" fill="#B3A187"/><path d="M32 116 81 50 116 98l26-35 26 43v28H32" fill="#45392E"/><circle cx="138" cy="58" r="13" fill="#DCCBAD"/><text x="68" y="150" font-size="8" fill="#2E2822" letter-spacing="2">MOUNTAIN / 1984</text></g>`,`<path d="M68 35h65l26 71H42l26-71" fill="#DCCBAD"/><path d="M100 105v51M70 161h60" stroke="#B97853" stroke-width="9" stroke-linecap="round"/><path d="M49 105h102" stroke="#EEE5D2" stroke-width="3"/>`];const objects=[['海边拾来的扇贝','器物'],['弯木小椅','器物'],['器物小史 · 初版','阅读'],['青釉长颈瓶','器物'],['山的另一面','灵感'],['午后蘑菇灯','灵感']];let removed=new Set(),filter='全部',last=null;try{removed=new Set(JSON.parse(sessionStorage.getItem('cabinet-oddities-removed')||'[]'))}catch{}function render(){const list=objects.map((o,i)=>[o,i]).filter(([o,i])=>!removed.has(i)&&(filter==='全部'||o[1]===filter));document.querySelector('#cabinet').innerHTML=list.length?list.map(([o,i])=>`<article class="specimen"><span class="category-tag">${o[1]} / 0${i+1}</span><button class="remove" data-remove="${i}" aria-label="移除${o[0]}">×</button><svg viewBox="0 0 200 180" aria-label="${o[0]}" role="img">${art[i]}</svg><div class="label">${o[0]}</div></article>`).join(''):'<div class="empty">这一格暂时空着。<br>换个分类，看看其他收藏。</div>';document.querySelector('#count').textContent=String(6-removed.size).padStart(2,'0');document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{last=+b.dataset.remove;removed.add(last);try{sessionStorage.setItem('cabinet-oddities-removed',JSON.stringify([...removed]))}catch{}render();document.querySelector('#status').textContent='已移除「'+objects[last][0]+'」';document.querySelector('#undo').hidden=false})}render();document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.setAttribute('aria-pressed',x===b));render();document.querySelector('#status').textContent=filter+'收藏'});document.querySelector('#undo').onclick=()=>{if(last===null)return;removed.delete(last);try{sessionStorage.setItem('cabinet-oddities-removed',JSON.stringify([...removed]))}catch{}document.querySelector('#status').textContent='已放回「'+objects[last][0]+'」';last=null;document.querySelector('#undo').hidden=true;render()};
</script></body></html>
