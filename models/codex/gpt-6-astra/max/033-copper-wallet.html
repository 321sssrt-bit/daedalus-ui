<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>铜币钱夹</title><style>*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button,a,input,select,textarea{-webkit-tap-highlight-color:transparent}button,a{touch-action:manipulation}button{cursor:pointer}button:disabled{cursor:not-allowed}a{color:inherit}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--focus,var(--accent));outline-offset:4px}[hidden]{display:none!important}button:hover:not(:disabled){filter:brightness(.94)}svg{display:block;max-width:100%}label{cursor:pointer}p{line-height:1.65}input,textarea,select{max-width:100%}textarea{resize:vertical}button{min-height:44px}::selection{background:var(--accent);color:var(--page)}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}body{background:#d9d6d0;display:grid;place-items:start center;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}.phone{width:100%;max-width:430px;min-height:100svh;position:relative;overflow:hidden}.statusbar{height:38px;padding:12px 25px 0;display:flex;justify-content:space-between;font-size:11px;font-weight:700;letter-spacing:.7px}.phone button,.phone input,.phone select{min-height:44px}@media(min-width:600px){body{padding:28px}.phone{width:390px;min-height:844px;border:8px solid #25272a;border-radius:42px;box-shadow:0 26px 70px #00000026}.statusbar{padding-top:13px;height:41px}}
:root{--page:#f7f0e3;--surface:#fffaf2;--text:#4b3024;--muted:#987b66;--accent:#b46c42;--line:#deccb6;--green:#617751;--focus:#355e83}.phone{background:var(--page);color:var(--text)}.wallet{padding:18px 25px 100px}.topline{display:flex;justify-content:space-between;align-items:center;margin:4px 0 33px}.wordmark{font-family:Georgia,"SimSun",serif;font-size:23px;letter-spacing:3px}.avatar{border:1px solid var(--line);border-radius:50%;width:40px;height:40px;display:grid;place-items:center;font:14px Georgia,serif;background:#eddfc9}.balance small{font-size:11px;letter-spacing:2px;color:var(--muted)}.balance h1{font-size:49px;font-weight:400;letter-spacing:-2.7px;margin:13px 0 0;font-variant-numeric:tabular-nums;line-height:1.15}.balance h1 sup{font-size:22px;vertical-align:super;margin-right:5px;letter-spacing:0}.balance .caption{display:flex;justify-content:space-between;align-items:center;font-size:10px;color:var(--muted);margin-top:15px}.caption i{font-style:normal;color:var(--green)}.coins{height:90px;margin:15px 0 1px;position:relative;overflow:hidden;display:flex;justify-content:flex-end}.coin{height:102px;width:102px;min-width:102px;border:1px solid #c89970;border-radius:50%;display:grid;place-items:center;position:relative;background:radial-gradient(circle,#dfb78a 0 43%,#eccba5 44% 51%,#d8aa7b 52% 54%,#e7c29b 55%);box-shadow:inset 2px 2px 5px #fff4db99}.coin:after{content:'铜';border:1px solid #ac7547;border-radius:50%;height:66px;width:66px;display:grid;place-items:center;font:36px Georgia,"SimSun",serif;color:#a67345}.coin:first-child{margin-right:-40px;transform:translateY(22px)}.coin:last-child{transform:translateY(4px)}.quick{display:grid;grid-template-columns:1fr 1fr;gap:13px;padding-top:13px}.quick button{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:10px;padding:16px 10px;font-size:13px}.quick button:first-child{background:var(--text);border-color:var(--text);color:var(--surface)}.quick span{margin-right:12px;font-size:19px}.transactions{margin-top:29px}.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.section-head h2{font-size:16px;font-weight:600;margin:0}.section-head button{font-size:11px;padding:0;border:0;background:transparent;color:var(--muted);min-height:44px}.day{font-size:10px;color:var(--muted);margin:17px 0 6px}.transaction{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.transaction .icon{height:35px;width:35px;min-width:35px;border-radius:50%;background:#eadfce;display:grid;place-items:center;font-size:14px}.transaction .desc{min-width:0;flex:1;overflow-wrap:anywhere}.transaction b{font-size:12px;font-weight:550;display:block}.transaction small{font-size:9px;color:var(--muted);display:block;margin-top:5px}.amount{margin-left:auto;flex-shrink:0;font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}.amount.in{color:var(--green)}.nav{position:absolute;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(3,1fr);background:var(--page);padding:10px 15px 19px;border-top:1px solid var(--line)}.nav button{border:0;background:transparent;font-size:10px;color:var(--muted);padding:2px}.nav .active{color:var(--accent)}.nav button span{font-size:20px;display:block;margin-bottom:5px}.view-title{font:32px Georgia,"SimSun",serif;margin:20px 0 28px}.profile-card{padding:25px 0;border-bottom:1px solid var(--line);font-size:13px}.profile-card strong{font-size:30px;font-weight:400;display:block;margin:12px 0}.profile-card p{color:var(--muted);font-size:12px}.note{font-size:10px;color:var(--muted);margin-top:25px}dialog{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:20px;padding:27px;width:calc(100% - 36px);max-width:350px}dialog::backdrop{background:#4b302466}dialog h2{font:25px Georgia,"SimSun",serif;margin:0 0 18px}dialog label{font-size:12px;display:block;margin:16px 0}dialog input{width:100%;display:block;padding:12px;border:1px solid var(--line);border-radius:7px;background:var(--page);margin-top:8px}dialog button{padding:12px;border:0;border-radius:7px;background:var(--text);color:var(--surface);width:100%;margin-top:8px}dialog .secondary{background:transparent;color:var(--muted);border:1px solid var(--line)}dialog p{font-size:12px}.account-code{font:24px monospace;letter-spacing:4px;padding:25px 0;text-align:center;background:var(--page)}#transferMessage{color:#a34237;min-height:20px}
</style></head><body><div class="phone"><div class="statusbar"><span>9:41</span><span>●●●　▰</span></div><main class="wallet"><header class="topline"><div class="wordmark">铜币钱夹</div><div class="avatar" aria-label="林的账户">林</div></header><section id="walletView"><div class="balance"><small>随身余额 · CNY</small><h1><sup>¥</sup><span id="balance">12,860.50</span></h1><div class="caption"><span>每一笔，都心中有数。</span><i>● 账户正常</i></div></div><div class="coins" aria-hidden="true"><div class="coin"></div><div class="coin"></div></div><div class="quick"><button id="transfer"><span>↗</span>转出</button><button id="receive"><span>↙</span>收款</button></div><section class="transactions"><div class="section-head"><h2>最近的来往</h2><button id="allTransactions">全部流水 ↗</button></div><div id="recent"></div></section></section><section id="historyView" hidden><h1 class="view-title">钱去了哪里。</h1><div id="history"></div></section><section id="mineView" hidden><h1 class="view-title">你好，林。</h1><div class="profile-card">铜币账户<strong>TB · 8802</strong><p>常用钱夹 · 人民币<br>账户状态：正常</p></div><div class="profile-card">本月记账<p>3 类日常来往，慢慢积累生活。</p></div><p class="note">本页为本地钱夹演示，转出不会产生真实资金交易。</p></section></main><nav class="nav" aria-label="钱夹导航"><button data-view="wallet" class="active"><span>▣</span>钱夹</button><button data-view="history"><span>≡</span>流水</button><button data-view="mine"><span>◌</span>我的</button></nav></div><dialog id="transferDialog"><h2>转一笔给朋友</h2><form id="transferForm"><label>收款人<input id="recipient" required maxlength="30" placeholder="例如：唐梨"></label><label>金额（元）<input id="amount" type="number" min="0.01" step="0.01" required placeholder="0.00"></label><p>本地演示，不会转出真实资金。</p><p id="transferMessage" role="status"></p><button type="submit">确认转出</button><button type="button" class="secondary" id="cancelTransfer">取消</button></form></dialog><dialog id="receiveDialog"><h2>把来往，记在这里。</h2><p>向朋友出示你的铜币收款号</p><div class="account-code">TB 8802</div><p>林的日常钱夹 · 演示收款号</p><button id="closeReceive">收好</button></dialog><script>
let cents=1286050;const transactions=[{day:'今天',name:'街角咖啡',note:'08:42 · 日常消费',amount:-2800,icon:'☕'},{day:'今天',name:'唐梨的转账',note:'08:10 · 朋友来往',amount:26000,icon:'↙'},{day:'昨天',name:'山野书店',note:'19:26 · 阅读与生活',amount:-6800,icon:'▤'}];const money=n=>(n/100).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
function render(){document.querySelector('#balance').textContent=money(cents);['recent','history'].forEach(id=>{const host=document.getElementById(id);host.replaceChildren();let day='';transactions.forEach(t=>{if(day!==t.day){const label=document.createElement('p');label.className='day';label.textContent=t.day;host.append(label);day=t.day}const row=document.createElement('div');row.className='transaction';const icon=document.createElement('span');icon.className='icon';icon.textContent=t.icon;const desc=document.createElement('div');desc.className='desc';const name=document.createElement('b');name.textContent=t.name;const note=document.createElement('small');note.textContent=t.note;desc.append(name,note);const amount=document.createElement('span');amount.className='amount'+(t.amount>0?' in':'');amount.textContent=(t.amount>0?'+':'−')+money(Math.abs(t.amount));row.append(icon,desc,amount);host.append(row)})})}
function view(name){['wallet','history','mine'].forEach(id=>document.getElementById(id+'View').hidden=id!==name);document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===name))}document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>view(b.dataset.view));document.querySelector('#allTransactions').onclick=()=>view('history');const dialog=document.querySelector('#transferDialog');document.querySelector('#transfer').onclick=()=>{document.querySelector('#transferMessage').textContent='可用余额 ¥'+money(cents);dialog.showModal()};document.querySelector('#cancelTransfer').onclick=()=>dialog.close();document.querySelector('#transferForm').onsubmit=e=>{e.preventDefault();const recipient=document.querySelector('#recipient').value.trim();if(!recipient){document.querySelector('#transferMessage').textContent='请填写收款人姓名，不能只输入空格。';document.querySelector('#recipient').focus();return}const value=Math.round(Number(document.querySelector('#amount').value)*100);if(!Number.isFinite(value)||value<=0||value>cents){document.querySelector('#transferMessage').textContent='金额需大于 0 且不超过可用余额 ¥'+money(cents);return}cents-=value;transactions.unshift({day:'今天',name:'转给 '+recipient,note:'刚刚 · 本地演示',amount:-value,icon:'↗'});render();dialog.close();e.target.reset()};document.querySelector('#receive').onclick=()=>document.querySelector('#receiveDialog').showModal();document.querySelector('#closeReceive').onclick=()=>document.querySelector('#receiveDialog').close();render();
</script></body></html>
