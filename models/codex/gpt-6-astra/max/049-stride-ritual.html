<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>步迹 · 把一点点走成习惯</title><style>
*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button,a,input,select,textarea{-webkit-tap-highlight-color:transparent}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:4px}[hidden]{display:none!important}svg{max-width:100%}button{transition:filter 140ms ease}button:hover:not(:disabled){filter:brightness(.93)}

:root{--page:#e2e1cf;--surface:#faf8ec;--text:#303727;--muted:#7e826e;--accent:#64722c;--citrus:#d8dd70;--line:#dcdcca;--soft:#efefdc;--error:#ae4832}body{padding:32px;background:var(--page);color:var(--text);font:14px/1.5 "Segoe UI","Microsoft YaHei",sans-serif}.phone{width:390px;min-height:844px;margin:auto;background:var(--surface);border-radius:34px;overflow:hidden;box-shadow:0 18px 45px #30372720}.status{display:flex;justify-content:space-between;padding:14px 24px 0;font-size:10px}header{display:flex;justify-content:space-between;align-items:center;padding:20px 24px}.brand{font-size:28px;letter-spacing:-1px;font-weight:750}.week{font:10px Consolas,monospace;color:var(--muted);letter-spacing:1px}main{padding:0 22px 25px}.hello{font-size:12px;color:var(--muted);margin:0 0 17px}.goal{padding:22px;border-radius:21px;background:var(--citrus);display:grid;grid-template-columns:1fr 124px;align-items:center;gap:5px}.goal label{font-size:11px}.goal strong{font-size:58px;line-height:1.1;display:block;letter-spacing:-3px;margin:12px 0 7px;font-weight:500}.goal p{font-size:11px;margin:0}.ring{width:124px;height:124px;position:relative}.ring svg{width:124px;height:124px;transform:rotate(-90deg)}.ring span{position:absolute;inset:0;display:grid;place-items:center;font:25px Consolas,monospace}.summary{font-size:11px;margin:13px 0 24px;color:var(--muted);display:flex;justify-content:space-between}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}h1,h2{font-size:16px;margin:0;font-weight:600}.section-head small{font-size:10px;color:var(--muted)}.chart{display:grid;grid-template-columns:repeat(7,1fr);gap:12px;padding:0 2px 16px;border-bottom:1px solid var(--line)}.day{display:flex;flex-direction:column;align-items:center}.bar-space{height:84px;width:100%;display:flex;align-items:end}.bar{width:100%;height:2px;background:#babf9d;border-radius:3px 3px 0 0}.day:last-child .bar{background:var(--accent)}.day b{font:10px Consolas,monospace;font-weight:400;height:19px;color:var(--muted)}.day small{font-size:9px;color:var(--muted);margin-top:7px}.record-form{padding-top:24px}.record-form label{display:block;font-size:11px;margin:15px 0 8px;color:var(--muted)}.input-row{display:flex;align-items:center;border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:10px}.input-row input{width:100%;min-width:0;border:0;background:transparent;color:var(--text);font-size:25px;padding:4px 0}.input-row span{font-size:12px;color:var(--muted);flex:none}.hint{font-size:10px;color:var(--muted);margin:8px 0}.primary{margin-top:15px;width:100%;border:0;border-radius:10px;padding:14px;background:var(--text);color:var(--surface);font-weight:600}.demo{border:0;background:none;color:var(--muted);font-size:10px;padding:13px 0;text-decoration:underline}.error{color:var(--error);background:#f6e2d4;font-size:12px;padding:13px;border-radius:9px;margin-top:12px}.saved{padding:15px;background:var(--soft);border-left:3px solid var(--accent);font-size:12px;margin-top:15px}.records{margin-top:20px}.record{padding:13px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;font-size:12px}.record small{font-size:10px;color:var(--muted)}.footer{font-size:10px;color:var(--muted);margin-top:18px;display:flex;justify-content:space-between}@media(max-width:600px){body{padding:0;background:var(--surface)}.phone{width:100%;min-height:100dvh;border-radius:0;box-shadow:none}}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style></head><body>
<div class="phone"><div class="status"><span>9:41</span><span>●● ▰</span></div><header><div class="brand">步迹 /</div><span class="week">WEEK 36 · 走一点就好</span></header><main><p class="hello">把一点点，走成日常里的好习惯。</p><section class="goal"><div><label>本周累计步行</label><strong id="total">95</strong><p>分钟 / 周目标 150 分钟</p></div><div class="ring" id="goalProgress" role="progressbar" aria-label="每周步行目标" aria-valuemin="0" aria-valuemax="150" aria-valuenow="95"><svg viewBox="0 0 124 124" aria-hidden="true"><circle cx="62" cy="62" r="50" fill="none" stroke="#bdc359" stroke-width="7"/><circle id="arc" cx="62" cy="62" r="50" fill="none" stroke="#303727" stroke-width="7" stroke-linecap="round" stroke-dasharray="198.97 314.16"/></svg><span id="percent">63%</span></div></section><div class="summary"><span id="remaining">离目标还差 55 分钟</span><span>每一步都算数 ↗</span></div><section><div class="section-head"><h1>七天的脚印</h1><small>每日总时长 / 分钟</small></div><div id="chart" class="chart" role="img" aria-label="近七天步行趋势"></div></section><form id="recordForm" class="record-form" novalidate><div class="section-head"><h2>记下刚才的步行</h2><small>今天 · 09/05</small></div><label for="minutes">活动时长</label><div class="input-row"><input id="minutes" type="number" inputmode="numeric" min="1" max="180" step="1" required placeholder="例如 30" aria-describedby="rangeHint dataError"><span>分钟</span></div><p class="hint" id="rangeHint">单次可记录 1–180 分钟的整数；更长活动请分次记录。</p><div id="dataError" class="error" role="alert" hidden></div><button class="primary" type="submit">保存这一步 ＋</button><button class="demo" id="invalid" type="button">体验无效数据：填入 999 分钟</button></form><div id="saved" class="saved" role="status" hidden></div><section id="recordList" class="records" aria-label="本页已保存活动"></section><footer class="footer"><span>本页体验记录 · 刷新后重置</span><span>慢慢走，也很好</span></footer></main></div>
<script>
'use strict';
const $=id=>document.getElementById(id);

const days=['日','一','二','三','四','五','六'];let daily=[20,10,25,0,30,10,0],records=[];const target=150;
function render(){const total=daily.reduce((a,b)=>a+b,0),pct=Math.round(total/target*100),visible=Math.min(100,pct);$('total').textContent=total;$('percent').textContent=visible+'%';$('goalProgress').setAttribute('aria-valuenow',Math.min(target,total));$('goalProgress').setAttribute('aria-valuetext',total+'分钟，目标'+target+'分钟');$('arc').setAttribute('stroke-dasharray',(Math.min(1,total/target)*314.159)+' 314.159');$('remaining').textContent=total>=target?'本周目标已达成，多走的也为你记下':'离目标还差 '+(target-total)+' 分钟';$('chart').replaceChildren();const max=Math.max(30,...daily);daily.forEach((n,i)=>{const day=document.createElement('div');day.className='day';day.dataset.minutes=n;day.innerHTML='<b></b><div class="bar-space"><div class="bar"></div></div><small></small>';day.querySelector('b').textContent=n;day.querySelector('.bar').style.height=Math.max(2,n/max*84)+'px';day.querySelector('small').textContent=days[i];$('chart').append(day)});$('chart').setAttribute('aria-label','近七天分钟数：'+daily.join('、'));$('recordList').replaceChildren();records.slice().reverse().forEach(r=>{const row=document.createElement('div');row.className='record';const label=document.createElement('span');label.textContent='步行 · '+r.minutes+' 分钟';const time=document.createElement('small');time.textContent=r.time;row.append(label,time);$('recordList').append(row)})}
$('invalid').onclick=()=>{$('minutes').value='999';$('minutes').focus()};$('recordForm').onsubmit=e=>{e.preventDefault();const raw=$('minutes').value.trim(),n=Number(raw);if(!/^\d+$/.test(raw)||!Number.isInteger(n)||n<1||n>180){$('dataError').textContent='活动时长无效。请填写 1–180 的整数分钟；本周进度没有改变。';$('dataError').hidden=false;$('minutes').setAttribute('aria-invalid','true');$('minutes').focus();return}daily[6]+=n;records.push({minutes:n,time:new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})});$('dataError').hidden=true;$('minutes').removeAttribute('aria-invalid');$('minutes').value='';render();$('saved').textContent='已保存 '+n+' 分钟步行。本周累计 '+daily.reduce((a,b)=>a+b,0)+' 分钟，今日趋势已更新。';$('saved').hidden=false};render();

</script></body></html>
