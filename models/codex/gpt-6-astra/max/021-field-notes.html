<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>内容目录 · field-notes</title><style>*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.6}button,input,select,textarea{font:inherit}button,a,input,select,summary{touch-action:manipulation}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}button,a{color:inherit}button{transition:background .16s ease,color .16s ease,transform .16s ease}button:hover:not(:disabled){filter:brightness(.94)}:focus-visible{outline:3px solid var(--accent);outline-offset:4px}h1,h2,h3,p{margin:0}svg{max-width:100%;height:auto}button,select,input{min-height:40px}a{text-decoration:none}small{font-size:12px}button[aria-pressed=true]{font-weight:700}[hidden]{display:none!important}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}dialog{border:1px solid var(--line);padding:32px;max-width:min(580px,90vw);color:var(--text);background:var(--surface)}dialog::backdrop{background:#00000080}dialog .close{float:right}.status{min-height:24px}summary{cursor:pointer}input,select,textarea{max-width:100%}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

:root{--page:#F5F3EC;--surface:#FFFEF9;--text:#282824;--muted:#77786E;--accent:#A83B32;--line:#BEBEB0;--sage:#D8DECB;--gray:#E4E2D8}body{background:var(--page);color:var(--text)}.paper{max-width:1120px;margin:auto;padding:24px 38px}.mast{display:flex;justify-content:space-between;align-items:center;border-top:4px solid var(--text);border-bottom:1px solid var(--text);padding:14px 0}.name{font-family:Georgia,"SimSun",serif;font-size:29px;letter-spacing:7px}.mast small{font-size:10px;color:var(--muted);letter-spacing:1px}.issue{display:grid;grid-template-columns:160px 1fr 190px;gap:32px;align-items:center;border-bottom:1px solid var(--text);padding:32px 0}.issue-no{font-family:Georgia,serif;font-size:112px;line-height:1;color:var(--accent);letter-spacing:-10px}.issue h1{font-family:Georgia,"SimSun",serif;font-size:43px;font-weight:400;line-height:1.35}.issue p{font-size:12px;color:var(--muted);margin-top:12px}.issue-art{width:180px}.body-grid{display:grid;grid-template-columns:190px 1fr;gap:36px;padding-top:26px}.editor-note{font-size:12px;line-height:1.9;color:var(--muted)}.editor-note h2{font-size:12px;letter-spacing:2px;color:var(--accent);margin-bottom:17px}.editor-note .rule{width:35px;height:2px;background:var(--accent);margin:22px 0}.editor-note b{font-family:Georgia,"SimSun",serif;font-size:18px;font-weight:400;color:var(--text)}.contents-label{display:flex;justify-content:space-between;font-size:10px;letter-spacing:2px;color:var(--muted);padding-bottom:12px;border-bottom:1px solid var(--line)}details{border-bottom:1px solid var(--line)}summary{list-style:none;display:grid;grid-template-columns:38px 1fr 80px;gap:16px;align-items:center;padding:21px 0}summary::-webkit-details-marker{display:none}.no{font-family:Georgia,serif;color:var(--accent);font-size:16px}.article-title{font-family:Georgia,"SimSun",serif;font-size:22px;line-height:1.4}.meta{font-size:10px;color:var(--muted);margin-top:6px;letter-spacing:.3px}.read{font-size:11px;text-align:right;color:var(--muted)}details[open] .read{color:var(--accent)}details[open]{background:var(--surface)}details[open] summary{padding-bottom:13px}.excerpt{margin-left:54px;padding:0 20px 22px 0;max-width:560px;font-size:13px;line-height:1.9;color:var(--muted)}.excerpt b{color:var(--text);font-weight:400}.footer{display:flex;justify-content:space-between;border-top:3px solid var(--text);padding-top:15px;margin-top:34px;font-size:10px;color:var(--muted)}@media(max-width:900px){.paper{padding:22px 24px}.issue{grid-template-columns:110px 1fr 130px;gap:24px}.issue-no{font-size:90px}.issue h1{font-size:33px}.body-grid{grid-template-columns:145px 1fr;gap:24px}.article-title{font-size:20px}summary{grid-template-columns:28px 1fr 55px;gap:12px}.excerpt{margin-left:40px}}@media(max-width:560px){.mast small{display:none}.issue{grid-template-columns:90px 1fr;gap:20px}.issue-art{display:none}.issue h1{font-size:29px}.body-grid{display:block}.editor-note{display:none}summary{grid-template-columns:25px 1fr 45px;gap:8px}.article-title{font-size:19px}.footer span:last-child{display:none}}
</style></head><body><div class="paper"><header class="mast"><small>观察日常，记录远方</small><div class="name">田野志</div><small>独立观察季刊　／　2026 秋</small></header><main><section class="issue"><div class="issue-no">06</div><div><small style="letter-spacing:3px;color:var(--accent)">本期专题　/　缓慢发生</small><h1>在更慢的地方，<br>重新看见生活。</h1><p>五篇田野笔记，关于土地、手艺，以及人与地方的关系。</p></div><svg class="issue-art" viewBox="0 0 200 170" role="img" aria-label="田间植物木刻风插画"><rect x="5" y="5" width="190" height="160" fill="#D8DECB"/><path d="M17 130q55-32 167 0M17 142q66-29 167 0M17 153q72-24 167 0" fill="none" stroke="#77786E"/><path d="M100 140V35M100 89Q60 82 56 57q36-7 44 32M100 67q28-35 51-29-7 28-51 29M100 120q-51-5-51-35 39-2 51 35M100 102q28-38 63-27-10 35-63 27" fill="#282824"/><circle cx="38" cy="30" r="11" fill="#A83B32"/></svg></section><div class="body-grid"><aside class="editor-note"><h2>编者的话</h2><b>把目光放低一点。</b><p>这一期，我们走向城市以外。不是寻找一个答案，而是记下那些正在认真生活的人。</p><div class="rule"></div><p>撰文 / 五位在地作者<br>整理 / 田野志编辑部<br>出版 / 二〇二六年秋</p><br><p>点击目录，<br>翻开每一篇的引言。</p></aside><section><div class="contents-label"><span>本期目录　CONTENTS</span><span>共 5 篇</span></div><div id="articles"></div></section></div></main><footer class="footer"><span>田野志 · 让观察有回声</span><span>ISSUE 06　／　AUTUMN 2026　／　INDEPENDENT JOURNAL</span></footer></div><script>
const articles=[['泥土里的时间','林棠','浙江松阳','12 分钟','在茶园最安静的清晨，我们跟着叶师傅上山。四十年的种植经验不写在日历上，而是写在每一片叶子的颜色、每一场雨落下的时机里。','土地'],['最后一家竹器铺','周予','四川崇州','9 分钟','老街转角的竹器铺还开着。劈竹、起底、收口，陈师傅用一天编一只篮子。我们记录这些动作，也记录一门手艺如何在新的日常里继续生长。','手艺'],['一条河的两种名字','沈溪','福建屏南','11 分钟','地图给河流一个名字，村里的人给它另一个。沿着水声走访六个村落，我们听见迁徙、丰收与记忆如何流进同一条河。','地方'],['山里学校的午餐','陈北','云南腾冲','8 分钟','十一点半，厨房升起蒸汽。土豆来自隔壁的田，青菜是老师和孩子一起种的。一顿普通的午餐，串起了学校与村庄的关系。','日常'],['夜色降临之后','许宁','广西龙胜','10 分钟','当田间的小路只剩虫鸣，人们搬出椅子，慢慢聊完白天没有说完的话。夜晚的公共生活很轻，却把一个地方紧紧连在一起。','人物']];document.querySelector('#articles').innerHTML=articles.map((a,i)=>`<details><summary><span class="no">0${i+1}</span><div><h2 class="article-title">${a[0]}</h2><p class="meta">${a[1]} · ${a[2]}　／　${a[5]}</p></div><span class="read">${a[3]}<br><span class="toggle-label">展开 ＋</span></span></summary><p class="excerpt"><b>摘要</b>　${a[4]}</p></details>`).join('');document.querySelectorAll('details').forEach(d=>d.addEventListener('toggle',()=>d.querySelector('.toggle-label').textContent=d.open?'收起 −':'展开 ＋'));
</script></body></html>
