<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>风筝清单</title><style>*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button,a,input,select,textarea{-webkit-tap-highlight-color:transparent}button,a{touch-action:manipulation}button{cursor:pointer}button:disabled{cursor:not-allowed}a{color:inherit}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--focus,var(--accent));outline-offset:4px}[hidden]{display:none!important}button:hover:not(:disabled){filter:brightness(.94)}svg{display:block;max-width:100%}label{cursor:pointer}p{line-height:1.65}input,textarea,select{max-width:100%}textarea{resize:vertical}button{min-height:44px}::selection{background:var(--accent);color:var(--page)}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}body{background:#d9d6d0;display:grid;place-items:start center;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}.phone{width:100%;max-width:430px;min-height:100svh;position:relative;overflow:hidden}.statusbar{height:38px;padding:12px 25px 0;display:flex;justify-content:space-between;font-size:11px;font-weight:700;letter-spacing:.7px}.phone button,.phone input,.phone select{min-height:44px}@media(min-width:600px){body{padding:28px}.phone{width:390px;min-height:844px;border:8px solid #25272a;border-radius:42px;box-shadow:0 26px 70px #00000026}.statusbar{padding-top:13px;height:41px}}
:root{--page:#edf6fb;--surface:#fffdf4;--text:#29495a;--muted:#7191a2;--accent:#c38b32;--line:#cbdfe8;--sky:#cce8f4;--focus:#946220}.phone{background:var(--page);color:var(--text)}.list-page{padding:19px 25px 169px;min-height:806px}.header{display:flex;justify-content:space-between;align-items:center}.brand{font:21px Georgia,"SimSun",serif;letter-spacing:2px}.date{font-size:10px;color:var(--muted);line-height:1.6;text-align:right}.empty{padding-top:67px;text-align:center}.empty svg{width:250px;height:247px;margin:0 auto 23px}.empty h1{font:29px/1.4 Georgia,"SimSun",serif;font-weight:400;letter-spacing:-1px;margin:0}.empty p{font-size:12px;color:var(--muted);line-height:1.95;margin:17px 0 0}.prompt{font-size:10px;color:var(--muted);text-align:center;margin-top:30px}.bottom{position:absolute;bottom:0;left:0;right:0;background:var(--page)}.add-zone{padding:0 25px 23px}.add-button{width:100%;background:var(--accent);color:var(--surface);border:0;border-radius:28px;padding:14px 18px;font-size:13px;box-shadow:0 4px 0 #946c2b20}.nav{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);padding:11px 25px 19px}.nav button{border:0;background:transparent;color:var(--muted);font-size:10px;min-height:43px;padding:0}.nav span{display:block;font-size:19px;margin-bottom:5px}.nav .active{color:var(--text)}.task-title{font:31px/1.4 Georgia,"SimSun",serif;margin:43px 0 12px}.task-summary{font-size:11px;color:var(--muted);margin:0 0 25px}.item{padding:17px 0;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}.item input{width:20px;height:20px;accent-color:var(--accent);min-height:20px!important;cursor:pointer}.item label{font-size:14px;line-height:1.6;overflow-wrap:anywhere;flex:1}.item.done label{text-decoration:line-through;color:var(--muted)}.item button{border:0;background:transparent;color:var(--muted);font-size:18px;min-width:34px;padding:0}.completed-title{font:30px Georgia,"SimSun",serif;margin:50px 0 18px}.archive-empty{padding:45px 10px;text-align:center;font-size:13px;color:var(--muted);border-top:1px solid var(--line);line-height:1.9}dialog{background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:21px;padding:27px;max-width:350px;width:calc(100% - 36px)}dialog::backdrop{background:#29495a66}dialog h2{font:27px Georgia,"SimSun",serif;margin:0 0 17px}dialog label{font-size:12px}dialog input{display:block;margin:11px 0 20px;padding:13px;border:1px solid var(--line);background:var(--page);border-radius:7px;width:100%}dialog button{display:block;width:100%;border:0;border-radius:7px;background:var(--accent);color:var(--surface);padding:13px}dialog .cancel{background:transparent;color:var(--muted);margin-top:9px}dialog p{font-size:10px;color:var(--muted)}#addMessage{font-size:11px;color:#9a531c}
</style></head><body><div class="phone"><div class="statusbar"><span>9:41</span><span>●●●　▰</span></div><main class="list-page"><header class="header"><div class="brand">风筝清单</div><div class="date">星期六<br>09 / 05</div></header><section id="activeView"><div class="empty" id="empty"><svg viewBox="0 0 260 255" role="img" aria-label="一只姜黄色风筝在淡蓝色天空中飞起"><path d="M21 188q20-11 43-5m111-154q24-10 49-2M36 71q17-10 33-4" fill="none" stroke="#cbdfe8" stroke-width="2" stroke-linecap="round"/><ellipse cx="121" cy="235" rx="46" ry="5" fill="#cce8f4"/><path d="M132 115q-22 29 0 50t-6 55" fill="none" stroke="#7191a2" stroke-width="1.5"/><path d="m89 82 43-63 55 59-50 74Z" fill="#d5a24c" stroke="#ab792f" stroke-width="1.5"/><path d="m132 19 5 133-48-70Z" fill="#e7be72"/><path d="m89 82 98-4M132 19l5 133" fill="none" stroke="#fffdf4" stroke-width="1.2"/><path d="m122 160-12-3 5 13 14-9 9 8 2-14Z" fill="#c38b32"/><path d="m130 199-11-5 2 12 12-5 10 9 2-14Z" fill="#d5a24c"/><path d="m174 19 3-6m29 48 7-2m-2 39 6 3" stroke="#c38b32" stroke-width="1.5"/></svg><h1>今天，还没有<br>被安排的小事。</h1><p>从一件轻轻的小事开始。<br>不必很重要，只要是你想做的。</p><div class="prompt">散个步，或者给一位老朋友打电话。</div></div><section id="listContent" hidden><h1 class="task-title">一点一点，<br>把今天放飞。</h1><p class="task-summary" id="summary"></p><div id="items"></div></section></section><section id="completedView" hidden><h1 class="completed-title">做过的，都是风。</h1><p class="task-summary">这些小事，已经好好完成了。</p><div id="completed"></div></section></main><div class="bottom"><div class="add-zone"><button class="add-button" id="add">＋　写下第一件小事</button></div><nav class="nav" aria-label="清单导航"><button id="activeTab" class="active"><span>◇</span>今天的清单</button><button id="completedTab"><span>✓</span>已完成</button></nav></div></div><dialog id="dialog"><form id="addForm"><h2>想做点什么？</h2><label>这件小事的名字<input id="taskName" required maxlength="80" placeholder="例如：绕远路买一束花"></label><p>一件小事就够了，剩下的慢慢来。</p><p id="addMessage" role="status"></p><button type="submit">放进今天的清单</button><button type="button" class="cancel" id="cancel">先不写了</button></form></dialog><script>
const tasks=[];let completedView=false;function render(){const active=tasks.filter(t=>!t.done);document.querySelector('#empty').hidden=tasks.length>0;document.querySelector('#listContent').hidden=tasks.length===0;document.querySelector('#summary').textContent=active.length+' 件待完成 · '+tasks.filter(t=>t.done).length+' 件已放飞';document.querySelector('#add').textContent=tasks.length?'＋　再写一件小事':'＋　写下第一件小事';['items','completed'].forEach(id=>{const host=document.getElementById(id);host.replaceChildren();tasks.filter(t=>id==='items'||t.done).forEach(t=>{const row=document.createElement('div');row.className='item'+(t.done?' done':'');const box=document.createElement('input');box.type='checkbox';box.checked=t.done;box.id='task-'+t.id+'-'+id;box.onchange=()=>{t.done=box.checked;render()};const label=document.createElement('label');label.htmlFor=box.id;label.textContent=t.name;const remove=document.createElement('button');remove.textContent='×';remove.setAttribute('aria-label','移除 '+t.name);remove.onclick=()=>{tasks.splice(tasks.indexOf(t),1);render()};row.append(box,label,remove);host.append(row)});if(id==='completed'&&!tasks.some(t=>t.done)){const empty=document.createElement('div');empty.className='archive-empty';empty.textContent='这里还没有完成的小事。勾选清单上的一项，它就会来到这里。';host.append(empty)}})}function view(done){completedView=done;document.querySelector('#activeView').hidden=done;document.querySelector('#completedView').hidden=!done;document.querySelector('#activeTab').classList.toggle('active',!done);document.querySelector('#completedTab').classList.toggle('active',done)}document.querySelector('#activeTab').onclick=()=>view(false);document.querySelector('#completedTab').onclick=()=>view(true);const dialog=document.querySelector('#dialog');document.querySelector('#add').onclick=()=>dialog.showModal();document.querySelector('#cancel').onclick=()=>dialog.close();document.querySelector('#addForm').onsubmit=e=>{e.preventDefault();const name=document.querySelector('#taskName').value.trim();if(!name){document.querySelector('#addMessage').textContent='写一个名字，再放进清单。';return}tasks.push({id:Date.now(),name,done:false});render();view(false);dialog.close();e.target.reset()};render();
</script></body></html>
