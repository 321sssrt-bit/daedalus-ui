<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>窑门 · 回到手作</title><style>*{box-sizing:border-box}body{margin:0;font:15px/1.6 "Segoe UI","Microsoft YaHei",sans-serif;color:var(--text);background:var(--page)}button,input,textarea,select{font:inherit}button{cursor:pointer;min-height:44px}button:hover{filter:brightness(.94)}button:active{transform:translateY(1px)}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}[hidden]{display:none!important}button,input,textarea,select{color:inherit}svg{max-width:100%}h1,h2,h3,p{margin-top:0}button{transition:filter .15s ease}input,textarea{min-width:0}a{color:inherit}label{display:block}small{font-size:12px}dialog{color:var(--text);border:1px solid var(--muted)}dialog::backdrop{background:rgba(0,0,0,.45)}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
 :root{--page:#eee8dd;--surface:#faf7f0;--text:#392b23;--muted:#766457;--accent:#9d472e;--line:#d1bca8;--soft:#c97750} .shell{min-height:100vh;display:grid;grid-template-columns:54% 46%}.story{position:relative;overflow:hidden;background:var(--soft);padding:44px 56px;min-height:800px}.wordmark{font-size:20px;font-weight:700;letter-spacing:5px}.eyebrow{font-size:12px;letter-spacing:2px;text-transform:uppercase}.story h1{font:400 76px/1.13 Georgia,"Songti SC",SimSun,serif;margin:54px 0 22px;position:relative;z-index:1}.story p{max-width:260px}.arch{position:absolute;bottom:-52px;right:42px;width:330px;height:434px;border:1px solid var(--text);border-radius:180px 180px 0 0;background:var(--accent)}.arch:before{content:"";position:absolute;inset:24px 22px 0;border:1px solid var(--line);border-radius:160px 160px 0 0}.vase{position:absolute;bottom:77px;right:120px;width:150px;height:177px;background:var(--page);border-radius:20% 20% 44% 44%;transform:rotate(-5deg)}.vase:before{content:"";position:absolute;left:29px;top:-39px;width:92px;height:61px;background:var(--page);border-radius:16px 16px 0 0}.vase:after{content:"";position:absolute;inset:45px 4px 22px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.caption{position:absolute;bottom:38px;left:56px;font-size:11px;writing-mode:vertical-rl;letter-spacing:2px}.entry{background:var(--surface);padding:45px 64px;display:flex;flex-direction:column;justify-content:space-between}.topline{text-align:right;font-size:12px;color:var(--muted)}.formarea{max-width:360px;width:100%;margin:auto}.formarea h2{font:400 38px/1.3 Georgia,"Songti SC",SimSun,serif;margin-bottom:10px}.lede{color:var(--muted);margin-bottom:30px}.field{margin:18px 0}.field span{display:block;font-size:13px;margin-bottom:8px}.field input{width:100%;padding:13px 14px;border:1px solid var(--line);background:transparent;border-radius:2px;height:50px}.primary{background:var(--text);color:var(--surface);border:0;width:100%;padding:13px 20px;border-radius:2px}.under{display:flex;justify-content:space-between;align-items:center;margin:18px 0 26px;font-size:12px}.under label{display:flex;gap:8px;align-items:center}.link{border:0;background:none;padding:0;text-decoration:underline;text-underline-offset:5px;font-size:12px}.foot{padding-top:36px;font-size:11px;color:var(--muted);display:flex;justify-content:space-between}.receipt{border-top:1px solid var(--line);padding-top:20px}.receipt strong{font-family:Georgia,serif;font-size:52px;font-weight:400}.status{color:var(--accent);min-height:24px;margin-top:16px}@media(max-width:900px){.shell{grid-template-columns:45% 55%}.story{padding:32px;min-height:800px}.story h1{font-size:58px}.arch{right:-100px}.vase{right:-10px}.entry{padding:32px}.caption{left:28px}}@media(max-width:600px){.shell{display:block}.story{min-height:320px}.story h1{font-size:44px;margin-top:25px}.story p,.caption,.vase{display:none}.arch{height:260px;width:190px;right:-40px;bottom:-80px}.entry{min-height:580px}.topline{margin-bottom:30px}}</style></head><body><main class="shell"><section class="story" aria-label="窑门陶艺工作室"><div class="wordmark">窑门 <span class="eyebrow">KILN DOOR</span></div><h1>泥土之间，<br>安放自己。</h1><p>让手慢下来。<br>从一团泥，找回生活的形状。</p><div class="arch" aria-hidden="true"></div><div class="vase" aria-hidden="true"></div><div class="caption">杭州 · 河坊街一〇八号　/　手作的日常</div></section><section class="entry"><div class="topline">工作室会员入口　↗</div><div class="formarea"><section id="login"><div class="eyebrow">WELCOME BACK / 01</div><h2>好久不见。</h2><p class="lede">登录，看看你的作品烧好了没有。</p><form id="login-form"><label class="field"><span>电子邮箱</span><input id="email" type="email" autocomplete="username" placeholder="you@example.com" required></label><label class="field"><span>密码</span><input id="password" type="password" autocomplete="current-password" minlength="6" placeholder="至少 6 位字符" required></label><div class="under"><label><input type="checkbox" checked>记住我的邮箱</label><button class="link" id="forgot" type="button">忘记密码了？</button></div><button class="primary" type="submit">推开窑门　→</button></form></section><section id="recover" hidden><div class="eyebrow">FIND YOUR WAY BACK</div><h2>我们寄一封信。</h2><p class="lede">输入会员邮箱，重新找回你的工作台。</p><form id="recover-form"><label class="field"><span>电子邮箱</span><input id="recover-email" type="email" autocomplete="email" required></label><button class="primary">发送重设邮件</button></form><p class="status" id="recover-status" role="status"></p><button class="link" id="back" type="button">← 回到登录</button></section><section id="inside" hidden aria-live="polite"><div class="eyebrow">你的陶艺工作台</div><h2>欢迎回到窑门。</h2><p class="lede" id="member"></p><div class="receipt"><strong>02</strong><p>件作品正在窑中等待<br><small>下次开窑 · 周六 14:00</small></p></div><button class="primary" id="signout">退出工作台</button></section></div><footer class="foot"><span>土与火，皆需耐心。</span><span>© 窑门 2026</span></footer></section></main><script>
const $=s=>document.querySelector(s);$('#login-form').onsubmit=e=>{e.preventDefault();$('#member').textContent=$('#email').value;$('#login').hidden=true;$('#inside').hidden=false};$('#forgot').onclick=()=>{$('#login').hidden=true;$('#recover').hidden=false;$('#recover-email').value=$('#email').value;$('#recover-email').focus()};$('#back').onclick=()=>{$('#recover').hidden=true;$('#login').hidden=false};$('#recover-form').onsubmit=e=>{e.preventDefault();$('#recover-status').textContent='重设邮件已寄往 '+$('#recover-email').value+'，请查收。'};$('#signout').onclick=()=>{$('#inside').hidden=true;$('#login').hidden=false;$('#password').value=''};
</script></body></html>
