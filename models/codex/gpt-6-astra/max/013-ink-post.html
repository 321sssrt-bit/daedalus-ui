<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>墨信 · 收件箱</title><style>*{box-sizing:border-box}body{margin:0;font:15px/1.6 "Segoe UI","Microsoft YaHei",sans-serif;color:var(--text);background:var(--page)}button,input,textarea,select{font:inherit}button{cursor:pointer;min-height:44px}button:hover{filter:brightness(.94)}button:active{transform:translateY(1px)}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}[hidden]{display:none!important}button,input,textarea,select{color:inherit}svg{max-width:100%}h1,h2,h3,p{margin-top:0}button{transition:filter .15s ease}input,textarea{min-width:0}a{color:inherit}label{display:block}small{font-size:12px}dialog{color:var(--text);border:1px solid var(--muted)}dialog::backdrop{background:rgba(0,0,0,.45)}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
 :root{--page:#f3f5f7;--surface:#ffffff;--text:#1d2733;--muted:#667487;--accent:#2459d3;--line:#d8dfe8;--soft:#e9effb}.mail{display:grid;grid-template-columns:180px 330px minmax(0,1fr);min-height:100vh}.rail{background:var(--page);padding:28px 18px;border-right:1px solid var(--line)}.brand{font-size:23px;font-weight:800;margin-bottom:40px}.folders{display:grid;gap:5px}.folders button{display:flex;justify-content:space-between;align-items:center;border:0;background:transparent;border-radius:5px;padding:10px 12px;text-align:left;font-size:12px}.folders button.active{background:var(--accent);color:var(--surface)}.folder-title{color:var(--muted);font-size:10px;letter-spacing:2px;margin:27px 12px 12px}.account{font-size:11px;color:var(--muted);border-top:1px solid var(--line);padding-top:20px;margin-top:325px;overflow-wrap:anywhere}.list-pane{background:var(--surface);border-right:1px solid var(--line)}.list-head{padding:28px 20px 18px;border-bottom:1px solid var(--line)}.list-head h1{font-size:21px;line-height:1.4;margin:0 0 15px;font-weight:650}.filter{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted)}.filter input{accent-color:var(--accent)}.message{display:block;width:100%;border:0;border-bottom:1px solid var(--line);border-radius:0;background:var(--surface);text-align:left;padding:20px;position:relative;min-height:126px}.message.selected{background:var(--soft);box-shadow:inset 3px 0 0 var(--accent)}.message.unread .subject{font-weight:750}.message .sender{font-size:11px;display:flex;justify-content:space-between;color:var(--muted)}.message .subject{display:block;font-size:13px;line-height:1.5;margin:9px 0 6px;font-weight:500}.message .preview{display:block;color:var(--muted);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.unread .sender:before{content:"";width:5px;height:5px;border-radius:50%;background:var(--accent);position:absolute;left:9px;top:26px}.empty-list{padding:30px 20px;font-size:13px;color:var(--muted)}.reader{padding:0 38px;background:var(--surface);min-width:0}.toolbar{display:flex;justify-content:space-between;align-items:center;min-height:78px;border-bottom:1px solid var(--line)}.actions{display:flex;gap:10px}.tool{border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:8px 12px;font-size:11px}.tool[aria-pressed=true]{border-color:var(--accent);color:var(--accent);background:var(--soft)}.toolbar small{color:var(--muted)}.reading{padding-top:35px}.reading h2{font-size:27px;line-height:1.5;font-weight:650;margin-bottom:24px}.from{display:flex;gap:12px;align-items:center;padding-bottom:25px;border-bottom:1px solid var(--line)}.avatar{width:40px;height:40px;display:grid;place-items:center;background:var(--soft);color:var(--accent);font-weight:750;border-radius:5px;flex-shrink:0}.from b{font-size:12px}.from p{font-size:10px;color:var(--muted);margin:4px 0 0}.copy{font-size:14px;line-height:1.95;padding-top:27px;white-space:pre-wrap;overflow-wrap:anywhere}.attachment{display:flex;align-items:center;gap:12px;border:1px solid var(--line);padding:14px;margin-top:26px;font-size:12px}.attachment .file-icon{font-size:22px;color:var(--accent)}.reader-empty{padding-top:70px;color:var(--muted);text-align:center}.notice{color:var(--accent);font-size:11px;min-height:20px;margin:20px 0}@media(max-width:1050px){.mail{grid-template-columns:145px 275px minmax(0,1fr)}.rail{padding:26px 12px}.reader{padding:0 25px}.reading h2{font-size:23px}.message{padding:18px}.toolbar{align-items:flex-start;justify-content:center;flex-direction:column;gap:7px;padding:12px 0}}@media(max-width:850px){.mail{grid-template-columns:250px minmax(0,1fr)}.rail{grid-column:1/-1;padding:15px 24px;display:flex;align-items:center;gap:30px;border-bottom:1px solid var(--line);border-right:0}.brand{margin:0}.folders{display:flex;gap:8px}.folder-title,.account{display:none}.list-head{padding:24px 18px}.reader{padding:0 24px}}@media(max-width:620px){.mail{display:block}.rail{display:block}.folders{margin-top:14px}.list-pane{border-right:0}.list-head{padding:18px}.message{min-height:100px;padding:15px 20px}.reader{border-top:3px solid var(--accent);padding:0 22px 25px}.reading{padding-top:24px}.toolbar{flex-direction:row;justify-content:space-between;align-items:center}}</style></head><body><main class="mail"><aside class="rail"><div class="brand">▱ 墨信</div><nav class="folders" aria-label="邮件文件夹"><button class="active" data-folder="inbox"><span>收件箱</span><b id="inbox-count">5</b></button><button data-folder="starred"><span>已星标</span><b id="star-count">1</b></button><button data-folder="archive"><span>归档</span><b id="archive-count">0</b></button></nav><div class="folder-title">私人工作邮箱</div><small>把消息，读得清楚。</small><div class="account">林青<br>lin.qing@inkpost.cn</div></aside><section class="list-pane"><header class="list-head"><h1 id="folder-title">收件箱</h1><label class="filter"><input type="checkbox" id="unread">仅看未读 <span id="unread-count">3</span></label></header><div id="messages" aria-label="邮件列表"></div></section><section class="reader"><header class="toolbar"><div class="actions"><button class="tool" id="star" aria-pressed="false">☆ 星标</button><button class="tool" id="archive">归档</button></div><small id="position">1 / 5</small></header><article class="reading" id="reading"><h2 id="subject"></h2><div class="from"><div class="avatar" id="avatar"></div><div><b id="sender"></b><p id="sender-email"></p><p id="sent-time"></p></div></div><div class="copy" id="copy"></div><div class="attachment" id="attachment"><span class="file-icon">▤</span><span id="attachment-name"></span></div></article><div class="reader-empty" id="reader-empty" hidden>选一封信，安静地读一会儿。</div><p class="notice" id="notice" role="status"></p></section></main><script>
const $=s=>document.querySelector(s);const mails=[{id:1,sender:'许言',email:'xuyan@fieldwork.cn',subject:'周五的访谈，想再和你对一下',time:'09:24',unread:false,star:false,archive:false,body:'林青，你好：\n\n三位受访者都已确认时间。第一场从下午两点开始，每场约四十五分钟，中间留十五分钟整理笔记。\n\n我把问题提纲放在附件里，标黄的两处想听听你的想法。如果方便，我们中午简单碰一下。\n\n谢谢，\n许言',attachment:'访谈提纲 · 第三版.pdf　/　248 KB'},{id:2,sender:'山间书店',email:'hello@hillbooks.cn',subject:'你预订的那本书，到店了',time:'08:51',unread:true,star:true,archive:false,body:'林青：\n\n《在山野间散步》已经到店，我们替你留在收银台右侧的书架上。\n\n本周营业时间为 11:00—20:00。来时可以先喝杯茶，不必赶时间。\n\n山间书店',attachment:''},{id:3,sender:'阿原',email:'ayuan@littlethings.cn',subject:'秋日刊物封面的两个方向',time:'昨天',unread:true,star:false,archive:false,body:'两个方向都整理好了：\n\n一是用叶脉作为主图，二是把河岸的颜色排成一条长长的色带。\n\n我更倾向第二个，它和这期“重新看见日常”的主题更贴合。等你一起看看。',attachment:'封面方向说明.pdf　/　1.2 MB'},{id:4,sender:'温室社区',email:'team@sunroom.cn',subject:'周日枝条交换，留了一个位置给你',time:'昨天',unread:true,star:false,archive:false,body:'你好，林青：\n\n周日 10:00，我们在温室庭院交换枝条。带两段健康植物，写上名称和养护建议就好。\n\n雨天会移到一号温室，活动照常。期待见到你。',attachment:''},{id:5,sender:'财务小组',email:'finance@fieldwork.cn',subject:'八月项目费用已确认',time:'09/03',unread:false,star:false,archive:false,body:'八月项目费用已全部核对，报销单状态更新为已完成。\n\n感谢你及时补齐交通凭证。相关记录已整理归档，可随时查阅。',attachment:''}];let folder='inbox',selected=1;function visible(){return mails.filter(m=>(folder==='inbox'?!m.archive:folder==='starred'?m.star: m.archive)&&(!$('#unread').checked||m.unread))}function render(){const a=visible();$('#messages').replaceChildren(...a.map(m=>{const b=document.createElement('button');b.className='message'+(m.id===selected?' selected':'')+(m.unread?' unread':'');b.innerHTML='<span class="sender">'+m.sender+'<span>'+m.time+'</span></span><span class="subject">'+(m.star?'★ ':'')+m.subject+'</span><span class="preview">'+m.body.replace(/\n/g,' ').slice(0,50)+'</span>';b.onclick=()=>{selected=m.id;m.unread=false;render()};return b}));if(!a.length){const p=document.createElement('p');p.className='empty-list';p.textContent=$('#unread').checked?'没有未读邮件了。':'这里暂时没有邮件。';$('#messages').append(p)}$('#inbox-count').textContent=mails.filter(m=>!m.archive).length;$('#star-count').textContent=mails.filter(m=>m.star).length;$('#archive-count').textContent=mails.filter(m=>m.archive).length;$('#unread-count').textContent=mails.filter(m=>m.unread&&!m.archive).length;const m=mails.find(m=>m.id===selected);$('#reading').hidden=!m;$('#reader-empty').hidden=!!m;$('#star').disabled=!m;$('#archive').disabled=!m;if(!m){$('#position').textContent='—';return}$('#subject').textContent=m.subject;$('#sender').textContent=m.sender;$('#avatar').textContent=m.sender[0];$('#sender-email').textContent=m.email+' → 我';$('#sent-time').textContent='2026 年 09 月 05 日 · '+m.time;$('#copy').textContent=m.body;$('#attachment').hidden=!m.attachment;$('#attachment-name').textContent=m.attachment;$('#star').textContent=m.star?'★ 已星标':'☆ 星标';$('#star').setAttribute('aria-pressed',m.star);$('#archive').textContent=m.archive?'移回收件箱':'归档';$('#position').textContent=a.some(x=>x.id===selected)?(a.findIndex(x=>x.id===selected)+1)+' / '+a.length:'已打开的邮件'}document.querySelectorAll('[data-folder]').forEach(b=>b.onclick=()=>{folder=b.dataset.folder;$('#folder-title').textContent={inbox:'收件箱',starred:'已星标',archive:'归档'}[folder];document.querySelectorAll('[data-folder]').forEach(x=>x.classList.toggle('active',x===b));selected=visible()[0]?.id??null;if(selected)mails.find(m=>m.id===selected).unread=false;$('#notice').textContent='';render()});$('#unread').onchange=()=>{selected=null;render()};$('#star').onclick=()=>{let m=mails.find(m=>m.id===selected);if(!m)return;m.star=!m.star;$('#notice').textContent=m.star?'已加入星标邮件。':'已取消星标。';render()};$('#archive').onclick=()=>{let m=mails.find(m=>m.id===selected);if(!m)return;m.archive=!m.archive;$('#notice').textContent=m.archive?'邮件已归档，可在归档文件夹找到。':'邮件已移回收件箱。';selected=visible()[0]?.id??null;render()};render();
</script></body></html>
