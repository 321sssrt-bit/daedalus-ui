<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>蓝图工坊 · 事情正在发生</title><style>
*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button,a,input,select,textarea{-webkit-tap-highlight-color:transparent}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:4px}[hidden]{display:none!important}svg{max-width:100%}button{transition:filter 140ms ease}button:hover:not(:disabled){filter:brightness(.93)}

:root{--page:#eeeee4;--surface:#fafbf4;--text:#162354;--muted:#73809a;--accent:#2b45b4;--line:#c4cbdc;--light:#e2e7f5;--error:#ab4a36;--green:#386453}body{background:var(--page);color:var(--text);font:14px/1.5 "Segoe UI","Microsoft YaHei",sans-serif}header{height:78px;padding:0 36px;background:var(--accent);color:var(--surface);display:flex;justify-content:space-between;align-items:center}.brand{font-size:22px;font-weight:700;letter-spacing:1px}.brand span{font:11px Consolas,monospace;margin-left:17px;letter-spacing:2px}.user{font-size:12px}main{max-width:1360px;margin:auto;padding:30px 36px}.title-row{display:flex;justify-content:space-between;align-items:end;border-bottom:2px solid var(--accent);padding-bottom:22px}.tag{font:11px Consolas,monospace;color:var(--accent);letter-spacing:2px}h1{font-size:32px;line-height:1.3;letter-spacing:-1px;margin:10px 0 0;font-weight:500}.stats{display:flex;gap:28px}.stats strong{font:30px Consolas,monospace}.stats small{display:block;color:var(--muted);font-size:10px}.work{display:grid;grid-template-columns:minmax(0,1fr) 265px;gap:25px;margin-top:25px}.new-task{display:flex;gap:10px;padding:18px;background:var(--light);border:1px solid var(--line);align-items:end}.field{flex:1;min-width:0}label{display:block;font-size:10px;color:var(--muted);margin-bottom:6px}input,select{background:var(--surface);border:1px solid var(--line);padding:10px;color:var(--text);border-radius:0;min-width:0}input{width:100%}.primary{background:var(--accent);color:var(--surface);border:1px solid var(--accent);padding:10px 19px;white-space:nowrap}.filter{display:flex;gap:22px;margin:24px 0 10px;align-items:center}.filter button{border:0;background:transparent;color:var(--muted);padding:7px 0;font-size:12px;border-bottom:2px solid transparent}.filter button[aria-pressed=true]{color:var(--accent);border-color:var(--accent)}.filter small{margin-left:auto;color:var(--muted);font-size:10px}.task-table{border-top:1px solid var(--accent);width:100%}.table-head,.task{display:grid;grid-template-columns:minmax(130px,1fr) 106px 90px 66px;gap:13px;align-items:center}.table-head{font-size:10px;color:var(--muted);padding:12px 4px;background:var(--light)}.task{padding:19px 4px;border-bottom:1px solid var(--line);min-height:84px}.task strong{font-size:13px;font-weight:500;overflow-wrap:anywhere}.task .code{font:10px Consolas,monospace;color:var(--muted);display:block;margin-bottom:6px}.task select{padding:7px 5px;font-size:11px;width:100%}.task .state{font-size:11px;color:var(--muted)}.task .state.active{color:var(--accent)}.task .state.done{color:var(--green)}.advance{border:1px solid var(--line);color:var(--accent);background:transparent;font-size:11px;padding:7px 8px}.locked{font-size:9px;color:var(--error);display:block;margin-top:5px}.activity{border-left:1px solid var(--line);padding-left:23px}.activity h2{font-size:13px;font-weight:500;margin:0 0 18px}.activity ol{margin:0;padding:0;list-style:none}.activity li{padding:0 0 20px 13px;border-left:1px solid var(--line);position:relative;font-size:11px;line-height:1.8;overflow-wrap:anywhere}.activity li:before{content:"";width:5px;height:5px;background:var(--accent);position:absolute;left:-3px;top:6px}.activity time{display:block;font:10px Consolas,monospace;color:var(--muted);margin-bottom:4px}.activity small{font-size:10px;color:var(--muted)}.permission{border:1px solid var(--error);background:#f3e0d7;padding:18px 20px;margin-top:20px;color:var(--error)}.permission h2{font-size:16px;margin:0 0 8px}.permission p{font-size:12px;margin:4px 0 14px}.permission button{border:1px solid var(--error);background:transparent;color:var(--error);padding:9px 13px;margin-right:12px;font-size:12px}.status{font-size:12px;color:var(--green);min-height:26px;padding-top:8px}.footer{border-top:1px solid var(--line);margin-top:35px;padding-top:15px;font:10px Consolas,monospace;color:var(--muted);display:flex;justify-content:space-between}.error{color:var(--error);font-size:12px}@media(max-width:1040px){.work{grid-template-columns:minmax(0,1fr) 220px;gap:18px}header{padding:0 24px}main{padding:25px 24px}.activity{padding-left:16px}.table-head,.task{grid-template-columns:minmax(120px,1fr) 91px 75px 59px;gap:8px}.brand span{display:none}}@media(max-width:850px){.work{grid-template-columns:1fr}.activity{border-left:0;border-top:1px solid var(--line);padding:20px 0 0}.activity ol{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.stats{gap:18px}h1{font-size:28px}}@media(max-width:560px){header{padding:0 18px}.user{font-size:10px}main{padding:22px 18px}.stats{display:none}.table-head{display:none}.task{grid-template-columns:1fr 98px 65px}.task .title{grid-column:1/-1}.activity ol{display:block}.new-task{padding:12px}.primary{padding:10px 12px}.footer{gap:15px}}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style></head><body>
<header><div class="brand">▧ 蓝图工坊 <span>BUILD / TOGETHER</span></div><div class="user">许宁 · 协作者　◉</div></header><main><div class="title-row"><div><div class="tag">WORKSPACE 06 / 进行中的共同创作</div><h1>让每一步，都有着落。</h1></div><div class="stats"><div><strong id="totalCount">03</strong><small>任务总数</small></div><div><strong id="doneCount">00</strong><small>已经完成</small></div></div></div>
<div class="permission" id="permission" role="alert" hidden><h2 id="permissionTitle"></h2><p id="permissionText"></p><button id="request">申请编辑权限</button><button id="safeReturn">回到可编辑任务</button></div><div class="work"><section><form class="new-task" id="newTask"><div class="field"><label for="taskName">新建任务 · 2–60 字</label><input id="taskName" required minlength="2" maxlength="60" placeholder="给下一步起个清楚的名字"></div><button class="primary" type="submit">＋ 创建</button></form><div id="taskError" class="error" role="alert"></div><div id="status" class="status" role="status"></div><div class="filter"><button id="all" aria-pressed="true">全部任务</button><button id="editable" aria-pressed="false">我能编辑的</button><small>负责人可直接分派</small></div><div class="task-table"><div class="table-head"><span>任务 / 编号</span><span>负责人</span><span>当前状态</span><span>推进</span></div><div id="tasks"></div></div></section><aside class="activity"><h2>↳ 一起留下的轨迹</h2><ol id="activities"></ol><small>本地协作体验<br>没有向外部成员发出通知。</small></aside></div><footer class="footer"><span>协作者可以修改开放任务 / 受限任务仅管理员可编辑</span><span>蓝图工坊 · 共同完成</span></footer></main>
<script>
'use strict';
const $=id=>document.getElementById(id);

const members=['未分派','许宁','林简','沈行'];const states=['待开始','进行中','已完成'];let tasks=[{id:1,title:'整理这次访谈的关键发现',owner:'林简',state:1,locked:false},{id:2,title:'把首页的文案再读一遍',owner:'未分派',state:0,locked:false},{id:3,title:'季度预算发布',owner:'沈行',state:0,locked:true}],logs=[{time:'09:18',text:'林简将「整理这次访谈的关键发现」推进为进行中。'},{time:'09:05',text:'沈行创建受限任务「季度预算发布」。'}],filtered=false,deniedId=null,requests=new Set();
function log(text){logs.unshift({time:new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}),text});renderLog()}
function renderLog(){$('activities').replaceChildren();logs.slice(0,10).forEach(l=>{const li=document.createElement('li');const time=document.createElement('time');time.textContent=l.time;li.append(time,document.createTextNode(l.text));$('activities').append(li)})}
function deny(task){deniedId=task.id;$('permission').hidden=false;$('permissionTitle').textContent='无法修改「'+task.title+'」';$('permissionText').textContent='这是一项受限任务。你当前是协作者，只有管理员拥有编辑权限。本次操作没有写入任务。';$('request').disabled=requests.has(task.id);$('permission').scrollIntoView({block:'nearest'})}
function render(){$('tasks').replaceChildren();tasks.filter(t=>!filtered||!t.locked).forEach(t=>{const row=document.createElement('div');row.className='task';row.dataset.task=t.id;row.innerHTML='<div class="title"><span class="code"></span><strong></strong><span class="locked"></span></div><select aria-label="分派负责人"></select><span class="state"></span><button class="advance">推进 ↗</button>';row.querySelector('.code').textContent='BP / '+String(t.id).padStart(3,'0');row.querySelector('strong').textContent=t.title;row.querySelector('.locked').textContent=t.locked?'⌁ 受限 · 点击推进可检查权限':'';const select=row.querySelector('select');select.setAttribute('aria-label',t.title+'负责人');members.forEach(m=>{const o=document.createElement('option');o.value=m;o.textContent=m;select.append(o)});select.value=t.owner;select.disabled=t.locked;select.onchange=()=>{const old=t.owner;t.owner=select.value;log('将「'+t.title+'」从'+old+'分派给'+t.owner+'。');$('status').textContent='负责人已更新为 '+t.owner;render()};const state=row.querySelector('.state');state.textContent=states[t.state];state.classList.toggle('active',t.state===1);state.classList.toggle('done',t.state===2);const advance=row.querySelector('.advance');advance.disabled=t.state===2;advance.textContent=t.state===2?'完成 ✓':'推进 ↗';advance.setAttribute('aria-label','推进'+t.title);advance.onclick=()=>{if(t.locked){deny(t);return}if(t.owner==='未分派'){$('taskError').textContent='先为「'+t.title+'」选择负责人，再推进任务。';return}t.state=Math.min(2,t.state+1);$('taskError').textContent='';log('将「'+t.title+'」推进为'+states[t.state]+'。');$('status').textContent='「'+t.title+'」已更新为'+states[t.state];render()};$('tasks').append(row)});$('totalCount').textContent=String(tasks.length).padStart(2,'0');$('doneCount').textContent=String(tasks.filter(t=>t.state===2).length).padStart(2,'0');$('all').setAttribute('aria-pressed',!filtered);$('editable').setAttribute('aria-pressed',filtered)}
$('newTask').onsubmit=e=>{e.preventDefault();const title=$('taskName').value.trim();if(title.length<2){$('taskError').textContent='任务名称至少需要 2 个有效字符。';return}const t={id:Math.max(...tasks.map(t=>t.id))+1,title,owner:'未分派',state:0,locked:false};tasks.unshift(t);$('taskName').value='';$('taskError').textContent='';$('status').textContent='任务已创建。请在本行分派负责人。';log('创建「'+title+'」。');filtered=false;render()};
$('all').onclick=()=>{filtered=false;render()};$('editable').onclick=()=>{filtered=true;render()};$('request').onclick=()=>{const t=tasks.find(t=>t.id===deniedId);if(!t||requests.has(t.id))return;requests.add(t.id);log('申请「'+t.title+'」的编辑权限；等待管理员审批。');$('permissionText').textContent='访问申请已记录（本地演示），审批前仍为只读。请先完成有权限的任务。';$('request').disabled=true};$('safeReturn').onclick=()=>{$('permission').hidden=true;filtered=true;render();$('status').textContent='已回到可编辑任务，可以分派成员并推进状态。'};render();renderLog();

</script></body></html>
