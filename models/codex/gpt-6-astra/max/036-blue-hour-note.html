<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>蓝调手记</title><style>*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button,a,input,select,textarea{-webkit-tap-highlight-color:transparent}button,a{touch-action:manipulation}button{cursor:pointer}button:disabled{cursor:not-allowed}a{color:inherit}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--focus,var(--accent));outline-offset:4px}[hidden]{display:none!important}button:hover:not(:disabled){filter:brightness(.94)}svg{display:block;max-width:100%}label{cursor:pointer}p{line-height:1.65}input,textarea,select{max-width:100%}textarea{resize:vertical}button{min-height:44px}::selection{background:var(--accent);color:var(--page)}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}body{background:#d9d6d0;display:grid;place-items:start center;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}.phone{width:100%;max-width:430px;min-height:100svh;position:relative;overflow:hidden}.statusbar{height:38px;padding:12px 25px 0;display:flex;justify-content:space-between;font-size:11px;font-weight:700;letter-spacing:.7px}.phone button,.phone input,.phone select{min-height:44px}@media(min-width:600px){body{padding:28px}.phone{width:390px;min-height:844px;border:8px solid #25272a;border-radius:42px;box-shadow:0 26px 70px #00000026}.statusbar{padding-top:13px;height:41px}}
:root{--page:#183c9a;--surface:#dce9ff;--text:#f4f7ff;--muted:#a9c1f0;--accent:#bfd7ff;--line:#4263b0;--deep:#102b76;--focus:#f2cb68}.phone{background:var(--page);color:var(--text)}.compose{padding:18px 25px 35px}.toprow{display:flex;justify-content:space-between;align-items:center}.wordmark{font-size:13px;letter-spacing:3px}.draft-link{border:0;background:transparent;color:var(--muted);font-size:11px;padding:3px 0}.date{font:10px monospace;letter-spacing:1.5px;color:var(--muted);display:flex;align-items:center;gap:10px;margin:34px 0 10px}.date:before{content:'';height:1px;background:var(--line);width:23px}.spark{width:47px;height:47px;margin:27px 0 17px;color:var(--accent)}.title-input{display:block;width:100%;font:31px/1.4 Georgia,"SimSun",serif;background:transparent;border:0;color:var(--text);padding:0 0 19px;border-bottom:1px solid var(--line);border-radius:0}.title-input::placeholder{color:var(--muted)}.body-input{display:block;width:100%;margin-top:14px;padding:0;min-height:288px;background:repeating-linear-gradient(transparent 0 31px,var(--line) 31px 32px);border:0;border-radius:0;font-size:14px;line-height:32px;color:var(--text);resize:vertical}.body-input::placeholder{color:var(--muted)}.writing-status{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin:19px 0 33px;min-height:15px}.privacy{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:19px;color:var(--muted);font-size:10px;line-height:1.6}.actions{display:grid;grid-template-columns:1fr 1.5fr;gap:12px;margin-top:23px}button{border:1px solid var(--line);background:transparent;color:var(--text);border-radius:2px;padding:13px 10px;font-size:12px}.primary{background:var(--surface);color:var(--deep);border-color:var(--surface);font-weight:650}.message{font-size:11px;color:#ffe3a0;line-height:1.65;min-height:19px;margin:14px 0 0}.draft-view,.published{padding:22px 25px 40px}.view-heading{font:35px/1.35 Georgia,"SimSun",serif;margin:35px 0 20px}.draft-card{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:23px 0;margin:30px 0}.draft-card h2{font:25px Georgia,"SimSun",serif;margin:0 0 12px;overflow-wrap:anywhere}.draft-card p{font-size:12px;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}.draft-card small{font-size:10px;color:var(--muted)}.draft-view button{width:100%}.published article{font:15px/2.05 Georgia,"SimSun",serif;white-space:pre-wrap;overflow-wrap:anywhere;min-height:320px;border-top:1px solid var(--line);padding-top:25px}.published .view-heading{overflow-wrap:anywhere}.published .seal{border:1px solid var(--accent);display:inline-block;padding:6px 10px;font-size:10px;color:var(--accent);margin-top:20px}.published button{width:100%;margin-top:30px}.footline{font-size:10px;color:var(--muted);margin:22px 0 0;text-align:center}
</style></head><body><div class="phone"><div class="statusbar"><span>9:41</span><span>●●●　▰</span></div><main class="compose" id="compose"><header class="toprow"><div class="wordmark">蓝调手记</div><button class="draft-link" id="openDraft">我的草稿 ↗</button></header><p class="date">2026.09.05　星期六 · 蓝调时分</p><svg class="spark" viewBox="0 0 50 50" aria-hidden="true"><path d="M25 2q0 23 23 23-23 0-23 23 0-23-23-23Q25 25 25 2Z" fill="currentColor"/><circle cx="42" cy="7" r="2" fill="currentColor"/></svg><form id="noteForm"><input class="title-input" id="title" maxlength="40" placeholder="给今晚一个标题" aria-label="手记标题" required><textarea class="body-input" id="body" maxlength="3000" placeholder="留下一件今天不想忘记的小事。

天还没完全黑，窗外正好是蓝色的。" aria-label="手记正文" required></textarea><div class="writing-status"><span id="draftState">还未保存</span><span id="count">0 / 3000 字</span></div><div class="privacy"><span>◌</span><span>发布后出现在你的手记本中。<br>本页内容仅保存在当前设备，不向外发送。</span></div><div class="actions"><button id="saveDraft" type="button">存为草稿</button><button type="submit" class="primary">发布手记　↗</button></div><p class="message" id="message" role="status"></p></form><p class="footline">有些时刻，值得慢一点写。</p></main><main class="draft-view" id="draftView" hidden><p class="date">DRAFT / 写到一半也很好</p><h1 class="view-heading">让句子，<br>在这里等你。</h1><div class="draft-card"><h2 id="draftTitle">还没有草稿</h2><p id="draftBody">写下第一句话，再把它存起来。</p><small id="draftTime"></small></div><button id="continueWriting" class="primary">回去接着写</button></main><main class="published" id="published" hidden><p class="date">手记本 / 本机保存</p><span class="seal">已发布 · 09 月 05 日</span><h1 class="view-heading" id="publishedTitle"></h1><article id="publishedBody"></article><button id="editAgain">回到草稿继续编辑</button></main></div><script>
const title=document.querySelector('#title'),body=document.querySelector('#body'),key='daedalus-036-note';let draft=null;function count(){document.querySelector('#count').textContent=Array.from(body.value).length+' / 3000 字';document.querySelector('#draftState').textContent='编辑中 · 尚未保存'}
try{draft=JSON.parse(localStorage.getItem(key)||'null');if(draft){title.value=draft.title;body.value=draft.body;document.querySelector('#count').textContent=Array.from(body.value).length+' / 3000 字';document.querySelector('#draftState').textContent='已恢复本机草稿'}}catch(e){document.querySelector('#message').textContent='无法读取本机草稿，仍可继续在本页书写。'}title.oninput=count;body.oninput=count;
function save(){const pending={title:title.value,body:body.value,time:new Date().toLocaleString('zh-CN')};try{localStorage.setItem(key,JSON.stringify(pending));draft=pending;document.querySelector('#draftState').textContent='草稿已保存';document.querySelector('#message').textContent='下次回来，还能从这里接着写。';return true}catch(e){document.querySelector('#draftState').textContent='仅保留在本页';document.querySelector('#message').textContent='本机存储不可用，请勿关闭页面。';return false}}document.querySelector('#saveDraft').onclick=save;function view(id){['compose','draftView','published'].forEach(v=>document.getElementById(v).hidden=v!==id);window.scrollTo(0,0)}document.querySelector('#openDraft').onclick=()=>{document.querySelector('#draftTitle').textContent=draft?(draft.title||'未命名手记'):'还没有草稿';document.querySelector('#draftBody').textContent=draft?(draft.body||'这一页还没有正文。'):'写下第一句话，再把它存起来。';document.querySelector('#draftTime').textContent=draft?'保存于 '+draft.time:'';view('draftView')};document.querySelector('#continueWriting').onclick=()=>view('compose');document.querySelector('#noteForm').onsubmit=e=>{e.preventDefault();if(!title.value.trim()||!body.value.trim()){document.querySelector('#message').textContent='请为手记填写标题与正文。';return}if(!save()){document.querySelector('#message').textContent='发布未完成：本机存储不可用。文字仍在这里，请保持页面打开，恢复后重试。';return}document.querySelector('#publishedTitle').textContent=title.value;document.querySelector('#publishedBody').textContent=body.value;view('published')};document.querySelector('#editAgain').onclick=()=>view('compose');
</script></body></html>
