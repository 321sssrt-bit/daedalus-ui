<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>标本检索</title><style>*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button,a,input,select,textarea{-webkit-tap-highlight-color:transparent}button,a{touch-action:manipulation}button{cursor:pointer}button:disabled{cursor:not-allowed}a{color:inherit}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--focus,var(--accent));outline-offset:4px}[hidden]{display:none!important}button:hover:not(:disabled){filter:brightness(.94)}svg{display:block;max-width:100%}label{cursor:pointer}p{line-height:1.65}input,textarea,select{max-width:100%}textarea{resize:vertical}button{min-height:44px}::selection{background:var(--accent);color:var(--page)}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
:root{--page:#eff7f1;--surface:#fbfdf9;--text:#173e38;--muted:#5d7a6f;--accent:#386753;--line:#b9cec2;--label:#dcebbd;--focus:#a36b27}body{font-family:system-ui,"Microsoft YaHei",sans-serif;background:var(--page);color:var(--text)}.top{max-width:1152px;margin:auto;height:76px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.brand{font:23px Georgia,"SimSun",serif;letter-spacing:3px}.brand span{display:inline-block;border:1px solid var(--text);font:11px monospace;letter-spacing:0;padding:4px 6px;margin-right:10px}.archive{font:11px monospace;color:var(--muted)}.wrap{max-width:1152px;margin:35px auto 60px}.title{display:flex;align-items:end;justify-content:space-between;padding-bottom:28px}.overline{font:11px monospace;letter-spacing:2px;color:var(--muted);margin:0 0 13px}h1{font:44px/1.2 Georgia,"SimSun",serif;margin:0}h1 small{font:14px system-ui;margin-left:18px;color:var(--muted)}.title>span{font-size:12px;color:var(--muted)}.layout{display:grid;grid-template-columns:190px 1fr;gap:37px}.filters{border-top:2px solid var(--text);padding-top:18px}.filters h2{font-size:13px;margin:0 0 25px;display:flex;justify-content:space-between}.filters h2 span{font:11px monospace}.filters label{display:block;font-size:11px;margin-bottom:23px}.filters input,.filters select{display:block;width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;border-radius:0;padding:11px 1px;color:var(--text);min-height:44px;margin-top:4px;font-size:13px}.clear{border:1px solid var(--line);background:transparent;width:100%;font-size:12px;color:var(--text)}.filters p{font-size:11px;line-height:1.85;color:var(--muted);margin-top:26px}.result-head{height:40px;display:flex;justify-content:space-between;align-items:start;border-bottom:1px solid var(--line);font-size:12px}.result-head strong{font:18px Georgia,serif}.result-head span:last-child{color:var(--muted);font-size:11px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px 18px;margin-top:21px}.sample{background:var(--surface);border:1px solid var(--line);padding:0;text-align:left;color:var(--text);min-width:0;transition:transform .15s}.sample:hover{transform:translateY(-3px)}.art{height:158px;margin:11px 10px 0;position:relative;background:linear-gradient(transparent 96%,#e4eee6 96%);background-size:25px 25px;display:grid;place-items:center}.art svg{height:147px;width:100%}.no{font:9px monospace;position:absolute;left:5px;top:4px;color:var(--muted)}.sample:nth-child(2n) .art svg{transform:scaleX(-1) rotate(12deg)}.sample:nth-child(3n) .art svg{transform:rotate(-18deg) scale(.87)}.sample:nth-child(4n) .art svg{transform:scale(.9,1)}.info{padding:15px 17px 18px;border-top:1px solid var(--line)}.info h3{font-size:17px;font-weight:550;margin:0 0 5px}.latin{font:italic 11px Georgia,serif;color:var(--muted)}.traits{display:flex;justify-content:space-between;align-items:center;margin-top:15px;font-size:10px}.traits b{background:var(--label);font-weight:400;padding:3px 7px}.zero{padding:80px 25px;background:var(--surface);border:1px dashed var(--line);text-align:center;grid-column:1/-1}.zero h2{font-size:22px}.zero p{font-size:13px;color:var(--muted)}dialog{max-width:420px;width:calc(100% - 40px);border:1px solid var(--text);padding:32px;background:var(--surface);color:var(--text)}dialog::backdrop{background:#173e3866}dialog h2{font:30px Georgia,"SimSun",serif;margin:0 0 10px}dialog p{font-size:14px}dialog button{width:100%;border:1px solid var(--text);background:var(--text);color:var(--surface)}@media(max-width:1220px){.top,.wrap{margin-left:36px;margin-right:36px}}@media(max-width:900px){.layout{grid-template-columns:155px 1fr;gap:25px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.title>span{display:none}h1{font-size:38px}}@media(max-width:600px){.top,.wrap{margin-left:20px;margin-right:20px}.archive{display:none}.layout{display:block}.filters{display:grid;grid-template-columns:1fr 1fr;gap:12px 20px;margin-bottom:26px}.filters h2{grid-column:1/-1;margin:0}.filters label{margin:0}.filters p{display:none}.clear{grid-column:1/-1}.art{height:130px}.art svg{height:120px}.info{padding:13px}.traits{display:block}.traits span{display:block;margin-top:10px}h1 small{display:none}}
</style></head><body><header class="top"><div class="brand"><span>H / 26</span>草木标本室</div><div class="archive">江南植物采集档案　·　数字馆藏</div></header><main class="wrap"><div class="title"><div><p class="overline">HERBARIUM / FIELD COLLECTION</p><h1>从一片叶子开始。<small>馆藏检索</small></h1></div><span>每一株，都有来处。</span></div><div class="layout"><aside class="filters"><h2>缩小寻找范围 <span>04</span></h2><label>01　名称或编号<input id="keyword" type="search" placeholder="搜索标本" aria-label="名称或编号"></label><label>02　植物类别<select id="kind"><option value="">所有类别</option><option>草本</option><option>木本</option><option>蕨类</option></select></label><label>03　采集生境<select id="habitat"><option value="">所有生境</option><option>林下</option><option>溪畔</option><option>山坡</option></select></label><label>04　采集季节<select id="season"><option value="">全年</option><option>春季</option><option>夏季</option><option>秋季</option></select></label><button class="clear" id="clear">清除全部条件　↺</button><p>依据 2026 年野外采集记录编目。<br>标本图为形态示意，<br>不作为植物鉴定依据。</p></aside><section aria-label="标本检索结果"><div class="result-head"><span>找到 <strong id="resultCount">8</strong> 份标本</span><span>按入藏编号排列 ↓</span></div><div class="grid" id="results" aria-live="polite"></div></section></div></main><dialog id="detail"><p class="overline">标本记录</p><h2 id="detailName"></h2><p id="detailCopy"></p><button id="closeDetail">合上记录</button></dialog><script>
const data=[['银杏','Ginkgo biloba','木本','山坡','秋季'],['蕨','Pteridium aquilinum','蕨类','林下','春季'],['酢浆草','Oxalis corniculata','草本','溪畔','春季'],['枫香','Liquidambar formosana','木本','山坡','秋季'],['凤尾蕨','Pteris multifida','蕨类','林下','夏季'],['石菖蒲','Acorus tatarinowii','草本','溪畔','夏季'],['山茶','Camellia japonica','木本','林下','春季'],['野菊','Chrysanthemum indicum','草本','山坡','秋季']];const art="<svg viewBox=\"0 0 220 155\" aria-hidden=\"true\"><path d=\"M110 147Q101 93 121 20M112 116Q55 114 55 57Q100 59 112 116M115 89Q162 90 175 43Q130 43 115 89M119 61Q86 48 94 13Q126 25 119 61\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"/><path d=\"m55 57 55 60m65-74-60 46M94 13l25 48\" stroke=\"currentColor\" stroke-width=\".7\"/><circle cx=\"120\" cy=\"22\" r=\"6\" fill=\"currentColor\" opacity=\".15\"/></svg>";const fields=['keyword','kind','habitat','season'].map(id=>document.getElementById(id));
function render(){const [word,kind,habitat,season]=fields.map(e=>e.value.trim());const found=data.map((d,i)=>({d,i})).filter(({d,i})=>(!word||(d.join(' ')+' H-'+(201+i)).toLowerCase().includes(word.toLowerCase()))&&(!kind||d[2]===kind)&&(!habitat||d[3]===habitat)&&(!season||d[4]===season));document.querySelector('#resultCount').textContent=found.length;const results=document.querySelector('#results');results.replaceChildren();found.forEach(({d,i})=>{const card=document.createElement('button');card.className='sample';card.setAttribute('aria-label','查看'+d[0]+'标本');card.innerHTML='<div class="art"><span class="no">H-'+(201+i)+'</span>'+art+'</div><div class="info"><h3>'+d[0]+'</h3><span class="latin">'+d[1]+'</span><div class="traits"><b>'+d[2]+'</b><span>'+d[3]+' · '+d[4]+'</span></div></div>';card.onclick=()=>{document.querySelector('#detailName').textContent=d[0]+' · H-'+(201+i);document.querySelector('#detailCopy').textContent=d[1]+'。采集于江南山地'+d[3]+'，'+d[4]+'入藏。类别：'+d[2]+'。此页展示采集记录与形态示意。';document.querySelector('#detail').showModal()};results.append(card)});if(!found.length){const empty=document.createElement('div');empty.className='zero';empty.innerHTML='<h2>这组条件下，还没有标本。</h2><p>试试更短的名称，或清除一个生境条件。</p>';results.append(empty)}}fields.forEach(e=>e.addEventListener('input',render));document.querySelector('#clear').onclick=()=>{fields.forEach(e=>e.value='');render()};document.querySelector('#closeDetail').onclick=()=>document.querySelector('#detail').close();render();
</script></body></html>
