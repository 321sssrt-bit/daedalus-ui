<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星轨 · 找到你的学习轨道</title><style>*{box-sizing:border-box}body{margin:0;font:15px/1.6 "Segoe UI","Microsoft YaHei",sans-serif;color:var(--text);background:var(--page)}button,input,textarea,select{font:inherit}button{cursor:pointer;min-height:44px}button:hover{filter:brightness(.94)}button:active{transform:translateY(1px)}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}[hidden]{display:none!important}button,input,textarea,select{color:inherit}svg{max-width:100%}h1,h2,h3,p{margin-top:0}button{transition:filter .15s ease}input,textarea{min-width:0}a{color:inherit}label{display:block}small{font-size:12px}dialog{color:var(--text);border:1px solid var(--muted)}dialog::backdrop{background:rgba(0,0,0,.45)}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
 :root{--page:#e9eff8;--surface:#ffffff;--text:#223c6a;--muted:#637897;--accent:#355cdf;--line:#c7d4e8;--soft:#d9e5fc}.layout{max-width:1180px;margin:auto;padding:34px 48px;min-height:800px}.top{display:flex;justify-content:space-between;align-items:center}.logo{font-size:21px;font-weight:800}.quiet{border:0;background:none;font-size:13px;color:var(--muted)}.guide{display:grid;grid-template-columns:220px 1fr;gap:50px;margin-top:82px}.steps{list-style:none;padding:0;margin:55px 0 0}.steps li{padding:0 0 34px 52px;position:relative;color:var(--muted);font-size:13px}.steps li:before{content:attr(data-number);position:absolute;left:0;width:32px;height:32px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;background:var(--page)}.steps li:not(:last-child):after{content:"";position:absolute;left:16px;top:38px;bottom:6px;border-left:1px solid var(--line)}.steps li.active{color:var(--accent);font-weight:700}.steps li.active:before{background:var(--accent);color:var(--surface);border-color:var(--accent)}.step-sub{font-size:11px;display:block;font-weight:400;margin-top:3px}.orbital{height:235px;position:relative;background:var(--soft);border-radius:120px;margin:0 0 34px;overflow:hidden}.orbital svg{width:100%;height:100%}.orbital text{font-family:"Segoe UI","Microsoft YaHei",sans-serif}.eyebrow{font-size:11px;letter-spacing:3px;color:var(--accent)}h1{font-size:38px;line-height:1.35;letter-spacing:-1px;margin:12px 0}p.desc{max-width:480px;color:var(--muted);font-size:15px}.feature{display:flex;gap:24px;font-size:12px;margin-top:28px;padding-top:20px;border-top:1px solid var(--line)}.feature span:before{content:"✓";color:var(--accent);margin-right:6px}.actions{display:flex;justify-content:space-between;align-items:center;margin-top:34px}.primary{border:0;border-radius:30px;color:var(--surface);background:var(--accent);padding:12px 28px;min-width:150px}.back{border:1px solid var(--line);background:none;border-radius:30px;padding:10px 22px}.progress{height:3px;background:var(--line);margin-top:52px}.progress span{display:block;width:33.333%;height:100%;background:var(--accent)}.count{text-align:right;color:var(--muted);font-size:11px;margin-top:8px}.dashboard{margin:65px auto;max-width:700px;padding:48px;background:var(--surface);border-radius:28px}.dashboard h2{font-size:32px;line-height:1.3}.lesson{margin:26px 0;padding:25px;border:1px solid var(--line);border-radius:16px;display:flex;justify-content:space-between;align-items:center}.lesson b{font-size:18px}.notice{color:var(--accent)}@media(max-width:900px){.layout{padding:28px}.guide{grid-template-columns:160px 1fr;gap:28px;margin-top:60px}.steps li{padding-left:42px}.orbital{height:190px}h1{font-size:32px}.feature{gap:14px;flex-wrap:wrap}}@media(max-width:620px){.guide{display:block;margin-top:24px}.steps{display:flex;margin:0 0 24px;justify-content:space-between}.steps li{padding:40px 0 0;font-size:11px;text-align:center;width:30%}.steps li:before{left:calc(50% - 16px)}.steps li:after,.step-sub{display:none}.orbital{height:170px}.dashboard{padding:25px}}</style></head><body><main class="layout"><header class="top"><div class="logo">✺ 星轨</div><button class="quiet" id="skip">跳过引导 ↗</button></header><section id="guide" class="guide"><aside><ol class="steps"><li data-number="01" class="active">找到方向<span class="step-sub">让兴趣成为起点</span></li><li data-number="02">建立节奏<span class="step-sub">每一天，轻轻推进</span></li><li data-number="03">看见成长<span class="step-sub">小积累，也有回响</span></li></ol></aside><div><div class="orbital"><svg viewBox="0 0 660 235" aria-label="围绕学习目标的三条轨道"><ellipse cx="325" cy="118" rx="235" ry="78" fill="none" stroke="var(--line)"/><ellipse cx="325" cy="118" rx="148" ry="64" fill="none" stroke="var(--accent)" stroke-dasharray="3 8"/><circle cx="325" cy="118" r="42" fill="var(--surface)"/><circle id="planet" cx="122" cy="79" r="19" fill="var(--accent)"/><text id="orbit-label" x="325" y="124" text-anchor="middle" fill="var(--accent)" font-size="17" font-weight="700">好奇心</text><circle cx="474" cy="165" r="8" fill="var(--surface)"/><circle cx="223" cy="165" r="5" fill="var(--accent)"/><path d="M538 61v14M531 68h14" stroke="var(--accent)" stroke-width="2"/></svg></div><div aria-live="polite"><div class="eyebrow" id="eyebrow">01 / FOLLOW YOUR CURIOSITY</div><h1 id="title">从一件想懂的事开始。</h1><p class="desc" id="description">设计、写作、自然科学……选一条你感兴趣的轨道。我们把宽广的知识，整理成走得下去的小路。</p><div class="feature" id="feature"><span>按兴趣探索</span><span>清楚的学习路径</span><span>随时换个方向</span></div></div><div class="actions"><button class="back" id="previous" disabled>← 上一步</button><button class="primary" id="next">下一步　→</button></div><div class="progress" aria-hidden="true"><span id="bar"></span></div><div class="count" id="count">01 / 03</div></div></section><section class="dashboard" id="dashboard" hidden aria-live="polite"><div class="eyebrow">YOUR FIRST ORBIT</div><h2>学习，从这里启程。</h2><p>今天留十分钟，给你的好奇心。</p><div class="lesson"><div><small>推荐起点 · 6 节短课</small><br><b>像设计师一样观察</b></div><span>10 分钟</span></div><button class="primary" id="start-lesson">开始第一课</button><p id="lesson-status" class="notice" role="status"></p><button class="quiet" id="replay">重新查看引导</button></section></main><script>
const $=s=>document.querySelector(s);const steps=[['01 / FOLLOW YOUR CURIOSITY','从一件想懂的事开始。','设计、写作、自然科学……选一条你感兴趣的轨道。我们把宽广的知识，整理成走得下去的小路。',['按兴趣探索','清楚的学习路径','随时换个方向'],'好奇心',122,79],['02 / MAKE A LITTLE ROOM','每天十分钟，也算向前。','把远大的目标拆成刚刚好的份量。短课、练习与复习，为忙碌生活留出一段舒服的学习节奏。',['短课随时学','保存学习进度','温和的复习提醒'],'小节奏',434,80],['03 / WATCH IT ADD UP','走过的每一步，都看得见。','课程笔记与练习成果汇成你的成长轨迹。回望时，你会发现那些小小的理解，已经连接成一片星空。',['专属成长轨迹','收藏你的笔记','把理解变成作品'],'新成长',460,163]];let n=0;function render(){const d=steps[n];$('#eyebrow').textContent=d[0];$('#title').textContent=d[1];$('#description').textContent=d[2];$('#feature').replaceChildren(...d[3].map(t=>{let s=document.createElement('span');s.textContent=t;return s}));$('#orbit-label').textContent=d[4];$('#planet').setAttribute('cx',d[5]);$('#planet').setAttribute('cy',d[6]);document.querySelectorAll('.steps li').forEach((e,i)=>{e.classList.toggle('active',i===n);if(i===n)e.setAttribute('aria-current','step');else e.removeAttribute('aria-current')});$('#previous').disabled=n===0;$('#next').textContent=n===2?'开始使用星轨　→':'下一步　→';$('#bar').style.width=((n+1)/3*100)+'%';$('#count').textContent='0'+(n+1)+' / 03'}function finish(){$('#guide').hidden=true;$('#dashboard').hidden=false;$('#skip').hidden=true}$('#previous').onclick=()=>{n--;render()};$('#next').onclick=()=>{if(n<2){n++;render()}else finish()};$('#skip').onclick=finish;$('#replay').onclick=()=>{n=0;render();$('#guide').hidden=false;$('#dashboard').hidden=true;$('#skip').hidden=false};$('#start-lesson').onclick=()=>{$('#lesson-status').textContent='第一课：留意身边的三种形状。先看看你手边的杯子。';$('#start-lesson').textContent='第一课已开始';$('#start-lesson').disabled=true};render();
</script></body></html>
