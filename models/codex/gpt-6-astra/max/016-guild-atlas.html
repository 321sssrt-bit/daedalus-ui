<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>成员目录 · guild-atlas</title><style>*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.6}button,input,select,textarea{font:inherit}button,a,input,select,summary{touch-action:manipulation}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}button,a{color:inherit}button{transition:background .16s ease,color .16s ease,transform .16s ease}button:hover:not(:disabled){filter:brightness(.94)}:focus-visible{outline:3px solid var(--accent);outline-offset:4px}h1,h2,h3,p{margin:0}svg{max-width:100%;height:auto}button,select,input{min-height:40px}a{text-decoration:none}small{font-size:12px}button[aria-pressed=true]{font-weight:700}[hidden]{display:none!important}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}dialog{border:1px solid var(--line);padding:32px;max-width:min(580px,90vw);color:var(--text);background:var(--surface)}dialog::backdrop{background:#00000080}dialog .close{float:right}.status{min-height:24px}summary{cursor:pointer}input,select,textarea{max-width:100%}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

:root{--page:#F1EDDE;--surface:#FAF8EF;--text:#263B30;--muted:#687566;--accent:#285640;--line:#B8C0AB;--ochre:#C19E58;--pink:#D8B7A4}body{background:var(--page);color:var(--text)}.wrap{max-width:1180px;margin:auto;padding:28px 42px}.head{display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid var(--accent);padding-bottom:18px}.logo{font-family:Georgia,"SimSun",serif;font-size:22px;font-weight:700}.head small{letter-spacing:3px}.intro{display:grid;grid-template-columns:1fr 250px;align-items:end;margin:36px 0}.intro h1{font-family:Georgia,"SimSun",serif;font-size:72px;line-height:1.15;font-weight:400;letter-spacing:-3px}.intro h1 span{display:block;font-size:21px;letter-spacing:9px;margin-top:14px}.intro p{font-size:13px;color:var(--muted);border-left:1px solid var(--line);padding-left:22px}.toolbar{display:flex;justify-content:space-between;gap:20px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:15px 0;margin-bottom:26px}.filters{display:flex;gap:6px}.filters button{border:0;padding:5px 16px;background:transparent;border-radius:0}.filters button[aria-pressed=true]{color:var(--surface);background:var(--accent)}.result{align-self:center;color:var(--muted);font-size:12px}.directory{display:grid;grid-template-columns:1fr 24px;gap:24px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.person{background:var(--surface);border:1px solid var(--line);padding:22px;text-align:left;position:relative;min-height:258px;width:100%;color:var(--text)}.person:hover{border-color:var(--accent);transform:translateY(-2px)}.avatar{width:92px;height:92px;display:block;margin-bottom:20px}.person h2{font-family:Georgia,"SimSun",serif;font-size:25px;line-height:1.3;font-weight:400}.person .role{display:block;color:var(--muted);font-size:12px;margin-top:4px}.person .foot{display:flex;justify-content:space-between;font-size:11px;border-top:1px solid var(--line);margin-top:20px;padding-top:10px}.available{position:absolute;right:18px;top:20px;color:var(--accent);font-size:10px}.alphabet{font-family:Georgia,serif;display:flex;flex-direction:column;gap:17px;text-align:center;color:var(--muted);font-size:12px;padding-top:14px}.alphabet b{color:var(--text)}.footer{display:flex;justify-content:space-between;margin-top:30px;border-top:1px solid var(--line);padding-top:16px;font-size:11px;color:var(--muted)}dialog{border:2px solid var(--accent);max-width:540px}dialog button{background:var(--accent);border:0;color:var(--surface);padding:6px 15px}dialog h2{font-family:Georgia,"SimSun",serif;font-size:36px;font-weight:400;margin:15px 0}dialog p{margin-top:15px}dialog .profile-label{font-size:11px;color:var(--muted);letter-spacing:2px}.empty{padding:40px 0;font-size:18px}@media(max-width:900px){.wrap{padding:24px}.intro h1{font-size:56px}.grid{grid-template-columns:repeat(2,1fr)}.intro{grid-template-columns:1fr 220px}.person{min-height:238px}}@media(max-width:560px){.intro{display:block}.intro p{margin-top:25px}.intro h1{font-size:48px}.toolbar{display:block}.result{display:block;margin-top:12px}.filters button{padding:5px 10px}.grid{grid-template-columns:1fr}.head small{display:none}.directory{gap:12px}}
</style></head><body><div class="wrap"><header class="head"><div class="logo">✳ 行会 <small>GUILD ATLAS</small></div><small>独立之人，共同之作。</small><span>成员名录 · 2026</span></header><main><section class="intro"><h1>找到你的<br>下一位同路人<span>行 会 人 才 目 录</span></h1><p>设计者、工程师与产品人。<br>我们以作品相识，<br>也为下一个好点子相聚。</p></section><div class="toolbar"><div class="filters" aria-label="按领域筛选"><button data-filter="全部" aria-pressed="true">全部成员</button><button data-filter="设计" aria-pressed="false">设计</button><button data-filter="工程" aria-pressed="false">工程</button><button data-filter="产品" aria-pressed="false">产品</button></div><span class="result" id="result" role="status">06 位成员 · 按姓名排列</span></div><div class="directory"><section class="grid" id="people" aria-label="成员列表"></section><aside class="alphabet" aria-label="姓名索引"><b>A—D</b><span>E—H</span><b>I—L</b><span>M—P</span><b>Q—T</b><span>U—Z</span></aside></div></main><footer class="footer"><span>每个人，都有一门好手艺。</span><span>名录 016 ／ 六位同路人</span></footer></div><dialog id="profile"><button class="close" id="close" aria-label="关闭个人简介">关闭 ×</button><div id="profile-content"></div></dialog><script>
const members=[['陈穗','设计','品牌与字体设计师','杭州','CS','#D8B7A4','从纸张、文字与城市标牌里寻找灵感。擅长为文化品牌建立有温度的视觉系统。','山间书店品牌 / 流动字展'],['何牧','工程','前端开发工程师','成都','HM','#B8C0AB','把复杂的交互变成简单的工具。关注无障碍体验、性能与有趣的浏览器实验。','木作工坊预约系统 / 田野地图'],['林遥','设计','数字产品设计师','上海','LY','#C19E58','在日常使用的小细节中，让产品更好懂。长期研究阅读与知识工具的体验。','页间阅读器 / 微光知识库'],['苏一','产品','独立产品策划','北京','SY','#B8C0AB','从用户真实的问题出发，用轻量原型验证产品方向。喜欢和小团队共同完成从零到一。','邻里生活指南 / 同频社区'],['吴青','设计','插画与视觉艺术家','厦门','WQ','#D8B7A4','用几何与自然的颜色描绘寻常事物。为杂志、空间与品牌提供叙事插画。','春日植物志 / 海风旅店'],['周弈','工程','交互技术开发者','深圳','ZY','#C19E58','在创意与工程之间搭桥。熟悉可视化、实体交互与小规模数字装置。','潮汐数据墙 / 声音花园']];function emblem(m){return `<svg class="avatar" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="50" fill="${m[5]}"/><path d="M10 86q15-38 40-38t40 38" fill="#285640"/><circle cx="50" cy="36" r="23" fill="#FAF8EF"/><path d="M25 33Q28 4 56 12q25 5 19 32l-15-23-35 12" fill="#263B30"/><path d="M41 39h3m12 0h3M47 49h8" stroke="#263B30" stroke-width="2"/><path d="M42 60l8 14 8-14" fill="#FAF8EF"/></svg>`}const box=document.querySelector('#people');function render(filter='全部'){const selected=members.map((m,i)=>[m,i]).filter(([m])=>filter==='全部'||m[1]===filter);box.innerHTML=selected.map(([m,i])=>`<button class="person" data-person="${i}" aria-label="查看${m[0]}的简介"><span class="available">● 可聊新项目</span>${emblem(m)}<h2>${m[0]}</h2><span class="role">${m[2]}</span><span class="foot"><span>${m[3]} · ${m[1]}</span><span>个人档案 ↗</span></span></button>`).join('');document.querySelector('#result').textContent=String(selected.length).padStart(2,'0')+' 位成员 · '+filter;box.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>{const m=members[b.dataset.person];document.querySelector('#profile-content').innerHTML=emblem(m)+`<div class="profile-label">${m[3]} ／ ${m[1]}</div><h2>${m[0]}</h2><strong>${m[2]}</strong><p>${m[6]}</p><p><small>近期作品</small><br>${m[7]}</p><p><small>合作状态：可聊新项目 · 通常 2 个工作日回复</small></p>`;document.querySelector('#profile').showModal()})}render();document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.setAttribute('aria-pressed',x===b));render(b.dataset.filter)});document.querySelector('#close').onclick=()=>document.querySelector('#profile').close();
</script></body></html>
