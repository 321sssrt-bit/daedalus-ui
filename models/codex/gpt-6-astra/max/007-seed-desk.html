<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>种子笔记 · 留住第一颗想法</title><style>*{box-sizing:border-box}body{margin:0;font:15px/1.6 "Segoe UI","Microsoft YaHei",sans-serif;color:var(--text);background:var(--page)}button,input,textarea,select{font:inherit}button{cursor:pointer;min-height:44px}button:hover{filter:brightness(.94)}button:active{transform:translateY(1px)}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}[hidden]{display:none!important}button,input,textarea,select{color:inherit}svg{max-width:100%}h1,h2,h3,p{margin-top:0}button{transition:filter .15s ease}input,textarea{min-width:0}a{color:inherit}label{display:block}small{font-size:12px}dialog{color:var(--text);border:1px solid var(--muted)}dialog::backdrop{background:rgba(0,0,0,.45)}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
 :root{--page:#f1f2e9;--surface:#fffef8;--text:#364b38;--muted:#73816a;--accent:#48743b;--line:#d3dccb;--soft:#dce8ca}.workspace{min-height:100vh;display:grid;grid-template-columns:196px 1fr}.sidebar{padding:30px 22px;border-right:1px solid var(--line)}.brand{font-size:20px;font-weight:750;margin-bottom:50px}.nav{width:100%;border:0;background:var(--soft);border-radius:8px;text-align:left;padding:10px 14px;font-size:13px}.side-note{font-size:11px;color:var(--muted);margin-top:25px}.profile{margin-top:330px;font-size:12px;border-top:1px solid var(--line);padding-top:18px}.page{padding:34px 48px;min-width:0}.bar{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--text)}.notebook{position:relative;max-width:830px;min-height:594px;margin:42px auto 0;background:var(--surface);border:1px solid var(--line);border-radius:3px 18px 18px 3px;padding:45px 56px;box-shadow:5px 5px 0 var(--page),6px 6px 0 var(--line)}.notebook:before{content:"";position:absolute;left:27px;top:0;bottom:0;border-left:1px solid var(--line)}.tab{position:absolute;right:-13px;top:42px;padding:14px 6px;background:var(--soft);font-size:11px;writing-mode:vertical-rl;border-radius:0 5px 5px 0;letter-spacing:3px}.empty{text-align:center;max-width:490px;margin:auto}.plant{height:180px;width:250px;display:block;margin:0 auto 22px}.empty h1{font:400 33px/1.4 Georgia,"Songti SC",SimSun,serif;margin:0 0 16px}.empty p{color:var(--muted);font-size:14px;max-width:335px;margin:0 auto 25px}.primary{border:0;border-radius:7px;background:var(--accent);color:var(--surface);padding:12px 24px}.secondary{display:block;border:0;background:none;color:var(--accent);margin:12px auto 0;font-size:12px;text-decoration:underline;text-underline-offset:5px}.quote{font:12px/1.8 Georgia,"Songti SC",SimSun,serif;text-align:center;color:var(--muted);margin-top:35px}.editor h2,.collection h2{font:28px/1.4 Georgia,"Songti SC",SimSun,serif}.field{font-size:12px;margin:20px 0}.field input,.field textarea{display:block;width:100%;margin-top:8px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:12px}.field textarea{height:190px;resize:vertical;background:repeating-linear-gradient(var(--surface) 0 31px,var(--line) 31px 32px);line-height:32px;padding-top:0}.editor-actions{display:flex;gap:12px}.plain{background:none;border:1px solid var(--line);border-radius:7px;padding:10px 18px}.note-card{padding:22px 0;border-bottom:1px solid var(--line)}.note-card h3{font-size:18px;margin-bottom:8px;overflow-wrap:anywhere}.note-card p{color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}.collection-top{display:flex;align-items:center;justify-content:space-between}.count{color:var(--muted);font-size:12px}@media(max-width:900px){.workspace{grid-template-columns:150px 1fr}.sidebar{padding:28px 16px}.page{padding:28px}.notebook{padding:38px 36px}.notebook:before{left:16px}.brand{font-size:17px}.empty h1{font-size:29px}}@media(max-width:620px){.workspace{display:block}.sidebar{border-right:0;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.brand{margin:0}.nav{width:auto}.side-note,.profile{display:none}.page{padding:20px}.notebook{margin-top:25px;padding:32px;min-height:570px}.plant{height:150px}}</style></head><body><main class="workspace"><aside class="sidebar"><div class="brand">⌁ 种子笔记</div><button class="nav" id="notes-nav">▤ 我的笔记 <span id="side-count">0</span></button><p class="side-note">每个想法，都有生长的可能。</p><div class="profile">● 私人空间<br><small>只属于你的一小块土地</small></div></aside><section class="page"><header class="bar"><span>我的空间 / 笔记</span><span class="avatar">青</span></header><article class="notebook"><div class="tab">慢慢生长</div><section class="empty" id="empty"><svg class="plant" viewBox="0 0 250 180" aria-hidden="true"><path d="M62 158h128" stroke="var(--line)"/><path d="M112 151c-4-41 24-62 18-111" stroke="var(--accent)" stroke-width="2" fill="none"/><path d="M125 87C79 89 80 47 81 42c39 1 49 23 44 45Z" fill="var(--soft)" stroke="var(--accent)"/><path d="M125 106c45 2 60-27 59-46-35-1-57 22-59 46Z" fill="var(--soft)" stroke="var(--accent)"/><path d="M130 59c-19-17-14-39-8-48 26 11 23 33 8 48Z" fill="var(--soft)" stroke="var(--accent)"/><path d="M94 150h39l-7 21h-25Z" fill="var(--line)"/><circle cx="54" cy="97" r="3" fill="var(--soft)"/><circle cx="201" cy="27" r="5" fill="var(--soft)"/></svg><h1>你好，这里还很安静。</h1><p>一个灵感、一页读书摘记，<br>或今天窗外的颜色。先留下一颗种子吧。</p><button class="primary" id="create">＋ 写下第一篇笔记</button><button class="secondary" id="sample">先看看一篇示例</button><div class="quote">“不必完整，开始记录就好。”</div></section><section class="editor" id="editor" hidden><small>一颗新种子</small><h2>把刚才的想法留下。</h2><form id="note-form"><label class="field">标题<input id="title" maxlength="60" required placeholder="给这个想法起个名字"></label><label class="field">笔记<textarea id="body" maxlength="3000" required placeholder="从一句话开始……"></textarea></label><div class="editor-actions"><button class="primary">保存笔记</button><button class="plain" id="cancel" type="button">暂时放下</button></div></form></section><section class="collection" id="collection" hidden aria-live="polite"><div class="collection-top"><h2>我的小小花园</h2><button class="plain" id="add">＋ 新笔记</button></div><div class="count" id="count"></div><div id="notes"></div></section></article></section></main><script>
const $=s=>document.querySelector(s);let notes=[];function show(id){for(const n of ['empty','editor','collection'])$('#'+n).hidden=n!==id}function render(){$('#notes').replaceChildren(...notes.map(n=>{let a=document.createElement('article');a.className='note-card';let h=document.createElement('h3'),p=document.createElement('p'),s=document.createElement('small');h.textContent=n.title;p.textContent=n.body;s.textContent=n.sample?'示例笔记 · 可从这里开始':'刚刚种下 · 私人笔记';a.append(h,p,s);return a}));$('#count').textContent=notes.length+' 篇笔记';$('#side-count').textContent=notes.length;show(notes.length?'collection':'empty')}function create(){show('editor');$('#title').focus()}$('#create').onclick=create;$('#add').onclick=create;$('#cancel').onclick=render;$('#notes-nav').onclick=render;$('#note-form').onsubmit=e=>{e.preventDefault();const t=$('#title'),b=$('#body');if(!t.value.trim()||!b.value.trim()){const f=!t.value.trim()?t:b;f.setCustomValidity('请留下真实文字');f.reportValidity();return}notes.unshift({title:t.value.trim(),body:b.value.trim()});$('#note-form').reset();render()};for(const id of ['title','body'])$('#'+id).oninput=()=>$('#'+id).setCustomValidity('');$('#sample').onclick=()=>{notes.push({title:'在早晨留十分钟',body:'今天把手机留在房间，带一本书去窗边。\n我想记下：光落在杯沿时，像一条很慢的河。',sample:true});render()};
</script></body></html>
