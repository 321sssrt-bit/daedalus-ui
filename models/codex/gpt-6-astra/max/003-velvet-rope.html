<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>帷幕 · 仅凭邀请</title><style>*{box-sizing:border-box}body{margin:0;font:15px/1.6 "Segoe UI","Microsoft YaHei",sans-serif;color:var(--text);background:var(--page)}button,input,textarea,select{font:inherit}button{cursor:pointer;min-height:44px}button:hover{filter:brightness(.94)}button:active{transform:translateY(1px)}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}[hidden]{display:none!important}button,input,textarea,select{color:inherit}svg{max-width:100%}h1,h2,h3,p{margin-top:0}button{transition:filter .15s ease}input,textarea{min-width:0}a{color:inherit}label{display:block}small{font-size:12px}dialog{color:var(--text);border:1px solid var(--muted)}dialog::backdrop{background:rgba(0,0,0,.45)}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
 :root{--page:#20141f;--surface:#2c1b2b;--text:#f0e4c7;--muted:#b8a493;--accent:#dcc18b;--line:#67503c;--soft:#7d374f}body{min-height:100vh}.ambient{min-height:800px;padding:30px 50px 24px;position:relative;overflow:hidden}.ambient:before,.ambient:after{content:"";position:absolute;top:145px;width:370px;height:370px;border:1px solid var(--line);transform:rotate(45deg);z-index:-1}.ambient:before{left:-250px}.ambient:after{right:-250px}.mast{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:18px;font-size:11px;letter-spacing:3px}.brand{font:26px Georgia,SimSun,serif;letter-spacing:7px}.invite{width:510px;margin:46px auto 0;text-align:center;position:relative;background:var(--surface);padding:34px 48px 30px;border:1px solid var(--line)}.invite:before{content:"";position:absolute;inset:9px;border:1px solid var(--line);pointer-events:none}.mark{font-size:36px;color:var(--accent)}.eyebrow{letter-spacing:4px;font-size:10px}.invite h1{font:400 54px/1.25 Georgia,"Songti SC",SimSun,serif;margin:22px 0 16px;letter-spacing:4px}.invite p{font-size:13px;color:var(--muted)}.rule{width:48px;height:1px;background:var(--accent);margin:24px auto}.field{text-align:left;font-size:11px;letter-spacing:1px;margin:25px 0 16px}.field input{display:block;width:100%;height:54px;background:var(--page);border:1px solid var(--line);color:var(--text);padding:12px;font:22px Georgia,serif;letter-spacing:4px;text-align:center;border-radius:0;margin-top:10px;text-transform:uppercase}.primary{width:100%;background:var(--accent);color:var(--page);border:0;padding:12px;font-weight:650;letter-spacing:2px}.status{min-height:26px;margin:14px 0 0;font-size:12px!important;color:var(--text)!important}.status.error{border-left:2px solid var(--soft);text-align:left;padding-left:10px}.demo{margin-top:16px;font-size:10px!important;letter-spacing:1px}.ticket-bottom{display:flex;justify-content:space-between;border-top:1px dashed var(--line);padding-top:20px;margin-top:20px;font-size:10px;letter-spacing:1px}.foot{text-align:center;letter-spacing:2px;font-size:10px;color:var(--muted);margin-top:28px}.admit{font:46px Georgia,serif;letter-spacing:5px;margin:25px 0}.details{text-align:left;border-top:1px solid var(--line);margin:25px 0}.details div{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:12px}.secondary{border:1px solid var(--line);background:none;color:var(--text);width:100%}@media(max-width:700px){.ambient{padding:24px;min-height:100vh}.mast>span{display:none}.mast{justify-content:center}.invite{width:100%;max-width:510px;padding:30px;margin-top:35px}.invite h1{font-size:44px}}</style></head><body><main class="ambient"><header class="mast"><span>杭州 · 湖畔</span><div class="brand">帷幕</div><span>PRIVATE EVENINGS</span></header><section class="invite"><div class="mark" aria-hidden="true">✧</div><div class="eyebrow">AN EVENING RESERVED</div><div id="gate"><h1>留一席，<br>给知音。</h1><p>这里的夜晚，只为受邀的你展开。<br>请输入邀请函上的专属入场码。</p><div class="rule"></div><form id="invite-form"><label class="field">你的邀请代码<input id="code" autocomplete="off" spellcheck="false" maxlength="12" placeholder="XXXX—0000" required aria-describedby="hint status"></label><button class="primary">核对邀请　→</button></form><p id="status" class="status" role="status"></p><p class="demo" id="hint">体验邀请：NUIT-0927</p></div><div id="admitted" hidden aria-live="polite"><h1>今夜有你。</h1><p>邀请已确认，你的席位已为你留好。</p><div class="admit">NO. 027</div><div class="details"><div><span>主题</span><b>蓝调与旧唱片</b></div><div><span>时间</span><b>09 月 27 日 · 20:30</b></div><div><span>地点</span><b>湖畔 · 帷幕二层</b></div></div><button class="secondary" id="return">查看另一封邀请</button></div><div class="ticket-bottom"><span>仅限邀请持有人</span><span>CHAPTER 09 / 2026</span></div></section><footer class="foot">愿今晚的好故事，比夜色更长。</footer></main><script>
const $=s=>document.querySelector(s);$('#invite-form').onsubmit=e=>{e.preventDefault();if($('#code').value.trim().toUpperCase()==='NUIT-0927'){$('#gate').hidden=true;$('#admitted').hidden=false}else{$('#status').textContent='这份代码未能匹配邀请。请核对连字符与数字，或联系邀请人。';$('#status').classList.add('error');$('#code').setAttribute('aria-invalid','true')}};$('#code').oninput=()=>{$('#code').removeAttribute('aria-invalid');$('#status').textContent='';$('#status').classList.remove('error')};$('#return').onclick=()=>{$('#admitted').hidden=true;$('#gate').hidden=false;$('#code').value='';$('#code').focus()};
</script></body></html>
