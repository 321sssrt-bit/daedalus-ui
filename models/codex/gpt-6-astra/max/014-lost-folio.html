<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>失物书架 · 再找一页</title><style>*{box-sizing:border-box}body{margin:0;font:15px/1.6 "Segoe UI","Microsoft YaHei",sans-serif;color:var(--text);background:var(--page)}button,input,textarea,select{font:inherit}button{cursor:pointer;min-height:44px}button:hover{filter:brightness(.94)}button:active{transform:translateY(1px)}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}[hidden]{display:none!important}button,input,textarea,select{color:inherit}svg{max-width:100%}h1,h2,h3,p{margin-top:0}button{transition:filter .15s ease}input,textarea{min-width:0}a{color:inherit}label{display:block}small{font-size:12px}dialog{color:var(--text);border:1px solid var(--muted)}dialog::backdrop{background:rgba(0,0,0,.45)}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

rder:0;border-top:1px solid var(--line);padding:19px 0;background:none;font-size:15px}.suggestion:last-child{border-bottom:1px solid var(--line)}.suggestion strong{display:block;font:22px/1.4 Georgia,"Songti SC",SimSun,serif;margin:4px 0 7px;font-weight:400}.suggestion small{color:var(--muted);font-size:11px}.suggestion .arrow{float:right;color:var(--accent);font-size:20px}.results{margin-top:36px}.results h1{font:30px/1.4 Georgia,SimSun,serif}.books{display:grid;grid-template-columns:repeat(3,1fr);gap:30px}.book{border-top:1px solid var(--text);padding-top:20px}.cover{height:185px;background:var(--soft);padding:24px;border:1px solid var(--line);font:25px/1.5 Georgia,SimSun,serif;display:flex;flex-direction:column;justify-content:space-between}.cover small{font:10px Consolas,monospace;letter-spacing:2px;color:var(--muted)}.book h2{font-size:15px;margin:15px 0 7px}.book p{font-size:11px;color:var(--muted)}.reset{margin-top:25px;border:0;background:none;padding:0;text-decoration:underline;font-size:12px;color:var(--accent)}.foot{margin-top:50px;padding-top:20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;font-size:10px;color:var(--muted)}@media(max-width:900px){.folio{padding:28px}.empty{gap:40px}.empty h1{font-size:39px}.searchbar input{font-size:35px}.books{gap:18px}.cover{padding:18px;font-size:21px}}@media(max-width:620px){.folio{padding:22px}.mast span:last-child{display:none}.brand{font-size:20px}.searchbar{gap:12px;margin-top:26px}.searchbar input{font-size:29px;height:64px}.searchbar button{padding:10px 18px}.empty{display:block;margin-top:25px;padding-top:25px}.empty h1{font-size:35px}.missing{display:none}.suggestions{margin-top:25px}.books{grid-template-columns:1fr}.cover{height:150px}.foot{display:block;line-height:2}}</style></head><body><main class="folio"><header class="mast"><div class="brand">失物书架</div><span>寻找你曾经喜欢的一页</span><span>VOL. 014 / 2026</span></header><form class="searchbar" id="search-form"><label>书名、作者，或一小段你记得的话<input id="query" type="search" value="月亮邮差的旅行" maxlength="80" required></label><button>再找找 ↗</button></form><div class="meta"><span id="search-meta" role="status">检索完成 / 0 条匹配</span><span>馆藏索引 · 书名与关键词</span></div><section class="empty" id="empty"><div><div class="indexmark">NO MATCH / 000</div><h1>这一页，<br>暂时没有找到。</h1><p id="explanation">书架里还没有“月亮邮差的旅行”。<br>也许记忆里的书名，和封面上略有不同。</p><div class="missing" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div></div><aside class="suggestions"><h2>换一种线索，继续找找。</h2><button class="suggestion" id="suggest-moon"><span class="arrow">↗</span><small>01 / 缩短书名，保留关键词</small><strong>搜“月亮”</strong><small>看看所有与月亮有关的书。</small></button><button class="suggestion" id="suggest-travel"><span class="arrow">↗</span><small>02 / 改用你记得的主题</small><strong>搜“旅行”</strong><small>从行走、远方与旅途里找线索。</small></button></aside></section><section class="results" id="results" hidden aria-live="polite"><div class="indexmark">FOUND IN THE SHELVES</div><h1 id="result-title"></h1><div class="books" id="books"></div><button class="reset" id="reset">返回最初的检索</button></section><footer class="foot"><span>一本书，有时会以另一种方式回来。</span><span>失物书架 · 独立阅读索引</span></footer></main><script>
const $=s=>document.querySelector(s);const books=[{title:'月亮与六便士',author:'威廉·萨默塞特·毛姆',tag:'月亮 文学 远方',code:'LITERATURE / 192'},{title:'月亮的另一面',author:'山野观察编辑部',tag:'月亮 自然 观察',code:'NATURE / 028'},{title:'一个人的旅行',author:'林间散步者',tag:'旅行 远方 行走',code:'JOURNEY / 064'},{title:'缓慢旅行指南',author:'旧地图工作室',tag:'旅行 城市 行走',code:'JOURNEY / 091'}];function search(value){$('#query').setCustomValidity('');$('#query').value=value;const q=value.trim();if(!q){$('#query').setCustomValidity('请留下一条检索线索');$('#query').reportValidity();return}const found=books.filter(b=>(b.title+' '+b.author+' '+b.tag).includes(q));$('#empty').hidden=found.length>0;$('#results').hidden=!found.length;$('#search-meta').textContent='检索完成 / '+found.length+' 条匹配';if(!found.length){$('#explanation').textContent='书架里还没有“'+q+'”。也许记忆里的书名，和封面上略有不同。';return}$('#result-title').textContent='与“'+q+'”有关的 '+found.length+' 本书';$('#books').replaceChildren(...found.map(b=>{const article=document.createElement('article');article.className='book';const cover=document.createElement('div'),title=document.createElement('h2'),author=document.createElement('p'),name=document.createElement('span'),code=document.createElement('small');cover.className='cover';name.textContent=b.title;code.textContent=b.code;cover.append(name,code);title.textContent=b.title;author.textContent=b.author;article.append(cover,title,author);return article}))}$('#search-form').onsubmit=e=>{e.preventDefault();search($('#query').value)};$('#query').oninput=()=>$('#query').setCustomValidity('');$('#suggest-moon').onclick=()=>search('月亮');$('#suggest-travel').onclick=()=>search('旅行');$('#reset').onclick=()=>search('月亮邮差的旅行');
</script></body></html>
