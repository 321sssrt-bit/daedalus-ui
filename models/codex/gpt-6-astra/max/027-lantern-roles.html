<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>角色权限 · lantern-roles</title><style>*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.6}button,input,select,textarea{font:inherit}button,a,input,select,summary{touch-action:manipulation}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}button,a{color:inherit}button{transition:background .16s ease,color .16s ease,transform .16s ease}button:hover:not(:disabled){filter:brightness(.94)}:focus-visible{outline:3px solid var(--accent);outline-offset:4px}h1,h2,h3,p{margin:0}svg{max-width:100%;height:auto}button,select,input{min-height:40px}a{text-decoration:none}small{font-size:12px}button[aria-pressed=true]{font-weight:700}[hidden]{display:none!important}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}dialog{border:1px solid var(--line);padding:32px;max-width:min(580px,90vw);color:var(--text);background:var(--surface)}dialog::backdrop{background:#00000080}dialog .close{float:right}.status{min-height:24px}summary{cursor:pointer}input,select,textarea{max-width:100%}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

:root{--page:#252C22;--surface:#313A2B;--text:#F2EFDA;--muted:#A6AE93;--accent:#E3D56A;--line:#515C42;--olive:#414D35;--green:#B2CA91;--shadow:#1C2219}body{background:var(--page);color:var(--text)}.workspace{max-width:1190px;margin:auto;padding:28px 42px}.header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:22px}.brand{font-size:22px;font-weight:600;letter-spacing:2px}.brand i{display:inline-block;width:18px;height:24px;border:2px solid var(--accent);border-radius:50% 50% 35% 35%;vertical-align:-5px;margin-right:12px;position:relative}.brand i:after{content:'';position:absolute;width:2px;height:8px;background:var(--accent);left:6px;bottom:-9px}.header small{font-size:10px;color:var(--muted);letter-spacing:2px}.intro{display:flex;justify-content:space-between;align-items:end;margin:35px 0 28px}.intro h1{font-size:34px;line-height:1.4;font-weight:500}.intro p{font-size:12px;color:var(--muted);margin-top:9px}.workspace-badge{border:1px solid var(--line);border-radius:3px;padding:6px 12px;font-size:10px;color:var(--muted)}.layout{display:grid;grid-template-columns:216px 1fr;gap:30px}.rail{display:flex;flex-direction:column;gap:10px}.rail-label{font-size:10px;color:var(--muted);letter-spacing:2px;margin-bottom:5px}.role{background:transparent;border:1px solid var(--line);color:var(--text);padding:17px 18px;text-align:left;min-height:96px;border-radius:4px;position:relative}.role h2{font-size:17px;font-weight:500}.role small{display:block;font-size:10px;color:var(--muted);margin-top:5px}.role .arrow{position:absolute;right:16px;top:18px;color:var(--muted)}.role[aria-pressed=true]{border-color:var(--accent);background:var(--olive);box-shadow:inset 3px 0 var(--accent)}.role[aria-pressed=true] .arrow{color:var(--accent)}.rail-note{font-size:11px;color:var(--muted);padding:17px 0;line-height:1.8}.main{min-width:0}.matrix{background:var(--surface);border:1px solid var(--line);border-radius:4px;overflow:hidden}.matrix-head{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.matrix-head h2{font-size:17px;font-weight:500}.matrix-head small{font-size:10px;color:var(--muted)}table{border-collapse:collapse;width:100%;font-size:12px}th,td{padding:16px 16px;border-bottom:1px solid var(--line);text-align:center}th:first-child,td:first-child{text-align:left;padding-left:24px;width:40%}th{font-size:10px;font-weight:400;color:var(--muted)}tr:last-child td{border-bottom:0}td small{display:block;color:var(--muted);font-size:10px;margin-top:2px}.selected-col{background:var(--olive)}.check{color:var(--green);font-size:17px}.dash{color:var(--muted)}input[type=checkbox]{appearance:none;min-height:20px;width:35px;height:20px;background:var(--shadow);border:1px solid var(--line);border-radius:20px;cursor:pointer;vertical-align:middle;position:relative;margin:0}input[type=checkbox]:after{content:'';position:absolute;width:12px;height:12px;border-radius:50%;background:var(--muted);top:3px;left:3px}input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent)}input[type=checkbox]:checked:after{background:var(--page);left:18px}input:disabled{opacity:.4;cursor:not-allowed}.preview{padding:20px 24px;background:var(--shadow);border:1px solid var(--line);border-radius:4px;margin-top:16px}.preview-label{font-size:10px;color:var(--accent);letter-spacing:2px}.preview h3{font-size:17px;font-weight:500;margin-top:8px}.preview p{font-size:12px;color:var(--muted);margin-top:7px;min-height:20px}.save-bar{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-top:22px}.save{background:var(--accent);color:var(--page);border:0;border-radius:4px;padding:10px 25px;font-weight:700}.reset{background:transparent;border:0;color:var(--muted);padding:8px 12px;font-size:11px}.status{color:var(--green);font-size:11px}.footer{margin-top:30px;padding-top:17px;border-top:1px solid var(--line);font-size:10px;color:var(--muted);display:flex;justify-content:space-between}@media(max-width:950px){.workspace{padding:24px}.layout{grid-template-columns:175px 1fr;gap:22px}.role{padding:15px;min-height:91px}.matrix-head{padding:18px}th,td{padding:14px 9px}th:first-child,td:first-child{padding-left:18px;width:39%}.preview{padding:18px}.matrix-head small{display:none}}@media(max-width:620px){.layout{display:block}.rail{flex-direction:row;margin-bottom:22px;gap:8px}.rail-label,.rail-note{display:none}.role{flex:1;padding:12px;min-height:80px}.role h2{font-size:14px}.role .arrow{display:none}.role small{font-size:9px}.intro h1{font-size:29px}.workspace-badge,.header small{display:none}.save-bar{align-items:start}.footer span:last-child{display:none}}
</style></head><body><div class="workspace"><header class="header"><div class="brand"><i aria-hidden="true"></i>灯笼协作</div><small>各有分工，一起发光。</small><span style="font-size:11px">南山工作室　／　管理</span></header><main><section class="intro"><div><h1>把合适的权限，交给合适的人。</h1><p>查看每个角色的工作边界，再决定谁能做什么。</p></div><div class="workspace-badge">工作空间 · 12 位成员</div></section><div class="layout"><aside class="rail"><div class="rail-label">选择角色预览</div><button class="role" data-role="owner" aria-pressed="false"><h2>所有者</h2><small>1 位 · 管理整个空间</small><span class="arrow">↗</span></button><button class="role" data-role="editor" aria-pressed="true"><h2>编辑者</h2><small>7 位 · 推进日常工作</small><span class="arrow">↗</span></button><button class="role" data-role="viewer" aria-pressed="false"><h2>观察者</h2><small>4 位 · 保持信息同步</small><span class="arrow">↗</span></button><p class="rail-note">所有者权限固定。<br>其他角色可逐项调整，<br>保存后应用到本空间。</p></aside><section class="main"><div class="matrix"><div class="matrix-head"><h2>权限清单</h2><small>当前编辑列以浅橄榄色标记</small></div><table><thead><tr><th>工作空间能力</th><th data-col="owner">所有者</th><th data-col="editor">编辑者</th><th data-col="viewer">观察者</th></tr></thead><tbody id="matrix-body"></tbody></table></div><section class="preview" aria-live="polite"><div class="preview-label">角色视角预览</div><h3 id="preview-title">以编辑者身份进入</h3><p id="preview-body"></p></section><div class="save-bar"><p class="status" id="role-status" role="status">角色权限已是最新。</p><div style="display:flex;gap:4px"><button class="reset" id="reset" disabled>撤销更改</button><button class="save" id="save" disabled>保存权限</button></div></div></section></div></main><footer class="footer"><span>权限越清楚，协作越安心。</span><span>灯笼协作　／　南山工作室</span></footer></div><script>
const keys=['owner','editor','viewer'],names={owner:'所有者',editor:'编辑者',viewer:'观察者'},permissions=[['查看项目','浏览任务与活动记录'],['编辑任务','创建、修改与推进状态'],['邀请成员','邀请同事加入空间'],['导出内容','下载项目和任务资料'],['管理账单','调整方案与付款方式']];let saved={owner:[true,true,true,true,true],editor:[true,true,false,true,false],viewer:[true,false,false,false,false]},draft=structuredClone(saved),selected='editor';function dirty(){return JSON.stringify(saved)!==JSON.stringify(draft)}function render(){document.querySelectorAll('[data-col]').forEach(h=>h.classList.toggle('selected-col',h.dataset.col===selected));document.querySelector('#matrix-body').innerHTML=permissions.map((p,i)=>`<tr><td>${p[0]}<small>${p[1]}</small></td>${keys.map(k=>`<td class="${k===selected?'selected-col':''}">${k===selected?`<input type="checkbox" data-permission="${i}" aria-label="${names[k]}${p[0]}权限" ${draft[k][i]?'checked':''} ${k==='owner'?'disabled':''}>`:`<span class="${draft[k][i]?'check':'dash'}" aria-label="${draft[k][i]?'允许':'不允许'}">${draft[k][i]?'✓':'—'}</span>`}</td>`).join('')}</tr>`).join('');document.querySelector('#preview-title').textContent='以'+names[selected]+'身份进入';const allowed=permissions.filter((p,i)=>draft[selected][i]).map(p=>p[0]);document.querySelector('#preview-body').textContent=allowed.length?'可用入口：'+allowed.join('、')+'。':'该角色暂时没有可用入口。';document.querySelector('#save').disabled=!dirty();document.querySelector('#reset').disabled=!dirty();document.querySelectorAll('[data-permission]').forEach(input=>input.onchange=()=>{draft[selected][+input.dataset.permission]=input.checked;render();document.querySelector('#role-status').textContent='有未保存的权限更改，预览已更新。'})}render();document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{selected=b.dataset.role;document.querySelectorAll('[data-role]').forEach(x=>x.setAttribute('aria-pressed',x===b));render()});document.querySelector('#save').onclick=()=>{saved=structuredClone(draft);render();document.querySelector('#role-status').textContent='已保存。三个角色的权限已应用到南山工作室。'};document.querySelector('#reset').onclick=()=>{draft=structuredClone(saved);render();document.querySelector('#role-status').textContent='已撤销未保存的更改。'};
</script></body></html>
