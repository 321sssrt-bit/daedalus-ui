<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>日光温室 · 一周栽培日历</title><style>*{box-sizing:border-box}body{margin:0;font:15px/1.6 "Segoe UI","Microsoft YaHei",sans-serif;color:var(--text);background:var(--page)}button,input,textarea,select{font:inherit}button{cursor:pointer;min-height:44px}button:hover{filter:brightness(.94)}button:active{transform:translateY(1px)}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}[hidden]{display:none!important}button,input,textarea,select{color:inherit}svg{max-width:100%}h1,h2,h3,p{margin-top:0}button{transition:filter .15s ease}input,textarea{min-width:0}a{color:inherit}label{display:block}small{font-size:12px}dialog{color:var(--text);border:1px solid var(--muted)}dialog::backdrop{background:rgba(0,0,0,.45)}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
 :root{--page:#faf1df;--surface:#fffaf0;--text:#643c29;--muted:#927555;--accent:#a9462c;--line:#e1c8a8;--soft:#efba87}.calendar{min-height:100vh;display:grid;grid-template-columns:252px 1fr}.almanac{background:var(--soft);padding:34px 30px;border-right:1px solid var(--line)}.logo{font-size:19px;font-weight:700;letter-spacing:3px}.sun{width:94px;height:94px;border:1px solid var(--accent);border-radius:50%;display:grid;place-items:center;margin:58px 0 32px;font-size:40px;color:var(--accent)}.month{font:13px Consolas,monospace;letter-spacing:2px}.date{font:120px/1.1 Georgia,serif;letter-spacing:-8px;margin:7px 0 5px}.day{font-size:14px}.almanac h1{font:400 27px/1.5 Georgia,"Songti SC",SimSun,serif;margin:35px 0 20px}.almanac p{font-size:12px}.temperature{border-top:1px solid var(--accent);padding-top:20px;margin-top:30px;font-size:12px}.content{padding:34px 35px;min-width:0}.top{display:flex;align-items:center;justify-content:space-between}.top h2{font-size:26px;line-height:1.3;font-weight:500;margin:0}.top p{font-size:12px;color:var(--muted);margin:7px 0 0}.range{border:1px solid var(--line);padding:8px 12px;font:11px Consolas,monospace}.legend{display:flex;gap:25px;font-size:11px;margin:28px 0 20px;color:var(--muted)}.legend i{display:inline-block;width:7px;height:7px;background:var(--accent);border-radius:50%;margin-right:6px}.legend span:nth-child(2) i{background:var(--soft)}.legend span:nth-child(3) i{background:var(--muted)}.schedule-wrap{overflow:auto}.schedule{min-width:570px;display:grid;grid-template-columns:45px repeat(5,minmax(0,1fr));grid-template-rows:60px repeat(5,88px);border-top:1px solid var(--line);border-bottom:1px solid var(--line);position:relative}.day-head{border:0;border-bottom:1px solid var(--line);background:transparent;min-height:60px;font-size:11px;padding:6px;color:var(--muted)}.day-head b{font:22px Georgia,serif;display:block;color:var(--text);line-height:1.2;margin-top:3px}.day-head[aria-pressed=true]{background:var(--text);color:var(--surface)}.day-head[aria-pressed=true] b{color:var(--surface)}.time{font:10px Consolas,monospace;color:var(--muted);padding-top:12px}.cell{border-left:1px solid var(--line);border-bottom:1px solid var(--line)}.event{z-index:1;margin:7px 6px;padding:9px 10px;border:0;border-left:3px solid var(--accent);border-radius:0;background:var(--soft);text-align:left;font-size:11px;line-height:1.45;align-self:stretch}.event b{display:block;font-size:12px;margin-top:5px}.event.work{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--muted)}.event.visit{background:var(--text);color:var(--surface);border-color:var(--accent)}.bottom{display:flex;justify-content:space-between;margin-top:23px;font-size:11px;color:var(--muted)}.details{width:440px;max-width:calc(100% - 40px);background:var(--surface);padding:32px;border:1px solid var(--accent)}.details h2{font:28px/1.4 Georgia,SimSun,serif}.details dl{display:grid;grid-template-columns:70px 1fr;gap:15px;font-size:13px}.details dt{color:var(--muted)}.details dd{margin:0}.details p{font-size:13px;border-top:1px solid var(--line);padding-top:18px;margin-top:22px}.close{width:100%;background:var(--accent);color:var(--surface);border:0;padding:12px;margin-top:10px}.state{font-size:11px;color:var(--muted);min-height:18px;margin-top:15px}@media(max-width:1000px){.calendar{grid-template-columns:190px 1fr}.almanac{padding:30px 22px}.content{padding:30px 24px}.date{font-size:102px}.almanac h1{font-size:23px}.top{align-items:flex-start;gap:12px;flex-direction:column}.legend{gap:15px}}@media(max-width:620px){.calendar{display:block}.almanac{padding:22px;display:grid;grid-template-columns:1fr 1fr;gap:8px}.sun,.almanac h1,.almanac p,.temperature{display:none}.logo{grid-column:1/-1}.date{font-size:65px;margin:0;grid-column:2;grid-row:2/4;text-align:right}.month,.day{grid-column:1}.content{padding:25px 20px}.bottom{display:block;line-height:2}}</style></head><body><main class="calendar"><aside class="almanac"><div class="logo">☼ 日光温室</div><div class="sun" aria-hidden="true">✺</div><div class="month">SEPTEMBER / 2026</div><div class="date" id="large-date">07</div><div class="day" id="weekday">星期一 · 白露</div><h1>给生长，<br>留一点时间。</h1><p>浇水、翻土、见见老朋友。<br>温室里的一周，从容开始。</p><div class="temperature">晴　25—31°C<br><small>今日宜：给新叶拍一张照片</small></div></aside><section class="content"><header class="top"><div><h2>这一周，慢慢安排。</h2><p>2026 年 09 月 · 温室工作日历</p></div><span class="range">09.07 — 09.11</span></header><div class="legend"><span><i></i>植物养护</span><span><i></i>温室事务</span><span><i></i>来客与活动</span></div><div class="schedule-wrap"><div class="schedule" id="schedule" aria-label="9 月 7 日至 11 日工作安排"></div></div><div class="bottom"><span>点击日期查看当日安排，点击事件打开详情。</span><span>本周共 7 项安排</span></div><p class="state" id="state" role="status">已选择 09 月 07 日，星期一。</p></section><dialog class="details" id="details" aria-labelledby="event-title"><small id="event-category"></small><h2 id="event-title"></h2><dl><dt>时间</dt><dd id="event-time"></dd><dt>地点</dt><dd id="event-place"></dd><dt>负责人</dt><dd id="event-person"></dd></dl><p id="event-note"></p><button class="close" id="close">知道了，回到日历</button></dialog></main><script>
const $=s=>document.querySelector(s);const events=[{d:0,r:0,title:'清晨浇水',time:'09:00—09:40',category:'植物养护',place:'一号温室',person:'小禾',note:'先检查土壤湿度，再给蕨类与竹芋补水。多肉区今天不用浇。',kind:''},{d:0,r:3,title:'种子归档',time:'15:00—16:00',category:'温室事务',place:'种子书架',person:'阿木',note:'整理八月采收的种子，补写来源和采集日期。',kind:'work'},{d:1,r:1,title:'香草换盆',time:'11:00—12:00',category:'植物养护',place:'南侧操作台',person:'小禾',note:'为迷迭香准备透气花盆，按 2:1 配好泥炭与珍珠岩。',kind:''},{d:2,r:0,title:'花友来访',time:'09:30—10:30',category:'来客与活动',place:'日光茶桌',person:'林青',note:'三位新花友来参观，请预留一份植物养护手册。',kind:'visit'},{d:2,r:4,title:'傍晚观察',time:'17:00—17:30',category:'植物养护',place:'二号温室',person:'小禾',note:'记录新芽的高度和叶片状态，拍摄本周生长照片。',kind:''},{d:3,r:2,title:'清理工具',time:'13:00—14:00',category:'温室事务',place:'工具间',person:'阿木',note:'剪刀消毒、铲具归位，检查周末工作坊的工具数量。',kind:'work'},{d:4,r:1,title:'枝条交换会',time:'11:00—12:30',category:'来客与活动',place:'温室庭院',person:'林青',note:'每人带两段健康枝条，附上植物名称和简短养护建议。',kind:'visit'}];const weekdays=['星期一','星期二','星期三','星期四','星期五'];function select(d){$('#large-date').textContent=String(d+7).padStart(2,'0');$('#weekday').textContent=weekdays[d]+(d===0?' · 白露':'');document.querySelectorAll('[data-day]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.day===d));const n=events.filter(e=>e.d===d).length;$('#state').textContent='已选择 09 月 '+String(d+7).padStart(2,'0')+' 日，'+weekdays[d]+'，有 '+n+' 项安排。'}for(let d=0;d<5;d++){const b=document.createElement('button');b.className='day-head';b.dataset.day=d;b.style.gridColumn=d+2;b.style.gridRow=1;b.innerHTML=weekdays[d]+'<b>'+String(d+7).padStart(2,'0')+'</b>';b.onclick=()=>select(d);$('#schedule').append(b)}for(let r=0;r<5;r++){let t=document.createElement('div');t.className='time';t.style.gridColumn=1;t.style.gridRow=r+2;t.textContent=['09:00','11:00','13:00','15:00','17:00'][r];$('#schedule').append(t);for(let d=0;d<5;d++){let c=document.createElement('div');c.className='cell';c.style.gridColumn=d+2;c.style.gridRow=r+2;$('#schedule').append(c)}}for(const e of events){const b=document.createElement('button');b.className='event '+e.kind;b.style.gridColumn=e.d+2;b.style.gridRow=e.r+2;b.innerHTML=e.time.split('—')[0]+'<b>'+e.title+'</b>';b.onclick=()=>{select(e.d);$('#event-category').textContent=e.category;$('#event-title').textContent=e.title;$('#event-time').textContent='09 月 '+String(e.d+7).padStart(2,'0')+' 日 · '+e.time;$('#event-place').textContent=e.place;$('#event-person').textContent=e.person;$('#event-note').textContent=e.note;$('#details').showModal()};$('#schedule').append(b)}$('#close').onclick=()=>$('#details').close();select(0);
</script></body></html>
