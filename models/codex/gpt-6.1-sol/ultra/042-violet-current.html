<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>流金 / 转账</title><style>:root{--page:#f0f0ff;--surface:#ffffff;--text:#28215b;--muted:#736d92;--accent:#6655d9;--line:#dad6f2;--danger:#b73d54;--on:#ffffff;--radius:8px}*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--text);font:14px/1.6 "Segoe UI","Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;min-height:44px;padding:10px 18px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);color:var(--text)}button:hover{filter:brightness(.94)}button:disabled{opacity:.4;cursor:not-allowed}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.primary{background:var(--accent);color:var(--on);border-color:var(--accent);font-weight:700}input,select,textarea{min-width:0;max-width:100%;width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);color:var(--text)}textarea{resize:vertical;min-height:100px}label{display:block;font-weight:600;margin:12px 0 6px}h1,h2,h3,p{margin:0 0 16px}h1{font-size:40px;line-height:1.2;letter-spacing:-1.2px}h2{font-size:22px;line-height:1.35}h3{font-size:16px}.muted,small{color:var(--muted)}small{font-size:12px}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.spread{justify-content:space-between}.stack{display:grid;gap:16px}.box{padding:24px;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius)}.rule{border-bottom:1px solid var(--line);padding:16px 0}.tag{font-size:12px;letter-spacing:1px;text-transform:uppercase}.error{color:var(--danger);font-weight:600}.feedback{min-height:26px;margin-top:14px}hr{border:0;border-top:1px solid var(--line);margin:24px 0}[hidden]{display:none!important}.phone{max-width:390px;min-height:844px;margin:auto;background:var(--page);padding:26px 24px;position:relative}.bottom{display:flex;gap:20px;justify-content:space-around;border-top:1px solid var(--line);padding:16px 0;margin-top:28px}.number{font-variant-numeric:tabular-nums}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}@media(min-width:600px){body.mobile{background:var(--line);padding:28px}.phone{border-radius:28px;overflow:hidden;box-shadow:0 16px 60px #00000020}}@media(max-width:600px){h1{font-size:32px}.box{padding:18px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}.wallet-head{background:var(--text);color:var(--surface);padding:26px;border-radius:22px;margin:24px -4px}.wallet-head small{color:#dad6f2}.balance{font-size:42px;font-weight:300;letter-spacing:-1px}.people{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.person{border-radius:16px;text-align:left;padding:18px}.person[aria-pressed=true]{border:2px solid var(--accent);background:var(--line)}.avatar{display:inline-grid;width:38px;height:38px;place-items:center;border-radius:50%;background:var(--accent);color:var(--surface);margin-bottom:8px}.amount{font-size:34px;border:0;border-bottom:2px solid var(--line);border-radius:0;background:transparent;padding:8px 0}.wallet .primary{width:100%;border-radius:24px}.confirmation{border:1px solid var(--accent);border-radius:18px;padding:20px;margin-top:24px}.success-disc{width:76px;height:76px;display:grid;place-items:center;background:var(--accent);color:var(--surface);font-size:34px;border-radius:50%;margin:30px auto}.voucher{text-align:center}</style></head><body class="mobile"><main class="phone wallet"><div class="row spread"><strong>流金</strong><span class="tag">转账</span></div><section class="wallet-head"><small>零钱 · 可用余额</small><div id="balance" class="balance number">¥ 680.00</div><div class="row spread"><span>每笔心意，都有回响。</span><span>↗</span></div></section><section id="edit"><h2>转给谁？</h2><div class="people"><button class="person" id="recipientA" aria-pressed="true" onclick="pick('好友甲',this)"><span class="avatar">甲</span><br><strong>好友甲</strong><br><small>最近转过</small></button><button class="person" aria-pressed="false" onclick="pick('好友乙',this)"><span class="avatar">乙</span><br><strong>好友乙</strong><br><small>常用收款人</small></button></div><label for="amount">转账金额 · 元</label><input id="amount" class="amount number" type="number" min=".01" step=".01" value="120"><p><small>余额不足时可返回修改，尚未确认不会扣款。</small></p><button id="over" onclick="E('amount').value=900">填入 ¥900，体验余额不足</button><p id="feedback" class="feedback" role="status" aria-live="polite"></p><button id="review" class="primary" onclick="review()">核对转账 →</button></section><section id="confirm" class="confirmation" hidden><p class="tag">最后核对</p><h2 id="summary"></h2><p>收款方确认后无法在此撤回。请核对金额和对象。</p><button id="send" class="primary" onclick="send()">确认转账</button><button style="width:100%;margin-top:12px" onclick="E('confirm').hidden=true;E('edit').hidden=false">返回修改金额</button><p id="confirmError" class="feedback error" role="alert"></p></section><section id="voucher" class="voucher" hidden><div class="success-disc">✓</div><h1>转账成功</h1><p id="voucherText"></p><p class="muted">凭证 LJ-260930-01<br>2026年9月30日 · 即时到账</p><button class="primary" onclick="E('voucher').hidden=true;E('edit').hidden=false">完成</button></section><nav class="bottom" aria-label="钱包导航"><span>◎ 钱包</span><strong>↗ 转账</strong><span>◷ 记录</span></nav></main><script>const E=id=>document.getElementById(id);let who='好友甲',balance=680,pending=0;function pick(w,b){who=w;document.querySelectorAll('.person').forEach(x=>x.setAttribute('aria-pressed',x===b));E('confirm').hidden=true}function review(){const n=Number(E('amount').value);if(!Number.isFinite(n)||n<=0||n>100000||Math.abs(n*100-Math.round(n*100))>.000001){E('feedback').textContent='请输入0.01–100000元，最多两位小数。';return}pending=Math.round(n*100);E('summary').textContent=`向${who}转账 ¥${(pending/100).toFixed(2)}`;E('confirmError').textContent='';E('edit').hidden=true;E('confirm').hidden=false}function send(){if(pending>Math.round(balance*100)){E('confirmError').textContent=`余额不足。当前可用 ¥${balance.toFixed(2)}，本次未扣款。请返回降低金额。`;return}balance=(Math.round(balance*100)-pending)/100;E('balance').textContent='¥ '+balance.toFixed(2);E('voucherText').textContent=`${who}已收到 ¥${(pending/100).toFixed(2)}`;E('confirm').hidden=true;E('voucher').hidden=false}</script></body></html>
