<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>字场 / 一张海报的工作室</title><style>:root{--page:#e6e2da;--surface:#fffaf1;--text:#2d2924;--muted:#81796d;--accent:#f39a3f;--line:#c9c2b7;--danger:#a43d28;--on:#2d2924;--radius:8px}*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--text);font:14px/1.6 "Segoe UI","Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;min-height:44px;padding:10px 18px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);color:var(--text)}button:hover{filter:brightness(.94)}button:disabled{opacity:.4;cursor:not-allowed}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.primary{background:var(--accent);color:var(--on);border-color:var(--accent);font-weight:700}input,select,textarea{min-width:0;max-width:100%;width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);color:var(--text)}textarea{resize:vertical;min-height:100px}label{display:block;font-weight:600;margin:12px 0 6px}h1,h2,h3,p{margin:0 0 16px}h1{font-size:40px;line-height:1.2;letter-spacing:-1.2px}h2{font-size:22px;line-height:1.35}h3{font-size:16px}.muted,small{color:var(--muted)}small{font-size:12px}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.spread{justify-content:space-between}.stack{display:grid;gap:16px}.box{padding:24px;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius)}.rule{border-bottom:1px solid var(--line);padding:16px 0}.tag{font-size:12px;letter-spacing:1px;text-transform:uppercase}.error{color:var(--danger);font-weight:600}.feedback{min-height:26px;margin-top:14px}hr{border:0;border-top:1px solid var(--line);margin:24px 0}[hidden]{display:none!important}.phone{max-width:390px;min-height:844px;margin:auto;background:var(--page);padding:26px 24px;position:relative}.bottom{display:flex;gap:20px;justify-content:space-around;border-top:1px solid var(--line);padding:16px 0;margin-top:28px}.number{font-variant-numeric:tabular-nums}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}@media(min-width:600px){body.mobile{background:var(--line);padding:28px}.phone{border-radius:28px;overflow:hidden;box-shadow:0 16px 60px #00000020}}@media(max-width:600px){h1{font-size:32px}.box{padding:18px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}.studio{min-height:800px;display:grid;grid-template-columns:270px 1fr 230px}.tools{padding:28px 24px;background:var(--surface);border-right:1px solid var(--line)}.tools h1{font-size:27px;font-family:SimSun,serif}.canvas-zone{padding:28px;display:grid;place-items:center;align-content:center;background-image:linear-gradient(45deg,var(--line) 25%,transparent 25%),linear-gradient(-45deg,var(--line) 25%,transparent 25%),linear-gradient(45deg,transparent 75%,var(--line) 75%),linear-gradient(-45deg,transparent 75%,var(--line) 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}.canvas-zone canvas{max-height:560px;max-width:100%;width:auto;box-shadow:0 8px 20px #00000020}.export{padding:28px 20px;background:var(--text);color:var(--surface)}.export h2{font-size:20px}.export small{color:var(--line)}.export label{color:var(--line)}.export button{width:100%;margin-top:20px}.export a{display:block;background:var(--accent);color:var(--text);padding:14px;text-align:center;font-weight:700;margin-top:16px}.check{display:flex;align-items:center;gap:8px}.check input{width:18px;min-height:18px}.size{accent-color:var(--accent);padding:0;border:0;background:none}.caption{font:12px Consolas,monospace;color:var(--muted);padding:14px;background:var(--page)}@media(max-width:1000px){.studio{grid-template-columns:220px 1fr}.export{grid-column:1/-1}.canvas-zone canvas{max-height:420px}}@media(max-width:600px){.studio{grid-template-columns:1fr}.canvas-zone{padding:20px}.canvas-zone canvas{max-height:460px}.export{grid-column:auto}}</style></head><body class="desktop"><main class="studio"><aside class="tools"><p class="tag muted">LETTER STUDIO / 07</p><h1>字场</h1><p>让一句话，<br>有自己的形状。</p><hr><label for="headline">海报标题</label><input id="headline" value="去看一场日落" maxlength="16" oninput="draw()"><label for="subline">副标题</label><input id="subline" value="把今天慢慢过完。" maxlength="28" oninput="draw()"><label for="radius">日轮大小 <span id="radiusValue">150</span>px</label><input id="radius" class="size" type="range" min="60" max="220" value="150" oninput="draw()"><label for="paper">纸面颜色</label><select id="paper" onchange="draw()"><option value="#fffaf1">暖白</option><option value="#f39a3f">落日橙</option><option value="#e6e2da">石灰</option></select><label class="check"><input id="transparent" type="checkbox" checked onchange="draw()">保留透明背景</label><p><small>改变参数，画布立即更新。<br>600 × 760 px 的一张小作品。</small></p></aside><section class="canvas-zone"><canvas id="preview" width="600" height="760" role="img" aria-label="可实时编辑的日落海报"></canvas><div class="caption">ARTBOARD 01 / 600 × 760 / LIVE PREVIEW</div></section><aside class="export"><p class="tag">完成一个小作品</p><h2>带走这张海报</h2><label for="format">导出格式</label><select id="format"><option value="png">PNG · 支持透明</option><option value="jpeg">JPEG · 不支持透明</option></select><p><small>透明背景搭配 JPEG 会被拦截。改为 PNG 或关闭透明即可。</small></p><button id="export" class="primary" onclick="exportImage()">导出海报 ↗</button><p id="feedback" class="feedback" role="status" aria-live="polite"></p><a id="download" hidden>下载导出文件</a><hr><small>预览与导出共用同一张画布。<br>尺寸与标题保持一致。</small></aside></main><script>const E=id=>document.getElementById(id);let lastUrl=null;function draw(){const c=E('preview'),x=c.getContext('2d');x.clearRect(0,0,600,760);if(!E('transparent').checked){x.fillStyle=E('paper').value;x.fillRect(0,0,600,760)}const r=Number(E('radius').value);E('radiusValue').textContent=r;x.fillStyle='#f39a3f';x.beginPath();x.arc(300,280,r,0,Math.PI*2);x.fill();x.strokeStyle='#2d2924';x.lineWidth=2;for(let i=0;i<10;i++){x.beginPath();x.moveTo(90,290+i*17);x.lineTo(510,290+i*17);x.stroke()}x.fillStyle='#2d2924';x.font='bold 38px "Microsoft YaHei",sans-serif';x.textAlign='center';x.fillText(E('headline').value,300,565,500);x.font='18px "Microsoft YaHei",sans-serif';x.fillText(E('subline').value,300,610,500);x.font='14px Consolas,monospace';x.fillText('A LITTLE SUNSET / 2026',300,680);E('download').hidden=true;E('feedback').textContent='';}function exportImage(){const format=E('format').value;if(format==='jpeg'&&E('transparent').checked){E('feedback').textContent='JPEG 不支持透明背景。请选择 PNG 或关闭透明背景。';E('feedback').classList.add('error');E('download').hidden=true;return}E('preview').toBlob(blob=>{if(!blob){E('feedback').textContent='导出失败，请重试。';return}if(lastUrl)URL['revokeObjectURL'](lastUrl);lastUrl=URL['createObjectURL'](blob);E('download').href=lastUrl;E('download').download='sunset-poster.'+(format==='jpeg'?'jpg':'png');E('download').hidden=false;E('feedback').classList.remove('error');E('feedback').textContent='导出成功 · 600 × 760 px · '+Math.round(blob.size/1024)+' KB';},'image/'+format,.92)}draw();</script></body></html>
