<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>搜索无结果 · signal-archive</title><style>:root{--page:#f7f5ee;--surface:#ffffff;--text:#243128;--muted:#7d837c;--accent:#df643f;--line:#e4e7dc;}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:var(--text);background:var(--page);font-size:15px;line-height:1.6}button,input,select{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}button,a,input,select,summary{outline-offset:4px}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--accent)}button{transition:filter .15s,transform .15s}button:hover:not(:disabled){filter:brightness(.94)}a{color:inherit}h1,h2,h3,p{margin:0}svg{display:block;max-width:100%}[hidden]{display:none!important}.sr{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}.feedback{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:12px 22px;background:var(--text);color:var(--surface);box-shadow:0 8px 30px #00000022;max-width:calc(100% - 32px);z-index:20;border-radius:8px;text-align:center}.feedback:empty{display:none}dialog{color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:12px;width:min(480px,calc(100% - 32px));padding:28px;box-shadow:0 20px 90px #00000033}dialog::backdrop{background:#00000066}dialog h2{font-size:26px;margin-bottom:12px}dialog p{margin:10px 0}dialog button{margin-top:16px;padding:10px 20px;border:0;background:var(--accent);color:var(--surface)}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
.archive{max-width:1160px;margin:auto;padding:30px 40px}.top{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:24px}.brand{font-size:21px;font-weight:800;letter-spacing:3px}.top small{font-size:12px;letter-spacing:2px;color:var(--muted)}.layout{display:grid;grid-template-columns:180px 1fr;gap:64px;padding-top:42px}.side{border-right:1px solid var(--line);padding-right:24px;font-size:13px}.side div{padding:12px 0}.side .selected{color:var(--accent);font-weight:700}.side .count{color:var(--muted);float:right}.eyebrow{font-size:12px;letter-spacing:3px;color:var(--muted)}h1{font-size:32px;font-weight:500;margin:8px 0 22px}.searchbox{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);padding:7px 8px 7px 17px;gap:14px}.searchbox input{border:0;background:transparent;flex:1;min-width:0;height:42px;color:var(--text)}.searchbox button{border:0;background:var(--text);color:var(--surface);padding:10px 23px}.queryline{font-size:13px;margin-top:14px;color:var(--muted)}.empty{padding:34px 10px 26px;text-align:center}.radar{width:230px;height:165px;margin:0 auto 18px}.empty h2{font-size:26px;font-weight:500;margin-bottom:10px}.empty p{font-size:14px;color:var(--muted)}.suggestions{border-top:1px solid var(--line);padding-top:24px;display:grid;grid-template-columns:1fr 1fr;gap:28px}.suggestions h3{font-size:15px;font-weight:600;margin-bottom:6px}.suggestions p{font-size:13px;color:var(--muted)}.suggestions button{background:none;border:0;padding:8px 0;color:var(--accent);display:flex;align-items:center;gap:10px;font-weight:600}.result{padding:26px 0;border-bottom:1px solid var(--line)}.result h3{font-size:20px}.result p{color:var(--muted);font-size:14px;margin-top:5px}.error{color:var(--accent);font-size:13px;min-height:24px}.foot{margin-top:30px;font-size:11px;color:var(--muted);letter-spacing:1px}@media(max-width:900px){.archive{padding:24px}.layout{grid-template-columns:130px 1fr;gap:28px}.side{padding-right:15px}}@media(max-width:600px){.archive{padding:20px}.layout{display:block;padding-top:24px}.side{display:none}.suggestions{grid-template-columns:1fr;gap:15px}h1{font-size:26px}.top small{display:none}}</style></head><body><main class="archive"><header class="top"><div class="brand">山外 · 文档</div><small>一个安静的知识去处</small></header><div class="layout"><aside class="side" aria-label="资料分类"><div class="selected">搜索资料</div><div>全部文档 <span class="count">128</span></div><div>设计研究 <span class="count">36</span></div><div>观察笔记 <span class="count">52</span></div><div>阅读摘录 <span class="count">40</span></div><div class="foot">私人知识库<br>更新于今天</div></aside><section><div class="eyebrow">SEARCH THE ARCHIVE / 资料检索</div><h1>找回那个灵感。</h1><form class="searchbox" id="searchForm"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/></svg><label class="sr" for="query">搜索词</label><input id="query" value="可折叠星图" autocomplete="off"><button>搜索</button></form><div class="queryline">关于「<span id="term">可折叠星图</span>」的搜索结果 · <span id="count">0</span> 份文档</div><p class="error" id="error" role="alert"></p><div id="empty" class="empty"><svg class="radar" viewBox="0 0 230 165" aria-hidden="true"><circle cx="109" cy="80" r="66" fill="#e4e7dc"/><circle cx="109" cy="80" r="47" fill="none" stroke="#ffffff" stroke-width="1.5"/><path d="M109 14v132M43 80h132" stroke="#ffffff"/><circle cx="109" cy="80" r="25" fill="none" stroke="#ffffff"/><path d="m129 106 43 36" stroke="#243128" stroke-width="12" stroke-linecap="round"/><circle cx="107" cy="77" r="34" fill="#f7f5ee" stroke="#243128" stroke-width="4"/><path d="m98 70 18 14m0-14-18 14" stroke="#7d837c" stroke-width="2"/><path d="m30 31 8 7m145-14-6 11m16 39 12 1" stroke="#df643f" stroke-width="3" stroke-linecap="round"/></svg><h2>这里还没有留下它的踪迹。</h2><p>换一种说法，灵感也许就在下一次搜索里。</p></div><div id="results" hidden></div><div class="suggestions"><article><h3>01 / 把关键词拆短一点</h3><p>长句未必更准确，试着保留最关键的两个字。</p><button type="button" data-query="星图">试试「星图」 <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 12h16m-6-6 6 6-6 6"/></svg></button></article><article><h3>02 / 换一个相关的词</h3><p>不同的作者可能给同一个想法起了别的名字。</p><button type="button" data-query="折纸">试试「折纸」 <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 12h16m-6-6 6 6-6 6"/></svg></button></article></div></section></div><footer class="foot">山外文档 © 2026 · 把零散的想法，慢慢接起来。</footer></main><div class="feedback" role="status" aria-live="polite" id="feedback"></div><script>const say=t=>document.getElementById('feedback').textContent=t;
const form=document.getElementById('searchForm'),query=document.getElementById('query');const data={星图:[['星空与折叠的秩序','设计研究 · 林屿 · 一份从星图投影到纸面折叠的观察。']],折纸:[['一张纸的十二种可能','观察笔记 · 阿芦 · 从折痕里寻找结构与节奏。']]};function search(){const q=query.value.trim();document.getElementById('error').textContent=q?'':'请输入一个关键词再搜索。';query.setAttribute('aria-invalid',String(!q));if(!q){query.focus();return}document.getElementById('term').textContent=q;const rows=data[q]||[];document.getElementById('count').textContent=rows.length;document.getElementById('empty').hidden=rows.length>0;const result=document.getElementById('results');result.hidden=!rows.length;result.replaceChildren();rows.forEach(([title,desc])=>{const a=document.createElement('article');a.className='result';const h=document.createElement('h3');h.textContent=title;const p=document.createElement('p');p.textContent=desc;a.append(h,p);result.append(a)})}form.addEventListener('submit',e=>{e.preventDefault();search()});document.querySelectorAll('[data-query]').forEach(b=>b.onclick=()=>{query.value=b.dataset.query;search()});</script></body></html>
