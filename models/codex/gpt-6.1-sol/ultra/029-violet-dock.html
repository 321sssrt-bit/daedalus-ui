<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>文件上传 · violet-dock</title><style>:root{--page:#e9eaf0;--surface:#f7f8fb;--text:#252335;--muted:#817f92;--accent:#6c48e2;--line:#cfcedb;--danger:#b44063;--outer:#e9eaf0;--font:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:var(--font);font-size:15px;line-height:1.6;color:var(--text);background:var(--page)}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.42}button:hover:not(:disabled){filter:brightness(.94)}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:3px}button,input,select,textarea{transition:background .16s ease,border-color .16s ease}a{color:inherit}h1,h2,h3,p{margin:0}h1{line-height:1.2}h2{font-size:22px;line-height:1.3}h3{font-size:17px}small,.meta{font-size:12px;color:var(--muted)}button{border:0}svg{display:block;max-width:100%}.status{min-height:24px;font-size:13px;color:var(--accent)}.status[data-error="true"]{color:var(--danger)}[hidden]{display:none!important}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}dialog{max-width:calc(100vw - 32px);border:1px solid var(--line);border-radius:16px;padding:28px;color:var(--text);background:var(--surface)}dialog::backdrop{background:#00000088}dialog button{margin-top:16px}.phone{width:390px;min-height:844px;margin:30px auto;border-radius:30px;overflow:hidden;position:relative;background:var(--surface);box-shadow:0 24px 80px #00000022}.mobile-body{background:var(--outer);padding:1px}.mobile-top{height:46px;display:flex;justify-content:space-between;align-items:center;padding:0 26px;font-weight:700;font-size:12px}.mobile-nav{display:flex;justify-content:space-around;gap:8px;padding:18px 16px;border-top:1px solid var(--line)}.mobile-nav button{background:transparent;color:var(--muted);font-size:12px}.mobile-nav button[aria-current="page"]{color:var(--accent);font-weight:700}input[type=checkbox],input[type=radio]{accent-color:var(--accent)}@media(max-width:600px){.phone{margin:0;width:100%;min-height:100vh;border-radius:0;box-shadow:none}.mobile-body{padding:0}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition:none!important}}.dock{max-width:1080px;margin:52px auto;padding:0 30px}.topline{display:flex;justify-content:space-between;font-size:12px;letter-spacing:2px;border-bottom:1px solid var(--line);padding-bottom:22px}.logo{font-weight:800;color:var(--accent)}.intro{display:flex;align-items:end;justify-content:space-between;margin:38px 0 28px}h1{font-size:48px;letter-spacing:-2px}.intro p{color:var(--muted);max-width:260px;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}.drop{border:2px dashed var(--line);padding:44px 30px;background:var(--surface);min-height:380px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}.drop.drag{border-color:var(--accent);background:var(--page)}.drop svg{width:88px;height:88px;margin-bottom:24px}.drop h2{font-size:24px}.drop p{color:var(--muted);font-size:13px;margin:10px 0 26px}.choose{background:var(--accent);color:var(--surface);padding:12px 28px;border-radius:6px}.rules{display:flex;gap:12px;margin-top:24px}.rules span{font-size:11px;background:var(--page);padding:4px 9px;color:var(--muted)}.queue{border:1px solid var(--line);background:var(--surface)}.queue-head{padding:22px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.file{display:grid;grid-template-columns:40px 1fr 24px;gap:12px;padding:22px 24px;border-bottom:1px solid var(--line);align-items:center}.file-icon{border:1px solid var(--line);width:36px;height:44px;display:grid;place-items:center;font-size:10px;color:var(--accent);font-weight:700}.file strong{font-size:13px;display:block;overflow-wrap:anywhere}.file small{font-size:11px}.remove{background:none;color:var(--muted);font-size:22px;padding:0}.processing{padding:24px}.track{height:6px;background:var(--page);margin:12px 0 10px}.fill{width:0;height:100%;background:var(--accent);transition:width .3s ease}.bottom{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:24px;margin-top:30px}.start{background:var(--text);color:var(--surface);padding:14px 28px;border-radius:6px}.meta-line{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}@media(max-width:800px){.dock{margin:28px auto;padding:0 24px}.grid{grid-template-columns:1fr}.drop{min-height:270px;padding:28px}.intro{align-items:start;gap:20px}h1{font-size:38px}.bottom{gap:20px}.intro p{max-width:220px}}@media(max-width:520px){.intro{display:block}.intro p{margin-top:14px}.bottom{flex-wrap:wrap}}</style></head><body><main class="dock"><header class="topline"><span class="logo">DOCK / 素材泊位</span><span>资源中心 &nbsp; / &nbsp; 02 导入</span></header><div class="intro"><div><small>MAKE ROOM FOR NEW IDEAS</small><h1>让文件靠岸。</h1></div><p>把分散的文件带到一个地方。<br>检查后，即可进入你的素材库。</p></div><div class="grid"><section class="drop" id="drop"><svg viewBox="0 0 100 100" aria-hidden="true"><path d="M15 60v24h70V60M50 18v50M31 37l19-19 19 19" fill="none" stroke="var(--accent)" stroke-width="5"/><path d="M7 92h86" stroke="var(--line)" stroke-width="2"/></svg><h2>拖到这里，或选择文件</h2><p>一次可以添加多份，单个不超过 20 MB。</p><button class="choose" id="choose">选择文件 +</button><input class="sr" id="file-input" type="file" multiple accept=".pdf,.png,.csv,.txt" aria-label="选择待处理文件"><div class="rules"><span>PDF</span><span>PNG</span><span>CSV</span><span>TXT</span></div></section><section class="queue"><header class="queue-head"><h3>待处理队列</h3><small id="file-count">02 份文件</small></header><div id="files"></div><div class="processing"><div class="meta-line"><span id="process-label">准备就绪</span><span id="percent">0%</span></div><div class="track"><div class="fill" id="fill"></div></div><small>文件只在本页演示处理，不会上传到服务器。</small></div></section></div><footer class="bottom"><p id="status" class="status" role="status" aria-live="polite">两份示例文件已入列，可直接体验处理。</p><button class="start" id="start">开始处理 &nbsp; ↗</button></footer></main><script>const $=id=>document.getElementById(id);function note(t,error=false){const e=$('status');e.textContent=t;e.dataset.error=String(error);}let files=[{name:'秋季品牌手册.pdf',size:2400000,state:'等待处理'},{name:'首页素材.png',size:1800000,state:'等待处理'}];let busy=false;function render(){const box=$('files');box.replaceChildren();files.forEach((f,i)=>{const row=document.createElement('div');row.className='file';const icon=document.createElement('span');icon.className='file-icon';icon.textContent=f.name.split('.').pop().toUpperCase();const info=document.createElement('div');const title=document.createElement('strong');title.textContent=f.name;const small=document.createElement('small');small.textContent=(f.size/1000000).toFixed(1)+' MB · '+f.state;info.append(title,small);const del=document.createElement('button');del.className='remove';del.textContent='×';del.disabled=busy;del.setAttribute('aria-label','移除 '+f.name);del.onclick=()=>{files.splice(i,1);render();note('已从队列移除文件');};row.append(icon,info,del);box.append(row);});$('file-count').textContent=String(files.length).padStart(2,'0')+' 份文件';$('start').disabled=busy;$('choose').disabled=busy;}function receive(list){if(busy){note('正在处理，请完成后再添加。',true);return;}let rejected=0;Array.from(list).forEach(f=>{if(f.size>20000000||! /\.(pdf|png|csv|txt)$/i.test(f.name)){rejected++;return;}files.push({name:f.name,size:f.size,state:'等待处理'});});render();note(rejected?'有 '+rejected+' 份文件不符合格式或 20 MB 限制。':'已加入队列，准备好后开始处理。',Boolean(rejected));}$('choose').onclick=()=>$('file-input').click();$('file-input').onchange=e=>{receive(e.target.files);e.target.value='';};['dragenter','dragover'].forEach(t=>$('drop').addEventListener(t,e=>{e.preventDefault();$('drop').classList.add('drag');}));['dragleave','drop'].forEach(t=>$('drop').addEventListener(t,e=>{e.preventDefault();$('drop').classList.remove('drag');}));$('drop').addEventListener('drop',e=>receive(e.dataTransfer.files));$('start').onclick=()=>{if(!files.length){note('请先选择至少一份文件。',true);return;}busy=true;files.forEach(f=>f.state='处理中');render();$('process-label').textContent='正在整理素材';note('处理已经开始，请稍候。');let p=0;const timer=setInterval(()=>{p+=25;$('fill').style.width=p+'%';$('percent').textContent=p+'%';if(p===100){clearInterval(timer);busy=false;files.forEach(f=>f.state='已完成');render();$('process-label').textContent='素材处理完成';note(files.length+' 份文件已就绪，可以在素材库使用。');}},250);};render();</script></body></html>
