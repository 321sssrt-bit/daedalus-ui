<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>日用 / 少一点，刚刚好</title><style>:root{--page:#f5f6ef;--surface:#ffffff;--text:#20271c;--muted:#65705d;--accent:#cef05a;--line:#dce1d2;--danger:#a53623;--on:#20271c;--radius:8px}*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--text);font:14px/1.6 "Segoe UI","Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;min-height:44px;padding:10px 18px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);color:var(--text)}button:hover{filter:brightness(.94)}button:disabled{opacity:.4;cursor:not-allowed}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.primary{background:var(--accent);color:var(--on);border-color:var(--accent);font-weight:700}input,select,textarea{min-width:0;max-width:100%;width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);color:var(--text)}textarea{resize:vertical;min-height:100px}label{display:block;font-weight:600;margin:12px 0 6px}h1,h2,h3,p{margin:0 0 16px}h1{font-size:40px;line-height:1.2;letter-spacing:-1.2px}h2{font-size:22px;line-height:1.35}h3{font-size:16px}.muted,small{color:var(--muted)}small{font-size:12px}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.spread{justify-content:space-between}.stack{display:grid;gap:16px}.box{padding:24px;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius)}.rule{border-bottom:1px solid var(--line);padding:16px 0}.tag{font-size:12px;letter-spacing:1px;text-transform:uppercase}.error{color:var(--danger);font-weight:600}.feedback{min-height:26px;margin-top:14px}hr{border:0;border-top:1px solid var(--line);margin:24px 0}[hidden]{display:none!important}.phone{max-width:390px;min-height:844px;margin:auto;background:var(--page);padding:26px 24px;position:relative}.bottom{display:flex;gap:20px;justify-content:space-around;border-top:1px solid var(--line);padding:16px 0;margin-top:28px}.number{font-variant-numeric:tabular-nums}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}@media(min-width:600px){body.mobile{background:var(--line);padding:28px}.phone{border-radius:28px;overflow:hidden;box-shadow:0 16px 60px #00000020}}@media(max-width:600px){h1{font-size:32px}.box{padding:18px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}.shop{max-width:1184px;margin:auto;padding:28px 32px}.shop header{border-bottom:2px solid var(--text);padding-bottom:20px}.wordmark{font-size:25px;font-weight:900}.shop-grid{display:grid;grid-template-columns:1fr 340px;gap:40px;margin-top:40px}.goods{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}.goods button{padding:0;text-align:left;border:0;background:none}.product-art{height:180px;background:var(--line);display:grid;place-items:center;margin-bottom:14px}.product-art svg{width:150px;height:150px}.product-art.milk{background:var(--accent)}.product-art.sand{background:#e8dcc5}.selected .product-art{outline:3px solid var(--text);outline-offset:4px}.bill{border-left:1px solid var(--line);padding-left:30px}.total{font-size:36px;font-weight:800}.qty input{width:74px}.shop .primary{width:100%}.receipt{background:var(--accent);padding:28px;margin-top:24px}@media(max-width:900px){.shop-grid{grid-template-columns:1fr}.bill{border-left:0;border-top:1px solid var(--line);padding:24px 0 0}.shop{padding:20px}}</style></head><body class="desktop"><main class="shop"><header class="row spread"><span class="wordmark">日用 ◒</span><span class="muted">认真挑选，长久使用</span><span>物件 / 第 07 辑</span></header><div class="shop-grid"><section><p class="tag">每天都值得一件好物</p><h1>少一点。<br>刚刚好。</h1><p class="muted">两件朴素的好东西，让桌上的日常轻一些。</p><div class="goods"><button id="cup" class="selected" onclick="pick('杯',128,this)"><div class="product-art milk"><svg viewBox="0 0 160 160" aria-label="白色陶杯"><ellipse cx="75" cy="130" rx="48" ry="7" fill="#65705d" opacity=".2"/><path d="M44 42h65v66q0 20-32 20t-33-20z" fill="#ffffff"/><path d="M108 54h10q25 0 25 23t-34 23" fill="none" stroke="#ffffff" stroke-width="12"/><ellipse cx="77" cy="42" rx="33" ry="8" fill="#dce1d2"/></svg></div><div class="row spread"><strong>慢饮陶杯</strong><span>¥128</span></div><small>320 ml · 温润哑光</small></button><button id="tray" onclick="pick('托盘',96,this)"><div class="product-art sand"><svg viewBox="0 0 160 160" aria-label="木托盘"><ellipse cx="80" cy="96" rx="65" ry="34" fill="#65705d"/><ellipse cx="80" cy="86" rx="65" ry="34" fill="#e8dcc5" stroke="#20271c" stroke-width="3"/><ellipse cx="80" cy="86" rx="52" ry="23" fill="none" stroke="#65705d"/></svg></div><div class="row spread"><strong>弧形木托盘</strong><span>¥96</span></div><small>榉木 · 细腻纹理</small></button></div></section><aside class="bill"><p class="tag">你的选择</p><h2 id="chosen">慢饮陶杯</h2><label for="variant">颜色 / 规格</label><select id="variant" onchange="syncStock();dirty()"><option value="白">雾白 · 有货</option><option value="灰">石灰 · 有货</option></select><label for="quantity">数量</label><div class="row qty"><button aria-label="减少数量" onclick="change(-1)">−</button><input id="quantity" type="number" min="1" max="20" value="1" oninput="dirty()"><button aria-label="增加数量" onclick="change(1)">＋</button></div><p><small>当前规格最多可购买 <span id="stock">5</span> 件</small></p><button id="shortage" onclick="shortages.add(product+'/'+E('variant').value);syncStock();dirty();tell('模拟缺货已开启，请加入后提交核验。',false)">让当前规格缺货</button><hr><button id="add" class="primary" onclick="addCart()">加入购物车</button><div id="cart" class="rule">购物车还是空的</div><div class="row spread"><span>合计 · 包邮</span><strong id="total" class="total number">¥0</strong></div><button id="order" class="primary" onclick="order()">提交订单</button><p id="feedback" class="feedback" role="status" aria-live="polite"></p><button id="recover" hidden onclick="recover()">改选有货颜色</button></aside></div><section id="receipt" class="receipt" hidden><p class="tag">ORDER CONFIRMED</p><h2>好物已经为你留好。</h2><p id="receiptText"></p><button onclick="location.reload()">继续挑选</button></section></main><script>const E=id=>document.getElementById(id);let product='杯',price=128,cart=null;const shortages=new Set();function getStock(){return shortages.has(product+'/'+E('variant').value)?0:5}function syncStock(){E('stock').textContent=getStock()}function recover(){const next=['白','灰'].find(v=>!shortages.has(product+'/'+v));if(!next){tell('当前商品两种颜色均缺货，请改选另一件商品。',true);return}E('variant').value=next;syncStock();dirty();tell('已改选有货规格，请重新加入购物车。',false)}function tell(t,bad){E('feedback').textContent=t;E('feedback').classList.toggle('error',bad)}function dirty(){cart=null;E('cart').textContent='选择已更新，请重新加入';E('total').textContent='¥0';E('receipt').hidden=true}function pick(p,v,b){product=p;price=v;syncStock();E('chosen').textContent=p==='杯'?'慢饮陶杯':'弧形木托盘';document.querySelectorAll('.goods button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');dirty()}function change(n){E('quantity').value=Math.min(20,Math.max(1,(Number(E('quantity').value)||1)+n));dirty()}function addCart(){const q=Number(E('quantity').value);if(!Number.isInteger(q)||q<1||q>20){tell('数量应为 1–20 的整数。',true);return}cart={p:product,v:E('variant').value,q,total:price*q};E('cart').textContent=`${E('chosen').textContent} / ${cart.v} × ${q}`;E('total').textContent='¥'+cart.total;tell('已加入，合计已更新。',false)}function order(){if(!cart){tell('请先将当前选择加入购物车。',true);return}if(cart.q>getStock()){tell(`${E('chosen').textContent} / ${cart.v} 库存不足，可用 ${getStock()} 件。订单未提交。`,true);E('recover').hidden=false;return}E('receiptText').textContent=`订单 RY-260930-01 · ${E('cart').textContent} · 实付 ¥${cart.total}`;E('receipt').hidden=false;E('recover').hidden=true;tell('订单已生成。',false)}</script></body></htm
