<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>注册 · 芽集</title><style>:root{--page:#f2e8d9;--surface:#fffaf0;--text:#3f4a32;--muted:#7c7d68;--accent:#7c8f47;--line:#d9d3bd;--danger:#b44c3c;--petal:#e9b363;}*{box-sizing:border-box}html{color-scheme:light}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;font-size:15px;line-height:1.6}button,input,select{font:inherit}button,a,input,select{ -webkit-tap-highlight-color:transparent}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}a{color:inherit}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:4px}button:hover:not(:disabled){filter:brightness(.94)}input,select{max-width:100%}input[aria-invalid="true"]{border-color:var(--danger)!important;box-shadow:0 0 0 1px var(--danger)}h1,h2,h3,p{margin:0}h1{line-height:1.13;letter-spacing:-.05em}h2{line-height:1.3}svg{max-width:100%;display:block}small,.small{font-size:12px}.muted{color:var(--muted)}.eyebrow{font-size:11px;letter-spacing:.16em;font-weight:700}.status{min-height:24px;font-size:13px;color:var(--muted)}.status.error{color:var(--danger)}.status.success{color:var(--accent)}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}[hidden]{display:none!important}dialog{border:1px solid var(--line);border-radius:16px;max-width:min(440px,calc(100% - 32px));padding:28px;background:var(--surface);color:var(--text)}dialog::backdrop{background:rgba(0,0,0,.38)}dialog input{width:100%;margin:16px 0;padding:12px;border:1px solid var(--line);background:var(--page);color:var(--text)}dialog .actions{display:flex;gap:12px;justify-content:flex-end}dialog button{padding:9px 16px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--text)}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
body{background:var(--page);color:var(--text)}.shell{max-width:1152px;margin:0 auto;padding:32px 48px 40px}.top{display:flex;justify-content:space-between;align-items:center;padding-bottom:28px;border-bottom:1px solid var(--line)}.logo{font-family:Georgia,serif;font-size:27px;letter-spacing:-.05em}.top a{font-size:13px}.layout{display:grid;grid-template-columns:1fr 1fr;gap:90px;padding-top:58px}.intro h1{font-size:54px;margin:20px 0}.intro p{max-width:340px;color:var(--muted)}.plant{width:360px;height:250px;margin:20px -20px 0}.benefits{display:flex;gap:24px;margin-top:16px;font-size:12px}.benefits span::before{content:'✓';margin-right:6px;color:var(--accent)}.sheet{background:var(--surface);padding:32px;border:1px solid var(--line);box-shadow:8px 8px 0 #d9d3bd}.sheet h2{font-size:24px}.sheet p{font-size:13px;color:var(--muted);margin-top:7px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:22px}.fields label{font-size:12px;font-weight:600}.fields .wide{grid-column:1/-1}input:not([type=checkbox]){width:100%;padding:11px 12px;margin-top:6px;border:1px solid var(--line);border-radius:0;background:transparent;color:var(--text)}.agree{display:flex;gap:8px;font-size:12px;align-items:flex-start;margin:20px 0}.agree input{margin-top:4px}.primary{background:var(--text);color:var(--surface);width:100%;border:0;padding:13px}.note{text-align:center;font-size:11px!important;margin-top:18px!important}.status{margin-top:10px}.bottom{padding-top:36px;text-align:center;font-size:11px;color:var(--muted)}@media(max-width:950px){.layout{gap:38px}.shell{padding:28px}.intro h1{font-size:44px}.sheet{padding:24px}.benefits{flex-wrap:wrap;gap:10px}}@media(max-width:650px){.shell{padding:24px}.layout{display:block;padding-top:30px}.intro h1{font-size:38px}.plant{height:150px;width:250px;margin:5px auto}.benefits{margin-bottom:28px}.sheet{padding:22px}.fields{gap:12px}.top .small{display:none}}
</style></head><body><main class="shell"><header class="top"><div class="logo">芽集 <small>SEED & CO.</small></div><span class="small muted">让生活里的灵感生根</span><a id="login-link" href="#signin">已有账号，去登录 ↗</a></header><div class="layout"><section class="intro"><div class="eyebrow">给新的开始，留一块土壤</div><h1>种下一个想法。<br>长成你的日常。</h1><p>创建你的灵感手帐，收下小小发现。<br>我们陪你把每一天，过得有枝有叶。</p><svg class="plant" viewBox="0 0 360 250" aria-hidden="true"><path d="M40 226Q180 190 320 226" fill="none" stroke="#d9d3bd" stroke-width="2"/><path d="M180 215Q180 110 208 48" fill="none" stroke="#7c8f47" stroke-width="4"/><path d="M179 164C118 170 102 102 112 84C159 85 180 115 179 164M187 131C247 143 276 90 274 64C224 68 192 89 187 131" fill="#7c8f47"/><path d="M198 71c-28-46 2-66 18-52c16-20 41 4 18 26c31 11 14 43-11 37" fill="#e9b363"/><circle cx="215" cy="47" r="8" fill="#3f4a32"/><path d="M153 214h73l-8 30h-57z" fill="#3f4a32"/><circle cx="62" cy="131" r="4" fill="#e9b363"/><circle cx="299" cy="174" r="5" fill="#e9b363"/></svg><div class="benefits"><span>免费起步</span><span>只属于你的手帐</span><span>随时带走记录</span></div></section><section class="sheet"><form id="register" novalidate><div class="eyebrow">第一张手帐 / 01</div><h2>认识一下，新朋友。</h2><p>用两分钟，开启你的灵感花园。</p><div class="fields"><label>怎么称呼你<input id="name" autocomplete="given-name" placeholder="名字或昵称" maxlength="24"></label><label>你的手帐名<input id="journal" placeholder="例如：慢慢生长" maxlength="30"></label><label class="wide">电子邮箱<input id="email" type="email" autocomplete="email" placeholder="用于保存与找回手帐"></label><label class="wide">设置密码<input id="password" type="password" autocomplete="new-password" placeholder="至少 8 位字符"></label></div><label class="agree"><input id="agree" type="checkbox"><span>我同意 <a href="#" id="terms">服务约定</a> 与 <a href="#" id="privacy">隐私说明</a>，一起认真对待每一份记录。</span></label><button class="primary">创建我的手帐 →</button><p class="note">无需信用卡 · 不会发送广告邮件</p></form><form id="signin" hidden novalidate><div class="eyebrow">欢迎回来 / SIGN IN</div><h2>回到你的灵感花园。</h2><p>使用已有账号继续记录日常。</p><div class="fields"><label class="wide">登录邮箱<input id="loginEmail" type="email" autocomplete="username" placeholder="注册时使用的邮箱"></label><label class="wide">密码<input id="loginPassword" type="password" autocomplete="current-password" placeholder="至少8位字符"></label></div><button class="primary">登录手帐 →</button><button id="returnRegister" type="button" style="width:100%;margin-top:12px">新朋友，去注册</button></form><div id="status" class="status" role="status" aria-live="polite"></div></section></div><footer class="bottom">小小的开始，也值得认真。 © 芽集 2026</footer></main><script>const $=(s)=>document.querySelector(s);function feedback(text,error=false){const n=$('#status');n.textContent=text;n.className='status '+(error?'error':'success')}function invalid(el,on=true){el.setAttribute('aria-invalid',String(on));if(on)el.focus()}$('#register').onsubmit=e=>{e.preventDefault();for(const id of ['name','journal','email','password'])invalid($('#'+id),false);const checks=[['name',v=>v.trim().length>0,'请留下你的名字或昵称。'],['journal',v=>v.trim().length>0,'请给手帐起个名字。'],['email',v=>v&&$('#email').validity.valid,'请输入有效的电子邮箱。'],['password',v=>v.length>=8,'密码至少需要 8 位字符。']];for(const [id,ok,msg] of checks)if(!ok($('#'+id).value)){invalid($('#'+id));return feedback(msg,true)}if(!$('#agree').checked){$('#agree').focus();return feedback('请先阅读并同意服务约定与隐私说明。',true)}feedback('手帐创建成功，'+$('#name').value.trim()+'，欢迎来到芽集。')};$('#login-link').onclick=e=>{e.preventDefault();$('#register').hidden=true;$('#signin').hidden=false;$('#loginEmail').value=$('#email').value;feedback('');$('#loginEmail').focus()};$('#returnRegister').onclick=()=>{$('#signin').hidden=true;$('#register').hidden=false;feedback('');$('#name').focus()};$('#signin').onsubmit=e=>{e.preventDefault();const email=$('#loginEmail'),password=$('#loginPassword');if(!email.value||!email.validity.valid){invalid(email);return feedback('请输入有效的登录邮箱。',true)}invalid(email,false);if(password.value.length<8){invalid(password);return feedback('密码至少需要8位字符。',true)}invalid(password,false);feedback('登录演示已就绪。')};for(const id of ['terms','privacy'])$('#'+id).onclick=e=>{e.preventDefault();feedback(id==='terms'?'服务约定：记录归你所有，请勿上传他人的私人资料。':'隐私说明：本演示只在当前页面处理输入，不传送或保存你的信息。')};</script></body></html>
