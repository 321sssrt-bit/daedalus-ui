<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>日历 · 时序</title><style>:root{--page:#f7f4eb;--surface:#fffdf7;--text:#27365c;--muted:#8d94a6;--accent:#526bb2;--line:#e0e1e1;--danger:#b4524e;--lavender:#dfe5f5;}*{box-sizing:border-box}html{color-scheme:light}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;font-size:15px;line-height:1.6}button,input,select{font:inherit}button,a,input,select{ -webkit-tap-highlight-color:transparent}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}a{color:inherit}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:4px}button:hover:not(:disabled){filter:brightness(.94)}input,select{max-width:100%}input[aria-invalid="true"]{border-color:var(--danger)!important;box-shadow:0 0 0 1px var(--danger)}h1,h2,h3,p{margin:0}h1{line-height:1.13;letter-spacing:-.05em}h2{line-height:1.3}svg{max-width:100%;display:block}small,.small{font-size:12px}.muted{color:var(--muted)}.eyebrow{font-size:11px;letter-spacing:.16em;font-weight:700}.status{min-height:24px;font-size:13px;color:var(--muted)}.status.error{color:var(--danger)}.status.success{color:var(--accent)}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}[hidden]{display:none!important}dialog{border:1px solid var(--line);border-radius:16px;max-width:min(440px,calc(100% - 32px));padding:28px;background:var(--surface);color:var(--text)}dialog::backdrop{background:rgba(0,0,0,.38)}dialog input{width:100%;margin:16px 0;padding:12px;border:1px solid var(--line);background:var(--page);color:var(--text)}dialog .actions{display:flex;gap:12px;justify-content:flex-end}dialog button{padding:9px 16px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--text)}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
body{background:var(--page);color:var(--text)}.shell{max-width:1160px;margin:auto;padding:30px 44px;min-height:100vh}.top{display:flex;justify-content:space-between;align-items:center;padding-bottom:22px;border-bottom:1px solid var(--line)}.brand{font-weight:700;font-size:20px}.top span:last-child{font-size:12px;color:var(--muted)}.title-row{display:flex;justify-content:space-between;align-items:center;margin:27px 0 24px}h1{font-size:34px}.title-row small{display:block;font-size:12px;color:var(--muted);margin-top:7px}.week-tools{display:flex;gap:8px;align-items:center}.week-tools button{background:var(--surface);border:1px solid var(--line);color:var(--text);width:30px;height:30px;border-radius:50%;padding:0}.week-tools span{font-size:12px;margin:0 8px}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:30px}.day{background:transparent;border:1px solid transparent;color:var(--muted);padding:10px 0 13px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:11px}.day b{font-size:22px;font-weight:500;color:var(--text);line-height:1.2}.day .dot{width:4px;height:4px;background:var(--accent);border-radius:50%}.day.active{background:var(--text);color:var(--surface)}.day.active b{color:var(--surface)}.day.active .dot{background:var(--surface)}.day:hover{border-color:var(--line)}.main{display:grid;grid-template-columns:1fr 260px;gap:40px}.agenda{border-top:1px solid var(--line)}.slot{display:grid;grid-template-columns:70px 1fr;min-height:85px;border-bottom:1px solid var(--line)}.hour{padding-top:17px;color:var(--muted);font-family:Consolas,monospace;font-size:11px}.track{padding:8px 0;border-left:1px solid var(--line);padding-left:18px}.event{border:0;border-left:3px solid var(--accent);background:var(--lavender);padding:12px 16px;text-align:left;width:100%;color:var(--text);border-radius:0 7px 7px 0}.event strong{font-size:13px;font-weight:600}.event small{display:block;font-size:10px;color:var(--muted);margin-top:4px}.slot .quiet{font-size:11px;color:var(--muted);padding-top:20px}.focus{background:var(--surface);padding:24px;border-radius:14px;height:fit-content}.focus .eyebrow{color:var(--accent)}.focus h2{font-size:22px;margin:16px 0 11px}.focus p{font-size:12px;line-height:1.9;color:var(--muted)}.focus .line{height:1px;background:var(--line);margin:24px 0}.focus footer{font-size:11px;color:var(--accent)}.status{margin-top:16px}dialog h2{font-size:23px}dialog p{font-size:13px;margin-top:10px;color:var(--muted)}@media(max-width:850px){.shell{padding:28px}.main{grid-template-columns:1fr 210px;gap:24px}.focus{padding:20px}.days{gap:4px}.day b{font-size:21px}.title-row h1{font-size:30px}}@media(max-width:600px){.shell{padding:24px}.main{display:block}.focus{display:none}.title-row{align-items:flex-start;gap:16px}h1{font-size:27px}.week-tools span{display:none}.days{margin-bottom:22px;gap:3px}.day{padding:9px 0;gap:6px;border-radius:9px}.day b{font-size:19px}.slot{grid-template-columns:48px 1fr}.track{padding-left:12px}.event{padding:11px 12px}.top span:last-child{font-size:10px}}
</style></head><body><main class="shell"><header class="top"><div class="brand">时序 <small>AGENDA</small></div><span>把时间，留给重要的人和事。</span></header><section class="title-row"><div><div class="eyebrow muted">2026 / SEPTEMBER</div><h1>九月，最后这一周。</h1><small id="selected-date">9 月 30 日，星期三</small></div><div class="week-tools"><button id="prev" aria-label="查看上周">←</button><span>9.28 — 10.04</span><button id="next" aria-label="查看下周">→</button></div></section><nav class="days" aria-label="本周日期"></nav><div class="main"><section class="agenda" id="agenda"></section><aside class="focus"><div class="eyebrow">给今天留一点空白</div><h2>不把每一格，<br>都排满。</h2><p>在会面之间留一段走路的时间。好的安排，也包括那些没有被安排的时刻。</p><div class="line"></div><footer>今天 3 项安排<br>还有一段属于自己的下午。</footer></aside></div><div id="status" class="status" role="status" aria-live="polite"></div></main><dialog id="detail"><div class="eyebrow muted">日程详情</div><h2 id="event-title"></h2><p id="event-meta"></p><p id="event-note"></p><div class="actions" style="margin-top:22px"><button id="close">关闭详情</button></div></dialog><script>const $=(s)=>document.querySelector(s);function feedback(text,error=false){const n=$('#status');n.textContent=text;n.className='status '+(error?'error':'success')}function invalid(el,on=true){el.setAttribute('aria-invalid',String(on));if(on)el.focus()}const dates=[['一','28'],['二','29'],['三','30'],['四','01'],['五','02'],['六','03'],['日','04']];let selected=2;const events=[{hour:'09:00',title:'晨间整理',meta:'09:00 — 09:30 · 个人安排',note:'回顾昨天的记录，给今天选出最重要的一件事。'},{hour:'11:00',title:'和许禾讨论展览册',meta:'11:00 — 12:00 · 街角咖啡 · 2 人',note:'带上第二版样稿。重点确认目录、封面与纸张样。'},{hour:'15:00',title:'去书店取预订',meta:'15:00 — 15:30 · 山野书店',note:'取《花园的时间》，店员已为你留在柜台。'}];function render(){const nav=$('.days');nav.replaceChildren();dates.forEach((d,i)=>{const b=document.createElement('button');b.className='day'+(i===selected?' active':'');b.setAttribute('aria-pressed',String(i===selected));b.innerHTML='<span>周'+d[0]+'</span><b>'+d[1]+'</b><i class="dot"></i>';b.onclick=()=>{selected=i;render();feedback('已切换到'+(i<3?'9':'10')+'月'+d[1]+'日。')};nav.append(b)});$('#selected-date').textContent=(selected<3?'9':'10')+' 月 '+dates[selected][1]+' 日，星期'+dates[selected][0];const a=$('#agenda');a.replaceChildren();for(const hour of ['09:00','10:00','11:00','12:00','14:00','15:00']){const slot=document.createElement('div');slot.className='slot';const h=document.createElement('div'),t=document.createElement('div');h.className='hour';h.textContent=hour;t.className='track';const ev=events.find(e=>e.hour===hour);if(ev&&selected<5){const b=document.createElement('button');b.className='event';const title=document.createElement('strong'),m=document.createElement('small');title.textContent=ev.title;m.textContent=ev.meta;b.append(title,m);b.onclick=()=>{$('#event-title').textContent=ev.title;$('#event-meta').textContent=$('#selected-date').textContent+' · '+ev.meta;$('#event-note').textContent=ev.note;$('#detail').showModal()};t.append(b)}else if(hour==='14:00'){const q=document.createElement('div');q.className='quiet';q.textContent=selected>=5?'周末留白，暂时没有安排。':'一段不被打扰的专注时间';t.append(q)}slot.append(h,t);a.append(slot)}}render();$('#close').onclick=()=>$('#detail').close();$('#prev').onclick=()=>feedback('当前演示只包含 9 月 28 日至 10 月 4 日，本周日期可直接切换。',true);$('#next').onclick=()=>feedback('下一周尚未安排。当前演示请使用本周日期。',true);</script></body></html>
