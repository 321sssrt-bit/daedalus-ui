<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>山海线 / 去远一点的地方</title><style>:root{--page:#faf5e9;--surface:#ffffff;--text:#312d26;--muted:#8b8171;--accent:#b9392f;--line:#e5dbca;--danger:#9f3127;--on:#ffffff;--radius:8px}*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--text);font:14px/1.6 "Segoe UI","Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;min-height:44px;padding:10px 18px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);color:var(--text)}button:hover{filter:brightness(.94)}button:disabled{opacity:.4;cursor:not-allowed}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.primary{background:var(--accent);color:var(--on);border-color:var(--accent);font-weight:700}input,select,textarea{min-width:0;max-width:100%;width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);color:var(--text)}textarea{resize:vertical;min-height:100px}label{display:block;font-weight:600;margin:12px 0 6px}h1,h2,h3,p{margin:0 0 16px}h1{font-size:40px;line-height:1.2;letter-spacing:-1.2px}h2{font-size:22px;line-height:1.35}h3{font-size:16px}.muted,small{color:var(--muted)}small{font-size:12px}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.spread{justify-content:space-between}.stack{display:grid;gap:16px}.box{padding:24px;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius)}.rule{border-bottom:1px solid var(--line);padding:16px 0}.tag{font-size:12px;letter-spacing:1px;text-transform:uppercase}.error{color:var(--danger);font-weight:600}.feedback{min-height:26px;margin-top:14px}hr{border:0;border-top:1px solid var(--line);margin:24px 0}[hidden]{display:none!important}.phone{max-width:390px;min-height:844px;margin:auto;background:var(--page);padding:26px 24px;position:relative}.bottom{display:flex;gap:20px;justify-content:space-around;border-top:1px solid var(--line);padding:16px 0;margin-top:28px}.number{font-variant-numeric:tabular-nums}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}@media(min-width:600px){body.mobile{background:var(--line);padding:28px}.phone{border-radius:28px;overflow:hidden;box-shadow:0 16px 60px #00000020}}@media(max-width:600px){h1{font-size:32px}.box{padding:18px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}.rail{padding:28px 24px}.rail h1{font-family:SimSun,serif;font-size:34px;line-height:1.45}.rail-head{padding-bottom:22px;border-bottom:2px solid var(--text)}.rail-hero{display:flex;align-items:center;justify-content:space-between;padding:26px 0}.rail-symbol{width:75px;height:90px;border:3px solid var(--accent);border-radius:40px 40px 12px 12px;display:grid;place-items:center;color:var(--accent);font-size:40px}.route{display:grid;grid-template-columns:1fr 28px 1fr;gap:8px;align-items:end}.route input,.route select{border:0;border-bottom:1px solid var(--text);border-radius:0;background:transparent;padding-left:0}.rail .primary{width:100%;border-radius:0;margin-top:18px}.rail .train{width:100%;text-align:left;background:var(--surface);margin:10px 0;padding:18px;border-radius:0}.train[aria-pressed=true]{border:2px solid var(--accent)}.seats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}.seat[aria-pressed=true]{background:var(--accent);color:var(--surface)}.ticket{border-top:8px solid var(--accent);padding:24px;background:var(--surface);margin-top:24px}.ticket .cut{border-top:2px dashed var(--line);margin:20px -24px;padding-top:20px}.ticket h2{font-family:SimSun,serif;font-size:30px}.rail .status{font-family:Consolas,monospace;letter-spacing:2px;font-size:12px}.rail button.secondary{margin-top:12px;width:100%}</style></head><body class="mobile"><main class="phone rail"><header class="rail-head row spread"><strong>山海线</strong><span class="status">RAIL / JOURNEY</span></header><section id="search"><div class="rail-hero"><h1>去远一点<br>的地方。</h1><div class="rail-symbol" aria-hidden="true">↟</div></div><p class="muted">从熟悉的街口，到另一座城的清晨。</p><div class="route"><div><label for="from">出发</label><select id="from"><option>林城</option><option>海港</option></select></div><span style="padding-bottom:12px">→</span><div><label for="to">抵达</label><select id="to"><option>山城</option><option>河湾</option></select></div></div><label for="date">出行日期</label><input id="date" type="date" value="2026-10-03" min="2026-09-30"><button id="searchBtn" class="primary" onclick="search()">查询班次 →</button></section><section id="results" hidden><hr><div class="row spread"><h2>挑一个出发时刻</h2><small id="routeText"></small></div><button id="train0" class="train" aria-pressed="true" onclick="chooseTrain(0,this)"><strong>08:40 → 10:25</strong><br><small>山海01 · 直达 · ¥86</small></button><button id="train1" class="train" aria-pressed="false" onclick="chooseTrain(1,this)"><strong>11:20 → 13:05</strong><br><small>山海03 · 直达 · ¥86</small></button><label>选择座位</label><div class="seats"><button id="seatA" class="seat" aria-pressed="true" onclick="chooseSeat('1A',this)">1A · 靠窗有票</button><button id="seatB" class="seat" aria-pressed="false" onclick="chooseSeat('1B',this)">1B · 触发售罄检查</button></div><button id="review" class="primary" onclick="review()">核对订单</button></section><section id="confirm" class="ticket" hidden><p class="status">BEFORE DEPARTURE</p><h2 id="confirmRoute"></h2><p id="summary"></p><div class="cut"><strong>应付 ¥86</strong></div><button id="book" class="primary" onclick="book()">确认预订</button><button class="secondary" onclick="E('confirm').hidden=true;E('results').hidden=false">返回改选座位</button></section><p id="feedback" class="feedback" role="status" aria-live="polite"></p><section id="ticket" class="ticket" hidden><p class="status">JOURNEY CONFIRMED / ✓</p><h2>这一程，已为你留好。</h2><p id="ticketText"></p><div class="cut"><strong>SH-260930-01</strong><br><small>凭证已生成 · 请提前20分钟抵达</small></div><button onclick="location.reload()">完成</button></section></main><script>const E=id=>document.getElementById(id);let train=0,seat='1A',route=null;function search(){if(!E('date').value||E('date').value<'2026-09-30'){E('feedback').textContent='请选择2026年9月30日及之后的日期。';return}route={from:E('from').value,to:E('to').value,date:E('date').value};E('routeText').textContent=route.from+'→'+route.to;E('results').hidden=false;E('confirm').hidden=true;E('ticket').hidden=true;E('feedback').textContent='已找到2个班次。'}function chooseTrain(n,b){train=n;document.querySelectorAll('.train').forEach(x=>x.setAttribute('aria-pressed',x===b));E('confirm').hidden=true}function chooseSeat(s,b){seat=s;document.querySelectorAll('.seat').forEach(x=>x.setAttribute('aria-pressed',x===b));E('confirm').hidden=true}function review(){E('confirmRoute').textContent=route.from+' → '+route.to;E('summary').textContent=route.date+' · '+(train===0?'08:40 山海01':'11:20 山海03')+' · '+seat+'座';E('confirm').hidden=false;E('results').hidden=true;E('feedback').textContent='';}function book(){if(seat==='1B'){E('feedback').textContent='1B座已售罄。本次未预订，路线与日期已保留，请返回改选1A。';E('feedback').classList.add('error');return}E('ticketText').textContent=E('confirmRoute').textContent+' · '+E('summary').textContent+' · 实付¥86';E('confirm').hidden=true;E('ticket').hidden=false;E('feedback').textContent='预订成功，行程凭证已生成。';E('feedback').classList.remove('error');}</script></body></html>
