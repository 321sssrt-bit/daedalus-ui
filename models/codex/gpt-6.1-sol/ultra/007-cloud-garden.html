<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>欢迎空态 · 云圃</title><style>:root{--page:#edf5f1;--surface:#ffffff;--text:#305b4d;--muted:#81998d;--accent:#44876c;--line:#d9e6de;--danger:#bb6052;--cloud:#d6ede2;}*{box-sizing:border-box}html{color-scheme:light}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;font-size:15px;line-height:1.6}button,input,select{font:inherit}button,a,input,select{ -webkit-tap-highlight-color:transparent}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}a{color:inherit}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:4px}button:hover:not(:disabled){filter:brightness(.94)}input,select{max-width:100%}input[aria-invalid="true"]{border-color:var(--danger)!important;box-shadow:0 0 0 1px var(--danger)}h1,h2,h3,p{margin:0}h1{line-height:1.13;letter-spacing:-.05em}h2{line-height:1.3}svg{max-width:100%;display:block}small,.small{font-size:12px}.muted{color:var(--muted)}.eyebrow{font-size:11px;letter-spacing:.16em;font-weight:700}.status{min-height:24px;font-size:13px;color:var(--muted)}.status.error{color:var(--danger)}.status.success{color:var(--accent)}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}[hidden]{display:none!important}dialog{border:1px solid var(--line);border-radius:16px;max-width:min(440px,calc(100% - 32px));padding:28px;background:var(--surface);color:var(--text)}dialog::backdrop{background:rgba(0,0,0,.38)}dialog input{width:100%;margin:16px 0;padding:12px;border:1px solid var(--line);background:var(--page);color:var(--text)}dialog .actions{display:flex;gap:12px;justify-content:flex-end}dialog button{padding:9px 16px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--text)}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
body{background:var(--page);color:var(--text)}.shell{max-width:1200px;min-height:100vh;margin:auto;padding:28px 44px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:22px;font-weight:700}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--cloud);font-size:12px}.nav{display:flex;gap:28px;border-bottom:1px solid var(--line);margin-top:28px;font-size:13px;color:var(--muted)}.nav button{border:0;background:none;color:inherit;padding:0 0 13px}.nav button.active{color:var(--text);border-bottom:2px solid var(--accent)}.empty{text-align:center;max-width:580px;margin:40px auto 0}.garden{width:350px;height:215px;margin:auto}.eyebrow{margin-top:16px;color:var(--accent)}h1{font-size:37px;margin:16px 0}.empty p{color:var(--muted);line-height:1.85;font-size:14px}.actions{display:flex;gap:12px;justify-content:center;margin-top:26px}.primary,.secondary{padding:12px 22px;border-radius:24px;font-weight:600;font-size:13px}.primary{border:1px solid var(--accent);background:var(--accent);color:var(--surface)}.secondary{border:1px solid var(--line);background:var(--surface);color:var(--text)}.status{margin-top:18px}.tips{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;border-top:1px solid var(--line);padding-top:26px;margin-top:44px}.tip{display:flex;gap:12px}.tip .icon{height:34px;width:34px;flex:none;background:var(--cloud);border-radius:12px;display:grid;place-items:center;color:var(--accent)}.tip h3{font-size:13px}.tip p{font-size:12px;color:var(--muted);margin-top:4px}.projects{margin:34px auto;max-width:760px}.project{padding:24px;border-radius:16px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:18px;margin-top:15px}.project h2{font-size:19px}.project p{font-size:12px;color:var(--muted);margin-top:6px}.project button{border:0;background:var(--cloud);color:var(--text);padding:9px 15px;border-radius:30px}@media(max-width:800px){.shell{padding:28px}.tips{gap:18px}.empty{margin-top:30px}.garden{height:195px}}@media(max-width:550px){.shell{padding:24px}.nav{gap:22px}.empty{margin-top:25px}.garden{width:290px;height:175px}h1{font-size:30px}.actions{flex-direction:column}.tips{grid-template-columns:1fr;gap:20px;margin-top:28px}.project{padding:20px;align-items:flex-start}.project button{white-space:nowrap}}
.project>div{min-width:0;flex:1}.project h2,.project p,#status{overflow-wrap:anywhere}.project>button{flex-shrink:0}</style></head><body><main class="shell"><header class="top"><div class="brand">云圃 <small class="muted">一个想法，一片生长</small></div><div class="avatar" aria-label="林沐的账号">沐</div></header><nav class="nav" aria-label="工作空间"><button class="active" data-tab="我的项目">我的项目</button><button data-tab="最近打开">最近打开</button><button data-tab="已归档">已归档</button></nav><section id="empty" class="empty"><svg class="garden" viewBox="0 0 350 215" aria-hidden="true"><ellipse cx="177" cy="184" rx="136" ry="17" fill="#d6ede2"/><path d="M72 128c-39 0-37-46-12-49c-5-38 44-47 56-22c24-8 36 5 36 24c35 5 32 47 0 47z" fill="#ffffff"/><path d="M221 89c-29 0-29-32-9-36c-2-24 27-29 40-12c25-7 42 10 34 26c22 5 17 22-7 22z" fill="#ffffff"/><path d="M143 151h71l-9 44h-53z" fill="#44876c"/><path d="M179 158V80" stroke="#305b4d" stroke-width="3"/><path d="M178 120c-43 4-46-37-40-44c29 1 39 18 40 44M180 99c39 3 42-32 39-41c-28 2-40 19-39 41" fill="#44876c"/><circle cx="69" cy="158" r="4" fill="#81998d"/><path d="M248 136v40M231 154h35" stroke="#81998d" stroke-width="2"/><circle cx="282" cy="131" r="4" fill="#d6ede2"/></svg><div class="eyebrow">你好，林沐。欢迎来到云圃。</div><h1>这里还空着，<br>正好装下你的下一个想法。</h1><p>从一个小项目开始，把想法养成计划。<br>你可以独自探索，也可以慢慢邀请伙伴。</p><div class="actions"><button class="primary" id="create">＋ 创建第一个项目</button><button class="secondary" id="sample">先看看示例</button></div></section><section id="projects" class="projects" hidden></section><div id="status" class="status" role="status" aria-live="polite"></div><section class="tips"><div class="tip"><div class="icon">✦</div><div><h3>不必从完美开始</h3><p>一个名字，就能成为起点。</p></div></div><div class="tip"><div class="icon">▧</div><div><h3>让进度有迹可循</h3><p>清单、文件、讨论放在一起。</p></div></div><div class="tip"><div class="icon">♡</div><div><h3>你的节奏，你决定</h3><p>今天种下一点，明天再继续。</p></div></div></section></main><dialog id="new"><h2>给新项目起个名字</h2><p class="muted small">先从一句话开始，以后随时可修改。</p><form id="new-form" novalidate><label for="project-name" class="sr">项目名称</label><input id="project-name" placeholder="例如：阳台花园计划" maxlength="40"><p id="dialog-error" class="status error" role="alert"></p><div class="actions"><button type="button" id="cancel">取消</button><button class="primary">创建项目</button></div></form></dialog><script>const $=(s)=>document.querySelector(s);function feedback(text,error=false){const n=$('#status');n.textContent=text;n.className='status '+(error?'error':'success')}function invalid(el,on=true){el.setAttribute('aria-invalid',String(on));if(on)el.focus()}const list=[];function render(){const p=$('#projects');p.replaceChildren();list.forEach(name=>{const row=document.createElement('article');row.className='project';const d=document.createElement('div'),h=document.createElement('h2'),t=document.createElement('p'),b=document.createElement('button');h.textContent=name;t.textContent='刚刚创建 · 0 项任务 · 只有你';b.textContent='打开项目 ↗';b.onclick=()=>feedback('已打开“'+name+'”，可以开始添加你的第一项任务。');d.append(h,t);row.append(d,b);p.append(row)});p.hidden=!list.length;$('#empty').hidden=!!list.length}$('#create').onclick=()=>{$('#new').showModal();$('#project-name').focus()};$('#cancel').onclick=()=>$('#new').close();$('#new-form').onsubmit=e=>{e.preventDefault();const n=$('#project-name');if(!n.value.trim()){$('#dialog-error').textContent='请先输入项目名称。';invalid(n);return}list.push(n.value.trim());$('#new').close();render();feedback('第一个项目已创建，开始照顾这个新想法吧。')};$('#sample').onclick=()=>{if(!list.includes('一周的阳台花园'))list.push('一周的阳台花园');render();feedback('已加入示例项目，你可以点开看看。')};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));if(b.dataset.tab==='已归档'){feedback('还没有已归档项目。完成一个项目后，可以将它归档。');$('#projects').hidden=true;$('#empty').hidden=true}else{render();feedback(b.dataset.tab+'已显示。')}});</script></body></html>
