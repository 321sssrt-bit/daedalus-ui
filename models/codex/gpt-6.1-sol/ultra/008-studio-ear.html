<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>权限请求 · 声间</title><style>:root{--page:#f8d9c9;--surface:#fff5ef;--text:#693d34;--muted:#ae7e6f;--accent:#c86d50;--line:#e9b8a4;--danger:#a34135;--poster:#f1b79e;}*{box-sizing:border-box}html{color-scheme:light}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;font-size:15px;line-height:1.6}button,input,select{font:inherit}button,a,input,select{ -webkit-tap-highlight-color:transparent}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}a{color:inherit}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:4px}button:hover:not(:disabled){filter:brightness(.94)}input,select{max-width:100%}input[aria-invalid="true"]{border-color:var(--danger)!important;box-shadow:0 0 0 1px var(--danger)}h1,h2,h3,p{margin:0}h1{line-height:1.13;letter-spacing:-.05em}h2{line-height:1.3}svg{max-width:100%;display:block}small,.small{font-size:12px}.muted{color:var(--muted)}.eyebrow{font-size:11px;letter-spacing:.16em;font-weight:700}.status{min-height:24px;font-size:13px;color:var(--muted)}.status.error{color:var(--danger)}.status.success{color:var(--accent)}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}[hidden]{display:none!important}dialog{border:1px solid var(--line);border-radius:16px;max-width:min(440px,calc(100% - 32px));padding:28px;background:var(--surface);color:var(--text)}dialog::backdrop{background:rgba(0,0,0,.38)}dialog input{width:100%;margin:16px 0;padding:12px;border:1px solid var(--line);background:var(--page);color:var(--text)}dialog .actions{display:flex;gap:12px;justify-content:flex-end}dialog button{padding:9px 16px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--text)}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
body{background:var(--page);color:var(--text)}.shell{min-height:100vh;max-width:1180px;margin:auto;padding:40px 48px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:24px;font-weight:700}.top span:last-child{font-size:11px;color:var(--muted)}.layout{display:grid;grid-template-columns:1fr 1fr;gap:70px;align-items:center;padding:50px 0 30px}.poster{height:510px;background:var(--poster);border-radius:180px 180px 0 0;position:relative;padding:40px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}.poster h2{font-size:60px;letter-spacing:-.06em;line-height:1}.poster svg{height:270px;width:100%}.poster p{font-size:11px;letter-spacing:.1em}.copy .eyebrow{color:var(--accent)}h1{font-size:39px;margin:20px 0}.copy>p{font-size:14px;line-height:1.9;color:var(--muted)}.reasons{margin:26px 0;padding:0;list-style:none}.reasons li{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:13px}.reasons b{font-size:18px;color:var(--accent)}.choices{display:grid;gap:10px}.choices button{padding:13px;border-radius:5px;font-weight:600;font-size:13px}.primary{background:var(--accent);color:var(--surface);border:1px solid var(--accent)}.once{background:var(--surface);border:1px solid var(--line);color:var(--text)}.deny{border:0;background:transparent;color:var(--muted)}.status{margin-top:12px}.privacy{font-size:11px!important;margin-top:20px}.badge{display:inline-block;background:var(--surface);border:1px solid var(--line);padding:8px 14px;border-radius:20px;margin-top:20px;font-size:12px}@media(max-width:850px){.shell{padding:28px}.layout{gap:36px;padding-top:36px}.poster{height:480px;padding:28px}.poster h2{font-size:50px}h1{font-size:34px}}@media(max-width:600px){.shell{padding:24px}.layout{display:block;padding-top:30px}.poster{height:170px;border-radius:85px 85px 0 0;padding:25px 35px;flex-direction:row;align-items:center}.poster h2{font-size:40px}.poster svg{height:125px;width:110px}.poster p{display:none}.copy{padding-top:30px}h1{font-size:31px}.reasons{margin:20px 0}}
</style></head><body><main class="shell"><header class="top"><div class="brand">声间 <small>SONORA</small></div><span>录下此刻，也听见自己。</span></header><div class="layout"><aside class="poster" aria-hidden="true"><h2>听见。<br>留住。</h2><svg viewBox="0 0 250 300"><path d="M124 258c-25 0-30-31-29-50c0-15-27-32-37-49C26 101 56 28 118 24c64-6 92 43 75 92c-14 42-42 49-42 71c0 43-6 71-27 71z" fill="none" stroke="#693d34" stroke-width="7"/><path d="M86 138c-13-28-7-66 26-74c42-10 54 26 40 51c-7 13-25 22-22 38c2 17-17 25-27 13" fill="none" stroke="#c86d50" stroke-width="7" stroke-linecap="round"/><path d="M211 92v65M228 108v34M20 98v57M4 114v24" stroke="#fff5ef" stroke-width="4" stroke-linecap="round"/></svg><p>YOUR VOICE, YOUR SPACE.</p></aside><section class="copy"><div class="eyebrow">开始录音之前 / ONE SMALL ASK</div><h1>让声间，<br>听到你的声音。</h1><p>声间需要使用麦克风，才能录下你的口述、访谈与一闪而过的灵感。由你决定什么时候开始，什么时候停止。</p><ul class="reasons"><li><b>◉</b><span>只在你点击录音后，才使用麦克风。</span></li><li><b>◇</b><span>录音保存在你的空间，默认不与他人分享。</span></li><li><b>↩</b><span>你可以随时在系统设置里撤回权限。</span></li></ul><div class="choices"><button id="allow" class="primary">允许使用麦克风</button><button id="once" class="once">仅允许这一次</button><button id="deny" class="deny">暂时不允许，继续浏览</button></div><div id="status" class="status" role="status" aria-live="polite"></div><div id="badge" class="badge" hidden></div><p class="privacy">你的选择会先在此页确认；此离线演示不会调用设备麦克风。</p></section></div></main><script>const $=(s)=>document.querySelector(s);function feedback(text,error=false){const n=$('#status');n.textContent=text;n.className='status '+(error?'error':'success')}function invalid(el,on=true){el.setAttribute('aria-invalid',String(on));if(on)el.focus()}function choose(mode){const text={allow:'已允许。点击录音时即可使用麦克风，你随时可以撤回。',once:'本次会话已允许。离开后将再次询问。',deny:'已保持麦克风关闭，你仍可以浏览和整理已有录音。'};feedback(text[mode]);$('#badge').hidden=false;$('#badge').textContent=mode==='deny'?'麦克风关闭 · 浏览模式':mode==='once'?'麦克风仅本次可用':'麦克风已授权';document.querySelectorAll('.choices button').forEach(b=>b.setAttribute('aria-pressed',String(b.id===mode)))}for(const mode of ['allow','once','deny'])$('#'+mode).onclick=()=>choose(mode);</script></body></html>
