<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>街角 / 今日的附近</title><style>:root{--page:#f8f3ed;--surface:#ffffff;--text:#3a2923;--muted:#88796d;--accent:#c93a28;--line:#e5d5c8;--danger:#a72d22;--on:#ffffff;--radius:8px}*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--text);font:14px/1.6 "Segoe UI","Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;min-height:44px;padding:10px 18px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);color:var(--text)}button:hover{filter:brightness(.94)}button:disabled{opacity:.4;cursor:not-allowed}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.primary{background:var(--accent);color:var(--on);border-color:var(--accent);font-weight:700}input,select,textarea{min-width:0;max-width:100%;width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);color:var(--text)}textarea{resize:vertical;min-height:100px}label{display:block;font-weight:600;margin:12px 0 6px}h1,h2,h3,p{margin:0 0 16px}h1{font-size:40px;line-height:1.2;letter-spacing:-1.2px}h2{font-size:22px;line-height:1.35}h3{font-size:16px}.muted,small{color:var(--muted)}small{font-size:12px}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.spread{justify-content:space-between}.stack{display:grid;gap:16px}.box{padding:24px;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius)}.rule{border-bottom:1px solid var(--line);padding:16px 0}.tag{font-size:12px;letter-spacing:1px;text-transform:uppercase}.error{color:var(--danger);font-weight:600}.feedback{min-height:26px;margin-top:14px}hr{border:0;border-top:1px solid var(--line);margin:24px 0}[hidden]{display:none!important}.phone{max-width:390px;min-height:844px;margin:auto;background:var(--page);padding:26px 24px;position:relative}.bottom{display:flex;gap:20px;justify-content:space-around;border-top:1px solid var(--line);padding:16px 0;margin-top:28px}.number{font-variant-numeric:tabular-nums}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}@media(min-width:600px){body.mobile{background:var(--line);padding:28px}.phone{border-radius:28px;overflow:hidden;box-shadow:0 16px 60px #00000020}}@media(max-width:600px){h1{font-size:32px}.box{padding:18px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}.social{padding:24px 20px}.masthead{border-top:5px solid var(--accent);border-bottom:1px solid var(--text);padding:18px 0}.masthead h1{font-family:SimSun,serif;font-size:38px;letter-spacing:4px;margin:0}.issue{font:11px Consolas,monospace;letter-spacing:2px}.feed article{padding:24px 0;border-bottom:1px solid var(--line)}.feed h2{font:700 23px/1.4 SimSun,serif;margin:12px 0}.poster{height:144px;background:var(--accent);display:flex;align-items:end;padding:20px;margin:16px 0;color:var(--page);font:700 28px/1.2 SimSun,serif}.poster b{font-size:72px;margin-right:20px;line-height:1}.social textarea{background:transparent;border:0;border-bottom:1px solid var(--text);border-radius:0;padding:8px 0}.social .primary{border-radius:0}.compose{padding-top:24px}.draft{white-space:pre-wrap;overflow-wrap:anywhere}.scope{font-size:11px;border:1px solid var(--line);padding:3px 8px}.social .bottom{position:relative;font-size:12px}</style></head><body class="mobile"><main class="phone social"><div class="issue row spread"><span>THE CORNER</span><span>2026 / 09 / 30</span></div><header class="masthead row spread"><h1>街角</h1><span class="tag">附近的好日子</span></header><section class="feed" id="feed"><article><div class="row spread"><strong>邻居甲</strong><span class="scope">公开</span></div><h2>把一张椅子，<br>搬到秋天里。</h2><div class="poster" aria-label="街角树与长椅插画"><b>♧</b><span>下楼坐坐<br>星期三的公园</span></div><p>楼下桂花开了，带一本书，什么也不赶。</p><small>12分钟前 · 8位邻居喜欢</small></article><article><div class="row spread"><strong>街区图书室</strong><span class="scope">公开</span></div><h2>周末换书，就差你的那本。</h2><p>带一本看完的书，换一个新故事。周六14:00见。</p><small>35分钟前 · 图书室消息</small></article></section><section class="compose"><h2>你在附近发现了什么？</h2><label for="post" class="sr">新动态内容</label><textarea id="post" maxlength="800" placeholder="记下一件小小的好事……"></textarea><label for="scope">谁可以看见</label><select id="scope"><option>公开</option><option>仅邻居</option><option>仅自己</option></select><div class="row spread" style="margin-top:16px"><button id="fail" onclick="nextFails=!nextFails;this.setAttribute('aria-pressed',nextFails);this.textContent=nextFails?'本次将失败 · 点击取消':'模拟本次发布失败'" aria-pressed="false">模拟本次发布失败</button><button id="publish" class="primary" onclick="publish()">发布 ↗</button></div><p id="feedback" class="feedback" role="status" aria-live="polite"></p><button id="retry" hidden onclick="nextFails=false;publish()">恢复连接并重试发布</button></section><nav class="bottom"><strong>街角</strong><span>发现</span><span>我的小屋</span></nav></main><script>const E=id=>document.getElementById(id);let nextFails=false;function publish(){const text=E('post').value.trim();if(!text){E('feedback').textContent='写点内容再发布吧。';return}if(nextFails){E('feedback').textContent='发布未完成，草稿和可见范围已完整保留。';E('feedback').classList.add('error');E('retry').hidden=false;return}const a=document.createElement('article'),head=document.createElement('div'),who=document.createElement('strong'),scope=document.createElement('span'),body=document.createElement('p'),time=document.createElement('small');head.className='row spread';who.textContent='我';scope.className='scope';scope.textContent=E('scope').value;head.append(who,scope);body.className='draft';body.textContent=text;time.textContent='刚刚 · 发布成功';a.append(head,body,time);E('feed').prepend(a);E('post').value='';E('feedback').textContent='已发布，在动态最上方可以看到。';E('feedback').classList.remove('error');E('retry').hidden=true;nextFails=false;E('fail').setAttribute('aria-pressed','false');E('fail').textContent='模拟本次发布失败'}</script></body></html>
