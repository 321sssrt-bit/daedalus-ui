<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>看板 · 迭代局</title><style>:root{--page:#f4f3f0;--surface:#ffffff;--text:#202020;--muted:#8b8985;--accent:#c43973;--line:#d8d6d1;--danger:#a9333b;--ink:#f2d5e0;}*{box-sizing:border-box}html{color-scheme:light}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;font-size:15px;line-height:1.6}button,input,select{font:inherit}button,a,input,select{ -webkit-tap-highlight-color:transparent}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}a{color:inherit}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:4px}button:hover:not(:disabled){filter:brightness(.94)}input,select{max-width:100%}input[aria-invalid="true"]{border-color:var(--danger)!important;box-shadow:0 0 0 1px var(--danger)}h1,h2,h3,p{margin:0}h1{line-height:1.13;letter-spacing:-.05em}h2{line-height:1.3}svg{max-width:100%;display:block}small,.small{font-size:12px}.muted{color:var(--muted)}.eyebrow{font-size:11px;letter-spacing:.16em;font-weight:700}.status{min-height:24px;font-size:13px;color:var(--muted)}.status.error{color:var(--danger)}.status.success{color:var(--accent)}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}[hidden]{display:none!important}dialog{border:1px solid var(--line);border-radius:16px;max-width:min(440px,calc(100% - 32px));padding:28px;background:var(--surface);color:var(--text)}dialog::backdrop{background:rgba(0,0,0,.38)}dialog input{width:100%;margin:16px 0;padding:12px;border:1px solid var(--line);background:var(--page);color:var(--text)}dialog .actions{display:flex;gap:12px;justify-content:flex-end}dialog button{padding:9px 16px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--text)}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
body{background:var(--page);color:var(--text)}.shell{padding:32px 40px;max-width:1440px;margin:auto;min-height:100vh}.top{display:flex;align-items:center;justify-content:space-between;padding-bottom:25px;border-bottom:2px solid var(--text)}.brand{font-weight:900;font-size:23px;letter-spacing:-.08em}.team{font-size:11px;color:var(--muted)}.heading{display:flex;justify-content:space-between;align-items:end;margin:30px 0 25px}h1{font-size:38px}.heading p{font-size:12px;color:var(--muted);margin-top:9px}.add{background:var(--text);color:var(--surface);border:0;padding:11px 18px;font-size:12px;font-weight:700}.toolbar{display:flex;gap:20px;align-items:center;font-size:11px;margin-bottom:27px;color:var(--muted)}.toolbar button{border:0;background:none;padding:4px 0;color:var(--accent);font-size:11px}.toolbar .pill{margin-left:auto;padding:4px 8px;border:1px solid var(--line);color:var(--text)}.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}.column{min-width:0;min-height:415px;background-image:radial-gradient(var(--line) .8px,transparent .8px);background-size:10px 10px}.column-head{display:flex;align-items:center;justify-content:space-between;border-top:5px solid var(--text);padding:13px 0 18px;background:var(--page)}.column:nth-child(2) .column-head{border-color:var(--accent)}.column:nth-child(3) .column-head{border-color:var(--muted)}.column h2{font-size:15px}.counter{font-family:Consolas,monospace;font-size:12px;color:var(--muted)}.card{width:100%;text-align:left;display:block;background:var(--surface);border:1px solid var(--line);border-radius:0;padding:18px;margin-bottom:12px;box-shadow:3px 3px 0 var(--line);color:var(--text);position:relative}.card:hover{border-color:var(--text);transform:translateY(-2px)}.card .tag{font-size:9px;letter-spacing:.08em;color:var(--accent);border:1px solid var(--ink);padding:2px 5px;display:inline-block}.card h3{font-size:14px;line-height:1.5;margin:12px 0}.card p{font-size:11px;color:var(--muted)}.card footer{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:13px;margin-top:16px;font-size:10px;color:var(--muted)}.owner{height:22px;width:22px;display:grid;place-items:center;border:1px solid var(--text);border-radius:50%;color:var(--text);font-size:9px}.hint{font-size:11px;color:var(--muted);margin-top:22px}.status{margin-top:13px}.card{transition:transform .12s ease}@media(max-width:900px){.shell{padding:28px}.board{gap:16px}.card{padding:14px}.toolbar{gap:12px}.heading h1{font-size:34px}}@media(max-width:600px){.shell{padding:24px}.board{grid-template-columns:1fr;gap:28px}.column{min-height:120px}.heading{align-items:flex-start;gap:16px}.heading h1{font-size:31px}.add{white-space:nowrap;padding:10px 12px}.toolbar{flex-wrap:wrap;gap:12px}.toolbar .pill{margin-left:0}.team{max-width:130px;text-align:right}.card:hover{transform:none}}
</style></head><body><main class="shell"><header class="top"><div class="brand">INK / 迭代局</div><span class="team">设计与制作，放到一张板上。</span></header><section class="heading"><div><div class="eyebrow muted">PROJECT / 2026-09</div><h1>把好想法，做出来。</h1><p>九月刊改版 · 6 位伙伴 · 还有 8 天交付</p></div><button class="add" id="add">＋ 新建任务</button></section><div class="toolbar"><span>◉ 所有成员</span><span>▧ 全部标签</span><button id="mine">只看我的任务</button><span class="pill">点击卡片 → 推进到下一列</span></div><section class="board" aria-label="任务看板"><div class="column" data-col="0"><div class="column-head"><h2>01 / 待开工</h2><span class="counter"></span></div><div class="cards"></div></div><div class="column" data-col="1"><div class="column-head"><h2>02 / 正在做</h2><span class="counter"></span></div><div class="cards"></div></div><div class="column" data-col="2"><div class="column-head"><h2>03 / 已完成</h2><span class="counter"></span></div><div class="cards"></div></div></section><div id="status" class="status" role="status" aria-live="polite"></div><p class="hint">移动后立即更新数量。已完成卡片再次点击，可回到待开工。</p></main><dialog id="new"><h2>新建一条任务</h2><form id="new-form" novalidate><label for="title" class="sr">任务标题</label><input id="title" placeholder="把下一件事写清楚" maxlength="50"><p id="dialog-error" class="status error" role="alert"></p><div class="actions"><button id="cancel" type="button">取消</button><button>加入待开工</button></div></form></dialog><script>const $=(s)=>document.querySelector(s);function feedback(text,error=false){const n=$('#status');n.textContent=text;n.className='status '+(error?'error':'success')}function invalid(el,on=true){el.setAttribute('aria-invalid',String(on));if(on)el.focus()}const tasks=[{title:'重画封面字标',tag:'视觉设计',desc:'试两个方向：更轻，或更大胆。',owner:'沐',col:0},{title:'确定栏目页信息顺序',tag:'编辑结构',desc:'先让读者知道这一页在说什么。',owner:'禾',col:0},{title:'制作三张跨页插图',tag:'插画',desc:'以街角、风与雨为主题。',owner:'沐',col:1},{title:'校对目录页样张',tag:'制作',desc:'第二轮打样，检查细线和字号。',owner:'砚',col:1},{title:'整理九月刊稿件',tag:'编辑',desc:'12篇稿件已确认，等待版式。',owner:'禾',col:2}];let mine=false;function render(){document.querySelectorAll('.column').forEach(col=>{const n=Number(col.dataset.col),items=tasks.filter(t=>t.col===n&&(!mine||t.owner==='沐'));col.querySelector('.counter').textContent=String(items.length).padStart(2,'0');const target=col.querySelector('.cards');target.replaceChildren();items.forEach(t=>{const b=document.createElement('button');b.className='card';b.setAttribute('aria-label',t.title+'，点击推进状态');const tag=document.createElement('span'),h=document.createElement('h3'),p=document.createElement('p'),foot=document.createElement('footer'),o=document.createElement('span'),due=document.createElement('span');tag.className='tag';tag.textContent=t.tag;h.textContent=t.title;p.textContent=t.desc;o.className='owner';o.textContent=t.owner;due.textContent='10 月 08 日';foot.append(o,due);b.append(tag,h,p,foot);b.onclick=()=>{t.col=(t.col+1)%3;render();feedback('“'+t.title+'”已移到'+['待开工','正在做','已完成'][t.col]+'。')};target.append(b)})})}render();$('#mine').onclick=()=>{mine=!mine;$('#mine').textContent=mine?'显示所有成员':'只看我的任务';render();feedback(mine?'只显示林沐负责的任务。':'已显示所有成员任务。')};$('#add').onclick=()=>{$('#new').showModal();$('#title').focus()};$('#cancel').onclick=()=>$('#new').close();$('#new-form').onsubmit=e=>{e.preventDefault();const t=$('#title');if(!t.value.trim()){$('#dialog-error').textContent='请写一个任务标题。';invalid(t);return}tasks.push({title:t.value.trim(),tag:'新任务',desc:'刚刚加入，准备开始。',owner:'沐',col:0});$('#new').close();t.value='';render();feedback('新任务已加入待开工。')};</script></body></html>
