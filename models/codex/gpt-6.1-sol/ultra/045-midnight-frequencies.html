<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>频率 / 给夜晚一点空间</title><style>:root{--page:#0b1526;--surface:#14233a;--text:#f1f4fa;--muted:#94a4bc;--accent:#58c9d9;--line:#2a3d58;--danger:#ff968a;--on:#14233a;--radius:8px}*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--text);font:14px/1.6 "Segoe UI","Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;min-height:44px;padding:10px 18px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);color:var(--text)}button:hover{filter:brightness(.94)}button:disabled{opacity:.4;cursor:not-allowed}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.primary{background:var(--accent);color:var(--on);border-color:var(--accent);font-weight:700}input,select,textarea{min-width:0;max-width:100%;width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);color:var(--text)}textarea{resize:vertical;min-height:100px}label{display:block;font-weight:600;margin:12px 0 6px}h1,h2,h3,p{margin:0 0 16px}h1{font-size:40px;line-height:1.2;letter-spacing:-1.2px}h2{font-size:22px;line-height:1.35}h3{font-size:16px}.muted,small{color:var(--muted)}small{font-size:12px}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.spread{justify-content:space-between}.stack{display:grid;gap:16px}.box{padding:24px;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius)}.rule{border-bottom:1px solid var(--line);padding:16px 0}.tag{font-size:12px;letter-spacing:1px;text-transform:uppercase}.error{color:var(--danger);font-weight:600}.feedback{min-height:26px;margin-top:14px}hr{border:0;border-top:1px solid var(--line);margin:24px 0}[hidden]{display:none!important}.phone{max-width:390px;min-height:844px;margin:auto;background:var(--page);padding:26px 24px;position:relative}.bottom{display:flex;gap:20px;justify-content:space-around;border-top:1px solid var(--line);padding:16px 0;margin-top:28px}.number{font-variant-numeric:tabular-nums}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}@media(min-width:600px){body.mobile{background:var(--line);padding:28px}.phone{border-radius:28px;overflow:hidden;box-shadow:0 16px 60px #00000020}}@media(max-width:600px){h1{font-size:32px}.box{padding:18px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}.radio{max-width:1180px;margin:auto;padding:32px}.radio header{padding-bottom:20px;border-bottom:1px solid var(--line)}.radio h1{font-size:48px;font-weight:300}.radio-grid{display:grid;grid-template-columns:1fr 300px;gap:40px;margin-top:36px}.stage{background:radial-gradient(ellipse at 50% 30%,#243f65,var(--page));border:1px solid var(--line);padding:36px}.orbit{height:260px;display:grid;place-items:center;position:relative}.orbit svg{width:240px;height:240px}.track-title{font-size:30px}.play{width:64px;height:64px;border-radius:50%;font-size:24px;color:var(--page)}.progress{padding:0;accent-color:var(--accent);border:0;background:transparent}.queue button{width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:22px 12px;background:none}.queue button[aria-pressed=true]{border-left:3px solid var(--accent);background:var(--surface)}.queue strong{font-size:16px}.track-number{font:14px Consolas,monospace;color:var(--accent);margin-right:12px}.radio .actions{margin-top:18px}.radio .feedback{min-height:52px}@media(max-width:850px){.radio-grid{grid-template-columns:1fr}.radio{padding:20px}.radio h1{font-size:36px}.stage{padding:24px}.orbit{height:200px}.orbit svg{width:180px;height:180px}}</style></head><body class="desktop"><main class="radio"><header class="row spread"><strong>频率 / FREQUENCY</strong><span class="muted">独立合成声音 · 离线试听</span><span class="tag">NIGHT SESSION</span></header><div class="radio-grid"><section><p class="tag muted">给夜晚一点空间</p><h1>世界安静下来，<br>我们开始听见。</h1><div class="stage"><div class="orbit"><svg viewBox="0 0 240 240" aria-label="唱片与声波"><circle cx="120" cy="120" r="112" fill="#14233a" stroke="#58c9d9" stroke-width="1"/><circle cx="120" cy="120" r="90" fill="none" stroke="#2a3d58"/><circle cx="120" cy="120" r="68" fill="none" stroke="#2a3d58"/><circle cx="120" cy="120" r="46" fill="none" stroke="#2a3d58"/><circle cx="120" cy="120" r="24" fill="#58c9d9"/><circle cx="120" cy="120" r="6" fill="#0b1526"/><path d="M30 120h20l8-26 12 54 12-54 12 26h16" fill="none" stroke="#f1f4fa" stroke-width="2"/></svg></div><div class="row spread"><div><small id="subtitle">原创氛围合成 / 2:00</small><h2 id="trackTitle" class="track-title">城市慢慢睡去</h2></div><button id="play" class="play primary" aria-label="播放" onclick="toggle()">▶</button></div><label for="position" class="sr">播放进度</label><input id="position" class="progress" type="range" min="0" max="120" value="0" oninput="seek(this.value)"><div class="row spread muted"><span id="time" class="number">0:00</span><span>2:00</span></div><div class="row actions"><button id="save" onclick="save()">保存播放状态</button><button id="interrupt" onclick="interrupt()">模拟网络中断</button><button id="reconnect" hidden onclick="reconnect()">重新连接，继续播放</button></div><p id="feedback" class="feedback" role="status" aria-live="polite">按下播放，听一小段轻柔的原创合成声音。</p><small id="saved">尚未保存播放状态</small></div></section><aside class="queue"><p class="tag muted">今晚的发现 / 03</p><button id="track0" aria-pressed="true" onclick="choose(0)"><span class="track-number">01</span><strong>城市慢慢睡去</strong><br><small>柔和低频 · 2:00</small></button><button id="track1" aria-pressed="false" onclick="choose(1)"><span class="track-number">02</span><strong>月光落在水面</strong><br><small>空灵泛音 · 2:00</small></button><button id="track2" aria-pressed="false" onclick="choose(2)"><span class="track-number">03</span><strong>最后一班电车</strong><br><small>温暖长音 · 2:00</small></button><hr><p class="muted">没有催促的播放列表。<br>离开一会儿，也能回到<br>刚才听到的地方。</p></aside></div></main><script>const E=id=>document.getElementById(id),titles=['城市慢慢睡去','月光落在水面','最后一班电车'];let index=0,pos=0,playing=false,offline=false,audio=null,osc=null,gain=null;function sound(on){try{if(!audio){audio=new AudioContext();gain=audio.createGain();gain.gain.value=0;gain.connect(audio.destination);osc=audio.createOscillator();osc.type='sine';osc.frequency.value=110;osc.connect(gain);osc.start()}audio.resume();osc.frequency.value=[110,164.81,130.81][index];gain.gain.setTargetAtTime(on?.035:0,audio.currentTime,.08)}catch{E('feedback').textContent='设备没有启用声音，播放状态仍可操作。'}}function paint(){E('position').value=pos;E('time').textContent=Math.floor(pos/60)+':'+String(pos%60).padStart(2,'0');E('play').textContent=playing?'Ⅱ':'▶';E('play').setAttribute('aria-label',playing?'暂停':'播放');E('trackTitle').textContent=titles[index]}function toggle(){if(offline){E('feedback').textContent='网络中断，请先重新连接。';return}if(pos>=120)pos=0;playing=!playing;sound(playing);paint()}function seek(v){pos=Math.round(Number(v));paint()}function choose(i){index=i;pos=0;document.querySelectorAll('.queue button').forEach((b,j)=>b.setAttribute('aria-pressed',i===j));sound(playing);paint()}function save(){const snap={index,pos,playing};let stored=false;try{localStorage.setItem('frequency-state',JSON.stringify(snap));stored=true}catch{}E('saved').textContent=`${stored?'已保存':'本页已记下'}：${titles[index]} · ${E('time').textContent} · ${playing?'播放中':'暂停'}`;}function interrupt(){offline=true;playing=false;sound(false);E('reconnect').hidden=false;E('feedback').textContent='网络连接中断。已暂停，进度保留在 '+E('time').textContent+'。';paint()}function reconnect(){offline=false;playing=true;sound(true);E('reconnect').hidden=true;E('feedback').textContent='重新连接成功，从保留进度继续播放。';paint()}setInterval(()=>{if(playing&&pos<120){pos++;if(pos===120){playing=false;sound(false)}paint()}},1000);try{const s=JSON.parse(localStorage.getItem('frequency-state'));if(s&&Number.isInteger(s.index)&&s.index>=0&&s.index<3&&Number.isInteger(s.pos)&&s.pos>=0&&s.pos<=120){index=s.index;pos=s.pos;E('saved').textContent='已恢复上次保存的位置；点播放继续。';document.querySelectorAll('.queue button').forEach((b,i)=>b.setAttribute('aria-pressed',i===index))}}catch{}paint();</script></body></html>
