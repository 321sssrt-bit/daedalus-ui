<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>钱包首页 · copper-pocket</title><style>:root{--page:#f7ecda;--surface:#fff8ee;--text:#462b1f;--muted:#927258;--accent:#b9642e;--line:#e4cdb1;--danger:#b03732;--outer:#ddd0bc;--font:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:var(--font);font-size:15px;line-height:1.6;color:var(--text);background:var(--page)}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.42}button:hover:not(:disabled){filter:brightness(.94)}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:3px}button,input,select,textarea{transition:background .16s ease,border-color .16s ease}a{color:inherit}h1,h2,h3,p{margin:0}h1{line-height:1.2}h2{font-size:22px;line-height:1.3}h3{font-size:17px}small,.meta{font-size:12px;color:var(--muted)}button{border:0}svg{display:block;max-width:100%}.status{min-height:24px;font-size:13px;color:var(--accent)}.status[data-error="true"]{color:var(--danger)}[hidden]{display:none!important}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}dialog{max-width:calc(100vw - 32px);border:1px solid var(--line);border-radius:16px;padding:28px;color:var(--text);background:var(--surface)}dialog::backdrop{background:#00000088}dialog button{margin-top:16px}.phone{width:390px;min-height:844px;margin:30px auto;border-radius:30px;overflow:hidden;position:relative;background:var(--surface);box-shadow:0 24px 80px #00000022}.mobile-body{background:var(--outer);padding:1px}.mobile-top{height:46px;display:flex;justify-content:space-between;align-items:center;padding:0 26px;font-weight:700;font-size:12px}.mobile-nav{display:flex;justify-content:space-around;gap:8px;padding:18px 16px;border-top:1px solid var(--line)}.mobile-nav button{background:transparent;color:var(--muted);font-size:12px}.mobile-nav button[aria-current="page"]{color:var(--accent);font-weight:700}input[type=checkbox],input[type=radio]{accent-color:var(--accent)}@media(max-width:600px){.phone{margin:0;width:100%;min-height:100vh;border-radius:0;box-shadow:none}.mobile-body{padding:0}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition:none!important}}.wallet-head{padding:12px 26px 14px;display:flex;justify-content:space-between;align-items:center}.brand{font-family:Georgia,"Songti SC",serif;font-size:24px;font-weight:700}.avatar{width:36px;height:36px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;font-size:12px}.balance{background:var(--accent);color:var(--surface);padding:24px 26px 19px;position:relative;overflow:hidden}.balance::after{content:'';width:170px;height:170px;border:1px solid #ffffff44;border-radius:50%;position:absolute;right:-50px;top:-70px}.balance .label{font-size:12px;opacity:.75}.balance h1{font-family:Georgia,serif;font-size:48px;font-weight:400;margin:12px 0 14px;letter-spacing:-1px}.balance h1 small{font-family:var(--font);color:var(--surface);font-size:18px;margin-right:7px}.balance-footer{display:flex;justify-content:space-between;font-size:11px;border-top:1px solid #ffffff44;padding-top:13px}.balance-footer button{background:none;color:var(--surface);padding:0}.cashflow{padding:18px 26px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}.cashflow strong{font-size:17px;display:block}.cashflow small{font-size:11px}.bars{display:flex;gap:5px;align-items:end;height:42px}.bars i{display:block;width:7px;background:var(--line);border-radius:2px}.bars i:nth-child(2n){background:var(--accent)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px 26px}.action{padding:14px;background:var(--text);color:var(--surface);border-radius:10px;font-weight:700}.action.light{background:var(--page);color:var(--text);border:1px solid var(--line)}.ledger{padding:8px 26px 12px}.ledger-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.ledger h2{font-size:18px}.transaction{display:flex;gap:13px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.transaction-icon{width:36px;height:36px;border-radius:50%;background:var(--page);display:grid;place-items:center;color:var(--accent);font-size:16px}.transaction-info{flex:1}.transaction-info strong{font-size:13px;display:block}.transaction-info small{font-size:10px}.amount{font-family:Georgia,serif;font-size:17px}.amount.in{color:var(--accent)}.status{padding:0 26px;margin:8px 0 8px;font-size:11px;min-height:26px}.mobile-nav{margin-top:6px;padding:14px 16px}.modal-title{font-family:Georgia,"Songti SC",serif;font-size:27px;margin-bottom:20px}.field{display:grid;gap:8px;font-size:13px;margin:14px 0}dialog input{width:100%;padding:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:6px}.modal-actions{display:flex;gap:10px}dialog .error{color:var(--danger);font-size:12px;min-height:20px}.qr{margin:12px auto 22px;width:160px}.mine{padding:35px 26px}.mine h2{margin-bottom:12px}.mine p{color:var(--muted);font-size:13px}</style></head><body class="mobile-body"><div class="phone"><div class="mobile-top"><span>9:41</span><span>●●● ▰</span></div><header class="wallet-head"><span class="brand">口袋 · POCKET</span><span class="avatar">木</span></header><main id="wallet-view"><section class="balance"><p class="label">可用余额 · 人民币</p><h1><small>¥</small><span id="balance">8,426.50</span></h1><div class="balance-footer"><span>资金安全保护中 ✓</span><button id="toggle-balance" aria-label="隐藏余额">隐藏 ◉</button></div></section><section class="cashflow"><div><small>这个月，攒下一点</small><strong>净流入 ¥ 1,280.00</strong></div><div class="bars" aria-label="近七日收支趋势"><i style="height:17px"></i><i style="height:28px"></i><i style="height:20px"></i><i style="height:37px"></i><i style="height:24px"></i><i style="height:31px"></i><i style="height:42px"></i></div></section><div class="actions"><button class="action" id="transfer">↗ 转出</button><button class="action light" id="receive">↙ 收款</button></div></main><section class="ledger" id="ledger-view"><div class="ledger-top"><h2>最近流水</h2><small>全部记录</small></div><div id="transactions"><div class="transaction"><span class="transaction-icon">↙</span><div class="transaction-info"><strong>项目稿费</strong><small>今天 09:12 · 转入</small></div><span class="amount in">+2,600.00</span></div><div class="transaction"><span class="transaction-icon">⌁</span><div class="transaction-info"><strong>街角咖啡</strong><small>昨天 16:48 · 支出</small></div><span class="amount">−28.00</span></div><div class="transaction"><span class="transaction-icon">↗</span><div class="transaction-info"><strong>转给林小麦</strong><small>昨天 12:30 · 转出</small></div><span class="amount">−320.00</span></div></div></section><section class="mine" id="mine-view" hidden><h2>木木的口袋</h2><p>账户：pocket-****-0426<br>余额显示和本页收付操作仅用于演示。</p></section><p id="status" class="status" role="status" aria-live="polite">今天的每一笔，都在这里。</p><nav class="mobile-nav" aria-label="底部导航"><button data-tab="wallet" aria-current="page">◉<br>钱包</button><button data-tab="ledger">≡<br>流水</button><button data-tab="mine">○<br>我的</button></nav></div><dialog id="transfer-modal"><h2 class="modal-title">转出一笔</h2><form id="transfer-form" novalidate><label class="field">收款人<input id="receiver" required placeholder="输入收款人姓名"></label><label class="field">金额（元）<input id="money" type="number" min="0.01" step="0.01" required placeholder="0.00"></label><p id="transfer-error" class="error" role="alert"></p><div class="modal-actions"><button type="button" class="action light" id="close-transfer">取消</button><button class="action">确认转出</button></div></form></dialog><dialog id="receive-modal"><h2 class="modal-title">让钱回到口袋</h2><svg class="qr" viewBox="0 0 120 120" aria-label="演示收款码"><rect width="120" height="120" fill="var(--surface)"/><path d="M5 5h30v30H5zM85 5h30v30H85zM5 85h30v30H5z" fill="none" stroke="var(--text)" stroke-width="7"/><path d="M15 15h10v10H15zM95 15h10v10H95zM15 95h10v10H15zM45 5h10v20H45zM65 15h10v20H65zM45 45h20v10H45zM75 45h10v20H75zM95 45h20v10H95zM5 45h20v10H5zM15 65h30v10H15zM55 65h10v30H55zM75 75h20v10H75zM95 65h10v30H95zM45 105h40v10H45zM85 95h30v10H85z" fill="var(--text)"/></svg><p>演示账户 pocket-****-0426<br><small>此收款码不会发起真实交易。</small></p><button class="action" id="close-receive">完成</button></dialog><script>const $=id=>document.getElementById(id);function note(t,error=false){const e=$('status');e.textContent=t;e.dataset.error=String(error);}let balance=8426.50,visible=true;$('toggle-balance').onclick=()=>{visible=!visible;$('balance').textContent=visible?balance.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}):'••••••';$('toggle-balance').textContent=visible?'隐藏 ◉':'显示 ◉';$('toggle-balance').setAttribute('aria-label',visible?'隐藏余额':'显示余额');};$('transfer').onclick=()=>$('transfer-modal').showModal();$('close-transfer').onclick=()=>$('transfer-modal').close();$('receive').onclick=()=>$('receive-modal').showModal();$('close-receive').onclick=()=>$('receive-modal').close();$('transfer-form').onsubmit=e=>{e.preventDefault();const name=$('receiver').value.trim(),raw=$('money').value.trim(),money=Number(raw),cents=Math.round(money*100),valid=/^(?:\d+(?:\.\d{1,2})?|\.\d{1,2})$/.test(raw)&&Number.isSafeInteger(cents)&&cents>=1;if(!name||!valid||cents>Math.round(balance*100)){const field=!name?$('receiver'):$('money');field.setAttribute('aria-invalid','true');field.focus();$('transfer-error').textContent=!name?'请填写收款人姓名。':!valid?'金额至少0.01元，最多两位小数，请修正金额。':'金额超过可用余额，请减少金额。';return;}$('receiver').removeAttribute('aria-invalid');$('money').removeAttribute('aria-invalid');balance=(Math.round(balance*100)-cents)/100;$('balance').textContent=visible?balance.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}):'••••••';const row=document.createElement('div');row.className='transaction';const icon=document.createElement('span');icon.className='transaction-icon';icon.textContent='↗';const info=document.createElement('div');info.className='transaction-info';const title=document.createElement('strong');title.textContent='转给'+name;const meta=document.createElement('small');meta.textContent='刚刚 · 转出';info.append(title,meta);const value=document.createElement('span');value.className='amount';value.textContent='−'+money.toFixed(2);row.append(icon,info,value);$('transactions').prepend(row);$('transfer-modal').close();$('transfer-error').textContent='';note('已转出 ¥ '+money.toFixed(2)+'，流水与余额已更新。');};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{const t=b.dataset.tab;$('wallet-view').hidden=t!=='wallet';$('ledger-view').hidden=t==='mine';$('mine-view').hidden=t!=='mine';document.querySelectorAll('[data-tab]').forEach(x=>{if(x===b)x.setAttribute('aria-current','page');else x.removeAttribute('aria-current');});note(t==='ledger'?'显示全部流水':t==='mine'?'已打开账户资料':'已回到钱包');});</script></body></html>
