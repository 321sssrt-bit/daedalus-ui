<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>长表单 · field-study</title><style>:root{--page:#eeeee4;--surface:#fafbf3;--text:#223c30;--muted:#6d7e70;--accent:#486b47;--line:#d5ddcb;--danger:#ac483c;--outer:#eeeee4;--font:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:var(--font);font-size:15px;line-height:1.6;color:var(--text);background:var(--page)}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.42}button:hover:not(:disabled){filter:brightness(.94)}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:3px}button,input,select,textarea{transition:background .16s ease,border-color .16s ease}a{color:inherit}h1,h2,h3,p{margin:0}h1{line-height:1.2}h2{font-size:22px;line-height:1.3}h3{font-size:17px}small,.meta{font-size:12px;color:var(--muted)}button{border:0}svg{display:block;max-width:100%}.status{min-height:24px;font-size:13px;color:var(--accent)}.status[data-error="true"]{color:var(--danger)}[hidden]{display:none!important}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}dialog{max-width:calc(100vw - 32px);border:1px solid var(--line);border-radius:16px;padding:28px;color:var(--text);background:var(--surface)}dialog::backdrop{background:#00000088}dialog button{margin-top:16px}.phone{width:390px;min-height:844px;margin:30px auto;border-radius:30px;overflow:hidden;position:relative;background:var(--surface);box-shadow:0 24px 80px #00000022}.mobile-body{background:var(--outer);padding:1px}.mobile-top{height:46px;display:flex;justify-content:space-between;align-items:center;padding:0 26px;font-weight:700;font-size:12px}.mobile-nav{display:flex;justify-content:space-around;gap:8px;padding:18px 16px;border-top:1px solid var(--line)}.mobile-nav button{background:transparent;color:var(--muted);font-size:12px}.mobile-nav button[aria-current="page"]{color:var(--accent);font-weight:700}input[type=checkbox],input[type=radio]{accent-color:var(--accent)}@media(max-width:600px){.phone{margin:0;width:100%;min-height:100vh;border-radius:0;box-shadow:none}.mobile-body{padding:0}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition:none!important}}.sheet{max-width:1160px;margin:38px auto;border:1px solid var(--line);background:var(--surface)}.mast{padding:28px 36px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.brand{font-family:Georgia,"Songti SC",serif;font-size:25px;font-weight:700}.mast small{letter-spacing:2px}.layout{display:grid;grid-template-columns:230px 1fr}.index{padding:38px 28px;border-right:1px solid var(--line);background:var(--page)}.index p{font-size:12px;color:var(--muted);margin-bottom:18px}.index a{display:block;text-decoration:none;padding:14px 0;border-top:1px solid var(--line);font-weight:600}.index a b{font-weight:400;margin-right:14px;color:var(--muted)}.stamp{width:142px;height:142px;margin:60px auto 0;border:2px solid var(--accent);border-radius:50%;display:grid;place-content:center;text-align:center;transform:rotate(-10deg);font-family:Georgia,serif;font-size:18px;color:var(--accent)}main{padding:40px 48px}.intro{margin-bottom:32px}h1{font-family:Georgia,"Songti SC",serif;font-size:44px}.intro p{color:var(--muted);margin-top:12px}.section{scroll-margin-top:20px;border-top:1px solid var(--line);padding:28px 0}.section-title{display:flex;gap:14px;margin-bottom:22px;align-items:center}.num{font-family:Georgia,serif;font-size:30px;color:var(--accent)}.fields{display:grid;grid-template-columns:1fr 1fr;gap:20px}.field{display:grid;gap:7px;font-size:13px}.field.wide{grid-column:1/-1}.required{color:var(--danger)}input,select,textarea{width:100%;padding:12px;background:transparent;border:1px solid var(--line);border-radius:2px;color:var(--text)}textarea{height:92px;resize:vertical}input:invalid:not(:placeholder-shown){border-color:var(--danger)}.consent{display:flex;align-items:flex-start;gap:9px;font-size:13px}.consent input{width:18px;margin-top:5px}.actions{display:flex;justify-content:space-between;gap:12px;align-items:center;border-top:1px solid var(--line);padding-top:24px}.primary{background:var(--accent);color:var(--surface);padding:13px 24px}.secondary{background:transparent;color:var(--text);border:1px solid var(--line);padding:12px 20px}.status{margin-top:16px}@media(max-width:800px){.sheet{margin:16px}.layout{grid-template-columns:1fr}.index{padding:18px 24px;border-right:0;border-bottom:1px solid var(--line);display:flex;gap:18px;flex-wrap:wrap}.index p,.stamp{display:none}.index a{border:0;padding:4px}.mast{padding:24px}main{padding:28px}.fields{gap:16px}}@media(max-width:520px){.fields{grid-template-columns:1fr}h1{font-size:34px}.mast small{display:none}.actions{flex-wrap:wrap}}</style></head><body><div class="sheet"><header class="mast"><div class="brand">野外研究所 <small>FIELD NOTES</small></div><small>秋季驻地 / 2026</small></header><div class="layout"><nav class="index" aria-label="表单章节"><p>申请材料 · 约需 6 分钟</p><a href="#basic"><b>01</b> 基本资料</a><a href="#project"><b>02</b> 研究计划</a><a href="#arrival"><b>03</b> 到访安排</a><div class="stamp">野外研究所<br>开放申请<br>— 2026 —</div></nav><main><div class="intro"><small>RESIDENCY APPLICATION</small><h1>把好奇心带到山里。</h1><p>申请为期两周的田野驻地。标记 <span class="required">*</span> 的项目为必填。</p></div><form id="application" novalidate><section class="section" id="basic"><div class="section-title"><span class="num">01</span><h2>先认识你</h2></div><div class="fields"><label class="field">姓名 <span class="required">*</span><input name="name" required placeholder="你的名字" autocomplete="name"></label><label class="field">联系邮箱 <span class="required">*</span><input name="email" required type="email" placeholder="name@studio.example" autocomplete="email"></label><label class="field">所在城市<input name="city" placeholder="例如：杭州"></label><label class="field">研究领域<select name="field"><option>自然观察</option><option>影像记录</option><option>地方文化</option><option>独立写作</option></select></label></div></section><section class="section" id="project"><div class="section-title"><span class="num">02</span><h2>你想探索什么</h2></div><div class="fields"><label class="field wide">计划名称 <span class="required">*</span><input name="project" required placeholder="给你的研究一个名字"></label><label class="field wide">研究说明 <span class="required">*</span><textarea name="description" required minlength="10" placeholder="想解决的问题、观察方法与预期成果，至少 10 字。"></textarea></label></div></section><section class="section" id="arrival"><div class="section-title"><span class="num">03</span><h2>安排一段在场的时间</h2></div><div class="fields"><label class="field">意向批次<select name="batch"><option>10 月 12 日 — 10 月 25 日</option><option>11 月 02 日 — 11 月 15 日</option></select></label><label class="field">住宿偏好<select name="room"><option>共享双人间</option><option>独立单人间</option><option>自行安排</option></select></label><label class="field wide">补充需求<textarea name="needs" placeholder="饮食、无障碍或其他需要我们知道的事。"></textarea></label></div><label class="consent"><input name="consent" type="checkbox" required>我确认以上信息真实，并同意研究所仅将资料用于本次申请。 <span class="required">*</span></label></section><div class="actions"><button type="button" id="draft" class="secondary">保存草稿</button><button class="primary" type="submit">提交申请 ↗</button></div><p id="status" class="status" role="status" aria-live="polite">草稿仅保存在这台设备。</p></form></main></div></div><script>const $=id=>document.getElementById(id);function note(t,error=false){const e=$('status');e.textContent=t;e.dataset.error=String(error);}const form=$('application');$('draft').onclick=()=>{const data=Object.fromEntries(new FormData(form));data.consent=form.elements.consent.checked;try{localStorage.setItem('field-study-draft',JSON.stringify(data));note('草稿已保存，下次打开可继续填写。');}catch(e){note('此环境无法保存到设备，请先保留已填写内容。',true);}};form.onsubmit=e=>{e.preventDefault();if(!form.checkValidity()){note('请补齐必填项目，并检查邮箱和研究说明。',true);form.reportValidity();return;}note('申请已提交 · 申请号 FS-2026-0142，我们将在 3 个工作日内回复。');};try{const d=JSON.parse(localStorage.getItem('field-study-draft')||'null');if(d){Object.entries(d).forEach(([k,v])=>{const f=form.elements[k];if(f){if(f.type==='checkbox')f.checked=Boolean(v);else f.value=v;}});note('已恢复这台设备上的草稿。');}}catch(e){note('草稿读取失败，仍可正常填写。',true);}</script></body></html>
