<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>账号设置 · slate-account</title><style>:root{--page:#e9eef1;--surface:#ffffff;--text:#23333f;--muted:#81929c;--accent:#318d95;--line:#d3dce1;}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:var(--text);background:var(--page);font-size:15px;line-height:1.6}button,input,select{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}button,a,input,select,summary{outline-offset:4px}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--accent)}button{transition:filter .15s,transform .15s}button:hover:not(:disabled){filter:brightness(.94)}a{color:inherit}h1,h2,h3,p{margin:0}svg{display:block;max-width:100%}[hidden]{display:none!important}.sr{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}.feedback{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:12px 22px;background:var(--text);color:var(--surface);box-shadow:0 8px 30px #00000022;max-width:calc(100% - 32px);z-index:20;border-radius:8px;text-align:center}.feedback:empty{display:none}dialog{color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:12px;width:min(480px,calc(100% - 32px));padding:28px;box-shadow:0 20px 90px #00000033}dialog::backdrop{background:#00000066}dialog h2{font-size:26px;margin-bottom:12px}dialog p{margin:10px 0}dialog button{margin-top:16px;padding:10px 20px;border:0;background:var(--accent);color:var(--surface)}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
.settings{max-width:1150px;margin:35px auto;display:grid;grid-template-columns:230px 1fr;min-height:690px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);box-shadow:0 8px 35px #23333f08}.sidebar{background:#23333f;color:#ffffff;padding:28px 25px}.logo{font-size:20px;font-weight:700;letter-spacing:2px}.workspace{font-size:10px;color:#8fa6b1;margin-top:7px}.navlist{margin-top:42px}.navlist div{font-size:12px;color:#8fa6b1;padding:11px 12px;margin-bottom:5px;border-radius:5px}.navlist .active{background:#354953;color:#ffffff}.member{border-top:1px solid #354953;padding-top:19px;margin-top:285px;font-size:11px;color:#8fa6b1}.member b{display:block;font-size:12px;color:#ffffff;font-weight:400;margin-bottom:3px}.main{padding:34px 45px}.crumb{font-size:10px;color:var(--muted)}h1{font-size:30px;font-weight:500;margin:10px 0 26px}.identity{display:flex;gap:17px;align-items:center;padding:20px;background:var(--page);border:1px solid var(--line);border-radius:8px;margin-bottom:26px}.avatar{width:52px;height:52px;border-radius:13px;background:var(--accent);color:var(--surface);font-size:24px;display:grid;place-items:center}.identity h2{font-size:17px;font-weight:600}.identity p{font-size:11px;color:var(--muted);margin-top:3px}.verified{margin-left:auto;border:1px solid var(--line);border-radius:15px;color:var(--accent);font-size:10px;padding:4px 10px;background:var(--surface)}.section{margin-top:21px}.section h2{font-size:11px;color:var(--muted);letter-spacing:1px;margin-bottom:10px}.section details{border-bottom:1px solid var(--line)}summary{display:flex;justify-content:space-between;align-items:center;cursor:pointer;list-style:none;padding:15px 0;gap:20px}summary::-webkit-details-marker{display:none}.rowtitle{font-size:13px}.rowtitle small{display:block;font-size:10px;color:var(--muted);margin-top:2px}.rowend{font-size:11px;color:var(--muted);white-space:nowrap}.rowend:after{content:' ›';font-size:17px;margin-left:9px}.section details[open] .rowend:after{content:'⌄'}.detail{padding:0 0 18px;font-size:12px;color:var(--muted)}.detail label{display:block;font-size:11px;margin-bottom:6px}.detail input[type=text],.detail input[type=email],.detail input[type=password]{width:100%;height:38px;padding:8px 11px;border:1px solid var(--line);border-radius:5px;color:var(--text);background:var(--surface);margin-bottom:10px}.formcols{display:grid;grid-template-columns:1fr 1fr;gap:12px}.save{background:var(--accent);border:0;border-radius:5px;padding:8px 18px;color:var(--surface);font-size:11px}.error{font-size:11px;color:#bd675a;min-height:20px;margin:5px 0}.toggleline{display:flex;align-items:center;justify-content:space-between;padding:10px 0}.switch{appearance:none;width:34px;height:20px;background:var(--line);border-radius:15px;position:relative;cursor:pointer}.switch:after{content:'';position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:var(--surface);transition:transform .15s}.switch:checked{background:var(--accent)}.switch:checked:after{transform:translateX(14px)}.foot{font-size:10px;color:var(--muted);padding-top:25px}@media(max-width:1000px){.settings{margin:24px;grid-template-columns:180px 1fr}.sidebar{padding:25px 18px}.main{padding:28px}.member{margin-top:280px}.identity{padding:16px}.verified{display:none}}@media(max-width:640px){.settings{margin:16px;grid-template-columns:1fr}.sidebar{padding:18px 22px}.workspace,.navlist,.member{display:none}.main{padding:24px 20px}.formcols{grid-template-columns:1fr}.identity{gap:12px}.identity p{font-size:10px}summary{gap:10px}.rowend{font-size:10px}}</style></head><body><div class="settings"><aside class="sidebar"><div class="logo">泊点 / DOCK</div><div class="workspace">你的轻量工作空间</div><div class="navlist"><div>工作台</div><div>项目与文件</div><div class="active">账号设置</div><div>团队设置</div></div><div class="member"><b>林屿 · 设计一组</b>个人工作区</div></aside><main class="main"><div class="crumb">个人空间 / 设置</div><h1>账号设置</h1><div class="identity"><div class="avatar" id="avatarLetter">林</div><div><h2 id="displayName">林屿</h2><p id="displayEmail">linyu@dock.example</p></div><span class="verified">邮箱已验证 ✓</span></div><section class="section"><h2>01 / 个人资料</h2><details><summary><span class="rowtitle">显示姓名与邮箱<small>让团队更容易认出你</small></span><span class="rowend">编辑资料</span></summary><div class="detail"><form id="profileForm" novalidate><div class="formcols"><div><label for="nameInput">显示姓名</label><input type="text" id="nameInput" value="林屿" maxlength="20" autocomplete="name"></div><div><label for="emailInput">邮箱</label><input type="email" id="emailInput" value="linyu@dock.example" autocomplete="email"></div></div><p class="error" id="profileError" role="alert"></p><button class="save">保存资料</button></form></div></details></section><section class="section"><h2>02 / 账号安全</h2><details><summary><span class="rowtitle">登录密码<small>建议使用唯一的长密码</small></span><span class="rowend">更新密码</span></summary><div class="detail"><form id="passwordForm" novalidate><label for="newPassword">新密码 · 至少 8 位</label><input type="password" id="newPassword" autocomplete="new-password"><label for="confirmPassword">再次输入新密码</label><input type="password" id="confirmPassword" autocomplete="new-password"><p class="error" id="passwordError" role="alert"></p><button class="save">确认更新</button></form></div></details></section><section class="section"><h2>03 / 通知偏好</h2><details><summary><span class="rowtitle">消息与邮件<small>选择你想收到的提醒</small></span><span class="rowend" id="notifyState">2 项已开启</span></summary><div class="detail"><label class="toggleline">项目提及提醒<input class="switch" type="checkbox" checked aria-label="项目提及提醒"></label><label class="toggleline">每周摘要邮件<input class="switch" type="checkbox" checked aria-label="每周摘要邮件"></label><label class="toggleline">产品更新消息<input class="switch" type="checkbox" aria-label="产品更新消息"></label><p>设置会即时生效。</p></div></details></section><footer class="foot">最近登录：今天 09:12 · 浏览器 / 当前设备</footer></main></div><div class="feedback" role="status" aria-live="polite" id="feedback"></div><script>const say=t=>document.getElementById('feedback').textContent=t;
document.getElementById('profileForm').onsubmit=e=>{e.preventDefault();const name=document.getElementById('nameInput'),mail=document.getElementById('emailInput'),err=document.getElementById('profileError');if(!name.value.trim()){err.textContent='显示姓名不能为空。';name.setAttribute('aria-invalid','true');name.focus();return}name.setAttribute('aria-invalid','false');if(!mail.value.trim()||!mail.checkValidity()){err.textContent='请输入有效的邮箱地址。';mail.setAttribute('aria-invalid','true');mail.focus();return}mail.setAttribute('aria-invalid','false');err.textContent='';document.getElementById('displayName').textContent=name.value.trim();document.getElementById('avatarLetter').textContent=name.value.trim().slice(0,1);document.getElementById('displayEmail').textContent=mail.value.trim();say('个人资料已保存')};document.getElementById('passwordForm').onsubmit=e=>{e.preventDefault();const p=document.getElementById('newPassword'),c=document.getElementById('confirmPassword'),err=document.getElementById('passwordError');if(p.value.length<8){err.textContent='新密码至少需要 8 位。';p.focus();return}if(p.value!==c.value){err.textContent='两次输入不一致，请重新确认。';c.focus();return}err.textContent='';p.value='';c.value='';say('密码更新已确认')};document.querySelectorAll('.switch').forEach(x=>x.onchange=()=>{const n=document.querySelectorAll('.switch:checked').length;document.getElementById('notifyState').textContent=n+' 项已开启';say('通知偏好已更新')});</script></body></html>
