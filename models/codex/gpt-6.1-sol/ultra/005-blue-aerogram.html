<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>找回密码 · 远信</title><style>:root{--page:#dbe8ef;--surface:#f6fafb;--text:#234d69;--muted:#7391a3;--accent:#367aa2;--line:#b8d0dd;--danger:#c45957;--stripe:#c87770;}*{box-sizing:border-box}html{color-scheme:light}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;font-size:15px;line-height:1.6}button,input,select{font:inherit}button,a,input,select{ -webkit-tap-highlight-color:transparent}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}a{color:inherit}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:4px}button:hover:not(:disabled){filter:brightness(.94)}input,select{max-width:100%}input[aria-invalid="true"]{border-color:var(--danger)!important;box-shadow:0 0 0 1px var(--danger)}h1,h2,h3,p{margin:0}h1{line-height:1.13;letter-spacing:-.05em}h2{line-height:1.3}svg{max-width:100%;display:block}small,.small{font-size:12px}.muted{color:var(--muted)}.eyebrow{font-size:11px;letter-spacing:.16em;font-weight:700}.status{min-height:24px;font-size:13px;color:var(--muted)}.status.error{color:var(--danger)}.status.success{color:var(--accent)}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}[hidden]{display:none!important}dialog{border:1px solid var(--line);border-radius:16px;max-width:min(440px,calc(100% - 32px));padding:28px;background:var(--surface);color:var(--text)}dialog::backdrop{background:rgba(0,0,0,.38)}dialog input{width:100%;margin:16px 0;padding:12px;border:1px solid var(--line);background:var(--page);color:var(--text)}dialog .actions{display:flex;gap:12px;justify-content:flex-end}dialog button{padding:9px 16px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--text)}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
body{background:var(--page);color:var(--text)}.shell{min-height:100vh;padding:40px 24px;display:grid;place-items:center}.mail{width:min(900px,100%);background:var(--surface);padding:12px;box-shadow:0 24px 65px rgba(35,77,105,.08);transform:rotate(-1deg);background-image:repeating-linear-gradient(135deg,#367aa2 0 14px,#f6fafb 14px 28px,#c87770 28px 42px,#f6fafb 42px 56px)}.inside{background:var(--surface);padding:44px;display:grid;grid-template-columns:.8fr 1.2fr;gap:40px;transform:rotate(1deg)}.postcard{border-right:1px solid var(--line);padding-right:34px;display:flex;flex-direction:column}.brand{font-size:23px;font-family:Georgia,serif}.stamp{width:98px;height:112px;border:1px dashed var(--line);display:grid;place-items:center;margin:32px 0 30px;position:relative}.stamp svg{width:70px}.postcard h2{font-size:21px;margin-bottom:12px}.postcard p{font-size:13px;color:var(--muted);line-height:1.9}.address{margin-top:30px;font-family:Consolas,monospace;font-size:11px;letter-spacing:.07em;color:var(--muted)}.form h1{font-size:38px;margin:12px 0 18px}.form>p{font-size:14px;color:var(--muted);max-width:360px}.eyebrow{color:var(--accent)}label{display:block;font-size:12px;font-weight:600;margin-top:27px}input{display:block;width:100%;margin:8px 0 16px;padding:12px;border:1px solid var(--line);background:#fff;color:var(--text);border-radius:4px}.primary{width:100%;padding:12px;border:0;background:var(--accent);color:var(--surface);border-radius:4px}.status{margin-top:14px;min-height:45px}.back{font-size:12px;display:inline-block;margin-top:24px}.waiting{border:1px solid var(--line);padding:20px;background:var(--page);border-radius:4px;margin-top:24px}.waiting h2{font-size:20px;margin-bottom:8px}.waiting p{font-size:13px;color:var(--muted)}.waiting button{margin-top:15px;border:0;background:none;color:var(--accent);padding:0}.hint{font-size:11px;color:var(--muted);margin-top:12px}@media(max-width:800px){.inside{padding:32px;gap:26px}.postcard{padding-right:24px}.form h1{font-size:32px}}@media(max-width:600px){.shell{padding:24px 16px}.mail{transform:none;padding:9px}.inside{display:block;padding:26px 22px;transform:none}.postcard{border-right:0;border-bottom:1px solid var(--line);padding:0 0 20px;margin-bottom:26px}.stamp,.postcard h2,.postcard p,.address{display:none}.brand{font-size:22px}.form h1{font-size:32px}.status{min-height:24px}}
</style></head><body><main class="shell"><article class="mail"><div class="inside"><aside class="postcard"><div class="brand">远信 / LETTERS</div><div class="stamp"><svg viewBox="0 0 80 80" aria-hidden="true"><path d="m5 42 66-28-25 57-10-24z" fill="none" stroke="#367aa2" stroke-width="2"/><path d="m36 47 35-33-23 43" fill="none" stroke="#367aa2" stroke-width="2"/><path d="M11 55H1M21 65H8" stroke="#b8d0dd" stroke-width="2"/></svg></div><h2>别担心，<br>我们会把入口寄给你。</h2><p>有些事可以忘记。<br>那些认真留下的文字，<br>不会因此离开。</p><div class="address">TO: YOUR NEXT CHAPTER<br>FROM: 远信账户服务</div></aside><section class="form"><div class="eyebrow" id="mode">ACCOUNT RECOVERY / 找回入口</div><h1 id="heading">重新打开，<br>你的那封信。</h1><p id="intro">填写注册时使用的邮箱。我们会向它发送一封包含密码重置链接的邮件。</p><form id="reset" novalidate><label for="email">注册邮箱</label><input id="email" type="email" autocomplete="email" placeholder="例如：reader@mail.example"><button class="primary">发送重置链接 →</button></form><div id="waiting" class="waiting" hidden><h2>信已寄出 ✉</h2><p id="sent-to"></p><p>请检查收件箱和垃圾邮件。链接有效期为 20 分钟。</p><button id="resend" disabled>30 秒后可以重新发送</button></div><form id="signin" hidden novalidate><label for="loginEmail">登录邮箱</label><input id="loginEmail" type="email" autocomplete="username"><label for="loginPassword">密码</label><input id="loginPassword" type="password" autocomplete="current-password" minlength="8"><button class="primary">登录 →</button><button id="returnReset" type="button" style="width:100%;margin-top:12px">继续找回密码</button></form><div id="status" class="status" role="status" aria-live="polite"></div><a href="#signin" class="back" id="back">← 回到登录</a><div class="hint">邮件仍未到达？请联系 support@letters.example</div></section></div></article></main><script>const $=(s)=>document.querySelector(s);function feedback(text,error=false){const n=$('#status');n.textContent=text;n.className='status '+(error?'error':'success')}function invalid(el,on=true){el.setAttribute('aria-invalid',String(on));if(on)el.focus()}let timer;function sent(){const email=$('#email');invalid(email,false);if(!email.value||!email.validity.valid){invalid(email);return feedback('请输入注册时使用的有效邮箱。',true)}$('#reset').hidden=true;$('#waiting').hidden=false;$('#sent-to').textContent='重置链接已发送至 '+email.value;feedback('请在收件箱中查找来自远信的邮件。');let remaining=30;$('#resend').disabled=true;$('#resend').textContent='30 秒后可以重新发送';clearInterval(timer);timer=setInterval(()=>{remaining--;$('#resend').textContent=remaining>0?remaining+' 秒后可以重新发送':'重新发送重置链接';if(remaining<=0){clearInterval(timer);$('#resend').disabled=false}},1000)}$('#reset').onsubmit=e=>{e.preventDefault();sent()};$('#resend').onclick=()=>sent();$('#back').onclick=e=>{e.preventDefault();clearInterval(timer);$('#waiting').hidden=true;$('#reset').hidden=true;$('#signin').hidden=false;$('#back').hidden=true;$('#loginEmail').value=$('#email').value;$('#mode').textContent='SIGN IN / 登录';$('#heading').textContent='欢迎回来。';$('#intro').textContent='使用邮箱与密码登录你的远信账号。';feedback('');$('#loginEmail').focus()};$('#returnReset').onclick=()=>{$('#signin').hidden=true;$('#reset').hidden=false;$('#waiting').hidden=true;$('#back').hidden=false;$('#mode').textContent='ACCOUNT RECOVERY / 找回入口';$('#heading').innerHTML='重新打开，<br>你的那封信。';$('#intro').textContent='填写注册时使用的邮箱。我们会向它发送一封包含密码重置链接的邮件。';feedback('');$('#email').focus()};$('#signin').onsubmit=e=>{e.preventDefault();const email=$('#loginEmail'),password=$('#loginPassword');if(!email.value||!email.validity.valid){invalid(email);return feedback('请输入有效的登录邮箱。',true)}invalid(email,false);if(password.value.length<8){invalid(password);return feedback('请输入至少8位密码。',true)}invalid(password,false);feedback('登录演示已就绪。')};</script></body></html>
