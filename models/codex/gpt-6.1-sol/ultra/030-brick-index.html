<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>筛选检索 · brick-index</title><style>:root{--page:#f4efe8;--surface:#fffcf7;--text:#412f28;--muted:#8b7668;--accent:#a3412b;--line:#decfc0;--danger:#9c3b42;--outer:#f4efe8;--font:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:var(--font);font-size:15px;line-height:1.6;color:var(--text);background:var(--page)}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.42}button:hover:not(:disabled){filter:brightness(.94)}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:3px}button,input,select,textarea{transition:background .16s ease,border-color .16s ease}a{color:inherit}h1,h2,h3,p{margin:0}h1{line-height:1.2}h2{font-size:22px;line-height:1.3}h3{font-size:17px}small,.meta{font-size:12px;color:var(--muted)}button{border:0}svg{display:block;max-width:100%}.status{min-height:24px;font-size:13px;color:var(--accent)}.status[data-error="true"]{color:var(--danger)}[hidden]{display:none!important}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}dialog{max-width:calc(100vw - 32px);border:1px solid var(--line);border-radius:16px;padding:28px;color:var(--text);background:var(--surface)}dialog::backdrop{background:#00000088}dialog button{margin-top:16px}.phone{width:390px;min-height:844px;margin:30px auto;border-radius:30px;overflow:hidden;position:relative;background:var(--surface);box-shadow:0 24px 80px #00000022}.mobile-body{background:var(--outer);padding:1px}.mobile-top{height:46px;display:flex;justify-content:space-between;align-items:center;padding:0 26px;font-weight:700;font-size:12px}.mobile-nav{display:flex;justify-content:space-around;gap:8px;padding:18px 16px;border-top:1px solid var(--line)}.mobile-nav button{background:transparent;color:var(--muted);font-size:12px}.mobile-nav button[aria-current="page"]{color:var(--accent);font-weight:700}input[type=checkbox],input[type=radio]{accent-color:var(--accent)}@media(max-width:600px){.phone{margin:0;width:100%;min-height:100vh;border-radius:0;box-shadow:none}.mobile-body{padding:0}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition:none!important}}.archive{max-width:1190px;padding:34px 30px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--text);padding-bottom:18px}.brand{font-size:18px;font-weight:800}.top small{letter-spacing:2px}.heading{display:grid;grid-template-columns:1fr auto;align-items:end;margin:36px 0 30px}h1{font-family:Georgia,"Songti SC",serif;font-size:52px;font-weight:500}.heading p{color:var(--muted);margin-top:12px}.large-number{font-family:Georgia,serif;font-size:64px;line-height:1;color:var(--accent)}.filters{display:grid;grid-template-columns:1.5fr repeat(3,1fr) auto;gap:16px;padding:22px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.filter{display:grid;gap:8px;font-size:11px;color:var(--muted)}input,select{width:100%;padding:10px 0;border:0;border-bottom:1px solid var(--text);background:transparent;border-radius:0;color:var(--text);font-size:13px}.clear{background:transparent;color:var(--accent);padding:0 8px;align-self:end;height:42px;border-bottom:1px solid var(--accent)}.results-layout{display:grid;grid-template-columns:1fr 240px;gap:36px;margin-top:28px}.list-top{display:flex;justify-content:space-between;padding-bottom:14px;font-size:11px;color:var(--muted)}.entry{display:grid;grid-template-columns:44px 1fr 80px;align-items:center;gap:18px;padding:22px 0;border-top:1px solid var(--line);background:transparent;color:var(--text);width:100%;text-align:left}.entry:hover,.entry[aria-pressed=true]{background:var(--surface)}.serial{font-family:Georgia,serif;color:var(--accent);font-size:25px}.entry strong{display:block;font-size:19px;font-family:Georgia,"Songti SC",serif;font-weight:500}.entry small{display:block;margin-top:5px}.tag{font-size:11px;text-align:right;color:var(--muted)}.detail{background:var(--accent);color:var(--surface);padding:24px;align-self:start}.detail small{color:var(--surface);opacity:.7}.detail h2{font-family:Georgia,"Songti SC",serif;font-weight:500;margin:24px 0 18px;font-size:26px}.detail p{font-size:13px;line-height:1.9}.detail .line{width:35px;border-top:1px solid var(--surface);margin:25px 0}.empty{padding:50px 0;color:var(--muted);border-top:1px solid var(--line)}.status{margin-top:12px;font-size:12px}@media(max-width:800px){.archive{padding:24px}.filters{grid-template-columns:repeat(2,1fr)}.clear{grid-column:2;justify-self:end}.results-layout{grid-template-columns:1fr 190px;gap:24px}.entry{grid-template-columns:28px 1fr;gap:10px}.tag{display:none}h1{font-size:40px}.large-number{font-size:48px}.detail{padding:20px}}@media(max-width:600px){.results-layout{grid-template-columns:1fr}.detail{display:none}.top small{display:none}}</style></head><body><main class="archive"><header class="top"><span class="brand">窄门档案馆 / NARROW GATE</span><small>独立出版物检索 · 2026</small></header><div class="heading"><div><small>THE READING ROOM</small><h1>每一页，都有来处。</h1><p>在独立书籍、访谈与随笔之间，找到你的下一次阅读。</p></div><div class="large-number" id="big-count">06</div></div><section class="filters" aria-label="检索条件"><label class="filter">关键词<input id="query" placeholder="书名、作者或主题"></label><label class="filter">类别<select id="category"><option value="">全部类别</option><option>摄影</option><option>建筑</option><option>文学</option></select></label><label class="filter">年份<select id="year"><option value="">全部年份</option><option>2026</option><option>2025</option></select></label><label class="filter">语言<select id="language"><option value="">全部语言</option><option>中文</option><option>双语</option></select></label><button id="clear" class="clear">清除条件 ×</button></section><div class="results-layout"><section><div class="list-top"><span id="count">找到 6 份出版物</span><span>按收录顺序</span></div><div id="results"></div><p id="status" class="status" role="status" aria-live="polite">点击一条出版物，阅读档案注记。</p></section><aside class="detail"><small>精选档案 / 001</small><h2 id="detail-title">缓慢的<br>城市边缘</h2><p id="detail-copy">摄影师以四年的步行，记录被城市遗忘的河道与微小建筑。一本关于“如何看”的影像笔记。</p><div class="line"></div><small id="detail-meta">江微 · 摄影 · 2026</small></aside></div></main><script>const $=id=>document.getElementById(id);function note(t,error=false){const e=$('status');e.textContent=t;e.dataset.error=String(error);}const books=[{title:'缓慢的城市边缘',author:'江微',category:'摄影',year:'2026',language:'中文',copy:'摄影师以四年的步行，记录被城市遗忘的河道与微小建筑。一本关于“如何看”的影像笔记。'},{title:'一座屋子的四季',author:'林北',category:'建筑',year:'2026',language:'双语',copy:'从窗户、走廊与雨声出发，讲述建筑与生活之间的微妙关系。'},{title:'写给海风的信',author:'许知',category:'文学',year:'2025',language:'中文',copy:'十二封没有收件人的信，记录一次沿海旅行中遇见的人与日常。'},{title:'夜色的颗粒',author:'南禾',category:'摄影',year:'2025',language:'双语',copy:'以黑白胶片观察夜晚的街道，收录三十六幅城市暗面。'},{title:'小院修复手记',author:'青木事务所',category:'建筑',year:'2025',language:'中文',copy:'一间老院子的修复过程，保留材料、工法与现场协商的记录。'},{title:'山中还有一盏灯',author:'宋庭',category:'文学',year:'2026',language:'中文',copy:'十篇山居随笔，写雨水、植物与一个人缓慢重新认识世界的过程。'}];function render(){const q=$('query').value.trim().toLowerCase();const c=$('category').value,y=$('year').value,l=$('language').value;const found=books.filter(b=>(!q||(b.title+b.author+b.category).toLowerCase().includes(q))&&(!c||b.category===c)&&(!y||b.year===y)&&(!l||b.language===l));$('count').textContent='找到 '+found.length+' 份出版物';$('big-count').textContent=String(found.length).padStart(2,'0');$('results').replaceChildren();found.forEach(b=>{const btn=document.createElement('button');btn.className='entry';btn.setAttribute('aria-pressed','false');const no=document.createElement('span');no.className='serial';no.textContent=String(books.indexOf(b)+1).padStart(2,'0');const text=document.createElement('span');const strong=document.createElement('strong');strong.textContent=b.title;const small=document.createElement('small');small.textContent=b.author+' · '+b.year+' · '+b.language;text.append(strong,small);const tag=document.createElement('span');tag.className='tag';tag.textContent=b.category+' ↗';btn.append(no,text,tag);btn.onclick=()=>{document.querySelectorAll('.entry').forEach(e=>e.setAttribute('aria-pressed',String(e===btn)));$('detail-title').textContent=b.title;$('detail-copy').textContent=b.copy;$('detail-meta').textContent=b.author+' · '+b.category+' · '+b.year;note('已打开档案：'+b.title);};$('results').append(btn);});if(!found.length){const e=document.createElement('p');e.className='empty';e.textContent='没有符合条件的档案。试试减少筛选条件，或换一个关键词。';$('results').append(e);note('没有结果，已保留检索条件。',true);}else note('筛选已更新，共 '+found.length+' 份出版物。');}['query','category','year','language'].forEach(id=>$(id).addEventListener(id==='query'?'input':'change',render));$('clear').onclick=()=>{['query','category','year','language'].forEach(id=>$(id).value='');render();};render();</script></body></html>
