<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>回声 / 传一封短笺</title><style>:root{--page:#fff7e9;--surface:#ffffff;--text:#483424;--muted:#9b8069;--accent:#b96b32;--line:#efddc0;--danger:#ad3434;--on:#ffffff;--radius:8px}*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--text);font:14px/1.6 "Segoe UI","Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;min-height:44px;padding:10px 18px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);color:var(--text)}button:hover{filter:brightness(.94)}button:disabled{opacity:.4;cursor:not-allowed}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.primary{background:var(--accent);color:var(--on);border-color:var(--accent);font-weight:700}input,select,textarea{min-width:0;max-width:100%;width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);color:var(--text)}textarea{resize:vertical;min-height:100px}label{display:block;font-weight:600;margin:12px 0 6px}h1,h2,h3,p{margin:0 0 16px}h1{font-size:40px;line-height:1.2;letter-spacing:-1.2px}h2{font-size:22px;line-height:1.35}h3{font-size:16px}.muted,small{color:var(--muted)}small{font-size:12px}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.spread{justify-content:space-between}.stack{display:grid;gap:16px}.box{padding:24px;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius)}.rule{border-bottom:1px solid var(--line);padding:16px 0}.tag{font-size:12px;letter-spacing:1px;text-transform:uppercase}.error{color:var(--danger);font-weight:600}.feedback{min-height:26px;margin-top:14px}hr{border:0;border-top:1px solid var(--line);margin:24px 0}[hidden]{display:none!important}.phone{max-width:390px;min-height:844px;margin:auto;background:var(--page);padding:26px 24px;position:relative}.bottom{display:flex;gap:20px;justify-content:space-around;border-top:1px solid var(--line);padding:16px 0;margin-top:28px}.number{font-variant-numeric:tabular-nums}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}@media(min-width:600px){body.mobile{background:var(--line);padding:28px}.phone{border-radius:28px;overflow:hidden;box-shadow:0 16px 60px #00000020}}@media(max-width:600px){h1{font-size:32px}.box{padding:18px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}.relay{padding:0}.relay header{padding:26px 24px 20px;border-bottom:2px solid var(--text)}.relay h1{font-size:30px}.threads{display:flex;gap:8px;padding:16px 24px;background:var(--line)}.threads button{border-radius:24px;padding:8px 14px}.threads button[aria-pressed=true]{background:var(--text);color:var(--page)}.conversation{padding:24px;min-height:410px}.bubble{max-width:85%;border-radius:16px 16px 16px 0;padding:14px 18px;background:var(--surface);border:1px solid var(--line);margin:14px 0}.outgoing{margin-left:auto;border-radius:16px 16px 0 16px;background:var(--line)}.stamp{color:var(--accent);font:12px/1.6 Consolas,monospace;letter-spacing:2px}.composer{padding:0 24px 24px}.composer textarea{min-height:80px}.composer button{border-radius:8px}.message-text{white-space:pre-wrap;overflow-wrap:anywhere}.fail-toggle{font-size:12px;background:none;padding:8px;min-height:44px}.relay footer{padding:16px 24px;border-top:1px dashed var(--muted);font-size:12px}</style></head><body class="mobile"><main class="phone relay"><header><div class="row spread"><span class="stamp">ECHO · 03</span><span class="muted">轻轻地说，慢慢地听</span></div><h1>回声短笺</h1></header><nav class="threads" aria-label="会话列表"><button id="threadA" aria-pressed="true" onclick="choose('好友甲',this)">好友甲 · 2</button><button id="threadB" aria-pressed="false" onclick="choose('书友组',this)">书友组 · 1</button></nav><section class="conversation"><div class="row spread"><strong id="name">好友甲</strong><small>今天 · 09:41</small></div><div id="messages"></div></section><section class="composer"><label for="message">写一封短笺</label><textarea id="message" placeholder="想说的话，都可以从这里开始。" maxlength="500"></textarea><div class="row spread"><button id="fail" class="fail-toggle" aria-pressed="false" onclick="failed=!failed;this.setAttribute('aria-pressed',failed);this.textContent=failed?'下一条将失败 · 点击关闭':'让下一条发送失败'">让下一条发送失败</button><button id="send" class="primary" onclick="send()">发送 ↗</button></div><p id="feedback" class="feedback" role="status" aria-live="polite"></p></section><footer>你的短笺留在此处，每一封都有送达状态。</footer></main><script>const E=id=>document.getElementById(id);let current='好友甲',failed=false;const conversations={'好友甲':[{text:'下次一起去看那个小展览吧。',incoming:true},{text:'我把时间空出来了，等你的消息。',incoming:true}],'书友组':[{text:'本周一起读《城市与记忆》。',incoming:true}]};function render(){E('messages').replaceChildren();conversations[current].forEach((m,i)=>{const b=document.createElement('div');b.className='bubble'+(m.incoming?'':' outgoing');const t=document.createElement('div');t.className='message-text';t.textContent=m.text;b.append(t);if(!m.incoming){const s=document.createElement('small');s.textContent=m.status;s.className=m.status==='发送失败'?'error':'';b.append(s);if(m.status==='发送失败'){const r=document.createElement('button');r.textContent='重试发送';r.onclick=()=>{m.status='已送达';render()};b.append(r)}}E('messages').append(b)})}function choose(n,b){current=n;E('name').textContent=n;document.querySelectorAll('.threads button').forEach(x=>x.setAttribute('aria-pressed',x===b));render()}function send(){const text=E('message').value.trim();if(!text){E('feedback').textContent='先写下一句话，再发送。';return}conversations[current].push({text,status:failed?'发送失败':'已送达'});E('message').value='';failed=false;E('fail').setAttribute('aria-pressed','false');E('fail').textContent='让下一条发送失败';E('feedback').textContent='';render()}render();</script></body></html>
