<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>二次验证 · 栈桥</title><style>:root{--page:#171c1a;--surface:#222925;--text:#f0e8d3;--muted:#8d9b90;--accent:#e6b85c;--line:#445045;--danger:#eb8270;--screen:#2d352b;}*{box-sizing:border-box}html{color-scheme:light}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;font-size:15px;line-height:1.6}button,input,select{font:inherit}button,a,input,select{ -webkit-tap-highlight-color:transparent}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}a{color:inherit}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:4px}button:hover:not(:disabled){filter:brightness(.94)}input,select{max-width:100%}input[aria-invalid="true"]{border-color:var(--danger)!important;box-shadow:0 0 0 1px var(--danger)}h1,h2,h3,p{margin:0}h1{line-height:1.13;letter-spacing:-.05em}h2{line-height:1.3}svg{max-width:100%;display:block}small,.small{font-size:12px}.muted{color:var(--muted)}.eyebrow{font-size:11px;letter-spacing:.16em;font-weight:700}.status{min-height:24px;font-size:13px;color:var(--muted)}.status.error{color:var(--danger)}.status.success{color:var(--accent)}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}[hidden]{display:none!important}dialog{border:1px solid var(--line);border-radius:16px;max-width:min(440px,calc(100% - 32px));padding:28px;background:var(--surface);color:var(--text)}dialog::backdrop{background:rgba(0,0,0,.38)}dialog input{width:100%;margin:16px 0;padding:12px;border:1px solid var(--line);background:var(--page);color:var(--text)}dialog .actions{display:flex;gap:12px;justify-content:flex-end}dialog button{padding:9px 16px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--text)}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
body{background:var(--page);color:var(--text);font-family:Consolas,"Microsoft YaHei",monospace}.shell{max-width:1060px;margin:auto;padding:40px 48px;min-height:100vh;display:flex;flex-direction:column}.header{display:flex;justify-content:space-between;align-items:center;font-size:12px;border-bottom:1px solid var(--line);padding-bottom:20px}.logo{font-weight:700;font-size:19px;letter-spacing:.1em}.live{color:var(--accent)}.layout{display:grid;grid-template-columns:.9fr 1.1fr;gap:70px;align-items:center;flex:1;padding:44px 0}.aside .eyebrow{color:var(--accent)}h1{font-size:46px;letter-spacing:-.04em;margin:20px 0}.aside p{max-width:310px;color:var(--muted);font-size:13px;line-height:1.9}.device{width:175px;height:175px;border:1px solid var(--line);margin-top:35px;position:relative;display:grid;place-items:center;background:repeating-linear-gradient(0deg,transparent 0 9px,#222925 9px 10px)}.device svg{width:98px}.corner{position:absolute;font-size:9px;color:var(--accent);top:8px;left:9px}.console{border:1px solid var(--line);background:var(--surface);box-shadow:6px 6px 0 var(--screen)}.bar{padding:12px 22px;border-bottom:1px solid var(--line);font-size:10px;display:flex;justify-content:space-between;color:var(--muted)}.console-body{padding:28px}.console h2{font-size:20px}.destination{font-size:12px;color:var(--muted);margin:10px 0 24px}.otp-label{font-size:11px;color:var(--accent);letter-spacing:.1em;display:block}.otp{width:100%;margin:9px 0 18px;border:1px solid var(--line);background:var(--page);padding:14px 10px;color:var(--text);font-family:Consolas,monospace;letter-spacing:.5em;text-indent:.5em;text-align:center;font-size:29px}.primary{width:100%;padding:13px;background:var(--accent);color:var(--page);border:0;font-weight:700}.resend{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:19px;font-size:11px;color:var(--muted)}.resend button{padding:0;border:0;background:none;color:var(--accent);font-size:11px}.status{margin-top:18px;font-size:12px;min-height:44px}.demo{font-size:10px;color:var(--muted);padding-top:18px;border-top:1px dashed var(--line)}footer{border-top:1px solid var(--line);padding-top:20px;display:flex;justify-content:space-between;color:var(--muted);font-size:10px}footer a{color:var(--text)}@media(max-width:850px){.shell{padding:28px}.layout{gap:35px}.console-body{padding:22px}h1{font-size:40px}.otp{font-size:26px}}@media(max-width:600px){.shell{padding:24px}.layout{display:block;padding:30px 0}.aside h1{font-size:34px}.aside p{max-width:none}.device{display:none}.console{margin-top:28px}.console-body{padding:22px}.header span:last-child{display:none}footer{gap:16px}.otp{font-size:27px;letter-spacing:.4em;text-indent:.4em}}
</style></head><body><main class="shell"><header class="header"><div class="logo">栈桥 / GATE 02</div><span class="live">● 加密会话已建立</span></header><div class="layout"><aside class="aside"><div class="eyebrow">SECURITY CHECKPOINT</div><h1>最后一道确认。<br>是你，就放行。</h1><p>密码已通过。请输入手机上收到的六位验证码，确认这次登录由你本人发起。</p><div class="device" aria-hidden="true"><span class="corner">AUTH / 2FA</span><svg viewBox="0 0 100 100"><path d="M27 12h46v76H27z" fill="none" stroke="#8d9b90" stroke-width="2"/><path d="M36 21h28M43 79h14" stroke="#445045" stroke-width="3"/><path d="m38 50 9 9 18-23" fill="none" stroke="#e6b85c" stroke-width="5"/></svg></div></aside><section class="console"><div class="bar"><span>验证终端 #02</span><span>SESSION 7F2</span></div><div class="console-body"><h2>输入动态验证码</h2><p class="destination">短信已发送至 +86 138 **** 2046</p><form id="verify" novalidate><label for="otp" class="otp-label">6-DIGIT SECURITY CODE</label><input id="otp" class="otp" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="000000" aria-label="六位验证码"><button class="primary" id="confirm">确认身份 →</button></form><div class="resend"><span id="count">30 秒后可重新发送</span><button id="resend" disabled>重新发送</button></div><div id="status" class="status" role="status" aria-live="polite">你有 3 次尝试机会。</div><div class="demo">演示验证码：246810 · 连续输错 3 次将锁定，可重新获取。</div></div></section></div><footer><span>请勿把验证码告诉任何人。</span><a href="#" id="other">无法收到短信？</a></footer></main><script>const $=(s)=>document.querySelector(s);function feedback(text,error=false){const n=$('#status');n.textContent=text;n.className='status '+(error?'error':'success')}function invalid(el,on=true){el.setAttribute('aria-invalid',String(on));if(on)el.focus()}let seconds=30,tries=3,locked=false;const tick=setInterval(()=>{if(seconds>0)seconds--;$('#count').textContent=seconds>0?seconds+' 秒后可重新发送':'可以重新获取验证码';$('#resend').disabled=seconds>0},1000);$('#otp').oninput=()=>{$('#otp').value=$('#otp').value.replace(/\D/g,'')};$('#verify').onsubmit=e=>{e.preventDefault();const o=$('#otp');invalid(o,false);if(locked)return feedback('验证已锁定，请点击重新发送恢复。',true);if(!/^\d{6}$/.test(o.value)){invalid(o);return feedback('请填写完整的六位数字验证码。',true)}if(o.value!=='246810'){tries--;invalid(o);if(tries===0){locked=true;seconds=0;$('#confirm').disabled=true;$('#resend').disabled=false;$('#count').textContent='重新获取可以解除锁定';feedback('连续 3 次验证失败，已锁定。请重新发送获取新验证码。',true)}else feedback('验证码不正确，还可尝试 '+tries+' 次。',true);return}feedback('身份确认成功。安全通道已放行。');$('#confirm').disabled=true;clearInterval(tick)};$('#resend').onclick=()=>{tries=3;locked=false;seconds=30;$('#confirm').disabled=false;$('#resend').disabled=true;$('#otp').value='';invalid($('#otp'),false);feedback('验证码已重新发送，你有 3 次尝试机会。')};$('#other').onclick=e=>{e.preventDefault();feedback('请核对手机号码，或联系 auth@stack.example 使用备用验证。')};</script></body></html>
