<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>列表空态 · paper-journey</title><style>:root{--page:#edf7fc;--surface:#ffffff;--text:#244c68;--muted:#92adc0;--accent:#438dbc;--line:#dbeaf3;--danger:#b55359;--outer:#d6e3ed;--font:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:var(--font);font-size:15px;line-height:1.6;color:var(--text);background:var(--page)}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.42}button:hover:not(:disabled){filter:brightness(.94)}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:3px}button,input,select,textarea{transition:background .16s ease,border-color .16s ease}a{color:inherit}h1,h2,h3,p{margin:0}h1{line-height:1.2}h2{font-size:22px;line-height:1.3}h3{font-size:17px}small,.meta{font-size:12px;color:var(--muted)}button{border:0}svg{display:block;max-width:100%}.status{min-height:24px;font-size:13px;color:var(--accent)}.status[data-error="true"]{color:var(--danger)}[hidden]{display:none!important}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}dialog{max-width:calc(100vw - 32px);border:1px solid var(--line);border-radius:16px;padding:28px;color:var(--text);background:var(--surface)}dialog::backdrop{background:#00000088}dialog button{margin-top:16px}.phone{width:390px;min-height:844px;margin:30px auto;border-radius:30px;overflow:hidden;position:relative;background:var(--surface);box-shadow:0 24px 80px #00000022}.mobile-body{background:var(--outer);padding:1px}.mobile-top{height:46px;display:flex;justify-content:space-between;align-items:center;padding:0 26px;font-weight:700;font-size:12px}.mobile-nav{display:flex;justify-content:space-around;gap:8px;padding:18px 16px;border-top:1px solid var(--line)}.mobile-nav button{background:transparent;color:var(--muted);font-size:12px}.mobile-nav button[aria-current="page"]{color:var(--accent);font-weight:700}input[type=checkbox],input[type=radio]{accent-color:var(--accent)}@media(max-width:600px){.phone{margin:0;width:100%;min-height:100vh;border-radius:0;box-shadow:none}.mobile-body{padding:0}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition:none!important}}.journey-head{display:flex;align-items:center;justify-content:space-between;padding:12px 26px 14px}.brand{font-weight:800;letter-spacing:1px;font-size:15px}.head-add{width:32px;height:32px;border:1px solid var(--line);border-radius:50%;font-size:20px;background:var(--surface);color:var(--accent)}.subtitle{padding:0 26px;font-size:11px;color:var(--muted)}.empty{padding:14px 26px 22px;text-align:center;min-height:560px}.empty svg{width:100%;height:230px;margin:5px 0 6px}.empty h1{font-size:26px;font-weight:600;line-height:1.4}.empty p{font-size:12px;color:var(--muted);line-height:1.8;margin:14px auto 20px;max-width:260px}.create{background:var(--accent);color:var(--surface);padding:13px 26px;border-radius:28px;font-weight:700;font-size:13px}.example{background:none;color:var(--accent);margin-top:12px;font-size:11px;display:block;width:100%}.list{padding:28px 26px;min-height:620px}.list h1{font-size:26px;margin-bottom:22px}.trip{padding:24px 0;border-top:1px solid var(--line)}.trip-top{display:flex;justify-content:space-between;align-items:center}.trip h2{font-size:20px}.trip p{font-size:12px;color:var(--muted);margin:10px 0 15px}.trip button{padding:8px 15px;border-radius:20px;background:var(--page);color:var(--accent);font-size:12px}.checklist{padding:14px 0;display:grid;gap:13px;font-size:13px}.checklist label{display:flex;gap:9px;align-items:center}.status{padding:0 26px 10px;font-size:11px;min-height:28px}.mobile-nav{background:var(--surface);padding:14px 16px}.tips{padding:50px 26px;min-height:620px}.tips h2{margin-bottom:20px}.tips p{font-size:13px;color:var(--muted)}dialog h2{margin-bottom:14px}dialog label{display:grid;gap:8px;font-size:13px}dialog input{padding:12px;border:1px solid var(--line);border-radius:8px;width:100%;color:var(--text);background:var(--surface)}dialog .error{font-size:12px;color:var(--danger);margin-top:12px;min-height:22px}dialog .buttons{display:flex;justify-content:space-between;gap:20px}.cancel{background:none;color:var(--muted)}.trip{min-width:0}.trip-top h2{min-width:0;overflow-wrap:anywhere;flex:1}.trip-top>span{flex-shrink:0}</style></head><body class="mobile-body"><div class="phone"><div class="mobile-top"><span>9:41</span><span>●●● ▰</span></div><header class="journey-head"><span class="brand">纸飞机 / PAPER PLANE</span><button class="head-add" id="add" aria-label="创建旅行清单">+</button></header><p class="subtitle">我的旅行清单 · 让出发轻一点</p><main><section class="empty" id="empty"><svg viewBox="0 0 330 280" aria-hidden="true"><circle cx="165" cy="130" r="112" fill="var(--page)"/><path d="M12 216c140 85 320-94 140-94-108 0-47 122 99 54" stroke="var(--accent)" stroke-dasharray="4 8" stroke-linecap="round" stroke-width="2" opacity=".45" fill="none"/><path d="m111 106 147-48-52 122-25-45-70-29z" fill="var(--surface)" stroke="var(--line)" stroke-width="2"/><path d="m111 106 70 29 77-77-99 57z" fill="var(--line)"/><path d="m181 135-22-20-3 47z" fill="var(--accent)" opacity=".6"/><path d="M36 67h43m-21-21v42M271 221h24m-12-12v24" stroke="var(--line)" stroke-width="2"/></svg><h1>下一次出发，<br>还没有写下来。</h1><p>这里会收好你的行李清单与小计划。<br>先创建一份，旅程就开始了一半。</p><button class="create" id="create">＋ 创建旅行清单</button><button class="example" id="example">先看看一份周末清单 →</button></section><section class="list" id="list" hidden><h1>准备好，去远方。</h1><div id="trips"></div><button class="create" id="create-more">＋ 新建另一份</button></section><section class="tips" id="tips" hidden><h2>轻装出发的小提醒</h2><p>把证件放进随身口袋。<br><br>充电器与备用电池一起检查。<br><br>留一点空位给路上的纪念品。</p></section><p id="status" class="status" role="status" aria-live="polite">还没有清单，点击创建就能开始。</p></main><nav class="mobile-nav" aria-label="底部导航"><button data-tab="trips" aria-current="page">⌁<br>清单</button><button data-tab="tips">✦<br>出发贴士</button></nav></div><dialog id="create-modal"><h2>给这次出发起个名字</h2><form id="create-form" novalidate><label>清单名称<input id="trip-name" required maxlength="30" placeholder="例如：去海边过周末"></label><p class="error" id="create-error" role="alert"></p><div class="buttons"><button class="cancel" type="button" id="cancel">再想想</button><button class="create">创建清单</button></div></form></dialog><script>const $=id=>document.getElementById(id);function note(t,error=false){const e=$('status');e.textContent=t;e.dataset.error=String(error);}let trips=0;const open=()=>$('create-modal').showModal();['create','create-more','add'].forEach(id=>$(id).onclick=open);$('cancel').onclick=()=>$('create-modal').close();function addTrip(name){trips++;const article=document.createElement('article');article.className='trip';const top=document.createElement('div');top.className='trip-top';const h=document.createElement('h2');h.textContent=name;const icon=document.createElement('span');icon.textContent='↗';top.append(h,icon);const p=document.createElement('p');p.textContent='刚刚创建 · 0 / 3 项已准备';const list=document.createElement('div');list.className='checklist';['证件与车票','手机与充电器','一套轻便衣物'].forEach(t=>{const l=document.createElement('label');const c=document.createElement('input');c.type='checkbox';c.onchange=()=>{const count=list.querySelectorAll('input:checked').length;p.textContent='刚刚创建 · '+count+' / 3 项已准备';note(count===3?'这份清单已准备齐全。':'准备进度已更新');};l.append(c,document.createTextNode(t));list.append(l);});article.append(top,p,list);$('trips').prepend(article);$('empty').hidden=true;$('list').hidden=false;$('tips').hidden=true;note('清单已创建，可以开始勾选行李。');}$('create-form').onsubmit=e=>{e.preventDefault();const name=$('trip-name').value.trim();if(!name){$('create-error').textContent='请填写清单名称。';$('trip-name').focus();return;}addTrip(name);$('create-modal').close();$('trip-name').value='';$('create-error').textContent='';};$('example').onclick=()=>addTrip('周末去海边');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{const tips=b.dataset.tab==='tips';$('tips').hidden=!tips;$('empty').hidden=tips||trips>0;$('list').hidden=tips||trips===0;document.querySelectorAll('[data-tab]').forEach(x=>{if(x===b)x.setAttribute('aria-current','page');else x.removeAttribute('aria-current');});note(tips?'出发之前，检查这些小事。':trips?'已回到你的旅行清单。':'还没有清单，点击创建就能开始。');});</script></body></html>
