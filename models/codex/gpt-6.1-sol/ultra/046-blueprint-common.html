<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>共构 / 把事情一起做完</title><style>:root{--page:#edf3fa;--surface:#ffffff;--text:#173652;--muted:#668096;--accent:#266cad;--line:#cadce9;--danger:#b94334;--on:#ffffff;--radius:8px}*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--text);font:14px/1.6 "Segoe UI","Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;min-height:44px;padding:10px 18px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);color:var(--text)}button:hover{filter:brightness(.94)}button:disabled{opacity:.4;cursor:not-allowed}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.primary{background:var(--accent);color:var(--on);border-color:var(--accent);font-weight:700}input,select,textarea{min-width:0;max-width:100%;width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);color:var(--text)}textarea{resize:vertical;min-height:100px}label{display:block;font-weight:600;margin:12px 0 6px}h1,h2,h3,p{margin:0 0 16px}h1{font-size:40px;line-height:1.2;letter-spacing:-1.2px}h2{font-size:22px;line-height:1.35}h3{font-size:16px}.muted,small{color:var(--muted)}small{font-size:12px}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.spread{justify-content:space-between}.stack{display:grid;gap:16px}.box{padding:24px;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius)}.rule{border-bottom:1px solid var(--line);padding:16px 0}.tag{font-size:12px;letter-spacing:1px;text-transform:uppercase}.error{color:var(--danger);font-weight:600}.feedback{min-height:26px;margin-top:14px}hr{border:0;border-top:1px solid var(--line);margin:24px 0}[hidden]{display:none!important}.phone{max-width:390px;min-height:844px;margin:auto;background:var(--page);padding:26px 24px;position:relative}.bottom{display:flex;gap:20px;justify-content:space-around;border-top:1px solid var(--line);padding:16px 0;margin-top:28px}.number{font-variant-numeric:tabular-nums}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}@media(min-width:600px){body.mobile{background:var(--line);padding:28px}.phone{border-radius:28px;overflow:hidden;box-shadow:0 16px 60px #00000020}}@media(max-width:600px){h1{font-size:32px}.box{padding:18px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}.workspace{min-height:800px;display:grid;grid-template-columns:220px 1fr;background:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:28px 28px}.sidebar{padding:32px 24px;background:var(--text);color:var(--surface)}.sidebar h1{font-size:28px;letter-spacing:3px}.sidebar button{width:100%;margin-top:18px;background:transparent;color:var(--surface);border-color:var(--muted);text-align:left}.sidebar small{color:var(--line)}.workbody{padding:32px 36px}.workhead{background:var(--page);padding:20px;border:1px solid var(--line)}.workbody h1{font-size:30px;letter-spacing:0}.entry{display:grid;grid-template-columns:1fr 160px auto;gap:12px;padding:20px;background:var(--surface);margin-top:24px;border:1px solid var(--line)}.tasklist{display:grid;gap:12px;margin:24px 0}.task{background:var(--surface);padding:20px;border-left:4px solid var(--accent);display:flex;justify-content:space-between;align-items:center;gap:20px}.activity{background:var(--surface);padding:24px;border:1px solid var(--line)}.activity li{padding:8px 0;border-bottom:1px dashed var(--line)}.permission{padding:24px;background:var(--surface);border:2px solid var(--danger);margin-top:24px}@media(max-width:900px){.workspace{grid-template-columns:1fr}.sidebar{padding:18px 24px}.sidebar nav{display:flex;gap:12px}.sidebar button{width:auto;margin:0}.sidebar p{display:none}.workbody{padding:20px}.entry{grid-template-columns:1fr}.task{align-items:flex-start;flex-wrap:wrap}}.task>div{min-width:0;flex:1;overflow-wrap:anywhere}.task>button{flex-shrink:0}.workbody{min-width:0}.activity{min-width:0}.activity li{overflow-wrap:anywhere}</style></head><body class="desktop"><main class="workspace"><aside class="sidebar"><h1>共构 ⊞</h1><p>一起把想法<br>变成值得交付的事情。</p><nav><button onclick="document.getElementById('taskTitle').focus()">＋ 创建任务</button><button id="restricted" onclick="E('permission').hidden=false">♙ 受限：发布主版本</button></nav><hr><small>共享工作室<br>项目：周五展览<br>你的角色：协作者</small></aside><section class="workbody"><header class="workhead row spread"><div><p class="tag muted">工作室 / 09.30</p><h1>把事情一起做完。</h1></div><span id="counts">已完成 1 / 3</span></header><form class="entry" onsubmit="event.preventDefault();createTask()"><div><label for="taskTitle" class="sr">新任务标题</label><input id="taskTitle" placeholder="新任务，例如：校对展览说明" maxlength="60" required></div><div><label for="assignee" class="sr">分派成员</label><select id="assignee"><option>成员甲</option><option>成员乙</option><option>我</option></select></div><button id="create" class="primary">创建并分派</button></form><p id="feedback" class="feedback" role="status" aria-live="polite"></p><section id="tasks" class="tasklist" aria-label="任务列表"></section><section id="permission" class="permission" hidden><h2>需要发布管理员权限</h2><p>你可以协作普通任务，但不能推进“发布主版本”。此次受限任务没有变化。</p><div class="row"><button id="request" class="primary" onclick="requestAccess()">发出访问申请</button><button onclick="E('permission').hidden=true;E('taskTitle').focus()">安全返回可操作任务</button></div><p id="requestStatus" role="status"></p></section><section class="activity"><div class="row spread"><h2>活动记录</h2><small>每一次推进，都有来处。</small></div><ol id="log"></ol></section></section></main><script>const E=id=>document.getElementById(id);const statuses=['待开始','进行中','已完成'];let requested=false;const tasks=[{title:'确认布展动线',who:'成员甲',state:2},{title:'整理作品标签',who:'成员乙',state:1},{title:'邀请函校对',who:'我',state:0}];function log(text){const li=document.createElement('li');li.textContent=text;E('log').prepend(li)}function render(){E('tasks').replaceChildren();tasks.forEach((t,i)=>{const a=document.createElement('article');a.className='task';const d=document.createElement('div'),h=document.createElement('strong'),m=document.createElement('div'),b=document.createElement('button');h.textContent=t.title;m.className='muted';m.textContent=t.who+' · '+statuses[t.state];d.append(h,m);b.textContent=t.state===2?'已完成':t.state===0?'开始任务':'完成任务';b.disabled=t.state===2;b.onclick=()=>{t.state++;log(t.who+'将“'+t.title+'”推进为'+statuses[t.state]);render()};a.append(d,b);E('tasks').append(a)});E('counts').textContent='已完成 '+tasks.filter(t=>t.state===2).length+' / '+tasks.length}function createTask(){const title=E('taskTitle').value.trim();if(!title){E('feedback').textContent='请写下任务标题。';return}const who=E('assignee').value;tasks.push({title,who,state:0});log('创建“'+title+'”，分派给'+who);E('taskTitle').value='';E('feedback').textContent='新任务已创建并分派。';render()}function requestAccess(){if(!requested){log('已申请“发布主版本”的管理员访问权限');requested=true}E('requestStatus').textContent='申请已记录，等待管理员处理；你仍可推进普通任务。';E('request').disabled=true}render();log('工作室已建立，三个初始任务已同步。');</script></body></html>
