<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>成员目录 · field-people</title><style>:root{--page:#f2f4e9;--surface:#fffdf6;--text:#284e38;--muted:#7a8973;--accent:#628744;--line:#d9dfce;}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:var(--text);background:var(--page);font-size:15px;line-height:1.6}button,input,select{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}button,a,input,select,summary{outline-offset:4px}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--accent)}button{transition:filter .15s,transform .15s}button:hover:not(:disabled){filter:brightness(.94)}a{color:inherit}h1,h2,h3,p{margin:0}svg{display:block;max-width:100%}[hidden]{display:none!important}.sr{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}.feedback{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:12px 22px;background:var(--text);color:var(--surface);box-shadow:0 8px 30px #00000022;max-width:calc(100% - 32px);z-index:20;border-radius:8px;text-align:center}.feedback:empty{display:none}dialog{color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:12px;width:min(480px,calc(100% - 32px));padding:28px;box-shadow:0 20px 90px #00000033}dialog::backdrop{background:#00000066}dialog h2{font-size:26px;margin-bottom:12px}dialog p{margin:10px 0}dialog button{margin-top:16px;padding:10px 20px;border:0;background:var(--accent);color:var(--surface)}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
.directory{max-width:1130px;margin:auto;padding:32px 42px}.mast{display:flex;justify-content:space-between;align-items:center;padding-bottom:27px;border-bottom:1px solid var(--line)}.brand{font-weight:800;letter-spacing:4px;font-size:19px}.mast p{font-size:12px;color:var(--muted)}.intro{display:flex;justify-content:space-between;align-items:end;padding:36px 0 26px}.intro h1{font-size:48px;font-weight:500;letter-spacing:-2px;line-height:1.15}.intro h1 small{display:block;font-size:13px;letter-spacing:2px;margin-bottom:12px;color:var(--muted)}.intro p{font-size:14px;color:var(--muted);max-width:280px}.tools{display:flex;justify-content:space-between;align-items:center;margin:0 0 28px;gap:18px}.filters{display:flex;gap:7px}.filters button{border:1px solid var(--line);border-radius:20px;background:transparent;padding:6px 17px;font-size:12px;color:var(--muted)}.filters button.active{background:var(--text);border-color:var(--text);color:var(--surface)}.search{display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--text);padding:7px 0}.search input{width:155px;background:none;border:0;color:var(--text);font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}.person{padding:0;text-align:left;background:var(--surface);border:1px solid var(--line);color:var(--text);border-radius:3px;overflow:hidden}.person:hover{transform:translateY(-3px);filter:none}.portrait{background:var(--portrait);height:150px;position:relative;overflow:hidden}.portrait svg{height:100%;width:100%}.portrait>span{position:absolute;left:15px;top:12px;font-size:11px;letter-spacing:1px;color:#284e38}.persontext{padding:18px 20px}.dept{color:var(--muted);font-size:10px;letter-spacing:2px}.person h3{font-size:22px;font-weight:500;margin:3px 0}.person h3 span{float:right;font-size:18px;color:var(--accent)}.person p{font-size:12px;color:var(--muted)}.bottom{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);border-top:1px solid var(--line);margin-top:28px;padding-top:18px}.noresults{grid-column:1/-1;text-align:center;padding:60px;border:1px dashed var(--line);color:var(--muted)}dialog .skill{padding:12px;background:var(--page);font-size:13px}dialog .avatar{width:56px;height:56px;background:var(--accent);color:var(--surface);display:grid;place-items:center;border-radius:50%;font-size:22px;margin-bottom:18px}@media(max-width:900px){.directory{padding:26px}.grid{grid-template-columns:repeat(2,1fr);gap:18px}.intro h1{font-size:38px}}@media(max-width:600px){.directory{padding:20px}.intro{display:block}.intro p{margin-top:18px}.tools{flex-wrap:wrap}.filters{gap:4px}.filters button{padding:5px 11px}.search{width:100%}.search input{width:100%}.grid{gap:12px}.portrait{height:128px}.persontext{padding:12px}.mast p{display:none}.bottom{font-size:10px}}</style></head><body><main class="directory"><header class="mast"><div class="brand">野集 / FIELD</div><p>小团队，长出大想法。</p></header><section class="intro"><h1><small>PEOPLE DIRECTORY / 同行的人</small>一起，向外生长。</h1><p>来自不同领域的 6 位伙伴，<br>正在把想象变成日常。</p></section><div class="tools"><nav class="filters" aria-label="按团队筛选"><button class="active" data-filter="全部" aria-pressed="true">全部</button><button data-filter="设计" aria-pressed="false">设计</button><button data-filter="工程" aria-pressed="false">工程</button><button data-filter="内容" aria-pressed="false">内容</button><button data-filter="运营" aria-pressed="false">运营</button></nav><label class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/></svg><span class="sr">搜索成员姓名</span><input id="memberSearch" placeholder="搜索名字" autocomplete="off"></label></div><section class="grid" aria-label="成员名册"><button class="person" data-dept="设计" data-name="林屿" data-role="产品设计师" data-bio="用清晰的结构，让好点子落地。" data-skills="产品策略 · 交互设计"><div class="portrait" style="--portrait:#d8e6c8"><svg viewBox="0 0 200 150" aria-hidden="true"><path d="M40 155c3-45 31-56 60-56s59 15 62 56" fill="#284e38"/><ellipse cx="100" cy="63" rx="31" ry="36" fill="#f7f0df"/><path d="M67 62c-5-37 12-47 34-47 27 0 35 15 31 43-11-3-20-9-24-17-9 14-22 20-41 21" fill="#283b2e"/><path d="M89 77q11 9 22 0" stroke="#284e38" fill="none" stroke-width="2"/><circle cx="87" cy="62" r="2" fill="#284e38"/><circle cx="113" cy="62" r="2" fill="#284e38"/><path d="M12 130h24m137-16h17" stroke="#ffffff" stroke-width="2"/></svg><span>LY</span></div><div class="persontext"><span class="dept">设计</span><h3>林屿<span>↗</span></h3><p>产品设计师</p></div></button><button class="person" data-dept="内容" data-name="阿芦" data-role="内容编辑" data-bio="把复杂的事情说得轻一点。" data-skills="品牌叙事 · 内容策划"><div class="portrait" style="--portrait:#f1dfb8"><svg viewBox="0 0 200 150" aria-hidden="true"><path d="M40 155c3-45 31-56 60-56s59 15 62 56" fill="#284e38"/><ellipse cx="100" cy="63" rx="31" ry="36" fill="#f7f0df"/><path d="M67 62c-5-37 12-47 34-47 27 0 35 15 31 43-11-3-20-9-24-17-9 14-22 20-41 21" fill="#283b2e"/><path d="M89 77q11 9 22 0" stroke="#284e38" fill="none" stroke-width="2"/><circle cx="87" cy="62" r="2" fill="#284e38"/><circle cx="113" cy="62" r="2" fill="#284e38"/><path d="M12 130h24m137-16h17" stroke="#ffffff" stroke-width="2"/></svg><span>AL</span></div><div class="persontext"><span class="dept">内容</span><h3>阿芦<span>↗</span></h3><p>内容编辑</p></div></button><button class="person" data-dept="工程" data-name="周原" data-role="前端工程师" data-bio="让每一次点击都有可靠的回应。" data-skills="界面工程 · 可访问性"><div class="portrait" style="--portrait:#d5e5df"><svg viewBox="0 0 200 150" aria-hidden="true"><path d="M40 155c3-45 31-56 60-56s59 15 62 56" fill="#284e38"/><ellipse cx="100" cy="63" rx="31" ry="36" fill="#f7f0df"/><path d="M67 62c-5-37 12-47 34-47 27 0 35 15 31 43-11-3-20-9-24-17-9 14-22 20-41 21" fill="#283b2e"/><path d="M89 77q11 9 22 0" stroke="#284e38" fill="none" stroke-width="2"/><circle cx="87" cy="62" r="2" fill="#284e38"/><circle cx="113" cy="62" r="2" fill="#284e38"/><path d="M12 130h24m137-16h17" stroke="#ffffff" stroke-width="2"/></svg><span>ZY</span></div><div class="persontext"><span class="dept">工程</span><h3>周原<span>↗</span></h3><p>前端工程师</p></div></button><button class="person" data-dept="设计" data-name="田禾" data-role="视觉设计师" data-bio="在平凡材料里找到新鲜的节奏。" data-skills="品牌视觉 · 插画"><div class="portrait" style="--portrait:#e5d6c7"><svg viewBox="0 0 200 150" aria-hidden="true"><path d="M40 155c3-45 31-56 60-56s59 15 62 56" fill="#284e38"/><ellipse cx="100" cy="63" rx="31" ry="36" fill="#f7f0df"/><path d="M67 62c-5-37 12-47 34-47 27 0 35 15 31 43-11-3-20-9-24-17-9 14-22 20-41 21" fill="#283b2e"/><path d="M89 77q11 9 22 0" stroke="#284e38" fill="none" stroke-width="2"/><circle cx="87" cy="62" r="2" fill="#284e38"/><circle cx="113" cy="62" r="2" fill="#284e38"/><path d="M12 130h24m137-16h17" stroke="#ffffff" stroke-width="2"/></svg><span>TH</span></div><div class="persontext"><span class="dept">设计</span><h3>田禾<span>↗</span></h3><p>视觉设计师</p></div></button><button class="person" data-dept="运营" data-name="许池" data-role="社区运营" data-bio="欢迎每一位新朋友，连接每一个好想法。" data-skills="社区增长 · 活动策划"><div class="portrait" style="--portrait:#cbdce8"><svg viewBox="0 0 200 150" aria-hidden="true"><path d="M40 155c3-45 31-56 60-56s59 15 62 56" fill="#284e38"/><ellipse cx="100" cy="63" rx="31" ry="36" fill="#f7f0df"/><path d="M67 62c-5-37 12-47 34-47 27 0 35 15 31 43-11-3-20-9-24-17-9 14-22 20-41 21" fill="#283b2e"/><path d="M89 77q11 9 22 0" stroke="#284e38" fill="none" stroke-width="2"/><circle cx="87" cy="62" r="2" fill="#284e38"/><circle cx="113" cy="62" r="2" fill="#284e38"/><path d="M12 130h24m137-16h17" stroke="#ffffff" stroke-width="2"/></svg><span>XC</span></div><div class="persontext"><span class="dept">运营</span><h3>许池<span>↗</span></h3><p>社区运营</p></div></button><button class="person" data-dept="工程" data-name="陈北" data-role="质量工程师" data-bio="从一个小问题走到它真正的原因。" data-skills="质量保障 · 自动化"><div class="portrait" style="--portrait:#e0d9e7"><svg viewBox="0 0 200 150" aria-hidden="true"><path d="M40 155c3-45 31-56 60-56s59 15 62 56" fill="#284e38"/><ellipse cx="100" cy="63" rx="31" ry="36" fill="#f7f0df"/><path d="M67 62c-5-37 12-47 34-47 27 0 35 15 31 43-11-3-20-9-24-17-9 14-22 20-41 21" fill="#283b2e"/><path d="M89 77q11 9 22 0" stroke="#284e38" fill="none" stroke-width="2"/><circle cx="87" cy="62" r="2" fill="#284e38"/><circle cx="113" cy="62" r="2" fill="#284e38"/><path d="M12 130h24m137-16h17" stroke="#ffffff" stroke-width="2"/></svg><span>CB</span></div><div class="persontext"><span class="dept">工程</span><h3>陈北<span>↗</span></h3><p>质量工程师</p></div></button><p class="noresults" id="noresults" hidden>没有找到这位伙伴。试试清空名字，或切换团队。</p></section><footer class="bottom"><span id="memberCount">6 位伙伴 · 全部团队</span><span>名册更新 / 2026.09</span></footer></main><dialog id="profile"><div class="avatar" id="profileAvatar"></div><h2 id="profileName"></h2><p id="profileRole"></p><p id="profileBio"></p><p class="skill" id="profileSkills"></p><p>工作邮箱：<a id="profileMail" href="mailto:team@field.example">team@field.example</a></p><button id="closeProfile">回到名册</button></dialog><div class="feedback" role="status" aria-live="polite" id="feedback"></div><script>const say=t=>document.getElementById('feedback').textContent=t;
let dept='全部';const search=document.getElementById('memberSearch');function filterPeople(){let count=0;document.querySelectorAll('.person').forEach(p=>{p.hidden=(dept!=='全部'&&p.dataset.dept!==dept)||!p.dataset.name.includes(search.value.trim());if(!p.hidden)count++});document.getElementById('memberCount').textContent=count+' 位伙伴 · '+dept+'团队';document.getElementById('noresults').hidden=count>0}search.oninput=filterPeople;document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{dept=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>{x.classList.toggle('active',x===b);x.setAttribute('aria-pressed',String(x===b))});filterPeople()});const dialog=document.getElementById('profile');document.querySelectorAll('.person').forEach(p=>p.onclick=()=>{document.getElementById('profileAvatar').textContent=p.dataset.name.slice(0,1);document.getElementById('profileName').textContent=p.dataset.name;document.getElementById('profileRole').textContent=p.dataset.dept+' / '+p.dataset.role;document.getElementById('profileBio').textContent=p.dataset.bio;document.getElementById('profileSkills').textContent=p.dataset.skills;dialog.showModal()});document.getElementById('closeProfile').onclick=()=>dialog.close();</script></body></html>
