<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>邀请进入 · 夜航社</title><style>:root{--page:#1b1017;--surface:#302029;--text:#edd9ad;--muted:#a68e89;--accent:#d7ad66;--line:#674b48;--danger:#e79789;--velvet:#492b39;}*{box-sizing:border-box}html{color-scheme:light}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;font-size:15px;line-height:1.6}button,input,select{font:inherit}button,a,input,select{ -webkit-tap-highlight-color:transparent}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}a{color:inherit}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:4px}button:hover:not(:disabled){filter:brightness(.94)}input,select{max-width:100%}input[aria-invalid="true"]{border-color:var(--danger)!important;box-shadow:0 0 0 1px var(--danger)}h1,h2,h3,p{margin:0}h1{line-height:1.13;letter-spacing:-.05em}h2{line-height:1.3}svg{max-width:100%;display:block}small,.small{font-size:12px}.muted{color:var(--muted)}.eyebrow{font-size:11px;letter-spacing:.16em;font-weight:700}.status{min-height:24px;font-size:13px;color:var(--muted)}.status.error{color:var(--danger)}.status.success{color:var(--accent)}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}[hidden]{display:none!important}dialog{border:1px solid var(--line);border-radius:16px;max-width:min(440px,calc(100% - 32px));padding:28px;background:var(--surface);color:var(--text)}dialog::backdrop{background:rgba(0,0,0,.38)}dialog input{width:100%;margin:16px 0;padding:12px;border:1px solid var(--line);background:var(--page);color:var(--text)}dialog .actions{display:flex;gap:12px;justify-content:flex-end}dialog button{padding:9px 16px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--text)}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
body{background:radial-gradient(ellipse at 50% 20%,var(--velvet),var(--page) 65%);color:var(--text)}.shell{min-height:100vh;padding:36px 24px;display:flex;flex-direction:column;align-items:center}.mast{width:min(960px,100%);display:flex;justify-content:space-between;align-items:center;font-size:12px}.mark{font-family:Georgia,serif;font-size:23px;letter-spacing:.14em}.ticket{margin:46px 0 30px;width:min(600px,100%);border:1px solid var(--line);padding:12px;background:var(--surface);position:relative}.ticket::before,.ticket::after{content:'';position:absolute;top:65%;width:20px;height:20px;border-radius:50%;background:var(--page)}.ticket::before{left:-10px}.ticket::after{right:-10px}.inner{border:1px solid var(--line);text-align:center;padding:30px 44px 26px}.crest{width:84px;margin:0 auto 20px}.eyebrow{color:var(--accent)}h1{font-size:44px;margin:16px 0}p.copy{font-size:14px;color:var(--muted);max-width:340px;margin:0 auto}.rule{display:flex;align-items:center;gap:16px;margin:28px 0;color:var(--muted);font-size:11px;letter-spacing:.12em}.rule::before,.rule::after{content:'';height:1px;background:var(--line);flex:1}.code-label{font-size:12px;display:block;text-align:left;margin-bottom:8px}.code{width:100%;background:var(--page);color:var(--text);border:1px solid var(--line);padding:13px 16px;font-family:Consolas,monospace;font-size:20px;letter-spacing:.22em;text-align:center}.primary{margin-top:14px;background:var(--accent);color:var(--page);border:0;width:100%;padding:13px;font-weight:600}.status{margin:12px 0 0;text-align:left}.small-note{font-size:11px;color:var(--muted);margin-top:20px}.bottom{font-size:12px;color:var(--muted);text-align:center}.bottom a{color:var(--text)}.help{margin-top:12px;font-size:11px}footer{margin-top:auto;padding-top:12px;font-size:10px;color:var(--muted);letter-spacing:.14em}@media(max-width:650px){.shell{padding:24px 20px}.ticket{margin-top:36px}.inner{padding:24px 20px}.mast span:last-child{display:none}h1{font-size:36px}.crest{width:70px}.code{font-size:16px;letter-spacing:.16em}}
</style></head><body><main class="shell"><header class="mast"><div class="mark">夜航社</div><span>PRIVATE SALON · 仅凭邀请</span></header><section class="ticket"><div class="inner"><svg class="crest" viewBox="0 0 100 95" aria-hidden="true"><path d="m50 4 40 24v41L50 91 10 69V28z" stroke="#d7ad66" fill="none"/><path d="M50 15v65M20 33l60 29M80 33 20 62" stroke="#674b48"/><path d="M61 24a24 24 0 1 0 16 38A27 27 0 0 1 61 24" fill="#d7ad66"/></svg><div class="eyebrow">A SEAT RESERVED FOR YOU</div><h1>这扇门，为你留着。</h1><p class="copy">一处关于阅读、设计与好奇心的私人会客室。你的席位，始于朋友的一次邀请。</p><div class="rule">邀请码核验</div><form id="invite" novalidate><label class="code-label" for="code">填写朋友发来的邀请码</label><input id="code" class="code" placeholder="NIGHT—XXXX" autocomplete="off" maxlength="20"><button class="primary">核对邀请，进入夜航社 ↗</button><div id="status" class="status" role="status" aria-live="polite"></div></form><div class="small-note">邀请码仅供本人使用 · 不会公开你的邀请关系</div></div></section><div class="bottom">暂时没有邀请？ <a href="#" id="waitlist">加入等候名单</a><div class="help">体验邀请码：NIGHT-2026</div></div><footer>QUIET COMPANY. CURIOUS MINDS.</footer></main><script>const $=(s)=>document.querySelector(s);function feedback(text,error=false){const n=$('#status');n.textContent=text;n.className='status '+(error?'error':'success')}function invalid(el,on=true){el.setAttribute('aria-invalid',String(on));if(on)el.focus()}$('#invite').onsubmit=e=>{e.preventDefault();const c=$('#code');invalid(c,false);if(c.value.trim().toUpperCase()!=='NIGHT-2026'){invalid(c);return feedback(c.value.trim()?'这张邀请未通过核验。请检查字符，或联系邀请你的朋友。':'请填写邀请码后再核对。',true)}feedback('邀请已确认。你的席位是 026，欢迎加入今晚的会客。');$('#invite button').textContent='邀请已确认 ✓'};$('#waitlist').onclick=e=>{e.preventDefault();feedback('等候名单邮箱：join@night.example。请留下你想聊的话题。')};</script></body></html>
