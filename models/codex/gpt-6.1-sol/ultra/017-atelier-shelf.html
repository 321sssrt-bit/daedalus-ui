<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>商店首页 · atelier-shelf</title><style>:root{--page:#fff9f1;--surface:#ffffff;--text:#573b2d;--muted:#aa8974;--accent:#c56843;--line:#edddcd;}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:var(--text);background:var(--page);font-size:15px;line-height:1.6}button,input,select{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}button,a,input,select,summary{outline-offset:4px}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--accent)}button{transition:filter .15s,transform .15s}button:hover:not(:disabled){filter:brightness(.94)}a{color:inherit}h1,h2,h3,p{margin:0}svg{display:block;max-width:100%}[hidden]{display:none!important}.sr{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}.feedback{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:12px 22px;background:var(--text);color:var(--surface);box-shadow:0 8px 30px #00000022;max-width:calc(100% - 32px);z-index:20;border-radius:8px;text-align:center}.feedback:empty{display:none}dialog{color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:12px;width:min(480px,calc(100% - 32px));padding:28px;box-shadow:0 20px 90px #00000033}dialog::backdrop{background:#00000066}dialog h2{font-size:26px;margin-bottom:12px}dialog p{margin:10px 0}dialog button{margin-top:16px;padding:10px 20px;border:0;background:var(--accent);color:var(--surface)}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

path d="M83 81v34" stroke="#ffffff" stroke-width="3" opacity=".2"/></svg><button class="save" aria-label="收藏松露马克杯" aria-pressed="false" data-save="松露马克杯">♡</button><div class="productinfo"><h3>松露马克杯</h3><span>¥128</span><p>每日手握的温度</p></div></article><article class="product"><svg viewBox="0 0 204 160" aria-hidden="true"><rect width="204" height="160" fill="#fae7d5"/><ellipse cx="102" cy="138" rx="56" ry="7" fill="#5b3826" opacity=".08"/><g fill="#d9b992"><path d="M83 32h34v34c0 18 27 29 27 48 0 27-88 27-88 0 0-19 27-30 27-48Z"/></g><path d="M83 81v34" stroke="#ffffff" stroke-width="3" opacity=".2"/></svg><button class="save" aria-label="收藏晨雾花器" aria-pressed="false" data-save="晨雾花器">♡</button><div class="productinfo"><h3>晨雾花器</h3><span>¥228</span><p>给一枝花的留白</p></div></article><article class="product"><svg viewBox="0 0 204 160" aria-hidden="true"><rect width="204" height="160" fill="#fae7d5"/><ellipse cx="102" cy="138" rx="56" ry="7" fill="#5b3826" opacity=".08"/><g fill="#bd925e"><path d="M48 79h108c-3 46-25 52-54 52S52 118 48 79Z"/></g><path d="M83 81v34" stroke="#ffffff" stroke-width="3" opacity=".2"/></svg><button class="save" aria-label="收藏麦色饭碗" aria-pressed="false" data-save="麦色饭碗">♡</button><div class="productinfo"><h3>麦色饭碗</h3><span>¥96</span><p>盛下一顿认真吃的饭</p></div></article><article class="product"><svg viewBox="0 0 204 160" aria-hidden="true"><rect width="204" height="160" fill="#fae7d5"/><ellipse cx="102" cy="138" rx="56" ry="7" fill="#5b3826" opacity=".08"/><g fill="#ce7251"><ellipse cx="102" cy="91" rx="65" ry="40"/><ellipse cx="102" cy="91" rx="48" ry="29" fill="none" stroke="#ffffff" opacity=".4" stroke-width="2"/></g><path d="M83 81v34" stroke="#ffffff" stroke-width="3" opacity=".2"/></svg><button class="save" aria-label="收藏落日圆盘" aria-pressed="false" data-save="落日圆盘">♡</button><div class="productinfo"><h3>落日圆盘</h3><span>¥168</span><p>让食物拥有舞台</p></div></article><article class="product"><svg viewBox="0 0 204 160" aria-hidden="true"><rect width="204" height
