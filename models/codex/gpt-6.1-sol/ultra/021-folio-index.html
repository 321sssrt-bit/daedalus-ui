<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>内容目录 · folio-index</title><style>:root{--page:#f3f1e9;--surface:#fdfcf7;--text:#182d4b;--muted:#8a8d8f;--accent:#3e648e;--line:#d6d8d4;}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;color:var(--text);background:var(--page);font-size:15px;line-height:1.6}button,input,select{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}button,a,input,select,summary{outline-offset:4px}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--accent)}button{transition:filter .15s,transform .15s}button:hover:not(:disabled){filter:brightness(.94)}a{color:inherit}h1,h2,h3,p{margin:0}svg{display:block;max-width:100%}[hidden]{display:none!important}.sr{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}.feedback{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:12px 22px;background:var(--text);color:var(--surface);box-shadow:0 8px 30px #00000022;max-width:calc(100% - 32px);z-index:20;border-radius:8px;text-align:center}.feedback:empty{display:none}dialog{color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:12px;width:min(480px,calc(100% - 32px));padding:28px;box-shadow:0 20px 90px #00000033}dialog::backdrop{background:#00000066}dialog h2{font-size:26px;margin-bottom:12px}dialog p{margin:10px 0}dialog button{margin-top:16px;padding:10px 20px;border:0;background:var(--accent);color:var(--surface)}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
.journal{max-width:1160px;margin:auto;padding:25px 40px 36px}.mast{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--text);padding-bottom:15px}.mast .brand{font-family:Georgia,"Songti SC",SimSun,serif;font-size:33px;font-weight:700;letter-spacing:5px}.mast small{font-size:10px;color:var(--muted);letter-spacing:2px}.titleblock{display:flex;justify-content:space-between;align-items:end;padding:30px 0;border-bottom:1px solid var(--line)}.titleblock h1{font-family:Georgia,"Songti SC",SimSun,serif;font-size:56px;font-weight:400;line-height:1.05;letter-spacing:5px}.issue{font-size:11px;color:var(--muted);text-align:right}.issue b{display:block;font-size:20px;font-weight:400;color:var(--text);letter-spacing:2px}.content{display:grid;grid-template-columns:1.25fr 1fr;gap:55px;padding-top:28px}.listhead{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);letter-spacing:2px;margin-bottom:10px}.story{border-bottom:1px solid var(--line)}.story button{display:grid;grid-template-columns:32px 1fr 67px 20px;gap:16px;align-items:center;width:100%;text-align:left;border:0;background:transparent;color:var(--text);padding:18px 0}.number{font-family:Georgia,serif;font-size:17px;color:var(--muted)}.story-title{font-family:Georgia,"Songti SC",SimSun,serif;font-size:22px}.story small{display:block;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;font-size:10px;color:var(--muted);margin-top:4px;letter-spacing:1px}.byline{font-size:11px;text-align:right}.arrow{font-size:20px}.story.selected .story-title,.story.selected .arrow{color:var(--accent)}.story.selected .number{color:var(--accent)}.feature{background:var(--surface);border:1px solid var(--line);align-self:start;padding:20px}.landscape{width:100%;height:200px}.feature .eyebrow{font-size:10px;letter-spacing:2px;color:var(--muted);margin-top:21px}.feature h2{font-family:Georgia,"Songti SC",SimSun,serif;font-size:29px;font-weight:400;line-height:1.4;margin:10px 0}.feature .summary{font-size:13px;line-height:1.9;color:#617184}.feature .source{font-size:11px;border-top:1px solid var(--line);margin-top:23px;padding-top:16px;color:var(--muted)}.bookmark{border:0;background:var(--text);color:var(--surface);padding:10px 18px;font-size:11px;margin-top:20px}.journalfoot{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);letter-spacing:2px;margin-top:32px;border-top:1px solid var(--text);padding-top:17px}@media(max-width:900px){.journal{padding:24px}.content{gap:28px;grid-template-columns:1.2fr 1fr}.titleblock h1{font-size:44px}.story button{grid-template-columns:26px 1fr 52px 17px;gap:9px}.story-title{font-size:19px}.feature{padding:16px}.landscape{height:170px}}@media(max-width:650px){.content{grid-template-columns:1fr}.titleblock h1{font-size:38px}.feature{order:-1}.landscape{height:160px}.mast small{display:none}.journalfoot span:last-child{display:none}}</style></head><body><main class="journal"><header class="mast"><div class="brand">慢行</div><small>生活与观察 / A JOURNAL OF EVERYDAY</small></header><section class="titleblock"><h1>把日子<br>读得慢一些。</h1><div class="issue">本期主题<b>日常的尺度</b>第 09 期 / 2026 秋</div></section><div class="content"><section aria-label="本期文章目录"><div class="listhead"><span>目录 / CONTENTS</span><span>6 篇文章</span></div><article class="story selected"><button data-index="0" aria-pressed="true"><span class="number">01</span><span class="story-title">城市，慢慢走<small>步行观察</small></span><span class="byline">林屿<small>18 分钟</small></span><span class="arrow">↗</span></button></article><article class="story "><button data-index="1" aria-pressed="false"><span class="number">02</span><span class="story-title">一盏灯的来处<small>物件与生活</small></span><span class="byline">阿芦<small>12 分钟</small></span><span class="arrow">↗</span></button></article><article class="story "><button data-index="2" aria-pressed="false"><span class="number">03</span><span class="story-title">雨后书店<small>空间笔记</small></span><span class="byline">田禾<small>9 分钟</small></span><span class="arrow">↗</span></button></article><article class="story "><button data-index="3" aria-pressed="false"><span class="number">04</span><span class="story-title">给未来的一封信<small>时间与记忆</small></span><span class="byline">周原<small>15 分钟</small></span><span class="arrow">↗</span></button></article><article class="story "><button data-index="4" aria-pressed="false"><span class="number">05</span><span class="story-title">海边的工作桌<small>远方来信</small></span><span class="byline">许池<small>11 分钟</small></span><span class="arrow">↗</span></button></article><article class="story "><button data-index="5" aria-pressed="false"><span class="number">06</span><span class="story-title">留白的练习<small>创作方法</small></span><span class="byline">陈北<small>8 分钟</small></span><span class="arrow">↗</span></button></article></section><aside class="feature" aria-label="当前文章摘要"><svg class="landscape" viewBox="0 0 350 200" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="350" height="200" fill="#d6d8d4"/><rect x="27" y="43" width="81" height="139" fill="#b3bec7"/><rect x="132" y="23" width="101" height="159" fill="#8e9eaa"/><rect x="256" y="63" width="62" height="119" fill="#b3bec7"/><path d="M41 67h15v20H41zm30 0h15v20H71zm-30 36h15v20H41zm30 0h15v20H71zm75-52h21v27h-21zm37 0h21v27h-21zm-37 42h21v27h-21zm37 0h21v27h-21z" fill="#f3f1e9"/><path d="M0 183h350" stroke="#182d4b" stroke-width="2"/><path d="M240 186v-45" stroke="#182d4b" stroke-width="4"/><ellipse cx="241" cy="122" rx="31" ry="41" fill="#3e648e"/><circle cx="128" cy="166" r="6" fill="#182d4b"/><path d="M127 171v18m0-10-9 8m9-8 9 8" stroke="#182d4b" stroke-width="3"/></svg><div class="eyebrow" id="featureCategory">步行观察 / 本文摘要</div><h2 id="featureTitle">城市，慢慢走</h2><p class="summary" id="featureSummary">从一条街道开始，重新认识我们每天经过的城市。速度慢下来之后，招牌、树影与人的关系才变得清楚。</p><div class="source" id="featureSource">林屿 · 18 分钟 · 来自《慢行》第 09 期</div><button class="bookmark" id="bookmark" aria-pressed="false">留作稍后阅读 ＋</button></aside></div><footer class="journalfoot"><span>© 慢行编辑部 · 写下那些值得停留的时刻</span><span>本期收录 6 篇 / 73 分钟</span></footer></main><div class="feedback" role="status" aria-live="polite" id="feedback"></div><script>const say=t=>document.getElementById('feedback').textContent=t;
const stories=[["01", "城市，慢慢走", "林屿", "步行观察", "18 分钟", "从一条街道开始，重新认识我们每天经过的城市。速度慢下来之后，招牌、树影与人的关系才变得清楚。"], ["02", "一盏灯的来处", "阿芦", "物件与生活", "12 分钟", "访谈三位手艺人，追问一盏灯从图纸到桌面的每一次取舍。光并不只是亮度，也是人与空间之间的距离。"], ["03", "雨后书店", "田禾", "空间笔记", "9 分钟", "雨停之后走进巷口的小书店。书架的尺度、门边的长凳与安静的店主，构成一个可以停留的下午。"], ["04", "给未来的一封信", "周原", "时间与记忆", "15 分钟", "我们邀请不同年龄的人写下十年后最想记住的一件事，整理成这组关于期待、遗忘与日常的短文。"], ["05", "海边的工作桌", "许池", "远方来信", "11 分钟", "从海边小镇寄来的工作记录：不用更大的办公室，也能把一件事情认真做完。"], ["06", "留白的练习", "陈北", "创作方法", "8 分钟", "删去一个不必要的元素，在自己的作品里观察空白的作用。一次关于节制与专注的练习。"]],saved=new Set();let current=0;function updateBookmark(){const b=document.getElementById('bookmark');b.textContent=saved.has(current)?'已加入稍后阅读 ✓':'留作稍后阅读 ＋';b.setAttribute('aria-pressed',String(saved.has(current)))}document.querySelectorAll('[data-index]').forEach(b=>b.onclick=()=>{current=Number(b.dataset.index);const s=stories[current];document.getElementById('featureCategory').textContent=s[3]+' / 本文摘要';document.getElementById('featureTitle').textContent=s[1];document.getElementById('featureSummary').textContent=s[5];document.getElementById('featureSource').textContent=s[2]+' · '+s[4]+' · 来自《慢行》第 09 期';document.querySelectorAll('[data-index]').forEach(x=>{x.closest('.story').classList.toggle('selected',x===b);x.setAttribute('aria-pressed',String(x===b))});updateBookmark()});document.getElementById('bookmark').onclick=()=>{if(saved.has(current))saved.delete(current);else saved.add(current);updateBookmark();say(saved.has(current)?'已留作稍后阅读':'已从稍后阅读移除')};</script></body></html>
