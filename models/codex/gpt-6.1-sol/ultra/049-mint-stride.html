<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>步生 / 今天也有在前进</title><style>:root{--page:#f1f8f2;--surface:#ffffff;--text:#244936;--muted:#779181;--accent:#bde8ad;--line:#d7e7d9;--danger:#aa3f3c;--on:#244936;--radius:8px}*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--text);font:14px/1.6 "Segoe UI","Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;min-height:44px;padding:10px 18px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);color:var(--text)}button:hover{filter:brightness(.94)}button:disabled{opacity:.4;cursor:not-allowed}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.primary{background:var(--accent);color:var(--on);border-color:var(--accent);font-weight:700}input,select,textarea{min-width:0;max-width:100%;width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);color:var(--text)}textarea{resize:vertical;min-height:100px}label{display:block;font-weight:600;margin:12px 0 6px}h1,h2,h3,p{margin:0 0 16px}h1{font-size:40px;line-height:1.2;letter-spacing:-1.2px}h2{font-size:22px;line-height:1.35}h3{font-size:16px}.muted,small{color:var(--muted)}small{font-size:12px}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.spread{justify-content:space-between}.stack{display:grid;gap:16px}.box{padding:24px;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius)}.rule{border-bottom:1px solid var(--line);padding:16px 0}.tag{font-size:12px;letter-spacing:1px;text-transform:uppercase}.error{color:var(--danger);font-weight:600}.feedback{min-height:26px;margin-top:14px}hr{border:0;border-top:1px solid var(--line);margin:24px 0}[hidden]{display:none!important}.phone{max-width:390px;min-height:844px;margin:auto;background:var(--page);padding:26px 24px;position:relative}.bottom{display:flex;gap:20px;justify-content:space-around;border-top:1px solid var(--line);padding:16px 0;margin-top:28px}.number{font-variant-numeric:tabular-nums}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}@media(min-width:600px){body.mobile{background:var(--line);padding:28px}.phone{border-radius:28px;overflow:hidden;box-shadow:0 16px 60px #00000020}}@media(max-width:600px){h1{font-size:32px}.box{padding:18px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}.health{padding:28px 24px}.health h1{font-size:30px;letter-spacing:-.5px;font-weight:600}.goal{position:relative;display:grid;place-items:center;height:250px;margin:16px 0}.goal svg{position:absolute;width:240px;height:240px;transform:rotate(-90deg)}.goal-number{font-size:54px;line-height:1;color:var(--text);font-weight:300}.goal-center{text-align:center;z-index:1}.bars{height:100px;display:flex;align-items:end;justify-content:space-between;gap:12px;padding-top:20px;border-bottom:1px solid var(--line)}.bar{flex:1;background:var(--line);min-height:3px;border-radius:5px 5px 0 0}.bar:last-child{background:var(--text)}.days{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin:6px 0 24px}.health .box{border-radius:24px}.health .primary{width:100%;border-radius:28px}.health label{font-size:12px}.health input{border-radius:14px}.health .row.fields{align-items:start}.fields>div{flex:1;min-width:110px}.logline{padding:12px 0;border-bottom:1px solid var(--line);font-size:12px}.health .bottom{font-size:12px}</style></head><body class="mobile"><main class="phone health"><header class="row spread"><strong>步生 ◌</strong><small>星期三 / 09.30</small></header><div style="margin-top:30px"><p class="muted">每一点，都是前进。</p><h1>今天也有在前进。</h1></div><section class="goal" aria-label="每日活动目标"><svg viewBox="0 0 240 240"><circle cx="120" cy="120" r="102" fill="none" stroke="#d7e7d9" stroke-width="12"/><circle id="ring" cx="120" cy="120" r="102" fill="none" stroke="#244936" stroke-width="12" stroke-linecap="round" stroke-dasharray="641" stroke-dashoffset="427"/></svg><div class="goal-center"><div class="goal-number number" id="progress">20<span style="font-size:20px"> / 60</span></div><small>今日活动分钟</small><div id="percent">目标达成 33%</div></div></section><div class="row spread"><strong>本周的节奏</strong><small id="trendText">今天20分钟</small></div><div id="bars" class="bars" role="img" aria-label="周活动趋势"></div><div class="days"><span>四</span><span>五</span><span>六</span><span>日</span><span>一</span><span>二</span><span>今天</span></div><section class="box"><h2>记下这次走过的路</h2><div class="row fields"><div><label for="minutes">活动分钟 · 1–180</label><input id="minutes" type="number" min="1" max="180" step="1" value="25"></div><div><label for="distance">距离km · 0.1–30</label><input id="distance" type="number" min=".1" max="30" step=".1" value="2.3"></div></div><button id="invalid" onclick="E('minutes').value=999">填入999分钟，检查无效数据</button><button id="save" class="primary" onclick="save()">保存这次活动</button><p id="feedback" class="feedback" role="status" aria-live="polite"></p></section><section id="records" aria-label="已保存活动"><div class="logline">今日早间散步 · 20分钟 · 1.8km</div></section><nav class="bottom"><strong>今日</strong><span>趋势</span><span>我的目标</span></nav></main><script>const E=id=>document.getElementById(id);let today=20;function render(){const pct=Math.min(100,Math.round(today/60*100));E('progress').innerHTML=today+'<span style="font-size:20px"> / 60</span>';E('percent').textContent='目标达成 '+pct+'%';E('ring').setAttribute('stroke-dashoffset',641*(1-pct/100));E('trendText').textContent='今天'+today+'分钟';const values=[32,45,20,55,40,30,today],max=Math.max(60,...values);E('bars').replaceChildren();values.forEach(v=>{const b=document.createElement('div');b.className='bar';b.style.height=(v/max*80)+'px';b.title=v+'分钟';E('bars').append(b)});E('bars').setAttribute('aria-label','最近七天活动分钟：'+values.join('、'))}function save(){const m=Number(E('minutes').value),d=Number(E('distance').value);let field=null,msg='';if(!Number.isInteger(m)||m<1||m>180){field='minutes';msg='活动分钟无效：请填写1–180的整数；原有进度没有变化。'}else if(!Number.isFinite(d)||d<.1||d>30){field='distance';msg='距离无效：请填写0.1–30km；原有进度没有变化。'}if(field){E(field).setAttribute('aria-invalid','true');E(field).focus();E('feedback').textContent=msg;E('feedback').classList.add('error');return}E('minutes').removeAttribute('aria-invalid');E('distance').removeAttribute('aria-invalid');today+=m;const r=document.createElement('div');r.className='logline';r.textContent=`活动已保存 · ${m}分钟 · ${d}km`;E('records').prepend(r);render();E('feedback').classList.remove('error');E('feedback').textContent='已保存，目标进度和趋势已重新计算。'}render();</script></body></html>
