<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>危险删除 · red-line</title><style>:root{--page:#f4f1ed;--surface:#ffffff;--text:#292322;--muted:#827472;--accent:#d8493e;--line:#e1d8d2;--danger:#a12c26;--outer:#f4f1ed;--font:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:var(--font);font-size:15px;line-height:1.6;color:var(--text);background:var(--page)}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.42}button:hover:not(:disabled){filter:brightness(.94)}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:3px}button,input,select,textarea{transition:background .16s ease,border-color .16s ease}a{color:inherit}h1,h2,h3,p{margin:0}h1{line-height:1.2}h2{font-size:22px;line-height:1.3}h3{font-size:17px}small,.meta{font-size:12px;color:var(--muted)}button{border:0}svg{display:block;max-width:100%}.status{min-height:24px;font-size:13px;color:var(--accent)}.status[data-error="true"]{color:var(--danger)}[hidden]{display:none!important}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}dialog{max-width:calc(100vw - 32px);border:1px solid var(--line);border-radius:16px;padding:28px;color:var(--text);background:var(--surface)}dialog::backdrop{background:#00000088}dialog button{margin-top:16px}.phone{width:390px;min-height:844px;margin:30px auto;border-radius:30px;overflow:hidden;position:relative;background:var(--surface);box-shadow:0 24px 80px #00000022}.mobile-body{background:var(--outer);padding:1px}.mobile-top{height:46px;display:flex;justify-content:space-between;align-items:center;padding:0 26px;font-weight:700;font-size:12px}.mobile-nav{display:flex;justify-content:space-around;gap:8px;padding:18px 16px;border-top:1px solid var(--line)}.mobile-nav button{background:transparent;color:var(--muted);font-size:12px}.mobile-nav button[aria-current="page"]{color:var(--accent);font-weight:700}input[type=checkbox],input[type=radio]{accent-color:var(--accent)}@media(max-width:600px){.phone{margin:0;width:100%;min-height:100vh;border-radius:0;box-shadow:none}.mobile-body{padding:0}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition:none!important}}.top{max-width:1100px;margin:30px auto;display:flex;justify-content:space-between;padding:0 30px;font-size:12px;color:var(--muted)}.brand{font-weight:800;letter-spacing:3px;color:var(--text)}.danger-box{max-width:790px;margin:66px auto;background:var(--surface);border-top:6px solid var(--accent);padding:44px 54px}.label{color:var(--accent);font-size:11px;letter-spacing:2px}.warning-head{display:flex;gap:24px;align-items:center;margin-top:22px}.warning-icon{width:64px;height:64px;background:var(--page);color:var(--accent);font-family:Georgia,serif;font-size:46px;display:grid;place-items:center;flex-shrink:0}h1{font-size:38px}.intro{font-size:14px;color:var(--muted);margin-top:22px;line-height:1.8}.loss{border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:28px 0;padding:20px 0;display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.loss strong{display:block;font-family:Georgia,serif;font-size:28px}.loss small{font-size:11px}.permanent{font-size:13px;display:flex;gap:10px;color:var(--danger)}.permanent span{font-weight:700}.field{display:grid;gap:10px;font-size:13px;margin:26px 0}.field b{font-family:Consolas,monospace;background:var(--page);padding:3px 6px;color:var(--text)}input{width:100%;padding:14px;border:1px solid var(--line);border-radius:0;background:var(--surface);color:var(--text)}input[data-error=true]{border-color:var(--accent)}.actions{display:grid;grid-template-columns:1.5fr 1fr;gap:14px}.cancel{background:var(--text);color:var(--surface);padding:15px;font-weight:700}.delete{background:transparent;color:var(--accent);border:1px solid var(--accent);padding:14px}.status{margin-top:14px}.support{border-top:1px solid var(--line);padding-top:20px;margin-top:26px;font-size:12px;color:var(--muted)}.result{padding:50px 0;text-align:center}.result h2{font-size:30px;margin-bottom:16px}.result .cancel{margin-top:24px;padding:14px 30px}@media(max-width:800px){.danger-box{margin:38px 24px;padding:34px}.top{margin:24px auto}h1{font-size:32px}.warning-head{gap:18px}}@media(max-width:520px){.danger-box{padding:28px;margin:28px 16px}.warning-head{align-items:start}.warning-icon{width:48px;height:48px;font-size:34px}h1{font-size:28px}.loss{gap:10px}.loss strong{font-size:24px}.actions{grid-template-columns:1fr}.cancel{order:0}.delete{order:1}}</style></head><body><header class="top"><span class="brand">LINE / 线库</span><span>空间设置 / 高级选项</span></header><main class="danger-box"><div id="warning"><p class="label">PERMANENT ACTION</p><div class="warning-head"><span class="warning-icon" aria-hidden="true">!</span><h1>删除整个「晴川档案」？</h1></div><p class="intro">这会永久移除空间内的所有内容，并立即结束所有成员的访问。请确认你已保存需要保留的资料。</p><div class="loss"><div><strong>128</strong><small>份文件将被移除</small></div><div><strong>16</strong><small>位成员失去访问</small></div><div><strong>3 年</strong><small>历史版本被清空</small></div></div><p class="permanent"><span>×</span> 删除后无法恢复，关联的公开链接也将失效。</p><label class="field">请输入 <span><b>删除晴川档案</b> 以继续</span><input id="phrase" placeholder="逐字输入上面的确认词" autocomplete="off" aria-describedby="status"></label><div class="actions"><button class="cancel" id="cancel">取消，保留我的空间</button><button class="delete" id="delete" disabled>永久删除</button></div><p class="support">只是想让成员暂时看不到？你可以先取消，然后将空间设为私有。</p></div><section class="result" id="result" hidden><h2 id="result-title">空间已保留。</h2><p id="result-copy">没有移除任何文件，成员权限保持不变。</p><button class="cancel" id="again">返回高级选项</button></section><p id="status" class="status" role="status" aria-live="polite">确认词尚未匹配，删除按钮不可用。</p></main><script>const $=id=>document.getElementById(id);function note(t,error=false){const e=$('status');e.textContent=t;e.dataset.error=String(error);}$('phrase').oninput=()=>{const valid=$('phrase').value==='删除晴川档案';$('delete').disabled=!valid;$('phrase').dataset.error=String($('phrase').value.length>0&&!valid);note(valid?'确认词已匹配。请再次考虑是否永久删除。':'确认词尚未匹配，删除按钮不可用。',Boolean($('phrase').value.length&&!valid));};function result(deleted){$('warning').hidden=true;$('result').hidden=false;$('result-title').textContent=deleted?'晴川档案已删除。':'空间已保留。';$('result-copy').textContent=deleted?'演示空间中的 128 份文件和历史版本已移除。此页面没有连接真实数据。':'没有移除任何文件，成员权限保持不变。';note(deleted?'删除完成 · 演示编号 DL-2026-032':'已取消危险操作');}$('cancel').onclick=()=>result(false);$('delete').onclick=()=>{if($('phrase').value!=='删除晴川档案'){note('确认词不匹配，未执行删除。',true);return;}result(true);};$('again').onclick=()=>{$('warning').hidden=false;$('result').hidden=true;$('phrase').value='';$('phrase').dataset.error='false';$('delete').disabled=true;note('请重新输入确认词；本页仅演示，未连接真实空间。');};</script></body></html>
