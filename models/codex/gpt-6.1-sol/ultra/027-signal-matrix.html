<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>角色权限 · signal-matrix</title><style>:root{--page:#161a1b;--surface:#202627;--text:#f3f2e7;--muted:#9da8a5;--accent:#edca54;--line:#384141;--danger:#ea8a76;--outer:#161a1b;--font:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:var(--font);font-size:15px;line-height:1.6;color:var(--text);background:var(--page)}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.42}button:hover:not(:disabled){filter:brightness(.94)}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:3px}button,input,select,textarea{transition:background .16s ease,border-color .16s ease}a{color:inherit}h1,h2,h3,p{margin:0}h1{line-height:1.2}h2{font-size:22px;line-height:1.3}h3{font-size:17px}small,.meta{font-size:12px;color:var(--muted)}button{border:0}svg{display:block;max-width:100%}.status{min-height:24px;font-size:13px;color:var(--accent)}.status[data-error="true"]{color:var(--danger)}[hidden]{display:none!important}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}dialog{max-width:calc(100vw - 32px);border:1px solid var(--line);border-radius:16px;padding:28px;color:var(--text);background:var(--surface)}dialog::backdrop{background:#00000088}dialog button{margin-top:16px}.phone{width:390px;min-height:844px;margin:30px auto;border-radius:30px;overflow:hidden;position:relative;background:var(--surface);box-shadow:0 24px 80px #00000022}.mobile-body{background:var(--outer);padding:1px}.mobile-top{height:46px;display:flex;justify-content:space-between;align-items:center;padding:0 26px;font-weight:700;font-size:12px}.mobile-nav{display:flex;justify-content:space-around;gap:8px;padding:18px 16px;border-top:1px solid var(--line)}.mobile-nav button{background:transparent;color:var(--muted);font-size:12px}.mobile-nav button[aria-current="page"]{color:var(--accent);font-weight:700}input[type=checkbox],input[type=radio]{accent-color:var(--accent)}@media(max-width:600px){.phone{margin:0;width:100%;min-height:100vh;border-radius:0;box-shadow:none}.mobile-body{padding:0}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition:none!important}}.shell{max-width:1180px;margin:auto;padding:32px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:24px}.wordmark{font-weight:800;letter-spacing:3px}.workspace{font-size:12px;color:var(--muted)}.layout{display:grid;grid-template-columns:240px 1fr;gap:38px;margin-top:40px}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--accent);margin-bottom:12px}h1{font-size:42px;font-weight:600}aside p{color:var(--muted);margin:18px 0 28px}.roles{display:grid;gap:10px}.role{display:flex;justify-content:space-between;text-align:left;border:1px solid var(--line);padding:16px;background:transparent;color:var(--text);border-radius:4px}.role[aria-pressed=true]{background:var(--accent);color:var(--page);border-color:var(--accent)}.role small{color:inherit;opacity:.75}.matrix{border:1px solid var(--line);background:var(--surface)}.matrix-head{display:flex;justify-content:space-between;padding:24px;border-bottom:1px solid var(--line)}.badge{border:1px solid var(--accent);color:var(--accent);padding:3px 10px;font-size:11px;height:26px}table{width:100%;border-collapse:collapse}th,td{text-align:center;padding:19px 12px;border-bottom:1px solid var(--line)}th{font-size:12px;color:var(--muted);font-weight:500}th:first-child,td:first-child{text-align:left;padding-left:24px}td:first-child small{display:block}input[type=checkbox]{width:18px;height:18px}.preview{margin-top:24px;padding:24px;border:1px dashed var(--line);display:grid;grid-template-columns:1fr auto;gap:12px}.preview p{color:var(--muted);font-size:13px;margin-top:8px}.preview-icons{display:flex;gap:8px;align-items:center}.preview-icons span{font-size:12px;border:1px solid var(--line);padding:6px 12px;color:var(--muted)}.preview-icons span.enabled{background:var(--accent);border-color:var(--accent);color:var(--page)}.footer{display:flex;justify-content:space-between;align-items:center;margin-top:28px;gap:20px}.save{background:var(--accent);color:var(--page);font-weight:700;padding:13px 26px;border-radius:4px}.footnote{color:var(--muted);font-size:12px;margin-top:32px}@media(max-width:800px){.shell{padding:24px}.layout{grid-template-columns:1fr;gap:24px}.roles{grid-template-columns:repeat(3,1fr)}aside p{margin:12px 0 20px}.preview{grid-template-columns:1fr}.role{padding:12px}.matrix{overflow:auto}.preview-icons{flex-wrap:wrap}}</style></head><body><div class="shell"><header class="top"><div class="wordmark">SIGNAL / 信标</div><div class="workspace">青石工作室 · 空间设置 / 角色权限</div></header><div class="layout"><aside><p class="eyebrow">ACCESS CONTROL · 03</p><h1>谁能做。<br>谁来看。</h1><p>把信任放在正确的位置。<br>选择一个角色，调整其工作边界。</p><div class="roles"><button class="role" data-role="0" aria-pressed="false">管理员 <small>02 人</small></button><button class="role" data-role="1" aria-pressed="true">编辑者 <small>08 人</small></button><button class="role" data-role="2" aria-pressed="false">观察者 <small>04 人</small></button></div><p class="footnote">空间所有者始终保留<br>恢复权限的能力。</p></aside><main><section class="matrix"><div class="matrix-head"><div><h2>权限矩阵</h2><small>勾选后即时预览，保存后才生效</small></div><span class="badge">草稿可编辑</span></div><table><thead><tr><th>能力范围</th><th>管理员</th><th>编辑者</th><th>观察者</th></tr></thead><tbody id="permissions"></tbody></table></section><section class="preview"><div><h3 id="preview-title">编辑者的工作台</h3><p id="preview-copy">能创作，也能让作品发布。</p></div><div class="preview-icons" id="preview-icons"></div></section><footer class="footer"><p id="status" class="status" role="status" aria-live="polite">尚未保存新的设置</p><button id="save" class="save">保存权限 ↗</button></footer></main></div></div><script>const $=id=>document.getElementById(id);function note(t,error=false){const e=$('status');e.textContent=t;e.dataset.error=String(error);}const names=['管理员','编辑者','观察者'];const actions=['浏览作品','新建与编辑','发布作品','管理成员'];const detail=['作品、评论与历史记录','上传资源和修改内容','将草稿变为公开内容','邀请、移除与设置角色'];let selected=1;const rights=[[true,true,true,true],[true,true,true,false],[true,false,false,false]];function render(){const tbody=$('permissions');tbody.replaceChildren();actions.forEach((a,i)=>{const row=document.createElement('tr');const title=document.createElement('td');const strong=document.createElement('strong');strong.textContent=a;const s=document.createElement('small');s.textContent=detail[i];title.append(strong,s);row.append(title);names.forEach((n,r)=>{const td=document.createElement('td');const c=document.createElement('input');c.type='checkbox';c.checked=rights[r][i];c.setAttribute('aria-label',n+'：'+a);c.addEventListener('change',()=>{rights[r][i]=c.checked;preview();note('有未保存的更改');});td.append(c);row.append(td);});tbody.append(row);});preview();}function preview(){$('preview-title').textContent=names[selected]+'的工作台';$('preview-copy').textContent='当前拥有 '+rights[selected].filter(Boolean).length+' 项能力。保存前，成员的实际权限不会改变。';const e=$('preview-icons');e.replaceChildren();actions.forEach((a,i)=>{const s=document.createElement('span');s.textContent=a;s.className=rights[selected][i]?'enabled':'';e.append(s);});}document.querySelectorAll('[data-role]').forEach(b=>b.addEventListener('click',()=>{selected=Number(b.dataset.role);document.querySelectorAll('[data-role]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));preview();note('正在预览'+names[selected]);}));$('save').onclick=()=>{if(rights.some(r=>!r.some(Boolean))){note('每个角色至少需要一项权限，请检查矩阵。',true);return;}note('权限已保存 · 14 位成员将在下次进入时生效');};render();</script></body></html>
