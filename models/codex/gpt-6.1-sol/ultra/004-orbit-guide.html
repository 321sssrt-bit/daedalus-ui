<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>新手引导 · 轻轨</title><style>:root{--page:#eeedf8;--surface:#ffffff;--text:#302e55;--muted:#87849f;--accent:#7560cd;--line:#dad7ee;--danger:#bd5368;--peach:#ffd9b5;}*{box-sizing:border-box}html{color-scheme:light}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;font-size:15px;line-height:1.6}button,input,select{font:inherit}button,a,input,select{ -webkit-tap-highlight-color:transparent}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}a{color:inherit}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:4px}button:hover:not(:disabled){filter:brightness(.94)}input,select{max-width:100%}input[aria-invalid="true"]{border-color:var(--danger)!important;box-shadow:0 0 0 1px var(--danger)}h1,h2,h3,p{margin:0}h1{line-height:1.13;letter-spacing:-.05em}h2{line-height:1.3}svg{max-width:100%;display:block}small,.small{font-size:12px}.muted{color:var(--muted)}.eyebrow{font-size:11px;letter-spacing:.16em;font-weight:700}.status{min-height:24px;font-size:13px;color:var(--muted)}.status.error{color:var(--danger)}.status.success{color:var(--accent)}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}[hidden]{display:none!important}dialog{border:1px solid var(--line);border-radius:16px;max-width:min(440px,calc(100% - 32px));padding:28px;background:var(--surface);color:var(--text)}dialog::backdrop{background:rgba(0,0,0,.38)}dialog input{width:100%;margin:16px 0;padding:12px;border:1px solid var(--line);background:var(--page);color:var(--text)}dialog .actions{display:flex;gap:12px;justify-content:flex-end}dialog button{padding:9px 16px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--text)}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
body{background:var(--page);color:var(--text)}.shell{max-width:1080px;margin:auto;padding:34px 48px;min-height:100vh;display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:21px;font-weight:700}.text-button{border:0;background:none;color:var(--muted);font-size:13px;padding:8px}.steps{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:54px}.step{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--muted)}.step b{display:grid;place-items:center;width:26px;height:26px;border:1px solid var(--line);border-radius:50%;font-size:11px}.step.active{color:var(--accent)}.step.active b{background:var(--accent);border-color:var(--accent);color:var(--surface)}.connector{height:1px;width:60px;background:var(--line)}.stage{display:grid;grid-template-columns:1.1fr 1fr;gap:58px;align-items:center;padding:54px 24px 34px;flex:1}.scene{height:340px;position:relative;display:grid;place-items:center}.orbit{position:absolute;width:310px;height:310px;border:1px dashed var(--line);border-radius:50%;transform:rotate(-12deg)}.orbit::before{content:'';position:absolute;width:22px;height:22px;border-radius:50%;background:var(--peach);left:12px;top:75px}.paper{width:250px;min-height:235px;background:var(--surface);border-radius:18px;box-shadow:0 22px 50px rgba(48,46,85,.09);padding:24px;transform:rotate(-5deg);position:relative}.paper .tag{display:inline-block;padding:4px 10px;background:var(--page);font-size:11px;border-radius:30px;color:var(--accent)}.paper h3{font-size:20px;margin:17px 0}.checkline{font-size:12px;margin-top:15px;display:flex;gap:10px;align-items:center}.checkline span{width:16px;height:16px;border-radius:5px;background:var(--page);color:var(--accent);display:grid;place-items:center}.floating{position:absolute;right:8px;bottom:40px;padding:14px 18px;border-radius:13px;background:var(--accent);color:var(--surface);font-size:12px;box-shadow:0 12px 28px rgba(48,46,85,.1)}.copy .eyebrow{color:var(--accent)}h1{font-size:44px;margin:18px 0 22px}.copy p{color:var(--muted);max-width:350px;line-height:1.9}.point{margin-top:26px;font-size:13px;color:var(--accent)}.bottom{border-top:1px solid var(--line);padding:24px 0 6px;display:flex;justify-content:space-between;align-items:center}.actions{display:flex;gap:12px}.back,.next{padding:11px 24px;border-radius:10px;font-weight:600}.back{border:1px solid var(--line);background:transparent;color:var(--text)}.next{background:var(--accent);color:var(--surface);border:1px solid var(--accent);min-width:132px}.status{font-size:12px;max-width:420px}@media(max-width:800px){.shell{padding:28px}.stage{gap:28px;padding:30px 0}.scene{height:300px}.orbit{width:270px;height:270px}.paper{width:220px}.floating{right:0}h1{font-size:36px}.connector{width:35px}}@media(max-width:600px){.shell{padding:24px}.steps{margin-top:30px;gap:10px}.step{gap:5px;font-size:11px}.connector{width:12px}.stage{display:flex;flex-direction:column;gap:18px}.scene{width:100%;height:265px}.orbit{width:240px;height:240px}.paper{min-height:200px;padding:20px}.floating{right:6%;bottom:12px}.copy{width:100%}h1{font-size:32px;margin:12px 0}.copy p{font-size:14px}.point{margin-top:14px}.bottom{gap:14px;align-items:flex-start;flex-direction:column}.actions{width:100%}.actions button{flex:1}}
</style></head><body><main class="shell"><header class="top"><div class="brand">◌ 轻轨</div><button id="skip" class="text-button">跳过引导 ↗</button></header><nav class="steps" aria-label="引导步骤"><div class="step active" data-step="0"><b>1</b>收集想法</div><i class="connector"></i><div class="step" data-step="1"><b>2</b>理出头绪</div><i class="connector"></i><div class="step" data-step="2"><b>3</b>一起推进</div></nav><section class="stage"><div class="scene" aria-hidden="true"><div class="orbit"></div><div class="paper"><span class="tag" id="art-tag">灵感收件箱</span><h3 id="art-title">今天突然想到...</h3><div class="checkline"><span>✓</span><div id="art-one">一家开到深夜的书店</div></div><div class="checkline"><span>○</span><div id="art-two">一封写给未来的信</div></div><div class="checkline"><span>○</span><div id="art-three">一个还没说出口的计划</div></div></div><div class="floating" id="float">✦ 好想法，不必马上完整。</div></div><div class="copy"><div class="eyebrow" id="eyebrow">01 / 从一个念头开始</div><h1 id="title">先放下来，<br>再慢慢想。</h1><p id="desc">一句话、一张清单，甚至一个还没成形的念头。在轻轨里，随手收下它们，灵感就不会消失在忙碌之间。</p><div class="point" id="point">✓ 一个入口，收下所有零散想法</div></div></section><footer class="bottom"><div id="status" class="status" role="status" aria-live="polite">只需三步，找到自己的节奏。</div><div class="actions"><button class="back" id="back" disabled>上一步</button><button class="next" id="next">下一步 →</button></div></footer></main><script>const $=(s)=>document.querySelector(s);function feedback(text,error=false){const n=$('#status');n.textContent=text;n.className='status '+(error?'error':'success')}function invalid(el,on=true){el.setAttribute('aria-invalid',String(on));if(on)el.focus()}let step=0;const data=[['01 / 从一个念头开始','先放下来，<br>再慢慢想。','一句话、一张清单，甚至一个还没成形的念头。在轻轨里，随手收下它们，灵感就不会消失在忙碌之间。','✓ 一个入口，收下所有零散想法','灵感收件箱','今天突然想到...','一家开到深夜的书店','一封写给未来的信','一个还没说出口的计划','✦ 好想法，不必马上完整。'],['02 / 找到它的位置','让杂乱，<br>变得有序。','给想法一个项目，把大事情拆成小步骤。不必一次规划全部，下一件要做的事清楚就够了。','✓ 标签与清单，让进度看得见','项目清单','夜读书店计划','找到合适的街角','整理想读的书','邀请第一个伙伴','✦ 每一小步，都算数。'],['03 / 不必独自完成','和对的人，<br>走得更远。','把项目分享给伙伴，留下一句评论。所有讨论都在事情旁边，大家知道现在走到了哪里。','✓ 共享项目，想法变成共同的行动','和伙伴一起','这个计划有我们','林沐完成了选址','许禾整理了书单','下一步：第一次试营业','✦ 很高兴，我们一起。']];function render(){const d=data[step];$('#eyebrow').textContent=d[0];$('#title').innerHTML=d[1];for(const [i,s] of [[2,'desc'],[3,'point'],[4,'art-tag'],[5,'art-title'],[6,'art-one'],[7,'art-two'],[8,'art-three'],[9,'float']])$('#'+s).textContent=d[i];document.querySelectorAll('.step').forEach((n,i)=>{n.classList.toggle('active',i===step);n.setAttribute('aria-current',i===step?'step':'false')});$('#back').disabled=step===0;$('#next').textContent=step===2?'开始使用 ↗':'下一步 →';feedback('第 '+(step+1)+' 步，共 3 步。')}$('#next').onclick=()=>{if(step<2){step++;render()}else{feedback('工作空间已就绪。欢迎开始你的第一个计划。');$('#next').disabled=true;$('#back').disabled=true}};$('#back').onclick=()=>{if(step>0){step--;render()}};$('#skip').onclick=()=>{feedback('已跳过引导，工作空间已就绪。');$('#next').textContent='已进入工作空间 ✓';$('#next').disabled=true;$('#back').disabled=true};</script></body></html>
