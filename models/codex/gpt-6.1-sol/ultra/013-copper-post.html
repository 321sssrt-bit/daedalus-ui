<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>收件箱 · 纸邮</title><style>:root{--page:#eee5d9;--surface:#faf5ed;--text:#5b4435;--muted:#a08a78;--accent:#ad684a;--line:#d9c7b4;--danger:#b1483c;--mail:#f3ece2;}*{box-sizing:border-box}html{color-scheme:light}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;font-size:15px;line-height:1.6}button,input,select{font:inherit}button,a,input,select{ -webkit-tap-highlight-color:transparent}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}a{color:inherit}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:4px}button:hover:not(:disabled){filter:brightness(.94)}input,select{max-width:100%}input[aria-invalid="true"]{border-color:var(--danger)!important;box-shadow:0 0 0 1px var(--danger)}h1,h2,h3,p{margin:0}h1{line-height:1.13;letter-spacing:-.05em}h2{line-height:1.3}svg{max-width:100%;display:block}small,.small{font-size:12px}.muted{color:var(--muted)}.eyebrow{font-size:11px;letter-spacing:.16em;font-weight:700}.status{min-height:24px;font-size:13px;color:var(--muted)}.status.error{color:var(--danger)}.status.success{color:var(--accent)}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}[hidden]{display:none!important}dialog{border:1px solid var(--line);border-radius:16px;max-width:min(440px,calc(100% - 32px));padding:28px;background:var(--surface);color:var(--text)}dialog::backdrop{background:rgba(0,0,0,.38)}dialog input{width:100%;margin:16px 0;padding:12px;border:1px solid var(--line);background:var(--page);color:var(--text)}dialog .actions{display:flex;gap:12px;justify-content:flex-end}dialog button{padding:9px 16px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--text)}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
body{background:var(--page);color:var(--text)}.app{min-height:100vh;display:grid;grid-template-columns:170px 310px 1fr}.sidebar{padding:30px 22px;background:var(--page);border-right:1px solid var(--line);display:flex;flex-direction:column}.brand{font-size:25px;font-family:Georgia,serif;font-weight:700}.sidebar small{font-size:10px;color:var(--muted);display:block;margin-top:5px}.compose{margin:29px 0 24px;background:var(--accent);color:var(--surface);border:0;padding:10px 14px;border-radius:3px;font-size:12px}.folders{display:grid;gap:7px}.folders button{border:0;background:none;color:var(--muted);text-align:left;display:flex;justify-content:space-between;font-size:12px;padding:8px 6px}.folders button.active{color:var(--text);font-weight:600}.account{margin-top:auto;font-size:11px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}.listpane{background:var(--mail);border-right:1px solid var(--line);min-width:0}.list-head{padding:30px 24px 20px;border-bottom:1px solid var(--line)}.list-head h1{font-size:26px}.filter-row{display:flex;gap:16px;margin-top:17px;font-size:11px}.filter-row button{border:0;background:none;padding:0;color:var(--muted)}.filter-row button.active{color:var(--accent);font-weight:700}.messages{padding:0}.message{width:100%;border:0;border-bottom:1px solid var(--line);background:none;color:var(--text);padding:22px 24px;text-align:left;position:relative}.message.selected{background:var(--surface)}.message.selected::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}.message .sender{display:flex;justify-content:space-between;gap:8px;font-size:11px}.message .sender time{font-size:10px;color:var(--muted)}.message h2{font-size:13px;font-weight:500;margin:9px 0 6px;line-height:1.5}.message.unread h2{font-weight:700}.message.unread .sender span::after{content:'';display:inline-block;background:var(--accent);width:5px;height:5px;border-radius:50%;margin-left:6px}.message p{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.reader{background:var(--surface);padding:30px 40px;min-width:0}.read-top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:20px;font-size:11px;color:var(--muted)}.read-actions{display:flex;gap:14px}.read-actions button{padding:4px 0;background:none;border:0;color:var(--muted);font-size:12px}.read-actions button.starred{color:var(--accent)}.read-header{padding-top:32px}.read-header h2{font-size:29px;line-height:1.4;letter-spacing:-.03em;max-width:480px}.person{display:flex;gap:12px;align-items:center;margin-top:24px}.avatar{width:35px;height:35px;border-radius:50%;background:var(--page);display:grid;place-items:center;font-size:13px}.person strong{font-size:12px;font-weight:600}.person small{display:block;font-size:10px;color:var(--muted)}.letter{max-width:610px;font-size:14px;line-height:2.05;padding-top:32px}.letter p{margin-bottom:18px}.attachment{margin-top:28px;display:flex;gap:12px;align-items:center;border:1px solid var(--line);padding:14px 17px;max-width:330px;border-radius:4px;font-size:12px}.attachment span{font-size:23px;color:var(--accent)}.attachment small{display:block;font-size:10px;color:var(--muted)}.reply{margin-top:28px;background:none;border:1px solid var(--line);padding:10px 20px;color:var(--text);font-size:12px;border-radius:4px}.status{margin-top:18px}.empty{font-size:13px;color:var(--muted);padding:25px}@media(max-width:1050px){.app{grid-template-columns:140px 260px 1fr}.sidebar{padding:26px 16px}.reader{padding:26px}.list-head{padding:26px 20px 18px}.message{padding:20px}.read-header h2{font-size:25px}.letter{font-size:13px}}@media(max-width:800px){.app{grid-template-columns:230px 1fr}.sidebar{grid-column:1/-1;padding:17px 24px;display:flex;flex-direction:row;align-items:center;gap:24px;border-right:0;border-bottom:1px solid var(--line)}.sidebar>small,.compose,.account{display:none}.folders{display:flex;gap:14px}.folders button{gap:8px}.reader{padding:25px}.list-head{padding-top:24px}.brand{font-size:23px}}@media(max-width:600px){.app{display:block}.sidebar{padding:18px 24px;gap:20px}.folders{gap:10px}.folders button{font-size:10px;padding:4px 0}.listpane{border-right:0}.list-head{padding:20px 24px 15px}.list-head h1{font-size:23px}.filter-row{margin-top:10px}.messages{display:grid;grid-template-columns:1fr 1fr}.message{padding:14px 16px;border-right:1px solid var(--line)}.message p{display:none}.message h2{font-size:11px}.message .sender{font-size:10px}.message .sender time{display:none}.reader{padding:24px;border-top:1px solid var(--line)}.read-header{padding-top:22px}.read-header h2{font-size:25px}.letter{padding-top:24px;font-size:13px}}
</style></head><body><main class="app"><aside class="sidebar"><div class="brand">纸邮</div><small>PAPER POST</small><button class="compose" id="compose">＋ 写一封信</button><nav class="folders" aria-label="邮件文件夹"><button class="active" data-folder="inbox">收件箱 <span id="unread-count">3</span></button><button data-folder="star">星标 <span>☆</span></button><button data-folder="archive">归档 <span>▧</span></button></nav><div class="account">林沐<br>lin@paper.example</div></aside><section class="listpane"><header class="list-head"><h1 id="folder-title">收件箱</h1><div class="filter-row"><button class="active" id="all">全部</button><button id="unread">未读</button></div></header><div class="messages" id="messages"></div></section><article class="reader"><div class="read-top"><span>这封信，写给你。</span><div class="read-actions"><button id="star" aria-label="添加星标">☆ 星标</button><button id="archive">归档 ↗</button></div></div><header class="read-header"><h2 id="subject"></h2><div class="person"><div class="avatar" id="avatar"></div><div><strong id="sender"></strong><small id="address"></small></div></div></header><div class="letter" id="letter"></div><div class="attachment" id="attachment"><span>▧</span><div>秋日书单.pdf<small>284 KB · PDF 文档</small></div></div><button class="reply" id="reply">↩ 回复这封信</button><div id="status" class="status" role="status" aria-live="polite"></div></article></main><dialog id="reply-dialog"><h2 id="reply-title">写一封信</h2><form id="reply-form" novalidate><label for="reply-text" class="sr">信件内容</label><input id="reply-text" placeholder="先写一句想说的话" maxlength="200"><p id="reply-error" class="status error" role="alert"></p><div class="actions"><button id="cancel" type="button">取消</button><button>保存草稿</button></div></form></dialog><script>const $=(s)=>document.querySelector(s);function feedback(text,error=false){const n=$('#status');n.textContent=text;n.className='status '+(error?'error':'success')}function invalid(el,on=true){el.setAttribute('aria-invalid',String(on));if(on)el.focus()}const letters=[{sender:'许禾',address:'he@read.example',subject:'这个秋天，想和你读几本书',time:'09:24',preview:'挑了几本有风、有树、有日常的书。',body:['林沐，早上好。','昨晚整理书架时，发现那些一直舍不得放下的书，都与平常的日子有关。于是挑了一份小小的秋日书单，想寄给你。','有写花园的，有写城市街角的，也有只是讲一个人慢慢过日子的。随信附上，看看有没有你想读的。','等天气再凉一点，我们找个下午，一起去书店。','许禾'],unread:false,star:false,archived:false},{sender:'山野书店',address:'hello@book.example',subject:'你的书已经到店了',time:'昨天',preview:'《花园的时间》已为你留在柜台。',body:['你好，林沐。','你预订的《花园的时间》今天到店了。我们为你保留至 10 月 5 日。','营业时间是 10:00–20:00，来时告诉店员你的名字即可。','期待见到你。'],unread:true,star:false,archived:false},{sender:'陈砚',address:'yan@studio.example',subject:'关于下周的展览，我们聊聊？',time:'昨天',preview:'我整理了几个空间细节，想听听你的看法。',body:['林沐，','我看了第二轮导视稿，入口处的路径已经很清楚。还有几处照明与纸张需要确认。','下周二下午有空吗？我们在画廊碰个面。','陈砚'],unread:true,star:true,archived:false},{sender:'纸邮编辑部',address:'editor@paper.example',subject:'本周来信：把日子写慢一点',time:'周一',preview:'给文字一点空白，也给自己一点时间。',body:['亲爱的朋友，','这一周，试着给日子留一些没被填满的地方。可以是一张明信片，也可以只是窗边的一刻。','谢谢你一直认真读信。'],unread:true,star:false,archived:false}];let selected=0,folder='inbox',unread=false;function render(){const visible=letters.map((x,i)=>[x,i]).filter(([x])=>(folder==='archive'?x.archived:folder==='star'?x.star&&!x.archived:!x.archived)&&(!unread||x.unread));const target=$('#messages');target.replaceChildren();visible.forEach(([x,i])=>{const b=document.createElement('button');b.className='message'+(i===selected?' selected':'')+(x.unread?' unread':'');const row=document.createElement('div'),s=document.createElement('span'),time=document.createElement('time'),h=document.createElement('h2'),p=document.createElement('p');row.className='sender';s.textContent=x.sender;time.textContent=x.time;h.textContent=x.subject;p.textContent=x.preview;row.append(s,time);b.append(row,h,p);b.onclick=()=>{selected=i;x.unread=false;render();read();feedback('已打开来信，并标为已读。')};target.append(b)});if(!visible.length){const p=document.createElement('p');p.className='empty';p.textContent=unread?'这里没有未读来信。':folder==='archive'?'还没有归档来信。':'这里暂时没有来信。';target.append(p)}$('#unread-count').textContent=letters.filter(x=>x.unread&&!x.archived).length;$('#folder-title').textContent={inbox:'收件箱',star:'星标来信',archive:'已归档'}[folder]}function read(){const x=letters[selected];$('#subject').textContent=x.subject;$('#sender').textContent=x.sender;$('#avatar').textContent=x.sender[0];$('#address').textContent=x.address+' · '+x.time;$('#letter').replaceChildren();x.body.forEach(t=>{const p=document.createElement('p');p.textContent=t;$('#letter').append(p)});$('#star').textContent=x.star?'★ 已星标':'☆ 星标';$('#star').classList.toggle('starred',x.star);$('#star').setAttribute('aria-pressed',String(x.star));$('#archive').textContent=x.archived?'移回收件箱 ↙':'归档 ↗';$('#attachment').hidden=selected!==0}render();read();$('#star').onclick=()=>{letters[selected].star=!letters[selected].star;render();read();feedback(letters[selected].star?'这封信已加星标。':'星标已取消。')};$('#archive').onclick=()=>{letters[selected].archived=!letters[selected].archived;render();read();feedback(letters[selected].archived?'已归档。可在左侧归档中找到并恢复。':'已移回收件箱。')};function filter(v){unread=v;$('#all').classList.toggle('active',!v);$('#unread').classList.toggle('active',v);render();feedback(v?'正在筛选未读来信。':'已显示全部来信。')}$('#all').onclick=()=>filter(false);$('#unread').onclick=()=>filter(true);document.querySelectorAll('[data-folder]').forEach(b=>b.onclick=()=>{folder=b.dataset.folder;document.querySelectorAll('[data-folder]').forEach(x=>x.classList.toggle('active',x===b));render();feedback('已打开'+$('#folder-title').textContent+'。')});function openReply(reply){$('#reply-title').textContent=reply?'回复：'+letters[selected].sender:'写一封信';$('#reply-dialog').showModal();$('#reply-text').focus()}$('#reply').onclick=()=>openReply(true);$('#compose').onclick=()=>openReply(false);$('#cancel').onclick=()=>$('#reply-dialog').close();$('#reply-form').onsubmit=e=>{e.preventDefault();if(!$('#reply-text').value.trim()){$('#reply-error').textContent='先写一句话，再保存草稿。';invalid($('#reply-text'));return}$('#reply-dialog').close();feedback('草稿已保存在当前会话，你可以稍后继续。')};</script></body></html>
