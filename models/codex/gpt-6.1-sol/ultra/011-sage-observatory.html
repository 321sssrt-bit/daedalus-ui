<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数据看板 · 青数</title><style>:root{--page:#e4e9df;--surface:#f4f6ef;--text:#2b4538;--muted:#819080;--accent:#547b52;--line:#ccd5c6;--danger:#a95043;--chart:#b7cc9d;}*{box-sizing:border-box}html{color-scheme:light}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;font-size:15px;line-height:1.6}button,input,select{font:inherit}button,a,input,select{ -webkit-tap-highlight-color:transparent}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}a{color:inherit}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:4px}button:hover:not(:disabled){filter:brightness(.94)}input,select{max-width:100%}input[aria-invalid="true"]{border-color:var(--danger)!important;box-shadow:0 0 0 1px var(--danger)}h1,h2,h3,p{margin:0}h1{line-height:1.13;letter-spacing:-.05em}h2{line-height:1.3}svg{max-width:100%;display:block}small,.small{font-size:12px}.muted{color:var(--muted)}.eyebrow{font-size:11px;letter-spacing:.16em;font-weight:700}.status{min-height:24px;font-size:13px;color:var(--muted)}.status.error{color:var(--danger)}.status.success{color:var(--accent)}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}[hidden]{display:none!important}dialog{border:1px solid var(--line);border-radius:16px;max-width:min(440px,calc(100% - 32px));padding:28px;background:var(--surface);color:var(--text)}dialog::backdrop{background:rgba(0,0,0,.38)}dialog input{width:100%;margin:16px 0;padding:12px;border:1px solid var(--line);background:var(--page);color:var(--text)}dialog .actions{display:flex;gap:12px;justify-content:flex-end}dialog button{padding:9px 16px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--text)}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
body{background:var(--page);color:var(--text)}.shell{max-width:1220px;margin:auto;padding:34px 44px;min-height:100vh}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:22px}.brand{font-size:20px;font-weight:700;letter-spacing:.02em}.nav{display:flex;gap:28px;font-size:12px;color:var(--muted)}.nav button{border:0;background:none;color:inherit;padding:4px}.nav button.active{color:var(--text)}.heading{display:flex;justify-content:space-between;align-items:center;margin:31px 0 25px}.heading h1{font-size:32px}.heading p{font-size:12px;color:var(--muted);margin-top:7px}.range{display:flex;gap:4px;border:1px solid var(--line);padding:4px;border-radius:30px}.range button{border:0;background:transparent;color:var(--muted);font-size:11px;padding:7px 16px;border-radius:30px}.range button.active{background:var(--text);color:var(--surface)}.main{display:grid;grid-template-columns:240px 1fr;gap:40px}.summary{border-right:1px solid var(--line);padding-right:30px}.primary-stat{padding:18px 0 29px;border-bottom:1px solid var(--line)}.label{font-size:12px;color:var(--muted)}.primary-stat strong{font-size:58px;line-height:1.2;display:block;margin:13px 0 5px;font-weight:500;letter-spacing:-.08em}.growth{font-size:11px;color:var(--accent)}.secondary-stat{padding:24px 0;border-bottom:1px solid var(--line)}.secondary-stat strong{display:block;font-size:29px;font-weight:500;margin:8px 0}.chartbox{min-width:0;background:var(--surface);border-radius:0;padding:26px 30px}.chart-head{display:flex;justify-content:space-between;align-items:start}.chart-head h2{font-size:16px}.chart-head p{font-size:11px;color:var(--muted);margin-top:5px}.legend{font-size:10px;color:var(--muted)}.legend::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:6px}.chart{width:100%;height:285px;margin-top:22px}.chart text{font-family:inherit;font-size:11px;fill:var(--muted)}.detail{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:23px;border-top:1px solid var(--line);padding-top:21px}.detail small{display:block;font-size:10px;color:var(--muted)}.detail strong{font-size:16px;font-weight:500}.note{font-size:11px;color:var(--muted);margin-top:24px}.status{margin-top:15px}@media(max-width:850px){.shell{padding:28px}.main{grid-template-columns:180px 1fr;gap:24px}.summary{padding-right:22px}.primary-stat strong{font-size:46px}.chartbox{padding:22px}.chart{height:255px}.nav{gap:16px}}@media(max-width:600px){.shell{padding:24px}.nav{gap:10px;font-size:10px}.heading{align-items:flex-start;gap:18px}.heading h1{font-size:26px}.range button{padding:6px 11px}.main{display:block}.summary{border-right:0;padding-right:0;display:grid;grid-template-columns:1.35fr 1fr 1fr;gap:12px}.primary-stat,.secondary-stat{padding:0 0 20px;border-bottom:0}.primary-stat strong{font-size:37px;margin:7px 0}.secondary-stat strong{font-size:22px;margin-top:12px}.label{font-size:10px}.growth{font-size:9px}.chartbox{padding:20px 14px}.chart{height:225px}.legend{font-size:9px}.detail{gap:12px}.detail strong{font-size:14px}.note{font-size:10px}}
</style></head><body><main class="shell"><header class="top"><div class="brand">青数 <small>FIELD NOTES</small></div><nav class="nav" aria-label="数据导航"><button class="active" data-nav="访客">访客</button><button data-nav="内容">内容</button><button data-nav="渠道">渠道</button></nav></header><section class="heading"><div><div class="eyebrow muted">把变化，慢慢看清楚</div><h1>访客生长记录</h1><p id="period">2026 年 9 月 24 日 — 9 月 30 日</p></div><div class="range" aria-label="时间粒度"><button class="active" id="week" aria-pressed="true">周</button><button id="month" aria-pressed="false">月</button></div></section><div class="main"><aside class="summary"><div class="primary-stat"><div class="label">独立访客</div><strong id="visitors">8,426</strong><span class="growth" id="growth">↗ 18.6% 较上周</span></div><div class="secondary-stat"><div class="label">平均停留</div><strong id="duration">3m 24s</strong><span class="growth">愿意多看一会儿</span></div><div class="secondary-stat"><div class="label">回访比例</div><strong id="return">32.8%</strong><span class="growth">有些人，已经熟悉这里</span></div></aside><section class="chartbox"><div class="chart-head"><div><h2>每日来访，正在变多。</h2><p>独立访客 / 人</p></div><span class="legend">本期访客</span></div><svg class="chart" viewBox="0 0 680 290" role="img" aria-label="本周访客从860增长到1540人的面积趋势图"><g stroke="#ccd5c6" stroke-width="1"><path d="M45 25H657M45 85H657M45 145H657M45 205H657"/></g><g><text x="0" y="30">1,600</text><text x="0" y="90">1,200</text><text x="0" y="150">800</text><text x="0" y="210">400</text></g><path id="area" d="M50 140L150 118L250 137L350 87L450 104L550 60L650 34V236H50Z" fill="#b7cc9d" opacity=".45"/><path id="line" d="M50 140L150 118L250 137L350 87L450 104L550 60L650 34" fill="none" stroke="#547b52" stroke-width="3" stroke-linejoin="round"/><circle id="dot" cx="650" cy="34" r="5" fill="#547b52" stroke="#f4f6ef" stroke-width="3"/><g id="labels"><text x="50" y="270" text-anchor="middle">09.24</text><text x="150" y="270" text-anchor="middle">09.25</text><text x="250" y="270" text-anchor="middle">09.26</text><text x="350" y="270" text-anchor="middle">09.27</text><text x="450" y="270" text-anchor="middle">09.28</text><text x="550" y="270" text-anchor="middle">09.29</text><text x="650" y="270" text-anchor="middle">09.30</text></g></svg><div class="detail"><div><small>最受欢迎的内容</small><strong>一间书店的四季</strong></div><div><small>主要来访渠道</small><strong>直接访问 · 46%</strong></div><div><small>数据更新时间</small><strong>今天 09:41</strong></div></div></section></div><p class="note">统计口径：每位访客每天计为一人；所有数字为本地示例数据。</p><div id="status" class="status" role="status" aria-live="polite"></div></main><script>const $=(s)=>document.querySelector(s);function feedback(text,error=false){const n=$('#status');n.textContent=text;n.className='status '+(error?'error':'success')}function invalid(el,on=true){el.setAttribute('aria-invalid',String(on));if(on)el.focus()}function select(month){$('#week').classList.toggle('active',!month);$('#month').classList.toggle('active',month);$('#week').setAttribute('aria-pressed',String(!month));$('#month').setAttribute('aria-pressed',String(month));$('#period').textContent=month?'2026 年 9 月 1 日 — 9 月 30 日':'2026 年 9 月 24 日 — 9 月 30 日';$('#visitors').textContent=month?'31,608':'8,426';$('#growth').textContent=month?'↗ 12.4% 较上月':'↗ 18.6% 较上周';$('#duration').textContent=month?'3m 08s':'3m 24s';$('#return').textContent=month?'29.6%':'32.8%';const y=month?[184,147,166,109,87,68,43]:[140,118,137,87,104,60,34],d=y.map((v,i)=>(i?'L':'M')+(50+i*100)+' '+v).join('');$('#line').setAttribute('d',d);$('#area').setAttribute('d',d+'V236H50Z');$('#dot').setAttribute('cy',y[6]);[...$('#labels').children].forEach((n,i)=>n.textContent=month?['09.01','09.05','09.10','09.15','09.20','09.25','09.30'][i]:['09.24','09.25','09.26','09.27','09.28','09.29','09.30'][i]);$('.chart').setAttribute('aria-label',month?'九月份访客呈增长的面积趋势图':'本周访客从860增长到1540人的面积趋势图');feedback('已切换至'+(month?'月':'周')+'粒度，指标与主图同步更新。')}$('#week').onclick=()=>select(false);$('#month').onclick=()=>select(true);document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-nav]').forEach(x=>x.classList.toggle('active',x===b));feedback(b.dataset.nav==='访客'?'正在查看访客统计。':b.dataset.nav==='内容'?'内容概览：一间书店的四季，累计阅读 6,208 次。':'渠道概览：直接访问46%，站内推荐31%，搜索23%。')});</script></body></html>
