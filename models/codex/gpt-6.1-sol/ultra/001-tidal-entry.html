<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · 泊岸</title><style>:root{--page:#082b35;--surface:#f5f3e9;--text:#123740;--muted:#647b7b;--accent:#b9e773;--line:#cad5ca;--danger:#b84035;--sea:#104350;}*{box-sizing:border-box}html{color-scheme:light}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;font-size:15px;line-height:1.6}button,input,select{font:inherit}button,a,input,select{ -webkit-tap-highlight-color:transparent}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}a{color:inherit}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:4px}button:hover:not(:disabled){filter:brightness(.94)}input,select{max-width:100%}input[aria-invalid="true"]{border-color:var(--danger)!important;box-shadow:0 0 0 1px var(--danger)}h1,h2,h3,p{margin:0}h1{line-height:1.13;letter-spacing:-.05em}h2{line-height:1.3}svg{max-width:100%;display:block}small,.small{font-size:12px}.muted{color:var(--muted)}.eyebrow{font-size:11px;letter-spacing:.16em;font-weight:700}.status{min-height:24px;font-size:13px;color:var(--muted)}.status.error{color:var(--danger)}.status.success{color:var(--accent)}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}[hidden]{display:none!important}dialog{border:1px solid var(--line);border-radius:16px;max-width:min(440px,calc(100% - 32px));padding:28px;background:var(--surface);color:var(--text)}dialog::backdrop{background:rgba(0,0,0,.38)}dialog input{width:100%;margin:16px 0;padding:12px;border:1px solid var(--line);background:var(--page);color:var(--text)}dialog .actions{display:flex;gap:12px;justify-content:flex-end}dialog button{padding:9px 16px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--text)}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
body{background:var(--page);color:var(--text)}.shell{min-height:100vh;display:grid;grid-template-columns:56% 44%}.story{color:var(--surface);padding:44px 64px;display:flex;flex-direction:column;position:relative;overflow:hidden}.brand{font-weight:750;font-size:20px;letter-spacing:.04em}.brand span{font-weight:400;font-size:12px;margin-left:14px;opacity:.6}.story h1{font-size:clamp(46px,5.2vw,68px);margin-top:96px;max-width:450px}.story p{color:#cad5ca;max-width:340px;margin-top:24px}.beacon{margin-top:36px;width:100%;height:225px}.story footer{margin-top:auto;padding-top:28px;font-size:12px;display:flex;justify-content:space-between;opacity:.6}.entry{background:var(--surface);display:flex;align-items:center;justify-content:center;padding:48px}.form{width:100%;max-width:340px}.form .eyebrow{color:var(--muted)}.form h2{font-size:32px;margin:12px 0 12px}.form>p{color:var(--muted);margin-bottom:32px}label{display:block;font-size:13px;font-weight:600;margin:20px 0 7px}.input{display:flex;align-items:center;border:1px solid var(--line);background:#fff;border-radius:7px}.input input{min-width:0;width:100%;border:0;padding:12px 14px;background:transparent;color:var(--text);border-radius:7px}.input button{border:0;background:none;padding:9px;color:var(--muted);font-size:12px;flex-shrink:0;white-space:nowrap}.row{display:flex;justify-content:space-between;align-items:center;margin:16px 0 26px;font-size:12px}.row label{display:flex;align-items:center;gap:7px;margin:0;font-weight:400}.primary{background:var(--text);color:var(--surface);border:0;border-radius:7px;padding:13px 20px;width:100%;font-weight:600}.foot{font-size:12px;text-align:center;margin-top:36px;color:var(--muted)}.status{margin-top:12px}@media(max-width:900px){.story{padding:36px}.entry{padding:36px}.story h1{font-size:48px}.story .beacon{height:200px}}@media(max-width:620px){.shell{display:block}.story{min-height:265px;padding:26px}.story h1{font-size:38px;margin-top:38px}.story p,.story footer,.beacon{display:none}.entry{padding:32px 26px 48px}.form{max-width:400px}.form h2{font-size:28px}}
</style></head><body><main class="shell"><section class="story"><div class="brand">泊岸 <span>MOOR / 工作空间</span></div><h1>忙碌之外，<br>有你的泊岸。</h1><p>把散落的想法、计划和伙伴，<br>安放在同一个地方。</p><svg class="beacon" viewBox="0 0 510 220" aria-hidden="true"><g fill="none" stroke="#cad5ca" opacity=".3"><ellipse cx="254" cy="184" rx="222" ry="25"/><ellipse cx="254" cy="184" rx="157" ry="17"/><path d="M0 118 Q128 90 254 118T510 118M0 143 Q128 116 254 143T510 143"/></g><path d="M225 184h58l-10-103h-37z" fill="#f5f3e9"/><path d="M229 84h49V57h-49z" fill="#b9e773"/><path d="m224 58 31-21 30 21z" fill="#f5f3e9"/><path d="M234 105h39M232 128h43M230 151h47" stroke="#104350" stroke-width="8"/><path d="m281 61 161-34v91z" fill="#b9e773" opacity=".08"/></svg><footer><span>每一个好想法，都值得被安放。</span><span>© 泊岸 2026</span></footer></section><section class="entry"><form class="form" id="login" novalidate><div class="eyebrow">回来就好 / WELCOME BACK</div><h2>登录你的工作空间</h2><p>今天也从一件小事开始。</p><label for="account">电子邮箱</label><div class="input"><input id="account" type="email" autocomplete="username" placeholder="你的邮箱地址"></div><label for="password">密码</label><div class="input"><input id="password" type="password" autocomplete="current-password" placeholder="至少 8 位字符"><button type="button" id="show" aria-label="显示密码">显示</button></div><div class="row"><label><input type="checkbox" checked>记住我</label><a href="#" id="forgot">忘记密码？</a></div><button class="primary">进入工作空间 <span aria-hidden="true">↗</span></button><p id="status" class="status" role="status" aria-live="polite"></p><div class="foot">还没有自己的泊岸？ <a href="#" id="signup">申请一个空间</a></div></form></section></main><script>const $=(s)=>document.querySelector(s);function feedback(text,error=false){const n=$('#status');n.textContent=text;n.className='status '+(error?'error':'success')}function invalid(el,on=true){el.setAttribute('aria-invalid',String(on));if(on)el.focus()}$('#show').onclick=()=>{const p=$('#password');p.type=p.type==='password'?'text':'password';$('#show').textContent=p.type==='password'?'显示':'隐藏'};$('#login').onsubmit=e=>{e.preventDefault();const a=$('#account'),p=$('#password');invalid(a,false);invalid(p,false);if(!a.validity.valid||!a.value){invalid(a);return feedback('请输入有效的电子邮箱。',true)}if(p.value.length<8){invalid(p);return feedback('密码至少需要 8 位字符。',true)}feedback('已登录，欢迎回来。你的工作空间已就绪。')};$('#forgot').onclick=e=>{e.preventDefault();feedback('请联系 help@moor.example 获取重置链接。')};$('#signup').onclick=e=>{e.preventDefault();feedback('新空间申请已开放：请联系 hello@moor.example。')};</script></body></html>
