<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>编辑发布 · lilac-draft</title><style>:root{--page:#eeeaf6;--surface:#faf8ff;--text:#4a3f5f;--muted:#a093b2;--accent:#8e65be;--line:#ded5ec;--danger:#b1426a;--outer:#dbd2e8;--font:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:var(--font);font-size:15px;line-height:1.6;color:var(--text);background:var(--page)}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.42}button:hover:not(:disabled){filter:brightness(.94)}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:3px}button,input,select,textarea{transition:background .16s ease,border-color .16s ease}a{color:inherit}h1,h2,h3,p{margin:0}h1{line-height:1.2}h2{font-size:22px;line-height:1.3}h3{font-size:17px}small,.meta{font-size:12px;color:var(--muted)}button{border:0}svg{display:block;max-width:100%}.status{min-height:24px;font-size:13px;color:var(--accent)}.status[data-error="true"]{color:var(--danger)}[hidden]{display:none!important}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}dialog{max-width:calc(100vw - 32px);border:1px solid var(--line);border-radius:16px;padding:28px;color:var(--text);background:var(--surface)}dialog::backdrop{background:#00000088}dialog button{margin-top:16px}.phone{width:390px;min-height:844px;margin:30px auto;border-radius:30px;overflow:hidden;position:relative;background:var(--surface);box-shadow:0 24px 80px #00000022}.mobile-body{background:var(--outer);padding:1px}.mobile-top{height:46px;display:flex;justify-content:space-between;align-items:center;padding:0 26px;font-weight:700;font-size:12px}.mobile-nav{display:flex;justify-content:space-around;gap:8px;padding:18px 16px;border-top:1px solid var(--line)}.mobile-nav button{background:transparent;color:var(--muted);font-size:12px}.mobile-nav button[aria-current="page"]{color:var(--accent);font-weight:700}input[type=checkbox],input[type=radio]{accent-color:var(--accent)}@media(max-width:600px){.phone{margin:0;width:100%;min-height:100vh;border-radius:0;box-shadow:none}.mobile-body{padding:0}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition:none!important}}.compose-top{padding:14px 24px 22px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:14px;font-weight:700;letter-spacing:1px}.compose-top button{background:none;color:var(--muted);font-size:12px;padding:0}.notebook{padding:28px 26px 0;position:relative}.kicker{font-size:10px;letter-spacing:2px;color:var(--accent);display:flex;justify-content:space-between;align-items:center}.sticker{background:var(--accent);color:var(--surface);padding:5px 10px;transform:rotate(5deg);font-size:10px;border-radius:3px}.title-input{width:100%;border:0;background:transparent;color:var(--text);font-size:30px;font-weight:700;line-height:1.4;padding:25px 0 18px;border-bottom:1px solid var(--line);outline-offset:6px}.title-input::placeholder{color:var(--line)}.byline{font-size:10px;color:var(--muted);margin:15px 0 10px;display:flex;align-items:center;gap:8px}.dot{width:7px;height:7px;background:var(--accent);border-radius:50%}textarea{width:100%;height:360px;resize:vertical;border:0;color:var(--text);background:repeating-linear-gradient(transparent 0 33px,var(--line) 34px 35px);font-size:16px;line-height:35px;padding:0;outline-offset:6px;min-height:280px}textarea::placeholder{color:var(--muted)}.counts{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:14px}.toolbar{display:flex;justify-content:space-between;margin:22px 26px;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.toolbar button{background:none;color:var(--muted);padding:0 8px;font-size:12px}.publish-area{padding:0 26px 22px}.publish{width:100%;background:var(--accent);color:var(--surface);font-weight:700;border-radius:8px;padding:14px}.status{font-size:11px;min-height:42px;margin-top:12px}.published{padding:50px 26px}.published h1{font-size:30px;margin:20px 0}.published p{color:var(--muted);font-size:13px;margin-bottom:24px}.published blockquote{margin:30px 0;border-left:3px solid var(--accent);padding-left:18px;color:var(--text);white-space:pre-wrap}.published .publish{margin-top:22px}#published{min-width:0;overflow-wrap:anywhere}#published-title,#published-body{min-width:0;overflow-wrap:anywhere}</style></head><body class="mobile-body"><div class="phone"><div class="mobile-top"><span>9:41</span><span>●●● ▰</span></div><header class="compose-top"><span class="brand">片刻 / MOMENT</span><button id="draft">存草稿</button></header><main id="editor"><section class="notebook"><div class="kicker"><span>A NOTE TO THE WORLD</span><span class="sticker">手记 026</span></div><label class="sr" for="title">手记标题</label><input class="title-input" id="title" maxlength="40" placeholder="给这一刻一个名字"><div class="byline"><span class="dot"></span>木木 · 仅自己可见的草稿</div><label class="sr" for="body">手记正文</label><textarea id="body" maxlength="800" placeholder="写下你今天想记住的事。
至少 20 字，就能成为一篇手记。"></textarea><div class="counts"><span id="draft-state">尚未保存</span><span id="count">0 / 800 字</span></div></section><div class="toolbar"><button id="insert-date">＋ 日期</button><button id="insert-quote">“ 添加引语</button><button id="clear">清空内容</button></div><section class="publish-area"><button class="publish" id="publish">发布这一刻 ↗</button><p id="status" class="status" role="status" aria-live="polite">发布前请填写标题和至少 20 字正文。</p></section></main><section class="published" id="published" hidden><small>YOUR MOMENT IS LIVE</small><h1>这一刻，已经留下。</h1><h2 id="published-title"></h2><blockquote id="published-body"></blockquote><p>演示发布成功 · 手记编号 MM-026</p><button class="publish" id="back">再写一篇</button></section></div><script>const $=id=>document.getElementById(id);function note(t,error=false){const e=$('status');e.textContent=t;e.dataset.error=String(error);}function count(){$('count').textContent=$('body').value.length+' / 800 字';$('draft-state').textContent='有未保存的改动';}['title','body'].forEach(id=>$(id).addEventListener('input',count));$('draft').onclick=()=>{if($('published').hidden===false){$('published').hidden=true;$('editor').hidden=false;}try{localStorage.setItem('lilac-draft',JSON.stringify({title:$('title').value,body:$('body').value}));$('draft-state').textContent='草稿已保存';note('草稿已保存在这台设备。');}catch(e){note('此环境无法保存草稿，请先保留正文。',true);}};$('publish').onclick=()=>{if(!$('title').value.trim()){note('请给手记填写一个标题。',true);$('title').focus();return;}if($('body').value.trim().length<20){note('正文至少需要 20 字，再多写一点。',true);$('body').focus();return;}$('published-title').textContent=$('title').value.trim();$('published-body').textContent=$('body').value.trim();$('editor').hidden=true;$('published').hidden=false;};function insert(t){if($('body').value.length+t.length>800){note('正文已接近 800 字，无法插入这段内容。',true);return;}$('body').value+=t;count();$('body').focus();}$('insert-date').onclick=()=>insert('\n2026 年 9 月 30 日\n');$('insert-quote').onclick=()=>insert('\n“把日常看得再认真一点。”\n');$('clear').onclick=()=>{if(!$('body').value){note('正文已经是空的。');return;}$('body').value='';count();note('正文已清空，标题保留。');};$('back').onclick=()=>{$('published').hidden=true;$('editor').hidden=false;$('title').value='';$('body').value='';count();note('新的空白，等待下一刻。');};try{const d=JSON.parse(localStorage.getItem('lilac-draft')||'null');if(d){$('title').value=d.title||'';$('body').value=d.body||'';count();$('draft-state').textContent='已恢复草稿';note('已恢复这台设备上的草稿。');}}catch(e){note('草稿无法读取，可继续写新的手记。',true);}</script></body></html>
