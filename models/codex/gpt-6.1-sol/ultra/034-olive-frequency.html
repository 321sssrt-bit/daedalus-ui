<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>正在播放 · olive-frequency</title><style>:root{--page:#e9ecdf;--surface:#f4f2e5;--text:#344139;--muted:#8a9180;--accent:#697850;--line:#d7dbca;--danger:#a85145;--outer:#c8cbbd;--font:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:var(--font);font-size:15px;line-height:1.6;color:var(--text);background:var(--page)}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.42}button:hover:not(:disabled){filter:brightness(.94)}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:3px}button,input,select,textarea{transition:background .16s ease,border-color .16s ease}a{color:inherit}h1,h2,h3,p{margin:0}h1{line-height:1.2}h2{font-size:22px;line-height:1.3}h3{font-size:17px}small,.meta{font-size:12px;color:var(--muted)}button{border:0}svg{display:block;max-width:100%}.status{min-height:24px;font-size:13px;color:var(--accent)}.status[data-error="true"]{color:var(--danger)}[hidden]{display:none!important}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}dialog{max-width:calc(100vw - 32px);border:1px solid var(--line);border-radius:16px;padding:28px;color:var(--text);background:var(--surface)}dialog::backdrop{background:#00000088}dialog button{margin-top:16px}.phone{width:390px;min-height:844px;margin:30px auto;border-radius:30px;overflow:hidden;position:relative;background:var(--surface);box-shadow:0 24px 80px #00000022}.mobile-body{background:var(--outer);padding:1px}.mobile-top{height:46px;display:flex;justify-content:space-between;align-items:center;padding:0 26px;font-weight:700;font-size:12px}.mobile-nav{display:flex;justify-content:space-around;gap:8px;padding:18px 16px;border-top:1px solid var(--line)}.mobile-nav button{background:transparent;color:var(--muted);font-size:12px}.mobile-nav button[aria-current="page"]{color:var(--accent);font-weight:700}input[type=checkbox],input[type=radio]{accent-color:var(--accent)}@media(max-width:600px){.phone{margin:0;width:100%;min-height:100vh;border-radius:0;box-shadow:none}.mobile-body{padding:0}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition:none!important}}.player-header{padding:14px 28px 24px;display:flex;justify-content:space-between;align-items:center}.back{background:none;color:var(--text);font-size:25px;padding:0 8px 0 0}.station{font-size:10px;letter-spacing:3px}.menu{font-size:20px;background:none;color:var(--text)}.cover{margin:0 30px;height:328px;background:var(--page);padding:26px;position:relative;display:grid;place-items:center}.record{width:258px;height:258px;border-radius:50%;background:repeating-radial-gradient(circle at center,var(--text) 0 2px,#27332c 3px 4px);display:grid;place-items:center;box-shadow:8px 10px 14px #34413920;position:relative}.label{width:115px;height:115px;border-radius:50%;background:var(--accent);color:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;border:1px solid #ffffff44}.label span{font-family:Georgia,serif;font-size:24px}.label small{color:var(--surface);font-size:9px;letter-spacing:1px}.hole{width:10px;height:10px;border-radius:50%;background:var(--surface);position:absolute;top:124px;left:124px;border:2px solid var(--text)}.cover-code{position:absolute;left:14px;bottom:12px;font-size:9px;letter-spacing:2px;color:var(--muted)}.cover-top{position:absolute;top:13px;right:14px;font-size:10px;color:var(--muted)}.track-info{padding:28px 30px 0;display:flex;justify-content:space-between;align-items:center}.track-info h1{font-family:Georgia,"Songti SC",serif;font-size:30px;font-weight:500}.track-info p{font-size:12px;color:var(--muted);margin-top:6px}.favorite{background:none;color:var(--accent);font-size:27px;padding:8px}.progress{padding:26px 30px 0}input[type=range]{width:100%;height:4px;accent-color:var(--accent);cursor:pointer}.times{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:8px}.controls{padding:28px 30px 22px;display:flex;align-items:center;justify-content:space-around}.small-control{background:none;color:var(--text);padding:10px;font-size:18px}.play{width:68px;height:68px;border-radius:50%;background:var(--text);color:var(--surface);font-size:25px}.bottom-line{margin:5px 30px 0;padding-top:18px;border-top:1px solid var(--line);display:flex;justify-content:space-between;font-size:10px;color:var(--muted)}.status{padding:16px 30px;font-size:11px}.tracklist{padding:12px 0;display:grid;gap:10px}.tracklist button{padding:10px 14px;text-align:left;background:var(--page);color:var(--text)}</style></head><body class="mobile-body"><div class="phone"><div class="mobile-top"><span>9:41</span><span>●●● ▰</span></div><header class="player-header"><button class="back" id="open-list" aria-label="打开节目列表">‹</button><span class="station">MOSS RADIO / 苔藓电台</span><button class="menu" id="about" aria-label="节目说明">···</button></header><main><section class="cover" aria-label="苔藓电台唱片封面"><span class="cover-top">SIDE A · STEREO</span><div class="record"><div class="label"><small>MOSS FREQUENCY</small><span id="disc-label">07:20</span><small>慢一点 / LISTEN</small></div><span class="hole"></span></div><span class="cover-code">FIELD RECORDING / NO. 026</span></section><div class="track-info"><div><h1 id="track-title">森林还没醒</h1><p id="artist">晨间音景 · 苔藓采集组</p></div><button class="favorite" id="favorite" aria-label="收藏节目" aria-pressed="false">♡</button></div><div class="progress"><label class="sr" for="progress">播放进度</label><input id="progress" type="range" min="0" max="143" value="32"><div class="times"><span id="elapsed">00:32</span><span>02:23</span></div></div><div class="controls"><button class="small-control" id="repeat" aria-label="单曲循环" aria-pressed="false">↻</button><button class="small-control" id="prev" aria-label="上一首">◀|</button><button class="play" id="play" aria-label="播放">▶</button><button class="small-control" id="next" aria-label="下一首">|▶</button><button class="small-control" id="volume" aria-label="静音" aria-pressed="false">◖))</button></div><div class="bottom-line"><span>本地合成音景 · 无需联网</span><span>3 首节目</span></div><p id="status" class="status" role="status" aria-live="polite">让一段安静的声音，陪你慢下来。</p></main></div><dialog id="list-modal"><h2>今天的频率</h2><div class="tracklist"><button data-track="0">01 森林还没醒</button><button data-track="1">02 雨落在石阶上</button><button data-track="2">03 晚风经过麦田</button></div><button class="small-control" id="close-list">关闭</button></dialog><script>const $=id=>document.getElementById(id);function note(t,error=false){const e=$('status');e.textContent=t;e.dataset.error=String(error);}const tracks=[['森林还没醒','晨间音景 · 苔藓采集组',[130.81,196,261.63]],['雨落在石阶上','午后音景 · 苔藓采集组',[146.83,220,293.66]],['晚风经过麦田','黄昏音景 · 苔藓采集组',[110,164.81,220]]];let current=0,playing=false,elapsed=32,repeat=false,muted=false,ctx,gain,tones=[];function sound(){try{if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)();gain=ctx.createGain();gain.gain.value=.035;gain.connect(ctx.destination);}tones.forEach(o=>o.stop());tones=[];tracks[current][2].forEach(f=>{const o=ctx.createOscillator();o.type='sine';o.frequency.value=f;o.connect(gain);o.start();tones.push(o);});gain.gain.value=muted?0:.035;if(playing)ctx.resume();else ctx.suspend();}catch(e){note('此浏览器无法播放合成音景，仍可使用进度与节目切换。',true);}}function time(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}function update(){$('track-title').textContent=tracks[current][0];$('artist').textContent=tracks[current][1];$('disc-label').textContent=['07:20','14:10','18:45'][current];$('elapsed').textContent=time(elapsed);$('progress').value=elapsed;$('play').textContent=playing?'Ⅱ':'▶';$('play').setAttribute('aria-label',playing?'暂停':'播放');}function select(n){current=(n+tracks.length)%tracks.length;elapsed=0;update();if(ctx)sound();note('已切换：'+tracks[current][0]);}$('play').onclick=()=>{playing=!playing;sound();update();note(playing?'正在播放本地合成音景':'已暂停，进度保留');};$('next').onclick=()=>select(current+1);$('prev').onclick=()=>select(current-1);$('progress').oninput=e=>{elapsed=Number(e.target.value);update();};$('favorite').onclick=()=>{const on=$('favorite').getAttribute('aria-pressed')!=='true';$('favorite').setAttribute('aria-pressed',String(on));$('favorite').textContent=on?'♥':'♡';note(on?'已收藏这档节目':'已取消收藏');};$('repeat').onclick=()=>{repeat=!repeat;$('repeat').setAttribute('aria-pressed',String(repeat));note(repeat?'单曲循环已开启':'按顺序播放');};$('volume').onclick=()=>{muted=!muted;$('volume').setAttribute('aria-pressed',String(muted));$('volume').setAttribute('aria-label',muted?'取消静音':'静音');if(gain)gain.gain.value=muted?0:.035;note(muted?'已静音':'声音已恢复');};$('open-list').onclick=()=>$('list-modal').showModal();$('close-list').onclick=()=>$('list-modal').close();document.querySelectorAll('[data-track]').forEach(b=>b.onclick=()=>{select(Number(b.dataset.track));$('list-modal').close();});$('about').onclick=()=>note('苔藓电台：三段在本机生成的和声音景，可暂停、跳转和静音。');setInterval(()=>{if(playing){elapsed++;if(elapsed>=143){if(repeat)elapsed=0;else select(current+1);}update();}},1000);</script></body></html>
