<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>蓝图申请册 · 长表单</title><style>
:root{--blue:#123f6a;--deep:#092944;--paper:#edf5f7;--ink:#14334a;--muted:#627d8c;--cyan:#68c8d4;--red:#d45b51;--white:#fff}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--blue);color:var(--ink);font-family:Arial,"Microsoft YaHei",sans-serif;min-height:100vh;background-image:linear-gradient(rgba(104,200,212,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(104,200,212,.12) 1px,transparent 1px);background-size:24px 24px}.layout{max-width:1180px;margin:auto;padding:30px;display:grid;grid-template-columns:240px 1fr;gap:22px}.nav{position:sticky;top:30px;align-self:start;color:var(--paper);border:1px solid rgba(237,245,247,.35);padding:22px}.nav .doc{font:11px ui-monospace,Consolas,monospace;color:var(--cyan)}.nav h1{font-size:27px;line-height:1.1;margin:14px 0 26px}.nav button{display:block;width:100%;text-align:left;border:0;border-top:1px solid rgba(237,245,247,.2);background:transparent;color:#bdd3dc;padding:14px 0;cursor:pointer}.nav button:hover{color:white}.progress{height:5px;background:#27567d;margin-top:28px}.progress i{display:block;width:33%;height:100%;background:var(--cyan)}.progress-label{font-size:10px;margin-top:8px;color:#bdd3dc}.form{background:var(--paper);box-shadow:12px 12px 0 var(--deep);padding:42px 48px}.sheet-head{border-bottom:3px double var(--ink);padding-bottom:24px;margin-bottom:30px;display:flex;justify-content:space-between}.sheet-head h2{font-size:34px;margin:0}.sheet-head span{font:11px ui-monospace,Consolas,monospace}.section{padding:8px 0 34px;border-bottom:1px solid #afc2ca;margin-bottom:28px}.section h3{font-size:21px;margin:0 0 6px}.section>p{color:var(--muted);font-size:12px;margin:0 0 22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.field.full{grid-column:1/-1}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:8px}.req{color:var(--red)}input,select,textarea{width:100%;border:1px solid #8da9b5;background:var(--white);padding:12px;color:var(--ink);font:14px inherit;border-radius:0}textarea{min-height:110px;resize:vertical}input:focus,select:focus,textarea:focus{outline:3px solid var(--cyan);border-color:var(--deep)}.actions{display:flex;justify-content:space-between;align-items:center}.actions button{padding:14px 21px;font-weight:800;cursor:pointer}.draft{border:1px solid var(--ink);background:transparent;color:var(--ink)}.submit{border:0;background:var(--red);color:white}.message{font-size:12px;color:var(--blue);min-height:18px}.stamp{border:2px solid var(--red);color:var(--red);font-weight:900;padding:10px;transform:rotate(-4deg);display:none}.stamp.show{display:block}@media(max-width:820px){.layout{grid-template-columns:1fr;padding:16px}.nav{position:static}.nav button{display:inline-block;width:auto;margin-right:18px}.form{padding:28px 24px}.grid{grid-template-columns:1fr}.field.full{grid-column:auto}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
</style></head><body><main class="layout"><aside class="nav"><div class="doc">FORM / URB-27B</div><h1>城市微更新<br>申请蓝图</h1><button data-go="basic">01 / 项目基本信息</button><button data-go="site">02 / 场地与方案</button><button data-go="contact">03 / 负责人确认</button><div class="progress"><i id="progress"></i></div><div class="progress-label" id="progressLabel">已填写 0 / 6 个必填项</div></aside><form class="form" id="form"><header class="sheet-head"><div><h2>空间使用申请</h2><span>所有尺寸以公制填写</span></div><div class="stamp" id="stamp">DRAFT<br>SAVED</div></header><section class="section" id="basic"><h3>01　项目基本信息</h3><p>用一句清楚的名字让审核人知道这里将发生什么。</p><div class="grid"><div class="field"><label>项目名称 <span class="req">*</span></label><input name="name" required placeholder="例：桥下雨水花园"></div><div class="field"><label>项目类型 <span class="req">*</span></label><select name="type" required><option value="">请选择</option><option>公共绿地</option><option>社区活动</option><option>临时展览</option></select></div><div class="field full"><label>项目摘要</label><textarea placeholder="说明计划解决的问题与使用方式"></textarea></div></div></section><section class="section" id="site"><h3>02　场地与方案</h3><p>确认范围、周期与施工影响。</p><div class="grid"><div class="field"><label>场地编号 <span class="req">*</span></label><input name="site" required placeholder="如 NS-014"></div><div class="field"><label>计划面积（㎡） <span class="req">*</span></label><input name="area" type="number" required min="1" placeholder="120"></div><div class="field"><label>开始日期</label><input type="date"></div><div class="field"><label>预计周期</label><select><option>1 个月内</option><option>1–3 个月</option><option>3–6 个月</option></select></div></div></section><section class="section" id="contact"><h3>03　负责人确认</h3><p>负责人会接收补件与现场勘查通知。</p><div class="grid"><div class="field"><label>负责人姓名 <span class="req">*</span></label><input name="owner" required></div><div class="field"><label>联系电话 <span class="req">*</span></label><input name="phone" required inputmode="tel"></div><div class="field full"><label><input style="width:auto" type="checkbox" required> 我确认以上信息真实，并同意现场安全要求 <span class="req">*</span></label></div></div></section><div class="actions"><button class="draft" type="button" id="draft">保存草稿</button><span class="message" id="message" aria-live="polite"></span><button class="submit" type="submit">提交审核</button></div></form></main><script>
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>document.getElementById(b.dataset.go).scrollIntoView({behavior:'smooth'}));function count(){const req=[...form.querySelectorAll('[required]')],n=req.filter(x=>x.type==='checkbox'?x.checked:x.value.trim()).length;progress.style.width=`${n/req.length*100}%`;progressLabel.textContent=`已填写 ${n} / ${req.length} 个必填项`}form.addEventListener('input',count);draft.onclick=()=>{stamp.classList.add('show');message.textContent='草稿已保存在此设备 · 14:32'};form.onsubmit=e=>{e.preventDefault();if(form.checkValidity())message.textContent='✓ 申请 URB-260814 已提交审核'};
</script></body></html>
