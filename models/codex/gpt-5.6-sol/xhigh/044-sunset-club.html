<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>落日广场</title><style>
:root{--sunset:#ff795f;--peach:#ffd1b8;--cream:#fff7e9;--ink:#4a2730;--muted:#9a6b6a;--purple:#77558e;--ok:#38856c;--danger:#bd3f54}*{box-sizing:border-box}body{margin:0;background:#e7b7ac;font-family:system-ui,"Microsoft YaHei",sans-serif;color:var(--ink)}.phone{width:min(390px,100%);height:760px;margin:20px auto;background:var(--cream);overflow:auto;box-shadow:0 25px 65px #773d4b44}.top{position:sticky;top:0;z-index:2;background:var(--sunset);color:white;padding:18px 20px;display:flex;justify-content:space-between}.composer{padding:18px;border-bottom:1px solid #efc8b5}.composer textarea{width:100%;height:88px;border:0;background:#fff0df;padding:13px;color:var(--ink);font:inherit;resize:none}.row{display:flex;justify-content:space-between;align-items:center;margin-top:9px}.row select{border:1px solid #d7a993;background:white;padding:8px}.row button{border:0;background:var(--purple);color:white;padding:9px 16px;font-weight:700;cursor:pointer}.test{font-size:11px;color:var(--muted);display:block;margin-top:10px}.feedback{display:none;margin-top:10px;padding:10px;font-size:12px}.feedback.show{display:block}.feedback.error{background:#f6d6db;color:var(--danger)}.feedback.ok{background:#dceddf;color:var(--ok)}.feedback button{border:0;background:var(--danger);color:white;padding:6px 10px;margin-left:8px}.feed{padding:12px}.post{background:white;border-radius:20px 20px 6px 20px;padding:15px;margin:10px 0;box-shadow:0 6px 18px #8d5b5520}.author{display:flex;gap:10px;align-items:center}.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--peach);font-weight:800}.author small{display:block;color:var(--muted)}.post p{line-height:1.55}.photo{height:125px;border-radius:14px;background:linear-gradient(150deg,#ffae72,var(--sunset) 48%,#735284);display:grid;place-items:center;color:white;font-size:40px}.meta{color:var(--muted);font-size:12px}@media(max-width:430px){.phone{margin:0;height:100vh}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style></head><body><main class="phone"><header class="top"><b>落日广场</b><span>晚风 24°C</span></header><section class="composer"><textarea id="social-draft">今天的云像一封没有封口的信。</textarea><div class="row"><select id="social-audience" aria-label="可见范围"><option>所有人可见</option><option>仅好友可见</option><option>仅自己可见</option></select><button onclick="publishPost()">发布此刻</button></div><label class="test"><input type="checkbox" id="social-fail"> 测试：让本次发布失败</label><div class="feedback" id="social-feedback"></div></section><section class="feed" id="social-feed"><article class="post"><div class="author"><div class="avatar">岚</div><div><b>岚岛</b><small>12 分钟前 · 海堤</small></div></div><p>风把潮声推到城市的台阶上。</p><div class="photo">≈</div><div class="meta">♡ 42　回应 7</div></article><article class="post"><div class="author"><div class="avatar">谷</div><div><b>谷雨</b><small>38 分钟前 · 所有人</small></div></div><p>今晚的面包刚出炉，路过的人可以来分一块。</p><div class="meta">♡ 19　回应 3</div></article></section></main><script>function publishPost(retry=false){const draft=document.getElementById('social-draft'),aud=document.getElementById('social-audience'),feedback=document.getElementById('social-feedback');if(!draft.value.trim())return;const fail=document.getElementById('social-fail').checked&&!retry;if(fail){feedback.className='feedback show error';feedback.innerHTML='发布未完成，草稿和“'+aud.value+'”已完整保留。<button onclick="retryPost()">恢复后重试</button>';return}const post=document.createElement('article');post.className='post';post.innerHTML='<div class="author"><div class="avatar">我</div><div><b>现在的我</b><small>刚刚 · <span></span></small></div></div><p></p><div class="meta">♡ 0　回应 0</div>';post.querySelector('span').textContent=aud.value;post.querySelector('p').textContent=draft.value;document.getElementById('social-feed').prepend(post);feedback.className='feedback show ok';feedback.textContent='发布成功，已出现在动态第一条。';draft.value='';document.getElementById('social-fail').checked=false}function retryPost(){document.getElementById('social-fail').checked=false;publishPost(true)}</script></body></html>
