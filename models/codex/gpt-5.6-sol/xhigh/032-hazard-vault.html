<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>危险仓封 · 永久删除</title><style>
:root{--concrete:#c8c5ba;--panel:#eeeae0;--ink:#181a19;--muted:#666a67;--yellow:#f2c230;--red:#c7352e;--green:#3f7457;--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--concrete);color:var(--ink);font-family:Arial,"Microsoft YaHei",sans-serif;min-height:100vh}.hazard{height:38px;background:repeating-linear-gradient(135deg,var(--yellow) 0 24px,var(--ink) 24px 48px)}.shell{max-width:980px;margin:46px auto;padding:0 28px}.label{font:800 11px ui-monospace,Consolas,monospace;letter-spacing:2px}.panel{margin-top:16px;border:5px solid var(--ink);background:var(--panel);box-shadow:13px 13px 0 #6e6c64;display:grid;grid-template-columns:1fr 370px}.warning{padding:42px}.icon{width:76px;height:66px;background:var(--yellow);clip-path:polygon(50% 0,100% 100%,0 100%);display:grid;place-items:end center;padding-bottom:8px;font-size:34px;font-weight:900}.warning h1{font-size:42px;line-height:1.03;margin:24px 0 14px}.warning>p{color:var(--muted);line-height:1.7}.loss{margin:30px 0;border-block:1px solid #b1aea5;padding:10px 0}.loss li{padding:9px 0}.loss b{display:block}.loss span{font-size:12px;color:var(--muted)}.safe-note{border-left:5px solid var(--green);padding:10px 14px;background:#dde5db;font-size:12px;line-height:1.6}.controls{background:var(--ink);color:var(--white);padding:42px 34px;display:flex;flex-direction:column;justify-content:center}.controls h2{font-size:22px;margin:0 0 8px}.controls p{color:#b7bbb8;font-size:12px;line-height:1.6}.word{display:block;background:var(--yellow);color:var(--ink);padding:9px 12px;font:900 15px ui-monospace,Consolas,monospace;margin:18px 0 10px}.controls label{font-size:11px;color:#b7bbb8}.controls input{width:100%;margin:8px 0 18px;border:2px solid #646967;background:#262a28;color:white;padding:13px;font:15px ui-monospace,Consolas,monospace}.controls input:focus{outline:3px solid var(--yellow);border-color:var(--yellow)}.cancel{border:0;background:var(--white);color:var(--ink);padding:15px;font-weight:900;cursor:pointer;font-size:15px}.delete{border:1px solid #64413e;background:transparent;color:#86645f;padding:13px;margin-top:12px;font-weight:800;cursor:not-allowed}.delete.ready{border-color:var(--red);color:white;background:var(--red);cursor:pointer}.message{text-align:center;font-size:11px;color:var(--yellow);min-height:18px;margin-top:12px}.cancel:focus-visible,.delete:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}.gone{text-align:center;padding:80px 30px;display:none}.gone h2{font-size:42px}.gone button{background:var(--ink);color:white;border:0;padding:14px 22px;cursor:pointer}@media(max-width:800px){.panel{grid-template-columns:1fr}.controls{min-height:480px}.warning{padding:32px}.warning h1{font-size:34px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div class="hazard" aria-hidden="true"></div><main class="shell"><div class="label">SECURITY ZONE / ACCOUNT DECOMMISSION</div><section class="panel" id="panel"><div class="warning"><div class="icon">!</div><h1>永久拆除<br>「北岸资料库」</h1><p>这不是退出登录或暂停订阅。确认后，资料库与账号关系会立即解除，恢复窗口不存在。</p><ul class="loss"><li><b>12,840 份文档与附件</b><span>包括历史版本和已归档内容</span></li><li><b>37 条自动化流程</b><span>所有触发器会立即停止</span></li><li><b>18 位成员的访问权</b><span>共享链接也将全部失效</span></li></ul><div class="safe-note"><b>仍想保留数据？</b><br>取消删除后，可前往“导出与所有权”生成完整离线副本。</div></div><div class="controls"><h2>最终安全闸</h2><p>只有工作区所有者可以执行。请输入下方完整确认词，大小写与字符必须一致。</p><span class="word">永久删除</span><label for="confirmText">确认词</label><input id="confirmText" autocomplete="off" placeholder="在这里输入"><button class="cancel" id="cancel">取消，返回安全区域</button><button class="delete" id="delete" disabled>永久删除资料库</button><div class="message" id="message" aria-live="polite"></div></div></section><section class="gone" id="gone"><h2>操作已取消</h2><p>资料库保持完整，没有任何数据被删除。</p><button id="returnBtn">返回账户设置</button></section></main><script>
const deleteBtn=document.getElementById('delete');
confirmText.oninput=()=>{const ok=confirmText.value==='永久删除';deleteBtn.disabled=!ok;deleteBtn.classList.toggle('ready',ok);message.textContent=ok?'确认词正确。请再次确认你要执行删除。':''};cancel.onclick=()=>{panel.style.display='none';gone.style.display='block'};returnBtn.onclick=()=>{gone.style.display='none';panel.style.display='grid';confirmText.value='';deleteBtn.disabled=true;deleteBtn.classList.remove('ready')};deleteBtn.onclick=()=>{if(!deleteBtn.disabled){message.textContent='演示环境：已通过最终验证，未实际删除任何数据。';deleteBtn.disabled=true;deleteBtn.classList.remove('ready')}};
</script></body></html>
