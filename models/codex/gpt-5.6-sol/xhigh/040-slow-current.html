<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>缓流队列</title><style>
:root{--mist:#eceafa;--card:#faf9ff;--ink:#2d2b49;--muted:#817e9d;--violet:#7167a8;--blue:#8db9cf;--ok:#5f927f;--danger:#b76a77}*{box-sizing:border-box}body{margin:0;background:#d9d7e8;color:var(--ink);font-family:system-ui,"Microsoft YaHei",sans-serif}.phone{width:min(390px,100%);min-height:760px;margin:20px auto;background:var(--mist);padding:26px 24px;box-shadow:0 24px 70px #58547730}.top{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}.orb{width:180px;height:180px;border-radius:50%;margin:70px auto 38px;background:radial-gradient(circle at 38% 33%,#fff 0 8%,#b9c8e5 28%,var(--violet) 70%);box-shadow:0 18px 45px #7167a84d;display:grid;place-items:center;color:white}.orb b{font-size:38px}.orb span{display:block;font-size:11px;text-align:center}h1{text-align:center;font-size:25px;margin:0}.lead{text-align:center;color:var(--muted);font-size:13px}.steps{background:var(--card);padding:18px;margin-top:30px;border-radius:18px}.step{display:flex;gap:12px;align-items:center;color:var(--muted);font-size:13px;padding:7px}.step i{width:8px;height:8px;border-radius:50%;background:#c8c4dc}.step.done{color:var(--ink)}.step.done i{background:var(--ok)}.step.now{color:var(--violet);font-weight:700}.step.now i{background:var(--violet);box-shadow:0 0 0 5px #7167a820}.actions{display:flex;gap:9px;margin-top:22px}button{flex:1;padding:12px;border:1px solid #b8b4d0;border-radius:12px;background:transparent;color:var(--ink);font-weight:600;cursor:pointer}button.cancel{color:var(--danger)}.status{text-align:center;color:var(--ok);font-size:12px;margin-top:13px}@media(max-width:430px){.phone{margin:0;min-height:100vh;box-shadow:none}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style></head><body><main class="phone"><header class="top"><b>静默处理</b><span>任务 W-214</span></header><div class="orb"><div><b>68%</b><span>正在校准颜色</span></div></div><h1>作品正在穿过最后一道门</h1><p class="lead">预计还需 1 分 20 秒，可以安心离开此页。</p><section class="steps"><div class="step done"><i></i>已接收 12 个素材</div><div class="step done"><i></i>版式检查完成</div><div class="step now"><i></i>正在校准颜色</div><div class="step"><i></i>生成交付文件</div></section><div class="actions"><button onclick="aside()">放到一边</button><button class="cancel" onclick="cancelJob()">取消任务</button></div><div class="status" id="waiting-status" aria-live="polite"></div></main><script>function aside(){document.getElementById('waiting-status').textContent='已放到后台，完成后会通知你'}function cancelJob(){if(confirm('取消后将保留已上传素材，确定取消？')){document.getElementById('waiting-status').textContent='任务已取消，素材保留 24 小时';document.querySelector('.orb b').textContent='已停'}} </script></body></html>
