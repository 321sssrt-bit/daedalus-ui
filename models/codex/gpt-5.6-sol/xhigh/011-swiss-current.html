<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Current · 数据看板</title><style>
:root{--bg:#f3f2ed;--surface:#ffffff;--text:#111111;--muted:#6e706c;--accent:#244cff;--success:#138757;--danger:#e53935;--grid:#d7d7d0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,"Microsoft YaHei",sans-serif}.page{min-height:100vh;padding:28px 34px}.top{display:grid;grid-template-columns:1fr auto;align-items:end;border-bottom:4px solid var(--text);padding-bottom:18px}.brand{font-weight:1000;font-size:28px;letter-spacing:-.06em}.top small{font:700 11px/1.4 monospace;text-align:right}.headline{display:flex;justify-content:space-between;align-items:flex-end;padding:30px 0 18px}.headline h1{font-size:clamp(42px,6vw,76px);line-height:.88;letter-spacing:-.075em;margin:0}.grain{display:flex;border:1px solid var(--text)}.grain button{height:36px;border:0;border-right:1px solid var(--text);background:transparent;padding:0 16px;font-weight:800;cursor:pointer}.grain button:last-child{border-right:0}.grain button.active{background:var(--accent);color:white}.kpis{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--text);background:var(--text);gap:1px}.kpi{background:var(--surface);padding:22px}.kpi small{font-weight:800}.kpi b{font-size:38px;display:block;margin:10px 0 4px;letter-spacing:-.04em}.up{color:var(--success);font-size:12px}.down{color:var(--danger);font-size:12px}.chartwrap{display:grid;grid-template-columns:1fr 230px;margin-top:22px;border:1px solid var(--text);background:var(--surface)}.chart{padding:24px;border-right:1px solid var(--text)}.charthead{display:flex;justify-content:space-between;align-items:center}.charthead h2{margin:0;font-size:16px}.legend{font-size:11px;color:var(--muted)}svg{width:100%;height:330px;margin-top:10px;overflow:visible}.gridline{stroke:var(--grid);stroke-width:1}.area{fill:#244cff18}.line{stroke:var(--accent);stroke-width:4;fill:none;vector-effect:non-scaling-stroke}.point{fill:var(--surface);stroke:var(--accent);stroke-width:3;cursor:pointer}.tooltip{font:700 11px Arial;fill:var(--text)}.breakdown{padding:24px}.breakdown h2{font-size:16px;margin:0 0 24px}.row{margin-bottom:24px}.row div{display:flex;justify-content:space-between;font-size:12px;font-weight:700}.bar{height:7px;background:#e4e4df;margin-top:8px}.bar i{display:block;height:100%;background:var(--text)}.note{font-size:11px;line-height:1.6;color:var(--muted);border-top:1px solid var(--grid);padding-top:18px}.tooltipbox{min-height:18px;color:var(--accent);font-weight:800;font-size:12px;margin-top:4px}
@media(max-width:800px){.chartwrap{grid-template-columns:1fr}.chart{border-right:0;border-bottom:1px solid var(--text)}.headline{display:grid;gap:22px}.kpis{grid-template-columns:1fr}.top small{display:none}}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body><main class="page"><header class="top"><div class="brand">CURRENT®</div><small>PRODUCT SIGNAL REPORT<br>2026 / Q3</small></header><section class="headline"><h1>增长不是噪声，<br>要看清来源。</h1><div class="grain" aria-label="时间粒度"><button data-grain="日">日</button><button class="active" data-grain="周">周</button><button data-grain="月">月</button></div></section><section class="kpis"><article class="kpi"><small>活跃使用者</small><b id="users">48,260</b><span class="up">↑ 12.4%</span></article><article class="kpi"><small>关键任务完成率</small><b id="rate">71.8%</b><span class="up">↑ 3.1%</span></article><article class="kpi"><small>平均响应时间</small><b id="speed">1.8s</b><span class="down">↓ 0.4s</span></article></section><section class="chartwrap"><article class="chart"><div class="charthead"><h2 id="chartTitle">每周完成的关键任务</h2><span class="legend">● 完成次数</span></div><svg viewBox="0 0 760 330" role="img" aria-label="关键任务趋势折线图"><line class="gridline" x1="30" y1="60" x2="730" y2="60"/><line class="gridline" x1="30" y1="140" x2="730" y2="140"/><line class="gridline" x1="30" y1="220" x2="730" y2="220"/><line class="gridline" x1="30" y1="300" x2="730" y2="300"/><path class="area" d="M30 260 L145 230 L260 248 L375 170 L490 184 L605 105 L730 72 L730 300 L30 300Z"/><path class="line" d="M30 260 L145 230 L260 248 L375 170 L490 184 L605 105 L730 72"/><g id="points"><circle class="point" cx="30" cy="260" r="6" data-v="12.1k"/><circle class="point" cx="145" cy="230" r="6" data-v="13.8k"/><circle class="point" cx="260" cy="248" r="6" data-v="12.9k"/><circle class="point" cx="375" cy="170" r="6" data-v="17.6k"/><circle class="point" cx="490" cy="184" r="6" data-v="16.9k"/><circle class="point" cx="605" cy="105" r="6" data-v="21.4k"/><circle class="point" cx="730" cy="72" r="6" data-v="24.2k"/></g></svg><div class="tooltipbox" id="tip">选择图中节点查看数值</div></article><aside class="breakdown"><h2>来源结构 / 本周期</h2><div class="row"><div><span>桌面工作区</span><span>54%</span></div><div class="bar"><i style="width:54%"></i></div></div><div class="row"><div><span>移动端</span><span>29%</span></div><div class="bar"><i style="width:29%;background:var(--accent)"></i></div></div><div class="row"><div><span>自动化入口</span><span>17%</span></div><div class="bar"><i style="width:17%;background:#8b8d88"></i></div></div><p class="note">统计口径：用户在 24 小时内完成至少一次创建、审核或发布。</p></aside></section></main><script>
const values={日:['6,940','68.3%','1.6s'],周:['48,260','71.8%','1.8s'],月:['192,700','73.1%','1.9s']};document.querySelectorAll('[data-grain]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-grain]').forEach(x=>x.classList.remove('active'));b.classList.add('active');const v=values[b.dataset.grain];users.textContent=v[0];rate.textContent=v[1];speed.textContent=v[2];chartTitle.textContent=`每${b.dataset.grain}完成的关键任务`});document.querySelectorAll('.point').forEach((p,i)=>p.onclick=()=>tip.textContent=`第 ${i+1} 个周期：${p.dataset.v} 次完成`);
</script></body></html>
