<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>纸上藏品 · 收藏夹</title><style>
:root{--desk:#8b5e3c;--cork:#bd8a5b;--paper:#fff8df;--ink:#3b2b23;--muted:#79685a;--blue:#4d73a8;--red:#bd4c45;--tape:#d9cea8}*{box-sizing:border-box}body{margin:0;background:var(--desk);color:var(--ink);font-family:"Segoe Print","KaiTi",cursive;min-height:100vh}.desk{min-height:100vh;padding:32px;background:linear-gradient(90deg,rgba(40,20,8,.1) 1px,transparent 1px) 0 0/42px 100%,var(--desk)}header{max-width:1180px;margin:auto;background:var(--paper);padding:24px 30px;transform:rotate(-.4deg);box-shadow:6px 8px 0 rgba(40,20,10,.24);display:flex;align-items:center;justify-content:space-between}.title h1{font-size:34px;margin:0}.title p{margin:4px 0;color:var(--muted);font-size:13px}.tabs{display:flex;gap:4px}.tabs button{border:0;border-bottom:2px solid transparent;background:transparent;padding:9px 13px;color:var(--muted);font:700 13px Arial,"Microsoft YaHei",sans-serif;cursor:pointer}.tabs button.active{color:var(--blue);border-color:var(--blue)}.board{max-width:1180px;margin:28px auto;background:var(--cork);border:12px solid #60432e;box-shadow:inset 0 0 40px rgba(63,35,17,.28),8px 10px 0 rgba(44,24,12,.25);padding:38px;display:grid;grid-template-columns:repeat(3,1fr);gap:34px;min-height:580px}.card{position:relative;background:var(--paper);padding:21px 18px 18px;min-height:210px;box-shadow:4px 6px 9px rgba(54,31,18,.25);transform:rotate(var(--r));display:flex;flex-direction:column}.card:before{content:"";position:absolute;width:76px;height:22px;background:rgba(217,206,168,.82);left:50%;top:-12px;transform:translateX(-50%) rotate(-2deg)}.card:nth-child(even):before{width:22px;height:22px;border-radius:50%;background:var(--red)}.kind{font:800 10px Arial,"Microsoft YaHei",sans-serif;color:var(--blue);letter-spacing:1px}.thumb{height:76px;margin:12px 0;background:var(--tone);display:grid;place-items:center;overflow:hidden}.thumb svg{width:100%;height:100%}.card h2{font-size:20px;line-height:1.2;margin:0}.card p{color:var(--muted);font-size:12px;margin:8px 0}.remove{margin-top:auto;align-self:flex-end;border:0;background:transparent;color:var(--red);font:700 12px Arial,"Microsoft YaHei",sans-serif;cursor:pointer;text-decoration:underline}.remove:focus-visible,.tabs button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}.empty{grid-column:1/-1;display:grid;place-items:center;font-size:28px;color:#60432e}.counter{font:700 12px Arial,"Microsoft YaHei",sans-serif;color:var(--muted)}@media(max-width:900px){.board{grid-template-columns:repeat(2,1fr);padding:28px}.desk{padding:18px}}@media(max-width:620px){header{display:block}.tabs{margin-top:14px;overflow:auto}.board{grid-template-columns:1fr}.card{transform:none}}@media(prefers-reduced-motion:reduce){*{transition:none!important}.card{transform:none}}
</style></head><body><main class="desk"><header><div class="title"><h1>纸上藏品</h1><p>把值得回来的东西，钉在看得见的地方。</p></div><div><nav class="tabs" aria-label="收藏分类"><button class="active" data-filter="all">全部</button><button data-filter="place">去处</button><button data-filter="read">阅读</button><button data-filter="object">器物</button></nav><div class="counter" id="counter">6 枚藏品</div></div></header><section class="board" id="board" aria-live="polite"><article class="card" data-kind="place" style="--r:-1.7deg;--tone:#b7d1c5"><span class="kind">去处 / PLACE</span><div class="thumb"><svg viewBox="0 0 200 80"><path d="M0 68 55 24l38 31 33-42 74 55" fill="none" stroke="#3b2b23" stroke-width="5"/><circle cx="160" cy="18" r="9" fill="#bd4c45"/></svg></div><h2>雾岭步道</h2><p>雨停后两小时最好走。</p><button class="remove">从收藏夹取下</button></article><article class="card" data-kind="read" style="--r:1.2deg;--tone:#ead6a7"><span class="kind">阅读 / READ</span><div class="thumb"><svg viewBox="0 0 200 80"><path d="M36 15h128v50H36z" fill="#fff8df" stroke="#3b2b23" stroke-width="3"/><path d="M100 16v49M53 30h30m-30 10h30m34-10h30m-30 10h30" stroke="#79685a" stroke-width="2"/></svg></div><h2>《看不见的城市》</h2><p>重读第六章：城市与记忆。</p><button class="remove">从收藏夹取下</button></article><article class="card" data-kind="object" style="--r:-.6deg;--tone:#c8c4da"><span class="kind">器物 / OBJECT</span><div class="thumb"><svg viewBox="0 0 200 80"><path d="M73 17h55l-7 48H80z" fill="#4d73a8"/><path d="M128 28c28-1 27 26-2 27" fill="none" stroke="#3b2b23" stroke-width="5"/></svg></div><h2>海蓝搪瓷杯</h2><p>旧物店编号 017，边缘有磕痕。</p><button class="remove">从收藏夹取下</button></article><article class="card" data-kind="place" style="--r:1.8deg;--tone:#d8b3a2"><span class="kind">去处 / PLACE</span><div class="thumb"><svg viewBox="0 0 200 80"><path d="M22 63h156M42 63V28h116v35M67 28V12h66v16" fill="none" stroke="#3b2b23" stroke-width="4"/><path d="M84 44h32v19H84z" fill="#bd4c45"/></svg></div><h2>北岸旧车站</h2><p>周六上午有植物交换。</p><button class="remove">从收藏夹取下</button></article><article class="card" data-kind="read" style="--r:-1deg;--tone:#c6d6a8"><span class="kind">阅读 / READ</span><div class="thumb"><svg viewBox="0 0 200 80"><path d="M60 66V21m80 45V21M60 30c23-18 57-18 80 0v36H60z" fill="#fff8df" stroke="#3b2b23" stroke-width="3"/><path d="M79 44h42M79 53h31" stroke="#79685a" stroke-width="3"/></svg></div><h2>园艺通信第 8 期</h2><p>关于阴面阳台的一百种叶子。</p><button class="remove">从收藏夹取下</button></article><article class="card" data-kind="object" style="--r:.8deg;--tone:#e7c2c3"><span class="kind">器物 / OBJECT</span><div class="thumb"><svg viewBox="0 0 200 80"><circle cx="100" cy="40" r="28" fill="#fff8df" stroke="#3b2b23" stroke-width="4"/><circle cx="100" cy="40" r="7" fill="#bd4c45"/><path d="M100 40 117 25M100 40 80 46" stroke="#3b2b23" stroke-width="3"/></svg></div><h2>红针厨房钟</h2><p>等下一次补货提醒。</p><button class="remove">从收藏夹取下</button></article></section></main><script>
let filter='all';function render(){let visible=0;document.querySelectorAll('.card').forEach(c=>{const show=filter==='all'||c.dataset.kind===filter;c.hidden=!show;if(show)visible++});counter.textContent=`${visible} 枚藏品`;if(!document.querySelector('.card:not([hidden])'))board.innerHTML='<div class="empty">这块软木板空了。</div>'}document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;render()});board.addEventListener('click',e=>{if(e.target.classList.contains('remove')){e.target.closest('.card').remove();render()}});
</script></body></html>
