<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>步迹 · 定位权限</title><style>
:root{--bg:#d9ece6;--surface:#ffffff;--text:#173e39;--muted:#64817c;--accent:#0d8f7b;--success:#1e7a58;--danger:#bd4a50;--sand:#f1e4c7}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,"Microsoft YaHei",sans-serif}.app{min-height:100vh;display:grid;grid-template-columns:220px 1fr}.side{background:#f8fbf7;padding:30px 24px;border-right:1px solid #bed4ce}.brand{font-weight:900;font-size:22px}.brand:before{content:"◉";color:var(--accent);margin-right:8px}.side nav{display:grid;gap:8px;margin-top:48px}.side button{border:0;background:transparent;text-align:left;padding:13px;border-radius:10px;color:var(--muted);font-weight:700}.side button:first-child{background:#dcefe9;color:var(--text)}.map{position:relative;overflow:hidden;background-color:var(--sand);background-image:linear-gradient(27deg,transparent 47%,#c9d5b0 48% 53%,transparent 54%),linear-gradient(153deg,transparent 47%,#c9d5b0 48% 53%,transparent 54%);background-size:180px 180px}.river{position:absolute;width:130%;height:160px;background:#9fd5dd;top:40%;left:-15%;transform:rotate(-8deg);border:10px solid #d9ece6}.road{position:absolute;width:110%;height:18px;background:#fff;top:30%;left:-5%;transform:rotate(18deg);box-shadow:0 0 0 2px #d1c8b3}.pin{position:absolute;width:28px;height:28px;background:var(--accent);border:7px solid white;border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:0 6px 12px #173e3944}.p1{top:26%;left:34%}.p2{top:65%;left:72%;background:#e9874e}.p3{top:72%;left:24%;background:#7369b6}.shade{position:absolute;inset:0;background:#173e3970;backdrop-filter:blur(2px);display:grid;place-items:center;padding:24px}.modal{width:min(560px,100%);background:var(--surface);border-radius:28px;padding:38px;box-shadow:0 28px 80px #173e3960}.lens{width:76px;height:76px;border-radius:50%;background:#d9f1ea;display:grid;place-items:center;font-size:34px;color:var(--accent)}.modal h1{font-size:30px;margin:22px 0 10px}.modal>p{color:var(--muted);line-height:1.65}.reason{background:#f2f7f4;border-radius:16px;padding:16px;margin:22px 0;display:grid;grid-template-columns:32px 1fr;gap:12px;align-items:start}.reason b{display:block;margin-bottom:4px}.reason small{color:var(--muted);line-height:1.45}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{height:50px;border:1px solid #c4d7d2;border-radius:13px;background:white;color:var(--text);font-weight:800;cursor:pointer}.btn.allow{grid-column:1/-1;background:var(--accent);color:white;border-color:var(--accent)}.result{display:none;margin-top:16px;padding:12px;border-radius:10px;color:var(--success);background:#e4f3ec;font-size:13px}.result.show{display:block}
@media(max-width:740px){.app{grid-template-columns:1fr}.side{display:none}.map{min-height:100vh}.modal{padding:28px}.actions{grid-template-columns:1fr}.btn.allow{grid-column:auto}}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body><main class="app"><aside class="side"><div class="brand">步迹</div><nav><button>附近发现</button><button>我的路线</button><button>离线地图</button><button>隐私设置</button></nav></aside><section class="map" aria-label="附近步行地图"><div class="river"></div><div class="road"></div><i class="pin p1"></i><i class="pin p2"></i><i class="pin p3"></i><div class="shade"><section class="modal" role="dialog" aria-labelledby="title"><div class="lens">⌖</div><h1 id="title">允许「步迹」使用你的位置？</h1><p>我们需要定位来显示附近的安静路线，并在你偏离路线时给出方向。位置不会用于广告，也不会公开给其他人。</p><div class="reason"><span>◎</span><div><b>你始终掌握开关</b><small>选择“仅此一次”会在关闭页面后失效；可随时在隐私设置中撤回。</small></div></div><div class="actions"><button class="btn" data-choice="已拒绝定位。你仍可手动输入起点。">暂不允许</button><button class="btn" data-choice="本次已允许。关闭页面后定位自动失效。">仅此一次</button><button class="btn allow" data-choice="已允许使用位置，附近路线已按距离更新。">使用期间允许</button></div><div id="result" class="result" role="status"></div></section></div></section></main><script>
document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{result.textContent=b.dataset.choice;result.classList.add('show');document.querySelector('.shade').style.background='#173e3938'});
</script></body></html>
