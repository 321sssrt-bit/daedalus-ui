<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>酸性作品簿 · 个人主页</title><style>
:root{--acid:#dfff00;--black:#0a0a0a;--white:#f5f5ef;--gray:#a6a6a0;--pink:#ff4fa0;--blue:#526dff}*{box-sizing:border-box}body{margin:0;background:var(--acid);color:var(--black);font-family:Arial,"Microsoft YaHei",sans-serif}.frame{min-height:100vh;padding:16px}.bar{height:46px;border:3px solid var(--black);background:var(--white);display:flex;align-items:center;justify-content:space-between;padding:0 14px;font:900 12px ui-monospace,Consolas,monospace}.marquee{overflow:hidden;white-space:nowrap}.layout{display:grid;grid-template-columns:360px 1fr;border:3px solid var(--black);border-top:0;min-height:calc(100vh - 78px)}.bio{background:var(--black);color:var(--white);padding:34px;display:flex;flex-direction:column}.portrait{aspect-ratio:1;background:var(--pink);border:3px solid var(--white);position:relative;overflow:hidden}.portrait:before{content:"";position:absolute;width:55%;height:78%;background:var(--black);border-radius:50% 50% 10% 10%;left:22%;top:18%}.portrait:after{content:"林\A  她";white-space:pre;position:absolute;right:8px;bottom:0;font-size:58px;font-weight:900;color:var(--acid);line-height:.72}.bio h1{font-size:54px;line-height:.82;letter-spacing:-4px;margin:30px 0 14px}.role{color:var(--acid);font:700 13px ui-monospace,Consolas,monospace}.about{color:#d2d2cc;line-height:1.7;font-size:14px}.stats{display:grid;grid-template-columns:repeat(3,1fr);border-block:1px solid #444;margin:22px 0}.stat{padding:16px 4px}.stat b{display:block;font-size:22px}.stat span{color:var(--gray);font-size:10px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:auto}.actions button{border:2px solid var(--white);background:transparent;color:var(--white);padding:13px;font-weight:900;cursor:pointer}.actions .follow{background:var(--acid);color:var(--black);border-color:var(--acid)}.works{background:var(--white);padding:28px}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:18px}.head h2{font-size:38px;margin:0;letter-spacing:-2px}.head span{font:11px ui-monospace,Consolas,monospace}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.work{min-height:260px;border:3px solid var(--black);padding:18px;position:relative;overflow:hidden;cursor:pointer;text-align:left;color:var(--black);font:inherit}.work:nth-child(1){background:var(--blue)}.work:nth-child(2){background:#ff7139}.work:nth-child(3){background:#efe8da}.work:nth-child(4){background:var(--pink)}.work:before{content:"";position:absolute;width:170px;height:170px;border:24px solid currentColor;border-radius:50%;opacity:.18;right:-38px;bottom:-60px}.work .no{font:700 11px ui-monospace,Consolas,monospace}.work h3{font-size:32px;line-height:1;margin:52px 0 8px;max-width:260px}.work p{font-size:12px;font-weight:700}.work:hover{filter:contrast(1.12);transform:rotate(-.5deg)}button:focus-visible{outline:4px solid var(--blue);outline-offset:3px}.toast{position:fixed;right:30px;bottom:26px;background:var(--black);color:var(--acid);padding:14px 18px;font-weight:800;transform:translateY(120px);transition:.2s}.toast.show{transform:none}@media(max-width:850px){.layout{grid-template-columns:1fr}.portrait{max-height:300px}.bio h1{font-size:46px}.grid{grid-template-columns:1fr}.work{min-height:220px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}.work:hover{transform:none}}
</style></head><body><div class="frame"><header class="bar"><b>LIN—SHE / VISUAL SYSTEMS</b><div class="marquee">上海 ↔ 任何有好招牌的街区　/　AVAILABLE FOR SELECTED PROJECTS</div></header><main class="layout"><aside class="bio"><div class="portrait" role="img" aria-label="林她的几何肖像"></div><h1>林她<br>LIN SHE</h1><div class="role">视觉导演 / 字体收藏者 / 慢跑新手</div><p class="about">为文化、餐饮与公共空间建立有脾气的视觉系统。相信好识别不等于大声，好玩也可以很准确。</p><div class="stats"><div class="stat"><b>26</b><span>PROJECTS</span></div><div class="stat"><b>8.4k</b><span>FOLLOWERS</span></div><div class="stat"><b>12</b><span>AWARDS</span></div></div><div class="actions"><button class="follow" id="follow">＋ 关注</button><button id="contact">联系合作</button></div></aside><section class="works"><div class="head"><h2>SELECTED<br>WORKS</h2><span>2024—2026 / 04 件</span></div><div class="grid"><button class="work"><span class="no">NO.01 / 城市品牌</span><h3>风从港口来</h3><p>海岸公共标识系统</p></button><button class="work"><span class="no">NO.02 / 餐饮</span><h3>热气食堂</h3><p>品牌与空间字体</p></button><button class="work"><span class="no">NO.03 / 出版</span><h3>边界不负责</h3><p>年度艺术书设计</p></button><button class="work"><span class="no">NO.04 / 展览</span><h3>看见噪声</h3><p>动态识别与导视</p></button></div></section></main><div class="toast" id="toast" role="status"></div></div><script>
function say(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1800)}follow.onclick=()=>{const on=follow.textContent.includes('已');follow.textContent=on?'＋ 关注':'✓ 已关注';say(on?'已取消关注':'你会收到林她的新作品')};contact.onclick=()=>say('合作询问已放入草稿箱');document.querySelectorAll('.work').forEach(w=>w.onclick=()=>say(`正在打开：${w.querySelector('h3').textContent}`));
</script></body></html>
