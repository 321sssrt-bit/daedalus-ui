<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>页边茶室</title><style>
:root{--paper:#f2ead8;--card:#fffaf0;--ink:#332d25;--muted:#837765;--tea:#6b8065;--red:#a84e42}*{box-sizing:border-box}body{margin:0;background:#c8bda9;color:var(--ink);font-family:Georgia,"Songti SC","Microsoft YaHei",serif}.phone{width:min(390px,100%);min-height:760px;margin:20px auto;background:var(--paper);box-shadow:0 24px 70px #463c3080;position:relative;overflow:hidden}.top{padding:22px 22px 12px;border-bottom:1px solid #d9ccb6;display:flex;justify-content:space-between}.top b{font-size:13px;letter-spacing:.18em}.mark{color:var(--red);border:0;background:none;font-size:22px;cursor:pointer}.hero{padding:28px 26px 16px}.hero small{color:var(--tea);letter-spacing:.12em}.hero h1{font-size:30px;line-height:1.18;margin:8px 0 10px}.by{color:var(--muted);font-size:13px}.tools{margin:0 20px;padding:12px;background:#e8ddca;border:1px solid #d6c6aa;display:flex;align-items:center;justify-content:space-between}.tools button{border:1px solid #a99a83;background:var(--card);width:34px;height:30px;cursor:pointer}.tools output{font:12px system-ui;color:var(--muted)}article{padding:22px 28px 90px;font-size:17px;line-height:1.85}article p:first-child:first-letter{float:left;font-size:54px;line-height:.85;color:var(--red);padding-right:8px}.note{border-left:3px solid var(--tea);padding-left:12px;color:#53604e;font-style:italic}.start{position:absolute;bottom:18px;left:22px;right:22px;border:0;background:var(--ink);color:var(--card);padding:14px;font:600 15px system-ui;cursor:pointer}.toast{position:absolute;right:18px;top:60px;background:var(--ink);color:white;padding:8px 12px;font:12px system-ui;opacity:0;transition:.2s}.toast.show{opacity:1}@media(max-width:430px){.phone{margin:0;min-height:100vh;box-shadow:none}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style></head><body><main class="phone"><header class="top"><b>页边茶室 · 07</b><button class="mark" aria-label="收藏" onclick="favorite(this)">♡</button></header><section class="hero"><small>器物与日常</small><h1>一只茶杯，如何记住手的温度</h1><div class="by">文 / 林见微　·　8 分钟阅读</div></section><div class="tools"><button onclick="size(-1)" aria-label="缩小字号">A−</button><output id="reading-size">舒展</output><button onclick="size(1)" aria-label="放大字号">A＋</button></div><article id="reading-body"><p>器物最诚实的部分，并不是刚离开窑火时的光泽，而是被日常缓慢改变之后的表面。</p><p>杯沿留下极浅的茶色，釉面在拇指常停的地方变得温润。它们不是瑕疵，是时间在物件上写下的小字。</p><p class="note">真正耐看的东西，会把使用者也纳入设计。</p><p>因此，选择一只杯子时，不必先问它是否完美。把它握在手里，看看重量是否愿意停留。</p></article><button class="start" onclick="document.querySelector('.note').scrollIntoView()">从批注处继续</button><div class="toast" id="reader-toast">已收入「慢读」</div></main><script>let level=1;function size(n){level=Math.max(0,Math.min(2,level+n));const body=document.getElementById('reading-body');body.style.fontSize=[15,17,20][level]+'px';body.style.lineHeight=[1.7,1.85,2][level];document.getElementById('reading-size').textContent=['紧凑','舒展','大字'][level]}function favorite(b){b.textContent=b.textContent==='♡'?'♥':'♡';const t=document.getElementById('reader-toast');t.textContent=b.textContent==='♥'?'已收入「慢读」':'已取消收藏';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1200)}</script></body></html>
