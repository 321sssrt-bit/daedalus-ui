<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>信号断层</title><style>
:root{--black:#131313;--panel:#202020;--white:#f4f1e8;--muted:#99958c;--orange:#ff5a1f;--ok:#91d18b}*{box-sizing:border-box}body{margin:0;background:#2c2c2c;color:var(--white);font-family:Arial,"Microsoft YaHei",sans-serif}.phone{width:min(390px,100%);min-height:760px;margin:20px auto;background:var(--black);position:relative;overflow:hidden;border:6px solid #090909}.hazard{height:42px;background:repeating-linear-gradient(135deg,var(--orange) 0 18px,#121212 18px 36px)}.code{font:900 92px/.9 Impact,Arial;color:transparent;-webkit-text-stroke:2px var(--orange);padding:65px 26px 0;letter-spacing:-.05em}.slash{height:10px;background:var(--orange);transform:rotate(-4deg);margin:14px -20px 34px}section{padding:0 26px}h1{font-size:28px;text-transform:uppercase;margin:0 0 12px}p{color:var(--muted);line-height:1.6}.ticket{margin:28px 0;border:1px dashed #625f58;padding:12px;font:12px ui-monospace}.ticket b{color:var(--white)}.actions{display:grid;gap:10px}button{padding:14px;border:1px solid #4d4d4d;background:var(--panel);color:var(--white);font-weight:800;text-align:left;cursor:pointer}button.primary{background:var(--orange);border-color:var(--orange);color:#111}.status{margin-top:15px;color:var(--ok);font:12px ui-monospace}@media(max-width:430px){.phone{margin:0;min-height:100vh;border-width:0}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style></head><body><main class="phone"><div class="hazard"></div><div class="code">503</div><div class="slash"></div><section><h1>隧道前方暂时封闭</h1><p>不是你的操作有问题。北区节点正在重新接线，我们保留了刚才的路线。</p><div class="ticket">故障工单　<b>SG-503-8821</b><br>最近更新　18:42:09</div><div class="actions"><button class="primary" onclick="retry(this)">↻ 重新探测线路</button><button onclick="home()">← 回到首页</button></div><div class="status" id="fault-status" aria-live="polite">预计恢复：2 分钟内</div></section></main><script>function retry(b){b.disabled=true;document.getElementById('fault-status').textContent='正在探测备用线路…';setTimeout(()=>{document.getElementById('fault-status').textContent='备用线路仍未响应，请稍后再试';b.disabled=false},700)}function home(){document.getElementById('fault-status').textContent='已返回首页，未完成的路线已保存'}</script></body></html>
