<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>北辰调度台 · 工作总览</title><style>
:root{--bg:#0b1114;--surface:#111b20;--text:#e8f2ed;--muted:#72858a;--accent:#48e49e;--success:#48e49e;--danger:#ff6868;--amber:#ffc65c;--line:#223239}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,"Microsoft YaHei",sans-serif}.app{display:grid;grid-template-columns:78px 1fr;min-height:100vh}.rail{border-right:1px solid var(--line);padding:20px 12px;display:flex;flex-direction:column;align-items:center}.logo{width:42px;height:42px;border-radius:12px;background:var(--accent);color:#07100c;display:grid;place-items:center;font-weight:1000}.icons{display:grid;gap:14px;margin-top:50px}.icon{width:42px;height:42px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-size:18px;cursor:pointer}.icon.active,.icon:hover{background:var(--surface);color:var(--accent)}.content{padding:28px 34px;min-width:0}.head{display:flex;justify-content:space-between;align-items:center}.head small{color:var(--muted)}.head h1{margin:6px 0 0;font-size:28px}.clock{font:800 24px ui-monospace,monospace;color:var(--accent)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:28px 0}.stat{border:1px solid var(--line);background:var(--surface);padding:18px;border-radius:12px}.stat small{color:var(--muted)}.stat b{display:block;font-size:30px;margin-top:8px;font-variant-numeric:tabular-nums}.stat em{font-style:normal;color:var(--success);font-size:11px}.grid{display:grid;grid-template-columns:1.45fr .75fr;gap:16px}.panel{border:1px solid var(--line);background:var(--surface);border-radius:14px;overflow:hidden}.ph{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.ph h2{font-size:15px;margin:0}.filters{display:flex;gap:6px}.filters button{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:20px;padding:6px 11px;font-size:11px;cursor:pointer}.filters button.active{color:#07100c;background:var(--accent);border-color:var(--accent)}.queue{width:100%;border-collapse:collapse}.queue th{text-align:left;font-size:10px;letter-spacing: @media(max-width:900px){.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.app{grid-template-columns:60px 1fr}.content{padding:22px 16px}.queue th:nth-child(3),.queue td:nth-child(3){display:none}}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body><main class="app"><aside class="rail"><div class="logo">N</div><nav class="icons" aria-label="主导航"><button class="icon active" title="总览">⌂</button><button class="icon" title="任务">◇</button><button class="icon" title="信号">⌁</button><button class="icon" title="团队">◎</button></nav></aside><section class="content"><header class="head"><div><small>2026 年 8 月 14 日 · 星期五</small><h1>早上好，林队长。系统等你下令。</h1></div><div class="clock" id="clock">09:42:16</div></header><section class="stats"><article class="stat"><small>今日待调度</small><b>18</b><em>↑ 3 个新到</em></article><article class="stat"><small>按时完成率</small><b>94%</b><em>↑ 6% 本周</em></article><article class="stat"><small>在线成员</small><b>12</b><em>全队 16 人</em></article><article class="stat"><small>风险信号</small><b style="color:var(--danger)">03</b><em style="color:var(--danger)">需要处理</em></article></section><section class="grid"><article class="panel"><div class="ph"><h2>今日调度队列</h2><div class="filters"><button class="active" data-filter="all">全部</button><button data-filter="risk">仅风险</button></div></div><table class="queue"><thead><tr><th>优先</th><th>任务</th><th>负责人</th><th>状态</th></tr></thead><tbody id="rows"><tr data-kind="risk"><td><i class="dot hot"></i>P0</td><td>北岸站点证书续期</td><td>周屿</td><td><span class="badge">受阻</span></td></tr><tr><td><i class="dot mid"></i>P1</td><td>发布 4.8 版本说明</td><td>莫青</td><td><span class="badge">进行中</span></td></tr><tr><td><i class="dot low"></i>P2</td><td>整理七月访问记录</td><td>秦遥</td><td><span class="badge">待开始</span></td></tr><tr data-kind="risk"><td><i class="dot hot"></i>P0</td><td>支付回调延迟调查</td><td>杜衡</td><td><span class="badge">调查中</span></td></tr><tr><td><i class="dot mid"></i>P1</td><td>新成员权限复核</td><td>林夏</td><td><span class="badge">待确认</span></td></tr></tbody></table><div class="empty" id="empty">当前筛选下没有任务</div></article><aside class="sidepanel"><article class="panel"><div class="ph"><h2>今日负载</h2><span style="color:var(--muted);font-size:11px">实时</span></div><div class="pulse"><div class="ring"></div></div></article><article class="panel"><div class="ph"><h2>最新动态</h2></div><div class="log"><div class="event"><i></i><span>09:38 周屿接手证书续期</span></div><div class="event"><i></i><span>09:21 自动巡检完成 42 项</span></div><div class="event"><i></i><span>08:56 新增三个风险信号</span></div></div></article></aside></section></section></main><script>
