<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>行李转运台 · 文件上传</title><style>
:root{--terminal:#d8d4c8;--belt:#292e2f;--paper:#fff9df;--ink:#202526;--muted:#687071;--orange:#f36b2b;--green:#4c8668;--red:#c8493d;--yellow:#f4c447}*{box-sizing:border-box}body{margin:0;background:var(--terminal);color:var(--ink);font-family:Arial,"Microsoft YaHei",sans-serif;min-height:100vh}.ceiling{height:74px;background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(24px,5vw,70px)}.code{font:700 13px ui-monospace,Consolas,monospace;letter-spacing:2px}.clock{background:var(--yellow);color:var(--ink);padding:10px 14px;font-weight:900}.terminal{max-width:1140px;margin:44px auto;padding:0 28px}.heading{display:flex;justify-content:space-between;align-items:end;margin-bottom:24px}.heading h1{font-size:42px;margin:0;letter-spacing:-2px}.heading p{margin:0;color:var(--muted)}.drop{border:3px dashed var(--ink);background:#e7e3d7;min-height:210px;display:grid;place-items:center;text-align:center;padding:30px;cursor:pointer;position:relative}.drop.drag{background:#ffe0c8;border-color:var(--orange)}.drop:before,.drop:after{content:"";position:absolute;width:80px;height:12px;background:repeating-linear-gradient(45deg,var(--yellow) 0 9px,var(--ink) 9px 18px)}.drop:before{left:18px;top:18px}.drop:after{right:18px;bottom:18px}.drop strong{display:block;font-size:25px;margin-bottom:8px}.drop span{color:var(--muted);font-size:12px}.drop button{border:0;background:var(--orange);color:white;padding:11px 18px;margin-top:17px;font-weight:800;cursor:pointer}.belt{background:var(--belt);margin-top:28px;padding:26px;position:relative}.belt:before{content:"";position:absolute;left:0;right:0;top:10px;height:5px;background:repeating-linear-gradient(90deg,#555 0 24px,transparent 24px 38px)}.belt-head{color:var(--paper);display:flex;justify-content:space-between;align-items:center;margin:7px 0 18px}.belt-head h2{font-size:16px;margin:0}.belt-head span{font:11px ui-monospace,Consolas,monospace;color:#aeb7b7}.file{background:var(--paper);display:grid;grid-template-columns:52px 1fr 110px auto;gap:16px;align-items:center;padding:16px 18px;margin:10px 0;box-shadow:5px 5px 0 #111}.tag{width:52px;height:40px;background:var(--yellow);clip-path:polygon(0 0,82% 0,100% 50%,82% 100%,0 100%);display:grid;place-items:center;font:900 10px ui-monospace,Consolas,monospace}.file h3{font-size:14px;margin:0 0 5px}.file p{color:var(--muted);font-size:11px;margin:0}.state{font-size:11px;color:var(--green);font-weight:800}.state.wait{color:var(--orange)}.remove{border:0;background:transparent;color:var(--red);font-size:20px;cursor:pointer}.process{display:flex;align-items:center;justify-content:space-between;margin-top:26px}.process p{color:var(--muted);font-size:12px}.process button{border:0;background:var(--green);color:white;padding:15px 24px;font-weight:900;cursor:pointer}.process button:disabled{background:#89918e;cursor:not-allowed}.drop:focus-within,.process button:focus-visible,.remove:focus-visible{outline:3px solid var(--orange);outline-offset:3px}.message{color:var(--green);font-weight:800}@media(max-width:720px){.heading{display:block}.heading p{margin-top:8px}.file{grid-template-columns:42px 1fr auto}.file .state{grid-column:2}.process{display:block}.process button{width:100%;margin-top:12px}.terminal{margin-top:28px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><header class="ceiling"><div class="code">TRANSFER DESK // BAY 04</div><div class="clock">14:36</div></header><main class="terminal"><div class="heading"><h1>文件转运台</h1><p>下一班处理任务将在 15:00 发车</p></div><label class="drop" id="drop"><input id="picker" type="file" multiple hidden><div><strong>把文件放上转运带</strong><span>PDF、PNG、CSV · 单件不超过 200 MB</span><br><button type="button" id="choose">选择本机文件</button></div></label><section class="belt"><div class="belt-head"><h2>待转运行李</h2><span id="count">02 PIECES / 31.8 MB</span></div><div id="files"><article class="file"><div class="tag">PDF</div><div><h3>北岸场地勘察.pdf</h3><p>24.6 MB · 完整性检查通过</p></div><span class="state">可以处理</span><button class="remove" aria-label="删除北岸场地勘察.pdf">×</button></article><article class="file"><div class="tag">CSV</div><div><h3>客流记录_八月.csv</h3><p>7.2 MB · 正在扫描字段</p></div><span class="state wait">检查中</span><button class="remove" aria-label="删除客流记录">×</button></article></div><div class="process"><p id="message">文件只会在你按下开始后上传。</p><button id="process">开始处理 2 份文件</button></div></section></main><script>
const picker=document.getElementById('picker'),files=document.getElementById('files');choose.onclick=()=>picker.click();function sync(){const n=files.children.length;count.textContent=`${String(n).padStart(2,'0')} PIECES`;process.textContent=`开始处理 ${n} 份文件`;process.disabled=!n}files.addEventListener('click',e=>{if(e.target.classList.contains('remove')){e.target.closest('.file').remove();sync()}});picker.onchange=()=>{[...picker.files].forEach(f=>{const ext=(f.name.split('.').pop()||'FILE').toUpperCase().slice(0,4),a=document.createElement('article');a.className='file';a.innerHTML=`<div class="tag">${ext}</div><div><h3></h3><p>${(f.size/1048576).toFixed(1)} MB · 本机新选择</p></div><span class="state">可以处理</span><button class="remove" aria-label="删除">×</button>`;a.querySelector('h3').textContent=f.name;files.appendChild(a)});sync()};['dragenter','dragover'].forEach(x=>drop.addEventListener(x,e=>{e.preventDefault();drop.classList.add('drag')}));['dragleave','drop'].forEach(x=>drop.addEventListener(x,e=>{e.preventDefault();drop.classList.remove('drag')}));process.onclick=()=>{document.querySelectorAll('.state').forEach(s=>{s.className='state';s.textContent='处理完成'});message.className='message';message.textContent='✓ 所有文件已安全入库';process.disabled=true};
</script></body></html>
