<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>青玉钱匣</title><style>
:root{--jade:#123e3a;--deep:#092925;--paper:#eef3e6;--ink:#17312d;--muted:#6e8078;--gold:#d2a84a;--ok:#2f795e;--danger:#b54b43}*{box-sizing:border-box}body{margin:0;background:#b9c5bc;font-family:system-ui,"Microsoft YaHei",sans-serif;color:var(--ink)}.phone{width:min(390px,100%);min-height:760px;margin:20px auto;background:var(--paper);box-shadow:0 28px 70px #183a3560;overflow:hidden}.head{background:var(--jade);color:white;padding:24px 22px 30px}.head small{color:#aed1c7}.balance{font:600 38px Georgia;margin:10px 0}.content{padding:20px}.people{display:flex;gap:12px;overflow:hidden}.person{border:0;background:transparent;color:var(--muted);cursor:pointer}.person i{display:grid;width:48px;height:48px;border-radius:50%;place-items:center;background:#d7dfcf;font-style:normal;font-weight:800}.person.active{color:var(--ink);font-weight:700}.person.active i{outline:3px solid var(--gold)}label{display:block;color:var(--muted);font-size:12px;margin:20px 0 7px}.amount{display:flex;align-items:center;background:white;border-bottom:2px solid var(--jade);padding:10px 14px}.amount span{font:28px Georgia}.amount input{width:100%;border:0;outline:0;font:36px Georgia;color:var(--ink);background:transparent}.source{width:100%;padding:12px;border:1px solid #bdc9bd;background:white;color:var(--ink)}.quick{border:0;background:none;color:var(--danger);text-decoration:underline;margin-top:10px;cursor:pointer}.primary{width:100%;border:0;background:var(--jade);color:white;padding:14px;margin-top:22px;font-weight:800;cursor:pointer}.sheet{margin-top:16px;border:1px solid #bdc9bd;background:white;padding:16px;display:none}.sheet.show{display:block}.row{display:flex;justify-content:space-between;margin:8px 0}.sheet button{width:100%;padding:12px;background:var(--gold);border:0;font-weight:800}.error{color:var(--danger);font-size:13px}.receipt{text-align:center}.seal{width:56px;height:56px;border:2px solid var(--ok);border-radius:50%;display:grid;place-items:center;margin:auto;color:var(--ok);font-size:27px}@media(max-width:430px){.phone{margin:0;min-height:100vh}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style></head><body><main class="phone"><header class="head"><small>青玉钱匣 · 可用余额</small><div class="balance">¥1,280.00</div><small>今日转账限额还剩 ¥8,000</small></header><section class="content"><label>转给谁</label><div class="people"><button class="person active" onclick="choose(this,'苏棠')"><i>苏</i>苏棠</button><button class="person" onclick="choose(this,'陈野')"><i>陈</i>陈野</button><button class="person" onclick="choose(this,'木屋咖啡')"><i>木</i>木屋</button></div><label for="transfer-amount">转账金额</label><div class="amount"><span>¥</span><input id="transfer-amount" type="number" value="128" min="1"></div><label for="fund-source">付款来源</label><select class="source" id="fund-source"><option value="1280">钱包余额 · ¥1,280</option><option value="5000">青禾储蓄卡 · 可用 ¥5,000</option></select><button class="quick" onclick="document.getElementById('transfer-amount').value=1600">测试：填入超过钱包余额的金额</button><button class="primary" onclick="review()">核对转账</button><section class="sheet" id="wallet-sheet"></section></section></main><script>let payee='苏棠';function choose(el,n){document.querySelectorAll('.person').forEach(x=>x.classList.remove('active'));el.classList.add('active');payee=n}function review(){const a=Number(document.getElementById('transfer-amount').value),limit=Number(document.getElementById('fund-source').value),s=document.getElementById('wallet-sheet');s.classList.add('show');if(!a||a<1)return s.innerHTML='<p class="error">请输入有效金额。</p>';if(a>limit)return s.innerHTML='<p class="error"><b>可用余额不足</b><br>当前来源可用 ¥'+limit.toLocaleString()+'，转账未发生。</p><button onclick="recoverWallet()">改用青禾储蓄卡</button>';s.innerHTML='<b>请核对</b><div class="row"><span>收款人</span><strong>'+payee+'</strong></div><div class="row"><span>金额</span><strong>¥'+a.toFixed(2)+'</strong></div><button onclick="pay('+a+')">确认转账</button>'}function recoverWallet(){document.getElementById('fund-source').selectedIndex=1;review()}function pay(a){document.getElementById('wallet-sheet').innerHTML='<div class="receipt"><div class="seal">✓</div><h2>转账成功</h2><p>'+payee+' 已收款 ¥'+a.toFixed(2)+'</p><small>凭证 QY-814-2036</small></div>'}</script></body></html>
