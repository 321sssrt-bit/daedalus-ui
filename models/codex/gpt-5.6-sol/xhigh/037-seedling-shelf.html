<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>新芽清单</title><style>
:root{--mint:#dff4df;--cream:#fffdf3;--ink:#1e3b2d;--muted:#6d8878;--green:#2d8155;--sun:#f5b94c;--danger:#c75b56}*{box-sizing:border-box}body{margin:0;background:#edf0e8;font-family:system-ui,"Microsoft YaHei",sans-serif;color:var(--ink)}.phone{width:min(390px,100%);min-height:760px;margin:20px auto;background:var(--cream);border-radius:34px;overflow:hidden;box-shadow:0 20px 60px #49645130;position:relative}.top{padding:26px 24px 14px;display:flex;justify-content:space-between;align-items:center}.logo{font-weight:800}.avatar{width:34px;height:34px;border-radius:50%;background:var(--sun);display:grid;place-items:center}.empty{padding:70px 30px 30px;text-align:center}.pot{width:150px;height:135px;margin:auto;position:relative}.pot:before{content:"";position:absolute;left:35px;bottom:0;width:82px;height:63px;background:#d37e54;clip-path:polygon(0 0,100% 0,84% 100%,16% 100%)}.stem{position:absolute;width:8px;height:75px;background:var(--green);left:72px;bottom:55px}.leaf{position:absolute;width:48px;height:27px;background:var(--mint);border:3px solid var(--green);border-radius:100% 0 100% 0;left:75px;top:22px;transform:rotate(-12deg)}.leaf.two{left:30px;top:48px;transform:rotate(200deg)}h1{font-size:25px;margin:28px 0 8px}.empty p{color:var(--muted);font-size:14px;line-height:1.6}.primary{border:0;border-radius:14px;background:var(--green);color:white;padding:14px 26px;font-weight:700;cursor:pointer;margin-top:12px}.new{display:none;margin:18px 24px;padding:18px;background:var(--mint);border-radius:18px}.new.show{display:block}.new input{width:100%;padding:12px;border:1px solid #93bca1;border-radius:10px;background:white;font:inherit}.new button{margin-top:10px;border:0;background:var(--ink);color:white;padding:10px 14px;border-radius:9px}.bottom{position:absolute;bottom:0;left:0;right:0;padding:15px 24px 22px;border-top:1px solid #dfe7dc;display:flex;justify-content:space-around;color:var(--muted);font-size:12px}.bottom b{color:var(--green)}@media(max-width:430px){.phone{margin:0;min-height:100vh;border-radius:0}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style></head><body><main class="phone"><header class="top"><div class="logo">芽册</div><div class="avatar">禾</div></header><section class="empty" id="empty-state"><div class="pot"><i class="stem"></i><i class="leaf"></i><i class="leaf two"></i></div><h1>这里正等第一件小事</h1><p>把想开始的事种下来。哪怕只有五分钟，也算今天发了一颗芽。</p><button class="primary" onclick="showForm()">种下第一件事</button></section><section class="new" id="create-card"><b>第一颗种子叫什么？</b><p><input id="seed-name" value="读十页书" aria-label="事项名称"></p><button onclick="createSeed()">放进今天</button></section><nav class="bottom"><b>今天</b><span>花园</span><span>回顾</span><span>我的</span></nav></main><script>function showForm(){document.getElementById('empty-state').style.display='none';document.getElementById('create-card').classList.add('show')}function createSeed(){const name=document.getElementById('seed-name').value.trim()||'未命名小事';document.getElementById('create-card').innerHTML='<b>🌱 '+name+'</b><p>已种下，今天完成 0 / 1</p><button onclick="this.parentElement.innerHTML=\'<b>✓ 今天发芽了</b><p>完成 1 / 1，明天继续。</p>\'">标记完成</button>'}</script></body></html>
