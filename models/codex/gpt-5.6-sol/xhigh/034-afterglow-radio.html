<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>余晖电台 · 正在播放</title><style>
:root{--night:#15182a;--case:#292c43;--screen:#efb35d;--cream:#fff2d3;--muted:#9296ad;--pink:#e75b78;--cyan:#5cc6c2;--black:#10111b}*{box-sizing:border-box}body{margin:0;background:#080914;color:var(--cream);font-family:"Avenir Next","Microsoft YaHei",Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px;background-image:radial-gradient(circle at 50% 20%,#29274c 0,transparent 46%)}.phone{width:min(390px,100%);height:min(820px,calc(100vh - 32px));min-height:690px;background:var(--night);border:8px solid #05060b;border-radius:46px;overflow:hidden;position:relative;box-shadow:0 30px 70px #000}.screen{height:100%;padding:24px 22px 32px;display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;align-items:center}.station{font:800 10px ui-monospace,Consolas,monospace;letter-spacing:2px;color:var(--cyan)}.top button{border:0;background:transparent;color:var(--cream);font-size:22px}.art{margin:28px auto 25px;width:100%;aspect-ratio:1;background:var(--case);border:2px solid #565a77;border-radius:28px;position:relative;overflow:hidden;box-shadow:0 18px 32px rgba(0,0,0,.38)}.sun{position:absolute;width:210px;height:210px;border-radius:50%;background:var(--screen);left:50%;top:24%;transform:translateX(-50%);box-shadow:0 0 0 22px rgba(239,179,93,.08),0 0 0 48px rgba(239,179,93,.04)}.horizon{position:absolute;left:0;right:0;bottom:0;height:46%;background:repeating-linear-gradient(0deg,var(--night) 0 15px,#373953 15px 17px);clip-path:polygon(0 48%,18% 22%,34% 42%,53% 9%,70% 38%,84% 19%,100% 42%,100% 100%,0 100%)}.cassette{position:absolute;width:180px;height:92px;background:var(--cream);border:5px solid var(--black);left:50%;bottom:22px;transform:translateX(-50%) rotate(-4deg);padding:11px}.cassette:before,.cassette:after{content:"";position:absolute;width:35px;height:35px;border:7px solid var(--black);border-radius:50%;top:37px}.cassette:before{left:28px}.cassette:after{right:28px}.cassette b{color:var(--pink);font:900 12px ui-monospace,Consolas,monospace}.info{text-align:center}.info h1{font-size:25px;margin:0 0 7px}.info p{font-size:12px;color:var(--muted);margin:0}.progress{margin:24px 0 20px}.track{height:5px;background:#41445c;position:relative;cursor:pointer}.track i{display:block;width:38%;height:100%;background:var(--pink)}.track i:after{content:"";float:right;width:13px;height:13px;background:var(--cream);border-radius:50%;transform:translate(5px,-4px)}.times{display:flex;justify-content:space-between;color:var(--muted);font:10px ui-monospace,Consolas,monospace;margin-top:8px}.controls{display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;text-align:center}.controls button{border:0;background:transparent;color:var(--cream);font-size:29px;cursor:pointer}.controls .play{width:66px;height:66px;border-radius:50%;background:var(--cream);color:var(--night);font-size:25px;margin:auto;box-shadow:0 0 0 7px #363950}.extras{display:flex;justify-content:space-between;margin-top:auto}.extras button{border:0;background:transparent;color:var(--muted);font-size:17px;cursor:pointer}.queue{position:absolute;inset:auto 0 0;background:var(--cream);color:var(--night);padding:24px;transform:translateY(105%);transition:.25s;z-index:3;border-radius:26px 26px 0 0}.queue.show{transform:none}.queue h2{font-size:20px;margin:0 0 12px}.song{padding:12px 0;border-bottom:1px solid #d3c8ad;font-size:12px}.song.playing{color:var(--pink);font-weight:800}.queue .close{position:absolute;right:18px;top:15px;border:0;background:transparent;font-size:21px}.toast{text-align:center;color:var(--cyan);font-size:11px;min-height:16px;margin-top:7px}button:focus-visible,.track:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}@media(max-width:430px){body{padding:0}.phone{width:100%;height:100vh;max-height:none;border:0;border-radius:0}.art{max-height:330px;max-width:330px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}.cassette{transform:translateX(-50%)}}
</style></head><body><main class="phone"><div class="screen"><header class="top"><span class="station">AFTERGLOW FM · 93.7</span><button id="more" aria-label="更多">•••</button></header><div class="art" role="img" aria-label="山脊落日与磁带封面"><div class="sun"></div><div class="horizon"></div><div class="cassette"><b>SIDE A / 04</b></div></div><section class="info"><h1 id="title">穿过没有灯的桥</h1><p id="artist">北纬乐队 ·《夜航手册》</p></section><div class="progress"><div class="track" id="track" role="slider" tabindex="0" aria-valuemin="0" aria-valuemax="100" aria-valuenow="38"><i id="fill"></i></div><div class="times"><span id="current">1:48</span><span>4:42</span></div></div><div class="controls"><button id="prev" aria-label="上一首">‹</button><button class="play" id="play" aria-label="暂停">Ⅱ</button><button id="next" aria-label="下一首">›</button></div><div class="toast" id="toast" aria-live="polite">正在播放 · 高品质</div><div class="extras"><button id="like" aria-label="收藏">♡</button><button id="queueBtn" aria-label="播放队列">≡</button><button id="timer" aria-label="定时关闭">◷</button></div></div><section class="queue" id="queue"><button class="close" id="close">×</button><h2>接下来播放</h2><div class="song playing">04　穿过没有灯的桥 · 4:42</div><div class="song">05　旧港口的雨 · 3:58</div><div class="song">06　天台气象站 · 5:11</div></section></main><script>
const songs=[['穿过没有灯的桥','北纬乐队 ·《夜航手册》'],['旧港口的雨','南方信号 ·《潮汐线》'],['天台气象站','临界点 ·《城市云层》']];let i=0,playing=true;play.onclick=()=>{playing=!playing;play.textContent=playing?'Ⅱ':'▶';play.setAttribute('aria-label',playing?'暂停':'播放');toast.textContent=playing?'正在播放 · 高品质':'已暂停 · 进度已保留'};function setSong(n){i=(n+songs.length)%songs.length;title.textContent=songs[i][0];artist.textContent=songs[i][1];fill.style.width='0%';current.textContent='0:00';toast.textContent=`正在播放 · ${songs[i][0]}`}next.onclick=()=>setSong(i+1);prev.onclick=()=>setSong(i-1);track.onclick=e=>{const p=Math.round(e.offsetX/track.clientWidth*100);fill.style.width=p+'%';track.setAttribute('aria-valuenow',p);current.textContent=`${Math.floor(p*282/100/60)}:${String(Math.floor(p*282/100)%60).padStart(2,'0')}`};like.onclick=()=>{like.textContent=like.textContent==='♡'?'♥':'♡';toast.textContent=like.textContent==='♥'?'已收藏这首歌':'已取消收藏'};queueBtn.onclick=()=>queue.classList.add('show');close.onclick=()=>queue.classList.remove('show');timer.onclick=()=>toast.textContent='将在 30 分钟后停止播放';
</script></body></html>
