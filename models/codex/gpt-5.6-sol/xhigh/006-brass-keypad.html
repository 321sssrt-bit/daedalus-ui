<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>黄铜门铃 · 二次验证</title><style>
:root{--bg:#2b211a;--surface:#433124;--text:#f5e7cd;--muted:#b9a486;--accent:#e0b55e;--success:#73b18c;--danger:#e36c60;--deep:#17110d}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 30%,#553d2b,var(--bg) 48%,var(--deep));color:var(--text);font-family:ui-monospace,"Cascadia Mono","Microsoft YaHei",monospace;display:grid;place-items:center;padding:24px}.device{width:min(820px,100%);background:linear-gradient(135deg,#5a4430,#38281d);border:1px solid #806344;border-radius:42px;padding:18px;box-shadow:inset 0 1px #a28056,0 45px 90px #0009}.inner{border:2px solid #1d1510;border-radius:30px;display:grid;grid-template-columns:270px 1fr;min-height:520px;overflow:hidden}.side{background:var(--deep);padding:34px;border-right:1px solid #806344;display:flex;flex-direction:column;justify-content:space-between}.brand{color:var(--accent);font-weight:800;letter-spacing:.16em}.dial{width:150px;height:150px;border:12px double #85643a;border-radius:50%;margin:auto;display:grid;place-items:center;box-shadow:inset 0 0 0 12px #2b211a}.dial:after{content:"02";font-size:46px;font-weight:800;color:var(--accent)}.security{font-size:11px;line-height:1.7;color:var(--muted)}.panel{padding:46px;background:linear-gradient(#453326,#39281e)}.panel h1{font:600 31px/1.2 Georgia,"Songti SC",serif;margin:0 0 12px}.panel>p{color:var(--muted);line-height:1.65;font-size:13px}.digits{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:32px 0}.digits input{min-width:0;height:62px;border:1px solid #92724d;border-radius:8px;background:#201711;color:var(--accent);text-align:center;font:800 26px monospace;outline:none;box-shadow:inset 0 4px 9px #0008}.digits input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #e0b55e22,inset 0 4px 9px #0008}.verify{height:52px;width:100%;border:1px solid #f0ca79;border-radius:8px;background:linear-gradient(#e7c16f,#b88739);color:#281b0f;font:800 13px monospace;cursor:pointer;text-shadow:0 1px #fff8}.tools{display:flex;justify-content:space-between;align-items:center;margin-top:18px;color:var(--muted);font-size:12px}.resend{border:0;background:none;color:var(--accent);font:inherit;cursor:pointer;text-decoration:underline}.resend:disabled{color:#766753;text-decoration:none}.feedback{min-height:54px;margin-top:26px;padding:13px;border:1px dashed #806344;color:var(--muted);font-size:12px;line-height:1.5}.feedback.bad{color:var(--danger);border-color:var(--danger)}.feedback.good{color:var(--success);border-color:var(--success)}
@media(max-width:700px){.inner{grid-template-columns:1fr}.side{display:none}.panel{padding:36px 22px}.digits{gap:5px}}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body><main class="device"><section class="inner"><aside class="side"><div class="brand">BELLHOUSE / 1926</div><div class="dial" aria-hidden="true"></div><p class="security">安全通道 #481<br>端到端加密<br>本次位置：香港</p></aside><section class="panel"><h1>请按下第二道门铃</h1><p>我们已向尾号 5812 的设备发送六位验证码。正确演示码为 <b>381204</b>；连续三次错误会暂时锁定。</p><div class="digits"> <input maxlength="1" inputmode="numeric" aria-label="第1位"><input maxlength="1" inputmode="numeric" aria-label="第2位"><input maxlength="1" inputmode="numeric" aria-label="第3位"><input maxlength="1" inputmode="numeric" aria-label="第4位"><input maxlength="1" inputmode="numeric" aria-label="第5位"><input maxlength="1" inputmode="numeric" aria-label="第6位"></div><button class="verify" id="verify">确认是我本人</button><div class="tools"><span>验证码 <b id="clock">00:45</b> 后失效</span><button id="resend" class="resend" disabled>重新发送</button></div><div class="feedback" id="feedback" role="status">验证记录会显示在安全中心。</div></section></section></main><script>
const ds=[...document.querySelectorAll('.digits input')];let tries=0,left=45,locked=false;ds.forEach((x,i)=>x.oninput=()=>{x.value=x.value.replace(/\D/g,'');if(x.value&&ds[i+1])ds[i+1].focus()});verify.onclick=()=>{if(locked)return;const ok=ds.map(x=>x.value).join('')==='381204';if(ok){feedback.className='feedback good';feedback.textContent='门铃已响应，身份确认完成。'}else{tries++;feedback.className='feedback bad';feedback.textContent=tries>=3?'已连续错误 3 次。验证锁定 30 秒，请稍后重试。':`验证码不正确，还可尝试 ${3-tries} 次。`;if(tries>=3){locked=true;verify.disabled=true}}};const t=setInterval(()=>{left--;clock.textContent=`00:${String(Math.max(0,left)).padStart(2,'0')}`;if(left<=0){clearInterval(t);resend.disabled=false;clock.textContent='00:00'}},1000);resend.onclick=()=>{left=45;resend.disabled=true;feedback.className='feedback';feedback.textContent='新验证码已发出，请查看可信设备。'};
</script></body></html>
