<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>胶带工场 · 看板</title><style>
:root{--bg:#c7b894;--surface:#efe5cf;--text:#2b261d;--muted:#6f6654;--accent:#e95034;--success:#44765a;--danger:#bd4537;--yellow:#f5d86f;--blue:#a9cce2;--pink:#e9b6bc}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background-color:var(--bg);background-image:radial-gradient(#8d8165 1px,transparent 1px);background-size:18px 18px;color:var(--text);font-family:"Comic Sans MS",ui-rounded,"Microsoft YaHei",system-ui,sans-serif}.header{height:78px;background:var(--surface);border-bottom:2px solid #6f634a;display:flex;justify-content:space-between;align-items:center;padding:0 30px;box-shadow:0 4px 0 #766b52}.header h1{font-size:26px;margin:0;transform:rotate(-1deg)}.header h1 span{background:var(--yellow);padding:3px 9px}.new{height:44px;border:2px solid var(--text);background:var(--accent);color:white;padding:0 18px;font-weight:900;cursor:pointer;box-shadow:4px 4px 0 var(--text);transform:rotate(1deg)}.board{padding:30px;display:grid;grid-template-columns:repeat(3,minmax(250px,1fr));gap:24px;overflow-x:auto}.column{min-width:250px;background:#ffffff55;border:1px solid #9a8e70;border-radius:4px;padding:16px;min-height:calc(100vh - 140px)}.colhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.colhead h2{font-size:18px;margin:0}.count{width:27px;height:27px;border-radius:50%;background:var(--text);color:white;display:grid;place-items:center;font:800 12px system-ui}.cards{display:grid;gap:18px}.card{background:#fff9e9;padding:18px 16px 16px;box-shadow:3px 5px 9px #52482f42;position:relative;cursor:pointer;transition:.16s;transform:rotate(-.5deg)}.card:nth-child(even){transform:rotate(.7deg)}.card:before{content:"";position:absolute;width:72px;height:22px;background:#e8d8a8aa;left:50%;top:-10px;transform:translateX(-50%) rotate(-2deg)}.card:hover{transform:rotate(0) translateY(-3px)}.card h3{font-size:15px;line-height:1.4;margin:6px 0 14px}.meta{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font:600 11px system-ui}.avatar{width:26px;height:26px;border-radius:50%;background:var(--blue);display:grid;place-items:center;color:#233b4a;font-weight:900}.tag{display:inline-block;padding:4px 7px;background:var(--pink);font:700 10px system-ui;margin-bottom:6px}.move{display:none;margin-top:14px;gap:6px}.card.open .move{display:flex}.move button{border:1px solid #8f846e;background:#f4ead5;padding:5px 8px;font:700 10px system-ui;cursor:pointer}.addbox{display:none;position:fixed;inset:0;background:#2b261d88;place-items:center;z-index:3}.addbox.show{display:grid}.dialog{width:min(420px,calc(100% - 32px));background:#fff7df;border:2px solid var(--text);padding:28px;box-shadow:10px 10px 0 var(--text)}.dialog h2{margin-top:0}.dialog input{width:100%;height:48px;border:2px solid var(--text);padding:0 12px;background:white;font-size:15px}.dialog .row{display:flex;gap:8px;margin-top:18px}.dialog button{flex:1;height:42px;border:2px solid var(--text);background:white;font-weight:800;cursor:pointer}.dialog .save{background:var(--success);color:white}
@media(max-width:850px){.board{grid-template-columns:repeat(3,280px)}.header{padding:0 16px}}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body><header class="header"><h1><span>胶带工场</span> / 秋季发布</h1><button class="new" id="new">＋ 新建一条</button></header><main class="board"><section class="column" data-col="todo"><div class="colhead"><h2>还没开工</h2><b class="count">3</b></div><div class="cards"><article class="card"><span class="tag">文案</span><h3>为新首页写三种开场句</h3><div class="meta"><span>周五</span><i class="avatar">夏</i></div><div class="move"><button data-to="doing">移到进行中 →</button></div></article><article class="card"><span class="tag" style="background:var(--blue)">研究</span><h3>整理六位用户的首屏反馈</h3><div class="meta"><span>8 月 18</span><i class="avatar">屿</i></div><div class="move"><button data-to="doing">移到进行中 →</button></div></article><article class="card"><span class="tag" style="background:var(--yellow)">设计</span><h3>补齐移动端空状态插画</h3><div class="meta"><span>下周</span><i class="avatar">青</i></div><div class="move"><button data-to="doing">移到进行中 →</button></div></article></div></section><section class="column" data-col="doing"><div class="colhead"><h2>手上正做</h2><b class="count">2</b></div><div class="cards"><article class="card"><span class="tag" style="background:var(--yellow)">设计</span><h3>确定秋季主题的四组颜色</h3><div class="meta"><span>今天</span><i class="avatar">禾</i></div><div class="move"><button data-to="done">完成 →</button></div></article><article class="card"><span class="tag">文案</span><h3>校对发布说明与帮助入口</h3><div class="meta"><span>明天</span><i class="avatar">莫</i></div><div class="move"><button data-to="done">完成 →</button></div></article></div></section><section class="column" data-col="done"><div class="colhead"><h2>已经贴好</h2><b class="count">2</b></div><div class="cards"><article class="card"><span class="tag" style="background:#b9d7ad">完成</span><h3>确认发布日期与回滚窗口</h3><div class="meta"><span>昨天</span><i class="avatar">宁</i></div></article><article class="card"><span class="tag" style="background:#b9d7ad">完成</span><h3>上线前浏览器兼容检查</h3><div class="meta"><span>周一</span><i class="avatar">岑</i></div></article></div></section></main><div class="addbox" id="addbox"><form class="dialog" id="form"><h2>在「还没开工」贴一张</h2><input id="task" required placeholder="写清要完成的事"><div class="row"><button type="button" id="cancel">取消</button><button class="save" type="submit">贴上看板</button></div></form></div><script>
const recount=()=>document.querySelectorAll('.column').forEach(c=>c.querySelector('.count').textContent=c.querySelectorAll('.card').length);document.addEventListener('click',e=>{const card=e.target.closest('.card');if(e.target.matches('[data-to]')){e.stopPropagation();document.querySelector(`[data-col="${e.target.dataset.to}"] .cards`).append(card);card.classList.remove('open');recount()}else if(card)card.classList.toggle('open')});document.querySelector('#new').onclick=()=>addbox.classList.add('show');cancel.onclick=()=>addbox.classList.remove('show');form.onsubmit=e=>{e.preventDefault();const a=document.createElement('article');a.className='card';a.innerHTML=`<span class="tag">新任务</span><h3>${task.value.replace(/[<>]/g,'')}</h3><div class="meta"><span>待安排</span><i class="avatar">我</i></div><div class="move"><button data-to="doing">移到进行中 →</button></div>`;document.querySelector('[data-col="todo"] .cards').append(a);task.value='';addbox.classList.remove('show');recount()};
</script></body></html>
