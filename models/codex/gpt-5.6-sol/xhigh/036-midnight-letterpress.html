<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>午夜投递</title><style>
:root{--night:#0e1530;--panel:#172143;--ink:#eef1ff;--muted:#8792bd;--electric:#91a7ff;--pink:#ff7ab8;--ok:#71e2ba}*{box-sizing:border-box}body{margin:0;background:#080d20;color:var(--ink);font-family:ui-monospace,"Cascadia Mono","Microsoft YaHei",monospace}.phone{width:min(390px,100%);min-height:760px;margin:20px auto;background:var(--night);border:1px solid #26325f;box-shadow:0 0 60px #5b6fff26;padding:20px;position:relative}.brand{display:flex;justify-content:space-between;color:var(--electric);font-size:12px;letter-spacing:.16em}.pulse{width:8px;height:8px;border-radius:50%;background:var(--pink);box-shadow:0 0 14px var(--pink)}h1{font:700 28px/1.1 system-ui;margin:34px 0 8px}.sub{color:var(--muted);font-size:12px;margin-bottom:22px}label{display:block;color:var(--muted);font-size:11px;margin:14px 0 6px}input,textarea{width:100%;background:var(--panel);border:1px solid #32406f;color:var(--ink);padding:13px;font:inherit;outline:none}textarea{height:265px;resize:none;line-height:1.65}input:focus,textarea:focus{border-color:var(--electric);box-shadow:0 0 0 2px #91a7ff22}.count{display:flex;justify-content:space-between;margin-top:7px;color:var(--muted);font-size:11px}.actions{display:grid;grid-template-columns:1fr 1.5fr;gap:10px;margin-top:20px}button{padding:13px;border:1px solid #3b4a7a;background:transparent;color:var(--ink);font:600 13px inherit;cursor:pointer}button.primary{border:0;background:linear-gradient(100deg,var(--electric),var(--pink));color:#0a1028}.status{margin-top:14px;min-height:24px;color:var(--ok);font-size:12px}.stamp{position:absolute;right:25px;top:100px;border:1px solid var(--pink);color:var(--pink);padding:6px 9px;transform:rotate(5deg);font-size:10px}@media(max-width:430px){.phone{margin:0;min-height:100vh}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style></head><body><main class="phone"><header class="brand"><b>NIGHT POST / 23:48</b><i class="pulse"></i></header><h1>把今天寄往明天</h1><p class="sub">无人催促的公开信，只在你按下投递后出现。</p><div class="stamp">草稿 01</div><label for="post-title">标题</label><input id="post-title" value="城市熄灯以后"><label for="post-body">正文</label><textarea id="post-body" oninput="count()">末班车驶过桥面，像一条发亮的针脚。今晚我终于明白，安静不是没有声音，而是每种声音都有了自己的位置。</textarea><div class="count"><span id="compose-count">0 字</span><span>状态：仅自己可见</span></div><div class="actions"><button onclick="saveDraft()">存入草稿</button><button class="primary" onclick="publish()">投递到凌晨</button></div><div class="status" id="compose-status" aria-live="polite"></div></main><script>function count(){document.getElementById('compose-count').textContent=document.getElementById('post-body').value.length+' 字'}function saveDraft(){document.getElementById('compose-status').textContent='草稿已保存 · 23:48'}function publish(){const title=document.getElementById('post-title').value.trim(),body=document.getElementById('post-body').value.trim();document.getElementById('compose-status').textContent=title&&body?'已投递，编号 NP-2407':'标题和正文都要写完'}count()</script></body></html>
