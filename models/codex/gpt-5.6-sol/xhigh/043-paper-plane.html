<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>纸鸢信箱</title><style>
:root{--air:#dcecff;--paper:#fff;--ink:#20334a;--muted:#788ca3;--blue:#407bc1;--yellow:#f2c75c;--ok:#4c9073;--danger:#d85858}*{box-sizing:border-box}body{margin:0;background:#bccce0;font-family:system-ui,"Microsoft YaHei",sans-serif;color:var(--ink)}.phone{width:min(390px,100%);height:760px;margin:20px auto;background:var(--air);display:grid;grid-template-rows:auto auto 1fr auto;box-shadow:0 25px 70px #34506f55}.head{padding:18px 18px 12px;background:var(--paper);display:flex;align-items:center;gap:12px}.head i{width:40px;height:40px;border-radius:12px;background:var(--yellow);display:grid;place-items:center;font-style:normal}.head small{display:block;color:var(--ok)}.chats{display:flex;gap:8px;padding:10px 12px;overflow:hidden}.chat{border:1px solid #a9c2df;background:#edf6ff;padding:7px 12px;border-radius:18px;color:var(--muted);cursor:pointer}.chat.active{background:var(--blue);color:white}.messages{padding:16px;overflow:auto;background-image:radial-gradient(#9bb9d8 1px,transparent 1px);background-size:18px 18px}.bubble{max-width:78%;padding:11px 13px;background:white;border-radius:4px 16px 16px 16px;margin:9px 0;box-shadow:0 4px 12px #607f9b22}.bubble.me{margin-left:auto;background:#fff3c7;border-radius:16px 4px 16px 16px}.bubble small{display:block;color:var(--muted);margin-top:5px}.bubble.fail{border:1px solid var(--danger)}.bubble.fail small{color:var(--danger)}.retry{border:0;background:none;color:var(--danger);text-decoration:underline;cursor:pointer}.compose{background:white;padding:11px;display:grid;grid-template-columns:1fr auto;gap:8px}.compose input{border:1px solid #c2d1df;border-radius:20px;padding:11px 14px}.compose button{border:0;border-radius:50%;width:42px;background:var(--blue);color:white;font-size:18px;cursor:pointer}.fail-next{grid-column:1/3;font-size:11px;color:var(--muted)}@media(max-width:430px){.phone{margin:0;height:100vh}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style></head><body><main class="phone"><header class="head"><i>纸</i><div><b id="chat-name">阿澄</b><small>在线 · 风从海边来</small></div></header><nav class="chats"><button class="chat active" onclick="chat(this,'阿澄')">阿澄</button><button class="chat" onclick="chat(this,'山屋小组')">山屋小组</button><button class="chat" onclick="chat(this,'留声机')">留声机</button></nav><section class="messages" id="message-list"><div class="bubble">明天六点，旧码头见？<small>18:21</small></div><div class="bubble me">我带热咖啡。<small>已送达 · 18:22</small></div></section><footer class="compose"><input id="message-input" value="我会准时到。" aria-label="消息"><button onclick="sendMessage()" aria-label="发送">➤</button><label class="fail-next"><input type="checkbox" id="fail-next"> 测试：让下一条消息发送失败</label></footer></main><script>function chat(el,n){document.querySelectorAll('.chat').forEach(x=>x.classList.remove('active'));el.classList.add('active');document.getElementById('chat-name').textContent=n}function sendMessage(){const input=document.getElementById('message-input'),text=input.value.trim();if(!text)return;const fail=document.getElementById('fail-next').checked,b=document.createElement('div');b.className='bubble me'+(fail?' fail':'');b.innerHTML='<span></span><small></small>';b.querySelector('span').textContent=text;b.querySelector('small').innerHTML=fail?'发送失败 · 内容已保留　<button class="retry" onclick="retryMessage(this)">重试</button>':'已送达 · 刚刚';document.getElementById('message-list').append(b);input.value='';document.getElementById('fail-next').checked=false;b.scrollIntoView()}function retryMessage(btn){const b=btn.closest('.bubble');b.classList.remove('fail');b.querySelector('small').textContent='已送达 · 重试成功'}</script></body></html>
