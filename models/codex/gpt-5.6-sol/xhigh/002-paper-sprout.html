<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>纸芽 · 注册</title><style>
:root{--bg:#f2eadc;--surface:#fffdf8;--text:#253027;--muted:#6f786e;--accent:#d94f36;--success:#357a55;--danger:#b6322b;--ink:#253027}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Georgia,"Songti SC","Noto Serif CJK SC",serif;min-height:100vh}.page{min-height:100vh;display:grid;grid-template-columns:.85fr 1.15fr}.cover{padding:48px;display:flex;flex-direction:column;justify-content:space-between;background:var(--ink);color:#f8f0df;position:relative;overflow:hidden}.cover:after{content:"";position:absolute;width:460px;height:460px;border:80px solid #97a56a;border-radius:48% 52% 60% 40%;right:-260px;bottom:-220px;transform:rotate(18deg)}.logo{font:800 22px/1 system-ui;letter-spacing:.12em}.issue{font:500 12px/1 system-ui;color:#d8cebb;writing-mode:vertical-rl;position:absolute;right:26px;top:42px}.quote{position:relative;z-index:1;max-width:440px}.quote b{display:block;color:#f4b49e;font:700 12px/1 system-ui;letter-spacing:.16em;margin-bottom:22px}.quote h1{font-size:clamp(46px,6vw,84px);line-height:.98;margin:0 0 24px;font-weight:500;letter-spacing:-.05em}.quote p{font-size:16px;line-height:1.8;color:#d8cebb}.formwrap{background:var(--surface);margin:24px 24px 24px 0;border-radius:0 24px 24px 0;padding:clamp(40px,8vw,100px);display:flex;align-items:center}.form{width:min(520px,100%)}.kicker{font:800 12px/1 system-ui;color:var(--accent);letter-spacing:.14em}.form h2{font-size:42px;margin:14px 0 8px}.lead{color:var(--muted);margin-bottom:32px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.field{display:grid;gap:8px;margin-bottom:18px}.field.full{grid-column:1/-1}label{font:700 13px/1.3 system-ui}input,select{height:52px;border:0;border-bottom:2px solid #c8c1b5;background:transparent;font:500 16px/1 system-ui;color:var(--text);outline:none;padding:0 4px}input:focus,select:focus{border-color:var(--accent)}.roles{display:flex;gap:8px}.role{flex:1;border:1px solid #d8d0c4;background:#fffaf1;padding:12px;border-radius:10px;cursor:pointer;font:700 13px system-ui}.role.active{background:var(--text);color:white;border-color:var(--text)}.cta{width:100%;height:56px;border:0;background:var(--accent);color:white;font:800 15px system-ui;border-radius:2px 18px 2px 18px;cursor:pointer;margin-top:10px}.cta:hover{filter:brightness(.94)}.footer{font:500 13px system-ui;text-align:center;margin-top:22px;color:var(--muted)}a{color:var(--accent)}#status{min-height:20px;color:var(--success);font:600 13px system-ui;margin-top:12px}
@media(max-width:820px){.page{grid-template-columns:1fr}.cover{min-height:42vh}.formwrap{margin:0;padding:38px 24px;border-radius:0}.grid{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body><main class="page"><section class="cover"><div class="logo">PAPERSPROUT</div><div class="issue">ISSUE 01 · BEGIN</div><div class="quote"><b>从一页空白开始</b><h1>把想法种成<br>一本作品。</h1><p>为写作者、编辑与独立出版人准备的安静工作间。你的第一本刊物，可以从今天发芽。</p></div><small>© 2026 纸芽出版工具</small></section><section class="formwrap"><form class="form" id="form"><div class="kicker">CREATE YOUR DESK</div><h2>建立你的编辑桌</h2><p class="lead">两分钟完成，之后随时可以调整。</p><div class="grid"><div class="field"><label for="name">怎么称呼你</label><input id="name" placeholder="例如：林夏" required></div><div class="field"><label for="email">工作邮箱</label><input id="email" type="email" placeholder="name@example.com" required></div><div class="field full"><label>你最常做什么</label><div class="roles"><button type="button" class="role active">写作</button><button type="button" class="role">编辑</button><button type="button" class="role">设计</button></div></div><div class="field full"><label for="password">设置密码</label><input id="password" type="password" minlength="8" placeholder="至少 8 位，建议包含数字" required></div></div><button class="cta" type="submit">种下第一颗纸芽</button><div id="status" role="status"></div><div class="footer">已有账号？ <a href="#" id="login">回到登录</a></div></form></section></main><script>
document.querySelectorAll('.role').forEach(b=>b.onclick=()=>{document.querySelectorAll('.role').forEach(x=>x.classList.remove('active'));b.classList.add('active')});document.querySelector('#form').onsubmit=e=>{e.preventDefault();document.querySelector('#status').textContent='编辑桌已创建，欢迎开始第一本作品。'};document.querySelector('#login').onclick=e=>{e.preventDefault();document.querySelector('#status').textContent='已切换到老朋友登录入口。'};
</script></body></html>
