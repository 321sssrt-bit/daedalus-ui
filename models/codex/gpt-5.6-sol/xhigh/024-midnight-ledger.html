<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>午夜账房 · 结账</title><style>
:root{--navy:#071522;--panel:#0d2233;--cream:#f4eedf;--muted:#90a0ab;--gold:#c9a65b;--green:#72ba91;--red:#d46f68}*{box-sizing:border-box}body{margin:0;background:var(--navy);color:var(--cream);font-family:Georgia,"Songti SC","SimSun",serif;min-height:100vh}.shell{max-width:1260px;margin:auto;min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr}.order{padding:54px clamp(28px,5vw,74px);border-right:1px solid #294052}.brand{font:700 11px Arial,"Microsoft YaHei",sans-serif;letter-spacing:4px;color:var(--gold)}.order h1{font-size:52px;font-weight:400;margin:64px 0 12px}.sub{color:var(--muted);font-style:italic}.items{margin-top:48px}.item{display:grid;grid-template-columns:54px 1fr auto;gap:18px;align-items:center;padding:22px 0;border-bottom:1px solid #294052}.idx{width:42px;height:42px;border:1px solid var(--gold);border-radius:50%;display:grid;place-items:center;color:var(--gold);font-style:italic}.item h2{font-size:18px;margin:0 0 6px;font-weight:400}.item p{font:12px Arial,"Microsoft YaHei",sans-serif;color:var(--muted);margin:0}.amount{font:700 15px Arial,sans-serif}.summary{margin-top:30px}.sumline{display:flex;justify-content:space-between;padding:8px 0;color:var(--muted);font:13px Arial,"Microsoft YaHei",sans-serif}.sumline.total{border-top:1px solid var(--gold);margin-top:10px;padding-top:20px;color:var(--cream);font-family:Georgia,serif;font-size:28px}.pay{padding:54px clamp(28px,5vw,70px);display:flex;flex-direction:column;justify-content:center;background:linear-gradient(150deg,#0d2233,#081a29)}.pay h2{font-size:34px;font-weight:400;margin:0 0 10px}.pay>p{color:var(--muted);font:13px Arial,"Microsoft YaHei",sans-serif;margin:0 0 30px}.method{display:block;border:1px solid #365064;padding:20px;margin:10px 0;cursor:pointer;position:relative}.method:has(input:checked){border-color:var(--gold);background:rgba(201,166,91,.08)}.method input{position:absolute;opacity:0}.method .top{display:flex;justify-content:space-between;align-items:center}.method b{font:700 14px Arial,"Microsoft YaHei",sans-serif}.method span{color:var(--muted);font:12px Arial,"Microsoft YaHei",sans-serif}.dot{width:18px;height:18px;border:1px solid #5a7181;border-radius:50%}.method:has(input:checked) .dot{border:5px solid var(--gold)}.confirm{border:0;background:var(--gold);color:var(--navy);padding:18px;margin-top:26px;font:900 14px Arial,"Microsoft YaHei",sans-serif;letter-spacing:1px;cursor:pointer}.confirm:hover{background:#dfc27e}.secure{text-align:center;color:var(--muted);font:11px Arial,"Microsoft YaHei",sans-serif;margin-top:16px}.method:focus-within,.confirm:focus-visible{outline:3px solid var(--cream);outline-offset:3px}.success{position:fixed;inset:0;background:rgba(4,13,21,.92);display:none;place-items:center;padding:24px}.success.show{display:grid}.receipt{max-width:480px;border:1px solid var(--gold);background:var(--panel);padding:54px;text-align:center}.seal{width:72px;height:72px;border:1px solid var(--green);color:var(--green);border-radius:50%;display:grid;place-items:center;margin:auto;font-size:30px}.receipt h2{font-size:36px;font-weight:400}.receipt p{color:var(--muted);line-height:1.7}.receipt button{background:transparent;border:1px solid var(--cream);color:var(--cream);padding:12px 24px;cursor:pointer}@media(max-width:850px){.shell{grid-template-columns:1fr}.order{border-right:0;border-bottom:1px solid #294052}.order h1{margin-top:38px}.pay{min-height:620px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main class="shell"><section class="order"><div class="brand">NOCTURNE HOUSE · SHANGHAI</div><h1>订单终章</h1><p class="sub">在落款之前，再核对一次你选择的物件。</p><div class="items"><article class="item"><span class="idx">I</span><div><h2>月相黄铜台灯</h2><p>拉丝黄铜 / 暖光 2700K / 1 件</p></div><span class="amount">¥ 1,860</span></article><article class="item"><span class="idx">II</span><div><h2>黑檀木调光钮</h2><p>替换配件 / 1 件</p></div><span class="amount">¥ 180</span></article></div><div class="summary"><div class="sumline"><span>商品</span><span>¥ 2,040</span></div><div class="sumline"><span>保价配送</span><span>¥ 32</span></div><div class="sumline"><span>会员礼遇</span><span>− ¥ 120</span></div><div class="sumline total"><span>应付金额</span><strong>¥ 1,952</strong></div></div></section><section class="pay"><h2>选择支付方式</h2><p>支付信息将由加密通道提交，不会保存在此设备。</p><label class="method"><input type="radio" name="pay" value="尾号 4821" checked><span class="top"><b>银联信用卡 · 4821</b><i class="dot"></i></span><span>账单地址已核验</span></label><label class="method"><input type="radio" name="pay" value="云闪付"><span class="top"><b>云闪付</b><i class="dot"></i></span><span>使用手机完成授权</span></label><label class="method"><input type="radio" name="pay" value="礼品余额"><span class="top"><b>礼品余额</b><i class="dot"></i></span><span>可用 ¥ 2,300</span></label><button class="confirm" id="confirm">确认支付 ¥ 1,952</button><div class="secure">支付即表示同意交付与退换条款 · 预计 8 月 18 日送达</div></section></main><div class="success" id="success" role="dialog" aria-modal="true"><div class="receipt"><div class="seal">✓</div><h2>支付已经落款</h2><p id="paidBy"></p><p>凭证 NH-260814-1952<br>订单将于明日上午交付工坊。</p><button id="close">查看订单</button></div></div><script>
confirm.onclick=()=>{paidBy.textContent=`已通过${document.querySelector('[name=pay]:checked').value}支付 ¥ 1,952。`;success.classList.add('show');close.focus()};close.onclick=()=>success.classList.remove('show');
</script></body></html>
