<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>格物市集</title><style>
:root{--clay:#bb5b39;--cream:#f5ead6;--paper:#fffaf0;--ink:#2d261f;--muted:#807367;--olive:#68704a;--ok:#39705a;--danger:#a63d35}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:system-ui,"Microsoft YaHei",sans-serif}.shell{max-width:1280px;margin:auto;min-height:800px;padding:24px 42px}.nav{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--ink);padding-bottom:17px}.brand{font:800 26px Georgia}.nav small{color:var(--muted)}.layout{display:grid;grid-template-columns:1.4fr .8fr;gap:34px;padding-top:30px}.eyebrow{color:var(--clay);font:700 12px ui-monospace;letter-spacing:.12em}h1{font:600 48px/1.05 Georgia,"Songti SC";margin:8px 0 26px;max-width:680px}.goods{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.good{border:1px solid #cdbda8;background:var(--paper);padding:12px;text-align:left;cursor:pointer}.good.selected{outline:3px solid var(--clay)}.art{height:155px;display:grid;place-items:center;font-size:66px;background:#ddccb1}.good:nth-child(2) .art{background:#b8c1a3}.good:nth-child(3) .art{background:#d6b6ae}.good b,.good span{display:block;margin-top:9px}.good span{color:var(--muted);font-size:12px}.panel{border-left:1px solid #bbae9b;padding-left:30px}.panel h2{font:28px Georgia;margin-top:0}.label{font-size:12px;color:var(--muted);margin:20px 0 8px}.variants,.qty{display:flex;gap:8px}.variants button,.qty button{border:1px solid #aa9b88;background:var(--paper);padding:9px 13px;cursor:pointer}.variants button.active{background:var(--ink);color:white}.qty output{min-width:36px;text-align:center;padding:9px}.add,.checkout{width:100%;margin-top:18px;padding:14px;border:0;background:var(--clay);color:white;font-weight:800;cursor:pointer}.cart{margin-top:22px;background:var(--paper);border:1px solid #cdbda8;padding:16px}.cart-row{display:flex;justify-content:space-between}.checkout{background:var(--olive)}.danger-link{border:0;background:none;color:var(--danger);text-decoration:underline;cursor:pointer;margin-top:12px}.message{margin-top:15px;padding:12px;display:none}.message.show{display:block}.message.error{background:#f4d9d2;color:var(--danger)}.message.ok{background:#d9eadf;color:var(--ok)}.message button{margin-left:10px}.receipt{border:2px dashed var(--ok);padding:16px}@media(max-width:800px){.shell{padding:20px}.layout{grid-template-columns:1fr}.goods{grid-template-columns:1fr 1fr}.panel{border-left:0;padding-left:0}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style></head><body><main class="shell"><header class="nav"><div class="brand">格物市集</div><small>器物 · 今日可送达　　购物袋 <b id="market-count">0</b></small></header><div class="layout"><section><div class="eyebrow">AUTUMN OBJECTS / 08</div><h1>让会被每天触碰的东西，值得多看一眼。</h1><div class="goods"><button class="good selected" onclick="pick(this,'层叠台灯',329)"><span class="art">◒</span><b>层叠台灯</b><span>¥329 · 榉木与棉纸</span></button><button class="good" onclick="pick(this,'折线托盘',168)"><span class="art">⌁</span><b>折线托盘</b><span>¥168 · 手工铜</span></button><button class="good" onclick="pick(this,'晨雾花器',246)"><span class="art">♧</span><b>晨雾花器</b><span>¥246 · 灰陶</span></button></div></section><aside class="panel"><h2 id="market-name">层叠台灯</h2><p>柔和向下的光，适合床头最后二十页。</p><div class="label">颜色 / 规格</div><div class="variants"><button class="active" onclick="variant(this,'燕麦白')">燕麦白</button><button onclick="variant(this,'暮蓝')">暮蓝</button></div><div class="label">数量</div><div class="qty"><button onclick="quantity(-1)">−</button><output id="market-qty">1</output><button onclick="quantity(1)">＋</button></div><button class="add" onclick="addCart()">加入购物袋</button><button class="danger-link" onclick="forceStock()">测试：让当前规格库存不足</button><section class="cart"><b>购物袋</b><p class="cart-row"><span id="market-line">尚未加入商品</span><strong id="market-total">¥0</strong></p><button class="checkout" onclick="checkout()">提交订单</button><div class="message" id="market-message"></div></section></aside></div></main><script>let product='层叠台灯',price=329,variantName='燕麦白',qty=1,inCart=0,forced=false;function pick(el,n,p){document.querySelectorAll('.good').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');product=n;price=p;document.getElementById('market-name').textContent=n;inCart=0;draw()}function variant(el,n){document.querySelectorAll('.variants button').forEach(x=>x.classList.remove('active'));el.classList.add('active');variantName=n;forced=false;hide()}function quantity(n){qty=Math.max(1,Math.min(6,qty+n));document.getElementById('market-qty').textContent=qty;hide()}function addCart(){inCart=qty;draw();hide()}function draw(){document.getElementById('market-count').textContent=inCart?1:0;document.getElementById('market-line').textContent=inCart?product+' · '+variantName+' × '+inCart:'尚未加入商品';document.getElementById('market-total').textContent='¥'+price*inCart}function forceStock(){forced=true;variantName='暮蓝';document.querySelectorAll('.variants button').forEach((x,i)=>x.classList.toggle('active',i===1));inCart=qty;draw();show('error','暮蓝仅余 1 件，当前数量无法提交。<button onclick="recoverStock()">改为燕麦白</button>')}function recoverStock(){forced=false;variantName='燕麦白';qty=Math.min(qty,2);document.getElementById('market-qty').textContent=qty;document.querySelectorAll('.variants button').forEach((x,i)=>x.classList.toggle('active',i===0));inCart=qty;draw();show('ok','已改为有货规格，可以重新提交。')}function checkout(){if(!inCart)return show('error','请先把商品加入购物袋。');if(forced||variantName==='暮蓝'&&inCart>1)return show('error','暮蓝库存不足，订单未提交。<button onclick="recoverStock()">改选有货规格</button>');show('ok','<div class="receipt"><b>订单已生成 GM-260814</b><br>'+product+' · '+variantName+' × '+inCart+'　合计 ¥'+price*inCart+'</div>')}function show(type,text){const m=document.getElementById('market-message');m.className='message show '+type;m.innerHTML=text}function hide(){document.getElementById('market-message').className='message'}</script></body></html>
