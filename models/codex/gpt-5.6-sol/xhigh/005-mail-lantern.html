<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>灯塔邮局 · 找回密码</title><style>
:root{--bg:#bcd9e8;--surface:#fffaf0;--text:#20344a;--muted:#65798a;--accent:#e9683d;--success:#397a62;--danger:#be3e3e;--navy:#234f6f}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(#a8d0e4 0 62%,#6fadc8 62%);color:var(--text);font-family:ui-sans-serif,system-ui,"Microsoft YaHei",sans-serif;display:grid;place-items:center;padding:28px}.scene{width:min(1050px,100%);display:grid;grid-template-columns:1fr 470px;align-items:center;gap:70px}.lighthouse{height:520px;position:relative}.beam{position:absolute;top:70px;left:42%;width:72%;height:100px;background:linear-gradient(90deg,#fff8b899,transparent);clip-path:polygon(0 35%,100% 0,100% 100%,0 65%);transform-origin:left;animation:sweep 6s ease-in-out infinite}.tower{position:absolute;width:120px;height:360px;left:28%;bottom:0;background:repeating-linear-gradient(0deg,#f8ead2 0 60px,#e76a43 60px 120px);clip-path:polygon(20% 0,80% 0,100% 100%,0 100%)}.lamp{position:absolute;width:132px;height:92px;left:calc(28% - 6px);bottom:350px;background:var(--navy);border-radius:10px 10px 0 0}.lamp:before{content:"";position:absolute;inset:18px;background:#ffdb69;border:5px solid var(--surface)}.rock{position:absolute;bottom:-20px;left:8%;width:330px;height:90px;background:#31586b;border-radius:50% 55% 0 0}.card{background:var(--surface);border-radius:3px;padding:46px;box-shadow:9px 10px 0 #234f6f;position:relative}.card:before{content:"POST · 07";position:absolute;top:18px;right:20px;border:2px solid var(--accent);border-radius:50%;padding:12px 9px;color:var(--accent);font:800 10px monospace;transform:rotate(12deg)}.icon{font-size:36px}.card h1{font-family:Georgia,"Songti SC",serif;font-size:38px;margin:16px 0 10px}.card>p{color:var(--muted);line-height:1.65}.field{display:grid;gap:8px;margin:28px 0 16px}label{font-size:13px;font-weight:700}input{height:52px;border:2px solid #a4b5bc;border-radius:3px;background:white;padding:0 14px;font-size:16px;outline:none;color:var(--text)}input:focus{border-color:var(--navy);box-shadow:0 0 0 3px #234f6f22}.btn{height:52px;width:100%;border:0;border-radius:3px;background:var(--accent);color:white;font-weight:800;cursor:pointer}.btn:disabled{background:#9ca9ab}.back{display:block;text-align:center;margin-top:20px;color:var(--navy);font-size:13px}.notice{display:none;margin-top:20px;padding:15px;background:#e0efe5;border-left:4px solid var(--success);color:var(--success);font-size:13px;line-height:1.5}.notice.show{display:block}.count{font-variant-numeric:tabular-nums;font-weight:800}
@keyframes sweep{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(10deg)}}@media(max-width:820px){.scene{grid-template-columns:1fr}.lighthouse{display:none}.card{max-width:520px;margin:auto}}@media(prefers-reduced-motion:reduce){.beam{animation:none}.btn{transition:none}}
</style></head><body><main class="scene"><section class="lighthouse" aria-label="海边灯塔插画"><div class="beam"></div><div class="tower"></div><div class="lamp"></div><div class="rock"></div></section><section class="card"><div class="icon">✉</div><h1>让灯塔把路寄给你</h1><p>输入注册时的邮箱。若账号存在，我们会寄出一封仅 20 分钟有效的安全链接。</p><form id="form"><div class="field"><label for="email">联系邮箱</label><input id="email" type="email" required placeholder="you@example.com"></div><button class="btn" id="send" type="submit">寄出找回信</button></form><div class="notice" id="notice" role="status">信件已寄出。请检查收件箱与垃圾邮件，<span class="count" id="count">60</span> 秒后可再次发送。</div><a class="back" href="#" id="back">← 我想起密码了，回到登录</a></section></main><script>
let timer;form.onsubmit=e=>{e.preventDefault();notice.classList.add('show');send.disabled=true;let n=60;count.textContent=n;clearInterval(timer);timer=setInterval(()=>{n-=1;count.textContent=n;if(n<=0){clearInterval(timer);send.disabled=false;send.textContent='重新寄出找回信';notice.innerHTML='还没收到？你现在可以重新发送。'}},1000)};back.onclick=e=>{e.preventDefault();notice.classList.add('show');notice.textContent='已返回登录入口。'};
</script></body></html>
