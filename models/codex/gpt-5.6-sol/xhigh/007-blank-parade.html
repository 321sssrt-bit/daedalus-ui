<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>空白游行 · 欢迎</title><style>
:root{--bg:#f6f1e6;--surface:#fffdf7;--text:#151515;--muted:#68645e;--accent:#ff4f38;--success:#187c5a;--danger:#c82f3b;--blue:#3765eb;--yellow:#ffd84d}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Arial,"Microsoft YaHei",system-ui,sans-serif;overflow:hidden}.top{height:64px;border-bottom:3px solid var(--text);display:flex;align-items:center;justify-content:space-between;padding:0 30px;background:var(--surface)}.logo{font-weight:900;font-size:22px;letter-spacing:-.05em}.logo i{display:inline-block;width:18px;height:18px;background:var(--accent);border-radius:50%;vertical-align:-2px;margin-right:7px}.top nav{display:flex;gap:24px;font-size:13px;font-weight:700}.avatar{width:34px;height:34px;background:var(--yellow);border:2px solid var(--text);border-radius:50%;display:grid;place-items:center;font-weight:900}.stage{height:calc(100vh - 64px);display:grid;grid-template-columns:1.2fr .8fr;position:relative}.copy{padding:8vh 6vw;position:relative;z-index:2}.index{font-size:12px;font-weight:900;letter-spacing:.2em}.copy h1{font-size:clamp(65px,9vw,138px);line-height:.78;letter-spacing:-.09em;margin:32px 0}.copy h1 span{color:var(--blue)}.copy p{max-width:540px;font-size:18px;line-height:1.65;color:var(--muted)}.actions{display:flex;gap:12px;margin-top:34px}.btn{height:56px;border:3px solid var(--text);padding:0 25px;background:var(--surface);font-weight:900;cursor:pointer;box-shadow:5px 5px 0 var(--text);transition:.15s}.btn.primary{background:var(--accent);color:white}.btn:hover{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--text)}.art{position:relative;border-left:3px solid var(--text);background:var(--yellow);overflow:hidden}.shape{position:absolute;border:3px solid var(--text)}.sun{width:240px;height:240px;background:var(--accent);border-radius:50%;top:9%;left:19%}.door{width:210px;height:370px;background:var(--blue);bottom:-30px;right:12%;border-radius:110px 110px 0 0}.door:after{content:"";position:absolute;width:18px;height:18px;background:var(--yellow);border:3px solid var(--text);border-radius:50%;right:22px;top:190px}.ladder{width:90px;height:310px;left:5%;bottom:0;background:repeating-linear-gradient(0deg,transparent 0 30px,var(--text) 30px 35px);border-width:0 5px}.spark{font-size:72px;right:8%;top:9%;border:0;transform:rotate(15deg)}.result{position:absolute;left:6vw;bottom:28px;font-weight:800;color:var(--success);min-height:22px}.created{display:none;position:absolute;inset:12%;background:var(--surface);border:3px solid var(--text);padding:30px;z-index:4;box-shadow:12px 12px 0 var(--text)}.created.show{display:block}.created h2{font-size:38px;margin:0 0 12px}.mini{height:110px;background:linear-gradient(135deg,var(--blue) 0 45%,var(--yellow) 45%);border:3px solid var(--text);margin:20px 0}.close{float:right;border:0;background:var(--accent);color:white;font-weight:900;width:38px;height:38px;cursor:pointer}
@media(max-width:800px){body{overflow:auto}.stage{grid-template-columns:1fr;height:auto}.copy{min-height:66vh}.art{height:420px;border-left:0;border-top:3px solid var(--text)}.top nav{display:none}}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body><header class="top"><div class="logo"><i></i>开场白</div><nav><span>灵感墙</span><span>项目</span><span>邀请</span></nav><div class="avatar">夏</div></header><main class="stage"><section class="copy"><div class="index">WELCOME / FIRST DAY</div><h1>这里还<br><span>空着。</span></h1><p>很好，第一块空地属于你。建一张灵感墙，把图片、文字和没想明白的念头都先放进来。</p><div class="actions"><button class="btn primary" id="create">创建第一张墙</button><button class="btn" id="tour">看看示例</button></div><div class="result" id="result" role="status"></div></section><section class="art"><div class="shape sun"></div><div class="shape door"></div><div class="shape ladder"></div><div class="shape spark">✦</div><article class="created" id="created"><button class="close" id="close">×</button><small>你的第一个空间</small><h2>未命名的灵感墙</h2><p>空白画布已经备好。拖进第一张图片，或双击写一句话。</p><div class="mini"></div><b>创建于刚刚 · 仅自己可见</b></article></section></main><script>
create.onclick=()=>{created.classList.add('show');result.textContent='第一张墙已创建。'};close.onclick=()=>created.classList.remove('show');tour.onclick=()=>{result.textContent='示例已打开：三分钟认识收集、整理与分享。';document.querySelector('.door').style.background='#ff4f38'};
</script></body></html>
