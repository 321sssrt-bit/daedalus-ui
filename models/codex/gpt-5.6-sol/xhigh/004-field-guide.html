<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>微光野外指南 · 新手引导</title><style>
:root{--bg:#163832;--surface:#f5f0db;--text:#18352f;--muted:#617269;--accent:#ffcc59;--success:#2f765e;--danger:#c85a43;--night:#0d2925}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:ui-rounded,"Microsoft YaHei",system-ui,sans-serif;min-height:100vh;padding:28px}.book{width:min(1180px,100%);min-height:calc(100vh - 56px);margin:auto;background:var(--surface);border-radius:26px;display:grid;grid-template-columns:270px 1fr;overflow:hidden;box-shadow:0 30px 80px #071c1888}.rail{background:var(--night);color:#eaf3df;padding:34px;display:flex;flex-direction:column}.logo{font-weight:800;letter-spacing:.06em}.logo span{color:var(--accent)}.steps{margin:auto 0;display:grid;gap:24px}.step{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:center;color:#809b91;cursor:pointer}.step i{width:28px;height:28px;border:1px solid #547068;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px}.step.active{color:white}.step.active i{background:var(--accent);color:var(--night);border-color:var(--accent)}.skip{border:0;background:transparent;color:#adc2b8;text-align:left;text-decoration:underline;cursor:pointer}.content{position:relative;padding:38px clamp(34px,6vw,86px);display:flex;flex-direction:column}.counter{font:800 12px/1 system-ui;color:var(--muted);letter-spacing:.12em}.scene{flex:1;display:grid;grid-template-columns:1fr .8fr;align-items:center;gap:40px}.copy h1{font-size:clamp(42px,6vw,76px);line-height:.96;letter-spacing:-.06em;margin:16px 0 24px}.copy p{font-size:17px;line-height:1.75;color:var(--muted);max-width:510px}.visual{aspect-ratio:1;border-radius:50% 44% 54% 46%;background:#d7dfb9;position:relative;display:grid;place-items:center;overflow:hidden}.visual svg{width:74%;height:74%}.visual:after{content:"";position:absolute;inset:18px;border:1px dashed #7c9579;border-radius:50%}.tip{display:flex;gap:10px;align-items:center;background:#fff9e8;padding:14px 16px;border-left:4px solid var(--accent);font-size:13px;margin-top:24px}.nav{display:flex;align-items:center;justify-content:space-between;border-top:1px solid #d8d5c6;padding-top:24px}.buttons{display:flex;gap:10px}.btn{height:48px;border:1px solid var(--text);border-radius:24px;padding:0 24px;background:transparent;color:var(--text);font-weight:800;cursor:pointer}.btn.primary{background:var(--text);color:white}.btn:disabled{opacity:.3;cursor:not-allowed}#done{color:var(--success);font-weight:700;min-height:20px}
@media(max-width:800px){body{padding:0}.book{border-radius:0;grid-template-columns:1fr}.rail{padding:18px 24px;display:grid;grid-template-columns:1fr auto}.steps{display:none}.skip{grid-column:2}.scene{grid-template-columns:1fr}.visual{width:210px;margin:auto}.content{min-height:calc(100vh - 76px)}.copy h1{font-size:48px}}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body><main class="book"><aside class="rail"><div class="logo">GLOW<span>FIELD</span> 微光野</div><nav class="steps" id="steps"><div class="step active"><i>1</i><b>标记发现</b></div><div class="step"><i>2</i><b>结伴观察</b></div><div class="step"><i>3</i><b>带走记录</b></div></nav><button class="skip" id="skip">跳过介绍</button></aside><section class="content"><div class="counter" id="counter">FIELD NOTE · 01 / 03</div><div class="scene"><article class="copy"><h1 id="title">看见一束光，<br>就把它标下来。</h1><p id="desc">拍下叶片、云和街角的小发现。微光野会记录位置与时间，替你整理成一册私人自然日志。</p><div class="tip"><span>✦</span><span id="tip">第一次记录不必完美，一句话也可以。</span></div></article><figure class="visual"><svg viewBox="0 0 240 240" fill="none" aria-hidden="true"><path d="M120 198c-15-49-6-98 22-146" stroke="#173a32" stroke-width="5" stroke-linecap="round"/><path d="M133 91c-31 4-49-10-56-36 32-5 51 10 56 36Z" fill="#6a8e62"/><path d="M122 132c27-1 47 15 52 40-29 3-49-13-52-40Z" fill="#f2c653"/><circle cx="73" cy="150" r="22" stroke="#173a32" stroke-width="4"/><path d="m90 166 23 23" stroke="#173a32" stroke-width="6" stroke-linecap="round"/></svg></figure></div><div class="nav"><div id="done" role="status"></div><div class="buttons"><button class="btn" id="prev" disabled>上一步</button><button class="btn primary" id="next">下一步</button></div></div></section></main><script>
const pages=[['看见一束光，<br>就把它标下来。','拍下叶片、云和街角的小发现。微光野会记录位置与时间，替你整理成一册私人自然日志。','第一次记录不必完美，一句话也可以。'],['和熟悉的人，<br>交换观察。','邀请同行者加入小队。你们可以在同一张地图留下不同视角，也能为彼此的发现补充物种线索。','每条共享记录都由你决定谁能看见。'],['季节走过，<br>册页会留下。','按月份回看足迹，把散落的记录编成可收藏的观察册。现在，去记录你的第一束微光。','随时导出，记录一直属于你。']];let i=0;const draw=()=>{title.innerHTML=pages[i][0];desc.textContent=pages[i][1];tip.textContent=pages[i][2];counter.textContent=`FIELD NOTE · 0${i+1} / 03`;[...steps.children].forEach((x,n)=>x.classList.toggle('active',n===i));prev.disabled=i===0;next.textContent=i===2?'开始使用':'下一步'};next.onclick=()=>{if(i<2){i++;draw()}else done.textContent='指南收好啦，正在为你打开第一张地图。'};prev.onclick=()=>{if(i){i--;draw()}};[...steps.children].forEach((x,n)=>x.onclick=()=>{i=n;draw()});skip.onclick=()=>{i=2;draw();done.textContent='已跳到最后一步，你可以立即开始。'};
</script></body></html>
