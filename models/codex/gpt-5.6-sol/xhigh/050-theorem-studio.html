<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>定理研习室</title><style>
:root{--chalk:#153b36;--board:#0e2d29;--paper:#f1ead7;--ink:#26312e;--muted:#807d70;--yellow:#efcf68;--ok:#67ba8b;--danger:#e77b6e}*{box-sizing:border-box}body{margin:0;background:var(--paper);font-family:Georgia,"Songti SC","Microsoft YaHei",serif;color:var(--ink)}.shell{max-width:1280px;min-height:800px;margin:auto;display:grid;grid-template-columns:270px 1fr}.syllabus{border-right:1px solid #bcb39d;padding:28px 22px}.syllabus h1{font-size:24px}.lesson{width:100%;text-align:left;border:0;border-top:1px solid #c8bea8;background:transparent;padding:15px 4px;color:var(--muted);cursor:pointer}.lesson.active{color:var(--ink);font-weight:700}.lesson span{float:right}.room{background:var(--chalk);color:#f4f0df;padding:32px 42px}.room-head{display:flex;justify-content:space-between}.room-head small{color:#a7c2b8}.board{margin-top:28px;border:1px solid #4d6c65;min-height:570px;padding:34px;box-shadow:inset 0 0 35px #071c18}.concept{display:grid;grid-template-columns:1fr 1fr;gap:30px}.formula{font:italic 54px Georgia;color:var(--yellow);display:grid;place-items:center;border:1px dashed #769087}.concept h2{font-size:32px;margin-top:0}.concept p{line-height:1.8;color:#cadbd4}.enter{background:var(--yellow);border:0;color:#192824;padding:12px 18px;font-weight:800;cursor:pointer}.practice{display:none}.practice.show{display:block}.option{display:block;width:100%;border:1px solid #628079;background:transparent;color:white;text-align:left;padding:13px;margin:9px 0;cursor:pointer}.option.selected{background:#315f56;border-color:var(--yellow)}.submit{background:var(--yellow);color:#18332e;border:0;padding:12px 22px;font-weight:800;margin-top:12px}.result{margin-top:18px;padding:16px;display:none}.result.show{display:block}.result.wrong{border-left:5px solid var(--danger);background:#3e2929}.result.correct{border-left:5px solid var(--ok);background:#173e32}.result button{padding:8px 12px;border:0;background:var(--danger);color:white;margin-top:9px}@media(max-width:800px){.shell{grid-template-columns:1fr}.syllabus{display:none}.room{padding:20px}.concept{grid-template-columns:1fr}.formula{min-height:150px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style></head><body><main class="shell"><aside class="syllabus"><small>微观概率 · 第一章</small><h1>理解随机，而不是背答案</h1><button class="lesson">01　样本空间 <span>✓</span></button><button class="lesson">02　独立事件 <span>✓</span></button><button class="lesson active">03　条件概率 <span>→</span></button><button class="lesson">04　贝叶斯更新 <span>○</span></button></aside><section class="room"><header class="room-head"><b>第 03 课 · 条件概率</b><small>课程进度 2 / 4</small></header><article class="board"><section class="concept" id="lesson-concept"><div><h2>已知一件事发生后，世界会变窄。</h2><p>条件概率不是重新掷骰子，而是在已经知道 B 发生的范围里，再数 A 占多少。</p><button class="enter" onclick="enterPractice()">完成阅读，进入练习</button></div><div class="formula">P(A|B)</div></section><section class="practice" id="lesson-practice"><small>练习 1 / 1</small><h2>袋中有 3 枚蓝球、2 枚红球。已知取出的不是红球，它是蓝球的概率？</h2><button class="option" onclick="selectAnswer(this,'wrong')">A. 3 / 5</button><button class="option" onclick="selectAnswer(this,'correct')">B. 1</button><button class="option" onclick="selectAnswer(this,'wrong')">C. 2 / 3</button><button class="submit" onclick="submitAnswer()">提交答案</button><div class="result" id="lesson-result"></div></section></article></section></main><script>let answer='';function enterPractice(){document.getElementById('lesson-concept').style.display='none';document.getElementById('lesson-practice').classList.add('show')}function selectAnswer(el,v){document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');answer=v}function submitAnswer(){const r=document.getElementById('lesson-result');if(!answer){r.className='result show wrong';r.textContent='请先选择一个答案。';return}if(answer==='wrong'){r.className='result show wrong';r.innerHTML='<b>这次没有答对。</b><br>“不是红球”把样本空间缩小为 3 枚蓝球；在这个新范围里，蓝球占 3/3，所以概率是 1。<br><button onclick="retryLesson()">根据解释再次作答</button>';return}r.className='result show correct';r.innerHTML='<b>订正成功 · 答案 B</b><br>你正确地把条件 B 当成了新的样本空间。课程进度已更新为 3 / 4。';document.querySelector('.room-head small').textContent='课程进度 3 / 4'}function retryLesson(){answer='';document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));const r=document.getElementById('lesson-result');r.className='result';r.textContent=''}</script></body></html>
