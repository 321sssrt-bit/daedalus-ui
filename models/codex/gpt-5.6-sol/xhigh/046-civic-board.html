<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>公署协作台</title><style>
:root{--paper:#ece8dc;--white:#faf8f1;--ink:#222a2d;--muted:#727979;--navy:#27485a;--stamp:#b7463e;--ok:#3f735b;--danger:#a33b36}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,"Microsoft YaHei",sans-serif}.shell{min-height:800px;max-width:1280px;margin:auto;border-left:1px solid #bab5a7;border-right:1px solid #bab5a7}.mast{padding:20px 30px;border-bottom:4px double var(--ink);display:flex;justify-content:space-between;align-items:end}.mast h1{font:700 28px Georgia;margin:0}.mast small{font:11px ui-monospace}.layout{display:grid;grid-template-columns:1fr 310px}.work{padding:24px 30px}.create{display:grid;grid-template-columns:1fr 160px auto;gap:8px}.create input,.create select{padding:11px;border:1px solid #99968c;background:var(--white);font:inherit}.create button{border:0;background:var(--navy);color:white;padding:0 18px;font-weight:700}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:24px}.column{border-top:3px solid var(--navy);background:#e1ddd1;padding:12px;min-height:410px}.column h2{font-size:13px;text-transform:uppercase;letter-spacing:.1em}.task{background:var(--white);border:1px solid #bdb7a9;padding:13px;margin:10px 0;position:relative}.task b{display:block}.task small{color:var(--muted)}.task button{margin-top:10px;border:1px solid #8d8a80;background:transparent;padding:6px 9px;cursor:pointer}.restricted:after{content:"受限";position:absolute;right:8px;top:8px;border:1px solid var(--stamp);color:var(--stamp);font:10px ui-monospace;padding:2px 4px;transform:rotate(3deg)}.log{border-left:1px solid #bab5a7;padding:24px 18px;background:var(--white)}.log h2{font:16px Georgia}.event{border-bottom:1px dotted #aaa59a;padding:10px 0;font-size:12px}.event time{display:block;color:var(--muted)}.notice{display:none;margin-top:14px;padding:12px;border:2px solid var(--danger);color:var(--danger);font-size:12px}.notice.show{display:block}.notice button{margin:8px 5px 0 0;padding:7px;border:0;background:var(--danger);color:white}@media(max-width:800px){.layout{grid-template-columns:1fr}.board{grid-template-columns:1fr}.log{border-left:0}.create{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style></head><body><main class="shell"><header class="mast"><h1>市务室 · 协作登记簿</h1><small>档案日 2026-08-14 / 当前席位：编辑</small></header><div class="layout"><section class="work"><div class="create"><input id="task-title" value="整理周末市集摊位图" aria-label="任务名称"><select id="task-owner"><option>分派：林禾</option><option>分派：周岑</option><option>分派：我</option></select><button onclick="createTask()">登记任务</button></div><div class="board"><section class="column" id="todo-column"><h2>01 · 待处理</h2><article class="task"><b>核对公共座椅尺寸</b><small>周岑 · 14:30</small><button onclick="advance(this,'处理中')">推进状态</button></article><article class="task restricted"><b>修改年度预算批次</b><small>财务处 · 仅主管</small><button onclick="restrictedAction()">推进受限任务</button></article></section><section class="column" id="doing-column"><h2>02 · 处理中</h2><article class="task"><b>更新社区路牌文案</b><small>林禾 · 今日</small><button onclick="advance(this,'已完成')">标为完成</button></article></section><section class="column" id="done-column"><h2>03 · 已完成</h2><article class="task"><b>确认雨棚维修时段</b><small>我 · 09:12</small></article></section></div><div class="notice" id="access-notice"></div></section><aside class="log"><h2>活动记录</h2><div id="activity-log"><div class="event">雨棚维修移至已完成<time>09:12 · 由我操作</time></div><div class="event">路牌文案分派给林禾<time>08:47 · 由周岑操作</time></div></div></aside></div></main><script>function addLog(t){const e=document.createElement('div');e.className='event';e.innerHTML=t+'<time>刚刚 · 由我操作</time>';document.getElementById('activity-log').prepend(e)}function createTask(){const title=document.getElementById('task-title').value.trim(),owner=document.getElementById('task-owner').value.replace('分派：','');if(!title)return;const a=document.createElement('article');a.className='task';a.innerHTML='<b></b><small></small><button onclick="advance(this,\'处理中\')">推进状态</button>';a.querySelector('b').textContent=title;a.querySelector('small').textContent=owner+' · 刚刚';document.getElementById('todo-column').append(a);addLog('新建“'+title+'”，分派给'+owner)}function advance(btn,status){const task=btn.closest('.task'),name=task.querySelector('b').textContent;if(status==='处理中'){document.getElementById('doing-column').append(task);btn.textContent='标为完成';btn.setAttribute('onclick',"advance(this,'已完成')")}else{btn.remove();document.getElementById('done-column').append(task)}addLog('“'+name+'”推进为'+status)}function restrictedAction(){const n=document.getElementById('access-notice');n.classList.add('show');n.innerHTML='<b>权限不足：需要“预算主管”权限</b><br>此次变更没有写入活动记录。<br><button onclick="requestAccess()">发出访问申请</button><button onclick="safeReturn()">返回可操作区</button>'}function requestAccess(){document.getElementById('access-notice').innerHTML='<b>申请已发给预算主管</b><br>等待期间可继续处理有权限的任务。<button onclick="safeReturn()">去处理普通任务</button>';addLog('已申请年度预算批次访问权限')}function safeReturn(){document.getElementById('access-notice').classList.remove('show');document.getElementById('task-title').focus()}</script></body></html>
