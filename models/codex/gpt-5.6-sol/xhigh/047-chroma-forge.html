<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>色谱锻造厂</title><style>
:root{--void:#15111f;--panel:#251d32;--ink:#f5efff;--muted:#9d8eaf;--magenta:#f24eb4;--cyan:#4ce1da;--ok:#7ee59d;--danger:#ff6b68}*{box-sizing:border-box}body{margin:0;background:var(--void);color:var(--ink);font-family:ui-monospace,"Cascadia Mono","Microsoft YaHei",monospace}.app{min-height:800px;max-width:1280px;margin:auto;display:grid;grid-template-columns:250px 1fr 280px}.tools,.export{padding:22px;background:var(--panel);border-right:1px solid #413450}.export{border-right:0;border-left:1px solid #413450}.brand{font-weight:900;color:var(--magenta);margin-bottom:34px}.layer{padding:10px;border:1px solid #463a54;margin:8px 0;cursor:pointer}.layer.active{border-color:var(--cyan);color:var(--cyan)}label{display:block;color:var(--muted);font-size:11px;margin:18px 0 7px}input[type=range]{width:100%;accent-color:var(--magenta)}input[type=color]{width:100%;height:40px;background:none;border:1px solid #554361}.stage{display:grid;grid-template-rows:auto 1fr;background-image:linear-gradient(45deg,#1b1724 25%,transparent 25%),linear-gradient(-45deg,#1b1724 25%,transparent 25%);background-size:28px 28px}.stage-head{padding:15px 20px;background:#0e0c14;display:flex;justify-content:space-between}.canvas{display:grid;place-items:center}.poster{width:430px;height:520px;background:#f24eb4;position:relative;overflow:hidden;box-shadow:20px 20px 0 #4ce1da}.poster:before{content:"CHROMA";position:absolute;font:900 84px/1 Arial;transform:rotate(-90deg);left:-95px;top:210px;color:#15111f}.shape{position:absolute;width:260px;height:260px;border:34px solid #15111f;border-radius:50%;right:-40px;top:70px;filter:blur(6px)}.poster h1{position:absolute;left:70px;bottom:55px;font:900 54px/1 Arial;color:white}.export select{width:100%;padding:10px;background:#17121f;border:1px solid #554361;color:white}.export button{width:100%;padding:13px;margin-top:12px;border:0;background:var(--cyan);color:#10141a;font-weight:900;cursor:pointer}.export .test{background:transparent;color:var(--danger);border:1px solid var(--danger)}.result{margin-top:14px;padding:12px;display:none;font-size:12px}.result.show{display:block;background:#351c2c;color:#ffaaa6}.result.ok{background:#163524;color:var(--ok)}.result button{background:var(--danger);color:white}@media(max-width:850px){.app{grid-template-columns:1fr}.tools,.export{border:0}.poster{transform:scale(.75)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style></head><body><main class="app"><aside class="tools"><div class="brand">CHROMA FORGE / 色谱锻造厂</div><b>图层</b><div class="layer active">◉ 主形状 / 圆环</div><div class="layer">T 标题 / CHROMA</div><div class="layer">▧ 背景 / 洋红</div><label for="forge-color">背景颜色</label><input id="forge-color" type="color" value="#f24eb4" oninput="updatePreview()"><label for="forge-blur">圆环模糊 <output id="forge-blur-value">6</output>px</label><input id="forge-blur" type="range" min="0" max="50" value="6" oninput="updatePreview()"></aside><section class="stage"><header class="stage-head"><span>实时预览 · POSTER_08</span><span>1080 × 1350</span></header><div class="canvas"><div class="poster" id="forge-poster"><i class="shape" id="forge-shape"></i><h1>不按<br>光谱<br>行事</h1></div></div></section><aside class="export"><b>导出设置</b><label for="forge-format">格式</label><select id="forge-format"><option value="png">PNG · 透明友好</option><option value="svg">SVG · 矢量</option><option value="pdf">PDF · 印刷</option></select><label>当前条件</label><p>模糊效果会被栅格化；SVG 仅支持模糊 ≤ 20px。</p><button onclick="exportWork()">导出作品</button><button class="test" onclick="unsupported()">测试：选择不支持组合</button><div class="result" id="forge-result"></div></aside></main><script>function updatePreview(){const c=document.getElementById('forge-color').value,b=document.getElementById('forge-blur').value;document.getElementById('forge-poster').style.background=c;document.getElementById('forge-shape').style.filter='blur('+b+'px)';document.getElementById('forge-blur-value').textContent=b}function unsupported(){document.getElementById('forge-format').value='svg';document.getElementById('forge-blur').value=42;updatePreview();exportWork()}function exportWork(){const format=document.getElementById('forge-format').value,blur=Number(document.getElementById('forge-blur').value),r=document.getElementById('forge-result');r.classList.add('show');if(format==='svg'&&blur>20){r.className='result show';r.innerHTML='<b>SVG 不支持 42px 模糊</b><br>无效文件没有生成。<button onclick="fixExport()">改为 PNG 并重试</button>';return}r.className='result show ok';r.innerHTML='<b>导出完成</b><br>POSTER_08.'+format+' · '+(format==='png'?'4.2 MB':'1.1 MB')}function fixExport(){document.getElementById('forge-format').value='png';exportWork()}</script></body></html>
