<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>夜航通行证 · 登录</title>
  <style>
    :root{--bg:#070914;--surface:#11152a;--text:#f7f4ff;--muted:#9ba4c4;--accent:#9d7cff;--success:#57e3b4;--danger:#ff6e8a;--line:#282e4c}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,"Microsoft YaHei",sans-serif;overflow-x:hidden}
    body:before{content:"";position:fixed;inset:-30%;background:radial-gradient(circle at 70% 35%,#39286b 0,transparent 26%),radial-gradient(circle at 15% 80%,#103d50 0,transparent 24%);filter:blur(20px);opacity:.85}
    .shell{position:relative;min-height:100vh;display:grid;grid-template-columns:minmax(320px,1.2fr) minmax(420px,.8fr)}
    .brand{padding:52px 6vw;display:flex;flex-direction:column;justify-content:space-between}.mark{display:flex;gap:12px;align-items:center;font-weight:760;letter-spacing:.08em}.planet{width:32px;height:32px;border:1px solid var(--accent);border-radius:50%;position:relative}.planet:after{content:"";position:absolute;width:44px;height:12px;border:1px solid var(--accent);border-radius:50%;left:-7px;top:9px;transform:rotate(-18deg)}
    .hero{max-width:650px}.eyebrow{color:var(--success);font:700 12px/1 system-ui;letter-spacing:.18em;text-transform:uppercase}.hero h1{font-size:clamp(54px,7.4vw,112px);line-height:.86;letter-spacing:-.07em;margin:20px 0 28px}.hero p{color:var(--muted);font-size:18px;line-height:1.7;max-width:500px}.signal{display:flex;gap:10px;color:var(--muted);font-size:13px}.signal i{width:8px;height:8px;background:var(--success);border-radius:50%;box-shadow:0 0 16px var(--success)}
    .panel{margin:24px;min-height:calc(100vh - 48px);background:color-mix(in srgb,var(--surface) 88%,transparent);border:1px solid var(--line);border-radius:28px;padding:clamp(32px,5vw,68px);display:flex;flex-direction:column;justify-content:center;backdrop-filter:blur(22px);box-shadow:0 30px 80px #0008}
    .panel h2{font-size:32px;margin:0 0 8px}.lead{color:var(--muted);margin:0 0 32px}.field{display:grid;gap:8px;margin:18px 0}.field label{font-size:13px;color:#cbd1eb}.control{position:relative}input{width:100%;height:54px;border:1px solid var(--line);border-radius:14px;background:#0b0e1e;color:var(--text);font-size:16px;padding:0 50px 0 16px;outline:none;transition:.2s}input:focus{border-color:var(--accent);box-shadow:0 0 0 4px #9d7cff25}.peek{position:absolute;right:9px;top:8px;width:38px;height:38px;border:0;border-radius:10px;color:var(--muted);background:transparent;cursor:pointer}.peek:hover{background:#222746;color:white}
    .row{display:flex;justify-content:space-between;align-items:center;margin:20px 0 26px;font-size:13px}.row label{display:flex;gap:8px;align-items:center;color:var(--muted)}.row a{color:#c8b9ff;text-decoration:none}.primary{height:56px;border:0;border-radius:14px;background:var(--accent);color:#0c0820;font-weight:800;font-size:15px;cursor:pointer;box-shadow:0 16px 35px #9d7cff38;transition:transform .2s}.primary:hover{transform:translateY(-2px)}.status{min-height:22px;margin-top:16px;color:var(--success);font-size:13px}.fine{margin-top:32px;color:#6f789a;font-size:12px;text-align:center}
    @media(max-width:820px){.shell{grid-template-columns:1fr}.brand{min-height:48vh}.panel{margin:0 16px 16px;min-height:auto}.hero h1{font-size:60px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}}
  </style>
</head>
<body><main class="shell">
  <section class="brand"><div class="mark"><span class="planet"></span>ORBITAL / 夜航</div><div class="hero"><div class="eyebrow">private workspace · 04</div><h1>回到你的<br>工作轨道</h1><p>项目、决定和灵感都在原处。完成身份确认，继续上一段航程。</p></div><div class="signal"><i></i> 亚洲节点运行正常</div></section>
  <section class="panel" aria-label="登录表单"><h2>欢迎回来</h2><p class="lead">使用夜航账号进入控制台</p>
    <form id="form"><div class="field"><label for="account">账号</label><div class="control"><input id="account" autocomplete="username" placeholder="邮箱或成员编号" required></div></div>
    <div class="field"><label for="password">密码</label><div class="control"><input id="password" type="password" autocomplete="current-password" placeholder="至少 8 位" required minlength="8"><button class="peek" type="button" id="peek" aria-label="显示密码">显示</button></div></div>
    <div class="row"><label><input type="checkbox" style="width:auto;height:auto"> 保持登录 7 天</label><a href="#" id="forgot">找不到密码？</a></div><button class="primary" type="submit">进入夜航舱 →</button><div class="status" id="status" role="status"></div></form>
    <p class="fine">登录即表示你同意《工作区安全约定》</p>
  </section>
</main><script>
const p=document.querySelector('#password'),peek=document.querySelector('#peek'),status=document.querySelector('#status');
peek.onclick=()=>{p.type=p.type==='password'?'text':'password';peek.textContent=p.type==='password'?'显示':'隐藏'};
document.querySelector('#form').onsubmit=e=>{e.preventDefault();status.textContent='身份已确认，正在进入你的工作区…'};
document.querySelector('#forgot').onclick=e=>{e.preventDefault();status.textContent='已为你打开安全找回入口，请查收账号邮箱。'};
</script></body></html>
