<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>脉搏花园</title><style>
:root{--leaf:#dcebd8;--paper:#f8f4e9;--ink:#234032;--muted:#728475;--green:#4e8a63;--lime:#aed067;--ok:#357558;--danger:#c55446}*{box-sizing:border-box}body{margin:0;background:#bccbb9;color:var(--ink);font-family:system-ui,"Microsoft YaHei",sans-serif}.phone{width:min(390px,100%);min-height:760px;margin:20px auto;background:var(--paper);padding:20px;box-shadow:0 25px 70px #33513b44}.top{display:flex;justify-content:space-between}.top b{font-family:Georgia}.progress{margin:28px 0;background:var(--leaf);border-radius:100px;height:180px;display:grid;place-items:center;position:relative;overflow:hidden}.progress:before{content:"";position:absolute;width:210px;height:210px;border:24px solid var(--lime);border-radius:50%;top:73px}.progress strong{font:600 45px Georgia;position:relative}.progress small{position:absolute;bottom:20px;color:var(--muted)}.trend{display:flex;align-items:end;gap:9px;height:80px;border-bottom:1px solid #aebaaa;padding:0 12px}.bar{flex:1;background:#b9d1b7}.bar.today{background:var(--green)}.form{margin-top:20px;background:white;padding:16px;border:1px solid #c9d0c2}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form label{font-size:11px;color:var(--muted)}.form input{width:100%;padding:10px;border:0;border-bottom:2px solid var(--leaf);font:22px Georgia}.form button{width:100%;padding:12px;border:0;background:var(--green);color:white;font-weight:800;margin-top:14px}.test{display:block;text-align:center;color:var(--danger);background:none!important;text-decoration:underline}.feedback{margin-top:10px;font-size:12px}.feedback.error{color:var(--danger)}.feedback.ok{color:var(--ok)}.feedback button{width:auto;margin:8px 0 0;background:var(--danger);padding:7px 10px}@media(max-width:430px){.phone{margin:0;min-height:100vh}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style></head><body><main class="phone"><header class="top"><b>脉搏花园</b><span>第 18 周</span></header><section class="progress"><div><strong id="health-percent">64%</strong></div><small>本周活动目标 · 192 / 300 分钟</small></section><small>近七日活动趋势</small><div class="trend" id="health-trend"><i class="bar" style="height:35%"></i><i class="bar" style="height:60%"></i><i class="bar" style="height:48%"></i><i class="bar" style="height:75%"></i><i class="bar" style="height:42%"></i><i class="bar" style="height:64%"></i><i class="bar today" style="height:20%"></i></div><section class="form"><b>记录一次活动</b><div class="fields"><label>时长（1–300 分钟）<input id="health-minutes" type="number" value="30"></label><label>平均心率（40–220）<input id="health-heart" type="number" value="126"></label></div><button onclick="saveActivity()">保存并更新花园</button><button class="test" onclick="invalidHealth()">测试：填入超出范围的数据</button><div class="feedback" id="health-feedback"></div></section></main><script>let total=192;function invalidHealth(){document.getElementById('health-minutes').value=980;document.getElementById('health-heart').value=360;saveActivity()}function saveActivity(){const m=Number(document.getElementById('health-minutes').value),h=Number(document.getElementById('health-heart').value),f=document.getElementById('health-feedback');if(m<1||m>300||h<40||h>220){f.className='feedback error';f.innerHTML='<b>活动数据无效</b><br>时长需为 1–300 分钟，心率需为 40–220；原有 64% 进度未改变。<br><button onclick="fixHealth()">修正为 30 分钟 / 126</button>';return}total=Math.min(300,total+m);const pct=Math.round(total/300*100);document.getElementById('health-percent').textContent=pct+'%';document.querySelector('.progress small').textContent='本周活动目标 · '+total+' / 300 分钟';document.querySelector('.bar.today').style.height=Math.min(100,m/60*100)+'%';f.className='feedback ok';f.textContent='记录已保存：'+m+' 分钟，平均心率 '+h+'。趋势已重新计算。'}function fixHealth(){document.getElementById('health-minutes').value=30;document.getElementById('health-heart').value=126;saveActivity()}</script></body></html>
