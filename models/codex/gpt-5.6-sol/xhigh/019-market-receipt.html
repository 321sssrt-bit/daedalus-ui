<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>市集小票 · 购物车</title><style>
:root{--chalk:#18372e;--paper:#fffdf2;--ink:#15211d;--muted:#68736d;--orange:#ff6b35;--mint:#cdebd8;--danger:#bc2f2a}*{box-sizing:border-box}body{margin:0;background:var(--chalk);color:var(--ink);font-family:ui-monospace,"Cascadia Mono",Consolas,"Microsoft YaHei",monospace;min-height:100vh}.market{min-height:100vh;background:radial-gradient(circle at 12% 20%,rgba(255,255,255,.06) 0 1px,transparent 2px),var(--chalk);padding:36px;display:grid;grid-template-columns:minmax(260px,.7fr) minmax(520px,1.3fr);gap:44px}.aside{color:var(--paper);padding:28px;display:flex;flex-direction:column;justify-content:space-between}.aside h1{font-family:Georgia,"SimSun",serif;font-size:66px;line-height:.95;margin:0}.stamp{border:2px solid var(--mint);color:var(--mint);padding:12px;width:max-content;transform:rotate(-4deg)}.hours{color:#a8c8bc;line-height:1.8}.receipt{background:var(--paper);max-width:780px;width:100%;margin:auto;padding:34px 42px 50px;position:relative;box-shadow:18px 20px 0 #0b211b}.receipt:after{content:"";position:absolute;left:0;right:0;bottom:-12px;height:13px;background:linear-gradient(135deg,transparent 8px,var(--paper) 0) 0 0/16px 16px repeat-x}.receipt-head{text-align:center;border-bottom:2px dashed var(--ink);padding-bottom:22px}.receipt-head b{font-family:Georgia,"SimSun",serif;font-size:28px}.receipt-head p{margin:8px 0 0;color:var(--muted);font-size:12px}.rows{margin-top:12px}.item{display:grid;grid-template-columns:72px 1fr auto;gap:16px;align-items:center;padding:18px 0;border-bottom:1px dashed #b8b8ad}.thumb{width:72px;height:72px;background:var(--mint);display:grid;place-items:center;font-family:Georgia,serif;font-size:34px}.item:nth-child(2) .thumb{background:#f2d1a5}.item:nth-child(3) .thumb{background:#d7d8ee}.name{font-weight:800}.meta{font-size:11px;color:var(--muted);margin-top:5px}.qty{display:inline-flex;border:1px solid var(--ink);margin-top:9px}.qty button{border:0;background:transparent;width:30px;height:28px;cursor:pointer}.qty span{min-width:28px;display:grid;place-items:center;border-inline:1px solid var(--ink)}.right{text-align:right}.right strong{display:block}.remove{border:0;background:transparent;color:var(--danger);text-decoration:underline;margin-top:12px;cursor:pointer;font:inherit;font-size:11px}.total{padding:24px 0;border-bottom:2px dashed var(--ink)}.line{display:flex;justify-content:space-between;margin:8px 0}.grand{font-size:25px;font-weight:900}.checkout{width:100%;border:0;background:var(--orange);color:#1a1a16;padding:17px;font:900 15px inherit;cursor:pointer;box-shadow:5px 5px 0 var(--ink);margin-top:28px}.checkout:hover{transform:translate(2px,2px);box-shadow:3px 3px 0 var(--ink)}button:focus-visible{outline:3px solid var(--orange);outline-offset:3px}.empty{padding:28px;text-align:center}.fine{text-align:center;color:var(--muted);font-size:10px;margin-top:24px}@media(max-width:850px){.market{grid-template-columns:1fr;padding:18px}.aside{min-height:280px}.aside h1{font-size:50px}.receipt{padding:26px 24px}.item{grid-template-columns:58px 1fr auto}.thumb{width:58px;height:58px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main class="market"><aside class="aside"><div><div class="stamp">今 日 采 买</div><h1>青苔<br>周末市集</h1></div><p class="hours">新鲜抵达 / 08:00—20:00<br>产地直送 / 当日分装<br>订单编号 MKT-0719</p></aside><section class="receipt" aria-label="购物车小票"><header class="receipt-head"><b>你的藤编篮</b><p>价格已含包装回收押金</p></header><div class="rows" id="rows"><article class="item" data-price="36"><div class="thumb">梨</div><div><div class="name">秋月梨 · 4 枚</div><div class="meta">河北赵县 / 今日采收</div><div class="qty"><button aria-label="减少数量">−</button><span>1</span><button aria-label="增加数量">+</button></div></div><div class="right"><strong>¥ <i>36.00</i></strong><button class="remove">移除</button></div></article><article class="item" data-price="28"><div class="thumb">麦</div><div><div class="name">酸种乡村面包</div><div class="meta">450g / 裸麦 30%</div><div class="qty"><button aria-label="减少数量">−</button><span>1</span><button aria-label="增加数量">+</button></div></div><div class="right"><strong>¥ <i>28.00</i></strong><button class="remove">移除</button></div></article><article class="item" data-price="19"><div class="thumb">乳</div><div><div class="name">晨雾牧场鲜奶</div><div class="meta">950ml / 低温巴氏</div><div class="qty"><button aria-label="减少数量">−</button><span>2</span><button aria-label="增加数量">+</button></div></div><div class="right"><strong>¥ <i>38.00</i></strong><button class="remove">移除</button></div></article></div><div class="total"><div class="line"><span>商品小计</span><b id="subtotal">¥ 102.00</b></div><div class="line"><span>配送</span><b>¥ 8.00</b></div><div class="line grand"><span>应付合计</span><span id="grand">¥ 110.00</span></div></div><button class="checkout" id="checkout">去结算 · 保留购物袋 15 分钟</button><div class="fine" id="fine">谢谢你支持本地种植者 ◦ GOOD FOOD, CLOSE TO HOME</div></section></main><script>
const rows=document.getElementById('rows');function calc(){let sum=0;rows.querySelectorAll('.item').forEach(r=>{const q=+r.querySelector('.qty span').textContent,p=+r.dataset.price;r.querySelector('i').textContent=(p*q).toFixed(2);sum+=p*q});subtotal.textContent=`¥ ${sum.toFixed(2)}`;grand.textContent=`¥ ${(sum+8).toFixed(2)}`;if(!rows.children.length)rows.innerHTML='<div class="empty">篮子空了，去市集再挑一些吧。</div>'}rows.addEventListener('click',e=>{const item=e.target.closest('.item');if(!item)return;if(e.target.classList.contains('remove'))item.remove();else if(e.target.closest('.qty')){const span=item.querySelector('.qty span');let n=+span.textContent;if(e.target.textContent==='−')n=Math.max(1,n-1);if(e.target.textContent==='+')n++;span.textContent=n}calc()});checkout.onclick=()=>fine.textContent='✓ 合计已核对，正在前往收银台';
</script></body></html>
