<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>掌中潮汐 · 钱包</title><style>
:root{--sand:#efe1ca;--paper:#fff8e8;--ink:#24322d;--muted:#7b817a;--orange:#d7643a;--mint:#9fc9b2;--green:#347659;--red:#b84c45}*{box-sizing:border-box}body{margin:0;background:#cbbca4;color:var(--ink);font-family:"Avenir Next","Microsoft YaHei",Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}.phone{width:min(390px,100%);height:min(820px,calc(100vh - 32px));min-height:680px;background:var(--sand);border:8px solid var(--ink);border-radius:42px;overflow:hidden;position:relative;box-shadow:0 24px 60px rgba(36,50,45,.3)}.screen{height:100%;overflow:auto;padding-bottom:88px}.top{display:flex;justify-content:space-between;padding:25px 22px 12px;align-items:center}.top b{font-size:18px}.avatar{width:34px;height:34px;border-radius:50%;background:var(--mint);display:grid;place-items:center;font-weight:800}.balance{margin:12px 16px 0;background:var(--paper);border:2px solid var(--ink);padding:24px 22px 20px;position:relative;box-shadow:5px 6px 0 var(--ink)}.balance:after{content:"";position:absolute;right:22px;top:18px;width:56px;height:56px;border:12px double var(--mint);border-radius:50%;opacity:.65}.balance label{font-size:11px;color:var(--muted)}.amount{font-family:Georgia,serif;font-size:42px;font-weight:700;margin:7px 0}.amount small{font:14px Arial,sans-serif}.month{font-size:11px;color:var(--green)}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 16px}.action{border:1px solid var(--ink);background:transparent;padding:13px 5px;border-radius:18px;cursor:pointer;color:inherit}.action i{display:block;width:30px;height:30px;border-radius:50%;background:var(--orange);color:white;margin:0 auto 7px;font-style:normal;display:grid;place-items:center;font-size:17px}.action:nth-child(2) i{background:var(--green)}.action:nth-child(3) i{background:var(--ink)}.action span{font-size:11px;font-weight:700}.flow{margin:23px 18px}.flow-head{display:flex;justify-content:space-between;align-items:center}.flow h2{font:22px Georgia,serif;margin:0}.flow-head button{border:0;background:transparent;color:var(--orange);font-size:11px;cursor:pointer}.day{font-size:10px;color:var(--muted);margin:18px 0 6px}.tx{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #cabda8}.tx .icon{width:40px;height:40px;border-radius:14px;background:var(--paper);display:grid;place-items:center;font-weight:900}.tx h3{font-size:13px;margin:0 0 4px}.tx p{font-size:10px;color:var(--muted);margin:0}.money{font-size:13px;font-weight:800}.money.in{color:var(--green)}.nav{position:absolute;left:0;right:0;bottom:0;height:72px;background:var(--paper);border-top:2px solid var(--ink);display:grid;grid-template-columns:repeat(4,1fr);padding:8px 4px 12px}.nav button{border:0;background:transparent;color:var(--muted);font-size:10px;cursor:pointer}.nav button b{display:block;font-size:19px;color:var(--ink);margin-bottom:3px}.nav button.active{color:var(--orange);font-weight:800}.sheet{position:absolute;inset:auto 0 0;background:var(--paper);border-top:3px solid var(--ink);padding:24px 22px 28px;transform:translateY(110%);transition:.25s transform;z-index:3}.sheet.show{transform:none}.sheet h2{font-family:Georgia,serif;margin:0 0 18px}.sheet label{display:block;font-size:11px;color:var(--muted);margin-top:12px}.sheet input{width:100%;border:1px solid var(--ink);background:white;padding:12px;margin-top:6px}.sheet .go{width:100%;border:0;background:var(--orange);color:white;padding:14px;margin-top:16px;font-weight:900}.sheet .close{position:absolute;right:18px;top:18px;border:0;background:transparent;font-size:22px}.message{font-size:11px;color:var(--green);min-height:16px;margin-top:8px}button:focus-visible,input:focus-visible{outline:3px solid var(--orange);outline-offset:2px}@media(max-width:430px){body{padding:0}.phone{width:100%;height:100vh;max-height:none;border:0;border-radius:0;box-shadow:none}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main class="phone"><div class="screen"><header class="top"><b>潮汐钱包</b><div class="avatar">南</div></header><section class="balance"><label>可用余额</label><div class="amount"><small>¥</small> 8,642.50</div><div class="month">↑ 本月净流入 ¥ 1,280</div></section><section class="actions"><button class="action" id="transfer"><i>↗</i><span>转出</span></button><button class="action" id="receive"><i>⌁</i><span>收款</span></button><button class="action" id="card"><i>＋</i><span>银行卡</span></button></section><section class="flow"><div class="flow-head"><h2>最近潮汐</h2><button id="all">查看全部</button></div><div class="day">今天 · 8 月 14 日</div><article class="tx"><div class="icon">咖</div><div><h3>渡口咖啡</h3><p>10:42 · 餐饮</p></div><span class="money">− ¥ 32.00</span></article><article class="tx"><div class="icon">薪</div><div><h3>岸线工作室</h3><p>09:18 · 收入</p></div><span class="money in">＋ ¥ 4,800.00</span></article><div class="day">昨天 · 8 月 13 日</div><article class="tx"><div class="icon">行</div><div><h3>地铁乘车码</h3><p>19:27 · 交通</p></div><span class="money">− ¥ 4.00</span></article><article class="tx"><div class="icon">书</div><div><h3>野草书店</h3><p>16:06 · 文化</p></div><span class="money">− ¥ 86.00</span></article></section></div><nav class="nav"><button class="active"><b>⌂</b>首页</button><button><b>≋</b>流水</button><button><b>◎</b>计划</button><button><b>人</b>我的</button></nav><section class="sheet" id="sheet" aria-label="转出资金"><button class="close" id="close" aria-label="关闭">×</button><h2>转出一笔</h2><label>收款人<input id="person" placeholder="姓名或手机号"></label><label>金额<input id="money" type="number" min="0" placeholder="0.00"></label><button class="go" id="go">继续核对</button><div class="message" id="message"></div></section></main><script>
transfer.onclick=()=>{sheet.classList.add('show');person.focus()};close.onclick=()=>sheet.classList.remove('show');go.onclick=()=>{message.textContent=person.value&&+money.value>0?`将向 ${person.value} 转出 ¥ ${(+money.value).toFixed(2)}`:'请填写收款人和有效金额'};receive.onclick=()=>{sheet.classList.add('show');sheet.querySelector('h2').textContent='我的收款码';sheet.querySelectorAll('label,.go').forEach(x=>x.style.display='none');message.textContent='收款编号 TIDE-8642 · 点击关闭返回'};card.onclick=()=>{sheet.classList.add('show');sheet.querySelector('h2').textContent='银行卡管理';sheet.querySelectorAll('label,.go').forEach(x=>x.style.display='none');message.textContent='已绑定 2 张卡 · 尾号 2048、6193'};all.onclick=()=>all.textContent='已显示最近 30 天';
</script></body></html>
