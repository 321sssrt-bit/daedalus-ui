<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>山线行程</title><style>
:root{--snow:#f3f6f1;--pine:#173f38;--ice:#cce1dc;--ink:#17322e;--muted:#70847f;--orange:#e67b3d;--ok:#2f8065;--danger:#bb4d3f}*{box-sizing:border-box}body{margin:0;background:#c7d5d0;color:var(--ink);font-family:system-ui,"Microsoft YaHei",sans-serif}.phone{width:min(390px,100%);min-height:760px;margin:20px auto;background:var(--snow);box-shadow:0 24px 70px #2b4b4455}.hero{height:185px;background:linear-gradient(160deg,#7fa69d,var(--pine));color:white;padding:22px;clip-path:polygon(0 0,100% 0,100% 84%,65% 75%,40% 92%,0 78%)}.hero h1{font-size:29px;margin:34px 0 4px}.search{margin:-22px 18px 0;background:white;padding:14px;position:relative;z-index:1;box-shadow:0 8px 24px #49665e26}.route{display:grid;grid-template-columns:1fr auto 1fr;gap:8px}.route input{width:100%;border:0;border-bottom:1px solid #9fb4ae;padding:8px;font:inherit}.search button{width:100%;border:0;background:var(--pine);color:white;padding:11px;margin-top:11px}.results{padding:16px 18px}.trip{width:100%;border:1px solid #b8c9c4;background:white;padding:12px;margin:7px 0;text-align:left;display:flex;justify-content:space-between;cursor:pointer}.trip.active{outline:3px solid var(--orange)}.trip.sold{border-style:dashed}.trip small{display:block;color:var(--muted)}.seats{display:flex;gap:8px;margin:13px 0}.seat{border:1px solid #91aaa3;background:white;padding:8px;cursor:pointer}.seat.active{background:var(--pine);color:white}.confirm{width:100%;border:0;background:var(--orange);color:white;padding:13px;font-weight:800;cursor:pointer}.feedback{margin-top:12px;padding:12px;display:none}.feedback.show{display:block}.feedback.error{background:#f5dcd6;color:var(--danger)}.feedback.ok{background:#dbeadf;color:var(--ok)}.feedback button{border:0;background:var(--danger);color:white;padding:7px;margin-top:7px}.ticket{border:2px dashed var(--ok);padding:12px}@media(max-width:430px){.phone{margin:0;min-height:100vh}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style></head><body><main class="phone"><header class="hero"><small>MOUNTAIN LINE / 山线</small><h1>从城市，去更高的地方</h1><span>今日山口晴 · 18°C</span></header><section class="search"><div class="route"><input id="route-from" value="松江" aria-label="出发地"><b>→</b><input id="route-to" value="雾岭" aria-label="目的地"></div><button onclick="searchRoute()">搜索山线班次</button></section><section class="results"><small id="route-summary">3 个班次 · 路线条件已保存</small><button class="trip sold" onclick="chooseTrip(this,'08:20','售罄检查')"><span><b>08:20 → 10:05</b><small>晨雾号 · 售罄检查</small></span><strong>¥86</strong></button><button class="trip active" onclick="chooseTrip(this,'09:10','青松号')"><span><b>09:10 → 11:02</b><small>青松号 · 余 8 席</small></span><strong>¥92</strong></button><button class="trip" onclick="chooseTrip(this,'13:40','山雀号')"><span><b>13:40 → 15:30</b><small>山雀号 · 余 3 席</small></span><strong>¥78</strong></button><div class="seats"><button class="seat active" onclick="chooseSeat(this,'7A')">7A 靠窗</button><button class="seat" onclick="chooseSeat(this,'7B')">7B</button><button class="seat" onclick="chooseSeat(this,'8A')">8A 靠窗</button></div><button class="confirm" onclick="confirmTrip()">确认班次与席位</button><div class="feedback" id="travel-feedback"></div></section></main><script>let trip='09:10',tripName='青松号',seat='7A';function searchRoute(){document.getElementById('route-summary').textContent=document.getElementById('route-from').value+' → '+document.getElementById('route-to').value+' · 3 个班次'}function chooseTrip(el,t,n){document.querySelectorAll('.trip').forEach(x=>x.classList.remove('active'));el.classList.add('active');trip=t;tripName=n}function chooseSeat(el,n){document.querySelectorAll('.seat').forEach(x=>x.classList.remove('active'));el.classList.add('active');seat=n}function confirmTrip(){const f=document.getElementById('travel-feedback');f.classList.add('show');if(trip==='08:20'){f.className='feedback show error';f.innerHTML='<b>晨雾号已售罄</b><br>松江 → 雾岭的搜索条件已保留。<br><button onclick="recoverTrip()">改选 09:10 · 7A</button>';return}f.className='feedback show ok';f.innerHTML='<div class="ticket"><b>行程已确认 · ML-814-'+seat+'</b><br>'+trip+' '+tripName+' · '+seat+'<br>松江 → 雾岭</div>'}function recoverTrip(){trip='09:10';tripName='青松号';seat='7A';document.querySelectorAll('.trip').forEach((x,i)=>x.classList.toggle('active',i===1));document.querySelectorAll('.seat').forEach((x,i)=>x.classList.toggle('active',i===0));const f=document.getElementById('travel-feedback');f.className='feedback show ok';f.textContent='已改选可用班次与座位，请重新确认。'}</script></body></html>
