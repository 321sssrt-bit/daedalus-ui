<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>植物标本筛 · 筛选检索</title><style>
:root{--linen:#ece8d8;--paper:#faf8ed;--ink:#263329;--muted:#738074;--forest:#315b3c;--ochre:#be8a3c;--red:#a94f45;--line:#c8c6b7}*{box-sizing:border-box}body{margin:0;background:var(--linen);color:var(--ink);font-family:Georgia,"Songti SC","SimSun",serif;min-height:100vh}.header{padding:28px clamp(24px,5vw,70px);border-bottom:1px solid var(--ink);display:flex;justify-content:space-between;align-items:end}.brand{font-size:28px;letter-spacing:4px}.header p{margin:0;color:var(--muted);font-style:italic}.layout{display:grid;grid-template-columns:270px 1fr;max-width:1300px;margin:auto;min-height:calc(100vh - 91px)}.filters{border-right:1px solid var(--ink);padding:34px 28px}.filters h1{font-size:21px;margin:0}.count{font:12px Arial,"Microsoft YaHei",sans-serif;color:var(--forest);margin:8px 0 28px}.filter{border-top:1px solid var(--line);padding:19px 0}.filter label.title{display:block;font:700 11px Arial,"Microsoft YaHei",sans-serif;letter-spacing:1px;margin-bottom:11px}.filter select,.filter input[type=search]{width:100%;border:1px solid var(--muted);background:var(--paper);padding:10px;color:var(--ink)}.check{display:block;font:12px Arial,"Microsoft YaHei",sans-serif;color:var(--muted);margin:9px 0}.check input{accent-color:var(--forest)}.range{width:100%;accent-color:var(--forest)}.range-label{display:flex;justify-content:space-between;font:10px Arial,sans-serif;color:var(--muted)}.clear{border:0;background:transparent;color:var(--red);text-decoration:underline;padding:8px 0;cursor:pointer;font:700 12px Arial,"Microsoft YaHei",sans-serif}.results{padding:34px}.result-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.result-head h2{font-size:32px;font-weight:400;margin:0}.result-head span{font:11px Arial,"Microsoft YaHei",sans-serif;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.plant{background:var(--paper);border:1px solid var(--line);padding:16px;min-height:300px}.plate{height:160px;background:#e2e5d3;position:relative;overflow:hidden;display:grid;place-items:center}.plate svg{width:100%;height:100%}.no{position:absolute;top:9px;left:10px;font:10px Arial,sans-serif;color:var(--muted)}.plant h3{font-size:19px;font-weight:400;margin:17px 0 4px}.latin{font-style:italic;color:var(--forest);font-size:12px}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}.tags span{border:1px solid var(--line);padding:4px 6px;font:10px Arial,"Microsoft YaHei",sans-serif;color:var(--muted)}.none{grid-column:1/-1;padding:90px;text-align:center;border:1px dashed var(--muted);color:var(--muted)}input:focus-visible,select:focus-visible,.clear:focus-visible{outline:3px solid var(--ochre);outline-offset:2px}@media(max-width:950px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:720px){.layout{grid-template-columns:1fr}.filters{border-right:0;border-bottom:1px solid var(--ink)}.grid{grid-template-columns:1fr}.header p{display:none}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><header class="header"><div class="brand">北纬三十度植物志</div><p>FIELD NOTES / 2026 夏季采集</p></header><main class="layout"><aside class="filters"><h1>缩小标本范围</h1><div class="count" id="count">找到 6 份记录</div><div class="filter"><label class="title" for="q">名称检索</label><input type="search" id="q" placeholder="中文名或拉丁名"></div><div class="filter"><label class="title" for="habitat">生境</label><select id="habitat"><option value="all">全部生境</option><option value="forest">林下</option><option value="water">水岸</option><option value="rock">岩隙</option></select></div><div class="filter"><span class="title">特征</span><label class="check"><input type="checkbox" id="flower"> 当前有花</label><label class="check"><input type="checkbox" id="native"> 本地原生</label></div><div class="filter"><label class="title" for="height">最高株高：<b id="heightValue">200</b> cm</label><input class="range" type="range" id="height" min="20" max="200" value="200" step="20"><div class="range-label"><span>20</span><span>200</span></div></div><button class="clear" id="clear">清除全部条件</button></aside><section class="results"><div class="result-head"><h2>采集记录</h2><span>按最新观察排序</span></div><div class="grid" id="grid"></div></section></main><script>
const data=[['蒲儿根','Sinosenecio oldhamianus','forest',55,1,1,'#6f9360'],['水蓼','Persicaria hydropiper','water',80,1,1,'#b26372'],['石韦','Pyrrosia lingua','rock',35,0,1,'#557d5a'],['鸭跖草','Commelina communis','forest',45,1,1,'#466baa'],['泽泻','Alisma plantago-aquatica','water',110,1,0,'#e8e6d2'],['岩白菜','Bergenia purpurascens','rock',42,0,0,'#8c625c']];function draw(){const query=q.value.toLowerCase(),hab=habitat.value,max=+height.value;const rows=data.filter(x=>(!query||(x[0]+x[1]).toLowerCase().includes(query))&&(hab==='all'||x[2]===hab)&&(!flower.checked||x[4])&&(!native.checked||x[5])&&x[3]<=max);count.textContent=`找到 ${rows.length} 份记录`;grid.innerHTML=rows.length?rows.map((x,i)=>`<article class="plant"><div class="plate"><span class="no">SP-${String(i+1).padStart(3,'0')}</span><svg viewBox="0 0 180 160" aria-hidden="true"><path d="M90 145C90 105 83 66 91 25" fill="none" stroke="#315b3c" stroke-width="4"/><path d="M88 112C55 104 43 80 48 58 76 64 91 80 88 112ZM90 86c32-8 43-30 35-51-25 8-38 24-35 51Z" fill="${x[6]}"/><circle cx="92" cy="27" r="15" fill="${x[4]?'#be8a3c':'#315b3c'}"/></svg></div><h3>${x[0]}</h3><div class="latin">${x[1]}</div><div class="tags"><span>${{forest:'林下',water:'水岸',rock:'岩隙'}[x[2]]}</span><span>${x[3]} cm</span>${x[4]?'<span>有花</span>':''}${x[5]?'<span>原生</span>':''}</div></article>`).join(''):'<div class="none">没有符合全部条件的标本。<br>试着放宽株高或生境。</div>'}document.querySelectorAll('input,select').forEach(x=>x.addEventListener('input',()=>{heightValue.textContent=height.value;draw()}));clear.onclick=()=>{q.value='';habitat.value='all';flower.checked=false;native.checked=false;height.value=200;heightValue.textContent=200;draw()};draw();
</script></body></html>
