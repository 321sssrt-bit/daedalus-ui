</style></head><body><header class="mast"><div class="issue">MARGIN / 第 18 期</div><h1>边注月刊</h1><div class="date">二〇二六年 · 仲夏</div></header><main class="wrap"><div class="lead"><h2>目录</h2><p>关于城市、器物与缓慢工作的五篇札记</p></div><div class="columns"><section class="index" aria-label="文章目录"><button class="entry active" data-i="0"><span class="num">01</span><span><h3>一张椅子的第二次生命</h3><span class="by">梁雨 / 器物考</span></span><span class="pages">p. 08</span></button><button class="entry" data-i="1"><span class="num">02</span><span><h3>在高架桥下种一座花园</h3><span class="by">唐芫 / 城市观察</span></span><span class="pages">p. 22</span></button><button class="entry" data-i="2"><span class="num">03</span><span><h3>铅字未冷：最后一家活字铺</h3><span class="by">赵冶 / 手艺人</span></span><span class="pages">p. 40</span></button><button class="entry" data-i="3"><span class="num">04</span><span><h3>我们为什么仍然画地图</h3><span class="by">何汀 / 视觉随笔</span></span><span class="pages">p. 57</span></button><button class="entry" data-i="4"><span class="num">05</span><span><h3>夜班面包师的时间表</h3><span class="by">孟山 / 工作志</span></span><span class="pages">p. 74</span></button></section><article class="reader" aria-live="polite"><div class="eyebrow" id="type">器物考 · 本期首篇</div><h3 id="title">一张椅子的第二次生命</h3><p class="dek" id="dek">修补不是把时间藏起来，而是让使用过的痕迹有新的秩序。</p><p class="summary drop" id="summary">在城南一间只有十八平方米的工作室里，旧木料按色泽排在墙边。修复师不急着磨去划痕，他先问每把椅子曾经属于谁，又准备去往哪里。</p><blockquote class="quote" id="quote">“真正耐用的东西，会把人的动作慢慢记下来。”</blockquote><button class="read" id="read">阅读全文 →</button><div class="folio">MARGIN · 021 / 050</div></article></div></main><script>
const articles=[['器物考 · 本期首篇','一张椅子的第二次生命','修补不是把时间藏起来，而是让使用过的痕迹有新的秩序。','在城南一间只有十八平方米的工作室里，旧木料按色泽排在墙边。修复师不急着磨去划痕，他先问每把椅子曾经属于谁，又准备去往哪里。','“真正耐用的东西，会把人的动作慢慢记下来。”'],['城市观察','在高架桥下种一座花园','当被遗忘的灰色夹缝开始生长，街区也获得了新的会面方式。','桥柱之间原本只积灰与回声。十二位居民用废弃木箱围出种植床，让雨水从桥面流进一条浅沟，三个月后，薄荷先占领了边缘。','“花园最先种下的，其实是停留的理由。”'],['手艺人','铅字未冷：最后一家活字铺','一枚枚反写的字，仍在为小批量印刷保留触觉。','师傅从密密的字架间抽出铅字，拇指像能认字一样从侧面掠过。油墨的气味、滚筒的节奏与纸张压力，共同决定一句话最后的重量。','“机器追求一致，我们保留恰到好处的不同。”'],['视觉随笔','我们为什么仍然画地图','导航给出最快的路，手绘地图留下值得绕行的地方。','五位制图者把声音、气味、坡度和记忆标在同一张城市底图上。那些不能精确测量的内容，反而构成了使用者真正认识一处地方的入口。','“地图不是缩小世界，而是放大关系。”'],['工作志','夜班面包师的时间表','当城市入睡，另一套以发酵为单位的钟表开始运转。','凌晨一点二十分，第一炉预热；两点，整形；四点半，街灯尚未熄灭，麦香已经从门缝抵达清晨。夜班不是白昼的反面，而是自己的季节。','“时间不是小时，是面团每一次呼吸。”']];document.querySelectorAll('.entry').forEach(b=>b.onclick=()=>{document.querySelectorAll('.entry').forEach(x=>x.classList.remove('active'));b.classList.add('active');['type','title','dek','summary','quote'].forEach((id,n)=>document.getElementById(id).textContent=articles[+b.dataset.i][n])});read.onclick=()=>{read.textContent='已加入本期阅读单 ✓'};
</script></body></html>
