<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>夜航电台</title><style>
:root{--black:#08090b;--panel:#15171d;--ink:#f1f0e8;--muted:#8f929a;--acid:#c9ff4f;--violet:#8d68ff;--ok:#6ed3a4;--danger:#ff665e}*{box-sizing:border-box}body{margin:0;background:var(--black);color:var(--ink);font-family:system-ui,"Microsoft YaHei",sans-serif}.shell{max-width:1280px;min-height:800px;margin:auto;padding:24px 34px}.nav{display:flex;justify-content:space-between;border-bottom:1px solid #343740;padding-bottom:15px}.nav b{letter-spacing:.18em}.layout{display:grid;grid-template-columns:260px 1fr;gap:28px;margin-top:28px}.library h2{font-size:13px;color:var(--muted)}.show{width:100%;display:flex;gap:12px;align-items:center;background:transparent;color:var(--ink);border:0;border-bottom:1px solid #2b2d34;padding:12px 0;text-align:left;cursor:pointer}.cover{width:55px;height:55px;background:linear-gradient(135deg,var(--violet),#2a1939);display:grid;place-items:center;font-size:24px}.show:nth-of-type(2) .cover{background:linear-gradient(135deg,#d2683c,#422018)}.show:nth-of-type(3) .cover{background:linear-gradient(135deg,#3d8e8b,#102b32)}.studio{background:var(--panel);padding:26px;display:grid;grid-template-columns:1fr 310px;gap:28px}.visual{min-height:420px;background:radial-gradient(circle at 50% 45%,#704cca 0 10%,#231736 35%,#0d0e12 70%);display:grid;place-items:center;position:relative}.disc{width:220px;height:220px;border:1px solid var(--acid);border-radius:50%;display:grid;place-items:center;box-shadow:0 0 60px #c9ff4f20}.disc:before{content:"";width:105px;height:105px;border:10px double var(--acid);border-radius:50%}.onair{position:absolute;top:16px;left:16px;color:var(--acid);font:12px ui-monospace}.player h1{font-size:34px;margin:6px 0}.player p{color:var(--muted)}.time{font:12px ui-monospace;color:var(--acid);display:flex;justify-content:space-between}.range{width:100%;accent-color:var(--acid)}.controls{display:flex;gap:10px;margin:16px 0}.controls button{border:1px solid #484b55;background:#24262d;color:white;padding:10px 14px;cursor:pointer}.controls .play{background:var(--acid);color:#10120c;border-color:var(--acid);font-weight:800}.queue{border-top:1px solid #343740;margin-top:18px;padding-top:14px}.queue button{width:100%;text-align:left;border:0;background:transparent;color:var(--muted);padding:7px;cursor:pointer}.queue button.active{color:var(--ink);border-left:2px solid var(--violet)}.network{border:1px solid var(--danger);color:var(--danger);background:transparent;padding:9px 12px;cursor:pointer}.notice{margin-top:12px;padding:11px;display:none}.notice.show{display:block;background:#2b1b1d;color:#ffaaa5}.notice.ok{background:#13281f;color:var(--ok)}.notice button{margin-top:8px}@media(max-width:850px){.layout{grid-template-columns:1fr}.studio{grid-template-columns:1fr}.library{display:none}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}</style></head><body><main class="shell"><header class="nav"><b>NOCTURNE / 夜航</b><span>收藏状态：<strong id="media-saved">未保存</strong></span></header><div class="layout"><aside class="library"><h2>今晚值得听</h2><button class="show" onclick="selectShow('潮汐之后','陈述')"><i class="cover">≈</i><span><b>潮汐之后</b><br><small>声音纪录</small></span></button><button class="show" onclick="selectShow('凌晨建筑学','岑牧')"><i class="cover">▥</i><span><b>凌晨建筑学</b><br><small>城市谈话</small></span></button><button class="show" onclick="selectShow('暗室植物','九野')"><i class="cover">✣</i><span><b>暗室植物</b><br><small>自然观察</small></span></button></aside><section class="studio"><div class="visual"><span class="onair" id="media-onair">READY / 00:00</span><div class="disc"></div></div><div class="player"><small>正在播放</small><h1 id="media-title">潮汐之后</h1><p id="media-author">陈述 · 第 18 期</p><div class="time"><span id="media-current">12:40</span><span>42:18</span></div><input class="range" id="media-progress" type="range" min="0" max="100" value="30" oninput="seek(this.value)"><div class="controls"><button>↶ 15</button><button class="play" id="media-play" onclick="playToggle()">开始播放</button><button onclick="saveState()">保存进度</button></div><button class="network" onclick="interruptNetwork()">测试：模拟网络中断</button><div class="notice" id="media-notice"></div><div class="queue"><b>接下来</b><button class="active" onclick="queue(this,'海岸灯塔的七种声音')">01　海岸灯塔的七种声音</button><button onclick="queue(this,'渔港凌晨四点')">02　渔港凌晨四点</button><button onclick="queue(this,'一封来自浮标的信')">03　一封来自浮标的信</button></div></div></section></div></main><script>let playing=false,interrupted=false,lastProgress=30;function selectShow(t,a){document.getElementById('media-title').textContent=t;document.getElementById('media-author').textContent=a+' · 精选节目';playing=false;document.getElementById('media-play').textContent='开始播放'}function playToggle(){if(interrupted)return;playing=!playing;document.getElementById('media-play').textContent=playing?'暂停播放':'继续播放';document.getElementById('media-onair').textContent=playing?'ON AIR / LIVE':'PAUSED'}function seek(v){lastProgress=Number(v);document.getElementById('media-current').textContent=Math.floor(v*.423)+':'+String(Math.floor(v*7)%60).padStart(2,'0')}function queue(el,n){document.querySelectorAll('.queue button').forEach(x=>x.classList.remove('active'));el.classList.add('active');document.getElementById('media-saved').textContent='队列已更新：'+n}function saveState(){document.getElementById('media-saved').textContent='已保存 '+document.getElementById('media-current').textContent}function interruptNetwork(){interrupted=true;playing=false;lastProgress=Number(document.getElementById('media-progress').value);document.getElementById('media-play').textContent='网络已中断';const n=document.getElementById('media-notice');n.className='notice show';n.innerHTML='连接中断，进度 '+document.getElementById('media-current').textContent+' 已保留。<br><button onclick="reconnect()">重新连接并继续</button>'}function reconnect(){interrupted=false;playing=true;document.getElementById('media-progress').value=lastProgress;document.getElementById('media-play').textContent='暂停播放';const n=document.getElementById('media-notice');n.className='notice show ok';n.textContent='连接已恢复，正从保留进度继续播放。'}</script></body></html>
