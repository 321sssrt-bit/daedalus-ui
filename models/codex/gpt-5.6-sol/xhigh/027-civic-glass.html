<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>公民彩窗 · 角色权限</title><style>
:root{--stone:#e7e2d8;--paper:#f8f4ea;--ink:#21323a;--muted:#6d7779;--blue:#315ba6;--amber:#e7a83e;--red:#bb4d4d;--green:#4f7d6a;--line:#b9b7ae}*{box-sizing:border-box}body{margin:0;background:var(--stone);color:var(--ink);font-family:"Trebuchet MS","Microsoft YaHei",sans-serif;min-height:100vh}.hall{max-width:1180px;margin:auto;padding:38px 28px}.header{display:flex;justify-content:space-between;align-items:start;margin-bottom:28px}.seal{display:flex;gap:16px;align-items:center}.crest{width:54px;height:54px;display:grid;grid-template:1fr 1fr/1fr 1fr;transform:rotate(45deg);border:3px solid var(--ink);overflow:hidden}.crest i:nth-child(1){background:var(--blue)}.crest i:nth-child(2){background:var(--amber)}.crest i:nth-child(3){background:var(--red)}.crest i:nth-child(4){background:var(--green)}.header h1{font-family:Georgia,"SimSun",serif;font-size:35px;margin:0 0 5px}.header p{margin:0;color:var(--muted);font-size:13px}.save{border:0;background:var(--ink);color:var(--paper);padding:13px 20px;font-weight:800;cursor:pointer}.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.role{border:1px solid var(--line);background:var(--paper);text-align:left;padding:20px;cursor:pointer;position:relative;overflow:hidden;color:inherit}.role:after{content:"";position:absolute;right:-26px;bottom:-34px;width:100px;height:100px;border-radius:50%;background:var(--color);opacity:.16}.role.active{border:3px solid var(--ink);padding:18px}.role .window{display:flex;gap:3px;margin-bottom:26px}.window i{display:block;width:17px;height:30px;background:var(--color);clip-path:polygon(50% 0,100% 28%,100% 100%,0 100%,0 28%)}.role h2{font-family:Georgia,"SimSun",serif;font-size:24px;margin:0 0 4px}.role p{margin:0;color:var(--muted);font-size:12px}.workspace{display:grid;grid-template-columns:1fr 310px;gap:18px;margin-top:18px}.matrix,.preview{background:var(--paper);border:1px solid var(--line);padding:28px}.matrix-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:18px}.matrix h2,.preview h2{font-family:Georgia,"SimSun",serif;font-weight:400;margin:0}.matrix-head span{color:var(--muted);font-size:11px}.perm{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;border-bottom:1px solid #d7d3c9;padding:19px 0}.perm:last-child{border:0}.perm h3{font-size:14px;margin:0 0 4px}.perm p{font-size:11px;color:var(--muted);margin:0}.check{width:30px;height:30px;border:1px solid var(--line);background:transparent;cursor:pointer;color:transparent;font-size:18px}.check.on{background:var(--green);border-color:var(--green);color:white}.locked{font-size:11px;color:var(--muted)}.preview h2{font-size:23px;margin-bottom:20px}.persona{border-left:4px solid var(--blue);padding-left:14px;margin-bottom:22px}.persona b{display:block}.persona span{font-size:11px;color:var(--muted)}.screen{background:#dfe8ea;padding:18px;min-height:210px}.mini-nav{display:flex;gap:8px;margin-bottom:14px}.mini-nav i{height:6px;width:42px;background:#93a7aa}.mini-card{background:white;padding:13px;margin:9px 0;font-size:11px}.mini-card.off{opacity:.35;text-decoration:line-through}.message{height:20px;margin-top:16px;color:var(--green);font-size:12px;font-weight:700}.role:focus-visible,.check:focus-visible,.save:focus-visible{outline:3px solid var(--amber);outline-offset:3px}@media(max-width:850px){.workspace{grid-template-columns:1fr}.roles{grid-template-columns:1fr}.preview{order:-1}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main class="hall"><header class="header"><div class="seal"><span class="crest"><i></i><i></i><i></i><i></i></span><div><h1>议事厅权限册</h1><p>北岸社区协作空间 · 最后修订 2026-08-14</p></div></div><button class="save" id="save">保存权限方案</button></header><section class="roles" aria-label="角色选择"><button class="role active" data-role="管理员" data-color="#315ba6" style="--color:#315ba6"><span class="window"><i></i><i></i><i></i></span><h2>管理员</h2><p>治理空间、成员与全部内容</p></button><button class="role" data-role="编辑者" data-color="#e7a83e" style="--color:#e7a83e"><span class="window"><i></i><i></i></span><h2>编辑者</h2><p>创建、编辑并组织公开内容</p></button><button class="role" data-role="访客" data-color="#4f7d6a" style="--color:#4f7d6a"><span class="window"><i></i></span><h2>访客</h2><p>查看获邀内容并参与讨论</p></button></section><div class="workspace"><section class="matrix"><div class="matrix-head"><h2 id="matrixTitle">管理员的权限</h2><span>点击方印切换预览</span></div><div id="perms"><article class="perm"><div><h3>管理成员与角色</h3><p>邀请、移除成员，修改访问级别</p></div><button class="check on" aria-label="已允许">✓</button></article><article class="perm"><div><h3>发布与编辑内容</h3><p>创建页面、上传附件并发布</p></div><button class="check on" aria-label="已允许">✓</button></article><article class="perm"><div><h3>查看财务与用量</h3><p>账单、额度和审计导出</p></div><button class="check on" aria-label="已允许">✓</button></article><article class="perm"><div><h3>参与内部讨论</h3><p>评论、提及和订阅更新</p></div><button class="check on" aria-label="已允许">✓</button></article></div></section><aside class="preview"><h2>以此角色预览</h2><div class="persona" id="persona" style="border-color:#315ba6"><b>顾澄 · 管理员</b><span>你现在看到她进入空间后的界面</span></div><div class="screen"><div class="mini-nav"><i></i><i></i><i></i></div><div class="mini-card" data-perm="1">＋ 邀请新成员</div><div class="mini-card" data-perm="2">编辑本周公告</div><div class="mini-card" data-perm="3">查看空间账单</div><div class="mini-card" data-perm="4">参与讨论</div></div><div class="message" id="message"></div></aside></div></main><script>
const defaults={管理员:[1,1,1,1],编辑者:[0,1,0,1],访客:[0,0,0,1]};let role='管理员';function apply(a){document.querySelectorAll('.check').forEach((b,i)=>{b.classList.toggle('on',!!a[i]);b.textContent=a[i]?'✓':'';b.setAttribute('aria-label',a[i]?'已允许':'未允许')});document.querySelectorAll('.mini-card').forEach((c,i)=>c.classList.toggle('off',!a[i]))}document.querySelectorAll('.role').forEach(b=>b.onclick=()=>{document.querySelectorAll('.role').forEach(x=>x.classList.remove('active'));b.classList.add('active');role=b.dataset.role;matrixTitle.textContent=`${role}的权限`;persona.style.borderColor=b.dataset.color;persona.innerHTML=`<b>顾澄 · ${role}</b><span>你现在看到她进入空间后的界面</span>`;apply(defaults[role]);message.textContent=''});document.querySelectorAll('.check').forEach((b,i)=>b.onclick=()=>{b.classList.toggle('on');b.textContent=b.classList.contains('on')?'✓':'';document.querySelectorAll('.mini-card')[i].classList.toggle('off',!b.classList.contains('on'))});save.onclick=()=>message.textContent=`✓ ${role}权限已保存`;
</script></body></html>
