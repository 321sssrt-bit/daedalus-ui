<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>旅途存根</title><style>
:root{--sky:#b9d9ed;--ticket:#ffe887;--ink:#17334b;--muted:#61798b;--blue:#23669b;--green:#2b7a64;--red:#b9473e}*{box-sizing:border-box}body{margin:0;background:var(--sky);font-family:system-ui,"Microsoft YaHei",sans-serif;color:var(--ink)}.phone{width:min(390px,100%);min-height:760px;margin:20px auto;padding:24px;background:linear-gradient(#a8d0e9 0 38%,#e7f0ed 38%);box-shadow:0 22px 60px #315f7c44}.top{display:flex;justify-content:space-between;align-items:center}.top span{font-size:12px;letter-spacing:.14em}.check{width:66px;height:66px;border-radius:50%;background:var(--green);color:white;display:grid;place-items:center;font-size:34px;margin:44px auto 12px}h1{text-align:center;font-size:27px;margin:0}.lead{text-align:center;color:#365c75;margin:8px 0 28px}.ticket{background:var(--ticket);padding:22px;box-shadow:5px 7px 0 #17334b;position:relative}.ticket:before,.ticket:after{content:"";position:absolute;top:48%;width:20px;height:20px;border-radius:50%;background:#e7f0ed}.ticket:before{left:-10px}.ticket:after{right:-10px}.route{display:flex;justify-content:space-between;align-items:end;border-bottom:2px dashed #8e824a;padding-bottom:17px}.route b{font-size:31px}.route i{font-style:normal}.number{font:700 13px ui-monospace;margin:16px 0}.facts{display:grid;grid-template-columns:1fr 1fr;gap:14px;font-size:12px}.facts b{display:block;font-size:15px;margin-top:3px}.detail{display:none;border-top:1px solid #b5a85f;margin-top:15px;padding-top:12px;font-size:12px}.detail.show{display:block}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:24px}button{padding:13px;border:1px solid var(--blue);background:transparent;color:var(--blue);font-weight:700;cursor:pointer}button.primary{background:var(--blue);color:white}.done{margin-top:14px;text-align:center;color:var(--green);font-size:12px}@media(max-width:430px){.phone{margin:0;min-height:100vh}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style></head><body><main class="phone"><header class="top"><span>轨迹 / 凭证</span><b>2026.08.14</b></header><div class="check">✓</div><h1>行程预订成功</h1><p class="lead">你的靠窗席位已经留好</p><section class="ticket"><div class="route"><div><small>上海虹桥</small><br><b>SHA</b></div><i>━━ 2h 18m ━━▶</i><div><small>杭州东</small><br><b>HGH</b></div></div><div class="number">凭证编号　TR-0824-61A9</div><div class="facts"><div>出发时间<b>08:42</b></div><div>车次 / 席位<b>G7311 · 06A</b></div></div><div class="detail" id="receipt-detail">检票口 12B · 二等座<br>票款 ¥73.00 · 已使用青云钱包支付</div></section><div class="actions"><button onclick="toggleDetail()">展开凭证细节</button><button class="primary" onclick="finish()">完成</button></div><div class="done" id="receipt-status"></div></main><script>function toggleDetail(){const d=document.getElementById('receipt-detail');d.classList.toggle('show');event.currentTarget.textContent=d.classList.contains('show')?'收起凭证细节':'展开凭证细节'}function finish(){document.getElementById('receipt-status').textContent='凭证已存入「我的行程」'}</script></body></html>
