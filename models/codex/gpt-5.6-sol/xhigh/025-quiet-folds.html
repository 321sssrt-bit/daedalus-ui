<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>静页账户 · 账号设置</title><style>
:root{--wash:#e8e5dc;--paper:#f8f6ef;--ink:#252b2d;--muted:#747b78;--indigo:#334d5c;--clay:#c76d52;--green:#6a806a;--line:#cbc7bb}*{box-sizing:border-box}body{margin:0;background:var(--wash);color:var(--ink);font-family:"Yu Gothic UI","Microsoft YaHei",sans-serif;min-height:100vh}.shell{max-width:1050px;margin:auto;padding:48px 28px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:38px}.mark{display:flex;align-items:center;gap:12px;font-weight:700}.mark i{display:block;width:24px;height:24px;background:var(--clay);border-radius:50%}.top span{font-size:12px;color:var(--muted)}.identity{background:var(--indigo);color:var(--paper);padding:30px 34px;display:grid;grid-template-columns:72px 1fr auto;gap:22px;align-items:center;box-shadow:0 12px 30px rgba(37,43,45,.12)}.avatar{width:72px;height:72px;border-radius:50%;background:var(--paper);color:var(--indigo);display:grid;place-items:center;font-size:26px}.identity h1{font-size:25px;margin:0 0 6px}.identity p{margin:0;color:#c7d1d3;font-size:13px}.status{border:1px solid #7e929b;padding:8px 12px;font-size:11px}.groups{display:grid;grid-template-columns:170px 1fr;margin-top:36px;background:var(--paper);border:1px solid var(--line)}.side{padding:30px 22px;border-right:1px solid var(--line)}.side h2{font-size:13px;margin:0 0 22px;color:var(--indigo)}.side a{display:block;color:var(--muted);font-size:12px;margin:14px 0;text-decoration:none}.side a:first-of-type{color:var(--clay);font-weight:700}.settings{padding:12px 34px}.section{border-bottom:1px solid var(--line)}.section:last-child{border-bottom:0}.row{width:100%;display:grid;grid-template-columns:44px 1fr auto;gap:15px;align-items:center;border:0;background:transparent;color:inherit;text-align:left;padding:22px 0;cursor:pointer}.glyph{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--indigo)}.row h3{font-size:15px;margin:0 0 4px}.row p{font-size:12px;color:var(--muted);margin:0}.arrow{color:var(--clay);font-size:20px}.detail{display:none;background:#eeece3;margin:0 0 22px 44px;padding:18px 20px;font-size:12px;line-height:1.7}.section.open .detail{display:block}.toggle{float:right;width:42px;height:24px;border-radius:99px;background:var(--green);padding:3px}.toggle i{display:block;width:18px;height:18px;border-radius:50%;background:white;margin-left:18px}.row:focus-visible{outline:3px solid var(--clay);outline-offset:-3px}.foot{text-align:center;color:var(--muted);font-size:11px;margin-top:26px}@media(max-width:720px){.identity{grid-template-columns:58px 1fr}.avatar{width:58px;height:58px}.status{grid-column:2}.groups{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid var(--line);display:flex;gap:20px;overflow:auto}.side h2{display:none}.side a{white-space:nowrap}.settings{padding:10px 22px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main class="shell"><header class="top"><div class="mark"><i></i><strong>折页 FOLD</strong></div><span>设置 / 个人账户</span></header><section class="identity"><div class="avatar">闻</div><div><h1>闻溪</h1><p>wenxi@fold.studio · 个人空间</p></div><span class="status">已完成身份验证</span></section><section class="groups"><aside class="side"><h2>账户目录</h2><a href="#profile">个人资料</a><a href="#security">安全</a><a href="#notice">通知</a></aside><div class="settings"><section class="section" id="profile"><button class="row"><span class="glyph">人</span><span><h3>姓名与公开资料</h3><p>头像、显示名称、个人简介</p></span><span class="arrow">＋</span></button><div class="detail">公开显示为「闻溪」。简介：服务设计师，正在记录城市里的慢系统。<br><strong>个人主页：</strong>fold.studio/wenxi</div></section><section class="section" id="security"><button class="row"><span class="glyph">锁</span><span><h3>登录与设备</h3><p>密码、二次验证、3 台可信设备</p></span><span class="arrow">＋</span></button><div class="detail">二次验证已开启。最近登录：上海 · Windows · 今天 09:42。你可以在安全中心移除旧设备。</div></section><section class="section"><button class="row"><span class="glyph">钥</span><span><h3>恢复方式</h3><p>备用邮箱与恢复代码</p></span><span class="arrow">＋</span></button><div class="detail">备用邮箱已确认。恢复代码还有 8 枚未使用，建议离线保存。</div></section><section class="section" id="notice"><button class="row"><span class="glyph">铃</span><span><h3>每周摘要</h3><p>每周一上午收到工作回顾</p></span><span class="toggle" aria-label="已开启"><i></i></span></button><div class="detail">摘要包含上周完成、待处理提醒与空间动态。当前发送到主邮箱。</div></section></div></section><div class="foot" id="foot">所有修改会自动保存到当前设备。</div></main><script>
document.querySelectorAll('.row').forEach(r=>r.onclick=()=>{const s=r.closest('.section');if(r.querySelector('.toggle')){const t=r.querySelector('.toggle');const on=t.style.background==='rgb(116, 123, 120)';t.style.background=on?'#6a806a':'#747b78';t.querySelector('i').style.marginLeft=on?'18px':'0';foot.textContent=on?'每周摘要已开启。':'每周摘要已暂停。'}else{s.classList.toggle('open');r.querySelector('.arrow').textContent=s.classList.contains('open')?'−':'＋'}});
</script></body></html>
