<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>信号库 · 邀请进入</title><style>
:root{--bg:#e7e4db;--surface:#f4f1e9;--text:#181b1d;--muted:#61666a;--accent:#ff5c35;--success:#167954;--danger:#b5292f;--line:#202426}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:"Arial Narrow","Microsoft YaHei",system-ui,sans-serif}.top{height:46px;background:var(--text);color:white;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:12px;letter-spacing:.12em}.status{display:flex;align-items:center;gap:8px}.status:before{content:"";width:8px;height:8px;background:#62d49b;border-radius:50%}.frame{width:min(1120px,calc(100% - 40px));margin:40px auto;border:2px solid var(--line);background:var(--surface);box-shadow:12px 12px 0 #b8b5ad}.header{display:grid;grid-template-columns:1fr auto;border-bottom:2px solid var(--line)}.header h1{font-size:clamp(42px,7vw,86px);line-height:.85;letter-spacing:-.07em;text-transform:uppercase;margin:0;padding:34px}.stamp{width:170px;border-left:2px solid var(--line);display:grid;place-items:center;text-align:center;font:800 12px/1.5 monospace;color:var(--accent);transform:rotate(-2deg)}.body{display:grid;grid-template-columns:.9fr 1.1fr}.brief{padding:36px;border-right:2px solid var(--line);background:repeating-linear-gradient(0deg,transparent 0 31px,#d9d6ce 31px 32px)}.tag{display:inline-block;background:var(--accent);color:white;font:800 11px monospace;padding:6px 9px}.brief h2{font-size:30px;margin:24px 0 10px}.brief p{line-height:1.75;max-width:390px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);margin-top:40px}.meta div{background:var(--surface);padding:15px}.meta small{display:block;color:var(--muted);font-size:10px;letter-spacing:.12em;margin-bottom:5px}.verify{padding:46px}.verify h3{font:800 14px monospace;letter-spacing:.12em;margin:0 0 12px}.verify>p{color:var(--muted);line-height:1.6}.code{display:flex;gap:10px;margin:34px 0 18px}.code input{width:56px;height:70px;border:2px solid var(--line);background:#fffefb;text-align:center;font:800 30px monospace;outline:none}.code input:focus{border-color:var(--accent);box-shadow:4px 4px 0 #ff5c3544}.btn{width:100%;height:56px;border:2px solid var(--line);background:var(--text);color:white;font:800 14px monospace;letter-spacing:.1em;cursor:pointer}.btn:hover{background:var(--accent)}.feedback{min-height:52px;margin-top:18px;border-left:5px solid transparent;padding:8px 12px;color:var(--muted);line-height:1.4;font-size:13px}.feedback.bad{border-color:var(--danger);color:var(--danger);background:#b5292f12}.feedback.good{border-color:var(--success);color:var(--success);background:#16795412}.hint{font:12px monospace;color:var(--muted)}
@media(max-width:760px){.body{grid-template-columns:1fr}.brief{border-right:0;border-bottom:2px solid var(--line)}.header h1{font-size:48px}.stamp{width:110px}.verify{padding:30px 20px}.code{gap:6px}.code input{min-width:0;width:calc((100% - 30px)/6)}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><header class="top"><b>VLT—07 / ACCESS CONTROL</b><span class="status">验证节点在线</span></header><main class="frame"><section class="header"><h1>Signal<br>Vault</h1><div class="stamp">INVITATION ONLY<br>机密协作空间</div></section><section class="body"><article class="brief"><span class="tag">来自：北岸实验室</span><h2>你被邀请加入「潮汐计划」</h2><p>这里保存尚未公开的研究记录与原型。邀请码与你的身份绑定，仅可使用一次。</p><div class="meta"><div><small>邀请人</small><b>苏合 / 主理人</b></div><div><small>有效期</small><b>今晚 23:59</b></div><div><small>权限</small><b>编辑成员</b></div><div><small>空间编号</small><b>NSL-204</b></div></div></article><section class="verify"><h3>ENTER SIX-DIGIT SIGNAL</h3><p>输入邀请函中的六位信号。试用码为 <b>204826</b>，你也可以输入其他数字查看失败反馈。</p><div class="code" id="code"> <input inputmode="numeric" maxlength="1" aria-label="第1位"><input inputmode="numeric" maxlength="1" aria-label="第2位"><input inputmode="numeric" maxlength="1" aria-label="第3位"><input inputmode="numeric" maxlength="1" aria-label="第4位"><input inputmode="numeric" maxlength="1" aria-label="第5位"><input inputmode="numeric" maxlength="1" aria-label="第6位"></div><p class="hint">邀请码区分项目，不区分大小写</p><button class="btn" id="verify">核对并进入 ↗</button><div id="feedback" class="feedback" role="status">等待信号输入</div></section></section></main><script>
const inputs=[...document.querySelectorAll('.code input')];inputs.forEach((x,i)=>x.oninput=()=>{x.value=x.value.replace(/\D/g,'');if(x.value&&inputs[i+1])inputs[i+1].focus()});document.querySelector('#verify').onclick=()=>{const v=inputs.map(x=>x.value).join(''),f=document.querySelector('#feedback');f.className='feedback '+(v==='204826'?'good':'bad');f.textContent=v==='204826'?'信号匹配。权限已写入，正在打开潮汐计划。':'信号未匹配。请核对六位数字，或联系邀请人重新发送。'};
</script></body></html>
