<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>动力方碑 · ARC S1</title>
<style>
:root{--paper:#f2efe6;--ink:#11120f;--muted:#6b6c64;--blue:#2249ff;--red:#ef3e2f;--line:#c9c7bd;--white:#fffdf6}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,"Microsoft YaHei",sans-serif;min-height:100vh}button{font:inherit}.shell{min-height:100vh;display:grid;grid-template-columns:88px 1fr}.rail{border-right:1px solid var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:28px 0}.mark{font-weight:900;font-size:22px;letter-spacing:-2px}.vertical{writing-mode:vertical-rl;transform:rotate(180deg);font-size:11px;letter-spacing:4px}.step{font:700 12px ui-monospace,Consolas,monospace}.main{display:grid;grid-template-columns:minmax(380px,1.15fr) minmax(360px,.85fr)}.stage{position:relative;min-height:100vh;border-right:1px solid var(--ink);display:grid;place-items:center;overflow:hidden}.halo{position:absolute;width:58%;aspect-ratio:1;border:42px solid var(--blue);border-radius:50%;opacity:.95}.machine{position:relative;width:270px;height:470px;filter:drop-shadow(18px 24px 0 rgba(17,18,15,.14))}.machine svg{width:100%;height:100%}.tag{position:absolute;left:32px;bottom:36px;background:var(--red);color:white;padding:10px 14px;font-weight:900;font-size:12px;transform:rotate(-3deg)}.details{padding:clamp(40px,6vw,82px);display:flex;flex-direction:column;justify-content:center}.kicker{display:flex;justify-content:space-between;border-bottom:1px solid var(--ink);padding-bottom:12px;font:700 11px ui-monospace,Consolas,monospace;letter-spacing:1.8px}.details h1{font-size:clamp(54px,7vw,98px);line-height:.84;letter-spacing:-7px;margin:44px 0 20px}.desc{max-width:520px;color:var(--muted);line-height:1.7}.price{font-size:34px;font-weight:900;margin:28px 0}.price small{font-size:13px;color:var(--muted);font-weight:500}.group{margin:17px 0}.label{display:flex;justify-content:space-between;font-size:12px;font-weight:800;margin-bottom:10px}.choices{display:flex;gap:8px;flex-wrap:wrap}.choice{border:1px solid var(--ink);background:transparent;padding:11px 14px;cursor:pointer}.choice[aria-pressed="true"]{background:var(--ink);color:var(--white)}.swatch{width:42px;height:42px;border:2px solid transparent;border-radius:50%;cursor:pointer}.swatch[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:3px}.buy{margin-top:26px;border:0;background:var(--blue);color:white;padding:20px 24px;text-transform:uppercase;font-weight:900;letter-spacing:1px;cursor:pointer;box-shadow:8px 8px 0 var(--ink);transition:.18s transform,.18s box-shadow}.buy:hover{transform:translate(3px,3px);box-shadow:5px 5px 0 var(--ink)}.buy:focus-visible,.choice:focus-visible,.swatch:focus-visible{outline:3px solid var(--red);outline-offset:3px}.note{min-height:22px;margin-top:18px;font-weight:700;color:var(--blue)}
@media(max-width:850px){.shell{grid-template-columns:52px 1fr}.main{grid-template-columns:1fr}.stage{min-height:440px;border-right:0;border-bottom:1px solid var(--ink)}.machine{height:350px}.details{padding:42px}.details h1{font-size:58px}.vertical{display:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
</style></head>
<body><div class="shell"><aside class="rail"><div class="mark">A—1</div><div class="vertical">OBJECTS FOR EVERY MORNING</div><div class="step">018/050</div></aside><main class="main"><section class="stage" aria-label="商品主视觉"><div class="halo"></div><div class="machine"><svg viewBox="0 0 270 470" role="img" aria-label="ARC S1 磨豆机"><rect x="48" y="152" width="176" height="250" rx="16" fill="#11120f"/><path d="M74 156 95 62h80l22 94" fill="#fffdf6" stroke="#11120f" stroke-width="10"/><rect x="89" y="33" width="92" height="42" rx="20" fill="#ef3e2f"/><circle cx="136" cy="238" r="53" fill="#f2efe6"/><circle cx="136" cy="238" r="35" fill="#2249ff"/><circle cx="136" cy="238" r="7" fill="#fffdf6"/><rect x="83" y="329" width="106" height="48" rx="5" fill="#fffdf6"/><path d="M103 353h66" stroke="#11120f" stroke-width="8"/><path d="M72 404v27M200 404v27" stroke="#11120f" stroke-width="12"/></svg></div><div class="tag">2026 / EDITION 01</div></section><section class="details"><div class="kicker"><span>ARC OBJECTS</span><span>精密研磨器</span></div><h1>ARC<br>S1</h1><p class="desc">把清晨压缩成一枚准确的刻度。64 mm 平刀、零残粉风道与磁吸接粉杯，适合手冲和意式之间频繁切换。</p><div class="price">¥ 2,680 <small>含两年保修</small></div><div class="group"><div class="label"><span>刀盘规格</span><span id="specValue">64 mm / 标准</span></div><div class="choices" id="specs"><button class="choice" aria-pressed="true" data-value="64 mm / 标准">64 mm</button><button class="choice" aria-pressed="false" data-value="78 mm / 高速">78 mm</button><button class="choice" aria-pressed="false" data-value="64 mm / 低速静音">静音版</button></div></div><div class="group"><div class="label"><span>机身颜色</span><span id="colorValue">曜石黑</span></div><div class="choices" id="colors"><button class="swatch" style="background:#11120f" aria-label="曜石黑" aria-pressed="true"></button><button class="swatch" style="background:#ef3e2f" aria-label="信号红" aria-pressed="false"></button><button class="swatch" style="background:#d7d3c4" aria-label="岩灰" aria-pressed="false"></button></div></div><button class="buy" id="buy">立即购买 · 预计周五送达</button><div class="note" id="note" aria-live="polite"></div></section></main></div>
<script>
document.querySelectorAll('#specs .choice').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('#specs .choice').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');document.getElementById('specValue').textContent=b.dataset.value}));
document.querySelectorAll('#colors .swatch').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('#colors .swatch').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');document.getElementById('colorValue').textContent=b.getAttribute('aria-label')}));
document.getElementById('buy').addEventListener('click',()=>{document.getElementById('note').textContent='已锁定本次配置，正在进入订单确认…'});
</script></body></html>
