<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>混合工作室 · 成员目录</title><style>
:root{--bg:#ebff52;--surface:#f7f5ef;--text:#171717;--muted:#66645f;--accent:#5d45d8;--success:#26754f;--danger:#c43d3d;--orange:#ff7451;--cyan:#78d5dc;--pink:#ed9ac2}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--surface);color:var(--text);font-family:Arial,"Microsoft YaHei",sans-serif}.head{background:var(--bg);border-bottom:3px solid var(--text);padding:28px 36px;display:grid;grid-template-columns:1fr auto;align-items:end}.head h1{font-size:clamp(46px,7vw,92px);line-height:.82;letter-spacing:-.08em;margin:0}.head .meta{text-align:right;font:800 12px/1.5 monospace}.tools{padding:22px 36px;border-bottom:1px solid #c9c6bd;display:flex;justify-content:space-between;gap:20px;align-items:center}.filters{display:flex;gap:8px;flex-wrap:wrap}.filters button{height:36px;border:2px solid var(--text);background:white;padding:0 15px;border-radius:18px;font-weight:800;cursor:pointer}.filters button.active{background:var(--text);color:white}.search{height:40px;border:0;border-bottom:2px solid var(--text);background:transparent;min-width:240px;font-size:14px;outline:none}.roster{padding:30px 36px;display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.person{border:2px solid var(--text);background:white;min-height:285px;cursor:pointer;position:relative;overflow:hidden;transition:.16s}.person:hover{transform:translateY(-5px);box-shadow:7px 7px 0 var(--text)}.portrait{height:168px;display:grid;place-items:center;position:relative;overflow:hidden}.portrait:before{content:"";width:96px;height:96px;border-radius:48% 52% 46% 54%;background:#151515;position:absolute;top:34px}.portrait:after{content:"";width:48px;height:64px;border-radius:50% 50% 42% 42%;background:#e7b88f;position:absolute;top:53px}.p1{background:var(--cyan)}.p2{background:var(--orange)}.p3{background:var(--pink)}.p4{background:#a6d3a5}.p5{background:#d2bbeb}.p6{background:#ffc968}.p7{background:#92baf0}.p8{background:#efb6a0}.info{padding:16px}.info h2{font-size:19px;margin:0 0 5px}.info p{font-size:12px;color:var(--muted);margin:0}.skills{margin-top:14px;display:flex;gap:5px;flex-wrap:wrap}.skills span{background:#efede7;padding:4px 6px;font-size:9px;font-weight:800}.status{position:absolute;right:10px;top:10px;background:white;border:2px solid var(--text);padding:4px 7px;font-size:9px;font-weight:900}.modal{position:fixed;inset:0;background:#171717bb;display:none;place-items:center;padding:20px;z-index:3}.modal.show{display:grid}.profile{width:min(700px,100%);background:var(--bg);border:3px solid var(--text);box-shadow:12px 12px 0 var(--accent);display:grid;grid-template-columns:220px 1fr}.bigface{background:var(--accent);color:white;display:grid;place-items:center;font-size:72px;font-weight:900}.bio{padding:34px}.bio button{float:right;width:36px;height:36px;border:2px solid var(--text);background:white;font-size:20px;cursor:pointer}.bio small{font-weight:900}.bio h2{font-size:40px;margin:12px 0}.bio p{line-height:1.65;color:#4e4a42}.contact{height:46px;border:2px solid var(--text);background:var(--text);color:white;font-weight:900;padding:0 18px;cursor:pointer}.result{color:var(--success);font-weight:800;font-size:12px;margin-top:14px;min-height:18px}
@media(max-width:980px){.roster{grid-template-columns:repeat(3,1fr)}}@media(max-width:720px){.roster{grid-template-columns:1fr 1fr;padding:18px}.tools{display:grid;padding:18px}.search{width:100%}.profile{grid-template-columns:1fr}.bigface{height:150px}.head{padding:24px}.person{min-height:250px}.portrait{height:140px}}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body><header class="head"><h1>谁在<br>工作室？</h1><div class="meta">MIXED STUDIO<br>24 MEMBERS / 6 CITIES</div></header><section class="tools"><nav class="filters"><button class="active" data-team="all">全部</button><button data-team="design">设计</button><button data-team="content">内容</button><button data-team="tech">技术</button></nav><input class="search" id="search" placeholder="输入名字或专长" aria-label="搜索成员"></section><main class="roster" id="roster"><article class="person" data-team="design" data-name="林夏" data-role="视觉设计 / 上海" data-bio="把复杂界面整理成能一眼读懂的视觉秩序。最近在研究城市招牌与公共字体。"><div class="portrait p1"></div><span class="status">在线</span><div class="info"><h2>林夏</h2><p>视觉设计 · 上海</p><div class="skills"><span>品牌</span><span>系统</span></div></div></article><article class="person" data-team="content" data-name="许照" data-role="内容编辑 / 杭州" data-bio="负责专题策划、长文编辑与语气校对，习惯先问清楚读者真正需要什么。"><div class="portrait p2"></div><span class="status">专注中</span><div class="info"><h2>许照</h2><p>内容编辑 · 杭州</p><div class="skills"><span>策划</span><span>写作</span></div></div></article><article class="person" data-team="tech" data-name="杜衡" data-role="前端工程 / 深圳" data-bio="专注交互实现、可访问性与性能，让每一个细节在真实设备上成立。"><div class="portrait p3"></div><span class="status">在线</span><div class="info"><h2>杜衡</h2><p>前端工程 · 深圳</p><div class="skills"><span>交互</span><span>性能</span></div></div></article><article class="person" data-team="design" data-name="莫青" data-role="影像设计 / 北京" data-bio="从静帧到动态叙事，负责影像语言、素材选择和最终的视觉节奏。"><div class="portrait p4"></div><span class="status">外出</span><div class="info"><h2>莫青</h2><p>影像设计 · 北京</p><div class="skills"><span>摄影</span><span>动态</span></div></div></article><article class="person" data-team="content" data-name="周屿" data-role="产品研究 / 成都" data-bio="通过访谈和行为数据找出真正的问题，让讨论从感觉走向证据。"><div class="portrait p5"></div><span class="status">在线</span><div class="info"><h2>周屿</h2><p>产品研究 · 成都</p><div class="skills"><span>访谈</span><span>洞察</span></div></div></article><article class="person" data-team="tech" data-name="秦遥" data-role="数据工程 / 武汉" data-bio="搭建可靠的数据管道与指标口径，喜欢把看不见的系统画成清楚的图。"><div class="portrait p6"></div><span class="status">离线</span><div class="info"><h2>秦遥</h2><p>数据工程 · 武汉</p><div class="skills"><span>数据</span><span>架构</span></div></div></article><article class="person" data-team="design" data-name="宁禾" data-role="产品设计 / 上海" data-bio="从流程和状态出发设计工具，关心界面在异常情况下是否仍然诚实。"><div class="portrait p7"></div><span class="status">会议中</span><div class="info"><h2>宁禾</h2><p>产品设计 · 上海</p><div class="skills"><span>原型</span><span>流程</span></div></div></article><article class="person" data-team="content" data-name="苏合" data-role="社群运营 / 广州" data-bio="组织公开活动和成员共创，让不同背景的人都能找到参与的入口。"><div class="portrait p8"></div><span class="status">在线</span><div class="info"><h2>苏合</h2><p>社群运营 · 广州</p><div class="skills"><span>社群</span><span>活动</span></div></div></article></main><div class="modal" id="modal"><section class="profile"><div class="bigface" id="initial">林</div><article class="bio"><button id="close" aria-label="关闭">×</button><small id="role">视觉设计 / 上海</small><h2 id="name">林夏</h2><p id="bio">把复杂界面整理成能一眼读懂的视觉秩序。</p><button class="contact" id="contact">发起联系</button><div class="result" id="result" role="status"></div></article></section></div><script>
const people=[...document.querySelectorAll('.person')],nameEl=document.querySelector('#name'),initialEl=document.querySelector('#initial'),roleEl=document.querySelector('#role'),bioEl=document.querySelector('#bio'),resultEl=document.querySelector('#result'),modalEl=document.querySelector('#modal');document.querySelectorAll('[data-team]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-team]').forEach(x=>x.classList.remove('active'));b.classList.add('active');people.forEach(p=>p.hidden=b.dataset.team!=='all'&&p.dataset.team!==b.dataset.team)});search.oninput=()=>{const q=search.value.trim();people.forEach(p=>p.hidden=q&&!p.textContent.includes(q))};people.forEach(p=>p.onclick=()=>{nameEl.textContent=p.dataset.name;initialEl.textContent=p.dataset.name[0];roleEl.textContent=p.dataset.role;bioEl.textContent=p.dataset.bio;resultEl.textContent='';modalEl.classList.add('show')});close.onclick=()=>modalEl.classList.remove('show');contact.onclick=()=>resultEl.textContent=`已向${nameEl.textContent}发出会话邀请。`;modalEl.onclick=e=>{if(e.target===modalEl)modalEl.classList.remove('show')};
</script></body></html>
