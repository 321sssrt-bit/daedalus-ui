<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Daedalus — Open Product UI Design Evaluation for AI Models</title>
  <desc id="desc">An ivory editorial masthead for an open product UI design evaluation for AI models.</desc>
  <defs>
    <pattern id="paper" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r=".45" fill="#1e1b18" opacity=".06"/>
    </pattern>
  </defs>
  <rect width="1200" height="420" rx="28" fill="#eee9de"/>
  <rect width="1200" height="420" rx="28" fill="url(#paper)"/>
  <rect x="36" y="34" width="1128" height="352" rx="3" fill="none" stroke="#211f1c" stroke-width="2"/>
  <path d="M680 34V230M36 230H1164" stroke="#211f1c"/>
  <rect x="36" y="34" width="12" height="196" fill="#dc3b2d"/>

  <g font-family="Arial, 'Microsoft YaHei', sans-serif">
    <text x="72" y="72" fill="#dc3b2d" font-family="Consolas, monospace" font-size="15" font-weight="700" letter-spacing=".5">OPEN PRODUCT UI DESIGN EVALUATION FOR AI MODELS</text>
    <text x="72" y="102" fill="#57524c" font-size="18">面向 AI 模型的公开产品 UI 设计评测</text>
    <text x="68" y="178" fill="#1c1b19" font-family="Georgia, 'Times New Roman', serif" font-size="78" font-weight="700" letter-spacing="-3">DAEDALUS</text>
    <g transform="translate(718 78)">
      <text x="0" y="50" fill="#1c1b19" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-style="italic">Same rules. Different taste.</text>
      <text x="0" y="94" fill="#45413b" font-size="20">规则相同，品味各异。</text>
    </g>

    <g transform="translate(145 280)">
      <text x="0" y="47" fill="#1c1b19" font-size="48" font-weight="800">40</text>
      <text x="82" y="43" fill="#45413b" font-size="19" font-weight="700">独立页面</text>
    </g>
    <g transform="translate(502 280)">
      <text x="0" y="47" fill="#dc3b2d" font-size="48" font-weight="800">10</text>
      <text x="82" y="43" fill="#45413b" font-size="19" font-weight="700">连续产品原型</text>
    </g>
    <g transform="translate(897 280)">
      <text x="0" y="47" fill="#1c1b19" font-size="48" font-weight="800">50</text>
      <text x="82" y="43" fill="#45413b" font-size="19" font-weight="700">复现规范</text>
    </g>
  </g>
</svg>
