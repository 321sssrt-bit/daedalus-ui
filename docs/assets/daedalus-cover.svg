<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Daedalus — Product UI Model Gallery</title>
  <desc id="desc">A warm black and ivory cover with a fifty-cell maze representing forty interface studies and ten interactive products.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f0e5"/>
      <stop offset="1" stop-color="#e9dfcc"/>
    </linearGradient>
    <pattern id="grain" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="3" r="0.65" fill="#1d1a16" opacity="0.08"/>
      <circle cx="7" cy="8" r="0.5" fill="#1d1a16" opacity="0.06"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="28" fill="#171512"/>
  <path d="M0 332C207 282 337 385 565 323C795 260 950 265 1200 311V420H0Z" fill="#9f2f32" opacity="0.92"/>
  <path d="M0 365C250 323 394 401 620 350C847 298 1000 316 1200 354V420H0Z" fill="#ce8c3a" opacity="0.78"/>

  <g transform="translate(70 62)">
    <text x="0" y="36" fill="#ce8c3a" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17" letter-spacing="5">PRODUCT UI MODEL GALLERY</text>
    <text x="0" y="112" fill="#f5f0e5" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="700" letter-spacing="2">DAEDALUS</text>
    <text x="2" y="158" fill="#c9c0b0" font-family="Arial, sans-serif" font-size="22">相同的职责，各自发明产品。</text>

    <g transform="translate(0 196)" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15">
      <rect width="150" height="42" rx="21" fill="#f5f0e5"/>
      <text x="75" y="27" fill="#171512" text-anchor="middle">40 SCREENS</text>
      <rect x="162" width="164" height="42" rx="21" fill="#ce8c3a"/>
      <text x="244" y="27" fill="#171512" text-anchor="middle">10 PRODUCTS</text>
      <rect x="338" width="172" height="42" rx="21" fill="none" stroke="#6f685e"/>
      <text x="424" y="27" fill="#d9d0c1" text-anchor="middle">50 SPECS</text>
    </g>
  </g>

  <g transform="translate(790 48)" filter="url(#shadow)">
    <rect width="332" height="296" rx="22" fill="url(#paper)"/>
    <rect width="332" height="296" rx="22" fill="url(#grain)"/>
    <g transform="translate(26 26)" stroke="#29251f" stroke-width="2">
      <path d="M0 0H280V244H0ZM28 0V54H84V28H140V82H112V110H168V54H224V28H280M0 54H28V110H84V138H28V190H84V244M84 54V82M84 138H140V166H196V110H252V166H224V216H280M140 0V28M168 82V110M140 166V216H196V244M0 166H28M84 190H112" fill="none"/>
      <g fill="#9f2f32" stroke="none">
        <rect x="224" y="0" width="56" height="28"/>
        <rect x="252" y="28" width="28" height="54"/>
        <rect x="224" y="82" width="56" height="28"/>
        <rect x="252" y="110" width="28" height="56"/>
        <rect x="224" y="166" width="28" height="50"/>
        <rect x="196" y="216" width="84" height="28"/>
      </g>
      <circle cx="14" cy="14" r="6" fill="#ce8c3a" stroke="none"/>
      <circle cx="266" cy="230" r="6" fill="#171512" stroke="none"/>
    </g>
  </g>

  <text x="70" y="386" fill="#211e19" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" letter-spacing="2">HARNESS / MODEL / REASONING EFFORT</text>
</svg>
